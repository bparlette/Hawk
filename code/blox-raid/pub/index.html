<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Blox Fruits: Dough Raid — Turtles Edition (fan game)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{background:#070913;color:#fff;font-family:'Arial Black','Segoe UI',Impact,system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
#viewport{position:relative;width:100vw;height:100vh;overflow:hidden;background:#101828}
#viewport.shorts-mode{width:min(100vw,calc(100vh * 9 / 16));border-left:3px solid #f59e0b;border-right:3px solid #f59e0b;box-shadow:0 0 90px rgba(245,158,11,.35)}
canvas#webgl{display:block;width:100%;height:100%}
canvas#webgl.inv{filter:invert(1) grayscale(1) contrast(4)}
#fx2d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
#impact-flash{position:absolute;inset:0;pointer-events:none;z-index:12;background:#fff;opacity:0}
#hurt-vig{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(220,20,40,.75) 100%);transition:opacity .25s}
/* boss bar */
#boss-hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(560px,88%);z-index:10;text-align:center;pointer-events:none}
.boss-title{font-size:15px;font-weight:900;letter-spacing:2px;color:#ff4757;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;margin-bottom:4px;white-space:nowrap}
.boss-title.p2{color:#ff2fd0;animation:glow .6s infinite alternate}
@keyframes glow{to{text-shadow:0 0 12px #ff2fd0,2px 2px 0 #000}}
.boss-bar-bg{position:relative;width:100%;height:20px;background:#1e272e;border:3px solid #000;border-radius:10px;overflow:hidden;box-shadow:0 4px 0 #000}
#boss-chip{position:absolute;left:0;top:0;height:100%;width:100%;background:#fff;transition:width .6s ease-in .25s}
#boss-bar-fill{position:absolute;left:0;top:0;height:100%;width:100%;background:linear-gradient(90deg,#ff4757,#ffa502)}
#boss-bar-fill.p2{background:linear-gradient(90deg,#7c3aed,#ff2fd0)}
.phase-tick{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#000}
/* top actions */
#top-actions{position:absolute;top:66px;right:12px;z-index:20;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.action-btn{cursor:pointer;padding:8px 12px;font-weight:900;font-size:11px;letter-spacing:1px;color:#fff;background:#1e293b;border:2px solid #000;border-radius:6px;box-shadow:0 3px 0 #000;font-family:inherit}
.action-btn:hover{background:#f59e0b;color:#000}
.action-btn.active-viral{background:#ef4444;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
/* combo */
#combo-hud{position:absolute;top:30%;left:16px;z-index:10;pointer-events:none}
#combo-num{font-size:54px;font-weight:900;font-style:italic;color:#feca57;text-shadow:4px 4px 0 #000,-2px -2px 0 #000;line-height:.9;display:none;transform-origin:left center}
#combo-num.bump{animation:bump .18s ease-out}
@keyframes bump{0%{transform:scale(1.45) rotate(-6deg)}100%{transform:scale(1)}}
#bounty-tag{margin-top:8px;font-size:13px;font-weight:800;background:rgba(0,0,0,.75);border:2px solid #feca57;padding:5px 10px;border-radius:6px;color:#feca57;display:inline-block;box-shadow:0 3px 0 #000}
#timer-tag{margin-top:6px;font-size:12px;font-weight:800;color:#e2e8f0;text-shadow:1px 1px 0 #000}
/* caption + banner */
#viral-caption{position:absolute;top:13%;left:50%;transform:translateX(-50%);z-index:15;width:94%;text-align:center;pointer-events:none;display:none}
#viral-caption span{display:inline-block;background:#000;color:#facc15;font-weight:900;font-size:20px;padding:6px 14px;border:3px solid #fff;border-radius:8px;text-transform:uppercase;box-shadow:0 6px 0 rgba(0,0,0,.8)}
#banner{position:absolute;top:40%;left:0;right:0;text-align:center;z-index:16;pointer-events:none;font-size:46px;font-weight:900;font-style:italic;color:#fff;text-shadow:4px 4px 0 #000,-2px -2px 0 #000,0 0 30px #f59e0b;opacity:0;transform:scale(2)}
#banner.show{animation:ban 1.6s ease-out forwards}
#banner.p2{color:#ff9ef0;text-shadow:4px 4px 0 #000,0 0 40px #ff2fd0}
@keyframes ban{0%{opacity:0;transform:scale(2.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(.9)}}
#toast{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);z-index:16;font-size:14px;font-weight:900;color:#38bdf8;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
/* bottom hud */
#bottom-hud{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:9px;width:min(540px,94%)}
.stat-bars{width:100%;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.bar-row{width:100%;height:18px;background:#0f172a;border:2.5px solid #000;border-radius:6px;position:relative;overflow:hidden}
.bar-fill{height:100%;transition:width .15s}
#hp-fill{background:linear-gradient(90deg,#22c55e,#4ade80);width:100%}
#hp-fill.low{background:linear-gradient(90deg,#dc2626,#f87171)}
#en-fill{background:linear-gradient(90deg,#0ea5e9,#38bdf8);width:100%}
.bar-txt{position:absolute;inset:0;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #000}
.hotbar{display:flex;gap:8px}
.skill-slot{width:72px;height:72px;background:linear-gradient(180deg,#334155,#0f172a);border:3px solid #000;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #000;cursor:pointer;overflow:hidden}
.skill-slot.ready:hover{border-color:#facc15}
.skill-slot.noen{filter:grayscale(.9) brightness(.7)}
.skill-slot.fire{animation:fire .25s}
@keyframes fire{0%{transform:translateY(4px) scale(.92);border-color:#facc15}100%{transform:none}}
.skill-key{position:absolute;top:3px;left:5px;font-size:11px;font-weight:900;color:#facc15;text-shadow:1px 1px 0 #000}
.skill-cost{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:900;color:#7dd3fc;text-shadow:1px 1px 0 #000;z-index:2}
.skill-ico{font-size:20px;line-height:1;margin-top:6px}
.skill-name{font-size:8.5px;font-weight:800;text-align:center;padding:0 3px;margin-top:3px;color:#fff;text-shadow:1px 1px 0 #000;line-height:1.05}
.cd-overlay{position:absolute;bottom:0;left:0;width:100%;height:0%;background:rgba(0,0,0,.75)}
#viewport.narrow .skill-slot{width:58px;height:62px}
#viewport.narrow .skill-name{display:none}
#viewport.narrow .skill-ico{margin-top:10px}
#viewport.narrow #viral-caption{top:178px}
#viewport.narrow .action-btn{padding:6px 8px;font-size:9px}
#viewport.narrow #combo-hud{top:36%}
#viewport.narrow .skill-ico{font-size:16px}
#viewport.narrow #combo-num{font-size:38px}
#viewport.narrow #banner{font-size:30px}
#viewport.narrow .boss-title{font-size:11px}
#viewport.narrow #viral-caption span{font-size:15px}
#viewport.tiny .hotbar{gap:4px}
#viewport.tiny .skill-slot{width:48px;height:50px;border-width:2px;border-radius:8px}
#viewport.tiny .skill-cost{display:none}
#viewport.tiny .skill-key{font-size:9px}
#viewport.tiny .boss-title{font-size:9px;letter-spacing:1px}
#viewport.tiny .action-btn{padding:4px 6px;font-size:8px}
#viewport.tiny #top-actions{top:52px;right:6px;gap:4px}
#viewport.tiny #viral-caption{top:150px}
#viewport.tiny #viral-caption span{font-size:12px;padding:4px 8px}
#viewport.tiny #combo-num{font-size:30px}
#viewport.tiny #bounty-tag{font-size:10px;padding:3px 6px}
#viewport.tiny .bar-row{height:15px}
#viewport.tiny .bar-txt{font-size:9px}
/* dmg pops */
#dmg-layer{position:absolute;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.dmg-pop{position:absolute;font-weight:900;font-style:italic;font-size:26px;color:#ffeb3b;text-shadow:2px 2px 0 #000,-2px -2px 0 #d63031;transform:translate(-50%,-50%);animation:floatUp .75s ease-out forwards;white-space:nowrap}
.dmg-pop.big{font-size:44px;color:#fff;text-shadow:3px 3px 0 #000,-3px -3px 0 #ff2fd0}
.dmg-pop.ouch{color:#ff6b6b;font-size:24px;text-shadow:2px 2px 0 #000}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}30%{transform:translate(-50%,-90%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-150%) scale(.9)}}
/* end screen */
#screen{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,10,30,.55),rgba(0,0,0,.85))}
#screen.on{display:flex}
.card{text-align:center;padding:22px 26px;border:4px solid #000;border-radius:16px;background:linear-gradient(180deg,#fde68a,#f59e0b);color:#111;box-shadow:0 10px 0 #000,0 0 60px rgba(245,158,11,.5);width:min(420px,90%);animation:pop .35s ease-out}
.card.ko{background:linear-gradient(180deg,#475569,#1e293b);color:#fff;box-shadow:0 10px 0 #000,0 0 60px rgba(239,68,68,.5)}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.card h1{font-size:40px;font-style:italic;line-height:1;text-shadow:3px 3px 0 #fff}
.card.ko h1{color:#ef4444;text-shadow:3px 3px 0 #000;font-size:64px}
.card .sub{font-size:13px;margin:6px 0 12px;font-weight:900;letter-spacing:1px}
.rank{font-size:84px;line-height:1;font-style:italic;color:#fff;-webkit-text-stroke:4px #000;text-shadow:5px 5px 0 #000;margin:6px 0}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 14px;text-align:left;font-size:14px;font-weight:900;margin:8px auto 14px;max-width:300px}
.stats b{text-align:right}
.card button{font-family:inherit;cursor:pointer;font-size:15px;font-weight:900;padding:10px 18px;margin:4px;border:3px solid #000;border-radius:10px;background:#111;color:#facc15;box-shadow:0 4px 0 #000}
.hint{font-size:10px;margin-top:8px;opacity:.75}
/* help */
#help{position:absolute;left:12px;bottom:16px;z-index:10;font-size:10px;line-height:1.5;color:#e2e8f0;text-shadow:1px 1px 0 #000;pointer-events:none;opacity:.85}
#viewport.narrow #help,body.touch #help{display:none}
/* touch */
#touch{display:none;position:absolute;inset:auto 0 0 0;height:210px;z-index:25;pointer-events:none}
body.touch #touch{display:block}
body.touch .hotbar{display:none}
body.touch #bottom-hud{bottom:auto;top:60px;width:min(360px,70%);left:12px;transform:none}
body.touch #top-actions{top:auto;bottom:220px}
body.touch #combo-hud{top:22%}
#stick{position:absolute;left:18px;bottom:22px;width:140px;height:140px;border-radius:50%;background:rgba(15,23,42,.45);border:3px solid rgba(255,255,255,.35);pointer-events:auto}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b);border:3px solid #000}
.tbtn{position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid #000;background:radial-gradient(circle at 35% 30%,#475569,#0f172a);color:#facc15;font-size:18px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 4px 0 #000;line-height:1}
.tbtn small{font-size:7px;color:#fff;margin-top:2px}
.tbtn.down{transform:translateY(3px) scale(.94);background:#f59e0b;color:#000}
.tbtn.noen{filter:grayscale(.9) brightness(.65)}
html.demo-embed #touch{display:none!important}
html.demo-embed body.touch .hotbar{display:flex}
html.demo-embed body.touch #bottom-hud{top:auto;bottom:16px;left:50%;transform:translateX(-50%);width:min(540px,94%)}
html.demo-embed body.touch #top-actions{top:66px;bottom:auto}
html.demo-embed body.touch #combo-hud{top:30%}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="webgl"></canvas>
  <canvas id="fx2d"></canvas>
  <div id="hurt-vig"></div>

  <div id="dmg-layer"></div>

  <div id="boss-hud">
    <div class="boss-title" id="boss-title">☠️ RIP_INDRA [LV. 2550 RAID BOSS] ☠️</div>
    <div class="boss-bar-bg"><div id="boss-chip"></div><div id="boss-bar-fill"></div><div class="phase-tick"></div></div>
  </div>

  <div id="viral-caption"><span id="viral-txt">POV: 30M BOUNTY DOUGH V2 COMBO 🔥🍩</span></div>

  <div id="combo-hud">
    <div id="combo-num">12 HIT!</div>

    <div class="stat-bars">
      <div class="bar-row"><div id="hp-fill" class="bar-fill"></div><div class="bar-txt">HEALTH <span id="hp-txt" style="margin-left:6px">12,845 / 12,845</span></div></div>
      <div class="bar-row"><div id="en-fill" class="bar-fill"></div><div class="bar-txt">ENERGY <span id="en-txt" style="margin-left:6px">12,845 / 12,845</span></div></div>
    </div>
    <div class="hotbar" id="hotbar"></div>
  </div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
  </div>

  <div id="screen"><div class="card" id="card"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="three.r128.min.js"><\/script>');</script>
<script>
'use strict';
// Blox Fruits: Dough Raid — Turtles Edition. Unofficial fan game; all art is procedural.
// =====================================================================================
// 0. CONFIG
// =====================================================================================
const SKILLS = {
  KeyZ:  { key:'Z',   name:'MISSILE JAB',          ico:'👊', cost:1200, cd:1.8, lock:0.5 },
  KeyX:  { key:'X',   name:'PASTRY RIVER',         ico:'🌋', cost:2000, cd:2.4, lock:0.75 },
  KeyC:  { key:'C',   name:'PIERCING CLOTHESLINE', ico:'🌀', cost:2600, cd:3.0, lock:0.72 },
  KeyV:  { key:'V',   name:'DOUGH FIST FUSILLADE', ico:'🔥', cost:4200, cd:4.2, lock:1.35 },
  Space: { key:'SPC', name:'SORU DASH',            ico:'💨', cost:600,  cd:0.9, lock:0.22 },
};
const SKILL_ORDER = ['KeyZ','KeyX','KeyC','KeyV','Space'];
const P_MAXHP = 12845, P_MAXEN = 12845, EN_REGEN = 1150;
const B_MAXHP = 180000, VIRAL_B_MAXHP = 80000;
const ARENA_R = 19.2;

// =====================================================================================
// 1. TOON MATERIALS + NORMAL-EXTRUDED INK OUTLINES
// =====================================================================================
function makeRamp(stops){
  const c=document.createElement('canvas'); c.width=stops.length; c.height=1;
  const x=c.getContext('2d'); stops.forEach((s,i)=>{x.fillStyle=s;x.fillRect(i,0,1,1);});
  const t=new THREE.CanvasTexture(c); t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; return t;
}
const toonRamp = makeRamp(['#2e3150','#6f76a3','#c9cdea','#f4f4ff']);
const outlineMats = {};
function outlineMat(th, col=0x0b0c14){
  const k=th+'_'+col; if(outlineMats[k]) return outlineMats[k];
  return outlineMats[k]=new THREE.ShaderMaterial({
    uniforms:{ th:{value:th}, col:{value:new THREE.Color(col)} },
    vertexShader:'uniform float th; void main(){ vec3 p=position+normal*th; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0); }',
    fragmentShader:'uniform vec3 col; void main(){ gl_FragColor=vec4(col,1.0); }',
    side:THREE.BackSide });
}
function toon(color, emissive=0, ei=0.55){
  return new THREE.MeshToonMaterial({ color, gradientMap:toonRamp, emissive, emissiveIntensity: emissive?ei:0 });
}
// returns a group holding body + outline
function P(geo, color, th=0.04, emissive=0, shadow=true){
  const g=new THREE.Group();
  const m=new THREE.Mesh(geo, color.isMaterial?color:toon(color,emissive));
  m.castShadow=shadow; m.receiveShadow=true; g.add(m); g.userData.body=m;
  if(th>0){ const o=new THREE.Mesh(geo,outlineMat(th)); g.add(o); g.userData.outline=o; }
  return g;
}

// =====================================================================================
// 2. AUDIO — synth SFX + light music loop
// =====================================================================================
class Synth{
  constructor(){ this.ctx=null; this.muted=false; this.step=0; this.next=0; this.intense=0; }
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:0.8; this.master.connect(this.ctx.destination);
    this.comp=this.ctx.createDynamicsCompressor(); this.comp.connect(this.master);
    this.sfx=this.ctx.createGain(); this.sfx.gain.value=0.65; this.sfx.connect(this.comp);
    this.mus=this.ctx.createGain(); this.mus.gain.value=0.2; this.mus.connect(this.comp);
    const len=this.ctx.sampleRate*1.0; this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=this.noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.next=this.ctx.currentTime+0.1;
    setInterval(()=>this.schedule(),30);
  }
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value=m?0:0.8; }
  env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
  osc(type,f0,f1,dur,vol,dest,t){ if(!this.ctx) return; t=t||this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
    if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); this.env(g,t,0.005,vol,dur); o.connect(g); g.connect(dest||this.sfx); o.start(t); o.stop(t+dur+0.05); }
  noise(dur,vol,ftype,f0,f1,dest,t,q=1){ if(!this.ctx) return; t=t||this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; const f=this.ctx.createBiquadFilter(); f.type=ftype; f.Q.value=q;
    f.frequency.setValueAtTime(f0,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=this.ctx.createGain(); this.env(g,t,0.004,vol,dur); s.connect(f); f.connect(g); g.connect(dest||this.sfx); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05); }
  punch(heavy=0){ this.osc('sine',160+heavy*20,38,0.18+heavy*0.15,0.9); this.noise(0.08+heavy*0.08,0.6,'lowpass',2400,300); this.osc('square',90,40,0.06,0.25); }
  zap(){ this.osc('square',720,110,0.13,0.18); this.noise(0.1,0.25,'highpass',3000,9000); }
  whoosh(){ this.noise(0.28,0.5,'bandpass',300,2600,null,null,2.5); }
  boom(){ this.osc('sine',90,24,0.7,1.0); this.noise(0.6,0.7,'lowpass',1200,80); this.osc('sawtooth',60,30,0.4,0.25); }
  spike(){ this.osc('triangle',220,620,0.08,0.3); this.noise(0.07,0.35,'bandpass',900,2200,null,null,3); }
  roar(){ if(!this.ctx) return; const t=this.ctx.currentTime; const o=this.ctx.createOscillator(), l=this.ctx.createOscillator(), lg=this.ctx.createGain(), g=this.ctx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(110,t); o.frequency.linearRampToValueAtTime(70,t+1.1); l.frequency.value=22; lg.gain.value=18; l.connect(lg); lg.connect(o.frequency);
    this.env(g,t,0.08,0.45,1.1); o.connect(g); g.connect(this.sfx); o.start(t); l.start(t); o.stop(t+1.3); l.stop(t+1.3); this.noise(1.0,0.3,'bandpass',400,180,null,null,1.5); }
  warn(){ this.osc('square',880,880,0.07,0.12); this.osc('square',660,660,0.07,0.12,null,(this.ctx?this.ctx.currentTime:0)+0.09); }
  ouch(){ this.osc('sawtooth',300,90,0.22,0.35); this.noise(0.15,0.5,'lowpass',1800,200); }

function inTele(t,p){
  const dx=p.x-t.g.position.x, dz=p.z-t.g.position.z, d=Math.hypot(dx,dz);
  if(t.kind==='circle') return d<=t.r+0.35;

}

function hitBoss(dmg,o={}){
  if(bs.dead||G.state!=='fight') return;
  if(bs.invuln && !(G.mode==='viral'&&o.finisher)){ burst(bossCenter(),4,0xff2fd0,6); return; }
  if(G.mode==='viral'){ if(o.finisher) dmg=bs.hp; else dmg=Math.min(dmg,bs.hp-1); }
  dmg=Math.round(dmg*(0.92+Math.random()*0.16));
  const p2line=bs.maxHp*0.5;
  if(bs.phase===1 && bs.hp-dmg<=p2line && !(G.mode==='viral'&&o.finisher)){ dmg=bs.hp-p2line; }
  bs.hp=Math.max(0,bs.hp-dmg);
  G.hits++; G.combo++; G.comboT=2.6; G.maxCombo=Math.max(G.maxCombo,G.combo);
  const cEl=$('combo-num'); cEl.style.display='block'; cEl.textContent=G.combo+' HIT!'; cEl.classList.remove('bump'); void cEl.offsetWidth; cEl.classList.add('bump');
  G.bounty+=Math.floor(dmg*3.5); $('bounty-val').textContent=fmt(G.bounty);
  hype=Math.min(1,hype+0.25);
  const c=bossCenter();
  pop(c,fmt(dmg),o.heavy?'big':'');
  const heavy=o.heavy||0;
  G.hitstop=Math.max(G.hitstop,heavy?0.11:0.045); G.shake=Math.min(1.1,G.shake+(heavy?0.55:0.2));
  if(heavy){ impactFrame(true); G.punch=Math.max(G.punch,0.8); G.speedLines=Math.max(G.speedLines,0.35); sfx.punch(1); } else { sfx.punch(0); if(Math.random()<0.5) sfx.zap(); }
  burst(c,heavy?26:10,heavy?0xfff3a0:0xffd23f,heavy?18:11); debris(c,heavy?16:5,heavy?12:7,heavy?8:5,heavy?1.2:0.8);
  ringFx(c,0xfef08a,heavy?22:13,0.4);
  if(Math.random()<0.6||heavy) boltFx(c.clone().add(new THREE.Vector3((Math.random()-0.5)*3,3.5,(Math.random()-0.5)*3)),c,Math.random()<0.5?0xff0044:0x111111,0.15);
  if(o.launch && !bs.atk) { bs.airV=Math.max(bs.airV,o.launch); }
  bs.poise+=dmg; const poiseMax=bs.phase===1?14000:20000;
  if(!bs.atk && (heavy || bs.poise>poiseMax)){ bs.stun=heavy?0.9:0.6; bs.poise=0; setFace(boss,'hurt'); }
  else if(!bs.atk) bs.stun=Math.max(bs.stun,0.12);
  updateBossBar();
  if(bs.hp<=0) bossDeath();
  else if(bs.phase===1 && bs.hp<=p2line && !bs.invuln) startTransform();
}

    bs.tele=[teleCircle(tgt,r)];
    bs.atk={kind,t:0,dur,from:bs.pos.clone(),tgt,r};
    setAct(boss,[[0,'bSlamWind',14],[0.35*dur,'bAir',12],[dur,'bSlam',40],[dur+0.5,'idle',8]],dur+0.6);
  } else if(kind==='sweep'){
    const dur=0.85*sp; bs.tele=[teleSector(bs.pos,yaw,P2?9.5:8,P2?2.4:1.9)];
    bs.atk={kind,t:0,dur};

  } else if(kind==='nova'){
    const dur=1.15*sp; bs.tele=[teleCircle(bs.pos,P2?8:7)];
    bs.atk={kind,t:0,dur};
    setAct(boss,[[0,'bNovaWind',10],[dur,'bNova',30],[dur+0.5,'idle',8]],dur+0.6);
  } else if(kind==='charge'){
    const dur=0.9*sp, len=Math.min(24,toP.length()+6); bs.tele=[teleLine(bs.pos,yaw,len,3.2)];
    bs.atk={kind,t:0,dur,yaw,len,from:bs.pos.clone()};

  } else if(kind==='storm'){
    const dur=1.0; const pts=[];
    for(let i=0;i<7;i++){ const a=Math.random()*Math.PI*2, r=i===0?0:2.5+Math.random()*6; const p=pp.clone().add(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r)); clampArena(p); pts.push(p); }

    setAct(boss,[[0,'bStorm',10],[dur+0.7,'idle',8]],dur+0.8);

function resolveAttack(){

function updateBossAttack(dt){
  const a=bs.atk; a.t+=dt;
  const P2=bs.phase===2;
  if(a.kind==='storm'){
    bs.tele.forEach((t,i)=>{ if(t.g) setTeleFill(t,(a.t-i*0.08)/a.base); });
    while(a.struck<a.pts.length && a.t>=a.base+a.struck*0.08){
      const p=a.pts[a.struck], t=bs.tele[a.struck];
      boltFx(new THREE.Vector3(p.x+(Math.random()-0.5)*2,22,p.z+(Math.random()-0.5)*2),new THREE.Vector3(p.x,0.3,p.z),0xff2fd0,0.25);
      boltFx(new THREE.Vector3(p.x,18,p.z),new THREE.Vector3(p.x,0.3,p.z),0xffffff,0.15);
      ringFx(new THREE.Vector3(p.x,0.3,p.z),0xff2fd0,12,0.35); debris(new THREE.Vector3(p.x,0.4,p.z),5,7,6,0.8);
      sfx.zap(); G.shake=Math.min(1.1,G.shake+0.25); impactFrame(false);
      if(inTele(t,pl.pos)) hitPlayer(1500,new THREE.Vector3(p.x,0,p.z));
      killTele(t); a.struck++;
    }
    if(a.t>=a.dur){ bs.tele.forEach(killTele); bs.tele=[]; bs.atk=null; bs.atkCd=P2?1.0:1.6; }
    return;
  }
  bs.tele.forEach(t=>setTeleFill(t,a.t/a.dur));
  if(a.kind==='slam'){
    const u=Math.min(1,Math.max(0,(a.t-0.3*a.dur)/(0.7*a.dur)));
    if(a.t>0.3*a.dur){ bs.pos.lerpVectors(a.from,a.tgt,u); bs.air=Math.sin(u*Math.PI)*7; }
  } else if(a.kind==='charge' && a.t>=a.dur){
    const u=Math.min(1,(a.t-a.dur)/0.28); bs.pos.copy(a.from).add(new THREE.Vector3(Math.sin(a.yaw),0,Math.cos(a.yaw)).multiplyScalar(a.len*u)); clampArena(bs.pos);
    if(Math.random()<0.6) ghost(boss,0xff2fd0);
  }
  if(!a.resolved && a.t>=a.dur){ a.resolved=true; resolveAttack(); }
  const tail=a.kind==='charge'?0.6:0.45;
  if(a.t>=a.dur+tail){ bs.air=0; bs.atk=null; bs.atkCd=(P2?0.9:1.5)+Math.random()*(P2?0.6:1.0); setFace(boss,'calm'); }
}
function chooseAttack(){

}

}
function tickSim(real){ // deterministic step for QA / headless capture
  realT+=real; if(G.impactT>0){ G.impactT-=real; if(G.impactT<=0) canvas.classList.remove('inv'); }
  let dt=real; if(G.hitstop>0){ G.hitstop-=real; dt=0; } if(G.slowT>0){ G.slowT-=real; dt*=G.timeScale; if(G.slowT<=0) G.timeScale=1; }
  step(dt,real); updateCam(real);
}
function step(dt,real){
  waterU.t.value+=real;
  // scheduled game-time callbacks
  for(let i=timers.length-1;i>=0;i--){ const tm=timers[i]; if(tm.gen!==G.gen){ timers.splice(i,1); continue; } tm.t-=dt; if(tm.t<=0){ timers.splice(i,1); tm.fn(); } }
  if(G.state==='fight' && dt>0) { G.t+=dt; $('timer-val').textContent=G.t.toFixed(1); }
  // cooldowns, energy
  for(const k of SKILL_ORDER){ pl.cds[k]=Math.max(0,pl.cds[k]-dt); const el=$('cd-'+k); if(el) el.style.height=(pl.cds[k]/SKILLS[k].cd*100)+'%';
    const noen=pl.en<SKILLS[k].cost; const sl=$('slot-'+k); if(sl) sl.classList.toggle('noen',noen); const tb=$('tb-'+k); if(tb) tb.classList.toggle('noen',noen||pl.cds[k]>0); }
  if(G.state==='fight' && !pl.dead){ const before=pl.en; pl.en=Math.min(P_MAXEN,pl.en+EN_REGEN*dt); if(Math.floor(before/200)!==Math.floor(pl.en/200)) updatePlayerBars(); }
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0){ G.combo=0; $('combo-num').style.display='none'; } }
  pl.lock=Math.max(0,pl.lock-dt); pl.hurt=Math.max(0,pl.hurt-dt); pl.iframes=Math.max(0,pl.iframes-dt);
  if(pl.hurt<=0 && !pl.dead && player.faceMat.map===player.faces.hurt) setFace(player,'calm');
  if(pl.lock<=0 && !pl.dead && G.state==='fight' && player.faceMat.map===player.faces.fierce) setFace(player,'calm');

  // ---- player movement
  pl.moveSpd=0;
  if(G.mode==='viral') updateViral(dt);
  else if(G.state==='fight' && !pl.dead && pl.lock<=0 && pl.hurt<=0 && dt>0){
    const mv=moveVec(); if(mv.lengthSq()>0.01){ pl.pos.addScaledVector(mv,10.5*dt); pl.yaw=lerpAngle(pl.yaw,Math.atan2(mv.x,mv.z),1-Math.exp(-14*dt)); pl.moveSpd=10.5*mv.length(); }
  }
  if(pl.roll){ pl.roll.t+=dt; const u=Math.min(1,pl.roll.t/pl.roll.dur); pl.pos.lerpVectors(pl.roll.from,pl.roll.to,u); if(Math.random()<0.5) debris(new THREE.Vector3(pl.pos.x,0.3,pl.pos.z),1,3,3,0.6); if(u>=1) pl.roll=null; }
  if(pl.kb.lengthSq()>0.01){ pl.pos.addScaledVector(pl.kb,dt); pl.kb.multiplyScalar(Math.exp(-8*dt)); }
  // keep apart from boss
  const sep=pl.pos.clone().sub(bs.pos); sep.y=0; const sd=sep.length(), minD=1.5*bs.scale/1.35+0.5;
  if(sd<minD && sd>0.001 && !bs.dead && bs.air<1.5) pl.pos.addScaledVector(sep.normalize(),(minD-sd));
  clampArena(pl.pos);

  // ---- boss
  if(dt>0) updateBoss(dt);

  // ---- rigs
  pl.runPh+=dt*pl.moveSpd*1.1; bs.runPh+=dt*bs.moveSpd*1.0;
  animRig(player,dt,locoPose(pl,'idle'),null);
  player.root.position.set(pl.pos.x,0,pl.pos.z);
  if(!pl.dead && pl.lock>0 && !pl.roll && player.act && SKILLS && pl.iframes<=0.0) {}
  player.root.rotation.y=lerpAngle(player.root.rotation.y,pl.yaw,1-Math.exp(-20*dt));
  // C roll: whole body spins forward like a donut wheel
  pl.spinA=pl.spinA||0; if(pl.roll){ pl.spinA+=dt*28; } else { const tgt=Math.round(pl.spinA/(Math.PI*2))*Math.PI*2; pl.spinA+=(tgt-pl.spinA)*(1-Math.exp(-18*dt)); }
  player.body.rotation.x+=pl.spinA; { const h0=(pl.roll||Math.abs(pl.spinA%(Math.PI*2))>0.02)?0.95:0; player.body.position.y=h0+(pl.roll?0.35:0); player.hips.position.y-=h0; }
  if(pl.roll){ player.ring.scale.setScalar(2.1); } else { player.ring.scale.setScalar(1+(player.ring.scale.x-1)*Math.exp(-10*dt)); }
  player.ring.rotation.z+=dt*(pl.roll?18:2.5);
  if(player.bandTails){ player.bandTails.forEach((b,i)=>b.rotation.z=(i?-0.3:0.4)+Math.sin(realT*9+i)*0.25*(0.4+pl.moveSpd/10)); }
  if(pl.iframes>0 && G.mode==='manual') player.root.visible=Math.floor(realT*30)%2===0; else player.root.visible=true;

  const bossBase=bs.dead?'bDown':(bs.stun>0?'bStun':locoPose(bs,'idle'));
  animRig(boss,dt,POSES[bossBase]?POSES[bossBase]:bossBase,null);
  boss.root.position.set(bs.pos.x,bs.air,bs.pos.z);
  boss.root.rotation.y=lerpAngle(boss.root.rotation.y,bs.yaw,1-Math.exp(-10*dt));
  const sc=boss.root.scale.x+(bs.scale-boss.root.scale.x)*(1-Math.exp(-4*dt)); boss.root.scale.setScalar(sc);
  boss.ring.rotation.z-=dt*2.2; halo.rotation.z+=dt*1.5;
  if(boss.cape){ const pp=boss.cape.geometry.attributes.position; for(let i=0;i<pp.count;i++){ const y=pp.getY(i); pp.setZ(i,Math.sin(realT*5+y*3)*0.08*(-y)-(-y)*0.25*Math.min(1,bs.moveSpd/5)); } pp.needsUpdate=true; }
  auraMat.opacity+=((bs.phase===2||bs.invuln?0.18+Math.sin(realT*8)*0.06:0)-auraMat.opacity)*(1-Math.exp(-5*real)); aura.scale.setScalar(1+Math.sin(realT*6)*0.08);
  skyU.p2.value+=((bs.phase===2?1:0)-skyU.p2.value)*(1-Math.exp(-1.5*real));
  pBlob.position.set(pl.pos.x,0.2,pl.pos.z); bBlob.position.set(bs.pos.x,0.2,bs.pos.z); bBlob.scale.setScalar(bs.scale*(1-Math.min(0.6,bs.air/10)));

  // ---- vfx
  for(let i=vfx.length-1;i>=0;i--){
    const v=vfx[i]; v.life-=dt; const u=1-v.life/v.max;
    if(v.type==='ring'){ v.mesh.scale.addScalar(v.grow*dt); v.mesh.material.opacity=Math.max(0,1-u); }
    else if(v.type==='fade'){ v.mesh.material.transparent=true; v.mesh.material.opacity=Math.max(0,1-u); }
    else if(v.type==='ghost'){ v.mat.opacity=0.45*(1-u); }
    else if(v.type==='proj'){
      const toB=bossCenter().sub(v.mesh.position); const L=toB.length(); v.vel.lerp(toB.normalize().multiplyScalar(36),Math.min(1,dt*3)); v.mesh.position.addScaledVector(v.vel,dt); v.mesh.lookAt(v.mesh.position.clone().add(v.vel));
      v.mesh.rotation.z+=dt*10; if(Math.random()<0.7) burst(v.mesh.position,1,0xffd27a,3);
      if(L<2.4*bs.scale/1.35){ hitBoss(v.dmg,{heavy:1,launch:4,finisher:v.finisher}); v.life=0; }
    }
    else if(v.type==='spike'){ const up=Math.min(1,u*6); const down=u>0.7?(u-0.7)/0.3:0; v.mesh.position.y=-v.h/2+(v.h*0.95)*(up-down*1.1); }
    else if(v.type==='portal'){ const s=u<0.2?u/0.2:(u>0.85?(1-u)/0.15:1); v.mesh.scale.setScalar(Math.max(0.01,s)); v.mesh.rotation.z+=dt*4; }
    else if(v.type==='punch'){ v.mesh.position.lerpVectors(v.from,v.to,Math.min(1,u*1.3)); }
    else if(v.type==='orb'){ const h=handPos(player,'A').lerp(handPos(player,'B'),0.5); v.mesh.position.copy(h).add(new THREE.Vector3(0,0.5,0)); v.mesh.scale.setScalar(1+u*4); }
    if(v.life<=0){ scene.remove(v.mesh); vfx.splice(i,1); }
  }
  // debris physics
  for(let i=0;i<DEB;i++){ const d=deb[i];
    if(d.life>0){ d.life-=dt; d.v.y-=26*dt; d.p.addScaledVector(d.v,dt); if(d.p.y<0.3&&Math.hypot(d.p.x,d.p.z)<22){ d.p.y=0.3; d.v.y*=-0.35; d.v.x*=0.7; d.v.z*=0.7; } d.r.x+=dt*8; d.r.y+=dt*6;
      _q.setFromEuler(d.r); const s=d.s*Math.min(1,d.life*2); _s.set(s,s,s); _m.compose(d.p,_q,_s); }
    else { _s.set(0.0001,0.0001,0.0001); _m.compose(d.p.set(0,-50,0),_q.identity(),_s); }
    debMesh.setMatrixAt(i,_m); }
  debMesh.instanceMatrix.needsUpdate=true;
  for(let k=0;k<SPK;k++){ const s=sp[k]; if(s.life>0){ s.life-=dt; spPos[k*3]+=s.v.x*dt; spPos[k*3+1]+=s.v.y*dt; spPos[k*3+2]+=s.v.z*dt; s.v.multiplyScalar(Math.exp(-4*dt)); if(s.life<=0) spPos[k*3+1]=-50; } }
  spGeo.attributes.position.needsUpdate=true;
  // petals
  for(let i=0;i<PET;i++){ petPos[i*3]+=(1.6+Math.sin(realT+petVel[i])*0.8)*real; petPos[i*3+1]-=(0.9+Math.sin(realT*2+i)*0.3)*real; petPos[i*3+2]+=Math.cos(realT*0.7+petVel[i])*0.6*real;
    if(petPos[i*3+1]<-1||petPos[i*3]>32){ petPos[i*3]=-30+Math.random()*30; petPos[i*3+1]=10+Math.random()*10; petPos[i*3+2]=(Math.random()-0.5)*60; } }
  petGeo.attributes.position.needsUpdate=true;
  // ambience
  torches.forEach(t=>{ const f=0.85+Math.sin(realT*14+t.ph)*0.1+Math.sin(realT*23+t.ph*2)*0.06; t.fl.scale.set(f,f*1.1,f); t.glow.material.opacity=0.6+0.3*f-0.3; });
  torchLights.forEach((L,i)=>L.intensity=0.8+Math.sin(realT*13+i)*0.15);
  ships.forEach(s=>{ s.sh.position.y=-2.1+Math.sin(realT*1.1+s.ph)*0.25; s.sh.rotation.z=Math.sin(realT*0.9+s.ph)*0.04; s.sh.rotation.x=Math.sin(realT*0.7+s.ph)*0.03; s.flag.rotation.y=Math.sin(realT*4+s.ph)*0.3; });
  hype=Math.max(0.15,hype-real*0.35);
  crowd.forEach(c=>{ const j=Math.max(0,Math.sin(realT*(7+hype*6)+c.ph))*hype*0.5; c.f.position.y=c.base+j; c.arm.rotation.z=-0.5-hype*1.8*Math.max(0,Math.sin(realT*9+c.ph)); });
  clouds.forEach(c=>{ c.userData.a+=real*0.004; c.position.x=Math.cos(c.userData.a)*c.userData.r; c.position.z=Math.sin(c.userData.a)*c.userData.r; });

  // end-state timing (real time)
  if(G.state==='ending'){ G.endT+=real;
    if(G.endT>2.3){ G.state='over'; showEnd(bs.dead); }
  }
  if(G.state==='over' && G.mode==='viral'){ G.endT+=real; if(G.endT>6.0) setViralMode(true); }
}
function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return a+d*t; }
function locoPose(e,base){
  if(e.moveSpd>0.5){ const s=Math.sin(e.runPh), c=Math.cos(e.runPh); const k=Math.min(1,e.moveSpd/8);
    return {lean:0.35*k,crouch:0.1,aX:s*1.0*k-0.2,aZ:0.2,aE:-1.3,bX:-s*1.0*k-0.2,bZ:0.2,bE:-1.3,laX:-s*1.0*k,laK:Math.max(0,c)*1.3*k+0.1,lbX:s*1.0*k,lbK:Math.max(0,-c)*1.3*k+0.1,lift:Math.abs(c)*0.08}; }
  const b=Object.assign({},POSES[base]); const br=Math.sin(realT*2.4)*0.03; b.crouch=(b.crouch||0)+br; b.aE=(b.aE||0)+br*2; b.bE=(b.bE||0)-br*2; return b;
}
function updateBoss(dt){
  bs.moveSpd=0;
  if(bs.dead){ return; }
  if(bs.invuln){ // phase 2 transform
    bs.transformT+=dt; bs.air=Math.min(2.2,bs.transformT*2);
    if(Math.random()<0.25) boltFx(bossCenter().add(new THREE.Vector3((Math.random()-0.5)*4,4,(Math.random()-0.5)*4)),bossCenter(),Math.random()<0.5?0xff2fd0:0xffffff,0.12);
    G.shake=Math.max(G.shake,0.25);
    if(bs.transformT>=1.4 && bs.phase===1) applyPhase2Look();
    if(bs.transformT>=2.4){ bs.invuln=false; bs.air=0; bs.atkCd=0.8; }
    const toP=pl.pos.clone().sub(bs.pos); bs.yaw=Math.atan2(toP.x,toP.z);
    return;
  }
  // air juggle physics
  if(!bs.atk){ if(bs.airV!==0||bs.air>0){ bs.air+=bs.airV*dt; bs.airV-=28*dt; if(bs.air<=0){ if(bs.airV<-8){ debris(new THREE.Vector3(bs.pos.x,0.3,bs.pos.z),6,6,4); G.shake+=0.15; } bs.air=0; bs.airV=0; } } }
  if(bs.atk){ updateBossAttack(dt); return; }
  if(bs.stun>0){ bs.stun-=dt; if(bs.stun<=0) setFace(boss,'calm'); return; }
  const toP=pl.pos.clone().sub(bs.pos); toP.y=0; const d=toP.length();
  bs.yaw=Math.atan2(toP.x,toP.z);
  if(G.mode==='viral') return; // scripted in viral mode
  if(pl.dead||G.state!=='fight') return;
  bs.atkCd-=dt;
  const spd=bs.phase===2?6.2:4.6;
  if(d>4.2 && bs.air<=0){ bs.pos.addScaledVector(toP.normalize(),spd*dt); bs.moveSpd=spd; }
  if(bs.atkCd<=0 && bs.air<=0) bossAttack(chooseAttack());
}
function render(real){ updateCam(real); drawFx(real,real); renderer.render(scene,camera); }
function updateCam(real){
  // camera: lock-on behind the player, framing the boss
  const toP=pl.pos.clone().sub(bs.pos); toP.y=0; if(toP.lengthSq()>0.25) camDir.lerp(toP.normalize(),1-Math.exp(-3*real)).normalize();
  const portrait=camera.aspect<0.8;
  let dist=portrait?14.5:11.5, hgt=portrait?8.5:6.8;
  const boss2=bs.phase===2?1.15:1; dist*=boss2;
  const side=new THREE.Vector3(camDir.z,0,-camDir.x).multiplyScalar(portrait?1.6:2.6);
  let tgtPos=pl.pos.clone().addScaledVector(camDir,dist).add(side).add(new THREE.Vector3(0,hgt,0));
  let look=pl.pos.clone().lerp(bs.pos,0.6).addScaledVector(side,0.35); look.y=2.0+bs.air*0.35;
  if(G.state==='ending'||G.state==='over'){
    const foc=bs.dead?bs.pos:pl.pos; const a=realT*0.35; tgtPos=foc.clone().add(new THREE.Vector3(Math.sin(a)*(portrait?11:9),4.5,Math.cos(a)*(portrait?11:9))); look=foc.clone().setY(1.6);
  }
  // punch-in on finishers: pull toward the boss and tighten FOV
  G.punch=Math.max(0,G.punch-real*1.6);
  if(G.punch>0){ const pk=Math.min(1,G.punch); tgtPos.lerp(bossCenter().add(camDir.clone().multiplyScalar(5)).add(new THREE.Vector3(0,1.5,0)),pk*0.45); }
  const lim=Math.hypot(tgtPos.x,tgtPos.z); if(tgtPos.y<1.5) tgtPos.y=1.5;
  camPos.lerp(tgtPos,1-Math.exp(-6*real)); camLook.lerp(look,1-Math.exp(-8*real));
  G.shake=Math.max(0,G.shake-real*2.2);
  const s=G.shake*G.shake*0.9;
  camera.position.set(camPos.x+(Math.random()-0.5)*s,camPos.y+(Math.random()-0.5)*s,camPos.z+(Math.random()-0.5)*s);
  camera.lookAt(camLook);
  camFwd.copy(camLook).sub(camera.position);
  const fov=(portrait?66:56)-Math.min(1,G.punch)*14; if(Math.abs(camera.fov-fov)>0.05){ camera.fov=fov; camera.updateProjectionMatrix(); }
  G.speedLines=Math.max(0,G.speedLines-real*1.2);
}

// boot: start in the 9:16 viral auto-combo so the action shows immediately
onResize(); setViralMode(true); updatePlayerBars();
const q=new URLSearchParams(location.search); if(q.has('manual')) startManual();
window.__blox={G,pl,bs,startManual,setViralMode,triggerSkill,hitBoss,bossAttack,advance(sec){ const n=Math.round(sec*60); for(let i=0;i<n;i++) tickSim(1/60); last=performance.now(); }};
requestAnimationFrame(frame);
