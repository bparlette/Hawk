<title>Mashup Brawler</title><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;height:100%;background:#120a24;overflow:hidden}canvas{display:block;margin:auto;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
// ================= MASHUP BRAWLER — core =================
const CV=document.getElementById('c');let x=CV.getContext('2d');
const W=1080,H=1920,INK='#1a1026',GY=1380,TAU=Math.PI*2;
const Q=new URLSearchParams(location.search);
const CAP=Q.has('capture');
const OFF=[document.createElement('canvas'),document.createElement('canvas')];
let BASE=1;
function rs(){
 if(CAP){CV.width=W;CV.height=H;BASE=1;CV.style.width=W+'px';CV.style.height=H+'px';}
 else{const r=Math.min(window.devicePixelRatio||1,2),a=innerWidth,b=innerHeight,s=Math.min(a/W,b/H);
  CV.width=Math.round(W*s*r);CV.height=Math.round(H*s*r);CV.style.width=(W*s)+'px';CV.style.height=(H*s)+'px';CV.style.marginTop=((b-H*s)/2)+'px';BASE=s*r;}
 OFF.forEach(o=>{o.width=CV.width;o.height=CV.height});
}
rs();addEventListener('resize',rs);

// ---------- math ----------
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>t*t*(3-2*t), eout=t=>1-(1-t)*(1-t), ein=t=>t*t, eback=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const hs=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
let rngS=1;function rnd(){rngS=rngS+0x6D2B79F5|0;let t=Math.imul(rngS^rngS>>>15,1|rngS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function seed(s){rngS=s|0}

// ---------- sticker drawing helpers (pass 0 = white sticker outline, pass 1 = colour + ink) ----------
let P=1,LW=1,FL=0;const LITE={};function lite(c){if(typeof c!=='string'||c[0]!=='#'||c.length!==7)return c;if(!LITE[c]){const n=parseInt(c.slice(1),16),m=v=>Math.round(v+(255-v)*.72);LITE[c]='rgb('+m(n>>16)+','+m((n>>8)&255)+','+m(n&255)+')'}return LITE[c]}
function sh(fill,fn){x.beginPath();fn();
 if(P==0){x.strokeStyle='#fff';x.lineWidth=13*LW;x.lineJoin='round';x.lineCap='round';x.stroke();x.fillStyle='#fff';x.fill()}
 else{if(fill){x.fillStyle=FL?lite(fill):fill;x.fill()}x.strokeStyle=INK;x.lineWidth=3.6*LW;x.lineJoin='round';x.lineCap='round';x.stroke()}}
function cap(x1,y1,x2,y2,r,f){sh(f,()=>{const a=Math.atan2(y2-y1,x2-x1);x.arc(x1,y1,r,a+Math.PI/2,a-Math.PI/2);x.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2);x.closePath()})}
function ell(cx,cy,rx,ry,f,rot=0){sh(f,()=>x.ellipse(cx,cy,Math.abs(rx),Math.abs(ry),rot,0,TAU))}
function circ(cx,cy,r,f){sh(f,()=>x.arc(cx,cy,Math.abs(r),0,TAU))}
function poly(p,f){sh(f,()=>{x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath()})}
function rr(X,Y,w,h,r,f){sh(f,()=>{x.roundRect?x.roundRect(X,Y,w,h,r):x.rect(X,Y,w,h)})}
function limb(px,py,a1,a2,l1,l2,r,f){const ex=px+Math.sin(a1)*l1,ey=py+Math.cos(a1)*l1,hx=ex+Math.sin(a1+a2)*l2,hy=ey+Math.cos(a1+a2)*l2;cap(px,py,ex,ey,r,f);cap(ex,ey,hx,hy,r*.9,f);return[hx,hy]}
function ln(fn,col,w){x.beginPath();fn();x.lineCap='round';x.lineJoin='round';if(P==0){x.strokeStyle='#fff';x.lineWidth=w+10*LW;x.stroke()}else{x.strokeStyle=INK;x.lineWidth=w+3.6*LW;x.stroke();x.strokeStyle=FL?lite(col):col;x.lineWidth=w;x.stroke()}}
function inkLine(fn,w=3){if(!P)return;x.beginPath();fn();x.strokeStyle=INK;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.stroke()}
function dot(cx,cy,r,col){if(!P)return;x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill()}
function star5(cx,cy,r1,r2,rot=0){for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,r=i%2?r2:r1;i?x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath()}
function burst(cx,cy,n,r1,r2,rot=0){for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,r=i%2?r2:r1*(0.85+hs(i*3.1)*0.3);i?x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath()}
function sticker(fn){for(P=0;P<2;P++){x.save();fn();x.restore()}P=1}
const FONT='"Arial Black","Impact","Nimbus Sans","Helvetica Neue",Arial,sans-serif';
function stext(txt,X,Y,size,fill,o={}){x.save();x.translate(X,Y);x.rotate(o.rot||0);const s=o.sc==null?1:o.sc;x.scale(s,s);x.globalAlpha*=(o.a==null?1:o.a);
 x.font=`900 ${size}px ${FONT}`;x.textAlign=o.align||'center';x.textBaseline='middle';x.lineJoin='round';
 if(o.maxw){const m=x.measureText(txt).width;if(m>o.maxw){const k=o.maxw/m;x.scale(k,k)}}
 if(o.shadow!==false){x.fillStyle='rgba(20,8,40,.45)';x.lineWidth=size*.36;x.strokeStyle='rgba(20,8,40,.45)';x.strokeText(txt,size*.06,size*.1)}
 x.lineWidth=size*.34;x.strokeStyle=o.outline||'#fff';x.strokeText(txt,0,0);x.lineWidth=size*.13;x.strokeStyle=o.ink||INK;x.strokeText(txt,0,0);
 if(o.grad){const g=x.createLinearGradient(0,-size*.5,0,size*.5);g.addColorStop(0,o.grad[0]);g.addColorStop(1,o.grad[1]);x.fillStyle=g}else x.fillStyle=fill;x.fillText(txt,0,0);
 x.restore()}
function withCtx(cv,fn){const old=x;x=cv.getContext('2d');x.setTransform(BASE,0,0,BASE,0,0);x.clearRect(0,0,W,H);fn();x=old}

// ---------- audio (synthesised WebAudio; same code renders offline for the videos) ----------
let AC=null,MASTER=null,AUDIO_LOG=null;
function nbuf(ac){if(!ac._nb){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);let s=12345;for(let i=0;i<d.length;i++){s=(s*1103515245+12345)&0x7fffffff;d[i]=s/0x3fffffff-1}ac._nb=b}return ac._nb}
function tone(ac,dst,type,f0,f1,t,dur,vol,att=.004){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dst);o.start(t);o.stop(t+dur+.03)}
function noise(ac,dst,t,dur,vol,ft,f0,f1,q=1){const s=ac.createBufferSource();s.buffer=nbuf(ac);s.loop=true;const f=ac.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dst);s.start(t,(t*7.31)%1.5);s.stop(t+dur+.03)}
const SFX={
 hit:(a,d,t,v)=>{noise(a,d,t,.09,.55*v,'bandpass',1900,900,1.2);tone(a,d,'sine',170,48,t,.15,.8*v)},
 big:(a,d,t,v)=>{noise(a,d,t,.38,.75*v,'lowpass',3500,250);tone(a,d,'sine',130,34,t,.45,1*v);tone(a,d,'square',95,40,t,.22,.18*v)},
 rush:(a,d,t,v)=>{noise(a,d,t,.05,.3*v,'bandpass',2600,1800,2);tone(a,d,'square',700,320,t,.04,.07*v)},
 whoosh:(a,d,t,v)=>noise(a,d,t,.18,.28*v,'bandpass',450,2600,2),
 ding:(a,d,t,v)=>{tone(a,d,'square',988,988,t,.07,.13*v);tone(a,d,'square',1319,1319,t+.07,.28,.13*v)},
 mush:(a,d,t,v)=>[523,659,784,1047,1319].forEach((f,i)=>tone(a,d,'square',f,f,t+i*.045,.08,.09*v)),
 boing:(a,d,t,v)=>{tone(a,d,'sine',170,760,t,.32,.45*v);tone(a,d,'triangle',340,980,t,.26,.12*v)},
 ping:(a,d,t,v)=>{tone(a,d,'triangle',1500,950,t,.26,.32*v);tone(a,d,'sine',3000,3000,t,.08,.08*v)},
 combo:(a,d,t,v)=>{[523,659,784,1047,1568].forEach((f,i)=>tone(a,d,'square',f,f,t+i*.055,.11,.11*v));noise(a,d,t,.6,.25*v,'highpass',5000,7000)},
 banner:(a,d,t,v)=>{[196,247,294,392].forEach(f=>tone(a,d,'sawtooth',f,f,t,.7,.07*v,.01));noise(a,d,t,.5,.4*v,'lowpass',2500,200);tone(a,d,'sine',90,40,t,.5,.7*v)},
 ko:(a,d,t,v)=>{[131,165,196,262,330].forEach(f=>tone(a,d,'sawtooth',f,f*.98,t,1.3,.06*v,.01));noise(a,d,t,1,.3*v,'lowpass',1800,120)},
 boom:(a,d,t,v)=>{noise(a,d,t,1.1,.95*v,'lowpass',1500,90);tone(a,d,'sine',85,28,t,.9,1*v)},
 thunder:(a,d,t,v)=>{noise(a,d,t,.12,.9*v,'highpass',2500,1500);noise(a,d,t,1.7,.9*v,'lowpass',5000,150);tone(a,d,'sine',62,28,t,1.6,.9*v)},
 peel:(a,d,t,v)=>{noise(a,d,t,.75,.3*v,'highpass',2600,7000);noise(a,d,t+.05,.55,.22*v,'bandpass',1400,380,3)},
 pipe:(a,d,t,v)=>{for(let i=0;i<6;i++)tone(a,d,'square',720-i*95,600-i*95,t+i*.06,.06,.11*v)},
 pipeout:(a,d,t,v)=>{for(let i=0;i<6;i++)tone(a,d,'square',150+i*110,250+i*110,t+i*.05,.05,.11*v);noise(a,d,t,.3,.4*v,'lowpass',1200,300)},
 suck:(a,d,t,v)=>noise(a,d,t,.75,.35*v,'bandpass',300,2600,1.5),
 spit:(a,d,t,v)=>{tone(a,d,'sine',950,180,t,.14,.5*v);noise(a,d,t,.1,.3*v,'bandpass',1200,600)},
 gun:(a,d,t,v)=>noise(a,d,t,.045,.45*v,'bandpass',2200,1400,1),
 step:(a,d,t,v)=>noise(a,d,t,.035,.1*v,'bandpass',900,700),
 star:(a,d,t,v)=>[1568,2093,2637].forEach((f,i)=>tone(a,d,'triangle',f,f,t+i*.06,.14,.12*v)),
 score:(a,d,t,v)=>[1047,1319,1568,2093,2637,3136].forEach((f,i)=>tone(a,d,'square',f,f,t+i*.04,.07,.08*v)),
 zap:(a,d,t,v)=>{tone(a,d,'sawtooth',1800,200,t,.25,.12*v);noise(a,d,t,.2,.3*v,'highpass',3000,6000)},
 power:(a,d,t,v)=>{tone(a,d,'sawtooth',110,880,t,.9,.1*v,.05);noise(a,d,t,.9,.25*v,'bandpass',400,4000,2)},
 // music voices
 kick:(a,d,t,v)=>tone(a,d,'sine',150,42,t,.2,.55*v),
 snare:(a,d,t,v)=>{noise(a,d,t,.13,.26*v,'bandpass',2100,1500,.8);tone(a,d,'triangle',210,150,t,.08,.12*v)},
 hat:(a,d,t,v)=>noise(a,d,t,.035,.09*v,'highpass',8000,8000),
 bass:(a,d,t,v,f)=>tone(a,d,'square',f,f,t,.17,.085*v,.006),
 lead:(a,d,t,v,f)=>{tone(a,d,'square',f,f,t,.16,.045*v,.006);tone(a,d,'triangle',f*2,f*2,t,.12,.03*v)},
};
function sfx(name,v=1,f=0){if(G.ff)return;if(AUDIO_LOG){AUDIO_LOG.push([G.rt-G.rec0,name,v,f]);return}
 if(AC&&AC.state==='running'&&SFX[name])SFX[name](AC,MASTER,AC.currentTime+.01,v,f)}
function makeMaster(ac){const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.15;const g=ac.createGain();g.gain.value=.62;g.connect(comp);comp.connect(ac.destination);return g}
function unlockAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=makeMaster(AC)}AC.resume()}catch(e){}}
async function renderAudio(dur){const sr=44100,ac=new OfflineAudioContext(1,Math.ceil(sr*dur),sr),m=makeMaster(ac);
 for(const [t,n,v,f] of AUDIO_LOG){if(t<dur&&SFX[n])SFX[n](ac,m,Math.max(0,t-1/30)+.001,v,f)}
 const buf=await ac.startRendering(),d=buf.getChannelData(0),out=new DataView(new ArrayBuffer(44+d.length*2));
 const ws=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i))};
 ws(0,'RIFF');out.setUint32(4,36+d.length*2,true);ws(8,'WAVEfmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,1,true);out.setUint32(24,sr,true);out.setUint32(28,sr*2,true);out.setUint16(32,2,true);out.setUint16(34,16,true);ws(36,'data');out.setUint32(40,d.length*2,true);
 for(let i=0;i<d.length;i++)out.setInt16(44+i*2,clamp(d[i],-1,1)*32767,true);
 const u8=new Uint8Array(out.buffer);let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)}
// ================= rig: arms, legs, weapons, kinematics =================
const REST=[0.7,0.9,-0.95];
const KF={
 slash:[[-.18,REST],[-.06,[2.8,.3,-.6]],[0,[1.6,0,-.15]],[.12,[1.0,.1,.3]],[.3,REST]],
 jab:[[-.18,REST],[-.06,[-.3,1.9,-.1]],[0,[1.57,0,-.05]],[.13,[1.5,.05,-.05]],[.3,REST]],
 upper:[[-.18,REST],[-.06,[.2,.4,-.2]],[0,[2.1,-.1,-.5]],[.13,[2.7,0,-.6]],[.3,REST]],
 claw:[[-.3,REST],[-.08,[2.6,.4,-.4]],[0,[1.25,.15,.1]],[.12,[.95,.1,.2]],[.3,REST]],
 low:[[-.3,REST],[-.08,[2.4,.6,-.3]],[0,[.9,.35,0]],[.12,[.8,.3,0]],[.3,REST]],
 slam:[[-.3,REST],[-.08,[3.0,.1,-.4]],[0,[1.3,.1,.1]],[.15,[1.1,.1,.2]],[.4,REST]],
};
function kfA(type,k){const K=KF[type]||KF.slash;if(k<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(k<=K[i][0]){const u=ease(seg(k,K[i-1][0],K[i][0]));return K[i-1][1].map((v,j)=>lerp(v,K[i][1][j],u))}}return K[K.length-1][1]}
const WLEN={master:86,broad:92,pipe:74,fists:22,none:10,claw:16,fist:12,band:10};
function armSolve(def,o){const A0=o.A||REST,A=[A0[0]+(def.dip||0),A0[1],A0[2]],sp=o.shp||def.sh,sx=sp[0],sy=sp[1];
 const ex=sx+Math.sin(A[0])*def.l1,ey=sy+Math.cos(A[0])*def.l1,hx=ex+Math.sin(A[0]+A[1])*def.l2,hy=ey+Math.cos(A[0]+A[1])*def.l2;
 return{sx,sy,ex,ey,hx,hy,wd:Math.atan2(Math.cos(A[0]+A[1]),Math.sin(A[0]+A[1]))+A[2]}}
function nunGeo(s,o){const a=s.wd,lag=o.nlag||0,c=Math.cos(a),n=Math.sin(a);const p1=[s.hx+c*30,s.hy+n*30],b=a+lag*.5,p2=[p1[0]+Math.cos(b)*20,p1[1]+Math.sin(b)*20],d=a+lag;return{p1,p2,d,tip:[p2[0]+Math.cos(d)*44,p2[1]+Math.sin(d)*44]}}
function wTipLocal(o,s){const w=o.wpn||'none';if(w==='nunch')return nunGeo(s,o).tip;const L=(WLEN[w]||10)*(o.wsc||1);return[s.hx+Math.cos(s.wd)*L,s.hy+Math.sin(s.wd)*L]}
function toW(def,o,lx,ly){const K=def.K*(o.sc||1),c=Math.cos(o.lean||0),n=Math.sin(o.lean||0);const rx=lx*c-ly*n,ry=lx*n+ly*c;return[o.x+(o.face||1)*rx*K,o.y+ry*K*(o.sy||1)]}
function tipW(def,o){const s=armSolve(def,o);const t=wTipLocal(o,s);return toW(def,o,t[0],t[1])}
// a point 80% of the way from hand to tip: where sparks sit (inside the target)
function hitW(def,o,f=.78){const s=armSolve(def,o),t=wTipLocal(o,s);return toW(def,o,lerp(s.hx,t[0],f),lerp(s.hy,t[1],f))}
function boxW(def,o){const b=def.hb,K=def.K*(o.sc||1);return{x:o.x+(o.face||1)*b[0]*K,y:o.y+b[1]*K,rx:b[2]*K,ry:b[3]*K}}
function inBox(p,b,pad=0){const dx=(p[0]-b.x)/(b.rx+pad),dy=(p[1]-b.y)/(b.ry+pad);return dx*dx+dy*dy<=1}

// ---------- weapons (drawn in hand space, +x = along the forearm) ----------
function tail(len,w,col){sh(col,()=>{x.moveTo(0,-w*.5);x.bezierCurveTo(len*.4,-w*1.2,len*.8,-w*1.1,len,0);x.bezierCurveTo(len*.8,w*1.1,len*.4,w*1.2,0,w*.5);x.closePath()});
 sh('#fff8ef',()=>{x.moveTo(len*.62,-w*.86);x.bezierCurveTo(len*.8,-w*1.0,len*.95,-w*.4,len,0);x.bezierCurveTo(len*.95,w*.4,len*.8,w*1.0,len*.62,w*.86);x.quadraticCurveTo(len*.7,0,len*.62,-w*.86)})}
function weapon(w,o,s){if(!w||w==='none'||w==='claw'||w==='fist')return;const hx=s.hx,hy=s.hy,a=s.wd;
 if(w==='nunch'){const g=nunGeo(s,o);x.save();x.translate(hx,hy);x.rotate(a);x.translate(-4,0);tail(36,13,'#f39a2c');x.restore();
  ln(()=>{x.moveTo(g.p1[0],g.p1[1]);x.lineTo(g.p2[0],g.p2[1])},'#c9ced8',3);
  for(let i=0;i<4;i++){const u=i/3;ell(lerp(g.p1[0],g.p2[0],u),lerp(g.p1[1],g.p2[1],u),3,2,'#dfe3ea',a)}
  x.save();x.translate(g.p2[0],g.p2[1]);x.rotate(g.d);tail(46,15,'#f39a2c');x.restore();return}
 x.save();x.translate(hx,hy);x.rotate(a);if(o.wsc)x.scale(o.wsc,o.wsc);
 if(w==='master'){cap(-17,0,-2,0,3.6,'#3b3fa6');circ(-19,0,4.2,'#d9b23a');
  poly([6,-5.5,70,-5.5,86,0,70,5.5,6,5.5],'#e8eef7');inkLine(()=>{x.moveTo(10,0);x.lineTo(64,0)},1.6);
  if(P){x.fillStyle='rgba(255,255,255,.9)';x.fillRect(12,-4,50,2)}
  poly([0,-15,7,-5,7,5,0,15,-4,10,-1,0,-4,-10],'#5b4fd0');circ(3,0,3.2,'#ffd84a')}
 else if(w==='broad'){cap(-19,0,-3,0,4.2,'#6a3e1e');circ(-21,0,5,'#e2b23c');
  poly([3,-8.5,78,-8.5,93,0,78,8.5,3,8.5],'#d4dce6');inkLine(()=>{x.moveTo(8,0);x.lineTo(72,0)},1.6);
  if(P){x.fillStyle='rgba(255,255,255,.85)';x.fillRect(10,-6.5,60,2.5)}
  rr(-3,-17,7,34,2,'#e2b23c')}
 else if(w==='pipe'){cap(-26,0,74,0,6.2,'#98a2ad');ell(16,0,3,7.2,'#6f7884');ell(48,0,3,7.2,'#6f7884');ell(74,0,3,6.4,'#5e6672');if(P){x.fillStyle='rgba(255,255,255,.7)';x.fillRect(-20,-4,90,2.2)}}
 else if(w==='fists'){poly([6,-12,27,-8,9,-4],'#f4efe0');poly([6,3,27,7,9,11],'#f4efe0');circ(2,0,14.5,'#ffffff');inkLine(()=>{x.moveTo(8,-7);x.lineTo(14,-6);x.moveTo(9,0);x.lineTo(15,0);x.moveTo(8,7);x.lineTo(14,6)},2)}
 else if(w==='band'){}

LN.forEach((n,l)=>{n.hero=n.L.hero;n.vil=n.vil||n.L.vil;n.d=(n.L.vx-n.L.hx)*n.sc;n.hx=n.cx-n.d/2;n.vx=n.cx+n.d/2;
 const tm=n.L.tmap||{};n.hits=[];for(let j=0;j<10;j++){const t=l*.08+j*.47;if(t<4.25)n.hits.push([t,tm[['slash','jab','upper'][(j+l)%3]]||['slash','jab','upper'][(j+l)%3]])}
 n.rush=[];for(let j=0;j<10;j++)n.rush.push([5.75+l*.026+j*.13,j%2?'slash':'jab']);n.fin=[7.3+l*.05,tm.upper||'upper'];n.ctr=4.5+l*.05});

const TOSS=[[1.75,2.3,4,0],[3.0,3.55,1,2],[5.0,5.55,3,4]];
LN.forEach((n,l)=>{n.hits=n.hits.filter(h=>!TOSS.some(T=>(T[2]==l||T[3]==l)&&h[0]>T[0]-.25&&h[0]<T[1]+.15));n.all=n.hits.concat(n.rush).concat([n.fin]);n.vHit=n.all.map(h=>h[0])});
function wpnAt(l,ft){let w=LN[l].L.wpn;const own=[...LN.map(n=>n.L.wpn)];const cur=own.slice();for(const T of TOSS){if(ft>=T[1]){const a=cur[T[2]];cur[T[2]]=cur[T[3]];cur[T[3]]=a}else if(ft>=T[0]&&(T[2]==l||T[3]==l))return 'none'}return cur[l]}
function heldBefore(l,T){const cur=LN.map(n=>n.L.wpn);for(const U of TOSS){if(U===T)break;const a=cur[U[2]];cur[U[2]]=cur[U[3]];cur[U[3]]=a}return cur[l]}
const CHAIN=[[0,8.45,'upper'],[1,9.07,'upper'],[2,9.69,'slash'],[3,10.31,'slash'],[4,10.93,'upper']];
const PANH=[SONIC,MARIO,DK,KIRBY,SAMUS],PANL=[L1,L2,L3,L4,L5],LOGO_T=11.7;

const FIN={id:6,seed:606,final:true,noReplay:true,wtag:'FINALE',name:'ALL-STAR MASHUP',title:'FINALE · ALL-STAR MASHUP',vs:'5 HEROES  vs  5 VILLAINS',
 hn:'HEROES',hsub:'WEAPONS SWAP MID-FIGHT!',vn:'VILLAINS',vsub:'ALL 5 BOSSES',hx:LN[4].hx,root:110,comboY:340,endT:15.0,noHud:8.2,hideAll:11.7,
 lead:[12,-1,12,15,-1,17,19,-1,22,-1,19,17,15,-1,12,-1],

 drawHero(o){drawChar(SONIC,o)},
 lane(l,ft){const n=LN[l],L=n.L;const h={x:n.hx,y:n.y,gy:n.y,face:1,wpn:wpnAt(l,ft),t:ft+l,A:restA(ft+l),sc:n.sc},v={x:n.vx,y:n.y,gy:n.y,face:-1,t:ft+l*.7,wpn:n.vw||L.vw||'claw',A:restA(ft+l+1),sc:n.sc};
  if(L===L5&&ft>0)v.super=1;
  const st=strikeIn(ft,n.all);if(st){h.A=kfA(st.type,st.k);h.atk=st;const lg=clamp(1-Math.abs(st.k)/.16);h.x+=lg*(L.lunge+(h.wpn==='fists'&&L!==L2?60:0))*n.sc;h.lean=lg*.1}
  react(v,ft,n.vHit,26*n.sc);
  const k=ft-n.ctr;if(k>-.3&&k<.3){v.atk={type:L.vAtk||'low',k};v.A=kfA(v.atk.type,k);const lg=clamp(1-Math.abs(k)/.22);v.x-=lg*L.vLunge*n.sc;v.lean=lg*.1;v.hurt=0;v.flash=0;if(l==1){v.sy=1-.3*lg;v.A=[v.A[0]-.5*lg,v.A[1],v.A[2]]}if(L===L3)v.punch=k<0?seg(k,-.15,0):k<.12?1:1-seg(k,.12,.3)}
  if(k>=0&&k<.42){const u=1-k/.42;h.hurt=u;h.x-=u*60*n.sc;h.lean=-.16*u;h.A=[.2,1.6,-1.3];h.atk=null}
  for(const T of TOSS){if(T[2]==l||T[3]==l){if(ft>=T[0]-.2&&ft<T[0]+.1)h.A=[lerp(1,2.9,seg(ft,T[0]-.2,T[0])),.2,-.5];else if(ft>=T[1]-.1&&ft<T[1]+.15)h.A=[2.7,.2,-.4]}}
  if(h.wpn==='nunch')h.nlag=nunLag(h);
  if(L===L3){v.y-=110*n.sc-Math.sin(ft*3)*10}
  const ko=n.fin[0];if(l<4&&ft>=ko){const u=seg(ft,ko,ko+.7);v.x+=u*900;v.y-=Math.sin(u*Math.PI*.8)*700+u*200;v.rot=u*12;v.hurt=1;v.shadow=false;if(ft>ko+.7)v.hide=1}
  if(l==4&&ft>=ko){v.hurt=1;v.x+=Math.sin(ft*20)*5}
  if(ft>ko+.3)h.A=VICT;
  return{h,v}},
 pose(ft){return{lanes:LN.map((_,l)=>this.lane(l,ft))}},
 // ---- panorama chain-launch ----
 panHero(i,ft){const o={x:i*W+330,y:GY,face:1,wpn:PANL[i].wpn,t:ft+i,A:restA(ft+i)};const c=CHAIN[i];const st=strikeIn(ft,[[c[1],c[2]]]);if(st){o.A=kfA(st.type,st.k);o.atk=st;o.x+=clamp(1-Math.abs(st.k)/.16)*PANL[i].lunge}else if(ft>c[1])o.A=VICT;if(o.wpn==='nunch')o.nlag=nunLag(o);return o},
 hp(i){return hitW(PANH[i],this.panHero(i,CHAIN[i][1]))},
 bowserC(ft){if(ft<CHAIN[0][1])return[L1.vx-9,GY-258];for(let i=1;i<5;i++){if(ft<CHAIN[i][1]){const a=i==1?[L1.vx-9,GY-258]:this.hp(i-1),b=this.hp(i),u=seg(ft,CHAIN[i-1][1],CHAIN[i][1]);return[lerp(a[0],b[0],u),lerp(a[1],b[1],u)-Math.sin(u*Math.PI)*280]}}
  const a=this.hp(4),cam=4*W,u=seg(ft,CHAIN[4][1],LOGO_T);return[lerp(a[0],cam+540,ease(u)),lerp(a[1],760,ease(u))]},
 camX(ft){const c=this.bowserC(ft)[0];return clamp(c-600,0,4*W)},
 drawPan(ft){const cam=this.camX(ft);
  for(let i=0;i<5;i++){const off=i*W-cam;if(off>W||off<-W)continue;x.save();x.translate(off,0);x.beginPath();x.rect(0,0,W,H);x.clip();BGS[i](0,ft,PANL[i]);
   const o=this.panHero(i,ft);o.x-=i*W;drawChar(PANH[i],o);if(o.atk)smear(PANH[i],o,o.atk.k);
   if(ft<LOGO_T-.02)stext(PANL[i].name,540,520,64,'#fff',{rot:-.05,maxw:900,grad:['#fff9b0','#ffb21a']});x.restore();
   if(i>0){const sx=off;x.save();x.fillStyle='#fff';x.strokeStyle=INK;x.lineWidth=6;x.beginPath();for(let k=0;k<=30;k++){const y=-40+k*(H+80)/30;x.lineTo(sx+jag(k+i*40)*1.2-14,y)}for(let k=30;k>=0;k--){const y=-40+k*(H+80)/30;x.lineTo(sx+jag(k+i*40+9)*1.2+14,y)}x.closePath();x.fill();x.stroke();x.restore()}}
  const c=this.bowserC(ft);let sc=.8;if(ft>CHAIN[4][1])sc=lerp(.8,3.0,ein(seg(ft,CHAIN[4][1],LOGO_T)));
  if(ft<LOGO_T-.02){}const o={hide:ft>=LOGO_T-.02,x:c[0]-cam,y:c[1]+112*2.3*sc,face:-1,t:ft,hurt:ft>CHAIN[0][1]?1:0,sc,rot:ft>CHAIN[0][1]?ft*9:0,shadow:false,wpn:'claw',A:restA(ft)};if(ft<CHAIN[0][1])o.y=GY;drawChar(BOWSER,o);
  if(ft>CHAIN[0][1]&&ft<LOGO_T){x.save();x.strokeStyle='rgba(255,255,255,.7)';x.lineCap='round';for(let k=0;k<8;k++){const yy=c[1]+(hs(k)-.5)*300;x.lineWidth=12;x.beginPath();x.moveTo(c[0]-cam-200-hs(k+3)*200,yy);x.lineTo(c[0]-cam-420-hs(k+5)*300,yy);x.stroke()}x.restore()}},
 collage(ft){for(let i=0;i<5;i++){x.save();x.beginPath();const a=i*216-40,b=(i+1)*216+40;x.moveTo(a+120,0);x.lineTo(b+120,0);x.lineTo(b-120,H);x.lineTo(a-120,H);x.closePath();x.clip();BGS[i](i*260,ft,PANL[i]);x.fillStyle='rgba(18,8,40,.25)';x.fillRect(0,0,W,H);x.restore();
   if(i){x.save();x.strokeStyle='#fff';x.lineWidth=16;x.beginPath();x.moveTo(a+40+120,0);x.lineTo(a+40-120,H);x.stroke();x.strokeStyle=INK;x.lineWidth=5;x.stroke();x.restore()}}
  },
 draw(ft,opt){if(ft>=8.2){this.drawPan(Math.min(ft,LOGO_T));return}
  this.collage(ft);const S=this.pose(ft);
  for(let l=0;l<5;l++){const {h,v}=S.lanes[l],n=LN[l];x.save();x.globalAlpha=.3;x.fillStyle='#000';x.beginPath();x.ellipse(n.cx,n.y+6,n.d*.75,16*n.sc,0,0,TAU);x.fill();x.restore();
   drawChar(n.vil,Object.assign(v,{shadow:false}));if(!(opt.noHero&&l==4)){drawChar(n.hero,Object.assign(h,{shadow:false}));if(h.atk)smear(n.hero,h,h.atk.k)}}
  for(const T of TOSS){if(ft>=T[0]&&ft<T[1]){const u=seg(ft,T[0],T[1]);for(const [fa,fb] of [[T[2],T[3]],[T[3],T[2]]]){const A=S.lanes[fa].h,B=S.lanes[fb].h;const pa=toW(LN[fa].hero,A,10,-150),pb=toW(LN[fb].hero,B,10,-150);
     const w=heldBefore(fa,T);flyWeapon(w,lerp(pa[0],pb[0],u),lerp(pa[1],pb[1],u)-Math.sin(u*Math.PI)*380,u*14,1.7)}}}},
 over(ft){if(ft>=8.2&&ft<LOGO_T){stext('ULTIMATE MASHUP',540,1450,64,'#fff',{rot:-.04,grad:['#ff9af0','#ff2a6a']})}
  if(ft>=LOGO_T){const k=G.lt-LOGO_T;x.fillStyle='rgba(14,6,34,.55)';x.fillRect(0,0,W,H);x.save();rays(540,800,1100,k*.6,'rgba(255,230,120,.35)');x.restore();
   for(let i=0;i<5;i++){const o={x:150+i*195,y:1620,face:1,wpn:PANL[i].wpn,t:k*3+i,A:VICT,sc:.62+(i==2?.0:0),shadow:false};o.y-=Math.abs(Math.sin(k*5+i))*24;if(o.wpn==='nunch')o.nlag=2;drawChar(PANH[i],o)}
   const s=eback(clamp(k/.35));x.save();x.translate(540,800);x.rotate(-.06);x.scale(s,s);
   LW=2.2;sticker(()=>{rr(-500,-250,1000,500,60,'#2a0a4a')});LW=1;x.fillStyle='#ff3a6a';x.fillRect(-470,-215,940,22);x.fillStyle='#3ad0ff';x.fillRect(-470,193,940,22);
   for(let i=0;i<30;i++){x.fillStyle=(i+Math.floor(k*8))%2?'#ffe14a':'#ff4fd8';x.beginPath();x.arc(-450+i*31,-232,7,0,TAU);x.arc(-450+i*31,232,7,0,TAU);x.fill()}
   stext('MASHUP',0,-82,200,'#fff',{grad:['#fff9b0','#ffb21a'],maxw:900});stext('BRAWLER',0,105,190,'#fff',{grad:['#9de8ff','#3a7aff'],maxw:900});x.restore();
   stext('ALL 5 WORLDS CLEARED!',540,1180,56,'#fff',{a:clamp((k-.4)*4),rot:-.04,grad:['#ffffff','#ffe27a']});
   if(G.combo>=2)stext('MAX COMBO  '+G.combo,540,1300,52,'#fff',{a:clamp((k-.6)*4),rot:-.04,grad:['#ff9af0','#ff2a6a']})}},
 events(){const E=[];LN.forEach((n,l)=>{n.all.forEach(([t],j)=>E.push([t,()=>{const S=FIN.lane(l,t);const p=contact(n.hero,S.h,n.vil,S.v,'lane'+l+'@'+t.toFixed(2));const isFin=t===n.fin[0],isR=t>=5.7&&!isFin;
   hit(p[0],p[1],{w:isFin?'K.O.!':isR?((j+l)%8==0?'RUSH!':null):((j+l)%2?null:PANL[l].words[j%5]),big:isFin,n:1,stop:isR?.01:isFin?.08:.03,cnt:isR?6:12,vol:.75})}]));
  E.push([n.ctr,()=>{const S=FIN.lane(l,n.ctr);const p=n.L===L3?toW(EGG,S.v,60+70*(S.v.punch||1)+14,-62):contact(n.vil,S.v,n.hero,S.h,'fctr'+l);hurtHero(p[0],p[1],l==4?'GRR!':'OOF!')}])});
  TOSS.forEach(T=>{E.push([T[0],()=>{sfx('whoosh');pop(540,700,'WEAPON SWAP!','#9de8ff',true,-.05)}],[T[1],()=>{sfx('ding');const S=FIN.pose(T[1]);[T[2],T[3]].forEach(l=>{const p=toW(LN[l].hero,S.lanes[l].h,10,-150);spark(p[0],p[1],14,['#fff','#9de8ff']);pop(p[0],p[1]-80,'CATCH!','#ffe14a',false)})}])});
  E.push([7.9,()=>banner('ULTIMATE MASHUP!')],[8.2,()=>{G.flash=.9;sfx('big')}]);
  CHAIN.forEach(([i,t])=>E.push([t,()=>{const p=FIN.hp(i);const cam=FIN.camX(t);hit(p[0]-cam,p[1],{w:['SONIC!','MARIO!','DK!','KIRBY!','SAMUS!'][i],big:true,n:5,stop:.1})}]));
  E.push([LOGO_T-.05,()=>{G.flash=1;sfx('boom')}],[LOGO_T,()=>{sfx('ko');sfx('combo')}],[LOGO_T+.4,()=>sfx('star')]);
  return E.sort((a,b)=>a[0]-b[0])}};
