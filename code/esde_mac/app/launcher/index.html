<!doctype html><html><head><meta charset="utf-8"><title>Browser Arcade</title>
<style>
html,body{margin:0;height:100%;background:#06060a;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
h1{text-align:center;margin:8vh 0 4vh;font-size:5vh;letter-spacing:.12em}
.row{display:flex;gap:4vw;justify-content:center}
.t{width:34vw;border-radius:14px;padding:2vh;background:#14141c;border:4px solid transparent;text-align:center;cursor:pointer}
.t img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px}
.t div{margin-top:1.5vh;font-size:2.6vh;font-weight:700}
.t.sel{border-color:#ffd23a;background:#22222e}
p{text-align:center;opacity:.6;margin-top:5vh;font-size:2vh}
</style></head><body>
<h1>BROWSER ARCADE</h1>
<div class="row">
 <div class="t sel" data-id="shellshock"><img src="shellshock.png" alt=""><div>SHELL SHOCK: LIVE ACTION</div></div>
 <div class="t" data-id="sfbrawl"><img src="sfbrawl.png" alt=""><div>STREET FIGHTER: WORLD BRAWL</div></div>
</div>
<p>&larr; &rarr; / D-pad to choose &nbsp;·&nbsp; Enter / A / Start to play &nbsp;·&nbsp; hold Esc or Select+Start to quit</p>
<script>
const tiles=[...document.querySelectorAll('.t')];let i=0,last={};
function sel(n){i=(n+tiles.length)%tiles.length;tiles.forEach((t,k)=>t.classList.toggle('sel',k===i));}
function go(){window.__arcadeHost&&__arcadeHost.launch(tiles[i].dataset.id);}
tiles.forEach((t,k)=>{t.onmouseenter=()=>sel(k);t.onclick=()=>{sel(k);go();};});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')sel(i-1);else if(e.key==='ArrowRight')sel(i+1);else if(e.key==='Enter'||e.key===' ')go();});
setInterval(()=>{const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(p=>p&&p.connected);if(!g)return;
 const b=k=>!!(g.buttons[k]&&g.buttons[k].pressed),ax=g.axes[0]||0;
 const now={l:b(14)||ax<-.5,r:b(15)||ax>.5,a:b(0)||(b(9)&&!b(8))};
 if(now.l&&!last.l)sel(i-1);if(now.r&&!last.r)sel(i+1);if(now.a&&!last.a)go();last=now;},60);
</script></body></html>
