<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pumpkin Patch Panic</title>
    <style>
      :root { --magenta: #ff3ea5; --red: #ff2a3a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { font-family: "Trebuchet MS", "Verdana", sans-serif; color: #fff; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; pointer-events: none; font-size: 20px; letter-spacing: 2px; }
      #hearts { color: var(--red); font-size: 24px; text-shadow: 0 0 10px rgba(255,42,58,.8); }
      #pumps { color: #ff9b2e; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(255,155,46,.6); }
      #pumps .pic { width: 20px; height: 20px; border-radius: 50%; background: #ff8c1a; box-shadow: 0 -8px 0 -5px #39b54a inset, 0 0 10px rgba(255,140,26,.8); }
      #score { color: var(--magenta); text-shadow: 0 0 12px rgba(255,62,165,.8); font-size: 22px; }
      #lvl { position: fixed; top: 10px; right: 14px; color: #9af; font-size: 15px; letter-spacing: 3px; opacity: .8; }
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; background: rgba(0,0,0,.55); }
      #overlay h1 { margin: 0; font-size: clamp(30px, 9vw, 72px); color: var(--magenta); letter-spacing: 4px; text-shadow: 0 0 22px rgba(255,62,165,.9), 0 0 50px rgba(255,62,165,.5); }
      #overlay p { margin: 0; font-size: clamp(13px, 3.6vw, 19px); color: #ffd9f0; letter-spacing: 2px; opacity: .9; }
      #overlay small { color: #8a93a8; font-size: 12px; letter-spacing: 1px; max-width: 90vw; line-height: 1.6; }
      .hide { display: none !important; }
      #pad { position: fixed; left: 14px; bottom: 76px; width: 150px; height: 150px; }
      .pb { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28); border-radius: 12px; }
      .pb.on { background: rgba(255,62,165,.42); }
      #pu { left: 50px; top: 0; } #pd { left: 50px; top: 100px; } #pl { left: 0; top: 50px; } #pr { left: 100px; top: 50px; }
      #act { position: fixed; right: 20px; bottom: 86px; width: 92px; height: 92px; border-radius: 50%; background: rgba(255,140,26,.22); border: 2px solid rgba(255,140,26,.6); color: #ffb366; font-size: 13px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; }
      #act.on { background: rgba(255,140,26,.55); }
      #touch.hide { display: none; }
      #flash { position: fixed; inset: 0; background: #f00; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="flash"></div>
    <div id="lvl">LEVEL 1</div>
    <div id="hud">
      <div id="hearts">♥♥♥</div>
      <div id="score">000000</div>
      <div id="pumps"><span class="pic"></span><span id="pcount">3</span></div>
    </div>
    <div id="touch" class="hide">
      <div id="pad">
        <div class="pb" id="pu"></div><div class="pb" id="pd"></div><div class="pb" id="pl"></div><div class="pb" id="pr"></div>
      </div>
      <div id="act">THROW</div>
    </div>
    <div id="overlay">
      <h1>PUMPKIN PATCH PANIC</h1>
      <p id="sub">press / tap to start</p>
      <small>Arrows / WASD to move &middot; Space to pick up &amp; throw &middot; P to pause</small>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>
      "use strict";
      // Match the newer three.js colour + lighting defaults the game was tuned for.
      if (THREE.ColorManagement) { THREE.ColorManagement.legacyMode = false; THREE.ColorManagement.enabled = true; }

      // ---------- world constants ----------
      const W = 34;            // world half-width *2 (x from -17..17)
      const XMIN = -15.5, XMAX = 15.5;
      const HOUSE_Z = -13;     // house back
      const DOOR_Z = -8.6;     // door line
      const FENCE_Z = 3.2;     // fence line
      const DIRT_Z = 9.4;      // pumpkin strip
      const ZMIN = -8.2, ZMAX = 11.2;

      const app = document.getElementById("app");
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.useLegacyLights = false;
      app.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
      function layout() {
        const w = innerWidth, h = innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        const dist = w / h < 0.85 ? 40 : 31;
        camera.position.set(0, dist * Math.sin(Math.PI / 3), dist * Math.cos(Math.PI / 3) + 2);
        camera.lookAt(0, 0, 0.5);
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", layout);

      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const key = new THREE.DirectionalLight(0xffffff, 0.6); key.position.set(3, 12, 8); scene.add(key);

      const M = (c, e = 0.35) => new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: e });
      const box = (w, h, d, c, e) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c, e));
      const cyl = (r1, r2, h, c, s = 10) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, s), M(c));
      const sph = (r, c, e) => new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), M(c, e));

      // ---------- static set ----------
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 70), new THREE.MeshBasicMaterial({ color: 0x07070a }));
      ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);

      // house
      const house = new THREE.Group(); scene.add(house);
      const body = box(30, 6, 7, 0xdfe3e6, 0.22); body.position.set(0, 3, HOUSE_Z - 1.2); house.add(body);
      const eave = box(33, 0.9, 9.4, 0xf2f4f6, 0.3); eave.position.set(0, 6.5, HOUSE_Z - 1.0); house.add(eave);
      const eaveShadow = box(33, 0.5, 9.4, 0x9aa1a8, 0.2); eaveShadow.position.set(0, 5.9, HOUSE_Z - 1.0); house.add(eaveShadow);
      const winXs = [-11.5, -7.5, 7.5, 11.5];
      const windows = [];
      for (const x of winXs) {
        const w = box(2.6, 2.4, 0.3, 0x0a0c14, 0.1); w.position.set(x, 3.4, HOUSE_Z + 2.45); house.add(w); windows.push(w);
      }
      const door = box(3.2, 4.4, 0.3, 0x12131c, 0.12); door.position.set(0, 2.2, HOUSE_Z + 2.45); house.add(door);
      const doorGlow = box(3.6, 4.8, 0.1, 0x33203a, 0.5); doorGlow.position.set(0, 2.3, HOUSE_Z + 2.3); house.add(doorGlow);
      // Tober peeking in a window
      const peek = new THREE.Group(); peek.position.set(-11.5, 3.0, HOUSE_Z + 2.3); house.add(peek);
      const peekHead = sph(0.7, 0xffd9a8, 0.3); peek.add(peekHead);
      const peekHair = box(1.5, 0.45, 0.8, 0xffd84d, 0.4); peekHair.position.y = 0.55; peek.add(peekHair);
      const pe1 = box(0.14, 0.18, 0.1, 0x101010, 0); pe1.position.set(-0.24, 0.1, 0.66); peek.add(pe1);
      const pe2 = pe1.clone(); pe2.position.x = 0.24; peek.add(pe2);

      // fence: two red rails + chunky posts, green wavy line beneath
      const fence = new THREE.Group(); fence.position.z = FENCE_Z; scene.add(fence);
      const railMat = M(0xe0202f, 0.5);
      const posts = [];
      function buildFence(gapX) {
        while (fence.children.length) fence.remove(fence.children[0]);
        posts.length = 0;
        const segs = [[XMIN - 2, gapX - 2.4], [gapX + 2.4, XMAX + 2]];
        for (const [a, b] of segs) {
          if (b - a < 0.6) continue;
          for (const y of [1.0, 1.9]) {
            const r = new THREE.Mesh(new THREE.BoxGeometry(b - a, 0.22, 0.25), railMat);
            r.position.set((a + b) / 2, y, 0); fence.add(r);
          }
          for (let x = a + 0.4; x <= b; x += 2.2) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.55, 2.5, 0.55), railMat);
            p.position.set(x, 1.25, 0); fence.add(p); posts.push(p);
          }
        }
        // wavy green line under fence
        const pts = [];
        for (let x = XMIN - 2; x <= XMAX + 2; x += 0.35) pts.push(new THREE.Vector3(x, 0.08, 0.75 + Math.sin(x * 1.5) * 0.28));
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x3ddc5a }));
        fence.add(line);
      }

      // dirt strip
      const dirt = box(34, 0.12, 4.2, 0x5a3a1e, 0.18); dirt.position.set(0, 0.03, DIRT_Z); scene.add(dirt);

      // ---------- pumpkins ----------
      function makePumpkin(s = 1) {
        const g = new THREE.Group();
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.85, 12, 10), M(0xff8c1a, 0.5));
        b.scale.set(1, 0.85, 1); g.add(b);
        const stem = cyl(0.14, 0.2, 0.5, 0x3fa845, 6); stem.position.y = 0.78; g.add(stem);
        const f = (w, h, x, y) => { const m = box(w, h, 0.12, 0x201000, 0); m.position.set(x, y, 0.8); g.add(m); };
        f(0.22, 0.26, -0.3, 0.12); f(0.22, 0.26, 0.3, 0.12); f(0.6, 0.18, 0, -0.32);
        g.scale.setScalar(s);
        return g;
      }
      const PUMP_X = [-9, 0, 9];
      let patch = [];
      function growPatch() {
        for (const p of patch) scene.remove(p);
        patch = PUMP_X.map((x) => { const p = makePumpkin(1); p.position.set(x, 0.75, DIRT_Z); scene.add(p); return p; });
      }

      // ---------- Tober ----------
      function makeTober() {
        const g = new THREE.Group();
        const shirt = box(1.25, 1.2, 0.8, 0x2fc14d, 0.4); shirt.position.y = 1.5; g.add(shirt);
        const shorts = box(1.15, 0.6, 0.8, 0xff6fae, 0.45); shorts.position.y = 0.72; g.add(shorts);
        const l1 = box(0.36, 0.55, 0.36, 0xffd9a8, 0.3); l1.position.set(-0.32, 0.22, 0); g.add(l1);
        const l2 = l1.clone(); l2.position.x = 0.32; g.add(l2);
        const a1 = box(0.3, 0.85, 0.3, 0xffd9a8, 0.3); a1.position.set(-0.78, 1.5, 0); g.add(a1);
        const a2 = a1.clone(); a2.position.x = 0.78; g.add(a2);
        const head = sph(0.62, 0xffd9a8, 0.3); head.position.y = 2.6; g.add(head);
        const hair = box(1.35, 0.5, 1.1, 0xffd84d, 0.45); hair.position.y = 3.05; g.add(hair);
        const e1 = box(0.12, 0.16, 0.1, 0x101010, 0); e1.position.set(-0.22, 2.62, 0.58); g.add(e1);
        const e2 = e1.clone(); e2.position.x = 0.22; g.add(e2);
        g.userData = { legs: [l1, l2], arms: [a1, a2] };
        return g;
      }
      const tober = makeTober(); scene.add(tober);
      const carried = makePumpkin(0.78); carried.position.y = 3.65; carried.visible = false; tober.add(carried);

      // ---------- monsters ----------
      function makeMonster(type) {
        const g = new THREE.Group();
        if (type === 0) { // zombie: purple body, green face, red cap
          const b = box(1.3, 1.5, 0.9, 0x7b35c9, 0.45); b.position.y = 1.0; g.add(b);
          const h = sph(0.62, 0x5ed36a, 0.45); h.position.y = 2.2; g.add(h);
          const cap = cyl(0.1, 0.72, 0.6, 0xe0202f, 8); cap.position.y = 2.8; g.add(cap);
          const a1 = box(0.28, 0.9, 0.28, 0x5ed36a, 0.4); a1.position.set(-0.8, 1.3, 0.3); a1.rotation.x = -0.9; g.add(a1);
          const a2 = a1.clone(); a2.position.x = 0.8; g.add(a2);
          const e1 = box(0.14, 0.14, 0.1, 0x101010, 0); e1.position.set(-0.2, 2.25, 0.58); g.add(e1);
          const e2 = e1.clone(); e2.position.x = 0.2; g.add(e2);
        } else if (type === 1) { // ghost
          const b = new THREE.Mesh(new THREE.SphereGeometry(0.85, 12, 10), M(0x9fdcff, 0.6));
          b.scale.set(1, 1.25, 1); b.position.y = 1.6; g.add(b);
          const skirt = cyl(0.85, 1.05, 0.9, 0x9fdcff, 10); skirt.position.y = 0.75; g.add(skirt);
          const e1 = box(0.18, 0.22, 0.1, 0x0a1520, 0); e1.position.set(-0.26, 1.8, 0.76); g.add(e1);
          const e2 = e1.clone(); e2.position.x = 0.26; g.add(e2);
          const m = box(0.3, 0.2, 0.1, 0x0a1520, 0); m.position.set(0, 1.4, 0.78); g.add(m);
        } else { // scarecrow imp
          const b = box(1.0, 1.4, 0.7, 0x8a5a2b, 0.4); b.position.y = 1.1; g.add(b);
          const h = sph(0.58, 0xc98f46, 0.45); h.position.y = 2.2; g.add(h);
          const hat = cyl(0.05, 0.8, 0.8, 0x4a3018, 8); hat.position.y = 2.85; g.add(hat);
          const arm = box(2.3, 0.22, 0.22, 0x6b4420, 0.4); arm.position.y = 1.55; g.add(arm);
          const e1 = box(0.14, 0.14, 0.1, 0xff2a3a, 0.8); e1.position.set(-0.2, 2.25, 0.54); g.add(e1);
          const e2 = e1.clone(); e2.position.x = 0.2; g.add(e2);
        }
        return g;
      }

      // ---------- phantom gardener ----------
      const gardener = new THREE.Group();
      {
        const robe = cyl(0.5, 1.0, 2.4, 0x9ea6b0, 10); robe.position.y = 1.2; gardener.add(robe);
        const hood = sph(0.6, 0xb6bec8, 0.35); hood.position.y = 2.5; gardener.add(hood);
        const face = box(0.5, 0.4, 0.2, 0x0a0a10, 0); face.position.set(0, 2.45, 0.5); gardener.add(face);
        const can = box(0.7, 0.55, 0.5, 0x6fd3e0, 0.5); can.position.set(0.9, 1.5, 0.2); gardener.add(can);
        const spout = cyl(0.1, 0.1, 0.8, 0x6fd3e0, 6); spout.position.set(1.4, 1.7, 0.2); spout.rotation.z = -0.9; gardener.add(spout);
      }
      gardener.visible = false; scene.add(gardener);
      const drops = new THREE.Group(); scene.add(drops);

      // ---------- title pumpkin ----------
      const title3d = new THREE.Group(); scene.add(title3d);
      {
        const p = makePumpkin(3.4); p.position.set(0, 4.2, -2);
        p.children[2].material = M(0xff2a3a, 1.0); p.children[3].material = M(0xff2a3a, 1.0);
        p.children[4].material = M(0xff2a3a, 1.0);
        title3d.add(p);
        const gl = new THREE.PointLight(0xff6a2a, 2.2, 30); gl.position.set(0, 4.5, 2); title3d.add(gl);
      }

      // ---------- audio ----------
      let actx = null;
      function blip(freq, dur = 0.09, type = "square", vol = 0.08) {
        try {
          if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
          g.gain.setValueAtTime(vol, actx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
          o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
        } catch (e) {}
      }

      // ---------- state ----------
      const S = { TITLE: 0, PLAY: 1, CUT: 2, OVER: 3, LEVEL: 4 };
      const G = {
        state: S.TITLE, score: 0, hearts: 3, level: 1, pumpkins: 3,
        monsters: [], shots: [], flame: null, treat: null, treatT: 8,
        gapX: 0, sway: 0, carrying: false, invuln: 0, paused: false,
        cutT: 0, msgT: 0, flyers: [], hitFlash: 0, started: false
      };

      const elHearts = document.getElementById("hearts"), elScore = document.getElementById("score"),
        elP = document.getElementById("pcount"), elLvl = document.getElementById("lvl"),
        ov = document.getElementById("overlay"), sub = document.getElementById("sub"),
        h1 = ov.querySelector("h1"), hint = ov.querySelector("small"), flashEl = document.getElementById("flash");

      function syncHUD() {
        elHearts.textContent = "♥".repeat(Math.max(0, G.hearts)) || "·";
        elScore.textContent = String(Math.min(999999, G.score)).padStart(6, "0");
        elP.textContent = G.pumpkins;
        elLvl.textContent = "LEVEL " + G.level;
      }

      function clearMonsters() { for (const m of G.monsters) scene.remove(m.obj); G.monsters = []; }
      function clearShots() { for (const s of G.shots) scene.remove(s.obj); G.shots = []; }
      function clearFlyers() { for (const f of G.flyers) scene.remove(f.obj); G.flyers = []; }
      function clearFlame() { if (G.flame) { scene.remove(G.flame.obj); G.flame = null; } }
      function clearTreat() { if (G.treat) { scene.remove(G.treat.obj); G.treat = null; } }

      function spawnFormation() {
        clearMonsters();
        const type = (G.level - 1) % 3;
        const rows = [-6.4, -3.4, -0.4];
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 2; c++) {
            const o = makeMonster(type);
            const hx = (c === 0 ? -5.5 : 5.5) + (r % 2 ? 2.2 : -2.2);
            o.position.set(hx, 0, rows[r]);
            scene.add(o);
            G.monsters.push({ obj: o, hx, hz: rows[r], phase: Math.random() * 6.28, chase: false, chaseT: 2 + Math.random() * 6, type });
          }
        }
      }

      function newGapX() {
        let g;
        do { g = -11 + Math.random() * 22; } while (Math.abs(g - G.gapX) < 5);
        G.gapX = g; buildFence(g);
      }

      function startLevel(n) {
        G.level = n; G.pumpkins = 3; G.carrying = false; carried.visible = false;
        clearShots(); clearFlyers(); clearFlame(); clearTreat();
        spawnFormation(); growPatch(); newGapX();
        tober.position.set(0, 0, DOOR_Z - 0.6);
        if (n >= 3) spawnFlame();
        G.treatT = 10 + Math.random() * 10;
        G.state = S.PLAY; G.invuln = 1.2;
        showMsg("LEVEL " + n, 1.1);
        syncHUD();
      }

      function spawnFlame() {
        const g = new THREE.Group();
        const c = sph(0.55, 0xdff0ff, 0.9); c.scale.y = 1.4; g.add(c);
        const i = sph(0.3, 0x5aa8ff, 1.0); i.position.y = 0.2; g.add(i);
        const l = new THREE.PointLight(0x66bbff, 1.6, 12); g.add(l);
        g.position.set(Math.random() < 0.5 ? -13 : 13, 1.4, -4);
        scene.add(g);
        G.flame = { obj: g, core: c };
      }

      function startGame() {
        G.score = 0; G.hearts = 3; title3d.visible = false;
        ov.classList.add("hide");
        startLevel(1);
      }

      function gameOver() {
        G.state = S.OVER;
        h1.textContent = "GAME OVER";
        sub.textContent = "score " + String(G.score).padStart(6, "0") + " — press / tap to restart";
        hint.textContent = "Level reached: " + G.level;
        ov.classList.remove("hide");
        blip(120, 0.5, "sawtooth", 0.12);
      }

      function showMsg(t, d) { G.msgT = d; sub.textContent = t; }

      // ---------- input ----------
      const keys = {};
      const press = { up: 0, down: 0, left: 0, right: 0, act: false };
      addEventListener("keydown", (e) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"].includes(e.key)) e.preventDefault();
        keys[e.key.toLowerCase()] = true;
        if (e.key === " " || e.key === "Enter") doAction();
        if (e.key.toLowerCase() === "p" && (G.state === S.PLAY || G.state === S.CUT)) togglePause();
      });
      addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
      addEventListener("blur", () => { if ((G.state === S.PLAY || G.state === S.CUT) && !G.paused) togglePause(); });

      function togglePause() {
        G.paused = !G.paused;
        if (G.paused) { h1.textContent = "PAUSED"; sub.textContent = "press P or tap to resume"; hint.textContent = ""; ov.classList.remove("hide"); }
        else { ov.classList.add("hide"); }
      }

      function doAction() {
        if (G.state === S.TITLE || G.state === S.OVER) { blip(660, 0.12); startGame(); return; }
        if (G.paused) { togglePause(); return; }
        if (G.state !== S.PLAY) return;
        if (!G.carrying) {
          // pick up nearest pumpkin
          for (const p of patch) {
            if (!p.visible) continue;
            if (Math.abs(p.position.x - tober.position.x) < 2.0 && Math.abs(p.position.z - tober.position.z) < 2.4) {
              p.visible = false; G.carrying = true; carried.visible = true; blip(520, 0.1, "triangle"); return;
            }
          }
          blip(180, 0.06, "square", 0.04);
        } else {
          // throw straight up (toward the house, up the screen)
          G.carrying = false; carried.visible = false;
          const o = makePumpkin(0.78); o.position.set(tober.position.x, 2.2, tober.position.z);
          scene.add(o);
          G.flyers.push({ obj: o, x: tober.position.x, z: tober.position.z, from: tober.position.z });
          G.pumpkins = Math.max(0, G.pumpkins - 1);
          blip(300, 0.14, "sawtooth");
          syncHUD();
        }
      }

      // touch controls
      const touchWrap = document.getElementById("touch");
      if (matchMedia("(pointer: coarse)").matches) touchWrap.classList.remove("hide");
      function bindPad(id, dir) {
        const el = document.getElementById(id);
        const on = (e) => { e.preventDefault(); press[dir] = 1; el.classList.add("on"); el.setPointerCapture && e.pointerId !== undefined && el.setPointerCapture(e.pointerId); };
        const off = (e) => { press[dir] = 0; el.classList.remove("on"); };
        el.addEventListener("pointerdown", on);
        el.addEventListener("pointerup", off);
        el.addEventListener("pointercancel", off);
        el.addEventListener("pointerleave", off);
      }
      bindPad("pu", "up"); bindPad("pd", "down"); bindPad("pl", "left"); bindPad("pr", "right");
      const actBtn = document.getElementById("act");
      actBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); actBtn.classList.add("on"); doAction(); });
      const offAct = () => actBtn.classList.remove("on");
      actBtn.addEventListener("pointerup", offAct); actBtn.addEventListener("pointercancel", offAct);
      ov.addEventListener("pointerdown", (e) => { e.preventDefault(); doAction(); });
      renderer.domElement.addEventListener("pointerdown", () => { if (G.state === S.TITLE || G.state === S.OVER) doAction(); });
      document.addEventListener("gesturestart", (e) => e.preventDefault());

      // ---------- gameplay helpers ----------
      function hitPlayer() {
        if (G.invuln > 0) return;
        G.hearts--; G.invuln = 2.0; G.hitFlash = 0.35;
        blip(150, 0.3, "sawtooth", 0.12);
        syncHUD();
        tober.position.set(0, 0, DOOR_Z - 0.6);
        G.carrying = false; carried.visible = false;
        if (G.hearts <= 0) gameOver();
      }

      function startCutscene() {
        G.state = S.CUT; G.cutT = 0;
        gardener.visible = true; gardener.position.set(-18, 0, DIRT_Z + 1.2);
        blip(440, 0.18, "sine"); setTimeout(() => blip(590, 0.18, "sine"), 160);
      }

      function spawnTreat() {
        const g = new THREE.Group();
        const isHeart = Math.random() < 0.35;
        if (isHeart) {
          const a = sph(0.5, 0xff2a3a, 0.9); a.position.x = -0.3; g.add(a);
          const b = sph(0.5, 0xff2a3a, 0.9); b.position.x = 0.3; g.add(b);
          const c = box(0.9, 0.9, 0.5, 0xff2a3a, 0.9); c.position.y = -0.45; c.rotation.z = Math.PI / 4; g.add(c);
        } else {
          const c1 = cyl(0.05, 0.45, 1.3, 0xffd84d, 8); g.add(c1);
          const c2 = cyl(0.05, 0.3, 0.7, 0xff8c1a, 8); c2.position.y = 0.3; g.add(c2);
        }
        g.position.set(Math.random() < 0.5 ? -13.5 : 13.5, 2.4, -10);
        scene.add(g);
        G.treat = { obj: g, heart: isHeart, t: 9 };
      }

      // ---------- loop ----------
      let last = performance.now();
      buildFence(0); growPatch();
      layout();

      function tick(now) {
        requestAnimationFrame(tick);
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const t = now / 1000;

        if (G.state === S.TITLE || G.state === S.OVER) {
          title3d.visible = G.state === S.TITLE;
          title3d.rotation.y = Math.sin(t * 0.7) * 0.22;
          title3d.position.y = Math.sin(t * 1.6) * 0.2;
          renderer.render(scene, camera);
          return;
        }
        if (G.paused) { renderer.render(scene, camera); return; }

        if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) { /* nothing */ } }

        // ---- player movement ----
        if (G.state === S.PLAY) {
          const sp = 9.5;
          let dx = 0, dz = 0;
          if (keys["arrowleft"] || keys["a"] || press.left) dx -= 1;
          if (keys["arrowright"] || keys["d"] || press.right) dx += 1;
          if (keys["arrowup"] || keys["w"] || press.up) dz -= 1;
          if (keys["arrowdown"] || keys["s"] || press.down) dz += 1;
          const len = Math.hypot(dx, dz) || 1;
          let nx = tober.position.x + (dx / len) * sp * dt;
          let nz = tober.position.z + (dz / len) * sp * dt;
          nx = Math.max(XMIN, Math.min(XMAX, nx));
          nz = Math.max(ZMIN, Math.min(ZMAX, nz));
          // fence blocking except at the gap
          const crossing = (tober.position.z - FENCE_Z) * (nz - FENCE_Z) <= 0;
          if (crossing && Math.abs(nx - G.gapX) > 1.8) nz = tober.position.z;
          tober.position.set(nx, 0, nz);
          const moving = dx || dz;
          const sw = moving ? Math.sin(t * 13) * 0.6 : 0;
          tober.userData.legs[0].rotation.x = sw; tober.userData.legs[1].rotation.x = -sw;
          tober.userData.arms[0].rotation.x = -sw; tober.userData.arms[1].rotation.x = sw;
          tober.position.y = moving ? Math.abs(Math.sin(t * 13)) * 0.12 : 0;
          if (dx) tober.rotation.y = dx > 0 ? 0.35 : -0.35; else tober.rotation.y *= 0.9;
          tober.visible = G.invuln > 0 ? Math.floor(t * 14) % 2 === 0 : true;
        }

        if (G.invuln > 0) G.invuln -= dt;

        // ---- formation sway ----
        const speedMul = 1 + (G.level - 1) * 0.22;
        G.sway += dt * 0.5 * speedMul;
        const swayX = Math.sin(G.sway) * 3.2;
        const playerInYard = tober.position.z < FENCE_Z - 0.4;

        for (const m of G.monsters) {
          m.phase += dt * 3 * speedMul;
          if (G.state === S.PLAY) {
            if (!m.chase) {
              m.chaseT -= dt;
              if (m.chaseT <= 0 && playerInYard && G.monsters.filter((q) => q.chase).length < 1 + Math.floor(G.level / 2)) {
                m.chase = true; m.chaseT = 4 + Math.random() * 3;
              }
            } else {
              m.chaseT -= dt;
              if (m.chaseT <= 0 || !playerInYard) { m.chase = false; m.chaseT = 3 + Math.random() * 5; }
            }
          }
          const o = m.obj;
          if (m.chase) {
            const ddx = tober.position.x - o.position.x, ddz = tober.position.z - o.position.z;
            const d = Math.hypot(ddx, ddz) || 1;
            const cs = 4.2 * speedMul;
            o.position.x += (ddx / d) * cs * dt;
            o.position.z = Math.min(FENCE_Z - 0.8, o.position.z + (ddz / d) * cs * dt);
          } else {
            const tx = m.hx + swayX;
            o.position.x += (tx - o.position.x) * Math.min(1, dt * 3);
            o.position.z += (m.hz - o.position.z) * Math.min(1, dt * 3);
          }
          o.position.y = Math.abs(Math.sin(m.phase)) * 0.35;
          o.rotation.y = Math.sin(m.phase * 0.5) * 0.3;
          o.rotation.z = Math.sin(m.phase) * 0.08;

          // drop projectile
          if (G.state === S.PLAY && Math.random() < dt * (0.10 + G.level * 0.035)) {
            const s = box(0.45, 0.45, 0.45, 0x4dff5e, 0.9);
            s.position.set(o.position.x, 1.3, o.position.z);
            scene.add(s);
            G.shots.push({ obj: s });
          }
          // monster touches player
          if (G.state === S.PLAY && G.invuln <= 0 &&
            Math.abs(o.position.x - tober.position.x) < 1.2 && Math.abs(o.position.z - tober.position.z) < 1.2) hitPlayer();
        }

        // ---- shots travel "down the screen" (+z) ----
        for (let i = G.shots.length - 1; i >= 0; i--) {
          const s = G.shots[i];
          s.obj.position.z += (7 + G.level) * dt;
          s.obj.rotation.x += dt * 8;
          if (Math.abs(s.obj.position.x - tober.position.x) < 1.0 && Math.abs(s.obj.position.z - tober.position.z) < 1.2 && G.state === S.PLAY) {
            scene.remove(s.obj); G.shots.splice(i, 1); hitPlayer(); continue;
          }
          if (s.obj.position.z > FENCE_Z - 0.2 || s.obj.position.z > ZMAX) { scene.remove(s.obj); G.shots.splice(i, 1); }
        }

        // ---- thrown pumpkins fly up the screen (-z) ----
        for (let i = G.flyers.length - 1; i >= 0; i--) {
          const f = G.flyers[i];
          f.obj.position.z -= 20 * dt;
          f.obj.position.y = 2.2 + Math.sin((DIRT_Z - f.obj.position.z) * 0.08) * 1.2;
          f.obj.rotation.z += dt * 7;
          let hit = -1;
          for (let j = 0; j < G.monsters.length; j++) {
            const o = G.monsters[j].obj;
            if (Math.abs(o.position.x - f.obj.position.x) < 1.5 && Math.abs(o.position.z - f.obj.position.z) < 1.6) { hit = j; break; }
          }
          if (hit >= 0) {
            const m = G.monsters[hit];
            const dist = f.from - m.obj.position.z;
            const pts = dist > 13 ? 200 : dist > 9 ? 150 : 50;
            G.score += pts;
            // poof
            for (let k = 0; k < 6; k++) {
              const p = box(0.3, 0.3, 0.3, 0xffe08a, 0.9);
              p.position.copy(m.obj.position); p.position.y += 1.2;
              p.position.x += (Math.random() - 0.5) * 1.6; p.position.z += (Math.random() - 0.5) * 1.6;
              scene.add(p);
              setTimeout(((pp) => () => { scene.remove(pp); })(p), 260);
            }
            scene.remove(m.obj); G.monsters.splice(hit, 1);
            scene.remove(f.obj); G.flyers.splice(i, 1);
            blip(760, 0.12, "square"); setTimeout(() => blip(980, 0.1, "square"), 70);
            syncHUD();
            if (G.monsters.length === 0) {
              G.state = S.LEVEL; G.cutT = 0;
              h1.textContent = "LEVEL " + G.level + " CLEARED";
              sub.textContent = "+" + (500 * G.level) + " bonus";
              hint.textContent = "";
              G.score += 500 * G.level; syncHUD();
              ov.classList.remove("hide");
              setTimeout(() => { ov.classList.add("hide"); h1.textContent = "PUMPKIN PATCH PANIC"; startLevel(G.level + 1); }, 1600);
            }
            continue;
          }
          if (f.obj.position.z < HOUSE_Z + 1) { scene.remove(f.obj); G.flyers.splice(i, 1); }
        }
        // clean puffs
        G.shots = G.shots.filter((s) => { if (s.puff && !s.obj.parent) return false; return true; });

        // ---- flame ----
        if (G.flame && G.state === S.PLAY) {
          const o = G.flame.obj;
          const ddx = tober.position.x - o.position.x, ddz = tober.position.z - o.position.z;
          const d = Math.hypot(ddx, ddz) || 1;
          const fs = 2.0 + G.level * 0.25;
          o.position.x += (ddx / d) * fs * dt;
          o.position.z += (ddz / d) * fs * dt;
          o.position.y = 1.3 + Math.sin(t * 9) * 0.25;
          const fl = 0.85 + Math.sin(t * 22) * 0.18;
          G.flame.core.scale.set(fl, 1.4 * fl, fl);
          if (G.invuln <= 0 && Math.abs(o.position.x - tober.position.x) < 1.0 && Math.abs(o.position.z - tober.position.z) < 1.2) {
            hitPlayer();
            o.position.set(Math.random() < 0.5 ? -14 : 14, 1.4, -5);
          }
        }

        // ---- treat ----
        if (G.state === S.PLAY) {
          if (!G.treat) { G.treatT -= dt; if (G.treatT <= 0) { spawnTreat(); } }
          else {
            G.treat.t -= dt;
            G.treat.obj.rotation.y += dt * 2;
            G.treat.obj.position.y = 2.4 + Math.sin(t * 3) * 0.25;
            const o = G.treat.obj;
            if (Math.abs(o.position.x - tober.position.x) < 1.6 && Math.abs(o.position.z - tober.position.z) < 1.8) {
              if (G.treat.heart) { G.hearts = Math.min(5, G.hearts + 1); } else { G.score += 100; }
              blip(880, 0.12, "triangle"); setTimeout(() => blip(1180, 0.12, "triangle"), 90);
              clearTreat(); G.treatT = 14 + Math.random() * 10; syncHUD();
            } else if (G.treat.t <= 0) { clearTreat(); G.treatT = 14 + Math.random() * 10; }
          }
        }

        // ---- out of pumpkins: return to door ----
        if (G.state === S.PLAY && G.pumpkins === 0 && !G.carrying) {
          if (Math.abs(tober.position.x) < 2.2 && tober.position.z < DOOR_Z + 0.4) startCutscene();
        }

        // ---- cutscene ----
        if (G.state === S.CUT) {
          G.cutT += dt;
          gardener.position.x = -18 + G.cutT * 7.5;
          gardener.position.y = Math.abs(Math.sin(G.cutT * 7)) * 0.15;
          tober.position.set(0, 0, DOOR_Z - 1.2);
          // water drops + regrow as he passes each pumpkin spot
          for (let i = 0; i < PUMP_X.length; i++) {
            if (!patch[i].visible && gardener.position.x > PUMP_X[i] - 0.5) {
              patch[i].visible = true; patch[i].scale.setScalar(0.1);
              blip(620 + i * 120, 0.1, "sine");
            }
            if (patch[i].visible && patch[i].scale.x < 1) patch[i].scale.setScalar(Math.min(1, patch[i].scale.x + dt * 2.2));
          }
          if (Math.random() < dt * 25) {
            const d = box(0.14, 0.3, 0.14, 0x7fe3ff, 0.9);
            d.position.set(gardener.position.x + 1.7, 1.7, DIRT_Z + 0.6);
            drops.add(d);
            setTimeout(() => drops.remove(d), 500);
          }
          for (const d of drops.children) d.position.y -= dt * 6;
          if (gardener.position.x > 19) {
            gardener.visible = false;
            for (const d of [...drops.children]) drops.remove(d);
            G.pumpkins = 3; newGapX(); G.state = S.PLAY; G.invuln = 1.0;
            for (const p of patch) { p.visible = true; p.scale.setScalar(1); }
            syncHUD();
          }
        }

        // ---- peeking Tober visibility ----
        peek.visible = G.state === S.CUT;
        if (G.state === S.CUT) tober.visible = false;
        peek.position.y = 3.0 + Math.sin(t * 2) * 0.12;

        // hit flash
        if (G.hitFlash > 0) { G.hitFlash -= dt; flashEl.style.opacity = Math.max(0, G.hitFlash) * 0.5; }
        else flashEl.style.opacity = 0;

        renderer.render(scene, camera);
      }
      requestAnimationFrame(tick);
      syncHUD();
    </script>
  </body>
</html>
