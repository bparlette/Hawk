<style>
  html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

  #cab {
    --S: 1px;
    position: absolute; z-index: 1; left: 0; top: 0;
    width: calc(704 * var(--S)); height: calc(1520 * var(--S));

    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .x-stick { position: absolute; left: 26.99%; top: 57.50%; width: 8.24%; height: 5.39%; transform-origin: 50% 95.1%; transition: transform 70ms ease-out; pointer-events: none; z-index: 3; }
  .x-cap, .x-ring { position: absolute; pointer-events: none; border-radius: 50%; }
  .x-cap {
    z-index: 2; opacity: 0;
    background: url(cabinet_nostick.png) no-repeat;
    background-size: calc(704 * var(--S)) calc(1520 * var(--S));
    background-position: calc(var(--x) * -1 * var(--S)) calc(var(--y) * -1 * var(--S));
    transition: transform 50ms linear, filter 50ms linear;
  }
  .x-cap.on { opacity: 1; transform: translateY(calc(3 * var(--S))); filter: brightness(.72); box-shadow: inset 0 calc(2 * var(--S)) calc(5 * var(--S)) rgba(0,0,0,.65), inset 0 0 calc(3 * var(--S)) rgba(0,0,0,.4); }
  .x-ring { z-index: 1; opacity: 0; background: radial-gradient(circle, #0b0b0e 55%, #050507 72%, rgba(0,0,0,.6) 100%); }
  .x-ring.on { opacity: 1; }
  #screen { position: absolute; left: 23.72%; top: 34.41%; width: 53.41%; height: 17.83%; overflow: hidden; background: #000; }
  #screen canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; background: #000; }
  #screen { --row: 1px; }
  #screen canvas#game { z-index: 0; }
  #screen canvas#bloom { z-index: 1; pointer-events: none; image-rendering: auto; background: transparent; filter: blur(2px); opacity: .35; mix-blend-mode: screen; display: none; }
  #screen.crt canvas#bloom { display: block; }
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(120% 90% at 30% 18%, rgba(255,255,255,.08), transparent 55%);
    box-shadow: inset 0 0 4px 1px rgba(0,0,0,.9);
  }
  #screen.crt::after {
    background:
      radial-gradient(120% 90% at 30% 18%, rgba(255,255,255,.10), rgba(255,255,255,.03) 35%, transparent 60%),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%),
      repeating-linear-gradient(to bottom, transparent 0 var(--row), rgba(0,0,0,.18) var(--row) calc(var(--row) * 2)),
      repeating-linear-gradient(to right, rgba(255,40,40,.05) 0 1px, rgba(40,255,80,.05) 1px 2px, rgba(60,90,255,.05) 2px 3px);
    box-shadow: inset 0 0 28px 8px rgba(0,0,0,.7), inset 0 0 10px 2px rgba(0,0,0,.6), inset 0 0 4px 1px rgba(0,0,0,.9);
    border-radius: 6% / 9%;
  }
  .x-fx { position: absolute; pointer-events: none; transform: translate(-50%, -50%); border-radius: 50%; aspect-ratio: 1; opacity: 0; transition: opacity 60ms linear; }
  .x-btn { width: 9%; }
  .x-btn.on { opacity: 1; box-shadow: 0 0 0 1px var(--c), 0 0 7px 2px var(--c), inset 0 0 5px 1px var(--c); }

  #fsbtn { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.28); background: rgba(10,10,14,.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; touch-action: manipulation; opacity: .8; }
  #fsbtn:active { transform: scale(.92); }
  #fsbtn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #fsbtn .ic-out { display: none; }
  html.fill #fsbtn .ic-in { display: none; }
  html.fill #fsbtn .ic-out { display: block; }
  html.fill, html.fill body { height: 100dvh; }
  html.fill body { background: #000; }
  html.fill #screen::after { border-radius: 0; }
</style>

<script>
(() => {
  "use strict";
  const W = 384, H = 224;
  const LEVEL_W = 1840, FLOOR_TOP = 150, FLOOR_BOT = 215;
  const LOCKS = [0, 380, 760, 1140, 1450];
  const canvas = document.getElementById("game");
  let ctx = canvas.getContext("2d"); // swapped briefly to an offscreen canvas for hit-flash silhouettes
  ctx.imageSmoothingEnabled = false;

  const BROTHERS = [
    { name: "LENNY", mask: "#2f6bff", reach: 20, spd: 14, weapon: "katana" },
    { name: "RAFE", mask: "#e8302a", reach: 14, spd: 10, weapon: "sai" },
    { name: "MIKO", mask: "#ff8c1a", reach: 20, spd: 14, weapon: "nunchaku" },
    { name: "DONNY", mask: "#9b3fe0", reach: 28, spd: 20, weapon: "bo" },
  ];

  const STATE = {
    scene: "title",
    t: 0,
    selectIndex: 0,
    player: null,
    camX: 0,
    showTouch: "ontouchstart" in window,
    muted: false,
    enemies: [], stars: [], fx: [], stop: 0, shake: 0, score: 0,
    wave: 0, locked: false, queue: [], spawnT: 0, goT: 0, clear: false,
    section: "A", phase: "waves", balls: [], ballT: 0, doorT: 0, fadeOut: 0, fadeIn: 0, bWave: 0, bossT: 0, cardT: 0,
    props: [], items: [], nextT: 0, armed: false,
  };
  // Section A waves, easiest first: wave 1 is three easy ninjas, later waves mix in knife throwers (star) and swordsmen
  const WAVES = [
    ["purple", "purple", "purple"],
    ["purple", "star", "purple", "blue"],
    ["purple", "sword", "star", "blue", "purple"],
    ["purple", "star", "sword", "purple"],
    ["sword", "star", "blue", "purple", "sword", "star"],
  ];
  const MAX_ON = 6, WAVE_GAP = 40, CAM_LERP = 0.12;
  const makeProps = () => [
    { kind: "crate", x: 250, y: 162 },
    { kind: "can", x: 640, y: 202, drop: true },
    { kind: "crate", x: 905, y: 194 },
  ].map((o) => ({ ...o, hp: 2, state: "stand", vx: 0, rot: 0, t: 0, flash: 0, hit: new Set() }));
  // Stairs set piece (world x), top landing on the left, bottom step meets the floor at STAIR_X1
  const STAIR_X0 = 1040, STAIR_X1 = 1300, STAIR_TOP = 100, STEPS = 10;
  const stairZ = (x) => { const k = (x - STAIR_X0) / (STAIR_X1 - STAIR_X0); return k < 0 ? STAIR_TOP : k >= 1 ? 0 : STAIR_TOP * (1 - Math.floor(k * STEPS) / STEPS); };
  const END_DOOR = 1805;

  // ---------- Audio ----------
  // Synth-only: master 0.5 -> music bus 0.35 + SFX bus 0.6. Chip sequencer: 3 pulse channels + noise drums.
  let AC = null, MASTER = null, MUSIC = null, SFXBUS = null, NOISE = null, audioMuted = false;
  const PULSE = {};
  function unlockAudio() {
    try {
      if (!AC) {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        audioMuted = STATE.muted;
        MASTER = AC.createGain(); MASTER.gain.value = audioMuted ? 0 : 0.5; MASTER.connect(AC.destination);
        MUSIC = AC.createGain(); MUSIC.gain.value = 0.35; MUSIC.connect(MASTER);
        SFXBUS = AC.createGain(); SFXBUS.gain.value = 0.6; SFXBUS.connect(MASTER);
        NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const nd = NOISE.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
        for (const duty of [0.125, 0.25, 0.5]) { // band-limited pulse waves
          const n = 48, re = new Float32Array(n), im = new Float32Array(n);
          for (let k = 1; k < n; k++) { re[k] = Math.sin(2 * Math.PI * k * duty) / (Math.PI * k); im[k] = (1 - Math.cos(2 * Math.PI * k * duty)) / (Math.PI * k); }
          PULSE[duty] = AC.createPeriodicWave(re, im);
        }
        schedTick();
      }
      if (AC.state !== "running" && !document.hidden) AC.resume().catch(() => {}); // "suspended" or iOS "interrupted"
    } catch (e) {}
  }
  // One-shot oscillator: wave is a pulse duty (number) or an oscillator type. Returns the oscillator for extra pitch steps.
  function osc(wave, f0, f1, t, dur, vol, out, atk = 0.004) {
    const o = AC.createOscillator(), g = AC.createGain();
    if (typeof wave === "number") o.setPeriodicWave(PULSE[wave]); else o.type = wave;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
    return o;
  }
  function noise(t, dur, vol, out, type = "lowpass", f0 = 8000, f1 = f0, q = 1, atk = 0.003) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NOISE; s.loop = true;
    f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  // Sustained chip note for the sequencer
  function note(duty, m, t, dur, vol, out) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.setPeriodicWave(PULSE[duty]); o.frequency.setValueAtTime(440 * Math.pow(2, (m - 69) / 12), t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.setTargetAtTime(vol * 0.6, t + 0.01, dur * 0.4); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.01);
  }
  const DRUM = {
    k: (t, o) => { osc("sine", 150, 40, t, 0.14, 0.9, o); noise(t, 0.03, 0.3, o, "lowpass", 1200); },
    s: (t, o) => { noise(t, 0.13, 0.5, o, "bandpass", 1900, 1100, 0.8); osc("triangle", 190, 140, t, 0.07, 0.3, o); },
    h: (t, o) => noise(t, 0.035, 0.16, o, "highpass", 7000),
    o: (t, o) => noise(t, 0.12, 0.14, o, "highpass", 6500),
  };

  // ---- Song data (original). Notes as "NAME:16ths", "." is a rest. ----
  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const midi = (n) => PC[n[0]] + (n[1] === "#" ? 1 : 0) + 12 * (parseInt(n.slice(n[1] === "#" ? 2 : 1), 10) + 1);
  function seq(str) {
    const ev = []; let s = 0;
    for (const tok of str.trim().split(/\s+/)) { const [n, l] = tok.split(":"); if (n !== ".") ev.push({ s, m: midi(n), l: +l }); s += +l; }
    return ev;
  }
  const CH = { Em: [40, 43, 47], C: [36, 40, 43], D: [38, 42, 45], B: [35, 39, 42], Am: [45, 48, 52], G: [43, 47, 50],
    F: [41, 45, 48], E: [40, 44, 47], Dm: [38, 41, 45], Edim: [40, 43, 46], Ddim: [38, 41, 44], Fx: [41, 44, 47], Gx: [43, 46, 49] };
  const bassLine = (chords, pat) => chords.flatMap((c, i) => pat.map((d, k) => ({ s: i * 16 + k * 2, m: CH[c][0] + d, l: 2 })));
  const arpLine = (chords, up, order) => chords.flatMap((c, i) => Array.from({ length: 16 }, (_, j) => {
    const tones = [CH[c][0], CH[c][1], CH[c][2], CH[c][0] + 12];
    return { s: i * 16 + j, m: tones[order[j % order.length]] + up, l: 1 };
  }));
  function track(o) {
    const steps = o.chords.length * 16, map = (ev) => { const a = []; for (const e of ev) a[e.s] = e; return a; };
    return { bpm: o.bpm, loop: o.loop, steps, ch: [map(seq(o.lead)), map(o.bass), map(o.arp)], drums: o.drums.join("") };
  }
  const rep = (s, n) => Array(n).fill(s);

  // a) Title: upbeat 16-bar rock riff, E minor, 150 BPM
  const T_CH = ["Em", "Em", "C", "D", "Em", "Em", "C", "B", "Am", "C", "G", "D", "Em", "C", "B", "B"];
  const T_RIFF = "E5:2 .:1 E5:1 G5:2 E5:2 B5:3 A5:1 G5:2 F#5:2";
  const TITLE = track({ bpm: 150, loop: true, chords: T_CH,
    lead: [T_RIFF, "E5:2 D5:2 E5:4 .:4 B4:2 D5:2", "E5:2 .:1 E5:1 G5:2 E5:2 C6:3 B5:1 A5:2 G5:2", "F#5:4 A5:4 D5:4 F#5:2 A5:2",
      T_RIFF, "E5:2 G5:2 B5:4 .:2 A5:2 G5:2 E5:2", "G5:2 A5:2 C6:4 B5:2 A5:2 G5:2 E5:2", "D#5:4 F#5:4 B5:6 .:2",
      "A5:3 G5:1 A5:2 C6:2 B5:2 A5:2 G5:2 E5:2", "G5:4 E5:2 C5:2 E5:4 G5:4", "B5:3 A5:1 B5:2 D6:2 B5:2 G5:2 D5:4", "F#5:2 E5:2 F#5:2 A5:2 D6:4 C6:2 A5:2",
      "B5:2 .:1 B5:1 G5:2 E5:2 G5:2 A5:2 B5:4", "C6:2 B5:2 A5:2 G5:2 E5:4 G5:4", "F#5:2 D#5:2 F#5:2 A5:2 B5:4 A5:4", "D#6:2 B5:2 F#5:2 D#5:2 B4:4 .:4"].join(" "),
    bass: bassLine(T_CH, [0, 0, 12, 0, 0, 0, 12, 7]),
    arp: arpLine(T_CH, 24, [0, 1, 2, 1]),
    drums: [...rep("k.h.s.h.k.hks.h.", 7), "k.h.s.h.k.s.ssss", ...rep("k.h.s.h.k.hks.h.", 7), "k.s.s.s.ssssssso"] });

  // b) Stage: driving 32-bar loop, A minor, 160 BPM
  const S_CH = ["Am", "Am", "F", "G", "Am", "Am", "F", "E", "Dm", "Dm", "Am", "Am", "F", "G", "E", "E",
    "Am", "Am", "F", "G", "Am", "Am", "F", "E", "F", "G", "Em", "Am", "Dm", "F", "E", "E"];
  const S_A = ["A4:2 C5:2 E5:2 A5:2 G5:3 E5:1 D5:2 E5:2", "C5:2 .:2 A4:2 C5:2 D5:4 E5:4", "F5:2 E5:2 F5:2 A5:2 C6:3 A5:1 F5:4",
    "G5:2 F5:2 G5:2 B5:2 D6:4 B5:4", "A4:2 C5:2 E5:2 A5:2 G5:3 E5:1 D5:2 E5:2", "C6:2 B5:2 A5:2 G5:2 E5:4 C5:4"];
  const STAGE = track({ bpm: 160, loop: true, chords: S_CH,
    lead: [...S_A, "F5:3 G5:1 A5:2 F5:2 C5:2 F5:2 A5:4", "G#5:4 B5:4 E5:4 G#4:4",
      "D5:4 F5:2 A5:2 D6:6 C6:2", "A5:2 F5:2 D5:2 F5:2 A5:4 .:4", "C6:4 A5:2 E5:2 C6:2 B5:2 A5:4", "E5:2 A5:2 C6:2 E6:2 D6:4 C6:4",
      "C6:2 A5:2 F5:2 A5:2 C6:4 D6:4", "B5:2 G5:2 D5:2 G5:2 B5:4 D6:4", "E6:6 D6:2 B5:4 G#5:4", "E5:2 F5:2 G#5:2 A5:2 B5:4 .:4",
      ...S_A, "A5:2 C6:2 F6:4 E6:2 C6:2 A5:4", "B5:2 G#5:2 E5:2 G#5:2 B5:4 E6:4",
      "A5:4 .:2 A5:2 G5:2 F5:2 E5:4", "D5:4 .:2 D5:2 E5:2 F5:2 G5:4", "B5:4 .:2 B5:2 A5:2 G5:2 E5:4", "C6:4 B5:2 A5:2 E5:8",
      "F5:2 A5:2 D6:2 A5:2 F6:4 E6:4", "C6:2 A5:2 F5:2 A5:2 C6:4 F6:4", "E6:4 D6:4 C6:4 B5:4", "G#5:2 B5:2 E6:2 B5:2 G#5:4 E5:4"].join(" "),
    bass: bassLine(S_CH, [0, 0, 12, 0, 0, 12, 7, 12]),
    arp: arpLine(S_CH, 24, [0, 1, 2, 3, 2, 1]),
    drums: Array.from({ length: 32 }, (_, i) => (i % 8 === 7 ? "k.h.s.hks.sss.ss" : "k.h.s.hkk.h.s.ho")) });

  // c) Boss (Zap-Roller): tense, 170 BPM, chromatic bass
  const B_CH = ["Em", "Em", "Fx", "Em", "Gx", "Edim", "Ddim", "Em"];
  const BOSS = track({ bpm: 170, loop: true, chords: B_CH,
    lead: ["E5:1 .:1 E5:1 .:1 F5:2 E5:2 .:2 B4:2 C5:2 B4:2", "E5:4 G5:2 F5:2 E5:4 D#5:4", "F5:1 .:1 F5:1 .:1 G5:2 F5:2 .:2 C5:2 C#5:2 C5:2",
      "E5:4 A#5:4 B5:6 .:2", "B5:2 A#5:2 A5:2 G#5:2 G5:2 F#5:2 F5:2 E5:2", "E5:2 G5:2 A#5:4 G5:2 E5:2 C#5:4",
      "D5:2 F5:2 G#5:4 F5:2 D5:2 B4:4", "E5:2 .:2 E6:2 .:2 D#6:2 D6:2 C#6:2 C6:2"].join(" "),
    bass: bassLine(B_CH, [0, 0, 1, 0, 0, 1, 2, 1]),
    arp: arpLine(B_CH, 24, [0, 3, 1, 3, 2, 3]),
    drums: Array.from({ length: 8 }, (_, i) => (i === 7 ? "k.hks.hkk.s.ssss" : "khhkshhkkhhkshho")) });

  // d) Stage-clear jingle (plays once)
  const CLEAR = { bpm: 150, loop: false, steps: 32, drums: "k...s...k.k.s.s.k...............",
    ch: [seq("C5:2 E5:2 G5:2 C6:4 B5:2 C6:2 D6:2 E6:12 .:4"), [{ s: 0, m: 48, l: 4 }, { s: 4, m: 43, l: 4 }, { s: 8, m: 48, l: 4 }, { s: 12, m: 43, l: 4 }, { s: 16, m: 48, l: 12 }],
      arpLine(["C", "C"], 24, [0, 1, 2, 3]).slice(0, 28)].map((ev) => { const a = []; for (const e of ev) a[e.s] = e; return a; }) };
  const TRACKS = { title: TITLE, stage: STAGE, boss: BOSS, clear: CLEAR };
  const VOICE = [[0.25, 0.2, 0.92], [0.5, 0.24, 0.8], [0.125, 0.08, 0.9]]; // lead, bass, arp: duty, volume, gate

  // ---- Lookahead scheduler: every 25ms, schedule 100ms ahead; 300ms crossfades ----
  const MUS = { cur: undefined, live: [] };
  function playTrack(name) {
    const t = AC.currentTime;

    if (LOOP.acc >= STEP) LOOP.acc = 0; // still behind after the cap: drop the backlog
    updateCabFx();
    if (!steps) return; // nothing changed since the last draw
    const t0 = DEBUG ? performance.now() : 0;
    ctx.clearRect(0, 0, W, H);
    SCENES[STATE.scene].draw();
    drawSpeaker();
    if (crtOn()) { bloomCtx.clearRect(0, 0, 192, 112); bloomCtx.drawImage(canvas, 0, 0, 192, 112); } // bloom only while its layer shows
    if (DEBUG) {
      DBG.ms += performance.now() - t0; DBG.frames++; DBG.ticks += steps;
      if (!DBG.t0) DBG.t0 = now;
      if (now - DBG.t0 >= 500) {
        const s = (now - DBG.t0) / 1000;
        let parts = 0; for (const q of POOL) if (q.on) parts++;
        DBG.el.textContent = `FPS ${(DBG.frames / s).toFixed(0)}  TPS ${(DBG.ticks / s).toFixed(0)}\ndraw ${(DBG.ms / DBG.frames).toFixed(2)}ms\n` +
          `${STATE.scene}${STATE.scene === "stage" ? ` ${STATE.section}/${STATE.phase} w${STATE.wave}` : ""}\n` +
          `enemies ${STATE.enemies.length} fx ${STATE.fx.length} vfx ${parts}\nHP ${STATE.player ? STATE.player.hp : "-"} audio ${AC ? AC.state : "off"}`;
        DBG.t0 = now; DBG.frames = 0; DBG.ticks = 0; DBG.ms = 0;
      }
    }
  }
  let crtCache = screenEl.classList.contains("crt");
  const crtOn = () => crtCache;
  new MutationObserver(() => { crtCache = screenEl.classList.contains("crt"); }).observe(screenEl, { attributes: true, attributeFilter: ["class"] });
  requestAnimationFrame(frame);
})();
</script>
<script>
  // ---------- Full-screen toggle (top right) ----------
  (function () {
    const btn = document.getElementById("fsbtn"), root = document.documentElement;
    const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
    const refit = () => { dispatchEvent(new Event("resize")); setTimeout(() => dispatchEvent(new Event("resize")), 300); };
    function setFill(on) {
      root.classList.toggle("fill", on);
      btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      if (on) scrollTo(0, 1);
      refit();
    }
    function toggle() {
      const on = !root.classList.contains("fill");
      try {
        if (on) {
          const r = root.requestFullscreen || root.webkitRequestFullscreen;
          if (r) { const p = r.call(root, { navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); }
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("any").catch(() => {});
        } else if (fsEl()) {
          const x = document.exitFullscreen || document.webkitExitFullscreen;
          if (x) { const p = x.call(document); if (p && p.catch) p.catch(() => {}); }
        }
      } catch (e) {}
      setFill(on);
    }
    btn.addEventListener("pointerdown", (e) => e.stopPropagation());
    btn.addEventListener("pointerup", (e) => { e.preventDefault(); e.stopPropagation(); toggle(); });
    btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    ["fullscreenchange", "webkitfullscreenchange"].forEach((t) => document.addEventListener(t, () => { if (!fsEl() && root.classList.contains("fill") && root.dataset.fsReal) setFill(false); root.dataset.fsReal = fsEl() ? "1" : ""; refit(); }));
    if (navigator.standalone || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches) setFill(true);
    // Turning the phone sideways locks the game into full screen; turning it back upright restores the cabinet
    // (unless the player turned full screen on themselves with the button).
    const land = matchMedia("(orientation: landscape) and (pointer: coarse)");
    let auto = false;
    function onOrient() {
      const on = root.classList.contains("fill");
      if (land.matches && !on) { auto = true; setFill(true); }
      else if (!land.matches && on && auto) { auto = false; setFill(false); }
    }
    btn.addEventListener("pointerup", () => { auto = false; }, true);
    if (land.addEventListener) land.addEventListener("change", onOrient); else land.addListener(onOrient);
    addEventListener("orientationchange", () => setTimeout(onOrient, 50));
    onOrient();
  })();
</script>
