<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,minimum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<meta name="description" content="Toad City Skate: 2-minute skate runs through Toad City Baltimore's Inner Harbor. Ollies, kickflips, stoop-rail grinds, manuals, S-K-A-T-E letters and the Harbor Gap.">
<title>Toad City Skate</title>
<style>
  :root { --ink: #14101f; --yel: #ffd23c; --pink: #ff5fa2; --cyan: #7fe8ff; --grn: #7dff6b; --pur: #6a3ab8; --font: Impact, "Haettenschweiler", "Arial Narrow Bold", "Avenir Next Condensed", "Arial Black", "DejaVu Sans", sans-serif; --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f17; touch-action: none; overscroll-behavior: none; position: fixed; width: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { font-family: var(--font); color: #fff; }
  #gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
  .ui { position: fixed; z-index: 10; pointer-events: none; }
  .ol { -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
  /* top bar: score + special, timer, goals */
  #scoreBox { left: calc(var(--sal) + 10px); top: calc(var(--sat) + 8px); }
  #scoreN { font-size: 30px; line-height: 1; font-style: italic; letter-spacing: 1px; color: #fff; }
  #scoreL { font: 900 9px/1 var(--ui); letter-spacing: 2px; color: var(--yel); margin-bottom: 2px; text-shadow: 1px 1px 0 var(--ink); }
  #spec { width: 132px; height: 13px; margin-top: 5px; transform: skewX(-16deg); background: var(--ink); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); position: relative; overflow: hidden; }
  #specF { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(#ffe98a, #ffb31a); transition: width .12s; }
  #spec.on #specF { background: linear-gradient(90deg, #ff5fa2, #ffd23c, #7fe8ff, #ff5fa2); background-size: 200% 100%; animation: specflow .6s linear infinite; }
  #spec.on { box-shadow: 3px 3px 0 var(--ink), 0 0 14px #ffd23c; }
  #specT { position: absolute; inset: 0; font: 900 8px/13px var(--ui); letter-spacing: 2px; text-align: center; color: var(--ink); opacity: 0; transform: skewX(16deg); }
  #spec.on #specT { opacity: 1; }
  @keyframes specflow { to { background-position: -200% 0; } }
  #timer { left: 50%; top: calc(var(--sat) + 6px); transform: translateX(-50%); font-size: 34px; font-style: italic; line-height: 1; padding: 4px 12px 5px; background: var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 rgba(0,0,0,.35); color: var(--yel); letter-spacing: 1px; }
  #timer.low { color: #ff5f6e; animation: tpulse .5s infinite alternate; }
  @keyframes tpulse { to { transform: translateX(-50%) scale(1.1); } }
  #goals { right: calc(var(--sar) + 10px); top: calc(var(--sat) + 8px); display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 330px; }
  .gc { font: 900 10px/1 var(--ui); letter-spacing: .5px; padding: 5px 7px; border-radius: 6px; background: rgba(20,16,31,.82); border: 2px solid var(--ink); color: #b9b2d0; white-space: nowrap; }
  .gc.done { background: var(--grn); color: var(--ink); }
  .gc b { display: inline-block; width: 10px; text-align: center; color: #6a6488; }
  .gc b.on { color: var(--yel); }
  .gc.done b.on { color: var(--ink); }
  /* trick string */
  #trick { left: 50%; bottom: calc(var(--sab) + 28%); transform: translateX(-50%); text-align: center; width: 94vw; max-width: 760px; transition: opacity .25s; opacity: 0; }
  #trick.on { opacity: 1; }
  #trickL { font: italic 900 15px/1.25 var(--ui); color: #fff; text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); overflow: hidden; max-height: 2.6em; }
  #trickP { font-size: 30px; font-style: italic; line-height: 1.05; color: var(--yel); }
  #trickP span { color: var(--cyan); }
  #trick.bank #trickP { color: var(--grn); } #trick.bail #trickP { color: #ff5f6e; text-decoration: line-through; }
  /* balance meter */
  #bal { left: 50%; top: 40%; width: 150px; height: 12px; margin-left: -75px; border-radius: 7px; background: rgba(20,16,31,.75); border: 2px solid var(--ink); display: none; }
  #bal::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--grn); }
  #balK { position: absolute; top: -4px; width: 10px; height: 16px; margin-left: -5px; left: 50%; border-radius: 3px; background: var(--yel); border: 2px solid var(--ink); }
  #bal.v { transform: rotate(90deg); }
  #bal.warn #balK { background: #ff5f6e; }
  /* banner + toasts */
  #banner { left: 50%; top: 31%; transform: translate(-50%, -50%) rotate(-5deg) scale(.6); font-size: 50px; font-style: italic; color: var(--pink); opacity: 0; transition: opacity .18s, transform .18s; white-space: nowrap; text-align: center; }
  #banner.on { opacity: 1; transform: translate(-50%, -50%) rotate(-5deg) scale(1); }
  #banner small { display: block; font-size: 18px; color: var(--yel); margin-top: 2px; }
  #toast { left: 50%; top: calc(var(--sat) + 92px); transform: translateX(-50%); font: 900 12px/1.25 var(--ui); padding: 7px 12px; border-radius: 16px; background: rgba(20,16,31,.88); border: 2px solid var(--ink); color: #fff; white-space: nowrap; opacity: 0; transition: opacity .3s; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; } #toast b { color: var(--yel); }
  #count { left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 110px; font-style: italic; color: var(--yel); opacity: 0; }
  #count.on { opacity: 1; animation: cpop .9s ease-out; }
  @keyframes cpop { from { transform: translate(-50%, -50%) scale(1.8); } to { transform: translate(-50%, -50%) scale(1); } }
  /* touch deck */
  #touch { position: fixed; left: 0; right: 0; bottom: 0; height: 250px; z-index: 12; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  #stickZone { position: absolute; left: 0; bottom: 0; width: 50%; height: 100%; pointer-events: auto; touch-action: none; }
  #stickBase { position: absolute; left: calc(var(--sal) + 26px); bottom: calc(var(--sab) + 30px); width: 124px; height: 124px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 40%, rgba(20,16,31,.45) 41%); border: 3px solid rgba(20,16,31,.9); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, var(--yel) 55%, #d89a10); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: flex; align-items: center; justify-content: center; font: italic 900 12px/1 var(--ui); color: var(--ink); letter-spacing: .5px; -webkit-tap-highlight-color: transparent; }
  .tb.dn { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); filter: brightness(1.15); }
  #bOllie { right: calc(var(--sar) + 18px); bottom: calc(var(--sab) + 26px); width: 84px; height: 84px; background: var(--yel); font-size: 15px; }
  #bFlip { right: calc(var(--sar) + 112px); bottom: calc(var(--sab) + 18px); width: 64px; height: 64px; background: var(--pink); }
  #bGrab { right: calc(var(--sar) + 26px); bottom: calc(var(--sab) + 122px); width: 64px; height: 64px; background: var(--cyan); }
  #bGrind { right: calc(var(--sar) + 104px); bottom: calc(var(--sab) + 96px); width: 68px; height: 68px; background: var(--grn); font-size: 11px; }
  #bSpec { right: calc(var(--sar) + 112px); bottom: calc(var(--sab) + 176px); width: 56px; height: 56px; background: #8a82a8; font-size: 9px; color: #2a2440; }
  #bSpec.on { background: radial-gradient(circle, #fff 0 20%, var(--yel) 60%, var(--pink)); color: var(--ink); animation: specbtn .5s infinite alternate; }
  @keyframes specbtn { to { box-shadow: 3px 3px 0 var(--ink), 0 0 18px #ffd23c; } }
  .corner { position: fixed; z-index: 30; top: calc(var(--sat) + 84px); width: 34px; height: 34px; border-radius: 9px; border: 2px solid var(--ink); background: rgba(20,16,31,.82); color: #fff; font: 900 13px/1 var(--ui); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 2px 2px 0 var(--ink); }
  #pauseB { left: calc(var(--sal) + 10px); }
  #muteB { left: calc(var(--sal) + 50px); }
  #muteB.off { color: #6a6488; text-decoration: line-through; }
  /* cards */
  .card { position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 440px); max-height: 92vh; max-height: 92dvh; overflow: auto; box-sizing: border-box; padding: 18px 18px 16px; border-radius: 16px; display: none;
    background: radial-gradient(rgba(255,95,162,.16) 1.6px, transparent 1.8px) 0 0 / 9px 9px, linear-gradient(160deg, #241a3c, #14101f 70%); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink), 0 0 0 2px rgba(255,210,60,.35) inset; font-family: var(--ui); text-align: center; }
  .card.on { display: block; animation: cardin .25s ease-out; }
  @keyframes cardin { from { transform: translate(-50%, -46%) scale(.94); opacity: 0; } }
  .logo { font-family: var(--font); font-style: italic; line-height: .9; transform: rotate(-4deg); margin: 4px 0 10px; }
  .logo .a { display: block; font-size: 24px; color: var(--cyan); letter-spacing: 3px; }
  .logo .b { display: block; font-size: 58px; color: var(--yel); letter-spacing: 2px; text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); }
  .sub { font: 800 11px/1.4 var(--ui); letter-spacing: clamp(1px, 0.5vw, 2.5px); white-space: nowrap; color: #cfc6ea; margin-bottom: 10px; }
  .glist { list-style: none; margin: 8px 0 12px; padding: 0; text-align: left; font: 700 13px/1.3 var(--ui); }
  .glist li { display: flex; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.05); margin-bottom: 5px; }
  .glist li i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); background: #3a3352; display: flex; align-items: center; justify-content: center; font: 900 12px/1 var(--ui); font-style: normal; color: var(--ink); }
  .glist li.done i { background: var(--grn); }
  .glist li span { flex: 1; } .glist li small { display: block; color: #a9a0c8; font-weight: 600; font-size: 11px; }
  .btn { all: unset; box-sizing: border-box; display: inline-block; cursor: pointer; padding: 13px 26px; border-radius: 12px; background: var(--yel); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font: italic 900 20px/1 var(--font); letter-spacing: 1.5px; min-width: 190px; text-align: center; touch-action: manipulation; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn.alt { background: #e9e4ff; font-size: 15px; min-width: 120px; padding: 10px 16px; margin-top: 8px; }
  .keys { font: 600 11px/1.6 var(--ui); color: #b9b2d0; margin-top: 12px; }
  .keys b { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #e9e4ff; color: var(--ink); font-weight: 900; margin: 0 1px; }
  #rScore { font: italic 900 54px/1 var(--font); color: var(--yel); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); margin: 2px 0 2px; }
  #rRank { font: 900 13px/1.25 var(--ui); letter-spacing: clamp(1px, 0.6vw, 3px); color: var(--pink); margin-bottom: 8px; }
  #rBest { font: 800 11px/1 var(--ui); letter-spacing: 1.5px; color: var(--grn); min-height: 12px; margin-bottom: 4px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0 4px; font: 700 12px/1.25 var(--ui); }
  .stats div { background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px; } .stats b { display: block; font: italic 900 17px/1.1 var(--font); color: #fff; letter-spacing: .5px; }
  #loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(rgba(255,95,162,.14) 1.6px, transparent 1.8px) 0 0 / 9px 9px, #14101f; font: 800 12px/1 var(--ui); letter-spacing: 3px; color: #cfc6ea; }
  #loading .logo .b { font-size: 46px; }
  #loading.gone { display: none; }
  @media (max-width: 600px) { #goals { left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); top: calc(var(--sat) + 92px); justify-content: center; max-width: none; } #toast { top: calc(var(--sat) + 124px); } #scoreN { font-size: 26px; } #spec { width: 112px; }
    .corner { top: calc(var(--sat) + 8px); left: auto !important; } #pauseB { right: calc(var(--sar) + 10px); } #muteB { right: calc(var(--sar) + 50px); } #timer { font-size: 30px; } }
  html.demo-embed #touch { display: none !important; } /* inside the Brad's Demos shell its own control panel drives the keys */
  @media (orientation: landscape) and (max-height: 500px) { #touch { height: 200px; } #trick { bottom: calc(var(--sab) + 22%); } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="loading"><div class="logo"><span class="a">TOAD CITY</span><span class="b">SKATE</span></div><div id="loadT">BUILDING THE INNER HARBOR…</div></div>
<div class="ui" id="scoreBox"><div id="scoreL">SCORE</div><div id="scoreN" class="ol">0</div><div id="spec"><i id="specF"></i><div id="specT">SPECIAL!</div></div></div>
<div class="ui ol" id="timer">2:00</div>
<div class="ui" id="goals"></div>
<div class="ui" id="trick"><div id="trickL"></div><div id="trickP" class="ol"></div></div>
<div class="ui" id="bal"><i id="balK"></i></div>
<div class="ui ol" id="banner"></div>
<div class="ui" id="toast"></div>
<div class="ui ol" id="count"></div>
<button class="corner" id="pauseB" aria-label="Pause">II</button>
<button class="corner" id="muteB" aria-label="Sound on or off">♪</button>
<div id="touch">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div class="tb" id="bOllie" data-k="ollie">OLLIE</div>
  <div class="tb" id="bFlip" data-k="flip">FLIP</div>
  <div class="tb" id="bGrab" data-k="grab">GRAB</div>
  <div class="tb" id="bGrind" data-k="grind">GRIND</div>
  <div class="tb" id="bSpec" data-k="special">SPECIAL</div>
</div>
<div class="card" id="titleC">
  <div class="logo"><span class="a">TOAD CITY</span><span class="b">SKATE</span></div>
  <div class="sub">INNER HARBOR · BALTIMORE · 2:00 RUN</div>
  <ul class="glist" id="tGoals"></ul>
  <button class="btn" id="startB">SKATE</button>
  <div class="keys" id="tKeys"></div>
</div>
<div class="card" id="pauseC">
  <div class="logo"><span class="b" style="font-size:44px">PAUSED</span></div>
  <ul class="glist" id="pGoals"></ul>
  <button class="btn" id="resumeB">RESUME</button><br>
  <button class="btn alt" id="restartB">RESTART RUN</button>
</div>
<div class="card" id="resC">
  <div class="logo"><span class="a" id="rHead">TIME!</span></div>
  <div id="rScore">0</div>
  <div id="rRank"></div>
  <div id="rBest"></div>
  <div class="stats" id="rStats"></div>
  <ul class="glist" id="rGoals"></ul>
  <button class="btn" id="retryB">RETRY</button>
</div>
<script type="module">
/*GAME*/
</script>
</body>
</html>
