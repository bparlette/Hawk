<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <title>Gem Columns</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
        font-family: ui-monospace, "Courier New", monospace; color: #eee; touch-action: none; }
      #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; width: 100%; gap: 8px; }
      #stage { position: relative; line-height: 0; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
      #crt { position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px); }
      #pad { display: none; width: 100%; max-width: 680px; padding: 0 12px 12px;
        justify-content: space-between; align-items: flex-end; }
      #stick { flex: none; position: relative; width: min(46vw, 240px); height: min(46vw, 240px); border-radius: 50%; border: 3px solid #555; background: radial-gradient(circle, #2b2b2b 0 58%, #151515 59%); touch-action: none; user-select: none; -webkit-user-select: none; }
      #stick.on { border-color: #e74c3c; }
      #knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; border: 2px solid #999; background: radial-gradient(circle at 35% 35%, #8a8a8a, #2e2e2e); pointer-events: none; }
      .key { background: #1b1b1b; border: 2px solid #444; border-radius: 10px; color: #ddd;
        font: bold 20px ui-monospace, monospace; display: flex; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none; touch-action: none; }
      .key.on { background: #c0392b; border-color: #e74c3c; }
      .btns { display: flex; gap: 14px; align-items: center; }
      .btns .key { width: min(24vw, 116px); height: min(24vw, 116px); border-radius: 50%; font-size: 32px; }
      #misc { display: flex; gap: 10px; }
      #misc .key { width: 64px; height: 36px; font-size: 13px; }
      @media (max-width: 760px), (orientation: portrait) {
        #wrap { justify-content: flex-start; padding-top: 6px; }
        #pad { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="c" width="320" height="240"></canvas>
        <div id="crt"></div>
      </div>
      <div id="misc">
        <div class="key" data-k="Enter">||</div>
        <div class="key" data-k="KeyM">MUTE</div>
      </div>
      <div id="pad">
        <div id="stick"><div id="knob"></div></div>
        <div class="btns">
          <div class="key" data-k="KeyX">B</div>
          <div class="key" data-k="KeyZ">A</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var W = 320, H = 240;
        var cv = document.getElementById("c"), ctx = cv.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        /* ---------- scaling ---------- */
        function resize() {
          var pad = document.getElementById("pad");
          var padH = getComputedStyle(pad).display === "none" ? 0 : pad.offsetHeight + 8;
          var aw = window.innerWidth - 4, ah = window.innerHeight - padH - 56;
          var s = Math.max(1, Math.min(aw / W, ah / H));
          cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
        }
        window.addEventListener("resize", resize);

        /* ---------- input ---------- */
        var keys = {}, pressed = {};
        var MAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left",
          KeyA: "left", ArrowRight: "right", KeyD: "right", KeyZ: "a", Space: "a", KeyX: "b",
          Enter: "start", KeyM: "mute" };
        function setKey(code, down) {
          var n = MAP[code]; if (!n) return;
          if (down && !keys[n]) pressed[n] = true;
          keys[n] = down;
        }
        window.addEventListener("keydown", function (e) {
          if (MAP[e.code]) e.preventDefault();
          setKey(e.code, true);
        });
        window.addEventListener("keyup", function (e) { setKey(e.code, false); });
        Array.prototype.forEach.call(document.querySelectorAll(".key"), function (el) {
          var code = el.dataset.k;
          function on(e) { e.preventDefault(); el.classList.add("on"); setKey(code, true); }
          function off(e) { e.preventDefault(); el.classList.remove("on"); setKey(code, false); }
          el.addEventListener("touchstart", on, { passive: false });
          el.addEventListener("touchend", off, { passive: false });
          el.addEventListener("touchcancel", off, { passive: false });
          el.addEventListener("mousedown", on);
          window.addEventListener("mouseup", off);
        });
        /* ---------- 8-way circular touch stick (#stick/#knob), snapped to 45 degrees ---------- */
        (function () {
          var st = document.getElementById("stick"), kn = document.getElementById("knob");
          if (!st || !kn) return;
          var sid = null;
          function clr() { setKey("ArrowRight", false); setKey("ArrowLeft", false); setKey("ArrowDown", false); setKey("ArrowUp", false); }
          function move(e) {
            var r = st.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
            var d = Math.sqrt(dx * dx + dy * dy), mx = Math.max(1, r.width / 2 - kn.offsetWidth / 2), k = d > mx ? mx / d : 1;
            kn.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
            if (d < r.width * 0.08) { clr(); return; }
            var o = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * Math.PI / 4, ux = Math.round(Math.cos(o)), uy = Math.round(Math.sin(o));
            setKey("ArrowRight", ux > 0); setKey("ArrowLeft", ux < 0); setKey("ArrowDown", uy > 0); setKey("ArrowUp", uy < 0);
          }
          function end(e) { if (e.pointerId !== sid) return; sid = null; clr(); kn.style.transform = ""; st.classList.remove("on"); }
          st.addEventListener("pointerdown", function (e) { e.preventDefault(); sid = e.pointerId; try { st.setPointerCapture(sid); } catch (x) {} st.classList.add("on"); move(e); });
          st.addEventListener("pointermove", function (e) { if (e.pointerId === sid) { e.preventDefault(); move(e); } });
          st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
          st.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        })();
        cv.addEventListener("touchstart", function (e) { e.preventDefault(); pressed.start = true; }, { passive: false });
        cv.addEventListener("mousedown", function () { pressed.start = true; });
        var input = { k: keys, p: pressed };
        /* menu taps: canvas position in game pixels, read by the shell menus */
        var tap = null;
        function tapAt(cx, cy) {
          var r = cv.getBoundingClientRect(); if (!r.width) return;
          tap = { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
        }
        cv.addEventListener("touchstart", function (e) { var q = e.changedTouches[0]; if (q) tapAt(q.clientX, q.clientY); }, { passive: false });
        cv.addEventListener("mousedown", function (e) { tapAt(e.clientX, e.clientY); });

        /* ---------- audio ---------- */
        var actx = null, muted = false;
        function beep(freq, dur, type, vol) {
          if (muted) return;
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            var o = actx.createOscillator(), g = actx.createGain();
            o.type = type || "square"; o.frequency.value = freq;
            g.gain.value = vol || 0.06;
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + dur);
          } catch (e) {}
        }
        var nbuf = null;
        function noise(dur, vol, hp) {
          if (muted) return;
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (!nbuf) { nbuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate); var nd = nbuf.getChannelData(0); for (var ni = 0; ni < nd.length; ni++) nd[ni] = Math.random() * 2 - 1; }
            var src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
            src.buffer = nbuf; f.type = "highpass"; f.frequency.value = hp || 1000;
            g.gain.value = vol || 0.05; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
            src.connect(f); f.connect(g); g.connect(actx.destination); src.start(); src.stop(actx.currentTime + dur);
          } catch (e) {}
        }
        function kick() {
          if (muted) return;
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            var o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
            o.type = "sine"; o.frequency.setValueAtTime(150, n); o.frequency.exponentialRampToValueAtTime(45, n + 0.12);
            g.gain.setValueAtTime(0.12, n); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.16);
            o.connect(g); g.connect(actx.destination); o.start(); o.stop(n + 0.17);
          } catch (e) {}
        }
        /* music: GAMES[gi].music = { step: frames per 16th, mel: [Hz|0], bass: [Hz|0], drum: "k.h.s.h..." } */
        function playMusic() {
          var M = GAMES[gi] && GAMES[gi].music; if (!M || state !== "play" || paused || muted || t % M.step !== 0) return;
          var i = Math.floor(t / M.step);
          var m = M.mel[i % M.mel.length]; if (m) beep(m, M.step / 60 * 0.9, M.lead || "square", 0.022);
          var b = M.bass[i % M.bass.length]; if (b) beep(b, M.step / 60 * 1.8, "triangle", 0.05);
          var d = M.drum[i % M.drum.length];
          if (d === "k") kick(); else if (d === "s") noise(0.12, 0.05, 1200); else if (d === "h") noise(0.03, 0.025, 6000);
        }
        var SFX = {
          jump: function () { beep(560, 0.1); beep(760, 0.08); },
          hit: function () { beep(150, 0.3, "sawtooth", 0.08); },
          win: function () { beep(523, 0.12); setTimeout(function(){beep(659,0.12);},110); setTimeout(function(){beep(880,0.2);},220); },
          pick: function () { beep(880, 0.07); beep(1180, 0.07); },
          smash: function () { beep(320, 0.08, "square", 0.07); beep(180, 0.12, "sawtooth", 0.06); }
        };

        /* ---------- pixel text ---------- */
        var FONT = {
          A:"01110100011000111111100011000110001",B:"11110100011111010001100011000111110",
          C:"01110100011000010000100001000101110",D:"11110100011000110001100011000111110",
          E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",
          G:"01110100011000010111100011000101110",H:"10001100011000111111100011000110001",
          I:"11111001000010000100001000010011111",J:"00111000100001000010100101001001100",
          K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",
          M:"10001110111010110001100011000110001",N:"10001110011010110011100011000110001",
          O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",
          Q:"01110100011000110001101011001001101",R:"11110100011000111110101001001010001",
          S:"01111100001000001110000011000011110",T:"11111001000010000100001000010000100",
          U:"10001100011000110001100011000101110",V:"10001100011000110001100010101000100",
          W:"10001100011000110001101011101110001",X:"10001100010101000100010101000110001",
          Y:"10001100011000101010001000010000100",Z:"11111000010001000100010001000011111",
          "0":"01110100111010110101110011000101110","1":"00100011000010000100001000010001110",
          "2":"01110100010000100110010001000011111","3":"11110000100011000010000011000101110",
          "4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
          "6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000",
          "8":"01110100011000101110100011000101110","9":"01110100011000101111000010001001100",
          " ":"00000000000000000000000000000000000","-":"00000000000000011111000000000000000",
          ".":"00000000000000000000000000000000100",":":"00000001000010000000001000010000000",
          "!":"00100001000010000100000000000000100","+":"00000001000010011111001000010000000",
          "/":"00001000100010001000100010001000000","'":"00100001000010000000000000000000000"
        };
        function text(s, x, y, px, col, center) {
          s = String(s).toUpperCase(); px = px || 1; ctx.fillStyle = col || "#fff";
          var w = s.length * 6 * px;
          if (center) x = Math.round(x - w / 2);
          for (var i = 0; i < s.length; i++) {
            var g = FONT[s[i]]; if (!g) continue;
            for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++)
              if (g[r * 5 + c] === "1") ctx.fillRect(x + i * 6 * px + c * px, y + r * px, px, px);
          }
        }

        var gemColumns = {
          title: "GEM COLUMNS",
          music: { step: 8, lead: "square",
            mel: [659,0,523,0,587,659,0,0, 523,0,440,0,494,523,0,0, 587,0,698,0,659,587,0,0, 523,494,440,0,392,0,0,0],
            bass: [110,0,110,0,110,0,131,0, 87,0,87,0,87,0,110,0, 98,0,98,0,98,0,123,0, 82,0,82,0,110,0,82,0],
            drum: "k.h.s.h.k.h.s.hk" },
          goal: "DROP GEM STICKS. LINE UP 3+ OF A COLOUR. CLEAR 45 GEMS.",
          api: null,
          COLS: 6, ROWS: 13, CS: 16, OX: 112, OY: 20,
          // base, light facet, dark facet
          PAL: [["#e0303a", "#ff8a8a", "#8a1020"], ["#f08020", "#ffc070", "#984008"], ["#f0d020", "#fff49a", "#987c00"],
                ["#30c050", "#9cf0a8", "#106a28"], ["#3070f0", "#9cc0ff", "#14318a"], ["#a040e0", "#dca0ff", "#5a1488"]],
          init: function (api) {
            this.api = api;
            this.score = 0; this.cleared = 0; this.won = 0; this.over = 0; this.timer = 0; this.chain = 0;
            this.flash = 0; this.marks = null; this.pops = []; this.das = 0; this.fall = 0;
            this.parts = []; this.lockFx = null; this.shownGems = 0; this.fl = 0; this.flCol = "#fff"; this.barFx = 0; this.shk = 0;
            this.grid = [];
            for (var r = 0; r < this.ROWS; r++) { this.grid.push([]); for (var c = 0; c < this.COLS; c++) this.grid[r].push(-1); }
            this.stars = [];
            for (var i = 0; i < 60; i++) this.stars.push({ x: Math.random() * W, y: Math.random() * H, t: Math.random() * 60 | 0 });
            this.next = this.rand();
            this.spawn();
          },
          burst: function (x, y, n, cols, spd, life, grav) {
            for (var k = 0; k < n; k++) { var an = Math.random() * 6.283, sp = spd * (0.35 + Math.random() * 0.65);
              this.parts.push({ x: x, y: y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - spd * 0.3, t: (life * (0.6 + Math.random() * 0.4)) | 0, col: cols[k % cols.length], g: grav }); }
          },
          rand: function () { return [0, 0, 0].map(function () { return Math.random() * 6 | 0; }); },
          spawn: function () { this.p = { c: 2, r: -2, g: this.next }; this.next = this.rand(); this.fall = 0; },
          // 36 frames/cell (~0.6 s) at start, a gentle step every 10 gems, never faster than 18
          speed: function () { return Math.max(18, 36 - Math.floor(this.cleared / 10) * 4); },
          free: function (c, r) { return c >= 0 && c < this.COLS && r < this.ROWS && (r < 0 || this.grid[r][c] === -1); },
          fits: function (c, r) { return this.free(c, r) && this.free(c, r + 1) && this.free(c, r + 2); },
          lock: function () {
            var P = this.p, k;
            for (k = 0; k < 3; k++) { if (P.r + k < 0) { this.over = 1; SFX.hit(); noise(0.5, 0.09, 300); kick(); setTimeout(function () { beep(110, 0.4, "sawtooth", 0.06); }, 120); this.burst(this.OX + this.COLS * this.CS / 2, this.OY + 8, 36, ["#ff6060", "#fff", "#ffb040", "#ff8a8a"], 2.8, 44, 0.07); this.shk = 16; this.fl = 12; this.flCol = "#ff3030"; return; } this.grid[P.r + k][P.c] = P.g[k]; }
            // landing thunk + a brief white flash on the three locked cells
            this.lockFx = { c: P.c, r: P.r, t: 10 };
            var lbx = this.OX + P.c * this.CS + 8, lby = this.OY + (P.r + 3) * this.CS - 1, lpc = this.PAL[P.g[2]];
            this.burst(lbx, lby, 8, ["#a89c88", "#6c6458", "#cfc6b0"], 1.0, 18, 0.03);
            this.burst(lbx, lby - 2, 4, [lpc[1], "#fff"], 1.3, 16, 0.07);
            this.shk = Math.max(this.shk, 2);
            beep(110, 0.09, "triangle", 0.1); beep(70, 0.12, "square", 0.04); noise(0.07, 0.05, 500); kick();
            this.p = null; this.chain = 0;
            this.check();
          },
          // mark every run of 3+ in all four directions
          check: function () {
            var G = this.grid, M = [], r, c, d, n = 0, dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (r = 0; r < this.ROWS; r++) { M.push([]); for (c = 0; c < this.COLS; c++) M[r].push(false); }
            for (r = 0; r < this.ROWS; r++) for (c = 0; c < this.COLS; c++) {
              var v = G[r][c]; if (v < 0) continue;
              for (d = 0; d < 4; d++) {
                var dr = dirs[d][0], dc = dirs[d][1], len = 1;
                while (r + dr * len < this.ROWS && c + dc * len >= 0 && c + dc * len < this.COLS && G[r + dr * len][c + dc * len] === v) len++;
                if (len >= 3) for (var k = 0; k < len; k++) M[r + dr * k][c + dc * k] = true;
              }
            }
            for (r = 0; r < this.ROWS; r++) for (c = 0; c < this.COLS; c++) if (M[r][c]) n++;
            if (n) { this.marks = M; this.flash = 24; this.chain++; this.shk = 4 + 3 * Math.min(this.chain, 4); this.pendingN = n; }
            else this.spawn();
          },
          resolve: function () {
            var G = this.grid, M = this.marks, r, c, mult = this.chain, pts = this.pendingN * 10 * mult;
            var CS = this.CS, sx = 0, sy = 0, k;
            for (r = 0; r < this.ROWS; r++) for (c = 0; c < this.COLS; c++) if (M[r][c]) {
              // burst: each cleared gem throws sparkles in its colour and white
              var px = this.OX + c * CS + CS / 2, py = this.OY + r * CS + CS / 2, col = this.PAL[G[r][c]];
              for (k = 0; k < 7; k++) { var an = Math.random() * 6.283, sp = 0.6 + Math.random() * 1.8;
                this.parts.push({ x: px, y: py, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 0.8, t: 22 + (Math.random() * 14 | 0), col: k % 3 ? col[1] : "#fff" }); }
              sx += px; sy += py; G[r][c] = -1;
            }
            this.score += pts; this.cleared += this.pendingN;
            sx /= this.pendingN; sy /= this.pendingN;
            this.pops.push({ s: "+" + pts, x: sx, y: sy - 4, t: 50, col: "#ffe14d" });
            if (mult > 1) this.pops.push({ s: "X" + mult + " CHAIN!", x: this.OX + this.COLS * CS / 2, y: sy - 18, t: 60, col: "#ff8a8a", big: 1 });
            for (k = 0; k < Math.min(this.pendingN, 12); k++) this.parts.push({ x: sx + (Math.random() - 0.5) * 24, y: sy + (Math.random() - 0.5) * 16, tx: 54, ty: this.OY + 25, d: k * 2, t: 60, col: k % 2 ? "#9cf0a8" : "#fff", vx: 0, vy: 0 });
            if (mult > 1) this.burst(this.OX + this.COLS * CS / 2, sy, 8 * mult, ["#fff", "#ffe14d", "#ff8a8a"], 2.0 + mult * 0.4, 36, 0.05);
            if (mult > 2) { this.fl = 6 + mult; this.flCol = "#ffffff"; }
            if (this.pendingN >= 6) this.pops.push({ s: "GREAT!", x: sx, y: sy + 10, t: 50, col: "#9cf0a8" });
            // chime climbs four semitones per chain step
            var f0 = 660 * Math.pow(2, (mult - 1) * 4 / 12);
            noise(0.14, 0.04, 4500); beep(f0, 0.08, "square", 0.05);
            setTimeout(function () { beep(f0 * 1.5, 0.12, "triangle", 0.05); }, 60);
            if (mult > 1) setTimeout(function () { beep(f0 * 2, 0.16, "triangle", 0.045); noise(0.2, 0.04, 6500); }, 130);
            if (mult > 2) setTimeout(function () { beep(f0 * 2.5, 0.2, "square", 0.04); kick(); }, 200);
            // gravity: compact each column downward
            for (c = 0; c < this.COLS; c++) {
              var w = this.ROWS - 1;
              for (r = this.ROWS - 1; r >= 0; r--) if (G[r][c] >= 0) { var v = G[r][c]; G[r][c] = -1; G[w--][c] = v; }
            }
            this.marks = null;
            if (this.cleared >= 45) { this.won = 1; SFX.win(); [784, 988, 1175, 1568].forEach(function (f, i) { setTimeout(function () { beep(f, 0.16, "square", 0.04); noise(0.04, 0.02, 7000); }, 260 + i * 110); }); this.fl = 14; this.flCol = "#ffe14d"; this.burst(this.OX + this.COLS * CS / 2, this.OY + 100, 50, ["#ffe14d", "#fff", "#ff8a8a", "#9cf0a8", "#9cc0ff"], 3.2, 50, 0.05); return; }
            this.check();
          },
          update: function (inp) {
            this.timer++;
            for (var i = this.pops.length - 1; i >= 0; i--) { this.pops[i].y -= 0.4; if (--this.pops[i].t <= 0) this.pops.splice(i, 1); }
            for (i = this.parts.length - 1; i >= 0; i--) { var q = this.parts[i]; if (q.tx !== undefined) { if (q.d > 0) { q.d--; q.y -= 0.6; continue; } q.x += (q.tx - q.x) * 0.16; q.y += (q.ty - q.y) * 0.16; if (Math.abs(q.tx - q.x) + Math.abs(q.ty - q.y) < 5) { this.barFx = 10; q.t = 0; } }
              else { q.x += q.vx; q.y += q.vy; q.vy += q.g === undefined ? 0.08 : q.g; q.vx *= 0.97; }
