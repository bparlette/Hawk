<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <title>Pipe Pests</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
        font-family: ui-monospace, "Courier New", monospace; color: #eee; touch-action: none; }
      #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; width: 100%; gap: 8px; }
      #stage { position: relative; line-height: 0; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
      #crt { position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px); }
      #pad { display: none; width: 100%; max-width: 680px; padding: 0 12px 12px;
        justify-content: space-between; align-items: flex-end; }
      #stick { flex: none; position: relative; width: min(46vw, 240px); height: min(46vw, 240px); border-radius: 50%; border: 3px solid #555; background: radial-gradient(circle, #2b2b2b 0 58%, #151515 59%); touch-action: none; user-select: none; -webkit-user-select: none; }
      #stick.on { border-color: #e74c3c; }
      #knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; border: 2px solid #999; background: radial-gradient(circle at 35% 35%, #8a8a8a, #2e2e2e); pointer-events: none; }
      .key { background: #1b1b1b; border: 2px solid #444; border-radius: 10px; color: #ddd;
        font: bold 20px ui-monospace, monospace; display: flex; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none; touch-action: none; }
      .key.on { background: #c0392b; border-color: #e74c3c; }
      .btns { display: flex; gap: 14px; align-items: center; }
      .btns .key { width: min(24vw, 116px); height: min(24vw, 116px); border-radius: 50%; font-size: 32px; }
      #misc { display: flex; gap: 10px; }
      #misc .key { width: 64px; height: 36px; font-size: 13px; }
      @media (max-width: 760px), (orientation: portrait) {
        #wrap { justify-content: flex-start; padding-top: 6px; }
        #pad { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="c" width="320" height="240"></canvas>
        <div id="crt"></div>
      </div>
      <div id="misc">
        <div class="key" data-k="Enter">||</div>
        <div class="key" data-k="KeyM">MUTE</div>
      </div>
      <div id="pad">
        <div id="stick"><div id="knob"></div></div>
        <div class="btns">
          <div class="key" data-k="KeyX">B</div>
          <div class="key" data-k="KeyZ">A</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var W = 320, H = 240;
        var cv = document.getElementById("c"), ctx = cv.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        /* ---------- scaling ---------- */
        function resize() {
          var pad = document.getElementById("pad");
          var padH = getComputedStyle(pad).display === "none" ? 0 : pad.offsetHeight + 8;
          var aw = window.innerWidth - 4, ah = window.innerHeight - padH - 56;
          var s = Math.max(1, Math.min(aw / W, ah / H));
          cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
        }
        window.addEventListener("resize", resize);

        /* ---------- input ---------- */
        var keys = {}, pressed = {};
        var MAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left",
          KeyA: "left", ArrowRight: "right", KeyD: "right", KeyZ: "a", Space: "a", KeyX: "b",
          Enter: "start", KeyM: "mute" };
        function setKey(code, down) {
          var n = MAP[code]; if (!n) return;
          if (down && !keys[n]) pressed[n] = true;
          keys[n] = down;
        }
        window.addEventListener("keydown", function (e) {
          if (MAP[e.code]) e.preventDefault();
          setKey(e.code, true);
        });
        window.addEventListener("keyup", function (e) { setKey(e.code, false); });
        Array.prototype.forEach.call(document.querySelectorAll(".key"), function (el) {
          var code = el.dataset.k;
          function on(e) { e.preventDefault(); el.classList.add("on"); setKey(code, true); }
          function off(e) { e.preventDefault(); el.classList.remove("on"); setKey(code, false); }
          el.addEventListener("touchstart", on, { passive: false });
          el.addEventListener("touchend", off, { passive: false });
          el.addEventListener("touchcancel", off, { passive: false });
          el.addEventListener("mousedown", on);
          window.addEventListener("mouseup", off);
        });
        /* ---------- 8-way circular touch stick (#stick/#knob), snapped to 45 degrees ---------- */
        (function () {
          var st = document.getElementById("stick"), kn = document.getElementById("knob");
          if (!st || !kn) return;
          var sid = null;
          function clr() { setKey("ArrowRight", false); setKey("ArrowLeft", false); setKey("ArrowDown", false); setKey("ArrowUp", false); }
          function move(e) {
            var r = st.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
            var d = Math.sqrt(dx * dx + dy * dy), mx = Math.max(1, r.width / 2 - kn.offsetWidth / 2), k = d > mx ? mx / d : 1;
            kn.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
            if (d < r.width * 0.08) { clr(); return; }
            var o = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * Math.PI / 4, ux = Math.round(Math.cos(o)), uy = Math.round(Math.sin(o));
            setKey("ArrowRight", ux > 0); setKey("ArrowLeft", ux < 0); setKey("ArrowDown", uy > 0); setKey("ArrowUp", uy < 0);
          }
          function end(e) { if (e.pointerId !== sid) return; sid = null; clr(); kn.style.transform = ""; st.classList.remove("on"); }
          st.addEventListener("pointerdown", function (e) { e.preventDefault(); sid = e.pointerId; try { st.setPointerCapture(sid); } catch (x) {} st.classList.add("on"); move(e); });
          st.addEventListener("pointermove", function (e) { if (e.pointerId === sid) { e.preventDefault(); move(e); } });
          st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
          st.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        })();
        cv.addEventListener("touchstart", function (e) { e.preventDefault(); pressed.start = true; }, { passive: false });
        cv.addEventListener("mousedown", function () { pressed.start = true; });
        var input = { k: keys, p: pressed };
        /* menu taps: canvas position in game pixels, read by the shell menus */
        var tap = null;
        function tapAt(cx, cy) {
          var r = cv.getBoundingClientRect(); if (!r.width) return;
          tap = { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
        }
        cv.addEventListener("touchstart", function (e) { var q = e.changedTouches[0]; if (q) tapAt(q.clientX, q.clientY); }, { passive: false });
        cv.addEventListener("mousedown", function (e) { tapAt(e.clientX, e.clientY); });

        /* ---------- audio ---------- */
        var actx = null, muted = false;
        function beep(freq, dur, type, vol) {
          if (muted) return;
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            var o = actx.createOscillator(), g = actx.createGain();
            o.type = type || "square"; o.frequency.value = freq;
            g.gain.value = vol || 0.06;
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + dur);
          } catch (e) {}
        }
        var SFX = {
          jump: function () { beep(560, 0.1); beep(760, 0.08); },
          hit: function () { beep(150, 0.3, "sawtooth", 0.08); },
          win: function () { beep(523, 0.12); setTimeout(function(){beep(659,0.12);},110); setTimeout(function(){beep(880,0.2);},220); },
          pick: function () { beep(880, 0.07); beep(1180, 0.07); },
          smash: function () { beep(320, 0.08, "square", 0.07); beep(180, 0.12, "sawtooth", 0.06); }
        };

        /* ---------- pixel text ---------- */
        var FONT = {
          A:"01110100011000111111100011000110001",B:"11110100011111010001100011000111110",
          C:"01110100011000010000100001000101110",D:"11110100011000110001100011000111110",
          E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",
          G:"01110100011000010111100011000101110",H:"10001100011000111111100011000110001",
          I:"11111001000010000100001000010011111",J:"00111000100001000010100101001001100",
          K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",
          M:"10001110111010110001100011000110001",N:"10001110011010110011100011000110001",
          O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",
          Q:"01110100011000110001101011001001101",R:"11110100011000111110101001001010001",
          S:"01111100001000001110000011000011110",T:"11111001000010000100001000010000100",
          U:"10001100011000110001100011000101110",V:"10001100011000110001100010101000100",
          W:"10001100011000110001101011101110001",X:"10001100010101000100010101000110001",
          Y:"10001100011000101010001000010000100",Z:"11111000010001000100010001000011111",
          "0":"01110100111010110101110011000101110","1":"00100011000010000100001000010001110",
          "2":"01110100010000100110010001000011111","3":"11110000100011000010000011000101110",
          "4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
          "6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000",
          "8":"01110100011000101110100011000101110","9":"01110100011000101111000010001001100",
          " ":"00000000000000000000000000000000000","-":"00000000000000011111000000000000000",
          ".":"00000000000000000000000000000000100",":":"00000001000010000000001000010000000",
          "!":"00100001000010000100000000000000100","+":"00000001000010011111001000010000000",
          "/":"00001000100010001000100010001000000","'":"00100001000010000000000000000000000"
        };
        function text(s, x, y, px, col, center) {
          s = String(s).toUpperCase(); px = px || 1; ctx.fillStyle = col || "#fff";
          var w = s.length * 6 * px;
          if (center) x = Math.round(x - w / 2);
          for (var i = 0; i < s.length; i++) {
            var g = FONT[s[i]]; if (!g) continue;
            for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++)
              if (g[r * 5 + c] === "1") ctx.fillRect(x + i * 6 * px + c * px, y + r * px, px, px);
          }
        }

        /* ================= LEVEL 2 — PIPE PESTS ================= */
        /* Bump pests from below, kick them while flipped. Horizontal wrap. */
        var pipePests = {
          title: "PIPE PESTS",
          goal: "BUMP PESTS FROM BELOW, THEN KICK THEM.",
          api: null,
          init: function (api) {
            this.api = api;
            this.S = [
              { y: 224, x0: 0, x1: 320, floor: true },
              { y: 176, x0: 0, x1: 112 }, { y: 176, x0: 208, x1: 320 },
              { y: 128, x0: 72, x1: 248 }, // one wide middle shelf: pests walk it, then drop to the side ledges
              { y: 80, x0: 0, x1: 128 }, { y: 80, x0: 192, x1: 320 }
            ];
            this.pow = { x0: 150, x1: 170, y: 186, uses: 3 };
            this.lives = 3; this.score = 0; this.kicked = 0; this.spawned = 0; this.won = 0; this.jingled = false;
            this.timer = 0; this.spawnT = 90; this.pests = []; this.pops = []; this.bumps = []; this.fly = []; this.shake = 0; this.parts = [];
            this.puffs = []; this.coins = []; this.sparks = []; this.powT = 0;
            this.reset();
          },
          reset: function () { this.p = { x: 60, y: 224, vy: 0, on: true, face: 1, dead: 0, inv: 90, walk: 0 }; },
          wd: function (a, b) { var d = a - b; if (d > 160) d -= 320; if (d < -160) d += 320; return d; },
          sup: function (x, y, hero) {
            for (var i = 0; i < this.S.length; i++) { var s = this.S[i]; if (s.y === y && x >= s.x0 - 3 && x <= s.x1 + 3) return true; }
            var w = this.pow; return !!hero && w.uses > 0 && y === w.y && x >= w.x0 - 3 && x <= w.x1 + 3;
          },
          land: function (o, py, hero) {
            var c = this.S.slice(); if (hero && this.pow.uses > 0) c.push(this.pow);
            for (var i = 0; i < c.length; i++) { var s = c[i];
              if (py <= s.y && o.y >= s.y && o.x >= s.x0 - 3 && o.x <= s.x1 + 3) { o.y = s.y; o.vy = 0; return true; } }
            return false;
          },
          pop: function (s, x, y) { this.pops.push({ s: s, x: x, y: y, t: 45 }); },
          flip: function (e) { e.flip = e.mad ? 300 : 360; e.hop = 10; beep(660, 0.06); },
          puff: function (x, y) { this.puffs.push({ x: x, y: y, t: 18 }); },
          spark: function (x, y, n) { for (var i = 0; i < n; i++) { var a = i / n * Math.PI * 2; this.sparks.push({ x: x, y: y, vx: Math.cos(a) * 1.4, vy: Math.sin(a) * 1.4 - 0.5, t: 20 }); } },
          bump: function (s, x) {
            this.bumps.push({ s: s, x: x, t: 12 }); beep(200, 0.06, "square", 0.06);
            for (var i = 0; i < this.pests.length; i++) { var e = this.pests[i];
              if (e.on && e.y === s.y && e.flip === 0 && Math.abs(this.wd(e.x, x)) < 18) this.flip(e); }
            for (i = 0; i < this.coins.length; i++) { var c = this.coins[i]; // a coin bumped from below is collected
              if (c.on && c.y === s.y && Math.abs(this.wd(c.x, x)) < 18) this.getCoin(i--); }
          },
          getCoin: function (i) {
            var c = this.coins.splice(i, 1)[0]; this.score += 200; this.spark(c.x, c.y - 6, 8);
            this.pop("+200", c.x - 12, c.y - 22); SFX.pick();
          },
          powHit: function () {
            this.pow.uses--; this.shake = 20; this.powT = 14; beep(90, 0.25, "square", 0.1);
            for (var i = 0; i < this.pests.length; i++) { var e = this.pests[i]; if (e.on && e.y === 224 && e.flip === 0) this.flip(e); }
          },
          update: function (inp) {
            var P = this.p, i, e, s;
            this.timer++; if (this.shake > 0) this.shake--;
            for (i = this.pops.length - 1; i >= 0; i--) { this.pops[i].y -= 0.4; if (--this.pops[i].t <= 0) this.pops.splice(i, 1); }
            for (i = this.bumps.length - 1; i >= 0; i--) if (--this.bumps[i].t <= 0) this.bumps.splice(i, 1);
            for (i = this.fly.length - 1; i >= 0; i--) { var f = this.fly[i]; f.x += f.vx; f.vy += 0.2; f.y += f.vy; f.t++; if (f.y > H + 20) this.fly.splice(i, 1); }
            for (i = this.puffs.length - 1; i >= 0; i--) if (--this.puffs[i].t <= 0) this.puffs.splice(i, 1);
            for (i = this.sparks.length - 1; i >= 0; i--) { var sp = this.sparks[i]; sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.05; if (--sp.t <= 0) this.sparks.splice(i, 1); }
            if (this.powT > 0) this.powT--;
            if (this.won > 0) { if (++this.won > 120) this.api.win(this.score); return; }
            if (P.dead > 0) {
              if (--P.dead === 0) {   this.reset(); }
              return;
            }
            // spawning: 1 every ~3.5 s, max 3 on screen, 8 total
            if (this.spawned < 8 && --this.spawnT <= 0 && this.pests.length < 3) {
              var side = this.spawned % 2;
              this.pests.push({ x: side ? 300 : 20, y: 80, vy: 0, dir: side ? -1 : 1, spd: 0.6 + this.spawned * 0.03, on: true, flip: 0, hop: 0, walk: 0, mad: 0 });
              this.puff(side ? 292 : 28, 74);
              this.spawned++; this.spawnT = 180; beep(330, 0.06, "square", 0.05);
            }
            // coins: pop out of a kicked pest, settle, twinkle; walk into one (or bump it) for +200
            for (i = this.coins.length - 1; i >= 0; i--) {
              var c = this.coins[i]; c.t--;
              if (!c.on) { var cy = c.y; c.vy = Math.min(c.vy + 0.2, 4); c.y += c.vy; if (this.land(c, cy)) c.on = true; }
              if (c.t <= 0 || c.y > H + 10) { this.coins.splice(i, 1); continue; }
              if (P.dead === 0 && Math.abs(this.wd(c.x, P.x)) < 10 && Math.abs(c.y - P.y) < 16) this.getCoin(i);
            }
            // hero
            if (P.inv > 0) P.inv--;
            var dx = (inp.k.right ? 1 : 0) - (inp.k.left ? 1 : 0);
            if (dx) { P.face = dx; P.walk++; }
            P.x = (P.x + dx * 1.6 + 320) % 320;
            if (inp.p.a && P.on) { P.vy = -5.2; P.on = false; SFX.jump(); }
            if (P.on && !this.sup(P.x, P.y, true)) { P.on = false; P.vy = 0; }
            if (!P.on) {
              var py = P.y; P.vy = Math.min(P.vy + 0.24, 5); P.y += P.vy;
              if (P.vy < 0) {
                var head = P.y - 16, ph = py - 16, w = this.pow;
                if (w.uses > 0 && ph >= w.y + 14 && head < w.y + 14 && P.x >= w.x0 - 3 && P.x <= w.x1 + 3) { P.y = w.y + 30; P.vy = 0.6; this.powHit(); }
                else for (i = 1; i < this.S.length; i++) { s = this.S[i];
                  if (ph >= s.y + 6 && head < s.y + 6 && P.x >= s.x0 - 3 && P.x <= s.x1 + 3) { P.y = s.y + 22; P.vy = 0.6; this.bump(s, P.x); break; } }
              } else if (this.land(P, py, true)) P.on = true;
            }
            // pests
            for (i = this.pests.length - 1; i >= 0; i--) {
              e = this.pests[i];
              if (e.hop > 0) e.hop--;
              if (e.flip > 0) {
                if (--e.flip === 0) { e.spd = Math.min(e.spd * 1.5, 1.5); e.mad++; e.hop = 8; beep(440, 0.05, "sawtooth", 0.05); }
              } else if (e.on) {
                e.x = (e.x + e.dir * e.spd + 320) % 320; e.walk++;
                if (e.y === 224 && ((e.dir > 0 && e.x >= 312) || (e.dir < 0 && e.x <= 8))) {
                  this.puff(e.dir > 0 ? 306 : 14, 214);
                  e.x = e.dir > 0 ? 20 : 300; e.y = 80; // into the bottom pipe, out the top
                  this.puff(e.dir > 0 ? 28 : 292, 74);
                } else if (!this.sup(e.x, e.y)) { e.on = false; e.vy = 0; }
              } else {
                var ey = e.y; e.vy = Math.min(e.vy + 0.2, 4); e.y += e.vy;
                if (this.land(e, ey)) e.on = true;
                else if (e.y > H + 10) { e.y = 80; e.x = e.dir > 0 ? 20 : 300; e.vy = 0; e.on = true; } // safety net
              }
              var ddx = Math.abs(this.wd(e.x, P.x)), ddy = Math.abs(e.y - P.y);
              if (e.flip > 0 && ddx < 12 && ddy < 14) { // kick: generous box, never harmful
                this.pests.splice(i, 1); this.kicked++; this.score += 800; SFX.smash();
                var kd = this.wd(e.x, P.x) >= 0 ? 1 : -1;
                this.fly.push({ x: e.x, y: e.y, vx: kd * 2.2, vy: -3.6, t: 0, mad: e.mad }); this.shake = Math.max(this.shake, 8);
                for (var sk = 0; sk < 12; sk++) { var sa2 = sk / 12 * 6.283, sv = 1.2 + sk % 3 * 0.7; this.parts.push({ x: e.x, y: e.y - 6, vx: Math.cos(sa2) * sv, vy: Math.sin(sa2) * sv - 1, t: 24, c: sk % 2 ? "#ffe14d" : "#ff7a3a" }); }
                this.pop("+800", e.x - 12, e.y - 24);
                this.coins.push({ x: e.x, y: e.y - 2, vy: -3, on: false, t: 420 });
                if (this.kicked >= 8) {
                  this.won = 1; this.jingled = true; this.score += this.lives * 500;
                  [659, 784, 988, 1319, 988, 1319].forEach(function (fq, n) {
                    setTimeout(function () { beep(fq, n === 5 ? 0.35 : 0.1); }, n * 110);
                  });
                }
              } else if (!this.won && e.flip === 0 && ddx < 8 && ddy < 10 && P.inv === 0) { P.dead = 90; SFX.hit(); break; } // touch: tight box
            }
          },
          draw: function (x) {
            var i, e, s, b, tx, off, t = this.timer;
            // sewer backdrop: dark gradient, faint brick wall, background pipes with highlights, slow animated drips
            var bg2 = x.createLinearGradient(0, 0, 0, H); bg2.addColorStop(0, "#070b18"); bg2.addColorStop(1, "#1a1030");
            x.fillStyle = bg2; x.fillRect(0, 0, W, H);
            x.fillStyle = "#121730"; for (var by2 = 0; by2 < 224; by2 += 10) for (var bx2 = (by2 / 10 % 2) * 10 - 10; bx2 < W; bx2 += 20) x.fillRect(bx2 + 1, by2 + 1, 18, 8);
            for (var pi2 = 0; pi2 < 5; pi2++) { var pxb = 28 + pi2 * 66; x.fillStyle = "#0f3a34"; x.fillRect(pxb, 0, 10, 224); x.fillStyle = "#1d6b5c"; x.fillRect(pxb + 2, 0, 2, 224); x.fillStyle = "#082420"; x.fillRect(pxb + 8, 0, 2, 224);
              x.fillStyle = "#16524a"; for (var jy = 30 + pi2 * 13; jy < 224; jy += 70) x.fillRect(pxb - 2, jy, 14, 4);
              var dy2 = (t * 0.6 + pi2 * 47) % 230; x.fillStyle = "#5fb8c8"; x.fillRect(pxb + 5, dy2, 1, 3); }
            x.save(); if (this.shake) { var sa = Math.ceil(this.shake / 6); x.translate(t % 4 < 2 ? sa : -sa, t % 2 ? sa + 1 : -sa - 1); }
            for (i = 1; i < this.S.length; i++) { s = this.S[i];
              for (tx = s.x0; tx < s.x1; tx += 8) {
                off = 0;
