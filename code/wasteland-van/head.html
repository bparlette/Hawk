<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f12">
<title>ROADKILL RIG — Hark Original</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0f12;color:#fff4dc;font-family:Impact,"Arial Black","Helvetica Neue",Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none;z-index:2}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}
.stroke{text-shadow:3px 3px 0 #1a0f12,-3px 3px 0 #1a0f12,3px -3px 0 #1a0f12,-3px -3px 0 #1a0f12,0 4px 0 #1a0f12,4px 0 0 #1a0f12,-4px 0 0 #1a0f12,0 -4px 0 #1a0f12}
button{font-family:inherit;cursor:pointer;touch-action:none}
#ui{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:8px;display:flex;gap:6px;z-index:30}
#ui button{width:42px;height:38px;border:3px solid #1a0f12;border-radius:8px;background:#3b3f46;color:#fff4dc;font-size:17px;box-shadow:0 3px 0 #1a0f12}
#ui button.on{background:#ffcf2e;color:#1a0f12}
#ui button:active{transform:translateY(2px);box-shadow:0 1px 0 #1a0f12}
/* title / attract: top + bottom bands, the middle stays the live demo */
#title{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;justify-content:space-between;align-items:center;cursor:pointer;
 background:linear-gradient(180deg,rgba(26,15,18,.82) 0%,rgba(26,15,18,0) 30%,rgba(26,15,18,0) 68%,rgba(26,15,18,.85) 100%)}
#title.on{display:flex}
#title .tt{margin-top:calc(env(safe-area-inset-top) + 7vh);text-align:center}
#title h1{font-size:clamp(44px,min(10vw,11vh),108px);line-height:1;letter-spacing:.02em;color:#ffcf2e;transform:rotate(-3deg);
 text-shadow:0 6px 0 #e8312a,0 11px 0 #1a0f12,5px 0 0 #1a0f12,-5px 0 0 #1a0f12,0 -5px 0 #1a0f12,5px 5px 0 #1a0f12,-5px 5px 0 #1a0f12}
#title h1 span{display:block;margin-top:.04em;color:#fff4dc;font-size:1.08em;text-shadow:0 6px 0 #8f4e36,0 11px 0 #1a0f12,5px 0 0 #1a0f12,-5px 0 0 #1a0f12,0 -5px 0 #1a0f12,5px 5px 0 #1a0f12,-5px 5px 0 #1a0f12}
#title .hk{margin-top:3.2vh;font-size:clamp(13px,2vh,18px);letter-spacing:.3em;color:#ff8a1e}
#title .goal{margin-top:1.2vh;display:inline-block;padding:.35em .8em;background:#e8312a;border:4px solid #1a0f12;border-radius:6px;font-size:clamp(18px,3.4vh,30px);letter-spacing:.04em;color:#fff4dc;transform:rotate(1.5deg)}
#title .tb{margin-bottom:calc(env(safe-area-inset-bottom) + 6vh);text-align:center;padding:0 12px}
#title .go{font-size:clamp(22px,4.2vh,40px);color:#fff4dc;animation:pulse 1.1s infinite}
#title .keys{margin-top:1.4vh;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(10px,1.6vh,14px);color:#f4cf98;letter-spacing:.03em}
#tbest{margin-top:1vh;font-size:clamp(12px,1.9vh,16px);color:#7dffb0;letter-spacing:.06em}
body.touch #title .keys{display:none}
@keyframes pulse{50%{transform:scale(1.07);color:#ffcf2e}}
/* level-up cards */
#cards{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(26,15,18,.62);padding:calc(env(safe-area-inset-top) + 60px) 12px calc(env(safe-area-inset-bottom) + 20px)}
#cards.on{display:flex}
#cards .ch{font-size:clamp(34px,6.5vh,64px);color:#5dff7a;transform:rotate(-2deg)}
#cards .crow{display:flex;gap:16px;flex-wrap:nowrap;justify-content:center}
.card{position:relative;width:min(30vw,250px);min-height:min(46vh,320px);background:#2a1d1a;border:5px solid #1a0f12;border-radius:12px;box-shadow:0 7px 0 #1a0f12,inset 0 0 0 3px #8f4e36;color:#fff4dc;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .08s}
.card .ic{width:76px;height:76px}
.card b{font-size:clamp(17px,2.6vh,24px);letter-spacing:.02em;color:#ffcf2e}
.card i{font-style:normal;font-size:13px;color:#1a0f12;background:#ffcf2e;padding:2px 9px;border-radius:4px}
.card p{font-family:"Arial Black",Arial,sans-serif;font-size:13px;line-height:1.35;color:#f4cf98}
.card .ck{position:absolute;top:6px;left:9px;font-size:16px;color:#8f4e36}
.card.sel,.card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 13px 0 #1a0f12,inset 0 0 0 3px #ffcf2e}
.card.evo{background:#3a1636;box-shadow:0 7px 0 #1a0f12,inset 0 0 0 3px #ff4fd8}.card.evo b{color:#ff4fd8}.card.evo i{background:#ff4fd8}
.card.rep{background:#173025}.card.rep b{color:#7dffb0}.card.rep i{background:#7dffb0}
body.portrait .crow{flex-direction:column;gap:10px;width:100%;align-items:center}
body.portrait .card{width:min(92vw,420px);min-height:0;flex-direction:row;flex-wrap:wrap;text-align:left;padding:10px 12px;gap:4px 12px}
body.portrait .card .ic{width:56px;height:56px;flex:none;grid-row:span 2}
body.portrait .card b{flex:1}
body.portrait .card p{width:100%}
/* pause + result */
#pause,#result{position:fixed;inset:0;z-index:26;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;background:rgba(26,15,18,.72);text-align:center;padding:20px}
#pause.on,#result.on{display:flex}
#pause .pt{font-size:clamp(44px,9vh,90px);color:#ffcf2e}
#pause button,#result button{min-width:240px;min-height:64px;font-size:clamp(24px,4vh,34px);background:#ffcf2e;color:#1a0f12;border:5px solid #1a0f12;border-radius:12px;box-shadow:0 7px 0 #1a0f12}
#pause button.sec{background:#3b3f46;color:#fff4dc;font-size:20px;min-height:52px}
button:active{transform:translateY(4px)}
#result .rt{font-size:clamp(40px,min(14vw,12vh),120px);white-space:nowrap;transform:rotate(-3deg)}
#result .rt.won{color:#7dffb0}#result .rt.lost{color:#ff4a3a}
#result .rs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#result .rs div{background:#2a1d1a;border:4px solid #1a0f12;border-radius:10px;padding:10px 16px;min-width:110px;box-shadow:0 5px 0 #1a0f12}
#result .rs b{display:block;font-size:clamp(28px,5vh,44px);color:#fff4dc}#result .rs .rk{color:#ffcf2e}
#result .rs i{font-style:normal;font-size:13px;color:#ff8a1e;letter-spacing:.1em}
#result .rb{font-size:clamp(14px,2.2vh,20px);color:#7dffb0}
#result .rh{font-size:13px;color:#f4cf98;letter-spacing:.12em}
/* touch controls */
#touch{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#touch.on{display:block}
#stickzone{position:absolute;left:0;bottom:0;width:52%;height:42%;pointer-events:auto}
#ring{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,244,220,.5);background:rgba(26,15,18,.25);display:none;pointer-events:none}
#ring.on{display:block}
#knob{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:#ffcf2e;border:4px solid #1a0f12}
#touch button{position:absolute;pointer-events:auto;border:5px solid #1a0f12;border-radius:50%;color:#1a0f12;font-size:17px;box-shadow:0 5px 0 #1a0f12}
#touch button.down{transform:translateY(3px);box-shadow:0 2px 0 #1a0f12;filter:brightness(1.25)}
#tgas{right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:98px;height:98px;background:#7dff6a;font-size:22px!important}
#tbrake{right:calc(126px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:70px;height:70px;background:#ff8a6a}
#tnitro{right:calc(22px + env(safe-area-inset-right));bottom:calc(128px + env(safe-area-inset-bottom));width:80px;height:80px;--n:50%;background:conic-gradient(#4fc9ff var(--n),#2b4a6b 0);color:#fff4dc!important;text-shadow:0 2px 0 #1a0f12}
#tdrift{right:calc(118px + env(safe-area-inset-right));bottom:calc(98px + env(safe-area-inset-bottom));width:66px;height:66px;background:#ffcf2e;font-size:15px!important}
html.demo-embed #touch,body.att #touch,body.res #touch{display:none!important}
body.portrait #title .goal{font-size:clamp(15px,4.6vw,24px);white-space:nowrap}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="hud"></canvas><div id="safe"></div>
<div id="ui"><button id="bpause" title="Pause (P)">II</button><button id="bmute" title="Mute (M)">&#9835;</button><button id="b16" title="16-bit look (H)">16</button></div>
<div id="title" class="on">
  <div class="tt"><h1>ROADKILL<span>RIG</span></h1><div class="hk">&#9733; HARK ORIGINAL &#9733;</div><div class="goal">SURVIVE 6:00 &middot; REACH EXTRACTION</div></div>
  <div class="tb"><div class="go">TAP OR PRESS ANY KEY TO DRIVE</div><div class="keys">W/S GAS &middot; BRAKE &nbsp; A/D STEER &nbsp; SPACE NITRO &nbsp; SHIFT DRIFT &nbsp; R FLIP &nbsp; P PAUSE &nbsp; M MUTE &nbsp; H 16-BIT</div><div id="tbest"></div></div>
</div>
<div id="cards"></div>
<div id="pause"><div class="pt stroke">PAUSED</div><button id="resume">RESUME</button><button id="restart" class="sec">RESTART RUN</button></div>
<div id="result"><div class="rt stroke"></div><div class="rs"></div><div class="rb"></div><button id="retry">&#10226; RETRY</button><div class="rh">ENTER &middot; SPACE &middot; TAP</div></div>
<div id="touch"><div id="stickzone"></div><div id="ring"><div id="knob"></div></div><button id="tgas">GAS</button><button id="tbrake">BRAKE</button><button id="tnitro">NITRO</button><button id="tdrift">DRIFT</button></div>
<script type="module">
