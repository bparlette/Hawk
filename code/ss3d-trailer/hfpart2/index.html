<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bungee"; src: url("assets/fonts/Bungee.ttf"); }
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton.ttf"); }
      @font-face { font-family: "PressStart"; src: url("assets/fonts/PressStart2P.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .vw { position: absolute; inset: 0; transform-origin: 50% 30%; }
      .shot { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .capwrap { position: absolute; inset: 0; pointer-events: none; }
      .capbar { position: absolute; left: 0; right: 0; top: 590px; margin: 0 auto; width: max-content; padding: 10px 46px 14px; background: linear-gradient(180deg, #e8202a, #a00818);
        border: 6px solid #111; box-shadow: 10px 10px 0 #111, 0 0 40px rgba(255,60,40,.45); transform: skewX(-8deg); }
      .captxt { display: block; font-family: "Bungee", sans-serif; font-size: 68px; line-height: 1; color: #fff; letter-spacing: 2px;
        text-shadow: 4px 4px 0 #111, -2px -2px 0 #111, 2px -2px 0 #111, -2px 2px 0 #111; }
      .chip { position: absolute; left: 0; right: 0; top: 700px; margin: 0 auto; width: max-content; padding: 8px 22px; background: #ffd23a; border: 4px solid #111;
        font-family: "PressStart", monospace; font-size: 22px; color: #111; box-shadow: 6px 6px 0 #111; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #titledim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.35), rgba(0,0,0,.85)); }
      #logo { position: absolute; left: 50%; top: 170px; width: 1100px; margin-left: -550px; filter: drop-shadow(0 12px 0 #000) drop-shadow(0 0 40px rgba(120,255,120,.35)); }
      #tag { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font-family: "PressStart", monospace; font-size: 30px; color: #ffe27a; text-shadow: 4px 4px 0 #000; }
      #endbg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: blur(6px) brightness(.45) saturate(1.2); transform: scale(1.06); }
      #endlogo { position: absolute; left: 50%; top: 110px; width: 1000px; margin-left: -500px; filter: drop-shadow(0 12px 0 #000) drop-shadow(0 0 50px rgba(120,255,120,.4)); }
      #endplay { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
      #endplay span { display: inline-block; font-family: "Bungee", sans-serif; font-size: 92px; color: #fff; padding: 8px 48px 16px; background: linear-gradient(180deg, #e8202a, #a00818);
        border: 7px solid #111; box-shadow: 12px 12px 0 #111; transform: skewX(-8deg); text-shadow: 5px 5px 0 #111; }
      #endurl { position: absolute; left: 0; right: 0; top: 830px; text-align: center; font-family: "PressStart", monospace; font-size: 44px; color: #ffd23a; text-shadow: 5px 5px 0 #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.0" data-width="1920" data-height="1080">
      <div class="vw" id="w-van"><video id="v-van" class="clip shot" src="assets/clips/van.mp4" muted playsinline data-start="0" data-duration="2.25" data-track-index="0"></video></div>
      <div class="vw" id="w-daynight"><video id="v-daynight" class="clip shot" src="assets/clips/daynight.mp4" muted playsinline data-start="2.25" data-duration="3.0" data-track-index="0"></video></div>
      <div class="vw" id="w-fire"><video id="v-fire" class="clip shot" src="assets/clips/fire.mp4" muted playsinline data-start="5.25" data-duration="3.0" data-track-index="0"></video></div>
      <div class="vw" id="w-boss"><video id="v-boss" class="clip shot" src="assets/clips/boss.mp4" muted playsinline data-start="8.25" data-duration="3.75" data-track-index="0"></video></div>
      <div class="vw" id="w-win"><video id="v-win" class="clip shot" src="assets/clips/win.mp4" muted playsinline data-start="12.0" data-duration="2.25" data-track-index="0"></video></div>
      
      <div class="clip" id="endcard" data-start="14.25" data-duration="3.75" data-track-index="1" style="position:absolute;inset:0">
        <img id="endbg" src="assets/img/endbg.png" alt="" />
        <img id="endlogo" src="assets/img/logo.png" alt="SHELL SHOCK 3D" />
        <div id="endplay"><span>PLAY FREE</span></div>
        <div id="endurl">shellshock-3d.surge.sh</div>
      </div>
      <div class="clip capwrap" id="cap-van" data-start="0.080" data-duration="2.130" data-track-index="2"><div class="capbar" id="cap-van-bar"><span class="captxt">DRIVE THE PARTY VAN</span></div><div class="chip" id="cap-van-chip">DRIFT · SMASH · HONK</div></div>
      <div class="clip capwrap" id="cap-daynight" data-start="2.330" data-duration="2.880" data-track-index="2"><div class="capbar" id="cap-daynight-bar"><span class="captxt">DAY TO NIGHT</span></div><div class="chip" id="cap-daynight-chip">NEON CITY AFTER DARK</div></div>
      <div class="clip capwrap" id="cap-fire" data-start="5.330" data-duration="2.880" data-track-index="2"><div class="capbar" id="cap-fire-bar"><span class="captxt">FIGHT THROUGH THE FIRE</span></div><div class="chip" id="cap-fire-chip">SCORCHER</div></div>
      <div class="clip capwrap" id="cap-boss" data-start="8.330" data-duration="3.630" data-track-index="2"><div class="capbar" id="cap-boss-bar"><span class="captxt">TAKE DOWN THE BOSS</span></div><div class="chip" id="cap-boss-chip">RAMROD</div></div>
      <div class="clip capwrap" id="cap-win" data-start="12.080" data-duration="2.130" data-track-index="2"><div class="capbar" id="cap-win-bar"><span class="captxt">SAVE THE CITY</span></div></div>
      <div class="clip" id="flashwrap" data-start="0" data-duration="18.0" data-track-index="3" style="position:absolute;inset:0;pointer-events:none"><div id="flash"></div></div>
      
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#flash", {opacity: 0}, 0);
      tl.fromTo("#cap-van-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 0.080);
      tl.fromTo("#cap-van-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 0.200);
      tl.to("#cap-van-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 1.990);
      tl.to("#cap-van-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 1.990);
      tl.fromTo("#w-daynight", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 2.25);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 2.25);
      tl.fromTo("#cap-daynight-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 2.330);
      tl.fromTo("#cap-daynight-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 2.450);
      tl.to("#cap-daynight-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 4.990);
      tl.to("#cap-daynight-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 4.990);
      tl.fromTo("#w-fire", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 5.25);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 5.25);
      tl.fromTo("#cap-fire-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 5.330);
      tl.fromTo("#cap-fire-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 5.450);
      tl.to("#cap-fire-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 7.990);
      tl.to("#cap-fire-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 7.990);
      tl.fromTo("#w-boss", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 8.25);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 8.25);
      tl.fromTo("#cap-boss-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 8.330);
      tl.fromTo("#cap-boss-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 8.450);
      tl.to("#cap-boss-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 11.740);
      tl.to("#cap-boss-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 11.740);
      tl.fromTo("#w-win", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 12.0);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 12.0);
      tl.fromTo("#cap-win-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 12.080);
      tl.to("#cap-win-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 13.990);
      tl.fromTo("#flash", {opacity: 0.9}, {opacity: 0, duration: 0.25, immediateRender: false}, 14.25);
      tl.fromTo("#endlogo", {scale: 1.8, opacity: 0}, {scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)"}, 14.300);
      tl.fromTo("#endplay", {y: 80, opacity: 0}, {y: 0, opacity: 1, duration: 0.3, ease: "power3.out"}, 14.600);
      tl.fromTo("#endurl", {y: 80, opacity: 0}, {y: 0, opacity: 1, duration: 0.3, ease: "power3.out"}, 14.750);
      tl.to("#endplay", {scale: 1.06, duration: 0.1875, yoyo: true, repeat: 7, ease: "sine.inOut"}, 15.150);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
