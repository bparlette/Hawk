<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bungee"; src: url("assets/fonts/Bungee.ttf"); }
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton.ttf"); }
      @font-face { font-family: "PressStart"; src: url("assets/fonts/PressStart2P.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .vw { position: absolute; inset: 0; transform-origin: 50% 30%; }
      .shot { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .capwrap { position: absolute; inset: 0; pointer-events: none; }
      .capbar { position: absolute; left: 0; right: 0; top: 590px; margin: 0 auto; width: max-content; padding: 10px 46px 14px; background: linear-gradient(180deg, #e8202a, #a00818);
        border: 6px solid #111; box-shadow: 10px 10px 0 #111, 0 0 40px rgba(255,60,40,.45); transform: skewX(-8deg); }
      .captxt { display: block; font-family: "Bungee", sans-serif; font-size: 68px; line-height: 1; color: #fff; letter-spacing: 2px;
        text-shadow: 4px 4px 0 #111, -2px -2px 0 #111, 2px -2px 0 #111, -2px 2px 0 #111; }
      .chip { position: absolute; left: 0; right: 0; top: 700px; margin: 0 auto; width: max-content; padding: 8px 22px; background: #ffd23a; border: 4px solid #111;
        font-family: "PressStart", monospace; font-size: 22px; color: #111; box-shadow: 6px 6px 0 #111; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #titledim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.35), rgba(0,0,0,.85)); }
      #logo { position: absolute; left: 50%; top: 170px; width: 1100px; margin-left: -550px; filter: drop-shadow(0 12px 0 #000) drop-shadow(0 0 40px rgba(120,255,120,.35)); }
      #tag { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font-family: "PressStart", monospace; font-size: 30px; color: #ffe27a; text-shadow: 4px 4px 0 #000; }
      #endbg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: blur(6px) brightness(.45) saturate(1.2); transform: scale(1.06); }
      #endlogo { position: absolute; left: 50%; top: 110px; width: 1000px; margin-left: -500px; filter: drop-shadow(0 12px 0 #000) drop-shadow(0 0 50px rgba(120,255,120,.4)); }
      #endplay { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
      #endplay span { display: inline-block; font-family: "Bungee", sans-serif; font-size: 92px; color: #fff; padding: 8px 48px 16px; background: linear-gradient(180deg, #e8202a, #a00818);
        border: 7px solid #111; box-shadow: 12px 12px 0 #111; transform: skewX(-8deg); text-shadow: 5px 5px 0 #111; }
      #endurl { position: absolute; left: 0; right: 0; top: 830px; text-align: center; font-family: "PressStart", monospace; font-size: 44px; color: #ffd23a; text-shadow: 5px 5px 0 #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.0" data-width="1920" data-height="1080">
      <div class="vw" id="w-subway"><video id="v-subway" class="clip shot" src="assets/clips/subway.mp4" muted playsinline data-start="0" data-duration="3.0" data-track-index="0"></video></div>
      <div class="vw" id="w-elevator"><video id="v-elevator" class="clip shot" src="assets/clips/elevator.mp4" muted playsinline data-start="3.0" data-duration="2.25" data-track-index="0"></video></div>
      <div class="vw" id="w-roofleap"><video id="v-roofleap" class="clip shot" src="assets/clips/roofleap.mp4" muted playsinline data-start="5.25" data-duration="2.25" data-track-index="0"></video></div>
      <div class="vw" id="w-stealth"><video id="v-stealth" class="clip shot" src="assets/clips/stealth.mp4" muted playsinline data-start="7.5" data-duration="3.0" data-track-index="0"></video></div>
      <div class="vw" id="w-comic"><video id="v-comic" class="clip shot" src="assets/clips/comic.mp4" muted playsinline data-start="10.5" data-duration="2.25" data-track-index="0"></video></div>
      <div class="vw" id="w-oneshot"><video id="v-oneshot" class="clip shot" src="assets/clips/oneshot.mp4" muted playsinline data-start="12.75" data-duration="2.25" data-track-index="0"></video></div>
      
      
      <div class="clip capwrap" id="cap-subway" data-start="0.080" data-duration="2.880" data-track-index="2"><div class="capbar" id="cap-subway-bar"><span class="captxt">HIT THE SUBWAY</span></div><div class="chip" id="cap-subway-chip">DODGE THE EXPRESS</div></div>
      <div class="clip capwrap" id="cap-elevator" data-start="3.080" data-duration="2.130" data-track-index="2"><div class="capbar" id="cap-elevator-bar"><span class="captxt">ENTER THE BUILDINGS</span></div><div class="chip" id="cap-elevator-chip">RIDE TO THE ROOF</div></div>
      <div class="clip capwrap" id="cap-roofleap" data-start="5.330" data-duration="2.130" data-track-index="2"><div class="capbar" id="cap-roofleap-bar"><span class="captxt">RUN THE ROOFTOPS</span></div><div class="chip" id="cap-roofleap-chip">CHASE CAM</div></div>
      <div class="clip capwrap" id="cap-stealth" data-start="7.580" data-duration="2.880" data-track-index="2"><div class="capbar" id="cap-stealth-bar"><span class="captxt">GHOST THE ROOFTOPS</span></div><div class="chip" id="cap-stealth-chip">SILENT TAKEDOWNS</div></div>
      <div class="clip capwrap" id="cap-comic" data-start="10.580" data-duration="2.130" data-track-index="2"><div class="capbar" id="cap-comic-bar"><span class="captxt">3 CAMERA STYLES</span></div><div class="chip" id="cap-comic-chip">COMIC</div></div>
      <div class="clip capwrap" id="cap-oneshot" data-start="12.830" data-duration="2.130" data-track-index="2"><div class="capbar" id="cap-oneshot-bar"><span class="captxt">3 CAMERA STYLES</span></div><div class="chip" id="cap-oneshot-chip">ONE-SHOT</div></div>
      <div class="clip" id="flashwrap" data-start="0" data-duration="15.0" data-track-index="3" style="position:absolute;inset:0;pointer-events:none"><div id="flash"></div></div>
      
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#flash", {opacity: 0}, 0);
      tl.fromTo("#cap-subway-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 0.080);
      tl.fromTo("#cap-subway-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 0.200);
      tl.to("#cap-subway-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 2.740);
      tl.to("#cap-subway-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 2.740);
      tl.fromTo("#w-elevator", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 3.0);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 3.0);
      tl.fromTo("#cap-elevator-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 3.080);
      tl.fromTo("#cap-elevator-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 3.200);
      tl.to("#cap-elevator-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 4.990);
      tl.to("#cap-elevator-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 4.990);
      tl.fromTo("#w-roofleap", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 5.25);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 5.25);
      tl.fromTo("#cap-roofleap-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 5.330);
      tl.fromTo("#cap-roofleap-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 5.450);
      tl.to("#cap-roofleap-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 7.240);
      tl.to("#cap-roofleap-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 7.240);
      tl.fromTo("#w-stealth", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 7.5);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 7.5);
      tl.fromTo("#cap-stealth-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 7.580);
      tl.fromTo("#cap-stealth-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 7.700);
      tl.to("#cap-stealth-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 10.240);
      tl.to("#cap-stealth-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 10.240);
      tl.fromTo("#w-comic", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 10.5);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 10.5);
      tl.fromTo("#cap-comic-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 10.580);
      tl.fromTo("#cap-comic-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 10.700);
      tl.to("#cap-comic-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 12.490);
      tl.to("#cap-comic-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 12.490);
      tl.fromTo("#w-oneshot", {scale: 1.045}, {scale: 1, duration: 0.32, ease: "power3.out"}, 12.75);
      tl.fromTo("#flash", {opacity: 0.75}, {opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false}, 12.75);
      tl.fromTo("#cap-oneshot-bar", {x: -1400, skewX: -18}, {x: 0, skewX: -8, duration: 0.24, ease: "power4.out"}, 12.830);
      tl.fromTo("#cap-oneshot-chip", {x: 1200}, {x: 0, duration: 0.24, ease: "power4.out"}, 12.950);
      tl.to("#cap-oneshot-bar", {x: 1500, duration: 0.18, ease: "power2.in"}, 14.740);
      tl.to("#cap-oneshot-chip", {x: -1500, duration: 0.18, ease: "power2.in"}, 14.740);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
