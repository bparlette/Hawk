<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toad City kit viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; overflow: hidden; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  canvas { display: block; }
  #ro { position: fixed; left: 8px; top: 8px; padding: 6px 8px; background: rgba(20, 16, 31, 0.78); color: #f2f2f2; border-radius: 4px; white-space: pre; pointer-events: none; max-width: calc(100vw - 32px); overflow: hidden; }
  #ro b { color: #ffd23c; font-weight: 600; }
  #ro .bad { color: #ff3a1c; }
  .lbl { position: fixed; transform: translate(-50%, 0); color: #14101f; background: rgba(242, 242, 242, 0.85); padding: 1px 6px; border-radius: 3px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  body.hide-ui #ro { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="ro">loading…</div>
<script type="module">
// Toad City kit viewer — test bench for character modules.
// URL: ?show=<gang id> (lineup) | <gang id>.<member> | gull_lookout | thug
//      &night=1  &pose=idle|run|windup|attack|hurt|down|getup|all  &lod=1  &cam=three|front|side|back|phone
//      &t=<seconds, freezes time>  &flash=0.85  &anim=0 (skip animateGang)  &ui=0 (hide readout)  &dist=<m, phone view>
//      &zoom=<x, closer>  &look=<target height m>  &turn=1 (front / 3/4 / side / back of one member)
//      &stars=1 (draw the dizzy stars sprite height, 2.2 × scale + 0.15 m, over each rig)
//      &strip=knockdown|attack|run|dizzy (one member simulated at 60 fps with the game's real timings, frozen at sample times)
//      &merge=1 (run the game's real mergeRig from tools/game/04b_rig_merge.js on every rig)
// Keys: N night, P next pose, L LOD, F hit-flash, A animateGang on/off, C camera preset.
import * as THREE from 'three';
import { K } from './toadcity_kit.js';
import * as GULL from './example_gull_thug.js';
import * as HARBOR_RATS from './src/gang_harbor_rats.js';
import * as PIER_GULLS from './src/gang_pier_gulls.js';
import * as COBBLE_CATFISH from './src/gang_cobble_catfish.js';
import * as MASKED_BANDITS from './src/gang_masked_bandits.js';
import { loadMergeRig } from './tools/game_merge.js';

const MODULES = [GULL, HARBOR_RATS, PIER_GULLS, COBBLE_CATFISH, MASKED_BANDITS];         // add new delivery modules here
const POSES = ['idle', 'run', 'windup', 'attack', 'hurt', 'down', 'getup'];
const Q = new URLSearchParams(location.search);
const S = {
  show: Q.get('show') || 'harbor_rats', night: Q.get('night') === '1', pose: Q.get('pose') || 'idle', lod: Q.get('lod') === '1' ? 1 : 0,
  cam: Q.get('cam') || 'three', fixedT: Q.has('t') ? parseFloat(Q.get('t')) : null, flash: parseFloat(Q.get('flash') || '0'),
  anim: Q.get('anim') !== '0', dist: parseFloat(Q.get('dist') || '8'), zoom: parseFloat(Q.get('zoom') || '1'), merge: Q.get('merge') === '1', stars: Q.get('stars') === '1', turn: Q.get('turn') === '1', strip: Q.get('strip'), look: Q.has('look') ? parseFloat(Q.get('look')) : null,
};
if (Q.get('ui') === '0') document.body.classList.add('hide-ui');
const MERGE = S.merge ? await loadMergeRig(K) : null;   // the game's real mergeRig, optional

// ---- registry: every module exports META and one build function; gang modules also export GANG ----
const REG = {};   // id -> { label, build(opts) -> J, meta, animate }
for (const M of MODULES) {
  const buildName = Object.keys(M).find((k) => k.startsWith('build') && typeof M[k] === 'function');
  const build = M[buildName];
  if (M.GANG) {
    for (const mem of M.GANG.members) REG[M.GANG.id + '.' + mem] = { label: mem, meta: M.META[mem], build: (o) => build(K, mem, o), animate: M.animateGang };
    REG[M.GANG.id] = { group: M.GANG.members.map((mem) => M.GANG.id + '.' + mem) };
  } else {
    REG[M.META.id] = { label: M.META.id, meta: M.META, build: (o) => build(K, o), animate: M.animateBoss };
  }
}
REG.thug = { label: 'current thug', meta: { scale: 1 }, build: () => K.buildThug({}) };

// ---- renderer, scene, lights ----
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog('#b4c0c6', 40, 120);
K.OUT_U.fogN.value = 40; K.OUT_U.fogF.value = 120;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 300);
const hemi = new THREE.HemisphereLight('#ffffff', '#888888', 1); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 1); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun, sun.target);
const lamp = new THREE.PointLight('#ffa050', 16, 15, 2); lamp.position.set(-2.6, 3.6, 2.4); scene.add(lamp);   // street lamp (night)
const fill = new THREE.PointLight('#c8d0ff', 3.2, 0, 0.6); camera.add(fill); scene.add(camera);               // cool camera-side fill (night)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: '#958ea0' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function setNight(on) {
  S.night = on; K.applyLight({ scene, hemi, sun }, on ? 'night' : 'day');
  ground.material.color.set(on ? '#3a3850' : '#958ea0');
  lamp.intensity = on ? 16 : 0; fill.intensity = on ? 3.2 : 0;
}

// ---- rigs ----
let rigs = [];   // { J, id, entry, pose, label }
const r_rings = [];
function clearRigs() { for (const r of rigs) { scene.remove(r.J.root); r.el?.remove(); } rigs = []; for (const g of r_rings.splice(0)) scene.remove(g); }
function addRig(id, x, z, pose) {
  const e = REG[id]; if (!e || !e.build) throw new Error('unknown id ' + id);
  const J = e.build({ lod: S.lod, seed: 7 });
  if (S.merge && MERGE) MERGE(J);
  J.root.position.set(x, 0, z); J.root.scale.setScalar(e.meta?.scale || 1);
  scene.add(J.root);
  if (S.stars || S.strip === 'dizzy') {   // the dizzy stars sprite height: a flat gold ring 2.2 × scale + 0.15 m above the root
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.012, 6, 32), new THREE.MeshBasicMaterial({ color: '#ffd23c' }));
    ring.rotation.x = Math.PI / 2; ring.position.set(x, 2.2 * (e.meta?.scale || 1) + 0.15, z); scene.add(ring); r_rings.push(ring);
  }
  const el = document.createElement('div'); el.className = 'lbl'; el.textContent = pose === 'all' ? '' : e.label; document.body.appendChild(el);
  const r = { J, id, entry: e, pose, el }; rigs.push(r); return r;
}
function rebuild() {
  clearRigs();
  const g = REG[S.show]?.group;
  if (S.strip) {
    const id = g ? g[0] : S.show, seq = SEQ[S.strip];
    seq.samples.forEach((ts, i) => { const r = addRig(id, (i - (seq.samples.length - 1) / 2) * 1.5, 0, 'strip'); simulate(r, S.strip, ts); r.el.textContent = ts.toFixed(2) + 's ' + r.phase; });
  } else if (S.pose === 'all') {
    const id = g ? g[0] : S.show;
    POSES.forEach((p, i) => { const r = addRig(id, (i - 3) * 1.7, 0, p); r.el.textContent = p; });
  } else if (S.turn) {
    const id = g ? g[0] : S.show;
    [['front', 0], ['3/4', 0.7], ['side', Math.PI / 2], ['back', Math.PI]].forEach(([n, ry], i) => { const r = addRig(id, (i - 1.5) * 1.6, 0, S.pose); r.J.root.rotation.y = ry; r.el.textContent = n; });
  } else if (g && S.cam === 'phone') {   // street formation for the phone check: two in front, two behind
    const F = [[-1.25, 0.6], [1.25, 0.6], [-0.55, -0.6], [0.7, -0.95]];
    g.forEach((id, i) => addRig(id, F[i % 4][0], F[i % 4][1] - Math.floor(i / 4) * 2, S.pose));
  } else if (g) {
    g.forEach((id, i) => addRig(id, (i - (g.length - 1) / 2) * 1.6, 0, S.pose));
  } else addRig(S.show, 0, 0, S.pose);
  frameCamera(); measure();
}

// pose u-values for still frames; animated frames sweep u through 0..1
function poseFor(r, t) {
  const P = K.THUG_POSES, J = r.J, still = S.fixedT !== null;
  const u = still ? null : (t * 0.7) % 1;
  switch (r.pose) {
    case 'run': return P.run(t, 4.5, J);
    case 'windup': return P.windup(still ? 0.6 : u, J);
    case 'attack': return P.attack(still ? 0.4 : u, J);
    case 'hurt': return P.hurt(still ? 0.15 : u, J);
    case 'down': return P.down(still ? 1 : u, still ? true : u > 0.8);
    case 'getup': return P.getup(still ? 0.35 : u, J);
    default: return P.idle(t, J);
  }
}
const STATE = { idle: 'idle', run: 'run', windup: 'attack', attack: 'attack', hurt: 'hurt', down: 'down', getup: 'idle' };
// the game's sequences at 60 fps (real timings): idle/chase rate 14; windup 0.5 s (big 0.7 s) rate 12; attack pose over 0.3 s
// at rate 26, chase from 0.55 s; hurt pose over 0.32 s at rate 24, next state at 0.34 s; knock-down hop (vy 4.2, g 22) with
// the down pose at rate 14 for 1.25 s; thug getup over 0.5 s at rate 14; dizzy (THUG_POSES.dizzy) at rate 10, from hurt, to chase. Phase fn args: (t, u, landed, J, tl, big).
const P_ = K.THUG_POSES, cl_ = (v) => Math.min(1, Math.max(0, v));
const SEQ = {
  knockdown: { samples: [0.5, 0.67, 0.84, 1.0, 1.15, 1.35, 1.7, 2.09, 2.3, 2.59, 3.15], phases: (big) => [
    ['idle', 0.5, 14, 'idle', (t, u, g, J) => P_.idle(t, J)], ['hurt', 0.34, 24, 'hurt', (t, u, g, J, tl) => P_.hurt(cl_(tl / 0.32), J)],
    ['down', 1.25, 14, 'down', (t, u, g) => P_.down(u, g), true], ['getup', 0.5, 14, 'idle', (t, u, g, J) => P_.getup(u, J)], ['idle', 0.6, 14, 'idle', (t, u, g, J) => P_.idle(t, J)]] },
  attack: { samples: [0.4, 0.6, 0.8, 0.9, 0.96, 1.02, 1.1, 1.25, 1.45, 1.75, 2.2], phases: (big) => [
    ['idle', 0.4, 14, 'idle', (t, u, g, J) => P_.idle(t, J)], ['windup', big ? 0.7 : 0.5, 12, 'attack', (t, u, g, J) => P_.windup(u, J)],
    ['attack', 0.55, 26, 'attack', (t, u, g, J, tl) => P_.attack(cl_(tl / 0.3), J)], ['chase', 0.6, 14, 'run', (t, u, g, J) => P_.run(t, 4.5, J)], ['idle', 0.5, 14, 'idle', (t, u, g, J) => P_.idle(t, J)]] },
  dizzy: { samples: [0.4, 0.74, 0.9, 1.05, 1.3, 1.6, 2.0, 2.5, 3.0, 3.74, 4.3], phases: (big) => [
    ['idle', 0.4, 14, 'idle', (t, u, g, J) => P_.idle(t, J)], ['hurt', 0.34, 24, 'hurt', (t, u, g, J, tl) => P_.hurt(cl_(tl / 0.32), J)],
    ['dizzy', 3.0, 10, 'hurt', (t, u, g, J, tl) => P_.dizzy(tl, J)], ['chase', 0.6, 14, 'run', (t, u, g, J) => P_.run(t, 4.5, J)], ['idle', 0.5, 14, 'idle', (t, u, g, J) => P_.idle(t, J)]] },
  run: { samples: [0.3, 0.45, 0.6, 0.75, 0.9, 1.05, 1.2, 1.5, 1.8, 2.0], phases: (big) => [
    ['idle', 0.3, 14, 'idle', (t, u, g, J) => P_.idle(t, J)], ['chase', 1.2, 14, 'run', (t, u, g, J) => P_.run(t, 4.5, J)], ['idle', 0.5, 14, 'idle', (t, u, g, J) => P_.idle(t, J)]] },
};
function simulate(r, name, tEnd) {
  const J = r.J, dt = 1 / 60; let t = 0;
  K.applyPose(J, P_.idle(0, J), 1e4, 1, true);
  for (const [n, dur, rate, st, f, hop] of SEQ[name].phases(!!(r.entry.meta && r.entry.meta.big))) {
    const N = Math.round(dur / dt); let vy = hop ? 4.2 : 0, landed = !hop;
    for (let i = 1; i <= N; i++) {
      if (t + dt > tEnd + 1e-6) { r.phase = n; return; }
      t += dt;
      if (hop && !landed) { vy -= 22 * dt; J.root.position.y += vy * dt; if (J.root.position.y <= 0 && vy < 0) { J.root.position.y = 0; landed = true; } }
      K.applyPose(J, f(t, i / N, landed, J, i * dt), rate, dt, false);
      if (S.anim && r.entry.animate) r.entry.animate(J, t, st);
      r.phase = n;
    }
  }
}

// ---- camera ----
const CAMS = ['three', 'front', 'side', 'back', 'phone'];
function frameCamera() {
  const xs = rigs.map((r) => r.J.root.position.x), w = rigs.length > 1 ? Math.max(...xs) - Math.min(...xs) + 1.6 : 1.4;
  const aspect = innerWidth / innerHeight;
  camera.fov = S.cam === 'phone' ? 60 : 32; camera.aspect = aspect;
  const vfov = THREE.MathUtils.degToRad(camera.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
  const dist = S.cam === 'phone' ? S.dist : (Math.max(2.5 / (2 * Math.tan(vfov / 2)), w / (2 * Math.tan(hfov / 2))) + 0.8) / S.zoom;
  const dirs = { three: [0.62, 0.78], front: [0, 1], side: [1, 0], back: [0, -1], phone: [0, 1] };
  let [dx, dz] = dirs[S.cam] || dirs.three;
  if ((S.pose === 'all' || S.strip) && S.cam === 'three') { dx = 0.3; dz = 0.954; }   // long pose rows: shallow three-quarter so nothing leaves frame
  const y = S.cam === 'phone' ? 3.0 : 1.35;   // phone: the game's chase camera sits above and behind the hero
  const ly = S.look !== null ? S.look : S.cam === 'phone' ? 0.6 : 1.05;
  camera.position.set(dx * dist, (S.look !== null ? ly : y) + (S.cam === 'phone' ? 0 : 0.35), dz * dist);
  camera.lookAt(0, ly, 0);
  camera.updateProjectionMatrix();
}

// ---- measurement: parts, triangles, materials, height, flash sharing ----
const triCount = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;
function measureRig(J) {
  let parts = 0, tris = 0, hullTris = 0; const mats = new Set(); const flashOK = [];
  J.root.updateMatrixWorld(true);
  J.root.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    mats.add(o.material);
    if (o.material.side === THREE.BackSide && o.material.isShaderMaterial) { hullTris += triCount(o.geometry); return; }
    parts++; tris += triCount(o.geometry);
    if (o.material.userData.flash !== J.mat.userData.flash || o.material.userData.flashC !== J.mat.userData.flashC) flashOK.push(o);
  });
  const box = new THREE.Box3();
  J.root.traverse((o) => { if (o.isMesh && o.visible && !(o.material.side === THREE.BackSide)) box.expandByObject(o); });
  const hullsOK = [...mats].filter((m) => m.side === THREE.BackSide).every((m) => m === K.OUT_CHAR);
  return { parts, tris, hullTris, mats: mats.size, height: box.max.y - box.min.y, minY: box.min.y, flashBad: flashOK.length, hullsOK, swR: !!J.swR };
}
let REPORT = {};
function measure() {
  // measure each rig in the idle pose at t=0 (snap), then restore
  REPORT = { show: S.show, lod: S.lod, rigs: {} };
  for (const r of rigs) {
    if (r.pose === 'strip') continue;
    const save = r.pose; r.pose = 'idle'; K.applyPose(r.J, poseFor(r, 0), 1e4, 1, true); r.J.root.updateMatrixWorld(true);
    REPORT.rigs[r.id + (S.pose === 'all' ? '/' + save : '')] = measureRig(r.J); r.pose = save;
  }
}

// ---- loop ----
const clock = new THREE.Clock(); let frames = 0, last = 0;
const ro = document.getElementById('ro');
function frame() {
  const t = S.fixedT !== null ? S.fixedT : clock.getElapsedTime(), dt = S.fixedT !== null ? 1 : Math.min(t - last, 0.05); last = t;
  for (const r of rigs) {
    if (r.pose === 'strip') { r.J.mat.userData.flash.value = S.flash; continue; }
    K.applyPose(r.J, poseFor(r, t), S.fixedT !== null ? 1e4 : 14, dt, true);
    if (S.anim && r.entry.animate) r.entry.animate(r.J, t, STATE[r.pose]);
    r.J.mat.userData.flash.value = S.flash;
  }
  renderer.info.reset();
  renderer.render(scene, camera);
  // labels under each rig
  const v = new THREE.Vector3();
  for (const r of rigs) {
    v.set(r.J.root.position.x, -0.05, r.J.root.position.z).project(camera);
    r.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; r.el.style.top = ((1 - v.y) / 2 * innerHeight + 4) + 'px';
  }
  if (frames % 10 === 0) {
    const lines = [`<b>${S.show}</b>  pose ${S.pose}  ${S.night ? 'NIGHT' : 'DAY'}  LOD ${S.lod}  cam ${S.cam}`,
      `frame: ${renderer.info.render.calls} draw calls · ${(renderer.info.render.triangles / 1000).toFixed(1)}k tris (incl. shadow pass)`];
    const lim = S.lod ? { parts: 14, tris: 3000 } : { parts: 40, tris: 12000 };
    for (const [id, m] of Object.entries(REPORT.rigs || {})) {
      const bad = (c) => (c ? '' : ' class="bad"');
      lines.push(`${id.padEnd(22)} <span${bad(m.parts <= lim.parts)}>${String(m.parts).padStart(2)} parts</span> · <span${bad(m.tris <= lim.tris)}>${(m.tris / 1000).toFixed(2)}k tris</span> (+${(m.hullTris / 1000).toFixed(2)}k hull) · <span${bad(m.mats <= 3)}>${m.mats} mats</span> · h ${m.height.toFixed(2)} m · <span${bad(!m.flashBad)}>flash ${m.flashBad ? 'BAD' : 'ok'}</span>`);
    }
    ro.innerHTML = lines.join('\n');
  }
  frames++;
  if (frames === 3) { REPORT.frame = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }; window.__report = REPORT; window.__ready = true; }
  requestAnimationFrame(frame);
}

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'n') setNight(!S.night);
  else if (k === 'p') { S.pose = POSES[(POSES.indexOf(S.pose) + 1) % POSES.length]; rebuild(); }
  else if (k === 'l') { S.lod = S.lod ? 0 : 1; rebuild(); }
  else if (k === 'f') S.flash = S.flash ? 0 : 0.85;
  else if (k === 'a') S.anim = !S.anim;
  else if (k === 'c') { S.cam = CAMS[(CAMS.indexOf(S.cam) + 1) % CAMS.length]; frameCamera(); }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); frameCamera(); });

setNight(S.night); rebuild(); frame();
window.__S = S; window.__REG = REG;
</script>
</body>
</html>
