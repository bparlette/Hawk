<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,minimum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1220">
<title>K · Toad Street 32 · HAROLD viewer</title>
<style>
  @font-face { font-family: 'PX'; src: url(pressstart2p.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; position: fixed; width: 100%; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { font-family: 'PX', 'Courier New', monospace; color: #fff; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; image-rendering: pixelated; touch-action: none; }
  body.hd #gl { image-rendering: auto; }
  .bar { position: fixed; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; gap: 8px; }
  .grp { display: flex; gap: 8px; }
  #top { top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px; justify-content: space-between; align-items: flex-start; }
  #bot { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 10px; right: 10px; }
  #name { font-size: 14px; color: #ffe08a; text-shadow: 2px 2px 0 #000; line-height: 1.5; }
  #name small { display: block; font-size: 7px; color: #fff; opacity: .85; }
  button { font: 10px/1 'PX', monospace; color: #000; background: #e8e0c8; border: 3px solid #000; box-shadow: 3px 3px 0 #000; padding: 11px 12px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  #bQ { font-size: 15px; padding: 14px 16px; background: #ffe08a; min-width: 120px; }
  body.hd #bQ { background: #9fe0c8; }
  #bDN { background: #9cc8e8; } body.night #bDN { background: #3a4a7a; color: #fff; }
  .an.on, #bSpin.on { background: #c87a3a; color: #fff; }
  #help { position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); text-align: center; font-size: 7px; color: #fff; text-shadow: 1px 1px 0 #000; opacity: .8; }
  #back { font-size: 8px; color: #ffe08a; text-decoration: none; display: inline-block; margin-top: 8px; }
  @media (max-width: 480px) { button { font-size: 9px; padding: 10px 9px; } #bQ { font-size: 13px; min-width: 100px; } #help { bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="top" class="bar">
  <div id="name">HAROLD<small>K · TOAD STREET 32 · MODEL VIEWER</small><a id="back" href="./">▶ PLAY THE STREET</a></div>
  <div class="grp"><button id="bQ" type="button">HD</button><button id="bDN" type="button">DAY</button></div>
</div>
<div id="help">DRAG TO ROTATE · PINCH / WHEEL TO ZOOM · H, N, 1-3 KEYS</div>
<div id="bot" class="bar">
  <button class="an on" data-a="idle" type="button">IDLE</button><button class="an" data-a="walk" type="button">WALK</button><button class="an" data-a="swing" type="button">CANE SWING</button><button id="bSpin" class="on" type="button">SPIN</button>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
