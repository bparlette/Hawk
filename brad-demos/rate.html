<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rate the Games — Brad's Demos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #141420; color: #f0f0f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px 64px; }
  header { position: sticky; top: 0; background: #141420; z-index: 10; padding: 14px 0 10px; border-bottom: 1px solid #2c2c40; }
  h1 { font-size: 22px; text-align: center; letter-spacing: .5px; }
  .sub { text-align: center; color: #9a9ab0; font-size: 13px; margin: 4px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .chip { background: #1f1f2e; color: #cfcfe0; border: 1px solid #34344c; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { background: #4a5cff; border-color: #4a5cff; color: #fff; }
  .chip .n { opacity: .75; font-weight: 400; }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .tools input { flex: 1 1 160px; max-width: 320px; background: #1f1f2e; border: 1px solid #34344c; border-radius: 10px; color: #f0f0f5; padding: 9px 12px; font-size: 15px; }
  .tools button { background: #23233a; color: #f0f0f5; border: 1px solid #34344c; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tools button:active { background: #2e2e4a; }
  .section { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #8a8aa0; margin: 24px 4px 10px; }
  .card { background: #1f1f2e; border: 1px solid #2c2c40; border-left: 5px solid #2c2c40; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .card.r-up { border-left-color: #46d17a; }
  .card.r-mid { border-left-color: #ffb02e; }
  .card.r-down { border-left-color: #ff5252; }
  .top { display: flex; align-items: center; gap: 12px; }
  .thumb { width: 76px; height: 46px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #2a2a3e; }
  .tile { width: 76px; height: 46px; border-radius: 8px; flex-shrink: 0; background: #2a2a3e; color: #8a8aff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 16.5px; font-weight: 700; line-height: 1.25; }
  .desc { font-size: 12.5px; color: #a5a5bf; line-height: 1.35; margin-top: 2px; }
  .play { flex-shrink: 0; background: #4a5cff; color: #fff; font-weight: 700; font-size: 14px; border-radius: 10px; padding: 10px 14px; text-decoration: none; }
  .rate { display: flex; gap: 8px; margin-top: 10px; }
  .rb { flex: 1; height: 52px; border-radius: 12px; border: 1px solid #34344c; background: #23233a; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; color: #cfcfe0; }
  .rb .g { font-size: 20px; line-height: 1.1; }
  .rb small { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .rb.on[data-r="up"] { background: #1d6b3c; border-color: #46d17a; color: #eafff1; }
  .rb.on[data-r="mid"] { background: #7a5310; border-color: #ffb02e; color: #fff6e0; }
  .rb.on[data-r="down"] { background: #7c2222; border-color: #ff5252; color: #ffecec; }
  .empty { text-align: center; color: #8a8aa0; padding: 30px 0; font-size: 15px; }
  #exportBox { width: 100%; min-height: 120px; background: #0c0c16; color: #cfcfe0; border: 1px solid #34344c; border-radius: 10px; padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>👍 Rate the Games 👎</h1>
  <p class="sub">Thumbs up, sideways, or down on every game. Your ratings save on this device automatically — and they'll pick the seed games for the platform.</p>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search games…" autocomplete="off">
    <button id="copyBtn" type="button">📋 Copy ratings for Moth</button>
    <button id="clearBtn" type="button">Clear all</button>
  </div>
  <textarea id="exportBox" class="hidden" readonly></textarea>
</header>
<main id="list"><p class="empty">Loading games…</p></main>
<script>
(function () {
  var KEY = "game-ratings-v1";
  var ratings = {};
  try { ratings = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { ratings = {}; }
  var GAMES = [], filter = "all", query = "";
  var listEl = document.getElementById("list"), chipsEl = document.getElementById("chips");

  function keyOf(g) { return g.id + "|" + (g.path || ""); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ratings)); } catch (e) {} }
  function rateOf(g) { return ratings[keyOf(g)] || null; }

  function counts() {
    var c = { all: GAMES.length, up: 0, mid: 0, down: 0, none: 0 };
    GAMES.forEach(function (g) { var r = rateOf(g); if (r) c[r]++; else c.none++; });
    return c;
  }

  function renderChips() {
    var c = counts();
    var defs = [
      ["all", "All", c.all], ["up", "👍 Liked", c.up], ["mid", "👉 Meh", c.mid],
      ["down", "👎 Disliked", c.down], ["none", "☆ Unrated", c.none]
    ];
    chipsEl.innerHTML = "";
    defs.forEach(function (d) {
      var b = document.createElement("button");
      b.className = "chip" + (filter === d[0] ? " on" : "");
      b.innerHTML = d[1] + ' <span class="n">' + d[2] + "</span>";
      b.addEventListener("click", function () { filter = d[0]; render(); });
      chipsEl.appendChild(b);
    });
  }

  function passes(g) {
    if (filter === "up" || filter === "mid" || filter === "down") { if (rateOf(g) !== filter) return false; }
    else if (filter === "none") { if (rateOf(g)) return false; }
    if (query && (g.title || "").toLowerCase().indexOf(query) < 0) return false;
    return true;
  }

  function render() {
    renderChips();
    var cats = [], byCat = {};
    GAMES.forEach(function (g) {
      if (!passes(g)) return;
      if (!byCat[g.category]) { byCat[g.category] = []; cats.push(g.category); }
      byCat[g.category].push(g);
    });
    cats.sort(function (a, b) { return (a === "ASMR" ? 0 : 1) - (b === "ASMR" ? 0 : 1); });
    listEl.innerHTML = "";
    if (!cats.length) { listEl.innerHTML = '<p class="empty">Nothing here yet — rate some games!</p>'; return; }
    cats.forEach(function (cat) {
      var h = document.createElement("div");
      h.className = "section"; h.textContent = cat + " · " + byCat[cat].length;
      listEl.appendChild(h);
      byCat[cat].forEach(function (g) { listEl.appendChild(card(g)); });
    });
  }

  function initials(t) {
    return (t || "?").split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join("").toUpperCase();
  }

  function card(g) {
    var r = rateOf(g);
    var el = document.createElement("div");
    el.className = "card" + (r ? " r-" + r : "");
    var media;
    if (g.thumb) {
      media = '<img class="thumb" loading="lazy" alt="" src="' + g.thumb + '">';
    } else {
      media = '<div class="tile">' + initials(g.title) + "</div>";
    }
    el.innerHTML =
      '<div class="top">' + media +
      '<div class="info"><div class="name"></div><div class="desc"></div></div>' +
      '<a class="play" target="_blank" rel="noopener">Play</a></div>' +
      '<div class="rate">' +
      '<button class="rb' + (r === "up" ? " on" : "") + '" data-r="up"><span class="g">👍</span><small>Love it</small></button>' +
      '<button class="rb' + (r === "mid" ? " on" : "") + '" data-r="mid"><span class="g">👉</span><small>Sideways</small></button>' +
      '<button class="rb' + (r === "down" ? " on" : "") + '" data-r="down"><span class="g">👎</span><small>Nope</small></button>' +
      "</div>";
    el.querySelector(".name").textContent = g.title || g.id;
    el.querySelector(".desc").textContent = g.note || "";
    el.querySelector(".play").href = g.path || "#";
    var img = el.querySelector("img.thumb");
    if (img) img.addEventListener("error", function () {
      var t = document.createElement("div"); t.className = "tile"; t.textContent = initials(g.title);
      img.replaceWith(t);
    });
    el.querySelectorAll(".rb").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-r"), k = keyOf(g);
        if (ratings[k] === v) delete ratings[k]; else ratings[k] = v;
        save(); render();
      });
    });
    return el;
  }

  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value.trim().toLowerCase(); render();
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    if (!confirm("Clear all your ratings?")) return;
    ratings = {}; save(); render();
  });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var out = { up: [], sideways: [], down: [] };
    GAMES.forEach(function (g) {
      var r = rateOf(g); if (!r) return;
      out[r === "mid" ? "sideways" : r].push({ title: g.title, id: g.id, category: g.category });
    });
    var text = "My game ratings from Brad's Demos:\n" + JSON.stringify(out, null, 1);
    var box = document.getElementById("exportBox");
    function show() { box.value = text; box.classList.remove("hidden"); box.select(); }
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        var b = document.getElementById("copyBtn"); b.textContent = "✅ Copied — paste it to Moth";
        setTimeout(function () { b.textContent = "📋 Copy ratings for Moth"; }, 2500);
      }, show);
    } else show();
  });

  fetch("games.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (m) {
    GAMES = Array.isArray(m) ? m : (m.games || []);
    render();
  }).catch(function () {
    listEl.innerHTML = '<p class="empty">Could not load the game list. Check your connection and reload.</p>';
  });
})();
</script>
</body>
</html>
