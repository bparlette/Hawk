  <body>
    <div id="app">
      <div id="frame">
        <div id="playfield">
          <canvas id="game" width="1280" height="720" aria-label="Kung Fu Master notebook arcade"></canvas>
        </div>
        <div id="touch" class="touch nes-wrap show">
          <div id="nes-pad" aria-label="Sketched NES controller">
            <img
              class="pad-art"
              src="./shared/nes-pad.png"
              width="560"
              height="172"
              alt=""
              draggable="false"
            />
            <div class="pad-relabels" aria-hidden="true">
              <span class="pad-relabel relabel-b">PUNCH</span>
              <span class="pad-relabel relabel-a">KICK</span>
            </div>
            <div class="nes-hits">
              <button type="button" data-act="up" class="hit d-up" aria-label="Up"></button>
              <button type="button" data-act="down" class="hit d-down" aria-label="Down / crouch"></button>
              <button type="button" data-act="left" class="hit d-left" aria-label="Left"></button>
              <button type="button" data-act="right" class="hit d-right" aria-label="Right"></button>
              <button type="button" data-act="select" class="hit hit-select" aria-label="Select — mute"></button>
              <button type="button" data-act="start" class="hit hit-start" aria-label="Start"></button>
              <button type="button" data-act="punch" class="hit hit-b nes-face" aria-label="B punch"></button>
              <button type="button" data-act="kick" class="hit hit-a nes-face" aria-label="A kick"></button>
            </div>
          </div>
        </div>
        <p class="hint">
          Floor 1 only — walk left. B punch · A kick · ↑ jump · ↓ crouch · START pause · SELECT mute
        </p>
      </div>
    </div>
  </body>
