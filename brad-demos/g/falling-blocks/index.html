<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BLOCK CATS</title></head><body>
<script type="module">
/*RECIPE falling-blocks. ONE screen, ONE mechanic: rotate and place falling pieces to clear lines. 3-SECOND RULE: the falling piece = player, the top of the board = enemy, goal = clear lines.
  DON'T BUILD: hold queue, marathon modes, multiple piece sets, menus. Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, rnd, ri, pick, shuffle } from '../_vendor/gp2d.js';
import { face } from '../_vendor/gpsprites.js';
const S = { title: 'BLOCK CATS', sub: 'Stack it or lose it', hook: 'Stack it or lose it', hero: 'cat', bg: '#14183a', lines: 8, style: 'toon', /*SPEC*/ ...{"hook":"Stack it or lose it"} /*END*/ };
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: S.bg, style: S.style });
const CW = 10, CH = 20, CS = 36, OX = 90, OY = 120;
const SH = { I: [[0, 1], [1, 1], [2, 1], [3, 1]], O: [[1, 0], [2, 0], [1, 1], [2, 1]], T: [[1, 0], [0, 1], [1, 1], [2, 1]], L: [[2, 0], [0, 1], [1, 1], [2, 1]], J: [[0, 0], [0, 1], [1, 1], [2, 1]], S: [[1, 0], [2, 0], [0, 1], [1, 1]], Z: [[0, 0], [1, 0], [1, 1], [2, 1]] };
const COL = { I: '#4ad8ff', O: '#ffd34d', T: '#c06bff', L: '#ff9a3c', J: '#4a7bff', S: '#6ee06e', Z: '#ff5a5a' };
let bd, cur, bag, drop, lines, lockT, botPlan, botT, flashRows, combo;
const rot = (cells, n, w) => { let r = cells; for (let i = 0; i < n; i++) r = r.map(([x, y]) => [w - 1 - y, x]); return r; };
const cellsOf = p => rot(SH[p.k], p.r, p.k === 'I' ? 4 : 3).map(([x, y]) => [x + p.x, y + p.y]);
const ok = p => cellsOf(p).every(([x, y]) => x >= 0 && x < CW && y < CH && (y < 0 || !bd[y][x]));
function nextPiece() { if (!bag.length) bag = shuffle(Object.keys(SH)); cur = { k: bag.pop(), x: 3, y: -1, r: 0 }; botPlan = null; if (!ok(cur)) { sfx('hit'); g.shake(10); g.end({ win: false, score: g.score, label: 'SCORE' }); } }
function init() { bd = Array.from({ length: CH }, () => Array(CW).fill(null)); bag = []; drop = 0; lines = 0; lockT = 0; botT = .3; flashRows = []; combo = 0; g.score = 0; nextPiece(); }
g.onReset = init; init();
function lock() { for (const [x, y] of cellsOf(cur)) if (y >= 0) bd[y][x] = cur.k; sfx('thud', { vol: .6 }); g.shake(2); const full = bd.map((r, y) => r.every(Boolean) ? y : -1).filter(y => y >= 0);
  if (full.length) { combo++; for (const y of full) { for (let x = 0; x < CW; x++) g.burst(OX + x * CS + CS / 2, OY + y * CS + CS / 2, 2, { color: COL[bd[y][x]], speed: 300, size: 8 }); bd.splice(y, 1); bd.unshift(Array(CW).fill(null)); } lines += full.length; g.score += [0, 100, 300, 500, 800][full.length] * combo; sfx(full.length === 4 ? 'win' : 'merge', { pitch: comboPitch(combo * 2) }); g.popup(['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS!'][full.length], 270, OY + full[0] * CS, '#fff', 44); g.flash('#fff', .2 + full.length * .08); if (full.length === 4) { g.slowmo(.4, .8); g.shake(10); } if (lines >= S.lines) { g.end({ win: true, score: g.score, label: 'SCORE' }); return; } } else combo = 0;
  nextPiece(); }
const tryMove = (dx, dy, dr = 0) => { const p = { ...cur, x: cur.x + dx, y: cur.y + dy, r: (cur.r + dr + 4) % 4 }; if (ok(p)) { cur = p; return true; } return false; };
function plan() { let best = null; for (let r = 0; r < 4; r++) for (let x = -2; x < CW; x++) { let p = { ...cur, x, y: -1, r }; if (!ok(p)) continue; while (ok({ ...p, y: p.y + 1 })) p.y++; const b = bd.map(row => row.slice()); for (const [cx, cy] of cellsOf(p)) if (cy >= 0) b[cy][cx] = 1; let sc = 0, holes = 0, hs = [], cl = 0; for (let y = 0; y < CH; y++) if (b[y].every(Boolean)) cl++; for (let x = 0; x < CW; x++) { let h = 0, seen = false; for (let y = 0; y < CH; y++) { if (b[y][x]) { if (!seen) { h = CH - y; seen = true; } } else if (seen) holes++; } hs.push(h); } let bump = 0; for (let i = 1; i < CW; i++) bump += Math.abs(hs[i] - hs[i - 1]); sc = cl * 8 - holes * 5 - hs.reduce((a, b2) => a + b2, 0) * .35 - bump * .4; if (g.dumb()) sc = R(); if (!best || sc > best.sc) best = { x, r, sc }; } return best; }
function update(dt) {
  if (g.mode !== 'play') return; const L = g.btn('l', 10, 860, 120, 90, '◀', { key: 'ArrowLeft' }), Rr = g.btn('r', 140, 860, 120, 90, '▶', { key: 'ArrowRight' }), Ro = g.btn('o', 270, 860, 120, 90, '⟳', { key: 'ArrowUp' }), D = g.btn('d', 400, 860, 130, 90, '▼', { key: 'ArrowDown' });
  if (L.pressed) tryMove(-1, 0) && sfx('click'); if (Rr.pressed) tryMove(1, 0) && sfx('click'); if (Ro.pressed) tryMove(0, 0, 1) && sfx('click', { pitch: 1.3 }); if (g.pressed.KeyZ) tryMove(0, 0, -1); if (g.taps.some(t => t.y > OY && t.y < 850)) tryMove(0, 0, 1) && sfx('click', { pitch: 1.3 }); /* tap the board = rotate */
  if (g.auto) { botT -= dt; if (botT <= 0) { botPlan ||= plan(); const t = botPlan; if (cur.r !== t.r) { tryMove(0, 0, 1); botT = .06; } else if (cur.x !== t.x) { tryMove(Math.sign(t.x - cur.x), 0); botT = .05; } else { while (tryMove(0, 1)); lock(); botT = .22; } } }
  drop += dt * ((D.held || g.keys.ArrowDown) ? 14 : 1); const iv = Math.max(.12, .6 - lines * .03); if (drop >= iv) { drop = 0; if (!tryMove(0, 1)) lock(); }
  g.hud.l = `${g.score}`; g.hud.r = `LINES ${lines}/${S.lines}`; g.state = { lines, score: g.score };
}
function draw(c) {
  c.fillStyle = '#0c0f26'; c.fillRect(OX - 8, OY - 8, CW * CS + 16, CH * CS + 16); c.strokeStyle = '#4a5ad0'; c.lineWidth = 6; c.strokeRect(OX - 8, OY - 8, CW * CS + 16, CH * CS + 16);
  c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 1; for (let x = 0; x <= CW; x++) { c.beginPath(); c.moveTo(OX + x * CS, OY); c.lineTo(OX + x * CS, OY + CH * CS); c.stroke(); } for (let y = 0; y <= CH; y++) { c.beginPath(); c.moveTo(OX, OY + y * CS); c.lineTo(OX + CW * CS, OY + y * CS); c.stroke(); }
  const cell = (x, y, k, a = 1) => { c.globalAlpha = a; c.fillStyle = COL[k]; c.beginPath(); c.roundRect(OX + x * CS + 2, OY + y * CS + 2, CS - 4, CS - 4, 7); c.fill(); c.lineWidth = 3; c.strokeStyle = '#000'; c.stroke(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(OX + x * CS + 7, OY + y * CS + 6, CS - 18, 5); c.globalAlpha = 1; };
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) if (bd[y][x]) cell(x, y, bd[y][x]);
  if (g.mode === 'play') { let gp = { ...cur }; while (ok({ ...gp, y: gp.y + 1 })) gp.y++; for (const [x, y] of cellsOf(gp)) if (y >= 0) cell(x, y, cur.k, .22); for (const [x, y] of cellsOf(cur)) if (y >= 0) cell(x, y, cur.k); const m = cellsOf(cur)[1]; if (m && m[1] >= 0) face(c, S.hero, OX + m[0] * CS + CS / 2, OY + m[1] * CS + CS / 2, 11); }
}
g.run(update, draw);
</script></body></html>
