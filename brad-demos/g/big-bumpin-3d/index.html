<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BIG BUMPIN' - Broiler Arena Replica</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; font-family: 'Bangers', cursive; }

    /* Comic Halftone & Ink Frame */
    #comic-frame {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background-image: radial-gradient(rgba(0,0,0,0.22) 1px, transparent 0);
      background-size: 5px 5px;
      border: 8px solid #000;
      box-shadow: inset 0 0 0 4px #ffbe0b, inset 0 0 60px rgba(0,0,0,0.9);
    }

    /* Top Player Status Bars (Authentic 4-Corner Arcade HUD) */
    #hud {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; pointer-events: none;
    }
    .p-hud {
      background: #1a1a1a; border: 4px solid #000; padding: 8px 12px;
      box-shadow: 5px 5px 0 #000; transform: skew(-4deg); color: #fff;
    }
    .p-header { display: flex; justify-content: space-between; font-size: 22px; letter-spacing: 1px; margin-bottom: 4px; }
    .hp-bar-bg { width: 100%; height: 14px; background: #333; border: 2px solid #000; margin-bottom: 4px; position: relative; }
    .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ef233c, #ffbe0b, #38b000); transition: width 0.1s; }
    .heat-bar-bg { width: 100%; height: 7px; background: #222; border: 1px solid #000; }
    .heat-bar-fill { height: 100%; width: 0%; background: #ff0055; transition: width 0.1s; }
    .p-powerup { font-size: 16px; color: #00f5d4; margin-top: 3px; height: 18px; }

    /* Bottom Player Dashboard */
    #bottom-hud {
      position: absolute; bottom: 20px; left: 24px; right: 24px; z-index: 10;
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
    }
    #weapon-box {
      background: #ffbe0b; border: 5px solid #000; padding: 10px 22px;
      box-shadow: 7px 7px 0 #000; transform: rotate(-2deg); color: #000;
    }
    #weapon-box .lbl { font-size: 18px; color: #d90429; }
    #weapon-box .val { font-size: 36px; }
    #controls-bar {
      background: #fff; border: 4px solid #000; padding: 8px 18px;
      box-shadow: 5px 5px 0 #000; font-size: 20px; color: #000; pointer-events: auto;
    }
    .cam-btn {
      font-family: 'Bangers', cursive; font-size: 18px; padding: 4px 12px; margin-left: 10px;
      background: #00f5d4; border: 3px solid #000; cursor: pointer;
    }

    /* Comic Onomatopoeia Popups */
    #popups { position: absolute; inset: 0; pointer-events: none; z-index: 12; overflow: hidden; }
    .comic-pop {
      position: absolute; font-size: 52px; color: #ffbe0b;
      -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #d90429;
      transform: translate(-50%, -50%) scale(0);
      animation: bang 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes bang {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-12deg); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(1.25) rotate(6deg); opacity: 1; }
      100% { transform: translate(-50%, -85%) scale(0.9) rotate(0deg); opacity: 0; }
    }

    /* Lobby Menu */
    #menu {
      position: absolute; inset: 0; z-index: 30;
      background: radial-gradient(circle, rgba(255,190,11,0.94) 0%, rgba(180,0,20,0.98) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    h1 { font-size: 92px; color: #ffbe0b; -webkit-text-stroke: 4px #000; text-shadow: 9px 9px 0 #000; transform: rotate(-2deg); }
    h2 { font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 3px 3px 0 #000; margin: 10px 0 28px; }
    .btn-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .btn {
      font-family: 'Bangers', cursive; font-size: 32px; padding: 14px 32px;
      background: #fff; color: #000; border: 5px solid #000; box-shadow: 7px 7px 0 #000;
      cursor: pointer; transform: skew(-5deg); transition: 0.1s;
    }
    .btn:hover { background: #00f5d4; transform: skew(-5deg) scale(1.06); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/playroomkit/multiplayer.full.umd.js"></script>
</head>
<body>

  <div id="comic-frame"></div>

  <div id="hud">
    <div class="p-hud">
      <div class="p-header"><span>👑 THE KING</span><span id="k0">0 KOs</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp0"></div></div>
      <div class="heat-bar-bg"><div class="heat-bar-fill" id="ht0"></div></div>
      <div class="p-powerup" id="pw0">READY</div>
    </div>
    <div class="p-hud">
      <div class="p-header"><span>🐔 CHICKEN</span><span id="k1">0 KOs</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp1"></div></div>
      <div class="heat-bar-bg"><div class="heat-bar-fill" id="ht1"></div></div>
      <div class="p-powerup" id="pw1">READY</div>
    </div>
    <div class="p-hud">
      <div class="p-header"><span>🧒 WHOPPER JR</span><span id="k2">0 KOs</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp2"></div></div>
      <div class="heat-bar-bg"><div class="heat-bar-fill" id="ht2"></div></div>
      <div class="p-powerup" id="pw2">READY</div>
    </div>
    <div class="p-hud">
      <div class="p-header"><span>🍔 BROILER BOT</span><span id="k3">0 KOs</span></div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp3"></div></div>
      <div class="heat-bar-bg"><div class="heat-bar-fill" id="ht3"></div></div>
      <div class="p-powerup" id="pw3">READY</div>
    </div>
  </div>

  <div id="popups"></div>

  <div id="bottom-hud">
    <div id="weapon-box">
      <div class="lbl">EQUIPPED POWER-UP (SPACE / E)</div>
      <div class="val" id="my-weapon">NONE - COLLECT BARRELS!</div>
    </div>
    <div id="controls-bar">
      <b>W/S</b>: Gas/Rev &nbsp;|&nbsp; <b>A/D</b>: Steer &nbsp;|&nbsp; <b>SPACE</b>: Use Power-Up / Ram
      <button class="cam-btn" id="cam-toggle">🎥 CAM: CHASE (C)</button>
    </div>
  </div>

  <div id="menu">
    <h1>BIG BUMPIN'</h1>
    <h2>THE BROILER ARENA — WALLED CARNIVAL BUMPER CARS</h2>
    <div class="btn-row">
      <button class="btn" id="start-solo">PLAY BROILER ARENA (VS BOTS)</button>
      <button class="btn" id="start-online">1-4P ONLINE MULTIPLAYER</button>
    </div>
  </div>

  <script>
    // --- 1. CORE SCENE & TOON SHADER PIPELINE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x191224);
    scene.fog = new THREE.FogExp2(0x191224, 0.008);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 4-Band Comic Book Cel-Shading Texture
    const toonData = new Uint8Array([35, 110, 190, 255]);
    const toonTex = new THREE.DataTexture(toonData, 4, 1, THREE.LuminanceFormat);
    toonTex.minFilter = THREE.NearestFilter;
    toonTex.magFilter = THREE.NearestFilter;
    toonTex.needsUpdate = true;

    function toonMat(color, emissive = 0x000000) {
      return new THREE.MeshToonMaterial({ color, emissive, gradientMap: toonTex });
    }

    function addInkOutline(mesh, scale = 1.06) {
      const outMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
      const outMesh = new THREE.Mesh(mesh.geometry, outMat);
      outMesh.scale.setScalar(scale);
      mesh.add(outMesh);
    }

    // Carnival Arena Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const mainLight = new THREE.DirectionalLight(0xfff1d0, 1.2);
    mainLight.position.set(20, 45, 25);
    mainLight.castShadow = true;
    scene.add(mainLight);

    // --- 2. BUILD "THE BROILER" WALLED OCTAGONAL BUMPER-CAR RINK ---
    const ARENA_SIZE = 28;
    const arena = new THREE.Group();
    scene.add(arena);

    // Checkerboard Metallic Bumper Floor
    const floorCanvas = document.createElement('canvas');
    floorCanvas.width = 512; floorCanvas.height = 512;
    const ctx = floorCanvas.getContext('2d');
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#2b2d42' : '#3a3d56';
        ctx.fillRect(x * 64, y * 64, 64, 64);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        ctx.strokeRect(x * 64, y * 64, 64, 64);
      }
    }
    const floorTex = new THREE.CanvasTexture(floorCanvas);
    floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
    floorTex.repeat.set(4, 4);

    const floorGeo = new THREE.CylinderGeometry(ARENA_SIZE, ARENA_SIZE, 2, 8);
    const floorMat = new THREE.MeshToonMaterial({ map: floorTex, gradientMap: toonTex });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -1;
    floor.rotation.y = Math.PI / 8;
    floor.receiveShadow = true;
    arena.add(floor);

    // 8 Walled Carnival Shock Bumpers + Neon Pillars
    const wallPanels = [];
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      const dist = ARENA_SIZE * Math.cos(Math.PI / 8) - 0.8;
      const wx = Math.sin(ang) * dist;
      const wz = Math.cos(ang) * dist;

      // Wall Bumper Beam
      const isShockWall = i % 2 === 0;
      const wallGeo = new THREE.BoxGeometry(21.5, 3.2, 1.8);
      const wallMesh = new THREE.Mesh(wallGeo, toonMat(isShockWall ? 0x00f5d4 : 0xd90429, isShockWall ? 0x003344 : 0x000000));
      wallMesh.position.set(wx, 1.6, wz);
      wallMesh.rotation.y = ang;
      addInkOutline(wallMesh, 1.04);
      arena.add(wallMesh);

      // Corner Carnival Pylon
      const pAng = ang + Math.PI / 8;
      const px = Math.sin(pAng) * (ARENA_SIZE - 0.5);
      const pz = Math.cos(pAng) * (ARENA_SIZE - 0.5);
      const pylon = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 6, 12), toonMat(0xffbe0b));
      pylon.position.set(px, 3, pz);
      addInkOutline(pylon, 1.06);
      arena.add(pylon);

      wallPanels.push({ nx: -Math.sin(ang), nz: -Math.cos(ang), dist, isShockWall });
    }

    // Overhead Electric Conductive Grid (Classic Bumper Car Ceiling)
    const gridWire = new THREE.GridHelper(ARENA_SIZE * 1.8, 14, 0xffbe0b, 0x444466);
    gridWire.position.y = 14;
    arena.add(gridWire);

    // 4 Flame-Broiler Floor Grates (Timed Fire Hazards)
    const broilerGrates = [];
    const grateCoords = [[-11, -11], [11, -11], [-11, 11], [11, 11]];
    grateCoords.forEach(([gx, gz]) => {
      const gGroup = new THREE.Group();
      gGroup.position.set(gx, 0.05, gz);

      const base = new THREE.Mesh(new THREE.CylinderGeometry(3.8, 3.8, 0.2, 16), toonMat(0x222222));
      addInkOutline(base, 1.04);
      gGroup.add(base);

      const flameCone = new THREE.Mesh(new THREE.ConeGeometry(3.2, 6.5, 12), toonMat(0xff5400, 0xd90429));
      flameCone.position.y = 3.2;
      flameCone.visible = false;
      addInkOutline(flameCone, 1.06);
      gGroup.add(flameCone);

      scene.add(gGroup);
      broilerGrates.push({ x: gx, z: gz, radius: 3.8, flameMesh: flameCone, active: false });
    });

    // --- 3. AUTHENTIC BUMPER CAR BUILDER (WITH CONDUCTIVE POLE, SPARKS & HANDS OF THE KING) ---
    const ROSTER = [
      { name: "THE KING", color: 0xffbe0b, trim: 0xd90429, pos: [-16, -16] },
      { name: "SUBSERVIENT CHICKEN", color: 0xffffff, trim: 0xf77f00, pos: [16, -16] },
      { name: "WHOPPER JR", color: 0xd90429, trim: 0xffbe0b, pos: [-16, 16] },
      { name: "BROILER BOT", color: 0x7209b7, trim: 0x00f5d4, pos: [16, 16] }
    ];

    const cars = [];

    function buildBumperCar(cfg, index) {
      const root = new THREE.Group();

      // Oversized Black Rubber Bumper Skirt
      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.25, 0.75, 24), toonMat(0x1b1b1b));
      skirt.position.y = 0.4;
      addInkOutline(skirt, 1.05);
      root.add(skirt);

      // Metallic Bumper Ring
      const chrome = new THREE.Mesh(new THREE.TorusGeometry(2.12, 0.16, 10, 24), toonMat(0xdcdcdc));
      chrome.rotation.x = Math.PI / 2;
      chrome.position.y = 0.45;
      root.add(chrome);

      // Molded Fiberglass Carnival Body
      const body = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.9, 1.1, 20), toonMat(cfg.color));
      body.position.y = 1.0;
      addInkOutline(body, 1.06);
      root.add(body);

      // Front Hood Grille & Headlights
      const hood = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 1.2), toonMat(cfg.trim));
      hood.position.set(0, 1.05, 1.2);
      addInkOutline(hood, 1.06);
      root.add(hood);

      // Steering Wheel & Driver Mascot
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.68, 16, 16), toonMat(0xffcb77));
      head.position.set(0, 2.15, -0.15);
      addInkOutline(head, 1.08);
      root.add(head);

      // King's Crown / Mascot Crest
      const crown = new THREE.Mesh(
        index === 0 ? new THREE.CylinderGeometry(0.65, 0.5, 0.65, 7) : new THREE.ConeGeometry(0.6, 0.8, 8),
        toonMat(cfg.trim)
      );
      crown.position.set(0, 2.85, -0.15);
      addInkOutline(crown, 1.08);
      root.add(crown);

      // Classic Rear Stinger Pole (Reaches toward overhead electric grid)
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 12.5, 8), toonMat(0xaaaaaa));
      pole.position.set(0, 6.8, -1.65);
      pole.rotation.x = -0.12;
      root.add(pole);

      // Power-Up Visual Attachments:
      // 1) "Hands of the King" Giant Spring Fists
      const fistsGroup = new THREE.Group();
      const leftFist = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.6), toonMat(0xffbe0b));
      leftFist.position.set(-1.3, 1.1, 2.7);
      addInkOutline(leftFist, 1.08);
      const rightFist = leftFist.clone();
      rightFist.position.x = 1.3;
      fistsGroup.add(leftFist, rightFist);
      fistsGroup.visible = false;
      root.add(fistsGroup);

      // 2) Ice Cube Freeze Block
      const iceCube = new THREE.Mesh(
        new THREE.BoxGeometry(4.6, 4.2, 4.6),
        new THREE.MeshToonMaterial({ color: 0x00f5d4, transparent: true, opacity: 0.65, gradientMap: toonTex })
      );
      iceCube.position.y = 2.0;
      iceCube.visible = false;
      root.add(iceCube);

      // 3) Shock Aura Ring
      const shockRing = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.18, 8, 24), toonMat(0x00f5d4, 0x00f5d4));
      shockRing.rotation.x = Math.PI / 2;
      shockRing.position.y = 0.8;
      shockRing.visible = false;
      root.add(shockRing);

      scene.add(root);

      return {
        index,
        name: cfg.name,
        mesh: root,
        fistsGroup,
        iceCube,
        shockRing,
        x: cfg.pos[0],
        z: cfg.pos[1],
        y: 0,
        vy: 0,
        vx: 0,
        vz: 0,
        angle: Math.atan2(-cfg.pos[0], -cfg.pos[1]),
        hp: 100,
        heat: 0,
        kos: 0,
        powerup: null,
        powerTimer: 0,
        frozenTimer: 0,
        stunTimer: 0,
        lastAttacker: null
      };
    }

    ROSTER.forEach((cfg, i) => cars.push(buildBumperCar(cfg, i)));

    // --- 4. MYSTERY BARREL POWER-UP SPAWNER ---
    const POWER_TYPES = ["HANDS OF THE KING", "ICE CUBE FREEZE", "ELECTRO-ZAP", "FLAME TURBO", "WHOPPER HEAL"];
    const barrels = [];

    function createBarrel(bx, bz) {
      const grp = new THREE.Group();
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 2.0, 14), toonMat(0xd90429));
      cyl.position.y = 1.2;
      addInkOutline(cyl, 1.07);
      grp.add(cyl);

      const stripe = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.55, 14), toonMat(0xffbe0b));
      stripe.position.y = 1.2;
      grp.add(stripe);

      grp.position.set(bx, 0, bz);
      scene.add(grp);
      return { mesh: grp, x: bx, z: bz, active: true, respawn: 0 };
    }

    [[0, 0], [-14, 0], [14, 0], [0, -14], [0, 14]].forEach(([x, z]) => barrels.push(createBarrel(x, z)));

    // --- 5. COMIC POPUPS & PARTICLE SPARKS ---
    const popupsDiv = document.getElementById('popups');
    function popText(wx, wy, wz, text) {
      const v = new THREE.Vector3(wx, wy + 2.6, wz).project(camera);
      if (v.z > 1) return;
      const el = document.createElement('div');
      el.className = 'comic-pop';
      el.innerText = text;
      el.style.left = `${(v.x * 0.5 + 0.5) * window.innerWidth}px`;
      el.style.top = `${(-(v.y * 0.5) + 0.5) * window.innerHeight}px`;
      popupsDiv.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    // --- 6. INPUTS, CAMERA MODES & MULTIPLAYER ---
    const inputState = { up: false, down: false, left: false, right: false, action: false };
    let chaseCam = true;
    let camShake = 0;

    function toggleCam() {
      chaseCam = !chaseCam;
      document.getElementById('cam-toggle').innerText = chaseCam ? '🎥 CAM: CHASE (C)' : '🎥 CAM: ARENA TV (C)';
    }
    document.getElementById('cam-toggle').addEventListener('click', toggleCam);

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') inputState.up = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') inputState.down = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputState.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') inputState.right = true;
      if (e.code === 'Space' || e.code === 'KeyE') inputState.action = true;
      if (e.code === 'KeyC') toggleCam();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') inputState.up = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') inputState.down = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputState.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') inputState.right = false;
      if (e.code === 'Space' || e.code === 'KeyE') inputState.action = false;
    });

    let running = false;
    let onlineMode = false;
    let roomPlayers = [];

    document.getElementById('start-solo').onclick = () => {
      document.getElementById('menu').style.display = 'none';
      running = true;
    };

    document.getElementById('start-online').onclick = async () => {
      if (!window.Playroom) {
        document.getElementById('menu').style.display = 'none';
        running = true;
        return;
      }
      try {
        await Playroom.insertCoin({ maxPlayersPerRoom: 4 });
        document.getElementById('menu').style.display = 'none';
        onlineMode = true;
        running = true;
        Playroom.onPlayerJoin(p => {
          roomPlayers.push(p);
          p.onQuit(() => roomPlayers = roomPlayers.filter(x => x.id !== p.id));
        });
      } catch (e) {
        document.getElementById('menu').style.display = 'none';
        running = true;
      }
    };

    // --- 7. AUTHENTIC BIG BUMPIN' GAMEPLAY & PHYSICS ENGINE ---
    let frameCount = 0;

    function activatePowerup(c) {
      if (!c.powerup) {
        // Mini-lunge bump if no powerup held
        if (c.heat < 75) {
          c.vx += Math.sin(c.angle) * 0.32;
          c.vz += Math.cos(c.angle) * 0.32;
          c.heat = Math.min(100, c.heat + 22);
        }
        return;
      }

      const p = c.powerup;
      c.powerup = null;

      if (p === "HANDS OF THE KING") {
        c.powerTimer = 300; // 5 seconds of double damage & giant fists
        c.fistsGroup.visible = true;
        popText(c.x, c.y, c.z, "2X2 HANDS OF THE KING!");
      } else if (p === "FLAME TURBO") {
        c.vx += Math.sin(c.angle) * 0.95;
        c.vz += Math.cos(c.angle) * 0.95;
        popText(c.x, c.y, c.z, "FLAME BROILED TURBO!");
      } else if (p === "WHOPPER HEAL") {
        c.hp = Math.min(100, c.hp + 45);
        c.heat = 0;
        popText(c.x, c.y, c.z, "+45 HP WHOPPER!");
      } else if (p === "ELECTRO-ZAP") {
        c.shockRing.visible = true;
        c.powerTimer = 240;
        popText(c.x, c.y, c.z, "POWER SURGE!");
      } else if (p === "ICE CUBE FREEZE") {
        // Freeze nearest opponent within range
        let nearest = null, bestD = 18;
        cars.forEach(other => {
          if (other.index !== c.index) {
            const d = Math.hypot(other.x - c.x, other.z - c.z);
            if (d < bestD) { bestD = d; nearest = other; }
          }
        });
        if (nearest) {
          nearest.frozenTimer = 180;
          nearest.iceCube.visible = true;
          popText(nearest.x, nearest.y, nearest.z, "DEEP FREEZE!");
        } else {
          popText(c.x, c.y, c.z, "NO TARGET IN RANGE!");
        }
      }
    }

    function getAIControl(c) {
      // Find closest barrel if unarmed, or closest enemy to ram
      let tx = 0, tz = 0;
      let targetDist = 999;

      if (!c.powerup) {
        barrels.forEach(b => {
          if (b.active) {
            const d = Math.hypot(b.x - c.x, b.z - c.z);
            if (d < targetDist) { targetDist = d; tx = b.x; tz = b.z; }
          }
        });
      }

      if (targetDist > 16 || c.powerup) {
        cars.forEach(other => {
          if (other.index !== c.index) {
            const d = Math.hypot(other.x - c.x, other.z - c.z);
            if (d < targetDist) { targetDist = d; tx = other.x; tz = other.z; }
          }
        });
      }

      const desired = Math.atan2(tx - c.x, tz - c.z);
      let diff = desired - c.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;

      return {
        up: true,
        down: false,
        left: diff > 0.12,
        right: diff < -0.12,
        action: (c.powerup && targetDist < 12) || (targetDist < 5.5 && Math.abs(diff) < 0.25 && Math.random() < 0.08)
      };
    }

    function updateHUD() {
      cars.forEach((c, i) => {
        document.getElementById(`hp${i}`).style.width = `${Math.max(0, c.hp)}%`;
        document.getElementById(`ht${i}`).style.width = `${Math.min(100, c.heat)}%`;
        document.getElementById(`k${i}`).innerText = `${c.kos} KOs`;
        const status = c.frozenTimer > 0 ? "❄️ FROZEN!" : (c.stunTimer > 0 ? "⚡ OVERHEATED!" : (c.powerup || "NONE"));
        document.getElementById(`pw${i}`).innerText = status;
      });
      const p0 = cars[0];
      document.getElementById('my-weapon').innerText = p0.powerup
        ? `🔥 ${p0.powerup} (PRESS SPACE!)`
        : (p0.powerTimer > 0 ? "👑 HANDS OF THE KING ACTIVE!" : "NONE - HIT A CROWN BARREL!");
    }

    function stepSimulation() {
      if (!running) return;
      frameCount++;

      // Cycle Flame-Broiler Floor Grates every 3.5 seconds
      const broilerActive = (Math.floor(frameCount / 140) % 2) === 1;
      broilerGrates.forEach(g => {
        g.active = broilerActive;
        g.flameMesh.visible = broilerActive;
        if (broilerActive) g.flameMesh.rotation.y += 0.25;
      });

      // Rotate and Respawn Mystery Crown Barrels
      barrels.forEach(b => {
        if (!b.active) {
          b.respawn--;
          if (b.respawn <= 0) { b.active = true; b.mesh.visible = true; }
        } else {
          b.mesh.rotation.y += 0.05;
          b.mesh.position.y = Math.sin(frameCount * 0.08) * 0.35;
        }
      });

      // Step Each Bumper Car
      cars.forEach((c, idx) => {
        const ctrl = idx === 0 ? inputState : getAIControl(c);

        // Cooldowns & Timers
        if (c.heat > 0) c.heat = Math.max(0, c.heat - 0.28);
        if (c.heat >= 100 && c.stunTimer <= 0) {
          c.stunTimer = 90;
          popText(c.x, c.y, c.z, "OVERHEATED!");
        }
        if (c.stunTimer > 0) c.stunTimer--;
        if (c.frozenTimer > 0) {
          c.frozenTimer--;
          if (c.frozenTimer === 0) c.iceCube.visible = false;
        }
        if (c.powerTimer > 0) {
          c.powerTimer--;
          if (c.powerTimer === 0) {
            c.fistsGroup.visible = false;
            c.shockRing.visible = false;
          }
        }

        // Steering & Throttle (Disabled if Frozen or Stunned)
        if (c.frozenTimer <= 0 && c.stunTimer <= 0) {
          const turnRate = 0.058;
          if (ctrl.left) c.angle += turnRate;
          if (ctrl.right) c.angle -= turnRate;

          const topAccel = c.powerTimer > 0 ? 0.046 : 0.036;
          if (ctrl.up) {
            c.vx += Math.sin(c.angle) * topAccel;
            c.vz += Math.cos(c.angle) * topAccel;
          } else if (ctrl.down) {
            c.vx -= Math.sin(c.angle) * 0.024;
            c.vz -= Math.cos(c.angle) * 0.024;
          }

          if (ctrl.action) {
            activatePowerup(c);
            if (idx === 0) inputState.action = false;
          }
        }

        // Apply Velocity & Heavy Bumper Car Friction
        c.x += c.vx;
        c.z += c.vz;
        c.vx *= 0.935;
        c.vz *= 0.935;

        // Gravity for Vertical Broiler Launches
        if (c.y > 0 || c.vy !== 0) {
          c.y += c.vy;
          c.vy -= 0.045;
          if (c.y <= 0) { c.y = 0; c.vy = 0; }
        }

        // Check Mystery Barrel Collection
        barrels.forEach(b => {
          if (b.active && Math.hypot(c.x - b.x, c.z - b.z) < 3.1 && !c.powerup) {
            b.active = false;
            b.mesh.visible = false;
            b.respawn = 320;
            c.powerup = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
            popText(c.x, c.y, c.z, c.powerup + "!");
          }
        });

        // Check Flame-Broiler Floor Grate Hazard
        broilerGrates.forEach(g => {
          if (g.active && Math.hypot(c.x - g.x, c.z - g.z) < g.radius && c.y < 0.5) {
            c.vy = 0.68;
            c.hp -= 12;
            c.heat += 25;
            if (idx === 0) camShake = 0.7;
            popText(c.x, c.y, c.z, "FLAME BROILED! -12");
          }
        });

        // Check Walled Octagonal Shock Bumpers
        wallPanels.forEach(w => {
          // Project car onto wall outward normal
          const outX = -w.nx;
          const outZ = -w.nz;
          const proj = c.x * outX + c.z * outZ;
          const maxR = w.dist - 2.2;
          if (proj > maxR) {
            const pen = proj - maxR;
            c.x -= outX * pen;
            c.z -= outZ * pen;

            // Reflect velocity off bumper wall
            const dot = c.vx * outX + c.vz * outZ;
            if (dot > 0) {
              const bounceMult = w.isShockWall ? 1.85 : 1.25;
              c.vx -= outX * dot * (1 + bounceMult);
              c.vz -= outZ * dot * (1 + bounceMult);
              if (w.isShockWall) {
                c.heat += 14;
                c.hp -= 4;
                popText(c.x, c.y, c.z, "SHOCK WALL!");
                if (idx === 0) camShake = 0.45;
              }
            }
          }
        });

        // Check Car Wreck / KO Respawn
        if (c.hp <= 0) {
          popText(c.x, c.y + 1, c.z, "WRECKED!! KO!");
          if (c.lastAttacker !== null && c.lastAttacker !== c.index) {
            cars[c.lastAttacker].kos++;
          }
          c.hp = 100;
          c.heat = 0;
          c.y = 8;
          c.vx = 0; c.vz = 0;
          c.x = ROSTER[c.index].pos[0] * 0.75;
          c.z = ROSTER[c.index].pos[1] * 0.75;
        }

        c.mesh.position.set(c.x, c.y, c.z);
        c.mesh.rotation.y = c.angle;
      });

      // Car-to-Car High-Impact Bumper Collisions
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          const a = cars[i], b = cars[j];
          const dx = b.x - a.x, dz = b.z - a.z;
          const dist = Math.hypot(dx, dz);
          const minDist = 4.25;

          if (dist < minDist && dist > 0.001) {
            const nx = dx / dist, nz = dz / dist;
            const overlap = minDist - dist;
            a.x -= nx * overlap * 0.5; a.z -= nz * overlap * 0.5;
            b.x += nx * overlap * 0.5; b.z += nz * overlap * 0.5;

            const rvx = b.vx - a.vx, rvz = b.vz - a.vz;
            const sepVel = rvx * nx + rvz * nz;

            if (sepVel < 0) {
              const force = Math.max(0.38, Math.abs(sepVel) * 1.45);
              a.vx -= nx * force; a.vz -= nz * force;
              b.vx += nx * force; b.vz += nz * force;

              // Calculate Directional Ramming Bonus (Front Hood hits hurt more!)
              const aForwardHit = Math.max(0.3, Math.sin(a.angle) * nx + Math.cos(a.angle) * nz);
              const bForwardHit = Math.max(0.3, -(Math.sin(b.angle) * nx + Math.cos(b.angle) * nz));

              let dmgToB = Math.round(force * 22 * aForwardHit * (a.fistsGroup.visible ? 2.2 : 1));
              let dmgToA = Math.round(force * 22 * bForwardHit * (b.fistsGroup.visible ? 2.2 : 1));

              if (a.shockRing.visible) { dmgToB += 10; b.heat += 30; }
              if (b.shockRing.visible) { dmgToA += 10; a.heat += 30; }

              b.hp -= dmgToB; b.heat += dmgToB * 0.8; b.lastAttacker = a.index;
              a.hp -= dmgToA; a.heat += dmgToA * 0.8; a.lastAttacker = b.index;

              if (i === 0 || j === 0) camShake = Math.min(1.0, force * 1.2);
              popText((a.x + b.x) * 0.5, 1.5, (a.z + b.z) * 0.5, dmgToB > 18 || dmgToA > 18 ? "WHOPPER CRASH!!" : "BUMP!");
            }
          }
        }
      }

      // Dynamic Third-Person Chase Camera vs Arena TV Camera
      const p0 = cars[0];
      if (chaseCam) {
        const targetCamX = p0.x - Math.sin(p0.angle) * 14.5;
        const targetCamZ = p0.z - Math.cos(p0.angle) * 14.5;
        camera.position.x += (targetCamX - camera.position.x) * 0.12;
        camera.position.z += (targetCamZ - camera.position.z) * 0.12;
        camera.position.y += (8.5 - camera.position.y) * 0.12;
        if (camShake > 0.01) {
          camera.position.x += (Math.random() - 0.5) * camShake;
          camera.position.y += (Math.random() - 0.5) * camShake;
          camShake *= 0.85;
        }
        camera.lookAt(p0.x + Math.sin(p0.angle) * 6, p0.y + 1.8, p0.z + Math.cos(p0.angle) * 6);
      } else {
        camera.position.set(0, 38, 38);
        camera.lookAt(0, 0, 0);
      }

      updateHUD();
    }

    function animate() {
      requestAnimationFrame(animate);
      stepSimulation();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
