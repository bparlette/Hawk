<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAC CAT</title></head><body>
<script type="module">
/*RECIPE grid-chaser. ONE screen, ONE mechanic: swipe to steer through a maze, eat every dot, zombies chase, big fish reverse the chase. 3-SECOND RULE: orange cat = player, green zombies = enemy, goal = eat all the dots.
  DON'T BUILD: multiple mazes, extra ghost types beyond two, cutscenes, fruit. Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, rnd, pick, shuffle, clamp } from '../_vendor/gp2d.js';
import { drawChar, heroKind, heroColor } from '../_vendor/gpsprites.js';
import { DIRS, bfs } from '../_vendor/gpgrid.js';
import { drawWorld, drawBackdrop, WORLDS } from '../_vendor/gpworld.js';
import { TouchController, isTouchDevice } from '../_vendor/gptouch.js';
const S = { title: 'PAC CAT', sub: 'Swipe to turn', hook: 'Eat everything. Avoid the zombies.', hero: 'cat', heroColor: '#ff9a3c', foe: 'zombie', bg: '#0b0f26', wall: '#3a5bff', style: 'toon', /*SPEC*/ ...{"hook":"Eat everything. Avoid the zombies."} /*END*/ };
const WLD = S.world ? WORLDS[S.world] : null; /* optional world skin (docs/WORLDS.md): drawing + bg only */
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: WLD ? WLD.bg : S.bg, style: S.style });
const CW = 7, CH = 8, W = CW * 2 + 1, H = CH * 2 + 1, TS = 36, OX = 0, OY = 180;
const TC = isTouchDevice() ? new TouchController({ buttons: [ { id: 'a', label: '' } ], maxRadius: 60 }) : null; /* TOUCH: floating stick only; the unused button is hidden (needs kit support for buttons: []). docs/TOUCH.md */
if (TC) TC._buttons.a.el.style.display = 'none';
let botGoal = null, wall, dots, pl, gh, scared, eaten, left, swipe, combo, botT, board = 1, maxBoards = 2;
function maze() { wall = Array.from({ length: H }, () => Array(W).fill(true)); const seen = new Set(), st = [[0, 0]]; wall[1][1] = false; seen.add('0,0');
  while (st.length) { const [cx, cy] = st.at(-1), nb = shuffle(DIRS).map(([dx, dy]) => [cx + dx, cy + dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < CW && y < CH && !seen.has(x + ',' + y)); if (!nb.length) { st.pop(); continue; } const [nx, ny] = nb[0]; seen.add(nx + ',' + ny); wall[cy * 2 + 1 + (ny - cy)][cx * 2 + 1 + (nx - cx)] = false; wall[ny * 2 + 1][nx * 2 + 1] = false; st.push([nx, ny]); }
  for (let i = 0; i < 70; i++) { const x = ri(2, W - 3), y = ri(2, H - 3); if (wall[y][x] && ((!wall[y][x - 1] && !wall[y][x + 1]) || (!wall[y - 1][x] && !wall[y + 1][x]))) wall[y][x] = false; } }
const ri = (a, b) => Math.floor(rnd(a, b + 1)), free = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !wall[y][x];
const mk = (x, y, sp) => ({ tx: x, ty: y, nx: x, ny: y, prog: 0, sp, dx: 0, dy: 0 });
function init() { board = 1; resetBoard(); }
function resetBoard() { maze(); dots = new Map(); eaten = 0; const cand = []; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (free(x, y) && x % 2 === 1 && y % 2 === 1) cand.push(x + ',' + y); for (const k of shuffle(cand).slice(0, 9)) dots.set(k, 1); for (const [x, y] of [[1, 1], [W - 2, 1], [1, H - 2], [W - 2, H - 2]]) dots.set(x + ',' + y, 2);
  pl = mk(7, H - 2, 7); pl.want = [0, 0]; dots.delete('7,' + (H - 2)); gh = [mk(1, 1, 2.8), mk(W - 2, 1, 2.5)]; gh.forEach((q, i) => { q.home = [q.tx, q.ty]; q.i = i; q.wait = g.dumb() ? 1 : 8 + i * 14; }); scared = 0; botGoal = null; left = dots.size; swipe = null; combo = 0; botT = 0; g.score = 0; }
g.onReset = init; init();
const px = e => (e.tx + (e.nx - e.tx) * e.prog) * TS + TS / 2 + OX, py = e => (e.ty + (e.ny - e.ty) * e.prog) * TS + TS / 2 + OY;
function step(e, dt, choose) { e.prog += e.sp * dt; let guard = 0; while (e.prog >= 1 && guard++ < 3) { e.tx = e.nx; e.ty = e.ny; e.prog -= 1; arrive(e); const d = choose(e); if (d && free(e.tx + d[0], e.ty + d[1])) { e.dx = d[0]; e.dy = d[1]; e.nx = e.tx + d[0]; e.ny = e.ty + d[1]; } else { e.dx = e.dy = 0; e.nx = e.tx; e.ny = e.ty; e.prog = 0; } } }
function arrive(e) { if (e !== pl) return; const k = e.tx + ',' + e.ty, v = dots.get(k); if (v) { dots.delete(k); left--; if (v === 2) { scared = 8; combo = 0; sfx('powerup'); g.flash('#4aa8ff', .3); g.showBanner('FISH POWER!', .8); } else { eaten++; g.score += 10; sfx('pop', { pitch: comboPitch(eaten % 12), vol: .5 }); } if (left <= 0) { if (board < maxBoards) { board++; g.score += 500; sfx('win'); g.showBanner('ROUND 2!', 1.0); g.burst(px(pl), py(pl), 30, { color: ['#ffd34d', '#fff'], speed: 400 }); resetBoard(); } else { g.score += 1000; g.end({ win: true, score: g.score, label: 'SCORE' }); g.burst(px(pl), py(pl), 40, { color: ['#ffd34d', '#fff'], speed: 440 }); } } } }
function dirTo(e, tgt, away) { const opts = DIRS.filter(([dx, dy]) => free(e.tx + dx, e.ty + dy) && !(dx === -e.dx && dy === -e.dy && DIRS.filter(([a, b]) => free(e.tx + a, e.ty + b)).length > 1)); if (!opts.length) return [-e.dx, -e.dy]; if (R() < (away ? .1 : .5)) return pick(opts); opts.sort((a, b) => { const da = Math.hypot(e.tx + a[0] - tgt.x, e.ty + a[1] - tgt.y), db = Math.hypot(e.tx + b[0] - tgt.x, e.ty + b[1] - tgt.y); return away ? db - da : da - db; }); return opts[0]; }
function botDir() { if (g.dumb() && scared <= 0) { const t = bfs({ x: pl.nx, y: pl.ny }, (x, y) => gh.some(q => !q.dead && q.tx === x && q.ty === y), free, W, H); if (t) return [t[0].x - pl.nx, t[0].y - pl.ny]; }
  if (!g.dumb() && (pl.dx || pl.dy) && dots.has(pl.nx + ',' + pl.ny)) return [pl.dx, pl.dy];   // keep going: the dot on the tile ahead is about to be eaten
  const gp = gh.filter(q => !q.dead && !(q.wait > 0)); const dang = r => (x, y) => !g.dumb() && scared <= 0 && gp.some(q => Math.abs(q.tx - x) + Math.abs(q.ty - y) <= r), goal = (x, y) => dots.has(x + ',' + y), from = { x: pl.nx, y: pl.ny };
  let path = null; const wt = gh.filter(q => q.wait > 0 && !q.dead), pass = (x, y) => free(x, y) && !dang(1)(x, y) && !(!g.dumb() && wt.some(q => q.tx === x && q.ty === y)); if (scared <= 0 && gp.some(q => Math.abs(q.tx - pl.nx) + Math.abs(q.ty - pl.ny) <= 9)) { const pp = bfs(from, (x, y) => dots.get(x + ',' + y) === 2, pass, W, H); if (pp) { botGoal = pp.at(-1).x + ',' + pp.at(-1).y; return [pp[0].x - pl.nx, pp[0].y - pl.ny]; } } if (botGoal && dots.has(botGoal)) { const [gx, gy] = botGoal.split(',').map(Number); path = bfs(from, (x, y) => x === gx && y === gy, free, W, H); if (path && path.some(t => !pass(t.x, t.y))) path = null; } if (!path) { path = bfs(from, goal, pass, W, H); botGoal = path?.length ? path.at(-1).x + ',' + path.at(-1).y : null; }
  if (!path && !g.dumb() && scared <= 0) { let best = null, bd = -1; for (const [dx, dy] of DIRS) { const x = pl.nx + dx, y = pl.ny + dy; if (!free(x, y)) continue; const d = Math.min(...gp.map(q => Math.abs(q.tx - x) + Math.abs(q.ty - y)), 99); if (d > bd) { bd = d; best = [dx, dy]; } } return best || [0, 0]; }
  path = path || bfs(from, goal, free, W, H); return path ? [path[0].x - pl.nx, path[0].y - pl.ny] : [0, 0]; }
function hitCheck(q) { if (Math.hypot(px(q) - px(pl), py(q) - py(pl)) < 26) { if (scared > 0) { combo++; q.dead = 3; g.score += 200 * combo; sfx('coin', { pitch: comboPitch(combo * 2) }); g.popup('+' + 200 * combo, px(q), py(q) - 30, '#7dff7d', 36); g.burst(px(q), py(q), 14, { color: '#8fcf7a', speed: 260 }); g.hitstop(.05); } else { sfx('hit'); g.hitstop(.12); g.burst(px(pl), py(pl), 24, { color: [S.heroColor, '#fff'], speed: 380 }); g.end({ win: false, score: g.score, label: 'SCORE' }); } } }
function update(dt) {
  if (g.mode !== 'play') return; scared = Math.max(0, scared - dt); const k = g.keys;
  if (g.pressed.ArrowLeft || g.pressed.KeyA) pl.want = [-1, 0]; if (g.pressed.ArrowRight || g.pressed.KeyD) pl.want = [1, 0]; if (g.pressed.ArrowUp || g.pressed.KeyW) pl.want = [0, -1]; if (g.pressed.ArrowDown || g.pressed.KeyS) pl.want = [0, 1];
  const ti = TC ? TC.getInput() : null; /* touch: read once per frame */
  if (ti && Math.hypot(ti.x, ti.y) > .5) pl.want = Math.abs(ti.x) > Math.abs(ti.y) ? [Math.sign(ti.x), 0] : [0, Math.sign(ti.y)];
  if (TC) swipe = null; else if (g.taps.length) swipe = { x: g.ptr.x, y: g.ptr.y }; if (swipe && g.ptr.down && !TC) { const dx = g.ptr.x - swipe.x, dy = g.ptr.y - swipe.y; if (Math.hypot(dx, dy) > 24) { pl.want = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]; swipe = { x: g.ptr.x, y: g.ptr.y }; } } else if (!g.ptr.down) swipe = null;
  if (g.auto) { botT -= dt; if (botT <= 0) { botT = .08; if (!pl.dx && !pl.dy) pl.want = botDir(); } }
  if (pl.want[0] === -pl.dx && pl.want[1] === -pl.dy && (pl.dx || pl.dy)) { [pl.tx, pl.nx] = [pl.nx, pl.tx]; [pl.ty, pl.ny] = [pl.ny, pl.ty]; pl.prog = 1 - pl.prog; pl.dx = pl.want[0]; pl.dy = pl.want[1]; }
  step(pl, dt, e => (g.auto && (e.want = botDir()), free(e.tx + e.want[0], e.ty + e.want[1]) ? e.want : (free(e.tx + e.dx, e.ty + e.dy) ? [e.dx, e.dy] : null)));
  for (const q of gh) { if (q.wait > 0) { q.wait -= dt; if (Math.hypot(px(q) - px(pl), py(q) - py(pl)) < 26) hitCheck(q); continue; } if (q.dead) { q.dead -= dt; if (q.dead <= 0) { q.dead = 0; Object.assign(q, mk(q.home[0], q.home[1], q.sp), { home: q.home, i: q.i }); } continue; } q.sp = scared > 0 ? 2.8 : (q.i ? 2.2 : 2.5);
    step(q, dt, e => dirTo(e, q.i ? { x: pl.tx + pl.dx * 3, y: pl.ty + pl.dy * 3 } : { x: pl.tx, y: pl.ty }, scared > 0));
    hitCheck(q); }
  g.hud.l = `${g.score}`; g.hud.r = `DOTS ${left}`; g.state = { left, scared: Math.round(scared * 10) / 10, score: g.score, p: [pl.tx, pl.ty, pl.nx, pl.ny, pl.want.join()], goal: botGoal, gh: gh.map(q => [q.tx, q.ty, q.wait > 0 ? 1 : 0]) };
}
function draw(c) {
  if (WLD) drawBackdrop(WLD, c, 540, 960, 0, g.t);
  c.lineCap = 'round'; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (wall[y][x] && WLD) drawWorld(WLD.wall, c, x * TS + OX + TS / 2, y * TS + OY + TS / 2, TS, { t: g.t }); else if (wall[y][x]) { c.fillStyle = '#0e1840'; c.fillRect(x * TS + OX, y * TS + OY, TS, TS); c.strokeStyle = S.wall; c.lineWidth = 5; c.beginPath(); for (const [dx, dy] of DIRS) if (!wall[y + dy]?.[x + dx] && wall[y + dy] !== undefined && x + dx >= 0 && x + dx < W) { const x0 = x * TS + OX + (dx === 1 ? TS : 0), y0 = y * TS + OY + (dy === 1 ? TS : 0); if (dx) { c.moveTo(x0, y0 + 3); c.lineTo(x0, y0 + TS - 3); } else { c.moveTo(x0 + 3, y0); c.lineTo(x0 + TS - 3, y0); } } c.stroke(); }
  for (const [k, v] of dots) { const [x, y] = k.split(',').map(Number), cx = x * TS + TS / 2 + OX, cy = y * TS + TS / 2 + OY; if (WLD && v !== 2) { drawWorld(WLD.pickup, c, cx, cy, 20, { t: g.t + x }); continue; } c.fillStyle = v === 2 ? '#4aa8ff' : '#ffd34d'; if (v === 2) { c.beginPath(); c.ellipse(cx, cy, 13 + Math.sin(g.t * 8) * 2, 7, 0, 0, 7); c.moveTo(cx + 12, cy); c.lineTo(cx + 20, cy - 7); c.lineTo(cx + 20, cy + 7); c.fill(); } else { c.beginPath(); c.arc(cx, cy, 4.5, 0, 7); c.fill(); } }
  for (const q of gh) if (!q.dead) drawChar(S.foe, c, px(q), py(q) + 16, 40, { dir: q.dx || 1, t: g.t, anim: 'walk', color: scared > 0 ? (scared < 2 && Math.floor(g.t * 8) % 2 ? '#fff' : '#6aa0ff') : undefined });
  drawChar(heroKind(S.hero), c, px(pl), py(pl) + 16, 40, { color: heroColor(S.heroColor), dir: pl.dx || pl.want[0] || 1, t: g.t, anim: pl.dx || pl.dy ? 'walk' : 'idle', hurt: g.mode === 'over' });
}
g.run(update, draw);
</script></body></html>
