<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SUBWAY CAT</title></head><body>
<script type="module">
/*RECIPE rail-runner. ONE track, THREE lanes: the cat auto-runs, swipe left/right to change lane, tap to jump; trains block lanes, barriers need a jump. 3-SECOND RULE: cat = player, trains and barriers = enemy, goal = run the distance.
  DON'T BUILD: missions, a character shop, hoverboards, menus. Edit the SPEC JSON (gamepress make).*/
import { createStage, sfx, rand, clamp, THREE } from '../_vendor/gp3d.js';
import { urlHero, urlHeroColor, buildHero, animate as animHero } from '../_vendor/gphero3d.js';
import { toon, catGeo, zombieGeo, hero, particles, sky, groundTex } from '../_vendor/gpkit.js';
const S = { title: 'SUBWAY CAT', sub: 'Swipe to change lane. Tap to jump.', hook: 'Run from the zombie king', bg: 0x9ad7ff, skyTop: 0x3f8cff, skyBottom: 0xffd9a8, train: 0x4aa8ff, catColor: 0xff9a3c, hero: 'cat', goal: 320, speed: 14, style: 'toon', /*SPEC*/ ...{"hook":"Run from the zombie king"} /*END*/ };
const P = new URLSearchParams(location.search), AUTO = P.has('auto'), FAILFIRST = P.get('failfirst') !== '0';
const st = createStage({ style: S.style, bg: S.bg, fitWidth: 8, fov: 60, fog: [40, 120] }); st.light(); sky(st.scene, S.skyTop, S.skyBottom, [60, 200]); const fx = particles(st.scene, 300);
const LX = [-2.6, 0, 2.6];
const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 800), toon(0xffffff, { map: groundTex('asphalt', 40) })); ground.rotation.x = -Math.PI / 2; ground.position.set(0, -.01, 350); st.scene.add(ground);
for (const x of LX) for (const s of [-.45, .45]) { const r = new THREE.Mesh(new THREE.BoxGeometry(.12, .1, 800), toon(0xb0b8c4)); r.position.set(x + s, .05, 350); st.scene.add(r); }
const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, 800), toon(0xffffff, { map: groundTex('grass', 120) })); grass.rotation.x = -Math.PI / 2; grass.position.set(0, -.05, 350); st.scene.add(grass);
const bld = Array.from({ length: 36 }, (_, i) => { const h = rand(4, 16), m = new THREE.Mesh(new THREE.BoxGeometry(rand(3, 6), h, rand(4, 8)), toon([0xff8a3c, 0x6ec6ff, 0xff6b9a, 0xb8e986][i % 4])); m.position.set((i % 2 ? 1 : -1) * rand(9, 16), h / 2, i * 9); st.scene.add(m); return m; });
const HC = urlHeroColor(S.heroColor ?? S.catColor), cat = buildHero(urlHero(S.hero), HC); cat.scale.setScalar(1.2); st.scene.add(cat);
const king = hero(zombieGeo(), 0x8fcf7a, .025); king.scale.setScalar(1.3); st.scene.add(king);
let p, obs, nextZ, over, overT, attempt = 0, coinsN, botCd, swipeX, dumb, coins;
const mkRow = z => { const r = Math.floor(rand(0, 4)); if (r === 0) return [{ z, lane: Math.floor(rand(0, 3)), k: 'train' }, { z, lane: (Math.floor(rand(0, 3)) + 1) % 3, k: 'train' }].filter((o, i, a) => i === 0 || o.lane !== a[0].lane); if (r === 1) return [0, 1, 2].map(l => ({ z, lane: l, k: 'barrier' })); if (r === 2) return [{ z, lane: Math.floor(rand(0, 3)), k: 'train' }]; return [{ z, lane: Math.floor(rand(0, 3)), k: 'barrier' }]; };
function init() { st.rearm(); p = { lane: 1, x: 0, y: 0, vy: 0, z: 0, air: false, t: 0 }; obs = [{ z: 45, lane: 1, k: 'train' }]; nextZ = 62; for (const o of obs) o.m = null; coins = []; coinsN = 0; over = false; overT = 0; botCd = 0; swipeX = null; dumb = AUTO && attempt === 0 && FAILFIRST; st.score = 0;
  for (const m of [...st.scene.children].filter(c => c.userData.o)) st.scene.remove(m); }
function ensure() { while (nextZ < p.z + 120) { const row = mkRow(nextZ); obs.push(...row); const free = [0, 1, 2].filter(l => !row.some(o => o.lane === l)); for (let i = 0; i < 5; i++) coins.push({ z: nextZ - 8 + i * 1.6, lane: (free[0] ?? 1), got: false }); nextZ += rand(26, 34); } }
const mesh = o => { const m = new THREE.Mesh(o.k === 'train' ? new THREE.BoxGeometry(2.3, 3.2, 9) : new THREE.BoxGeometry(2.3, .9, .5), toon(o.k === 'train' ? S.train : 0xe63946)); m.userData.o = 1; m.position.set(LX[o.lane], o.k === 'train' ? 1.6 : .45, o.z + (o.k === 'train' ? 4.5 : 0)); if (o.k === 'train') { const w = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.2, .1), new THREE.MeshBasicMaterial({ color: 0x1a2a40 })); w.position.set(0, .6, -4.55); m.add(w); } st.scene.add(m); return m; };
st.shell({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, onReset: () => { attempt++; init(); st.hud.banner('GO!', .7); } }); init();
function lose() { if (over) return; over = true; overT = 0; sfx('lose'); st.shake(12); st.hitstop(.1); st.flash('#ff3b3b', .4); st.hud.banner('CRASH!', 2); st.end({ win: false, score: Math.round(p.z), label: 'METERS' }); fx.burst(16, { x: p.x, y: 1, z: p.z, size: .35, life: .7, color: HC, g: 8 }, 6); }
function update(dt) {
  fx.update(dt); if (over) { overT += dt; if (AUTO && overT > 2.4 && !(window.__ends?.at(-1)?.win)) { attempt++; init(); st.hud.banner('GO!', .7); } return; } p.t += dt; ensure(); const sp = S.speed + p.z * .02; p.z += sp * dt;
  const k = st.keys; let go = 0, jump = false; if (k.arrowleft || k.a) { if (!p.kl) go = -1; p.kl = true; } else p.kl = false; if (k.arrowright || k.d) { if (!p.kr) go = 1; p.kr = true; } else p.kr = false; if (k.arrowup || k[' '] || k.w) { if (!p.ku) jump = true; p.ku = true; } else p.ku = false;
  if (st.ptr.down && swipeX === null) { swipeX = { x: st.ptr.x, y: st.ptr.y }; p.swiped = false; }
  if (st.ptr.down && swipeX) {
    const dx = st.ptr.x - swipeX.x, dy = st.ptr.y - swipeX.y;
    if (Math.abs(dx) > .15) { go = Math.sign(dx); swipeX = { x: st.ptr.x, y: st.ptr.y }; p.swiped = true; }
    else if (dy < -.18 && !p.air) { jump = true; swipeX = { x: st.ptr.x, y: st.ptr.y }; p.swiped = true; }
  } else if (!st.ptr.down) {
    if (swipeX && !p.swiped) jump = true;
    swipeX = null; p.swiped = false;
  }
  if (AUTO && !dumb) { botCd -= dt; const ahead = obs.filter(o => o.z + (o.k === 'train' ? 9 : 0) > p.z && o.z < p.z + 26), blocked = l => ahead.some(o => o.lane === l && o.k === 'train'), bar = ahead.find(o => o.lane === p.lane && o.k === 'barrier' && o.z - p.z < 5.5 + sp * .05 && o.z - p.z > 1), trainAhead = ahead.find(o => o.lane === p.lane && o.k === 'train' && o.z - p.z < 20);
    if (trainAhead && botCd <= 0) { const opts = [p.lane - 1, p.lane + 1].filter(l => l >= 0 && l <= 2 && !blocked(l) && !ahead.some(o => o.lane === l && o.k === 'barrier' && o.z - p.z < 8)); if (opts.length) { go = opts[0] - p.lane; botCd = .5; } } if (bar && !p.air) jump = true; }
  if (go) { const nl = clamp(p.lane + go, 0, 2); if (nl !== p.lane) { p.lane = nl; sfx('whoosh', { vol: .5 }); } } if (jump && !p.air) { p.vy = 9; p.air = true; sfx('jump'); }
  p.x += (LX[p.lane] - p.x) * Math.min(1, dt * 14); p.vy -= 26 * dt; p.y = Math.max(0, p.y + p.vy * dt); if (p.y === 0) { if (p.air) fx.burst(4, { x: p.x, y: .1, z: p.z, size: .2, life: .3, color: 0xffffff, g: 3 }, 2); p.air = false; p.vy = 0; }
  for (const o of obs) { if (!o.m && o.z < p.z + 100) o.m = mesh(o); const hit = Math.abs(LX[o.lane] - p.x) < 1.0; if (hit && o.k === 'train' && p.z + .4 > o.z && p.z - .4 < o.z + 9 && p.y < 3.2) lose(); if (hit && o.k === 'barrier' && Math.abs(p.z - o.z) < .5 && p.y < .85) lose(); }
  for (const c of coins) if (!c.got && Math.abs(c.z - p.z) < .8 && Math.abs(LX[c.lane] - p.x) < 1 && p.y < 1.6) { c.got = true; coinsN++; sfx('coin', { pitch: 1 + (coinsN % 12) / 12 }); fx.burst(4, { x: LX[c.lane], y: 1.2, z: c.z, size: .22, life: .4, color: 0xffd34d, g: 2 }, 2); }
  obs = obs.filter(o => { if (o.z < p.z - 30) { if (o.m) st.scene.remove(o.m); return false; } return true; }); st.score = Math.round(p.z) + coinsN * 5;
  if (p.z >= S.goal) { over = true; overT = 0; sfx('win'); st.hud.banner('YOU ESCAPED!', 2); st.slowmo(.4, 1); st.flash('#fff', .5); fx.burst(40, { x: p.x, y: 2, z: p.z, size: .35, life: 1.2, color: 0xffd34d, g: 4 }, 9); st.end({ win: true, score: st.score, label: 'SCORE' }); }
  st.hud.left(`<span style="color:#ffd34d">${Math.round(p.z)}m</span>`); st.hud.right(`COINS ${coinsN}`); st.hud.hint('Swipe: lane · tap: jump'); window.__game = { z: Math.round(p.z), lane: p.lane, coins: coinsN, attempt, over, air: p.air, y: +(p.y.toFixed(2)) };
}
function pre() { if (cat.userData.rig) animHero(cat, 1 / 60, p.air ? 'idle' : 'run'); cat.position.set(p.x, p.y, p.z); cat.rotation.z = (LX[p.lane] - p.x) * -.08; cat.position.y += p.air ? 0 : Math.abs(Math.sin(p.t * 16)) * .1; king.position.set(p.x * .5 + (p.lane === 2 ? -1.7 : 1.7), 0, p.z - 5.2 - Math.sin(p.t * 2) * .4); st.camera.position.set(p.x * .55, 6, p.z - 9.5); st.camera.lookAt(p.x * .5, 1.4, p.z + 8); for (const b of bld) if (b.position.z < p.z - 30) b.position.z += 330; }
st.run(update, pre);
</script></body></html>
