<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAT PLINKO</title></head><body>
<script type="module">
/*RECIPE plinko-drop. ONE screen, ONE mechanic: pick where to drop the cat; it bounces through pegs into a payout slot. 3-SECOND RULE: the falling cat = player, the low-pay slots = enemy, goal = reach the coin target before the drops run out.
  DON'T BUILD: boards shop, bets menu, more than one board, menus. Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, rnd, clamp } from '../_vendor/gp2d.js';
import { face, heroKind, heroColor } from '../_vendor/gpsprites.js';
import { World } from '../_vendor/gpphys.js';
const S = { title: 'CAT PLINKO', sub: 'Tap where to drop', hook: 'Drop it. Win big.', hero: 'cat', bg: '#1b2b5e', target: 250, drops: 6, bet: 20, style: 'toon', /*SPEC*/ ...{"hook":"Drop it. Win big."} /*END*/ };
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: S.bg, style: S.style });
const MULT = [10, 3, 1, .3, 1, 3, 10], SW = 540 / 7, SY = 800;
const mkWorld = () => { const w = World({ gy: 1900, walls: { l: 1, r: 1, t: 0, b: 0 }, bounce: .5, damp: 1, y1: 960, sub: 3 }); for (let r = 0; r < 9; r++) for (let c = 0; c < 9 - (r % 2); c++) w.add({ x: 36 + c * 56 + (r % 2) * 28 + (r % 2 ? 0 : 0), y: 250 + r * 56, r: 8, static: true, bounce: .5 }); return w; };
let w, ball, dropsLeft, total, botT, trail, hits, last;
function init() { w = mkWorld(); ball = null; dropsLeft = g.dumb() ? 2 : S.drops; total = 0; botT = .5; trail = []; hits = 0; last = null; g.score = 0; w.onHit = (a, b) => { if (b.static || a.static) { hits++; sfx('pop', { pitch: 1 + (hits % 10) * .06, vol: .35 }); } }; w.onDrain = b => { settle(b); }; }
g.onReset = init; init();
function simSlot(x) { const sw = mkWorld(); const b = sw.add({ x, y: 170, r: 11, bounce: .5 }); let slot = -1; sw.onDrain = () => { slot = Math.floor(clamp(b.x / SW, 0, 6.99)); }; for (let i = 0; i < 400 && slot < 0; i++) sw.step(1 / 60); return slot < 0 ? 0 : MULT[slot]; }
function drop(x) { if (ball || dropsLeft <= 0 || g.mode !== 'play') return; dropsLeft--; hits = 0; ball = w.add({ x: clamp(x, 30, 510), y: 170, r: 11, bounce: .5 }); trail = []; sfx('whoosh', { vol: .4 }); }
function settle(b) { w.remove(b); const slot = Math.floor(clamp(b.x / SW, 0, 6.99)), m = MULT[slot], gain = Math.round(S.bet * m); total += gain; g.score = total; ball = null; last = slot; sfx(m >= 3 ? 'powerup' : m >= 1 ? 'coin' : 'hit', { pitch: m >= 3 ? 1 : 1 }); g.popup(`x${m}  +${gain}`, slot * SW + SW / 2, SY - 40, m >= 3 ? '#ffd34d' : '#fff', 44); g.burst(slot * SW + SW / 2, SY, 14, { color: m >= 3 ? ['#ffd34d', '#fff'] : ['#7ad7ff'], speed: 300 }); if (m >= 3) { g.flash('#ffd34d', .3); g.shake(8); }
  if (total >= S.target) { g.slowmo(.4, .8); g.end({ win: true, score: total, label: 'COINS' }); g.burst(270, 400, 50, { color: ['#ffd34d', '#fff'], speed: 460 }); } else if (dropsLeft <= 0) g.end({ win: false, score: total, label: 'COINS' }); }
function update(dt) {
  if (g.mode !== 'play') return; botT -= dt; for (const tp of g.taps) drop(tp.x); if (g.pressed.Space) drop(g.ptr.x);
  if (g.auto && !ball && botT <= 0) { botT = .5; { let best = g.dumb() ? 1e9 : -1, bx = 270; for (let x = 30; x <= 510; x += 12) { const m = simSlot(x); if (g.dumb() ? m < best : m > best) { best = m; bx = x; } } drop(bx); } }
  w.step(dt); if (ball) { trail.push({ x: ball.x, y: ball.y }); if (trail.length > 16) trail.shift(); } g.hud.l = `${total}`; g.hud.r = `DROPS ${dropsLeft}`; g.hud.hint = !ball && total === 0 ? 'TAP WHERE TO DROP. AIM FOR x10' : ''; g.state = { total, drops: dropsLeft, last };
}
function draw(c) {
  const gr = c.createLinearGradient(0, 0, 0, 960); gr.addColorStop(0, '#24397a'); gr.addColorStop(1, '#101a3c'); c.fillStyle = gr; c.fillRect(0, 0, 540, 960);
  for (const p of w.bodies) if (p.static) { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fillStyle = '#7ad7ff'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#000'; c.stroke(); }
  for (let i = 0; i < 7; i++) { const m = MULT[i]; c.fillStyle = m >= 3 ? '#ffd34d' : m >= 1 ? '#4caf50' : '#e63946'; c.globalAlpha = last === i ? 1 : .8; c.fillRect(i * SW + 3, SY, SW - 6, 110); c.globalAlpha = 1; c.strokeStyle = '#000'; c.lineWidth = 4; c.strokeRect(i * SW + 3, SY, SW - 6, 110); g.text('x' + m, i * SW + SW / 2, SY + 66, { size: 34, align: 'center', color: '#fff' }); }
  for (let i = 0; i < trail.length; i++) { c.globalAlpha = i / trail.length * .5; c.fillStyle = '#fff'; c.beginPath(); c.arc(trail[i].x, trail[i].y, 9, 0, 7); c.fill(); } c.globalAlpha = 1; if (ball) face(c, heroKind(S.hero), ball.x, ball.y, 17, '#ff9a3c');
  if (!ball && g.mode === 'play') { const x = clamp(g.ptr.x, 30, 510); c.globalAlpha = .5; face(c, heroKind(S.hero), x, 170, 17, '#ff9a3c'); c.globalAlpha = 1; }
  g.bar(60, 190, 420, 16, total / S.target, '#7dff7d'); g.text(`TARGET ${S.target}`, 270, 230, { size: 26, align: 'center', stroke: 4 });
}
g.run(update, draw);
</script></body></html>
