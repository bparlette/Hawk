<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crowd Multiplier</title></head><body>
<script type="module">
// Crowd Multiplier: steer a mob of stickmen (A/D or drag) through math gates, then overwhelm the castle boss. One instanced body + one instanced head;
// only the first 450 are drawn, the counter shows the real number. Gate side is chosen by where the crowd centre is when it crosses.
import { createStage, instances, sfx, rand, clamp, THREE } from '../_vendor/gp3d.js';
const st = createStage({ bg: 0x8fd3ff, fitWidth: 9.5, fov: 55, fog: [40, 110] }); st.light();
const TRACK = 190, MAXDRAW = 450;
const road = new THREE.Mesh(new THREE.PlaneGeometry(10, TRACK + 60), new THREE.MeshStandardMaterial({ color: 0x4a4f63 })); road.rotation.x = -Math.PI / 2; road.position.z = TRACK / 2; st.scene.add(road);
const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, TRACK + 200), new THREE.MeshStandardMaterial({ color: 0x6cc45a })); grass.rotation.x = -Math.PI / 2; grass.position.set(0, -.02, TRACK / 2); st.scene.add(grass);
const OPS = [['+20', n => n + 20, 1], ['×2', n => n * 2, 1], ['-15', n => Math.max(1, n - 15), 0], ['×3', n => n * 3, 1], ['+50', n => n + 50, 1], ['×2', n => n * 2, 1], ['-30', n => Math.max(1, n - 30), 0], ['×4', n => n * 4, 1]];
const lab = (t, good) => { const cv = document.createElement('canvas'); cv.width = 256; cv.height = 192; const g = cv.getContext('2d'); g.fillStyle = good ? 'rgba(46,160,255,.7)' : 'rgba(255,70,70,.7)'; g.fillRect(0, 0, 256, 192); g.font = '900 120px Impact,Arial Black'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 10; g.strokeText(t, 128, 140); g.fillText(t, 128, 140); return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, side: THREE.DoubleSide }); };
const gates = []; for (let i = 0; i < 6; i++) { const z = 22 + i * 24, a = OPS[(i * 2) % 8], b = OPS[(i * 2 + 1) % 8], pair = [a, b]; if (i % 2) pair.reverse();
  pair.forEach((op, s) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 3.4), lab(op[0], op[2])); m.position.set(s ? 2.5 : -2.5, 1.9, z); m.rotation.y = Math.PI; st.scene.add(m); }); gates.push({ z, ops: pair, used: false }); }
const castle = new THREE.Group(), cm = new THREE.MeshStandardMaterial({ color: 0xcfc2a8 });
const keep = new THREE.Mesh(new THREE.BoxGeometry(8, 10, 5), cm); keep.position.y = 5; castle.add(keep); for (const x of [-4.4, 4.4]) { const t = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 13, 12), cm); t.position.set(x, 6.5, 0); castle.add(t); const r = new THREE.Mesh(new THREE.ConeGeometry(2.1, 3.4, 12), new THREE.MeshStandardMaterial({ color: 0xc0392b })); r.position.set(x, 14.7, 0); castle.add(r); }
const flag = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.3, .1), new THREE.MeshBasicMaterial({ color: 0xff3b30 })); flag.position.set(0, 11.5, 0); castle.add(flag);
castle.position.set(0, 0, TRACK); st.scene.add(castle);
const men = instances(new THREE.CapsuleGeometry(.14, .32, 3, 6), new THREE.MeshStandardMaterial({ color: 0x2f9bff }), MAXDRAW), heads = instances(new THREE.SphereGeometry(.15, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffe0b0 }), MAXDRAW); st.scene.add(men.mesh, heads.mesh);
const foes = instances(new THREE.CapsuleGeometry(.14, .32, 3, 6), new THREE.MeshStandardMaterial({ color: 0xff3b3b }), 120); st.scene.add(foes.mesh);
const AUTO = new URLSearchParams(location.search).has('auto');
let n = 5, cx = 0, cz = 0, bossHP = 900, bossMax = 900, fight = false, won = false, lost = false, parts = [], foeN = 0, fallT = 0;
st.onPointerDown = () => {};
function update(dt) {
  if (!fight && !won && !lost) {
    const k = st.keys, mv = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0); if (AUTO) { const g = gates.find(g => !g.used && g.z - cz < 14), want = g ? (g.ops[1][1](n) > g.ops[0][1](n) ? 2.4 : -2.4) : 0; cx += clamp(want - cx, -7 * dt, 7 * dt); } else if (mv) cx += mv * 7 * dt; else if (st.ptr.down) cx += (st.ptr.x * 3.8 - cx) * Math.min(1, dt * 9); cx = clamp(cx, -3.6, 3.6); cz += (9 + Math.min(4, n / 80)) * dt;
    for (const g of gates) if (!g.used && cz >= g.z) { g.used = true; const op = g.ops[cx < 0 ? 0 : 1], before = n; n = Math.round(op[1](n)); sfx(op[2] ? 'ding' : 'crash'); st.hud.banner(op[0], .7); st.shake(op[2] ? 2 : 4); }
    if (cz >= TRACK - 16) { fight = true; foeN = 120; st.hud.banner('BOSS!', 1.2); sfx('boom'); }
  } else if (fight) {
    cz += (TRACK - 9 - cz) * Math.min(1, dt * 2); cx += (0 - cx) * Math.min(1, dt * 3); const dmg = n * .9 * dt, back = (bossMax * .5 + 80) * dt * (bossHP / bossMax + .2);
    bossHP -= dmg; n -= back; foeN = Math.ceil(120 * Math.max(0, bossHP) / bossMax); if (Math.random() < .3) sfx('tick', .3); st.shake(2);
    if (bossHP <= 0) { fight = false; won = true; st.hud.banner('CASTLE DOWN!', 3); sfx('boom'); st.shake(14); sfx('win'); for (let i = 0; i < 60; i++) parts.push({ x: rand(-4, 4), y: rand(1, 12), z: TRACK + rand(-2, 2), vx: rand(-4, 4), vy: rand(2, 9), vz: rand(-3, 6) }); }
    else if (n <= 0) { n = 0; fight = false; lost = true; st.hud.banner('CRUSHED', 3); }
  }
  if (won) { fallT += dt; castle.rotation.x = Math.min(1.3, fallT * .9) * -1; castle.position.y = -fallT * .8; }
  for (const p of parts) { p.vy -= 14 * dt; p.x += p.vx * dt; p.y = Math.max(.1, p.y + p.vy * dt); p.z += p.vz * dt; }
  st.hud.left(`CROWD<br><span style="color:#ffd34d;font-size:8vmin">${Math.max(0, Math.round(n)).toLocaleString()}</span>`); st.hud.right(fight || won ? `BOSS<br>${Math.max(0, Math.round(bossHP))}` : `GATES ${gates.filter(g => g.used).length}/${gates.length}`); st.hud.hint('A/D or drag: steer');
  window.__game = { crowd: Math.round(n), boss: Math.round(bossHP), z: Math.round(cz), won, lost };
}
function pre() {
  const cnt = Math.min(MAXDRAW, Math.max(0, Math.round(n))); const sp = 0.3, t = st.t;
  for (let i = 0; i < cnt; i++) { const r = sp * Math.sqrt(i + .5), a = i * 2.39996, bob = Math.abs(Math.sin(t * 10 + i * 1.7)) * .12 * (won || lost ? 0 : 1); const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
    men.set(i, x, .36 + bob, z, 1); heads.set(i, x, .86 + bob, z, 1); } men.mesh.count = heads.mesh.count = cnt; men.done(); heads.done();
  for (let i = 0; i < foeN; i++) { const a = i * 2.39996, r = .3 * Math.sqrt(i + .5); foes.set(i, Math.cos(a) * r * 1.3, .36 + Math.abs(Math.sin(t * 9 + i)) * .1, TRACK - 4 + Math.sin(a) * r); } foes.mesh.count = foeN; foes.done();
  const R = Math.max(5, Math.sqrt(cnt) * .26); st.camera.position.set(cx * .3, 6.5 + R * .6, cz - 9.5 - R * .8); st.camera.lookAt(cx * .3, 1.4, cz + 7);
}
st.run(update, pre);
</script></body></html>
