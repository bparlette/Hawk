  const c = document.createElement('canvas');

  for (let y = 0; y < rows.length; y++) {

    for (let x = 0; x < row.length; x++) {

}

  const kid = {

/* ---------------- update ---------------- */

  // a candy dropping into the bucket passes within a few px of the head, and
  // the bucket must win that race. (No torso zone: the bucket hangs in front
  // of the chest in the sprite, so chest-height center hits ARE bucket hits.)

        if (ex * ex + ey * ey <= 1) { bucketHit(k); return 'gone'; }

  if (state === 'play') {

    }
    // OW! bubble
    const bw = 24, bh = 11, bx = clamp(hx - bw / 2, 2, W - bw - 2), by = hy - 15;
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#14141e'; ctx.fillRect(bx, by, bw, 1); ctx.fillRect(bx, by + bh - 1, bw, 1);
    ctx.fillRect(bx, by, 1, bh); ctx.fillRect(bx + bw - 1, by, 1, bh);
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(bx + 10, by + bh, 4, 3);
    drawText('OW!', bx + 4, by + 3, 1, '#d82800');
  }
}
function drawCandy(cd) {
  const img = IMG[cd.spr];
  if (cd.fire) {  // soft axis-aligned glow behind the tumbling fire candy
    ctx.fillStyle = 'rgba(255,120,0,0.16)';
    ctx.fillRect(cd.x - 7, cd.y - 7, 14, 14);
    ctx.fillStyle = 'rgba(255,170,0,0.22)';
    ctx.fillRect(cd.x - 4, cd.y - 4, 8, 8);
  }
  ctx.save();
  ctx.translate(cd.x, cd.y);
  ctx.rotate(cd.rot);
  ctx.drawImage(img, -6, -4);
  ctx.restore();
}
function drawArc() {
  const v = aimVelocity();
  if (!v) return;
  // slingshot band (HAND -> pulled position, clamped on-screen) + candy in hand
  const bx = clamp(HAND.x + drag.x, 1, W - 1), by = clamp(HAND.y + drag.y, 1, H - 1);
  ctx.strokeStyle = 'rgba(248,248,248,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(HAND.x, HAND.y); ctx.lineTo(bx, by); ctx.stroke();
  ctx.fillStyle = '#f8f8f8';
  let x = HAND.x, y = HAND.y, vx = v.vx, vy = v.vy;
  const dt = 0.032;
  for (let i = 0; i < 40; i++) {
    vy += GRAV * dt; x += vx * dt; y += vy * dt;
    if (y > 238 || x > 258) break;
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  ctx.drawImage(IMG[onFire ? 'candy_fire' : 'candy_red'], HAND.x - 6, HAND.y - 4);
}
function drawHUD() {
  ctx.fillStyle = 'rgba(5,6,18,0.55)';
  ctx.fillRect(0, 0, W, 15);
  drawText('SCORE ' + String(score).padStart(4, '0'), 4, 5, 1, '#f8f8f8');
  // pile meter (top center)
  drawText('PILE', 92, 5, 1, '#ffd23f');
  const pct = streetPieces / MAX_PILE;
  ctx.fillStyle = '#14141e'; ctx.fillRect(118, 4, 62, 7);
  ctx.fillStyle = pct < 0.5 ? '#40c040' : pct < 0.8 ? '#f8b000' : (Math.floor(elapsed * 6) % 2 ? '#ff4040' : '#a01808');
  ctx.fillRect(119, 5, Math.round(60 * clamp(pct, 0, 1)), 5);
  ctx.strokeStyle = '#f8f8f8'; ctx.lineWidth = 1; ctx.strokeRect(118.5, 4.5, 62, 7);
  // streak / fire (top right)
  if (onFire) {
    ctx.drawImage(IMG['candy_fire'], 184, 1);
    if (Math.floor(elapsed * 5) % 2 === 0) drawText('ON FIRE!', 200, 5, 1, '#ffb000');
    else drawText('ON FIRE!', 200, 5, 1, '#ff6000');
  } else {
    drawText('STREAK', 186, 5, 1, '#b8c4e8');
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < streak ? '#ffb000' : '#2a3352';
      ctx.fillRect(226 + i * 9, 5, 6, 6);
    }
  }
}
function drawPops() {
  for (const p of pops) {
    const a = p.t < 0.15 ? p.t / 0.15 : 1 - Math.max(0, (p.t - 0.6) / (p.life - 0.6)) * 0.7;
    ctx.globalAlpha = clamp(a, 0, 1);
    drawTextShadow(p.txt, p.x, p.y, 1, p.color, 'center');
    ctx.globalAlpha = 1;
  }
}
function panel(w, h, alpha) {
  const x = (W - w) / 2, y = (H - h) / 2;
  ctx.fillStyle = 'rgba(8,8,22,' + (alpha == null ? 0.88 : alpha) + ')'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#f87800'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.strokeStyle = '#f8f8f8'; ctx.lineWidth = 1; ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
  return { x, y };
}
function drawTitle() {
  ctx.fillStyle = 'rgba(4,4,14,0.45)'; ctx.fillRect(0, 0, W, H);
  const { x, y } = panel(216, 148);
  drawTextShadow('TRICK OR TREAT', W / 2, y + 16, 2, '#f8f8f8', 'center');
  drawTextShadow('TOSS', W / 2, y + 34, 3, '#f87800', 'center');
  const lines = [
    ['DRAG + RELEASE TO THROW', '#f8f8f8'],
    ['NEAR BUCKET +10  FAR +50', '#7dff6a'],
    ['3 IN A ROW: ON FIRE X2', '#ffb000'],
    ['BONK A HEAD: -15', '#ff6060'],
    ['MISSES PILE UP...', '#f8f8f8'],
    ['DO NOT LET CANDY FLOOD!', '#ffd23f']
  ];
  lines.forEach((L, i) => drawText(L[0], W / 2, y + 66 + i * 11, 1, L[1], 'center'));
  if (Math.floor(performance.now() / 450) % 2 === 0) {
    drawText('TAP TO START', W / 2, y + 136, 1, '#f8f8f8', 'center');
  }
}
function drawFlood() {
  const p = clamp(stateT / 1.5, 0, 1);
  const seaTop = H - (1 - Math.pow(1 - p, 3)) * 208;
  for (let r = 0; r < floodCells.length; r++) {
    const y = H - (r + 1) * 7;
    if (y + 7 < seaTop) continue;
    for (let c = 0; c < 24; c++) {
      const cell = floodCells[r][c];
      const img = IMG[cell.spr];
      ctx.save();
      ctx.translate(c * 11 + (r % 2 ? 5 : 0) + 6 + cell.jx - 2, y + 4 + cell.jy - 1);
      if (cell.flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -6, -4);
      ctx.restore();
    }
  }
  for (const r of rain) ctx.drawImage(IMG[r.spr], r.x, r.y);
  drawTextShadow('CANDY FLOOD!', W / 2, 26, 2, '#ff4040', 'center');
}
function drawOver() {
  // the flood stays as the backdrop
  stateT = Math.max(stateT, 1.5);
  drawFlood();
  const { y } = panel(196, 104, 0.97);
  drawTextShadow('GAME OVER', W / 2, y + 14, 2, '#ff4040', 'center');
  drawText('THE CANDY WON!', W / 2, y + 36, 1, '#ffd23f', 'center');
  drawText('SCORE ' + String(score).padStart(4, '0'), W / 2, y + 54, 1, '#f8f8f8', 'center');
  drawText('BEST  ' + String(best).padStart(4, '0'), W / 2, y + 67, 1, '#b8c4e8', 'center');
  if (Math.floor(performance.now() / 450) % 2 === 0) {
    drawText('TAP TO PLAY AGAIN', W / 2, y + 88, 1, '#7dff6a', 'center');
  }
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2)));
  ctx.drawImage(BG, 0, 0);
  for (const k of kids) if (k.row === 'far') drawKid(k);
  for (const p of pieces) {
    const img = IMG[p.spr];
    if (p.flip) {
      ctx.save(); ctx.translate(p.x + 6, p.y + 4); ctx.scale(-1, 1); ctx.drawImage(img, -6, -4); ctx.restore();
    } else ctx.drawImage(img, p.x, p.y);
  }
  for (const k of kids) if (k.row === 'near') drawKid(k);
  if (aiming && state === 'play') drawArc();
  for (const cd of candies) drawCandy(cd);
  drawPops();
  if (ann) {
    const sc = ann.t < 0.16 ? 2 + ann.t / 0.16 : 3;
    const a = ann.t > ann.life - 0.25 ? (ann.life - ann.t) / 0.25 : 1;
    ctx.globalAlpha = clamp(a, 0, 1);
    drawTextShadow(ann.txt, W / 2, 92, Math.round(sc), ann.color, 'center');
    ctx.globalAlpha = 1;
  }
  if (state === 'play' || state === 'flood') drawHUD();
  if (state === 'flood') drawFlood();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  ctx.restore();
}

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = clamp(dt, 0, 0.033);
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const si = s >= 2 ? Math.floor(s) : Math.max(1, s);
  cv.style.width = (W * si) + 'px';
  cv.style.height = (H * si) + 'px';
}
addEventListener('resize', fit);
fit();
requestAnimationFrame(frame);
// attract-mode kids on the title screen
spawnKid('far', 'ghost', 190); spawnKid('near', 'witch', 150); spawnKid('far', 'hero', 110); spawnKid('near', 'skeleton', 225);
if (isAuto) setTimeout(() => { if (state === 'title') startGame(); }, 600);

/* ---------------- debug / video hooks (house pattern) ---------------- */
window.__dbg = () => ({
  score, streak, onFire, misses,
  pilePct: Math.round((streetPieces / MAX_PILE) * 100) / 100,
  kidsOnScreen: kids.length,
  state
});
window.__hook = {
  start: () => startGame(),
  throw: (vx, vy) => throwCandy(vx, vy, true),
  spawn: (row, costume, x) => spawnKid(row, costume, x),
  aim: (px, py) => { aiming = true; drag = { x: px, y: py }; },   // pull vector, e.g. aim(-60, 55) = full pull down-left
  release: () => releaseThrow(),
  setFire: () => { streak = 3; if (!onFire) { onFire = true; announce('ON FIRE!'); } },
  addPile: (n) => {
    for (let i = 0; i < n; i++) {
      const x = rand(104, 246);
      const col = clamp(((x - 98) / 5) | 0, 0, 31);
      pileCols[col]++; streetPieces++;
      pieces.push({ x: x - 6, y: groundYAt(x) - 5, spr: pick(CANDY_KINDS), flip: Math.random() < 0.5, street: true });
    }
  },
  flood: () => startFlood(),
  kids: () => kids,
  candies: () => candies,
  state: () => state
};
</script>
