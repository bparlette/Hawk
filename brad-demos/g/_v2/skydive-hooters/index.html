<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Skydive: Hooters Run</title>
<style>
  @font-face { font-family:'PX'; src:url('../../toad-street-32/pressstart2p.woff2') format('woff2'); }
  html,body { margin:0; padding:0; background:#0b0f17; height:100%; overflow:hidden; touch-action:none;
    font-family:'PX','Courier New',monospace; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0b0f17; }
  #screen { position:relative; width:min(100vw, 56.25vh); aspect-ratio:9/16; max-height:100vh; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#87b5e0; }
  .hud { position:absolute; color:#fff; font-size:11px; text-shadow:2px 2px 0 #000;
    background:rgba(0,0,0,.55); border:3px solid #000; box-shadow:3px 3px 0 #000;
    padding:6px 8px; border-radius:0; pointer-events:none; line-height:1.5; }
  #hudAlt { top:10px; left:10px; }
  #hudScore { top:10px; right:10px; text-align:right; }
  #hudPhase { top:64px; left:50%; transform:translateX(-50%); color:#ffe08a; white-space:nowrap; }
  #banner { position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) scale(1);
    color:#ffe08a; font-size:22px; text-shadow:3px 3px 0 #000; text-align:center;
    pointer-events:none; opacity:0; transition:opacity .25s; white-space:nowrap; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,8,14,.72); color:#fff; text-align:center; padding:20px; cursor:pointer; }
  #overlay h1 { font-size:20px; color:#ffe08a; text-shadow:3px 3px 0 #000; margin:0 0 14px; line-height:1.6; }
  #overlay p { font-size:11px; line-height:2; text-shadow:2px 2px 0 #000; margin:6px 0; }
  #overlay .tap { margin-top:18px; font-size:13px; color:#9dd84a; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .hidden { display:none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>
</head>
<body>
<div id="wrap"><div id="screen">
  <canvas id="c" width="270" height="480"></canvas>
  <div class="hud" id="hudAlt">ALT 12000</div>
  <div class="hud" id="hudScore">SCORE 0</div>
  <div class="hud hidden" id="hudPhase">FREEFALL</div>
  <div id="banner"></div>
  <div id="overlay">
    <h1>SKYDIVE:<br>HOOTERS RUN</h1>
    <p>DRAG TO STEER<br>THREAD THE RINGS<br>DEPLOY CHUTE<br>LAND ON HOOTERS</p>
    <div class="tap">TAP TO JUMP</div>
  </div>
</div></div>
<script type="module" src="game.js"></script>
</body>
</html>
