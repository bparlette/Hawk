<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOTH RUNNER — one level, no accounts</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e1a;color:#eef;height:100%;overflow:hidden;
    font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#0b0e1a;max-width:100vw;max-height:100vh}
  #touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
    padding:0 14px 18px;pointer-events:none}
  .tbtn{pointer-events:auto;width:74px;height:74px;border-radius:50%;
    background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.25);
    color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}
  .tbtn:active{background:rgba(255,255,255,.28)}
  #credit{position:fixed;top:8px;left:10px;font-size:11px;opacity:.55;pointer-events:none}
</style>
</head>
<body oncontextmenu="return false">
<div id="wrap"><canvas id="g" width="960" height="540"></canvas></div>
<div id="credit">built in one file · art + sound drawn in code · no accounts</div>
<div id="touch">
  <div style="display:flex;gap:12px">
    <div class="tbtn" id="bL">&#9664;</div>
    <div class="tbtn" id="bR">&#9654;</div>
  </div>
  <div class="tbtn" id="bJ">&#8679;</div>
</div>
<script>
"use strict";
/* ============================================================
   MOTH RUNNER — a one-level platformer + boss chase.
   My answer to the Chong-U workflow, minus every account:
     GPT Images 2.5 (mockups)   -> drawn in code, iterated live
     Blender + Tripo (3D)        -> 2D canvas sprites, drawn in code
     Spriterrific (2D assets)    -> canvas sprites, drawn in code
     ElevenLabs (SFX/BGM)        -> Web Audio API, synthesized
     Opus 5.5 (code)             -> this file, written by hand
   "Make it exist first... then make it good."
   ============================================================ */
const W=960,H=540,cv=document.getElementById('g'),cx=cv.getContext('2d');

/* ---------- audio: everything synthesized ---------- */
let AC=null,muted=false;
function audio(){ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}
  if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type='square',v=0.12,slide=0){
  if(muted)return; const a=audio(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);
}
const sfx={
  jump(){tone(300,0.14,'square',0.10,320);},
  coin(){tone(880,0.09,'sine',0.12);setTimeout(()=>tone(1320,0.12,'sine',0.12),70);},
  hurt(){tone(160,0.25,'sawtooth',0.14,-100);},
  boss(){tone(70,0.6,'sawtooth',0.18,-30);setTimeout(()=>tone(55,0.7,'sawtooth',0.18,-20),250);},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.14),i*130));},
  click(){tone(600,0.06,'square',0.08);}
};
/* tiny chiptune loop: bass + arp, two patterns (chill / chase) */
let bgmTimer=null,bgmStep=0,chase=false;
const bassC=[110,110,130.8,98], bassX=[82.4,82.4,98,73.4];
const arpC=[440,523,659,523,587,659,784,659], arpX=[440,415,554,415,466,554,622,554];
function bgmTick(){
  if(muted)return; const b=(chase?bassX:bassC)[bgmStep%4], ar=(chase?arpX:arpC)[bgmStep%8];
  tone(b,0.22,'triangle',0.07); tone(ar,0.12,'square',0.035);
  bgmStep++;
}
function bgmStart(){ if(bgmTimer)return; bgmTimer=setInterval(bgmTick,240); }
function bgmStop(){ clearInterval(bgmTimer); bgmTimer=null; }

/* ---------- input ---------- */
const key={l:0,r:0,j:0};
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')key.l=1;
  if(e.code==='ArrowRight'||e.code==='KeyD')key.r=1;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){if(!key.j)pressJump();key.j=1;}
  if(e.code==='KeyM'){muted=!muted;}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')key.l=0;
  if(e.code==='ArrowRight'||e.code==='KeyD')key.r=0;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')key.j=0;
});
function bindBtn(id,down,up){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();down();}, off=e=>{e.preventDefault();up();};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindBtn('bL',()=>key.l=1,()=>key.l=0);
bindBtn('bR',()=>key.r=1,()=>key.r=0);
bindBtn('bJ',()=>pressJump(),()=>{key.j=0;jumpHeld=false;});

/* ---------- level data (drawn from this table, nothing else) ---------- */
/* platforms: x,y,w  (y = top) */
const PLATS=[
  [0,470,700],[760,470,420],[1240,400,260],[1560,470,420],[2040,400,260],
  [2360,470,380],[2800,400,220],[3080,470,420],[3560,400,260],[3880,470,520],
];
const SPIKES=[[900,452],[1460,382],[2560,452],[3260,382],[4040,452]];
const COINS=[];
for(let i=0;i<40;i++){
  const p=PLATS[i%PLATS.length];
  COINS.push({x:p[0]+40+(i*37)%(p[2]-80),y:p[1]-46,taken:false,ph:i*0.4});
}
const DOOR={x:4320,y:470-120};
const CHASE_START_X=3560;      // crossing this wakes the boss
const END_X=4520;

/* ---------- state ---------- */
let mode='title', t=0, camX=0, shake=0;
const P={x:80,y:400,w:28,h:40,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,dead:false,deadT:0};
let coins=0, bossOn=false, bossX=CHASE_START_X-500, bossBob=0, winT=0, startT=0;
let jumpHeld=false;
function pressJump(){ audio(); key.j=1; jumpHeld=true; P.jbuf=0.12; }

/* ---------- physics ---------- */
const GRAV=2600, MOVE=340, JUMP=880;
function groundAt(x){
  let g=1e9;
  for(const p of PLATS){ if(x>=p[0]-P.w/2 && x<=p[0]+p[2]+P.w/2) g=Math.min(g,p[1]); }
  return g;
}
function update(dt){
  t+=dt;
  if(mode==='title'){ if(key.j||touchTap){startGame();} return; }
  if(mode==='dead'){ P.deadT+=dt; if(P.deadT>1.1) resetLevel(); return; }
  if(mode==='win'){ winT+=dt; return; }

  /* input */
  const ax=(key.r?1:0)-(key.l?1:0);
  P.vx+= (ax*MOVE-P.vx)*Math.min(1,dt*14);
  if(ax!==0)P.face=ax;
  if(P.jbuf>0)P.jbuf-=dt; if(P.coyote>0)P.coyote-=dt;

  /* jump */
  if(P.jbuf>0 && (P.onGround||P.coyote>0)){
    P.vy=-JUMP; P.onGround=false; P.coyote=0; P.jbuf=0; sfx.jump();
    for(let i=0;i<6;i++)parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-0.5)*160,vy:-Math.random()*120,l:0.4,c:'#8fb7ff'});
  }

  /* integrate */
  P.vy+=GRAV*dt; P.x+=P.vx*dt;
  const g=groundAt(P.x+P.w/2);
  P.onGround=false;
  if(P.y+P.h>=g && P.vy>=0 && P.y+P.h<g+40){ P.y=g-P.h; P.vy=0; P.onGround=true; P.coyote=0.1; }

  if(P.x<0)P.x=0;

  /* coins */
  for(const c of COINS){
    if(c.taken)continue;
    const dx=(P.x+P.w/2)-c.x, dy=(P.y+P.h/2)-(c.y+Math.sin(t*4+c.ph)*4);
    if(dx*dx+dy*dy<30*30){c.taken=true;coins++;sfx.coin();
      for(let i=0;i<8;i++)parts.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*220,vy:-Math.random()*200,l:0.5,c:'#ffd94a'});}
  }

  /* spikes */
  for(const s of SPIKES){
    if(P.x+P.w>s[0]+6&&P.x<s[0]+26&&P.y+P.h>s[1]+8&&P.y<s[1]+30){die();break;}
  }
  /* fell off */
  if(P.y>H+100)die();

  /* boss wake */
  if(!bossOn && P.x>CHASE_START_X){bossOn=true;chase=true;sfx.boss();shake=0.5;
    msg('RUN.',2.2);}
  if(bossOn){
    bossX+= (P.x-bossX>0? 300:300)*dt + (P.x-bossX)*0.4*dt;
    bossBob+=dt*6;
    if(Math.abs(P.x+P.w/2-(bossX))<70 && Math.abs(P.y+P.h/2-380)<120) die();
    if(bossOn && Math.random()<dt*8)
      parts.push({x:bossX-40+Math.random()*80,y:360+Math.random()*80,vx:-120-Math.random()*120,vy:(Math.random()-0.5)*120,l:0.7,c:'#ff3b5c'});
  }

  /* door / win */
  if(P.x>DOOR.x-20 && P.x<DOOR.x+60 && P.y+P.h>DOOR.y && mode==='play'){
    mode='win'; winT=0; bgmStop(); sfx.win();
  }

  /* camera */
  const target=Math.max(0,Math.min(END_X-W+200,P.x+P.w/2-W*0.42));
  camX+=(target-camX)*Math.min(1,dt*6);
  if(shake>0)shake-=dt;

  /* particles */
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt;q.l-=dt;if(q.l<=0)parts.splice(i,1);}
  if(msgT>0)msgT-=dt;
}
function die(){
  if(mode!=='play')return; mode='dead'; P.deadT=0; sfx.hurt(); shake=0.6; bgmStop();
  for(let i=0;i<20;i++)parts.push({x:P.x+P.w/2,y:P.y+P.h/2,vx:(Math.random()-0.5)*400,vy:-Math.random()*300,l:0.7,c:'#ff6b81'});
}
let parts=[], msgT=0, msgTxt='';
function msg(s,d){msgTxt=s;msgT=d;}
function startGame(){
  mode='play'; startT=t; bgmStart(); sfx.click();
}
function resetLevel(){
  P.x=80;P.y=400;P.vx=0;P.vy=0;P.face=1;coins=0;bossOn=false;chase=false;
  bossX=CHASE_START_X-500;camX=0;parts=[];msgT=0;
  for(const c of COINS)c.taken=false;
  mode='play';bgmStart();
}
let touchTap=false;
cv.addEventListener('pointerdown',()=>{audio(); if(mode==='title'){touchTap=true;} });
addEventListener('pointerup',()=>{touchTap=false;});

/* ---------- drawing ---------- */
function star(x,y,r,c){cx.fillStyle=c;cx.beginPath();
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5,a2=a+Math.PI/5;
    cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);cx.lineTo(x+Math.cos(a2)*r*0.45,y+Math.sin(a2)*r*0.45);}
  cx.closePath();cx.fill();}
function drawBG(){
  const gr=cx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#0b0e1a');gr.addColorStop(0.65,'#141b36');gr.addColorStop(1,'#1d1440');
  cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  /* parallax stars */
  cx.save();
  for(let layer=0;layer<3;layer++){
    const f=0.15+layer*0.2;
    for(let i=0;i<40;i++){
      const sx=((i*167.3+layer*911)%1400)-camX*f, sy=(i*97.7+layer*311)%380;
      const tw=0.35+0.65*Math.abs(Math.sin(t*1.5+i));
      cx.fillStyle=`rgba(200,220,255,${(0.25+layer*0.2)*tw})`;
      cx.fillRect(((sx%W)+W)%W,sy,layer+1,layer+1);
    }
  }
  cx.restore();
  /* moon */
  cx.fillStyle='#f4f1de';cx.beginPath();cx.arc(820-camX*0.05,90,42,0,7);cx.fill();
  cx.fillStyle='#0b0e1a';cx.beginPath();cx.arc(806-camX*0.05,80,38,0,7);cx.fill();
  /* far mountains */
  cx.fillStyle='#10162e';
  for(let i=0;i<8;i++){const mx=i*260-camX*0.3;
    cx.beginPath();cx.moveTo(mx% (W+400)-200,H);cx.lineTo(mx%(W+400)-40,300);cx.lineTo(mx%(W+400)+120,H);cx.closePath();cx.fill();}
}
function drawWorld(){
  cx.save();
  const sx=shake>0?(Math.random()-0.5)*10*shake:0, sy=shake>0?(Math.random()-0.5)*10*shake:0;
  cx.translate(-Math.round(camX+sx),Math.round(sy));
  /* platforms */
  for(const p of PLATS){
    const g=cx.createLinearGradient(0,p[1],0,p[1]+70);
    g.addColorStop(0,'#3a4a7d');g.addColorStop(1,'#232b52');
    cx.fillStyle=g;cx.fillRect(p[0],p[1],p[2],H-p[1]);
    cx.fillStyle='#5f7bd9';cx.fillRect(p[0],p[1],p[2],6);
    cx.fillStyle='rgba(255,255,255,.06)';
    for(let gx=p[0]+30;gx<p[0]+p[2];gx+=60)cx.fillRect(gx,p[1]+14,26,4);
  }
  /* spikes */
  for(const s of SPIKES){
    cx.fillStyle='#ff5c7a';
    for(let i=0;i<3;i++){cx.beginPath();cx.moveTo(s[0]+i*10,s[1]+30);
      cx.lineTo(s[0]+i*10+5,s[1]);cx.lineTo(s[0]+i*10+10,s[1]+30);cx.closePath();cx.fill();}
  }
  /* coins */
  for(const c of COINS){ if(c.taken)continue;
    const cy=c.y+Math.sin(t*4+c.ph)*4;
    cx.fillStyle='#ffd94a';cx.beginPath();cx.arc(c.x,cy,10,0,7);cx.fill();
    cx.fillStyle='#b8860b';cx.beginPath();cx.arc(c.x,cy,6,0,7);cx.fill();
    cx.fillStyle='#fff2b0';cx.fillRect(c.x-3,cy-6,3,5);
  }
  /* door */
  cx.fillStyle='#2a3358';cx.fillRect(DOOR.x,DOOR.y,64,120);
  const dg=cx.createLinearGradient(0,DOOR.y,0,DOOR.y+120);
  dg.addColorStop(0,'#7fe7ff');dg.addColorStop(1,'#2b9fd8');
  cx.fillStyle=dg;cx.fillRect(DOOR.x+10,DOOR.y+10,44,110);
  cx.fillStyle='#eafcff';cx.font='bold 13px sans-serif';cx.textAlign='center';
  cx.fillText('EXIT',DOOR.x+32,DOOR.y+62);
  /* boss */
  if(bossOn||P.x>CHASE_START_X-700){
    const bx=bossX, by=380+Math.sin(bossBob)*10, s=1+Math.min(1,(P.x-bossX)/900)*0.2;
    cx.save();cx.translate(bx,by);cx.scale(s,s);
    cx.fillStyle='rgba(255,59,92,.18)';cx.beginPath();cx.arc(0,0,120,0,7);cx.fill();
    cx.fillStyle='#3d0a18';
    cx.beginPath();cx.arc(0,0,90,0,7);cx.fill();
    /* jagged silhouette */
    cx.fillStyle='#5c1226';
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
      cx.beginPath();cx.arc(Math.cos(a)*80,Math.sin(a)*70,26,0,7);cx.fill();}
    /* eyes */
    const ex=Math.max(-14,Math.min(14,(P.x-bx)*0.03));
    cx.fillStyle='#ffeb3b';
    cx.beginPath();cx.ellipse(-28+ex,-18,13,17,0,0,7);cx.fill();
    cx.beginPath();cx.ellipse(28+ex,-18,13,17,0,0,7);cx.fill();
    cx.fillStyle='#c00';cx.beginPath();cx.arc(-28+ex,-16,5,0,7);cx.fill();
    cx.beginPath();cx.arc(28+ex,-16,5,0,7);cx.fill();
    /* mouth */
    cx.fillStyle='#20040c';cx.beginPath();cx.ellipse(0,42,44,20,0,0,7);cx.fill();
    cx.fillStyle='#fff';
    for(let i=-3;i<=3;i++){cx.beginPath();
      cx.moveTo(i*12-5,28);cx.lineTo(i*12+5,28);cx.lineTo(i*12,44);cx.closePath();cx.fill();}
    cx.restore();
  }
  /* player: the moth */
  drawMoth(P.x+P.w/2,P.y+P.h/2,P.face);
  /* particles */
  for(const q of parts){cx.globalAlpha=Math.max(0,q.l*2);cx.fillStyle=q.c;cx.fillRect(q.x-2,q.y-2,4,4);}
  cx.globalAlpha=1;
  cx.restore();
}
function drawMoth(x,y,face){
  cx.save();cx.translate(x,y);cx.scale(face,1);
  const run=Math.abs(P.vx)>40&&P.onGround?Math.sin(t*16)*4:0;
  /* wings */
  cx.fillStyle='#7b6ff0';
  const flap=P.onGround?0:Math.sin(t*22)*10;
  cx.beginPath();cx.ellipse(-12,-6-flap*0.4,13,9-flap*0.3,-0.5,0,7);cx.fill();
  cx.beginPath();cx.ellipse(12,-6-flap*0.4,13,9-flap*0.3,0.5,0,7);cx.fill();
  cx.fillStyle='rgba(255,255,255,.5)';
  cx.beginPath();cx.arc(-12,-8,3,0,7);cx.fill();
  cx.beginPath();cx.arc(12,-8,3,0,7);cx.fill();
  /* body */
  cx.fillStyle='#2e2a5c';cx.beginPath();cx.ellipse(0,4,9,14,0,0,7);cx.fill();
  /* head + eyes */
  cx.fillStyle='#3d3670';cx.beginPath();cx.arc(2,-12,8,0,7);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(5,-13,3,0,7);cx.fill();
  cx.fillStyle='#111';cx.beginPath();cx.arc(6,-13,1.5,0,7);cx.fill();
  /* antennae */
  cx.strokeStyle='#9d92ff';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(0,-19);cx.quadraticCurveTo(-6,-28,-11,-26+flap*0.3);cx.stroke();
  cx.beginPath();cx.moveTo(4,-19);cx.quadraticCurveTo(10,-28,15,-26-flap*0.3);cx.stroke();
  /* feet */
  cx.fillStyle='#1d1a40';
  cx.fillRect(-7,16+run,6,4);cx.fillRect(2,16-run,6,4);
  cx.restore();
}
function drawHUD(){
  cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(10,10,190,64);
  cx.fillStyle='#ffd94a';cx.beginPath();cx.arc(30,32,10,0,7);cx.fill();
  cx.fillStyle='#fff';cx.font='bold 22px sans-serif';cx.textAlign='left';
  cx.fillText('× '+coins,48,40);
  const el=Math.max(0,t-startT);
  cx.fillText(el.toFixed(1)+'s',48,64);
  if(bossOn){
    cx.fillStyle='#ff3b5c';cx.font='bold 20px sans-serif';cx.textAlign='center';
    cx.fillText('!! RUN !!',W/2,44+Math.sin(t*10)*4);
  }
  if(msgT>0){
    cx.fillStyle='#fff';cx.font='bold 44px sans-serif';cx.textAlign='center';
    cx.globalAlpha=Math.min(1,msgT);cx.fillText(msgTxt,W/2,H/2-60);cx.globalAlpha=1;
  }
}
function drawTitle(){
  drawBG();
  cx.fillStyle='#fff';cx.textAlign='center';
  cx.font='bold 64px sans-serif';
  cx.fillText('MOTH RUNNER',W/2,190);
  cx.font='24px sans-serif';cx.fillStyle='#9db4ff';
  cx.fillText('a one-level game · drawn + sounded in code · no accounts',W/2,240);
  cx.fillStyle='#ffd94a';cx.font='20px sans-serif';
  cx.fillText('Collect coins. Reach the EXIT. When it wakes up — RUN.',W/2,300);
  cx.fillStyle='#fff';cx.font='bold 26px sans-serif';
  const bl=0.6+0.4*Math.sin(t*5);
  cx.globalAlpha=bl;cx.fillText('TAP OR PRESS SPACE TO START',W/2,380);cx.globalAlpha=1;
  cx.font='16px sans-serif';cx.fillStyle='#8a93b8';
  cx.fillText('← → / A D to move · SPACE to jump · M to mute',W/2,430);
}
function drawDead(){
  drawBG();drawWorld();drawHUD();
  cx.fillStyle='rgba(10,0,10,.6)';cx.fillRect(0,0,W,H);
  cx.fillStyle='#ff6b81';cx.font='bold 56px sans-serif';cx.textAlign='center';
  cx.fillText('SQUASHED',W/2,H/2-10);
  cx.fillStyle='#fff';cx.font='22px sans-serif';
  cx.fillText('respawning…',W/2,H/2+40);
}
function drawWin(){
  drawBG();drawWorld();
  cx.fillStyle='rgba(0,20,10,.55)';cx.fillRect(0,0,W,H);
  cx.fillStyle='#7fe7a0';cx.font='bold 56px sans-serif';cx.textAlign='center';
  cx.fillText('YOU OUTRAN IT',W/2,H/2-30);
  cx.fillStyle='#fff';cx.font='24px sans-serif';
  cx.fillText(coins+' / 40 coins · tap to play again',W/2,H/2+20);
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  dt=Math.min(dt,0.033);
  update(dt);
  cx.clearRect(0,0,W,H);
  if(mode==='title')drawTitle();
  else if(mode==='dead')drawDead();
  else if(mode==='win'){drawWin(); if(key.j||touchTap){touchTap=false;resetLevel();}}
  else{drawBG();drawWorld();drawHUD();}
  requestAnimationFrame(frame);
}
/* fit canvas to screen, keep 16:9 */
function fit(){
  const ar=16/9, ww=innerWidth, wh=innerHeight;
  let w=ww,h=ww/ar; if(h>wh){h=wh;w=wh*ar;}
  cv.style.width=w+'px';cv.style.height=h+'px';
}
addEventListener('resize',fit);fit();
document.getElementById('touch').style.display =
  ('ontouchstart' in window)?'flex':'none';
requestAnimationFrame(frame);
</script>
