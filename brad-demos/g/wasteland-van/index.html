<!DOCTYPE html>

<title>ROADKILL RIG — Hark Original</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

 background:linear-gradient(180deg,rgba(26,15,18,.82) 0%,rgba(26,15,18,0) 30%,rgba(26,15,18,0) 68%,rgba(26,15,18,.85) 100%)}

 text-shadow:0 6px 0 #e8312a,0 11px 0 #1a0f12,5px 0 0 #1a0f12,-5px 0 0 #1a0f12,0 -5px 0 #1a0f12,5px 5px 0 #1a0f12,-5px 5px 0 #1a0f12}

}

// ---------------- world: wasteland basin, the Rift trench, mega jump, kickers, wrecks, mesas ----------------
const ARENA_R = 168;          // hard boundary radius (canyon walls beyond)
