<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <style>
      html, body, #app, canvas, #game, #nes-pad { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    </style>
    <script src="./shared/nes-pad-controls.js" defer></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Rampage</title>
    <meta name="notebook-game" content="rampage" />
    <meta
      name="description"
      content="NES Rampage — climb, smash, eat, bail, punch the USA map."
    />
    <meta property="og:title" content="Rampage" />
    <meta
      property="og:description"
      content="NES Rampage — climb, smash, eat, bail, punch the USA map."
    />
    <meta property="og:url" content="https://notebook-arcade.surge.sh/rampage/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://notebook-arcade.surge.sh/rampage/og.jpg" />
    <meta property="og:image:secure_url" content="https://notebook-arcade.surge.sh/rampage/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Stick-ink ape climbing a notebook-paper city, NES Rampage."
    />
    <meta property="og:site_name" content="Notebook Arcade" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rampage" />
    <meta
      name="twitter:description"
      content="NES Rampage — climb, smash, eat, bail, punch the USA map."
    />
    <meta name="twitter:image" content="https://notebook-arcade.surge.sh/rampage/og.jpg" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="preload" href="./fonts/patrick-hand.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      (function () {
        var p = location.pathname
        if (p && !p.endsWith('/') && !/\.[a-z0-9]+$/i.test(p)) {
          location.replace(p + '/' + location.search + location.hash)
        }
      })()
    </script>
    <script src="./js/game.js" defer></script>
    <link rel="stylesheet" href="./assets/game.css" />
    <link rel="stylesheet" href="./shared/nes-pad.css" />
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <div id="playfield">
          <canvas id="game" width="1280" height="720" aria-label="Rampage notebook arcade"></canvas>
          <button id="mute" type="button" aria-label="Mute sound">♪</button>
        </div>
        <div class="nes-wrap">
          <div id="nes-pad" aria-label="Sketched NES controller">
            <svg class="pad-art" viewBox="0 0 560 172" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                class="pad-body"
                d="M 26,26 C 22,8 56,7 96,12 L 468,9 C 524,11 548,32 545,78 C 542,132 512,164 428,166 L 92,163 C 28,160 8,132 11,76 C 13,36 28,28 26,26 Z"
              />
              <path class="pad-rule" d="M 34,44 Q 280,40 528,46" />
              <path class="pad-rule" d="M 32,60 Q 290,58 530,62" />
              <path class="pad-rule" d="M 30,76 Q 270,74 528,80" />
              <path class="pad-rule" d="M 32,92 Q 300,90 526,96" />
              <path class="pad-rule" d="M 36,108 Q 280,106 522,112" />
              <path class="pad-rule" d="M 40,124 Q 290,122 518,128" />
              <path class="pad-rule" d="M 48,140 Q 300,138 500,144" />
              <path class="pad-margin" d="M 58,20 C 56,70 60,120 54,158" />
              <path
                class="pad-plus pad-v"
                d="M 86,22 C 80,20 72,24 74,32 L 70,128 C 70,140 82,146 92,142 L 104,32 C 106,22 94,18 86,22 Z"
              />
              <path
                class="pad-plus pad-h"
                d="M 36,72 C 30,68 28,78 32,84 L 138,88 C 150,88 152,76 144,72 L 42,70 C 38,70 36,72 36,72 Z"
              />
              <path
                class="pad-nub"
                d="M 78,76 C 70,74 68,86 74,92 C 80,100 96,98 98,88 C 100,76 86,72 78,76 Z"
              />
              <path
                class="pad-pill pad-select"
                d="M 246,58 C 238,56 236,66 242,70 L 288,72 C 298,72 298,60 290,58 Z"
              />
              <path
                class="pad-pill pad-start"
                d="M 250,92 C 242,90 240,100 246,104 L 292,106 C 302,106 302,94 294,92 Z"
              />
              <text class="pad-lbl" x="268" y="84">SELECT</text>
              <text class="pad-lbl" x="270" y="118">START</text>
              <path
                class="pad-face btn-b"
                d="M 392,58 C 372,56 364,78 374,94 C 384,112 416,108 420,88 C 424,66 406,54 392,58 Z"
              />
              <path
                class="pad-face btn-a"
                d="M 458,50 C 438,48 432,72 442,88 C 452,106 486,100 488,78 C 490,56 474,46 458,50 Z"
              />
              <text class="pad-letter letter-b" x="396" y="86">B</text>
              <text class="pad-letter letter-a" x="462" y="78">A</text>
              <text class="pad-lbl" x="396" y="134">JUMP</text>
              <text class="pad-lbl" x="464" y="126">PUNCH</text>
            </svg>
            <div class="nes-hits">
              <button type="button" data-act="up" class="hit d-up" aria-label="Up — climb"></button>
              <button type="button" data-act="down" class="hit d-down" aria-label="Down — climb"></button>
              <button type="button" data-act="left" class="hit d-left" aria-label="Left"></button>
              <button type="button" data-act="right" class="hit d-right" aria-label="Right"></button>
              <button type="button" data-act="select" class="hit hit-select" aria-label="Select — mute / switch"></button>
              <button type="button" data-act="start" class="hit hit-start" aria-label="Start"></button>
              <button type="button" data-act="jump" class="hit hit-b" aria-label="B — jump"></button>
              <button type="button" data-act="punch" class="hit hit-a" aria-label="A — punch"></button>
            </div>
          </div>
        </div>
        <p class="hint">
          Climb · smash · eat · bail. A punch · B jump · ↑↓ on the wall · START · SELECT mute
        </p>
      </div>
    </div>
  </body>
</html>
