<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WORD CAT</title></head><body>
<script type="module">
/*RECIPE daily-deduction. ONE screen, ONE mechanic: guess the 5-letter word in 6 tries. 3-SECOND RULE: on-screen keyboard = player, 6 rows = enemy, goal = turn the tiles green.
  DON'T BUILD: accounts, share screen, dictionary beyond ~120 words, hard mode. The answer comes from ?seed= (the "daily" word). Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, ri, pick, shuffle } from '../_vendor/gp2d.js';
import { face } from '../_vendor/gpsprites.js';
const S = { title: 'WORD CAT', sub: 'Guess the word in 6', hook: 'Can you solve it in 6?', hero: 'cat', bg: '#121a2b', correct: '#6aaa64', present: '#c9b458', absent: '#4a4f5a', style: 'toon', /*SPEC*/ ...{"hook":"Can you solve it in 6?"} /*END*/ };
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: S.bg, style: S.style });
const WORDS = 'APPLE BRAVE CHAIR DREAM EARTH FLAME GRAPE HOUSE JUICE KNIFE LEMON MOUSE NIGHT OCEAN PIANO QUEEN RIVER SMILE TIGER UNCLE VOICE WATER YOUTH ZEBRA CANDY DANCE EAGLE FIELD GHOST HEART IVORY JELLY KOALA LIGHT MAGIC NOBLE OLIVE PEACH QUIET ROBOT SUGAR TRAIN UNDER VIVID WORLD XENON YEAST ZONAL BEACH CLOUD DRIVE ELBOW FRUIT GIANT HONEY IGLOO JOKER KITTY LUNCH MANGO NURSE ORBIT PLANT QUILT RADIO STONE TOAST URBAN VALVE WHALE PIZZA BREAD CRANE DAISY EMBER FLUTE GLOBE HAPPY INDEX JEWEL KARMA LASER MAPLE NINJA OTTER PARTY QUEST ROAST SHEEP TULIP UMBRA VENOM WITCH CLOWN BLOOM CRISP FROST GRAIN HINGE'.split(' ');
const KEYS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'], TS = 66, GX = (540 - 5 * TS - 4 * 8) / 2, GY = 130;
let ans, rows, cur, reveal, hl, bot, hist, mood;
function init() { ans = WORDS[Math.floor(R() * WORDS.length)]; rows = []; cur = ''; reveal = null; hl = {}; bot = { t: 1, q: '' }; hist = []; mood = 0; g.score = 0; }
g.onReset = init; init();
function score(guess) { const res = Array(5).fill('absent'), left = [...ans]; for (let i = 0; i < 5; i++) if (guess[i] === ans[i]) { res[i] = 'correct'; left[i] = null; } for (let i = 0; i < 5; i++) if (res[i] !== 'correct') { const j = left.indexOf(guess[i]); if (j >= 0) { res[i] = 'present'; left[j] = null; } } return res; }
function submit() { if (cur.length < 5 || reveal) return; const res = score(cur); reveal = { guess: cur, res, t: 0 }; hist.push({ guess: cur, res }); cur = ''; }
function type(ch) { if (reveal || cur.length >= 5) return; cur += ch; hl[ch] = .18; sfx('click', { pitch: 1 + cur.length * .08 }); }
const kpos = (r, i) => ({ x: (540 - KEYS[r].length * 54) / 2 + i * 54 + 1, y: 668 + r * 84, w: 52, h: 76 });
function update(dt) {
  if (g.mode !== 'play') return; for (const k in hl) hl[k] = Math.max(0, hl[k] - dt);
  for (const code in g.pressed) { if (/^Key[A-Z]$/.test(code)) type(code[3]); else if (code === 'Enter') submit(); else if (code === 'Backspace') cur = cur.slice(0, -1); }
  for (const tp of g.taps) { for (let r = 0; r < 3; r++) [...KEYS[r]].forEach((ch, i) => { const k = kpos(r, i); if (tp.x > k.x && tp.x < k.x + k.w && tp.y > k.y && tp.y < k.y + k.h) type(ch); }); if (tp.x > 330 && tp.x < 520 && tp.y > 590 && tp.y < 646) submit(); if (tp.x > 20 && tp.x < 210 && tp.y > 590 && tp.y < 646) cur = cur.slice(0, -1); }
  if (reveal) { reveal.t += dt; const n = Math.floor(reveal.t / .22); if (n > (reveal.n ?? -1) && n < 5) { reveal.n = n; sfx('ding', { pitch: comboPitch(n * 2) * (reveal.res[n] === 'correct' ? 1.25 : reveal.res[n] === 'present' ? 1.06 : .8) }); g.burst(GX + n * (TS + 8) + TS / 2, GY + hist.length * 0 + (hist.length - 1) * (TS + 8) + TS / 2, 4, { color: S[reveal.res[n]], speed: 120, size: 6 }); }
    if (reveal.t > 1.35) { const r = reveal; rows.push({ guess: r.guess, res: r.res }); reveal = null; if (r.res.every(x => x === 'correct')) { mood = 1; g.score = (7 - rows.length) * 100; g.end({ win: true, score: g.score, label: 'POINTS' }); g.burst(270, 300, 30, { color: [S.correct, '#fff', '#ffd34d'], speed: 380 }); } else if (rows.length >= 6) { mood = -1; g.end({ win: false, score: 0, label: ans }); sfx('hit'); } else mood = r.res.filter(x => x === 'correct').length > 2 ? 1 : 0; } }
  else if (g.auto && rows.length < 6) { bot.t -= dt; if (bot.t <= 0) { const len = cur.length; if (len < 5) { const w = bot.q || (bot.q = botGuess()); type(w[len]); bot.t = .11; } else { submit(); bot.q = ''; bot.t = .5; } } }
  g.state = { tries: rows.length, cur, solved: rows.at(-1)?.res.every(x => x === 'correct') || false };
}
function botGuess() { if (g.dumb()) return pick(WORDS); let c = WORDS.filter(w => rows.every(r => { const a = ans; ans = w; const s = score(r.guess); ans = a; return s.join() === r.res.join(); })); if (rows.length === 0) return 'CRANE'; return c.length ? c[0] : pick(WORDS); }
function draw(c) {
  face(c, S.hero, 60, 78, 34); g.text(S.title, 110, 96, { size: 44, color: '#ffd34d', stroke: 0 }); g.text(`${rows.length}/6`, 500, 96, { size: 36, align: 'right', stroke: 0 });
  for (let r = 0; r < 6; r++) for (let i = 0; i < 5; i++) { const x = GX + i * (TS + 8), y = GY + r * (TS + 8); let ch = '', col = null, flip = 1;
    if (r < rows.length) { ch = rows[r].guess[i]; col = S[rows[r].res[i]]; } else if (reveal && r === rows.length) { ch = reveal.guess[i]; const t = reveal.t / .22 - i; col = t > .5 ? S[reveal.res[i]] : null; flip = Math.abs(Math.cos(Math.min(1, Math.max(0, t)) * Math.PI)); } else if (r === rows.length) ch = cur[i] || '';
    c.save(); c.translate(x + TS / 2, y + TS / 2); c.scale(1, Math.max(.05, flip)); c.fillStyle = col || '#1b2540'; c.fillRect(-TS / 2, -TS / 2, TS, TS); c.strokeStyle = col ? '#000' : (ch ? '#9aa6c8' : '#39466b'); c.lineWidth = 4; c.strokeRect(-TS / 2, -TS / 2, TS, TS); c.restore(); if (ch) g.text(ch, x + TS / 2, y + TS / 2 + 18, { size: 54, align: 'center', stroke: 5 }); }
  const kc = {}; for (const r of [...rows, ...(reveal ? [] : [])]) r.guess.split('').forEach((ch, i) => { const s = r.res[i]; if (kc[ch] !== 'correct' && (s === 'correct' || (s === 'present' && kc[ch] !== 'present') || !kc[ch])) kc[ch] = s; });
  for (let r = 0; r < 3; r++) [...KEYS[r]].forEach((ch, i) => { const k = kpos(r, i); c.fillStyle = kc[ch] ? S[kc[ch]] : '#2b3556'; if (hl[ch] > 0) c.fillStyle = '#fff'; c.beginPath(); c.roundRect(k.x, k.y, k.w, k.h, 8); c.fill(); g.text(ch, k.x + k.w / 2, k.y + 49, { size: 34, align: 'center', stroke: 0 }); });
  for (const [x, l] of [[20, 'DEL'], [330, 'ENTER']]) { c.fillStyle = '#2b3556'; c.beginPath(); c.roundRect(x, 590, 190, 56, 10); c.fill(); g.text(l, x + 95, 630, { size: 30, align: 'center', stroke: 0 }); }
  if (g.mode === 'play' && !rows.length && !cur) g.text('TAP LETTERS, THEN ENTER', 270, 580, { size: 26, align: 'center', color: '#ffd34d' });
  if (g.mode === 'over' && !g.result.win) g.text(ans, 270, 560, { size: 60, align: 'center', color: '#ffd34d' });
}
g.run(update, draw);
</script></body></html>
