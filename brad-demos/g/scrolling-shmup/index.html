<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAT FIGHTER</title></head><body>
<script type="module">
/*RECIPE scrolling-shmup. ONE screen, ONE mechanic: drag your ship, it auto-fires; dodge the zombie UFOs and bring down the boss. 3-SECOND RULE: cat ship = player, green UFOs and their bullets = enemy, goal = shoot the boss.
  DON'T BUILD: weapon shop, multiple ships, story, more than one boss. Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, rnd, ri, clamp, dist } from '../_vendor/gp2d.js';
import { ship, face, heart } from '../_vendor/gpsprites.js';
const S = { title: 'CAT FIGHTER', sub: 'Drag to fly. It shoots for you.', hook: 'Dodge the bullet hell', pilot: 'cat', hull: '#4aa8ff', foe: 'zombie', bg: '#0b1030', bossAt: 8, bossHp: 22, style: 'toon', /*SPEC*/ ...{"hook":"Dodge the bullet hell"} /*END*/ };
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: S.bg, style: S.style });
let p, pb, en, eb, t0, fireT, wave, boss, stars, chain, chainT, bombs, botT;
stars = Array.from({ length: 60 }, () => ({ x: rnd(0, 540), y: rnd(0, 960), s: rnd(.4, 1.6) }));
function init() { p = { x: 270, y: 780, hp: 3, inv: 0 }; pb = []; en = []; eb = []; t0 = 0; fireT = 0; wave = 0; boss = null; chain = 0; chainT = 0; bombs = 1; botT = 0; g.score = 0; }
g.onReset = init; init();
const ufo = (x, y, hp = 1, o = {}) => ({ x, y, hp, max: hp, t: rnd(0, 6), x0: x, fl: 0, sh: rnd(1, 3), ...o });
function hurt() { if (p.inv > 0) return; p.hp--; p.inv = 1.4; sfx('hit'); g.shake(12); g.hitstop(.08); g.flash('#ff3b3b', .3); eb = []; if (p.hp <= 0) { g.burst(p.x, p.y, 30, { color: [S.hull, '#fff', '#ffd34d'], speed: 420 }); g.end({ win: false, score: g.score, label: 'SCORE' }); } }
function kill(e) { chain = chainT > 0 ? chain + 1 : 1; chainT = 1; g.score += 50 * chain; sfx('boom', { vol: .5, pitch: comboPitch(chain) }); g.burst(e.x, e.y, 16, { color: ['#8fcf7a', '#ffd34d', '#fff'], speed: 340 }); g.popup('+' + 50 * chain, e.x, e.y - 20, '#ffd34d', 28); }
function update(dt) {
  if (g.mode !== 'play') return; t0 += dt; p.inv -= dt; fireT -= dt; chainT -= dt; botT -= dt;
  const B = g.btn('b', 400, 850, 120, 90, 'BOMB', { key: 'KeyB' });
  if (g.ptr.down && !g.auto) { p.x += (g.ptr.x - p.x) * Math.min(1, dt * 14); p.y += (g.ptr.y - 90 - p.y) * Math.min(1, dt * 14); } p.x += ((g.keys.ArrowRight ? 1 : 0) - (g.keys.ArrowLeft ? 1 : 0)) * 340 * dt; p.y += ((g.keys.ArrowDown ? 1 : 0) - (g.keys.ArrowUp ? 1 : 0)) * 340 * dt;
  if (g.auto && !g.dumb()) { let best = p.x, bs = 1e9; for (let x = 40; x <= 500; x += 20) { let th = 0; for (const b of eb) { const d = Math.hypot(b.x - x, b.y - p.y); if (d < 150) th += 150 / (d + 5); } for (const e of en) { const d = Math.hypot(e.x - x, e.y - p.y); if (d < 120) th += 90 / (d + 5); } const tg = (boss || en[0] || { x: 270 }).x; th += Math.abs(x - tg) * .004 + Math.abs(x - p.x) * .006; if (th < bs) { bs = th; best = x; } } p.x += clamp(best - p.x, -330 * dt, 330 * dt); p.y = 780 + Math.sin(t0) * 30; if (eb.length > 14 && bombs > 0 && B.pressed === false && botT <= 0) { botT = 9; B.pressed = true; } }
  p.x = clamp(p.x, 30, 510); p.y = clamp(p.y, 200, 900);
  if (B.pressed && bombs > 0) { bombs--; sfx('boom'); g.flash('#fff', .6); g.shake(14); eb = []; for (const e of en) { e.hp -= 5; e.fl = .2; } if (boss) boss.hp -= 5; g.burst(p.x, p.y - 200, 40, { color: ['#fff', '#ffd34d'], speed: 600 }); }
  if (fireT <= 0) { fireT = .16; pb.push({ x: p.x - 12, y: p.y - 30 }, { x: p.x + 12, y: p.y - 30 }); sfx('laser', { vol: .25 }); }
  const waves = [[1, 6], [4.5, 7], [8, 5]]; if (wave < waves.length && t0 >= waves[wave][0]) { const n = waves[wave][1], y0 = -40; for (let i = 0; i < n; i++) en.push(ufo(60 + i * (420 / (n - 1)), y0 - i * 24, 1)); wave++; }
  if (!boss && t0 >= S.bossAt && wave >= 3) { boss = ufo(270, -120, S.bossHp, { boss: 1 }); g.showBanner('BOSS!', 1.1); sfx('boom'); g.shake(8); }
  for (const b of pb) b.y -= 900 * dt; pb = pb.filter(b => b.y > -20);
  for (const e of en) { e.t += dt; e.fl -= dt; e.y += (e.y < 160 ? 90 : 38) * dt; e.x = e.x0 + Math.sin(e.t * 1.6) * 60; e.sh -= dt; if (e.sh <= 0 && e.y > 40 && e.y < 700) { e.sh = rnd(1.4, 2.6); const a = Math.atan2(p.y - e.y, p.x - e.x); eb.push({ x: e.x, y: e.y + 20, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190 }); } }
  if (boss) { boss.t += dt; boss.fl -= dt; boss.y += (170 - boss.y) * Math.min(1, dt * 1.5); boss.x = 270 + Math.sin(boss.t * .9) * 160; boss.sh -= dt; if (boss.sh <= 0 && boss.y > 100) { boss.sh = .75; const n = 8, off = boss.t; for (let i = 0; i < n; i++) { const a = off + i * 6.283 / n; eb.push({ x: boss.x, y: boss.y + 30, vx: Math.cos(a) * 170, vy: Math.abs(Math.sin(a)) * 170 + 40 }); } sfx('shoot', { vol: .4 }); } }
  for (const b of pb) { for (const e of en) if (e.hp > 0 && Math.abs(e.x - b.x) < 34 && Math.abs(e.y - b.y) < 24) { e.hp--; e.fl = .1; b.y = -99; sfx('pop', { vol: .3 }); if (e.hp <= 0) kill(e); break; } if (boss && b.y > -90 && Math.abs(boss.x - b.x) < 80 && Math.abs(boss.y - b.y) < 50) { boss.hp--; boss.fl = .08; b.y = -99; g.score += 5; if (R() < .3) sfx('pop', { vol: .3, pitch: 1.2 }); } }
  en = en.filter(e => e.hp > 0 && e.y < 1000); for (const b of eb) { b.x += b.vx * dt; b.y += b.vy * dt; if (Math.hypot(b.x - p.x, b.y - p.y) < 16) { b.y = 2000; hurt(); } } eb = eb.filter(b => b.y < 1000 && b.x > -20 && b.x < 560 && b.y > -20);
  for (const e of en) if (Math.hypot(e.x - p.x, e.y - p.y) < 40) hurt();
  if (boss && boss.hp <= 0) { g.score += 1000; for (let i = 0; i < 6; i++) g.burst(boss.x + rnd(-60, 60), boss.y + rnd(-30, 30), 20, { color: ['#8fcf7a', '#ffd34d', '#fff', '#ff6b6b'], speed: 520 }); sfx('boom'); g.shake(16); g.hitstop(.15); g.end({ win: true, score: g.score, label: 'SCORE' }); boss = null; }
  for (const s of stars) { s.y += s.s * 160 * dt; if (s.y > 960) { s.y = 0; s.x = rnd(0, 540); } }
  g.hud.l = `${g.score}`; g.hud.r = boss ? 'BOSS' : `${Math.max(0, Math.ceil(S.bossAt - t0))}s`; g.state = { hp: p.hp, score: g.score, enemies: en.length, boss: boss ? boss.hp : -1 };
}
function draw(c) {
  for (const s of stars) { c.fillStyle = `rgba(255,255,255,${.3 + s.s * .3})`; c.fillRect(s.x, s.y, s.s * 2, s.s * 4); }
  const saucer = (e, sc) => { c.save(); c.translate(e.x, e.y); c.scale(sc, sc); c.fillStyle = e.fl > 0 ? '#fff' : '#7a8bb0'; c.beginPath(); c.ellipse(0, 6, 44, 14, 0, 0, 7); c.fill(); c.lineWidth = 4; c.strokeStyle = '#000'; c.stroke(); c.fillStyle = '#bfeaff'; c.beginPath(); c.arc(0, -2, 22, Math.PI, 0); c.fill(); c.stroke(); c.restore(); face(c, S.foe, e.x, e.y - 8 * sc, 13 * sc, e.boss ? '#5a9a4a' : undefined); c.fillStyle = '#ffd34d'; for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(e.x + i * 24 * sc, e.y + 10 * sc, 4 * sc, 0, 7); c.fill(); } };
  for (const e of en) saucer(e, 1); if (boss) { saucer(boss, 2.6); g.bar(120, 100, 300, 14, boss.hp / S.bossHp, '#ff5a5a'); }
  c.fillStyle = '#ffd34d'; for (const b of pb) { c.fillRect(b.x - 3, b.y - 12, 6, 24); } c.fillStyle = '#ff5a8a'; for (const b of eb) { c.beginPath(); c.arc(b.x, b.y, 8, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
  if (p.inv <= 0 || Math.floor(g.t * 20) % 2) ship(c, p.x, p.y, 60, { color: S.hull, pilot: S.pilot, t: g.t });
  for (let i = 0; i < p.hp; i++) heart(c, 40 + i * 44, 110, 34); c.fillStyle = bombs ? '#ffd34d' : '#555'; g.text(bombs ? 'BOMB READY' : 'NO BOMB', 24, 150, { size: 22, color: bombs ? '#ffd34d' : '#888' });
}
g.run(update, draw);
</script></body></html>
