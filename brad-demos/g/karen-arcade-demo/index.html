<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>KAREN ARCADE (FREE DEMO)</title>
<style>
:root{--a:#ffd34d;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Impact,"Arial Black",system-ui,sans-serif;color:#fff}
button{font:inherit;color:inherit;cursor:pointer}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
iframe.off{display:none}
#bar{position:fixed;left:0;right:0;top:0;z-index:5;display:none;align-items:center;gap:8px;padding:max(6px,var(--st)) 10px 6px;background:linear-gradient(#000a,#0000);font-size:3.4vmin;text-shadow:0 2px 0 #000;pointer-events:none}
body.playing #bar{display:flex}
#dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}#dots i{width:2vmin;height:2vmin;max-width:12px;max-height:12px;border-radius:50%;background:#fff3;border:1px solid #fff6}#dots i.on{background:var(--a);border-color:#fff}#dots i.win{background:#7dff7d}#dots i.lose{background:#ff6b6b}
#bar button{pointer-events:auto;background:#0009;border:2px solid #fff6;border-radius:99px;padding:1vmin 3vmin;font-size:3.2vmin;min-height:44px}
#toast{position:fixed;left:0;right:0;top:40%;z-index:6;text-align:center;font-size:13vmin;pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s;text-shadow:0 .8vmin 0 #000}
#toast.show{opacity:1;transform:scale(1)}
.scr{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 30%,#1d2b4a,#05070d 75%);padding:max(14px,var(--st)) 16px max(16px,var(--sb));box-sizing:border-box;gap:2vh;overflow:auto}
.scr.show{display:flex}
h1{font-size:min(11vmin,64px);margin:0;color:var(--a);line-height:1;text-align:center;text-shadow:0 .6vmin 0 #000}
h2{margin:0;font-size:min(8vmin,44px);color:var(--a)}
p{font-family:system-ui,sans-serif;font-weight:800;margin:0;font-size:max(15px,3.6vmin);opacity:.9;text-align:center}
.btn{border:0;border-radius:99px;padding:max(14px,2vmin) 7vmin;min-height:56px;background:var(--a);color:#111;font-size:max(22px,5.6vmin);box-shadow:0 1vmin 0 #0008;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:#ffffff22;color:#fff;box-shadow:none;font-size:max(18px,4.2vmin)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.wide{width:min(86vw,420px);box-sizing:border-box}
.col{display:flex;flex-direction:column;gap:max(10px,1.8vh);align-items:center}
#hero-pv{width:min(34vmin,170px);height:min(34vmin,170px)}
#menu .sp{flex:1}
#cards,#lcards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:8px 4px 14px;box-sizing:border-box;flex:0 0 auto;-webkit-overflow-scrolling:touch}
.card{scroll-snap-align:center;flex:0 0 min(46vw,200px);background:#ffffff14;border:3px solid #ffffff33;border-radius:22px;padding:10px 8px 12px;text-align:center;position:relative}
.card canvas{width:100%;aspect-ratio:1;display:block}
.card b{display:block;font-size:max(18px,4vmin);font-weight:400}
.card small{font-family:system-ui,sans-serif;font-weight:800;font-size:max(12px,2.6vmin);opacity:.85}
.card.sel{border-color:var(--a);background:#ffffff26;box-shadow:0 0 0 3px #0008,0 0 22px var(--a)}
.card.locked canvas{filter:grayscale(1) brightness(.55)}
.card.locked b{opacity:.7}
.tag{position:absolute;top:8px;right:8px;border-radius:99px;padding:2px 9px;font-size:max(12px,2.6vmin);background:#000a}
.tag.free{color:#7dff7d}.tag.locked{color:#ccc}
.lock{position:absolute;left:8px;top:8px;font-size:max(18px,4vmin)}
#info{min-height:6vh}
table{border-collapse:collapse;width:min(92vw,460px);font-family:system-ui,sans-serif;font-weight:800;font-size:max(13px,2.8vmin)}
td,th{padding:6px 8px;border-bottom:1px solid #fff2;text-align:left}th{color:var(--a)}td:last-child,th:last-child{text-align:right}
.scroll{overflow:auto;width:100%;display:flex;justify-content:center;flex:1;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style></head>
<body>
<div id="bar"><span id="name"></span><div id="dots"></div><button id="quit">MENU</button></div>
<div id="toast"></div>

<div class="scr show" id="menu">
  <div class="col" style="margin-top:6vh"><h1>KAREN ARCADE (FREE DEMO)</h1><p>Pick a faction. Finish a loop to unlock a new one.</p></div>
  <canvas id="hero-pv" width="340" height="340"></canvas>
  <p id="heroname"></p>
  <div class="col">
    <button class="btn wide" id="play">PLAY</button>
    <button class="btn wide alt" id="heroes">HEROES</button>
    <button class="btn wide alt" id="demo">FREE DEMO (5 GAMES)</button>
    <button class="btn wide alt" id="scores">BEST SCORES</button>
  </div>
</div>

<div class="scr" id="hsel">
  <h2>CHOOSE YOUR HERO</h2>
  <div id="cards"></div>
  <p id="info"></p>
  <div class="col"><button class="btn wide" id="act">PICK</button><button class="btn wide alt" id="back1">BACK</button></div>
</div>

<div class="scr" id="loopscr">
  <h2>LOOP COMPLETE!</h2>
  <p>CHOOSE A HERO TO UNLOCK</p>
  <div id="lcards"></div>
  <p id="linfo"></p>
  <div class="col"><button class="btn wide" id="lact">UNLOCK</button><button class="btn wide alt" id="luse" style="display:none">USE NOW</button><button class="btn wide alt" id="lgo" style="display:none">KEEP PLAYING</button></div>
</div>

<div class="scr" id="scorescr">
  <h2>BEST SCORES</h2>
  <p>Heroes unlocked: <span id="unlockedn">0</span> / 20</p>
  <div class="scroll"><table id="tbl"></table></div>
  <button class="btn wide alt" id="back3">BACK</button>
</div>

<div class="scr" id="upsell">
  <div class="col" style="margin:auto"><h1>LOVED IT?</h1><p id="upmsg"></p>
  <a class="btn wide" id="buy" href="#" target="_blank" rel="noopener">GET THE FULL ARCADE</a>
  <button class="btn wide alt" id="again">PLAY THE FREE 5 AGAIN</button>
  <button class="btn wide alt" id="back4">MENU</button></div>
</div>

<script type="module">
import { CHAR, drawChar } from '../_vendor/gpsprites.js';
const CFG = {"id":"karen-arcade-demo","games":["karen-one-tap-reflex","karen-precision-platformer","karen-bullet-heaven","karen-obby-gauntlet","karen-rail-runner","karen-grid-chaser","karen-arena-brawler","karen-scrolling-shmup","karen-run-and-gun","karen-mini-metroidvania","karen-footsies-duel","karen-kart-racer","karen-slice-swipe","karen-stack-timing","karen-ragdoll-launch","karen-daily-deduction","karen-cozy-farm","karen-ballistic-bouncer","karen-falling-blocks","karen-merge-sandbox","karen-mini-zelda","karen-turn-based-3v3","karen-micro-tower-defense","karen-card-roguelite","karen-idle-tycoon","karen-hide-and-seek","karen-trajectory-artillery","karen-plinko-drop","karen-sort-puzzle","karen-rope-cut"],"fullGames":30,"demoGames":["karen-slice-swipe","karen-one-tap-reflex","karen-ballistic-bouncer","karen-bullet-heaven","karen-kart-racer"],"names":{"karen-one-tap-reflex":"FLAP KAREN","karen-precision-platformer":"KAREN DASH","karen-bullet-heaven":"KAREN SURVIVORS","karen-obby-gauntlet":"KAREN OBBY","karen-rail-runner":"SUBWAY KAREN","karen-grid-chaser":"PAC KAREN","karen-arena-brawler":"ZOMBIE BRAWL","karen-scrolling-shmup":"KAREN FIGHTER","karen-run-and-gun":"CONTRA KAREN","karen-mini-metroidvania":"KAREN CAVE","karen-footsies-duel":"KAREN DUEL","karen-kart-racer":"KAREN KART","karen-slice-swipe":"COUPON SLICER","karen-stack-timing":"KAREN STACK","karen-ragdoll-launch":"KAREN CANNON","karen-daily-deduction":"WORD KAREN","karen-cozy-farm":"COZY KAREN FARM","karen-ballistic-bouncer":"LAWN BOUNCER","karen-falling-blocks":"BLOCK KARENS","karen-merge-sandbox":"MERGE PETS","karen-mini-zelda":"KAREN DUNGEON","karen-turn-based-3v3":"PET BATTLE","karen-micro-tower-defense":"KAREN DEFENSE","karen-card-roguelite":"CARD KARENS","karen-idle-tycoon":"KAREN FACTORY","karen-hide-and-seek":"PROP KAREN","karen-trajectory-artillery":"KAREN ARTILLERY","karen-plinko-drop":"KAREN PLINKO","karen-sort-puzzle":"KAREN SORT","karen-rope-cut":"KAREN ROPE"},"base":"../","demo":true,"buyUrl":"","world":"","heroes":[{"id":"karens","name":"The Karen","kind":"cast:karen:karens","color":"#c96fb0","tier":"free","blurb":"The manager is on line two."},{"id":"hoaDads","name":"HOA Dad","kind":"cast:karen:hoaDads","color":"#6a7f95","tier":"free","blurb":"Your grass is 2.8 inches too tall."},{"id":"fratHouse","name":"Frat Bro","kind":"cast:karen:fratHouse","color":"#f2f2f2","tier":"free","blurb":"Bro. Bro. BRO."},{"id":"mlmHuns","name":"MLM Hun","kind":"cast:karen:mlmHuns","color":"#f4b6d2","tier":"locked","blurb":"Girl, this is NOT a pyramid."},{"id":"vcBros","name":"VC Bro","kind":"cast:karen:vcBros","color":"#3b4a63","tier":"locked","blurb":"Disrupting your lawn."},{"id":"wokeLibs","name":"Woke Lib","kind":"cast:karen:wokeLibs","color":"#7ac27a","tier":"locked","blurb":"Actually, it's problematic."},{"id":"tradwives","name":"Tradwife","kind":"cast:karen:tradwives","color":"#e8d5b5","tier":"locked","blurb":"Sourdough first."},{"id":"pickleballRetirees","name":"Pickleball Retiree","kind":"cast:karen:pickleballRetirees","color":"#9bd16a","tier":"locked","blurb":"Kitchen violation!"},{"id":"valleyGirls","name":"Valley Girl","kind":"cast:karen:valleyGirls","color":"#f29ac2","tier":"locked","blurb":"Like, literally."},{"id":"brainRot","name":"Brain Rot","kind":"cast:karen:brainRot","color":"#4f8f84","tier":"locked","blurb":"Skibidi what?"},{"id":"rednecks","name":"Redneck","kind":"cast:karen:rednecks","color":"#b5651d","tier":"locked","blurb":"Hold my beer."},{"id":"gymRats","name":"Gym Rat","kind":"cast:karen:gymRats","color":"#d9534f","tier":"locked","blurb":"Never skip leg day."},{"id":"cloutStreamers","name":"Clout Streamer","kind":"cast:karen:cloutStreamers","color":"#8e5be8","tier":"locked","blurb":"Smash that subscribe."},{"id":"oldMoney","name":"Old Money","kind":"cast:karen:oldMoney","color":"#c9b26b","tier":"locked","blurb":"One simply doesn't."},{"id":"trumpers","name":"Trumper","kind":"cast:karen:trumpers","color":"#d94a3d","tier":"locked","blurb":"Tremendous lawn."},{"id":"furries","name":"Furry","kind":"cast:karen:furries","color":"#ffa24c","tier":"locked","blurb":"Owo what's this."},{"id":"animeWeebs","name":"Anime Weeb","kind":"cast:karen:animeWeebs","color":"#ff6fa8","tier":"locked","blurb":"Believe it!"},{"id":"emoKids","name":"Emo Kid","kind":"cast:karen:emoKids","color":"#3a2f4a","tier":"locked","blurb":"Nobody understands."},{"id":"theGays","name":"The Fabulous","kind":"cast:karen:theGays","color":"#ff7fd1","tier":"locked","blurb":"Slay the lawn."},{"id":"theaterKids","name":"Theater Kid","kind":"cast:karen:theaterKids","color":"#ffd34d","tier":"locked","blurb":"Places, everyone!"}],"cast":"karen"};
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const KEY = CFG.cast ? 'gp-hub-' + CFG.cast : 'gp-hub', HEROES = CFG.heroes, byId = Object.fromEntries(HEROES.map(h => [h.id, h]));
const LOOPQ = Q.get('loop') === '1'; // test flag: a "loop" is only the first 2 games

// ---------------------------------------------------------------- save
// Heroes with tier 'free' are available from the start; the rest unlock one per completed loop of the full hub (never in demo).
const blank = () => ({ hero: CFG.heroes[0].id, unlocked: [], best: {}, won: {} });
let S; try { S = { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { S = blank(); }
if (!Array.isArray(S.unlocked)) S.unlocked = [];
S.unlocked = S.unlocked.filter(id => byId[id]);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ hero: S.hero, unlocked: S.unlocked, best: S.best, won: S.won })); } catch {} };
const owned = h => h.tier === 'free' || S.unlocked.includes(h.id);
let demoMode = CFG.demo;
const usable = h => demoMode ? h.tier === 'free' : owned(h);
const heroNow = () => { const h = byId[S.hero]; return h && usable(h) ? h : HEROES[0]; };
if (!byId[S.hero] || !owned(byId[S.hero])) S.hero = HEROES[0].id;
const lockedList = () => HEROES.filter(h => !owned(h));

// ---------------------------------------------------------------- screens
const screens = ['menu', 'hsel', 'loopscr', 'scorescr', 'upsell'];
let screen = 'menu';
function go(name) {
  screens.forEach(s => $(s).classList.toggle('show', s === name));
  document.body.classList.toggle('playing', name === 'game'); screen = name;
  if (name === 'menu') paintMenu(); if (name === 'hsel') paintCards(); if (name === 'scorescr') paintScores();
}
const toast = (t, col, ms = 1100) => { const e = $('toast'); e.textContent = t; e.style.color = col; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), ms); };
const say = (el, t) => { $(el).textContent = t; };

// ---------------------------------------------------------------- sprites
function draw(cv, h, t) {
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  try { drawChar(h.kind, c, cv.width / 2, cv.width * .92, cv.width * .78, { color: h.color, t, anim: 'walk', dir: 1 }); } catch {}
}
const T0 = performance.now();
function tick(now) {
  const t = (now - T0) / 1000;
  if (screen === 'menu') draw($('hero-pv'), heroNow());
  else if (screen === 'hsel' || screen === 'loopscr') document.querySelectorAll('.card canvas').forEach(cv => draw(cv, byId[cv.dataset.id], t));
  requestAnimationFrame(tick);
}
function paintMenu() { say('heroname', heroNow().name + ' is ready'); $('demo').style.display = CFG.demo ? 'none' : ''; $('play').textContent = CFG.demo ? 'PLAY FREE 5' : 'PLAY'; }
function card(h, tag, cls, onclick) {
  const d = document.createElement('div'); d.className = 'card ' + cls; d.dataset.id = h.id; d.tabIndex = 0;
  d.innerHTML = `<span class="tag ${tag[1]}">${tag[0]}</span>${cls.includes('locked') ? '<span class="lock">&#128274;</span>' : ''}<canvas width="240" height="240" data-id="${h.id}"></canvas><b>${h.name}</b><small>${h.id === S.hero && !cls.includes('locked') ? 'SELECTED' : ''}</small>`;
  d.onclick = onclick; return d;
}

// ---------------------------------------------------------------- hero select
let pick = S.hero;
const lockTextNow = () => (demoMode ? 'Full game only' : 'Complete a loop to unlock');
function paintCards() {
  const box = $('cards'); box.innerHTML = '';
  HEROES.forEach(h => {
    const ok = usable(h);
    box.appendChild(card(h, ok ? [h.tier === 'free' ? 'FREE' : 'UNLOCKED', 'free'] : ['LOCKED', 'locked'], (ok ? '' : 'locked ') + (h.id === pick ? 'sel' : ''), () => { pick = h.id; paintCards(); }));
  });
  const h = byId[pick], ok = usable(h), a = $('act');
  say('info', ok ? h.blurb : lockTextNow());
  a.textContent = !ok ? 'LOCKED' : h.id === S.hero ? 'SELECTED' : 'PICK ' + h.name.toUpperCase(); a.disabled = !ok || h.id === S.hero;
  document.querySelector('#cards .sel')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function act() { const h = byId[pick]; if (!usable(h)) return; S.hero = h.id; save(); paintCards(); toast('PICKED!', '#7dff7d', 700); }

// ---------------------------------------------------------------- scores
function paintScores() {
  say('unlockedn', HEROES.filter(owned).length);
  $('tbl').innerHTML = '<tr><th>Game</th><th>Best</th></tr>' + CFG.games.map(g => `<tr><td>${CFG.names[g] || g}${S.won[g] ? ' &#9733;' : ''}</td><td>${S.best[g] ?? '-'}</td></tr>`).join('');
}

// ---------------------------------------------------------------- rotation engine (same as templates/packs/pack.html)
let games = CFG.games, N = games.length;
const CAP = 45000, GAP = 1300, a = Math.floor(Math.random() * 1e6);
let idx = -1, loop = 0, cur = 0, timer = 0, locked = true, results = [];
const frames = [document.createElement('iframe'), document.createElement('iframe')];
frames.forEach(f => { f.className = 'off'; f.allow = 'autoplay; fullscreen; gamepad'; document.body.prepend(f); });
const url = (id, n) => { const h = heroNow(); return `${CFG.base}${id}/index.html?pack=1&hold=1&seed=${(a + n * 7) % 1e6}&hero=${encodeURIComponent(h.kind)}&heroColor=${encodeURIComponent(h.color)}${CFG.world ? '&world=' + encodeURIComponent(CFG.world) : ''}`; };
const dots = $('dots');
function paint() { dots.innerHTML = ''; dots.style.visibility = N > 12 ? 'hidden' : ''; games.forEach((_, i) => { const d = document.createElement('i'); d.className = i === idx ? 'on' : results[i] === true ? 'win' : results[i] === false ? 'lose' : ''; dots.appendChild(d); }); $('name').textContent = idx >= 0 ? `${idx + 1}/${N} ${CFG.names[games[idx]] || games[idx]}` : ''; }
function preload(i) { const f = frames[1 - cur]; f.className = 'off'; f.src = url(games[i % N], i + loop * N); }
let waitStart = null;
let startedAt = 0, again = false; // second turn only for a loss inside 3 s of start, or a score of 0
function show(i, retry) {
  clearTimeout(timer); const f = frames[1 - cur]; frames[cur].className = 'off'; cur = 1 - cur;
  if (!f.src || !f.src.includes('/' + games[i] + '/')) f.src = url(games[i], i + loop * N + (retry ? 500 : 0));
  f.className = ''; idx = i; locked = false; paint(); try { f.contentWindow.focus(); } catch {}
  frames[1 - cur].removeAttribute('src'); setTimeout(() => { if (screen === 'game') preload((i + 1) % N); }, 600);
  locked = true; const my = idx; waitStart = () => { if (screen !== 'game' || idx !== my) return; locked = false; startedAt = performance.now(); try { f.contentWindow.focus(); } catch {} timer = setTimeout(() => next(null), CAP); };
}
function record(g, win, score) { if (win) S.won[g] = true; score = Math.max(0, Math.floor(+score || 0)); if (score > (S.best[g] ?? -1)) S.best[g] = score; save(); }
function next(win, score) {
  if (locked) return; locked = true; clearTimeout(timer);
  if (win === null) again = false;
  if (win !== null) { results[idx] = win; record(games[idx], win, score); const quick = win === false && !again && (performance.now() - startedAt < 3000 || !(+score > 0)); again = quick; const t = $('toast'); t.textContent = win ? 'NICE!' : quick ? 'AGAIN!' : 'TRY NEXT!'; t.style.color = win ? '#7dff7d' : '#ff6b6b'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), GAP - 200); }
  paint();
  setTimeout(() => { if (screen !== 'game') return; if (again) return show(idx, true); const n = idx + 1; if (n >= N) { if (demoMode) { loop++; results = []; show(0); } else finishLoop(); } else show(n); }, GAP);
}
function stop() { clearTimeout(timer); locked = true; idx = -1; frames.forEach(f => { f.className = 'off'; f.removeAttribute('src'); }); }
function resume() { loop++; results = []; go('game'); show(0); }
/** The rotation wrapped from the last game to the first. Demo: upsell, never unlocks. Full hub: choose one locked hero to unlock. */
function finishLoop() {
  stop();
  if (demoMode) { say('upmsg', `That was ${N / 2} of ${CFG.fullGames}. Get the full game to play them all and unlock every hero.`); go('upsell'); return; }
  const left = lockedList();
  if (!left.length) { toast('ALL HEROES UNLOCKED', '#ffd34d', 1600); resume(); return; }
  chosen = null; lpick = left[0].id; go('loopscr'); paintLoop();
}
let chosen = null, lpick = null;
function paintLoop() {
  const box = $('lcards'); box.innerHTML = '';
  (chosen ? [byId[chosen]] : lockedList()).forEach(h => box.appendChild(card(h, chosen ? ['UNLOCKED', 'free'] : ['LOCKED', 'locked'], (chosen ? 'sel' : 'locked ') + (h.id === lpick ? 'sel' : ''), () => { if (!chosen) { lpick = h.id; paintLoop(); } })));
  const h = byId[chosen || lpick];
  say('linfo', chosen ? `${h.name} unlocked for good!` : h.blurb);
  $('lact').style.display = chosen ? 'none' : ''; $('lact').textContent = 'UNLOCK ' + h.name.toUpperCase();
  $('luse').style.display = $('lgo').style.display = chosen ? '' : 'none';
  document.querySelector('#lcards .sel')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function unlockChosen() { if (chosen || !lpick || owned(byId[lpick])) return; chosen = lpick; S.unlocked.push(chosen); save(); paintLoop(); }
function start(demo) {
  again = false; demoMode = demo; games = (demo ? CFG.demoGames : (LOOPQ ? CFG.games.slice(0, 2) : CFG.games)); N = games.length; loop = 0; results = []; idx = -1;
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {}
  go('game'); show(0);
}
addEventListener('message', e => { if (screen === 'game' && e.source === frames[cur].contentWindow && e.data && e.data.gp === 'started') { waitStart?.(); return; } if (screen !== 'game' || e.source !== frames[cur].contentWindow || !e.data || e.data.gp !== 'end') return; next(!!e.data.win, e.data.score); });

// ---------------------------------------------------------------- wiring
$('play').onclick = () => start(CFG.demo);
$('demo').onclick = () => start(true);
$('heroes').onclick = () => { demoMode = CFG.demo; pick = S.hero; go('hsel'); };
$('scores').onclick = () => go('scorescr');
$('act').onclick = act;
$('lact').onclick = unlockChosen;
$('luse').onclick = () => { if (chosen) { S.hero = chosen; save(); } resume(); };
$('lgo').onclick = resume;
['back1', 'back3', 'back4'].forEach(b => $(b).onclick = () => { demoMode = CFG.demo; go('menu'); });
$('quit').onclick = () => { stop(); demoMode = CFG.demo; go('menu'); };
$('again').onclick = () => start(true);
$('buy').href = CFG.buyUrl || '#';
addEventListener('keydown', e => {
  const k = e.key;
  if (screen === 'game') { if (k === 'n' || k === 'N') next(null); else if (k === 'Escape') { stop(); demoMode = CFG.demo; go('menu'); } return; }
  if (screen === 'menu') { if (k === 'Enter' || k === ' ') start(CFG.demo); else if (k === 'h' || k === 'H') $('heroes').click(); }
  else if (screen === 'hsel') {
    const i = HEROES.findIndex(h => h.id === pick);
