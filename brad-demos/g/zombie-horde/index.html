<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Zombie Horde</title></head><body>
<script type="module">
// Zombie Horde: steer a growing zombie mob (A/D or drag) through math gates, then overwhelm the GIANT CAT boss. One instanced zombie mesh;
// only the first 700 are drawn, the counter shows the real number. Gate side is chosen by where the crowd centre is when it crosses.
import { createStage, instances, sfx, rand, clamp, THREE } from '../_vendor/gp3d.js';
import { toon, zombieGeo, catGeo, crowd, hero, particles, sky, groundTex } from '../_vendor/gpkit.js';
const st = createStage({ bg: 0x8fd3ff, fitWidth: 9.5, fov: 55, fog: [40, 110] }); st.light(); sky(st.scene, 0x3f8cff, 0xffe7b8, [50, 150]);
const TRACK = 190, MAXDRAW = 700;
const road = new THREE.Mesh(new THREE.PlaneGeometry(10, TRACK + 60), toon(0xffffff, { map: groundTex('asphalt', 10) })); road.rotation.x = -Math.PI / 2; road.position.z = TRACK / 2; st.scene.add(road);
const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, TRACK + 200), toon(0xffffff, { map: groundTex('grass', 60) })); grass.rotation.x = -Math.PI / 2; grass.position.set(0, -.02, TRACK / 2); st.scene.add(grass);
const OPS = [['+20', n => n + 20, 1], ['×2', n => n * 2, 1], ['-15', n => Math.max(1, n - 15), 0], ['×3', n => n * 3, 1], ['+50', n => n + 50, 1], ['×2', n => n * 2, 1], ['-30', n => Math.max(1, n - 30), 0], ['×4', n => n * 4, 1]];
const lab = (t, good) => { const cv = document.createElement('canvas'); cv.width = 256; cv.height = 192; const g = cv.getContext('2d'); g.fillStyle = good ? 'rgba(46,160,255,.7)' : 'rgba(255,70,70,.7)'; g.fillRect(0, 0, 256, 192); g.font = '900 120px Impact,Arial Black'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 10; g.strokeText(t, 128, 140); g.fillText(t, 128, 140); return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, side: THREE.DoubleSide }); };
const gates = []; for (let i = 0; i < 6; i++) { const z = 22 + i * 24, a = OPS[(i * 2) % 8], b = OPS[(i * 2 + 1) % 8], pair = [a, b]; if (i % 2) pair.reverse();
  pair.forEach((op, s) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 3.4), lab(op[0], op[2])); m.position.set(s ? 2.5 : -2.5, 1.9, z); m.rotation.y = Math.PI; st.scene.add(m); }); gates.push({ z, ops: pair, used: false }); }
const castle = hero(catGeo(), 0xff9a3c, .025); castle.scale.setScalar(10); castle.rotation.y = Math.PI; castle.position.set(0, 0, TRACK + 2); st.scene.add(castle);
const men = crowd(st.scene, zombieGeo(), MAXDRAW), foes = crowd(st.scene, catGeo(), 120), fx = particles(st.scene, 300);
for (let i = 0; i < MAXDRAW; i++) men.color(i, [0x7fbf6a, 0x8fcf7a, 0x6aa85a][i % 3]); for (let i = 0; i < 120; i++) foes.color(i, [0xff9a3c, 0x9aa0aa, 0xf4efe4][i % 3]);
const AUTO = new URLSearchParams(location.search).has('auto');
let n = 5, cx = 0, cz = 0, bossHP = 900, bossMax = 900, fight = false, won = false, lost = false, parts = [], foeN = 0, fallT = 0;
const CG = f => { try { window.CrazyGames?.SDK?.game?.[f]?.(); } catch (e) {} };
let best = 0, endT = 0; try { best = +localStorage.getItem('zh-best') || 0; } catch (e) {}
// gate frames: two posts and a glowing bar make each gate read as a real obstacle
for (const g of gates) { const c = g.ops[0][2] && g.ops[1][2] ? 0x2ea0ff : 0xffb020; for (const x of [-5, 0, 5]) { const m = new THREE.Mesh(new THREE.BoxGeometry(.35, 3.8, .35), toon(0xdddddd)); m.position.set(x, 1.9, g.z); st.scene.add(m); } const b = new THREE.Mesh(new THREE.BoxGeometry(10.2, .35, .35), new THREE.MeshBasicMaterial({ color: c })); b.position.set(0, 3.8, g.z); st.scene.add(b); }
function reset() { n = 5; cx = 0; cz = 0; bossHP = bossMax; fight = won = lost = false; fallT = 0; foeN = 0; parts = []; endT = 0; gates.forEach(g => g.used = false); castle.rotation.z = 0; castle.position.y = 0; st.hud.banner('GO!', .8); CG('gameplayStart'); }
CG('gameplayStart');
function update(dt) {
  if (!fight && !won && !lost) {
    const k = st.keys, mv = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0); if (AUTO) { const g = gates.find(g => !g.used && g.z - cz < 14), want = g ? (g.ops[1][1](n) > g.ops[0][1](n) ? 2.4 : -2.4) : 0; cx += clamp(want - cx, -7 * dt, 7 * dt); } else if (mv) cx += mv * 7 * dt; else if (st.ptr.down) cx += (st.ptr.x * 3.8 - cx) * Math.min(1, dt * 9); cx = clamp(cx, -3.6, 3.6); cz += (9 + Math.min(4, n / 80)) * dt;
    for (const g of gates) if (!g.used && cz >= g.z) { g.used = true; const op = g.ops[cx < 0 ? 0 : 1], before = n; n = Math.round(op[1](n)); sfx(op[2] ? 'ding' : 'crash'); st.hud.banner(op[0], .7); st.shake(op[2] ? 2 : 4); }
    if (cz >= TRACK - 16) { fight = true; foeN = 120; st.hud.banner('BOSS!', 1.2); sfx('boom'); }
  } else if (fight) {
    cz += (TRACK - 9 - cz) * Math.min(1, dt * 2); cx += (0 - cx) * Math.min(1, dt * 3); const dmg = n * .9 * dt, back = (bossMax * .5 + 80) * dt * (bossHP / bossMax + .2);
    bossHP -= dmg; n -= back; foeN = Math.ceil(120 * Math.max(0, bossHP) / bossMax); if (Math.random() < .3) sfx('tick', .3); st.shake(2);
    if (bossHP <= 0) { fight = false; won = true; st.hud.banner('CASTLE DOWN!', 3); sfx('boom'); st.shake(14); sfx('win'); for (let i = 0; i < 60; i++) parts.push({ x: rand(-4, 4), y: rand(1, 12), z: TRACK + rand(-2, 2), vx: rand(-4, 4), vy: rand(2, 9), vz: rand(-3, 6) }); }
    else if (n <= 0) { n = 0; fight = false; lost = true; st.hud.banner('CRUSHED', 3); }
  }
  if (won) { fallT += dt; castle.rotation.z = Math.min(1.45, fallT * 1.1); castle.position.y = -fallT * .5; if (fallT < 1.5 && Math.random() < .5) fx.burst(3, { x: rand(-4, 4), y: 1, z: TRACK, size: .5, life: .8, color: 0xe8dcc0, g: 2 }, 4); }
  if (won || lost) { if (!endT) { CG('gameplayStop'); if (n > best) { best = Math.round(n); try { localStorage.setItem('zh-best', best); } catch (e) {} } } endT += dt; if (!AUTO && endT > 1.2 && (st.keys.r || st.keys.enter || st.ptr.down)) reset(); }
  fx.update(dt); for (const p of parts) { p.vy -= 14 * dt; p.x += p.vx * dt; p.y = Math.max(.1, p.y + p.vy * dt); p.z += p.vz * dt; }
  st.hud.left(`CROWD<br><span style="color:#ffd34d;font-size:8vmin">${Math.max(0, Math.round(n)).toLocaleString()}</span>`); st.hud.right(fight || won ? `BOSS<br>${Math.max(0, Math.round(bossHP))}<br>BEST ${best}` : `GATES ${gates.filter(g => g.used).length}/${gates.length}`); st.hud.hint(won || lost ? (endT > 1.2 ? 'TAP or R to play again' : '') : 'A/D or drag: steer');
  window.__game = { crowd: Math.round(n), boss: Math.round(bossHP), z: Math.round(cz), won, lost };
}
function pre() {
  const cnt = Math.min(MAXDRAW, Math.max(0, Math.round(n))); const sp = 0.3, t = st.t;
  for (let i = 0; i < cnt; i++) { const r = sp * 1.5 * Math.sqrt(i + .5), a = i * 2.39996, bob = Math.abs(Math.sin(t * 9 + i * 1.7)) * .14 * (won || lost ? 0 : 1); men.set(i, cx + Math.cos(a) * r, bob, cz + Math.sin(a) * r, .5, Math.sin(t * 3 + i) * .15, .12); }
  men.done(cnt);
  for (let i = 0; i < foeN; i++) { const a = i * 2.39996, r = .45 * Math.sqrt(i + .5); foes.set(i, Math.cos(a) * r * 1.6, Math.abs(Math.sin(t * 8 + i)) * .2, TRACK - 4 + Math.sin(a) * r, .55, Math.PI); } foes.done(foeN);
  const R = Math.max(5, Math.sqrt(cnt) * .26); st.camera.position.set(cx * .3, 6.5 + R * .6, cz - 9.5 - R * .8); st.camera.lookAt(cx * .3, 1.4, cz + 7);
}
st.run(update, pre);
</script></body></html>
