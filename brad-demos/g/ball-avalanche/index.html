<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ball Avalanche</title></head><body>
<script type="module">
// Ball Avalanche: drop a trickle of balls through multiplier gates until the board floods. A/D or drag moves the dropper.
// 24,000 balls are one InstancedMesh; pegs are a lattice, so collision is O(1) per ball (no physics engine needed).
import { createStage, instances, sfx, rand, clamp, THREE } from '../_vendor/gp3d.js';
const st = createStage({ bg: 0x0a0e1f, fitWidth: 11.4 }); st.light();
const CAP = 24000, W = 5.4, BR = 0.1, PR = 0.17, DX = 1.05, DY = 1.15, Y0 = 3, BOARD = 46, G = 22;
const X = new Float32Array(CAP), Y = new Float32Array(CAP), VX = new Float32Array(CAP), VY = new Float32Array(CAP), HUE = new Float32Array(CAP);
let n = 0, saved = 0, lx = 0, emitAcc = 0, camY = 0, popCd = 0, mile = 0;
const GATES = [
  { y: -8, ops: [['x2', -W, 0], ['+50', 0, W]] }, { y: -14, ops: [['x3', -W, -1.8], ['x2', -1.8, 1.8], ['x3', 1.8, W]] },
  { y: -20, ops: [['+100', -W, -1.8], ['x5', -1.8, 1.8], ['+100', 1.8, W]] }, { y: -26, ops: [['x2', -W, -W / 3], ['x4', -W / 3, W / 3], ['x2', W / 3, W]] },
  { y: -32, ops: [['x10', -1.2, 1.2], ['x3', -W, -1.2], ['x3', 1.2, W]] }, { y: -38, ops: [['x2', -W, 0], ['x2', 0, W]] },
];
const lab = (t, c) => { const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128; const g = cv.getContext('2d'); g.font = '900 96px Impact,Arial Black,sans-serif'; g.textAlign = 'center'; g.lineWidth = 12; g.strokeStyle = '#000'; g.strokeText(t, 128, 98); g.fillStyle = c; g.fillText(t, 128, 98); const tx = new THREE.CanvasTexture(cv); return new THREE.MeshBasicMaterial({ map: tx, transparent: true }); };
for (const gt of GATES) for (const [t, a, b] of gt.ops) {
  const good = t[0] === 'x' ? +t.slice(1) >= 3 : +t.slice(1) >= 100, col = good ? 0x39d98a : 0x4aa8ff;
  const box = new THREE.Mesh(new THREE.BoxGeometry(b - a - 0.08, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.28 })); box.position.set((a + b) / 2, gt.y, 0); st.scene.add(box);
  const tag = new THREE.Mesh(new THREE.PlaneGeometry(1.5, .75), lab(t.replace('x', '×'), good ? '#9bffc8' : '#bfe0ff')); tag.position.set((a + b) / 2, gt.y + 0.65, 0.4); st.scene.add(tag);
}
const wall = new THREE.MeshStandardMaterial({ color: 0x1b2447, roughness: .8 });
for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.BoxGeometry(.4, BOARD + 10, 1.2), wall); w.position.set(s * (W + .2), -BOARD / 2 + 4, 0); st.scene.add(w); }
const back = new THREE.Mesh(new THREE.PlaneGeometry(W * 2 + .4, BOARD + 10), new THREE.MeshStandardMaterial({ color: 0x121933 })); back.position.set(0, -BOARD / 2 + 4, -.6); st.scene.add(back);
// pegs (visual only: collision is computed from the lattice)
const pegRows = Math.floor(BOARD / DY), pegPos = [];
const isGateRow = y => GATES.some(g => Math.abs(g.y - y) < 0.95);
for (let r = 0; r < pegRows; r++) { const py = -(Y0 + r * DY); if (isGateRow(py)) continue; const off = r & 1 ? .5 : 0; for (let k = -6; k <= 6; k++) { const px = (k + off) * DX; if (Math.abs(px) < W - .1) pegPos.push([px, py]); } }
const pegs = instances(new THREE.CylinderGeometry(PR, PR, .6, 10), new THREE.MeshStandardMaterial({ color: 0xcfd8ff, roughness: .4 }), pegPos.length, { dynamic: false });
pegPos.forEach(([x, y], i) => pegs.set(i, x, y, 0, 1, 1, 1, Math.PI / 2, 0, 0)); pegs.done(); st.scene.add(pegs.mesh);
const balls = instances(new THREE.SphereGeometry(BR, 8, 6), new THREE.MeshStandardMaterial({ roughness: .35, metalness: .1 }), CAP);
st.scene.add(balls.mesh);
const dropper = new THREE.Mesh(new THREE.ConeGeometry(.3, .6, 12), new THREE.MeshStandardMaterial({ color: 0xffd34d })); dropper.rotation.x = Math.PI; st.scene.add(dropper);

function spawn(x, y, vx, vy, h) { if (n >= CAP) return; X[n] = x; Y[n] = y; VX[n] = vx; VY[n] = vy; HUE[n] = h; n++; }
function applyGate(i, gt, op) {
  const k = op[0] === 'x' ? +op.slice(1) - 1 : +op.slice(1);
  for (let c = 0; c < k && n < CAP; c++) spawn(X[i] + rand(-.12, .12), gt.y - .1, VX[i] + rand(-.8, .8), VY[i] * rand(.5, 1), (HUE[i] + rand(-.05, .05) + 1) % 1);
  if (popCd <= 0) { sfx('pop', .5); popCd = .09; } st.shake(Math.min(5, Math.log10(n + 10)));
}
function update(dt) {
  popCd -= dt;
  const mv = (st.keys.d || st.keys.arrowright ? 1 : 0) - (st.keys.a || st.keys.arrowleft ? 1 : 0);
  if (mv) lx = clamp(lx + mv * 6 * dt, -W + .5, W - .5); else if (st.ptr.down) lx = clamp(st.ptr.x * (W + 1), -W + .5, W - .5);
  emitAcc += dt * 5; while (emitAcc >= 1) { emitAcc -= 1; spawn(lx + rand(-.15, .15), 1, rand(-.4, .4), 0, rand()); }
  for (let i = 0; i < n; i++) {
    const py = Y[i]; VY[i] -= G * dt; X[i] += VX[i] * dt; Y[i] += VY[i] * dt;
    if (X[i] < -W + BR) { X[i] = -W + BR; VX[i] = Math.abs(VX[i]) * .6; } else if (X[i] > W - BR) { X[i] = W - BR; VX[i] = -Math.abs(VX[i]) * .6; }
    const r = Math.round((-Y[i] - Y0) / DY);
    for (let rr = r - 1; rr <= r + 1; rr++) { if (rr < 0 || rr >= pegRows) continue; const cy = -(Y0 + rr * DY); if (isGateRow(cy)) continue; const off = rr & 1 ? .5 : 0, k0 = Math.floor(X[i] / DX - off);
      for (let k = k0; k <= k0 + 1; k++) { const cx = (k + off) * DX; if (Math.abs(cx) >= W - .1) continue; const dx = X[i] - cx, dy = Y[i] - cy, d2 = dx * dx + dy * dy, R = PR + BR;
        if (d2 < R * R && d2 > 1e-6) { const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, vn = VX[i] * nx + VY[i] * ny; X[i] = cx + nx * R; Y[i] = cy + ny * R; if (vn < 0) { VX[i] -= 1.55 * vn * nx; VY[i] -= 1.55 * vn * ny; VX[i] += rand(-.15, .15); } } } }
    for (const gt of GATES) if (py > gt.y && Y[i] <= gt.y) for (const [t, a, b] of gt.ops) if (X[i] >= a && X[i] < b) { applyGate(i, gt, t); break; }
    if (Y[i] < -BOARD - 2) { saved++; n--; X[i] = X[n]; Y[i] = Y[n]; VX[i] = VX[n]; VY[i] = VY[n]; HUE[i] = HUE[n]; i--; }
  }
  const marks = [1000, 5000, 10000, 20000]; while (mile < marks.length && n + saved >= marks[mile]) { st.hud.banner(marks[mile].toLocaleString() + ' BALLS!'); sfx('boom'); st.shake(9); mile++; }
  st.hud.left(`BALLS<br><span style="color:#ffd34d;font-size:8vmin">${n.toLocaleString()}</span>`); st.hud.right(`SAVED<br>${saved.toLocaleString()}`);
  let sy = 0, c = 0; for (let i = 0; i < n; i += 37) { sy += Y[i]; c++; } const target = c ? Math.max(-BOARD + 8, sy / c + 2) : 0; camY += (Math.min(0, target) - camY) * Math.min(1, dt * 2.5);
  window.__game = { balls: n, saved, total: n + saved };
}
function pre() {
  for (let i = 0; i < n; i++) { balls.set(i, X[i], Y[i], (i % 7) * .08 - .25, 1); balls.hsl(i, HUE[i], .85, .58); }
  balls.mesh.count = n; balls.done(); dropper.position.set(lx, 1.5, 0);
  st.camera.position.set(0, camY - 1, st.dist + 1.5); st.camera.lookAt(0, camY - 1, 0);
}
st.hud.hint('A/D or drag to aim the dropper'); st.run(update, pre);
</script></body></html>
