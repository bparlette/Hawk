<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAT DUNGEON</title></head><body>
<script type="module">
/*RECIPE mini-zelda. TWO rooms, ONE goal: clear the zombies, take the key, open the door, reach the stairs. 3-SECOND RULE: cat with a sword = player, green zombies = enemy, goal = key, door, stairs.

import { createGame, sfx, comboPitch, R, rnd, clamp, dist } from '../_vendor/gp2d.js';

const S = { title: 'CAT DUNGEON', sub: 'Drag to move. Tap to slash.', hook: 'Get the key. Open the door.', hero: 'cat', heroColor: '#ff9a3c', foe: 'zombie', bg: '#1b1626', floor: '#4a3f5e', wall: '#2c2540', style: 'toon', /*SPEC*/ ...{"hook":"Get the key. Open the door."} /*END*/ };
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: S.bg, style: S.style });

const ROOMS = [ ['############', '#..........#', '#..........#', '#..........#', '#....##....#', '#....##....#', '#..........#', '#..........#', '#..........#', '#..........#', '#..........#', '#..........#', '############'], ['############', '#..........#', '#..........#', '#..##..##..#', '#..........#', '#..........#', '#..##..##..#', '#..........#', '#..........#', '#..........#', '#..........#', '#..........#', '############'] ];
let room, p, en, key, hasKey, doorOpen, swing, botT, wander, items;
const solidAt = (x, y) => { const tx = Math.floor(x / T), ty = Math.floor(y / T), c = ROOMS[room][ty]?.[tx]; if (y < 0) return false; if ((tx === 5 || tx === 6) && ty === 0) return !doorOpen; return c === '#' || c === undefined; };
function load(r) { room = r; en = []; const n = r === 3 ? 4 : r === 2 ? 3 : r === 1 ? 3 : 2; for (let i = 0; i < n; i++) en.push({ x: 120 + i * 150 + rnd(-20, 20), y: 150 + rnd(0, 120), hp: 2, t: rnd(0, 5), fl: 0, kb: 0, vx: 0, vy: 0, cd: 1, d: 1 }); key = null; doorOpen = (r === 1 || r === 3) ? true : false; hasKey = false; p.x = 270; p.y = 520; }

g.onReset = init; init();
function hurt(e) { if (p.inv > 0) return; p.hp--; p.inv = 1.1; sfx('hit'); g.shake(9); g.hitstop(.06); g.flash('#ff3b3b', .25); const a = Math.atan2(p.y - e.y, p.x - e.x); p.kx = Math.cos(a) * 320; p.ky = Math.sin(a) * 320; if (p.hp <= 0) { g.burst(p.x, p.y - 20, 26, { color: [S.heroColor, '#fff'], speed: 380 }); g.end({ win: false, score: g.score, label: 'SCORE' }); } }
function slash() { if (swing > 0 || g.mode !== 'play') return; swing = .22; sfx('whoosh', { vol: .5 }); for (const e of en) if (e.hp > 0 && dist(e, { x: p.x + p.face[0] * 34, y: p.y - 20 + p.face[1] * 34 }) < 62) { e.hp--; e.fl = .15; e.kb = .25; const a = Math.atan2(e.y - p.y, e.x - p.x); e.vx = Math.cos(a) * 340; e.vy = Math.sin(a) * 340; sfx('hit', { pitch: 1 + (2 - e.hp) * .2 }); g.hitstop(.05); g.shake(4); g.burst(e.x, e.y - 30, 8, { color: ['#fff', '#8fcf7a'], speed: 240, size: 7 }); if (e.hp <= 0) { g.score += 100; sfx('boom', { vol: .4 }); g.burst(e.x, e.y - 30, 18, { color: ['#8fcf7a', '#fff', '#ffd34d'], speed: 340 }); g.popup('+100', e.x, e.y - 70, '#ffd34d', 30); if (!en.some(q => q.hp > 0) && (room === 0 || room === 2)) { key = { x: e.x, y: e.y }; sfx('powerup'); g.showBanner('KEY!', .9); } } } }
function move(dx, dy, dt, sp = 170) { const nx = p.x + dx * sp * dt, ny = p.y + dy * sp * dt; if (!solidAt(nx - 14, p.y - 10) && !solidAt(nx + 14, p.y - 10) && !solidAt(nx - 14, p.y + 8) && !solidAt(nx + 14, p.y + 8)) p.x = nx; if (!solidAt(p.x - 14, ny - 10) && !solidAt(p.x + 14, ny - 10) && !solidAt(p.x - 14, ny + 8) && !solidAt(p.x + 14, ny + 8)) p.y = ny; }
function update(dt) {
  if (g.mode !== 'play') return; p.t += dt; p.inv -= dt; swing -= dt; botT -= dt; const ti = TC ? TC.getInput() : null; /* touch: read once per frame */ const SW = ti ? { pressed: ti.aPressed || g.pressed.Space } : g.btn('s', 380, 840, 140, 100, 'SWORD', { key: 'Space' });
  let mx = (g.keys.ArrowRight || g.keys.KeyD ? 1 : 0) - (g.keys.ArrowLeft || g.keys.KeyA ? 1 : 0), my = (g.keys.ArrowDown || g.keys.KeyS ? 1 : 0) - (g.keys.ArrowUp || g.keys.KeyW ? 1 : 0), sw = SW.pressed;
  if (ti) { if (ti.x || ti.y) { mx = ti.x; my = ti.y; } } else if (g.ptr.down && g.ptr.x < 360) { const dx = g.ptr.x - p.x, dy = g.ptr.y - OY - p.y, d = Math.hypot(dx, dy); if (d > 24) { mx = dx / d; my = dy / d; } }
  if (g.auto) { mx = my = 0; if (g.dumb()) { wander.t -= dt; if (wander.t <= 0) { wander.t = .8; wander.a = rnd(0, 6.283); } mx = Math.cos(wander.a); my = Math.sin(wander.a); } else { const tg = en.filter(e => e.hp > 0).sort((a, b) => dist(a, p) - dist(b, p))[0]; let gx, gy; if (tg) { gx = tg.x; gy = tg.y; if (dist(tg, p) < 70 && botT <= 0) { p.face = [Math.sign(tg.x - p.x) || 1, 0]; if (Math.abs(tg.y - p.y) > Math.abs(tg.x - p.x)) p.face = [0, Math.sign(tg.y - p.y)]; sw = true; botT = .3; } } else if (key) { gx = key.x; gy = key.y; } else { gx = room === 0 && p.y > 150 && p.y < 330 && Math.abs(p.x - 270) < 100 ? (p.x < 270 ? 130 : 410) : 270; gy = 4; if (room === 0 && gx !== 270 || room === 0 && p.y > 150 && Math.abs(p.x - 270) > 90 && p.y < 330) { gx = p.x < 270 ? 130 : 410; gy = Math.max(4, p.y - 80); } } const dx = gx - p.x, dy = gy - p.y, d = Math.hypot(dx, dy); if (d > (tg ? 52 : 6)) { mx = dx / d; my = dy / d; } } }
  if (mx || my) { const l = Math.hypot(mx, my) || 1; move(mx / l, my / l, dt); if (Math.abs(mx) > Math.abs(my)) { p.face = [Math.sign(mx), 0]; p.d = Math.sign(mx); } else p.face = [0, Math.sign(my)]; if (mx) p.d = mx > 0 ? 1 : -1; }
  if (p.kx) { p.x += p.kx * dt; p.y += p.ky * dt; p.kx *= .9; p.ky *= .9; if (Math.abs(p.kx) < 5) p.kx = p.ky = 0; } if (sw) slash();
  for (const e of en) { if (e.hp <= 0) continue; e.t += dt; e.fl -= dt; e.cd -= dt; if (e.kb > 0) { e.kb -= dt; e.x += e.vx * dt; e.y += e.vy * dt; continue; } const d = dist(e, p); if (d < 300) { const a = Math.atan2(p.y - e.y, p.x - e.x); e.x += Math.cos(a) * 62 * dt; e.y += Math.sin(a) * 62 * dt; e.d = Math.cos(a) > 0 ? 1 : -1; } if (d < 30 && e.cd <= 0) { e.cd = 1.3; hurt(e); } e.x = clamp(e.x, 60, 480); e.y = clamp(e.y, 70, 560); }
  if (key && dist(key, p) < 30) { key = null; hasKey = true; doorOpen = true; sfx('coin', { pitch: 1.5 }); g.flash('#ffd34d', .4); g.showBanner('DOOR OPEN', .9); g.score += 200; }
  if (p.y < 30 && room === 0 && doorOpen) { load(1); g.showBanner('ROOM 2', .8); sfx('whoosh'); p.y = 500; }
if (p.y < 30 && room === 1 && !en.some(e => e.hp > 0)) { load(2); g.showBanner('ROOM 3', .8); sfx('whoosh'); p.y = 500; }
if (p.y < 30 && room === 2 && doorOpen) { load(3); g.showBanner('BOSS ROOM', 1.0); sfx('boom'); p.y = 500; }
  if (room === 3 && !en.some(e => e.hp > 0) && p.y < 60) { g.score += 1000; g.burst(p.x, p.y, 40, { color: ['#ffd34d', '#fff'], speed: 420 }); g.end({ win: true, score: g.score, label: 'SCORE' }); }
  g.state = { hp: p.hp, room, enemies: en.filter(e => e.hp > 0).length, key: hasKey, x: Math.round(p.x), y: Math.round(p.y) };
}
function draw(c) {

  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) { const t = map[y][x], px = x * T, py = y * T; c.fillStyle = t === '#' ? S.wall : ((x + y) % 2 ? S.floor : '#43385a'); c.fillRect(px, py, T, T); if (t === '#') { c.strokeStyle = 'rgba(255,255,255,.08)'; c.strokeRect(px + 1, py + 1, T - 2, T - 2); } }
  c.fillStyle = doorOpen ? (room === 1 ? '#ffd34d' : '#6b4a2e') : '#7a5a3a'; c.fillRect(5 * T, 0, 2 * T, T); c.strokeStyle = '#000'; c.lineWidth = 4; c.strokeRect(5 * T, 0, 2 * T, T); if (room === 0 || room === 2) g.text(doorOpen ? 'OPEN' : 'LOCKED', 6 * T, 30, { size: 22, align: 'center', stroke: 3 }); else g.text('STAIRS', 6 * T, 30, { size: 22, align: 'center', stroke: 3 });
  if (key) { c.fillStyle = '#ffd34d'; c.beginPath(); c.arc(key.x, key.y - 14 + Math.sin(g.t * 5) * 4, 11, 0, 7); c.fill(); c.fillRect(key.x - 3, key.y - 4 + Math.sin(g.t * 5) * 4, 6, 18); c.strokeStyle = '#000'; c.lineWidth = 3; c.stroke(); }
  for (const e of [...en, p].sort((a, b) => a.y - b.y)) { c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(e.x, e.y + 8, 20, 7, 0, 0, 7); c.fill(); }
  for (const e of en) { c.save(); if (e.hp <= 0) c.globalAlpha = Math.max(0, 1 + e.hp * .001); if (e.hp > 0) { if (S.enemies === 'viral') drawEnemy(foeId(S.foe, 0), c, e.x, e.y + 8, 70, { dir: e.d, t: e.t, flash: e.fl > 0 }); else drawChar(S.foe, c, e.x, e.y + 8, 70, { dir: e.d, t: e.t, anim: 'walk', hurt: e.fl > 0 }); } c.restore(); }
  c.save(); if (p.inv > 0 && Math.floor(g.t * 20) % 2) c.globalAlpha = .4; drawChar(heroKind(S.hero), c, p.x, p.y + 8, 66, { color: heroColor(S.heroColor), dir: p.d, t: p.t, anim: 'walk', hurt: g.mode === 'over' }); c.restore();
  if (swing > 0) { c.strokeStyle = '#fff'; c.lineWidth = 8; c.lineCap = 'round'; const a0 = Math.atan2(p.face[1], p.face[0]), k = 1 - swing / .22; c.beginPath(); c.arc(p.x, p.y - 20, 50, a0 - 1.1 + k * 1.2, a0 - .3 + k * 1.2); c.stroke(); }
  c.restore(); for (let i = 0; i < p.hp; i++) heart(c, 40 + i * 44, 110, 34); { const alive = en.some(e => e.hp > 0), obj = room === 1 ? (alive ? 'DEFEAT THEM ALL' : 'TAKE THE STAIRS!') : doorOpen ? 'GO THROUGH THE DOOR!' : key ? 'GRAB THE KEY!' : 'DEFEAT THE ZOMBIES'; g.text(obj, 270, 150, { size: 30, align: 'center', color: '#fff', stroke: 4 }); } if (hasKey) g.text('KEY', 270, 110, { size: 34, align: 'center', color: '#ffd34d' });
