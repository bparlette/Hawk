<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAT CAVE</title></head><body>
<script type="module">
/*RECIPE mini-metroidvania. THREE rooms, ONE ability: grab the double-jump orb, then climb the ledge that was out of reach. 3-SECOND RULE: orange cat = player, red spikes = enemy, goal = get the orb, then reach the flag.
  DON'T BUILD: a map screen, more than 3 rooms, bosses, menus. Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, rnd, clamp } from '../_vendor/gp2d.js';
import { drawChar, heroKind, heroColor } from '../_vendor/gpsprites.js';
import { drawWorld, drawBackdrop, WORLDS } from '../_vendor/gpworld.js';
import { moveBox } from '../_vendor/gpphys.js';
import { TouchController, isTouchDevice } from '../_vendor/gptouch.js';
const S = { title: 'CAT CAVE', sub: 'Find the double jump', hook: 'Find the double jump', hero: 'cat', heroColor: '#ff9a3c', bg: '#241a3a', rock: '#5a4a7a', moss: '#7a6ab0', style: 'toon', /*SPEC*/ ...{"hook":"Find the double jump"} /*END*/ };
const W = S.world ? WORLDS[S.world] : null; /* optional world skin (docs/WORLDS.md): drawing + bg only */
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: W ? W.bg : S.bg, style: S.style });
const TC = isTouchDevice() ? new TouchController({ buttons: [ { id: 'a', label: '⤒' } ] }) : null; /* TOUCH: floating joystick (left half) + JUMP button (right). See docs/TOUCH.md */
const T = 45, RW = 12, ROWS = 13, OY = 190, COLS = RW * 3;
const room = [
 ['............', '............', '............', '............', '............', '............', '............', '............', '............', '............', '............', '#####..#####', '#####..#####'],
 ['............', '............', '............', '............', '............', '............', '............', '............', '............', '........D...', '...^^..###..', '############', '############'],
 ['............', '............', '............', '............', '............', '............', '........F...', '......######', '......######', '......######', '......######', '############', '############'] ];
const map = Array.from({ length: ROWS }, (_, y) => room.map(r => r[y]).join('').split(''));
for (let y = 0; y < ROWS; y++) map[y][0] = map[y][0] === '.' && y < 11 ? '#' : map[y][0];
const solid = (tx, ty) => tx < 0 || tx >= COLS ? true : ty >= ROWS ? false : map[ty]?.[tx] === '#';
let p, cam, coy, buf, jumps, hasDouble, botT, flash, stage = 1, maxStages = 2;
function init() { stage = 1; resetStage(); }
function resetStage() { p = { x: 70, y: 10 * T - 42, w: 30, h: 42, vx: 0, vy: 0, dir: 1, t: 0, air: false }; cam = 0; coy = 0; buf = 0; jumps = 0; hasDouble = false; botT = 0; g.score = 0; for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (map[y][x] === 'x') map[y][x] = 'D'; }
g.onReset = init; init();
function die() { sfx('hit'); g.hitstop(.1); g.burst(p.x + 15, p.y + 20, 20, { color: [S.heroColor, '#fff'], speed: 340 }); g.end({ win: false, score: g.score, label: 'POINTS' }); }
function update(dt) {
  if (g.mode !== 'play') return; p.t += dt; flash = (flash || 0) - dt;
  const ti = TC ? TC.getInput() : null; /* touch: read once per frame */
  const L = ti ? { held: ti.x < -0.35 } : g.btn('l', 20, 830, 120, 100, '◀', { key: 'ArrowLeft' }), Rb = ti ? { held: ti.x > 0.35 } : g.btn('r', 150, 830, 120, 100, '▶', { key: 'ArrowRight' }), J = ti ? { pressed: ti.aPressed, held: ti.a } : g.btn('j', 380, 830, 140, 100, 'JUMP', { key: 'Space' });
  let mv = (Rb.held || g.keys.KeyD ? 1 : 0) - (L.held || g.keys.KeyA ? 1 : 0), jp = J.pressed || g.pressed.ArrowUp, held = J.held || g.keys.Space;
  if (g.auto) { held = true; mv = 1; g.sim.r = true; const fx = p.x + p.w, fy = Math.floor((p.y + p.h - 2) / T), col = o => Math.floor((fx + o) / T);
    const spike = map[10]?.[col(24)] === '^', lateSpike = map[10]?.[col(4)] === '^', hole = !solid(col(30), fy + 1), wall = solid(col(14), fy), tall = wall && solid(col(14), fy - 2);
    if (!p.air) { if (g.dumb() ? (hole || wall) : (spike || hole || (wall && !(tall && !hasDouble)))) jp = true; }
    if (p.air && hasDouble && jumps === 1 && tall && p.vy > -100) jp = true; }
  p.vx = mv * 240; if (mv) p.dir = mv; coy -= dt; buf -= dt; if (jp) buf = .12;
  if (buf > 0 && coy > 0) { p.vy = -640; buf = 0; coy = 0; jumps = 1; sfx('jump'); g.burst(p.x + 15, p.y + 42, 5, { color: '#fff', speed: 80, size: 6, life: .3 }); }
  else if (buf > 0 && hasDouble && jumps === 1 && p.air) { p.vy = -640; buf = 0; jumps = 2; sfx('jump', { pitch: 1.5 }); g.burst(p.x + 15, p.y + 42, 10, { color: ['#7ad7ff', '#fff'], speed: 160, size: 7, life: .4 }); }
  p.vy += (p.vy < 0 && !held ? 3400 : 1900) * dt; p.vy = Math.min(p.vy, 900); const h = moveBox(p, solid, T, dt); if (h.ground) { coy = .1; if (p.air) sfx('step', { vol: .5 }); p.air = false; jumps = 0; } else p.air = true;
  const cx = Math.floor((p.x + 15) / T), cy = Math.floor((p.y + 24) / T), t = map[cy]?.[cx];
  if (t === 'D') { map[cy][cx] = 'x'; hasDouble = true; g.score += 200; sfx('powerup'); g.flash('#7ad7ff', .6); g.showBanner('DOUBLE JUMP!', 1.4); g.slowmo(.4, .6); g.burst(p.x, p.y, 40, { color: ['#7ad7ff', '#fff'], speed: 460 }); }
  if (map[Math.floor((p.y + p.h - 6) / T)]?.[cx] === '^' || p.y > OY + ROWS * T + 80) die();
  if (t === 'F') { if (stage < maxStages) { stage++; g.score += 500; sfx('win'); g.showBanner('CAVE 2!', 1.2); g.burst(p.x, p.y, 30, { color: ['#7ad7ff', '#fff'], speed: 400 }); resetStage(); } else { g.score += 1000; g.burst(p.x, p.y, 40, { color: ['#ffd34d', '#fff', '#ff6b6b'], speed: 420 }); g.end({ win: true, score: g.score, label: 'POINTS' }); } }
  cam += (Math.floor(p.x / (RW * T)) * RW * T - cam) * Math.min(1, dt * 8); g.state = { x: Math.round(p.x), y: Math.round(p.y), double: hasDouble, room: Math.floor(p.x / (RW * T)) };
}
function draw(c) {
  if (W) drawBackdrop(W, c, 540, 960, cam, g.t);
  c.save(); c.translate(-cam, OY); if (!W) { c.fillStyle = 'rgba(255,255,255,.04)'; for (let i = 0; i < 20; i++) c.fillRect(i * 90 + 20, -40, 40, ROWS * T + 80); }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const t = map[y][x], px = x * T, py = y * T;
    if (W && t === '#') drawWorld(y >= 12 || !solid(x, y - 1) ? W.platform : W.ground, c, px + T / 2, py + T / 2, T, { t: g.t });
    else if (W && t === '^') drawWorld(W.hazard, c, px + T / 2, py + T / 2, T, { t: g.t });
    else if (W && t === 'D') { const b = Math.sin(g.t * 4) * 5; c.fillStyle = 'rgba(122,215,255,.3)'; c.beginPath(); c.arc(px + T / 2, py + T / 2 + b, 26, 0, 7); c.fill(); drawWorld(W.key, c, px + T / 2, py + T / 2 + b, 40, { t: g.t }); }
    else if (t === '#') { c.fillStyle = S.rock; c.fillRect(px, py, T, T); if (!solid(x, y - 1)) { c.fillStyle = S.moss; c.fillRect(px, py, T, 10); } c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 2; c.strokeRect(px + 1, py + 1, T - 2, T - 2); }
    else if (t === '^') { c.fillStyle = '#e63946'; for (let i = 0; i < 2; i++) { c.beginPath(); c.moveTo(px + i * 22, py + T); c.lineTo(px + i * 22 + 11, py + 8); c.lineTo(px + i * 22 + 22, py + T); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 2; c.stroke(); } }
    else if (t === 'D') { const b = Math.sin(g.t * 4) * 5; c.fillStyle = 'rgba(122,215,255,.3)'; c.beginPath(); c.arc(px + T / 2, py + T / 2 + b, 26, 0, 7); c.fill(); c.fillStyle = '#7ad7ff'; c.beginPath(); c.arc(px + T / 2, py + T / 2 + b, 14, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); }
    else if (t === 'F') { c.fillStyle = '#ddd'; c.fillRect(px + 18, py - 60, 6, 105); c.fillStyle = '#ffd34d'; c.beginPath(); c.moveTo(px + 24, py - 60); c.lineTo(px + 70, py - 42 + Math.sin(g.t * 6) * 4); c.lineTo(px + 24, py - 24); c.fill(); } }
  if (hasDouble) { c.fillStyle = 'rgba(122,215,255,.25)'; c.beginPath(); c.arc(p.x + 15, p.y + 24, 34 + Math.sin(g.t * 6) * 3, 0, 7); c.fill(); }
  drawChar(heroKind(S.hero), c, p.x + 15, p.y + 46, 62, { color: heroColor(S.heroColor), dir: p.dir, t: p.t, anim: p.air ? 'idle' : (Math.abs(p.vx) > 1 ? 'walk' : 'idle'), hurt: g.mode === 'over' }); c.restore();
  for (let i = 0; i < 3; i++) { c.fillStyle = Math.floor(p.x / (RW * T)) === i ? '#ffd34d' : '#555'; c.fillRect(200 + i * 44, 100, 36, 12); } g.text(`CAVE ${stage}/${maxStages} · ` + (hasDouble ? 'FLY TO THE FLAG' : 'FIND THE BLUE ORB'), 270, 150, { size: 26, align: 'center', color: hasDouble ? '#7ad7ff' : '#999' });
}
g.run(update, draw);
</script></body></html>
