<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PROP CAT</title></head><body>
<script type="module">
/*RECIPE hide-and-seek. ONE screen, ONE mechanic: hold to sneak toward the exit, release to freeze as a barrel; the hunter spots anything that moves in its cone. 3-SECOND RULE: cat in a barrel = player, zombie hunter and its light cone = enemy, goal = reach the exit.
  DON'T BUILD: multiplayer, more than one map, voice chat, menus. Edit the SPEC JSON (gamepress make).*/
import { createGame, sfx, comboPitch, R, rnd, clamp, dist } from '../_vendor/gp2d.js';
import { drawChar, face } from '../_vendor/gpsprites.js';
const S = { title: 'PROP CAT', sub: 'Hold to move. Release to freeze.', hook: "Don't move when it looks", hero: 'cat', foe: 'zombie', bg: '#3a3550', floor: '#5a5470', speed: 170, style: 'toon', /*SPEC*/ ...{"hook":"Don't move when it looks"} /*END*/ };
const g = createGame({ id: S.title.toLowerCase().replace(/\W+/g, '-'), title: S.title, sub: S.sub, hook: S.hook, bg: S.bg, style: S.style });
let p, h, spot, props, botT, moving, t0;
function init() { p = { x: 270, y: 860, mv: false }; h = { x: 90, y: 520, d: 1, a: 0, wp: 0, t: 0, turn: 0, scan: 0 }; spot = 0; botT = 0; moving = false; t0 = 0; g.score = 0; props = Array.from({ length: 12 }, (_, i) => ({ x: 70 + ((i * 97) % 400), y: 260 + ((i * 151) % 520), r: i % 3 })); }
g.onReset = init; init();
const barrel = (c, x, y, s = 1, col = '#8a5a2e', face_) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(0, 4, 28, 9, 0, 0, 7); c.fill(); c.fillStyle = col; c.beginPath(); c.roundRect(-24, -56, 48, 58, 8); c.fill(); c.lineWidth = 4; c.strokeStyle = '#000'; c.stroke(); c.fillStyle = '#3a2a18'; c.fillRect(-24, -42, 48, 6); c.fillRect(-24, -16, 48, 6); if (face_) { c.fillStyle = '#fff'; c.beginPath(); c.arc(-9, -34, 4, 0, 7); c.arc(9, -34, 4, 0, 7); c.fill(); c.fillStyle = '#111'; c.beginPath(); c.arc(-8, -34, 2, 0, 7); c.arc(10, -34, 2, 0, 7); c.fill(); } c.restore(); };
function caught(why) { sfx('hit'); g.shake(14); g.hitstop(.1); g.flash('#ff3b3b', .4); g.burst(p.x, p.y - 30, 24, { color: ['#8a5a2e', '#ff9a3c', '#fff'], speed: 380 }); g.showBanner(why, 1); g.end({ win: false, score: g.score, label: 'SCORE' }); }
function update(dt) {
  if (g.mode !== 'play') return; t0 += dt; h.t += dt; botT -= dt; const HB = g.btn('h', 170, 830, 200, 100, 'HOLD', { key: 'Space' });
  moving = g.ptr.down || HB.held || g.keys.Space || g.keys.ArrowUp;
  const dh = Math.atan2(p.y - h.y, p.x - h.x), inCone = (() => { const d = dist(h, p); if (d > 330) return false; let da = Math.abs(((dh - h.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI); return da < .55; })();
  if (g.auto) { if (g.dumb()) moving = t0 > 1.2 && p.y > 545; else { const dx = Math.abs(h.x - p.x), behind = (p.x - h.x) * h.d < -30, lane = Math.abs(p.y - 520) < 90;
    if (p.y > 610 && p.y < 760) moving = (behind && dx > 40) || dx > 230; else moving = lane ? true : !inCone; } g.sim.h = moving; }
  p.mv = moving; if (moving) { p.y -= S.speed * dt; p.x += (270 - p.x) * dt * .4; if (Math.floor(t0 * 6) % 2 === 0) sfx('step', { vol: .35 }); }
  h.x += h.d * 70 * dt; h.turn = Math.max(0, h.turn - dt); if (h.x > 450 || h.x < 90) { h.d *= -1; h.turn = 1; } h.a = h.d > 0 ? 0 + Math.sin(t0 * 1.3) * .2 : Math.PI + Math.sin(t0 * 1.3) * .2; h.a += (dh - h.a) * 0; if (Math.abs(p.y - h.y) < 260) h.a = h.d > 0 ? Math.atan2(p.y - h.y, 300) * 1 : Math.PI - Math.atan2(p.y - h.y, 300) * 1;
  if (inCone && p.mv) { spot += dt * 2.2; if (spot > .35 && Math.floor(t0 * 10) % 3 === 0) sfx('tick', { pitch: 1 + spot }); } else spot = Math.max(0, spot - dt * 1.4);
  if (spot >= 1) caught('SPOTTED!'); if (dist(h, p) < 40) caught('FOUND!');
  if (p.y < 190) { g.score = Math.round(300 + (30 - t0) * 10); g.burst(p.x, p.y, 40, { color: ['#7dff7d', '#fff', '#ffd34d'], speed: 440 }); sfx('win'); g.end({ win: true, score: g.score, label: 'SCORE' }); }
  g.hud.l = `${Math.round(Math.max(0, p.y - 190))}m`; g.state = { y: Math.round(p.y), spot: Math.round(spot * 100), hx: Math.round(h.x), moving };
}
function draw(c) {
  c.fillStyle = S.floor; c.fillRect(0, 140, 540, 820); for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.05)'; c.fillRect(0, 140 + i * 70, 540, 70); }
  c.fillStyle = '#2a2640'; c.fillRect(0, 0, 540, 140); c.fillStyle = '#7dff7d'; c.fillRect(190, 120, 160, 28); g.text('EXIT', 270, 143, { size: 24, align: 'center', color: '#0a3a1a', stroke: 0 });
  for (const q of props) barrel(c, q.x, q.y, .95, ['#8a5a2e', '#8a5a2e', '#7a4e28'][q.r]);
  const cone = (x, y, a, r, w) => { const gr = c.createRadialGradient(x, y - 40, 10, x, y - 40, r); gr.addColorStop(0, 'rgba(255,240,140,.5)'); gr.addColorStop(1, 'rgba(255,240,140,0)'); c.fillStyle = gr; c.beginPath(); c.moveTo(x, y - 40); c.arc(x, y - 40, r, a - w, a + w); c.closePath(); c.fill(); }; cone(h.x, h.y, h.a, 340, .55);
  drawChar(S.foe, c, h.x, h.y, 100, { dir: h.d, t: h.t, anim: 'walk', color: undefined });
  if (p.mv) drawChar('cat', c, p.x, p.y, 74, { color: '#ff9a3c', dir: 1, t: t0, anim: 'walk' }); else barrel(c, p.x, p.y, .95, '#8a5a2e', spot > .3);
  if (spot > 0) { g.bar(150, 170, 240, 18, spot, spot > .7 ? '#ff5a5a' : '#ffd34d'); g.text('!', p.x, p.y - 80, { size: 60 + spot * 40, align: 'center', color: '#ff5a5a' }); }
}
g.run(update, draw);
</script></body></html>
