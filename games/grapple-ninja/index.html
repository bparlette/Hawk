<title>Grapple Ninja</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One arcade cabinet column: 256x224 pixel screen on top, NES-style pad below, built for a phone held upright. */
:root{
  --bg:#0d0e13;
  --frame:#c9c5b7;
  --face:#26262a;
  --ink:#17171a;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{
  display:flex;justify-content:center;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  overflow:hidden;
}
/* Fullscreen cabinet: the column IS the viewport — screen full-width on top,
   the pad grows to fill every remaining pixel below it, keys strip last.
   No page margins, no dead background. (Cherie 2026-10-30: theirs fills the screen.) */
.cab{
  width:100%;max-width:calc(100dvh * 0.72);height:100dvh;
  display:flex;flex-direction:column;min-width:0;
}
.screen-wrap{background:#000;line-height:0;flex:0 0 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/224;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  flex:1 1 auto;
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dpad ab" "mid mid";
  grid-template-rows:1fr auto;
  gap:14px 10px;align-items:center;align-content:center;
  background:var(--frame);padding:16px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:clamp(148px, 40vw, 196px);height:clamp(148px, 40vw, 196px);touch-action:none;justify-self:start}
.bar{position:absolute;background:var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px #2d2d33}
.bar.h{left:0;right:0;top:calc(50% - 25px);height:50px}
.bar.v{top:0;bottom:0;left:calc(50% - 25px);width:50px}
.hub{position:absolute;left:calc(50% - 14px);top:calc(50% - 14px);width:28px;height:28px;border-radius:50%;background:#101013}
.ar{position:absolute;background:#55555c}
.ar.u{top:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:center;gap:16px;background:var(--face);border-radius:12px;padding:16px 10px 10px;align-self:stretch}
.ab div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.round{
  width:clamp(64px, 18vw, 88px);height:clamp(64px, 18vw, 88px);border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 16px var(--pixel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 9px var(--pixel);color:#c9c5b7;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;justify-content:center;gap:22px}
.mid button{
  border:0;background:var(--ink);color:#c9c5b7;font:400 10px var(--pixel);
  padding:10px 14px;border-radius:999px;cursor:pointer;touch-action:none;min-width:96px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{flex:0 0 auto;margin:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom, 0px));color:var(--muted);font-size:11px;line-height:1.55;text-align:center;text-wrap:balance}
.keys b{color:var(--text);font-weight:500}
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Grapple Ninja game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, SLASH">B</button><span>SLASH</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, GRAPPLE">A</button><span>GRAPPLE</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> arrows move, hold Z or Space to fire the grapple at a ring ahead and above you and swing, release to launch, X slashes, Enter starts, M mutes.</p>
</main>

<script>
(() => {
'use strict';

const cv = document.getElementById('screen');

const img = ctx.createImageData(VW, VH);

const K=0,W=1,L=2,D=3,GR=4,F=5,R=6,Y=7,B=8,N=9,S=10,T=11,M=12,PU=13,O=14,CY=15,E=16,V=17,PK=18,SKY=19,DG=20,BRK=21;

const PAL32 = HEX.map(h => {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rad = Math.PI / 180;
function hash(x, y) {

  const v = new URLSearchParams(location.search).get('seed'); if (v == null || v === '') return null;

} catch (_) { return null; } })();
let activeSeed = null, vrngS = null;

const vr = () => (vrngS || (vrngS = mkRng(1)))();   /* visual-only randomness (particles, popups): seeded, never gameplay */
function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || x >= VW || y < 0 || y >= VH) return; buf[y * VW + x] = c; }
function rect(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const x0 = Math.max(0, x), x1 = Math.min(VW, x + w), y0 = Math.max(0, y), y1 = Math.min(VH, y + h);

  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], w = row.length;
    for (let c = 0; c < w; c++) {

/* text drawn on the 2d context after the pixel buffer is blitted */
const FONT = s => `${s}px "Press Start 2P", ui-monospace, monospace`;
function txt(s, x, y, col, size, align, shadow) {
  size = size || 8;
  ctx.font = FONT(size); ctx.textBaseline = 'top'; ctx.textAlign = align || 'left';
  if (shadow !== false) { ctx.fillStyle = '#000'; const o = size >= 16 ? 2 : 1; ctx.fillText(s, x + o, y + o); }

const pad5 = n => String(Math.max(0, Math.round(n))).padStart(5, '0');
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;

/* ---------- audio (square-wave chip tune) ---------- */
let AC = null, master = null, muted = false, step16 = 0, nextT = 0;

    master = AC.createGain(); master.gain.value = muted ? 0 : 0.16; master.connect(AC.destination);
    try { const sb = AC.createBuffer(1, 1, 22050), ss = AC.createBufferSource(); ss.buffer = sb; ss.connect(AC.destination); ss.start(0); } catch (_) {}

const SFX = {
  jump:  () => tone(260, 0.14, 'square', 0.25, 420),
  shoot: () => tone(900, 0.06, 'square', 0.18, -500),
  hit:   () => { noise(0.08, 0.3); tone(220, 0.08, 'square', 0.2, -100); },
  boom:  () => { noise(0.35, 0.6); tone(120, 0.4, 'sawtooth', 0.3, -80); },
  coin:  () => { tone(988, 0.06, 'square', 0.22); tone(1319, 0.14, 'square', 0.22, 0, 0.06); },
  hurt:  () => tone(330, 0.3, 'sawtooth', 0.28, -260),
  die:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.14, 'square', 0.28, 0, i * 0.12)),
  power: () => tone(300, 0.4, 'square', 0.25, 900),
  beep:  () => tone(520, 0.12, 'square', 0.3),
  go:    () => tone(1040, 0.35, 'square', 0.3),
  win:   () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.28, 0, i * 0.13)),
  land:  () => { tone(120, 0.1, 'triangle', 0.5, -60); noise(0.06, 0.2); },
  throw: () => tone(500, 0.12, 'square', 0.2, 400),
  catch: () => { tone(700, 0.05, 'square', 0.25); tone(500, 0.08, 'square', 0.2, 0, 0.05); },
  super: () => { tone(200, 0.5, 'sawtooth', 0.3, 1200); noise(0.4, 0.4); },
  flap:  () => tone(420, 0.07, 'triangle', 0.4, 240),
  pop:   () => { noise(0.1, 0.4); tone(700, 0.1, 'square', 0.2, -500); },
  tick:  () => tone(1400, 0.03, 'square', 0.15),
  swing: () => tone(300, 0.18, 'sawtooth', 0.12, 300),
  punch: () => { noise(0.07, 0.4); tone(160, 0.1, 'square', 0.3, -80); },
  clear: () => [523, 659, 784].forEach((f, i) => tone(f, 0.08, 'square', 0.25, 0, i * 0.06)),

const KEYMAP = { ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r', ArrowDown:'d', KeyS:'d', ArrowUp:'u', KeyW:'u',

/* ===== GRAPPLE NINJA: Bionic Commando x Ninja Gaiden. Swing a wire across pits, slash through the gauntlet. ===== */
const LEND = 3300, GRAV5 = 470, RMAX = 138;

function buildLevel() {
  const r = mkRng(runSeed(55, 0));
  plats = [{ x:-64, y:176, w:254 }]; rings = []; foes = []; cps = [{ x:40, y:176 }];
  let x = 190, y = 176, cpNext = 700;
  while (x < LEND) {

    x += gap;

  } else if (mode === 'play') {
    GAME.update(dt, botOn && GAME.bot ? GAME.bot() : raw, 'play');

}

    txt(GAME.t2, 128, 62, WH, GAME.t2.length > 8 ? 16 : 24, 'center');
    txt(GAME.sub, 128, 90, HEX[CY], 8, 'center');
    if (Math.floor(blink * 2) & 1) txt('PRESS START', 128, 120, WH, 8, 'center');
    txt('HI ' + pad5(hi), 128, 134, YE, 8, 'center');
  } else if (mode === 'over' && result) {
    panel(32, 52, 192, 100);
    txt(result.msg || 'GAME OVER', 128, 64, YE, 16, 'center');
    txt('SCORE ' + pad5(result.score), 128, 94, WH, 8, 'center');
    if (result.isBest) { if (Math.floor(blink * 3) & 1) txt('NEW BEST!', 128, 110, HEX[E], 8, 'center'); }
    else txt('BEST ' + pad5(hi), 128, 110, WH, 8, 'center');

let last = 0, acc = 0;
function frame(ts) {

  acc += Math.min(0.1, (ts - last) / 1000); last = ts;

  go: () => { startEdge = true; },
  mode: () => mode, music: () => GAME.music,
  get seed() { return activeSeed; }, get seedFromUrl() { return SEED_Q; },
};

})();
