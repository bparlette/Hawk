<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INK RONIN — paint the street!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; height:100%; background:#141430; overflow:hidden; }
  #game { position:fixed; inset:0; display:block; touch-action:none; }
</style>
<script id="moth-game-guard">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
</head>
<body>
<canvas id="game"></canvas>
<script type="module">
let TC = null;
try {
  const m = await import('./gptouch.js');
  if (m.isTouchDevice()) TC = new m.TouchController({ buttons: [ { id:'a', label:'A' }, { id:'b', label:'B' } ] });
} catch (e) { /* keyboard-only fallback */ }

// ---------------------------------------------------------------- setup
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let CW = 0, CH = 0, SCALE = 1;               // canvas css size + logical scale
let VW = 780;                                // logical units visible across the width (set in resize)
let LH = 540, HORIZON = 300;                 // logical visible height + horizon y (per-frame)
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
  // Keep the logical height near 740 so sprites stay big and readable in
  // portrait (fit-width alone would shrink the cast to thumbnails); the
  // visible street width adapts to the aspect instead.
  VW = Math.max(340, Math.min(1300, (CW / CH) * 740));
  SCALE = (CW / VW) * dpr;                   // device px per logical unit
  LH = CH / (CW / VW);
  HORIZON = Math.round(LH * 0.54);
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
function shade(hex, f) { // f<1 darken, f>1 lighten
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; } else { r += (255 - r) * (f - 1); g += (255 - g) * (f - 1); b += (255 - b) * (f - 1); }
  return `rgb(${r|0},${g|0},${b|0})`;
}
let seed = 7;
function srand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// ---------------------------------------------------------------- palette
const PAL = {
  skyTop:'#171c48', skyMid:'#2c3670', skyLow:'#6e3560', dusk:'#b84a52',
  moon:'#f7e3ac', roofFar:'#232550', roofMid:'#2e2a55', wallA:'#4a3560', wallB:'#5d3a52',
  wallC:'#3c4468', winLit:'#ffd98a', winDark:'#241f3d', lantern:'#ffca66', lanternHot:'#fff0bc',
  ground:'#262340', stone:'#3d3a5e', stoneHi:'#55507a', teal:'#17657a', tealDk:'#0f4356',
  hero:'#31439f', heroDk:'#212c6e', heroLt:'#4a5cc0', skin:'#f2c094', white:'#f5efe2',
  gold:'#f5b942', wood:'#6e4526', paint:'#e8382f', paintDk:'#b81f24', paintLt:'#ff6a55',
  ink:'#12121e', inkHi:'#3a3f58', brute:'#c9cdd6', bruteDk:'#8f95a5', heart:'#ff4457',
};

// ------------------------------------------------------- dab sprite factory
// A "dab" is a small offscreen canvas: an ellipse of bristle streaks in one
// colour, so everything drawn from dabs reads as brushwork, not vector art.
const dabCache = new Map();
function dab(color, w, h, variant = 0) {
  w = Math.max(4, Math.round(w / 4) * 4); h = Math.max(3, Math.round(h / 4) * 4);
  const key = color + '|' + w + '|' + h + '|' + variant;
  let c = dabCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  const pad = 3;
  c.width = w + pad * 2; c.height = h + pad * 2;
  const g = c.getContext('2d');
  const oldSeed = seed; seed = 1234 + variant * 977 + w * 31 + h * 7;
  g.save();
  g.translate(pad + w / 2, pad + h / 2);
  g.beginPath(); g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); g.clip();
  g.fillStyle = color; g.fillRect(-w / 2, -h / 2, w, h);
  const streaks = Math.max(5, (w * h) / 90);
  for (let i = 0; i < streaks; i++) {
    const y = (srand() - 0.5) * h * 0.92;
    const span = Math.sqrt(Math.max(0, 1 - (2 * y / h) * (2 * y / h))) * w;
    const x0 = -span / 2 + srand() * span * 0.25;
    g.strokeStyle = shade(color, 0.82 + srand() * 0.42);
    g.lineWidth = 0.8 + srand() * Math.max(1.2, h / 7);
    g.globalAlpha = 0.25 + srand() * 0.4;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + span * (0.55 + srand() * 0.45), y + (srand() - 0.5) * 2.5); g.stroke();
  }
  // bristle gaps
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < streaks / 3; i++) {
    const y = (srand() - 0.5) * h * 0.9;
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.globalAlpha = 0.10 + srand() * 0.12;
    g.lineWidth = 0.7 + srand() * 1.1;
    g.beginPath(); g.moveTo(-w / 2, y); g.lineTo(w / 2, y + (srand() - 0.5) * 2); g.stroke();
  }
  g.restore();
  seed = oldSeed;
  dabCache.set(key, c);
  return c;
}
// draw a dab centred at (x,y) in logical units (ctx already scaled)
function PD(x, y, w, h, color, rot = 0, alpha = 1, variant = 0) {
  const img = dab(color, w, h, variant);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}
function glow(x, y, r, color, alpha) {
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = gr;
  ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}

// ------------------------------------------------------- paint toolkit (v2)
// Real brushwork for the baked layers + character sprites: tapered strokes
// made of individual bristle lines along a bending path, with per-stroke
// colour jitter. Local seeded RNG so bakes are deterministic and don't
// disturb the global `seed` used by dab().
function rng32(s) { let a = s >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(h1, h2, k) { const a = rgbOf(h1), b = rgbOf(h2); return `rgb(${Math.round(a[0] + (b[0] - a[0]) * k)},${Math.round(a[1] + (b[1] - a[1]) * k)},${Math.round(a[2] + (b[2] - a[2]) * k)})`; }
function jitHex(hex, R, amt = 14, warm = 0) { // per-channel jitter + optional warm shift
  const c = rgbOf(hex);
  const r = clamp(c[0] + (R() - 0.5) * 2 * amt + warm, 0, 255), g = clamp(c[1] + (R() - 0.5) * 2 * amt, 0, 255), b = clamp(c[2] + (R() - 0.5) * 2 * amt - warm * 0.7, 0, 255);
  return `rgb(${r|0},${g|0},${b|0})`;
}
// One tapered brush stroke: bristle lines along a slightly bending path.
// (x,y) is the stroke centre; ang its direction; len its length; w its max
// width. Darker/lighter bristles are mixed into the base colour.
function paintStroke(g, x, y, len, ang, w, color, R, opt = {}) {
  const alpha = opt.alpha !== undefined ? opt.alpha : 0.85;
  const bend = (opt.bend !== undefined ? opt.bend : (R() - 0.5) * 0.35);
  const bristles = Math.max(3, Math.min(9, Math.round(w * 1.1)));
  const steps = 7;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx; // perpendicular
  const cx = x + px * bend * len * 0.22, cy = y + py * bend * len * 0.22; // control point
  const base = rgbOf(typeof color === 'string' && color[0] === '#' ? color : '#888888');
  const colStr = (typeof color === 'string' && color[0] === '#') ? null : color;
  g.save();
  g.lineCap = 'round';
  for (let b = 0; b < bristles; b++) {
    const off = (bristles === 1 ? 0 : (b / (bristles - 1) - 0.5)) * w;
    const lj = (R() - 0.5) * 26 - 6; // bristle lightness jitter
    g.strokeStyle = colStr || `rgb(${clamp(base[0] + lj, 0, 255)|0},${clamp(base[1] + lj, 0, 255)|0},${clamp(base[2] + lj * 0.9, 0, 255)|0})`;
    g.globalAlpha = alpha * (0.5 + R() * 0.5);
    g.lineWidth = Math.max(0.7, (w / bristles) * (0.8 + R() * 0.5));
    g.beginPath();
    for (let sIdx = 0; sIdx <= steps; sIdx++) {
      const t = sIdx / steps;
      const taper = Math.sin(Math.min(1, t * 1.15) * Math.PI); // 0 at tail, full mid, soft head
      const o = off * (0.35 + 0.65 * taper);
      const bx = (1 - t) * (1 - t) * (x - dx * len / 2) + 2 * (1 - t) * t * cx + t * t * (x + dx * len / 2);
      const by = (1 - t) * (1 - t) * (y - dy * len / 2) + 2 * (1 - t) * t * cy + t * t * (y + dy * len / 2);
      const X = bx + px * o, Y = by + py * o;
      if (sIdx === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
    }
    g.stroke();
  }
  g.restore();
}
// Fill a rect region with flow-field strokes. angleAt(x,y)->radians.
function paintFill(g, x0, y0, x1, y1, colors, R, opt = {}) {
  const n = opt.n || 400, lenR = opt.len || [30, 80], wR = opt.w || [3, 7];
  const angleAt = opt.angleAt || (() => 0);
  const alpha = opt.alpha !== undefined ? opt.alpha : 0.85;
  for (let i = 0; i < n; i++) {
    const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0);
    const col = colors[Math.floor(R() * colors.length)];
    paintStroke(g, x, y, lenR[0] + R() * (lenR[1] - lenR[0]), angleAt(x, y), wR[0] + R() * (wR[1] - wR[0]), col, R, { alpha: alpha * (0.7 + R() * 0.3), bend: opt.bend });
  }
}
// A glowing cluster of small dabs/strokes (lantern light, window light, halo).
function glowCluster(g, cx, cy, r, colors, R, n = 46, alpha = 0.5, flat = 1) {
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, d = Math.pow(R(), 0.6) * r;
    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * flat;
    const s = (1 - d / r) * 0.8 + 0.2;
    paintStroke(g, x, y, (4 + R() * 12) * s + 3, a + Math.PI / 2 + (R() - 0.5) * 0.7, (1.6 + R() * 2.6) * s, colors[Math.floor(R() * colors.length)], R, { alpha: alpha * s });
  }
}
// Broken concentric ring strokes (moon halo, painted circles).
function brokenRings(g, cx, cy, r0, r1, colors, R, opt = {}) {
  const lw = opt.lw || 4, alpha = opt.alpha !== undefined ? opt.alpha : 0.5;
  for (let r = r0; r < r1; r += lw + 2.5 + R() * 3) {
    let a = R() * Math.PI * 2;
    const end = a + Math.PI * 2;
    while (a < end) {
      const seg = 0.25 + R() * 0.9;
      g.save();
      g.globalAlpha = alpha * (0.55 + R() * 0.45);
      g.strokeStyle = jitHex(colors[Math.floor(R() * colors.length)], R, 10);
      g.lineWidth = lw * (0.7 + R() * 0.6);
      g.lineCap = 'round';
      g.beginPath(); g.arc(cx, cy, r, a, Math.min(end, a + seg)); g.stroke();
      g.restore();
      a += seg + 0.08 + R() * 0.3;
    }
  }
}
// Broken bristly outline along a path defined by point list (closed).
function brokenOutline(g, pts, color, R, opt = {}) {
  const lw = opt.lw || 3, alpha = opt.alpha !== undefined ? opt.alpha : 0.8;
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    const segLen = Math.hypot(q[0] - p[0], q[1] - p[1]);
    const chunks = Math.max(1, Math.floor(segLen / 9));
    for (let cIdx = 0; cIdx < chunks; cIdx++) {
      if (R() < 0.22) continue; // gaps = broken paint edge
      const t0 = cIdx / chunks, t1 = (cIdx + 0.8) / chunks;
      g.globalAlpha = alpha * (0.6 + R() * 0.4);
      g.strokeStyle = jitHex(color, R, 8);
      g.lineWidth = lw * (0.7 + R() * 0.6);
      g.beginPath();
      g.moveTo(p[0] + (q[0] - p[0]) * t0 + (R() - 0.5) * 1.6, p[1] + (q[1] - p[1]) * t0 + (R() - 0.5) * 1.6);
      g.lineTo(p[0] + (q[0] - p[0]) * t1, p[1] + (q[1] - p[1]) * t1);
      g.stroke();
    }
  }
  g.restore();
}

// ------------------------------------------- painted character part sprites
// Every body part is pre-rendered ONCE at load as a little painting: shape
// clipped, filled with directional strokes in 3 tones, finished with a
// broken bristly outline. Per frame the game just blits sprites (fast) —
// but nothing on screen is a flat vector shape any more.
const PART_SS = 2, PART_PAD = 5;
function partSprite(w, h, painter, seedVal) {
  const c = document.createElement('canvas');
  c.width = (w + PART_PAD * 2) * PART_SS; c.height = (h + PART_PAD * 2) * PART_SS;
  const g = c.getContext('2d');
  g.scale(PART_SS, PART_SS); g.translate(PART_PAD, PART_PAD);
  painter(g, w, h, rng32(seedVal));
  c._lw = w + PART_PAD * 2; c._lh = h + PART_PAD * 2;
  return c;
}
function PP(img, x, y, rot = 0, alpha = 1, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  ctx.drawImage(img, -img._lw / 2 * sx, -img._lh / 2 * sy, img._lw * sx, img._lh * sy);
  ctx.restore();
}
function ellipsePts(cx, cy, rx, ry, n = 16) { const p = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
function rrPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rrPts(x, y, w, h, r) {
  const pts = [];
  const corners = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of corners) for (let i = 0; i <= 3; i++) { const a = a0 + (i / 3) * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
// Fill a clipped shape with directional paint strokes in 3 tones + outline.
function paintBody(g, w, h, clipFn, outline, tones, R, opt = {}) {
  g.save();
  clipFn(g);
  g.fillStyle = tones[1]; g.fillRect(-4, -4, w + 8, h + 8);
  paintFill(g, -2, -2, w + 2, h + 2, [tones[0], tones[1], tones[1], tones[2]], R,
    { n: opt.n || Math.round(w * h / 26), len: opt.len || [10, 24], w: opt.sw || [2.6, 4.6], angleAt: opt.angleAt || (() => Math.PI / 2 + (R() - 0.5) * 0.22), alpha: 0.8 });
  if (opt.extra) opt.extra(g);
  g.restore();
  brokenOutline(g, outline, opt.outlineCol || tones[0], R, { lw: opt.lw || 2.6, alpha: 0.8 });
}
const W3 = ['#cfc9b8', '#f5efe2', '#ffffff']; // hurt-flash tones
function heroParts(flash, sd) {
  const gi = flash ? W3 : [PAL.heroDk, PAL.hero, PAL.heroLt];
  const dk = flash ? W3 : ['#14142a', PAL.ink, PAL.inkHi];
  const sk = flash ? W3 : ['#d99e6f', PAL.skin, '#ffd9ae'];
  const wh = flash ? W3 : ['#cfc4a8', PAL.white, '#ffffff'];
  const wd = flash ? W3 : ['#4e2f18', PAL.wood, '#96683c'];
  const gd = flash ? W3 : ['#c07f1d', PAL.gold, '#ffd873'];
  const pt = flash ? W3 : [PAL.paintDk, PAL.paint, PAL.paintLt];
  return {
    leg: partSprite(15, 30, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 1, 1, w - 2, h - 2, 6), rrPts(1, 1, w - 2, h - 2, 6), gi, R), sd + 1),
    foot: partSprite(17, 8, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 0, 0, w, h, 4), rrPts(0, 0, w, h, 4), dk, R, { angleAt: () => (R() - 0.5) * 0.2 }), sd + 2),
    torso: partSprite(47, 60, (g, w, h, R) => {
      paintBody(g, w, h, (gg) => rrPath(gg, 1, 1, w - 2, h - 2, 15), rrPts(1, 1, w - 2, h - 2, 15), gi, R, {
        extra: (gg) => {
          // chest light (upper body, catches the lantern side)
          gg.save(); rrPath(gg, 6, 3, w - 16, 24, 11); gg.clip();
          paintFill(gg, 4, 2, w - 6, 28, [gi[2]], R, { n: 26, len: [8, 18], w: [2.4, 4], angleAt: () => Math.PI / 2 + (R() - 0.5) * 0.3, alpha: 0.55 });
          gg.restore();
          // belt: gold band with horizontal strokes + knot
          gg.save(); gg.beginPath(); gg.rect(0, h - 13, w, 10); gg.clip();
          gg.fillStyle = gd[1]; gg.fillRect(0, h - 13, w, 10);
          paintFill(gg, 0, h - 13, w, h - 3, gd, R, { n: 20, len: [8, 18], w: [2, 3.4], angleAt: () => (R() - 0.5) * 0.16, alpha: 0.85 });
          gg.restore();
          paintStroke(gg, w / 2, h - 8, w * 0.94, 0, 1.8, gd[0], R, { alpha: 0.7 });
        },
      });
    }, sd + 3),
    head: partSprite(31, 30, (g, w, h, R) => paintBody(g, w, h, (gg) => { gg.beginPath(); gg.ellipse(w / 2, h / 2, w / 2 - 1, h / 2 - 1, 0, 0, Math.PI * 2); }, ellipsePts(w / 2, h / 2, w / 2 - 1, h / 2 - 1), sk, R, { angleAt: () => (R() - 0.5) * 0.5 }), sd + 4),
    band: partSprite(36, 11, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 0, 1, w, h - 2, 5), rrPts(0, 1, w, h - 2, 5), wh, R, { angleAt: () => (R() - 0.5) * 0.14, outlineCol: '#7a6c4e', lw: 2.2 }), sd + 5),
    tails: partSprite(13, 20, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 1, 0, w - 2, h, 5), rrPts(1, 0, w - 2, h, 5), wh, R, { outlineCol: '#7a6c4e', lw: 2.2 }), sd + 6),
    hand: partSprite(15, 15, (g, w, h, R) => paintBody(g, w, h, (gg) => { gg.beginPath(); gg.ellipse(w / 2, h / 2, w / 2 - 1, h / 2 - 1, 0, 0, Math.PI * 2); }, ellipsePts(w / 2, h / 2, w / 2 - 1, h / 2 - 1), gi, R), sd + 7),
    handle: partSprite(11, 40, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 2, 0, w - 4, h, 4), rrPts(2, 0, w - 4, h, 4), wd, R, { len: [12, 26] }), sd + 8),
    ferrule: partSprite(13, 13, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 1, 1, w - 2, h - 2, 3), rrPts(1, 1, w - 2, h - 2, 3), gd, R), sd + 9),
    bristle: partSprite(17, 27, (g, w, h, R) => {
      const pts = [[3, 0], [w - 3, 0], [w - 5, h * 0.55], [w / 2, h], [5, h * 0.55]];
      paintBody(g, w, h, (gg) => { gg.beginPath(); gg.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) gg.lineTo(pts[i][0], pts[i][1]); gg.closePath(); }, pts, pt, R, { len: [8, 18], extra: (gg) => {
        paintStroke(gg, w / 2, h * 0.3, 9, Math.PI / 2, 3, pt[2], R, { alpha: 0.65 });
        paintStroke(gg, w / 2 - 3, h * 0.55, 7, Math.PI / 2, 2.2, pt[2], R, { alpha: 0.5 });
      } });
    }, sd + 10),
  };
}
const HERO_P = heroParts(false, 500), HERO_PF = heroParts(true, 900);
function soldierParts(flash, sd) {
  const inkT = flash ? W3 : ['#06060e', PAL.ink, PAL.inkHi];
  return {
    body: partSprite(46, 54, (g, w, h, R) => {
      const pts = ellipsePts(w / 2, h / 2 + 1, w / 2 - 1, h / 2 - 1, 18).map(([px, py]) => [px, py + (py > h / 2 ? 1.5 : 0)]);
      paintBody(g, w, h, (gg) => { gg.beginPath(); gg.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) gg.lineTo(pts[i][0], pts[i][1]); gg.closePath(); }, pts, inkT, R, {
        len: [9, 20], extra: (gg) => {
          // glossy sheen, upper-left
          gg.save(); gg.beginPath(); gg.ellipse(w * 0.34, h * 0.26, w * 0.2, h * 0.13, -0.4, 0, Math.PI * 2); gg.clip();
          paintFill(gg, w * 0.1, h * 0.08, w * 0.6, h * 0.42, [inkT[2]], R, { n: 18, len: [6, 13], w: [2.2, 3.6], alpha: 0.75 });
          gg.restore();
          paintStroke(gg, w * 0.28, h * 0.17, 7, -0.5, 2.6, flash ? '#ffffff' : PAL.white, R, { alpha: 0.8 }); // gloss spot
        },
      });
    }, sd),
    foot: HERO_P.foot, // shared ink foot (flash handled by body swap timing; feet read fine)
  };
}
const SOL_P = [soldierParts(false, 610), soldierParts(false, 620), soldierParts(false, 630)];
const SOL_PF = soldierParts(true, 950);
function bruteParts(flash, sd) {
  const sv = flash ? W3 : [PAL.bruteDk, PAL.brute, '#e9edf4'];
  const svD = flash ? W3 : ['#5f6575', PAL.bruteDk, PAL.brute];
  const pt = flash ? W3 : [PAL.paintDk, PAL.paint, PAL.paintLt];
  const gd = flash ? W3 : ['#c07f1d', PAL.gold, '#ffd873'];
  const ribbed = (tones, rib) => (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 1, 1, w - 2, h - 2, 16), rrPts(1, 1, w - 2, h - 2, 16), tones, R, {
    angleAt: () => (R() - 0.5) * 0.18, len: [12, 26], extra: (gg) => { if (rib) for (const ry of [h * 0.36, h * 0.68]) paintStroke(gg, w / 2, ry, w * 0.9, 0, 3, tones[0], R, { alpha: 0.4 }); },
  });
  return {
    low: partSprite(96, 66, ribbed(sv, true), sd + 1),
    mid: partSprite(82, 58, ribbed(sv, true), sd + 2),
    crimp: partSprite(62, 40, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 1, 1, w - 2, h - 2, 9), rrPts(1, 1, w - 2, h - 2, 9), svD, R, { len: [10, 20], extra: (gg) => { for (let i = 1; i < 6; i++) paintStroke(gg, (w / 6) * i, h / 2, h * 0.8, Math.PI / 2, 2.4, svD[0], R, { alpha: 0.55 }); } }), sd + 3),
    label: partSprite(84, 34, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 1, 1, w - 2, h - 2, 8), rrPts(1, 1, w - 2, h - 2, 8), pt, R, { angleAt: () => (R() - 0.5) * 0.14, extra: (gg) => paintFill(gg, w * 0.16, h * 0.4, w * 0.84, h * 0.62, [PAL.white], R, { n: 12, len: [8, 16], w: [2.2, 3.4], angleAt: () => (R() - 0.5) * 0.1, alpha: 0.8 }) }), sd + 4),
    cap: partSprite(34, 17, (g, w, h, R) => paintBody(g, w, h, (gg) => { gg.beginPath(); gg.ellipse(w / 2, h, w / 2 - 1, h - 1, 0, Math.PI, 0); gg.lineTo(w - 1, h); gg.lineTo(1, h); gg.closePath(); }, ellipsePts(w / 2, h, w / 2 - 1, h - 1, 14).filter(([, py]) => py <= h + 0.5), gd, R), sd + 5),
    arm: partSprite(20, 46, ribbed(sv, false), sd + 6),
    foot: partSprite(30, 17, (g, w, h, R) => paintBody(g, w, h, (gg) => rrPath(gg, 0, 1, w, h - 1, 7), rrPts(0, 1, w, h - 1, 7), svD, R, { angleAt: () => (R() - 0.5) * 0.2 }), sd + 7),
    teeth: partSprite(60, 12, (g, w, h, R) => { for (let i = 0; i < 4; i++) { g.fillStyle = svD[1]; rrPath(g, 3 + i * 15, 1, 11, h - 2, 3); g.fill(); paintStroke(g, 8 + i * 15, h / 2, 8, Math.PI / 2, 2.4, svD[0], R, { alpha: 0.5 }); } }, sd + 8),
  };
}
const BRU_P = bruteParts(false, 700), BRU_PF = bruteParts(true, 980);

// ------------------------------------------------------- world constants
const WORLD_W = 3600;
const LANE0 = 84, LANEH = 116;               // feet y = HORIZON + LANE0 + lane (0..LANEH)
const feetY = (lane, jumpH = 0) => HORIZON + LANE0 + lane - jumpH;

// ------------------------------------------------------- pre-rendered layers
function layerCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const withCtx = (c, fn) => { const g = c.getContext('2d'); fn(g); return c; };

// FAR: indigo sky, moon, far rooftops (tiled, parallax 0.25) — 1600x620
// v2: the sky is PAINTED — thousands of directional strokes sweeping
// horizontally and curling around the moon; the moon is broken-ring paint
// with a halo of concentric broken strokes; rooftops are a true silhouette
// (chimneys, water tower) filled with vertical strokes + a lit rim.
const farCv = withCtx(layerCanvas(1600, 620), (g) => {
  const R = rng32(4207);
  const grad = g.createLinearGradient(0, 0, 0, 620);
  grad.addColorStop(0, PAL.skyTop); grad.addColorStop(0.55, PAL.skyMid);
  grad.addColorStop(0.85, PAL.skyLow); grad.addColorStop(1, PAL.dusk);
  g.fillStyle = grad; g.fillRect(0, 0, 1600, 620);
  const MX = 1240, MY = 130; // moon centre (kept from v1 layout)
  const skyCol = (y) => {
    const k = clamp(y / 470, 0, 1);
    return k < 0.5 ? mixHex(PAL.skyTop, PAL.skyMid, k * 2) : k < 0.82 ? mixHex(PAL.skyMid, PAL.skyLow, (k - 0.5) / 0.32) : mixHex(PAL.skyLow, PAL.dusk, (k - 0.82) / 0.18);
  };
  // long sweeping strokes; flow = horizontal + vortex curl around the moon
  for (let i = 0; i < 2500; i++) {
    const x = R() * 1600, y = Math.pow(R(), 1.15) * 470;
    const dxm = x - MX, dym = y - MY, d = Math.hypot(dxm, dym) || 1;
    const swirl = Math.exp(-d / 300) * 1.5;
    const ang = (dxm >= 0 ? 0 : 0) + Math.atan2(dym, dxm) + Math.PI / 2; // tangent
    const a = (R() - 0.5) * 0.14 + (ang - (dxm > 0 ? 0 : 0)) * 0; // base: near-horizontal
    const horiz = Math.abs(Math.sin(0)) ;
    // blend: mostly horizontal strokes; near the moon they follow the tangent
    const tang = Math.atan2(dym, dxm) + Math.PI / 2;
    const baseA = (Math.round(tang / Math.PI) * Math.PI); // nearest horizontal axis
    const finalA = baseA + clamp((tang - baseA), -1, 1) * swirl + (R() - 0.5) * 0.12;
    paintStroke(g, x, y, 34 + R() * 62, finalA, 3 + R() * 4.5, skyCol(y), R, { alpha: 0.5 + R() * 0.35, bend: (R() - 0.5) * 0.5 });
  }
  // fine broken grain strokes over the top
  for (let i = 0; i < 1500; i++) {
    const x = R() * 1600, y = R() * 480;
    paintStroke(g, x, y, 9 + R() * 18, (R() - 0.5) * 0.3, 1.4 + R() * 1.6, skyCol(y), R, { alpha: 0.35 + R() * 0.3 });
  }
  // stars: tiny broken crosses of paint
  for (let i = 0; i < 130; i++) {
    const x = R() * 1600, y = R() * 300, s = 1 + R() * 2.4;
    g.save(); g.globalAlpha = 0.35 + R() * 0.5; g.fillStyle = R() > 0.4 ? PAL.moon : PAL.white;
    g.fillRect(x - s, y - 0.7, s * 2, 1.4); g.fillRect(x - 0.7, y - s, 1.4, s * 2);
    g.restore();
  }
  // moon: soft under-glow, then the disc as concentric broken rings
  const mg = g.createRadialGradient(MX, MY, 10, MX, MY, 210);
  mg.addColorStop(0, 'rgba(247,227,172,0.34)'); mg.addColorStop(1, 'rgba(247,227,172,0)');
  g.fillStyle = mg; g.fillRect(MX - 220, MY - 220, 440, 440);
  g.save();
  g.beginPath(); g.arc(MX, MY, 57, 0, Math.PI * 2); g.clip();
  g.fillStyle = PAL.moon; g.fillRect(MX - 60, MY - 60, 120, 120);
  brokenRings(g, MX, MY, 4, 58, [PAL.moon, '#ffeec2', '#eed28e', PAL.dusk], R, { lw: 5, alpha: 0.75 });
  g.restore();
  brokenRings(g, MX, MY, 62, 168, [PAL.moon, PAL.skyLow, '#d9b878'], R, { lw: 3.4, alpha: 0.34 }); // halo
  paintStroke(g, MX - 22, MY - 26, 52, 0.4, 9, PAL.dusk, R, { alpha: 0.18 }); // moon shading smudge
  // ---- far rooftops: one silhouette skyline along the bottom
  const sil = [];
  let x = -30;
  while (x < 1650) {
    const bw = 100 + R() * 170, top = 448 + R() * 96;
    const kind = R();
    sil.push({ x, bw, top, gable: kind < 0.45, chim: R() < 0.55, tower: false });
    x += bw + 4 + R() * 44;
  }
  sil[Math.floor(sil.length / 2)].tower = true; // one water tower mid-skyline
  g.fillStyle = '#1d1e3e';
  g.beginPath(); g.moveTo(-30, 620);
  for (const b of sil) {
    g.lineTo(b.x, b.top + 14);
    if (b.gable) { g.lineTo(b.x + b.bw / 2, b.top - 16 - R() * 14); g.lineTo(b.x + b.bw, b.top + 14); }
    else g.lineTo(b.x + b.bw, b.top + 14);
    g.lineTo(b.x + b.bw, 620);
  }
  g.lineTo(1650, 620); g.closePath(); g.fill();
  // fill the silhouette with vertical/diagonal paint strokes
  g.save(); g.clip();
  paintFill(g, -30, 420, 1650, 620, [PAL.roofFar, '#2a2c58', '#1b1c38', PAL.roofMid], R, { n: 2100, len: [26, 64], w: [4, 8], angleAt: () => Math.PI / 2 + (R() - 0.5) * 0.35, alpha: 0.8 });
  g.restore();
  // chimneys + water tower + antennas, silhouetted
  g.fillStyle = '#191a34';
  for (const b of sil) {
    if (b.chim) { const cx0 = b.x + b.bw * (0.2 + R() * 0.55); g.fillRect(cx0, b.top - 26, 13, 30); g.fillRect(cx0 - 2, b.top - 30, 17, 6); }
    if (b.tower) {
      const tx0 = b.x + b.bw / 2;
      g.fillRect(tx0 - 3, b.top - 74, 6, 78); g.fillRect(tx0 - 30, b.top - 108, 60, 36);
      g.beginPath(); g.moveTo(tx0 - 34, b.top - 108); g.lineTo(tx0, b.top - 128); g.lineTo(tx0 + 34, b.top - 108); g.fill();
      g.strokeStyle = '#191a34'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(tx0 - 24, b.top - 72); g.lineTo(tx0 + 24, b.top - 4); g.moveTo(tx0 + 24, b.top - 72); g.lineTo(tx0 - 24, b.top - 4); g.stroke();
    }
    if (R() < 0.4) { const ax = b.x + b.bw * R(); g.fillRect(ax, b.top - 34, 2.4, 36); g.fillRect(ax - 7, b.top - 28, 16, 2); }
  }
  // broken warm rim light along the roofline + a few tiny lit windows
  for (const b of sil) {
    paintStroke(g, b.x + b.bw / 2, b.top + 12, b.bw * 0.92, 0, 2.4, PAL.dusk, R, { alpha: 0.4 });
    for (let wi = 0; wi < 3; wi++) if (R() < 0.5) {
      g.save(); g.globalAlpha = 0.5 + R() * 0.4; g.fillStyle = PAL.winLit;
      g.fillRect(b.x + 12 + R() * (b.bw - 26), b.top + 34 + R() * 90, 3.4, 4.6); g.restore();
    }
  }
});

// MID: shopfronts + lanterns (parallax 0.6 space, 2200 wide, bottom-aligned to ground line)
// v2: building masses painted from vertical strokes, true rooflines with
// chimneys, windows as thick glowing paint, lanterns strung on sagging
// wires, and painted light pools spilling at the street's back edge.
const MID_W = 2200, MID_H = 400;
const midCv = withCtx(layerCanvas(MID_W, MID_H), (g) => {
  const R = rng32(9907);
  const base = MID_H; // bottom of canvas sits at HORIZON+LANE0 in view space
  const shops = [];
  let x = -10;
  while (x < MID_W + 40) {
    const bw = 150 + R() * 140, bh = 200 + R() * 115, top = base - bh;
    const wall = [PAL.wallA, PAL.wallB, PAL.wallC][Math.floor(R() * 3)];
    shops.push({ x, bw, top, wall });
    // mass underpaint
    g.fillStyle = shade(wall, 0.94); g.fillRect(x, top, bw, bh);
    // vertical paint strokes (weatherboard / plaster dragged downward)
    paintFill(g, x + 4, top + 6, x + bw - 4, base - 2, [wall, shade(wall, 1.3), shade(wall, 1.12), shade(wall, 0.86), PAL.teal, PAL.dusk, PAL.skyLow], R,
      { n: Math.round(bw * bh / 190), len: [30, 78], w: [4, 8], angleAt: () => Math.PI / 2 + (R() - 0.5) * 0.1, alpha: 0.82 });
    // horizontal weather shadow lines
    for (let yy = top + 24; yy < base - 8; yy += 27) paintStroke(g, x + bw / 2, yy, bw * 0.96, 0, 2.2, '#141126', R, { alpha: 0.16 });
    // roofline: parapet with tile arcs + a chimney
    g.fillStyle = PAL.roofMid; g.fillRect(x - 7, top - 13, bw + 14, 15);
    for (let xx = x - 4; xx < x + bw + 4; xx += 15) {
      g.save(); g.strokeStyle = jitHex(PAL.roofMid, R, 12); g.lineWidth = 3.4; g.globalAlpha = 0.9;
      g.beginPath(); g.arc(xx + 7, top - 13, 7.5, Math.PI, 0); g.stroke(); g.restore();
    }
    paintStroke(g, x + bw / 2, top - 15, bw * 0.98, 0, 3, PAL.dusk, R, { alpha: 0.35 }); // dusk rim
    if (R() < 0.6) {
      const cx0 = x + bw * (0.15 + R() * 0.6);
      g.fillStyle = shade(wall, 0.6); g.fillRect(cx0, top - 40, 17, 30); g.fillRect(cx0 - 3, top - 45, 23, 7);
      for (let s = 0; s < 12; s++) paintStroke(g, cx0 + 8 + (R() - 0.5) * 9, top - 52 - s * 4.5, 8 + R() * 9, -Math.PI / 2 + (R() - 0.5) * 0.4, 2.6, '#9aa0bd', R, { alpha: 0.1 + R() * 0.1 }); // smoke wisps
    }
    // windows: frames first, then light as thick paint
    const cols = Math.max(1, Math.floor(bw / 64));
    for (let cx = 0; cx < cols; cx++) for (let ry = 0; ry < 2; ry++) {
      const wx = x + 22 + cx * 62, wy = top + 36 + ry * 74;
      if (wy + 46 > base - 66) continue;
      const lit = R() > 0.42;
      g.fillStyle = '#171230'; g.fillRect(wx - 3, wy - 3, 40, 52);
      if (lit) {
        glowCluster(g, wx + 17, wy + 23, 30, [PAL.lantern, PAL.winLit, PAL.lanternHot, PAL.gold], R, 34, 0.5);
        g.fillStyle = PAL.winLit; g.fillRect(wx, wy, 34, 46);
        paintFill(g, wx + 1, wy + 1, wx + 33, wy + 45, [PAL.winLit, PAL.lanternHot, PAL.lantern, PAL.white], R, { n: 26, len: [7, 16], w: [2.4, 4.4], angleAt: () => (R() - 0.5) * 0.4, alpha: 0.85 });
        paintStroke(g, wx + 17, wy + 12, 26, 0, 5, PAL.lanternHot, R, { alpha: 0.8 }); // bright heart
      } else {
        g.fillStyle = PAL.winDark; g.fillRect(wx, wy, 34, 46);
        paintStroke(g, wx + 15, wy + 22, 34, -0.7, 3.4, '#7f8fc4', R, { alpha: 0.16 }); // sky reflection slash
        paintStroke(g, wx + 17, wy + 38, 28, 0, 3, PAL.skyLow, R, { alpha: 0.2 });
      }
      g.fillStyle = 'rgba(18,14,34,0.9)'; g.fillRect(wx + 15, wy, 3.4, 46); g.fillRect(wx, wy + 21, 34, 3.4);
      paintStroke(g, wx + 17, wy + 49, 38, 0, 2.6, '#100d24', R, { alpha: 0.5 }); // sill shadow
    }
    // awning with painted stripes + doorway
    if (R() > 0.45) {
      const ax = x + bw * 0.08, aw = bw * 0.5, ay = base - 74;
      for (let sIdx = 0; sIdx < 7; sIdx++) paintStroke(g, ax + aw / 2, ay + sIdx * 2.6, aw, 0.03, 3.4, sIdx % 2 ? PAL.paintDk : shade(PAL.paintDk, 1.35), R, { alpha: 0.9 });
      g.fillStyle = 'rgba(12,10,26,0.35)'; g.fillRect(ax, ay + 19, aw, 5);
    }
    g.fillStyle = '#150f2a'; g.fillRect(x + bw * 0.36, base - 58, 44, 58);
    paintStroke(g, x + bw * 0.36 + 22, base - 52, 34, Math.PI / 2, 3, PAL.lantern, R, { alpha: 0.22 }); // door glow seam
    x += bw + 4 + R() * 26;
  }
  // ---- lantern wires strung across the street, sagging between shops
  const lanternPts = [];
  for (let wx = 60; wx < MID_W - 80; wx += 300 + R() * 160) {
    const x2 = wx + 240 + R() * 120, y0 = 66 + R() * 36, sag = 26 + R() * 14;
    g.save(); g.strokeStyle = 'rgba(10,8,22,0.85)'; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(wx, y0); g.quadraticCurveTo((wx + x2) / 2, y0 + sag * 2, x2, y0); g.stroke(); g.restore();
    const nl = 3 + Math.floor(R() * 3);
    for (let li = 1; li <= nl; li++) {
      const t = li / (nl + 1);
      const lx = (1 - t) * (1 - t) * wx + 2 * (1 - t) * t * ((wx + x2) / 2) + t * t * x2;
      const ly = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * (y0 + sag * 2) + t * t * y0;
      lanternPts.push({ x: lx, y: ly + 14 });
    }
  }
  // ---- hanging lanterns along the shopfronts (v1 row, richer paint)
  for (let lx = 50; lx < MID_W; lx += 165 + R() * 95) lanternPts.push({ x: lx, y: base - 128 - R() * 42, post: true });
  for (const L of lanternPts) {
    if (L.post) { g.save(); g.strokeStyle = 'rgba(12,10,26,0.9)'; g.lineWidth = 3; g.beginPath(); g.moveTo(L.x, L.y - 44); g.lineTo(L.x, L.y - 12); g.stroke(); g.restore(); }
    glowCluster(g, L.x, L.y, 58, [PAL.lantern, PAL.gold, PAL.dusk], R, 40, 0.34); // painted halo
    // paper body: stacked horizontal strokes
    for (let ry = -13; ry <= 13; ry += 4.4) {
      const wHalf = 11.5 * Math.cos((ry / 15) * Math.PI / 2.4);
      paintStroke(g, L.x, L.y + ry, wHalf * 2, 0, 3.6, ry % 8.8 < 4.4 ? PAL.lantern : shade(PAL.lantern, 1.12), R, { alpha: 0.95 });
    }
    glowCluster(g, L.x, L.y, 10, [PAL.lanternHot, PAL.white], R, 12, 0.8); // hot core
    paintStroke(g, L.x, L.y + 17, 3, Math.PI / 2, 2.4, PAL.paintDk, R, { alpha: 0.8 }); // tassel
    // light pool spilling at the street's back edge under this lantern
    glowCluster(g, L.x, base - 3, 52, [PAL.lantern, PAL.gold], R, 30, 0.16, 0.18);
  }
});

// GROUND strip (world space, parallax 1) — v2: ONE continuous painted
// surface. Long strokes all flow rightward (perspective tilt grows with
// depth), heavily overlapped so no tile/mosaic pattern can form.
const groundCv = withCtx(layerCanvas(WORLD_W, 300), (g) => {
  const R = rng32(123499);
  g.fillStyle = PAL.ground; g.fillRect(0, 0, WORLD_W, 300);
  const gCols = [PAL.ground, PAL.stone, PAL.stoneHi, PAL.tealDk, PAL.teal, '#4b3560', '#2c2a52'];
  const pick = () => { const r = R(); return r < 0.34 ? gCols[0] : r < 0.62 ? gCols[1] : r < 0.76 ? gCols[2] : r < 0.88 ? gCols[3] : r < 0.94 ? gCols[4] : r < 0.97 ? gCols[5] : gCols[6]; };
  // broad tonal washes first (large soft strokes kill any flatness)
  for (let i = 0; i < 500; i++) {
    const y = R() * 300;
    paintStroke(g, R() * WORLD_W, y, 130 + R() * 190, 0.02 + (y / 300) * 0.05, 16 + R() * 20, pick(), R, { alpha: 0.16 + R() * 0.12 });
  }
  // the main flow: thousands of overlapping rightward strokes
  for (let i = 0; i < 6500; i++) {
    const y = Math.pow(R(), 0.9) * 300, x = R() * WORLD_W;
    const depth = y / 300;
    paintStroke(g, x, y, (40 + R() * 66) * (0.6 + depth * 0.8), 0.015 + depth * 0.05 + (R() - 0.5) * 0.045, (4.5 + R() * 6) * (0.7 + depth * 0.7), pick(), R, { alpha: 0.55 + R() * 0.35 });
  }
  // dusk-sky reflections dragged through the stones
  for (let i = 0; i < 700; i++) {
    const y = 30 + R() * 270;
    paintStroke(g, R() * WORLD_W, y, 26 + R() * 60, 0.03, 2.4 + R() * 3, R() > 0.5 ? PAL.skyLow : PAL.dusk, R, { alpha: 0.1 + R() * 0.12 });
  }
  // shadow band where the buildings meet the street
  for (let i = 0; i < 260; i++) {
    const y = R() * 44;
    paintStroke(g, R() * WORLD_W, y, 60 + R() * 90, 0.02, 7 + R() * 8, '#0d0b20', R, { alpha: 0.14 + R() * 0.12 });
  }
  // cracks: thin dark wandering polylines
  g.save(); g.strokeStyle = 'rgba(8,6,18,0.5)'; g.lineCap = 'round';
  for (let i = 0; i < 46; i++) {
    let cxp = R() * WORLD_W, cyp = 20 + R() * 270;
    g.lineWidth = 1 + R() * 1.4; g.beginPath(); g.moveTo(cxp, cyp);
    for (let s = 0; s < 5; s++) { cxp += (R() - 0.3) * 44; cyp += (R() - 0.5) * 22; g.lineTo(cxp, cyp); }
    g.globalAlpha = 0.25 + R() * 0.3; g.stroke();
  }
  g.restore();
  // worn gold festival dashes, painted not pasted
  for (let xx = 30; xx < WORLD_W; xx += 120) paintStroke(g, xx + 31, 128 + (R() - 0.5) * 6, 58, 0.02, 5, PAL.gold, R, { alpha: 0.13 + R() * 0.05 });
  // pebble highlights near the front edge
  for (let i = 0; i < 320; i++) {
    const y = 190 + R() * 106;
    paintStroke(g, R() * WORLD_W, y, 5 + R() * 10, 0, 2 + R() * 2, PAL.stoneHi, R, { alpha: 0.3 + R() * 0.3 });
  }
});

// SPLAT layer (world space): every fight leaves permanent paint here
const splatCv = layerCanvas(WORLD_W, 320);
const splatCtx = splatCv.getContext('2d');
let splatCount = 0;
function addSplat(wx, dy, color, size) {
  if (wx < 6 || wx > WORLD_W - 6) return;
  const g = splatCtx;
  const n = irnd(2, 4);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.55 + Math.random() * 0.4;
    g.drawImage(dab(color, size * rnd(0.5, 1.15), size * rnd(0.3, 0.55), irnd(0, 2)),
      wx + rnd(-size, size) - size / 2, dy + rnd(-7, 7) - size / 4);
  }
  // drips / satellite dots
  for (let i = 0; i < 3; i++) {
    g.globalAlpha = 0.7;
    g.drawImage(dab(color, rnd(3, 8), rnd(2, 5), 1), wx + rnd(-size * 1.7, size * 1.7), dy + rnd(-10, 12));
  }
  g.globalAlpha = 1;
  splatCount++;
}

// ---------------------------------------------------------------- input
const keys = {};
const keyEdge = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) keyEdge[e.code] = true;
  keys[e.code] = true;
  anyInput();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
let tapFlag = false;
window.addEventListener('pointerdown', () => { tapFlag = true; anyInput(); });
function anyInput() {
  if (G.state === 'title') startGame();
  else if ((G.state === 'win' || G.state === 'over') && G.stateT > 0.6) resetGame();
}
function readInput() {
  const ti = TC ? TC.getInput() : null;
  let mx = 0, my = 0;
  if (ti) { mx += ti.x; my += ti.y; }
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1;
  if (keys.ArrowDown || keys.KeyS) my += 1;
  const slash = (ti && ti.aPressed) || keyEdge.KeyJ || keyEdge.KeyZ || keyEdge.KeyX;
  const jump = (ti && ti.bPressed) || keyEdge.KeyK || keyEdge.Space;
  for (const k in keyEdge) keyEdge[k] = false;
  return { mx: clamp(mx, -1, 1), my: clamp(my, -1, 1), slash: !!slash, jump: !!jump };
}

// ---------------------------------------------------------------- state
const G = {
  state: 'title', stateT: 0, time: 0, score: 0, camX: 0, shakeT: 0,
  gate: 0, locked: false, goT: 0, finishT: 0, slowmo: 1,
};
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const hero = {
  x: 120, lane: 55, face: 1, jumpH: 0, vy: 0, hp: 5, maxHp: 5,
  run: 0, slashT: 0, combo: 0, comboWin: 0, hurtT: 0, ifr: 0, dead: false,
};
let enemies = [], particles = [], arcs = [], puddles = [], popups = [], projectiles = [];
const GATES = [
  { x: 820, n: 3, brute: false },
  { x: 1620, n: 4, brute: false },
  { x: 2420, n: 5, brute: false },
  { x: 3180, n: 2, brute: true },
];
let waveSpawned = false, waveLeft = 0;

function resetGame() {
  hero.x = 120; hero.lane = 55; hero.face = 1; hero.jumpH = 0; hero.vy = 0;
  hero.hp = hero.maxHp; hero.slashT = 0; hero.combo = 0; hero.hurtT = 0; hero.ifr = 0; hero.dead = false;
  enemies = []; particles = []; arcs = []; puddles = []; popups = []; projectiles = [];
  G.score = 0; G.camX = 0; G.gate = 0; G.locked = false; G.goT = 0; G.stateT = 0;

// ---------------------------------------------------------------- enemies
let enemySeq = 0;
function spawnSoldier(x, lane) {
  enemies.push({
    id: enemySeq++, kind: 'ink', x, lane, hp: 3, maxHp: 3, face: -1,
    t: rnd(10), speed: rnd(50, 66), state: 'walk', atkT: 0, windup: 0, hurtT: 0, kb: 0, dead: false,
  });
}
function spawnBrute(x, lane) {
  enemies.push({
    id: enemySeq++, kind: 'brute', x, lane, hp: 14, maxHp: 14, face: -1,
    t: 0, speed: 34, state: 'walk', atkT: 0, windup: 0, hurtT: 0, kb: 0, dead: false, squeezeT: 2.2,
  });
}
function spawnWave(gi) {
  const gt = GATES[gi];
  for (let i = 0; i < gt.n; i++) spawnSoldier(gt.x + 168 + i * 72, irnd(8, LANEH - 8));
  if (gt.brute) spawnBrute(gt.x + 215, 55);
  waveSpawned = true;
  waveLeft = enemies.length;
}

// ---------------------------------------------------------------- paint fx
function burst(x, lane, jumpH, color, n, power = 1) {
  const fy = feetY(lane, jumpH);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + rnd(-14, 14), y: fy - rnd(10, 66) * power, z: 0,
      vx: rnd(-190, 190) * power, vz: rnd(90, 330) * power,
      laneDy: LANE0 + lane + rnd(-16, 20), color: Math.random() < 0.75 ? color : PAL.paint,
      size: rnd(7, 17) * power, v: irnd(0, 2), noSplat: color === PAL.stone,
    });
  }
}
function spawnArc(x, y, face, step, color) {
  arcs.push({ x, y, face, step, t: 0, life: step === 2 ? 0.34 : 0.24, color });
}
function popup(x, y, txt, color = PAL.gold) { popups.push({ x, y, txt, color, t: 0 }); }

// ---------------------------------------------------------------- combat
function heroSlash() {
  if (hero.slashT > 0 || hero.dead) return;
  const step = hero.comboWin > 0 ? Math.min(hero.combo + 1, 2) : 0;
  hero.combo = step;
  hero.slashT = 0.22;
  hero.comboWin = 0.42;
  const finisher = step === 2;
  spawnArc(hero.x + hero.face * 44, feetY(hero.lane, hero.jumpH) - 52, hero.face, step, PAL.paint);
  if (finisher) { G.finishT = 0.45; G.shakeT = Math.max(G.shakeT, 0.22); }
  const range = finisher ? 245 : 104;
  const dmg = finisher ? 2 : 1;
  let hitAny = false;
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = (e.x - hero.x) * hero.face;
    if (dx > -14 && dx < range && Math.abs(e.lane - hero.lane) < 52) {
      damageEnemy(e, dmg, hero.face, finisher);
      hitAny = true;
    }
  }
  if (hitAny) G.score += finisher ? 15 : 10;
}
function damageEnemy(e, dmg, dir, finisher) {
  e.hp -= dmg; e.hurtT = 0.16;
  e.kb = dir * (e.kind === 'brute' ? 26 : finisher ? 190 : 110);
  const col = e.kind === 'brute' ? PAL.paint : PAL.ink;
  burst(e.x, e.lane, 0, col, finisher ? 18 : 11, e.kind === 'brute' ? 1.25 : 1);
  popup(e.x, feetY(e.lane) - (e.kind === 'brute' ? 190 : 92), finisher ? 'SPLAT!' : 'HIT!', finisher ? PAL.paintLt : PAL.white);
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    G.score += e.kind === 'brute' ? 300 : 50;
    burst(e.x, e.lane, 0, col, 30, e.kind === 'brute' ? 1.7 : 1.25);
    for (let i = 0; i < 5; i++) addSplat(e.x + rnd(-46, 46), LANE0 + e.lane + rnd(-14, 22), col, rnd(16, 30));
    popup(e.x, feetY(e.lane) - 110, e.kind === 'brute' ? '+300' : '+50', PAL.gold);
    if (e.kind === 'brute') G.shakeT = Math.max(G.shakeT, 0.3);
  }
}
function hurtHero(dir) {
  if (hero.ifr > 0 || hero.dead) return;
  hero.hp--; hero.ifr = 1.0; hero.hurtT = 0.3;
  hero.x += dir * 26;
  burst(hero.x, hero.lane, hero.jumpH, PAL.paint, 8, 0.8);
  if (hero.hp <= 0) { hero.dead = true; G.state = 'over'; G.stateT = 0; burst(hero.x, hero.lane, 0, PAL.hero, 26, 1.3); }
}

// ---------------------------------------------------------------- demo AI
function demoInput(dt) {
  const out = { mx: 0, my: 0, slash: false, jump: false };
  if (G.state === 'title') { startGame(); return out; }
  if (G.state !== 'play') return out;
  let tgt = null, best = 1e9;
  for (const e of enemies) { if (!e.dead && Math.abs(e.x - hero.x) < best) { best = Math.abs(e.x - hero.x); tgt = e; } }
  const goalX = tgt ? tgt.x - hero.face * 6 : (G.locked ? hero.x : Math.min(hero.x + 300, WORLD_W - 120));
  const gx = tgt ? tgt.x : goalX;
  const dx = gx - hero.x;
  if (tgt && Math.abs(dx) < 100 && Math.abs(tgt.lane - hero.lane) <= 22 && hero.slashT <= 0) {
    hero.face = Math.sign(tgt.x - hero.x) || 1;
    out.slash = true;
  } else if (Math.abs(dx) > 58) out.mx = Math.sign(dx);
  else if (tgt) {
    hero.face = Math.sign(tgt.x - hero.x) || 1;
    if (Math.abs(tgt.lane - hero.lane) > 20) out.my = Math.sign(tgt.lane - hero.lane);
    else if (hero.slashT <= 0) out.slash = true;
  }
  if (tgt && Math.abs(tgt.lane - hero.lane) > 22) out.my = Math.sign(tgt.lane - hero.lane);
  if (Math.random() < dt * 0.25 && hero.jumpH === 0) out.jump = true;
  for (const p of puddles) if (Math.abs(p.x - hero.x) < 50 && Math.abs(p.lane - hero.lane) < 30) out.my = hero.lane < 60 ? 1 : -1;
  return out;
}

// ---------------------------------------------------------------- update
function update(dt) {
  G.time += dt; G.stateT += dt;
  if (G.shakeT > 0) G.shakeT -= dt;
  if (G.finishT > 0) G.finishT -= dt;
  if (G.goT > 0) G.goT -= dt;
  const inp = DEMO ? demoInput(dt) : (G.state === 'play' ? readInput() : { mx: 0, my: 0, slash: false, jump: false });
  hero.moving = G.state === 'play' && (Math.abs(inp.mx) > 0.05 || Math.abs(inp.my) > 0.05);
  if (G.state !== 'play') { updateFx(dt); return; }

  // hero timers
  if (hero.slashT > 0) hero.slashT -= dt;
  if (hero.comboWin > 0) { hero.comboWin -= dt; if (hero.comboWin <= 0) hero.combo = 0; }
  if (hero.hurtT > 0) hero.hurtT -= dt;
  if (hero.ifr > 0) hero.ifr -= dt;

  // movement (puddles slow)
  let slow = 1;
  for (const p of puddles) if (Math.abs(p.x - hero.x) < p.r && Math.abs(p.lane - hero.lane) < 34 && hero.jumpH === 0) slow = 0.45;
  const spd = 242 * slow;
  if (inp.mx) { hero.face = Math.sign(inp.mx); hero.x += inp.mx * spd * dt; hero.run += dt * Math.abs(inp.mx) * 11; }
  if (inp.my) hero.lane = clamp(hero.lane + inp.my * 168 * slow * dt, 0, LANEH);
  if (inp.jump && hero.jumpH === 0) hero.vy = -660;
  if (hero.jumpH > 0 || hero.vy < 0) {
    hero.jumpH -= hero.vy * dt; hero.vy += 1750 * dt;
    if (hero.jumpH <= 0) { hero.jumpH = 0; hero.vy = 0; burst(hero.x, hero.lane, 0, PAL.stone, 4, 0.5); }
  }
  if (inp.slash) heroSlash();

  // gates & waves
  const gt = GATES[G.gate];
  if (gt && !waveSpawned && hero.x > gt.x - VW * 0.42) { spawnWave(G.gate); G.locked = true; }
  if (G.locked) {
    hero.x = clamp(hero.x, G.camX + 36, G.camX + VW - 46);
    if (waveSpawned && enemies.every((e) => e.dead)) {
      enemies = enemies.filter((e) => !e.dead);
      G.locked = false; waveSpawned = false; G.gate++; G.goT = 2.2;
      if (G.gate >= GATES.length) { G.state = 'win'; G.stateT = 0; }
    }
  }
  hero.x = clamp(hero.x, 26, WORLD_W - 30);

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    if (e.hurtT > 0) e.hurtT -= dt;
    if (e.kb) { e.x += e.kb * dt * 6; e.kb *= Math.pow(0.0018, dt); if (Math.abs(e.kb) < 4) e.kb = 0; }
    const dx = hero.x - e.x, adx = Math.abs(dx), dl = hero.lane - e.lane;
    e.face = dx >= 0 ? 1 : -1;
    if (e.state === 'walk') {
      if (adx > 30) e.x += Math.sign(dx) * e.speed * dt;
      if (Math.abs(dl) > 8) e.lane += clamp(dl, -1, 1) * 34 * dt;
      e.lane = clamp(e.lane, 0, LANEH);
      const range = e.kind === 'brute' ? 66 : 50;
      if (adx < range && Math.abs(dl) < 34 && hero.jumpH < 42) { e.state = 'windup'; e.windup = e.kind === 'brute' ? 0.42 : 0.34; }
    } else if (e.state === 'windup') {
      e.windup -= dt;
      if (e.windup <= 0) {
        e.state = 'swipe'; e.atkT = 0.16;
        const range = e.kind === 'brute' ? 104 : 64;
        if (Math.abs(hero.x - e.x) < range && Math.abs(hero.lane - e.lane) < 38 && hero.jumpH < 42) hurtHero(Math.sign(hero.x - e.x) || 1);
      }
    } else if (e.state === 'swipe') {
      e.atkT -= dt; if (e.atkT <= 0) { e.state = 'rest'; e.atkT = e.kind === 'brute' ? 0.7 : 0.55; }
    } else if (e.state === 'rest') {
      e.atkT -= dt; if (e.atkT <= 0) e.state = 'walk';
    }
    // brute paint-puddle squeeze
    if (e.kind === 'brute') {
      e.squeezeT -= dt;
      if (e.squeezeT <= 0 && Math.abs(hero.x - e.x) < 460) {
        e.squeezeT = 3.2;
        projectiles.push({ x: e.x, y: feetY(e.lane) - 130, tx: hero.x, tl: hero.lane, t: 0, dur: 0.72, sx: e.x });
        popup(e.x, feetY(e.lane) - 205, 'SQUEEZE!', PAL.paintLt);
      }
    }
    e.x = clamp(e.x, 20, WORLD_W - 20);
  }
  // projectiles -> puddles
  for (const p of projectiles) {
    p.t += dt;
    if (p.t >= p.dur) {
      puddles.push({ x: p.tx, lane: p.tl, r: 40, life: 6.5 });
      addSplat(p.tx, LANE0 + p.tl, PAL.paint, 30);
      p.done = true;
    }
  }
  projectiles = projectiles.filter((p) => !p.done);
  for (const p of puddles) p.life -= dt;
  puddles = puddles.filter((p) => p.life > 0);

  // camera
  const lastGate = G.gate >= GATES.length - 1;
  const camGoal = G.locked && gt
    ? (lastGate ? WORLD_W - VW : clamp(gt.x - VW * 0.45, 0, WORLD_W - VW))
    : clamp(hero.x - VW * 0.38, 0, WORLD_W - VW);
  G.camX += (camGoal - G.camX) * Math.min(1, dt * 5);

  updateFx(dt);
}
function updateFx(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.vz -= 1500 * dt; p.y -= p.vz * dt;
    if (p.vz < 0 && p.y >= HORIZON + p.laneDy) {
      if (!p.noSplat) addSplat(p.x, p.laneDy, p.color, p.size);
      p.done = true;
    }
  }
  particles = particles.filter((p) => !p.done && p.y < LH + 200);
  for (const a of arcs) a.t += dt;
  arcs = arcs.filter((a) => a.t < a.life);
  for (const p of popups) { p.t += dt; p.y -= 34 * dt; }
  popups = popups.filter((p) => p.t < 0.9);
}

// ---------------------------------------------------------------- drawing
function drawBackdrop() {
  // far sky (tiled, parallax 0.25)
  const sx = (G.camX * 0.25) % 1600;
  const destH = HORIZON + 110;
  const w1 = Math.min(VW, 1600 - sx);
  ctx.drawImage(farCv, sx, 0, w1, 620, 0, 0, w1, destH);
  if (w1 < VW) ctx.drawImage(farCv, 0, 0, VW - w1, 620, w1, 0, VW - w1, destH);
  // mid shopfronts (parallax 0.6) — lantern light pools are baked into it
  ctx.drawImage(midCv, G.camX * 0.6, 0, VW * 0.6, MID_H, 0, HORIZON + LANE0 - MID_H, VW, MID_H);
  // ground (world space)
  ctx.drawImage(groundCv, G.camX, 0, VW, 300, 0, HORIZON + 26, VW, Math.max(60, LH - HORIZON - 26));
  // permanent paint splatter (world space)
  ctx.drawImage(splatCv, G.camX, 0, VW, 320, 0, HORIZON, VW, 320);
  // puddles
  for (const p of puddles) {
    const px = p.x - G.camX, py = HORIZON + LANE0 + p.lane;
    const a = clamp(p.life / 1.2, 0, 1) * 0.9;
    PD(px, py, p.r * 2, p.r * 0.72, PAL.paintDk, 0, a * 0.75, 1);
    PD(px - 6, py - 3, p.r * 1.5, p.r * 0.5, PAL.paint, 0.2, a, 2);
    PD(px - p.r * 0.3, py - p.r * 0.16, p.r * 0.6, p.r * 0.18, PAL.paintLt, 0, a * 0.8, 0);
  }
}
function shadow(x, fy, w, jumpH) {
  ctx.save();
  ctx.globalAlpha = clamp(0.34 - jumpH * 0.0016, 0.08, 0.34);
  ctx.fillStyle = '#0b0a1c';
  ctx.beginPath(); ctx.ellipse(x, fy + 6, w * (1 - jumpH * 0.001), w * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawHero() {
  const sx = hero.x - G.camX, fy = feetY(hero.lane, hero.jumpH), f = hero.face;
  shadow(sx, feetY(hero.lane, 0), 30, hero.jumpH);
  const moving = hero.moving && hero.jumpH === 0;
  const rp = hero.run;
  const bob = hero.jumpH > 0 ? 0 : (moving ? Math.abs(Math.sin(rp)) * 3 : Math.sin(G.time * 2.1) * 1.6);
  const by = fy - bob; // body base (feet line adjusted)
  ctx.save();
  if (hero.dead) { ctx.translate(sx, fy - 8); ctx.rotate(f * 1.35); ctx.translate(-sx, -(fy - 8)); }
  const flash = hero.hurtT > 0 && Math.floor(G.time * 20) % 2 === 0;
  const P = flash ? HERO_PF : HERO_P;
  // legs
  const tuck = hero.jumpH > 0;
  const l1 = tuck ? 0.5 : Math.sin(rp) * (moving ? 13 : 2), l2 = tuck ? -0.4 : Math.sin(rp + Math.PI) * (moving ? 13 : 2);
  PP(P.leg, sx + l1 * f - 7, by - 20, (tuck ? 0.5 : Math.sin(rp) * 0.3) * f);
  PP(P.leg, sx + l2 * f + 8, by - 20, (tuck ? -0.4 : Math.sin(rp + Math.PI) * 0.3) * f);
  PP(P.foot, sx + l1 * f - 7 + f * 3, by - 4, 0); // feet
  PP(P.foot, sx + l2 * f + 8 + f * 3, by - 4, 0);
  // body (gi) — chest light + belt are painted into the torso sprite
  const lean = moving ? f * 0.07 : Math.sin(G.time * 2.1) * 0.02;
  PP(P.torso, sx, by - 56, lean);
  // head + headband
  PP(P.head, sx + f * 5, by - 102, 0);
  PP(P.band, sx + f * 5, by - 112, 0);
  PP(P.tails, sx - f * 14, by - 108, f * 0.5, 0.9); // band tails
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(sx + f * 11 - 2, by - 104, 4.4, 6); // eye
  // brush arm + the great brush
  let bang; // brush angle
  if (hero.slashT > 0) {
    const pr = 1 - hero.slashT / 0.22;
    if (hero.combo === 0) bang = -2.3 + pr * 3.1;
    else if (hero.combo === 1) bang = 0.9 - pr * 3.1;
    else bang = -2.9 + pr * 3.6;
    bang *= f;
  } else {
    bang = f * (moving ? 0.55 + Math.sin(rp) * 0.14 : 0.5 + Math.sin(G.time * 2.1) * 0.05);
  }
  const hx = sx + f * 22, hy = by - 62;
  const bl = 62; // brush length
  const bx = hx + Math.sin(bang) * bl, byy = hy + Math.cos(bang) * bl * 0.9 - 8;
  PP(P.handle, hx + Math.sin(bang) * bl * 0.45, hy + Math.cos(bang) * bl * 0.4 - 4, bang); // handle
  PP(P.ferrule, hx + Math.sin(bang) * bl * 0.78, hy + Math.cos(bang) * bl * 0.7 - 6, bang); // ferrule
  PP(P.bristle, bx, byy, bang + 0.15); // loaded bristles
  PP(P.hand, hx, hy, 0); // hand
  ctx.restore();
  // slash arcs — v2: no smooth vector stroke; a chain of tangent bristle
  // dabs laid along the arc, so the slash is a stroke of PAINT.
  for (const a of arcs) {
    const ax = a.x - G.camX, pr = a.t / a.life, al = (1 - pr) * 0.92;
    const r = 60 + a.step * 10 + pr * 26;
    const mid = a.face > 0 ? -0.2 : Math.PI + 0.2;
    const sweep = 2.2 * (a.step === 1 ? -1 : 1) * (a.face > 0 ? 1 : -1);
    const a0 = mid - sweep * (0.4 + pr * 0.6), a1 = mid + sweep * pr * 0.9;
    const N = 13;
    for (let i = 0; i <= N; i++) {
      const t = i / N, ang = a0 + (a1 - a0) * t;
      const px = ax + Math.cos(ang) * r, py = a.y + Math.sin(ang) * r;
      const fade = 0.45 + 0.55 * Math.sin(t * Math.PI);
      PD(px, py, 27 - pr * 9, 10.5 - pr * 3.5, a.color, ang + Math.PI / 2, al * fade, i % 3);
      if (i % 2 === 0) PD(px, py - 1, 13, 4.6, PAL.paintLt, ang + Math.PI / 2, al * fade * 0.65, (i + 1) % 3);
      if (i % 3 === 0) PD(px + Math.cos(ang) * 9, py + Math.sin(ang) * 9, 7, 5, a.color, ang, al * fade * 0.7, (i + 2) % 3); // flung droplets
    }
  }
  // finisher: one huge stroke across the play area — v2: a tapered chain of
  // overlapping bristle dabs with a lighter core, not a smooth line.
  if (G.finishT > 0) {
    const pr = 1 - G.finishT / 0.45;
    const x0 = sx - hero.face * 30, y0 = fy - 190, x1 = sx + hero.face * (60 + pr * 480), y1 = fy - 190 + (60 + pr * 300);
    const ang = Math.atan2(y1 - y0, x1 - x0);
    const N = 17;
    for (let i = 0; i <= N; i++) {
      const k = (i / N) * pr;
      if (k > pr) break;
      const px = x0 + (x1 - x0) * k, py = y0 + (y1 - y0) * k;
      const taper = Math.sin(Math.min(1, k / Math.max(pr, 0.01)) * Math.PI * 0.82 + 0.18);
      const al = (1 - pr) * (0.55 + 0.45 * taper);
      PD(px, py, 30 + 30 * taper, 12 + 15 * taper, i % 3 === 2 ? PAL.paintDk : PAL.paint, ang, al, i % 3);
      PD(px - Math.sin(ang) * 5, py - Math.cos(ang) * 5 * -1, 20 + 16 * taper, 6 + 6 * taper, PAL.paintLt, ang, al * 0.55, (i + 1) % 3);
      if (i % 2 === 0) PD(px + rnd(-24, 24), py + rnd(-16, 20), rnd(6, 13), rnd(4, 8), PAL.paint, ang * 0.4, al * 0.75, (i + 2) % 3); // spray
    }
  }
}
function drawSoldier(e) {
  const sx = e.x - G.camX, fy = feetY(e.lane), f = e.face;
  shadow(sx, fy, 26, 0);
  const wob = Math.sin(e.t * 7 + e.id * 2.4);
  const w = 46 * (1 + wob * 0.045), h = 54 * (1 - wob * 0.05);
  const flash = e.hurtT > 0;
  const bodyC = flash ? PAL.white : PAL.ink;
  const S = flash ? SOL_PF : SOL_P[e.id % 3];
  // shuffling feet
  const st = Math.sin(e.t * 10 + e.id) * (e.state === 'walk' ? 5 : 1);
  PP(S.foot, sx - 11 + st, fy - 4, 0);
  PP(S.foot, sx + 11 - st, fy - 4, 0);
  // glossy blob body — sheen + gloss spot are painted into the sprite
  PP(S.body, sx, fy - h / 2 - 4, wob * 0.03, 1, w / 46, h / 54);
  // eyes track the hero
  const look = clamp((hero.x - e.x) * 0.02, -1.6, 1.6);
  for (const s of [-1, 1]) {
    ctx.fillStyle = PAL.white;
    ctx.beginPath(); ctx.arc(sx + f * 7 + s * 9, fy - h * 0.62, 6.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(sx + f * 7 + s * 9 + look, fy - h * 0.62 + 1, 3.1, 0, Math.PI * 2); ctx.fill();
  }
  // swipe claw
  if (e.state === 'windup') PD(sx + f * 26, fy - h * 0.7, 20, 10, bodyC, -f * 0.7, 1, 2);
  if (e.state === 'swipe') {
    PD(sx + f * 30, fy - h * 0.45, 26, 11, bodyC, f * 0.9, 1, 2);
    for (let i = 0; i <= 5; i++) { // dab-chain swipe arc (no smooth vector stroke)
      const base = -0.9 + (i / 5) * 1.4;
      const aA = f > 0 ? base : Math.PI - base;
      PD(sx + Math.cos(aA) * 40, fy - h * 0.5 + Math.sin(aA) * 40, 12, 5, PAL.white, aA + Math.PI / 2, 0.45, i % 3);
    }
  }
  if (e.hp < e.maxHp) for (let i = 0; i < e.hp; i++) PD(sx - 12 + i * 12, fy - h - 16, 8, 8, PAL.paint, 0, 0.9, i);
}
function drawBrute(e) {
  const sx = e.x - G.camX, fy = feetY(e.lane), f = e.face;
  shadow(sx, fy, 52, 0);
  const flash = e.hurtT > 0;
  const B = flash ? BRU_PF : BRU_P;
  const squash = e.squeezeT < 0.45 ? 0.86 : 1 + Math.sin(e.t * 3) * 0.012;
  const st = Math.sin(e.t * 6) * 4;
  PP(B.foot, sx - 24 + st, fy - 8, 0); // feet
  PP(B.foot, sx + 24 - st, fy - 8, 0);
  ctx.save(); ctx.translate(sx, fy); ctx.scale(1, squash); ctx.translate(-sx, -fy);
  // tube body: painted segments, wide base to crimped top
  PP(B.low, sx, fy - 52, 0);
  PP(B.mid, sx, fy - 106, 0);
  PP(B.crimp, sx, fy - 148, 0); // crimped seal
  PP(B.teeth, sx, fy - 166, 0); // crimp teeth
  // label band with the paint colour it holds (white stripe painted in)
  PP(B.label, sx, fy - 92, 0);
  // cap worn as a hat
  PP(B.cap, sx + 4, fy - 182, 0.06);
  // angry eyes on the tube
  for (const s of [-1, 1]) {
    ctx.fillStyle = PAL.white;
    ctx.beginPath(); ctx.arc(sx + f * 8 + s * 16, fy - 128, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(sx + f * 8 + s * 16 + f * 2.5, fy - 128, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(sx + f * 8 + s * 24, fy - 142); ctx.lineTo(sx + f * 8 + s * 8, fy - 137); ctx.stroke();
  }
  // arms
  const swing = e.state === 'swipe' ? 1 : 0;
  PP(B.arm, sx - 56, fy - 96 + Math.sin(e.t * 6) * 4, 0.25);
  PP(B.arm, sx + f * (56 + swing * 22), fy - (swing ? 66 : 96), swing ? f * 1.2 : -0.25);
  ctx.restore();
  // hp bar
  if (e.hp < e.maxHp) {
    ctx.save();
    ctx.fillStyle = 'rgba(10,8,24,0.55)'; ctx.fillRect(sx - 52, fy - 206, 104, 10);
    ctx.fillStyle = PAL.paint; ctx.fillRect(sx - 50, fy - 204, 100 * (e.hp / e.maxHp), 6);
    ctx.restore();
  }
}
function drawFx() {
  for (const p of particles) {
    PD(p.x - G.camX, p.y, p.size, p.size * 0.62, p.color, p.x * 0.02, 0.95, p.v);
  }
  for (const p of projectiles) {
    const k = p.t / p.dur;
    const px = p.sx + (p.tx - p.sx) * k - G.camX;
    const py = p.y + (feetY(p.tl) - p.y) * k - Math.sin(k * Math.PI) * 130;
    PD(px, py, 21, 18, PAL.paint, k * 5, 1, 1);
    PD(px - 3, py - 5, 9, 7, PAL.paintLt, 0, 0.9, 0);
  }
  for (const p of popups) {
    ctx.save();
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.font = '800 19px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(12,10,26,0.8)';
    const px = p.x - G.camX;
    ctx.strokeText(p.txt, px, p.y); ctx.fillStyle = p.color; ctx.fillText(p.txt, px, p.y);
    ctx.restore();
  }
}
function heart(x, y, s, filled) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.85);
  ctx.bezierCurveTo(x - s * 1.15, y + s * 0.1, x - s * 0.62, y - s * 0.85, x, y - s * 0.25);
  ctx.bezierCurveTo(x + s * 0.62, y - s * 0.85, x + s * 1.15, y + s * 0.1, x, y + s * 0.85);
  ctx.fillStyle = filled ? PAL.heart : 'rgba(245,239,226,0.16)';
  ctx.fill();
  if (filled) { ctx.globalAlpha = 0.5; ctx.fillStyle = PAL.paintLt; ctx.beginPath(); ctx.arc(x - s * 0.34, y - s * 0.2, s * 0.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function drawHUD() {
  ctx.save();
  for (let i = 0; i < hero.maxHp && i < 12; i++) heart(26 + i * 27, 30, 11, i < hero.hp);
  ctx.font = '800 21px system-ui, sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(12,10,26,0.45)';
  const sw = ctx.measureText('SCORE ' + G.score).width;
  ctx.fillRect(VW - sw - 26, 10, sw + 16, 30);
  ctx.fillStyle = 'rgba(245,239,226,0.94)';
  ctx.fillText('SCORE ' + G.score, VW - 18, 33);
  if (G.locked) {
    const left = enemies.filter((e) => !e.dead).length;
    ctx.textAlign = 'center'; ctx.font = '800 14px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(245,239,226,0.85)';
    ctx.fillText(left + (left === 1 ? ' FOE' : ' FOES') + ' LEFT', VW / 2, 60);
  }
  ctx.restore();
}
function card(title, lines, accent) {
  const w = Math.min(470, VW - 36), h = 62 + lines.length * 30 + 34;
  const x = (VW - w) / 2, y = LH * 0.34;
  ctx.save();
  ctx.fillStyle = 'rgba(16,14,36,0.84)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill();
  for (let xx = x + 12; xx < x + w - 10; xx += 22) { PD(xx, y + 3, 20, 7, accent, 0, 0.9, xx % 3); PD(xx, y + h - 3, 20, 7, accent, 0, 0.9, (xx + 1) % 3); }
  ctx.textAlign = 'center';
  ctx.fillStyle = accent; ctx.font = '900 37px Georgia, serif';
  ctx.fillText(title, VW / 2, y + 52);
  ctx.fillStyle = 'rgba(245,239,226,0.95)'; ctx.font = '600 17px system-ui, sans-serif';
  lines.forEach((ln, i) => ctx.fillText(ln, VW / 2, y + 88 + i * 30));
  ctx.restore();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAL.skyTop; ctx.fillRect(0, 0, cv.width, cv.height);
  const shX = G.shakeT > 0 ? rnd(-1, 1) * G.shakeT * 22 : 0;
  const shY = G.shakeT > 0 ? rnd(-1, 1) * G.shakeT * 14 : 0;
  ctx.setTransform(SCALE, 0, 0, SCALE, shX * SCALE, shY * SCALE);
  drawBackdrop();
  // entities sorted back-to-front by lane
  const ents = [{ hero: true, lane: hero.lane }, ...enemies.filter((e) => !e.dead).map((e) => ({ hero: false, lane: e.lane, e }))];
  ents.sort((a, b) => a.lane - b.lane);
  for (const en of ents) { if (en.hero) drawHero(); else if (en.e.kind === 'brute') drawBrute(en.e); else drawSoldier(en.e); }
  if (!ents.some((e) => e.hero)) drawHero();
  drawFx();
  drawHUD();
  if (G.goT > 0 && G.state === 'play') {
    ctx.save();
    ctx.globalAlpha = clamp(G.goT, 0, 1);
    ctx.font = '900 44px Georgia, serif'; ctx.textAlign = 'right';
    const bx = VW - 60 + Math.sin(G.time * 9) * 8;
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(12,10,26,0.7)';
    ctx.strokeText('GO →', bx, LH * 0.42);
    ctx.fillStyle = PAL.gold; ctx.fillText('GO →', bx, LH * 0.42);
    ctx.restore();
  }
  if (G.state === 'title') card('INK RONIN', ['paint the street!', DEMO ? '(demo mode — auto-fighting)' : 'drag / WASD · A = slash · B = jump', 'tap or press any key to start'], PAL.gold);
  else if (G.state === 'win') card('STREET PAINTED!', ['score ' + G.score + '  ·  ' + splatCount + ' paint splats left behind', 'tap to paint it again'], PAL.paintLt);
  else if (G.state === 'over') card('THE STREET WINS…', ['score ' + G.score + '  ·  the ink dries over you', 'tap to retry'], PAL.teal);
}

// ---------------------------------------------------------------- loop
let lastT = performance.now();
function frame(now) {
  let dt = Math.min((now - lastT) / 1000, 0.033);
  lastT = now;
  G.frames = (G.frames || 0) + 1;
  hero.moving = false;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (DEMO) startGame();

// ---------------------------------------------------------------- debug hook
window.__dbg = {
  get state() { return G.state; },
  get heroHp() { return hero.hp; },
  get score() { return G.score; },
  get splats() { return splatCount; },
  get enemies() { return enemies.filter((e) => !e.dead).length; },
  get heroX() { return Math.round(hero.x); },
  get gate() { return G.gate; },
  get locked() { return G.locked; },
  get frames() { return G.frames || 0; },
  start() { startGame(); },
  warp(x) { hero.x = clamp(x, 30, WORLD_W - 40); },
  setGate(g) { G.gate = g; waveSpawned = false; G.locked = false; enemies = []; },
  god() { hero.hp = 99; },
  slash() { heroSlash(); },
  hero,
};
</script>
</body>
