<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Room Reacts — the room joins the scene</title>
<link href="vendor/fonts/fonts-local.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
  #fbcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  body.mode-fallback #fbcanvas { display: block; }
  #modelabel {
    position: absolute; top: calc(64px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 50;
    text-align: center; color: #fff; font-family: 'Anton', sans-serif; font-size: 22px;
    letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 2px 12px #000;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #modelabel.show { opacity: .92; }
  .pillrow {
    position: absolute; left: 0; right: 0; z-index: 1100;
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; padding: 6px 12px; overflow-x: auto; scrollbar-width: none;
  }
  .pillrow::-webkit-scrollbar { display: none; }
  .modepill {
    flex: 0 0 auto; z-index: 1100; min-height: 56px; padding: 12px 18px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.35); background: rgba(10,10,16,.78); color: #fff;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .06em;
    text-transform: uppercase; cursor: pointer; backdrop-filter: blur(4px);
  }
  .modepill.on { background: #fff; color: #111; border-color: #fff; }
  .modepill[data-mode="auto"].on { background: #00e5ff; border-color: #00e5ff; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <div id="fallback"><canvas id="fbcanvas"></canvas></div>
  <canvas id="fx"></canvas>
  <div id="modelabel"></div>

  <div class="topbar">
    <div class="title">Room Reacts</div>
    <div class="spacer"></div>
    <button class="chipbtn" id="alignbtn">Align TV</button>
  </div>

  <div class="pillrow" id="pillrow">
    <button class="modepill on" data-mode="off">Off</button>
    <button class="modepill" data-mode="explosion">🔥 Explosion</button>
    <button class="modepill" data-mode="underwater">🌊 Underwater</button>
    <button class="modepill" data-mode="horror">👻 Horror</button>
    <button class="modepill" data-mode="celebration">✨ Celebration</button>
    <button class="modepill" data-mode="auto">Auto · Match TV</button>
  </div>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>

<style id="universal-offsets">#ci-root.ci-tl{top:63px!important}#ar-mark-root{bottom:80px!important}</style>
<script src="mark-button.js"></script>
<script src="mic-trigger.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
var __cbs = { onSpike: function () { var p = document.querySelectorAll('.modepill'); if (p.length) { var i = Math.floor(Math.random() * p.length); p[i].click(); } } };
var __micStarted = false;
document.addEventListener('pointerdown', function () { if (!__micStarted && window.MicTrigger) { __micStarted = true; MicTrigger.start(__cbs).catch(function () {}); } }, false);
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { window.ARShared.initCamera(v, function () {}); }, canvas: document.getElementById('fbcanvas'), onSource: function (info) {
      if (info.mode === 'import') { if (window.MicTrigger) MicTrigger.stop(); ClipImport.startTriggers(__cbs); }
      if (info.mode === 'camera') { ClipImport.stopTriggers(); __micStarted = false; }
    }
  });
</script>
<script src="clean-view.js"></script>
<script>
/* ---- clean view + pinch zoom (owner feedback fix 2026-11-16) ---- */
CleanView.init({ mode: 'stage' });
</script>
</body>
</html>
