<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RADIO VISUALIZER — AR Clip Studio</title>
<style>
  @font-face{ font-family:'Monoton'; src:url('assets/monoton.woff2') format('woff2'); font-display:swap; }
  @font-face{ font-family:'Anton'; src:url('assets/anton.woff2') format('woff2'); font-display:swap; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#000; touch-action:none; overscroll-behavior:none;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#fff; }
  #cam{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
  body.nocam #cam{ display:none; }
  .room{ position:fixed; inset:0; z-index:1; display:none;
    background:linear-gradient(#262a36 0%, #2e3342 54%, #14151a 54.2%, #0c0c10 100%); }
  body.nocam .room{ display:block; }
  .fake-tv{ position:absolute; left:6%; top:19%; width:88%; height:41%; border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 6px #050507, 0 24px 60px rgba(0,0,0,.7); }
  .fake-tv .feed{ position:absolute; inset:0;
    background:linear-gradient(115deg,#0d3b5e,#8a2050 32%,#0d5c48 58%,#c96a1e 82%,#0d3b5e);
    background-size:300% 100%; animation:feedslide 9s linear infinite; }
  @keyframes feedslide{ from{ background-position:0% 0; } to{ background-position:300% 0; } }
  .fake-tv .tag{ position:absolute; left:10px; bottom:8px; color:#fff; font-size:11px; letter-spacing:.14em;
    background:rgba(0,0,0,.55); padding:3px 8px; border-radius:4px; }
  .couch{ position:absolute; left:9%; right:9%; bottom:6%; height:11%; border-radius:18px 18px 0 0;
    background:linear-gradient(#23242c,#131318); }
  #viz{ position:fixed; inset:0; z-index:500; pointer-events:none; }
  /* radio dial */
  #dial{ position:fixed; z-index:900; width:248px; margin-left:-124px; padding:12px 14px 10px;
    background:rgba(10,6,18,.82); border:2px solid #ff2e88; border-radius:16px;
    box-shadow:0 0 18px rgba(255,46,136,.75), 0 0 46px rgba(255,46,136,.35), inset 0 0 18px rgba(255,46,136,.25);
    backdrop-filter:blur(4px); pointer-events:none; }
  #dialName{ font-family:'Monoton'; font-size:21px; text-align:center; color:#a5f3fc;
    text-shadow:0 0 6px #22d3ee, 0 0 16px #22d3ee, 0 0 34px rgba(34,211,238,.6); letter-spacing:.04em; white-space:nowrap; }
  #dialFreq{ text-align:center; font-size:11px; letter-spacing:.34em; color:#ffb3d1; margin-top:2px; }
  #dialScale{ position:relative; height:26px; margin-top:8px; border-top:2px solid rgba(255,255,255,.35); }
  #dialScale .tick{ position:absolute; top:0; width:2px; height:8px; background:rgba(255,255,255,.55); }
  #dialScale .tick.big{ height:13px; background:#fff; }
  #dialScale .num{ position:absolute; top:13px; font-size:8.5px; color:rgba(255,255,255,.65); transform:translateX(-50%); }
  #needle{ position:absolute; top:-4px; width:3px; height:32px; background:#ff3355; border-radius:2px;
    box-shadow:0 0 8px #ff3355, 0 0 18px rgba(255,51,85,.8); }
  #dialSub{ text-align:center; font-size:10px; letter-spacing:.28em; color:rgba(255,255,255,.55); margin-top:5px; }
  /* UI */
  .chip{ position:fixed; z-index:1100; background:rgba(12,12,18,.78); color:#fff; border:1px solid rgba(255,255,255,.28);
    border-radius:999px; padding:9px 14px; font-size:13px; letter-spacing:.08em; backdrop-filter:blur(6px); }
  #titleChip{ top:calc(10px + env(safe-area-inset-top)); left:12px; font-family:'Anton'; font-size:15px; }
  #alignBtn{ top:calc(10px + env(safe-area-inset-top)); right:12px; }
  #modeChip{ top:calc(52px + env(safe-area-inset-top)); left:12px; color:#7df9ff; }
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:1100; display:flex; gap:12px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .btn{ flex:1; min-height:60px; border-radius:16px; border:1px solid rgba(255,255,255,.35);
    font-family:'Anton'; font-size:19px; letter-spacing:.05em; color:#fff; background:rgba(14,14,20,.85);
    backdrop-filter:blur(8px); touch-action:manipulation; }
  .btn:active{ transform:scale(.965); }
  #btnMic.live{ color:#7df9ff; box-shadow:0 0 22px rgba(34,211,238,.4); }
  #quadSvg{ position:fixed; inset:0; z-index:1060; pointer-events:none; display:none; }
  body.aligning #quadSvg{ display:block; }
  .handle{ position:fixed; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; z-index:1200;
    background:rgba(255,46,136,.85); border:3px solid #fff; display:none; touch-action:none; }
  body.aligning .handle{ display:block; }
</style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div class="room">
    <div class="fake-tv"><div class="feed"></div><div class="tag">SAMPLE FEED — CAMERA OFF</div></div>
    <div class="couch"></div>
  </div>
  <canvas id="viz"></canvas>

  <div id="dial">
    <div id="dialName">NEON 98.5</div>
    <div id="dialFreq">F M</div>
    <div id="dialScale"><div id="needle"></div></div>
    <div id="dialSub">STEREO · NEON DRIVE TIME</div>
  </div>

  <div class="chip" id="titleChip">RADIO&nbsp;VISUALIZER</div>
  <button class="chip" id="alignBtn">ALIGN&nbsp;TV</button>
  <div class="chip" id="modeChip">DEMO MODE</div>
  <div class="bar">
    <button class="btn" id="btnMic">🎙 GO LIVE MIC</button>
    <button class="btn" id="btnStation">📻 STATION</button>
  </div>

  <svg id="quadSvg"><polygon id="quadPoly" fill="rgba(255,46,136,.10)" stroke="#ff2e88" stroke-width="2"/></svg>
  <div class="handle" data-i="0"></div><div class="handle" data-i="1"></div>
  <div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>

<script>
'use strict';
/* ================= THEME (skin-pack config — swap this object to reskin) ================= */
const THEME = {
  pack: 'leonida-default',
  barCount: 30,
  colorLow: '#ff2e88', colorHigh: '#22d3ee', colorPeak: '#ffffff',
  stations: [
    { name:'NEON 98.5',        freq: 98.5,  sub:'STEREO · NEON DRIVE TIME' },
    { name:'PALM WAVE FM',      freq: 101.3, sub:'ALL BEACH · ALL DAY' },
    { name:'MIDNIGHT CRUISE',   freq: 106.9, sub:'SLOW JAMS FOR FAST CARS' },
    { name:'COASTAL STATIC',    freq: 88.1,  sub:'BETWEEN STATIONS · PURE VIBES' }
  ],
  freqMin: 88, freqMax: 108
};
/* ================= shared scaffold ================= */
const $ = s => document.querySelector(s);
let AC = null;
function audio(){ try{ if (navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state==='suspended') AC.resume(); return AC; }
document.addEventListener('pointerdown', audio);
document.addEventListener('gesturestart', e=> e.preventDefault());
async function startCam(){ const v = $('#cam');
  try{ const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    v.srcObject = s; await v.play(); window.__camLive = true;
  }catch(e){ document.body.classList.add('nocam'); window.__fallback = true; } }
const QKEY = 'arquad-radio-visualizer';
let quad = [[.07,.21],[.93,.21],[.93,.60],[.07,.60]];
try{ const q = JSON.parse(localStorage.getItem(QKEY)); if (Array.isArray(q)&&q.length===4) quad = q; }catch(e){}
const handles = [...document.querySelectorAll('.handle')];
function applyQuad(){ const W=innerWidth,H=innerHeight;
  handles.forEach((h,i)=>{ h.style.left=quad[i][0]*W+'px'; h.style.top=quad[i][1]*H+'px'; });
  $('#quadPoly').setAttribute('points', quad.map(p=>(p[0]*W)+','+(p[1]*H)).join(' '));
  layoutDial(); }
handles.forEach(h=>{ h.addEventListener('pointerdown', e=>{ h.setPointerCapture(e.pointerId);
  const move = ev=>{ const i=+h.dataset.i;
    quad[i]=[Math.min(.98,Math.max(.02,ev.clientX/innerWidth)), Math.min(.98,Math.max(.02,ev.clientY/innerHeight))]; applyQuad(); };
  const up = ()=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up);
    try{ localStorage.setItem(QKEY, JSON.stringify(quad)); }catch(e){} };
  h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); e.preventDefault(); }); });
$('#alignBtn').addEventListener('click', ()=> document.body.classList.toggle('aligning'));
addEventListener('resize', ()=>{ sizeCanvas(); applyQuad(); });

/* dial */
const dial = $('#dial'), scaleEl = $('#dialScale'), needle = $('#needle');
(function buildScale(){
  for (let f = THEME.freqMin; f <= THEME.freqMax; f += 2){
    const x = (f-THEME.freqMin)/(THEME.freqMax-THEME.freqMin)*100;
    const t = document.createElement('div'); t.className = 'tick' + (f%10===0?' big':''); t.style.left = x+'%';
    scaleEl.appendChild(t);
    if (f%10===0){ const n = document.createElement('div'); n.className='num'; n.style.left = x+'%'; n.textContent = f; scaleEl.appendChild(n); }
  }
})();
let stationIdx = 0, needleX = .5, needleTarget = .5;
function layoutDial(){
  const cx = (quad[0][0]+quad[1][0])/2 * innerWidth;
  const topY = Math.min(quad[0][1], quad[1][1]) * innerHeight;
  dial.style.left = cx+'px';
  dial.style.top = Math.max(8, topY - 148)+'px';
  needleTarget = (THEME.stations[stationIdx].freq - THEME.freqMin)/(THEME.freqMax-THEME.freqMin);
}
function setStation(i){
  stationIdx = i % THEME.stations.length;
  const st = THEME.stations[stationIdx];
  $('#dialName').textContent = st.name;
  $('#dialSub').textContent = st.sub;
  layoutDial();
}
$('#btnStation').addEventListener('click', ()=> setStation(stationIdx+1));

/* ================= analyser ================= */
const cv = $('#viz'), ctx = cv.getContext('2d');
let analyser = null, freqData = null, micLive = false;
function sizeCanvas(){ const d = Math.min(2, devicePixelRatio||1);
  cv.width = innerWidth*d; cv.height = innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
sizeCanvas();
async function goMic(){
  const ac = audio(); if (!ac) return false;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false }, video:false });
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = .62;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser); micLive = true;
    $('#modeChip').textContent = '🎙 MIC LIVE';
    $('#btnMic').textContent = '🎙 MIC LIVE'; $('#btnMic').classList.add('live');
    window.__micLive = true; return true;
  }catch(e){
    micLive = false; $('#modeChip').textContent = 'DEMO MODE (mic unavailable)';
    window.__micError = String(e && e.name || e); return false;
  }
}
$('#btnMic').addEventListener('click', goMic);
/* demo signal: layered sines + a beat */
function demoLevel(i, t){
  const ph = i * .55;
  let v = .34 + .30*Math.sin(t*2.1 + ph) * Math.sin(t*.7 + ph*1.7)
        + .22*Math.sin(t*5.3 + ph*2.9) + .14*Math.sin(t*11.0 + ph*4.1);
  const beat = Math.pow(Math.max(0, Math.sin(t*2.4)), 6) * .5 * Math.exp(-i/9);
  v += beat;
  const falloff = 1 - (i/THEME.barCount)*.35;
  return Math.max(.04, Math.min(1, v * falloff + .06));
}
function micLevel(i, sampleRate){
  const nyq = sampleRate/2;
  const fMin = 40, fMax = 12000;
  const f = fMin * Math.pow(fMax/fMin, i/(THEME.barCount-1));
  const bin = Math.round(f/nyq * (analyser.frequencyBinCount-1));
  let sum = 0, n = 0;
  for (let b = Math.max(0,bin-1); b <= Math.min(freqData.length-1, bin+1); b++){ sum += freqData[b]; n++; }
  return Math.pow((sum/n)/255, 1.25) * 1.5;
}
const levels = new Array(THEME.barCount).fill(0);
function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
const cL = hexRgb(THEME.colorLow), cH = hexRgb(THEME.colorHigh);
function draw(t){
  requestAnimationFrame(draw);
  const W = innerWidth, H = innerHeight;
  ctx.clearRect(0,0,W,H);
  if (micLive && analyser) analyser.getByteFrequencyData(freqData);
  const TL = [quad[0][0]*W, quad[0][1]*H], TR = [quad[1][0]*W, quad[1][1]*H];
  const ex = TR[0]-TL[0], ey = TR[1]-TL[1], elen = Math.hypot(ex,ey) || 1;
  let nx = -ey/elen, ny = ex/elen; if (ny > 0){ nx = -nx; ny = -ny; } /* normal pointing up-screen */
  const maxH = H * .27, N = THEME.barCount;
  let bass = 0;
  for (let i=0;i<N;i++){
    const target = (micLive && analyser) ? micLevel(i, AC ? AC.sampleRate : 44100) : demoLevel(i, t/1000);
    levels[i] = Math.max(target, levels[i] - .028);           /* fast attack, smooth decay */
    if (i < 5) bass += levels[i];
    const f0 = i/N, f1 = (i+1)/N;
    const bx = TL[0] + ex*f0, by = TL[1] + ey*f0;
    const bw = elen/N * .62;
    const h = Math.max(3, levels[i] * maxH);
    const cxp = bx + ex/N/2, cyp = by + ey/N/2;
    const mixv = levels[i];
    const col = `rgb(${Math.round(cL[0]+(cH[0]-cL[0])*mixv)},${Math.round(cL[1]+(cH[1]-cL[1])*mixv)},${Math.round(cL[2]+(cH[2]-cL[2])*mixv)})`;
    ctx.save();
    ctx.translate(cxp, cyp); ctx.rotate(Math.atan2(ny, nx) + Math.PI/2);
    ctx.shadowColor = col; ctx.shadowBlur = 16;
    const grad = ctx.createLinearGradient(0,0,0,-h);
    grad.addColorStop(0, THEME.colorLow); grad.addColorStop(1, col);
    ctx.fillStyle = grad;
    const r = Math.min(5, bw/2);
    ctx.beginPath(); ctx.roundRect(-bw/2, -h, bw, h, r); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillRect(-bw/2, -h-3, bw, 2.5);                        /* peak cap */
    ctx.restore();
  }
  bass /= 5;
  needleX += ((needleTarget + (bass-.45)*.05) - needleX) * .08;
  needle.style.left = (Math.min(.97, Math.max(.03, needleX))*100)+'%';
}
applyQuad(); setStation(0); startCam();
requestAnimationFrame(draw);
</script>

<style id="universal-offsets">#ci-root.ci-tl{top:53px!important}#ar-mark-root{bottom:82px!important}</style>
<script src="mark-button.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { return window.startCam(); }, canvas: document.getElementById('viz')
  });
</script>
</body>
</html>
