<title>Maze Wrecker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One arcade cabinet column: 256x224 pixel screen on top, NES-style pad below, built for a phone held upright. */
:root{
  --bg:#0d0e13;
  --frame:#c9c5b7;
  --face:#26262a;
  --ink:#17171a;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  min-height:100%;
  padding-block:12px 20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;justify-content:center;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cab{width:100%;max-width:512px;display:flex;flex-direction:column;gap:14px;min-width:0}
.screen-wrap{background:#000;border:3px solid var(--frame);border-radius:10px;overflow:hidden;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/224;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dpad ab" "mid mid";
  gap:14px 10px;align-items:center;
  background:var(--frame);border-radius:14px;padding:16px 14px 14px;
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:148px;height:148px;touch-action:none;justify-self:start}
.bar{position:absolute;background:var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px #2d2d33}
.bar.h{left:0;right:0;top:calc(50% - 25px);height:50px}
.bar.v{top:0;bottom:0;left:calc(50% - 25px);width:50px}
.hub{position:absolute;left:calc(50% - 14px);top:calc(50% - 14px);width:28px;height:28px;border-radius:50%;background:#101013}
.ar{position:absolute;background:#55555c}
.ar.u{top:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:flex-start;gap:16px;background:var(--face);border-radius:12px;padding:16px 10px 10px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:8px}
.round{
  width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 16px var(--pixel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 9px var(--pixel);color:#c9c5b7;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;justify-content:center;gap:22px}
.mid button{
  border:0;background:var(--ink);color:#c9c5b7;font:400 10px var(--pixel);
  padding:10px 14px;border-radius:999px;cursor:pointer;touch-action:none;min-width:96px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{margin:0;color:var(--muted);font-size:12px;line-height:1.6;text-align:center;text-wrap:balance}
.keys b{color:var(--text);font-weight:500}
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Maze Wrecker game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, DASH">B</button><span>DASH</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, SMASH">A</button><span>SMASH</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> arrows move, Z or Space swings the hammer (smash the wall in front of you or stun a patrol bot), X dashes, Enter starts, M mutes. Wrecked walls reveal dots; collect 20 before the timer seals the maze. Walls grow back.</p>
</main>

<script>
(() => {
'use strict';
/* ---------- shared NES core: pixel buffer, palette, text, audio, input ---------- */
const VW = 256, VH = 224;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(VW, VH);
const px32 = new Uint32Array(img.data.buffer);
const buf = new Uint8Array(VW * VH);
const HEX = ['#000000','#fcfcfc','#bcbcbc','#7c7c7c','#18a838','#006800','#d82800','#f8b800','#0038d8','#000088','#fca044','#a85800','#503000','#b800b8','#f87858','#3cbcfc','#58d854','#f8f8b8','#f8a4c0','#5c94fc','#383838','#c84c0c'];
const K=0,W=1,L=2,D=3,GR=4,F=5,R=6,Y=7,B=8,N=9,S=10,T=11,M=12,PU=13,O=14,CY=15,E=16,V=17,PK=18,SKY=19,DG=20,BRK=21;
const CH = { K,W,L,D,G:GR,F,R,Y,B,N,S,T,M,P:PU,O,C:CY,E,V,Q:PK,U:SKY,Z:DG,H:BRK };
const PAL32 = HEX.map(h => {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0;
});
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rad = Math.PI / 180;
function hash(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);

function mkRng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/* ?seed=N (or any string) makes every run reproducible. Without it: attract mode uses its fixed seed, real play a per-run seed.

const SEED_Q = (() => { try {
  const v = new URLSearchParams(location.search).get('seed'); if (v == null || v === '') return null;
  if (Number.isFinite(Number(v))) return Number(v) >>> 0;
  let h = 2166136261; for (let i = 0; i < v.length; i++) h = Math.imul(h ^ v.charCodeAt(i), 16777619); return h >>> 0;
} catch (_) { return null; } })();
let activeSeed = null, vrngS = null;
function runSeed(fixed, off) {
  off = off || 0;
  activeSeed = SEED_Q != null ? (SEED_Q + off) >>> 0 : fixed != null ? fixed : ((Date.now() & 0xffff) + off) >>> 0;
  vrngS = mkRng(activeSeed ^ 0x9e3779b9);
  return activeSeed;
}
const vr = () => (vrngS || (vrngS = mkRng(1)))();   /* visual-only randomness (particles, popups): seeded, never gameplay */
function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || x >= VW || y < 0 || y >= VH) return; buf[y * VW + x] = c; }
function rect(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const x0 = Math.max(0, x), x1 = Math.min(VW, x + w), y0 = Math.max(0, y), y1 = Math.min(VH, y + h);
  if (x1 <= x0) return;

}
function clear(c) { buf.fill(c); }
function spr(rows, x, y, flip, pal) {
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], w = row.length;
    for (let c = 0; c < w; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      const col = pal && pal[ch] !== undefined ? pal[ch] : CH[ch];
      px(flip ? x + w - 1 - c : x + c, y + r, col);

}
function fillCircle(cx, cy, r, c) {
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * 0.5) px(cx + i, cy + j, c);
}

/* text drawn on the 2d context after the pixel buffer is blitted */
const FONT = s => `${s}px "Press Start 2P", ui-monospace, monospace`;
function txt(s, x, y, col, size, align, shadow) {
  size = size || 8;
  ctx.font = FONT(size); ctx.textBaseline = 'top'; ctx.textAlign = align || 'left';
  if (shadow !== false) { ctx.fillStyle = '#000'; const o = size >= 16 ? 2 : 1; ctx.fillText(s, x + o, y + o); }
  ctx.fillStyle = typeof col === 'number' ? HEX[col] : col; ctx.fillText(s, x, y);

  ctx.fillStyle = HEX[bg === undefined ? N : bg]; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = HEX[W]; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x, y, 2, h); ctx.fillRect(x + w - 2, y, 2, h);
}
const pad5 = n => String(Math.max(0, Math.round(n))).padStart(5, '0');
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;

/* ---------- audio (square-wave chip tune) ---------- */
let AC = null, master = null, muted = false, step16 = 0, nextT = 0;
/* iOS: the silent switch mutes Web Audio unless the page's audio session is 'playback'; contexts also start 'suspended'/'interrupted'
   until a real gesture (touchend/click/keydown; pointerdown alone does not count on Safari). */
function iosAudioFix() { try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {} }

  iosAudioFix();

  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.16; master.connect(AC.destination);
    try { const sb = AC.createBuffer(1, 1, 22050), ss = AC.createBufferSource(); ss.buffer = sb; ss.connect(AC.destination); ss.start(0); } catch (_) {}

['touchend', 'click', 'keydown', 'pointerup'].forEach(ev => window.addEventListener(ev, audioInit, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state !== 'running') { try { AC.resume(); } catch (_) {} } });
function tone(freq, dur, type, vol, slide, delay) {

  const t = AC.currentTime + (delay || 0);

  o.type = type || 'square';

  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol == null ? 0.5 : vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);

}

  if (window.__log) { window.__log.push({ k:'noise', t:window.__now, dur, vol, delay:when || 0 }); return; }
  if (!AC || muted) return;
  const t = AC.currentTime + (when || 0);
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);

}
const hz = s => 440 * Math.pow(2, s / 12);
function scheduleMusic() {
  const m = GAME.music;
  if (!AC || AC.state !== 'running' || !m) return;
  const sixteenth = 60 / m.bpm / 4;
  while (nextT < AC.currentTime + 0.14) {
    const ch = m.chords[Math.floor(step16 / 16) % m.chords.length], s = step16 % 16;
    const delay = Math.max(0, nextT - AC.currentTime);

      if (m.bass.includes(s)) tone(hz(ch.root + ((s % 8 === 6) ? 12 : 0)), sixteenth * 1.8, 'triangle', 0.5, 0, delay);
      if (m.snare.includes(s)) noise(0.07, 0.3, delay);

const SFX = {
  jump:  () => tone(260, 0.14, 'square', 0.25, 420),
  shoot: () => tone(900, 0.06, 'square', 0.18, -500),
  hit:   () => { noise(0.08, 0.3); tone(220, 0.08, 'square', 0.2, -100); },
  boom:  () => { noise(0.35, 0.6); tone(120, 0.4, 'sawtooth', 0.3, -80); },
  coin:  () => { tone(988, 0.06, 'square', 0.22); tone(1319, 0.14, 'square', 0.22, 0, 0.06); },
  hurt:  () => tone(330, 0.3, 'sawtooth', 0.28, -260),
  die:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.14, 'square', 0.28, 0, i * 0.12)),
  power: () => tone(300, 0.4, 'square', 0.25, 900),
  beep:  () => tone(520, 0.12, 'square', 0.3),
  go:    () => tone(1040, 0.35, 'square', 0.3),
  win:   () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.28, 0, i * 0.13)),
  land:  () => { tone(120, 0.1, 'triangle', 0.5, -60); noise(0.06, 0.2); },
  throw: () => tone(500, 0.12, 'square', 0.2, 400),
  catch: () => { tone(700, 0.05, 'square', 0.25); tone(500, 0.08, 'square', 0.2, 0, 0.05); },
  super: () => { tone(200, 0.5, 'sawtooth', 0.3, 1200); noise(0.4, 0.4); },
  flap:  () => tone(420, 0.07, 'triangle', 0.4, 240),
  pop:   () => { noise(0.1, 0.4); tone(700, 0.1, 'square', 0.2, -500); },
  tick:  () => tone(1400, 0.03, 'square', 0.15),
  swing: () => tone(300, 0.18, 'sawtooth', 0.12, 300),
  punch: () => { noise(0.07, 0.4); tone(160, 0.1, 'square', 0.3, -80); },
  clear: () => [523, 659, 784].forEach((f, i) => tone(f, 0.08, 'square', 0.25, 0, i * 0.06)),
  over:  () => [330, 262, 196, 165].forEach((f, i) => tone(f, 0.22, 'triangle', 0.5, 0, i * 0.18)),

/* ---------- input ---------- */
const kd = { l:false, r:false, u:false, d:false, b:false, a:false };

let aEdge = false, bEdge = false, startEdge = false;
const KEYMAP = { ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r', ArrowDown:'d', KeyS:'d', ArrowUp:'u', KeyW:'u',
  KeyZ:'a', Space:'a', KeyK:'a', KeyX:'b', ShiftLeft:'b', ShiftRight:'b', KeyJ:'b' };

  const k = KEYMAP[e.code];

const dpad = document.getElementById('dpad');

dpad.addEventListener('contextmenu', e => e.preventDefault());
document.querySelectorAll('[data-k]').forEach(btn => {

/* ===== MAZE WRECKER: Pac-Man x Wrecking Crew. Smash the maze walls to reroute the patrol bots hunting you,
   grab the dots your wrecking reveals, and finish before the maze seals. Walls are both weapon and escape route. ===== */
const MW = 16, MH = 12, OY7 = 16, GOAL7 = 26, TIME7 = 80, LIVES7 = 3;
const DIRS7 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
let grid, pel, hid, regrow7, pl7, gh7, parts7, pops7, score7, pel7, tleft7, lives7, att7, rng7, T7, shake7, hint7;

const free7 = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH && grid[y][x] === '.';
function popup7(s, x, y, col) { pops7.push({ s, x, y, col, t:0 }); if (pops7.length > 4) pops7.shift(); }
function burst7(x, y, col, n) { for (let i = 0; i < n; i++) parts7.push({ x, y, vx:(vr() - 0.5) * 110, vy:-vr() * 80, t:0, col }); }

function mkEnt(x, y) { return { x, y, tx:x, ty:y, mv:false, dx:0, dy:0 }; }
function setup7(isAtt) {
  att7 = !!isAtt;

  grid = []; pel = []; hid = []; regrow7 = [];
  const keep = new Set(['1,10', '1,9', '2,9', '3,10', '14,1', '13,1', '12,1', '13,2']);
  for (let y = 0; y < MH; y++) {
    const gr = [], pr = [], hr = [];
    for (let x = 0; x < MW; x++) {
      let c = '.';
      if (x === 0 || y === 0 || x === MW - 1 || y === MH - 1) c = 'X';
      else if (x % 2 === 0 && y % 2 === 0) c = 'X';
      else if (!keep.has(x + ',' + y) && rng7() < 0.45) c = '#';
      gr.push(c); pr.push(false); hr.push(c === '#' && rng7() < 0.5);
    }
