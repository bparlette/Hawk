<style>

  .x-score div { min-width: 92px; padding: 8px 12px; border-radius: 12px; background: rgba(255,43,214,.12); border: 1px solid rgba(255,43,214,.45);
    font: 500 12px/1.2 system-ui, sans-serif; color: #f3d9ff; letter-spacing: 1px; text-transform: uppercase; }
  .x-score b, .x-stats b { display: block; font: 700 22px/1.1 ui-monospace, Menlo, monospace; color: #ff2bd6; text-shadow: 0 0 8px rgba(255,43,214,.5); letter-spacing: 1px; }
  .x-best { margin: 6px 0 2px; font: 600 15px/1.3 system-ui, sans-serif; color: #ffd84a; }
  .x-stats { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 8px; margin: 6px 0 4px; }
  .x-stats div { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.2);

  .x-btn { min-height: 56px; min-width: 190px; margin-top: 14px; padding: 12px 34px; border-radius: 999px; border: 3px solid #ffd09a;

  @media (max-height: 520px) {

  }
  #mutebtn { position: fixed; top: 8px; left: 8px; width: 44px; height: 44px; border-radius: 50%; z-index: 11; display: flex;
    align-items: center; justify-content: center; font-size: 20px; line-height: 1; cursor: pointer; pointer-events: auto; touch-action: none;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); opacity: .7; }

  #hint { transition: opacity .8s; } #hint.x-out { opacity: 0; }
  #overlay p { margin: 4px 0; font: 500 16px/1.4 system-ui, sans-serif; color: #f3d9ff; }
  #banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); display: none; pointer-events: none;
    font: 800 clamp(26px, 6vw, 52px)/1 system-ui, sans-serif; color: #ff2bd6; text-shadow: 0 0 16px rgba(255,43,214,.7); white-space: nowrap; z-index: 5; }

  #hint { position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%); display: none; pointer-events: none;
    color: rgba(255,255,255,.88); background: rgba(11,6,20,.42); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 5px 10px;

  #pausebtn::before { left: 15px; } #pausebtn::after { right: 15px; }
  #retry { min-height: 44px; min-width: 132px; margin-top: 14px; padding: 10px 24px; border-radius: 999px; border: 2px solid #ffd09a;
    background: #ff8a1c; color: #1a0a00; font: 700 18px/1 system-ui, sans-serif; cursor: pointer; }

  #perfect { position: fixed; left: 50%; top: 24%; transform: translate(-50%,-50%); display: none; pointer-events: none; z-index: 5;
    font: 800 clamp(22px, 5vw, 44px)/1 system-ui, sans-serif; color: #ffd84a; text-shadow: 0 0 16px rgba(255,170,20,.8); white-space: nowrap; }

<canvas id="game"></canvas>
<div id="hud">

<script>
var THREE_URLS = ["https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js", "https://unpkg.com/three@0.150.1/build/three.min.js"];
var threePending = null;
function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement("script"), done = false;
    var fin = function (ok) { if (done) return; done = true; if (!ok) s.remove(); res(ok && !!window.THREE); };
    s.src = src; s.onload = function () { fin(true); }; s.onerror = function () { fin(false); };
    setTimeout(function () { fin(false); }, 15000);
    document.head.appendChild(s);
  });
}
function threeFallback() { if (!threePending) threePending = loadScript(THREE_URLS[1]); }
// Mute works on its own, even before the game boots; the game's audio listens through onMuteChange.
var gameMuted = false, onMuteChange = null;
function toggleMute() {
  gameMuted = !gameMuted;
  var b = document.getElementById("mutebtn");
  b.textContent = gameMuted ? "\ud83d\udd07" : "\ud83d\udd0a";
  b.setAttribute("aria-label", gameMuted ? "Unmute" : "Mute"); b.setAttribute("aria-pressed", String(gameMuted));
  if (onMuteChange) onMuteChange(gameMuted);
}
document.getElementById("mutebtn").addEventListener("pointerdown", function (e) { e.stopPropagation(); });
document.getElementById("mutebtn").addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); toggleMute(); });
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js" onerror="threeFallback()"></script>
<script>
function tobersGame() {

// ---------- Config ----------
const YARD = { xMin: -10, xMax: 10, zMin: -13, zMax: 11 };
const FENCE_Z = 0, GAP_W = 2.2, TOBER_R = 0.35;
const SPEED = 4.5, SPRINT = 1.8, PICK_R = 1.95, HOLD_MS = 250;
const CAM_PITCH = 52 * Math.PI / 180, CAM_FOV = 48;
const CAM_DIR = new THREE.Vector3(0, Math.sin(CAM_PITCH), Math.cos(CAM_PITCH)); // low 3/4 view from behind the patch
let camX = 0, camMaxOff = 0; // portrait: camera pans sideways after Tober

// ---------- State ----------
const state = { score: 0, lives: 3, moveDir: null, sprintKey: false, sprintTouch: false, padDir: null };
let renderer, scene, camera, tober, gapX, lastGapX = null, bounds = null;
let patch = [], carried = [], throws = [], particles = [], pickupAnim = null, doorMesh, doorLight;
const press = { down: false, at: 0 };
function isSprinting() { return press.down && performance.now() - press.at > HOLD_MS; }
function pressStart() { if (press.down) return; press.down = true; press.at = performance.now(); }
function pressEnd(fire) {
  if (press.down && fire && performance.now() - press.at < HOLD_MS) doAction();
  press.down = false;
}

// ---------- Setup ----------
function initRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("game"), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0614);
  scene.fog = new THREE.FogExp2(0x0b0614, 0.014);
  camera = new THREE.PerspectiveCamera(CAM_FOV, 1, 0.1, 300);
  scene.add(camera); // the moon rides on the camera
  scene.add(new THREE.HemisphereLight(0x5c5aa8, 0x0a140d, 0.38));
  const moonLight = new THREE.DirectionalLight(0x8f86ff, 0.95);
  moonLight.position.set(-8, 18, -14);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(1024, 1024); moonLight.shadow.radius = 4; moonLight.shadow.bias = -0.0008;
  Object.assign(moonLight.shadow.camera, { left: -16, right: 16, top: 18, bottom: -18, near: 1, far: 60 });
  scene.add(moonLight);
}
function castShadows() {
  scene.traverse((o) => {
    if (!o.isMesh || o.userData.shadowSet) return;
    o.userData.shadowSet = true;
    if (o.material && o.material.isMeshStandardMaterial) { o.castShadow = true; o.receiveShadow = true; }
  });
}

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, ...o });
function box(w, h, d, c) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); }

function buildGround() {
  // very dark grass with faint mowed stripes running toward the house
  const c = document.createElement("canvas"); c.width = 64; c.height = 4;
  const x = c.getContext("2d");
  x.fillStyle = "#16261a"; x.fillRect(0, 0, 32, 4);
  x.fillStyle = "#1a2c1e"; x.fillRect(32, 0, 32, 4);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(15, 1);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), mat(0xffffff, { map: tex, roughness: 0.95 }));
  g.rotation.x = -Math.PI / 2;
  g.receiveShadow = true; g.userData.shadowSet = true;
  scene.add(g);
}

// Big orange moon pinned to the camera, cropped off the top-left corner
let moonGroup = null;
function buildMoon() {
  moonGroup = new THREE.Group();
  const top = { depthTest: false, depthWrite: false, fog: false, toneMapped: false, transparent: true };
  const moon = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshBasicMaterial({ color: 0xff8a2a, ...top }));
  const shade = new THREE.Mesh(new THREE.CircleGeometry(0.93, 48),
    new THREE.MeshBasicMaterial({ color: 0xffb04a, opacity: 0.35, ...top }));
  shade.position.set(0.12, 0.1, 0.001);
  moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0xff8a30, opacity: 0.5,
    blending: THREE.AdditiveBlending, ...top }));
  moonHalo.scale.setScalar(3.4); moonHalo.position.z = -0.001;
  moonHalo.renderOrder = 997; moon.renderOrder = 998; shade.renderOrder = 999;
  moonGroup.add(moonHalo, moon, shade);
  camera.add(moonGroup);
}
function placeMoon(w, h) {
  if (!moonGroup) return;
  const D = 100, wpp = (2 * D * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) / h; // world units per CSS px
  // radius in px; keep moon + halo clear of the centred score text
  let r = THREE.MathUtils.clamp(Math.min(w, h) * 0.22, 64, 150);
  const cx = r * 0.18, cy = r * 0.3;
  r = Math.min(r, (w / 2 - 95 - cx) / 1.25);
  moonGroup.position.set((cx - w / 2) * wpp, (h / 2 - cy) * wpp, -D);
  moonGroup.scale.setScalar(r * wpp);
}

// ---------- Atmosphere: halo glow, fireflies, bats, porch lanterns ----------
let moonHalo = null, glowTexture = null, fireflies = null, bats = [], lanterns = [];
function glowTex() {
  if (glowTexture) return glowTexture;
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.25, "rgba(255,255,255,0.5)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return (glowTexture = new THREE.CanvasTexture(c));
}
function buildFireflies() {
  const n = 12, pos = new Float32Array(n * 3), seeds = [];
  for (let i = 0; i < n; i++) seeds.push({ x: rf(-9, 9), z: rf(-8, 9), y: rf(0.5, 1.6), a: rf(0, 6.3), b: rf(0, 6.3), s: rf(0.2, 0.45) });
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0xd8ff6a, size: 0.42, map: glowTex(), transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false });
  fireflies = new THREE.Points(geo, m); fireflies.userData.seeds = seeds; fireflies.frustumCulled = false;
  scene.add(fireflies);
}
function makeBat() {
  const g = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color: 0x2b1d3a, side: THREE.DoubleSide });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 4), m); body.scale.set(0.8, 0.7, 1.3); g.add(body);
  const s = new THREE.Shape();
  s.moveTo(0, 0.12); s.lineTo(0.75, 0.18); s.lineTo(0.6, -0.06); s.lineTo(0.42, 0.02); s.lineTo(0.26, -0.12); s.lineTo(0, -0.1);
  const wg = new THREE.ShapeGeometry(s); wg.rotateX(-Math.PI / 2);
  const wings = [];
  for (const side of [1, -1]) {
    const pivot = new THREE.Group(); pivot.scale.x = side;
    pivot.add(new THREE.Mesh(wg, m)); g.add(pivot); wings.push(pivot);
  }
  g.userData.wings = wings; g.visible = false; g.scale.setScalar(1.3);
  scene.add(g);
  return { g, t: rf(2, 12), active: false, vx: 0, y: 0, ph: 0 };
}
function makeLantern(x) {
  const g = makePumpkin(); g.scale.setScalar(0.95); g.rotation.x = 0.45;
  const fg = new THREE.Group(); fg.scale.setScalar(1.31); g.add(fg); // face sized to the bigger pumpkin
  const face = new THREE.MeshBasicMaterial({ color: 0xffc23a });
  const tri = new THREE.Shape(); tri.moveTo(-0.07, -0.05); tri.lineTo(0.07, -0.05); tri.lineTo(0, 0.07);
  const tg = new THREE.ShapeGeometry(tri);
  for (const ex of [-0.14, 0.14]) { const e = new THREE.Mesh(tg, face); e.position.set(ex, 0.38, 0.43); fg.add(e); }
  const mouth = new THREE.Shape(); mouth.moveTo(-0.2, 0.04);
  for (let i = 1; i <= 8; i++) mouth.lineTo(-0.2 + i * 0.05, i % 2 ? -0.02 : 0.04);
  mouth.lineTo(0.18, -0.05); mouth.quadraticCurveTo(0, -0.14, -0.18, -0.05); mouth.lineTo(-0.2, 0.04);
  const mo = new THREE.Mesh(new THREE.ShapeGeometry(mouth), face); mo.position.set(0, 0.22, 0.43); fg.add(mo);
  g.position.set(x, 0, 2.35);
  const light = new THREE.PointLight(0xff8a20, 1.4, 4.5); light.position.set(x, 0.7, 2.75);
  lanterns.push({ face, light, ph: rf(0, 6.3) });
  return [g, light];
}
function updateAtmos(dt, time) {
  if (moonHalo) moonHalo.material.opacity = 0.5 + Math.sin(time * 0.7) * 0.06;
  if (fireflies) {
    const a = fireflies.geometry.attributes.position, s = fireflies.userData.seeds;
    s.forEach((f, i) => a.setXYZ(i,
      f.x + Math.sin(time * f.s + f.a) * 1.4,
      f.y + Math.sin(time * f.s * 1.7 + f.b) * 0.35,
      f.z + Math.cos(time * f.s * 0.8 + f.b) * 1.1));
    a.needsUpdate = true;
    fireflies.material.opacity = 0.7 + Math.sin(time * 2.3) * 0.2;
  }
  for (const b of bats) {
    if (!b.active) {
      b.t -= dt;
      if (b.t <= 0) {
        const dir = Math.random() < 0.5 ? 1 : -1;
        b.active = true; b.vx = dir * rf(5, 7.5); b.y = rf(4, 6.5); b.ph = rf(0, 6.3);
        b.g.position.set(-dir * 24, b.y, rf(-16.5, -12.5)); b.g.rotation.y = dir > 0 ? -Math.PI / 2 : Math.PI / 2; b.g.visible = true;
      }
      continue;
    }
    const p = b.g.position; p.x += b.vx * dt; p.y = b.y + Math.sin(time * 3 + b.ph) * 0.4;
    const f = Math.sin(time * 16 + b.ph) * 0.8;
    b.g.userData.wings.forEach((w) => { w.rotation.z = f; });
    if (Math.abs(p.x) > 25) { b.active = false; b.g.visible = false; b.t = rf(10, 20); }
  }
  for (const l of lanterns) {
    const k = 0.82 + Math.sin(time * 9 + l.ph) * 0.08 + Math.sin(time * 23 + l.ph * 2) * 0.06 + (Math.random() - 0.5) * 0.08;
    l.light.intensity = 1.4 * k;
    l.face.color.setRGB(1, 0.62 * k + 0.1, 0.18 * k);
  }
}

// gable roof: a chevron-section prism with its ridge along x, plus the white gable infill beneath it
function gableRoof(halfD, h, len, overhang, thick, color, wallColor) {
  const g = new THREE.Group(), o = overhang, k = h / halfD;
  const s = new THREE.Shape();
  s.moveTo(-halfD - o, -o * k); s.lineTo(0, h + thick); s.lineTo(halfD + o, -o * k);
  s.lineTo(halfD + o - thick, -o * k); s.lineTo(0, h); s.lineTo(-halfD - o + thick, -o * k); s.closePath();
  const rg = new THREE.ExtrudeGeometry(s, { depth: len + o * 2, bevelEnabled: false });
  rg.translate(0, 0, -(len + o * 2) / 2); rg.rotateY(Math.PI / 2);

      p.regrow -= dt;
      const d = Math.hypot(p.mesh.position.x - tober.position.x, p.mesh.position.z - tober.position.z);
      if (p.regrow <= 0 && d > 1.15) { p.alive = true; p.grow = 0; p.mesh.visible = true; }
    } else if (p.grow < 1) {
      p.grow = Math.min(1, p.grow + dt * 1.5);
      p.mesh.scale.setScalar(Math.max(0.01, p.grow));
    }
  }
}

// ---------- Sound ----------
let actx = null, master = null, sfxBus = null, musicBus = null, muted = false, music = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musicBus = actx.createGain(); musicBus.gain.value = 0.0001; musicBus.connect(master);
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function sfx(f, d, type = "square", f2) {
  try {
    audio();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
muted = gameMuted;
onMuteChange = function (m) {
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : 1, actx.currentTime, 0.03);
};
// ---------- Music: A-minor loop at 90 BPM, slow bass + sparse music-box arpeggio ----------
const MUSIC_VOL = 0.7, STEP = 60 / 90 / 2; // eighth notes
const BASS = [45, 52, 41, 48, 38, 45, 40, 47]; // one per half bar: Am, F, Dm, E (root, fifth)
const CHORDS = [[69, 72, 76], [65, 69, 72], [62, 65, 69], [64, 68, 71]];
const BOX = [[0, -1, -1, 1, -1, 2, -1, -1], [-1, -1, 2, -1, 1, -1, -1, 3]]; // chord index per eighth; 3 = top note an octave up
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
function musicNote(freq, t, dur, vol, type, cutoff) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (cutoff ? 0.06 : 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = o;
  if (cutoff) { const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff; o.connect(f); out = f; }
  out.connect(g).connect(musicBus); o.start(t); o.stop(t + dur + 0.05);
}
function playStep(step, t) {
  const bar = Math.floor(step / 8) % 4, e = step % 8;
  if (e % 4 === 0) musicNote(mtof(BASS[bar * 2 + e / 4]), t, STEP * 3.8, 0.11, "triangle", 420);
  const k = BOX[bar % 2][e];
  if (k >= 0) {
    const c = CHORDS[bar], m = k === 3 ? c[2] + 12 : c[k] + 12;
    musicNote(mtof(m), t, 1.4, 0.035, "sine");
    musicNote(mtof(m) * 4, t, 0.4, 0.008, "sine"); // bell-like partial
  }
}
function tickMusic() {
  if (!actx || !music) return;
  if (music.next < actx.currentTime - 0.1) music.next = actx.currentTime + 0.05; // skip notes missed while throttled
  while (music.next < actx.currentTime + 0.3) { playStep(music.step, music.next); music.step = (music.step + 1) % 32; music.next += STEP; }
}
function startMusic() {
  try {
    audio();
    musicBus.gain.cancelScheduledValues(actx.currentTime);
    musicBus.gain.setTargetAtTime(MUSIC_VOL, actx.currentTime, 0.6);
    if (music) return;
    music = { step: 0, next: actx.currentTime + 0.15 };
    music.timer = setInterval(tickMusic, 50); tickMusic();
  } catch (e) {}
}
function duckMusic(on) {
  if (!actx || !musicBus || !music) return;
  musicBus.gain.cancelScheduledValues(actx.currentTime);
  musicBus.gain.setTargetAtTime(on ? 0.02 : MUSIC_VOL, actx.currentTime, 0.15);
}

function buildTober() {
  const t = new THREE.Group();
  const skin = mat(0xf1c7a0);
  for (const x of [-0.12, 0.12]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.4, 6), skin);
    leg.position.set(x, 0.2, 0); t.add(leg);
  }
  const shorts = box(0.42, 0.22, 0.28, 0xe0189a); shorts.position.y = 0.5; t.add(shorts);
  const shirt = box(0.46, 0.42, 0.3, 0x2fbf3a); shirt.position.y = 0.8; t.add(shirt);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), skin); head.position.y = 1.24; t.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.265, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffe066));
  hair.position.y = 1.28; t.add(hair);
  t.userData.mats = [skin, shorts.material, shirt.material, hair.material];
  const glow = new THREE.PointLight(0xffd84a, 0, 4); glow.position.y = 1; t.add(glow); t.userData.glow = glow;
  t.rotation.order = "YXZ";
  t.position.set(0, 0, 7.5);
  scene.add(t);
  return t;
}

// ---------- Camera fit & playfield bounds ----------
const camBase = new THREE.Vector3();
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = CAM_FOV;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const ndc = (p, cam) => p.clone().project(cam);
  const aim = (cam, dir, tz, dist) => {
    const t = V(0, 0, tz); cam.position.copy(t).addScaledVector(dir, dist);
    cam.lookAt(t); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  };
  // slide the aim point until ground point p sits at screen height yWant (NDC)
  const aimAt = (dist, p, yWant) => {
    let lo = -30, hi = 20;
    for (let i = 0; i < 40; i++) { const tz = (lo + hi) / 2; aim(camera, CAM_DIR, tz, dist); if (ndc(p, camera).y > yWant) hi = tz; else lo = tz; }
  };
  const unitH = (cam, z) => ndc(V(0, 1, z), cam).y - ndc(V(0, 0, z), cam).y;
  const roof = [V(-7, 4.6, -11.5), V(4, 4.6, -11.5)];
  camMaxOff = 0;
  if (w / h < 0.9) {
    // Portrait: reference = the old top-down whole-yard framing, then come ~2.5x closer
    const ref = new THREE.PerspectiveCamera(45, w / h, 0.1, 300), oldDir = V(0, 1, 0.38).normalize();
    const oldPts = [];
    for (const x of [YARD.xMin, YARD.xMax]) for (const z of [YARD.zMin - 2, YARD.zMax]) for (const y of [0, 4]) oldPts.push(V(x, y, z));
    for (let d = 10; d < 300; d += 0.5) {
      aim(ref, oldDir, -2, d);
      if (oldPts.every((p) => { const v = ndc(p, ref); return Math.abs(v.x) < 0.94 && Math.abs(v.y) < 0.86; })) break;
    }
    const want = unitH(ref, -4) * 2.5, patchPt = V(0, 0, 4.2);
    for (let d = 70; d > 8; d -= 0.25) {
      aimAt(d, patchPt, -0.55); // pumpkin rows just above the touch controls
      if (unitH(camera, -4) >= want && roof.every((p) => ndc(p, camera).y >= 0.6)) break; // house across the top
    }
    const halfW = 1 / ndc(V(1, 0, 3), camera).x; // half the visible width at the patch
    camMaxOff = Math.max(0, YARD.xMax - halfW);
  } else {
    // Landscape / desktop: frame the whole yard, keeping the top band clear for the moon and score
    const pts = [...roof];
    for (const x of [YARD.xMin, YARD.xMax]) for (const z of [YARD.zMin - 2, YARD.zMax]) pts.push(V(x, 0, z));
    const nearPt = V(0, 0, YARD.zMax);
    for (let d = 8; d < 300; d += 0.25) {
      aimAt(d, nearPt, -0.92);
      if (pts.every((p) => { const v = ndc(p, camera); return Math.abs(v.x) < 0.95 && v.y < 0.78; })) break;
    }
  }
  camBase.copy(camera.position);
  computeBounds();
  camX = THREE.MathUtils.clamp(camX, -camMaxOff, camMaxOff);
  camera.position.x = camBase.x = camX;
  camera.updateMatrixWorld();
  placeMoon(w, h);
}
function followCamera(dt) {
  if (camMaxOff <= 0 || !tober) return;
  const goal = THREE.MathUtils.clamp(tober.position.x, -camMaxOff, camMaxOff);
  camX += (goal - camX) * Math.min(1, dt * 4);
  camera.position.x = camBase.x = camX;
}

function groundAt(nx, ny) {
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const out = new THREE.Vector3();
  return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), out) ? out : null;
}

function computeBounds() {
  // on a touch portrait screen the bottom of the view is under the pad and button
  const by = document.body.classList.contains("touch") && window.innerWidth < window.innerHeight ? -0.66 : -1;
  const tl = groundAt(-1, 1), tr = groundAt(1, 1), bl = groundAt(-1, by), br = groundAt(1, by);
  bounds = { top: { z: tl.z, xl: tl.x, xr: tr.x }, bot: { z: bl.z, xl: bl.x, xr: br.x } };
}

function clampToView(p) {
  const m = TOBER_R + 0.2;
  const zMin = Math.max(bounds.top.z + m, YARD.zMin + 2.2), zMax = Math.min(bounds.bot.z - m - 0.6, YARD.zMax);
  p.z = THREE.MathUtils.clamp(p.z, zMin, zMax);
  const t = (p.z - bounds.top.z) / (bounds.bot.z - bounds.top.z);
  const xl = THREE.MathUtils.lerp(bounds.top.xl, bounds.bot.xl, t) + m - camMaxOff; // widened by the portrait pan range
  const xr = THREE.MathUtils.lerp(bounds.top.xr, bounds.bot.xr, t) - m + camMaxOff;
  p.x = THREE.MathUtils.clamp(p.x, Math.max(xl, YARD.xMin), Math.min(xr, YARD.xMax));
}

// ---------- Input ----------
const KEYMAP = { KeyW: "up", ArrowUp: "up", KeyS: "down", ArrowDown: "down", KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right" };
const keyStack = [];
function initKeyboard() {
  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyM") { e.preventDefault(); if (!e.repeat) toggleMute(); return; }
    if (menuKey(e)) return;
    if (e.code === "Space") { e.preventDefault(); if (!e.repeat) pressStart(); return; }
    const d = KEYMAP[e.code]; if (!d) return;
    e.preventDefault();
    const i = keyStack.indexOf(d); if (i >= 0) keyStack.splice(i, 1);
    keyStack.push(d);
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") { pressEnd(true); return; }
    const d = KEYMAP[e.code]; if (!d) return;
    const i = keyStack.indexOf(d); if (i >= 0) keyStack.splice(i, 1);
  });
  window.addEventListener("blur", () => { keyStack.length = 0; pressEnd(false); pause(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  document.getElementById("overlay").addEventListener("pointerdown", (e) => { e.preventDefault(); advance(); });
}

function initTouch() {
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
  if (isTouch) document.body.classList.add("touch");
  const pad = document.getElementById("pad"), knob = document.getElementById("knob"), act = document.getElementById("action");
  let padId = null, actId = null;
  const updatePad = (e) => {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const max = r.width / 2;
    if (Math.hypot(dx, dy) < 12) { state.padDir = null; knob.style.transform = ""; return; }
    if (Math.abs(dx) > Math.abs(dy)) { state.padDir = dx > 0 ? "right" : "left"; knob.style.transform = `translate(${Math.sign(dx) * Math.min(Math.abs(dx), max * 0.6)}px,0)`; }
    else { state.padDir = dy > 0 ? "down" : "up"; knob.style.transform = `translate(0,${Math.sign(dy) * Math.min(Math.abs(dy), max * 0.6)}px)`; }
  };
  const stopPad = (e) => { if (e.pointerId !== padId) return; padId = null; state.padDir = null; knob.style.transform = ""; pad.classList.remove("pressed"); };
  pad.addEventListener("pointerdown", (e) => { e.preventDefault(); if (mode !== "play") return; dismissHint(); padId = e.pointerId; pad.classList.add("pressed"); updatePad(e); });
  pad.addEventListener("pointermove", (e) => { if (e.pointerId === padId) updatePad(e); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) pad.addEventListener(ev, stopPad);
  const stopAct = (e, fire) => { if (e.pointerId !== actId) return; actId = null; pressEnd(fire); act.classList.remove("pressed"); };
  act.addEventListener("pointerdown", (e) => { e.preventDefault(); if (mode !== "play") return; dismissHint(); actId = e.pointerId; pressStart(); act.classList.add("pressed"); });
  act.addEventListener("pointerup", (e) => stopAct(e, true));
  for (const ev of ["pointercancel", "pointerleave"]) act.addEventListener(ev, (e) => stopAct(e, false));
  document.getElementById("pausebtn").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); pause(); });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
}

function currentDir() { return state.padDir || keyStack[keyStack.length - 1] || null; }

// ---------- Movement ----------
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const ROT = { up: Math.PI, down: 0, left: -Math.PI / 2, right: Math.PI / 2 };
function inFenceBand(z) { return Math.abs(z - FENCE_Z) < TOBER_R + 0.12; }
function inGap(x) { return gapX !== null && Math.abs(x - gapX) < GAP_W / 2 - TOBER_R; }

// ---------- Trip phases: down -> patch (fence closed) -> return (door glows) ----------
let phase = "down", thrownTrip = 0;
const DOOR = { x: -1.5, z: -9.4 };
function toHouse() {
  tober.position.set(DOOR.x, 0, DOOR.z + 0.3); tober.rotation.set(0, 0, 0);
  clampToView(tober.position);
}
function newRun() { phase = "down"; thrownTrip = 0; newTrip(); buildFence(true); toHouse(); }
function updatePhase(time) {
  const p = tober.position;
  if (phase === "down" && p.z > FENCE_Z + TOBER_R + 0.35) {
    phase = "patch"; thrownTrip = 0; newTrip(); buildFence(false); sfx(160, 0.2, "sawtooth", 90);
  } else if (phase === "patch" && carried.length === 0 && thrownTrip > 0 && !pickupAnim) {
    phase = "return"; buildFence(true); sfx(440, 0.25, "triangle", 880);
  }
  const homeward = phase === "return" && carried.length === 0 && p.z < FENCE_Z - 0.3;
  const glow = homeward ? 0.8 + Math.sin(time * 6) * 0.4 : 0;
  doorMesh.material.emissiveIntensity = glow * 1.6;
  doorLight.intensity = glow * 2.2;
  if (homeward && p.z < DOOR.z + 0.6 && Math.abs(p.x - DOOR.x) < 1) { sfx(660, 0.2, "triangle", 990); newRun(); }
}

function updateTober(dt, time) {
  carried.forEach((m, i) => { m.rotation.z = Math.sin(time * 6 + i) * 0.05 * (i + 1); });
  if (pickupAnim) { updatePickup(dt); return; }
  const dir = currentDir();
  if (!dir) { tober.position.y = 0; return; }
  const sp = SPEED * (isSprinting() ? SPRINT : 1) * dt;
  const [dx, dz] = DIRS[dir];
  const p = tober.position;
  let nx = p.x + dx * sp, nz = p.z + dz * sp;
  // fence: block crossing outside the gap, and sliding into posts while inside the band
  const crosses = Math.sign(p.z - FENCE_Z) !== Math.sign(nz - FENCE_Z) || inFenceBand(nz);
  if (crosses && !inGap(p.x)) nz = p.z;
  if (inFenceBand(p.z) && !inGap(nx)) nx = p.x;
  p.x = nx; p.z = nz;
  clampToView(p);
  tober.rotation.y = ROT[dir];
  tober.position.y = Math.abs(Math.sin(time * 14)) * 0.06;
}

// ---------- HUD ----------
function updateHUD() {
  document.getElementById("score").textContent = String(state.score).padStart(6, "0");
  document.querySelectorAll(".heart").forEach((h, i) => {
    const lost = i >= state.lives; h.classList.toggle("lost", lost); h.textContent = lost ? "\u2661" : "\u2665";
  });
}

// ---------- Loop ----------
function start() {
  initRenderer();
  buildGround(); buildMoon(); buildHouse(); buildFence(); buildPumpkins();
  buildFireflies(); for (let i = 0; i < 3; i++) bats.push(makeBat());
  tober = buildTober();
  fitCamera(); toHouse(); spawnEnemies();
  initKeyboard(); initTouch(); fitCamera(); toHouse(); updateHUD(); showTitle(); // refit once the touch class is known
  window.addEventListener("resize", fitCamera);
  window.addEventListener("orientationchange", () => setTimeout(fitCamera, 200));
  castShadows(); let shadowTick = 0;
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;
    if (hitStop > 0) hitStop -= dt;
    else if (mode === "play") {
      updateTober(dt, time);
      updateThrows(dt); updatePatch(dt); updatePhase(time); updatePowerups(dt, time); updateGardener(dt, time);
      updateEnemies(dt, time); updateHits(dt); checkLevelDone();
    }
    updateParticles(dt); updatePops(dt); updateFloats(dt); updateAtmos(dt, time); followCamera(dt);
    if ((shadowTick = (shadowTick + 1) % 30) === 0) castShadows(); // new enemies / props pick up shadows
    const shook = shakeT > 0;
    if (shook) {
      shakeT -= dt; const a = Math.max(0, shakeT) * 1.1;
      camera.position.set(camBase.x + (Math.random() - 0.5) * a, camBase.y + (Math.random() - 0.5) * a * 0.5, camBase.z + (Math.random() - 0.5) * a);
    }
    renderer.render(scene, camera);
    if (shook) camera.position.copy(camBase);
  });
}
start();
}

// ---------- Boot: wait for three.js, or offer a Retry ----------
let booted = false;
function bootGame() { if (booted) return; booted = true; tobersGame(); }
function showLoadError() {
  const o = document.getElementById("overlay");
  o.querySelector("h1").textContent = "Tober\u2019s Nightmare";
  o.querySelector(".o1").textContent = "Couldn\u2019t load the 3D engine \u2014 check your connection";
  const o2 = o.querySelector(".o2"); o2.textContent = "";
  const b = document.createElement("button"); b.type = "button"; b.id = "retry"; b.textContent = "Retry";
  b.addEventListener("click", (e) => {
    e.stopPropagation(); b.disabled = true; b.textContent = "Loading\u2026";
    (window.THREE ? Promise.resolve(true) : loadScript(THREE_URLS[1]).then((ok) => ok || loadScript(THREE_URLS[0])))
      .then((ok) => {
        if (ok || window.THREE) { o2.textContent = ""; o.classList.remove("show"); bootGame(); }
        else { b.disabled = false; b.textContent = "Retry"; }
      });
  });
  o2.appendChild(b); o.classList.add("show");
}
if (!window.THREE) threeFallback();
(window.THREE ? Promise.resolve(true) : threePending).then((ok) => (ok || window.THREE ? bootGame() : showLoadError()));
</script>
