{

  const mean = {};
  const regrade = () => {
    const zones = {};
    for (const k of Object.keys(mean)) {
      const z = ZONE_OF[k]; (zones[z] = zones[z] || []).push(mean[k]);
    }
    for (const k of Object.keys(ZONE_OF)) {
      const m = mean[keys[k]]; if (!m) continue;
      const zs = zones[ZONE_OF[k]];
      const avg = [0, 1, 2].map(c => zs.reduce((a, v) => a + v[c], 0) / zs.length);
      const gain = new THREE.Color();
      gain.setRGB(...[0, 1, 2].map(c => THREE.MathUtils.clamp(Math.pow(avg[c] / Math.max(0.02, m[c]), 0.5), 0.88, 1.14)));
      segGain[k] = gain;
    }
  };
  for (const key of new Set(Object.values(keys))) {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = 32; c.height = 16;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, 32, 16);
      const d = g.getImageData(0, 0, 32, 16).data; let r = 0, gg = 0, b = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
      const n = d.length / 4 * 255;
      mean[key] = [r / n, gg / n, b / n];
      regrade();
    };
    img.src = `art/seg-${key}.webp`;
  }
}
const ZONE_OF = { N: 'amber', B: 'amber', C: 'teal', Cf: 'teal', P: 'teal', L: 'teal', A: 'pink', F: 'pink' };
const ZONE_STYLE = {
  amber: { tint: new THREE.Color(1.08, 1.00, 0.88), fog: new THREE.Color(0x16100a), music: 0.55 },
  teal:  { tint: new THREE.Color(0.90, 1.03, 1.06), fog: new THREE.Color(0x08161a), music: 0.25 },

function bottomFade(frac = 0.16) {

  const g = c.getContext('2d');

  side.addColorStop(1, '#000000');
  g.fillStyle = side; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const fadeTex = bottomFade();
function paintedPlane(path, w, h, opts = {}) {
  return new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: artTex(path), fog: true, ...opts })
  );
}
const cart = paintedPlane('art/near-noodle.webp', 10.5, 4.18, { transparent: true, alphaMap: fadeTex });
cart.position.set(-10.6, 2.09, -7);
cart.rotation.y = 0.10;
glow(cart, 0.2, 1.0, 0.6, 2.8, 0xffa245, 0.36);

stall.position.set(10.9, 2.69, -8);
stall.rotation.y = -0.13;

/* continuous midground: one tiling band of lantern strings behind the

  const px = W / MID_TILE;
  /* two sagging cords per tile, lanterns hung along them */
  const cords = [[0, 0.5, 40], [0.5, 1, 70]];

    for (let i = 1; i < 5; i++) {

      const ly = y0 + 2 * t * (1 - t) * 2 * sag * 0.5 + 8;
      ctx.strokeStyle = 'rgba(6,5,8,0.8)'; ctx.lineWidth = 2;

function makeValueNoise() {
  const S = 256, G = 24;
  const gridR = new Float32Array(G * G), gridG = new Float32Array(G * G);
  for (let i = 0; i < G * G; i++) { gridR[i] = Math.random(); gridG[i] = Math.random(); }
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(S, S);
  const sample = (grid, u, v) => {
    const x = (u * G) % G, y = (v * G) % G;
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = grid[y0 * G + x0], b = grid[y0 * G + (x0 + 1) % G];
    const d = grid[((y0 + 1) % G) * G + x0], e = grid[((y0 + 1) % G) * G + (x0 + 1) % G];
    const top = a + (b - a) * sx, bot = d + (e - d) * sx;
    return top + (bot - top) * sy;
  };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const k = (y * S + x) * 4, u = x / S, v = y / S;
    img.data[k] = sample(gridR, u, v) * 255;
    img.data[k + 1] = sample(gridG, u, v) * 255;
    img.data[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

  a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);

const flashSprite = new THREE.Sprite(new THREE.SpriteMaterial({

function spawnAttackSwoosh(kind, dir) {

/* pose keyframes: W = wind-up (anticipation), S = strike (full

/* Arm bones are posed in bone-local space (pRotLocal): local Z is the
   side axis, so a jab is a pure rz swing, upper arm to ~horizontal and
   the forearm straightening through it. */
const PUNCH_W = {
  upperarmR: [0, 0, 0.7], forearmR: [0, 0, 1.5],
  upperarmL: [0, 0, -0.9], forearmL: [0, 0, 1.2],
  chest: [0, -0.28, 0.05], spine: [0, -0.12, 0.03],
  fist: 1, innerDX: -0.1, innerDY: 0, hipsDY: -0.07

const PUNCH_S = {
  upperarmR: [0, 0, -1.6], forearmR: [0, 0, -0.1],
  upperarmL: [0, 0, -0.4], forearmL: [0, 0, -1.2],
  chest: [0, -0.25, 0.17], spine: [0, -0.12, 0.08], head: [0, -0.14, 0],
  thighL: [0, 0, -0.25], thighR: [0, 0, 0.3],
  fist: 1.85, innerDX: 0.45, innerDY: -0.03, hipsDY: -0.09
};
const KICK_W = {
  thighR: [0, 0, -0.55], shinR: [0, 0, 1.35],
  upperarmR: [0, 0, 0.3], upperarmL: [0, 0, 0.3], chest: [0, 0, -0.06],
  fist: 1, innerDX: -0.06, innerDY: 0, hipsDY: -0.1
};
const KICK_S = {
  thighR: [0, 0, -1.78], shinR: [0, 0, 0.06], footR: [0, 0, -0.45],
  chest: [0, 0, -0.3], spine: [0, 0, -0.15], head: [0, 0, -0.1],
  upperarmR: [0, 0, 0.7], upperarmL: [0, 0, 0.7],
  forearmR: [0, 0, 0.4], forearmL: [0, 0, 0.4], thighL: [0, 0, 0.2],

  const W = misoAtk.kind === 'punch' ? PUNCH_W : KICK_W;
  const S = misoAtk.kind === 'punch' ? PUNCH_S : KICK_S;
  const u = Math.min(1, misoAtk.t / misoAtk.dur);

  if (u < 0.22) { const k = u / 0.22; kw = k * k; }
  else if (u < 0.45) { const k = (u - 0.22) / 0.23; kw = 1 - k; ks = easeOutBackF(k); }

/* dog fight poses: telegraph = rear back with paws up; strike = the

function applyDogPose(e) {
  const a = e.pose;
  if (!a) return;
  const big = e.boss ? 1.35 : 1;
  if (e.state === 'telegraph') {
    const w = Math.min(1, e.t / 0.26), k = w * w;
    pRot(a, 'chest', 0, 0, -0.24 * big * k);
    pRot(a, 'spine', 0, 0, -0.13 * big * k);
    pRot(a, 'head', 0, 0, -0.12 * k);
    pRot(a, 'upperarmR', 0, 0, -1.05 * k);
    pRot(a, 'upperarmL', 0, 0, -1.05 * k);
    pRot(a, 'forearmR', 0, 0, 0.35 * k);
    pRot(a, 'forearmL', 0, 0, 0.35 * k);
    pOff(a, 'hips', 0, (e.boss ? 0.09 : -0.055) * k, 0);
  } else if (e.state === 'strike') {
    const s = Math.max(0, 1 - e.t / 0.4);
    pRot(a, 'chest', 0, 0, 0.3 * big * s);
    pRot(a, 'spine', 0, 0, 0.14 * s);
    pRot(a, 'head', 0, 0, 0.16 * s);
    pRot(a, 'upperarmR', 0, 0, -0.55 * s);

function updateStreet(dt, inp) {
  const sec = section();
  /* hit-stop bookkeeping: this frame's freeze state for Miso's
     animation + attack timeline (positions/input stay live) */
  misoFrozen = misoFreezeT > 0;
  misoFreezeT = Math.max(0, misoFreezeT - dt);
  /* movement */
  const mv = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  let moving = mv !== 0;
  if (swing.on) {
    /* pendulum: gravity + pump (hold a direction to build swing in
       that direction), light damping, hard clamps so the arc can
       never reach the ground or wrap the pole */
    const edtS = misoFrozen ? 0 : dt;
    swing.lift = Math.min(1, swing.lift + edtS / SWING_LIFT_T);
    if (mv !== 0) swing.w += mv * 2.3 * edtS;
    swing.w += -(26 / swing.L) * Math.sin(swing.th) * edtS;
    swing.w *= Math.exp(-0.10 * edtS);
    swing.w = THREE.MathUtils.clamp(swing.w, -2.9, 2.9);
    swing.th = THREE.MathUtils.clamp(swing.th + swing.w * edtS, -1.2, 1.2);
    swingPoint();
    G.playerX = THREE.MathUtils.clamp(swing.px, 2, sec.len - 2);
    moving = Math.abs(swing.w) > 0.25;
    /* swing kick: continuous hit window while the kick pose is out —
       connecting mid-pass deals kick damage + strong knockback */
    swing.kickT = Math.max(0, swing.kickT - dt);
    if ((inp.punch || inp.kick) && swing.kickT <= 0 && !misoAtk.kind) startSwingKick();
    if (swing.kickT > 0) {
      for (const e of enemies) {
        if (e.dead || swing.kickHit.has(e)) continue;
        if (Math.abs(e.x - G.playerX) < 2.05 && (e.jumpY || 0) < 1.6 && swing.py < 4.4) {
          swing.kickHit.add(e);
          hurtEnemy(e, 1, swing.kickDir, 'kick');
          e.kb += swing.kickDir * 3.4;
        }
      }
    }
    if (inp.jump) releaseSwing();
  } else {
    if (mv !== 0) G.facing = mv;
    /* release drift: leftover swing momentum, decays fast */
    if (swingDrift !== 0) {
      G.playerX += swingDrift * dt;
      swingDrift *= Math.exp(-2.6 * dt);
      if (Math.abs(swingDrift) < 0.05) swingDrift = 0;
    }
    G.playerX = THREE.MathUtils.clamp(G.playerX + mv * 7.4 * dt, 2, sec.len - 2);
    /* jump */
    if (inp.jump && G.jumpY === 0) { G.vy = 9.8; G.jumpY = 0.001; AudioPack.sfx('jump'); }
    if (G.jumpY > 0 || G.vy !== 0) {
      G.jumpY += G.vy * dt; G.vy -= 24 * dt;
      if (G.jumpY <= 0) { G.jumpY = 0; G.vy = 0; }
    }
  }

  if (waveQueue.length && enemies.filter(e => !e.dead).length < 2) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnEnemy(waveQueue.shift()); spawnT = 0.9; }
  }
  /* throw / hook / release: yarn near a lamp-pole anchor hooks the
     pole instead of throwing (a dog right in front keeps the throw);
     yarn again while swinging releases */
  yarn.cool -= dt;
  if (inp.throw && !yarn.active) {
    if (swing.on) releaseSwing();
    else if (yarn.cool <= 0 && tryHook()) { /* hooked — no throw */ }
    else if (yarn.cool <= 0) {
      yarn.active = true; yarn.phase = 'out'; yarn.dist = 0;
      yarn.dir = G.facing; yarn.x = G.playerX; yarn.z = STREET_Z;
      G.throws++;
      AudioPack.sfx('throw');
    }
  }
  if (yarn.active) {
    if (yarn.phase === 'out') {
      yarn.dist += 17 * dt;
      const bx = G.playerX + yarn.dir * yarn.dist;
      for (const e of enemies) {
        if (!e.dead && Math.abs(e.x - bx) < 0.9 && G.jumpY < 2.2) {
          hurtEnemy(e, 1, yarn.dir, 'yarn');
          yarn.phase = 'back';
          break;
        }
      }
      if (yarn.dist >= 7.5) yarn.phase = 'back';
    } else {
      yarn.dist -= 26 * dt;
      if (yarn.dist <= 0) { yarn.active = false; yarn.cool = 0.32; }
    }
  }
  /* melee: punch (Z) / kick (C) / touch-A combo. One hit check per
     swing at hitAt; the pose itself is applied in renderMisoStreet. */
  atkCoolT -= dt;
  if (!swing.on && !misoAtk.kind && G.jumpY === 0 && atkCoolT <= 0) {
    if (inp.punch) {
      /* touch A alternates punch/kick as a combo; keyboard Z is
         always a punch and C is always a kick */
      if (inp.punchTouch && comboAlt) startMisoAttack('kick');
      else startMisoAttack('punch');
      if (inp.punchTouch) comboAlt = !comboAlt;

  if (misoAtk.kind) {
    const def = ATK_DEF[misoAtk.kind];
    if (!misoFrozen && !(window.__debug && window.__debug.atkHold)) misoAtk.t += dt;
    const u = misoAtk.t / misoAtk.dur;
    if (!misoAtk.whooshDone && u >= 0.22) {
      misoAtk.whooshDone = true;
      AudioPack.sfx(def.sfxWhoosh);
      spawnAttackSwoosh(misoAtk.kind, misoAtk.dir);

    if (!misoAtk.hitDone && misoAtk.t >= misoAtk.hitAt) {

         (continuous pass check + strong knockback), not this one */
      if (!swing.on) {

          const d = (e.x - G.playerX) * misoAtk.dir;
          if (!e.dead && d > 0.05 && d < def.range) hurtEnemy(e, 1, misoAtk.dir, misoAtk.kind);
        }
      }
    }
    if (misoAtk.t >= misoAtk.dur) { misoAtk.kind = null; atkCoolT = 0.07; }
  }

    if (e.freezeT > 0) { e.freezeT -= dt; edt = 0; }
    if (window.__debug && window.__debug.holdEnemies) edt = 0;
    e.t += edt;
    e.flashT = Math.max(0, e.flashT - dt);

      if (e.char && e.t > 0.9) e.char.wrap.position.y = -Math.min(1.1, (e.t - 0.9) * 1.6);
      continue;
    }
    const dx = G.playerX - e.x, adx = Math.abs(dx);
    if (e.state === 'hitstun') {
      if (e.t > 0.3) { e.state = 'chase'; e.t = 0; }
    } else if (e.state === 'telegraph') {
      e.facing = Math.sign(dx) || 1;
      if (e.t >= 0.35) {
        e.state = 'strike'; e.t = 0; e.strikeHitDone = false;
        if (e.char) charPlay(e.char, 'Attack', false);
        AudioPack.sfx('lunge');
        spawnSwoosh(ANCHOR_X + (e.x - G.playerX) + e.facing * 0.9, 1.5,
          STREET_Z + e.zoff + 1.0, e.boss ? 1.8 : 1.35, e.facing, 1.0, -1.2, 0xff9a7a);
        if (e.boss) { e.vy = 7.5; e.jumpY = 0.001; }

        if (e.jumpY > 0 || e.vy !== 0) {

          e.x += e.facing * 1.4 * edt;
          if (e.jumpY <= 0) {

            AudioPack.sfx('crash');

            spawnBurst(wxB, 0.7, STREET_Z + e.zoff);
            spawnImpactBurst(wxB, 0.9, STREET_Z + e.zoff + 1.0, 1.25, 0xffd9a0);
            if (adx < 2.0 && G.jumpY === 0) hurtPlayer(e.x);
          }
        }
        if (e.t > 0.85) { e.state = 'chase'; e.t = 0; }
      } else {
        /* committed lunge: faster drive, hit checked across the
           whole pass-through window instead of one instant */
        e.x += e.facing * e.speed * 3.4 * edt;
        if (!e.strikeHitDone && e.t > 0.05) {
          if (Math.abs(G.playerX - e.x) < 1.05 && G.jumpY < 1.15) {
            e.strikeHitDone = true;
            hurtPlayer(e.x);
          } else if (e.t > 0.32) e.strikeHitDone = true;
        }
        if (e.t > 0.45) { e.state = 'chase'; e.t = 0; }
      }
    } else { /* chase */
      if (adx > e.reach * 0.82) {
        e.facing = Math.sign(dx) || 1;
        e.x += e.facing * e.speed * edt;
      } else if (G.jumpY < 1.2) {
        e.state = 'telegraph'; e.t = 0;
        AudioPack.sfx('bark');
      }
    }
    /* separation so dogs don't stack */
    for (const o of enemies) {
      if (o !== e && !o.dead && Math.abs(o.x - e.x) < 0.85) e.x += Math.sign(e.x - o.x) * 1.4 * edt;
    }

    if (e.char) {
      const wx = ANCHOR_X + (e.x - G.playerX);

      e.char.wrap.position.set(wx, (e.jumpY || 0) + bobA, STREET_Z + e.zoff);

      p.mesh.position.set(ANCHOR_X + (p.x - G.playerX), 0.95 + Math.sin(p.t * 3) * 0.1, STREET_Z);

    if (sec.alley && !alleyOpen) {

    } else if (!sec.alley) {

function renderMisoStreet(dt, moving) {
  const breathe = Math.sin(G.time * 2.1) * 0.03;
  misoG.position.set(ANCHOR_X, swing.on ? swing.py : G.jumpY + (moving ? 0 : breathe), STREET_Z);
  /* lean into the swing arc */
  misoG.rotation.z = swing.on ? -swing.th * 0.42 : 0;
  const targetRot = G.facing > 0 ? 0 : Math.PI;
  let d = targetRot - misoG.rotation.y;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  misoG.rotation.y += d * Math.min(1, dt * 14);
  if (miso.char && miso.char.mixer) {
    /* pose overrides: undo last frame's deltas, let the mixer write
       the base pose (frozen during hit-stop), then layer the attack */
    if (miso.char.pose) poseRestore(miso.char.pose);
    const mdt = misoFrozen ? 0 : dt;
    if (moving || G.jumpY > 0) {
      charPlay(miso.char, 'Walk');
      miso.char.mixer.update(mdt * (moving ? 1.15 : 0.6));
    } else {
      charStop(miso.char);
      miso.char.mixer.update(mdt);
    }
    applyMisoPose();
    /* red emissive flash while Miso is freshly hurt */
    misoFlashT = Math.max(0, misoFlashT - dt);
    const mk = misoFlashT / 0.18;
    if (misoFlashT > 0 || mk === 0) setEmissive(miso.char, mk * 1.2, mk * 0.25, mk * 0.25);
  }
  if (moving && G.jumpY === 0) {
    G.stepAcc += 7.4 * dt;
    if (G.stepAcc > 2.3) {
      G.stepAcc = 0;
      AudioPack.footstep(Math.random());
      spawnPawRipple(ANCHOR_X + (Math.random() - 0.5) * 0.4, STREET_Z + 0.9);
    }

     swing line from Miso's paw up to the anchor ring */
  const showYarn = yarn.active || swing.on;
  yarnBall.visible = showYarn;
  yarnString.visible = showYarn;
  if (swing.on && !yarn.active) {
    const ax = ANCHOR_X + (swing.ax - G.playerX), ay = ANCHOR_Y;
    yarnBall.position.set(ax, ay, STREET_Z);

    const px = ANCHOR_X + G.facing * 0.35, py = swing.py + 1.3;
    for (let i = 0; i < STRING_PTS; i++) {

      pos[i * 3] = px + (ax - px) * k;
      pos[i * 3 + 1] = py + (ay - py) * k - Math.sin(k * Math.PI) * 0.1;

    const bx = ANCHOR_X + yarn.dir * yarn.dist;
    const by = 1.3 + Math.sin(Math.min(yarn.dist / 7.5, 1) * Math.PI) * 0.45 + G.jumpY;
    yarnBall.position.set(bx, by, STREET_Z);
    const pos = stringGeo.attributes.position.array;
    const px = ANCHOR_X + G.facing * 0.4, py = 1.35 + G.jumpY;
    for (let i = 0; i < STRING_PTS; i++) {
      const k = i / (STRING_PTS - 1);
      pos[i * 3] = px + (bx - px) * k;
      pos[i * 3 + 1] = py + (by - py) * k - Math.sin(k * Math.PI) * 0.22;
      pos[i * 3 + 2] = STREET_Z;
    }
    stringGeo.attributes.position.needsUpdate = true;
  }
  /* alley sign render */
  const pulse = alleyOpen ? 0.55 + Math.sin(G.time * 5) * 0.3 : 0.13;
  alleySign.position.x = entranceWorldX();
  alleySign.children.forEach((c, i) => { if (c.isSprite) c.material.opacity = pulse; });
  /* shadow + pool follow */
  contactShadow.position.set(ANCHOR_X, 0.04, STREET_Z + 0.1);
  const shScale = 1 - G.jumpY * 0.12;
  contactShadow.scale.set(Math.max(0.5, shScale), Math.max(0.5, shScale), 1);
  lightPool.position.set(ANCHOR_X, 0.06, STREET_Z + 0.3);

}

const OB_POOL = { crate: [], puddle: [], sign: [], star: [], dog: [] };
function getOb(kind) {

function spawnRunnerEvent() {

  if (roll < 0.30) {           // star line in one lane
    const lane = lanes[Math.floor(Math.random() * 3)];
    for (let i = 0; i < 5; i++) {
      const o = getOb('star');
      o.lane = lane; o.z = ALLEY_Z - 78 - i * 3.2;
      o.mesh.position.set(lane * 2.2, 1.15, o.z);
    }

  if (roll < 0.42) {           // dog standing in a lane
    const o = getOb('dog');
    o.lane = freeLane; o.z = ALLEY_Z - 78;
    o.mesh.position.set(o.lane * 2.2, 0, o.z);
    return;
  }
  /* obstacle row: block two lanes (or one), always leave freeLane open */
  for (const lane of lanes) {
    if (lane === freeLane) continue;
    if (Math.random() < 0.22) continue;

    const o = getOb(kind);

function updateRunner(dt, inp) {
  if (R.slowmo > 0) { R.slowmo -= dt; dt *= 0.35; }
  R.t += dt;
  R.speed = 9 + Math.min(6, R.t * 0.13);
  R.dist += R.speed * dt;
  /* lanes */
  if (inp.leftEdge) R.lane = Math.max(-1, R.lane - 1);
  if (inp.rightEdge) R.lane = Math.min(1, R.lane + 1);
  R.laneX += (R.lane * 2.2 - R.laneX) * Math.min(1, dt * 11);
  /* jump / duck */
  if (inp.jump && R.jumpY === 0 && R.duckT <= 0) { R.vy = 9.6; R.jumpY = 0.001; AudioPack.sfx('jump'); }
  if (R.jumpY > 0 || R.vy !== 0) {
    R.jumpY += R.vy * dt; R.vy -= 23 * dt;
    if (R.jumpY <= 0) { R.jumpY = 0; R.vy = 0; }
  }
  R.duckT = inp.duck && R.jumpY === 0 ? 0.2 : Math.max(0, R.duckT - dt);
  /* throw (clears a dog standee ahead in this lane) */
  yarn.cool -= dt;
  if (inp.throw && yarn.cool <= 0 && !yarn.active) {
    yarn.active = true; yarn.phase = 'out'; yarn.dist = 0; yarn.dir = 1;
    G.throws++;
    AudioPack.sfx('throw');
  }
  if (yarn.active) {
    const ballZ = ALLEY_Z - 1 - yarn.dist;
    if (yarn.phase === 'out') {
      yarn.dist += 20 * dt;
      for (const o of obstacles) {
        if (o.kind === 'dog' && o.active && !o.cleared && o.lane === R.lane && Math.abs(o.z - ballZ) < 1.2) {
          o.cleared = true;
          G.score += 60; updateScore();
          AudioPack.sfx('yip');
          spawnBurst(R.laneX, 1.6, o.z);
          if (o.char) o.mesh.rotation.x = -0.5;
          yarn.phase = 'back';
        }
      }
      if (yarn.dist >= 13) yarn.phase = 'back';
    } else {
      yarn.dist -= 30 * dt;
      if (yarn.dist <= 0) { yarn.active = false; yarn.cool = 0.3; }
    }
    yarnBall.visible = true; yarnString.visible = true;
    const bz = ALLEY_Z - 1 - yarn.dist;
    yarnBall.position.set(R.laneX, 1.3 + R.jumpY, bz);
    const pos = stringGeo.attributes.position.array;
    for (let i = 0; i < STRING_PTS; i++) {
      const k = i / (STRING_PTS - 1);
      pos[i * 3] = R.laneX;
      pos[i * 3 + 1] = 1.3 + R.jumpY - Math.sin(k * Math.PI) * 0.2;
      pos[i * 3 + 2] = ALLEY_Z - 1 - yarn.dist * k;
    }

  R.nextEv -= dt;
  if (R.nextEv <= 0 && R.t < R.dur - 6) { spawnRunnerEvent(); R.nextEv = Math.max(0.8, 1.35 - R.t * 0.008) * (11 / R.speed); }
  for (const o of obstacles) {
    if (!o.active) continue;
    o.z += R.speed * dt;
    o.mesh.position.z = o.z;
    if (o.kind === 'star') {
      o.mesh.position.y = 1.15 + Math.sin(G.time * 3 + o.z) * 0.1;
      o.mesh.rotation.y += dt * 2.4;
    }
    if (o.kind === 'dog' && o.char && o.char.mixer) {
      charPlay(o.char, 'Walk');
      o.char.mixer.update(dt);
    }
    if (!o.crossed && o.z >= ALLEY_Z - 0.6) {
      o.crossed = true;
      const sameLane = o.lane === R.lane;
      if (o.kind === 'star') {
        if (sameLane && R.jumpY < 1.3) {
          o.active = false; o.mesh.visible = false;
          G.score += 10; updateScore(); AudioPack.sfx('collect');
        }
      } else if (sameLane && !o.cleared) {
        let crash = false;
        if (o.kind === 'crate' || o.kind === 'puddle') crash = R.jumpY < 1.05;
        else if (o.kind === 'sign') crash = R.duckT <= 0 && R.jumpY < 0.4;
        else if (o.kind === 'dog') crash = true;
        if (crash) {
          o.cleared = true;

          hurtPlayer(G.playerX + 1);
        }

    if (o.z > ALLEY_Z + 9) { o.active = false; o.mesh.visible = false; }

  misoG.scale.set(1, duckScale, 1);

    charPlay(miso.char, 'Walk');
    miso.char.mixer.update(dt * 1.5);
  }

  for (const p of runnerFg) {
    p.mesh.position.z += R.speed * dt;
    if (p.mesh.position.z > ALLEY_Z + 8) p.mesh.position.z -= p.span;
  }

  if (R.t >= R.dur) exitRunner();
}

  },
  /* swing + occluder hooks (swing/occluder probes) */
  swing,
  forceHook: () => tryHook(true),
  releaseSwing: () => { if (swing.on) releaseSwing(); },
  setEnemyX: (e, x) => { e.x = x; },
  occluderState: () => fgProps.map(p => ({
    x: p.def.x, kind: p.def.kind, seam: !!p.def.seam, hook: !!p.def.hook,
    worldX: Math.round(p.mesh.position.x * 100) / 100,
    worldZ: p.mesh.position.z, visible: p.mesh.visible
  })),
  seamWorldX: sx => ANCHOR_X + (sx - G.playerX),
  cartState: () => ({ x: Math.round(streetCart.x * 10) / 10,
    worldX: Math.round(streetCart.mesh.position.x * 100) / 100,
    worldZ: streetCart.mesh.position.z, visible: streetCart.mesh.visible }),
  setCartX: v => { streetCart.x = v; }
};
window.__debugScene = () => ({ scene, camera, misoG, miso, renderer });
/* attract mode (?auto=1): simple AI inputs for later video capture */
let autoThrowT = 0, autoPulseT = 0;
function computeAuto(dt) {
  const a = { left: false, right: false, jump: false, up: false, duck: false, throw: false, punch: false, kick: false };
  autoPulseT -= dt;
  if (G.mode === 'title' && window.__ready) startGame();
  if (G.mode === 'street') {
    const e = enemies.find(e => !e.dead);
    if (e) {
      const d = e.x - G.playerX;
      if (d > 3.2) a.right = true;
      else if (d < -3.2) a.left = true;
      else if (Math.abs(d) < 2.1) { autoThrowT -= dt; if (autoThrowT <= 0) { a.punch = true; autoThrowT = 0.55; } }
      else { autoThrowT -= dt; if (autoThrowT <= 0) { a.throw = true; autoThrowT = 0.55; } }
    } else if (alleyOpen) {
      if (G.playerX < ENTRANCE_LOCAL - 1.5) a.right = true;
      else a.up = true;
    } else a.right = true;
  } else if (G.mode === 'runner') {
    let danger = null, dangerDz = 1e9;
    for (const o of obstacles) {
      if (!o.active || o.cleared || o.kind === 'star' || o.lane !== R.lane) continue;
      const dz = (ALLEY_Z - 0.6) - o.z;
      if (dz > 0 && dz < dangerDz) { danger = o; dangerDz = dz; }
    }
    if (danger) {
      if ((danger.kind === 'crate' || danger.kind === 'puddle') && dangerDz < 7.5) a.jump = true;
      else if (danger.kind === 'sign' && dangerDz < 8) a.duck = true;
      else if (danger.kind === 'dog') {
        if (dangerDz < 13) { autoThrowT -= dt; if (autoThrowT <= 0) { a.throw = true; autoThrowT = 0.5; } }
        if (dangerDz < 4.5 && autoPulseT <= 0) { if (R.lane === 0) a.right = true; else a.left = true; autoPulseT = 0.45; }
      }
    }
  }
  window.__autoInput = a;
}

/* --------------------------------- loop --------------------------------- */
const clock = new THREE.Clock();
let frames = 0, fpsTime = 0, readyFrames = 0;
window.__fps = 0;
window.__ready = false;
let pointerX = 0, pointerY = 0, tx = 0, ty = 0;
window.addEventListener('pointermove', e => {
  tx = (e.clientX / window.innerWidth - 0.5) * 2;
  ty = (e.clientY / window.innerHeight - 0.5) * 2;
});
let gamePaused = false;
document.addEventListener('visibilitychange', () => { gamePaused = document.hidden; });
updateHearts(); updateScore(); setDistrictLabel();

function animate() {
  requestAnimationFrame(animate);
  const dtReal = Math.min(clock.getDelta(), 0.05);
  const dt = dtReal;
  const t = clock.elapsedTime;
  G.time += dtReal;
  if (FLAGS.has('auto')) computeAuto(dtReal);
  const inp = readInput();
  pressed = {};
  if (!gamePaused && !fading) {
    if (G.mode === 'street') { G.elapsed += dt; updateStreet(dt, inp); }
    else if (G.mode === 'runner') { G.elapsed += dt; updateRunner(dt, inp); }
    else if (G.mode === 'title') { renderMisoStreet(dt, false); }
  }
  G.invulnT = Math.max(0, G.invulnT - dt);
  misoG.visible = !(G.invulnT > 0 && (G.mode === 'street' || G.mode === 'runner') && (G.time * 16) % 2 > 1.3);
  G.shakeT = Math.max(0, G.shakeT - dt);
  flashT = Math.max(0, flashT - dt);
  flashSprite.material.opacity = flashT * 5;
  dmgFlashV = Math.max(0, dmgFlashV - dt * 1.8);
  dmgEl.style.opacity = dmgFlashV * 0.9;
  if (G.time > promptUntil) promptEl.style.opacity = 0;

  pointerX += (tx - pointerX) * 0.04;
  pointerY += (ty - pointerY) * 0.04;
  /* scroll for the street strip: follows the course in street modes */
  const scrollDist = section().base + G.playerX;
  const scrollSegs = scrollDist / SEG_W;
  const i0 = Math.floor(scrollSegs), frac = scrollSegs - i0;
  for (let j = 0; j < segMeshes.length; j++) {
    const m = segMeshes[j];
    m.position.x = (j - 1 - frac) * SEG_W;
    const idx = THREE.MathUtils.clamp(i0 + j, 0, segStream.length - 1);
    if (m.userData.streamIdx !== idx) {
      m.material.map = segTexByKey[segStream[idx]];
      m.material.needsUpdate = true;
      m.userData.streamIdx = idx;
    }
    const gn = segGain[segStream[idx]];
    if (gn) m.material.color.copy(gn);
  }
  /* district grade */
  const lk = 1 - Math.exp(-dt * 1.1);
  zoneCur.tint.lerp(zoneTarget.tint, lk);
  zoneCur.fog.lerp(zoneTarget.fog, lk);
  zoneCur.music += (zoneTarget.music - zoneCur.music) * lk;
  scene.fog.color.copy(zoneCur.fog);
  gradePass.uniforms.uTint.value.copy(zoneCur.tint);
  window.__music = Math.round(zoneCur.music * 100) / 100;
  /* far band + near stalls */
  const farScroll = scrollDist * 0.38;
  for (const p of farPlanes) {
    const u = (((p.userData.base - farScroll) % FAR_SPAN) + FAR_SPAN) % FAR_SPAN;
    p.position.x = u - FAR_SPAN / 2 + FAR_W / 2;
  }
  midTex.offset.x = (scrollDist * 0.92) / MID_TILE;
  for (const tr of nearTracks) {
    const u = (scrollDist + tr.phase) % tr.period;
    tr.mesh.position.x = 95 - u;
  }
  /* camera */
  if (G.mode === 'runner') {
    const target = new THREE.Vector3(R.laneX * 0.55, 4.1, ALLEY_Z + 10.0);
    camera.position.lerp(target, 1 - Math.exp(-dt * 4));
    camera.lookAt(R.laneX * 0.7, 1.15, ALLEY_Z - 10);
  } else {
    const swayX = Math.sin(t * 0.10) * 1.7;
    const swayY = Math.sin(t * 0.073) * 0.30;
    const shX = G.shakeT > 0 ? (Math.random() - 0.5) * G.shakeT * 1.4 : 0;
    const shY = G.shakeT > 0 ? (Math.random() - 0.5) * G.shakeT * 1.1 : 0;
    const target = new THREE.Vector3(
      swayX + pointerX * 1.1 + shX,
      4.6 + swayY - pointerY * 0.55 + shY,
      camZ() + Math.sin(t * 0.05) * 0.7
    );
    camera.position.lerp(target, G.mode === 'title' ? 1 : 1 - Math.exp(-dt * 4));
    camera.lookAt(swayX * 0.35, 4.05, -14);
  }
  /* ambience */
  const fl = 0.92 + Math.sin(t * 11.3) * 0.04 + Math.sin(t * 23.7) * 0.03;
  warm.intensity = 90 * fl;
  lightPool.material.opacity = 0.38 * fl;
  glows.forEach((g, i) => { g.material.opacity = g.userData.baseOpacity * (0.9 + 0.1 * Math.sin(t * 9 + i * 1.7)); });
  const rp = rainGeo.attributes.position.array;
  const rainCx = G.mode === 'runner' ? 0 : 0, rainCz = G.mode === 'runner' ? ALLEY_Z - 10 : 0;
  for (let i = 0; i < RAIN; i++) {
    rp[i * 3 + 1] -= 15.5 * dt;
    rp[i * 3] -= 1.3 * dt;
    if (rp[i * 3 + 1] < 0) { rp[i * 3 + 1] = 20; rp[i * 3] = rainCx - 28 + Math.random() * 56; rp[i * 3 + 2] = rainCz - 17 + Math.random() * 30; }
    if (rp[i * 3] < rainCx - 28) rp[i * 3] = rainCx + 28;
  }
  rainGeo.attributes.position.needsUpdate = true;
  street.material.uniforms.uTime.value = t;
  awning.position.x = 40 - ((scrollDist * 1.5) % 190);
  fgSign.position.x = 60 - ((scrollDist * 1.5 + 95) % 260);
  /* foreground occluders scroll with the street (section-local
     layout, same in both street sections); hidden in the runner,
     which has its own streaming foreground. Anchor rings flare
     when Miso is close enough to hook them. */
  const nearAnchor = (G.mode === 'street' && !swing.on) ? anchorInRange(false) : null;
  for (const p of fgProps) {
    const sx = ANCHOR_X + (p.def.x - G.playerX);
    p.mesh.position.x = sx;
    p.mesh.visible = G.mode !== 'runner' && Math.abs(sx) < 46;
    if (p.ring) {
      const hot = nearAnchor === p.def;
      const s = hot ? 1.25 + Math.sin(t * 10) * 0.15 : 1;
      p.ring.scale.set(s, s, 1);
      p.ring.material.opacity = hot ? 1 : 0.75;
    }
  }
  /* pushcart rolls across the street on its own path (street modes
     only; wraps the whole course so its crossings land irregularly) */
  if (G.mode === 'street' || G.mode === 'title') streetCart.x -= dt * 3.0;
  if (streetCart.x < -6) streetCart.x = 168;
  streetCart.mesh.position.x = ANCHOR_X + (streetCart.x - G.playerX);
  streetCart.mesh.visible = G.mode !== 'runner' && Math.abs(streetCart.mesh.position.x) < 44;
  fgSign.rotation.z = Math.sin(t * 0.6) * 0.02;
  for (const m of mistBands) {
    m.position.x = Math.sin(t * 0.05 + m.userData.ph) * 7;
    m.material.opacity = m.userData.op * (0.8 + 0.2 * Math.sin(t * 0.11 + m.userData.ph));
  }
  for (const p of steamPuffs) {
    const life = (t / p.dur + p.ph) % 1;
    p.sp.getWorldPosition(tmpV);
    const near = Math.max(0, 1 - Math.abs(tmpV.x + 0.6) / 3);
    const part = near * Math.sign(tmpV.x + 0.6 || 1) * life * 1.3;
    p.sp.position.x = p.bx + life * 0.5 + part;
    p.sp.position.y = p.by + life * 2.3;
    const sc = p.s * (1.1 + life * 2.6);
    p.sp.scale.set(sc, sc, 1);
    p.sp.material.opacity = Math.sin(Math.PI * life) * 0.15 * (1 - near * 0.3);
  }
  splashMat.uniforms.uTime.value = t;
  for (const r of pawRipples) {
    if (r.life > 1) { r.mesh.visible = false; continue; }
    r.life += dt / 0.8;
    const s = 0.5 + r.life * 1.6;
    r.mesh.scale.set(s, s, 1);
    r.mesh.material.opacity = Math.max(0, 1 - r.life) * 0.5;
  }
  updateBursts(dt);
  if (!(window.__debug && window.__debug.fxHold)) updateComicFx(dt);
  const cyc = t % 47;
  if (cyc < 8 && G.mode !== 'runner') {
    const k = cyc / 8;
    passerby.position.x = 30 - k * 60;
    passerby.material.opacity = 0.55 * Math.sin(Math.PI * Math.min(k * 1.12, 1));
  } else passerby.material.opacity = 0;

  if (FLAGS.has('nobloom')) renderer.render(scene, camera); else composer.render();

  frames++; fpsTime += dtReal;
  if (fpsTime >= 1) { window.__fps = Math.round(frames / fpsTime); frames = 0; fpsTime = 0; }
  readyFrames++;
  if (!window.__ready && readyFrames >= 5 && window.__artLoaded && miso.ready) {
    window.__ready = true;
    if (window.Shell) {
      window.Shell.ready();
      if (FLAGS.has('veil')) setTimeout(() => startGame(), 400);
    }
  }
  /* live test hooks */
  const wg = window.__game;
  wg.mode = G.mode;
  wg.hearts = G.hearts;
  wg.score = G.score;
  wg.district = section().district;
  wg.playerX = G.mode === 'runner' ? Math.round(R.dist * 10) / 10 : Math.round(G.playerX * 10) / 10;
  wg.enemiesAlive = enemies.filter(e => !e.dead).length;
  wg.bossHp = bossRef ? bossRef.hp : null;
  wg.projectile = yarn.active;
  wg.throws = G.throws;
  wg.dmgDealt = G.dmgDealt;
  wg.punches = G.punches;
  wg.kicks = G.kicks;
  wg.enemies = enemies.map(e => ({ type: e.type, hp: e.hp, x: Math.round(e.x * 10) / 10, state: e.state }));
  wg.swinging = swing.on;
  wg.swingLine = swing.on;
  wg.anchorX = swing.on ? swing.ax : (nearAnchor ? nearAnchor.x : null);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
<script src="shell/shell.js"></script>
</body>
