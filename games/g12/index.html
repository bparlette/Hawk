<title>Blade Punch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One arcade cabinet column: 256x224 pixel screen on top, NES-style pad below, built for a phone held upright. */
:root{
  --bg:#0d0e13;
  --frame:#c9c5b7;
  --face:#26262a;
  --ink:#17171a;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  min-height:100%;
  padding-block:12px 20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;justify-content:center;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cab{width:100%;max-width:512px;display:flex;flex-direction:column;gap:14px;min-width:0}
.screen-wrap{background:#000;border:3px solid var(--frame);border-radius:10px;overflow:hidden;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/224;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dpad ab" "mid mid";
  gap:14px 10px;align-items:center;
  background:var(--frame);border-radius:14px;padding:16px 14px 14px;
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:148px;height:148px;touch-action:none;justify-self:start}
.bar{position:absolute;background:var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px #2d2d33}
.bar.h{left:0;right:0;top:calc(50% - 25px);height:50px}
.bar.v{top:0;bottom:0;left:calc(50% - 25px);width:50px}
.hub{position:absolute;left:calc(50% - 14px);top:calc(50% - 14px);width:28px;height:28px;border-radius:50%;background:#101013}
.ar{position:absolute;background:#55555c}
.ar.u{top:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:flex-start;gap:16px;background:var(--face);border-radius:12px;padding:16px 10px 10px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:8px}
.round{
  width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 16px var(--pixel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 9px var(--pixel);color:#c9c5b7;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;justify-content:center;gap:22px}
.mid button{
  border:0;background:var(--ink);color:#c9c5b7;font:400 10px var(--pixel);
  padding:10px 14px;border-radius:999px;cursor:pointer;touch-action:none;min-width:96px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{margin:0;color:var(--muted);font-size:12px;line-height:1.6;text-align:center;text-wrap:balance}
.keys b{color:var(--text);font-weight:500}
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Blade Punch game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, DODGE">B</button><span>DODGE</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, JAB">A</button><span>JAB</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> A or B = punch to deflect the ball once it turns red and closes in. Time it late. Deflect until you are the last boxer standing. Enter starts, M mutes.</p>
</main>

  for (let i = 0; i < q.length; i++) {
    const [x, y, d, fx, fy] = q[i];
    if (d > 0 && goal(x, y)) return { dx:fx, dy:fy, d };
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + a, ny = y + b;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h || seen[ny * w + nx] || !pass(nx, ny)) continue;
      seen[ny * w + nx] = 1; q.push([nx, ny, d + 1, d ? fx : a, d ? fy : b]);

/* bot input from a direction vector (dx,dy) */
function dirInp(i, dx, dy) { if (dx > 0) i.r = 1; if (dx < 0) i.l = 1; if (dy > 0) i.d = 1; if (dy < 0) i.u = 1; return i; }
/* edge-detect helper: S.edge(inp,'a') true only on the frame a button goes down */
function mkEdge() { const p = {}; return (inp, k) => { const v = !!inp[k], r = v && !p[k]; p[k] = v; return r; }; }
function kit(c) {

  return {
    id:c.id, t1:c.t1, t2:c.t2, sub:c.sub, music:c.music,
    init(att) { fresh(att); },
    update(dt, inp, mode) {
      S.att = mode === 'title'; S.T += dt;
      if (S.att && S.T > (c.secs || 60)) { fresh(true); return; }
      for (let i = S.pops.length - 1; i >= 0; i--) { S.pops[i].t += dt; if (S.pops[i].t > 1.1) S.pops.splice(i, 1); }
      if (c.step(S, dt, inp, S.att) === 'reset') fresh(true);

    render() { c.draw(S); },
    hud(mode) { c.hud && c.hud(S, mode); drawPops(S); },
    info() { return Object.assign({ score:Math.round(S.score), t:+S.T.toFixed(1) }, c.info ? c.info(S) : {}); },

}
/* finish helper: attract loops, real play ends. */
function finish(S, msg, bonus) { if (S.att) return 'reset'; endGame(S.score + (bonus || 0), msg); }

// KEYS: A or B = punch to deflect the ball once it turns red and closes in. Time it late. Deflect until you are the last boxer standing.
/* ===== BLADE PUNCH: Punch-Out!! x Blade Ball. Eight boxers in a ring, one glowing ball. Deflect it back at someone else;
   whoever misses is launched out of the ring. Each deflection makes it faster. ===== */
const GAME = kit({
  id:'g12', t1:'BLADE', t2:'PUNCH', sub:'DEFLECT THE BALL. LAST BOXER STANDING.', seed:5, off:12, secs:48,
  music:MUS(172, -21, true),
  setup(S) {
    S.bx = []; const cols = [R, GR, Y, PU, O, CY, PK];
    S.bx.push({ x:128, y:176, sc:1.6, col:B, alive:true, fx:0, fy:0, fr:0 });
    for (let i = 0; i < 7; i++) { const a = Math.PI * (1.12 + i * 0.1285 * 1.0) ; S.bx.push({ x:128 + Math.cos(a) * 100, y:116 + Math.sin(a) * 50, sc:0.8 + (Math.sin(a) < -0.8 ? 0 : 0.3), col:cols[i], alive:true, fx:0, fy:0, fr:0 }); }
    S.ball = { from:0, to:1 + rint(S, 7), ph:'hover', t:0, w:0.9 }; S.n = 0; S.lives = 3; S.cd = 0; S.miss = 0; S.endT = 0; S.flash = 0; S.out = 0;
  },
  step(S, dt, inp) {
    const bl = S.ball, B_ = S.bx; S.cd = Math.max(0, S.cd - dt); S.flash = Math.max(0, S.flash - dt);
    for (const b of B_) if (b.fr) { b.x += b.fx * dt; b.y += b.fy * dt; b.fy += 260 * dt; b.fr += dt * 12; }
    if (S.endT) { S.endT += dt; if (S.endT > 2.2) return finish(S, 'KO! YOU WIN', 500 + S.lives * 100); return; }
    const press = S.edge(inp, 'a') | S.edge(inp, 'b');
    if (press && S.cd <= 0) { S.cd = 0.25; S.punch = 0.2; sfx('swing'); if (bl.ph === 'fly' && bl.to === 0 && bl.t > 0.55) { S.good = 1; } }
    S.punch = Math.max(0, (S.punch || 0) - dt);
    const alive = B_.filter(b => b.alive).length;
    if (alive === 1) { S.endT = 0.01; return; }
    if (bl.ph === 'hover') { bl.w -= dt; if (bl.w <= 0) { bl.ph = 'fly'; bl.t = 0; bl.dur = Math.max(0.34, 1.5 * Math.pow(0.95, S.n)); sfx('go'); } return; }
    bl.t += dt / bl.dur;
    if (bl.to === 0 && S.good) { S.good = 0; bl.t = 1.01; this_deflect(S, 0); return; }
    if (bl.t < 1) return;
    const tg = B_[bl.to];
    if (bl.to === 0) {
      S.lives--; S.flash = 0.3; sfx('hurt'); popup(S, 'HIT!', 128, 150, R);
      if (S.lives <= 0) { if (S.att) return 'reset'; endGame(S.score, 'KNOCKED OUT'); return; }
      return this_next(S, 0);
    }
    const duel = alive === 2, pm = Math.min(0.75, 0.07 + 0.02 * S.n + (duel ? 0.1 * S.miss : 0));
    if (rint(S, 1000) / 1000 < pm || (duel && S.miss >= 5)) {
      tg.alive = false; tg.fx = (tg.x - 128) * 1.3 + 20; tg.fy = -150; tg.fr = 1; S.score += 100; sfx('boom'); popup(S, 'OUT!', tg.x, tg.y - 20, Y); S.out++;
      return this_next(S, bl.to);
    }
    if (duel) S.miss++;
    this_deflect(S, bl.to);
  },
  draw(S) {
    clear(N); rect(0, 0, VW, 60, M); for (let x = 0; x < VW; x += 8) rect(x, 40 + (x >> 3 & 1) * 6, 8, 20, x % 16 ? T : D);
    rect(0, 60, VW, 164, DG);
    for (let r = 0; r < 4; r++) { const y = 70 + r * 36; rect(10 + r * 8, y, 236 - r * 16, 3, r % 2 ? R : W); }
    for (let j = -56; j <= 56; j += 2) { const w = 138 * Math.sqrt(1 - (j / 56) * (j / 56)); rect(128 - w, 123 + j, w * 2, 2, j % 4 ? S_ : L); }
    for (const b of S.bx.slice().sort((a, c) => a.y - c.y)) box(S, b);
    const bl = S.ball, f = S.bx[bl.from], t = S.bx[bl.to];
    if (bl.ph === 'hover') { const bob = Math.sin(S.T * 8) * 3; fillCircle(f.x, f.y - 40 * f.sc + bob, 4, CY); fillCircle(f.x, f.y - 40 * f.sc + bob, 2, W); rect(t.x - 6, t.y - 50 * t.sc, 12, 2, Y); }
    else { const u = Math.min(1, bl.t), x = f.x + (t.x - f.x) * u, y = f.y - 30 + (t.y - f.y) * u - Math.sin(u * 3.14) * 24, r = 3 + Math.round(u * 4 * t.sc / 1.6 * (bl.to ? 1 : 2));
      for (let k = 1; k < 4; k++) { const v = Math.max(0, u - k * 0.04); fillCircle(f.x + (t.x - f.x) * v, f.y - 30 + (t.y - f.y) * v - Math.sin(v * 3.14) * 24, Math.max(1, r - k), k > 1 ? M : R); }
      fillCircle(x, y, r, R); fillCircle(x, y, Math.max(1, r - 2), Y); }
    if (S.flash) rect(0, 0, VW, VH, R);
  },
  hud(S, mode) {
    txt('LEFT ' + S.bx.filter(b => b.alive).length, 4, 4, W, 8); txt('SPD x' + (1 + S.n * 0.5).toFixed(1), 252, 4, CY, 8, 'right');
    txt('LIVES ' + S.lives, 4, 16, R, 8);
    if (S.ball.ph === 'fly' && S.ball.to === 0 && S.ball.t > 0.5) txt('PUNCH!', 128, 90, R, 16, 'center');
    if (mode === 'play' && S.T < 8) txt('A/B: PUNCH WHEN BALL IS CLOSE', 128, 208, W, 8, 'center');
    if (S.endT) txt('LAST ONE STANDING!', 128, 70, Y, 8, 'center');
  },
  bot(S, i) { const b = S.ball; if (b.ph === 'fly' && b.to === 0 && b.t > 0.7 + (S.n % 3) * 0.04) i.a = 1; return i; },
  info(S) { return { left:S.bx.filter(b => b.alive).length, n:S.n, lives:S.lives, out:S.out, h:S.h, end:S.endT > 0 }; },
});
const S_ = 3;
function this_next(S, from) { const al = S.bx.map((b, i) => b.alive && i !== from ? i : -1).filter(i => i >= 0); const bl = S.ball; bl.from = from; bl.to = al[rint(S, al.length)]; bl.ph = 'hover'; bl.w = 0.8; }
function this_deflect(S, who) {
  S.n++; S.score += 20 + S.n * 5; sfx('punch'); if (who === 0) { popup(S, 'DEFLECT x' + S.n, 128, 140, CY); S.punch = 0.3; }
  const al = S.bx.map((b, i) => b.alive && i !== who ? i : -1).filter(i => i >= 0), bl = S.ball;
  bl.from = who; bl.to = al[rint(S, al.length)]; S.h = ((S.h || 7) * 31 + bl.to) % 9973; bl.ph = 'fly'; bl.t = 0; bl.dur = Math.max(0.34, 1.5 * Math.pow(0.95, S.n));

function box(S, b) {
  const s = b.sc, x = Math.round(b.x), y = Math.round(b.y), me = b === S.bx[0];
  if (b.fr) { rect(x - 5, y - 20, 10, 14, b.col); fillCircle(x, y - 26, 5, O); return; }
  if (!b.alive) return;
  rect(x - 8 * s, y + 2, 16 * s, 3, K);
  const w = Math.round(14 * s), h = Math.round(16 * s);
  rect(x - w / 2, y - h, w, h - 6 * s, me ? BRK : b.col); rect(x - w / 2, y - 6 * s, w, 8 * s, me ? B : W);
  fillCircle(x, y - h - 5 * s, Math.round(5 * s), me ? BRK : O);
  const up = me && S.punch > 0 ? 18 : 0;
  fillCircle(x - w / 2 - 3 * s, y - h + 4 * s - (me ? up * 0 : 0), Math.round(3.5 * s), R); fillCircle(x + w / 2 + 3 * s, y - h + 2 * s - up * s * 0.6, Math.round(3.5 * s), R);

/* ---------- shell: title / play / over flow, loop, test hooks ---------- */
let mode = 'title', overT = 0, result = null, hi = 0, blink = 0, botOn = false, tms = 0;
const HIK = 'nes6-hi-' + GAME.id;
try { hi = parseInt(localStorage.getItem(HIK) || '0', 10) || 0; } catch (_) {}
function endGame(score, msg) {
  if (mode !== 'play') return;
  mode = 'over'; overT = 0;
  const isBest = score > hi;
  if (isBest) { hi = score; try { localStorage.setItem(HIK, String(hi)); } catch (_) {} }
  result = { score, msg, isBest };
  sfx(msg && /CLEAR|WIN|KO!|FINISH/.test(msg) ? 'win' : 'over');
}
GAME.init(true);
function begin() { tms = 0; blink = 0; GAME.init(false); mode = 'play'; result = null; }
function step(dt) {
  blink += dt; tms += dt;
  const raw = readInput();
  if (mode === 'title') {
    if (raw.start) { begin(); sfx('beep'); }
    else GAME.update(dt, GAME.bot ? GAME.bot() : BLANK, 'title');
  } else if (mode === 'play') {
    GAME.update(dt, botOn && GAME.bot ? GAME.bot() : raw, 'play');
  } else {
    overT += dt;
    if (raw.start && overT > 1.5) { begin(); sfx('beep'); }
  }
}
function render() {
  GAME.render(mode);
  for (let i = 0; i < buf.length; i++) px32[i] = PAL32[buf[i]];
  ctx.putImageData(img, 0, 0);
  GAME.hud(mode);
  const WH = HEX[W], YE = HEX[Y];
  if (mode === 'title') {
    panel(16, 12, 224, 96);
    const s1 = GAME.t1.length <= 6 ? 32 : 24;
    txt(GAME.t1, 128, s1 === 32 ? 22 : 28, YE, s1, 'center');
    txt(GAME.t2, 128, 62, WH, GAME.t2.length > 8 ? 16 : 24, 'center');
    txt(GAME.sub, 128, 90, HEX[CY], 8, 'center');
    if (Math.floor(blink * 2) & 1) txt('PRESS START', 128, 120, WH, 8, 'center');
    txt('HI ' + pad5(hi), 128, 134, YE, 8, 'center');
  } else if (mode === 'over' && result) {
    panel(32, 52, 192, 100);
    txt(result.msg || 'GAME OVER', 128, 64, YE, 16, 'center');
    txt('SCORE ' + pad5(result.score), 128, 94, WH, 8, 'center');
    if (result.isBest) { if (Math.floor(blink * 3) & 1) txt('NEW BEST!', 128, 110, HEX[E], 8, 'center'); }
    else txt('BEST ' + pad5(hi), 128, 110, WH, 8, 'center');
    if (overT > 1.5 && (Math.floor(blink * 2) & 1)) txt('PRESS START', 128, 130, WH, 8, 'center');
  }
}
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  render();
  requestAnimationFrame(frame);
}
if (!window.__norun) requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
window.__shell = {
  start: () => begin(),
  bot: on => { botOn = !!on; },
  ff: n => { for (let i = 0; i < n; i++) step(1 / 60); },
  render,
  step: () => { window.__now = (window.__now || 0) + 1 / 60; step(1 / 60); },
  info: () => Object.assign({ mode, result, hi }, GAME.info ? GAME.info() : {}),
  go: () => { startEdge = true; },
  mode: () => mode, music: () => GAME.music,
  get seed() { return activeSeed; }, get seedFromUrl() { return SEED_Q; },

})();
