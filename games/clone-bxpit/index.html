<script type="module">
import { TouchController, isTouchDevice } from './gptouch.js';
// ── TOUCH BRIDGE (gamepress mod): gptouch -> the game's OWN input state.
// The game logic above is untouched. This bridge only writes the same
// mouse / keys / jp state that the keyboard, mouse and gamepad paths
// already write, once per frame:
//   stick X        -> keys.KeyA / keys.KeyD   (paddle move, via padMX)
//   stick flicks   -> jp.Arrow*               (menu nav, via navD)
//   stick held     -> mouse aim leads off the paddle (mouse = aimT source)
//   button A       -> jp.Space                (fire in pit, confirm in menus)
//   button B       -> jp.Escape               (cancel / close panel)
//   quick tap      -> mouse position + mouse.click (canvas-drawn menus:
//                     village buttons, building slots, level-up cards)
const forceTouch = new URLSearchParams(location.search).get('touch') === '1';
const TC = new TouchController({ buttons: [{ id: 'a', label: 'A' }, { id: 'b', label: 'B' }], force: forceTouch ? true : undefined });
window.__gptouch = TC;
if (TC.enabled) {
  const owned = { KeyA: false, KeyD: false };
  const latch = { x: 0, y: 0 };
  const setHeld = (code, on) => { if (on && !keys[code]) jp[code] = true; keys[code] = on; };
  const flick = (v, axis, pos, neg) => {
    if (v > 0.6) { if (latch[axis] !== 1) { jp[pos] = true; latch[axis] = 1; } }
    else if (v < -0.6) { if (latch[axis] !== -1) { jp[neg] = true; latch[axis] = -1; } }
    else if (Math.abs(v) < 0.3) latch[axis] = 0;
  };
  function poll() {
    const ti = TC.getInput();
    const L = ti.x < -0.35, R = ti.x > 0.35;
    if (L !== owned.KeyA) { setHeld('KeyA', L); owned.KeyA = L; }
    if (R !== owned.KeyD) { setHeld('KeyD', R); owned.KeyD = R; }
    flick(ti.x, 'x', 'ArrowRight', 'ArrowLeft');
    flick(ti.y, 'y', 'ArrowDown', 'ArrowUp');
    try {
      if ((Math.abs(ti.x) > 0.35 || Math.abs(ti.y) > 0.35) && D && D.pad) {
        mouse.x = Math.max(0, Math.min(W, D.pad.x + ti.x * 110));

    const els = document.querySelectorAll('[data-gptouch]');

      if (x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 12 && y <= r.bottom + 12) return true; }
    return false;
  };

    try { initAudio(); if (typeof audioCtx !== 'undefined' && audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (err) {}
