<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bounty Meter — AR Wanted Poster</title>
<link rel="stylesheet" href="vendor/fonts/fonts-local.css">
<link rel="stylesheet" href="ar.css">
<style>
  /* THEME PALETTE (pack: "leonida") */
  :root{--poster-ink:#33200f;--poster-red:#7d160e;--poster-stamp:#a11a10}
  #poster{position:absolute;left:872px;top:26px;width:392px;height:618px;transform:rotate(1.6deg);
    background-color:#c8a165;background-image:url(assets/paper.jpg);background-size:cover;
    background-blend-mode:multiply;border-radius:4px;color:#2a1a10;
    box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 60px rgba(101,67,33,.45);
    padding:26px 26px 20px;text-align:center}
  #poster.left{left:16px;transform:rotate(-1.6deg)}
  #poster::before{content:"";position:absolute;inset:10px;border:3px solid rgba(58,36,18,.85);pointer-events:none}
  #poster::after{content:"";position:absolute;inset:17px;border:1px solid rgba(58,36,18,.6);pointer-events:none}
  #tape{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-2deg);width:150px;height:34px;
    background:rgba(232,220,170,.75);box-shadow:0 2px 5px rgba(0,0,0,.25);border-left:2px dashed rgba(0,0,0,.15);
    border-right:2px dashed rgba(0,0,0,.15)}
  #wanted{font-family:'Rye';font-size:74px;letter-spacing:.04em;line-height:1;color:#33200f;
    text-shadow:0 2px 0 rgba(255,240,200,.35)}
  #deadline{font-family:'Special Elite';font-size:19px;letter-spacing:.34em;margin-top:2px;color:#4a2c14}
  #stars{font-size:44px;letter-spacing:8px;margin:14px 0 2px;color:rgba(58,36,18,.28);text-shadow:0 1px 0 rgba(255,240,200,.3)}
  #stars .lit{color:var(--poster-stamp);text-shadow:0 0 14px rgba(200,40,30,.35)}
  #crime{font-family:'Special Elite';font-size:17px;letter-spacing:.12em;color:#54341a;margin-top:4px}
  #amount{font-family:'Anton';font-size:96px;line-height:1.02;color:var(--poster-red);margin-top:8px;
    text-shadow:0 3px 0 rgba(255,240,200,.3)}
  #amount small{font-size:52px;vertical-align:16px}
  #tier{font-family:'Anton';font-size:31px;letter-spacing:.1em;color:#33200f;margin-top:6px}
  #bonus{min-height:30px;font-family:'Special Elite';font-size:19px;color:var(--poster-stamp);margin-top:8px}
  #stamp{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) rotate(-11deg) scale(2.4);
    border:5px solid var(--poster-stamp);color:var(--poster-stamp);font-family:'Anton';font-size:30px;letter-spacing:.08em;
    padding:5px 16px 2px;border-radius:6px;opacity:0;pointer-events:none;background:rgba(240,220,180,.25)}
  #stamp.hit{animation:stampin .3s cubic-bezier(.2,2.2,.4,1) forwards}
  @keyframes stampin{to{transform:translateX(-50%) rotate(-11deg) scale(1);opacity:.92}}
  #foot{position:absolute;left:0;right:0;bottom:26px;font-family:'Special Elite';font-size:15px;
    letter-spacing:.18em;color:#54341a}
  #rate{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;z-index:5;background:rgba(10,10,14,.78);color:#ffd76a;
    font:600 17px 'Barlow Condensed';letter-spacing:.14em;padding:5px 12px;border-radius:999px}
  #confettiVid{position:absolute;left:872px;top:64px;width:392px;height:221px;object-fit:cover;z-index:5;
    mix-blend-mode:screen;filter:saturate(1.35) contrast(1.06);opacity:0;transition:opacity .45s;pointer-events:none}
  #confettiVid.left{left:16px}
  #confettiVid.on{opacity:1}
</style>
</head>
<body data-app="bounty-meter">
<video id="cam" playsinline muted autoplay></video>
<div id="fallback"><div class="tv"></div><div class="lamp" style="left:3%"></div><div class="lamp" style="right:3%"></div><div class="sofa"></div></div>

<div id="stage">
  <video id="confettiVid" src="assets/confetti-burst.mp4" muted loop playsinline preload="auto"></video>
  <div id="poster">
    <div id="tape"></div>
    <div id="wanted">WANTED</div>
    <div id="deadline">DEAD OR ALIVE</div>
    <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <div id="crime">FOR CRIMES AGAINST TRAFFIC</div>
    <div id="amount"><small>$</small><span id="amt">0</span></div>
    <div id="tier">NUISANCE</div>
    <div id="bonus"></div>
    <div id="stamp">PUBLIC ENEMY #1</div>
    <div id="foot">REWARD PAID IN CASH · NO QUESTIONS ASKED</div>
  </div>
</div>
<div id="rate" style="display:none">CHAOS ×1</div>

<canvas id="fx"></canvas>
<div id="topbar"><div><span class="ttl">💰 BOUNTY METER</span> <span class="sub">AR wanted poster</span></div></div>
<div id="bar">
  <button class="act primary" id="btn-chaos">🔥 Start Chaos</button>
  <button class="act gold" id="btn-cash">💵 Cash Out</button>
  <button class="act small" id="btn-side">⇄ Side</button>
</div>

<script src="scaffold.js"></script>
<script>
AR.init();
/* ===== THEME PACK: "leonida" — tiers, incident text pack, poster copy ===== */
var THEME = {
  name: 'leonida',
  confettiVideo: 'assets/confetti-burst.mp4',   /* owner-supplied confetti loop (Nov 16) — CASH OUT burst */
  wanted: 'WANTED', deadline: 'DEAD OR ALIVE',
  crime: 'FOR CRIMES AGAINST TRAFFIC',
  foot: 'REWARD PAID IN CASH · NO QUESTIONS ASKED',
  stamp: 'PUBLIC ENEMY #1',
  incidents: ['MAYHEM BONUS','PROPERTY DAMAGE','SIDEWALK DRIVING','PALM TREE ASSAULT',
    'EXCESSIVE DONUTS','BRIDGE JUMP','WRONG-WAY HEROICS','HYDRANT GNOMES LIBERATED']
};
document.getElementById('wanted').textContent = THEME.wanted;
document.getElementById('deadline').textContent = THEME.deadline;
document.getElementById('crime').textContent = THEME.crime;
document.getElementById('foot').textContent = THEME.foot;
document.getElementById('stamp').textContent = THEME.stamp;
var TIERS = [
  {at:0,     name:'NUISANCE',        mult:1, stars:1},
  {at:2500,  name:'MENACE',          mult:2, stars:2},
  {at:7500,  name:'CITYWIDE THREAT', mult:4, stars:3},
  {at:20000, name:'PUBLIC ENEMY #1', mult:8, stars:5}
];
var INCIDENTS = THEME.incidents;
var bounty = 0, running = false, tier = 0, lastT = 0, nextIncident = 0;
var amtEl = document.getElementById('amt'), tierEl = document.getElementById('tier'),
    bonusEl = document.getElementById('bonus'), starsEl = document.getElementById('stars'),
    stampEl = document.getElementById('stamp'), rateEl = document.getElementById('rate'),
    chaosBtn = document.getElementById('btn-chaos');
function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }
function curTier(){ var t=0; for (var i=0;i<TIERS.length;i++) if (bounty>=TIERS[i].at) t=i; return t; }
function render(){
  amtEl.textContent = fmt(bounty);
  var t = curTier();
  tierEl.textContent = TIERS[t].name;
  rateEl.textContent = 'CHAOS ×' + TIERS[t].mult + (running ? ' · +$' + (140*TIERS[t].mult) + '/s' : '');
  var spans = starsEl.children;
  for (var i=0;i<5;i++) spans[i].className = i < TIERS[t].stars ? 'lit' : '';
  if (t !== tier){
    tier = t;
    if (t === TIERS.length-1){ stampEl.classList.remove('hit'); void stampEl.offsetWidth; stampEl.classList.add('hit'); AR.sfx.sting(); }
    else if (t > 0){ AR.sfx.pop(); AR.toast(TIERS[t].name + '!', 1100); }
  }
}
function loop(ts){
  requestAnimationFrame(loop);
  if (!running){ lastT = ts; return; }
  var dt = Math.min(0.1, (ts - lastT)/1000); lastT = ts;
  bounty += 140 * TIERS[curTier()].mult * dt;
  if (ts > nextIncident){
    nextIncident = ts + 3800 + Math.random()*3600;
    var bonus = 250 + Math.floor(Math.random()*650);
    bounty += bonus;
    bonusEl.textContent = INCIDENTS[Math.floor(Math.random()*INCIDENTS.length)] + ' +$' + bonus;
    AR.sfx.coin(3);
    setTimeout(function(){ bonusEl.textContent=''; }, 2600);
  }
  render();
}
requestAnimationFrame(loop);
chaosBtn.addEventListener('click', function(){
  running = !running; lastT = performance.now();
  chaosBtn.textContent = running ? '⏸ Stop Chaos' : '🔥 Start Chaos';
  chaosBtn.classList.toggle('on', running);
  rateEl.style.display = running ? 'block' : 'none';
  if (running) AR.toast('THE BOUNTY GROWS…', 1100);
  render();
});
/* CASH OUT confetti: 'video' = owner loop only, 'both' = video + particles,
   'particles' = original. ?confetti= overrides for A/B. */
var CONFETTI_MODE = new URLSearchParams(location.search).get('confetti') || 'video';
window.__confettiMode = CONFETTI_MODE;
var confettiVid = document.getElementById('confettiVid'), confettiTimer = null;
function fireConfettiVideo(){
  try { confettiVid.currentTime = 0; } catch(e){}
  confettiVid.play().catch(function(){});
  confettiVid.classList.add('on');
  clearTimeout(confettiTimer);
  confettiTimer = setTimeout(function(){ confettiVid.classList.remove('on'); }, 4200);
}
document.getElementById('btn-cash').addEventListener('click', function(){
  if (bounty < 50){ AR.toast('NO BOUNTY YET', 1000); return; }
  var paid = Math.floor(bounty);
  var c = AR.mapPoint(1070, 330);
  if (CONFETTI_MODE !== 'video') AR.burst.confetti(c.x, c.y, 130);
  if (CONFETTI_MODE !== 'particles') fireConfettiVideo();
  AR.sfx.coin(14);
  AR.toast('PAID OUT $' + fmt(paid), 1800);
  running = false; chaosBtn.textContent = '🔥 Start Chaos'; chaosBtn.classList.remove('on');
  rateEl.style.display = 'none';
  var t0 = performance.now();
  (function drain(){
    var t = (performance.now()-t0)/700;
    bounty = paid * Math.max(0, 1-t);
    render();
    if (t < 1) requestAnimationFrame(drain); else { bounty = 0; tier = 0; stampEl.classList.remove('hit'); render(); }
  })();
});
document.getElementById('btn-side').addEventListener('click', function(){
  var p = document.getElementById('poster');
  p.classList.toggle('left');
  confettiVid.classList.toggle('left', p.classList.contains('left'));
});
render();
</script>

<style id="universal-offsets">#ci-root.ci-tl{top:12px!important}#ar-mark-root{bottom:134px!important}</style>
<script src="mark-button.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { return window.AR.startCamera(); }, canvas: document.getElementById('fx')
  });
</script>
<script src="clean-view.js"></script>
<script>
/* ---- clean view + pinch zoom (owner feedback fix 2026-11-16) ---- */
CleanView.init({});
</script>
</body>
</html>
