<title>Maze Wrecker: Night Shift</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One arcade cabinet column: 256x224 pixel screen on top, NES-style pad below, built for a phone held upright. */
:root{
  --bg:#07070c;
  --deck:#17171d;
  --face:#26262c;
  --ink:#0c0c10;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{
  display:flex;justify-content:center;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  overflow:hidden;
}
/* Fullscreen stage (Cherie 2026-10-30): the GAME fills the screen; only the
   controls are visible besides it. No cabinet furniture. The stage flexes to
   every leftover pixel and the canvas scales with object-fit:contain —
   as large as the phone allows, never cropped, never distorted. */
.cab{
  position:relative;
  width:100%;height:100dvh;
  min-width:0;
}
.screen-wrap{position:absolute;inset:0;background:#000;line-height:0}
canvas{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 38%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(to bottom, rgba(5,5,8,0), rgba(5,5,8,.78) 32%);
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dpad ab" "mid mid";
  gap:10px;align-items:center;
  padding:26px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:clamp(132px, 36vw, 168px);height:clamp(132px, 36vw, 168px);touch-action:none;justify-self:start}
.bar{position:absolute;background:var(--face);border-radius:6px;box-shadow:inset 0 0 0 2px #33333c}
.bar.h{left:0;right:0;top:calc(50% - 22px);height:44px}
.bar.v{top:0;bottom:0;left:calc(50% - 22px);width:44px}
.hub{position:absolute;left:calc(50% - 13px);top:calc(50% - 13px);width:26px;height:26px;border-radius:50%;background:#101014}
.ar{position:absolute;background:#6a6a75}
.ar.u{top:8px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:8px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:8px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:8px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:center;gap:16px;padding:6px 4px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:7px}
.round{
  width:clamp(60px, 16.5vw, 78px);height:clamp(60px, 16.5vw, 78px);border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 16px var(--pixel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 9px var(--pixel);color:#a5a5b0;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;justify-content:center;gap:22px}
.mid button{
  border:0;background:var(--face);color:#c9c9d2;font:400 10px var(--pixel);
  padding:9px 14px;border-radius:999px;cursor:pointer;touch-action:none;min-width:96px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{position:absolute;top:8px;left:0;right:0;margin:0;padding:0 14px;color:var(--muted);font-size:11px;line-height:1.55;text-align:center;text-wrap:balance;pointer-events:none}
.keys b{color:var(--text);font-weight:500}
@media (pointer:coarse){ .keys{display:none} }
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Maze Wrecker: Night Shift game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, DASH">B</button><span>DASH</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, SMASH">A</button><span>SMASH</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> Arrows move, Z swings the hammer (smash bricks, STUN ghosts), X dashes. Enter starts, M mutes.</p>
</main>

<script>
(() => {

function hash(x, y) {

function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || x >= VW || y < 0 || y >= VH) return; buf[y * VW + x] = c; }

  ctx.fillStyle = HEX[W]; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x, y, 2, h); ctx.fillRect(x + w - 2, y, 2, h);

  shoot: () => tone(900, 0.06, 'square', 0.18, -500),
  hit:   () => { noise(0.08, 0.3); tone(220, 0.08, 'square', 0.2, -100); },
  boom:  () => { noise(0.35, 0.6); tone(120, 0.4, 'sawtooth', 0.3, -80); },
  coin:  () => { tone(988, 0.06, 'square', 0.22); tone(1319, 0.14, 'square', 0.22, 0, 0.06); },
  hurt:  () => tone(330, 0.3, 'sawtooth', 0.28, -260),
  die:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.14, 'square', 0.28, 0, i * 0.12)),
  power: () => tone(300, 0.4, 'square', 0.25, 900),
  beep:  () => tone(520, 0.12, 'square', 0.3),
  go:    () => tone(1040, 0.35, 'square', 0.3),
  win:   () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.28, 0, i * 0.13)),
  land:  () => { tone(120, 0.1, 'triangle', 0.5, -60); noise(0.06, 0.2); },
  throw: () => tone(500, 0.12, 'square', 0.2, 400),
  catch: () => { tone(700, 0.05, 'square', 0.25); tone(500, 0.08, 'square', 0.2, 0, 0.05); },
  super: () => { tone(200, 0.5, 'sawtooth', 0.3, 1200); noise(0.4, 0.4); },
  flap:  () => tone(420, 0.07, 'triangle', 0.4, 240),
  pop:   () => { noise(0.1, 0.4); tone(700, 0.1, 'square', 0.2, -500); },
  tick:  () => tone(1400, 0.03, 'square', 0.15),
  swing: () => tone(300, 0.18, 'sawtooth', 0.12, 300),
  punch: () => { noise(0.07, 0.4); tone(160, 0.1, 'square', 0.3, -80); },
  clear: () => [523, 659, 784].forEach((f, i) => tone(f, 0.08, 'square', 0.25, 0, i * 0.06)),

/* gamekit.js: shared helpers so a game file is only its rules. Appended after core.js.

    S.ghosts = spawns.map((s, i) => ({ x:s.x * TS32 + 8, y:s.y * TS32 + 8, dir:DK32[i % 4], sx:s.x, sy:s.y, kind:kinds[i % 3], col:cols[i % 3], eyes:false, stun:0, roamT:0, roamTx:s.x, roamTy:s.y }));

  },
  step(S, dt, inp, att) {
    const P = S.P;
    for (let i = S.fx.length - 1; i >= 0; i--) { const p = S.fx[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; if (p.t > p.life) S.fx.splice(i, 1); }

        sfx('boom'); popup(S, '+5', tx * TS32 + 8, ty * TS32, Y);
      } else {
        /* the new rule: a swing that reaches a foreman stuns him */
        const hx = P.x + fx * 13, hy = P.y + fy * 13;

      }
    }
    if (P.swing > 0) P.swing -= dt;

    {

        if (P.want !== P.dir) { const [dx, dy] = D32[P.want]; if (pass32(S, tx + dx, ty + dy)) P.dir = P.want; }
        const [dx, dy] = D32[P.dir];

      } else { const [dx, dy] = D32[P.dir]; const sp = P.dash > 0 ? 98 : 57; P.x += dx * sp * dt; P.y += dy * sp * dt; }
    }
    const pTx = Math.floor(P.x / TS32), pTy = Math.floor(P.y / TS32);
    const c = tile32(S, pTx, pTy);
    if (Math.hypot(P.x - (pTx * TS32 + 8), P.y - (pTy * TS32 + 8)) < 6) {
      if (c === '.') { S.tiles[pTy][pTx] = ' '; S.pellets--; S.eaten++; S.score += 10; sfx('coin'); if (S.eaten === 40 || S.eaten === 80) { S.fruits.push({ x:8, y:9, t:9 }); popup(S, 'BONUS FRUIT!', 128, 150, PK); } }
      else if (c === 'o') { S.tiles[pTy][pTx] = ' '; S.pellets--; S.eaten++; S.score += 50; S.frightT = 6; sfx('power'); popup(S, 'GHOSTS SCARED!', 128, 30, CY); }
    }
    for (let i = S.fruits.length - 1; i >= 0; i--) { const f = S.fruits[i]; f.t -= dt; if (f.t <= 0) { S.fruits.splice(i, 1); continue; } if (f.x === pTx && f.y === pTy) { S.score += 300; popup(S, '+300', P.x, P.y - 10, PK); sfx('coin'); S.fruits.splice(i, 1); } }
    if (S.frightT > 0) S.frightT -= dt;
    for (const g of S.ghosts) ghostStep32(S, g, dt);
    for (const g of S.ghosts) {
      if (g.stun > 0 || g.eyes) continue;
      if (Math.hypot(g.x - P.x, g.y - P.y) < 9) {
        if (S.frightT > 0) { g.eyes = true; S.score += 200; popup(S, '+200', g.x, g.y - 10, W); burst32(S, g.x, g.y, CY, 8); sfx('pop'); }
        else if (P.invuln <= 0) {
          S.lives--; sfx('die'); burst32(S, P.x, P.y, O, 14);

    if (S.pellets <= 0) return finish(S, 'MAZE CLEAR!', Math.ceil(Math.max(0, S.timeLeft)) * 10 + S.lives * 100);
  },
  draw(S) {
    clear(K);
    const P = S.P;
    for (let y = 0; y < MH32; y++) for (let x = 0; x < MW32; x++) {
      const c = S.tiles[y][x], X = x * TS32, Y0 = y * TS32;
      if (c === '#') { rect(X, Y0, TS32, TS32, N); rect(X, Y0, TS32, 2, DG); rect(X, Y0, 2, TS32, DG); }
      else if (c === 'B') { rect(X, Y0, TS32, TS32, BRK); rect(X + 1, Y0 + 1, 6, 5, T); rect(X + 9, Y0 + 1, 6, 5, T); rect(X + 5, Y0 + 8, 6, 5, T); rect(X + 1, Y0 + 8, 3, 5, M); rect(X + 12, Y0 + 8, 3, 5, M); rect(X, Y0 + 7, TS32, 1, M); }

    }
    for (const f of S.fruits) { const X = f.x * TS32, Y0 = f.y * TS32; fillCircle(X + 6, Y0 + 10, 3, R); fillCircle(X + 11, Y0 + 11, 3, R); px(X + 8, Y0 + 4, GR); px(X + 9, Y0 + 3, GR); }
    for (const g of S.ghosts) {
      const gx = Math.round(g.x - 6), gy = Math.round(g.y - 6);
      if (g.eyes) { px(gx + 2, gy + 4, W); px(gx + 3, gy + 4, W); px(gx + 8, gy + 4, W); px(gx + 9, gy + 4, W); px(gx + 3, gy + 5, B); px(gx + 9, gy + 5, B); }
      else if (g.stun > 0) { spr(GHOST32, gx, gy, false, { X: DG, W: Y, K: Y }); px(gx + 1, gy - 2, Y); px(gx + 10, gy - 3, Y); px(gx + 5, gy - 4, Y); }
      else if (S.frightT > 0) spr(GHOST32, gx, gy, false, { X: B, W: V, K: PK });

    if (P.swing > 0) {
      const [fx, fy] = D32[P.dir], hx = Math.round(P.x + fx * 11), hy = Math.round(P.y + fy * 11);

    }
    for (const p of S.fx) px(p.x, p.y, p.col);
    if (!S.att && S.timeLeft <= 10) { rect(0, 0, VW, 2, R); rect(0, VH - 2, VW, 2, R); }
    if (!S.att && S.timeLeft <= 30 && S.timeLeft > 10 && (Math.floor(S.T * 2) & 1)) { rect(0, 0, VW, 2, O); rect(0, VH - 2, VW, 2, O); }
  },
  ui(S) {
    /* HUD icons live here now: hud() runs after the blit, so spr() there never showed */
    for (let i = 0; i < S.lives - 1; i++) spr(WRECKER32, 8 + i * 12, 212, false, null);
  },
  hud(S, mode) {
    if (mode === 'title') return;
    txt('SC ' + pad5(S.score), 6, 3, W, 8);
    txt(Math.max(0, Math.ceil(S.timeLeft)) + 's', 128, 3, S.timeLeft <= 10 ? R : Y, 8, 'center');
    txt(S.pellets + ' LEFT', 250, 3, CY, 8, 'right');
  },
  info(S) { return { pellets:S.pellets, lives:S.lives, time:+S.timeLeft.toFixed(1), eaten:S.eaten, stuns:S.stuns, px:Math.round(S.P.x), py:Math.round(S.P.y), ghosts:S.ghosts.map(g => Math.round(g.x) + ',' + Math.round(g.y)).join(' ') }; },
  bot(S, i) {
    const P = S.P, pTx = Math.floor(P.x / TS32), pTy = Math.floor(P.y / TS32);
    let danger = null, dd = 1e9;
    for (const g of S.ghosts) { if (!g.eyes && g.stun <= 0 && S.frightT <= 0) { const d = Math.hypot(g.x - P.x, g.y - P.y); if (d < dd) { dd = d; danger = g; } } }
    if (danger && dd < 30) {
      /* stun it if it's in the facing arc, else run */
      const [fx, fy] = D32[P.dir];
      if (Math.hypot(danger.x - (P.x + fx * 13), danger.y - (P.y + fy * 13)) < 14 && P.swingCd <= 0) { i.a = 1; return i; }
      let bx = 0, by = 0, bv = -1;
      for (const k of DK32) { const nx = pTx + D32[k][0], ny = pTy + D32[k][1]; if (!pass32(S, nx, ny)) continue; const v = Math.hypot(danger.x - (nx * TS32 + 8), danger.y - (ny * TS32 + 8)); if (v > bv) { bv = v; bx = D32[k][0]; by = D32[k][1]; } }
      if (bx || by) { dirInp(i, bx, by); if (P.dashCd <= 0) i.b = 1; }

    }

    const goal = huntGhost
      ? ((x, y) => x === Math.floor(huntGhost.x / TS32) && y === Math.floor(huntGhost.y / TS32))

      step = bfs(MW32, MH32, (x, y) => tile32(S, x, y) !== '#', pTx, pTy, goal);
      if (step && tile32(S, pTx + step.dx, pTy + step.dy) === 'B') { dirInp(i, step.dx, step.dy); if (P.swingCd <= 0) i.a = 1; return i; }
    }
    if (step) dirInp(i, step.dx, step.dy);
    return i;
  },
});

/* ---------- shell: title / play / over flow, loop, test hooks ---------- */
let mode = 'title', overT = 0, result = null, hi = 0, blink = 0, botOn = false, tms = 0;
const HIK = 'nes6-hi-' + GAME.id;
try { hi = parseInt(localStorage.getItem(HIK) || '0', 10) || 0; } catch (_) {}
function endGame(score, msg) {
  if (mode !== 'play') return;
  mode = 'over'; overT = 0;
  const isBest = score > hi;
  if (isBest) { hi = score; try { localStorage.setItem(HIK, String(hi)); } catch (_) {} }

function begin() { tms = 0; blink = 0; GAME.init(false); mode = 'play'; result = null; }
function step(dt) {
  blink += dt; tms += dt;

    if (raw.start) { begin(); sfx('beep'); }
    else GAME.update(dt, GAME.bot ? GAME.bot() : BLANK, 'title');
  } else if (mode === 'play') {
    GAME.update(dt, botOn && GAME.bot ? GAME.bot() : raw, 'play');

}
function render() {

  ctx.putImageData(img, 0, 0);
  GAME.hud(mode);
  const WH = HEX[W], YE = HEX[Y];
  if (mode === 'title') {
    panel(16, 12, 224, 96);
    const s1 = GAME.t1.length <= 6 ? 32 : 24;
    txt(GAME.t1, 128, s1 === 32 ? 22 : 28, YE, s1, 'center');
    txt(GAME.t2, 128, 62, WH, GAME.t2.length > 8 ? 16 : 24, 'center');
    txt(GAME.sub, 128, 90, HEX[CY], 8, 'center');
    if (Math.floor(blink * 2) & 1) txt('PRESS START', 128, 120, WH, 8, 'center');
    txt('HI ' + pad5(hi), 128, 134, YE, 8, 'center');
  } else if (mode === 'over' && result) {
    panel(32, 52, 192, 100);
    txt(result.msg || 'GAME OVER', 128, 64, YE, 16, 'center');
    txt('SCORE ' + pad5(result.score), 128, 94, WH, 8, 'center');
    if (result.isBest) { if (Math.floor(blink * 3) & 1) txt('NEW BEST!', 128, 110, HEX[E], 8, 'center'); }
    else txt('BEST ' + pad5(hi), 128, 110, WH, 8, 'center');
    if (overT > 1.5 && (Math.floor(blink * 2) & 1)) txt('PRESS START', 128, 130, WH, 8, 'center');

}
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;

if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
window.__shell = {

  bot: on => { botOn = !!on; },
  ff: n => { for (let i = 0; i < n; i++) step(1 / 60); },

  step: () => { window.__now = (window.__now || 0) + 1 / 60; step(1 / 60); },
  info: () => Object.assign({ mode, result, hi }, GAME.info ? GAME.info() : {}),
  go: () => { startEdge = true; },
  mode: () => mode, music: () => GAME.music,
  get seed() { return activeSeed; }, get seedFromUrl() { return SEED_Q; },
};

})();
