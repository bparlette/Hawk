<title>Vampire Metroid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One arcade cabinet column: 256x224 pixel screen on top, NES-style pad below, built for a phone held upright. */
:root{
  --bg:#0d0e13;
  --frame:#c9c5b7;
  --face:#26262a;
  --ink:#17171a;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  min-height:100%;
  padding-block:12px 20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;justify-content:center;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cab{width:100%;max-width:512px;display:flex;flex-direction:column;gap:14px;min-width:0}
.screen-wrap{background:#000;border:3px solid var(--frame);border-radius:10px;overflow:hidden;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/224;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dpad ab" "mid mid";
  gap:14px 10px;align-items:center;
  background:var(--frame);border-radius:14px;padding:16px 14px 14px;
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:148px;height:148px;touch-action:none;justify-self:start}
.bar{position:absolute;background:var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px #2d2d33}
.bar.h{left:0;right:0;top:calc(50% - 25px);height:50px}
.bar.v{top:0;bottom:0;left:calc(50% - 25px);width:50px}
.hub{position:absolute;left:calc(50% - 14px);top:calc(50% - 14px);width:28px;height:28px;border-radius:50%;background:#101013}
.ar{position:absolute;background:#55555c}
.ar.u{top:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:9px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:9px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:flex-start;gap:16px;background:var(--face);border-radius:12px;padding:16px 10px 10px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:8px}
.round{
  width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 16px var(--pixel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 9px var(--pixel);color:#c9c5b7;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;justify-content:center;gap:22px}
.mid button{
  border:0;background:var(--ink);color:#c9c5b7;font:400 10px var(--pixel);
  padding:10px 14px;border-radius:999px;cursor:pointer;touch-action:none;min-width:96px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{margin:0;color:var(--muted);font-size:12px;line-height:1.6;text-align:center;text-wrap:balance}
.keys b{color:var(--text);font-weight:500}
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Vampire Metroid game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, DASH">B</button><span>DASH</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, JUMP">A</button><span>JUMP</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> Arrows move (auto-fire), Z/Space or X pick an upgrade when the level bar fills (Left/Right to choose). Enter starts, M mutes.</p>
</main>

<script>

      for (let y = 0; y < 224; y++) for (let x = (y & 1); x < 256; x += 2) buf[y * 256 + x] = K;
      rect(22, 68, 212, 88, W); rect(24, 70, 208, 84, N); rect(24, 70, 208, 2, B);
      S.menu.forEach((k, i) => { const x = 32 + i * 66, on = i === S.sel; rect(x - 2, 94, 64, 54, on ? Y : DG); rect(x, 96, 60, 50, on ? BRK : D); rect(x, 96, 60, 2, on ? Y : L); icon17(k, x + 30, 118, T); });
    }
  },
  hud(S, mode) {
    txt('LV ' + S.lvl, 4, 4, W, 8); txt('KILLS ' + S.kills, 252, 4, Y, 8, 'right');
    if (S.boss && S.boss.hp > 0) txt('HIVE QUEEN', 128, 202, PK, 8, 'center');
    if (mode === 'play' && S.T < 7) txt('MOVE: ARROWS  (SHOOTS ITSELF)', 128, 192, W, 8, 'center');
    if (S.menu) { txt('LEVEL UP! CHOOSE', 128, 76, Y, 8, 'center'); S.menu.forEach((k, i) => { const x = 32 + i * 66; txt(UP17[k], x + 30, 100, W, 8, 'center'); txt('LV ' + (S.lv[k] + 1), x + 30, 134, CY, 8, 'center'); }); }
  },
  bot(S, i) {
    const p = S.p;
    if (S.menu) { if (S.mt > 0.45) { const pr = [1, 3, 2, 0], k = S.menu.slice().sort((x, y) => S.lv[x] - S.lv[y] || pr.indexOf(x) - pr.indexOf(y))[0]; const s = S.menu.indexOf(k); const on = Math.floor(S.mt * 30) % 2; if (s > S.sel) i.r = on; else if (s < S.sel) i.l = on; else i.a = 1; } return i; }
    let fx = 0, fy = 0;
    for (const e of S.en) { const dx = p.x - e.x, dy = p.y - e.y, d2 = dx * dx + dy * dy + 1; if (d2 < 3600) { fx += dx / d2 * (e.big ? 1.2 : 1); fy += dy / d2 * (e.big ? 1.2 : 1); } }
    let tx = 0, ty = 0; const c = S.pel.find(q => Math.hypot(q.x - p.x, q.y - p.y) < 70); if (c) { tx = (c.x - p.x) * 0.002; ty = (c.y - p.y) * 0.002; }
    fx += tx + (128 - p.x) * 0.00012; fy += ty + (112 - p.y) * 0.00012;
    if (p.x < 24) fx += 0.01; if (p.x > 232) fx -= 0.01; if (p.y < 36) fy += 0.01; if (p.y > 190) fy -= 0.01;
    return dirInp(i, Math.abs(fx) > 0.0004 ? Math.sign(fx) : 0, Math.abs(fy) > 0.0004 ? Math.sign(fy) : 0);
  },
  info: S => ({ lvl:S.lvl, hp:Math.round(S.p.hp), en:S.en.length, boss:S.boss ? Math.round(S.boss.hp) : -1, lv:S.lv.join('') }),
});

/* ---------- shell: title / play / over flow, loop, test hooks ---------- */
let mode = 'title', overT = 0, result = null, hi = 0, blink = 0, botOn = false, tms = 0;
const HIK = 'nes6-hi-' + GAME.id;
try { hi = parseInt(localStorage.getItem(HIK) || '0', 10) || 0; } catch (_) {}
function endGame(score, msg) {
  if (mode !== 'play') return;
  mode = 'over'; overT = 0;
  const isBest = score > hi;
  if (isBest) { hi = score; try { localStorage.setItem(HIK, String(hi)); } catch (_) {} }
  result = { score, msg, isBest };
  sfx(msg && /CLEAR|WIN|KO!|FINISH/.test(msg) ? 'win' : 'over');
}
GAME.init(true);
function begin() { tms = 0; blink = 0; GAME.init(false); mode = 'play'; result = null; }
function step(dt) {
  blink += dt; tms += dt;
  const raw = readInput();
  if (mode === 'title') {
    if (raw.start) { begin(); sfx('beep'); }
    else GAME.update(dt, GAME.bot ? GAME.bot() : BLANK, 'title');
  } else if (mode === 'play') {
    GAME.update(dt, botOn && GAME.bot ? GAME.bot() : raw, 'play');
  } else {
    overT += dt;
    if (raw.start && overT > 1.5) { begin(); sfx('beep'); }
  }
}
function render() {
  GAME.render(mode);
  for (let i = 0; i < buf.length; i++) px32[i] = PAL32[buf[i]];
  ctx.putImageData(img, 0, 0);
  GAME.hud(mode);
  const WH = HEX[W], YE = HEX[Y];
  if (mode === 'title') {
    panel(16, 12, 224, 96);
    const s1 = GAME.t1.length <= 6 ? 32 : 24;
    txt(GAME.t1, 128, s1 === 32 ? 22 : 28, YE, s1, 'center');
    txt(GAME.t2, 128, 62, WH, GAME.t2.length > 8 ? 16 : 24, 'center');
    txt(GAME.sub, 128, 90, HEX[CY], 8, 'center');
    if (Math.floor(blink * 2) & 1) txt('PRESS START', 128, 120, WH, 8, 'center');
    txt('HI ' + pad5(hi), 128, 134, YE, 8, 'center');
  } else if (mode === 'over' && result) {
    panel(32, 52, 192, 100);
    txt(result.msg || 'GAME OVER', 128, 64, YE, 16, 'center');
    txt('SCORE ' + pad5(result.score), 128, 94, WH, 8, 'center');
    if (result.isBest) { if (Math.floor(blink * 3) & 1) txt('NEW BEST!', 128, 110, HEX[E], 8, 'center'); }
    else txt('BEST ' + pad5(hi), 128, 110, WH, 8, 'center');
    if (overT > 1.5 && (Math.floor(blink * 2) & 1)) txt('PRESS START', 128, 130, WH, 8, 'center');
  }
}
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  render();
  requestAnimationFrame(frame);
}
if (!window.__norun) requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
window.__shell = {
  start: () => begin(),
  bot: on => { botOn = !!on; },
  ff: n => { for (let i = 0; i < n; i++) step(1 / 60); },
  render,
  step: () => { window.__now = (window.__now || 0) + 1 / 60; step(1 / 60); },
  info: () => Object.assign({ mode, result, hi }, GAME.info ? GAME.info() : {}),
  go: () => { startEdge = true; },
  mode: () => mode, music: () => GAME.music,
  get seed() { return activeSeed; }, get seedFromUrl() { return SEED_Q; },
};

})();
</script>
