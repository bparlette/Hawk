<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Telestrator — Instant Replay</title>
<link href="vendor/fonts/fonts-local.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  #view { position: absolute; inset: 0; width: 100%; height: 100%; }
  #draw { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; z-index: 30; }
  body.state-draw #draw { display: block; }
  #srcvideo, #gamecanvas { position: absolute; width: 4px; height: 4px; opacity: 0; pointer-events: none; }
  /* replay wipe */
  #wipe {
    position: absolute; inset: -10%; z-index: 60; pointer-events: none;
    background: linear-gradient(105deg, transparent 0 38%, #f5c518 38% 46%, #111318 46% 62%, transparent 62% 100%);
    transform: translateX(-110%); display: none;
  }
  #wipe.go { display: block; animation: wipego .65s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes wipego { to { transform: translateX(110%); } }
  #replaytag {
    position: absolute; top: calc(64px + env(safe-area-inset-top)); left: 12px; z-index: 55;
    display: none; align-items: center; gap: 8px;
    background: rgba(8,8,12,.8); border-left: 6px solid #f5c518; padding: 8px 14px 8px 10px;
    color: #fff; font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: .05em;
  }
  #replaytag .dot { width: 11px; height: 11px; border-radius: 50%; background: #e62117; animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  body.state-wipe #replaytag, body.state-playing #replaytag, body.state-draw #replaytag { display: flex; }
  #hint {
    position: absolute; left: 0; right: 0; z-index: 55; text-align: center;
    bottom: calc(96px + env(safe-area-inset-bottom)); color: #ffe93c;
    font-size: 17px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    text-shadow: 0 2px 8px #000; display: none; pointer-events: none;
  }
  body.state-draw #hint { display: block; }
  .btnrow.hidden { display: none; }
</style>
</head>
<body class="state-live">
<div id="stage">
  <canvas id="view"></canvas>
  <canvas id="draw"></canvas>
  <div id="wipe"></div>
  <div id="replaytag"><span class="dot"></span><span id="replaytagtext">INSTANT REPLAY</span></div>
  <div id="hint">✎ Draw on it — circle the crime</div>

  <div class="topbar">
    <div class="title">Telestrator</div>
    <div class="spacer"></div>
    <button class="chipbtn" id="alignbtn">Align TV</button>
  </div>

  <div class="btnrow" id="livebtns">
    <button class="bigbtn primary" id="replaybtn">↻ Instant Replay</button>
  </div>
  <div class="btnrow hidden" id="drawbtns">
    <button class="bigbtn ghost" id="clearbtn">Clear</button>
    <button class="bigbtn ghost" id="undobtn">Undo</button>
    <button class="bigbtn gold" id="livebtn">● Go Live</button>
  </div>

  <video id="srcvideo" playsinline muted autoplay></video>
  <canvas id="gamecanvas" width="270" height="480"></canvas>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>

<style id="universal-offsets">#ci-root.ci-tl{top:63px!important}#ar-mark-root{bottom:77px!important}</style>
<script src="mark-button.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('srcvideo'),
    startCamera: function (v) { window.ARShared.initCamera(v, function () {}); }, canvas: document.getElementById('view')
  });
</script>
</body>
</html>
