<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Retro Throwback Arcade</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
        font-family: ui-monospace, "Courier New", monospace; color: #eee; touch-action: none; }
      #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; width: 100%; gap: 8px; }
      #stage { position: relative; line-height: 0; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
      #crt { position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px); }
      #pad { display: none; width: 100%; max-width: 680px; padding: 0 12px 12px;
        justify-content: space-between; align-items: flex-end; }
      #stick { flex: none; position: relative; width: min(46vw, 240px); height: min(46vw, 240px); border-radius: 50%; border: 3px solid #555; background: radial-gradient(circle, #2b2b2b 0 58%, #151515 59%); touch-action: none; user-select: none; -webkit-user-select: none; }
      #stick.on { border-color: #e74c3c; }
      #knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; border: 2px solid #999; background: radial-gradient(circle at 35% 35%, #8a8a8a, #2e2e2e); pointer-events: none; }
      .key { background: #1b1b1b; border: 2px solid #444; border-radius: 10px; color: #ddd;
        font: bold 20px ui-monospace, monospace; display: flex; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none; touch-action: none; }
      .key.on { background: #c0392b; border-color: #e74c3c; }
      .btns { display: flex; gap: 14px; align-items: center; }
      .btns .key { width: min(24vw, 116px); height: min(24vw, 116px); border-radius: 50%; font-size: 32px; }
      #misc { display: flex; gap: 10px; }
      #misc .key { width: 64px; height: 36px; font-size: 13px; }
      @media (max-width: 760px), (orientation: portrait) {
        #wrap { justify-content: flex-start; padding-top: 6px; }
        #pad { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="c" width="320" height="240"></canvas>
        <div id="crt"></div>
      </div>
      <div id="misc">
        <div class="key" data-k="Enter">||</div>
        <div class="key" data-k="KeyM">MUTE</div>
      </div>
      <div id="pad">
        <div id="stick"><div id="knob"></div></div>
        <div class="btns">
          <div class="key" data-k="KeyX">B</div>
          <div class="key" data-k="KeyZ">A</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var W = 320, H = 240;
        var cv = document.getElementById("c"), ctx = cv.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        /* ---------- scaling ---------- */
        function resize() {
          var pad = document.getElementById("pad");
          var padH = getComputedStyle(pad).display === "none" ? 0 : pad.offsetHeight + 8;
          var aw = window.innerWidth - 4, ah = window.innerHeight - padH - 56;
          var s = Math.max(1, Math.min(aw / W, ah / H));
          cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
        }
        window.addEventListener("resize", resize);

        /* ---------- input ---------- */
        var keys = {}, pressed = {};
        var MAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left",
          KeyA: "left", ArrowRight: "right", KeyD: "right", KeyZ: "a", Space: "a", KeyX: "b",
          Enter: "start", KeyM: "mute" };
        function setKey(code, down) {
          var n = MAP[code]; if (!n) return;
          if (down && !keys[n]) pressed[n] = true;
          keys[n] = down;
        }
        window.addEventListener("keydown", function (e) {
          if (MAP[e.code]) e.preventDefault();
          setKey(e.code, true);
        });
        window.addEventListener("keyup", function (e) { setKey(e.code, false); });
        Array.prototype.forEach.call(document.querySelectorAll(".key"), function (el) {
          var code = el.dataset.k;
          function on(e) { e.preventDefault(); el.classList.add("on"); setKey(code, true); }
          function off(e) { e.preventDefault(); el.classList.remove("on"); setKey(code, false); }
          el.addEventListener("touchstart", on, { passive: false });
          el.addEventListener("touchend", off, { passive: false });
          el.addEventListener("touchcancel", off, { passive: false });
          el.addEventListener("mousedown", on);
          window.addEventListener("mouseup", off);
        });
        /* ---------- 8-way circular touch stick (#stick/#knob), snapped to 45 degrees ---------- */
        (function () {
          var st = document.getElementById("stick"), kn = document.getElementById("knob");
          if (!st || !kn) return;
          var sid = null;
          function clr() { setKey("ArrowRight", false); setKey("ArrowLeft", false); setKey("ArrowDown", false); setKey("ArrowUp", false); }
          function move(e) {
            var r = st.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
            var d = Math.sqrt(dx * dx + dy * dy), mx = Math.max(1, r.width / 2 - kn.offsetWidth / 2), k = d > mx ? mx / d : 1;
            kn.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
            if (d < r.width * 0.08) { clr(); return; }
            var o = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * Math.PI / 4, ux = Math.round(Math.cos(o)), uy = Math.round(Math.sin(o));
            setKey("ArrowRight", ux > 0); setKey("ArrowLeft", ux < 0); setKey("ArrowDown", uy > 0); setKey("ArrowUp", uy < 0);
          }
          function end(e) { if (e.pointerId !== sid) return; sid = null; clr(); kn.style.transform = ""; st.classList.remove("on"); }
          st.addEventListener("pointerdown", function (e) { e.preventDefault(); sid = e.pointerId; try { st.setPointerCapture(sid); } catch (x) {} st.classList.add("on"); move(e); });
          st.addEventListener("pointermove", function (e) { if (e.pointerId === sid) { e.preventDefault(); move(e); } });
          st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
          st.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        })();
        cv.addEventListener("touchstart", function (e) { e.preventDefault(); pressed.start = true; }, { passive: false });
        cv.addEventListener("mousedown", function () { pressed.start = true; });
        var input = { k: keys, p: pressed };
        /* menu taps: canvas position in game pixels, read by the shell menus */
        var tap = null;
        function tapAt(cx, cy) {
          var r = cv.getBoundingClientRect(); if (!r.width) return;
          tap = { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
        }
        cv.addEventListener("touchstart", function (e) { var q = e.changedTouches[0]; if (q) tapAt(q.clientX, q.clientY); }, { passive: false });
        cv.addEventListener("mousedown", function (e) { tapAt(e.clientX, e.clientY); });

        /* ---------- audio ---------- */
        var actx = null, muted = false;
        function beep(freq, dur, type, vol) {
          if (muted) return;
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            var o = actx.createOscillator(), g = actx.createGain();
            o.type = type || "square"; o.frequency.value = freq;
            g.gain.value = vol || 0.06;
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + dur);
          } catch (e) {}
        }
        var SFX = {
          jump: function () { beep(560, 0.1); beep(760, 0.08); },
          hit: function () { beep(150, 0.3, "sawtooth", 0.08); },
          win: function () { beep(523, 0.12); setTimeout(function(){beep(659,0.12);},110); setTimeout(function(){beep(880,0.2);},220); },
          pick: function () { beep(880, 0.07); beep(1180, 0.07); },
          smash: function () { beep(320, 0.08, "square", 0.07); beep(180, 0.12, "sawtooth", 0.06); }
        };

        /* ---------- pixel text ---------- */
        var FONT = {
          A:"01110100011000111111100011000110001",B:"11110100011111010001100011000111110",
          C:"01110100011000010000100001000101110",D:"11110100011000110001100011000111110",
          E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",
          G:"01110100011000010111100011000101110",H:"10001100011000111111100011000110001",
          I:"11111001000010000100001000010011111",J:"00111000100001000010100101001001100",
          K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",
          M:"10001110111010110001100011000110001",N:"10001110011010110011100011000110001",
          O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",
          Q:"01110100011000110001101011001001101",R:"11110100011000111110101001001010001",
          S:"01111100001000001110000011000011110",T:"11111001000010000100001000010000100",
          U:"10001100011000110001100011000101110",V:"10001100011000110001100010101000100",
          W:"10001100011000110001101011101110001",X:"10001100010101000100010101000110001",
          Y:"10001100011000101010001000010000100",Z:"11111000010001000100010001000011111",
          "0":"01110100111010110101110011000101110","1":"00100011000010000100001000010001110",
          "2":"01110100010000100110010001000011111","3":"11110000100011000010000011000101110",
          "4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
          "6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000",
          "8":"01110100011000101110100011000101110","9":"01110100011000101111000010001001100",
          " ":"00000000000000000000000000000000000","-":"00000000000000011111000000000000000",
          ".":"00000000000000000000000000000000100",":":"00000001000010000000001000010000000",
          "!":"00100001000010000100000000000000100","+":"00000001000010011111001000010000000",
          "/":"00001000100010001000100010001000000","'":"00100001000010000000000000000000000"
        };
        function text(s, x, y, px, col, center) {
          s = String(s).toUpperCase(); px = px || 1; ctx.fillStyle = col || "#fff";
          var w = s.length * 6 * px;
          if (center) x = Math.round(x - w / 2);
          for (var i = 0; i < s.length; i++) {
            var g = FONT[s[i]]; if (!g) continue;
            for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++)
              if (g[r * 5 + c] === "1") ctx.fillRect(x + i * 6 * px + c * px, y + r * px, px, px);
          }
        }

        /* ================= LEVEL 1 — BARREL CLIMB ================= */
        /* Sloped girders, ladders, barrel-tossing ape, hammer, rescuee. */
        var barrelClimb = {
          title: "BARREL CLIMB",
          goal: "CLIMB TO THE TOP. JUMP BARRELS +100.",
          api: null,
          init: function (api) {
            this.api = api;
            // girders: y at left/right end, zig-zag slopes
            this.G = [
              { x0: 8, x1: 312, y0: 222, y1: 222, dir: 0 },   // 0 ground (flat)
              { x0: 20, x1: 312, y0: 194, y1: 182, dir: -1 }, // 1 low on left -> rolls left, drops off left end onto 0
              { x0: 8, x1: 300, y0: 144, y1: 156, dir: 1 },   // 2 low on right -> rolls right, drops onto 1
              { x0: 20, x1: 312, y0: 118, y1: 106, dir: -1 }, // 3 rolls left, drops onto 2
              { x0: 8, x1: 300, y0: 68, y1: 80, dir: 1 },     // 4 ape girder, rolls right, drops onto 3
              { x0: 100, x1: 220, y0: 30, y1: 30, dir: 0 }    // 5 top platform with rescuee
            ];
            this.L = [
              // zig-zag: every girder is crossed against the barrel flow
              { g: 0, up: 1, x: 44, broken: false },
              { g: 1, up: 2, x: 150, broken: true },
              { g: 1, up: 2, x: 286, broken: false },
              { g: 2, up: 3, x: 40, broken: false },
              { g: 3, up: 4, x: 170, broken: true },
              { g: 3, up: 4, x: 276, broken: false },
              { g: 4, up: 5, x: 200, broken: false },
              { g: 4, up: 5, x: 120, broken: false }
            ];
            this.hammer = { x: 180, y: 0, g: 2, taken: false };
            this.hammer.y = this.gy(this.G[2], 180) - 10;
            this.lives = 3; this.score = 0; this.won = 0; this.jingled = false;
            this.reset(true);
          },
          gy: function (g, x) {
            var t = Math.max(0, Math.min(1, (x - g.x0) / (g.x1 - g.x0)));
            return g.y0 + (g.y1 - g.y0) * t;
          },
          onG: function (g, x) { return x >= g.x0 - 2 && x <= g.x1 + 2; },
          reset: function (full) {
            this.p = { x: 296, y: 0, vy: 0, g: 0, onGround: true, climb: null, face: -1, jumping: false, dead: 0, walk: 0, cl: 0 };
            this.p.y = this.gy(this.G[0], 296);
            this.barrels = []; this.timer = 0; this.throwT = 100; this.tossT = 0;
            this.hamT = 0; this.flash = 0; this.pops = []; this.parts = []; this.shake = 0; this.bonus = 5000;
            if (full) this.hammer.taken = false;
          },
          spawnBarrel: function () {
            var g = this.G[4];
            this.barrels.push({ x: 40, y: this.gy(g, 40), gi: 4, vx: g.dir * 0.85, vy: 0,
              falling: false, onLadder: null, scored: false, spin: 0, ladderOK: Math.random() < 0.22 });
            this.tossT = 14;
            beep(220, 0.08, "sawtooth", 0.05);
          },
          pop: function (s, x, y) { this.pops.push({ s: s, x: x, y: y, t: 45 }); },
          update: function (inp) {
            var self = this, P = this.p, G = this.G;
            this.timer++;
            if (this.flash > 0) this.flash--;
            for (var q = this.pops.length - 1; q >= 0; q--) { this.pops[q].y -= 0.4; if (--this.pops[q].t <= 0) this.pops.splice(q, 1); }
            if (this.won > 0) { if (++this.won > 150) this.api.win(this.score); return; }
            if (P.dead > 0) {
              P.dead--;
              if (P.dead === 0) {
                
                
                this.reset(false);
              }
              return;
            }
            if (this.hamT > 0) this.hamT--;
            if (this.tossT > 0) this.tossT--;
            if (P.safe > 0) P.safe--; // brief grace after stepping off a ladder top
            if (this.timer % 120 === 0 && this.bonus > 0) this.bonus -= 100;

            // throw barrels: every 2.2-3 s, chest-pound telegraphs the last 0.8 s
            this.throwT--;
            if (this.throwT === 47) beep(110, 0.06, "square", 0.04);
            if (this.throwT <= 0) { this.spawnBarrel(); this.throwT = 132 + Math.floor(Math.random() * 49); }

            // ---- hero ----
            var k = inp.k;
            if (P.climb !== null) {
              var L = this.L[P.climb];
              var top = this.gy(G[L.up], L.x), bot = this.gy(G[L.g], L.x);
              if (k.up) P.y -= 1.1;
              if (k.down) P.y += 1.1;
              if (k.up || k.down) P.cl++;
              if (L.broken) {
                var gap = bot - (bot - top) * 0.62;
                if (P.y < gap) P.y = gap;
              }
              if (P.y <= top) { P.y = top; P.g = L.up; P.climb = null; P.onGround = true; P.safe = 12; }
              else if (P.y >= bot) { P.y = bot; P.g = L.g; P.climb = null; P.onGround = true; }
            } else {
              var sp = 1.15;
              if (k.left) { P.x -= sp; P.face = -1; }
              if (k.right) { P.x += sp; P.face = 1; }
              if (k.left || k.right) P.walk++;
              var g = G[P.g];
              if (P.x < g.x0 + 4) P.x = g.x0 + 4;
              if (P.x > g.x1 - 4) P.x = g.x1 - 4;
              if (!P.jumping) P.y = this.gy(g, P.x);
              // ladder grab
              if (k.up || k.down) {
                for (var i = 0; i < this.L.length; i++) {
                  var L2 = this.L[i];
                  if (Math.abs(P.x - L2.x) < 6) {
                    if (k.up && L2.g === P.g && !P.jumping) { P.climb = i; P.x = L2.x; break; }
                    if (k.down && L2.up === P.g && !P.jumping) {
                      if (L2.broken) continue;
                      P.climb = i; P.x = L2.x; P.y = this.gy(G[P.g], L2.x) + 1; break;
                    }
                  }
                }
              }
              // jump
              if (inp.p.a && !P.jumping) { P.jumping = true; P.vy = -3.2; SFX.jump(); }
              if (P.jumping) {
                P.vy += 0.22; P.y += P.vy;
                var fy = this.gy(G[P.g], P.x);
                if (P.y >= fy && P.vy > 0) { P.y = fy; P.jumping = false; P.vy = 0; }
              }
            }
            // hammer pickup
            var hm = this.hammer;
            if (!hm.taken && Math.abs(P.x - hm.x) < 8 && Math.abs(P.y - 8 - hm.y) < 14) {
              hm.taken = true; this.hamT = 360; SFX.pick();
            }

            // ---- barrels ----
            for (var b = this.barrels.length - 1; b >= 0; b--) {
              var B = this.barrels[b];
              B.spin += B.onLadder !== null ? 0.25 : B.vx * 0.3;
              if (B.onLadder !== null) {
                var LD = this.L[B.onLadder];
                B.y += 1.0;
                var bt = this.gy(G[LD.g], LD.x);
                if (B.y >= bt) { B.y = bt; B.gi = LD.g; B.onLadder = null; B.vx = G[LD.g].dir * 0.85 || 0.85; }
              } else if (B.falling) {
                B.vy += 0.25; B.y += B.vy; B.x += B.vx * 0.3;
                var nextG = null;
                for (var gi = B.gi - 1; gi >= 0; gi--) {
                  if (this.onG(G[gi], B.x) && B.y >= this.gy(G[gi], B.x)) { nextG = gi; break; }
                }
                if (nextG !== null) {
                  B.gi = nextG; B.y = this.gy(G[nextG], B.x); B.falling = false; B.vy = 0;
                  B.vx = (G[nextG].dir || (B.vx > 0 ? 1 : -1)) * 0.85;
                } else if (B.y > H + 20) { this.barrels.splice(b, 1); continue; }
              } else {
                var gg = G[B.gi];
                B.x += B.vx;
                B.y = this.gy(gg, B.x);
                if (B.x < gg.x0 || B.x > gg.x1) { B.falling = true; B.vy = 0; }
                else if (B.gi > 0) {
                  for (var j = 0; j < this.L.length; j++) {
                    var LL = this.L[j];
                    if (LL.up === B.gi && !LL.broken && B.ladderOK && Math.abs(B.x - LL.x) < 0.8 && Math.random() < 0.5) {
                      B.onLadder = j; B.x = LL.x; B.ladderOK = false; break;
                    }
                  }
                }
              }
              if (B.gi === 0 && !B.falling && B.onLadder === null && (B.x < 10 || B.x > 310)) {
                this.barrels.splice(b, 1); continue;
              }
              // collision / jump scoring
              var dx = Math.abs(B.x - P.x), dy = B.y - P.y;
              if (this.hamT > 0 && dx < 14 && Math.abs(dy) < 14) {
                this.pop("+300", B.x - 12, B.y - 18);
                for (var pk = 0; pk < 14; pk++) { var pa = pk / 14 * 6.283, pv = 1 + pk % 3; this.parts.push({ x: B.x, y: B.y - 5, vx: Math.cos(pa) * pv, vy: Math.sin(pa) * pv - 1.2, t: 26, c: pk % 2 ? "#d98b2b" : "#8a4f14" }); } this.shake = 6; this.barrels.splice(b, 1); this.score += 300; this.flash = 8; SFX.smash(); continue;
              }
              // hitbox a little smaller than both sprites
              var sameLevel = B.gi === P.g || B.falling || B.onLadder !== null; // never through a girder
              if (sameLevel && dx < 6 && dy < 3 && dy > -12 && P.climb === null && !B.pass) {
                if (P.safe > 0) B.pass = true; // overlapping as hero tops out: let it roll through
                else if (P.dead === 0) { P.dead = 90; this.shake = 14; P.jumping = false; P.y = this.gy(G[P.g], P.x); SFX.hit(); }
              } else if (!B.scored && P.jumping && B.gi === P.g && dx < 10 && dy > 2 && dy < 24) {
                B.scored = true; this.score += 100; beep(990, 0.07); this.pop("+100", P.x - 12, P.y - 30);
              }
            }

            // win: reach top platform; heart + jingle, then the bonus is banked
            if (P.g === 5 && P.dead === 0) {
              this.won = 1; this.jingled = true; this.barrels = [];
              this.score += this.bonus + this.lives * 200;
              this.pop("+" + this.bonus, P.x - 18, P.y - 30);
              [523, 659, 784, 1047, 784, 1047].forEach(function (f, n) {
                setTimeout(function () { beep(f, n === 5 ? 0.35 : 0.12); }, n * 120);
              });
            }
          },
          draw: function (x) {
            var G = this.G, i, c;
            // night construction site: sky gradient, moon, twinkling stars, two skyline layers with lit windows
            var sg = x.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, "#060920"); sg.addColorStop(0.6, "#1b1446"); sg.addColorStop(1, "#3a1838");
            x.fillStyle = sg; x.fillRect(0, 0, W, H);
            x.fillStyle = "#3b2f6e"; x.beginPath(); x.arc(270, 34, 17, 0, 7); x.fill();
            x.fillStyle = "#fff3c4"; x.beginPath(); x.arc(270, 34, 12, 0, 7); x.fill();
            x.fillStyle = "#e3d29a"; x.fillRect(264, 29, 3, 3); x.fillRect(273, 37, 4, 2); x.fillRect(268, 40, 2, 2);

            var py = Math.floor(gsel / G.c) * (G.s + G.g);
            if (py < gscroll) gscroll = py; if (py + G.s > gscroll + GH) gscroll = py + G.s - GH;
          } else if (pressed.a || pressed.start) pickLevel(gsel);
          else if (pressed.b || pressed.any) startAt(0);
        }

        function frame() {
          t++;
          if (pressed.mute) { muted = !muted; }
          if (state === "title") {
            updateTitle();
            if (state === "title") drawTitle();
          } else if (state === "intro") {
            drawIntro();
            if (t > 40 && (pressed.start || pressed.a)) { state = "play"; t = 0; }
            if (t > 420) { state = "play"; t = 0; }
          } else if (state === "play") {
            if (pressed.start) { paused = !paused; }
            if (!paused) GAMES[gi].update(input);
            if (state === "play") GAMES[gi].draw(ctx);
            if (paused) { overlay(); text("PAUSED", W / 2, 110, 2, "#fff", true); }
          } else if (state === "clear") {
            GAMES[gi].draw(ctx); overlay();
            text("LEVEL CLEAR", W / 2, 70, 2, "#ffe14d", true);
            text("SCORE " + lastScore, W / 2, 104, 1, "#fff", true);
            text("TOTAL " + total, W / 2, 118, 1, "#fff", true);
            if (t > 40 && (pressed.start || pressed.a)) {
              gi++;
              if (gi >= GAMES.length) { state = "end"; t = 0; } else startLevel();
            }
          } else if (state === "fail") {
            GAMES[gi].draw(ctx); overlay();
            text("TRY AGAIN", W / 2, 80, 2, "#e33", true);
            text("TOTAL " + total, W / 2, 118, 1, "#fff", true);
            if (t > 40 && (pressed.start || pressed.a)) startLevel();
          } else if (state === "end") {
            drawEnd();
            if (t > 60 && (pressed.start || pressed.a)) { state = "title"; t = 0; }
          }
          if (muted) text("MUTE", 286, 230, 1, "#666");
          for (var k in pressed) delete pressed[k];
          tap = null;
          requestAnimationFrame(frame);
        }
        function overlay() { ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, W, H); }
        function drawTitle() {
          ctx.fillStyle = "#06060f"; ctx.fillRect(0, 0, W, H);
          for (var i = 0; i < 40; i++) {
            var sx = (i * 61 + 13) % W, sy = (i * 37 + (t >> 2)) % H;
            ctx.fillStyle = i % 3 ? "#1d2a4a" : "#30406b"; ctx.fillRect(sx, sy, 2, 2);
          }
          text("RETRO", W / 2, 8, 3, "#ffe14d", true);
          text("THROWBACK ARCADE", W / 2, 33, 1, "#4ad6ff", true);
          if (t % 60 < 40) text("PRESS ANY BUTTON", W / 2, 48, 1, "#fff", true);
          var G = grid();
          ctx.save(); ctx.beginPath(); ctx.rect(0, GY - 2, W, GH + 4); ctx.clip();
          for (var i = 0; i < G.n; i++) {
            var p = tileAt(G, i), s = G.s, lock = i > progress;
            if (p.y + s < GY - 2 || p.y > GY + GH) continue;
            ctx.globalAlpha = lock ? 0.35 : 1;
            ctx.fillStyle = "#151a33"; ctx.fillRect(p.x, p.y, s, s);
            icon(i, p.x + s / 2, p.y + s * 0.36, s * 0.18);
            text(i + 1, p.x + 3, p.y + 3, 1, "#888");
            var mx = Math.floor((s - 2) / 6), ln = [""];
            GAMES[i].title.split(" ").forEach(function (w) { var L = ln.length - 1; if (ln[L] && (ln[L] + " " + w).length > mx) ln.push(w); else ln[L] = ln[L] ? ln[L] + " " + w : w; });
            ln = ln.slice(0, 2);
            for (var j = 0; j < ln.length; j++) text(ln[j].slice(0, mx), p.x + s / 2, p.y + s - 9 - (ln.length - 1 - j) * 9, 1, "#fff", true);
            ctx.globalAlpha = 1;
            if (lock) { ctx.save(); ctx.translate(Math.round(p.x + s / 2 - 6), Math.round(p.y + s * 0.42 - 7)); ctx.scale(2, 2); padlock(0, 0, "#ddd"); ctx.restore(); }
            if (i === gsel) { ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 2; ctx.strokeRect(p.x - 1, p.y - 1, s + 2, s + 2); }
          }
          ctx.restore();
          text("ARROWS/WASD MOVE - Z A - X B - ENTER PAUSE - M MUTE", W / 2, H - 9, 1, "#4a5578", true);
        }
        function icon(i, x, y, r) { /* a few canvas shapes per game, keyed by index */
          var c = ctx;
          function circ(cx, cy, rr, col) { c.fillStyle = col; c.beginPath(); c.arc(cx, cy, rr, 0, 7); c.fill(); }
          if (i === 0) { c.fillStyle = "#b5651d"; c.fillRect(x - r * 0.8, y - r, r * 1.6, r * 2); c.fillStyle = "#5a2e0c"; c.fillRect(x - r * 0.8, y - r * 0.5, r * 1.6, 2); c.fillRect(x - r * 0.8, y + r * 0.4, r * 1.6, 2); }
          else if (i === 1) { c.fillStyle = "#2fbf3a"; c.fillRect(x - r * 0.6, y - r * 0.5, r * 1.2, r * 1.5); c.fillRect(x - r, y - r, r * 2, r * 0.6); }
          else if (i === 2) { c.strokeStyle = "#ffd23a"; c.lineWidth = 3; c.beginPath(); c.arc(x, y, r * 0.8, 0, 7); c.stroke(); }
          else if (i === 3) { ["#e33", "#4ad6ff", "#5f5"].forEach(function (col, k) { var gx = x + (k - 1) * r * 0.9, gy = y + (k === 1 ? -r * 0.4 : r * 0.3); c.fillStyle = col; c.beginPath(); c.moveTo(gx, gy - r * 0.55); c.lineTo(gx + r * 0.4, gy); c.lineTo(gx, gy + r * 0.55); c.lineTo(gx - r * 0.4, gy); c.fill(); }); }
          else if (i === 4) { c.strokeStyle = "#ccc"; c.lineWidth = 1; c.beginPath(); c.moveTo(x - r * 0.45, y); c.lineTo(x, y + r); c.lineTo(x + r * 0.45, y); c.stroke(); circ(x - r * 0.45, y - r * 0.3, r * 0.5, "#e33"); circ(x + r * 0.45, y - r * 0.3, r * 0.5, "#4a8bff"); }
          else if (i === 5) { c.fillStyle = "#e33"; c.fillRect(x - r, y - r * 0.1, r * 2, r * 0.6); c.fillRect(x - r * 0.5, y - r * 0.5, r, r * 0.45); circ(x - r * 0.55, y + r * 0.55, r * 0.28, "#ddd"); circ(x + r * 0.55, y + r * 0.55, r * 0.28, "#ddd"); }
          else { c.fillStyle = "#ffe14d"; c.beginPath(); for (var k = 0; k < 10; k++) { var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.fill(); }
        }
        function padlock(x, y, col) {
          ctx.fillStyle = col;
          ctx.fillRect(x + 1, y, 4, 1); ctx.fillRect(x + 1, y, 1, 3); ctx.fillRect(x + 4, y, 1, 3);
          ctx.fillRect(x, y + 3, 6, 4);
          ctx.fillStyle = "#000"; ctx.fillRect(x + 2, y + 4, 2, 2);
        }
        function drawIntro() {
          ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "#4ad6ff"; ctx.lineWidth = 2; ctx.strokeRect(20, 60, 280, 110);
          text("LEVEL " + (gi + 1) + " - " + GAMES[gi].title, W / 2, 84, 1, "#ffe14d", true);
          text(GAMES[gi].goal, W / 2, 110, 1, "#fff", true);
          text("3 LIVES - GOOD LUCK", W / 2, 130, 1, "#888", true);
          if (t % 60 < 36) text("PRESS START", W / 2, 150, 1, "#4ad6ff", true);
          text("TOTAL " + total, W / 2, 200, 1, "#666", true);
        }
        function drawEnd() {
          ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
          text("MORE GAMES", W / 2, 70, 2, "#ffe14d", true);
          text("COMING SOON", W / 2, 94, 2, "#ffe14d", true);
          text("FINAL SCORE " + total, W / 2, 140, 1, "#fff", true);
          if (t % 60 < 36) text("PRESS START", W / 2, 176, 1, "#4ad6ff", true);
        }
        /* fixed 60 Hz step: frame() runs logic+draw, loop() paces it */
        var rawFrame = frame, acc = 0, last = 0, STEP = 1000 / 60;
        var raf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function () {}; // frame()'s own re-schedule becomes a no-op
        function loop(ts) {
          if (!last) last = ts;
          acc += Math.min(250, ts - last); last = ts;
          var n = 0;
          while (acc >= STEP && n < 5) { rawFrame(); acc -= STEP; n++; }
          raf(loop);
        }
        resize();
        raf(loop);
      })();
    </script>
  </body>
</html>
