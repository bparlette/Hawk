<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scoreboard — couch rivalry, settled</title>
<link href="vendor/fonts/fonts-local.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  #board {
    position: absolute; top: calc(58px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 1000;
    background: linear-gradient(180deg, rgba(13,17,32,.94), rgba(8,10,20,.94));
    border: 2px solid rgba(255,255,255,.22); border-radius: 18px; overflow: hidden;
    box-shadow: 0 14px 40px rgba(0,0,0,.6); color: #fff;
  }
  #board .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 14px; background: rgba(255,255,255,.07);
    font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: #cfd8ff;
  }
  #board .main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; }
  .side { padding: 10px 6px 12px; text-align: center; }
  .side .nm {
    font-family: 'Anton', sans-serif; font-size: 21px; letter-spacing: .04em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .side .sc { font-family: 'Anton', sans-serif; font-size: 74px; line-height: 1; }
  .side.p1 .sc { color: #3ce8ff; } .side.p2 .sc { color: #ff5a3c; }
  .side .sets { margin-top: 5px; font-size: 13px; letter-spacing: .2em; color: #ffd75e; min-height: 16px; }
  .mid {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 0 8px; border-left: 1px solid rgba(255,255,255,.14); border-right: 1px solid rgba(255,255,255,.14);
  }
  .mid .vs { font-family: 'Anton', sans-serif; font-size: 17px; color: #8fa0c8; }
  .mid .tgt { font-size: 11.5px; letter-spacing: .14em; color: #cfd8ff; text-transform: uppercase; text-align: center; }
  #setbanner {
    display: none; padding: 8px; text-align: center; background: #b8860b; color: #14100a;
    font-family: 'Anton', sans-serif; font-size: 17px; letter-spacing: .08em; text-transform: uppercase;
  }
  #setbanner.show { display: block; }
  .controls {
    position: absolute; left: 0; right: 0; z-index: 1100;
    bottom: calc(10px + env(safe-area-inset-bottom)); padding: 0 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .optbar { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .scorerow { display: flex; justify-content: space-between; align-items: flex-end; }
  .pctl { display: flex; gap: 8px; }
  .scorebtn {
    z-index: 1100; width: 68px; height: 68px; border-radius: 18px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.3); color: #fff;
    font-family: 'Anton', sans-serif; font-size: 28px;
  }
  .scorebtn.plus.p1 { background: rgba(20,90,110,.9); border-color: #3ce8ff; }
  .scorebtn.plus.p2 { background: rgba(120,45,30,.9); border-color: #ff5a3c; }
  .scorebtn.minus { background: rgba(10,10,16,.8); font-size: 23px; width: 50px; }
  .scorebtn:active { transform: scale(.94); }
  .optrow { display: flex; gap: 5px; align-items: center; }
  .optrow .lbl { font-size: 10.5px; letter-spacing: .12em; color: #dfe6ff; text-transform: uppercase; }
  .opt {
    z-index: 1100; min-width: 36px; min-height: 36px; padding: 5px 8px; border-radius: 10px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.25); background: rgba(10,10,16,.75); color: #fff;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13.5px;
  }
  .opt.on { background: #fff; color: #111; border-color: #fff; }
  /* winner takeover */
  #winner {
    position: absolute; inset: 0; z-index: 1300; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: radial-gradient(ellipse at 50% 38%, rgba(60,44,4,.88), rgba(4,4,10,.95) 75%);
    text-align: center; padding: 20px;
  }
  #winner.show { display: flex; }
  #winner .crown { width: 104px; height: 74px; filter: drop-shadow(0 6px 22px rgba(255,200,40,.55)); animation: crownbob 1.6s ease-in-out infinite; }
  @keyframes crownbob { 50% { transform: translateY(-9px) rotate(-2deg); } }
  #winner .wlabel { font-family: 'Anton', sans-serif; font-size: 30px; letter-spacing: .3em; color: #ffd75e; }
  #winner .wname {
    font-family: 'Anton', sans-serif; font-size: clamp(46px, 14vw, 92px); line-height: 1;
    color: #fff; text-transform: uppercase; text-shadow: 0 6px 30px rgba(0,0,0,.8);
  }
  #winner .wsub { color: #ffe9a8; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
  #confetti { position: absolute; inset: 0; z-index: 1250; pointer-events: none; display: none; }
  #confetti.go { display: block; }
  /* owner confetti loop (Nov 16) — screen-blended over the winner takeover */
  #confettiVid {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1350;
    mix-blend-mode: screen; opacity: 0; transition: opacity .45s ease; pointer-events: none;
  }
  #confettiVid.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <div id="fallback"><div class="room"><div class="tv"></div><div class="couch"></div></div></div>

  <div class="topbar">
    <div class="title">Scoreboard</div>
    <div class="spacer"></div>
    <button class="chipbtn" id="alignbtn">Align TV</button>
  </div>

  <div id="board">
    <div class="head"><span>🏆 Couch Rivalry</span><span id="boinfo">Best of 3 · First to 10</span></div>
    <div class="main">
      <div class="side p1">
        <div class="nm" id="nm0" title="Tap to rename">PLAYER 1</div>
        <div class="sc" id="sc0">0</div>
        <div class="sets" id="sets0"></div>
      </div>
      <div class="mid"><div class="vs">VS</div><div class="tgt" id="tgtinfo">Race to 10</div></div>
      <div class="side p2">
        <div class="nm" id="nm1" title="Tap to rename">PLAYER 2</div>
        <div class="sc" id="sc1">0</div>
        <div class="sets" id="sets1"></div>
      </div>
    </div>
    <div id="setbanner"></div>
  </div>

  <div class="controls">
    <div class="optbar">
      <div class="optrow"><span class="lbl">Target</span>
        <button class="opt tgtopt" data-t="5">5</button><button class="opt tgtopt on" data-t="10">10</button>
        <button class="opt tgtopt" data-t="15">15</button><button class="opt tgtopt" data-t="21">21</button>
      </div>
      <div class="optrow"><span class="lbl">Best of</span>
        <button class="opt boopt" data-b="1">1</button><button class="opt boopt on" data-b="3">3</button>
        <button class="opt boopt" data-b="5">5</button>
      </div>
      <button class="chipbtn" id="resetbtn" style="min-height:36px;padding:6px 12px;">Reset match</button>
    </div>
    <div class="scorerow">
      <div class="pctl">
        <button class="scorebtn minus" id="minus0">−</button>
        <button class="scorebtn plus p1" id="plus0">+1</button>
      </div>
      <div class="pctl">
        <button class="scorebtn plus p2" id="plus1">+1</button>
        <button class="scorebtn minus" id="minus1">−</button>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <div id="winner">
    <svg class="crown" viewBox="0 0 100 70"><path d="M6 58 L2 18 L30 36 L50 8 L70 36 L98 18 L94 58 Z" fill="#ffc61a" stroke="#a86e00" stroke-width="3"/><rect x="6" y="58" width="88" height="9" rx="3" fill="#ffc61a" stroke="#a86e00" stroke-width="3"/><circle cx="50" cy="42" r="6" fill="#e62117"/><circle cx="22" cy="46" r="4.5" fill="#3ce8ff"/><circle cx="78" cy="46" r="4.5" fill="#3ce8ff"/></svg>
    <div class="wlabel">Winner</div>
    <div class="wname" id="wname">PLAYER 1</div>
    <div class="wsub" id="wsub">Takes the match</div>
    <button class="bigbtn gold" id="rematchbtn">Rematch</button>
    <button class="bigbtn ghost" id="closewinner">Keep board</button>
  </div>
  <video id="confettiVid" src="assets/confetti-burst.mp4" muted loop playsinline preload="auto"></video>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>

<style id="universal-offsets">#ci-root.ci-tl{top:63px!important}#ar-mark-root{bottom:180px!important}</style>
<script src="mark-button.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { window.ARShared.initCamera(v, function () {}); }, canvas: document.getElementById('confetti')
  });
</script>
<script src="clean-view.js"></script>
<script>
/* ---- clean view + pinch zoom (owner feedback fix 2026-11-16) ---- */
CleanView.init({ mode: 'stage' });
</script>
</body>
</html>
