<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Planko — Seed Garden</title>
<style>
  html, body { height:100%; overflow:hidden; background:#2a1f16; margin:0; padding:0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action:none; color:#fdf6dd;
  }
  h1, h2, p { margin:0; padding:0; }
  #game { position:fixed; inset:0; display:block; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:center; gap:8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
    pointer-events:none;
  }
  .pill {
    background: rgba(38, 30, 16, 0.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color:#f7ecd0; border:1px solid rgba(255, 226, 160, 0.28);
    border-radius:999px; padding:6px 12px;
    font-size:14.5px; font-weight:600; letter-spacing:.02em;
    box-shadow:0 3px 14px rgba(30,15,0,.35);
    white-space:nowrap;
  }
  #meterWrap {
    flex:1; min-width:52px; height:20px;
    background: rgba(38, 30, 16, 0.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border:1px solid rgba(255, 226, 160, 0.28);
    border-radius:999px; overflow:hidden; position:relative;
    box-shadow:0 3px 14px rgba(30,15,0,.35);
  }
  #meterFill {
    height:100%; width:0%;
    background: linear-gradient(90deg, #8fce62, #cde86a 55%, #ffd968);
    border-radius:999px; transition: width .45s ease;
  }
  #meterLabel {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6);
    letter-spacing:.07em;
  }
  .roundBtn {
    pointer-events:auto; cursor:pointer; border:1px solid rgba(255,226,160,.28);
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; line-height:1; color:#f7ecd0;
    background: rgba(38, 30, 16, 0.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow:0 3px 14px rgba(30,15,0,.35);
  }
  .roundBtn:active { transform: scale(.93); }

  /* ---------- Seed packet picker ---------- */
  #picker {
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(43,30,14,0), rgba(43,30,14,.55) 30%, rgba(34,23,10,.78));
    pointer-events:none;
  }
  #pickerLabel {
    font-size:11px; font-weight:700; letter-spacing:.14em; color:#ffe9b0;
    text-shadow:0 1px 4px rgba(0,0,0,.65); margin:0 4px 6px; pointer-events:none;
  }
  #packets {
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
    pointer-events:auto; padding-bottom:2px;
    scrollbar-width:thin; scrollbar-color: rgba(255,217,104,.5) transparent;
    -webkit-overflow-scrolling:touch;
  }
  .packet {
    flex:0 0 auto; width:64px; cursor:pointer; position:relative;
    border-radius:10px; padding:5px 4px 6px; text-align:center;
    background: linear-gradient(165deg, rgba(84,58,26,.92), rgba(56,38,17,.94));
    border:1.5px solid rgba(255,226,160,.30);
    box-shadow:0 4px 12px rgba(20,10,0,.4), inset 0 1px 0 rgba(255,240,200,.18);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .packet img { width:40px; height:40px; display:block; margin:0 auto 2px; pointer-events:none; }
  .packet .dice {
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    margin:0 auto 2px; font-size:27px; line-height:1; pointer-events:none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
  }
  .packet .pname {
    font-size:9.5px; line-height:1.15; font-weight:700; color:#f7ecd0;
    text-shadow:0 1px 2px rgba(0,0,0,.6); pointer-events:none;
    display:block; min-height:22px;
  }
  .packet .pcost { font-size:9px; font-weight:700; color:#ffd968; pointer-events:none; display:block; }
  .packet.sel {
    border-color:#ffd968; transform: translateY(-4px);
    box-shadow:0 8px 18px rgba(20,10,0,.5), 0 0 0 2px rgba(255,217,104,.35), inset 0 1px 0 rgba(255,240,200,.25);
  }
  /* ---------- Overlays ---------- */
  .overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background: radial-gradient(ellipse at 50% 36%, rgba(64,40,14,.30), rgba(22,14,5,.72));
    color:#fdf6dd;
  }
  .overlay h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(42px, 10vw, 72px); font-weight:700; letter-spacing:.015em;
    background: linear-gradient(180deg, #fff3c4, #ffd968 58%, #e8a83e);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.55));
  }
  .overlay h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 6vw, 40px); font-weight:700; color:#ffe9a8;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .overlay p {
    margin-top:12px; font-size: clamp(15px, 4.2vw, 20px);
    color:#f3e7c6; text-shadow:0 1px 6px rgba(0,0,0,.65); max-width: 32em; line-height:1.45;
  }
  .overlay .sub { font-size: clamp(13px, 3.6vw, 16px); color:#dcc99a; margin-top:8px; }
  .bigBtn {
    margin-top:26px; pointer-events:auto; cursor:pointer;
    font-family: Georgia, serif; font-size:20px; font-weight:700; color:#4a2f0d;
    background: linear-gradient(180deg, #ffedb0, #ffd968 55%, #f0b84a);
    border:none; border-radius:999px; padding:14px 38px;
    box-shadow: 0 6px 0 #a8742a, 0 14px 30px rgba(0,0,0,.45);
  }
  .bigBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8742a, 0 8px 18px rgba(0,0,0,.4); }
  .ghostBtn {
    margin-top:14px; pointer-events:auto; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; color:#ffe9b0;
    background: rgba(43,30,14,.55); border:1px solid rgba(255,226,160,.4);
    border-radius:999px; padding:10px 26px;
  }
  .hidden { display:none !important; }

  /* ---------- Journal ---------- */
  #journal {
    position:fixed; inset:0; z-index:11; display:flex; flex-direction:column;
    background: linear-gradient(180deg, rgba(30,20,8,.94), rgba(20,13,5,.97));
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  #journal h2 {
    font-family: Georgia, serif; color:#ffe9a8; font-size:26px; text-align:center;
    margin-bottom:4px;
  }
  #journal .jsub { text-align:center; color:#d8c491; font-size:13.5px; margin-bottom:12px; }
  #journalGrid {
    flex:1; overflow-y:auto; display:grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap:10px; align-content:start; padding:2px;
  }
  .jcell {
    background: rgba(84,58,26,.35); border:1px solid rgba(255,226,160,.18);
    border-radius:12px; padding:8px 4px 7px; text-align:center;
  }
  .jcell img { width:52px; height:52px; }
  .jcell .jname { font-size:10.5px; font-weight:700; color:#f7ecd0; line-height:1.2; min-height:25px; }
  .jcell .jcount { font-size:10px; color:#ffd968; font-weight:700; }
  .jcell.undisc img { filter: brightness(0) opacity(.45); }
  .jcell.undisc .jname { color:#9b8b62; }
  #journalClose { align-self:center; margin-top:12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="pill" id="seedPill">🌱 ∞</div>
  <div class="pill" id="skyPill">🕐 --:--</div>
  <div id="meterWrap"><div id="meterFill"></div><div id="meterLabel">GARDEN 0%</div></div>
  <div class="pill" id="pollenPill">❀ 0</div>
  <button class="roundBtn" id="journalBtn" aria-label="Garden journal">📖</button>
  <button class="roundBtn" id="muteBtn" aria-label="Toggle sound">🔊</button>
</div>

<div id="picker" class="hidden">
  <div id="pickerLabel">CHOOSE A SEED</div>
  <div id="packets"></div>
</div>

<div class="overlay" id="titleScreen">
  <h1>Planko</h1>
  <p>A seed, a pegboard, and a garden that remembers.</p>
  <p class="sub">Drag to aim, let go to drop. Where a seed settles, something beautiful grows.<br>Collect all 20 hero species in your journal. ✿</p>
  <button class="bigBtn" id="startBtn">Start planting</button>
</div>

<div id="journal" class="hidden">
  <h2>Garden Journal</h2>
  <div class="jsub" id="journalSub">0 of 20 species discovered</div>
  <div id="journalGrid"></div>
  <button class="bigBtn" id="journalClose">Back to the garden</button>
</div>

<script>
'use strict';
/* ================================================================
   PLANKO — SEED GARDEN
   A painted ASMR plinko garden. Canvas-drawn, WebAudio-synthesized,
   zero external assets. An enhancement of Seed Plinko: same heart —
   aim, drop, bounce, grow — with a whole conservatory to collect.
   ================================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* v3 — endless play: no satchel limit, no rounds, no end screen.
   The seed supply is infinite and every species is unlocked. */

/* ---------------- utils ---------------- */
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function easeOutBack(x) { const c = 1.70158; const u = x - 1; return 1 + (c + 1) * u * u * u + c * u * u; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function hexRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(h1, h2, t) {
  const a = hexRgb(h1), b = hexRgb(h2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function rgba(hex, a) {
  const c = hexRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
/* stable hash from a string — per-species deterministic decoration */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

/* ---------------- save ---------------- */
const SAVE_KEY = 'planko-save-v1';
let save = { pollen: 0, unlocked: [], journal: {}, muted: false, best: 0, sel: 'random', harvested: 0 };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------- state ---------------- */
let W = 0, H = 0, DPR = 1;
let started = false;
let seeds = [];        // in flight — several can be airborne at once (v3)
let plants = [];       // planted & growing (and standing garden)
let particles = [];    // soil puffs, sparkles, pollen, floaters
let floaters = [];     // "+5 ❀" pollen text particles
let blooms = 0;        // blooms this session
let sessionPollen = 0; // pollen earned this session
let dropperX = 0;
let lastDropAt = -999;
let nextChirpAt = 0;
let bakedGarden = null; // offscreen canvas of retired plants (silhouette layer)
let bakedTotal = 0;      // plants that have retired into the silhouette layer
let selectedId = 'daisy';
let growBoost = 1;      // cinematic slow-grow multiplier for the next plant (test/video use)
/* v2 — random seeds by default */
let randomMode = true;  // "Surprise me" packet is the default selection
let nextId = null;      // species queued for the next drop (random mode)
/* v2 — the gardener */
let harvested = 0;      // plants chopped this session (lifetime total lives in save.harvested)
let falling = [];       // chopped plants mid-tip-over
const keysDown = {};    // held movement keys for the gardener
const gardener = { x: 0, dir: 1, moving: false, walkPhase: 0, swingT: 1, swingCd: 0, targetX: null };

/* layout */
let L = null;

/* v6 — reduced motion + one shared wind value: it drives plant sway,
   cloud drift and fog drift together, and strengthens with the weather */
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let windV = 0.25, windPhase = 0; // 0 calm … 1 gusty
function pCount(n) { return REDUCED_MOTION ? Math.ceil(n / 2) : n; }
function updateWind(dt) {
  windPhase += dt;
  const gust = 0.5 + 0.5 * Math.sin(windPhase * 0.23) * Math.sin(windPhase * 0.071 + 1.7);
  const wxBoost = cloudCover * 0.35 + rainAmt * 0.3 + fogAmt * 0.15;
  const target = clamp(0.18 + gust * 0.4 + wxBoost, 0, 1) * (REDUCED_MOTION ? 0.5 : 1);
  windV += (target - windV) * (1 - Math.exp(-dt / 2.5));
}

/* ================================================================
   AUDIO — all synthesized, soft by design (ASMR brief)
   ================================================================ */
let AC = null, masterGain = null, padNodes = null, ambGain = null;
let muted = !!save.muted;

function initAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {}
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 26; comp.ratio.value = 3; // v6 — gentle glue, not a wall
    comp.attack.value = 0.008; comp.release.value = 0.28;
    comp.connect(AC.destination);
    masterGain = AC.createGain();
    masterGain.gain.value = muted ? 0 : 0.85;
    masterGain.connect(comp);
    ambGain = AC.createGain(); ambGain.gain.value = 1; // v6 — ambience bus (ducked under bloom chimes)
    ambGain.connect(masterGain);
    startPad();
    startAmbience();
  } catch (e) { AC = null; }
}

/* warm ambient pad — two detuned triangles through a slow-breathing lowpass */
function startPad() {
  if (!AC || padNodes) return;
  const g = AC.createGain(); g.gain.value = 0.0;
  g.gain.setTargetAtTime(0.016, AC.currentTime, 2.5);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.4;
  const o1 = AC.createOscillator(); o1.type = 'triangle'; o1.frequency.value = 130.81; // C3
  const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 196.00; // G3
  const o3 = AC.createOscillator(); o3.type = 'sine'; o3.frequency.value = 261.63;     // C4
  const g3 = AC.createGain(); g3.gain.value = 0.35;
  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
  const lfoG = AC.createGain(); lfoG.gain.value = 130;
  lfo.connect(lfoG); lfoG.connect(lp.frequency);
  o1.connect(lp); o2.connect(lp); o3.connect(g3); g3.connect(lp);
  lp.connect(g); g.connect(ambGain || masterGain);
  o1.start(); o2.start(); o3.start(); lfo.start();
  padNodes = { g: g };
}

/* ================================================================
   AMBIENCE (v4) — weather & night beds, all synthesized: a rain
   patter bed, a wind hush bed, pulsed crickets after dark, droplet
   plinks in the rain. Gains are driven by updateAmbience() from the
   same state that drives the visuals, and always sit well under
   the plink / shimmer / chime voices.
   ================================================================ */
let amb = null;
let ambTick = 0;
let nextDropAt = 0, nextCricketAt = 0;

function startAmbience() {
  if (!AC || amb) return;
  const mk = function (type, freq, q) {
    const src = AC.createBufferSource(); src.buffer = noiseBuffer(2.7); src.loop = true;
    const flt = AC.createBiquadFilter(); flt.type = type; flt.frequency.value = freq; flt.Q.value = q;
    const g = AC.createGain(); g.gain.value = 0;
    src.connect(flt); flt.connect(g); g.connect(ambGain || masterGain);
    src.start();
    return { src: src, flt: flt, g: g };
  };
  const rain = mk('lowpass', 950, 0.4);          // soft full-spectrum patter
  const wind = mk('bandpass', 420, 0.55);       // breathy hush
  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.09;
  const lfoG = AC.createGain(); lfoG.gain.value = 150;
  lfo.connect(lfoG); lfoG.connect(wind.flt.frequency); lfo.start();
  amb = { rain: rain, wind: wind };
}

/* which ambient voice the world is in — state data for tests + gating */
function ambLabel() {
  if (rainAmt > 0.35) return 'rain';
  if (palNow && palNow.night > 0.6) return 'crickets';
  if (palNow && palNow.night < 0.35 && fogAmt < 0.5) return 'birds';
  if (cloudCover > 0.5 || fogAmt >= 0.5) return 'wind';
  return 'calm';
}

function updateAmbience(now) {
  if (!AC || !amb) return;
  if (now - ambTick < 0.3) return;
  ambTick = now;
  const t = AC.currentTime;
  amb.rain.g.gain.setTargetAtTime(muted ? 0 : 0.055 * rainAmt, t, 1.1);
  const windTarget = (0.010 + 0.016 * cloudCover + 0.012 * fogAmt) * (rainAmt > 0.35 ? 0.6 : 1);
  amb.wind.g.gain.setTargetAtTime(muted ? 0 : windTarget, t, 1.4);
}

/* night crickets — a little train of soft high pulses */
function sndCricket() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const pulses = 3 + Math.floor(Math.random() * 2);
  for (let i = 0; i < pulses; i++) {
    const t0 = t + i * 0.075;
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.value = 4250 + Math.random() * 250;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.011, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 0.06);
  }
}

/* a single droplet plink, for rainy spells */
function sndDroplet() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const f = rand(1700, 2600);
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.72, t + 0.09);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.014, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.18);
}

let noiseBufCache = null;
function noiseBuffer(dur) {
  if (noiseBufCache && dur <= 0.3) return noiseBufCache;
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  if (dur <= 0.3) noiseBufCache = buf;
  return buf;
}

/* ================================================================
   FX BUS (v6) — give the sound a room. One generated convolution
   reverb (soft outdoor-garden tail, no files), a faint ping-pong
   delay fed by plinks only, per-voice stereo pan + wet sends.
   Voice route: gain → pan → dry destination (the v4 lowpass for
   plinks), with a wet tap → convolver → master and an optional
   echo tap → ping-pong → master.
   ================================================================ */
let fx = null, lastPanValue = null;
function makeImpulse(dur, decay) {
  const rate = AC.sampleRate, len = Math.floor(rate * dur);
  const buf = AC.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (ch === 0 ? 1 : 0.92);
    }
  }
  return buf;
}
function ensureFx() {
  if (fx || !AC) return fx;
  const conv = AC.createConvolver();
  conv.buffer = makeImpulse(1.4, 2.6);
  const wetIn = AC.createGain(); wetIn.gain.value = 1;
  wetIn.connect(conv); conv.connect(masterGain);
  // ping-pong delay — two crossed delays, filtered, quiet
  const dIn = AC.createGain(); dIn.gain.value = 1;
  const dFlt = AC.createBiquadFilter(); dFlt.type = 'lowpass'; dFlt.frequency.value = 1800;
  const dL = AC.createDelay(1); dL.delayTime.value = 0.27;
  const dR = AC.createDelay(1); dR.delayTime.value = 0.41;
  const fbL = AC.createGain(); fbL.gain.value = 0.22;
  const fbR = AC.createGain(); fbR.gain.value = 0.22;
  const panL = AC.createStereoPanner(); panL.pan.value = -0.3;
  const panR = AC.createStereoPanner(); panR.pan.value = 0.3;
  const mixG = AC.createGain(); mixG.gain.value = 0.5;
  dIn.connect(dFlt); dFlt.connect(dL);
  dL.connect(fbL); fbL.connect(dR);
  dR.connect(fbR); fbR.connect(dL);
  dL.connect(panL); panL.connect(mixG);
  dR.connect(panR); panR.connect(mixG);
  mixG.connect(masterGain);
  fx = { conv: conv, wetIn: wetIn, dIn: dIn, dL: dL, dR: dR };
  return fx;
}
/* route a finished voice gain: dry to dest, wet tap to the reverb,
   optional echo tap to the ping-pong. x pans the voice in the field. */
function voiceOut(g, dest, x, wet, echoAmt) {
  const destNode = dest || masterGain;
  let head = g;
  if (x != null && AC.createStereoPanner) {
    const pan = AC.createStereoPanner();
    pan.pan.value = clamp((x / Math.max(1, W)) * 1.4 - 0.7, -0.75, 0.75);
    lastPanValue = pan.pan.value;
    g.connect(pan); pan.connect(destNode);
    head = pan;
  } else {
    g.connect(destNode);
  }
  if (wet > 0 && ensureFx()) {
    const wg = AC.createGain(); wg.gain.value = wet;
    head.connect(wg); wg.connect(fx.wetIn);
  }
  if (echoAmt > 0 && ensureFx()) {
    const eg = AC.createGain(); eg.gain.value = echoAmt;
    head.connect(eg); eg.connect(fx.dIn);
  }
}
/* bloom chimes sit on top: the garden beds dip ~4 dB for a breath */
function duckAmbience() {
  if (!ambGain || !AC) return;
  const t = AC.currentTime;
  ambGain.gain.cancelScheduledValues(t);
  ambGain.gain.setTargetAtTime(0.6, t, 0.05);
  ambGain.gain.setTargetAtTime(1, t + 0.75, 0.35);
}
/* tiny soft rustle tick — a leaf unfurling, a petal opening (v6) */
function sndRustle(x) {
  if (!AC || muted) return;

  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1500, 2300); bp.Q.value = 0.9;
  const g = AC.createGain();

/* felt-kalimba plink (v4) — the peg hit, re-voiced round and soothing:
   a sine core with a breath of triangle at the SAME pitch (no bright 2x
   partial), a soft 14 ms attack instead of a click, a long felt decay,
   lower gain, and everything through one gentle lowpass. The wooden
   knock transient is gone. Same pentatonic ladder, same callers. */
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // C major pentatonic
let plinkBus = null;
function getPlinkBus() {
  if (!plinkBus) {
    plinkBus = AC.createBiquadFilter();
    plinkBus.type = 'lowpass'; plinkBus.frequency.value = 2300; plinkBus.Q.value = 0.3;
    plinkBus.connect(masterGain);
  }
  return plinkBus;
}
const voiceHits = { dew: 0, stone: 0, firefly: 0 }; // v6 — per-kind voice counters (test hook reads these)
let lastBuzzAt = 0;
function buzz(ms) { // haptics — strong hits only; Android in practice; never under reduced motion
  if (REDUCED_MOTION) return;
  try {
    if (navigator.vibrate) {
      const now = performance.now();
      if (now - lastBuzzAt > 90) { lastBuzzAt = now; navigator.vibrate(ms); }
    }
  } catch (e) {}
}
/* per-peg voices (v6) — each peg material sounds like itself. Pitch is
   still the v4 pentatonic ladder by row (it does not drift); brightness
   follows impact speed; every hit is detuned ±6 cents so repeats never
   sound machine-identical. All voices keep the v4 softness brief. */
function sndPlink(rowFrac, strength, kind, x) {
  if (!AC || muted) return;
  const bus = getPlinkBus();
  const t = AC.currentTime;
  const idx = clamp(Math.floor(rowFrac * PENTA.length * 1.6), 0, PENTA.length - 1);
  const f = PENTA[PENTA.length - 1 - idx]; // high→low as it falls
  const s = clamp(strength, 0, 1);
  const vol = 0.034 + 0.042 * s;
  const det = Math.pow(2, rand(-6, 6) / 1200); // ±6 cents
  const bright = 0.55 + 0.75 * s;              // soft hits rounder, hard hits brighter
  kind = kind || 'stone';
  if (voiceHits[kind] != null) voiceHits[kind]++;
  if (s > 0.72) buzz(8);
  if (kind === 'dew') {
    // glassy water-drop: fast downward pitch glide + quiet inharmonic partials
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f * 1.6 * det, t);
    o.frequency.exponentialRampToValueAtTime(f * det, t + 0.09);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * 0.95, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.30);
    o.connect(g); voiceOut(g, bus, x, 0.30, 0.10);
    o.start(t); o.stop(t + 0.32);
    const parts = [[2.76, 0.10], [4.21, 0.05]];
    for (let i = 0; i < parts.length; i++) {
      const op = AC.createOscillator(); op.type = 'sine';
      op.frequency.setValueAtTime(f * parts[i][0] * det, t);
      op.frequency.exponentialRampToValueAtTime(f * parts[i][0] * det * 0.94, t + 0.08);
      const gp = AC.createGain();
      gp.gain.setValueAtTime(0.0001, t);
      gp.gain.exponentialRampToValueAtTime(vol * parts[i][1] * bright, t + 0.008);
      gp.gain.exponentialRampToValueAtTime(0.0008, t + 0.12);
      op.connect(gp); voiceOut(gp, bus, x, 0.30, 0.05);
      op.start(t); op.stop(t + 0.14);
    }
  } else if (kind === 'firefly') {
    // bell: sine + a high partial, slow tremolo shimmer, longer tail
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f * det;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * 0.9, t + 0.016);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.85);
    o.connect(g); voiceOut(g, bus, x, 0.45, 0.14);
    o.start(t); o.stop(t + 0.9);
    const trem = AC.createOscillator(); trem.type = 'sine'; trem.frequency.value = 5.2;
    const tremG = AC.createGain(); tremG.gain.value = vol * 0.16;
    trem.connect(tremG); tremG.connect(g.gain);
    trem.start(t); trem.stop(t + 0.85);
    const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 3.9 * det;
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * 0.13 * bright, t + 0.010);
    g2.gain.exponentialRampToValueAtTime(0.0008, t + 0.5);
    o2.connect(g2); voiceOut(g2, bus, x, 0.45, 0.10);
    o2.start(t); o2.stop(t + 0.55);
  } else {
    // stone: the v4 felt-marimba — sine core, triangle body, octave whisper
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f * det;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.52);
    o.connect(g); voiceOut(g, bus, x, 0.35, 0.12);
    o.start(t); o.stop(t + 0.55);
    const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * det;
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * 0.22, t + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0008, t + 0.30);
    o2.connect(g2); voiceOut(g2, bus, x, 0.35, 0.08);
    o2.start(t); o2.stop(t + 0.32);
    const o3 = AC.createOscillator(); o3.type = 'sine'; o3.frequency.value = f * 2 * det;
    const g3 = AC.createGain();
    g3.gain.setValueAtTime(0.0001, t);
    g3.gain.exponentialRampToValueAtTime(vol * 0.07 * bright, t + 0.010);
    g3.gain.exponentialRampToValueAtTime(0.0008, t + 0.18);
    o3.connect(g3); voiceOut(g3, bus, x, 0.30, 0.06);
    o3.start(t); o3.stop(t + 0.20);
    // a whisper of noise tick — felt, not wood (kept very low)
    const src = AC.createBufferSource(); src.buffer = noiseBuffer(0.03);
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400 * bright; bp.Q.value = 0.8;
    const ng = AC.createGain();
    ng.gain.setValueAtTime(vol * 0.10, t);
    ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.03);
    src.connect(bp); bp.connect(ng); voiceOut(ng, bus, x, 0.2, 0);
    src.start(t); src.stop(t + 0.04);
  }
}

/* soft "pock" — seed nestling into soil; v6 layers a low thump and a
   short granular burst under the original softened sine + hush */
function sndPock(x) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.13);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.20, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
  o.connect(g); voiceOut(g, null, x == null ? null : x, 0.15, 0);
  o.start(t); o.stop(t + 0.18);
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(0.09);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.055, t);
  ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.09);
  src.connect(lp); lp.connect(ng); voiceOut(ng, null, x == null ? null : x, 0.1, 0);
  src.start(t); src.stop(t + 0.1);
  // low thump — the body of the landing (sine pitch drop 90→50 Hz)
  const th = AC.createOscillator(); th.type = 'sine';
  th.frequency.setValueAtTime(92, t);
  th.frequency.exponentialRampToValueAtTime(50, t + 0.11);
  const tg = AC.createGain();
  tg.gain.setValueAtTime(0.16, t);
  tg.gain.exponentialRampToValueAtTime(0.0008, t + 0.13);
  th.connect(tg); voiceOut(tg, null, x == null ? null : x, 0.1, 0);
  th.start(t); th.stop(t + 0.15);
  // granular burst — soil grains scattering (bandpass ~600 Hz)
  const gs = AC.createBufferSource(); gs.buffer = noiseBuffer(0.06);
  const gb = AC.createBiquadFilter(); gb.type = 'bandpass'; gb.frequency.value = 600; gb.Q.value = 0.7;
  const gg = AC.createGain();
  gg.gain.setValueAtTime(0.05, t);
  gg.gain.exponentialRampToValueAtTime(0.0008, t + 0.06);
  gs.connect(gb); gb.connect(gg); voiceOut(gg, null, x == null ? null : x, 0.1, 0);
  gs.start(t); gs.stop(t + 0.07);
}

/* water-shimmer swell while a plant grows */
function sndShimmer(dur) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(Math.min(dur, 2.5)); src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(700, t);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.028, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); voiceOut(g, null, null, 0.25, 0);
  src.start(t); src.stop(t + dur + 0.05);
  // a soft rising gliss under it
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(392, t);
  o.frequency.exponentialRampToValueAtTime(784, t + dur * 0.9);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.016, t + dur * 0.5);
  og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(og); voiceOut(og, null, null, 0.2, 0);
  o.start(t); o.stop(t + dur + 0.05);
}

/* warm bloom chime — bell arpeggio; luminous blooms get extra sparkle */
function sndChime(luminous) {
  if (!AC || muted) return;
  duckAmbience();
  const t = AC.currentTime;
  const base = luminous ? 659.25 : 523.25;
  const notes = [1, 1.25, 1.5];
  if (luminous) notes.push(2, 2.5);
  notes.forEach(function (mult, i) {
    const t0 = t + i * 0.085;
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = base * mult;
    const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = base * mult * 2.76;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(luminous ? 0.075 : 0.09, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (luminous ? 1.3 : 0.95));
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.020, t0 + 0.015);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    o.connect(g); voiceOut(g, null, null, 0.6, 0.06);
    o2.connect(g2); voiceOut(g2, null, null, 0.5, 0);
    o.start(t0); o.stop(t0 + 1.4);
    o2.start(t0); o2.stop(t0 + 0.45);
  });
}

function computeLayout() {
  const u = Math.min(W, H);
  const pickerH = started ? clamp(H * 0.155, 104, 128) : 0;
  const hudH = Math.max(58, H * 0.075);
  const soilBase = H - pickerH - clamp(H * 0.115, 64, 104); // meadow floor line
  const meadowTop = soilBase - clamp(H * 0.06, 34, 58);
  const boardTop = hudH + 52;
  const boardBot = meadowTop - 10;
  const binTop = boardBot - clamp(H * 0.062, 34, 54);

  const pegDx = clamp(W / 15.5, 27, 54);
  const pegDy = clamp((binTop - boardTop) / 8.4, 32, 54);
  const pegs = [];
  let row = 0;
  for (let y = boardTop + pegDy * 0.45; y < binTop - pegDy * 0.3; y += pegDy, row++) {
    const off = (row % 2) ? pegDx / 2 : 0;
    for (let x = pegDx * 0.6 + off; x < W - pegDx * 0.25; x += pegDx) {
      const hsh = hashStr('peg' + Math.round(x) + ':' + Math.round(y));
      pegs.push({ x: x, y: y, row: row, kind: hsh < 0.62 ? 'dew' : (hsh < 0.9 ? 'stone' : 'firefly'), seed: hsh, flash: 0 });
    }
  }
  lastRowY = pegs.length ? pegs[pegs.length - 1].y : 0;
  // reed dividers guiding seeds into the meadow
  const dividers = [];
  const nDiv = Math.max(6, Math.round(W / 92));
  for (let i = 1; i < nDiv; i++) {
    dividers.push({ x: (W / nDiv) * i, y0: binTop, y1: soilBase - 4, sway: hashStr('div' + i) * 6.28 });
  }
  return {
    u: u, hudH: hudH, pickerH: pickerH,
    boardTop: boardTop, boardBot: boardBot, binTop: binTop,
    meadowTop: meadowTop, soilBase: soilBase,
    pegs: pegs, dividers: dividers,
    pegR: clamp(u * 0.0075, 3.2, 5.2),
    seedR: clamp(u * 0.0135, 6, 10),
    dropY: hudH + 22,
    plantScale: clamp(u / 640, 0.62, 1.25)
  };
}
function soilYAt(x) {
  return L.soilBase + Math.sin(x * 0.011 + 1.3) * 3.2 + Math.sin(x * 0.031) * 1.4;
}

function resize() {

  canvas.style.width = W + 'px';

/* ================================================================

   never cuts. Sun and moon arc overhead; a slow weather machine

   lanterns and the glowing species (see drawNightLights).
   ================================================================ */
const DAY_LEN = 120; // seconds per full day
const SKY_KEYS = [
  { h: 0.0,  top:'#0a0f24', mid:'#131a38', low:'#1e2148', hor:'#2b2757', night:1,    warm:0 },

  { h: 13.0, top:'#6ea3dc', mid:'#9fc2e2', low:'#d5dcba', hor:'#fff0bc', night:0,    warm:0.05 },
  { h: 16.0, top:'#6f97c4', mid:'#b3a8b8', low:'#eec493', hor:'#ffe9a8', night:0,    warm:0.35 },
  { h: 17.8, top:'#5d74a8', mid:'#b57f8d', low:'#f0a56e', hor:'#ffc978', night:0.05, warm:0.8 },
  { h: 19.0, top:'#3d4479', mid:'#8a5570', low:'#d96f57', hor:'#f78d54', night:0.3,  warm:1 },
  { h: 20.0, top:'#262a55', mid:'#4c3f6b', low:'#6e4a6e', hor:'#8a5570', night:0.65, warm:0.4 },
  { h: 21.2, top:'#12173a', mid:'#1c2148', low:'#2a2857', hor:'#3a3268', night:0.9,  warm:0.1 },
  { h: 22.5, top:'#0a0f24', mid:'#131a38', low:'#1e2148', hor:'#2b2757', night:1,    warm:0 },
  { h: 24.0, top:'#0a0f24', mid:'#131a38', low:'#1e2148', hor:'#2b2757', night:1,    warm:0 }
];
function paletteAt(h) {
  h = ((h % 24) + 24) % 24;
  let a = SKY_KEYS[0], b = SKY_KEYS[SKY_KEYS.length - 1];
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    if (h >= SKY_KEYS[i].h && h <= SKY_KEYS[i + 1].h) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
  }
  const t = (b.h - a.h) > 0 ? (h - a.h) / (b.h - a.h) : 0;
  const night = lerp(a.night, b.night, t), warm = lerp(a.warm, b.warm, t);
  return {
    top: mixHex(a.top, b.top, t), mid: mixHex(a.mid, b.mid, t),
    low: mixHex(a.low, b.low, t), hor: mixHex(a.hor, b.hor, t),
    night: night, warm: warm, star: smooth(0.45, 0.95, night)

}

}
/* three-way colour blend: day →(warm)→ golden →(night)→ after dark */
function triCol(day, warm, night, wk, nk, a) {
  const r1 = lerp(day[0], warm[0], wk), g1 = lerp(day[1], warm[1], wk), b1 = lerp(day[2], warm[2], wk);
  return 'rgba(' + Math.round(lerp(r1, night[0], nk)) + ',' + Math.round(lerp(g1, night[1], nk)) + ',' +
         Math.round(lerp(b1, night[2], nk)) + ',' + a + ')';
}
function fmtClock(h) {
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;

/* ---------------- weather machine ---------------- */
const WX_TARGETS = {
  clear:  { cloud: 0.10, rain: 0, fog: 0 },
  cloudy: { cloud: 0.78, rain: 0, fog: 0 },
  rain:   { cloud: 1.0,  rain: 1, fog: 0 },
  fog:    { cloud: 0.45, rain: 0, fog: 1 }
};
const WX_FLOW = { // where the sky drifts next (weighted); pleasant wins
  clear:  [['cloudy', 0.50], ['fog', 0.14], ['rain', 0.08], ['clear', 0.28]],
  cloudy: [['clear', 0.36], ['rain', 0.34], ['fog', 0.10], ['cloudy', 0.20]],
  rain:   [['cloudy', 0.55], ['clear', 0.16], ['fog', 0.09], ['rain', 0.20]],
  fog:    [['clear', 0.42], ['cloudy', 0.33], ['rain', 0.08], ['fog', 0.17]]
};
let wxState = 'clear', wxT = 26;
let cloudCover = 0.10, rainAmt = 0, fogAmt = 0;
function setWx(state, snap) {
  if (!WX_TARGETS[state]) return;
  wxState = state;
  wxT = snap ? 600 : rand(26, 55);
  if (snap) {
    const tg = WX_TARGETS[state];
    cloudCover = tg.cloud; rainAmt = tg.rain; fogAmt = tg.fog;
  }
}

const cloudObjs = [];
for (let i = 0; i < 7; i++) {
  cloudObjs.push({ fx: Math.random() * 1.3 - 0.15, fy: Math.random(), s: rand(0.7, 1.5), sp: rand(0.0022, 0.005), a: rand(0.65, 1) });
}
const starField = [];
for (let i = 0; i < 90; i++) {
  starField.push({ fx: Math.random(), fy: Math.random() * 0.92, r: rand(0.6, 1.7), ph: rand(0, 6.28) });
}
const freeFlies = [];
for (let i = 0; i < 14; i++) {
  freeFlies.push({ fx: Math.random(), fy: rand(0.35, 0.95), ph: rand(0, 6.28), sp: rand(0.5, 1.1) });
}
const rainDrops = [];
for (let i = 0; i < 110; i++) {
  rainDrops.push({ fx: Math.random() * 1.02, y: Math.random() * 700, l: rand(9, 15), v: rand(620, 900), off: Math.random() * 22 });
}
const ripples = [];
const LANTERN_X = [0.10, 0.29, 0.50, 0.71, 0.90];
const LANTERN_ROW = [2, 1, 2, 1, 2];

function updateSky(dt) {
  clockH = (clockH + dt * (24 / DAY_LEN)) % 24;
  palNow = paletteAt(clockH);
  wxT -= dt;
  if (wxT <= 0) {
    const row = WX_FLOW[wxState];
    let r = Math.random(), acc = 0, nxt = wxState;
    for (let i = 0; i < row.length; i++) { acc += row[i][1]; if (r <= acc) { nxt = row[i][0]; break; } }
    setWx(nxt, false);
  }
  const tg = WX_TARGETS[wxState];
  cloudCover += (tg.cloud - cloudCover) * (1 - Math.exp(-dt / 5));
  rainAmt += (tg.rain - rainAmt) * (1 - Math.exp(-dt / 4.5));
  fogAmt += (tg.fog - fogAmt) * (1 - Math.exp(-dt / 6));
  for (let i = 0; i < cloudObjs.length; i++) {
    const c = cloudObjs[i];
    c.fx += dt * c.sp * (0.5 + cloudCover * 0.9) * (0.6 + windV * 1.1); // v6 — shared wind drives the drift
    if (c.fx > 1.3) c.fx = -0.3;
  }
  if (rainAmt > 0.02 && L) {
    for (let i = 0; i < rainDrops.length; i++) {
      const d = rainDrops[i];
      d.y += d.v * dt;
      d.fx -= dt * 0.014; if (d.fx < -0.02) d.fx += 1.04;
      const x = d.fx * W;
      const gy = soilYAt(x) + 4;
      if (d.y > gy + d.off) {
        if (Math.random() < 0.4 && ripples.length < 24) {
          ripples.push({ x: x, y: gy + 2 + d.off * 0.4, r: 2, age: 0 });
        }
        d.y = -20 - Math.random() * 60; d.fx = Math.random() * 1.02; d.off = Math.random() * 22;
      }
    }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.age += dt; r.r = 2 + r.age * 24;
    if (r.age > 0.9) ripples.splice(i, 1);
  }
}

function drawClouds(now) {
  const dark = clamp(cloudCover * 0.55 + rainAmt * 0.5, 0, 1);
  const nk = palNow.night;
  const cr = Math.round(lerp(lerp(255, 88, dark), 18, nk * 0.85));
  const cg = Math.round(lerp(lerp(255, 98, dark), 22, nk * 0.85));
  const cb = Math.round(lerp(lerp(255, 122, dark), 48, nk * 0.85));
  const baseA = 0.14 + 0.62 * cloudCover;
  const bandH = Math.max(26, (L.boardTop - L.hudH) * 0.95);
  for (let i = 0; i < cloudObjs.length; i++) {
    const c = cloudObjs[i];
    const cx = c.fx * W, cy = L.hudH + 6 + c.fy * bandH;
    const sc = c.s * clamp(W / 900, 0.7, 1.3);
    ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (baseA * c.a) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 52 * sc, 15 * sc, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 26 * sc, cy + 3 * sc, 34 * sc, 12 * sc, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 27 * sc, cy + 3 * sc, 28 * sc, 10 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRain(now) {
  if (rainAmt < 0.02) return;
  const n = Math.floor(rainDrops.length * rainAmt);
  ctx.strokeStyle = 'rgba(196,220,246,' + (0.30 * rainAmt) + ')';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const d = rainDrops[i];
    const x = d.fx * W;
    ctx.moveTo(x, d.y);
    ctx.lineTo(x + d.l * 0.22, d.y - d.l);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(205,228,250,' + (0.5 * rainAmt) + ')';
  ctx.lineWidth = 1;
  for (let i = 0; i < ripples.length; i++) {
    const r = ripples[i];
    ctx.globalAlpha = 1 - r.age / 0.9;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawFog(now) {
  if (fogAmt < 0.02) return;
  const yTop = L.meadowTop - 46, yBot = L.soilBase + 36;
  const g = ctx.createLinearGradient(0, yTop, 0, yBot);
  g.addColorStop(0, 'rgba(232,238,248,0)');
  g.addColorStop(0.55, 'rgba(232,238,248,' + (0.10 * fogAmt) + ')');
  g.addColorStop(1, 'rgba(232,238,248,' + (0.20 * fogAmt) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, yTop, W, yBot - yTop);
  for (let i = 0; i < 5; i++) {
    const bx = (((now * 0.006 * (0.7 + windV * 0.8) * (1 + i * 0.23)) + i * 0.27) % 1.3 - 0.15) * W; // v6 — fog rides the same wind
    const by = L.meadowTop - 6 + i * 13 + Math.sin(now * 0.3 + i * 2.1) * 4;
    const bw = W * (0.34 + (i % 3) * 0.09);
    const bg = ctx.createRadialGradient(bx, by, 2, bx, by, bw * 0.5);
    bg.addColorStop(0, 'rgba(235,241,250,' + (0.13 * fogAmt) + ')');
    bg.addColorStop(1, 'rgba(235,241,250,0)');
    ctx.save();
    ctx.translate(bx, by); ctx.scale(1, 0.16); ctx.translate(-bx, -by);
    ctx.fillStyle = bg;
    ctx.fillRect(bx - bw * 0.5, by - bw * 0.5, bw, bw);
    ctx.restore();
  }
}

/* After dark: dim the painted world with a cool multiply, then pour
   the lights back in additively — stars, firefly pegs as true light
   sources, lanterns among the rows, glowing blooms, free fireflies. */
function drawNightLights(now) {
  const nk = palNow.night;
  if (nk > 0.02) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + Math.round(lerp(255, 116, nk)) + ',' + Math.round(lerp(255, 128, nk)) + ',' + Math.round(lerp(255, 186, nk)) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.fillStyle = 'rgba(24,28,72,' + (0.10 * nk) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (palNow.star > 0.02) {
    const skyH = Math.max(10, L.boardTop - 16);
    for (let i = 0; i < starField.length; i++) {
      const sf = starField[i];
      const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now * 1.8 + sf.ph * 4));
      ctx.fillStyle = 'rgba(235,242,255,' + (palNow.star * tw * 0.9) + ')';
      ctx.beginPath(); ctx.arc(sf.fx * W, sf.fy * skyH, sf.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (nk < 0.05) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < L.pegs.length; i++) {
    const p = L.pegs[i];
    if (p.kind !== 'firefly') continue;
    const pulse = 0.55 + 0.45 * Math.sin(now * 2.1 + p.seed * 40);
    const R = L.pegR * 4.6;
    const g = ctx.createRadialGradient(p.x, p.y, 0.5, p.x, p.y, R);
    g.addColorStop(0, 'rgba(255,232,138,' + (0.5 * pulse * nk) + ')');
    g.addColorStop(1, 'rgba(255,232,138,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < LANTERN_X.length; i++) {
    const x = LANTERN_X[i] * W;
    const y = soilYAt(x) + ROW_BASE[LANTERN_ROW[i]] - 2;
    const fl = 0.85 + 0.15 * Math.sin(now * 7 + i * 2.3) * Math.sin(now * 3.1 + i);
    const R = 30;
    const g = ctx.createRadialGradient(x, y - 8, 1, x, y - 8, R);
    g.addColorStop(0, 'rgba(255,190,92,' + (0.30 * fl * nk) + ')');
    g.addColorStop(1, 'rgba(255,190,92,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - 8, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,224,158,' + (0.9 * nk) + ')';
    ctx.beginPath(); ctx.arc(x, y - 8, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < plants.length; i++) {
    const p = plants[i];
    if (!p.sp.glow || p.t < 0.76) continue;
    const bk = clamp((p.t - 0.76) / 0.24, 0, 1);
    if (bk <= 0) continue;
    const S = plantScaleOf(p);
    const HGT = 175 * S * p.sp.h;
    const stemK = easeOutCubic(smooth(0, 0.55, p.t));
    const hy = plantBaseY(p) - (p.sp.form === 'cap' ? HGT * 0.72 * stemK + 6 * S : HGT * stemK + 5 * S);
    const R = 32 * S * (0.6 + 0.5 * bk);
    const cc = hexRgb(p.sp.glow);
    const g = ctx.createRadialGradient(p.x, hy, 1, p.x, hy, R);
    g.addColorStop(0, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + (0.36 * bk * (0.3 + 0.7 * nk)) + ')');
    g.addColorStop(1, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, hy, R, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < freeFlies.length; i++) {
    const f = freeFlies[i];
    const x = ((f.fx + Math.sin(now * 0.10 * f.sp + f.ph) * 0.014) % 1) * W;
    const y = f.fy * L.meadowTop + Math.sin(now * 0.55 * f.sp + f.ph * 2) * 7;
    const blink = Math.pow(0.5 + 0.5 * Math.sin(now * 1.6 * f.sp + f.ph * 3), 2);
    const a = nk * (0.12 + 0.75 * blink);
    if (a < 0.03) continue;
    const g = ctx.createRadialGradient(x, y, 0.5, x, y, 10);
    g.addColorStop(0, 'rgba(255,240,160,' + (a * 0.8) + ')');
    g.addColorStop(1, 'rgba(255,240,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,246,190,' + a + ')';
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

const motes = [];
for (let i = 0; i < 34; i++) {
  motes.push({ x: Math.random(), y: Math.random(), r: rand(0.8, 2.3), ph: rand(0, 6.28), sp: rand(0.004, 0.014) });
}

function drawBackground(now) {
  const P = palNow;
  // the living sky — one gradient, colours walked across 24 keyframed hours
  const sky = ctx.createLinearGradient(0, 0, 0, L.meadowTop);
  sky.addColorStop(0, P.top);
  sky.addColorStop(0.42, P.mid);
  sky.addColorStop(0.74, P.low);
  sky.addColorStop(1, P.hor);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, L.meadowTop + 2);

  const cel = celestial();
  // the moon (drawn first — the sun outshines it where they overlap)
  if (cel.moon && cel.moon.a > 0.01) {
    const m = cel.moon;
    const mg = ctx.createRadialGradient(m.x, m.y, 2, m.x, m.y, 64);
    mg.addColorStop(0, 'rgba(214,228,255,' + (0.5 * m.a) + ')');
    mg.addColorStop(1, 'rgba(214,228,255,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(m.x - 70, m.y - 70, 140, 140);
    ctx.fillStyle = 'rgba(238,243,255,' + (0.95 * m.a) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, 12.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(178,194,224,' + (0.55 * m.a) + ')';
    ctx.beginPath(); ctx.arc(m.x - 4, m.y - 3, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x + 3.5, m.y + 4, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x + 5, m.y - 5.5, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  // the sun — halo, god rays fanning down, warm disc near the horizon
  if (cel.sun && cel.sun.a > 0.01) {
    const sn = cel.sun;
    const pulse = 1 + Math.sin(now * 0.35) * 0.04;
    const hcA = hexRgb('#fff3bc'), hcB = hexRgb('#ff8f4d');
    const hw = (1 - sn.elev) * 0.8;
    const hr = Math.round(lerp(hcA[0], hcB[0], hw));
    const hg = Math.round(lerp(hcA[1], hcB[1], hw));
    const hb = Math.round(lerp(hcA[2], hcB[2], hw));
    const sg = ctx.createRadialGradient(sn.x, sn.y, 4, sn.x, sn.y, 135 * pulse);
    sg.addColorStop(0, 'rgba(' + hr + ',' + hg + ',' + hb + ',' + (0.85 * sn.a) + ')');
    sg.addColorStop(0.3, 'rgba(' + hr + ',' + hg + ',' + hb + ',' + (0.38 * sn.a) + ')');
    sg.addColorStop(1, 'rgba(' + hr + ',' + hg + ',' + hb + ',0)');
    ctx.fillStyle = sg;
    ctx.fillRect(sn.x - 145, sn.y - 145, 290, 290);
    const rayA = (0.16 + 0.5 * sn.elev) * sn.a * (1 - cloudCover * 0.85) * (1 - P.night * 0.7);
    if (rayA > 0.01) {
      ctx.save();
      ctx.translate(sn.x, sn.y);
      for (let i = 0; i < 5; i++) {
        const a = Math.PI / 2 + (i - 2) * 0.21 + Math.sin(now * 0.05 + i) * 0.012;
        ctx.save();
        ctx.rotate(a);
        const grd = ctx.createLinearGradient(0, 0, H * 0.95, 0);
        grd.addColorStop(0, 'rgba(255,240,190,' + (rayA * (0.55 - i * 0.07)) + ')');
        grd.addColorStop(1, 'rgba(255,240,190,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(H * 0.95, -24 - i * 5);
        ctx.lineTo(H * 0.95, 24 + i * 5);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(' + hr + ',' + hg + ',' + hb + ',' + (0.98 * sn.a) + ')';
    ctx.beginPath(); ctx.arc(sn.x, sn.y, 15.5, 0, Math.PI * 2); ctx.fill();
  }

  drawClouds(now);

  // hazy far hills, tinted by the hour
  ctx.fillStyle = triCol([133, 128, 110], [154, 122, 88], [32, 39, 74], P.warm * 0.55, P.night, 0.55);
  ctx.beginPath();
  ctx.moveTo(0, L.meadowTop);
  for (let x = 0; x <= W; x += 8) {
    ctx.lineTo(x, L.meadowTop - 30 - Math.sin(x * 0.005 + 1.7) * 22 - Math.sin(x * 0.016) * 7);
  }
  ctx.lineTo(W, L.meadowTop); ctx.closePath(); ctx.fill();

  // meadow slope — greens warmed at golden hour, deepened after dark
  const mg = ctx.createLinearGradient(0, L.meadowTop - 14, 0, L.soilBase + 30);
  mg.addColorStop(0, triCol([168, 191, 98], [188, 171, 94], [46, 74, 60], P.warm, P.night, 1));
  mg.addColorStop(0.55, triCol([127, 163, 72], [143, 148, 64], [34, 58, 48], P.warm, P.night, 1));
  mg.addColorStop(1, triCol([93, 127, 54], [102, 117, 47], [20, 35, 29], P.warm, P.night, 1));
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(0, L.soilBase + 34);
  for (let x = 0; x <= W; x += 8) {
    ctx.lineTo(x, L.meadowTop - 10 - Math.sin(x * 0.008 + 0.4) * 10);
  }
  ctx.lineTo(W, L.soilBase + 34); ctx.closePath(); ctx.fill();

  // drifting pollen motes in the light (they go to bed at night)
  const moteA = 0.5 * (1 - P.night * 0.8);
  if (moteA > 0.02) {
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.y -= m.sp * 0.016; if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
      const mx = ((m.x + Math.sin(now * 0.24 + m.ph) * 0.008) % 1) * W;
      const my = m.y * L.meadowTop;
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * 1.4 + m.ph * 3));
      ctx.fillStyle = 'rgba(255,244,196,' + (moteA * tw) + ')';
      ctx.beginPath(); ctx.arc(mx, my, m.r, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawBoard(now) {
  // living vine rails
  const railG = ctx.createLinearGradient(0, L.boardTop, 0, L.boardBot);
  railG.addColorStop(0, '#6d5136'); railG.addColorStop(1, '#4c3a22');
  ctx.fillStyle = railG;
  ctx.fillRect(0, L.boardTop - 10, 8, L.boardBot - L.boardTop + 12);
  ctx.fillRect(W - 8, L.boardTop - 10, 8, L.boardBot - L.boardTop + 12);
  ctx.fillStyle = '#7fa348';
  for (let i = 0; i < 7; i++) {
    const y = L.boardTop + 8 + i * ((L.boardBot - L.boardTop) / 7);
    ctx.beginPath(); ctx.ellipse(10, y, 5.5, 2.8, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W - 10, y + 9, 5.5, 2.8, -0.5, 0, Math.PI * 2); ctx.fill();
  }

  // reed dividers
  for (let i = 0; i < L.dividers.length; i++) {
    const d = L.dividers[i];
    const bend = Math.sin(now * 1.1 + d.sway) * 2.6;
    ctx.strokeStyle = '#5d8440';
    ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(d.x, d.y1);
    ctx.quadraticCurveTo(d.x + bend * 0.4, (d.y0 + d.y1) / 2, d.x + bend, d.y0);
    ctx.stroke();
    ctx.fillStyle = '#7a5c33';
    ctx.beginPath(); ctx.ellipse(d.x + bend, d.y0 - 3, 3.2, 5.2, bend * 0.05, 0, Math.PI * 2); ctx.fill();
  }

  // pegs — dew drops, river stones, and a few fireflies
  for (let i = 0; i < L.pegs.length; i++) {
    const p = L.pegs[i], r = L.pegR;
    const wobA = (p.wob || 0) * 1.6;
    const px = p.x + Math.cos(p.wobPh || 0) * wobA * Math.sin((p.wob || 0) * 12);
    const py = p.y + Math.sin(p.wobPh || 0) * wobA * Math.sin((p.wob || 0) * 12);
    ctx.fillStyle = 'rgba(60,40,16,.25)';
    ctx.beginPath(); ctx.ellipse(px, py + r * 0.9, r * 1.15, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    if (p.kind === 'dew') {
      const g = ctx.createRadialGradient(px - r * 0.35, py - r * 0.4, r * 0.15, px, py, r * 1.25);
      g.addColorStop(0, 'rgba(255,255,255,.98)');
      g.addColorStop(0.45, 'rgba(197,226,244,.88)');
      g.addColorStop(1, 'rgba(127,176,214,.82)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, r * 1.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath(); ctx.arc(px - r * 0.38, py - r * 0.42, r * 0.30, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'stone') {
      const g = ctx.createLinearGradient(px, py - r, px, py + r);
      g.addColorStop(0, '#a9a9b8'); g.addColorStop(1, '#74748a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(px, py, r * 1.5, r * 1.05, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.ellipse(px - r * 0.4, py - r * 0.35, r * 0.55, r * 0.28, -0.4, 0, Math.PI * 2); ctx.fill();
    } else { // firefly stone
      const pulse = 0.55 + 0.45 * Math.sin(now * 2.1 + p.seed * 40);
      const g = ctx.createRadialGradient(px, py, 0.5, px, py, r * 3.4);
      g.addColorStop(0, 'rgba(255,232,138,' + (0.75 * pulse) + ')');
      g.addColorStop(1, 'rgba(255,232,138,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, r * 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a8574';
      ctx.beginPath(); ctx.ellipse(px, py, r * 1.25, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffedb0';
      ctx.beginPath(); ctx.arc(px, py - r * 0.3, r * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    if (p.flash > 0.01) {
      ctx.strokeStyle = 'rgba(255,246,200,' + (p.flash * 0.8) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(px, py, r * (1.6 + (1 - p.flash) * 1.6), 0, Math.PI * 2); ctx.stroke();
    }
  }
}

function drawMeadow() {
  // soil band
  const nk = palNow.night;
  const st = ctx.createLinearGradient(0, L.soilBase - 8, 0, H);
  st.addColorStop(0, mixHex('#77562f', '#3a2c40', nk));
  st.addColorStop(0.25, mixHex('#63452a', '#2e2136', nk));
  st.addColorStop(1, mixHex('#453019', '#1a1424', nk));
  ctx.fillStyle = st;
  ctx.fillRect(0, L.soilBase - 6, W, H - L.soilBase + 6);
  // soft mounded top edge
  ctx.fillStyle = mixHex('#86643a', '#4c3a58', nk);
  ctx.beginPath();
  ctx.moveTo(0, L.soilBase + 4);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, soilYAt(x) - 3.5);
  ctx.lineTo(W, L.soilBase + 5); ctx.closePath(); ctx.fill();
  // depth terraces (v2) — a soft ridge of light at each garden row's baseline,
  // with a shading trough beneath, so the three rows read as ground receding
  for (let ri = 0; ri < 3; ri++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const y = soilYAt(x) + ROW_BASE[ri] + 5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = ri === 2 ? 'rgba(255,232,170,.14)' : 'rgba(43,26,8,.15)';
    ctx.lineWidth = ri === 2 ? 2.4 : 3.4;
    ctx.stroke();
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const y = soilYAt(x) + ROW_BASE[ri] + 11;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(30,17,4,.10)';
    ctx.lineWidth = 5;
    ctx.stroke();
  }
  // warm atmospheric wash over the back of the bed
  const wash = ctx.createLinearGradient(0, L.soilBase - 10, 0, L.soilBase + 30);
  wash.addColorStop(0, 'rgba(' + hazeRGB() + ',' + (0.10 * (1 - nk * 0.4)) + ')');
  wash.addColorStop(1, 'rgba(' + hazeRGB() + ',0)');
  ctx.fillStyle = wash;
  ctx.fillRect(0, L.soilBase - 10, W, 40);
  // speckles
  ctx.fillStyle = 'rgba(255,225,170,.10)';
  for (let i = 0; i < 46; i++) {
    const x = ((i * 97.3) % Math.max(10, W - 12)) + 6;
    const y = L.soilBase + 4 + ((i * 53.7) % Math.max(10, (H - L.pickerH) - L.soilBase - 8));
    ctx.fillRect(x, y, 2.2, 1.4);
  }
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  for (let i = 0; i < 30; i++) {
    const x = ((i * 131.7) % Math.max(10, W - 12)) + 6;
    const y = L.soilBase + 6 + ((i * 71.3) % Math.max(10, (H - L.pickerH) - L.soilBase - 10));
    ctx.fillRect(x, y, 2.6, 1.6);
  }
}

function drawForegroundGrass(now) {
  const baseY = H - L.pickerH + 2;
  ctx.fillStyle = 'rgba(46,74,28,.75)';
  for (let i = 0; i < 44; i++) {
    const x = ((i * 89.7) % Math.max(10, W - 8)) + 4;
    const hgt = 12 + (i % 5) * 4.5;
    const sway = Math.sin(now * 1.3 + i * 1.7) * 2.4;
    ctx.beginPath();
    ctx.moveTo(x - 1.8, baseY);
    ctx.quadraticCurveTo(x + sway * 0.4, baseY - hgt * 0.6, x + sway, baseY - hgt);
    ctx.quadraticCurveTo(x + sway * 0.4 + 1.2, baseY - hgt * 0.6, x + 1.8, baseY);
    ctx.closePath(); ctx.fill();
  }
}

/* dew ripples (v6) — a hit dew peg rings outward and sheds droplets.
   Pool: at most 10 live rings; droplets join the shared particle pool. */
const dewRipples = [];
function spawnDewRipple(p) {
  if (dewRipples.length < 10) dewRipples.push({ x: p.x, y: p.y, age: 0, r: L.pegR });
  const n = REDUCED_MOTION ? 2 : 4;
  for (let i = 0; i < n; i++) {
    if (particles.length >= 280) break;
    particles.push({
      kind: 'droplet', x: p.x, y: p.y,
      vx: rand(-46, 46), vy: rand(-70, -12),
      life: rand(0.28, 0.5), age: 0, r: rand(0.9, 1.7)
    });
  }
}
function drawDewRipples(dt) {
  for (let i = dewRipples.length - 1; i >= 0; i--) {
    const rp = dewRipples[i];
    rp.age += dt;
    const k = rp.age / 0.45;
    if (k >= 1) { dewRipples.splice(i, 1); continue; }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(190,225,250,' + (0.55 * (1 - k)) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r * (1.2 + k * 2.6), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

/* vignette (v6) — one pre-rendered radial overlay, a single drawImage
   per frame; rebuilt only when the viewport changes size */
let vignetteCv = null;
function drawVignette() {
  if (!vignetteCv || vignetteCv.width !== Math.round(W) || vignetteCv.height !== Math.round(H)) {
    vignetteCv = document.createElement('canvas');
    vignetteCv.width = Math.max(2, Math.round(W)); vignetteCv.height = Math.max(2, Math.round(H));
    const vc = vignetteCv.getContext('2d');
    const g = vc.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.42, W / 2, H * 0.52, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(20,12,4,0)');
    g.addColorStop(1, 'rgba(20,12,4,0.20)');
    vc.fillStyle = g; vc.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vignetteCv, 0, 0, W, H);
}

function drawParticles(dt) {
  // pass 1 — soil stays flat (matter, not light)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.kind !== 'soil') continue;
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    const k = 1 - p.age / p.life;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 330 * dt;
    ctx.fillStyle = 'rgba(101,70,40,' + (0.85 * k) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.4, 0, Math.PI * 2); ctx.fill();
  }
  // pass 2 — light particles under additive blending (v6): sparks, glow
  // motes, pollen, seed-trail flecks and dew droplets all read as light
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.kind === 'soil') continue;
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    const k = 1 - p.age / p.life;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'spark') {
      p.vy -= 24 * dt;
      ctx.fillStyle = 'rgba(255,220,110,' + (0.95 * k) + ')';
    } else if (p.kind === 'glowmote') {
      p.vy -= 10 * dt; p.vx += Math.sin(p.age * 4 + p.r) * 7 * dt;
      ctx.fillStyle = rgba(p.col || '#ffe9a3', 0.8 * k);
    } else if (p.kind === 'trail') {
      p.vy += 14 * dt;
      ctx.fillStyle = 'rgba(255,240,190,' + (0.5 * k) + ')';
    } else if (p.kind === 'droplet') {
      p.vy += 420 * dt;
      ctx.fillStyle = 'rgba(190,225,250,' + (0.85 * k) + ')';
    } else { // pollen
      p.vy -= 7 * dt; p.vx += Math.sin(p.age * 5 + p.r) * 6 * dt;
      ctx.fillStyle = 'rgba(255,246,200,' + (0.75 * k) + ')';
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // pollen floaters ("+5 ❀")
  ctx.textAlign = 'center';
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.age += dt;
    if (f.age >= f.life) { floaters.splice(i, 1); continue; }
    const k = 1 - f.age / f.life;
    ctx.font = '700 ' + Math.round(13 * L.plantScale + 3) + 'px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,217,104,' + (0.95 * k) + ')';
    ctx.fillText(f.text, f.x, f.y - f.age * 26);
  }
  ctx.textAlign = 'left';
}

/* ================================================================
   PLANT PAINTING — 16 forms, all procedural, all painted
   drawPlantShape(c, p, now, S): base at origin, grows upward.
   ================================================================ */
function petalPoint(c, x, y, len, wid, ang, fill) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = fill;
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.45, -wid, len, 0);
  c.quadraticCurveTo(len * 0.45, wid, 0, 0);
  c.fill();
  c.restore();
}
function petalRound(c, x, y, len, wid, ang, fill) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = fill;
  c.beginPath(); c.ellipse(len / 2, 0, len / 2, wid / 2, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}
function leafShape(c, x, y, len, wid, ang, colA, colB) {
  if (len <= 0.5) return;
  c.save(); c.translate(x, y); c.rotate(ang);
  const grd = c.createLinearGradient(0, 0, len, 0);
  grd.addColorStop(0, colA); grd.addColorStop(1, colB);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.5, -wid, len, 0);
  c.quadraticCurveTo(len * 0.5, wid, 0, 0);
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,.13)'; c.lineWidth = 0.8;
  c.beginPath(); c.moveTo(len * 0.1, 0); c.lineTo(len * 0.9, 0); c.stroke();
  c.restore();
}
function stemPath(c, x, topX, h, w, colA, colB) {
  if (h <= 1.5) return;
  const cx = x + topX * 0.25, cy = -h * 0.55;
  const grd = c.createLinearGradient(0, 0, 0, -h);
  grd.addColorStop(0, colB); grd.addColorStop(1, colA);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(x - w / 2, 0);
  c.quadraticCurveTo(cx - w * 0.30, cy, topX - w * 0.20, -h);
  c.lineTo(topX + w * 0.20, -h);
  c.quadraticCurveTo(cx + w * 0.30, cy, x + w / 2, 0);
  c.closePath(); c.fill();
}
function stemPoint(topX, h, f) {
  const cx = topX * 0.25, cy = -h * 0.55;
  const x = 2 * (1 - f) * f * cx + f * f * topX;
  const y = 2 * (1 - f) * f * cy + f * f * (-h);
  return [x, y];
}
function drawBud(c, x, y, k, sp, S) {
  const R = (13 * S + 1.5) * k;
  if (R <= 0.6) return;
  c.save(); c.translate(x, y);
  const grd = c.createLinearGradient(0, R * 0.6, 0, -R * 1.25);
  grd.addColorStop(0, mixHex(sp.pal.p[0], sp.pal.p[1], 0.15));
  grd.addColorStop(1, mixHex(sp.pal.p[0], sp.pal.p[1], 0.55));
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(0, -R * 1.3);
  c.quadraticCurveTo(R * 0.85, -R * 0.4, R * 0.62, R * 0.35);
  c.quadraticCurveTo(R * 0.4, R * 0.75, 0, R * 0.72);
  c.quadraticCurveTo(-R * 0.4, R * 0.75, -R * 0.62, R * 0.35);
  c.quadraticCurveTo(-R * 0.85, -R * 0.4, 0, -R * 1.3);
  c.fill();
  leafShape(c, -R * 0.2, R * 0.62, R * 0.95, R * 0.34, 2.65, sp.pal.l, sp.pal.s);
  leafShape(c, R * 0.2, R * 0.62, R * 0.95, R * 0.34, 0.5, sp.pal.s, sp.pal.l);
  c.restore();
}

/* ---------- flower heads (drawn at origin, radius R) ---------- */
function headRosette(c, sp, R, v, disc) {
  const pal = sp.pal, n = sp.petals || 13;
  const off = v * 2.2;
  for (let i = 0; i < n; i++) {
    petalRound(c, 0, 0, R * (disc ? 0.82 : 1.02), R * 0.36, off + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.22));
  }
  const n2 = Math.max(5, Math.round(n * 0.7));
  for (let i = 0; i < n2; i++) {
    petalRound(c, 0, 0, R * 0.66, R * 0.3, off + 0.24 + (i / n2) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.6));
  }
  c.fillStyle = pal.c;
  c.beginPath(); c.arc(0, 0, R * (disc ? 0.5 : 0.3), 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.c2 || pal.c;
  const dots = disc ? 12 : 6;
  for (let i = 0; i < dots; i++) {
    const a = i * 2.39 + v * 3, rr = R * (disc ? 0.13 + (i % 3) * 0.13 : 0.1 + (i % 2) * 0.08);
    c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr, R * 0.05, 0, Math.PI * 2); c.fill();
  }
}
function headPompom(c, sp, R, v) {
  const pal = sp.pal, total = sp.petals || 22;
  for (let ring = 0; ring < 3; ring++) {
    const n = Math.round(total * (1 - ring * 0.24));
    const len = R * (1.05 - ring * 0.27);
    for (let i = 0; i < n; i++) {
      petalPoint(c, 0, 0, len, R * 0.17, v * 2 + ring * 0.38 + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.18 + ring * 0.3));
    }
  }
  c.fillStyle = pal.a;
  c.beginPath(); c.arc(0, 0, R * 0.16, 0, Math.PI * 2); c.fill();
}
function headCluster(c, sp, R, v) {
  const pal = sp.pal;
  c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.3);
  c.globalAlpha = 0.55;
  c.beginPath(); c.arc(0, 0, R * 0.92, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
  for (let i = 0; i < 15; i++) {
    const h1 = hashStr(sp.id + 'f' + i), h2 = hashStr(sp.id + 'g' + i), h3 = hashStr(sp.id + 'h' + i);
    const a = h1 * Math.PI * 2, rr = Math.sqrt(h2) * R * 0.74;
    const fx = Math.cos(a) * rr, fy = Math.sin(a) * rr * 0.86;
    const fr = R * 0.21;
    const fill = mixHex(pal.p[0], pal.p[1], 0.25 + h3 * 0.6);
    for (let q = 0; q < 4; q++) {
      c.fillStyle = fill;
      c.beginPath(); c.arc(fx + Math.cos(q * 1.57 + h1) * fr * 0.55, fy + Math.sin(q * 1.57 + h1) * fr * 0.55, fr * 0.62, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = pal.c;
    c.beginPath(); c.arc(fx, fy, fr * 0.3, 0, Math.PI * 2); c.fill();
  }
}
function headCup(c, sp, R, v) {
  const pal = sp.pal;
  const grd = c.createLinearGradient(0, R * 0.7, 0, -R * 0.95);
  grd.addColorStop(0, pal.p[0]); grd.addColorStop(1, pal.p[1]);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(-R * 0.34, -R * 0.82);
  c.quadraticCurveTo(-R * 0.58, -R * 0.2, -R * 0.55, R * 0.28);
  c.quadraticCurveTo(-R * 0.5, R * 0.66, 0, R * 0.68);
  c.quadraticCurveTo(R * 0.5, R * 0.66, R * 0.55, R * 0.28);
  c.quadraticCurveTo(R * 0.58, -R * 0.2, R * 0.34, -R * 0.82);
  c.quadraticCurveTo(R * 0.14, -R * 0.38, 0, -R * 0.66);
  c.quadraticCurveTo(-R * 0.14, -R * 0.38, -R * 0.34, -R * 0.82);
  c.fill();
  c.fillStyle = 'rgba(255,255,255,.20)';
  c.beginPath();
  c.moveTo(-R * 0.3, -R * 0.6);
  c.quadraticCurveTo(-R * 0.38, 0, -R * 0.3, R * 0.45);
  c.quadraticCurveTo(-R * 0.14, R * 0.5, -R * 0.13, R * 0.1);
  c.quadraticCurveTo(-R * 0.16, -R * 0.3, -R * 0.3, -R * 0.6);
  c.fill();
  c.fillStyle = rgba(pal.p[0], 0.35);
  c.beginPath();
  c.moveTo(R * 0.3, -R * 0.6);
  c.quadraticCurveTo(R * 0.38, 0, R * 0.3, R * 0.45);
  c.quadraticCurveTo(R * 0.14, R * 0.5, R * 0.13, R * 0.1);
  c.quadraticCurveTo(R * 0.16, -R * 0.3, R * 0.3, -R * 0.6);
  c.fill();
}
function headLayered(c, sp, R, v) {
  const pal = sp.pal;
  const rings = [ { r: 0.98, n: 5, k: 0.08 }, { r: 0.74, n: 5, k: 0.3 }, { r: 0.5, n: 4, k: 0.52 }, { r: 0.28, n: 3, k: 0.72 } ];
  for (let ri = 0; ri < rings.length; ri++) {
    const ring = rings[ri];
    // shade pass — each petal casts a soft shadow on the ring beneath
    for (let i = 0; i < ring.n; i++) {
      const ang = v * 2 + ri * 0.55 + (i / ring.n) * Math.PI * 2;
      petalRound(c, 0, R * 0.07, R * ring.r * 1.06, R * ring.r * 0.66, ang, mixHex(pal.p[0], '#2a0510', 0.38));
    }
    for (let i = 0; i < ring.n; i++) {
      const ang = v * 2 + ri * 0.55 + (i / ring.n) * Math.PI * 2;
      petalRound(c, 0, 0, R * ring.r * 1.06, R * ring.r * 0.66, ang, mixHex(pal.p[0], pal.p[1], ring.k));
    }
  }
  c.strokeStyle = pal.c; c.lineWidth = Math.max(1.1, R * 0.07); c.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    c.beginPath();
    c.arc(0, 0, R * (0.17 - i * 0.045), v * 2 + i * 1.2, v * 2 + i * 1.2 + 4.2);
    c.stroke();
  }
}
function headCrown(c, sp, R, v) {
  const pal = sp.pal, n = sp.petals || 5;
  for (let i = 0; i < n; i++) {
    const lt = 0.22 + 0.18 * hashStr(sp.id + 'cp' + i);
    petalRound(c, 0, 0, R * 1.0, R * 0.74, v * 2 + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], lt));
  }
  for (let i = 0; i < n; i++) {
    petalRound(c, 0, 0, R * 0.62, R * 0.46, v * 2 + 0.4 + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.55));
  }
  c.fillStyle = pal.c;
  c.beginPath(); c.arc(0, 0, R * 0.3, 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.a;
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + v;
    c.beginPath(); c.arc(Math.cos(a) * R * 0.4, Math.sin(a) * R * 0.4, R * 0.055, 0, Math.PI * 2); c.fill();
  }
}
function headTrumpet(c, sp, R, v) {
  const pal = sp.pal;
  for (let i = 0; i < 3; i++) {
    petalPoint(c, 0, 0, R * 1.3, R * 0.36, v * 2 + (i / 3) * Math.PI * 2 + 0.5, mixHex(pal.p[0], pal.p[1], 0.18));
  }
  for (let i = 0; i < 3; i++) {
    petalPoint(c, 0, 0, R * 1.42, R * 0.4, v * 2 + (i / 3) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.5));
  }
  c.strokeStyle = mixHex(pal.c, '#8a5a2b', 0.4); c.lineWidth = Math.max(1, R * 0.05); c.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const a = v * 2 + (i / 5) * Math.PI * 2;
    const ex = Math.cos(a) * R * 0.66, ey = Math.sin(a) * R * 0.66;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(ex, ey); c.stroke();
    c.fillStyle = pal.c;
    c.beginPath(); c.ellipse(ex, ey, R * 0.1, R * 0.055, a, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = pal.a;
  c.beginPath(); c.arc(0, 0, R * 0.13, 0, Math.PI * 2); c.fill();
}
function headStar(c, sp, R, v) {
  const pal = sp.pal;
  // falls (drooping lower petals)
  for (let i = -1; i <= 1; i++) {
    petalPoint(c, 0, 0, R * 1.1, R * 0.42, Math.PI / 2 + i * 0.62 + v, mixHex(pal.p[0], pal.p[1], 0.15));
  }
  // standards (upright)
  for (let i = -1; i <= 1; i++) {
    petalRound(c, 0, 0, R * 1.0, R * 0.44, -Math.PI / 2 + i * 0.55 + v, mixHex(pal.p[0], pal.p[1], 0.55));
  }
  c.fillStyle = pal.c;
  for (let i = 0; i < 4; i++) {
    c.beginPath(); c.arc(-R * 0.16 + i * R * 0.11, R * 0.18, R * 0.05, 0, Math.PI * 2); c.fill();
  }
}
function drawHead(c, sp, R, v) {
  switch (sp.form) {
    case 'rosette': headRosette(c, sp, R, v, false); break;
    case 'disc': headRosette(c, sp, R, v, true); break;
    case 'pompom': headPompom(c, sp, R, v); break;
    case 'cluster': headCluster(c, sp, R, v); break;
    case 'cup': headCup(c, sp, R, v); break;
    case 'layered': headLayered(c, sp, R, v); break;
    case 'crown': headCrown(c, sp, R, v); break;
    case 'trumpet': headTrumpet(c, sp, R, v); break;
    case 'star': headStar(c, sp, R, v); break;
  }
}

/* ---------- dedicated form painters ---------- */
function paintSpike(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, v = p.variant;
  const stems = 3 + Math.floor(v * 2);
  for (let i = 0; i < stems; i++) {
    const fx = (i - (stems - 1) / 2) * 9 * S;
    const h = K.HGT * K.stemK * (0.8 + 0.2 * Math.sin(i * 2.7 + p.phase));
    if (h < 4) continue;
    const topX = fx + Math.sin(K.sway * 3 + i) * h * 0.14;
    stemPath(c, fx * 0.4, topX, h, 1.9 * S, pal.s, mixHex(pal.s, '#000000', 0.2));
    if (K.budK > 0.03) {
      const buds = 6;
      for (let b = 0; b < buds; b++) {
        const bt = b / buds;
        const bx = topX + (bt - 0.5) * 2 * S, by = -h - bt * 13 * S * K.budK + 3 * S;
        const br = (2.6 - bt * 0.9) * S * K.budK + 0.4;
        c.fillStyle = mixHex(pal.p[0], pal.p[1], bt * 0.7);
        c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)';
        c.beginPath(); c.arc(bx - br * 0.3, by - br * 0.3, br * 0.32, 0, Math.PI * 2); c.fill();
      }
    }
    if (K.bloomK > 0.05) {
      c.fillStyle = pal.a;
      c.beginPath(); c.arc(topX, -h - 13 * S * K.budK, 1.8 * S * K.bloomK + 0.4, 0, Math.PI * 2); c.fill();
    }
  }
  leafShape(c, -2 * S, -2 * S, 26 * S * K.leafK, 4.5 * S, 2.95, pal.l, pal.s);
  leafShape(c, 2 * S, -2 * S, 22 * S * K.leafK, 4.5 * S, 0.2, pal.s, pal.l);
}
function paintBell(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  const P0 = [0, 0], C = [K.sway * 30 * S, -h * 0.6], P2 = [h * 0.30, -h * 0.94];
  c.strokeStyle = pal.s; c.lineWidth = 2.6 * S; c.lineCap = 'round';
  c.beginPath(); c.moveTo(P0[0], P0[1]); c.quadraticCurveTo(C[0], C[1], P2[0], P2[1]); c.stroke();

    c.moveTo(bx - bw * 0.32, by + 3 * S);
    c.quadraticCurveTo(bx - bw * 0.4, by + 3 * S + bh * 0.7, bx - bw * 0.62, by + 3 * S + bh);
    c.quadraticCurveTo(bx, by + 3 * S + bh * 1.12, bx + bw * 0.62, by + 3 * S + bh);
    c.quadraticCurveTo(bx + bw * 0.4, by + 3 * S + bh * 0.7, bx + bw * 0.32, by + 3 * S);

}
function paintPlume(c, p, now, S, K) {

      c.fillStyle = 'rgba(255,255,255,.25)';

function paintPad(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, R = K.R;
  // dew pond
  const pond = c.createRadialGradient(0, 2 * S, 2, 0, 2 * S, R * 2.5);
  pond.addColorStop(0, 'rgba(140,195,215,.55)');
  pond.addColorStop(0.7, 'rgba(110,170,195,.28)');
  pond.addColorStop(1, 'rgba(110,170,195,0)');
  c.fillStyle = pond;
  c.beginPath(); c.ellipse(0, 2 * S, R * 2.5, R * 0.55, 0, 0, Math.PI * 2); c.fill();
  // lily pads
  const pads = [[-R * 1.15, 0.75, 0.62], [R * 1.2, 0.95, 0.85], [R * 0.25, 1.35, 0.5]];
  for (let i = 0; i < pads.length; i++) {
    const pd = pads[i], pk = K.leafK * pd[2];
    if (pk <= 0.03) continue;
    const px = pd[0] * pk, py = pd[1] * S, pr = R * 0.62 * pk;
    c.fillStyle = mixHex(pal.l, pal.s, 0.3 + i * 0.15);
    c.beginPath();
    c.moveTo(px, py);
    c.arc(px, py, pr, 0.5 + i, Math.PI * 2 - 0.55 + i);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;
    c.beginPath(); c.arc(px, py, pr * 0.94, 0.6 + i, Math.PI * 1.5 + i); c.stroke();
  }
  // flower stem + layered pointed petals
  const h = K.HGT * 0.52 * K.stemK;
  if (h < 3) return;
  stemPath(c, 0, K.sway * 20 * S, h, 2.6 * S, pal.s, mixHex(pal.s, '#000000', 0.2));
  const topX = K.sway * 20 * S, topY = -h;
  if (K.bloomK <= 0.02) { if (K.budK > 0.05) drawBud(c, topX, topY - 3 * S, K.budK, sp, S); return; }
  c.save(); c.translate(topX, topY); c.scale(K.bloomK, K.bloomK);
  const open = 0.35 + 0.65 * K.matureK; // petals unfold as it matures
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + p.variant;
    petalPoint(c, 0, 0, R * 1.05, R * 0.34, a, mixHex(pal.p[0], pal.p[1], 0.3));
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.4 + p.variant;
    petalPoint(c, 0, 0, R * 0.8, R * 0.3, a - (1 - open) * 0.0, mixHex(pal.p[0], pal.p[1], 0.6));
  }
  c.fillStyle = pal.c;
  c.beginPath(); c.ellipse(0, 0, R * 0.24, R * 0.18, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.c2 || pal.c;
  for (let i = 0; i < 6; i++) {
    const a = i * 2.39;
    c.beginPath(); c.arc(Math.cos(a) * R * 0.12, Math.sin(a) * R * 0.09, R * 0.04, 0, Math.PI * 2); c.fill();

}
function paintBranch(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  const ex = h * 0.72, ey = -h * 0.82;
  c.strokeStyle = '#5e4630'; c.lineCap = 'round';
  c.lineWidth = 4.6 * S;
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(h * 0.2, -h * 0.5, ex, ey); c.stroke();
  c.lineWidth = 2.2 * S;
  c.beginPath(); c.moveTo(h * 0.3, -h * 0.44); c.quadraticCurveTo(h * 0.42, -h * 0.62, h * 0.34, -h * 0.78); c.stroke();
  c.beginPath(); c.moveTo(h * 0.48, -h * 0.6); c.quadraticCurveTo(h * 0.62, -h * 0.66, h * 0.78, -h * 0.62); c.stroke();
  const clusters = [[0.25, -0.36], [0.36, -0.72], [0.52, -0.55], [0.72, -0.8], [0.8, -0.6], [0.62, -0.68]];
  for (let i = 0; i < clusters.length; i++) {
    const cxp = clusters[i][0] * h, cyp = clusters[i][1] * h;
    const stagger = hashStr(sp.id + 'cl' + i);
    const bk = clamp(K.bloomK * 1.35 - stagger * 0.35, 0, 1);
    if (bk <= 0.03) {
      if (K.budK > 0.1) {
        c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.35);
        c.beginPath(); c.arc(cxp, cyp, 3.4 * S * K.budK, 0, Math.PI * 2); c.fill();
      }
      continue;
    }
    for (let b = 0; b < 3; b++) {
      const bx = cxp + (hashStr(sp.id + 'bx' + i + '' + b) - 0.5) * 13 * S;
      const by = cyp + (hashStr(sp.id + 'by' + i + '' + b) - 0.5) * 10 * S;
      const br = 6.4 * S * bk;
      for (let q = 0; q < 5; q++) {
        petalRound(c, bx, by, br * 1.15, br * 0.62, (q / 5) * Math.PI * 2 + 0.3, mixHex(pal.p[0], pal.p[1], 0.45));
      }
      c.fillStyle = pal.c;
      c.beginPath(); c.arc(bx, by, br * 0.22, 0, Math.PI * 2); c.fill();
    }

}
function paintCap(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, R = K.R;
  const h = K.HGT * 0.72 * K.stemK;
  if (h < 3) return;
  const capK = smooth(0.25, 0.85, p.t);
  // tapered stem
  const grd = c.createLinearGradient(0, 0, 0, -h);
  grd.addColorStop(0, mixHex(pal.s, '#8a7a5e', 0.25)); grd.addColorStop(1, pal.s);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(-R * 0.34, 0);
  c.quadraticCurveTo(-R * 0.26, -h * 0.6, -R * 0.2, -h);
  c.lineTo(R * 0.2, -h);
  c.quadraticCurveTo(R * 0.26, -h * 0.6, R * 0.34, 0);
  c.closePath(); c.fill();
  if (capK <= 0.02) return;
  const cw = R * 1.18 * capK, ch = R * 0.72 * capK;
  c.save(); c.translate(0, -h);
  const cg = c.createLinearGradient(0, -ch, 0, ch * 0.3);
  cg.addColorStop(0, pal.p[1]); cg.addColorStop(1, pal.p[0]);
  c.fillStyle = cg;
  c.beginPath();
  c.moveTo(-cw, 0);
  c.quadraticCurveTo(-cw * 0.9, -ch * 1.05, 0, -ch * 1.12);
  c.quadraticCurveTo(cw * 0.9, -ch * 1.05, cw, 0);
  c.quadraticCurveTo(0, ch * 0.34, -cw, 0);
  c.fill();
  c.fillStyle = 'rgba(70,50,30,.28)';
  c.beginPath(); c.ellipse(0, ch * 0.08, cw * 0.82, ch * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.a;
  const spots = [[-0.45, -0.62, 0.13], [0.1, -0.85, 0.16], [0.52, -0.55, 0.11], [-0.08, -0.45, 0.09], [0.34, -0.3, 0.08]];
  for (let i = 0; i < spots.length; i++) {
    c.beginPath();
    c.ellipse(spots[i][0] * cw, spots[i][1] * ch, spots[i][2] * cw, spots[i][2] * cw * 0.7, 0, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}
function paintBlade(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const fronds = 6;
  for (let i = 0; i < fronds; i++) {
    const fi = i / (fronds - 1);
    const ang = -Math.PI / 2 + (fi - 0.5) * 1.25;
    const len = K.HGT * (0.62 + 0.38 * Math.sin(fi * Math.PI)) * K.stemK * (0.75 + 0.25 * hashStr(sp.id + 'fr' + i));
    if (len < 4) continue;
    const bend = Math.sin(now * (1.0 + windV * 0.6) + p.phase + i) * 2 * S * (0.6 + windV) + (p.lean || 0) * 22 * S; // v6 — fronds ride the same wind
    const cxp = Math.cos(ang) * len * 0.5 + bend, cyp = Math.sin(ang) * len * 0.55;
    const ex = Math.cos(ang) * len + bend * 1.6, ey = Math.sin(ang) * len + len * 0.14;
