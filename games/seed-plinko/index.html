    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(cxp, cyp, ex, ey); c.stroke();
    const leaflets = 8;
    for (let q = 1; q <= leaflets; q++) {
      const f = q / (leaflets + 1);
      const px = 2 * (1 - f) * f * cxp + f * f * ex;
      const py = 2 * (1 - f) * f * cyp + f * f * ey;
      const ls = (1 - f * 0.75) * 8.5 * S * K.leafK;
      if (ls < 0.6) continue;
      const la = Math.atan2(ey, ex) ;
      leafShape(c, px, py, ls, ls * 0.3, la - 0.85, mixHex(pal.p[0], pal.p[1], f * 0.5), pal.l);

    }
  }
}
function paintSpray(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, R = K.R;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  leafShape(c, -2 * S, -1 * S, 30 * S * K.leafK, 9 * S, 2.85, pal.l, pal.s);
  leafShape(c, 3 * S, -1 * S, 26 * S * K.leafK, 8.5 * S, 0.3, pal.s, pal.l);

  c.beginPath(); c.moveTo(P0[0], P0[1]); c.quadraticCurveTo(C[0], C[1], P2[0], P2[1]); c.stroke();
  const blooms = 4;
  for (let i = 0; i < blooms; i++) {
    const t = 0.45 + (i / (blooms - 1)) * 0.53;
    const bx = 2 * (1 - t) * t * C[0] + t * t * P2[0];
    const by = 2 * (1 - t) * t * C[1] + t * t * P2[1];
    const stagger = i * 0.14;
    const bk = clamp((K.bloomK - stagger) / (1 - stagger), 0, 1);
    if (bk <= 0.03) {
      if (K.budK > 0.1) {
        c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.3);
        c.beginPath(); c.arc(bx, by, 3 * S * K.budK, 0, Math.PI * 2); c.fill();
      }
      continue;
    }
    c.save(); c.translate(bx, by - 2 * S); c.scale(bk, bk);
    const br = R * 0.52;
    for (let q = 0; q < 3; q++) {
      petalPoint(c, 0, 0, br * 0.95, br * 0.26, -2.2 + q * 0.75, mixHex(pal.p[0], pal.p[1], 0.12));
    }
    petalRound(c, 0, 0, br * 1.05, br * 0.6, -0.5, mixHex(pal.p[0], pal.p[1], 0.55));
    petalRound(c, 0, 0, br * 1.05, br * 0.6, 0.5 + Math.PI, mixHex(pal.p[0], pal.p[1], 0.55));

    c.beginPath(); c.ellipse(0, br * 0.2, br * 0.3, br * 0.2, 0, 0, Math.PI * 2); c.fill();

    c.beginPath(); c.arc(0, br * 0.14, br * 0.09, 0, Math.PI * 2); c.fill();

/* ---------- master plant painter ---------- */
function drawPlantShape(c, p, now, S) {
  const sp = p.sp, g = p.t;
  const K = {
    HGT: 175 * S * sp.h,
    R: 24 * S,
    stemK: easeOutCubic(smooth(0, 0.55, g)),
    leafK: smooth(0.26, 0.68, g),
    budK: smooth(0.5, 0.8, g),
    bloomK: g > 0.76 ? clamp(easeOutBack((g - 0.76) / 0.24), 0, 1.12) : 0,
    matureK: smooth(0.8, 1, g),
    sway: (Math.sin(now * (0.9 + windV * 0.9) + p.phase + windV * 2.2) * (0.028 + windV * 0.05) + (p.lean || 0)) * (0.3 + 0.7 * smooth(0, 0.55, g)) // v6 — one shared wind, plus landing lean
  };
  // soft ground shadow
  c.fillStyle = 'rgba(40,26,8,.18)';
  c.beginPath(); c.ellipse(0, 2 * S, K.R * 0.95, K.R * 0.2, 0, 0, Math.PI * 2); c.fill();
  // luminous pool of light
  if (sp.glow && K.bloomK > 0) {
    const lg = c.createRadialGradient(0, 0, 2, 0, 0, K.R * 2.6);
    lg.addColorStop(0, rgba(sp.glow, 0.20 * K.bloomK));
    lg.addColorStop(1, rgba(sp.glow, 0));
    c.fillStyle = lg;
    c.beginPath(); c.arc(0, -K.HGT * 0.4, K.R * 2.6, 0, Math.PI * 2); c.fill();
  }
  // bloom light pulse — a breath of light while the flower opens
  const pulseK = (g > 0.72 && g < 1) ? Math.sin((g - 0.72) / 0.28 * Math.PI) : 0;
  if (pulseK > 0.01) {
    const hy = -K.HGT * K.stemK * (sp.form === 'cap' ? 0.72 : 0.92);
    const pg = c.createRadialGradient(0, hy, 2, 0, hy, K.R * 3.4);
    const pc = sp.glow || sp.pal.p[1];
    pg.addColorStop(0, rgba(pc, 0.20 * pulseK));
    pg.addColorStop(1, rgba(pc, 0));
    c.fillStyle = pg;
    c.beginPath(); c.arc(0, hy, K.R * 3.4, 0, Math.PI * 2); c.fill();
  }
  switch (sp.form) {
    case 'spike': paintSpike(c, p, now, S, K); return;
    case 'bell': paintBell(c, p, now, S, K); return;
    case 'plume': paintPlume(c, p, now, S, K); return;
    case 'pad': paintPad(c, p, now, S, K); return;
    case 'branch': paintBranch(c, p, now, S, K); return;
    case 'cap': paintCap(c, p, now, S, K); return;
    case 'blade': paintBlade(c, p, now, S, K); return;
    case 'spray': paintSpray(c, p, now, S, K); return;
  }
  // generic stem + head forms
  const pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 2) {
    // sprout: two baby leaves
    const ss = smooth(0, 0.3, g);
    if (ss > 0) {
      leafShape(c, -1, -1, 8 * S * ss + 0.5, 3 * S, 2.9, '#6db35a', pal.l);
      leafShape(c, 1, -1, 8 * S * ss + 0.5, 3 * S, 0.25, pal.l, '#6db35a');
    }
    return;
  }
  const topX = K.sway * h * 0.6;
  stemPath(c, 0, topX, h, 3.4 * S, pal.s, mixHex(pal.s, '#000000', 0.18));
  // leaves unfurl one by one as the stem climbs
  const lk1 = smooth(0.22, 0.5, g), lk2 = smooth(0.36, 0.64, g), lk3 = smooth(0.5, 0.78, g);
  if (lk1 > 0.02) { const l1 = stemPoint(topX, h, 0.4);  leafShape(c, l1[0], l1[1], 16 * S * lk1, 5.2 * S, 2.8 + K.sway, pal.l, pal.s); }
  if (lk2 > 0.02) { const l2 = stemPoint(topX, h, 0.6);  leafShape(c, l2[0], l2[1], 13.5 * S * lk2, 4.8 * S, 0.35 + K.sway, pal.s, pal.l); }
  if (lk3 > 0.02) { const l3 = stemPoint(topX, h, 0.78); leafShape(c, l3[0], l3[1], 10 * S * lk3, 4 * S, 2.95 + K.sway, pal.l, mixHex(pal.s, pal.l, 0.5)); }
  if (sp.glow && K.bloomK > 0) {
    c.save();
    c.shadowColor = sp.glow; c.shadowBlur = 18 * S * K.bloomK;
  }
  if (K.bloomK > 0.02) {
    c.save();
    c.translate(topX, -h - K.R * 0.2);
    c.rotate(K.sway * 1.5);
    c.scale(K.bloomK, K.bloomK);
    drawHead(c, sp, K.R, p.variant);
    c.restore();
  } else if (K.budK > 0.03) {
    drawBud(c, topX, -h - 2 * S, K.budK, sp, S);
  }
  if (sp.glow && K.bloomK > 0) c.restore();
}

function drawPlant(p, now) {
  ctx.save();
  if (p.retire != null) ctx.globalAlpha = clamp(1 - smooth(0, 1, p.retire), 0, 1); // retirement fade
  ctx.translate(p.x, plantBaseY(p));
  drawPlantShape(ctx, p, now, plantScaleOf(p));
  ctx.restore();
}

function bakePlant(p) {
  if (!bakedGarden) return;
  bakedTotal++;
  const bctx = bakedGarden.getContext('2d');
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.save();
  bctx.globalAlpha = 0.3; // v5 — retired plants linger as a whisper, not a shadow
  bctx.translate(p.x, plantBaseY(p));
  drawPlantShape(bctx, p, 1.0, plantScaleOf(p));
  bctx.restore();
}

/* packet / journal thumbnails — the same painters, miniaturized */
const thumbCache = {};
function makeThumb(sp) {
  if (thumbCache[sp.id]) return thumbCache[sp.id];
  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96;
  const c = cv.getContext('2d');
  const fake = { sp: sp, t: 1, variant: 0.42, phase: 1.7, x: 0, yOff: 0, scale: 1 };
  c.translate(48, 90);
  drawPlantShape(c, fake, 1.2, 0.44);
  const url = cv.toDataURL();
  thumbCache[sp.id] = url;
  return url;
}

/* ================================================================
   SEEDS — drop, bounce, plant (physics adapted from Seed Plinko)
   ================================================================ */
let ROUND = 0;
let totalBlooms = 0;
const sessionSpecies = {};

function drawSeedShape(x, y, r, sp, s) {
  ctx.save();
  ctx.translate(x, y);
  // v6 — a falling seed rotates by its real spin; the dropper's seed
  // keeps the old gentle cosmetic rock
  const rot = s ? (s.rot || 0) : (-0.35 + Math.sin(performance.now() * 0.004 + x) * 0.08);
  ctx.rotate(rot);
  const sq = s ? (s.squash || 0) : 0;
  if (sq > 0.01) {
    // squash along the velocity vector: flatten across the motion
    const va = Math.atan2(s.vy, s.vx) - rot;
    ctx.rotate(va);
    ctx.scale(1 + sq * 0.22, 1 - sq * 0.22);
    ctx.rotate(-va);
  }
  ctx.fillStyle = sp.seed[0];
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.82, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sp.seed[1];
  ctx.beginPath(); ctx.ellipse(-r * 0.22, -r * 0.3, r * 0.34, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  // specular highlight (v6)
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(r * 0.24, -r * 0.3, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.arc(r * 0.2, r * 0.25, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* a falling seed, with its soft contact shadow on the soil below —
   the shadow firms up and shrinks as the seed nears the ground */
function drawSeed(s) {
  const gy = soilYAt(s.x);
  const hgt = gy - s.y;
  if (hgt < 340) {
    const k = clamp(1 - hgt / 340, 0, 1);
    ctx.fillStyle = 'rgba(40,26,8,' + (0.05 + 0.20 * k) + ')';
    ctx.beginPath();
    ctx.ellipse(s.x, gy + 3, s.r * (1.5 - 0.5 * k), s.r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  drawSeedShape(s.x, s.y, s.r, s.sp, s);
}

const DROP_DEBOUNCE_MS = 100; // v3 — just enough to stop one click becoming two drops
function dropSeed() {
  if (!started) return;
  const now = performance.now();
  if (now - lastDropAt < DROP_DEBOUNCE_MS) return;
  lastDropAt = now;
  const sp = dropSpecies();
  seeds.push({
    x: dropperX, y: L.dropY + L.seedR + 2,
    vx: rand(-14, 14), vy: 30,
    r: L.seedR, sp: sp,
    born: now, lastClickAt: 0,
    spin: 0, rot: rand(0, 6.28), squash: 0, stallT: 0, trailT: 0 // v6 physics state
  });
  if (randomMode) rollNext(); // queue the next surprise the moment this seed leaves
  updateHUD();
}

const PEG_REST = { dew: 0.58, stone: 0.44, firefly: 0.52 }; // per-kind bounce (v6)
let lastRowY = 0; // set by computeLayout — the last-row slow-mo watches for it
function stepSeed(s, dt) {
  const GRAV = 1500;
  // last-row anticipation: time eases to 0.85× across the final row
  if (!REDUCED_MOTION && lastRowY > 0 && s.y > lastRowY - 4 && s.y < L.binTop) dt *= 0.85;
  // fixed 4-substep integration — the old random velocity jitter is gone
  const SUBS = 4, sdt = dt / SUBS;
  for (let q = 0; q < SUBS; q++) {
    s.vy += GRAV * sdt;
    // deterministic anti-stall: a seed that nearly stops while still on
    // the board gets a gentle downward bias; if it persists past 0.8 s
    // the bias strengthens. The 6 s failsafe below still backstops all.
    const sp0 = Math.hypot(s.vx, s.vy);
    if (sp0 < 42 && s.y < L.binTop) { s.vy += 900 * sdt; s.stallT = (s.stallT || 0) + sdt; }
    else s.stallT = 0;
    if (s.stallT > 0.8) s.vy += 1400 * sdt;
    if (performance.now() - s.born > 6000) s.vy = Math.max(s.vy, 260);

    s.x += s.vx * sdt;
    s.y += s.vy * sdt;
    s.spin = (s.spin || 0) * Math.pow(0.35, sdt); // spin decays in flight

    // pollen trail — pooled additive flecks shed while falling
    s.trailT = (s.trailT || 0) + sdt;
    if (s.trailT > (REDUCED_MOTION ? 0.09 : 0.045) && particles.length < 260) {
      s.trailT = 0;
      particles.push({
        kind: 'trail', x: s.x + rand(-2, 2), y: s.y + rand(-2, 2),
        vx: -s.vx * 0.06 + rand(-6, 6), vy: -s.vy * 0.06 + rand(-4, 8),
        life: rand(0.3, 0.55), age: 0, r: rand(1.1, 2.2)
      });
    }

    const rail = 8;
    if (s.x < rail + s.r) { s.x = rail + s.r; s.vx = Math.abs(s.vx) * 0.55; }
    if (s.x > W - rail - s.r) { s.x = W - rail - s.r; s.vx = -Math.abs(s.vx) * 0.55; }

    const pr = L.pegR + s.r;
    for (let i = 0; i < L.pegs.length; i++) {
      const p = L.pegs[i];
      const dx = s.x - p.x, dy = s.y - p.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < pr * pr && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        s.x = p.x + nx * pr;
        s.y = p.y + ny * pr;
        const vn = s.vx * nx + s.vy * ny;
        if (vn < 0) {
          const rest = PEG_REST[p.kind] || 0.52;
          const tx = -ny, ty = nx;
          let vt = s.vx * tx + s.vy * ty;
          // tangential friction: slide and spin trade through the contact
          const rollV = (s.spin || 0) * s.r;
          vt = vt + (rollV - vt) * 0.35;
          s.spin = (vt / s.r) * 0.55;
          const nvn = -vn * rest;
          s.vx = nx * nvn + tx * vt;
          s.vy = ny * nvn + ty * vt;
          s.squash = Math.min(1, Math.abs(vn) / 380);
          p.flash = 1;
          p.wob = 1; p.wobPh = Math.atan2(ny, nx); // spring-wobble (visual only)
          if (p.kind === 'dew') spawnDewRipple(p);
          const now = performance.now();
          if (now - s.lastClickAt > 45) {
            s.lastClickAt = now;
            sndPlink((p.y - L.boardTop) / Math.max(1, L.binTop - L.boardTop), Math.min(1, Math.abs(vn) / 420), p.kind, p.x);
          }
        }
      }
    }

    if (s.y > L.binTop - s.r && s.y < L.soilBase + 6) {
      for (let i = 0; i < L.dividers.length; i++) {
        const dv = L.dividers[i];
        if (s.y > dv.y0 - s.r && s.y < dv.y1 + s.r) {
          const dx = s.x - dv.x;
          if (Math.abs(dx) < s.r + 2.5 && dx !== 0) {
            const side = dx > 0 ? 1 : -1;
            s.x = dv.x + side * (s.r + 2.5);
            s.vx = side * Math.abs(s.vx) * 0.4 + side * 12;
            const now = performance.now();
            if (now - s.lastClickAt > 60) { s.lastClickAt = now; sndPlink(0.9, 0.2, 'stone', s.x); }
          }
        }
      }
    }
  }

  s.squash = Math.max(0, (s.squash || 0) - dt * 7); // springs back in ~140 ms
  s.rot = (s.rot || 0) + (s.spin || 0) * dt;

  const sy = soilYAt(s.x);
  if (s.y + s.r >= sy && s.vy > -40) {
    plantSeed(s);
    return false;
  }
  return true;
}


function makePlant(sp, x, growMult) {
  const row = rowFor(sp);
  let px = clamp(x, 16, W - 16);
  // portrait spacing: never stack two plants of a row on the same spot
  for (let i = 0; i < plants.length; i++) {
    const q = plants[i];
    if (plantRow(q) !== row || q.retire != null) continue;
    const dx = px - q.x;
    if (Math.abs(dx) < 30) px = clamp(q.x + (dx >= 0 ? 30 : -30), 16, W - 16);
  }
  return {
    sp: sp, x: px, row: row, yOff: rand(0, 4),
    t: 0, dur: rand(1.9, 2.15) * (growMult || 1), // v5 — the unfurl IS the show: ~2 s staged growth
    bornAt: performance.now(),
    phase: rand(0, Math.PI * 2), variant: Math.random(),
    bloomed: false, popped: false, frozen: false, round: ROUND, scale: 1,
    retire: null, gone: false
  };
}

function plantSeed(s) {
  const p = makePlant(s.sp, s.x, growBoost);
  growBoost = 1;
  plants.push(p);
  // v6 — a landing seed makes its neighbours lean away, briefly
  if (!REDUCED_MOTION) {
    for (let i = 0; i < plants.length; i++) {
      const q = plants[i];
      if (q === p) continue;
      const dx = q.x - s.x;
      if (Math.abs(dx) < 90) q.lean = (q.lean || 0) + (dx >= 0 ? 1 : -1) * 0.11 * (1 - Math.abs(dx) / 90);
    }
  }
  sndPock(s.x);
  sndShimmer(p.dur * 0.85);
  const sy = plantBaseY(p);
  for (let i = 0; i < pCount(9); i++) {
    particles.push({
      kind: 'soil', x: s.x, y: sy - 2,
      vx: rand(-55, 55), vy: rand(-95, -25),
      life: rand(0.35, 0.7), age: 0, r: rand(1.6, 3.6)
    });
  }
  updateHUD();
}

/* ================================================================
   PORTRAIT GARDEN CAP (v5) — the standing garden holds ~20 plants,
   composed like a bed: guide 5 back / 7 mid / 8 front. Past the cap
   the oldest plant in the fullest row retires — a slow 2.6 s fade
   while its ghost bakes into the silhouette layer. Never a pop-out,
   never a stop screen; dropping stays infinite.
   ================================================================ */
const GARDEN_CAP = 20;
const ROW_GUIDE = [5, 7, 8];
function enforceCap() {
  const standing = plants.filter(function (p) { return p.retire == null && !p.frozen; });
  if (standing.length <= GARDEN_CAP) return;
  const counts = [0, 0, 0];
  standing.forEach(function (p) { counts[plantRow(p)]++; });
  let row = 0, worst = -1;
  for (let r = 0; r < 3; r++) {
    const ratio = counts[r] / ROW_GUIDE[r];
    if (ratio > worst) { worst = ratio; row = r; }
  }
  const inRow = standing.filter(function (p) { return plantRow(p) === row; })
    .sort(function (a, b) { return a.bornAt - b.bornAt; });
  const victim = inRow.find(function (p) { return p.bloomed; }) || inRow[0];
  if (victim) victim.retire = 0;
}

function updatePlant(p, dt) {
  if (p.lean) p.lean *= Math.pow(0.32, dt); // landing lean relaxes over ~0.6 s
  if (p.retire != null && !p.frozen) {
    p.retire += dt / 2.6;
    if (p.retire >= 1 && !p.gone) { bakePlant(p); p.gone = true; }
  }
  if (p.frozen || p.t >= 1) return;
  const prevT = p.t;
  p.t = Math.min(1, p.t + dt / p.dur);
  // v6 — each leaf unfurls with a tiny rustle tick (stages match the painters)
  if (!REDUCED_MOTION) {
    const stages = [0.36, 0.5, 0.64];
    for (let li = 0; li < 3; li++) {
      if (prevT < stages[li] && p.t >= stages[li]) sndRustle(p.x);
    }
  }
  if (p.t > 0.8 && !p.popped && p.sp.form !== 'blade') {
    p.popped = true; sndPop(); sndRustle(p.x); // v6 — the petal-open tick
  }
  if (p.t >= 1 && !p.bloomed) {
    p.bloomed = true;
    blooms++; totalBlooms++;
    sessionSpecies[p.sp.id] = true;
    const earned = TIER_POLLEN[p.sp.tier];
    save.pollen += earned;
    sessionPollen += earned;
    save.journal[p.sp.id] = (save.journal[p.sp.id] || 0) + 1;
    if (totalBlooms > (save.best || 0)) save.best = totalBlooms;
    persist();
    sndChime(p.sp.tier === 2);
    const topY = plantBaseY(p) - 155 * plantScaleOf(p) * p.sp.h;
    floaters.push({ x: p.x, y: topY, text: '+' + earned + ' ❀', age: 0, life: 1.5 });
    for (let i = 0; i < pCount(p.sp.tier === 2 ? 15 : 8); i++) {
      particles.push({
        kind: p.sp.glow ? 'glowmote' : 'pollen', col: p.sp.glow,
        x: p.x + rand(-9, 9), y: plantBaseY(p) - 60 * plantScaleOf(p),
        vx: rand(-24, 24), vy: rand(-48, -8),
        life: rand(0.7, 1.6), age: 0, r: rand(1.2, 2.6)
      });
    }
    // (the 20-plant portrait cap is enforced gently in the frame loop)
    updateHUD();
  }
  // cherry blossom sheds the odd petal once in bloom
  if (p.bloomed && p.sp.id === 'sakura' && Math.random() < dt * 0.8) {
    particles.push({
      kind: 'glowmote', col: '#f2a9c4',
      x: p.x + rand(-26, 26), y: plantBaseY(p) - rand(60, 120) * plantScaleOf(p),
      vx: rand(-9, 4), vy: rand(7, 16),
      life: rand(1.4, 2.4), age: 0, r: rand(1.8, 3)
    });
  }
}

/* ================================================================
   INPUT — drag to aim, release to drop (touch-native)
   ================================================================ */
let ptrDownAt = 0;
let ptrMode = 'aim'; // 'aim' = drop gesture · 'walk' = meadow-band drag steering the gardener
function aimTo(clientX) {
  dropperX = clamp(clientX, L.seedR + 10, W - L.seedR - 10);
}
function inMeadowBand(y) { return started && L && y >= L.meadowTop - 6; }
canvas.addEventListener('pointermove', function (e) {
  if (ptrMode === 'walk' && ptrDownAt) gardener.targetX = e.clientX;
  else aimTo(e.clientX);
});
canvas.addEventListener('pointerdown', function (e) {
  initAudio();
  ptrDownAt = performance.now();
  if (inMeadowBand(e.clientY)) {
    ptrMode = 'walk';
    gardener.targetX = e.clientX;
  } else {
    ptrMode = 'aim';
    aimTo(e.clientX);
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointerup', function (e) {
  if (ptrMode === 'walk') {
    gardener.targetX = null;
  } else {
    aimTo(e.clientX);
    if (ptrDownAt) dropSeed();
  }
  ptrDownAt = 0;
  ptrMode = 'aim';
});
canvas.addEventListener('pointercancel', function () { ptrDownAt = 0; ptrMode = 'aim'; gardener.targetX = null; });
window.addEventListener('keydown', function (e) {
  keysDown[e.code] = true;
  if (e.code === 'ArrowLeft') { e.preventDefault(); dropperX = clamp(dropperX - 18, L.seedR + 10, W - L.seedR - 10); }
  if (e.code === 'ArrowRight') { e.preventDefault(); dropperX = clamp(dropperX + 18, L.seedR + 10, W - L.seedR - 10); }
  if (e.code === 'Space') { e.preventDefault(); initAudio(); dropSeed(); }
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
window.addEventListener('keyup', function (e) { keysDown[e.code] = false; });

/* ================================================================
   UI — HUD, seed packets, journal
   ================================================================ */
const el = {
  hud: document.getElementById('hud'),
  seeds: document.getElementById('seedPill'),
  sky: document.getElementById('skyPill'),
  pollen: document.getElementById('pollenPill'),
  fill: document.getElementById('meterFill'),
  meterLabel: document.getElementById('meterLabel'),
  title: document.getElementById('titleScreen'),
  mute: document.getElementById('muteBtn'),
  picker: document.getElementById('picker'),
  packets: document.getElementById('packets'),
  journal: document.getElementById('journal'),
  journalGrid: document.getElementById('journalGrid'),
  journalSub: document.getElementById('journalSub')
};

function gardenPct() {
  // v3 — endless garden: the meter reads how fully grown the standing
  // garden is (mean growth across every plant currently in the soil).
  if (!plants.length) return 0;
  let sum = 0;
  for (let i = 0; i < plants.length; i++) sum += plants[i].t;
  return clamp(Math.round(100 * sum / plants.length), 0, 100);
}
function updateHUD() {
  el.seeds.textContent = '🌱 ∞';
  el.pollen.textContent = '❀ ' + save.pollen;
  const pct = gardenPct();
  el.fill.style.width = pct + '%';
  el.meterLabel.textContent = 'GARDEN ' + pct + '%';
}
function toggleMute() {
  muted = !muted;
  save.muted = muted;
  persist();
  el.mute.textContent = muted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.85;
}
el.mute.textContent = muted ? '🔇' : '🔊';
el.mute.addEventListener('click', function (e) { e.stopPropagation(); initAudio(); toggleMute(); });
el.mute.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

function selectRandom() {
  randomMode = true;
  if (save.sel !== 'random') { save.sel = 'random'; persist(); }
  rollNext();
  const kids = el.packets.children;
  for (let i = 0; i < kids.length; i++) {
    kids[i].classList.toggle('sel', kids[i].getAttribute('data-id') === 'random');
  }
  const sel = el.packets.querySelector('.packet.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
}

function selectSpecies(id, silent) {
  const sp = SPECIES_BY_ID[id];
  if (!sp) return;
  // v3 — nothing locked, nothing to buy: selecting a packet just selects it
  randomMode = false;
  selectedId = id;
  if (save.sel !== id) { save.sel = id; persist(); }
  const kids = el.packets.children;
  for (let i = 0; i < kids.length; i++) {
    kids[i].classList.toggle('sel', kids[i].getAttribute('data-id') === id);
  }
  if (!silent) {
    const sel = el.packets.querySelector('.packet.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }
}

function buildPackets() {
  el.packets.innerHTML = '';
  // "Surprise me" — the default packet: a fresh random species every drop
  const rd = document.createElement('div');
  rd.className = 'packet random' + (randomMode ? ' sel' : '');
  rd.setAttribute('data-id', 'random');
  rd.innerHTML = '<div class="dice">🎲</div><span class="pname">Surprise Me</span><span class="pcost">✦ random seed</span>';
  rd.addEventListener('pointerdown', function (e) { e.stopPropagation(); initAudio(); });
  rd.addEventListener('click', function () { selectRandom(); });
  el.packets.appendChild(rd);
  ACTIVE_SPECIES.forEach(function (sp) {
    const d = document.createElement('div');
    d.className = 'packet' + (!randomMode && sp.id === selectedId ? ' sel' : '');
    d.setAttribute('data-id', sp.id);
    let inner = '<img alt="" src="' + makeThumb(sp) + '"><span class="pname">' + sp.name + '</span>';
    if (sp.tier === 2) inner += '<span class="pcost">✦ luminous</span>';
    else if (sp.tier === 1) inner += '<span class="pcost">✿ rare</span>';
    d.innerHTML = inner;
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); initAudio(); });
    d.addEventListener('click', function () { selectSpecies(sp.id); });
    el.packets.appendChild(d);
  });
  if (randomMode) rollNext(); // queue a fresh surprise
}

function buildJournal() {
  el.journalGrid.innerHTML = '';
  let discovered = 0;
  ACTIVE_SPECIES.forEach(function (sp) {
    const count = save.journal[sp.id] || 0;
    if (count > 0) discovered++;
    const d = document.createElement('div');
    d.className = 'jcell' + (count > 0 ? '' : ' undisc');
    d.innerHTML = '<img alt="" src="' + makeThumb(sp) + '">' +
      '<div class="jname">' + (count > 0 ? sp.name : '· · · ? · · ·') + '</div>' +
      '<div class="jcount">' + (count > 0 ? 'grown × ' + count : (sp.tier === 2 ? 'luminous' : sp.tier === 1 ? 'rare' : 'common')) + '</div>';
    el.journalGrid.appendChild(d);
  });
  el.journalSub.textContent = discovered + ' of ' + ACTIVE_SPECIES.length + ' species discovered · ❀ ' + save.pollen + ' pollen banked';
}
function openJournal() { buildJournal(); el.journal.classList.remove('hidden'); }
function closeJournal() { el.journal.classList.add('hidden'); }
document.getElementById('journalBtn').addEventListener('click', function (e) { e.stopPropagation(); initAudio(); openJournal(); });
document.getElementById('journalBtn').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
document.getElementById('journalClose').addEventListener('click', closeJournal);

/* ================================================================
   SESSION FLOW (v3) — one endless session: it starts, and it never
   stops. No rounds, no satchel, no end screen.
   ================================================================ */
function startRound() {
  ROUND++;
  started = true;
  el.title.classList.add('hidden');
  el.hud.classList.remove('hidden');
  el.picker.classList.remove('hidden');
  buildPackets();
  resize();
  nextChirpAt = performance.now() / 1000 + rand(4, 8);
  updateHUD();
}
document.getElementById('startBtn').addEventListener('click', function () { initAudio(); startRound(); });

/* ================================================================
   DEPTH HAZE (v2) — a breath of golden air between the rows
   ================================================================ */
function drawDepthHaze(strength) {
  const y0 = L.soilBase - 14, y1 = H - L.pickerH;
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, 'rgba(' + hazeRGB() + ',' + strength + ')');
  g.addColorStop(1, 'rgba(' + hazeRGB() + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, y1 - y0);
}

function drawFallingPlant(p) {
  const k = clamp((p.fallAge || 0) / 0.75, 0, 1);
  const ang = (p.fallDir || 1) * (Math.PI / 2.15) * k * k; // tips slowly, then goes
  ctx.save();
  ctx.translate(p.x, plantBaseY(p));
  ctx.rotate(ang);
  if (k > 0.7) ctx.globalAlpha = 1 - (k - 0.7) / 0.3 * 0.7;
  drawPlantShape(ctx, p, 1.0, plantScaleOf(p));
  ctx.restore();
}

/* ================================================================
   THE GARDENER (v2) — a little hooded keeper with a scythe.
   Walks the meadow (arrows / A,D, or a meadow-band drag), and any
   established plant he passes gets snicked down: +1 ❀, a falling
   plant, a puff of petals. Sprouts below the bud stage are spared.
   ================================================================ */
const CHOP_REACH = 36, CHOP_MIN_T = 0.8, SWING_CD = 0.26;

function chopPlant(idx) {
  const p = plants[idx];
  plants.splice(idx, 1); // the slot is freed — chopped plants are never baked
  p.fallAge = 0;
  p.fallDir = (p.x >= gardener.x) ? 1 : -1; // tips away from him
  falling.push(p);
  gardener.swingT = 0;
  gardener.swingCd = SWING_CD;
  harvested++;
  save.harvested = (save.harvested || 0) + 1;
  save.pollen += 1;
  persist();
  sndSnick();
  const by = plantBaseY(p);
  for (let i = 0; i < 7; i++) {
    particles.push({
      kind: 'glowmote', col: p.sp.pal.p[1],
      x: p.x + rand(-8, 8), y: by - rand(8, 46) * plantScaleOf(p),
      vx: rand(-40, 40), vy: rand(-26, 30),
      life: rand(0.5, 1.0), age: 0, r: rand(1.4, 3)
    });
  }
  for (let i = 0; i < 4; i++) {
    particles.push({
      kind: 'soil', x: p.x + rand(-5, 5), y: by - 2,
      vx: rand(-45, 45), vy: rand(-70, -20),
      life: rand(0.3, 0.55), age: 0, r: rand(1.4, 3)
    });
  }
  updateHUD();
}

function updateGardener(dt) {
  if (!started || SAMPLE_MODE) return;
  let move = 0;
  if (keysDown['ArrowLeft'] || keysDown['KeyA']) move = -1;
  else if (keysDown['ArrowRight'] || keysDown['KeyD']) move = 1;
  else if (gardener.targetX != null) {
    const dx = gardener.targetX - gardener.x;
    if (Math.abs(dx) > 5) move = dx > 0 ? 1 : -1;
    else gardener.targetX = null;
  }
  gardener.moving = move !== 0;
  if (move !== 0) {
    gardener.dir = move;
    gardener.x = clamp(gardener.x + move * 185 * dt, 26, W - 26);
    gardener.walkPhase += dt * 11;
  }
  if (gardener.swingT < 1) gardener.swingT = Math.min(1, gardener.swingT + dt / 0.24);
  gardener.swingCd -= dt;
  if (gardener.swingCd <= 0) {
    const reach = CHOP_REACH * L.plantScale + 8;
    for (let i = 0; i < plants.length; i++) {
      const p = plants[i];
      if (p.t >= CHOP_MIN_T && Math.abs(p.x - gardener.x) <= reach) { chopPlant(i); break; }
    }
  }
  for (let i = falling.length - 1; i >= 0; i--) {
    falling[i].fallAge += dt;
    if (falling[i].fallAge > 0.75) falling.splice(i, 1);
  }
}

/* the gardener, code-drawn in the game's own painted shapes.
   Unit space: feet at y=0, faces +x (flipped by gardener.dir). */
function drawGardener(now) {
  if (!started || SAMPLE_MODE) return;
  const g = gardener;
  const S = L.plantScale;
  const baseY = soilYAt(g.x) + ROW_BASE[2] + 7;
  const bob = g.moving ? Math.abs(Math.sin(g.walkPhase)) * 2.4 : Math.sin(now * 1.6) * 0.6;
  const lp = g.moving ? Math.sin(g.walkPhase) * 4.6 : 0; // leg shuffle
  ctx.save();
  ctx.translate(g.x, baseY);
  // soft ground shadow (stays on the ground while he bobs)
  ctx.fillStyle = 'rgba(40,26,8,.22)';
  ctx.beginPath(); ctx.ellipse(0, 3, 13 * S, 3.6 * S, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(0, -bob * S);
  ctx.scale(g.dir * S, S);

  // legs + boots
  ctx.strokeStyle = '#5e4630'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2.5, -13); ctx.lineTo(-3.5 + lp, -2.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2.5, -13); ctx.lineTo(3.5 - lp, -2.5); ctx.stroke();
  ctx.fillStyle = '#3c2a18';
  ctx.beginPath(); ctx.ellipse(-3.5 + lp, -1.6, 3.6, 2.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3.5 - lp, -1.6, 3.6, 2.1, 0, 0, Math.PI * 2); ctx.fill();

  // tunic — a russet trapezoid with a belt
  const tg = ctx.createLinearGradient(0, -32, 0, -10);
  tg.addColorStop(0, '#c07a42'); tg.addColorStop(1, '#8a4f28');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-7.5, -31); ctx.lineTo(7.5, -31);
  ctx.quadraticCurveTo(10.5, -18, 10, -11.5);
  ctx.lineTo(-10, -11.5);
  ctx.quadraticCurveTo(-10.5, -18, -7.5, -31);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5e3a1e';
  ctx.fillRect(-9.6, -17.5, 19.2, 2.8);
  ctx.fillStyle = '#ffd968';
  ctx.fillRect(1.5, -17.5, 3.4, 2.8);

  // the scythe arm + scythe (swings around the hands when he chops)
  const swing = g.swingT < 1 ? -Math.sin(g.swingT * Math.PI) * 1.55 : 0;
  ctx.save();
  ctx.translate(5, -23);
  ctx.rotate(-0.42 + swing + Math.sin(now * 1.6) * 0.03);
  // arm to the snath
  ctx.strokeStyle = '#b06a3a'; ctx.lineWidth = 3.6;
  ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(4, -3); ctx.stroke();
  // snath (the long curved handle)
  ctx.strokeStyle = '#7a5c33'; ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.moveTo(-7, 9); ctx.quadraticCurveTo(4, -4, 15, -17); ctx.stroke();
  // blade — a silver crescent at the top
  const bg = ctx.createLinearGradient(13, -22, 34, -12);
  bg.addColorStop(0, '#e8eef4'); bg.addColorStop(1, '#93a3b1');
  ctx.strokeStyle = bg; ctx.lineWidth = 3.1;
  ctx.beginPath(); ctx.moveTo(14.5, -18.5); ctx.quadraticCurveTo(26, -24.5, 35, -16.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(15.5, -17.6); ctx.quadraticCurveTo(26, -23.2, 33.8, -15.9); ctx.stroke();
  ctx.restore();

  // head — a warm face in the hood's shadow
  ctx.fillStyle = '#f2c894';
  ctx.beginPath(); ctx.arc(1.5, -36.5, 6.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(90,50,20,.28)';
  ctx.beginPath(); ctx.arc(-0.5, -38.5, 6.2, 0, -2.6, -0.4); ctx.lineTo(-0.5, -38.5); ctx.fill();
  ctx.fillStyle = '#2e2118';
  ctx.beginPath(); ctx.arc(5.2, -36.5, 0.95, 0, Math.PI * 2); ctx.fill();

  // hood — deep green, with a little leaf sprig tucked in
  const hg = ctx.createLinearGradient(0, -48, 0, -28);
  hg.addColorStop(0, '#5d8a63'); hg.addColorStop(1, '#33543c');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(-8.5, -29.5);
  ctx.quadraticCurveTo(-11.5, -45, 0.5, -47.5);
  ctx.quadraticCurveTo(12, -45.5, 9.5, -30.5);
  ctx.quadraticCurveTo(3, -35.5, -1.5, -34.5);
  ctx.quadraticCurveTo(-6.5, -33.5, -8.5, -29.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,200,.30)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-8.5, -29.5);
  ctx.quadraticCurveTo(-11.5, -45, 0.5, -47.5);
  ctx.quadraticCurveTo(12, -45.5, 9.5, -30.5);
  ctx.stroke();
  leafShape(ctx, -7.5, -43, 7.5, 2.8, 2.55, '#7fae5a', '#4d7c3a');
  ctx.restore();
}

/* ================================================================
   DROPPER + MAIN LOOP
   ================================================================ */
function drawDropper(now) {
  if (!started) return;
  const sp = dropSpecies();
  const x = dropperX, y = L.dropY;
  ctx.fillStyle = 'rgba(255,250,220,.4)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(x, y + 17 + i * 11 + Math.sin(now * 4 + i) * 1.5, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // selection halo in the species' accent
  ctx.strokeStyle = rgba(sp.pal.p[0], 0.65);
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, L.seedR + 5.5 + Math.sin(now * 2.6) * 1.2, 0, Math.PI * 2); ctx.stroke();
  // leaf chute
  ctx.fillStyle = '#5d9c48';
  ctx.beginPath();
  ctx.moveTo(x - 17, y - 13);
  ctx.quadraticCurveTo(x, y - 24 - Math.sin(now * 2.2) * 1.6, x + 17, y - 13);
  ctx.quadraticCurveTo(x, y - 6, x - 17, y - 13);
  ctx.fill();
  drawSeedShape(x, y, L.seedR, sp);
  // name tag — in random mode this is the rolled surprise, shown before you drop it
  const label = (randomMode ? '🎲 ' : '') + sp.name;
  ctx.font = '600 12px Georgia, serif';
  ctx.textAlign = 'center';
  const lw = ctx.measureText(label).width + 18;
  const ly = y + L.seedR + 16;
  ctx.fillStyle = 'rgba(43,30,14,.74)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - lw / 2, ly - 10, lw, 19, 9); else ctx.rect(x - lw / 2, ly - 10, lw, 19);
  ctx.fill();
  ctx.fillStyle = '#ffe9b0';
  ctx.fillText(label, x, ly + 3.5);
  ctx.textAlign = 'left';
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000;
  let dt = Math.min(0.033, now - (lastTs || now));
  lastTs = now;
  if (dt <= 0) dt = 0.016;

  updateSky(dt);
  updateWind(dt);
  updateAmbience(now);

  for (let sIdx = seeds.length - 1; sIdx >= 0; sIdx--) {
    if (!stepSeed(seeds[sIdx], dt)) seeds.splice(sIdx, 1); // v6 — substeps live inside stepSeed now
  }
  for (let i = 0; i < plants.length; i++) updatePlant(plants[i], dt);
  enforceCap();
  if (plants.some(function (p) { return p.gone; })) plants = plants.filter(function (p) { return !p.gone; });
  updateGardener(dt);
  for (let i = 0; i < L.pegs.length; i++) {
    if (L.pegs[i].flash > 0) L.pegs[i].flash = Math.max(0, L.pegs[i].flash - dt * 3.2);
    if (L.pegs[i].wob > 0) L.pegs[i].wob = Math.max(0, L.pegs[i].wob - dt * 4.5);
  }

  if (started && !muted && AC && now > nextChirpAt) {
    if (ambLabel() === 'birds') sndChirp();
    nextChirpAt = now + rand(9, 20);
  }
  if (started && !muted && AC) {
    if (rainAmt > 0.35 && now > nextDropAt) { sndDroplet(); nextDropAt = now + rand(0.4, 1.6) / Math.max(0.4, rainAmt); }
    if (palNow.night > 0.6 && rainAmt < 0.25 && now > nextCricketAt) { sndCricket(); nextCricketAt = now + rand(1.6, 4.2); }
  }
  ctx.clearRect(0, 0, W, H);
  drawBackground(now);
  drawBoard(now);
  drawDewRipples(dt);
  drawMeadow();
  if (bakedGarden) ctx.drawImage(bakedGarden, 0, 0, W, H);
  // depth rows (v2): strictly back → mid → front, with a haze of golden
  // air between rows — a short plant in front can never be hidden
  for (let rI = 0; rI < 3; rI++) {
    const rowPlants = plants.filter(function (p) { return plantRow(p) === rI; })
      .sort(function (a, b) { return (a.yOff || 0) - (b.yOff || 0); });
    for (let i = 0; i < rowPlants.length; i++) drawPlant(rowPlants[i], now);
    for (let i = 0; i < falling.length; i++) if (plantRow(falling[i]) === rI) drawFallingPlant(falling[i]);
    if (rI === 0) drawDepthHaze(0.13);
    else if (rI === 1) drawDepthHaze(0.06);
  }
  drawGardener(now);
  for (let i = 0; i < seeds.length; i++) drawSeed(seeds[i]); // v6 — shadow + spin + squash
  drawParticles(dt);
  drawDropper(now);
  drawForegroundGrass(now)
  drawRain(now);
  drawFog(now);
  drawNightLights(now);
  drawVignette();
  const chipTxt = fmtClock(clockH) + ' ' + condIcon();
  if (chipTxt !== lastChip) { lastChip = chipTxt; if (el.sky) el.sky.textContent = chipTxt; }
  if (SAMPLE_MODE === 'sheet') drawSampleLabels();
}
resize();
dropperX = W / 2;
buildPackets();
updateHUD();

/* ================================================================
   SAMPLE MODE (art checkpoint) — ?sample=sheet | ?sample=grow&sp=rose&stage=0.6
   ================================================================ */
const SAMPLE_Q = new URLSearchParams(location.search);
const SAMPLE_MODE = SAMPLE_Q.get('sample');
function samplePlant(sp, x, t, scale) {
  const p = makePlant(sp, x, 1);
  p.t = t; p.frozen = true; p.scale = scale; p.yOff = 4;
  p.bloomed = t >= 1; p.popped = true;
  plants.push(p);
  return p;
}
function drawSampleLabels() {
  ctx.textAlign = 'center';
  for (let i = 0; i < plants.length; i++) {
    const p = plants[i];
    const label = p.sp.name;
    ctx.font = '600 13.5px Georgia, serif';
    const wdt = ctx.measureText(label).width + 20;
    const ly = plantBaseY(p) + 28;
    ctx.fillStyle = 'rgba(43,30,14,.78)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x - wdt / 2, ly - 13, wdt, 21, 10); else ctx.rect(p.x - wdt / 2, ly - 13, wdt, 21);
    ctx.fill();
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText(label, p.x, ly + 2);
  }
  ctx.textAlign = 'left';
}
if (SAMPLE_MODE) {
  started = true;
  document.body.style.background = '#3a2812'; // reserved picker strip reads as soil in captures
  el.title.classList.add('hidden');
  el.hud.classList.add('hidden');
  el.picker.classList.add('hidden');
  resize();
  if (SAMPLE_MODE === 'sheet') {
    const ids = ['rosered', 'lotus', 'sunflower', 'sakura', 'glowshroom', 'wisteria'];
    for (let i = 0; i < ids.length; i++) {
      samplePlant(SPECIES_BY_ID[ids[i]], W * (i + 0.5) / ids.length, 1, 1.5);
    }
  } else if (SAMPLE_MODE === 'grow') {
    const sp = SPECIES_BY_ID[SAMPLE_Q.get('sp') || 'rosered'] || SPECIES_BY_ID.rosered;
    const stage = parseFloat(SAMPLE_Q.get('stage') || '1');
    samplePlant(sp, W / 2, clamp(stage, 0, 1), 2.05);
  }
}

/* ================================================================
   TEST HOOK
   ================================================================ */
window.__planko = {
  drop: function () { dropSeed(); },
  aim: function (x) { aimTo(x); },
  start: function () { if (!started) startRound(); },
  select: function (id) { if (id === 'random') selectRandom(); else selectSpecies(id, true); },
  plantNow: function (id, x, growMult) {
    const sp = SPECIES_BY_ID[id];
    if (!sp || !started) return false;
    const p = makePlant(sp, (x == null ? dropperX : x), growMult || 1);
    plants.push(p);
    return true;
  },
  setCineGrow: function (m) { growBoost = m || 1; },
  walkTo: function (x) { gardener.targetX = x; },
  gardener: function () {
    return { x: Math.round(gardener.x), dir: gardener.dir, moving: gardener.moving, swinging: gardener.swingT < 1 };
  },
  plantRows: function () {
    return plants.map(function (p) { return { id: p.sp.id, row: plantRow(p), x: Math.round(p.x), t: Math.round(p.t * 100) / 100, dur: Math.round(p.dur * 100) / 100, bornAt: Math.round(p.bornAt || 0) }; });
  },
  cycle: {
    hour: function () { return Math.round(clockH * 100) / 100; },
    weather: function () { return wxState; },
    audio: function () { return ambLabel(); },
    setHour: function (h) { clockH = ((h % 24) + 24) % 24; palNow = paletteAt(clockH); },
    setWeather: function (w) { setWx(w, true); }
  },
  audioGraph: function () { // v6 — proves the room exists at runtime
    if (!AC) return null;
    ensureFx();
    return {
      convolver: fx.conv.constructor.name,
      delay: fx.dL.constructor.name,
      delayR: fx.dR.constructor.name,
      lastPan: lastPanValue,
      state: AC.state
    };
  },
  voiceHits: function () { return { dew: voiceHits.dew, stone: voiceHits.stone, firefly: voiceHits.firefly }; },
  hitPeg: function (kind, x) { // v6 — fire one peg voice of a kind at a screen x (tests)
    if (!AC) return false;
    sndPlink(0.5, 0.85, kind || 'stone', x == null ? W / 2 : x);
    return true;
  },
  get reducedMotion() { return REDUCED_MOTION; },
  get wind() { return Math.round(windV * 100) / 100; },
  get layoutY() { return L ? { soilBase: Math.round(L.soilBase), meadowTop: Math.round(L.meadowTop), pickerH: Math.round(L.pickerH), H: H, W: W } : null; },
  get grown() { return totalBlooms; },
  speciesTotal: ACTIVE_SPECIES.length,
  grownSpecies: function () { return Object.keys(sessionSpecies); },
  get state() {
    return {
      started: started, endless: true,
      inFlight: seeds.length, plants: plants.length, blooms: blooms,
      totalBlooms: totalBlooms, pollen: save.pollen,
      selected: selectedId, mode: randomMode ? 'random' : 'chosen', next: nextId,
      harvested: harvested, journal: Object.keys(save.journal).length,
      standing: plants.filter(function (p) { return p.retire == null; }).length,
      retiring: plants.filter(function (p) { return p.retire != null; }).length,
      baked: bakedTotal
    };
  }
};

requestAnimationFrame(frame);
</script>
