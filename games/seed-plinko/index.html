    ctx.lineTo(x, L.meadowTop - 10 - Math.sin(x * 0.008 + 0.4) * 10);
  }
  ctx.lineTo(W, L.soilBase + 34); ctx.closePath(); ctx.fill();

  // drifting pollen motes in the light
  for (let i = 0; i < motes.length; i++) {
    const m = motes[i];
    m.y -= m.sp * 0.016; if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
    const mx = ((m.x + Math.sin(now * 0.24 + m.ph) * 0.008) % 1) * W;
    const my = m.y * L.meadowTop;
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * 1.4 + m.ph * 3));
    ctx.fillStyle = 'rgba(255,244,196,' + (0.5 * tw) + ')';
    ctx.beginPath(); ctx.arc(mx, my, m.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBoard(now) {
  // living vine rails
  const railG = ctx.createLinearGradient(0, L.boardTop, 0, L.boardBot);
  railG.addColorStop(0, '#6d5136'); railG.addColorStop(1, '#4c3a22');
  ctx.fillStyle = railG;
  ctx.fillRect(0, L.boardTop - 10, 8, L.boardBot - L.boardTop + 12);
  ctx.fillRect(W - 8, L.boardTop - 10, 8, L.boardBot - L.boardTop + 12);
  ctx.fillStyle = '#7fa348';
  for (let i = 0; i < 7; i++) {
    const y = L.boardTop + 8 + i * ((L.boardBot - L.boardTop) / 7);
    ctx.beginPath(); ctx.ellipse(10, y, 5.5, 2.8, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W - 10, y + 9, 5.5, 2.8, -0.5, 0, Math.PI * 2); ctx.fill();
  }

  // reed dividers
  for (let i = 0; i < L.dividers.length; i++) {
    const d = L.dividers[i];
    const bend = Math.sin(now * 1.1 + d.sway) * 2.6;
    ctx.strokeStyle = '#5d8440';
    ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(d.x, d.y1);
    ctx.quadraticCurveTo(d.x + bend * 0.4, (d.y0 + d.y1) / 2, d.x + bend, d.y0);
    ctx.stroke();
    ctx.fillStyle = '#7a5c33';
    ctx.beginPath(); ctx.ellipse(d.x + bend, d.y0 - 3, 3.2, 5.2, bend * 0.05, 0, Math.PI * 2); ctx.fill();
  }

  // pegs — dew drops, river stones, and a few fireflies
  for (let i = 0; i < L.pegs.length; i++) {
    const p = L.pegs[i], r = L.pegR;
    ctx.fillStyle = 'rgba(60,40,16,.25)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + r * 0.9, r * 1.15, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    if (p.kind === 'dew') {
      const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.4, r * 0.15, p.x, p.y, r * 1.25);
      g.addColorStop(0, 'rgba(255,255,255,.98)');
      g.addColorStop(0.45, 'rgba(197,226,244,.88)');
      g.addColorStop(1, 'rgba(127,176,214,.82)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath(); ctx.arc(p.x - r * 0.38, p.y - r * 0.42, r * 0.30, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'stone') {
      const g = ctx.createLinearGradient(p.x, p.y - r, p.x, p.y + r);
      g.addColorStop(0, '#a9a9b8'); g.addColorStop(1, '#74748a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 1.5, r * 1.05, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.ellipse(p.x - r * 0.4, p.y - r * 0.35, r * 0.55, r * 0.28, -0.4, 0, Math.PI * 2); ctx.fill();
    } else { // firefly stone
      const pulse = 0.55 + 0.45 * Math.sin(now * 2.1 + p.seed * 40);
      const g = ctx.createRadialGradient(p.x, p.y, 0.5, p.x, p.y, r * 3.4);
      g.addColorStop(0, 'rgba(255,232,138,' + (0.75 * pulse) + ')');
      g.addColorStop(1, 'rgba(255,232,138,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a8574';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 1.25, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffedb0';
      ctx.beginPath(); ctx.arc(p.x, p.y - r * 0.3, r * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    if (p.flash > 0.01) {
      ctx.strokeStyle = 'rgba(255,246,200,' + (p.flash * 0.8) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * (1.6 + (1 - p.flash) * 1.6), 0, Math.PI * 2); ctx.stroke();
    }
  }
}

function drawMeadow() {
  // soil band
  const st = ctx.createLinearGradient(0, L.soilBase - 8, 0, H);
  st.addColorStop(0, '#77562f');
  st.addColorStop(0.25, '#63452a');
  st.addColorStop(1, '#453019');
  ctx.fillStyle = st;
  ctx.fillRect(0, L.soilBase - 6, W, H - L.soilBase + 6);
  // soft mounded top edge
  ctx.fillStyle = '#86643a';
  ctx.beginPath();
  ctx.moveTo(0, L.soilBase + 4);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, soilYAt(x) - 3.5);
  ctx.lineTo(W, L.soilBase + 5); ctx.closePath(); ctx.fill();
  // depth terraces (v2) — a soft ridge of light at each garden row's baseline,
  // with a shading trough beneath, so the three rows read as ground receding
  for (let ri = 0; ri < 3; ri++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const y = soilYAt(x) + ROW_BASE[ri] + 5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = ri === 2 ? 'rgba(255,232,170,.14)' : 'rgba(43,26,8,.15)';
    ctx.lineWidth = ri === 2 ? 2.4 : 3.4;
    ctx.stroke();
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const y = soilYAt(x) + ROW_BASE[ri] + 11;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(30,17,4,.10)';
    ctx.lineWidth = 5;
    ctx.stroke();
  }
  // warm atmospheric wash over the back of the bed
  const wash = ctx.createLinearGradient(0, L.soilBase - 10, 0, L.soilBase + 30);
  wash.addColorStop(0, 'rgba(255,205,140,.10)');
  wash.addColorStop(1, 'rgba(255,205,140,0)');
  ctx.fillStyle = wash;
  ctx.fillRect(0, L.soilBase - 10, W, 40);
  // speckles
  ctx.fillStyle = 'rgba(255,225,170,.10)';
  for (let i = 0; i < 46; i++) {
    const x = ((i * 97.3) % Math.max(10, W - 12)) + 6;
    const y = L.soilBase + 4 + ((i * 53.7) % Math.max(10, (H - L.pickerH) - L.soilBase - 8));
    ctx.fillRect(x, y, 2.2, 1.4);
  }
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  for (let i = 0; i < 30; i++) {
    const x = ((i * 131.7) % Math.max(10, W - 12)) + 6;
    const y = L.soilBase + 6 + ((i * 71.3) % Math.max(10, (H - L.pickerH) - L.soilBase - 10));
    ctx.fillRect(x, y, 2.6, 1.6);
  }
}

function drawForegroundGrass(now) {
  const baseY = H - L.pickerH + 2;
  ctx.fillStyle = 'rgba(46,74,28,.75)';
  for (let i = 0; i < 44; i++) {
    const x = ((i * 89.7) % Math.max(10, W - 8)) + 4;
    const hgt = 12 + (i % 5) * 4.5;
    const sway = Math.sin(now * 1.3 + i * 1.7) * 2.4;
    ctx.beginPath();
    ctx.moveTo(x - 1.8, baseY);
    ctx.quadraticCurveTo(x + sway * 0.4, baseY - hgt * 0.6, x + sway, baseY - hgt);
    ctx.quadraticCurveTo(x + sway * 0.4 + 1.2, baseY - hgt * 0.6, x + 1.8, baseY);
    ctx.closePath(); ctx.fill();
  }
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    const k = 1 - p.age / p.life;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'soil') {
      p.vy += 330 * dt;
      ctx.fillStyle = 'rgba(101,70,40,' + (0.85 * k) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'spark') {
      p.vy -= 24 * dt;
      ctx.fillStyle = 'rgba(255,220,110,' + (0.95 * k) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'glowmote') {
      p.vy -= 10 * dt; p.vx += Math.sin(p.age * 4 + p.r) * 7 * dt;
      ctx.fillStyle = rgba(p.col || '#ffe9a3', 0.8 * k);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.3, 0, Math.PI * 2); ctx.fill();
    } else { // pollen
      p.vy -= 7 * dt; p.vx += Math.sin(p.age * 5 + p.r) * 6 * dt;
      ctx.fillStyle = 'rgba(255,246,200,' + (0.75 * k) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.3, 0, Math.PI * 2); ctx.fill();
    }
  }
  // pollen floaters ("+5 ❀")
  ctx.textAlign = 'center';
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.age += dt;
    if (f.age >= f.life) { floaters.splice(i, 1); continue; }
    const k = 1 - f.age / f.life;
    ctx.font = '700 ' + Math.round(13 * L.plantScale + 3) + 'px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,217,104,' + (0.95 * k) + ')';
    ctx.fillText(f.text, f.x, f.y - f.age * 26);
  }
  ctx.textAlign = 'left';
}

/* ================================================================
   PLANT PAINTING — 16 forms, all procedural, all painted
   drawPlantShape(c, p, now, S): base at origin, grows upward.
   ================================================================ */
function petalPoint(c, x, y, len, wid, ang, fill) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = fill;
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.45, -wid, len, 0);
  c.quadraticCurveTo(len * 0.45, wid, 0, 0);
  c.fill();
  c.restore();
}
function petalRound(c, x, y, len, wid, ang, fill) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = fill;
  c.beginPath(); c.ellipse(len / 2, 0, len / 2, wid / 2, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}
function leafShape(c, x, y, len, wid, ang, colA, colB) {
  if (len <= 0.5) return;
  c.save(); c.translate(x, y); c.rotate(ang);
  const grd = c.createLinearGradient(0, 0, len, 0);
  grd.addColorStop(0, colA); grd.addColorStop(1, colB);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.5, -wid, len, 0);
  c.quadraticCurveTo(len * 0.5, wid, 0, 0);
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,.13)'; c.lineWidth = 0.8;
  c.beginPath(); c.moveTo(len * 0.1, 0); c.lineTo(len * 0.9, 0); c.stroke();
  c.restore();
}
function stemPath(c, x, topX, h, w, colA, colB) {
  if (h <= 1.5) return;
  const cx = x + topX * 0.25, cy = -h * 0.55;
  const grd = c.createLinearGradient(0, 0, 0, -h);
  grd.addColorStop(0, colB); grd.addColorStop(1, colA);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(x - w / 2, 0);
  c.quadraticCurveTo(cx - w * 0.30, cy, topX - w * 0.20, -h);
  c.lineTo(topX + w * 0.20, -h);
  c.quadraticCurveTo(cx + w * 0.30, cy, x + w / 2, 0);
  c.closePath(); c.fill();
}
function stemPoint(topX, h, f) {
  const cx = topX * 0.25, cy = -h * 0.55;
  const x = 2 * (1 - f) * f * cx + f * f * topX;
  const y = 2 * (1 - f) * f * cy + f * f * (-h);
  return [x, y];
}
function drawBud(c, x, y, k, sp, S) {
  const R = (13 * S + 1.5) * k;
  if (R <= 0.6) return;
  c.save(); c.translate(x, y);
  const grd = c.createLinearGradient(0, R * 0.6, 0, -R * 1.25);
  grd.addColorStop(0, mixHex(sp.pal.p[0], sp.pal.p[1], 0.15));
  grd.addColorStop(1, mixHex(sp.pal.p[0], sp.pal.p[1], 0.55));
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(0, -R * 1.3);
  c.quadraticCurveTo(R * 0.85, -R * 0.4, R * 0.62, R * 0.35);
  c.quadraticCurveTo(R * 0.4, R * 0.75, 0, R * 0.72);
  c.quadraticCurveTo(-R * 0.4, R * 0.75, -R * 0.62, R * 0.35);
  c.quadraticCurveTo(-R * 0.85, -R * 0.4, 0, -R * 1.3);
  c.fill();
  leafShape(c, -R * 0.2, R * 0.62, R * 0.95, R * 0.34, 2.65, sp.pal.l, sp.pal.s);
  leafShape(c, R * 0.2, R * 0.62, R * 0.95, R * 0.34, 0.5, sp.pal.s, sp.pal.l);
  c.restore();
}

/* ---------- flower heads (drawn at origin, radius R) ---------- */
function headRosette(c, sp, R, v, disc) {
  const pal = sp.pal, n = sp.petals || 13;
  const off = v * 2.2;
  for (let i = 0; i < n; i++) {
    petalRound(c, 0, 0, R * (disc ? 0.82 : 1.02), R * 0.36, off + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.22));
  }
  const n2 = Math.max(5, Math.round(n * 0.7));
  for (let i = 0; i < n2; i++) {
    petalRound(c, 0, 0, R * 0.66, R * 0.3, off + 0.24 + (i / n2) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.6));
  }
  c.fillStyle = pal.c;
  c.beginPath(); c.arc(0, 0, R * (disc ? 0.5 : 0.3), 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.c2 || pal.c;
  const dots = disc ? 12 : 6;
  for (let i = 0; i < dots; i++) {
    const a = i * 2.39 + v * 3, rr = R * (disc ? 0.13 + (i % 3) * 0.13 : 0.1 + (i % 2) * 0.08);
    c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr, R * 0.05, 0, Math.PI * 2); c.fill();
  }
}
function headPompom(c, sp, R, v) {
  const pal = sp.pal, total = sp.petals || 22;
  for (let ring = 0; ring < 3; ring++) {
    const n = Math.round(total * (1 - ring * 0.24));
    const len = R * (1.05 - ring * 0.27);
    for (let i = 0; i < n; i++) {
      petalPoint(c, 0, 0, len, R * 0.17, v * 2 + ring * 0.38 + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.18 + ring * 0.3));
    }
  }
  c.fillStyle = pal.a;
  c.beginPath(); c.arc(0, 0, R * 0.16, 0, Math.PI * 2); c.fill();
}
function headCluster(c, sp, R, v) {
  const pal = sp.pal;
  c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.3);
  c.globalAlpha = 0.55;
  c.beginPath(); c.arc(0, 0, R * 0.92, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
  for (let i = 0; i < 15; i++) {
    const h1 = hashStr(sp.id + 'f' + i), h2 = hashStr(sp.id + 'g' + i), h3 = hashStr(sp.id + 'h' + i);
    const a = h1 * Math.PI * 2, rr = Math.sqrt(h2) * R * 0.74;
    const fx = Math.cos(a) * rr, fy = Math.sin(a) * rr * 0.86;
    const fr = R * 0.21;
    const fill = mixHex(pal.p[0], pal.p[1], 0.25 + h3 * 0.6);
    for (let q = 0; q < 4; q++) {
      c.fillStyle = fill;
      c.beginPath(); c.arc(fx + Math.cos(q * 1.57 + h1) * fr * 0.55, fy + Math.sin(q * 1.57 + h1) * fr * 0.55, fr * 0.62, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = pal.c;
    c.beginPath(); c.arc(fx, fy, fr * 0.3, 0, Math.PI * 2); c.fill();
  }
}
function headCup(c, sp, R, v) {
  const pal = sp.pal;
  const grd = c.createLinearGradient(0, R * 0.7, 0, -R * 0.95);
  grd.addColorStop(0, pal.p[0]); grd.addColorStop(1, pal.p[1]);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(-R * 0.34, -R * 0.82);
  c.quadraticCurveTo(-R * 0.58, -R * 0.2, -R * 0.55, R * 0.28);
  c.quadraticCurveTo(-R * 0.5, R * 0.66, 0, R * 0.68);
  c.quadraticCurveTo(R * 0.5, R * 0.66, R * 0.55, R * 0.28);
  c.quadraticCurveTo(R * 0.58, -R * 0.2, R * 0.34, -R * 0.82);
  c.quadraticCurveTo(R * 0.14, -R * 0.38, 0, -R * 0.66);
  c.quadraticCurveTo(-R * 0.14, -R * 0.38, -R * 0.34, -R * 0.82);
  c.fill();
  c.fillStyle = 'rgba(255,255,255,.20)';
  c.beginPath();
  c.moveTo(-R * 0.3, -R * 0.6);
  c.quadraticCurveTo(-R * 0.38, 0, -R * 0.3, R * 0.45);
  c.quadraticCurveTo(-R * 0.14, R * 0.5, -R * 0.13, R * 0.1);
  c.quadraticCurveTo(-R * 0.16, -R * 0.3, -R * 0.3, -R * 0.6);
  c.fill();
  c.fillStyle = rgba(pal.p[0], 0.35);
  c.beginPath();
  c.moveTo(R * 0.3, -R * 0.6);
  c.quadraticCurveTo(R * 0.38, 0, R * 0.3, R * 0.45);
  c.quadraticCurveTo(R * 0.14, R * 0.5, R * 0.13, R * 0.1);
  c.quadraticCurveTo(R * 0.16, -R * 0.3, R * 0.3, -R * 0.6);
  c.fill();
}
function headLayered(c, sp, R, v) {
  const pal = sp.pal;
  const rings = [ { r: 0.98, n: 5, k: 0.08 }, { r: 0.74, n: 5, k: 0.3 }, { r: 0.5, n: 4, k: 0.52 }, { r: 0.28, n: 3, k: 0.72 } ];
  for (let ri = 0; ri < rings.length; ri++) {
    const ring = rings[ri];
    // shade pass — each petal casts a soft shadow on the ring beneath
    for (let i = 0; i < ring.n; i++) {
      const ang = v * 2 + ri * 0.55 + (i / ring.n) * Math.PI * 2;
      petalRound(c, 0, R * 0.07, R * ring.r * 1.06, R * ring.r * 0.66, ang, mixHex(pal.p[0], '#2a0510', 0.38));
    }
    for (let i = 0; i < ring.n; i++) {
      const ang = v * 2 + ri * 0.55 + (i / ring.n) * Math.PI * 2;
      petalRound(c, 0, 0, R * ring.r * 1.06, R * ring.r * 0.66, ang, mixHex(pal.p[0], pal.p[1], ring.k));
    }
  }
  c.strokeStyle = pal.c; c.lineWidth = Math.max(1.1, R * 0.07); c.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    c.beginPath();
    c.arc(0, 0, R * (0.17 - i * 0.045), v * 2 + i * 1.2, v * 2 + i * 1.2 + 4.2);
    c.stroke();
  }
}
function headCrown(c, sp, R, v) {
  const pal = sp.pal, n = sp.petals || 5;
  for (let i = 0; i < n; i++) {
    const lt = 0.22 + 0.18 * hashStr(sp.id + 'cp' + i);
    petalRound(c, 0, 0, R * 1.0, R * 0.74, v * 2 + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], lt));
  }
  for (let i = 0; i < n; i++) {
    petalRound(c, 0, 0, R * 0.62, R * 0.46, v * 2 + 0.4 + (i / n) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.55));
  }
  c.fillStyle = pal.c;
  c.beginPath(); c.arc(0, 0, R * 0.3, 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.a;
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + v;
    c.beginPath(); c.arc(Math.cos(a) * R * 0.4, Math.sin(a) * R * 0.4, R * 0.055, 0, Math.PI * 2); c.fill();
  }
}
function headTrumpet(c, sp, R, v) {
  const pal = sp.pal;
  for (let i = 0; i < 3; i++) {
    petalPoint(c, 0, 0, R * 1.3, R * 0.36, v * 2 + (i / 3) * Math.PI * 2 + 0.5, mixHex(pal.p[0], pal.p[1], 0.18));
  }
  for (let i = 0; i < 3; i++) {
    petalPoint(c, 0, 0, R * 1.42, R * 0.4, v * 2 + (i / 3) * Math.PI * 2, mixHex(pal.p[0], pal.p[1], 0.5));
  }
  c.strokeStyle = mixHex(pal.c, '#8a5a2b', 0.4); c.lineWidth = Math.max(1, R * 0.05); c.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const a = v * 2 + (i / 5) * Math.PI * 2;
    const ex = Math.cos(a) * R * 0.66, ey = Math.sin(a) * R * 0.66;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(ex, ey); c.stroke();
    c.fillStyle = pal.c;
    c.beginPath(); c.ellipse(ex, ey, R * 0.1, R * 0.055, a, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = pal.a;
  c.beginPath(); c.arc(0, 0, R * 0.13, 0, Math.PI * 2); c.fill();
}
function headStar(c, sp, R, v) {
  const pal = sp.pal;
  // falls (drooping lower petals)
  for (let i = -1; i <= 1; i++) {
    petalPoint(c, 0, 0, R * 1.1, R * 0.42, Math.PI / 2 + i * 0.62 + v, mixHex(pal.p[0], pal.p[1], 0.15));
  }
  // standards (upright)
  for (let i = -1; i <= 1; i++) {
    petalRound(c, 0, 0, R * 1.0, R * 0.44, -Math.PI / 2 + i * 0.55 + v, mixHex(pal.p[0], pal.p[1], 0.55));
  }
  c.fillStyle = pal.c;
  for (let i = 0; i < 4; i++) {
    c.beginPath(); c.arc(-R * 0.16 + i * R * 0.11, R * 0.18, R * 0.05, 0, Math.PI * 2); c.fill();
  }
}
function drawHead(c, sp, R, v) {
  switch (sp.form) {
    case 'rosette': headRosette(c, sp, R, v, false); break;
    case 'disc': headRosette(c, sp, R, v, true); break;
    case 'pompom': headPompom(c, sp, R, v); break;
    case 'cluster': headCluster(c, sp, R, v); break;
    case 'cup': headCup(c, sp, R, v); break;
    case 'layered': headLayered(c, sp, R, v); break;
    case 'crown': headCrown(c, sp, R, v); break;
    case 'trumpet': headTrumpet(c, sp, R, v); break;
    case 'star': headStar(c, sp, R, v); break;
  }
}

/* ---------- dedicated form painters ---------- */
function paintSpike(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, v = p.variant;
  const stems = 3 + Math.floor(v * 2);
  for (let i = 0; i < stems; i++) {
    const fx = (i - (stems - 1) / 2) * 9 * S;
    const h = K.HGT * K.stemK * (0.8 + 0.2 * Math.sin(i * 2.7 + p.phase));
    if (h < 4) continue;
    const topX = fx + Math.sin(K.sway * 3 + i) * h * 0.14;
    stemPath(c, fx * 0.4, topX, h, 1.9 * S, pal.s, mixHex(pal.s, '#000000', 0.2));
    if (K.budK > 0.03) {
      const buds = 6;
      for (let b = 0; b < buds; b++) {
        const bt = b / buds;
        const bx = topX + (bt - 0.5) * 2 * S, by = -h - bt * 13 * S * K.budK + 3 * S;
        const br = (2.6 - bt * 0.9) * S * K.budK + 0.4;
        c.fillStyle = mixHex(pal.p[0], pal.p[1], bt * 0.7);
        c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)';
        c.beginPath(); c.arc(bx - br * 0.3, by - br * 0.3, br * 0.32, 0, Math.PI * 2); c.fill();
      }
    }
    if (K.bloomK > 0.05) {
      c.fillStyle = pal.a;
      c.beginPath(); c.arc(topX, -h - 13 * S * K.budK, 1.8 * S * K.bloomK + 0.4, 0, Math.PI * 2); c.fill();
    }
  }
  leafShape(c, -2 * S, -2 * S, 26 * S * K.leafK, 4.5 * S, 2.95, pal.l, pal.s);
  leafShape(c, 2 * S, -2 * S, 22 * S * K.leafK, 4.5 * S, 0.2, pal.s, pal.l);
}
function paintBell(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  const P0 = [0, 0], C = [K.sway * 30 * S, -h * 0.6], P2 = [h * 0.30, -h * 0.94];
  c.strokeStyle = pal.s; c.lineWidth = 2.6 * S; c.lineCap = 'round';
  c.beginPath(); c.moveTo(P0[0], P0[1]); c.quadraticCurveTo(C[0], C[1], P2[0], P2[1]); c.stroke();
  leafShape(c, -2 * S, -2 * S, 30 * S * K.leafK, 6 * S, 2.9, pal.l, pal.s);
  leafShape(c, 2 * S, -3 * S, 24 * S * K.leafK, 5.5 * S, 0.25, pal.s, pal.l);
  const bells = 5;
  for (let i = 0; i < bells; i++) {
    const t = 0.52 + (i / (bells - 1)) * 0.48;
    const bx = 2 * (1 - t) * t * C[0] + t * t * P2[0];
    const by = 2 * (1 - t) * t * C[1] + t * t * P2[1];
    const bs = (1 - i * 0.1) * K.bloomK;
    if (bs <= 0.03) {
      if (K.budK > 0.1) {
        c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.3);
        c.beginPath(); c.arc(bx, by + 4 * S, 2.6 * S * K.budK, 0, Math.PI * 2); c.fill();
      }
      continue;
    }
    const bw = 7.2 * S * bs + 0.5, bh = 9.5 * S * bs + 0.5;
    c.strokeStyle = pal.s; c.lineWidth = 1.1 * S;
    c.beginPath(); c.moveTo(bx, by); c.lineTo(bx, by + 3 * S); c.stroke();
    const grd = c.createLinearGradient(0, by + 3 * S, 0, by + 3 * S + bh);
    grd.addColorStop(0, pal.p[1]); grd.addColorStop(1, pal.p[0]);
    c.fillStyle = grd;
    c.beginPath();
    c.moveTo(bx - bw * 0.32, by + 3 * S);
    c.quadraticCurveTo(bx - bw * 0.4, by + 3 * S + bh * 0.7, bx - bw * 0.62, by + 3 * S + bh);
    c.quadraticCurveTo(bx, by + 3 * S + bh * 1.12, bx + bw * 0.62, by + 3 * S + bh);
    c.quadraticCurveTo(bx + bw * 0.4, by + 3 * S + bh * 0.7, bx + bw * 0.32, by + 3 * S);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.28)';
    c.beginPath(); c.ellipse(bx, by + 3 * S + bh, bw * 0.55, bh * 0.1, 0, 0, Math.PI * 2); c.fill();
  }
}
function paintPlume(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  stemPath(c, 0, K.sway * h * 0.4, h, 3.6 * S, '#6d5136', '#4c3a22');
  const topX = K.sway * h * 0.4;
  c.strokeStyle = '#5e4630'; c.lineWidth = 2.6 * S; c.lineCap = 'round';
  c.beginPath(); c.moveTo(topX - 15 * S, -h); c.quadraticCurveTo(topX, -h - 4 * S, topX + 16 * S, -h + 1 * S); c.stroke();
  leafShape(c, topX - 6 * S, -h + 2 * S, 15 * S * K.leafK, 4 * S, 2.5, pal.l, '#4d7c3a');
  leafShape(c, topX + 6 * S, -h + 2 * S, 13 * S * K.leafK, 4 * S, 0.6, '#4d7c3a', pal.l);
  const racemes = 4;
  const grow = smooth(0.3, 1, p.t);
  for (let i = 0; i < racemes; i++) {
    const rx = topX + (i - (racemes - 1) / 2) * 9.5 * S;
    const len = K.HGT * (0.30 + 0.13 * hashStr(sp.id + 'r' + i)) * grow;
    if (len < 3) continue;
    const dots = Math.floor(len / (5.2 * S));
    for (let d = 0; d < dots; d++) {
      const dt2 = d / Math.max(1, dots - 1);
      const rr = (4.6 * S) * (1 - dt2 * 0.75) * (0.4 + 0.6 * K.budK);
      const yy = -h + 2 * S + dt2 * len;
      const xx = rx + Math.sin(dt2 * 4 + p.phase + i) * 1.4 * S;
      c.fillStyle = mixHex(pal.p[0], pal.p[1], dt2 * 0.75);
      c.beginPath(); c.arc(xx, yy, rr, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(255,255,255,.25)';
      c.beginPath(); c.arc(xx - rr * 0.3, yy - rr * 0.3, rr * 0.3, 0, Math.PI * 2); c.fill();
    }
  }
}
function paintPad(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, R = K.R;
  // dew pond
  const pond = c.createRadialGradient(0, 2 * S, 2, 0, 2 * S, R * 2.5);
  pond.addColorStop(0, 'rgba(140,195,215,.55)');
  pond.addColorStop(0.7, 'rgba(110,170,195,.28)');
  pond.addColorStop(1, 'rgba(110,170,195,0)');
  c.fillStyle = pond;
  c.beginPath(); c.ellipse(0, 2 * S, R * 2.5, R * 0.55, 0, 0, Math.PI * 2); c.fill();
  // lily pads
  const pads = [[-R * 1.15, 0.75, 0.62], [R * 1.2, 0.95, 0.85], [R * 0.25, 1.35, 0.5]];
  for (let i = 0; i < pads.length; i++) {
    const pd = pads[i], pk = K.leafK * pd[2];
    if (pk <= 0.03) continue;
    const px = pd[0] * pk, py = pd[1] * S, pr = R * 0.62 * pk;
    c.fillStyle = mixHex(pal.l, pal.s, 0.3 + i * 0.15);
    c.beginPath();
    c.moveTo(px, py);
    c.arc(px, py, pr, 0.5 + i, Math.PI * 2 - 0.55 + i);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;
    c.beginPath(); c.arc(px, py, pr * 0.94, 0.6 + i, Math.PI * 1.5 + i); c.stroke();
  }
  // flower stem + layered pointed petals
  const h = K.HGT * 0.52 * K.stemK;
  if (h < 3) return;
  stemPath(c, 0, K.sway * 20 * S, h, 2.6 * S, pal.s, mixHex(pal.s, '#000000', 0.2));
  const topX = K.sway * 20 * S, topY = -h;
  if (K.bloomK <= 0.02) { if (K.budK > 0.05) drawBud(c, topX, topY - 3 * S, K.budK, sp, S); return; }
  c.save(); c.translate(topX, topY); c.scale(K.bloomK, K.bloomK);
  const open = 0.35 + 0.65 * K.matureK; // petals unfold as it matures
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + p.variant;
    petalPoint(c, 0, 0, R * 1.05, R * 0.34, a, mixHex(pal.p[0], pal.p[1], 0.3));
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.4 + p.variant;
    petalPoint(c, 0, 0, R * 0.8, R * 0.3, a - (1 - open) * 0.0, mixHex(pal.p[0], pal.p[1], 0.6));
  }
  c.fillStyle = pal.c;
  c.beginPath(); c.ellipse(0, 0, R * 0.24, R * 0.18, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.c2 || pal.c;
  for (let i = 0; i < 6; i++) {
    const a = i * 2.39;
    c.beginPath(); c.arc(Math.cos(a) * R * 0.12, Math.sin(a) * R * 0.09, R * 0.04, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}
function paintBranch(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  const ex = h * 0.72, ey = -h * 0.82;
  c.strokeStyle = '#5e4630'; c.lineCap = 'round';
  c.lineWidth = 4.6 * S;
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(h * 0.2, -h * 0.5, ex, ey); c.stroke();
  c.lineWidth = 2.2 * S;
  c.beginPath(); c.moveTo(h * 0.3, -h * 0.44); c.quadraticCurveTo(h * 0.42, -h * 0.62, h * 0.34, -h * 0.78); c.stroke();
  c.beginPath(); c.moveTo(h * 0.48, -h * 0.6); c.quadraticCurveTo(h * 0.62, -h * 0.66, h * 0.78, -h * 0.62); c.stroke();
  const clusters = [[0.25, -0.36], [0.36, -0.72], [0.52, -0.55], [0.72, -0.8], [0.8, -0.6], [0.62, -0.68]];
  for (let i = 0; i < clusters.length; i++) {
    const cxp = clusters[i][0] * h, cyp = clusters[i][1] * h;
    const stagger = hashStr(sp.id + 'cl' + i);
    const bk = clamp(K.bloomK * 1.35 - stagger * 0.35, 0, 1);
    if (bk <= 0.03) {
      if (K.budK > 0.1) {
        c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.35);
        c.beginPath(); c.arc(cxp, cyp, 3.4 * S * K.budK, 0, Math.PI * 2); c.fill();
      }
      continue;
    }
    for (let b = 0; b < 3; b++) {
      const bx = cxp + (hashStr(sp.id + 'bx' + i + '' + b) - 0.5) * 13 * S;
      const by = cyp + (hashStr(sp.id + 'by' + i + '' + b) - 0.5) * 10 * S;
      const br = 6.4 * S * bk;
      for (let q = 0; q < 5; q++) {
        petalRound(c, bx, by, br * 1.15, br * 0.62, (q / 5) * Math.PI * 2 + 0.3, mixHex(pal.p[0], pal.p[1], 0.45));
      }
      c.fillStyle = pal.c;
      c.beginPath(); c.arc(bx, by, br * 0.22, 0, Math.PI * 2); c.fill();
    }
  }
  leafShape(c, h * 0.12, -h * 0.2, 14 * S * K.leafK, 4 * S, 0.4, pal.l, '#557c48');
}
function paintCap(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, R = K.R;
  const h = K.HGT * 0.72 * K.stemK;
  if (h < 3) return;
  const capK = smooth(0.25, 0.85, p.t);
  // tapered stem
  const grd = c.createLinearGradient(0, 0, 0, -h);
  grd.addColorStop(0, mixHex(pal.s, '#8a7a5e', 0.25)); grd.addColorStop(1, pal.s);
  c.fillStyle = grd;
  c.beginPath();
  c.moveTo(-R * 0.34, 0);
  c.quadraticCurveTo(-R * 0.26, -h * 0.6, -R * 0.2, -h);
  c.lineTo(R * 0.2, -h);
  c.quadraticCurveTo(R * 0.26, -h * 0.6, R * 0.34, 0);
  c.closePath(); c.fill();
  if (capK <= 0.02) return;
  const cw = R * 1.18 * capK, ch = R * 0.72 * capK;
  c.save(); c.translate(0, -h);
  const cg = c.createLinearGradient(0, -ch, 0, ch * 0.3);
  cg.addColorStop(0, pal.p[1]); cg.addColorStop(1, pal.p[0]);
  c.fillStyle = cg;
  c.beginPath();
  c.moveTo(-cw, 0);
  c.quadraticCurveTo(-cw * 0.9, -ch * 1.05, 0, -ch * 1.12);
  c.quadraticCurveTo(cw * 0.9, -ch * 1.05, cw, 0);
  c.quadraticCurveTo(0, ch * 0.34, -cw, 0);
  c.fill();
  c.fillStyle = 'rgba(70,50,30,.28)';
  c.beginPath(); c.ellipse(0, ch * 0.08, cw * 0.82, ch * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = pal.a;
  const spots = [[-0.45, -0.62, 0.13], [0.1, -0.85, 0.16], [0.52, -0.55, 0.11], [-0.08, -0.45, 0.09], [0.34, -0.3, 0.08]];
  for (let i = 0; i < spots.length; i++) {
    c.beginPath();
    c.ellipse(spots[i][0] * cw, spots[i][1] * ch, spots[i][2] * cw, spots[i][2] * cw * 0.7, 0, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}
function paintBlade(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal;
  const fronds = 6;
  for (let i = 0; i < fronds; i++) {
    const fi = i / (fronds - 1);
    const ang = -Math.PI / 2 + (fi - 0.5) * 1.25;
    const len = K.HGT * (0.62 + 0.38 * Math.sin(fi * Math.PI)) * K.stemK * (0.75 + 0.25 * hashStr(sp.id + 'fr' + i));
    if (len < 4) continue;
    const bend = Math.sin(now * 1.1 + p.phase + i) * 2 * S;
    const cxp = Math.cos(ang) * len * 0.5 + bend, cyp = Math.sin(ang) * len * 0.55;
    const ex = Math.cos(ang) * len + bend * 1.6, ey = Math.sin(ang) * len + len * 0.14;
    c.strokeStyle = mixHex(pal.p[0], pal.p[1], 0.25); c.lineWidth = 1.7 * S; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(cxp, cyp, ex, ey); c.stroke();
    const leaflets = 8;
    for (let q = 1; q <= leaflets; q++) {
      const f = q / (leaflets + 1);
      const px = 2 * (1 - f) * f * cxp + f * f * ex;
      const py = 2 * (1 - f) * f * cyp + f * f * ey;
      const ls = (1 - f * 0.75) * 8.5 * S * K.leafK;
      if (ls < 0.6) continue;
      const la = Math.atan2(ey, ex) ;
      leafShape(c, px, py, ls, ls * 0.3, la - 0.85, mixHex(pal.p[0], pal.p[1], f * 0.5), pal.l);
      leafShape(c, px, py, ls, ls * 0.3, la + 0.85, pal.l, mixHex(pal.p[0], pal.p[1], f * 0.5));
    }
  }
}
function paintSpray(c, p, now, S, K) {
  const sp = p.sp, pal = sp.pal, R = K.R;
  const h = K.HGT * K.stemK;
  if (h < 4) return;
  leafShape(c, -2 * S, -1 * S, 30 * S * K.leafK, 9 * S, 2.85, pal.l, pal.s);
  leafShape(c, 3 * S, -1 * S, 26 * S * K.leafK, 8.5 * S, 0.3, pal.s, pal.l);
  const P0 = [0, 0], C = [K.sway * 26 * S, -h * 0.62], P2 = [h * 0.34, -h * 0.9];
  c.strokeStyle = pal.s; c.lineWidth = 2.2 * S; c.lineCap = 'round';
  c.beginPath(); c.moveTo(P0[0], P0[1]); c.quadraticCurveTo(C[0], C[1], P2[0], P2[1]); c.stroke();
  const blooms = 4;
  for (let i = 0; i < blooms; i++) {
    const t = 0.45 + (i / (blooms - 1)) * 0.53;
    const bx = 2 * (1 - t) * t * C[0] + t * t * P2[0];
    const by = 2 * (1 - t) * t * C[1] + t * t * P2[1];
    const stagger = i * 0.14;
    const bk = clamp((K.bloomK - stagger) / (1 - stagger), 0, 1);
    if (bk <= 0.03) {
      if (K.budK > 0.1) {
        c.fillStyle = mixHex(pal.p[0], pal.p[1], 0.3);
        c.beginPath(); c.arc(bx, by, 3 * S * K.budK, 0, Math.PI * 2); c.fill();
      }
      continue;
    }
    c.save(); c.translate(bx, by - 2 * S); c.scale(bk, bk);
    const br = R * 0.52;
    for (let q = 0; q < 3; q++) {
      petalPoint(c, 0, 0, br * 0.95, br * 0.26, -2.2 + q * 0.75, mixHex(pal.p[0], pal.p[1], 0.12));
    }
    petalRound(c, 0, 0, br * 1.05, br * 0.6, -0.5, mixHex(pal.p[0], pal.p[1], 0.55));
    petalRound(c, 0, 0, br * 1.05, br * 0.6, 0.5 + Math.PI, mixHex(pal.p[0], pal.p[1], 0.55));
    c.fillStyle = pal.c;
    c.beginPath(); c.ellipse(0, br * 0.2, br * 0.3, br * 0.2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = pal.a;
    c.beginPath(); c.arc(0, br * 0.14, br * 0.09, 0, Math.PI * 2); c.fill();
    c.restore();
  }
}

/* ---------- master plant painter ---------- */
function drawPlantShape(c, p, now, S) {
  const sp = p.sp, g = p.t;
  const K = {
    HGT: 175 * S * sp.h,
    R: 24 * S,
    stemK: easeOutCubic(smooth(0, 0.55, g)),
    leafK: smooth(0.26, 0.68, g),
    budK: smooth(0.5, 0.8, g),
    bloomK: g > 0.76 ? clamp(easeOutBack((g - 0.76) / 0.24), 0, 1.12) : 0,
    matureK: smooth(0.8, 1, g),
    sway: Math.sin(now * 1.15 + p.phase) * 0.05 * (0.3 + 0.7 * smooth(0, 0.55, g))
  };
  // soft ground shadow
  c.fillStyle = 'rgba(40,26,8,.18)';
  c.beginPath(); c.ellipse(0, 2 * S, K.R * 0.95, K.R * 0.2, 0, 0, Math.PI * 2); c.fill();
  // luminous pool of light
  if (sp.glow && K.bloomK > 0) {
    const lg = c.createRadialGradient(0, 0, 2, 0, 0, K.R * 2.6);
    lg.addColorStop(0, rgba(sp.glow, 0.20 * K.bloomK));
    lg.addColorStop(1, rgba(sp.glow, 0));
    c.fillStyle = lg;
    c.beginPath(); c.arc(0, -K.HGT * 0.4, K.R * 2.6, 0, Math.PI * 2); c.fill();
  }
  switch (sp.form) {
    case 'spike': paintSpike(c, p, now, S, K); return;
    case 'bell': paintBell(c, p, now, S, K); return;
    case 'plume': paintPlume(c, p, now, S, K); return;
    case 'pad': paintPad(c, p, now, S, K); return;
    case 'branch': paintBranch(c, p, now, S, K); return;
    case 'cap': paintCap(c, p, now, S, K); return;
    case 'blade': paintBlade(c, p, now, S, K); return;
    case 'spray': paintSpray(c, p, now, S, K); return;
  }
  // generic stem + head forms
  const pal = sp.pal;
  const h = K.HGT * K.stemK;
  if (h < 2) {
    // sprout: two baby leaves
    const ss = smooth(0, 0.3, g);
    if (ss > 0) {
      leafShape(c, -1, -1, 8 * S * ss + 0.5, 3 * S, 2.9, '#6db35a', pal.l);
      leafShape(c, 1, -1, 8 * S * ss + 0.5, 3 * S, 0.25, pal.l, '#6db35a');
    }
    return;
  }
  const topX = K.sway * h * 0.6;
  stemPath(c, 0, topX, h, 3.4 * S, pal.s, mixHex(pal.s, '#000000', 0.18));
  if (K.leafK > 0.02) {
    const l1 = stemPoint(topX, h, 0.42), l2 = stemPoint(topX, h, 0.63);
    leafShape(c, l1[0], l1[1], 15 * S * K.leafK, 5 * S, 2.8 + K.sway, pal.l, pal.s);
    leafShape(c, l2[0], l2[1], 12.5 * S * K.leafK, 4.6 * S, 0.35 + K.sway, pal.s, pal.l);
  }
  if (sp.glow && K.bloomK > 0) {
    c.save();
    c.shadowColor = sp.glow; c.shadowBlur = 18 * S * K.bloomK;
  }
  if (K.bloomK > 0.02) {
    c.save();
    c.translate(topX, -h - K.R * 0.2);
    c.rotate(K.sway * 1.5);
    c.scale(K.bloomK, K.bloomK);
    drawHead(c, sp, K.R, p.variant);
    c.restore();
  } else if (K.budK > 0.03) {
    drawBud(c, topX, -h - 2 * S, K.budK, sp, S);
  }
  if (sp.glow && K.bloomK > 0) c.restore();
}

function drawPlant(p, now) {
  ctx.save();
  ctx.translate(p.x, plantBaseY(p));
  drawPlantShape(ctx, p, now, plantScaleOf(p));
  ctx.restore();
}

function bakePlant(p) {
  if (!bakedGarden) return;
  const bctx = bakedGarden.getContext('2d');
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.save();
  bctx.globalAlpha = 0.5;
  bctx.translate(p.x, plantBaseY(p));
  drawPlantShape(bctx, p, 1.0, plantScaleOf(p));
  bctx.restore();
}

/* packet / journal thumbnails — the same painters, miniaturized */
const thumbCache = {};
function makeThumb(sp) {
  if (thumbCache[sp.id]) return thumbCache[sp.id];
  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96;
  const c = cv.getContext('2d');
  const fake = { sp: sp, t: 1, variant: 0.42, phase: 1.7, x: 0, yOff: 0, scale: 1 };
  c.translate(48, 90);
  drawPlantShape(c, fake, 1.2, 0.44);
  const url = cv.toDataURL();
  thumbCache[sp.id] = url;
  return url;
}

/* ================================================================
   SEEDS — drop, bounce, plant (physics adapted from Seed Plinko)
   ================================================================ */
let ROUND = 0;
let totalBlooms = 0;
const sessionSpecies = {};

function drawSeedShape(x, y, r, sp) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.35 + Math.sin(performance.now() * 0.004 + x) * 0.08);
  ctx.fillStyle = sp.seed[0];
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.82, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sp.seed[1];
  ctx.beginPath(); ctx.ellipse(-r * 0.22, -r * 0.3, r * 0.34, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.arc(r * 0.2, r * 0.25, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

const DROP_DEBOUNCE_MS = 100; // v3 — just enough to stop one click becoming two drops
function dropSeed() {
  if (!started) return;
  const now = performance.now();
  if (now - lastDropAt < DROP_DEBOUNCE_MS) return;
  lastDropAt = now;
  const sp = dropSpecies();
  seeds.push({
    x: dropperX, y: L.dropY + L.seedR + 2,
    vx: rand(-14, 14), vy: 30,
    r: L.seedR, sp: sp,
    born: now, lastClickAt: 0
  });
  if (randomMode) rollNext(); // queue the next surprise the moment this seed leaves
  updateHUD();
}

function stepSeed(s, dt) {
  const GRAV = 1500;
  s.vy += GRAV * dt;
  const speed = Math.hypot(s.vx, s.vy);
  if (speed < 42 && s.y < L.binTop) s.vy += 900 * dt;
  if (performance.now() - s.born > 6000) s.vy = Math.max(s.vy, 260);

  s.x += s.vx * dt;
  s.y += s.vy * dt;

  const rail = 8;
  if (s.x < rail + s.r) { s.x = rail + s.r; s.vx = Math.abs(s.vx) * 0.55; }
  if (s.x > W - rail - s.r) { s.x = W - rail - s.r; s.vx = -Math.abs(s.vx) * 0.55; }

  const pr = L.pegR + s.r;
  for (let i = 0; i < L.pegs.length; i++) {
    const p = L.pegs[i];
    const dx = s.x - p.x, dy = s.y - p.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < pr * pr && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;
      s.x = p.x + nx * pr;
      s.y = p.y + ny * pr;
      const vn = s.vx * nx + s.vy * ny;
      if (vn < 0) {
        const rest = 0.52;
        s.vx -= (1 + rest) * vn * nx;
        s.vy -= (1 + rest) * vn * ny;
        const tx = -ny, ty = nx;
        const j = rand(-26, 26);
        s.vx += tx * j; s.vy += ty * j * 0.3;
        const now = performance.now();
        if (now - s.lastClickAt > 45) {
          s.lastClickAt = now;
          p.flash = 1;
          sndPlink((p.y - L.boardTop) / Math.max(1, L.binTop - L.boardTop), Math.min(1, Math.abs(vn) / 420));
        }
      }
    }
  }

  if (s.y > L.binTop - s.r && s.y < L.soilBase + 6) {
    for (let i = 0; i < L.dividers.length; i++) {
      const dv = L.dividers[i];
      if (s.y > dv.y0 - s.r && s.y < dv.y1 + s.r) {
        const dx = s.x - dv.x;
        if (Math.abs(dx) < s.r + 2.5 && dx !== 0) {
          const side = dx > 0 ? 1 : -1;
          s.x = dv.x + side * (s.r + 2.5);
          s.vx = side * Math.abs(s.vx) * 0.4 + side * 12;
          const now = performance.now();
          if (now - s.lastClickAt > 60) { s.lastClickAt = now; sndPlink(0.9, 0.2); }
        }
      }
    }
  }

  const sy = soilYAt(s.x);
  if (s.y + s.r >= sy && s.vy > -40) {
    plantSeed(s);
    return false;
  }
  return true;
}

function makePlant(sp, x, growMult) {
  return {
    sp: sp, x: clamp(x, 16, W - 16), row: rowFor(sp), yOff: rand(0, 4),
    t: 0, dur: rand(1.25, 1.55) * (growMult || 1), // v3 — growth at half the v2 duration
    bornAt: performance.now(),
    phase: rand(0, Math.PI * 2), variant: Math.random(),
    bloomed: false, popped: false, frozen: false, round: ROUND, scale: 1
  };
}

function plantSeed(s) {
  const p = makePlant(s.sp, s.x, growBoost);
  growBoost = 1;
  plants.push(p);
  sndPock();
  sndShimmer(p.dur * 0.85);
  const sy = plantBaseY(p);
  for (let i = 0; i < 9; i++) {
    particles.push({
      kind: 'soil', x: s.x, y: sy - 2,
      vx: rand(-55, 55), vy: rand(-95, -25),
      life: rand(0.35, 0.7), age: 0, r: rand(1.6, 3.6)
    });
  }
  updateHUD();
}

function updatePlant(p, dt) {
  if (p.frozen || p.t >= 1) return;
  p.t = Math.min(1, p.t + dt / p.dur);
  if (p.t > 0.8 && !p.popped && p.sp.form !== 'blade') {
    p.popped = true; sndPop();
  }
  if (p.t >= 1 && !p.bloomed) {
    p.bloomed = true;
    blooms++; totalBlooms++;
    sessionSpecies[p.sp.id] = true;
    const earned = TIER_POLLEN[p.sp.tier];
    save.pollen += earned;
    sessionPollen += earned;
    save.journal[p.sp.id] = (save.journal[p.sp.id] || 0) + 1;
    if (totalBlooms > (save.best || 0)) save.best = totalBlooms;
    persist();
    sndChime(p.sp.tier === 2);
    const topY = plantBaseY(p) - 155 * plantScaleOf(p) * p.sp.h;
    floaters.push({ x: p.x, y: topY, text: '+' + earned + ' ❀', age: 0, life: 1.5 });
    for (let i = 0; i < (p.sp.tier === 2 ? 15 : 8); i++) {
      particles.push({
        kind: p.sp.glow ? 'glowmote' : 'pollen', col: p.sp.glow,
        x: p.x + rand(-9, 9), y: plantBaseY(p) - 60 * plantScaleOf(p),
        vx: rand(-24, 24), vy: rand(-48, -8),
        life: rand(0.7, 1.6), age: 0, r: rand(1.2, 2.6)
      });
    }
    // retire the oldest bloomed plant into the silhouette layer past the cap
    if (plants.length > 90) {
      for (let i = 0; i < plants.length; i++) {
        if (plants[i].bloomed && plants[i] !== p) { bakePlant(plants[i]); plants.splice(i, 1); break; }
      }
    }
    updateHUD();
  }
  // cherry blossom sheds the odd petal once in bloom
  if (p.bloomed && p.sp.id === 'sakura' && Math.random() < dt * 0.8) {
    particles.push({
      kind: 'glowmote', col: '#f2a9c4',
      x: p.x + rand(-26, 26), y: plantBaseY(p) - rand(60, 120) * plantScaleOf(p),
      vx: rand(-9, 4), vy: rand(7, 16),
      life: rand(1.4, 2.4), age: 0, r: rand(1.8, 3)
    });
  }
}

/* ================================================================
   INPUT — drag to aim, release to drop (touch-native)
   ================================================================ */
let ptrDownAt = 0;
let ptrMode = 'aim'; // 'aim' = drop gesture · 'walk' = meadow-band drag steering the gardener
function aimTo(clientX) {
  dropperX = clamp(clientX, L.seedR + 10, W - L.seedR - 10);
}
function inMeadowBand(y) { return started && L && y >= L.meadowTop - 6; }
canvas.addEventListener('pointermove', function (e) {
  if (ptrMode === 'walk' && ptrDownAt) gardener.targetX = e.clientX;
  else aimTo(e.clientX);
});
canvas.addEventListener('pointerdown', function (e) {
  initAudio();
  ptrDownAt = performance.now();
  if (inMeadowBand(e.clientY)) {
    ptrMode = 'walk';
    gardener.targetX = e.clientX;
  } else {
    ptrMode = 'aim';
    aimTo(e.clientX);
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointerup', function (e) {
  if (ptrMode === 'walk') {
    gardener.targetX = null;
  } else {
    aimTo(e.clientX);
    if (ptrDownAt) dropSeed();
  }
  ptrDownAt = 0;
  ptrMode = 'aim';
});
canvas.addEventListener('pointercancel', function () { ptrDownAt = 0; ptrMode = 'aim'; gardener.targetX = null; });
window.addEventListener('keydown', function (e) {
  keysDown[e.code] = true;
  if (e.code === 'ArrowLeft') { e.preventDefault(); dropperX = clamp(dropperX - 18, L.seedR + 10, W - L.seedR - 10); }
  if (e.code === 'ArrowRight') { e.preventDefault(); dropperX = clamp(dropperX + 18, L.seedR + 10, W - L.seedR - 10); }
  if (e.code === 'Space') { e.preventDefault(); initAudio(); dropSeed(); }
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
window.addEventListener('keyup', function (e) { keysDown[e.code] = false; });

/* ================================================================
   UI — HUD, seed packets, journal
   ================================================================ */
const el = {
  hud: document.getElementById('hud'),
  seeds: document.getElementById('seedPill'),
  pollen: document.getElementById('pollenPill'),
  fill: document.getElementById('meterFill'),
  meterLabel: document.getElementById('meterLabel'),
  title: document.getElementById('titleScreen'),
  mute: document.getElementById('muteBtn'),
  picker: document.getElementById('picker'),
  packets: document.getElementById('packets'),
  journal: document.getElementById('journal'),
  journalGrid: document.getElementById('journalGrid'),
  journalSub: document.getElementById('journalSub')
};

function gardenPct() {
  // v3 — endless garden: the meter reads how fully grown the standing
  // garden is (mean growth across every plant currently in the soil).
  if (!plants.length) return 0;
  let sum = 0;
  for (let i = 0; i < plants.length; i++) sum += plants[i].t;
  return clamp(Math.round(100 * sum / plants.length), 0, 100);
}
function updateHUD() {
  el.seeds.textContent = '🌱 ∞';
  el.pollen.textContent = '❀ ' + save.pollen;
  const pct = gardenPct();
  el.fill.style.width = pct + '%';
  el.meterLabel.textContent = 'GARDEN ' + pct + '%';
}
function toggleMute() {
  muted = !muted;
  save.muted = muted;
  persist();
  el.mute.textContent = muted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.85;
}
el.mute.textContent = muted ? '🔇' : '🔊';
el.mute.addEventListener('click', function (e) { e.stopPropagation(); initAudio(); toggleMute(); });
el.mute.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

function selectRandom() {
  randomMode = true;
  if (save.sel !== 'random') { save.sel = 'random'; persist(); }
  rollNext();
  const kids = el.packets.children;
  for (let i = 0; i < kids.length; i++) {
    kids[i].classList.toggle('sel', kids[i].getAttribute('data-id') === 'random');
  }
  const sel = el.packets.querySelector('.packet.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
}

function selectSpecies(id, silent) {
  const sp = SPECIES_BY_ID[id];
  if (!sp) return;
  // v3 — nothing locked, nothing to buy: selecting a packet just selects it
  randomMode = false;
  selectedId = id;
  if (save.sel !== id) { save.sel = id; persist(); }
  const kids = el.packets.children;
  for (let i = 0; i < kids.length; i++) {
    kids[i].classList.toggle('sel', kids[i].getAttribute('data-id') === id);
  }
  if (!silent) {
    const sel = el.packets.querySelector('.packet.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }
}

function buildPackets() {
  el.packets.innerHTML = '';
  // "Surprise me" — the default packet: a fresh random species every drop
  const rd = document.createElement('div');
  rd.className = 'packet random' + (randomMode ? ' sel' : '');
  rd.setAttribute('data-id', 'random');
  rd.innerHTML = '<div class="dice">🎲</div><span class="pname">Surprise Me</span><span class="pcost">✦ random seed</span>';
  rd.addEventListener('pointerdown', function (e) { e.stopPropagation(); initAudio(); });
  rd.addEventListener('click', function () { selectRandom(); });
  el.packets.appendChild(rd);
  SPECIES.forEach(function (sp) {
    const d = document.createElement('div');
    d.className = 'packet' + (!randomMode && sp.id === selectedId ? ' sel' : '');
    d.setAttribute('data-id', sp.id);
    let inner = '<img alt="" src="' + makeThumb(sp) + '"><span class="pname">' + sp.name + '</span>';
    if (sp.tier === 2) inner += '<span class="pcost">✦ luminous</span>';
    else if (sp.tier === 1) inner += '<span class="pcost">✿ rare</span>';
    d.innerHTML = inner;
    d.addEventListener('pointerdown', function (e) { e.stopPropagation(); initAudio(); });
    d.addEventListener('click', function () { selectSpecies(sp.id); });
    el.packets.appendChild(d);
  });
  if (randomMode) rollNext(); // queue a fresh surprise
}

function buildJournal() {
  el.journalGrid.innerHTML = '';
  let discovered = 0;
  SPECIES.forEach(function (sp) {
    const count = save.journal[sp.id] || 0;
    if (count > 0) discovered++;
    const d = document.createElement('div');
    d.className = 'jcell' + (count > 0 ? '' : ' undisc');
    d.innerHTML = '<img alt="" src="' + makeThumb(sp) + '">' +
      '<div class="jname">' + (count > 0 ? sp.name : '· · · ? · · ·') + '</div>' +
      '<div class="jcount">' + (count > 0 ? 'grown × ' + count : (sp.tier === 2 ? 'luminous' : sp.tier === 1 ? 'rare' : 'common')) + '</div>';
    el.journalGrid.appendChild(d);
  });
  el.journalSub.textContent = discovered + ' of ' + SPECIES.length + ' species discovered · ❀ ' + save.pollen + ' pollen banked';
}
function openJournal() { buildJournal(); el.journal.classList.remove('hidden'); }
function closeJournal() { el.journal.classList.add('hidden'); }
document.getElementById('journalBtn').addEventListener('click', function (e) { e.stopPropagation(); initAudio(); openJournal(); });
document.getElementById('journalBtn').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
document.getElementById('journalClose').addEventListener('click', closeJournal);

/* ================================================================
   SESSION FLOW (v3) — one endless session: it starts, and it never
   stops. No rounds, no satchel, no end screen.
   ================================================================ */
function startRound() {
  ROUND++;
  started = true;
  el.title.classList.add('hidden');
  el.hud.classList.remove('hidden');
  el.picker.classList.remove('hidden');
  buildPackets();
  resize();
  nextChirpAt = performance.now() / 1000 + rand(4, 8);
  updateHUD();
}
document.getElementById('startBtn').addEventListener('click', function () { initAudio(); startRound(); });

/* ================================================================
   DEPTH HAZE (v2) — a breath of golden air between the rows
   ================================================================ */
function drawDepthHaze(strength) {
  const y0 = L.soilBase - 14, y1 = H - L.pickerH;
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, 'rgba(255,205,140,' + strength + ')');
  g.addColorStop(1, 'rgba(255,205,140,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, y1 - y0);
}

function drawFallingPlant(p) {
  const k = clamp((p.fallAge || 0) / 0.75, 0, 1);
  const ang = (p.fallDir || 1) * (Math.PI / 2.15) * k * k; // tips slowly, then goes
  ctx.save();
  ctx.translate(p.x, plantBaseY(p));
  ctx.rotate(ang);
  if (k > 0.7) ctx.globalAlpha = 1 - (k - 0.7) / 0.3 * 0.7;
  drawPlantShape(ctx, p, 1.0, plantScaleOf(p));
  ctx.restore();
}

/* ================================================================
   THE GARDENER (v2) — a little hooded keeper with a scythe.
   Walks the meadow (arrows / A,D, or a meadow-band drag), and any
   established plant he passes gets snicked down: +1 ❀, a falling
   plant, a puff of petals. Sprouts below the bud stage are spared.
   ================================================================ */
const CHOP_REACH = 36, CHOP_MIN_T = 0.8, SWING_CD = 0.26;

function chopPlant(idx) {
  const p = plants[idx];
  plants.splice(idx, 1); // the slot is freed — chopped plants are never baked
  p.fallAge = 0;
  p.fallDir = (p.x >= gardener.x) ? 1 : -1; // tips away from him
  falling.push(p);
  gardener.swingT = 0;
  gardener.swingCd = SWING_CD;
  harvested++;
  save.harvested = (save.harvested || 0) + 1;
  save.pollen += 1;
  persist();
  sndSnick();
  const by = plantBaseY(p);
  for (let i = 0; i < 7; i++) {
    particles.push({
      kind: 'glowmote', col: p.sp.pal.p[1],
      x: p.x + rand(-8, 8), y: by - rand(8, 46) * plantScaleOf(p),
      vx: rand(-40, 40), vy: rand(-26, 30),
      life: rand(0.5, 1.0), age: 0, r: rand(1.4, 3)
    });
  }
  for (let i = 0; i < 4; i++) {
    particles.push({
      kind: 'soil', x: p.x + rand(-5, 5), y: by - 2,
      vx: rand(-45, 45), vy: rand(-70, -20),
      life: rand(0.3, 0.55), age: 0, r: rand(1.4, 3)
    });
  }
  updateHUD();
}

function updateGardener(dt) {
  if (!started || SAMPLE_MODE) return;
  let move = 0;
  if (keysDown['ArrowLeft'] || keysDown['KeyA']) move = -1;
  else if (keysDown['ArrowRight'] || keysDown['KeyD']) move = 1;
  else if (gardener.targetX != null) {
    const dx = gardener.targetX - gardener.x;
    if (Math.abs(dx) > 5) move = dx > 0 ? 1 : -1;
    else gardener.targetX = null;
  }
  gardener.moving = move !== 0;
  if (move !== 0) {
    gardener.dir = move;
    gardener.x = clamp(gardener.x + move * 185 * dt, 26, W - 26);
    gardener.walkPhase += dt * 11;
  }
  if (gardener.swingT < 1) gardener.swingT = Math.min(1, gardener.swingT + dt / 0.24);
  gardener.swingCd -= dt;
  if (gardener.swingCd <= 0) {
    const reach = CHOP_REACH * L.plantScale + 8;
    for (let i = 0; i < plants.length; i++) {
      const p = plants[i];
      if (p.t >= CHOP_MIN_T && Math.abs(p.x - gardener.x) <= reach) { chopPlant(i); break; }
    }
  }
  for (let i = falling.length - 1; i >= 0; i--) {
    falling[i].fallAge += dt;
    if (falling[i].fallAge > 0.75) falling.splice(i, 1);
  }
}

/* the gardener, code-drawn in the game's own painted shapes.
   Unit space: feet at y=0, faces +x (flipped by gardener.dir). */
function drawGardener(now) {
  if (!started || SAMPLE_MODE) return;
  const g = gardener;
  const S = L.plantScale;
  const baseY = soilYAt(g.x) + ROW_BASE[2] + 7;
  const bob = g.moving ? Math.abs(Math.sin(g.walkPhase)) * 2.4 : Math.sin(now * 1.6) * 0.6;
  const lp = g.moving ? Math.sin(g.walkPhase) * 4.6 : 0; // leg shuffle
  ctx.save();
  ctx.translate(g.x, baseY);
  // soft ground shadow (stays on the ground while he bobs)
  ctx.fillStyle = 'rgba(40,26,8,.22)';
  ctx.beginPath(); ctx.ellipse(0, 3, 13 * S, 3.6 * S, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(0, -bob * S);
  ctx.scale(g.dir * S, S);

  // legs + boots
  ctx.strokeStyle = '#5e4630'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2.5, -13); ctx.lineTo(-3.5 + lp, -2.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2.5, -13); ctx.lineTo(3.5 - lp, -2.5); ctx.stroke();
  ctx.fillStyle = '#3c2a18';
  ctx.beginPath(); ctx.ellipse(-3.5 + lp, -1.6, 3.6, 2.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3.5 - lp, -1.6, 3.6, 2.1, 0, 0, Math.PI * 2); ctx.fill();

  // tunic — a russet trapezoid with a belt
  const tg = ctx.createLinearGradient(0, -32, 0, -10);
  tg.addColorStop(0, '#c07a42'); tg.addColorStop(1, '#8a4f28');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-7.5, -31); ctx.lineTo(7.5, -31);
  ctx.quadraticCurveTo(10.5, -18, 10, -11.5);
  ctx.lineTo(-10, -11.5);
  ctx.quadraticCurveTo(-10.5, -18, -7.5, -31);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5e3a1e';
  ctx.fillRect(-9.6, -17.5, 19.2, 2.8);
  ctx.fillStyle = '#ffd968';
  ctx.fillRect(1.5, -17.5, 3.4, 2.8);

  // the scythe arm + scythe (swings around the hands when he chops)
  const swing = g.swingT < 1 ? -Math.sin(g.swingT * Math.PI) * 1.55 : 0;
  ctx.save();
  ctx.translate(5, -23);
  ctx.rotate(-0.42 + swing + Math.sin(now * 1.6) * 0.03);
  // arm to the snath
  ctx.strokeStyle = '#b06a3a'; ctx.lineWidth = 3.6;
  ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(4, -3); ctx.stroke();
  // snath (the long curved handle)
  ctx.strokeStyle = '#7a5c33'; ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.moveTo(-7, 9); ctx.quadraticCurveTo(4, -4, 15, -17); ctx.stroke();
  // blade — a silver crescent at the top
  const bg = ctx.createLinearGradient(13, -22, 34, -12);
  bg.addColorStop(0, '#e8eef4'); bg.addColorStop(1, '#93a3b1');
  ctx.strokeStyle = bg; ctx.lineWidth = 3.1;
  ctx.beginPath(); ctx.moveTo(14.5, -18.5); ctx.quadraticCurveTo(26, -24.5, 35, -16.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(15.5, -17.6); ctx.quadraticCurveTo(26, -23.2, 33.8, -15.9); ctx.stroke();
  ctx.restore();

  // head — a warm face in the hood's shadow
  ctx.fillStyle = '#f2c894';
  ctx.beginPath(); ctx.arc(1.5, -36.5, 6.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(90,50,20,.28)';
  ctx.beginPath(); ctx.arc(-0.5, -38.5, 6.2, 0, -2.6, -0.4); ctx.lineTo(-0.5, -38.5); ctx.fill();
  ctx.fillStyle = '#2e2118';
  ctx.beginPath(); ctx.arc(5.2, -36.5, 0.95, 0, Math.PI * 2); ctx.fill();

  // hood — deep green, with a little leaf sprig tucked in
  const hg = ctx.createLinearGradient(0, -48, 0, -28);
  hg.addColorStop(0, '#5d8a63'); hg.addColorStop(1, '#33543c');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(-8.5, -29.5);
  ctx.quadraticCurveTo(-11.5, -45, 0.5, -47.5);
  ctx.quadraticCurveTo(12, -45.5, 9.5, -30.5);
  ctx.quadraticCurveTo(3, -35.5, -1.5, -34.5);
  ctx.quadraticCurveTo(-6.5, -33.5, -8.5, -29.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,200,.30)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-8.5, -29.5);
  ctx.quadraticCurveTo(-11.5, -45, 0.5, -47.5);
  ctx.quadraticCurveTo(12, -45.5, 9.5, -30.5);
  ctx.stroke();
  leafShape(ctx, -7.5, -43, 7.5, 2.8, 2.55, '#7fae5a', '#4d7c3a');
  ctx.restore();
}

/* ================================================================
   DROPPER + MAIN LOOP
   ================================================================ */
function drawDropper(now) {
  if (!started) return;
  const sp = dropSpecies();
  const x = dropperX, y = L.dropY;
  ctx.fillStyle = 'rgba(255,250,220,.4)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(x, y + 17 + i * 11 + Math.sin(now * 4 + i) * 1.5, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // selection halo in the species' accent
  ctx.strokeStyle = rgba(sp.pal.p[0], 0.65);
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, L.seedR + 5.5 + Math.sin(now * 2.6) * 1.2, 0, Math.PI * 2); ctx.stroke();
  // leaf chute
  ctx.fillStyle = '#5d9c48';
  ctx.beginPath();
  ctx.moveTo(x - 17, y - 13);
  ctx.quadraticCurveTo(x, y - 24 - Math.sin(now * 2.2) * 1.6, x + 17, y - 13);
  ctx.quadraticCurveTo(x, y - 6, x - 17, y - 13);
  ctx.fill();
  drawSeedShape(x, y, L.seedR, sp);
  // name tag — in random mode this is the rolled surprise, shown before you drop it
  const label = (randomMode ? '🎲 ' : '') + sp.name;
  ctx.font = '600 12px Georgia, serif';
  ctx.textAlign = 'center';
  const lw = ctx.measureText(label).width + 18;
  const ly = y + L.seedR + 16;
  ctx.fillStyle = 'rgba(43,30,14,.74)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - lw / 2, ly - 10, lw, 19, 9); else ctx.rect(x - lw / 2, ly - 10, lw, 19);
  ctx.fill();
  ctx.fillStyle = '#ffe9b0';
  ctx.fillText(label, x, ly + 3.5);
  ctx.textAlign = 'left';
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000;
  let dt = Math.min(0.033, now - (lastTs || now));
  lastTs = now;
  if (dt <= 0) dt = 0.016;

  const SUB = 2, sdt = dt / SUB;
  for (let sIdx = seeds.length - 1; sIdx >= 0; sIdx--) {
    let alive = true;
    for (let k = 0; k < SUB && alive; k++) alive = stepSeed(seeds[sIdx], sdt);
    if (!alive) seeds.splice(sIdx, 1);
  }
  for (let i = 0; i < plants.length; i++) updatePlant(plants[i], dt);
  updateGardener(dt);
  for (let i = 0; i < L.pegs.length; i++) { if (L.pegs[i].flash > 0) L.pegs[i].flash = Math.max(0, L.pegs[i].flash - dt * 3.2); }

  if (started && !muted && AC && now > nextChirpAt) {
    sndChirp();
    nextChirpAt = now + rand(8, 18);
  }
  ctx.clearRect(0, 0, W, H);
  drawBackground(now);
  drawBoard(now);
  drawMeadow();
  if (bakedGarden) ctx.drawImage(bakedGarden, 0, 0, W, H);
  // depth rows (v2): strictly back → mid → front, with a haze of golden
  // air between rows — a short plant in front can never be hidden
  for (let rI = 0; rI < 3; rI++) {
    const rowPlants = plants.filter(function (p) { return plantRow(p) === rI; })
      .sort(function (a, b) { return (a.yOff || 0) - (b.yOff || 0); });
    for (let i = 0; i < rowPlants.length; i++) drawPlant(rowPlants[i], now);
    for (let i = 0; i < falling.length; i++) if (plantRow(falling[i]) === rI) drawFallingPlant(falling[i]);
    if (rI === 0) drawDepthHaze(0.13);
    else if (rI === 1) drawDepthHaze(0.06);
  }
  drawGardener(now);
  for (let i = 0; i < seeds.length; i++) drawSeedShape(seeds[i].x, seeds[i].y, seeds[i].r, seeds[i].sp);
  drawParticles(dt);
  drawDropper(now);
  drawForegroundGrass(now);
  if (SAMPLE_MODE === 'sheet') drawSampleLabels();
}
resize();
dropperX = W / 2;
buildPackets();
updateHUD();

/* ================================================================
   SAMPLE MODE (art checkpoint) — ?sample=sheet | ?sample=grow&sp=rose&stage=0.6
   ================================================================ */
const SAMPLE_Q = new URLSearchParams(location.search);
const SAMPLE_MODE = SAMPLE_Q.get('sample');
function samplePlant(sp, x, t, scale) {
  const p = makePlant(sp, x, 1);
  p.t = t; p.frozen = true; p.scale = scale; p.yOff = 4;
  p.bloomed = t >= 1; p.popped = true;
  plants.push(p);
  return p;
}
function drawSampleLabels() {
  ctx.textAlign = 'center';
  for (let i = 0; i < plants.length; i++) {
    const p = plants[i];
    const label = p.sp.name;
    ctx.font = '600 13.5px Georgia, serif';
    const wdt = ctx.measureText(label).width + 20;
    const ly = plantBaseY(p) + 28;
    ctx.fillStyle = 'rgba(43,30,14,.78)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x - wdt / 2, ly - 13, wdt, 21, 10); else ctx.rect(p.x - wdt / 2, ly - 13, wdt, 21);
    ctx.fill();
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText(label, p.x, ly + 2);
  }
  ctx.textAlign = 'left';
}
if (SAMPLE_MODE) {
  started = true;
  document.body.style.background = '#3a2812'; // reserved picker strip reads as soil in captures
  el.title.classList.add('hidden');
  el.hud.classList.add('hidden');
  el.picker.classList.add('hidden');
  resize();
  if (SAMPLE_MODE === 'sheet') {
    const ids = ['rosered', 'lotus', 'sunflower', 'sakura', 'glowshroom', 'wisteria'];
    for (let i = 0; i < ids.length; i++) {
      samplePlant(SPECIES_BY_ID[ids[i]], W * (i + 0.5) / ids.length, 1, 1.5);
    }
  } else if (SAMPLE_MODE === 'grow') {
    const sp = SPECIES_BY_ID[SAMPLE_Q.get('sp') || 'rosered'] || SPECIES_BY_ID.rosered;
    const stage = parseFloat(SAMPLE_Q.get('stage') || '1');
    samplePlant(sp, W / 2, clamp(stage, 0, 1), 2.05);
  }
}

/* ================================================================
   TEST HOOK
   ================================================================ */
window.__planko = {
  drop: function () { dropSeed(); },
  aim: function (x) { aimTo(x); },
  start: function () { if (!started) startRound(); },
  select: function (id) { if (id === 'random') selectRandom(); else selectSpecies(id, true); },
  plantNow: function (id, x, growMult) {
    const sp = SPECIES_BY_ID[id];
    if (!sp || !started) return false;
    const p = makePlant(sp, (x == null ? dropperX : x), growMult || 1);
    plants.push(p);
    return true;
  },
  setCineGrow: function (m) { growBoost = m || 1; },
  walkTo: function (x) { gardener.targetX = x; },
  gardener: function () {
    return { x: Math.round(gardener.x), dir: gardener.dir, moving: gardener.moving, swinging: gardener.swingT < 1 };
  },
  plantRows: function () {
    return plants.map(function (p) { return { id: p.sp.id, row: plantRow(p), x: Math.round(p.x), t: Math.round(p.t * 100) / 100, dur: Math.round(p.dur * 100) / 100, bornAt: Math.round(p.bornAt || 0) }; });
  },
  get layoutY() { return L ? { soilBase: Math.round(L.soilBase), meadowTop: Math.round(L.meadowTop), pickerH: Math.round(L.pickerH), H: H, W: W } : null; },
  get grown() { return totalBlooms; },
  speciesTotal: SPECIES.length,
  grownSpecies: function () { return Object.keys(sessionSpecies); },
  get state() {
    return {
      started: started, endless: true,
      inFlight: seeds.length, plants: plants.length, blooms: blooms,
      totalBlooms: totalBlooms, pollen: save.pollen,
      selected: selectedId, mode: randomMode ? 'random' : 'chosen', next: nextId,
      harvested: harvested, journal: Object.keys(save.journal).length
    };
  }
};

requestAnimationFrame(frame);
</script>
