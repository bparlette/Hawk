<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Planko — Seed Garden</title>
<style>
  html, body { height:100%; overflow:hidden; background:#2a1f16; margin:0; padding:0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action:none; color:#fdf6dd;
  }
  h1, h2, p { margin:0; padding:0; }
  #game { position:fixed; inset:0; display:block; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:center; gap:8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
    pointer-events:none;
  }
  .pill {
    background: rgba(38, 30, 16, 0.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color:#f7ecd0; border:1px solid rgba(255, 226, 160, 0.28);
    border-radius:999px; padding:6px 12px;
    font-size:14.5px; font-weight:600; letter-spacing:.02em;
    box-shadow:0 3px 14px rgba(30,15,0,.35);
    white-space:nowrap;
  }
  #meterWrap {
    flex:1; min-width:52px; height:20px;
    background: rgba(38, 30, 16, 0.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border:1px solid rgba(255, 226, 160, 0.28);
    border-radius:999px; overflow:hidden; position:relative;
    box-shadow:0 3px 14px rgba(30,15,0,.35);
  }
  #meterFill {
    height:100%; width:0%;
    background: linear-gradient(90deg, #8fce62, #cde86a 55%, #ffd968);
    border-radius:999px; transition: width .45s ease;
  }
  #meterLabel {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6);
    letter-spacing:.07em;
  }
  .roundBtn {
    pointer-events:auto; cursor:pointer; border:1px solid rgba(255,226,160,.28);
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; line-height:1; color:#f7ecd0;
    background: rgba(38, 30, 16, 0.66);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow:0 3px 14px rgba(30,15,0,.35);
  }
  .roundBtn:active { transform: scale(.93); }

  /* ---------- Seed packet picker ---------- */
  #picker {
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(43,30,14,0), rgba(43,30,14,.55) 30%, rgba(34,23,10,.78));
    pointer-events:none;
  }
  #pickerLabel {
    font-size:11px; font-weight:700; letter-spacing:.14em; color:#ffe9b0;
    text-shadow:0 1px 4px rgba(0,0,0,.65); margin:0 4px 6px; pointer-events:none;
  }
  #packets {
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
    pointer-events:auto; padding-bottom:2px;
    scrollbar-width:thin; scrollbar-color: rgba(255,217,104,.5) transparent;
    -webkit-overflow-scrolling:touch;
  }
  .packet {
    flex:0 0 auto; width:64px; cursor:pointer; position:relative;
    border-radius:10px; padding:5px 4px 6px; text-align:center;
    background: linear-gradient(165deg, rgba(84,58,26,.92), rgba(56,38,17,.94));
    border:1.5px solid rgba(255,226,160,.30);
    box-shadow:0 4px 12px rgba(20,10,0,.4), inset 0 1px 0 rgba(255,240,200,.18);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .packet img { width:40px; height:40px; display:block; margin:0 auto 2px; pointer-events:none; }
  .packet .dice {
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    margin:0 auto 2px; font-size:27px; line-height:1; pointer-events:none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
  }
  .packet .pname {
    font-size:9.5px; line-height:1.15; font-weight:700; color:#f7ecd0;
    text-shadow:0 1px 2px rgba(0,0,0,.6); pointer-events:none;
    display:block; min-height:22px;
  }
  .packet .pcost { font-size:9px; font-weight:700; color:#ffd968; pointer-events:none; display:block; }
  .packet.sel {
    border-color:#ffd968; transform: translateY(-4px);
    box-shadow:0 8px 18px rgba(20,10,0,.5), 0 0 0 2px rgba(255,217,104,.35), inset 0 1px 0 rgba(255,240,200,.25);
  }
  /* ---------- Overlays ---------- */
  .overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background: radial-gradient(ellipse at 50% 36%, rgba(64,40,14,.30), rgba(22,14,5,.72));
    color:#fdf6dd;
  }
  .overlay h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(42px, 10vw, 72px); font-weight:700; letter-spacing:.015em;
    background: linear-gradient(180deg, #fff3c4, #ffd968 58%, #e8a83e);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.55));
  }
  .overlay h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 6vw, 40px); font-weight:700; color:#ffe9a8;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .overlay p {
    margin-top:12px; font-size: clamp(15px, 4.2vw, 20px);
    color:#f3e7c6; text-shadow:0 1px 6px rgba(0,0,0,.65); max-width: 32em; line-height:1.45;
  }
  .overlay .sub { font-size: clamp(13px, 3.6vw, 16px); color:#dcc99a; margin-top:8px; }
  .bigBtn {
    margin-top:26px; pointer-events:auto; cursor:pointer;
    font-family: Georgia, serif; font-size:20px; font-weight:700; color:#4a2f0d;
    background: linear-gradient(180deg, #ffedb0, #ffd968 55%, #f0b84a);
    border:none; border-radius:999px; padding:14px 38px;
    box-shadow: 0 6px 0 #a8742a, 0 14px 30px rgba(0,0,0,.45);
  }
  .bigBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8742a, 0 8px 18px rgba(0,0,0,.4); }
  .ghostBtn {
    margin-top:14px; pointer-events:auto; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; color:#ffe9b0;
    background: rgba(43,30,14,.55); border:1px solid rgba(255,226,160,.4);
    border-radius:999px; padding:10px 26px;
  }
  .hidden { display:none !important; }

  /* ---------- Journal ---------- */
  #journal {
    position:fixed; inset:0; z-index:11; display:flex; flex-direction:column;
    background: linear-gradient(180deg, rgba(30,20,8,.94), rgba(20,13,5,.97));
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  #journal h2 {
    font-family: Georgia, serif; color:#ffe9a8; font-size:26px; text-align:center;
    margin-bottom:4px;
  }
  #journal .jsub { text-align:center; color:#d8c491; font-size:13.5px; margin-bottom:12px; }
  #journalGrid {
    flex:1; overflow-y:auto; display:grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap:10px; align-content:start; padding:2px;
  }
  .jcell {
    background: rgba(84,58,26,.35); border:1px solid rgba(255,226,160,.18);
    border-radius:12px; padding:8px 4px 7px; text-align:center;
  }
  .jcell img { width:52px; height:52px; }
  .jcell .jname { font-size:10.5px; font-weight:700; color:#f7ecd0; line-height:1.2; min-height:25px; }
  .jcell .jcount { font-size:10px; color:#ffd968; font-weight:700; }
  .jcell.undisc img { filter: brightness(0) opacity(.45); }
  .jcell.undisc .jname { color:#9b8b62; }
  #journalClose { align-self:center; margin-top:12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="pill" id="seedPill">🌱 ∞</div>
  <div id="meterWrap"><div id="meterFill"></div><div id="meterLabel">GARDEN 0%</div></div>
  <div class="pill" id="pollenPill">❀ 0</div>
  <button class="roundBtn" id="journalBtn" aria-label="Garden journal">📖</button>
  <button class="roundBtn" id="muteBtn" aria-label="Toggle sound">🔊</button>
</div>

<div id="picker" class="hidden">
  <div id="pickerLabel">CHOOSE A SEED</div>
  <div id="packets"></div>
</div>

<div class="overlay" id="titleScreen">
  <h1>Planko</h1>
  <p>A seed, a pegboard, and a garden that remembers.</p>
  <p class="sub">Drag to aim, let go to drop. Where a seed settles, something beautiful grows.<br>Collect all 38 species in your journal. ✿</p>
  <button class="bigBtn" id="startBtn">Start planting</button>
</div>

<div id="journal" class="hidden">
  <h2>Garden Journal</h2>
  <div class="jsub" id="journalSub">0 of 38 species discovered</div>
  <div id="journalGrid"></div>
  <button class="bigBtn" id="journalClose">Back to the garden</button>
</div>

<script>
'use strict';
/* ================================================================
   PLANKO — SEED GARDEN
   A painted ASMR plinko garden. Canvas-drawn, WebAudio-synthesized,
   zero external assets. An enhancement of Seed Plinko: same heart —
   aim, drop, bounce, grow — with a whole conservatory to collect.
   ================================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* v3 — endless play: no satchel limit, no rounds, no end screen.
   The seed supply is infinite and every species is unlocked. */

/* ---------------- utils ---------------- */
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function easeOutBack(x) { const c = 1.70158; const u = x - 1; return 1 + (c + 1) * u * u * u + c * u * u; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function hexRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(h1, h2, t) {
  const a = hexRgb(h1), b = hexRgb(h2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function rgba(hex, a) {
  const c = hexRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
/* stable hash from a string — per-species deterministic decoration */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

/* ---------------- save ---------------- */
const SAVE_KEY = 'planko-save-v1';
let save = { pollen: 0, unlocked: [], journal: {}, muted: false, best: 0, sel: 'random', harvested: 0 };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------- state ---------------- */
let W = 0, H = 0, DPR = 1;
let started = false;
let seeds = [];        // in flight — several can be airborne at once (v3)
let plants = [];       // planted & growing (and standing garden)
let particles = [];    // soil puffs, sparkles, pollen, floaters
let floaters = [];     // "+5 ❀" pollen text particles
let blooms = 0;        // blooms this session
let sessionPollen = 0; // pollen earned this session
let dropperX = 0;
let lastDropAt = -999;
let nextChirpAt = 0;
let bakedGarden = null; // offscreen canvas of retired plants (silhouette layer)
let selectedId = 'daisy';
let growBoost = 1;      // cinematic slow-grow multiplier for the next plant (test/video use)
/* v2 — random seeds by default */
let randomMode = true;  // "Surprise me" packet is the default selection
let nextId = null;      // species queued for the next drop (random mode)
/* v2 — the gardener */
let harvested = 0;      // plants chopped this session (lifetime total lives in save.harvested)
let falling = [];       // chopped plants mid-tip-over
const keysDown = {};    // held movement keys for the gardener
const gardener = { x: 0, dir: 1, moving: false, walkPhase: 0, swingT: 1, swingCd: 0, targetX: null };

/* layout */
let L = null;

/* ================================================================
   AUDIO — all synthesized, soft by design (ASMR brief)
   ================================================================ */
let AC = null, masterGain = null, padNodes = null;
let muted = !!save.muted;

function initAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {}
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 22; comp.ratio.value = 8;
    comp.connect(AC.destination);
    masterGain = AC.createGain();
    masterGain.gain.value = muted ? 0 : 0.85;
    masterGain.connect(comp);
    startPad();
  } catch (e) { AC = null; }
}

/* warm ambient pad — two detuned triangles through a slow-breathing lowpass */
function startPad() {
  if (!AC || padNodes) return;
  const g = AC.createGain(); g.gain.value = 0.0;
  g.gain.setTargetAtTime(0.016, AC.currentTime, 2.5);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.4;
  const o1 = AC.createOscillator(); o1.type = 'triangle'; o1.frequency.value = 130.81; // C3
  const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 196.00; // G3
  const o3 = AC.createOscillator(); o3.type = 'sine'; o3.frequency.value = 261.63;     // C4
  const g3 = AC.createGain(); g3.gain.value = 0.35;
  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
  const lfoG = AC.createGain(); lfoG.gain.value = 130;
  lfo.connect(lfoG); lfoG.connect(lp.frequency);
  o1.connect(lp); o2.connect(lp); o3.connect(g3); g3.connect(lp);
  lp.connect(g); g.connect(masterGain);
  o1.start(); o2.start(); o3.start(); lfo.start();
  padNodes = { g: g };
}

let noiseBufCache = null;
function noiseBuffer(dur) {
  if (noiseBufCache && dur <= 0.3) return noiseBufCache;
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  if (dur <= 0.3) noiseBufCache = buf;
  return buf;
}

/* marimba plink — peg hits climb a pentatonic ladder as the seed descends */
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // C major pentatonic
function sndPlink(rowFrac, strength) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const idx = clamp(Math.floor(rowFrac * PENTA.length * 1.6), 0, PENTA.length - 1);
  const f = PENTA[PENTA.length - 1 - idx] * (Math.random() < 0.5 ? 1 : 1); // high→low as it falls
  const vol = 0.05 + 0.075 * clamp(strength, 0, 1);
  const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2.0;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.34);
  const g2 = AC.createGain();
  g2.gain.setValueAtTime(vol * 0.30, t);
  g2.gain.exponentialRampToValueAtTime(0.0008, t + 0.12);
  o.connect(g); g.connect(masterGain);
  o2.connect(g2); g2.connect(masterGain);
  o.start(t); o.stop(t + 0.36);
  o2.start(t); o2.stop(t + 0.14);
  // the faintest wooden knock underneath
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(0.03);
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 6;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(vol * 0.35, t);
  ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.03);
  src.connect(bp); bp.connect(ng); ng.connect(masterGain);
  src.start(t); src.stop(t + 0.04);
}

/* soft "pock" — seed nestling into soil */
function sndPock() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.13);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.32, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.18);
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(0.09);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.10, t);
  ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.09);
  src.connect(lp); lp.connect(ng); ng.connect(masterGain);
  src.start(t); src.stop(t + 0.1);
}

/* water-shimmer swell while a plant grows */
function sndShimmer(dur) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(Math.min(dur, 2.5)); src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(700, t);
  bp.frequency.linearRampToValueAtTime(2600, t + dur * 0.85);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.028, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.05);
  // a soft rising gliss under it
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(392, t);
  o.frequency.exponentialRampToValueAtTime(784, t + dur * 0.9);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.016, t + dur * 0.5);
  og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(og); og.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}

/* warm bloom chime — bell arpeggio; luminous blooms get extra sparkle */
function sndChime(luminous) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const base = luminous ? 659.25 : 523.25;
  const notes = [1, 1.25, 1.5];
  if (luminous) notes.push(2, 2.5);
  notes.forEach(function (mult, i) {
    const t0 = t + i * 0.085;
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = base * mult;
    const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = base * mult * 2.76;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(luminous ? 0.075 : 0.09, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (luminous ? 1.3 : 0.95));
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.020, t0 + 0.015);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    o.connect(g); g.connect(masterGain);
    o2.connect(g2); g2.connect(masterGain);
    o.start(t0); o.stop(t0 + 1.4);
    o2.start(t0); o2.stop(t0 + 0.45);
  });
}

/* tiny pop when a bud first opens */
function sndPop() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(320, t);
  o.frequency.exponentialRampToValueAtTime(720, t + 0.07);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.1);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.12);
}

/* soft scythe snick — a quiet filtered-noise swish, for the gardener's chop */
function sndSnick() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(0.16);
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(3400, t);
  bp.frequency.exponentialRampToValueAtTime(900, t + 0.13);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.11, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.15);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.17);
}

/* very soft bird chirp accent */
function sndChirp() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const syllables = 2 + Math.floor(Math.random() * 2);
  for (let s = 0; s < syllables; s++) {
    const t0 = t + s * 0.17;
    const o = AC.createOscillator(); o.type = 'sine';
    const f = rand(2350, 2950);
    o.frequency.setValueAtTime(f, t0);

    o.frequency.exponentialRampToValueAtTime(f * 0.84, t0 + 0.1);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.020, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 0.14);

}

/* a small harp gliss when a packet unlocks */
function sndUnlock() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  [523.25, 659.25, 783.99, 1046.50].forEach(function (f, i) {
    const t0 = t + i * 0.07;
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 0.85);
  });
}

/* ================================================================
   LAYOUT — golden-hour board above a meadow strip
   ================================================================ */
function computeLayout() {
  const u = Math.min(W, H);
  const pickerH = started ? clamp(H * 0.155, 104, 128) : 0;
  const hudH = Math.max(58, H * 0.075);
  const soilBase = H - pickerH - clamp(H * 0.115, 64, 104); // meadow floor line
  const meadowTop = soilBase - clamp(H * 0.06, 34, 58);
  const boardTop = hudH + 52;
  const boardBot = meadowTop - 10;
  const binTop = boardBot - clamp(H * 0.062, 34, 54);

  const pegDx = clamp(W / 15.5, 27, 54);
  const pegDy = clamp((binTop - boardTop) / 8.4, 32, 54);
  const pegs = [];
  let row = 0;
  for (let y = boardTop + pegDy * 0.45; y < binTop - pegDy * 0.3; y += pegDy, row++) {
    const off = (row % 2) ? pegDx / 2 : 0;
    for (let x = pegDx * 0.6 + off; x < W - pegDx * 0.25; x += pegDx) {
      const hsh = hashStr('peg' + Math.round(x) + ':' + Math.round(y));
      pegs.push({ x: x, y: y, row: row, kind: hsh < 0.62 ? 'dew' : (hsh < 0.9 ? 'stone' : 'firefly'), seed: hsh, flash: 0 });
    }
  }
  // reed dividers guiding seeds into the meadow
  const dividers = [];
  const nDiv = Math.max(6, Math.round(W / 92));
  for (let i = 1; i < nDiv; i++) {
    dividers.push({ x: (W / nDiv) * i, y0: binTop, y1: soilBase - 4, sway: hashStr('div' + i) * 6.28 });
  }
  return {
    u: u, hudH: hudH, pickerH: pickerH,
    boardTop: boardTop, boardBot: boardBot, binTop: binTop,
    meadowTop: meadowTop, soilBase: soilBase,
    pegs: pegs, dividers: dividers,
    pegR: clamp(u * 0.0075, 3.2, 5.2),
    seedR: clamp(u * 0.0135, 6, 10),
    dropY: hudH + 22,
    plantScale: clamp(u / 640, 0.62, 1.25)
  };
}
function soilYAt(x) {
  return L.soilBase + Math.sin(x * 0.011 + 1.3) * 3.2 + Math.sin(x * 0.031) * 1.4;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const oldBaked = bakedGarden;
  L = computeLayout();
  bakedGarden = document.createElement('canvas');
  bakedGarden.width = Math.round(W * DPR); bakedGarden.height = Math.round(H * DPR);
  if (oldBaked) {
    const bctx = bakedGarden.getContext('2d');
    bctx.drawImage(oldBaked, 0, 0, W, H);
  }
  dropperX = clamp(dropperX || W / 2, L.seedR + 10, W - L.seedR - 10);
  gardener.x = gardener.x ? clamp(gardener.x, 26, W - 26) : W / 2;
}

function drawBackground(now) {
  // breathing golden-hour sky
  const breathe = 0.5 + 0.5 * Math.sin(now * 0.10);
  const sky = ctx.createLinearGradient(0, 0, 0, L.meadowTop);
  sky.addColorStop(0, mixHex('#7d9fc9', '#8d9fc4', breathe));
  sky.addColorStop(0.42, mixHex('#d9a8b8', '#e2b3a4', breathe));
  sky.addColorStop(0.74, '#f4bd85');
  sky.addColorStop(1, '#ffdf9e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, L.meadowTop + 2);

  // sun + halo
  const sx = W * 0.79, sy = L.boardTop * 0.52;
  const pulse = 1 + Math.sin(now * 0.35) * 0.04;
  const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 130 * pulse);
  sg.addColorStop(0, 'rgba(255,246,200,.95)');
  sg.addColorStop(0.3, 'rgba(255,226,150,.45)');
  sg.addColorStop(1, 'rgba(255,226,150,0)');

  ctx.fillRect(sx - 140, sy - 140, 280, 280);
  ctx.fillStyle = '#fff3bc';
  ctx.beginPath(); ctx.arc(sx, sy, 17, 0, Math.PI * 2); ctx.fill();

  // god rays — slow, soft wedges fanning from the sun
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(Math.sin(now * 0.05) * 0.05);

    const a = 2.25 + i * 0.30 + Math.sin(now * 0.07 + i) * 0.012;

    grd.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(H * 0.95, -26 - i * 6);
    ctx.lineTo(H * 0.95, 26 + i * 6);
