<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LINK UNLEASHED — the full-moveset edition (fan prototype, local only)</title>
<style>
  html,body{margin:0;padding:0;background:#10101c;height:100%;overflow:hidden;font-family:monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;touch-action:none;}
  #cv{position:absolute;inset:0;display:block;background:#5c94fc;image-rendering:pixelated;touch-action:none;}
  /* GamePress mobile default (gptouch): NO fixed D-pad.
     Left half = floating joystick that appears under your thumb wherever you touch.
     Right side = circular action cluster anchored bottom-right. */
  #joyBase{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
    background:rgba(10,14,32,.28);display:none;z-index:6;pointer-events:none;transform:translate(-50%,-50%);}
  #joyBase.on{display:block;}
  #joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.82);
    border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.35);left:50%;top:50%;transform:translate(-50%,-50%);}
  #joyHint{position:absolute;left:14px;bottom:14px;z-index:4;display:none;align-items:center;gap:8px;pointer-events:none;
    color:rgba(255,255,255,.92);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    background:rgba(10,14,32,.32);border:1.5px dashed rgba(255,255,255,.55);border-radius:999px;padding:9px 12px;}
  #joyHint.on{display:flex;}
  #joyHint i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);position:relative;flex:none;}
  #joyHint i::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);}
  .tbtn{position:absolute;display:none;align-items:center;justify-content:center;
    border:2px solid rgba(255,255,255,.72);border-radius:50%;color:#fff;font-weight:800;
    background:rgba(10,14,32,.42);box-shadow:0 3px 10px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
    user-select:none;-webkit-user-select:none;touch-action:none;
    font-family:monospace;text-align:center;z-index:7;line-height:1.05;letter-spacing:.02em;}
  .tbtn.on{display:flex;}
  .tbtn:active,.tbtn.pressed{background:rgba(255,255,255,.42);transform:scale(.94);}
  /* A = primary (JUMP) largest, bottom-right corner. ATK/SPEC cluster around it. */
  #bJump{right:12px;bottom:12px;width:78px;height:78px;font-size:13px;background:rgba(231,64,46,.72);border-color:rgba(255,255,255,.85);}
  #bAtk{right:102px;bottom:12px;width:64px;height:64px;font-size:10px;background:rgba(46,160,60,.55);}
  #bSpec{right:102px;bottom:88px;width:64px;height:64px;font-size:10px;background:rgba(64,110,231,.55);}
</style>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="joyHint"><i></i>Drag — floating stick</div>
  <div class="tbtn" id="bJump">JUMP</div>
  <div class="tbtn" id="bAtk">SWORD</div>
  <div class="tbtn" id="bSpec">BEAM·BOW</div>
</div>
<script>
'use strict';
// ============================================================
// LINK UNLEASHED — the full-moveset sibling of OCARINA OF STRIDE.
// Same Link, same Mario level, but fighter-style controls (GamePress
// floating joystick + action buttons) and Link's complete Zelda II
// special-move kit: sword stab, low stab, upward thrust, downward
// thrust, sword beam (full hearts), fireball, bow & arrow, and the
// FAIRY glide. Fan prototype, local only.
// ============================================================

// ============================== setup ==============================
const TILE = 48, ROWS = 12, COLS = 120;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let VW = 960, VH = 576, SCALE = 1;
function resize(){
  cv.width = innerWidth; cv.height = innerHeight;
  SCALE = cv.height / 576;
  if (cv.width / SCALE < 520) SCALE = cv.width / 520;
  VW = cv.width / SCALE; VH = cv.height / SCALE;
}
addEventListener('resize', resize); resize();
const DEMO = new URLSearchParams(location.search).has('demo');

// ============================== audio (all synthesized) ==============================
const AU = {
  ctx:null, master:null,
  ensure(){
    try{
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.45;
        this.master.connect(this.ctx.destination);
        if (navigator.audioSession) { try{ navigator.audioSession.type = 'playback'; }catch(e){} }
        const b = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
        const s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination); s.start();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){}
  },
  tone(freq, dur, type, vol, slideTo, delay){
    if (!this.ctx) return;
    try{
      const t0 = this.ctx.currentTime + (delay||0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type||'square'; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(vol||0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
    }catch(e){}
  },
  noise(dur, fFrom, fTo, vol, delay){
    if (!this.ctx) return;
    try{
      const t0 = this.ctx.currentTime + (delay||0);
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(fFrom, t0);
      f.frequency.exponentialRampToValueAtTime(Math.max(40,fTo), t0+dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol||0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      src.connect(f); f.connect(g); g.connect(this.master); src.start(t0);
    }catch(e){}
  },
  step(){ this.noise(0.03, 900, 300, 0.05); },
  jump(){ this.tone(300, 0.16, 'sine', 0.20, 700); },
  coin(){ this.tone(988, 0.07, 'square', 0.12); this.tone(1319, 0.28, 'square', 0.12, null, 0.07); },
  stomp(){ this.noise(0.13, 900, 160, 0.30); this.tone(320, 0.14, 'sine', 0.22, 70); },
  bonk(){ this.tone(120, 0.09, 'square', 0.20, 70); },
  kick(){ this.tone(480, 0.10, 'square', 0.16, 940); },
  hurt(){ this.tone(300, 0.28, 'sawtooth', 0.18, 82); },
  swing(){ this.noise(0.08, 3200, 500, 0.16); },
  beam(){ this.tone(1240, 0.22, 'square', 0.14, 240); },
  fire(){ this.noise(0.22, 1400, 240, 0.20); this.tone(180, 0.18, 'sawtooth', 0.08, 60); },
  bowDraw(){ this.tone(240, 0.25, 'sine', 0.06, 420); },
  bow(){ this.tone(760, 0.10, 'triangle', 0.20, 190); this.noise(0.05, 2600, 900, 0.10); },
  glide(){ this.tone(1320, 0.10, 'sine', 0.05, 1760); },
  clear(){ [523,659,784,1047,1319].forEach((f,i)=> this.tone(f, 0.22, 'triangle', 0.16, null, i*0.09)); }
};
addEventListener('pointerdown', ()=>AU.ensure());
addEventListener('keydown', ()=>AU.ensure());
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) AU.ensure(); });

// ============================== assets ==============================
const IMG = {};
function load(name, path){ const im = new Image(); im.src = path; IMG[name] = im; }
['idle_0','walk_0','walk_1','walk_2','crouch_0',
 'jump_rise_0','jump_fall_0','hurt_0','win_0','thrust_0',
 'stab_0','stab_low_0','thrust_up_0','fairy_0','fairy_1']
 .forEach(n => load('link_'+n, 'assets/link/'+n+'.png'));
['beam_0','beam_1','fire_0','fire_1'].forEach(n => load('proj_'+n, 'assets/projectiles/'+n+'.png'));
['ground_top','ground_dirt','qblock_0','qblock_1','qblock_2','used','brick','pipe_top','pipe_body',
 'rupee_0','rupee_1','rupee_2','flag','mountains'].forEach(n => load(n, 'assets/tiles/'+n+'.png'));
['goomba_0','goomba_1','goomba_flat','koopa_0','koopa_1','shell'].forEach(n => load(n, 'assets/enemies/'+n+'.png'));

// ============================== level (same as OCARINA OF STRIDE) ==============================
const GY = 9;
const grid = [];
for (let y=0;y<ROWS;y++){ grid.push(new Array(COLS).fill(' ')); }
function set(x,y,c){ if(x>=0&&x<COLS&&y>=0&&y<ROWS) grid[y][x]=c; }
function groundSpan(x0,x1){ for(let x=x0;x<=x1;x++) for(let y=GY;y<ROWS;y++) set(x,y,'#'); }
groundSpan(0,24); groundSpan(27,47); groundSpan(51,78); groundSpan(81,119);
function pipe(x,h){ const top = GY-h; set(x,top,'['); set(x+1,top,']'); for(let y=top+1;y<GY;y++){ set(x,y,'{'); set(x+1,y,'}'); } }
pipe(18,2); pipe(34,3); pipe(58,2); pipe(88,3);
function blockRow(y, list){ list.forEach(([x,c])=>set(x,y,c)); }
blockRow(5, [[8,'?'],[11,'B'],[12,'?'],[13,'B'],[22,'?'],[30,'?'],[31,'?'],[43,'?'],[44,'B'],[45,'B'],[64,'?'],[65,'B'],[66,'?'],[93,'?']]);
blockRow(6, [[100,'?']]);
function platform(x0,x1,y){ for(let x=x0;x<=x1;x++) set(x,y,'#'); }
platform(52,55,6); platform(70,73,5); platform(82,85,6);
for (let i=0;i<8;i++){ const x=104+i, h=i+1; for(let k=0;k<h;k++) set(x, GY-1-k, 'X'); }
set(115, GY-1, 'X');
const FLAG_X = 115;
const coinSpots = [[25,7],[26,7],[48,7],[49,7],[50,7],[33,4],[34,4],[35,4],[52,5],[53,5],[54,5],[55,5],
 [70,4],[71,4],[72,4],[73,4],[82,5],[83,5],[84,5],[85,5],[105,7],[106,6],[107,5],[108,4],[16,6],[59,6],[60,6]];
let coins = [];
function resetCoins(){ coins = coinSpots.map(([tx,ty])=>({x:tx*TILE+8, y:ty*TILE+6, w:32, h:36, taken:false, ph: Math.random()*6})); }
resetCoins();
const SOLID = new Set(['#','B','?','U','X','[',']','{','}']);
function tileAt(tx,ty){ if(tx<0) return 'X'; if(tx>=COLS||ty>=ROWS) return ' '; if(ty<0) return ' '; return grid[ty][tx]; }
function solidAt(tx,ty){ return SOLID.has(tileAt(tx,ty)); }

// ============================== entities ==============================
const GRAV = 2100, MAXRUN = 335, JUMP_V = 905;
const P = { // player
  x: 2*TILE, y: GY*TILE-86, w: 34, h: 86, vx:0, vy:0, grounded:false,
  face: 1, state:'idle', t:0, hearts:3, coins:0, score:0, invuln:0, coyote:0, jbuf:0,
  safeX: 2*TILE, safeY: GY*TILE-86, dead:false, win:false, deadT:0,
  crouching:false, gliding:false, thrusting:false,
  atkKind:null, atkT:0, atkCd:0, atkHit:new Set(),
  specCd:0, bowCharge:false, specHeld:false, specT:0,
  dist:0
};
let enemies = [];
function findGroundY(e){
  for (let ty=0; ty<ROWS; ty++){ if (solidAt(Math.floor((e.x+e.w/2)/TILE), ty)) return ty*TILE; }
  return ROWS*TILE;
}
function spawnEnemies(){
  enemies = [];
  const defs = [
    ['goomba',14],['goomba',20],['goomba',29],['goomba',39],['goomba',46],['goomba',53],
    ['goomba',56],['goomba',67],['goomba',75],['goomba',90],['goomba',98],
    ['koopa',36],['koopa',61],['koopa',86],['koopa',95]
  ];
  for (const [kind,tx] of defs){
    const isK = kind==='koopa';
    const e = { kind, mode:'walk', x: tx*TILE+6, y: 0, w: isK?34:36, h: isK?66:38,
      vx: -(isK?34:40), vy:0, t: Math.random()*2, dead:false, dying:0, shellVx:0 };
    e.y = findGroundY(e) - e.h;
    enemies.push(e);
  }
}
spawnEnemies();
let particles = [], popups = [], coinPops = [], bumpAnims = [], projectiles = [];
let camX = 0, shake = 0, time = 0, levelTime = 0, flagSlide = 0, started = false;

// ============================== helpers ==============================
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function burst(x,y,n,cols,spd,life,grav){
  spd = spd||160; life = life||0.5; grav = grav===undefined?500:grav;
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=spd*(0.3+Math.random()*0.7);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:life*(0.5+Math.random()*0.5),t:0,
      col:cols[i%cols.length], size:2+Math.random()*3, grav}); }
}
function popup(x,y,txt,col){ popups.push({x,y,txt,col:col||'#fff',t:0}); }
function addScore(n,x,y){ P.score+=n; popup(x,y,'+'+n,'#ffe95a'); }
function sparkle(x,y){
  particles.push({x:x+(Math.random()*30-15), y:y+(Math.random()*26-8), vx:-20-Math.random()*30, vy:8+Math.random()*22,
    life:0.5, t:0, col: Math.random()<0.5?'#fff7ae':'#ffd1f2', size:2+Math.random()*2, grav:-30});
}

// ============================== input — keyboard / touch / bot, ONE path ==============================
const keys = {};
const touch = { left:0, right:0, down:0, up:0, jump:0, atk:0, spec:0 };
const botIn = { left:0, right:0, down:0, up:0, jump:0, atk:0, spec:0 };
const IN = {
  get left(){ return !!(keys.ArrowLeft || keys.KeyA || touch.left || botIn.left); },
  get right(){ return !!(keys.ArrowRight || keys.KeyD || touch.right || botIn.right); },
  get down(){ return !!(keys.ArrowDown || keys.KeyS || touch.down || botIn.down); },
  get up(){ return !!(keys.ArrowUp || keys.KeyW || touch.up || botIn.up); },
  get jump(){ return !!(keys.Space || touch.jump || botIn.jump); },
  get atk(){ return !!(keys.KeyJ || keys.KeyZ || touch.atk || botIn.atk); },
  get spec(){ return !!(keys.KeyK || keys.KeyL || keys.KeyX || touch.spec || botIn.spec); }
};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function bindBtn(id, prop){
  const el = document.getElementById(id);
  const pointers = new Set();
  const on = e => { e.preventDefault(); e.stopPropagation(); AU.ensure(); pointers.add(e.pointerId);
    el.classList.add('pressed'); try{ el.setPointerCapture(e.pointerId); }catch(_){} touch[prop] = 1; };
  const off = e => { pointers.delete(e.pointerId); if (!pointers.size){ el.classList.remove('pressed'); touch[prop] = 0; } };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('bJump', 'jump'); bindBtn('bAtk', 'atk'); bindBtn('bSpec', 'spec');
const isTouchUI = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouchUI) document.querySelectorAll('.tbtn').forEach(b => b.classList.add('on'));
/* --- GamePress floating joystick: left half, spawns under thumb, pointerId-isolated --- */
(function(){
  const base = document.getElementById('joyBase'), knob = document.getElementById('joyKnob'), hint = document.getElementById('joyHint');
  let pid = null, cx = 0, cy = 0;
  const R = 42, DEAD = 10;
  function pos(e){ const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, rx: (e.clientX - r.left) / r.width }; }
  function clear(){ pid = null; touch.left = 0; touch.right = 0; touch.down = 0; touch.up = 0;
    base.classList.remove('on'); knob.style.left = '50%'; knob.style.top = '50%';
    if (isTouchUI && hint) hint.classList.add('on'); }
  if (isTouchUI && hint) hint.classList.add('on');
  stage.addEventListener('pointerdown', e => {
    AU.ensure();
    if (pid !== null) return;
    if (e.target.closest && e.target.closest('.tbtn')) return;
    const p = pos(e);
    if (p.rx > 0.5) return; // left half only — right half is for action buttons
    pid = e.pointerId; cx = p.x; cy = p.y;
    try{ stage.setPointerCapture(pid); }catch(_){}
    base.style.left = cx + 'px'; base.style.top = cy + 'px'; base.classList.add('on');
    if (hint) hint.classList.remove('on');
    e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const p = pos(e);
    let dx = p.x - cx, dy = p.y - cy;
    const d = Math.hypot(dx, dy) || 1, cl = Math.min(d, R);
    const nx = dx / d * cl, ny = dy / d * cl;
    knob.style.left = (50 + nx / 118 * 100) + '%'; knob.style.top = (50 + ny / 118 * 100) + '%';
    touch.left = dx < -DEAD ? 1 : 0;
    touch.right = dx > DEAD ? 1 : 0;
    touch.down = dy > 22 ? 1 : 0;
    touch.up = dy < -22 ? 1 : 0;
  });
  const end = e => { if (e.pointerId === pid) clear(); };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
})();
stage.addEventListener('contextmenu', e => e.preventDefault());

// ============================== physics (ported) ==============================
function moveBody(b, dt, isPlayer){
  b.x += b.vx*dt;
  let ty0 = Math.floor(b.y/TILE), ty1 = Math.floor((b.y+b.h-1)/TILE);
  if (b.vx > 0){ const tx = Math.floor((b.x+b.w)/TILE);
    for(let ty=ty0;ty<=ty1;ty++) if(solidAt(tx,ty)){ b.x = tx*TILE - b.w - 0.01; if(isPlayer) hitWall(tx,ty); b.vx = Math.min(b.vx,0); break; } }
  else if (b.vx < 0){ const tx = Math.floor(b.x/TILE);
    for(let ty=ty0;ty<=ty1;ty++) if(solidAt(tx,ty)){ b.x = (tx+1)*TILE + 0.01; if(isPlayer) hitWall(tx,ty); b.vx = Math.max(b.vx,0); break; } }
  b.y += b.vy*dt;
  let tx0 = Math.floor(b.x/TILE), tx1 = Math.floor((b.x+b.w-1)/TILE);
  b.grounded = false;
  if (b.vy > 0){ const ty = Math.floor((b.y+b.h)/TILE);
    for(let tx=tx0;tx<=tx1;tx++) if(solidAt(tx,ty)){ b.y = ty*TILE - b.h - 0.01; b.vy = 0; b.grounded = true; break; } }
  else if (b.vy < 0){ const ty = Math.floor(b.y/TILE);
    for(let tx=tx0;tx<=tx1;tx++) if(solidAt(tx,ty)){ b.y = (ty+1)*TILE + 0.01; b.vy = 0; if(isPlayer) headBump(tx,ty); break; } }
}
function hitWall(){}
function headBump(tx,ty){
  const c = tileAt(tx,ty);
  if (c==='?'){
    grid[ty][tx]='U';
    coinPops.push({x:tx*TILE+8, y:(ty-1)*TILE, t:0});
    bumpAnims.push({tx,ty,t:0});
    P.coins++; addScore(200, tx*TILE+8, (ty-1)*TILE);
    AU.coin();
  } else if (c==='B' || c==='#'){
    bumpAnims.push({tx,ty,t:0});
    AU.bonk();
  }
}

// ============================== combat ==============================
function toShell(e){
  const cx = e.x + e.w/2;
  e.mode='shell'; e.kind='shell'; e.h=30; e.w=38; e.x = cx-19; e.y += (66-30); e.vx=0; e.shellVx=0; e.t=0;
}
function kickShell(e, dir){
  e.shellVx = dir*390; addScore(50, e.x, e.y-8);
  burst(e.x+e.w/2, e.y+e.h/2, 6, ['#fff','#7ee787'], 140, 0.35);
  AU.kick();
}
function killEnemy(e, pts){
  e.mode='dying'; e.dying=0; e.vy=-300; addScore(pts, e.x, e.y-12);
  burst(e.x+e.w/2, e.y+e.h/2, 10, ['#ffffff','#ffd75a','#c8732a'], 200, 0.5);
}
function swordHit(e){
  // one sword resolution for stab / low stab / up thrust / projectile-less melee
  AU.stomp();
  if (e.mode==='walk'){
    if (e.kind==='koopa'){ toShell(e); addScore(100, e.x, e.y-10); }
    else killEnemy(e, 100);
  } else if (e.mode==='shell'){
    if (e.shellVx===0) kickShell(e, P.face);
    else { e.shellVx = P.face*390; addScore(50, e.x, e.y-8); AU.kick(); } // smack a moving shell away
  }
}
function projHit(pr, e){
  if (e.mode==='walk'){
    if (e.kind==='koopa'){ toShell(e); addScore(100, e.x, e.y-10); AU.stomp(); }
    else { killEnemy(e, 100); }
  } else if (e.mode==='shell' && e.shellVx===0){
    kickShell(e, pr.vx > 0 ? 1 : -1);
  }
}
function attackBox(){
  const cx = P.x + P.w/2;
  if (P.atkKind==='stab') return { x: P.face>0 ? P.x+P.w-6 : P.x-50, y: P.y+22, w:56, h:34 };
  if (P.atkKind==='low') return { x: P.face>0 ? P.x+P.w-6 : P.x-50, y: P.y+P.h-38, w:56, h:32 };
  if (P.atkKind==='up') return { x: cx-16, y: P.y-56, w:32, h:62 };
  return null;
}
function startAttack(kind){
  P.atkKind = kind; P.atkT = 0; P.atkCd = 0.30; P.atkHit = new Set();
  AU.swing();
}
function fireProjectile(kind){
  const cx = P.x + P.w/2;
  const dir = P.face;
  // heights tuned so shots connect with ground enemies (goomba top = feet-38):
  // beam box P.y+34..+58, fire P.y+28..+64, arrow at P.y+38.
  if (kind==='beam'){
    projectiles.push({ kind, x: cx + dir*20 - 24, y: P.y + 34, w:48, h:24, vx: dir*640, vy:0, grav:0, t:0, life:1.15 });
    AU.beam();
  } else if (kind==='fire'){
    projectiles.push({ kind, x: cx + dir*20 - 18, y: P.y + 28, w:36, h:36, vx: dir*395, vy:-70, grav:540, t:0, life:1.6 });
    AU.fire();
  } else if (kind==='arrow'){
    projectiles.push({ kind, x: cx + dir*26 - 26, y: P.y + 38, w:52, h:9, vx: dir*840, vy:0, grav:110, t:0, life:1.05 });
    AU.bow();
  }
  const cy = P.y + 40;
  burst(cx + dir*26, cy, 4, ['#ffffff','#ffe95a'], 90, 0.22, 0);
}
function hurtPlayer(fromX){
  if (P.invuln>0 || P.win || P.dead) return;
  P.hearts--;
  AU.hurt();
  burst(P.x+P.w/2, P.y+30, 10, ['#ff5a4a','#fff'], 200, 0.5);
  shake = Math.max(shake, 6);
  if (P.hearts<=0){ die(); return; }
  P.state='hurt'; P.t=0; P.invuln=1.4;
  P.vx = (fromX > P.x+P.w/2) ? -190 : 70;
  P.vy = -270;
  P.thrusting = false; P.gliding = false; P.bowCharge = false;
}
function die(){
  P.dead = true; P.state='down'; P.t=0; P.deadT=0; P.thrusting=false; P.bowCharge=false; P.gliding=false;
}
function respawn(full){
  P.x = full ? 2*TILE : P.safeX; P.y = full ? GY*TILE-86 : P.safeY;
  P.vx=0; P.vy=0; P.dead=false; P.state='idle'; P.invuln=1.5; P.face=1;
  P.thrusting=false; P.gliding=false; P.bowCharge=false; P.atkKind=null; projectiles = [];
  if (full){
    P.hearts=3; P.coins=0; P.score=0; levelTime=0; flagSlide=0;
    for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) if (grid[y][x]==='U') grid[y][x]='?';
    resetCoins(); spawnEnemies();
  }
  camX = Math.max(0, Math.min(P.x-300, COLS*TILE-VW));
}

// ============================== spectate bot (?demo=1) ==============================
// Drives the SAME IN path as human input via botIn. Showcases the kit:
// stabs the first enemy, beams the next at full hearts, downward-thrusts
// a goomba, fairy-glides the widest pit (tiles 48-50), then finishes.
const Bot = {
  on: DEMO,
  flags: { stab:false, beam:false, thrust:false, glide:false },
  holdJump:0, specTapT:0, atkPulseT:0, phase:null, phaseT:0, thrustTries:0,
  stuckT:0, lastX:0,
  topAt(tx){ for (let ty=0; ty<ROWS; ty++) if (solidAt(tx,ty)) return ty; return -1; },
  nearestAhead(maxD, kinds){
    let best = null, bd = 1e9;
    for (const e of enemies){
      if (e.dead || e.mode==='dying') continue;
      if (kinds && !kinds.includes(e.mode)) continue;
      const d = e.x - (P.x + P.w);
      const dy = Math.abs((e.y + e.h) - (P.y + P.h));
      if (d > -20 && d < maxD && dy < 70 && d < bd){ bd = d; best = { e, d }; }
    }
    return best;
  },
  update(dt){
    const B = botIn;
    if (!this.on) return; // bot off: never stomp botIn (tests/API drive it directly)
    B.left=0; B.right=0; B.down=0; B.up=0; B.atk=0; B.spec=0;
    if (this.holdJump > 0) this.holdJump -= dt;
    if (this.specTapT > 0) this.specTapT -= dt;
    if (this.atkPulseT > 0) this.atkPulseT -= dt;
    B.jump = (this.holdJump > 0 || this.phase === 'gliding') ? 1 : 0;
    B.spec = this.specTapT > 0 ? 1 : 0;
    B.atk = this.atkPulseT > 0 ? 1 : 0;
    if (P.dead || P.win) { B.jump=0; B.spec=0; B.atk=0; return; }
    B.right = 1;
    if (P.lastKill === 'sword') this.flags.stab = true;
    if (P.lastKill === 'beam') this.flags.beam = true;
    if (P.lastKill === 'thrust') this.flags.thrust = true;
    // stuck detection
    if (Math.abs(P.x - this.lastX) < 2 && P.grounded) this.stuckT += dt; else this.stuckT = 0;
    this.lastX = P.x;

    // ---------- glide showcase: the wide pit at tiles 48-50 ----------
    const pitStartX = 48*TILE, pitEndX = 51*TILE;
    if (!this.flags.glide){
      if (this.phase === 'glideHop'){
        if (!P.grounded && P.vy > 20){ this.phase = 'gliding'; }
        if (P.grounded && P.x > pitEndX){ this.flags.glide = true; this.phase = null; }
        else if (P.grounded && P.x + P.w < pitStartX - 60){ this.phase = null; } // respawned: retry later
        return;
      }
      if (this.phase === 'gliding'){
        if (P.grounded){ this.flags.glide = P.x > pitEndX - 40; this.phase = null; }
        return; // jump stays held via phase check above
      }
      if (P.grounded && P.x + P.w >= pitStartX - 190 && P.x < pitStartX){
        this.phase = 'glideHop'; this.holdJump = 0.16; // hop high enough to glide the full width
        return;
      }
    }
    // airborne arrival over the pit approach (e.g. carried in by an enemy bounce):
    // hold jump and fairy-glide across anyway — but only from a safe altitude;
    // a low arrival lands first and takes the proper glideHop instead.
    if (!this.flags.glide && this.phase === null && !P.grounded && P.vy > 0 &&
        P.y + P.h < GY*TILE - 50 &&
        P.x + P.w > pitStartX - 120 && P.x < pitEndX){
      this.phase = 'gliding'; return;
    }
    // ---------- downward-thrust showcase ----------
    if (this.flags.beam && !this.flags.thrust && this.thrustTries < 3){
      if (this.phase === 'thrustJump'){
        this.phaseT += dt;
        if (P.thrusting) this.phaseSawThrust = true;
        if (!P.grounded && this.phaseT > 0.16){ B.down = 1; this.atkPulseT = 0.09; this.phase = 'thrustFall'; }
        if (P.grounded && this.phaseT > 0.1){ this.phase = null; }
        return;
      }
      if (this.phase === 'thrustFall'){
        B.down = 1;
        if (P.thrusting) this.phaseSawThrust = true;
        if (P.grounded){ this.phase = null; if (this.phaseSawThrust) this.thrustTries++; }
        return;
      }
      // only attempt on a CLOSING walker (vx<=0); bounced ones walking away get stabbed instead
      const foe = this.nearestAhead(215, ['walk']);
      if (foe && (foe.e.kind === 'goomba' || foe.e.kind === 'koopa') && foe.e.vx <= 0 &&
          foe.d > 105 && foe.d < 205 && P.grounded){
        // a live shell racing ahead would steal the kill — wait for a clean target
        const shellAhead = enemies.some(e => e.mode==='shell' && e.shellVx !== 0 &&
          e.x > P.x && e.x < foe.e.x + 60);
        if (!shellAhead){
          this.phase = 'thrustJump'; this.phaseT = 0; this.phaseSawThrust = false; this.holdJump = 0.25;
          return;
        }
      }
    }
    // ---------- sword beam showcase (after the stab, while hearts are full) ----------
    // grounded only: a beam fired mid-jump sails over ground enemies.
    if (this.flags.stab && !this.flags.beam && P.hearts >= 3 && P.specCd <= 0 && P.grounded){
      const foe = this.nearestAhead(470, ['walk']);
      if (foe && foe.d > 175){
        // line-of-sight at beam height: don't waste the beam into a pipe side
        const brow = Math.floor((P.y + 46)/TILE);
        let los = true;
        for (let tx = Math.floor((P.x+P.w)/TILE)+1; tx < Math.floor(foe.e.x/TILE); tx++)
          if (solidAt(tx, brow)){ los = false; break; }
        if (los){ this.specTapT = 0.055; this.flags.beam = true; return; }
      }
    }
    if (this.flags.stab && P.hearts < 3) this.flags.beam = true; // window missed (hurt first): don't stall the run

    // ---------- hazards: pits and steps ----------
    const frontTx = Math.floor((P.x + P.w + 4)/TILE);
    const myTop = this.topAt(Math.floor((P.x + P.w/2)/TILE));
    let hazard = null;
    for (let dx=0; dx<=12; dx++){
      const tx = frontTx + dx, top = this.topAt(tx);
      const distPx = tx*TILE - (P.x + P.w);
      if (top === -1){
        let w = 1; while (this.topAt(tx+w) === -1 && w < 8) w++;
        hazard = { type:'pit', dist:distPx, width:w, tx };
        break;
      }
      if (myTop !== -1 && top < myTop && solidAt(tx, myTop-1)){
        hazard = { type:'step', dist:distPx, height: myTop - top };
        break;
      }
    }
    if (hazard && P.grounded && this.holdJump <= 0){
      const sp = Math.max(Math.abs(P.vx), 200);
      if (hazard.type === 'pit'){
        if (!(hazard.tx === 48 && !this.flags.glide) && hazard.dist < sp*0.34 + 26)
          this.holdJump = hazard.width >= 3 ? 0.32 : 0.20;
      } else {
        if (hazard.height >= 3 && hazard.dist < sp*0.52 + 30) this.holdJump = 0.34;
        else if (hazard.height === 2 && hazard.dist < sp*0.30 + 22) this.holdJump = 0.26;
        else if (hazard.height === 1 && hazard.dist < sp*0.26 + 18) this.holdJump = 0.16;
      }
    }
    // returning shell: hop it
    for (const e of enemies){
      if (e.mode === 'shell' && e.shellVx < 0){
        const d = e.x - (P.x + P.w);
        if (d > 0 && d < 140 && P.grounded && this.holdJump <= 0) this.holdJump = 0.26;
      }
    }
    // ---------- sword work: stab anything close on the ground ----------
    const foe = this.nearestAhead(115, ['walk']);
    if (foe && foe.d > 18 && P.grounded && P.atkCd <= 0) this.atkPulseT = 0.07;
    // point blank while the sword is still cooling down: hop to stomp instead of eating contact
    if (foe && foe.d <= 44 && P.grounded && P.atkCd > 0.02 && this.holdJump <= 0) this.holdJump = 0.18;
    // wedged against something: big jump
    if (this.stuckT > 0.6 && P.grounded && this.holdJump <= 0){ this.holdJump = 0.34; this.stuckT = 0; }
  }
};

// ============================== update ==============================
let prevIn = { jump:false, atk:false, spec:false };
let fallV = 0; // vertical speed captured before this frame's move (for stomp tests)
function update(dt){
  time += dt;
  Bot.update(dt);
  P.t += dt;
  if (P.invuln>0) P.invuln-=dt;
  if (P.coyote>0) P.coyote-=dt;
  if (P.jbuf>0) P.jbuf-=dt;
  if (P.atkCd>0) P.atkCd-=dt;
  if (P.specCd>0) P.specCd-=dt;
  if (!P.dead && !P.win && started) levelTime += dt;
  if (P.dead){ P.deadT += dt; if (P.deadT > 0.95) respawn(true); }

  const jEdge = IN.jump && !prevIn.jump, jRel = !IN.jump && prevIn.jump;
  const aEdge = IN.atk && !prevIn.atk;
  const sEdge = IN.spec && !prevIn.spec, sRel = !IN.spec && prevIn.spec;
  prevIn = { jump: IN.jump, atk: IN.atk, spec: IN.spec };
  if (IN.left || IN.right || IN.jump || IN.atk || IN.spec || IN.down || IN.up) started = true;
  if (P.win && (jEdge || aEdge || sEdge)){ respawn(true); }

  // ---------- facing & crouch ----------
  const dir = (IN.right?1:0) - (IN.left?1:0);
  if (dir !== 0 && !P.bowCharge) P.face = dir;
  P.crouching = IN.down && P.grounded && !P.bowCharge && !P.dead && !P.win;

  // ---------- jump ----------
  if (jEdge && !P.dead && !P.win) P.jbuf = 0.12;
  if (P.jbuf > 0 && (P.grounded || P.coyote > 0) && !P.crouching && !P.dead && !P.win){
    P.vy = -JUMP_V; P.grounded = false; P.coyote = 0; P.jbuf = 0; P.gliding = false;
    AU.jump();
    burst(P.x+P.w/2, P.y+P.h, 6, ['#ffffff','#d8cfb0'], 90, 0.28, 200);
  }
  if (jRel && P.vy < -330 && !P.gliding) P.vy = -330; // variable jump height
  // ---------- glide (FAIRY form): hold jump while falling ----------
  if (P.grounded) { P.gliding = false; P.thrusting = false; }
  const wantGlide = IN.jump && !P.grounded && P.vy > 30 && !P.thrusting && !P.bowCharge && !P.dead && !P.win;
  if (wantGlide && !P.gliding){ P.gliding = true; AU.glide(); }
  if (!IN.jump) P.gliding = false;
  if (P.gliding){
    const drift = dir !== 0 ? dir*175 : P.face*140;
    P.vx += Math.max(-620*dt, Math.min(620*dt, drift - P.vx));
    if (Math.random() < 0.55) sparkle(P.x + P.w/2, P.y + P.h - 30);
  }
  // ---------- sword ----------
  if (aEdge && P.atkCd <= 0 && !P.bowCharge && !P.dead && !P.win){
    if (IN.up) startAttack('up');
    else if (!P.grounded && IN.down){ P.thrusting = true; P.gliding = false; P.atkCd = 0.30; AU.swing(); }
    else if (IN.down) startAttack('low');
    else startAttack('stab');
  }
  if (P.atkKind){ P.atkT += dt; if (P.atkT > 0.22){ P.atkKind = null; P.atkT = 0; } }
  // ---------- special: tap = beam/fireball, hold = bow ----------
  if (sEdge && !P.dead && !P.win){ P.specHeld = true; P.specT = 0; }
  if (P.specHeld && IN.spec){
    P.specT += dt;
    if (P.specT >= 0.25 && !P.bowCharge && P.specCd <= 0){ P.bowCharge = true; AU.bowDraw(); }
  }
  if (sRel){
    if (P.bowCharge){ fireProjectile('arrow'); P.specCd = 0.25; }
    else if (P.specHeld && P.specT < 0.25 && P.specCd <= 0 && !P.dead && !P.win){
      if (P.hearts >= 3){ fireProjectile('beam'); P.specCd = 0.30; }
      else { fireProjectile('fire'); P.specCd = 0.45; }
    }
    P.bowCharge = false; P.specHeld = false; P.specT = 0;
  }
  // ---------- horizontal movement ----------
  const rooted = (P.bowCharge && P.grounded) || P.crouching || P.dead || P.win;
  let target = 0;
  if (!rooted && !P.gliding) target = dir * MAXRUN;
  if (P.gliding) target = P.vx; // glide steers vx directly above
  const rate = P.grounded ? (target !== 0 ? 2500 : 3100) : 1600;
  if (!P.gliding) P.vx += Math.max(-rate*dt, Math.min(rate*dt, target - P.vx));
  if (P.grounded) P.dist += Math.abs(P.vx)*dt;
  // ---------- gravity + move ----------
  const wasGrounded = P.grounded;
  fallV = P.vy;
  P.vy += GRAV*dt; if (P.vy > 1150) P.vy = 1150;
  if (P.gliding && P.vy > 58) P.vy = 58;
  moveBody(P, dt, true);
  if (P.grounded){
    P.coyote = 0.09;
    if (!wasGrounded && fallV > 430) burst(P.x+P.w/2, P.y+P.h, 7, ['#fff','#d8cfb0'], 100, 0.3, 200);
    const txC = Math.floor((P.x+P.w/2)/TILE);
    if (solidAt(txC, GY) && solidAt(txC-1, GY) && solidAt(txC+1, GY)){ P.safeX = P.x; P.safeY = P.y; }
  }
  // state label
  if (!P.dead && !P.win && P.state !== 'hurt'){
    if (P.gliding) P.state = 'glide';
    else if (P.bowCharge) P.state = 'bow';
    else if (P.atkKind) P.state = 'atk';
    else if (P.crouching) P.state = 'crouch';
    else if (!P.grounded) P.state = 'air';
    else if (Math.abs(P.vx) > 15) P.state = 'walk';
    else P.state = 'idle';
  }
  if (P.state==='hurt' && P.t>0.45) P.state='idle';
  // ---------- pit fall ----------
  if (P.y > ROWS*TILE + 60 && !P.dead){
    P.hearts--;
    AU.hurt(); shake = Math.max(shake,5);
    if (P.hearts<=0){ die(); }
    else { P.x=P.safeX; P.y=P.safeY-4; P.vx=0; P.vy=0; P.invuln=1.5; P.thrusting=false; P.gliding=false; P.bowCharge=false; }
  }
  // ---------- win ----------
  if (!P.win && P.x+P.w > FLAG_X*TILE+2){
    P.win = true; P.state='win'; P.vx=0; P.bowCharge=false; P.gliding=false; P.thrusting=false;
    addScore(1000, P.x, P.y-20);
    AU.clear();
    burst(FLAG_X*TILE+24, 3*TILE, 26, ['#ff5a4a','#ffe95a','#7ee787','#9adcff'], 260, 0.9, 300);
  }
  if (P.win && flagSlide<5.4) flagSlide += dt*2.4;
  // ---------- rupees ----------
  for (const c of coins){ if(!c.taken && aabb(P, c)){ c.taken=true; P.coins++; addScore(100, c.x, c.y-6);
    AU.coin(); burst(c.x+16, c.y+16, 6, ['#ffd75a','#fff3a0'], 110, 0.35, 0); } }
  for (const cp of coinPops){ cp.t += dt; cp.y -= 150*dt; }
  coinPops = coinPops.filter(cp=>cp.t<0.38);
  for (const b of bumpAnims) b.t += dt;
  bumpAnims = bumpAnims.filter(b=>b.t<0.22);

  // ---------- sword hitbox ----------
  if (P.atkKind && P.atkT <= 0.22){
    const box = attackBox();
    if (box) for (const e of enemies){
      if (e.dead || e.mode==='dying' || P.atkHit.has(e)) continue;
      if (aabb(box, e)){ P.atkHit.add(e); P.lastKill = 'sword'; swordHit(e); }
    }
  }
  // ---------- projectiles ----------
  for (const pr of projectiles){
    pr.t += dt; pr.vy += pr.grav*dt; pr.x += pr.vx*dt; pr.y += pr.vy*dt;
    const pcx = Math.floor((pr.x + pr.w/2)/TILE), pcy = Math.floor((pr.y + pr.h/2)/TILE);
    if (solidAt(pcx, pcy)){ pr.dead = true; burst(pr.x+pr.w/2, pr.y+pr.h/2, 6, ['#fff','#ffd75a'], 120, 0.3, 0); continue; }
    for (const e of enemies){
      if (e.dead || e.mode==='dying') continue;
      if (aabb(pr, e)){ P.lastKill = pr.kind; projHit(pr, e); pr.dead = true; break; }
    }
    if (pr.t > pr.life || pr.x < camX - 500 || pr.x > camX + VW + 500 || pr.y > ROWS*TILE + 80) pr.dead = true;
  }
  projectiles = projectiles.filter(p=>!p.dead);

  // ---------- enemies ----------
  for (const e of enemies){
    if (e.dead) continue;
    e.t += dt;
    if (e.mode==='dying'){ e.dying+=dt; if (e.kind!=='goomba'){ e.vy += GRAV*dt; e.y += e.vy*dt; } if (e.dying>0.45) e.dead=true; continue; }
    if (e.mode==='shell'){
      if (e.shellVx!==0){
        e.vx = e.shellVx;
        const oldVx = e.vx;
        e.vy += GRAV*dt;
        moveBody(e, dt, false);
        if (e.vx===0 && oldVx!==0) e.shellVx = -oldVx;
        for (const o of enemies){ if (o!==e && !o.dead && o.mode==='walk' && aabb(e,o)){ killEnemy(o, 200); P.lastKill='shell'; AU.stomp(); } }
        if (aabb(P,e) && P.invuln<=0 && !P.dead && !P.win){
          const stomp = (fallV>60 || P.vy>60) && (P.y+P.h) - e.y < (P.thrusting ? 36 : 20);
          if (stomp){ e.shellVx=0; P.vy=-520; AU.stomp(); }
          else hurtPlayer(e.x+e.w/2);
        }
      } else {
        e.vy += GRAV*dt; moveBody(e, dt, false);
        if (aabb(P,e) && P.invuln<=0 && !P.dead && !P.win){
          const stomp = (fallV>60 || P.vy>60) && (P.y+P.h) - e.y < (P.thrusting ? 36 : 20);
          if (stomp){ P.vy=-520; kickShell(e, (e.x+e.w/2 >= P.x+P.w/2) ? 1 : -1); }
          else if (P.grounded){ kickShell(e, (e.x+e.w/2 >= P.x+P.w/2) ? 1 : -1); }
        }
      }
      continue;
    }
    // walk mode
    e.vy += GRAV*dt;
    const oldVx = e.vx;
    moveBody(e, dt, false);
    if (e.vx===0 && oldVx!==0) e.vx = -oldVx;
    if (e.y > ROWS*TILE+60){ e.dead=true; continue; }
    if (aabb(P,e) && !P.dead && !P.win){
      const falling = fallV>60 || P.vy>60;
      // a sword-first dive connects from higher up than a boot stomp (frame-step safe)
      const stomp = falling && (P.y+P.h) - e.y < (P.thrusting ? 42 : 22);
      if (stomp){
        if (P.thrusting){
          P.lastKill = 'thrust';
          if (e.kind==='koopa'){ toShell(e); addScore(150, e.x, e.y-10); }
          else killEnemy(e, 150);
          AU.stomp(); P.vy = -565; P.thrusting = false;
        } else {
          P.lastKill = 'stomp';
          if (e.kind==='koopa'){ toShell(e); addScore(100, e.x, e.y-10); AU.stomp(); }
          else killEnemy(e, 100);
          P.vy = -505;
        }
      }
      else if (P.invuln<=0) hurtPlayer(e.x+e.w/2);
    }
  }
  enemies = enemies.filter(e=>!e.dead);

  // ---------- particles / popups / camera ----------
  for (const pt of particles){ pt.t+=dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=pt.grav*dt; }
  particles = particles.filter(p=>p.t<p.life);
  for (const pp of popups){ pp.t+=dt; pp.y -= 34*dt; }
  popups = popups.filter(p=>p.t<0.9);
  if (shake>0) shake = Math.max(0, shake - dt*14);
  const camTarget = Math.max(0, Math.min(P.x + P.w/2 - VW*0.40, COLS*TILE - VW));
  camX += (camTarget - camX) * Math.min(1, dt*7);

  window.__dbg = { x: Math.round(P.x), y: Math.round(P.y), speed: Math.round(Math.abs(P.vx)),
    coins: P.coins, hearts: P.hearts, finished: P.win, time: Math.round(levelTime*10)/10,
    state: P.state, score: P.score, face: P.face, gliding: P.gliding, thrusting: P.thrusting,
    bow: P.bowCharge, atk: P.atkKind, lastKill: P.lastKill || null, projs: projectiles.length,
    flags: Bot.flags };
}

// ============================== render ==============================
function drawFrame(img, cx, feetY, frac){
  if (!img || !img.complete || !img.width) return;
  const w = img.width, h = img.height;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(feetY));
  if (P.face < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, -w*(frac===undefined?0.5:frac), -h, w, h);
  ctx.restore();
}
function drawBow(cx, feetY){
  // Composite weapon: the Zelda II sheet has no bow frames, so the bow is
  // drawn in code over the extended stab pose (arm out = holding the bow).
  const hx = cx + P.face*36, hy = feetY - 56;
  ctx.save();
  ctx.strokeStyle = '#7a4a21'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy - 27);
  ctx.quadraticCurveTo(hx + P.face*17, hy, hx, hy + 27);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(hx, hy - 27); ctx.lineTo(hx, hy + 27); ctx.stroke();
  if (P.specT > 0.34){ // arrow nocked once the draw settles
    ctx.strokeStyle = '#d8b25a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx - P.face*20, hy); ctx.lineTo(hx + P.face*22, hy); ctx.stroke();
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath();
    ctx.moveTo(hx + P.face*30, hy); ctx.lineTo(hx + P.face*19, hy - 4.5); ctx.lineTo(hx + P.face*19, hy + 4.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5a4a';
    ctx.beginPath();
    ctx.moveTo(hx - P.face*20, hy); ctx.lineTo(hx - P.face*26, hy - 5); ctx.lineTo(hx - P.face*24, hy); ctx.lineTo(hx - P.face*26, hy + 5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function linkFrame(){
  if (P.dead || P.state==='down') return { img: IMG.link_hurt_0, frac: 0.5 };
  if (P.state==='win') return { img: IMG.link_win_0, frac: 0.5 };
  if (P.state==='hurt') return { img: IMG.link_hurt_0, frac: 0.5 };
  if (P.state==='glide') return { img: IMG['link_fairy_'+(Math.floor(time*9)%2)], frac: 0.5, fairy: true };
  if (P.state==='bow') return { img: IMG.link_stab_0, frac: 0.28 };
  if (P.atkKind==='stab') return { img: IMG.link_stab_0, frac: 0.28 };
  if (P.atkKind==='low') return { img: IMG.link_stab_low_0, frac: 0.28 };
  if (P.atkKind==='up') return { img: IMG.link_thrust_up_0, frac: 0.5 };
  if (P.thrusting) return { img: IMG.link_thrust_0, frac: 0.5 };
  if (P.state==='crouch') return { img: IMG.link_crouch_0, frac: 0.5 };
  if (P.state==='air') return { img: P.vy < 0 ? IMG.link_jump_rise_0 : IMG.link_jump_fall_0, frac: 0.5 };
  if (P.state==='walk') return { img: IMG['link_walk_'+(Math.floor(P.dist/30)%3)], frac: 0.5 };
  return { img: IMG.link_idle_0, frac: 0.5 };
}
function bumpOffset(tx,ty){ for (const b of bumpAnims) if (b.tx===tx&&b.ty===ty) return -Math.sin((b.t/0.22)*Math.PI)*9; return 0; }

function render(){
  const DY = VH - 576;
  const grad = ctx.createLinearGradient(0,0,0,cv.height);
  grad.addColorStop(0,'#5c94fc'); grad.addColorStop(0.75,'#5c94fc'); grad.addColorStop(1,'#9ecbff');
  ctx.fillStyle = grad; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.scale(SCALE, SCALE);
  const shX = shake ? (Math.random()-0.5)*shake : 0, shY = shake ? (Math.random()-0.5)*shake : 0;
  ctx.translate(shX, shY + DY);
  // clouds (parallax 0.2)
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  for (let i=0;i<16;i++){
    const cx = ((i*431 + 120 - camX*0.2) % (VW + 420) + VW + 420) % (VW + 420) - 160;
    const cy = 30 + (i%4)*36 - DY*0.4;
    ctx.beginPath(); ctx.ellipse(cx, cy, 42, 15, 0, 0, 6.29); ctx.ellipse(cx+30, cy+3, 30, 12, 0, 0, 6.29); ctx.ellipse(cx-32, cy+4, 26, 11, 0, 0, 6.29); ctx.fill();
  }
  // mountains (parallax 0.35)
  const mImg = IMG.mountains, mW = (mImg.width||510)*2.1, mH = 160*2.1;
  if (mImg.complete && mImg.width){
    let startX = -(camX*0.35 % mW); if (startX>0) startX -= mW;
    for (let x=startX; x<VW; x+=mW) ctx.drawImage(mImg, x, GY*TILE - mH + 66, mW, mH);
  }
  // near hill silhouettes (parallax 0.55)
  ctx.fillStyle = 'rgba(46,160,60,0.55)';
  for (let i=0;i<12;i++){
    const hx = ((i*733 + 300 - camX*0.55) % (VW+760) + VW+760) % (VW+760) - 380;
    ctx.beginPath(); ctx.ellipse(hx, GY*TILE+30, 170, 52, 0, Math.PI, 0); ctx.fill();
  }

  ctx.save(); ctx.translate(-Math.round(camX), 0);
  // tiles — pipes blit ONCE across both tiles (pipe_top / pipe_body): one fat pipe, no center seam
  const tx0 = Math.max(0, Math.floor(camX/TILE)-1), tx1 = Math.min(COLS-1, Math.floor((camX+VW)/TILE)+1);
  for (let ty=0; ty<ROWS; ty++) for (let tx=tx0; tx<=tx1; tx++){
    const c = grid[ty][tx]; if (c===' ') continue;
    const dx = tx*TILE, dy = ty*TILE + (c==='?'||c==='B'||c==='U' ? bumpOffset(tx,ty) : 0);
    let img = null;
    if (c==='#') img = solidAt(tx,ty-1) ? IMG.ground_dirt : IMG.ground_top;
    else if (c==='?') img = IMG['qblock_'+(Math.floor(time*3)%3)];
    else if (c==='U') img = IMG.used;
    else if (c==='B') img = IMG.brick;
    else if (c==='X') img = IMG.used;
    else if (c==='[') img = IMG.pipe_top;
    else if (c==='{') img = IMG.pipe_body;
    if (img) ctx.drawImage(img, dx, dy, (c==='['||c==='{') ? TILE*2 : TILE, TILE);
  }
  // bushes
  ctx.fillStyle = '#2d9e2d';
  for (const bx of [5, 27.5, 47.5, 68, 97]){
    const sx = bx*TILE; if (sx < camX-100 || sx > camX+VW+100) continue;
    ctx.beginPath(); ctx.ellipse(sx, GY*TILE-8, 44, 17, 0, 0, 6.29); ctx.ellipse(sx+34, GY*TILE-6, 30, 13, 0, 0, 6.29); ctx.fill();
  }
  // flagpole
  const fx = FLAG_X*TILE + 22;
  ctx.fillStyle = '#1a8c1a'; ctx.fillRect(fx-2, TILE, 4, (GY-1)*TILE - TILE);
  ctx.fillStyle = '#0d5c0d'; ctx.beginPath(); ctx.arc(fx, TILE-6, 7, 0, 6.29); ctx.fill();
  const flagY = TILE + 6 + flagSlide*TILE;
  if (IMG.flag.complete) ctx.drawImage(IMG.flag, fx-46, flagY, 44, 44);
  // rupees
  for (const c of coins){ if (c.taken) continue;
    if (c.x < camX-60 || c.x > camX+VW+60) continue;
    const f = Math.floor((time*7 + c.ph)%3);
    const bob = Math.sin(time*3 + c.ph)*2;
    ctx.drawImage(IMG['rupee_'+f], c.x+6, c.y+bob, 36, 36);
  }
  for (const cp of coinPops) ctx.drawImage(IMG.rupee_0, cp.x, cp.y, 32, 32);
  // enemies
  for (const e of enemies){
    if (e.dead) continue;
    if (e.x < camX-90 || e.x > camX+VW+90) continue;
    const cx = e.x + e.w/2, feet = e.y + e.h;
    let img;
    if (e.mode==='dying' && e.kind==='goomba') img = IMG.goomba_flat;
    else if (e.mode==='shell') img = IMG.shell;
    else if (e.kind==='goomba') img = IMG['goomba_'+(Math.floor(e.t*6)%2)];
    else img = IMG['koopa_'+(Math.floor(e.t*5)%2)];
    const dw = e.mode==='shell' ? 42 : (e.kind==='koopa' ? 40 : 42);
    const dh = e.mode==='shell' ? 34 : (e.kind==='koopa' ? 72 : 42);
    ctx.save();
    if (e.mode==='dying' && e.kind!=='goomba'){ ctx.translate(cx, feet-10); ctx.rotate(Math.PI); ctx.translate(-cx, -(feet-10));
      ctx.globalAlpha = Math.max(0, 1 - e.dying*1.4); }
    const flip = e.mode==='walk' && e.vx>0;
    ctx.translate(cx, feet); if (flip) ctx.scale(-1,1);
    ctx.drawImage(img, -dw/2, -dh, dw, dh);
    ctx.restore();
  }
  // projectiles
  for (const pr of projectiles){
    const pcx = pr.x + pr.w/2, pcy = pr.y + pr.h/2;
    if (pr.kind==='beam'){
      const img = IMG['proj_beam_'+(Math.floor(time*14)%2)];
      if (img && img.complete){ ctx.save(); ctx.translate(pcx, pcy); if (pr.vx<0) ctx.scale(-1,1);
        ctx.drawImage(img, -24, -12, 48, 24); ctx.restore(); }
    } else if (pr.kind==='fire'){
      const img = IMG['proj_fire_'+(Math.floor(time*12)%2)];
      if (img && img.complete){ ctx.save(); ctx.translate(pcx, pcy); ctx.rotate(time*9*(pr.vx>0?1:-1));
        ctx.drawImage(img, -18, -18, 36, 36); ctx.restore(); }
    } else if (pr.kind==='arrow'){
      ctx.save(); ctx.translate(pcx, pcy); ctx.rotate(Math.atan2(pr.vy, pr.vx));
      ctx.strokeStyle = '#d8b25a'; ctx.lineWidth = 3.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(18, 0); ctx.stroke();
      ctx.fillStyle = '#e8e8f0';
      ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(16, -5); ctx.lineTo(16, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff5a4a';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-33, -6); ctx.lineTo(-30, 0); ctx.lineTo(-33, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // player
  if (!(P.invuln>0 && Math.floor(time*14)%2===0) || P.dead){
    const fr = linkFrame();
    const pcx = P.x + P.w/2;
    if (fr.fairy){
      const bob = Math.sin(time*7)*3;
      drawFrame(fr.img, pcx, P.y + P.h - 18 + bob, fr.frac);
    } else {
      drawFrame(fr.img, pcx, P.y + P.h, fr.frac);
    }
    if (P.state==='bow') drawBow(pcx, P.y + P.h);
  }
  // bow-charge meter
  if (P.bowCharge){
    const bw = 54, bx = P.x + P.w/2 - bw/2, by = P.y - 20;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(bx-2, by-2, bw+4, 10);
    ctx.fillStyle = P.specT > 0.34 ? '#ffe95a' : '#9adcff';
    ctx.fillRect(bx, by, bw * Math.min(1, P.specT/0.5), 6);
  }
  // particles
  for (const pt of particles){ ctx.globalAlpha = Math.max(0, 1 - pt.t/pt.life); ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size); }
  ctx.globalAlpha = 1;
  // popups
  ctx.font = 'bold 17px monospace'; ctx.textAlign = 'center';
  for (const pp of popups){ ctx.globalAlpha = Math.max(0, 1 - pp.t/0.9); ctx.fillStyle = '#3a2400';
    ctx.fillText(pp.txt, pp.x+1, pp.y+1); ctx.fillStyle = pp.col; ctx.fillText(pp.txt, pp.x, pp.y); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore(); // world
  ctx.restore(); // view

  // ================= HUD (screen space) =================
  const W = cv.width, H = cv.height;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0,0,W,44);
  ctx.font = 'bold 20px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + String(P.score).padStart(6,'0'), 16, 29);
  const coinX = Math.min(280, W*0.30);
  if (IMG.rupee_0.complete) ctx.drawImage(IMG.rupee_0, coinX, 8, 26, 26);
  ctx.fillText('RUPEES × ' + String(P.coins).padStart(2,'0'), coinX+32, 29);
  const mm = Math.floor(levelTime/60), ss = (levelTime%60);
  ctx.fillText('TIME ' + mm + ':' + (ss<10?'0':'') + ss.toFixed(1), Math.min(520, W*0.55), 29);
  for (let i=0;i<3;i++){
    const hx = W-120 + i*38, hy = 12;
    ctx.fillStyle = i < P.hearts ? '#ff4757' : 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(hx+11, hy+20);
    ctx.bezierCurveTo(hx-6, hy+6, hx+2, hy-6, hx+11, hy+4);
    ctx.bezierCurveTo(hx+20, hy-6, hx+28, hy+6, hx+11, hy+20);
    ctx.fill();
  }
  if (P.hearts>=3 && !P.win && !P.dead){
    ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#9adcff'; ctx.textAlign = 'right';
    ctx.fillText('⚡ SWORD BEAM READY', W-14, 58);
    ctx.textAlign = 'left';
  }
  if (!started && !DEMO){
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, H/2-118, W, 226);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe95a'; ctx.font = 'bold 44px monospace';
    ctx.fillText('LINK UNLEASHED', W/2, H/2-64);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 17px monospace';
    ctx.fillText('The full-moveset edition — sword, beam, bow, and fairy glide', W/2, H/2-32);
    ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#cfe3ff';
    ctx.fillText('MOVE: floating stick / arrows · JUMP: Space or button — hold JUMP in air to glide as the FAIRY', W/2, H/2+6);
    ctx.fillText('SWORD (J): stab · ↓+J low stab · ↑+J upward thrust · ↓+J in air = DOWNWARD THRUST', W/2, H/2+32);
    ctx.fillText('SPECIAL (K): tap = sword beam at full hearts, fireball below · hold = BOW & ARROW', W/2, H/2+58);
    ctx.fillStyle = '#ffe95a'; ctx.font = 'bold 15px monospace';
    ctx.fillText('Stomp, bonk ? blocks, kick shells — reach the flagpole!', W/2, H/2+88);
    ctx.textAlign = 'left';
  }
  if (P.win){
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, H/2-90, W, 160);
    ctx.fillStyle = '#ffe95a'; ctx.font = 'bold 54px monospace'; ctx.textAlign='center';
    ctx.fillText('TRIFORCE GET!', W/2, H/2-22);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace';
    ctx.fillText('Time ' + mm + ':' + (ss<10?'0':'') + ss.toFixed(1) + ' · Rupees ' + P.coins + ' · Score ' + P.score, W/2, H/2+24);
    ctx.font = 'bold 16px monospace';
    ctx.fillText('Press JUMP, SWORD or SPECIAL to run it again', W/2, H/2+52);
    ctx.textAlign='left';
  }
  if (P.dead){
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace'; ctx.textAlign='center';
    ctx.fillText('LINK IS DOWN!', W/2, H/2);
    ctx.textAlign='left';
  }
}

// ============================== loop ==============================
let last = performance.now();
function frame(now){
  let dt = Math.min(0.033, (now-last)/1000); last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { P, enemies: ()=>enemies, projectiles: ()=>projectiles, grid, IN, botIn, Bot,
  respawn, spawnEnemies, fireProjectile };
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
