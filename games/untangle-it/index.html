<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UNTANGLE IT!</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e1a;height:100%;overflow:hidden}
  #cv{display:block;width:100vw;height:100vh;touch-action:none}
</style>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* ================= UNTANGLE IT! =================
   Drag the beads. Zero crossings. Beat the clock.
   Knots are built by permuting node positions away from a recorded
   solved layout, so every knot is provably untangleable.            */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let HUD_H = 96, FIELD = { x: 10, y: 106, w: 400, h: 744 };

function layout() {
  const old = { ...FIELD };
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  HUD_H = Math.max(64, Math.round(H * 0.115));
  FIELD = { x: 10, y: HUD_H + 8, w: W - 20, h: H - HUD_H - 18 };
  if (ropes.length && old.w > 0) {
    const sx = FIELD.w / old.w, sy = FIELD.h / old.h;
    for (const r of ropes) for (const n of r.nodes) {
      n.x = FIELD.x + (n.x - old.x) * sx; n.y = FIELD.y + (n.y - old.y) * sy;
    }
    for (const row of solution) for (const p of row) {
      p.x = FIELD.x + (p.x - old.x) * sx; p.y = FIELD.y + (p.y - old.y) * sy;
    }
  }
}

const PALETTE = [
  { main: '#ff5d5d', dark: '#a52a2a', lite: '#ffb3ab' },
  { main: '#ffc53d', dark: '#a8740a', lite: '#ffe9a8' },
  { main: '#3ddc97', dark: '#177a52', lite: '#b2f4d8' },
  { main: '#4dc3ff', dark: '#1c6396', lite: '#bde7ff' },
  { main: '#b388ff', dark: '#5f4396', lite: '#e2d2ff' },
  { main: '#ff7ad9', dark: '#96306f', lite: '#ffc7ef' },
];

/* ---------------- state ---------------- */
let state = 'title';           // title | play | celebrate | over
let ropes = [];                // [{ci, nodes:[{x,y}]}]
let solution = [];             // solved positions per rope/node
let level = 1, score = 0, best = +(localStorage.getItem('untangle-best') || 0);
let knotsCleared = 0, combo = 0, lastClearAt = -99;
let timeLeft = 60, elapsed = 0, startCross = 0, crossCount = 0, crossPts = [];
let celebT = 0, shake = 0, nowS = 0;
let particles = [], floaters = [];
let drag = null;               // {rope, idx, dx, dy, tx, ty, speed, moved}
let startBtn = null, againBtn = null;
let lastTickSec = -1;

/* ---------------- audio (synth, iOS rules) ---------------- */
let AC = null, master = null, slideGain = null, slideFilter = null;
function audioInit() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    // looping noise for strand slide
    const len = AC.sampleRate * 1.2, buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    slideFilter = AC.createBiquadFilter(); slideFilter.type = 'bandpass'; slideFilter.frequency.value = 500; slideFilter.Q.value = 1.1;
    slideGain = AC.createGain(); slideGain.gain.value = 0;
    src.connect(slideFilter); slideFilter.connect(slideGain); slideGain.connect(master);
    src.start();
    // silent buffer kick inside the gesture (iOS unlock)
    const b2 = AC.createBuffer(1, 1, AC.sampleRate), s2 = AC.createBufferSource();
    s2.buffer = b2; s2.connect(master); s2.start();
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, when = 0) {
  if (!AC) return; const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function popSound() { tone(560 + Math.random() * 420, 240, 0.09, 'sine', 0.22); }
function grabSound() { tone(200, 140, 0.05, 'square', 0.06); }
function tickSound() { tone(1050, 1050, 0.03, 'square', 0.05); }
function clearJingle() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.16, i * 0.07));
  tone(1319, 1319, 0.3, 'sine', 0.1, 0.3);
}
function overSting() { [392, 330, 262].forEach((f, i) => tone(f, f * 0.94, 0.22, 'triangle', 0.15, i * 0.16)); }
addEventListener('pointerdown', () => audioInit(), { passive: true });
addEventListener('touchend', () => { if (AC && AC.state === 'suspended') AC.resume(); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state === 'suspended') AC.resume(); });

/* ---------------- knot generation ----------------
   Solved layout: each rope lives in its own horizontal band as a gentle
   sine — zero crossings by construction. Scramble = K random swaps of
   node positions (a permutation). The inverse permutation is the proof:
   dragging every node back to its recorded slot always solves it.     */
function levelCfg(n) {
  return {
    R: Math.min(3 + Math.floor((n - 1) / 2), 6),
    M: Math.min(5 + Math.floor((n - 1) / 2), 8),
    swaps: 8 + 4 * n,
    minCross: 4 + 2 * n,
  };
}
function buildSolved(cfg) {
  const { R, M } = cfg, F = FIELD, bandH = F.h / R, out = [];
  for (let i = 0; i < R; i++) {
    const row = [], cy = F.y + bandH * (i + 0.5);
    for (let j = 0; j < M; j++) {
      row.push({
        x: F.x + F.w * (j + 0.5) / M + (Math.random() - 0.5) * F.w * 0.03,
        y: cy + Math.sin(j * 1.25 + i * 2.1) * bandH * 0.16,
      });
    }
    out.push(row);
  }
  return out;
}
function countCrossings(rr) {
  let count = 0; const pts = [];
  const segs = [];
  rr.forEach((rope, ri) => {
    for (let j = 0; j < rope.nodes.length - 1; j++)
      segs.push({ ri, j, a: rope.nodes[j], b: rope.nodes[j + 1] });
  });
  const orient = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  for (let i = 0; i < segs.length; i++) for (let k = i + 1; k < segs.length; k++) {
    const s = segs[i], t = segs[k];
    if (s.a === t.a || s.a === t.b || s.b === t.a || s.b === t.b) continue;
    if (s.ri === t.ri && Math.abs(s.j - t.j) <= 1) continue;
    const d1 = orient(t.a, t.b, s.a), d2 = orient(t.a, t.b, s.b);
    const d3 = orient(s.a, s.b, t.a), d4 = orient(s.a, s.b, t.b);
    if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) {
      count++;
      const den = (s.a.x - s.b.x) * (t.a.y - t.b.y) - (s.a.y - s.b.y) * (t.a.x - t.b.x);
      if (den !== 0) {
        const u = ((s.a.x - t.a.x) * (t.a.y - t.b.y) - (s.a.y - t.a.y) * (t.a.x - t.b.x)) / den;
        pts.push({ x: s.a.x + u * (s.b.x - s.a.x), y: s.a.y + u * (s.b.y - s.a.y) });
      }
    }
  }
  return { count, pts };
}
function genLevel(n) {
  const cfg = levelCfg(n);
  let bestTry = null, bestCount = -1;
  for (let attempt = 0; attempt < 300; attempt++) {
    const solved = buildSolved(cfg);
    const slots = [];
    solved.forEach((row, i) => row.forEach((p, j) => slots.push({ i, j, x: p.x, y: p.y })));
    const pos = slots.map(s => ({ x: s.x, y: s.y }));
    for (let s = 0; s < cfg.swaps; s++) {
      let a = (Math.random() * pos.length) | 0, b = (Math.random() * pos.length) | 0;
      if (a === b) { s--; continue; }
      const tmp = pos[a]; pos[a] = pos[b]; pos[b] = tmp;
    }
    const rr = solved.map((row, i) => ({
      ci: i % PALETTE.length,
      nodes: row.map((p, j) => {
        const slot = slots.findIndex(s => s.i === i && s.j === j);
        return { x: pos[slot].x, y: pos[slot].y };
      }),
    }));
    const { count } = countCrossings(rr);
    if (count > bestCount) { bestCount = count; bestTry = { rr, solved }; }
    if (count >= cfg.minCross) break;
  }
  ropes = bestTry.rr; solution = bestTry.solved;
  const c = countCrossings(ropes);
  crossCount = c.count; crossPts = c.pts; startCross = c.count;
  elapsed = 0; drag = null;
}

/* ---------------- particles / floaters ---------------- */
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.7 + Math.random() * 0.5, t: 0, color, size: 2 + Math.random() * 3.5 });
  }
}
function floater(x, y, text, color) { floaters.push({ x, y, text, color, t: 0, life: 1.15 }); }

/* ---------------- game flow ---------------- */
function startGame() {
  score = 0; level = 1; knotsCleared = 0; combo = 0; lastClearAt = -99;
  timeLeft = 60; genLevel(1); state = 'play';
}
function onClear() {
  knotsCleared++;
  combo = (nowS - lastClearAt <= 12) ? combo + 1 : 1;
  lastClearAt = nowS;
  const mult = Math.min(1 + 0.5 * (combo - 1), 3);
  const pts = Math.round((200 + 20 * startCross + 5 * Math.floor(timeLeft)) * mult);
  score += pts;
  const bonus = 6 + level;
  timeLeft = Math.min(99, timeLeft + bonus);
  floater(FIELD.x + FIELD.w / 2, FIELD.y + FIELD.h * 0.4, '+' + pts, '#ffe066');
  floater(FIELD.x + FIELD.w / 2, FIELD.y + FIELD.h * 0.4 + 36, '+' + bonus + 's', '#3ddc97');
  for (const r of ropes) for (const n of r.nodes) burst(n.x, n.y, PALETTE[r.ci].main, 3);
  burst(FIELD.x + FIELD.w / 2, FIELD.y + FIELD.h / 2, '#ffffff', 26);
  clearJingle(); shake = 5; celebT = 0.95; state = 'celebrate';
}
function gameOver() {
  state = 'over'; overSting();
  if (score > best) { best = score; localStorage.setItem('untangle-best', '' + best); }
  if (slideGain) slideGain.gain.setTargetAtTime(0, AC.currentTime, 0.03);
}

/* ---------------- input (pointer-native drag) ---------------- */
function toGame(e) { return { x: e.clientX, y: e.clientY }; }
function hitButton(b, p) { return b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
cv.addEventListener('pointerdown', e => {
  audioInit();
  const p = toGame(e);
  if (state === 'title') { if (hitButton(startBtn, p)) { grabSound(); startGame(); } return; }
  if (state === 'over') { if (hitButton(againBtn, p)) { grabSound(); startGame(); } return; }
  if (state !== 'play') return;
  // nearest node within grab radius
  let bd = 34, br = -1, bi = -1;
  ropes.forEach((r, ri) => r.nodes.forEach((n, ni) => {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < bd) { bd = d; br = ri; bi = ni; }
  }));
  if (br >= 0) {
    const n = ropes[br].nodes[bi];
    drag = { ri: br, ni: bi, dx: n.x - p.x, dy: n.y - p.y, tx: n.x, ty: n.y, px: p.x, py: p.y, speed: 0 };
    cv.setPointerCapture(e.pointerId);
    grabSound();
  }
});
cv.addEventListener('pointermove', e => {
  if (!drag || state !== 'play') return;
  const p = toGame(e);
  const F = FIELD, m = 16;
  drag.tx = Math.max(F.x + m, Math.min(F.x + F.w - m, p.x + drag.dx));
  drag.ty = Math.max(F.y + m, Math.min(F.y + F.h - m, p.y + drag.dy));
  drag.speed = Math.hypot(p.x - drag.px, p.y - drag.py);
  drag.px = p.x; drag.py = p.y;
});
function endDrag() {
  if (drag && slideGain && AC) slideGain.gain.setTargetAtTime(0, AC.currentTime, 0.04);
  drag = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---------------- update ---------------- */
let prevCross = 0;
function update(dt) {
  nowS += dt;
  if (state === 'play') {
    timeLeft -= dt; elapsed += dt;
    if (timeLeft <= 5.05 && timeLeft > 0 && Math.ceil(timeLeft) !== lastTickSec) { lastTickSec = Math.ceil(timeLeft); tickSound(); }
    if (timeLeft <= 0) { timeLeft = 0; gameOver(); }
    if (drag) {
      const n = ropes[drag.ri].nodes[drag.ni];
      n.x += (drag.tx - n.x) * 0.55; n.y += (drag.ty - n.y) * 0.55;
      if (AC && slideGain) {
        const sp = drag.speed;
        slideGain.gain.setTargetAtTime(Math.min(0.20, sp * 0.012), AC.currentTime, 0.03);
        slideFilter.frequency.setTargetAtTime(280 + Math.min(1600, sp * 55), AC.currentTime, 0.03);
        drag.speed *= 0.8;
      }
    }
    const c = countCrossings(ropes);
    if (c.count < prevCross && state === 'play') {
      popSound();
      if (drag) burst(ropes[drag.ri].nodes[drag.ni].x, ropes[drag.ri].nodes[drag.ni].y, '#ffffff', 5);
    }
    crossCount = c.count; crossPts = c.pts; prevCross = c.count;
    if (crossCount === 0 && ropes.length) onClear();
  } else if (state === 'celebrate') {
    celebT -= dt;
    // transformation payoff: cords glide into their neat solved lanes
    ropes.forEach((r, ri) => r.nodes.forEach((n, ni) => {
      const s = solution[ri][ni];
      n.x += (s.x - n.x) * Math.min(1, dt * 7);
      n.y += (s.y - n.y) * Math.min(1, dt * 7);
    }));
    const c = countCrossings(ropes); crossCount = c.count; crossPts = c.pts; prevCross = 0;
    if (celebT <= 0) { level++; genLevel(level); state = 'play'; }
  }
  for (const pt of particles) { pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 130 * dt; }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) { f.t += dt; f.y -= 44 * dt; }
  floaters = floaters.filter(f => f.t < f.life);
  if (shake > 0) shake = Math.max(0, shake - dt * 22);
}

/* ---------------- draw ---------------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawRope(r) {
  const P = PALETTE[r.ci], ns = r.nodes;
  const pass = (style, wdt) => {
    ctx.strokeStyle = style; ctx.lineWidth = wdt; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ns[0].x, ns[0].y);
    for (let i = 1; i < ns.length; i++) ctx.lineTo(ns[i].x, ns[i].y);
    ctx.stroke();
  };
  pass(P.dark, 14); pass(P.main, 9.5); pass(P.lite, 3);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // bg
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 60, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, '#171c33'); g.addColorStop(1, '#0b0e1a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // field
  ctx.fillStyle = 'rgba(255,255,255,0.045)'; rr(FIELD.x, FIELD.y, FIELD.w, FIELD.h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; rr(FIELD.x, FIELD.y, FIELD.w, FIELD.h, 18); ctx.stroke();
  // ropes
  for (const r of ropes) drawRope(r);
  // crossing markers — the visible "knots" left to undo
  if (state === 'play' || state === 'title') {
    for (const p of crossPts) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, 7);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#e63946'; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fillStyle = '#e63946'; ctx.fill();
    }
  }
  // beads
  ropes.forEach((r, ri) => {
    const P = PALETTE[r.ci];
    r.nodes.forEach((n, ni) => {
      const isDrag = drag && drag.ri === ri && drag.ni === ni;
      const rad = isDrag ? 13 : 10.5;
      if (isDrag) { ctx.beginPath(); ctx.arc(n.x, n.y, 19, 0, 7); ctx.fillStyle = 'rgba(255,255,255,0.20)'; ctx.fill(); }
      ctx.beginPath(); ctx.arc(n.x, n.y, rad, 0, 7);
      ctx.fillStyle = P.main; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = P.dark; ctx.stroke();
      ctx.beginPath(); ctx.arc(n.x - rad * 0.3, n.y - rad * 0.32, rad * 0.3, 0, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
    });
  });
  // particles + floaters
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.font = '900 30px system-ui, sans-serif'; ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}
function drawHUD() {
  ctx.textAlign = 'left'; ctx.fillStyle = '#8b93b8';
  ctx.font = '700 11px system-ui, sans-serif';
  ctx.fillText('SCORE', 14, 24);
  ctx.fillText('LEVEL', W - 118, 24);
  ctx.fillText('KNOTS LEFT', W - 118, 62);
  ctx.fillStyle = '#fff'; ctx.font = '900 26px system-ui, sans-serif';
  ctx.fillText('' + score, 14, 54);
  ctx.textAlign = 'right';
  ctx.fillText('' + level, W - 14, 54);
  ctx.fillStyle = crossCount <= 3 && state === 'play' ? '#3ddc97' : '#ffd166';
  ctx.fillText('' + crossCount, W - 14, 92);
  // timer: big seconds + bar (center)
  const tw = Math.min(148, W * 0.35), tx = (W - tw) / 2;
  const frac = Math.max(0, Math.min(1, timeLeft / 60));
  ctx.textAlign = 'center';
  ctx.fillStyle = timeLeft <= 10 && state === 'play' ? '#ff5d5d' : '#fff';
  ctx.font = '900 30px system-ui, sans-serif';
  ctx.fillText(Math.ceil(timeLeft) + '', W / 2, 42);
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; rr(tx, 52, tw, 10, 5); ctx.fill();
  ctx.fillStyle = timeLeft <= 10 && state === 'play' ? '#ff5d5d' : '#3ddc97';
  if (frac > 0) { rr(tx, 52, tw * frac, 10, 5); ctx.fill(); }
  if (combo > 1 && state !== 'title') {
    ctx.fillStyle = '#ff7ad9'; ctx.font = '900 15px system-ui, sans-serif';
    ctx.fillText('COMBO ×' + Math.min(1 + 0.5 * (combo - 1), 3).toFixed(1).replace('.0', ''), W / 2, 84);
  }
}
function panel() {
  ctx.fillStyle = 'rgba(5,7,16,0.72)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(360, W - 40), ph = 330, px = (W - pw) / 2, py = H * 0.24;
  ctx.fillStyle = '#171c33'; rr(px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; rr(px, py, pw, ph, 22); ctx.stroke();
  return { px, py, pw, ph };
}
function bigButton(x, y, w, h, label, color) {
  ctx.fillStyle = color; rr(x, y, w, h, 16); ctx.fill();
  ctx.fillStyle = '#10131f'; ctx.font = '900 26px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 9);
  return { x, y, w, h };
}
function drawTitle() {
  const { px, py, pw } = panel();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '900 44px system-ui, sans-serif';
  ctx.fillText('UNTANGLE', W / 2, py + 66);
  ctx.fillText('IT!', W / 2, py + 112);
  ctx.font = '600 16px system-ui, sans-serif'; ctx.fillStyle = '#c6cbe4';
  ctx.fillText('Drag the beads. Zero crossings wins.', W / 2, py + 152);
  ctx.fillText('Every clear buys time. Knots get denser.', W / 2, py + 178);
  const pulse = 1 + Math.sin(nowS * 4) * 0.02;
  const bw = 210 * pulse, bh = 62;
  startBtn = bigButton(W / 2 - bw / 2, py + 210, bw, bh, '▶ START', '#ffc53d');
  if (best > 0) {
    ctx.fillStyle = '#8b93b8'; ctx.font = '700 14px system-ui, sans-serif';
    ctx.fillText('BEST  ' + best, W / 2, py + 306);
  }
}
function drawOver() {
  const { px, py, pw } = panel();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ff5d5d';
  ctx.font = '900 38px system-ui, sans-serif';
  ctx.fillText("TIME'S UP!", W / 2, py + 62);
  ctx.fillStyle = '#fff'; ctx.font = '900 34px system-ui, sans-serif';
  ctx.fillText('' + score, W / 2, py + 122);
  ctx.fillStyle = '#8b93b8'; ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillText('SCORE', W / 2, py + 144);
  ctx.fillStyle = '#c6cbe4'; ctx.font = '600 17px system-ui, sans-serif';
  ctx.fillText('Knots cleared: ' + knotsCleared + '   ·   Best: ' + best, W / 2, py + 182);
  againBtn = bigButton(W / 2 - 105, py + 216, 210, 62, '↻ AGAIN', '#3ddc97');
}

/* ---------------- loop ---------------- */
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
addEventListener('resize', layout);
layout();
genLevel(1);           // demo tangle behind the title
prevCross = crossCount;
requestAnimationFrame(frame);

/* ---------------- test hook ---------------- */
window.__untangle = {
  state: () => state, level: () => level, score: () => score,
  time: () => timeLeft, crossings: () => crossCount, cleared: () => knotsCleared,
  nodes: () => ropes.map((r, ri) => r.nodes.map((n, ni) => ({ ri, ni, x: n.x, y: n.y }))).flat(),
  solution: () => solution.map((row, ri) => row.map((p, ni) => ({ ri, ni, x: p.x, y: p.y }))).flat(),
  startBtn: () => startBtn, againBtn: () => againBtn,
  setTime: s => { timeLeft = s; },
};
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
