<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Frost Scraper — a cozy ASMR morning</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#101623;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action:none; overscroll-behavior:none;
  }
  canvas { position:absolute; inset:0; display:block; pointer-events:none; }
  #scene { z-index:0; }
  #frost { z-index:1; }
  #fx    { z-index:2; }

  /* ---------- HUD ---------- */
  #hud {
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 0 14px;
    pointer-events:none;
  }
  #meter {
    background: rgba(16,24,40,.55);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 999px; padding: 7px 14px 8px;
    color:#eaf4ff; font-weight:700; letter-spacing:.06em;
    font-size: 15px; display:flex; align-items:center; gap:10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  #meter .bar {
    width: 110px; height: 8px; border-radius: 99px;
    background: rgba(255,255,255,.18); overflow:hidden;
  }
  #meter .fill {
    height:100%; width:0%;
    background: linear-gradient(90deg,#ffd98a,#ffb45e);
    border-radius:99px; transition: width .25s ease;
  }
  #muteBtn {
    pointer-events:auto; cursor:pointer;
    width:44px; height:44px; border-radius:50%;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(16,24,40,.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color:#fff; font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  #muteBtn:active { transform: scale(.93); }

  /* ---------- Overlays ---------- */
  .overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 24px;
    background: radial-gradient(ellipse at 50% 42%, rgba(20,32,54,.18), rgba(10,16,30,.55));
    transition: opacity .6s ease;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay h1 {
    color:#fff; font-size: clamp(38px, 9vw, 64px); font-weight:800;
    letter-spacing:.02em; text-shadow: 0 3px 24px rgba(30,60,110,.8), 0 1px 3px rgba(0,0,0,.5);
  }
  .overlay h1 .flake { color:#bfe3ff; }
  .overlay p {
    color:#dceeff; font-size: clamp(16px, 4.4vw, 21px); margin-top:10px;
    text-shadow: 0 1px 8px rgba(0,0,0,.6); font-weight:600;
  }
  .overlay .hint {
    margin-top:26px; color:#ffe9c4; font-size: clamp(14px, 4vw, 17px); font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(6px);} }
  #doneOverlay { background: radial-gradient(ellipse at 50% 42%, rgba(80,50,10,.10), rgba(20,14,4,.38)); }
  #replayBtn {
    pointer-events:auto; cursor:pointer; margin-top:28px;
    font: inherit; font-size:19px; font-weight:800; letter-spacing:.04em;
    color:#40260a; background: linear-gradient(180deg,#ffe3a3,#ffc46b);
    border:none; border-radius:999px; padding: 14px 34px;
    box-shadow: 0 8px 26px rgba(255,170,60,.45), inset 0 1px 0 rgba(255,255,255,.7);
  }
  #replayBtn:active { transform: scale(.95); }
  #doneOverlay h1 { text-shadow: 0 3px 24px rgba(120,60,0,.55), 0 1px 3px rgba(0,0,0,.4); }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<canvas id="frost"></canvas>
<canvas id="fx"></canvas>

<div id="hud">
  <div id="meter"><span>❄</span><span id="pctText">0% CLEAR</span><span class="bar"><span class="fill" id="pctFill" style="display:block"></span></span></div>
  <button id="muteBtn" aria-label="Toggle sound">🔊</button>
</div>

<div class="overlay" id="titleOverlay">
  <h1><span class="flake">❄</span> Frost Scraper</h1>
  <p>A quiet winter morning, frozen solid.</p>
  <div class="hint">Drag to scrape</div>
</div>

<div class="overlay hidden" id="doneOverlay">
  <h1>Good morning ☀️</h1>
  <p>The whole street is glowing. Time for coffee.</p>
  <button id="replayBtn">Scrape again</button>
</div>

<script>
'use strict';
/* ============================================================
   FROST SCRAPER — an ASMR windshield-clearing toy
   Layers: scene canvas (street) · frost canvas (erasable ice)
           fx canvas (car interior frame, particles, scraper)
   ============================================================ */

const sceneC = document.getElementById('scene');
const frostC = document.getElementById('frost');
const fxC    = document.getElementById('fx');
const sctx = sceneC.getContext('2d');
const fctx = frostC.getContext('2d');
const xctx = fxC.getContext('2d');

const pctText = document.getElementById('pctText');
const pctFill = document.getElementById('pctFill');
const titleOverlay = document.getElementById('titleOverlay');
const doneOverlay  = document.getElementById('doneOverlay');
const muteBtn = document.getElementById('muteBtn');

let W = 0, H = 0, DPR = 1;
let brush = 52;
let progress = 0;          // 0..1 cleared
let started = false;
let finished = false;
let finishAt = 0;

/* ---------------- utils ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mix(h1, h2, t){
  const a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(lerp(a[0],b[0],t)) + ',' + Math.round(lerp(a[1],b[1],t)) + ',' + Math.round(lerp(a[2],b[2],t)) + ')';
}

/* seeded rng so the street is composed, not random soup */
let seed = 7;
function srand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

/* ---------------- street scene layout ---------------- */
let houses = [], sparkles = [];
function layoutScene(){
  seed = 7;
  houses = [];
  const horizon = H * 0.62;
  let x = -W * 0.04;
  while (x < W * 1.02) {
    const hw = W * (0.16 + srand() * 0.13);
    const hh = H * (0.16 + srand() * 0.13);
    const wins = [];
    const cols = Math.max(2, Math.round(hw / (W * 0.085)));
    const rows = Math.max(1, Math.round(hh / (H * 0.085)));
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++)
      wins.push({ dx: 0.14 + (i + 0.5) * (0.72 / cols), dy: 0.22 + (j + 0.5) * (0.55 / rows), lit: srand() > 0.34, warm: 0.75 + srand() * 0.25 });
    houses.push({
      x, w: hw, h: hh, base: horizon,
      huePick: srand(), wins,
      tone: Math.floor(srand() * 5), gable: srand() > 0.5,
      porch: srand() > 0.35, chimney: srand() > 0.45,
      roof: 0.20 + srand() * 0.12
    });
    x += hw + W * (0.015 + srand() * 0.03);
  }
  sparkles = [];
  for (let i = 0; i < 46; i++)
    sparkles.push({ x: Math.random() * W, y: Math.random() * H * 0.92, p: Math.random() * Math.PI * 2, s: rand(0.7, 1.6) });
}

/* ---------------- frost ---------------- */
function dendrite(x, y, angle, len, depth){
  if (depth <= 0 || len < 3) return;
  const nx = x + Math.cos(angle) * len, ny = y + Math.sin(angle) * len;
  fctx.strokeStyle = 'rgba(255,255,255,' + (0.16 + depth * 0.06) + ')';
  fctx.lineWidth = Math.max(0.6, depth * 0.45);
  fctx.beginPath(); fctx.moveTo(x, y); fctx.lineTo(nx, ny); fctx.stroke();
  const n = 2 + (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < n; i++)
    dendrite(nx, ny, angle + rand(-0.65, 0.65), len * rand(0.55, 0.78), depth - 1);
}

function makeFrost(){
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, W, H);
  /* base crystalline sheet */
  const g = fctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, '#dceef8');
  g.addColorStop(0.45, '#cfe4f4');
  g.addColorStop(0.75, '#d8ecf7');
  g.addColorStop(1, '#c3ddef');
  fctx.fillStyle = g;
  fctx.fillRect(0, 0, W, H);

  /* soft mottling — cloudy ice patches */
  for (let i = 0; i < 90; i++) {
    const r = rand(30, 150), x = Math.random() * W, y = Math.random() * H;
    const rg = fctx.createRadialGradient(x, y, 0, x, y, r);
    const col = Math.random() > 0.5 ? '255,255,255' : '168,205,235';
    rg.addColorStop(0, 'rgba(' + col + ',' + rand(0.05, 0.14) + ')');
    rg.addColorStop(1, 'rgba(' + col + ',0)');
    fctx.fillStyle = rg;
    fctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* fern frost creeping from edges & corners */
  fctx.lineCap = 'round';
  const edgePts = 14;
  for (let i = 0; i < edgePts; i++) {
    const side = i % 4;
    let x, y, a;
    if (side === 0) { x = Math.random() * W; y = H; a = -Math.PI / 2 + rand(-0.5, 0.5); }
    else if (side === 1) { x = Math.random() * W; y = 0; a = Math.PI / 2 + rand(-0.5, 0.5); }
    else if (side === 2) { x = 0; y = Math.random() * H; a = rand(-0.5, 0.5); }
    else { x = W; y = Math.random() * H; a = Math.PI + rand(-0.5, 0.5); }
    dendrite(x, y, a, rand(26, 64), 6);
  }
  dendrite(0, H, -0.7, 70, 7); dendrite(W, H, Math.PI + 0.7, 70, 7);
  dendrite(0, 0, 0.7, 60, 7);  dendrite(W, 0, Math.PI - 0.7, 60, 7);

  /* dense crystal grain */
  for (let i = 0; i < 5200; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    fctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,' + rand(0.1, 0.5) + ')' : 'rgba(150,190,225,' + rand(0.08, 0.3) + ')';
    const s = rand(0.6, 2.1);
    fctx.fillRect(x, y, s, s);
  }
  /* star sparkles baked in */
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = rand(1.6, 3.6);
    fctx.strokeStyle = 'rgba(255,255,255,' + rand(0.35, 0.8) + ')';
    fctx.lineWidth = 0.8;
    fctx.beginPath();
    fctx.moveTo(x - r, y); fctx.lineTo(x + r, y);
    fctx.moveTo(x, y - r); fctx.lineTo(x, y + r);
    fctx.stroke();
  }
  /* thicker rim of ice around the edges */
  const rim = Math.max(14, Math.min(W, H) * 0.045);
  const edges = [
    fctx.createLinearGradient(0, 0, 0, rim * 2.4),
    fctx.createLinearGradient(0, H, 0, H - rim * 2.4),
    fctx.createLinearGradient(0, 0, rim * 2.4, 0),
    fctx.createLinearGradient(W, 0, W - rim * 2.4, 0)
  ];
  edges.forEach(gr => { gr.addColorStop(0, 'rgba(240,249,255,0.55)'); gr.addColorStop(1, 'rgba(240,249,255,0)'); });
  fctx.fillStyle = edges[0]; fctx.fillRect(0, 0, W, rim * 2.4);
  fctx.fillStyle = edges[1]; fctx.fillRect(0, H - rim * 2.4, W, rim * 2.4);
  fctx.fillStyle = edges[2]; fctx.fillRect(0, 0, rim * 2.4, H);
  fctx.fillStyle = edges[3]; fctx.fillRect(W - rim * 2.4, 0, rim * 2.4, H);
}

/* ---------------- progress sampling ---------------- */
const sampleC = document.createElement('canvas');
sampleC.width = 48; sampleC.height = 27;
const sampleCtx = sampleC.getContext('2d', { willReadFrequently: true });
let lastSample = 0;
function sampleProgress(now){
  if (now - lastSample < 220) return;
  lastSample = now;
  sampleCtx.clearRect(0, 0, 48, 27);
  sampleCtx.drawImage(frostC, 0, 0, 48, 27);
  const d = sampleCtx.getImageData(0, 0, 48, 27).data;
  let clear = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 170) clear++;
  progress = clear / (48 * 27);
  const pct = Math.floor(progress * 100);
  pctText.textContent = pct + '% CLEAR';
  pctFill.style.width = pct + '%';
  if (progress >= 0.90 && !finished) completeGame();
}

/* ---------------- audio (all synthesized) ---------------- */
let AC = null, master = null, scrapeGain = null, scrapeFilter = null, muted = false;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);

  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const ch = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {            // slightly softened noise
    const white = Math.random() * 2 - 1;
    last = (last + 0.04 * white) / 1.04;
    ch[i] = (white * 0.6 + last * 2.2) * 0.7;
  }

  /* scrape loop — gain/freq driven by drag speed */
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  scrapeFilter = AC.createBiquadFilter(); scrapeFilter.type = 'bandpass';
  scrapeFilter.frequency.value = 1300; scrapeFilter.Q.value = 0.7;
  scrapeGain = AC.createGain(); scrapeGain.gain.value = 0;
  src.connect(scrapeFilter); scrapeFilter.connect(scrapeGain); scrapeGain.connect(master);
  src.start();

  /* gentle morning hush — very low room tone */
  const amb = AC.createBufferSource(); amb.buffer = buf; amb.loop = true; amb.playbackRate.value = 0.4;
  const ambF = AC.createBiquadFilter(); ambF.type = 'lowpass'; ambF.frequency.value = 320;
  const ambG = AC.createGain(); ambG.gain.value = 0.014;
  amb.connect(ambF); ambF.connect(ambG); ambG.connect(master);
  amb.start();
}
function crackle(){
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  const b = AC.createBuffer(1, AC.sampleRate * 0.03, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  src.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = rand(2600, 5200);
  const g = AC.createGain();
  g.gain.setValueAtTime(rand(0.04, 0.13), t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
}
function setScrape(speed){
  if (!AC || !scrapeGain) return;
  const t = AC.currentTime;
  const g = clamp(speed * 0.011, 0, 0.5);
  scrapeGain.gain.setTargetAtTime(muted ? 0 : g, t, 0.045);
  scrapeFilter.frequency.setTargetAtTime(clamp(650 + speed * 30, 650, 3600), t, 0.05);
}
function stopScrape(){
  if (!AC || !scrapeGain) return;
  scrapeGain.gain.setTargetAtTime(0, AC.currentTime, 0.06);
}
function completionSounds(){
  if (!AC) return;
  const t0 = AC.currentTime;
  /* warm pad chord */
  [220, 277.18, 329.63].forEach((fr, i) => {
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = fr;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t0 + i * 0.12);
    g.gain.linearRampToValueAtTime(0.05, t0 + i * 0.12 + 0.7);
    g.gain.linearRampToValueAtTime(0, t0 + 3.4);
    o.connect(g); g.connect(master); o.start(t0 + i * 0.12); o.stop(t0 + 3.5);
  });
  /* three soft birds */
  for (let i = 0; i < 3; i++) {
    const t = t0 + 0.9 + i * 0.55;
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(2350, t);
    o.frequency.exponentialRampToValueAtTime(3150, t + 0.09);
    o.frequency.exponentialRampToValueAtTime(2650, t + 0.16);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.03);
    g.gain.linearRampToValueAtTime(0, t + 0.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
  }
}
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 0.9;
});

/* ---------------- scraping ---------------- */
let pointerDown = false, px = 0, py = 0, lastMoveT = 0, scrapeAngle = -0.5, speedSmooth = 0;
const flakes = [];

function eraseStroke(x0, y0, x1, y1){
  fctx.globalCompositeOperation = 'destination-out';
  fctx.lineCap = 'round'; fctx.lineJoin = 'round';
  fctx.strokeStyle = 'rgba(0,0,0,0.55)';
  fctx.lineWidth = brush;
  fctx.beginPath(); fctx.moveTo(x0, y0); fctx.lineTo(x1, y1); fctx.stroke();
  fctx.strokeStyle = 'rgba(0,0,0,1)';
  fctx.lineWidth = brush * 0.58;
  fctx.beginPath(); fctx.moveTo(x0, y0); fctx.lineTo(x1, y1); fctx.stroke();
  /* jagged crystalline edge specks */
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.floor(dist / 7);
  fctx.fillStyle = 'rgba(0,0,0,0.9)';
  for (let i = 0; i < n; i++) {
    const t = Math.random();
    const cx = lerp(x0, x1, t) + rand(-brush * 0.55, brush * 0.55);
    const cy = lerp(y0, y1, t) + rand(-brush * 0.55, brush * 0.55);
    fctx.beginPath(); fctx.arc(cx, cy, rand(1.5, 5), 0, 6.2832); fctx.fill();
  }
}

function spawnFlakes(x, y, n, spread){
  for (let i = 0; i < n; i++) {
    if (flakes.length > 340) return;
    flakes.push({
      x: x + rand(-spread, spread), y: y + rand(-spread * 0.4, spread * 0.4),
      vx: rand(-14, 14), vy: rand(6, 42),
      life: 1, decay: rand(0.5, 1.1), size: rand(1.2, 3.4),
      sway: rand(0, 6.28), swaySpd: rand(1.5, 4)
    });
  }
}

window.addEventListener('pointerdown', (e) => {
  initAudio();
  if (!started) { started = true; titleOverlay.classList.add('hidden'); }
  if (finished) return;
  pointerDown = true;
  px = e.clientX; py = e.clientY;
  lastMoveT = performance.now();
});
window.addEventListener('pointermove', (e) => {
  const nx = e.clientX, ny = e.clientY;
  if (!pointerDown || finished) { px = nx; py = ny; return; }
  const now = performance.now();
  const dt = Math.max(8, now - lastMoveT);
  const dist = Math.hypot(nx - px, ny - py);
  const speed = dist / dt * 16.7;               // px per frame-ish
  speedSmooth = lerp(speedSmooth, speed, 0.4);
  if (dist > 1.5) {
    scrapeAngle = lerp(scrapeAngle, Math.atan2(ny - py, nx - px), 0.35);
    eraseStroke(px, py, nx, ny);
    spawnFlakes(nx, ny, clamp(Math.floor(dist / 6), 1, 7), brush * 0.4);
    setScrape(speedSmooth);
    if (Math.random() < 0.4) crackle();
    if (dist > 26 && Math.random() < 0.6) crackle();
    sampleProgress(now);
  }
  px = nx; py = ny; lastMoveT = now;
});
function endPointer(){ pointerDown = false; speedSmooth = 0; stopScrape(); }
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', endPointer);
window.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------- defroster ---------------- */
let defrostY = 0, lastDefrost = 0;
function defroster(now){
  if (finished) return;
  if (now - lastDefrost < 130) return;
  lastDefrost = now;
  /* thin glowing strip just above the dashboard, creeping up very slowly */
  const stripTop = H * 0.845 - defrostY;
  const gr = fctx.createLinearGradient(0, stripTop - 6, 0, H * 0.90);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,0.10)');
  fctx.globalCompositeOperation = 'destination-out';
  fctx.fillStyle = gr;
  fctx.fillRect(0, stripTop - 6, W, H * 0.90 - stripTop + 6);
  if (defrostY < H * 0.035) defrostY += 0.25;
}

/* ---------------- completion ---------------- */
function completeGame(){
  finished = true; finishAt = performance.now();
  pointerDown = false; stopScrape();
  completionSounds();
  setTimeout(() => doneOverlay.classList.remove('hidden'), 1400);
}
document.getElementById('replayBtn').addEventListener('click', () => {
  doneOverlay.classList.add('hidden');
  finished = false; progress = 0; defrostY = 0;
  pctText.textContent = '0% CLEAR'; pctFill.style.width = '0%';
  makeFrost();
});

/* ---------------- scene rendering ---------------- */
function drawScene(now){
  const p = progress;                      // warmth follows clearing
  const pw = Math.pow(p, 0.72);            // palette warms early, so progress feels rewarding
  const horizon = H * 0.62;
  /* sky — cold blue dawn → warm sunrise */
  const sky = sctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, mix('#46648f', '#5d84b4', pw));
  sky.addColorStop(0.55, mix('#8fb0d4', '#f0bf82', pw));
  sky.addColorStop(1, mix('#d9e4ee', '#ffdf9e', pw));
  sctx.fillStyle = sky;
  sctx.fillRect(0, 0, W, horizon + 1);

  /* sun, low on the rooftops, strengthening as you clear */
  const sunX = W * 0.78, sunY = horizon - H * (0.015 + p * 0.055);
  const glowR = Math.min(W, H) * (0.30 + p * 0.3);
  const glow = sctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, glowR);
  glow.addColorStop(0, 'rgba(255,208,125,' + (0.28 + p * 0.5) + ')');
  glow.addColorStop(1, 'rgba(255,208,125,0)');
  sctx.fillStyle = glow;
  sctx.fillRect(sunX - glowR, sunY - glowR, glowR * 2, glowR * 2);
  sctx.fillStyle = 'rgba(255,240,200,' + (0.55 + p * 0.45) + ')';
  sctx.beginPath(); sctx.arc(sunX, sunY, Math.min(W, H) * 0.027, 0, 6.2832); sctx.fill();

  /* houses — each its own cozy color, cooled by a frost tint that lifts as you clear */
  const TONES = ['#7c5a48', '#5f7186', '#77875f', '#96705f', '#6d7f95'];
  const ROOFS = ['#4f4038', '#3f4c5c', '#4c5540', '#5c4438', '#46536a'];
  for (const hs of houses) {
    const top = hs.base - hs.h;
    sctx.fillStyle = TONES[hs.tone];
    sctx.fillRect(hs.x, top, hs.w, hs.h);
    /* roof */
    sctx.fillStyle = ROOFS[hs.tone];
    sctx.beginPath();
    sctx.moveTo(hs.x - 4, top);
    sctx.lineTo(hs.x + hs.w / 2, top - hs.h * hs.roof);
    sctx.lineTo(hs.x + hs.w + 4, top);
    sctx.closePath(); sctx.fill();
    if (hs.gable) {
      sctx.fillStyle = TONES[hs.tone];
      sctx.beginPath();
      sctx.moveTo(hs.x + hs.w * 0.32, top + 1);
      sctx.lineTo(hs.x + hs.w * 0.5, top - hs.h * hs.roof * 0.72);
      sctx.lineTo(hs.x + hs.w * 0.68, top + 1);
      sctx.closePath(); sctx.fill();
    }
    /* cold dawn tint over the whole house, fading with progress */
    sctx.fillStyle = 'rgba(74,96,128,' + ((1 - pw) * 0.42) + ')';
    sctx.fillRect(hs.x - 4, top - hs.h * hs.roof, hs.w + 8, hs.h + hs.h * hs.roof);
    /* snow cap on roof */
    sctx.fillStyle = 'rgba(240,248,255,0.85)';
    sctx.beginPath();
    sctx.moveTo(hs.x + hs.w * 0.18, top - hs.h * hs.roof * 0.62);
    sctx.lineTo(hs.x + hs.w / 2, top - hs.h * hs.roof);
    sctx.lineTo(hs.x + hs.w * 0.82, top - hs.h * hs.roof * 0.62);
    sctx.lineTo(hs.x + hs.w * 0.72, top - hs.h * hs.roof * 0.5);
    sctx.lineTo(hs.x + hs.w / 2, top - hs.h * hs.roof * 0.82);
    sctx.lineTo(hs.x + hs.w * 0.28, top - hs.h * hs.roof * 0.5);
    sctx.closePath(); sctx.fill();
    if (hs.chimney) {
      sctx.fillStyle = mix('#4a5a72', '#6b554b', p * 0.7);
      const cx = hs.x + hs.w * 0.72, cy = top - hs.h * hs.roof * 0.55;
      sctx.fillRect(cx, cy - H * 0.028, W * 0.016, H * 0.032);
      /* lazy smoke */
      sctx.fillStyle = 'rgba(235,240,248,0.20)';
      for (let s = 0; s < 3; s++) {
        const ph = ((now * 0.00006 * (1 + s * 0.3)) + s * 0.37 + hs.huePick) % 1;
        sctx.beginPath();
        sctx.arc(cx + W * 0.008 + ph * W * 0.02 + Math.sin(ph * 9 + hs.huePick * 8) * 4,
                 cy - H * 0.03 - ph * H * 0.075, 3 + ph * H * 0.016, 0, 6.2832);
        sctx.fill();
      }
    }
    /* windows — warm lamplight */
    for (const wn of hs.wins) {
      const wx = hs.x + wn.dx * hs.w, wy = top + wn.dy * hs.h;
      const ww = Math.min(W * 0.034, hs.w * 0.16), wh = ww * 1.3;
      if (wn.lit) {
        sctx.fillStyle = 'rgba(255,' + Math.round(190 * wn.warm + 30) + ',110,' + (0.6 + p * 0.4) + ')';
        sctx.fillRect(wx - ww / 2, wy - wh / 2, ww, wh);
        sctx.fillStyle = 'rgba(90,60,30,0.6)';
        sctx.fillRect(wx - 0.7, wy - wh / 2, 1.4, wh);
        sctx.fillRect(wx - ww / 2, wy - 0.7, ww, 1.4);
      } else {
        sctx.fillStyle = 'rgba(30,42,60,0.65)';
        sctx.fillRect(wx - ww / 2, wy - wh / 2, ww, wh);
      }
    }
    /* porch light with halo */
    if (hs.porch) {
      const lx = hs.x + hs.w * 0.5, ly = hs.base - hs.h * 0.34;
      const pr = W * 0.03;
      const pg = sctx.createRadialGradient(lx, ly, 0, lx, ly, pr);
      pg.addColorStop(0, 'rgba(255,205,120,' + (0.5 + p * 0.4) + ')');
      pg.addColorStop(1, 'rgba(255,205,120,0)');
      sctx.fillStyle = pg; sctx.fillRect(lx - pr, ly - pr, pr * 2, pr * 2);
      sctx.fillStyle = '#ffe2ae';
      sctx.beginPath(); sctx.arc(lx, ly, 2.4, 0, 6.2832); sctx.fill();
    }
    /* door */
    sctx.fillStyle = 'rgba(35,45,62,0.8)';
    const dw = hs.w * 0.16, dh = hs.h * 0.42;
    sctx.fillRect(hs.x + hs.w / 2 - dw / 2, hs.base - dh, dw, dh);
  }

  /* bare winter tree */
  const tx = W * 0.13, ty = horizon + H * 0.015;
  sctx.strokeStyle = mix('#3c4c63', '#4c4238', p * 0.6);
  sctx.lineCap = 'round';
  function branch(x, y, a, l, wdt, d){
    if (d <= 0 || l < 4) return;
    const nx = x + Math.cos(a) * l, ny = y + Math.sin(a) * l;
    sctx.lineWidth = wdt;
    sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(nx, ny); sctx.stroke();
    branch(nx, ny, a - 0.32, l * 0.72, wdt * 0.68, d - 1);
    branch(nx, ny, a + 0.28, l * 0.75, wdt * 0.68, d - 1);
  }
  branch(tx, ty, -Math.PI / 2, H * 0.075, Math.max(4, W * 0.008), 7);

  /* snowy ground & street */
  const gr = sctx.createLinearGradient(0, horizon, 0, H);
  gr.addColorStop(0, mix('#c3d3e6', '#efe3cb', pw));
  gr.addColorStop(0.35, mix('#b2c6de', '#e6d8bc', pw));
  gr.addColorStop(1, mix('#9db4d0', '#d3bf9c', pw));
  sctx.fillStyle = gr;
  sctx.fillRect(0, horizon, W, H - horizon);
  /* soft snow drifts along the verge */
  sctx.fillStyle = 'rgba(248,252,255,0.40)';
  for (let i = 0; i < 6; i++) {
    const dx = ((i * 311.7) % (W * 1.1)) - W * 0.05;
    const dy = horizon + H * (0.03 + (i % 3) * 0.05);
    const dr = W * (0.05 + (i % 4) * 0.016);
    sctx.beginPath(); sctx.ellipse(dx, dy, dr, dr * 0.26, 0, 0, 6.2832); sctx.fill();
  }
  /* the street — snow-dusted asphalt, narrower, with tire tracks */
  sctx.fillStyle = mix('#8798ad', '#96836c', pw * 0.85);
  sctx.beginPath();
  sctx.moveTo(W * 0.365, horizon);
  sctx.lineTo(W * 0.545, horizon);
  sctx.lineTo(W * 0.80, H);
  sctx.lineTo(W * 0.13, H);
  sctx.closePath(); sctx.fill();
  sctx.strokeStyle = 'rgba(52,62,78,0.35)';
  sctx.lineCap = 'round';
  [[0.415, 0.30], [0.495, 0.665]].forEach(tr => {
    sctx.lineWidth = Math.max(2.5, W * 0.006);
    sctx.beginPath();
    sctx.moveTo(W * tr[0], horizon + 2);
    sctx.lineTo(W * tr[1], H);
    sctx.stroke();
  });
  /* slushy center dashes */
  sctx.fillStyle = 'rgba(250,246,230,0.5)';
  for (let i = 0; i < 4; i++) {
    const t = i / 4, yy = horizon + (H - horizon) * Math.pow(t + 0.12, 1.6);
    const xx = lerp(W * 0.455, W * 0.465, t) + (yy - horizon) * 0.19;
    sctx.fillRect(xx, yy, 3 + t * 7, 2 + t * 4);
  }
  /* snowy verge sparkle */
  sctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 24; i++) {
    const gx = ((i * 197.3) % W), gy = horizon + ((i * 89.7) % (H - horizon));
    if (Math.sin(now * 0.001 + i * 1.7) > 0.55) sctx.fillRect(gx, gy, 2, 2);
  }

  /* snowman neighbour */
  const mx = W * 0.865, my = horizon + H * 0.085;
  sctx.fillStyle = 'rgba(120,140,170,0.35)';
  sctx.beginPath(); sctx.ellipse(mx, my + W * 0.024, W * 0.028, W * 0.007, 0, 0, 6.2832); sctx.fill();
  sctx.fillStyle = '#ffffff';
  sctx.beginPath(); sctx.arc(mx, my, W * 0.024, 0, 6.2832); sctx.fill();
  sctx.beginPath(); sctx.arc(mx, my - W * 0.042, W * 0.017, 0, 6.2832); sctx.fill();
  sctx.fillStyle = '#d84f3d';
  sctx.fillRect(mx - W * 0.016, my - W * 0.030, W * 0.032, W * 0.008);
  sctx.fillStyle = '#e2703a';
  sctx.beginPath();
  sctx.moveTo(mx, my - W * 0.042); sctx.lineTo(mx + W * 0.023, my - W * 0.037); sctx.lineTo(mx, my - W * 0.033);
  sctx.closePath(); sctx.fill();
  sctx.fillStyle = '#33404f';
  sctx.beginPath(); sctx.arc(mx - W * 0.006, my - W * 0.045, 1.6, 0, 6.2832); sctx.fill();
  sctx.beginPath(); sctx.arc(mx + W * 0.006, my - W * 0.045, 1.6, 0, 6.2832); sctx.fill();

  /* mailbox with a dusting of snow */
  const bx = W * 0.615, by = horizon + H * 0.105;
  const bw = W * 0.036, bh = H * 0.020;
  sctx.fillStyle = '#5a4632';
  sctx.fillRect(bx - 2.5, by, 5, H * 0.052);
  sctx.fillStyle = mix('#54687f', '#7a5b47', pw * 0.6);
  sctx.fillRect(bx - bw / 2, by - bh, bw, bh);
  sctx.beginPath(); sctx.arc(bx, by - bh, bw / 2, Math.PI, 0); sctx.fill();
  sctx.fillStyle = 'rgba(250,252,255,0.95)';
  sctx.beginPath(); sctx.arc(bx, by - bh - 1, bw / 2, Math.PI, 0); sctx.fill();
  sctx.fillRect(bx - bw / 2, by - bh - 2.5, bw, 2.5);
  sctx.fillStyle = '#d84f3d';
  sctx.fillRect(bx + bw / 2 - 1, by - bh - H * 0.016, 3, H * 0.016);

  /* full-morning glory on completion */
  if (finished) {
    const t = clamp((now - finishAt) / 2200, 0, 1);
    const fg = sctx.createRadialGradient(W * 0.7, horizon - H * 0.12, 0, W * 0.7, horizon - H * 0.12, Math.max(W, H) * 0.9);
    fg.addColorStop(0, 'rgba(255,205,120,' + (t * 0.35) + ')');
    fg.addColorStop(1, 'rgba(255,180,90,' + (t * 0.10) + ')');
    sctx.fillStyle = fg; sctx.fillRect(0, 0, W, H);
  }
}

/* ---------------- fx layer: interior, particles, scraper ---------------- */
function drawFX(now, dt){
  xctx.clearRect(0, 0, W, H);

  /* twinkling crystals still frozen in the glass */
  if (!finished) {
    for (const sp of sparkles) {
      const a = 0.5 + 0.5 * Math.sin(now * 0.0022 + sp.p);
      if (a < 0.72) continue;
      xctx.strokeStyle = 'rgba(255,255,255,' + ((a - 0.72) * 2.4) + ')';
      xctx.lineWidth = 1;
      const r = 3.2 * sp.s;
      xctx.beginPath();
      xctx.moveTo(sp.x - r, sp.y); xctx.lineTo(sp.x + r, sp.y);
      xctx.moveTo(sp.x, sp.y - r); xctx.lineTo(sp.x, sp.y + r);
      xctx.stroke();
    }
  }

  /* --- car interior frame --- */
  const dashTop = H * 0.885;
  /* defroster glow above the dash */
  const dg = xctx.createLinearGradient(0, dashTop - H * 0.075, 0, dashTop);
  dg.addColorStop(0, 'rgba(255,120,50,0)');
  dg.addColorStop(1, 'rgba(255,120,50,' + (0.10 + 0.03 * Math.sin(now * 0.002)) + ')');
  xctx.fillStyle = dg;
  xctx.fillRect(0, dashTop - H * 0.075, W, H * 0.075);

  /* A-pillars */
  xctx.fillStyle = '#141922';
  xctx.beginPath();
  xctx.moveTo(0, 0); xctx.lineTo(W * 0.085, 0); xctx.lineTo(W * 0.028, H * 0.9); xctx.lineTo(0, H * 0.96);
  xctx.closePath(); xctx.fill();
  xctx.beginPath();
  xctx.moveTo(W, 0); xctx.lineTo(W * 0.915, 0); xctx.lineTo(W * 0.972, H * 0.9); xctx.lineTo(W, H * 0.96);
  xctx.closePath(); xctx.fill();
  /* header + rear-view mirror */
  xctx.fillRect(0, 0, W, H * 0.028);
  const mw = Math.min(W * 0.21, 190), mh = mw * 0.30;
  xctx.fillStyle = '#10141c';
  roundRect(xctx, W / 2 - mw / 2, H * 0.028, mw, mh, 9); xctx.fill();
  xctx.fillStyle = 'rgba(190,215,240,0.35)';
  roundRect(xctx, W / 2 - mw / 2 + 4, H * 0.028 + 4, mw - 8, mh - 8, 6); xctx.fill();

  /* dashboard */
  const dash = xctx.createLinearGradient(0, dashTop, 0, H);
  dash.addColorStop(0, '#232a36'); dash.addColorStop(0.12, '#171d27'); dash.addColorStop(1, '#0c1017');
  xctx.fillStyle = dash;
  xctx.beginPath();
  xctx.moveTo(0, H);
  xctx.lineTo(0, dashTop + H * 0.012);
  xctx.quadraticCurveTo(W / 2, dashTop - H * 0.018, W, dashTop + H * 0.012);
  xctx.lineTo(W, H);
  xctx.closePath(); xctx.fill();
  /* defrost vents + one amber indicator */
  xctx.strokeStyle = 'rgba(255,255,255,0.10)'; xctx.lineWidth = 3; xctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const vx = W * 0.30 + i * W * 0.062;
    xctx.beginPath(); xctx.moveTo(vx, dashTop + H * 0.026); xctx.lineTo(vx + W * 0.03, dashTop + H * 0.026); xctx.stroke();
  }
  xctx.fillStyle = 'rgba(255,150,60,' + (0.65 + 0.3 * Math.sin(now * 0.003)) + ')';
  xctx.beginPath(); xctx.arc(W * 0.5, dashTop + H * 0.055, 3.4, 0, 6.2832); xctx.fill();
  /* steering wheel hint, bottom-left */
  xctx.strokeStyle = '#0a0e14'; xctx.lineWidth = Math.max(10, W * 0.016);
  xctx.beginPath(); xctx.arc(W * 0.16, H * 1.06, Math.min(W, H) * 0.17, Math.PI * 1.15, Math.PI * 1.75); xctx.stroke();

  /* --- falling frost flakes --- */
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i];
    f.vy += 130 * dt; f.x += (f.vx + Math.sin(now * 0.001 * f.swaySpd + f.sway) * 12) * dt;
    f.y += f.vy * dt; f.life -= f.decay * dt;
    if (f.life <= 0 || f.y > dashTop + 4) { flakes.splice(i, 1); continue; }
    xctx.fillStyle = 'rgba(255,255,255,' + (f.life * 0.9) + ')';
    xctx.beginPath(); xctx.arc(f.x, f.y, f.size, 0, 6.2832); xctx.fill();
  }

  /* --- the scraper in your hand --- */
  if (started && !finished) drawScraper(now);
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawScraper(now){
  const tilt = clamp(speedSmooth * 0.012, 0, 0.5) * (Math.cos(scrapeAngle) >= 0 ? 1 : -1) * 0.4;
  xctx.save();
  xctx.translate(px, py);
  xctx.rotate(-0.45 + tilt);
  if (pointerDown) xctx.translate(0, 2);
  const s = clamp(Math.min(W, H) / 420, 0.8, 1.35);
  xctx.scale(s, s);
  /* shadow */
  xctx.fillStyle = 'rgba(10,16,28,0.30)';
  xctx.beginPath(); xctx.ellipse(6, 34, 42, 10, 0, 0, 6.2832); xctx.fill();
  /* blade — frosted translucent edge */
  xctx.fillStyle = 'rgba(214,232,246,0.92)';
  xctx.beginPath();
  xctx.moveTo(-34, 18); xctx.lineTo(34, 18); xctx.lineTo(27, 33); xctx.lineTo(-27, 33);
  xctx.closePath(); xctx.fill();
  xctx.fillStyle = 'rgba(255,255,255,0.85)';
  xctx.fillRect(-27, 31, 54, 2.5);
  /* body & handle — warm orange plastic */
  const bodyG = xctx.createLinearGradient(0, -34, 0, 20);
  bodyG.addColorStop(0, '#f08a4b'); bodyG.addColorStop(1, '#d9622b');
  xctx.fillStyle = bodyG;
  roundRect(xctx, -13, -36, 26, 56, 9); xctx.fill();
  xctx.fillStyle = 'rgba(0,0,0,0.16)';
  roundRect(xctx, -8, -30, 16, 30, 6); xctx.fill();
  xctx.fillStyle = '#e2703a';
  xctx.beginPath();
  xctx.moveTo(-20, 8); xctx.lineTo(20, 8); xctx.lineTo(30, 19); xctx.lineTo(-30, 19);
  xctx.closePath(); xctx.fill();
  xctx.restore();
}

/* ---------------- melt-out finale ---------------- */
function meltFinale(now){
  if (!finished) return;
  fctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 7; i++) {
    fctx.fillStyle = 'rgba(0,0,0,0.06)';
    fctx.beginPath();
    fctx.arc(Math.random() * W, Math.random() * H, rand(24, 70), 0, 6.2832);
    fctx.fill();
  }
}

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  drawScene(now);
  defroster(now);
  meltFinale(now);
  if (started) sampleProgress(now);
  drawFX(now, dt);
  requestAnimationFrame(frame);
}

/* ---------------- resize ---------------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const newW = window.innerWidth, newH = window.innerHeight;
  let oldFrost = null;
  if (W > 0 && frostC.width > 0) {
    oldFrost = document.createElement('canvas');
    oldFrost.width = frostC.width; oldFrost.height = frostC.height;
    oldFrost.getContext('2d').drawImage(frostC, 0, 0);
  }
  W = newW; H = newH;
  brush = clamp(Math.min(W, H) * 0.105, 36, 76);
  [sceneC, frostC, fxC].forEach(c => {
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  [sctx, fctx, xctx].forEach(c => c.setTransform(DPR, 0, 0, DPR, 0, 0));
  layoutScene();
  if (oldFrost) {
    fctx.globalCompositeOperation = 'source-over';
    fctx.clearRect(0, 0, W, H);
    fctx.drawImage(oldFrost, 0, 0, W, H);
  } else {
    makeFrost();
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));

resize();
requestAnimationFrame(frame);
</script>
</body>
