import * as THREE from "three";
var PROPORTIONS = {
  hipHeight: 0.94,
  // hip pivot height
  hipDrop: 0.05,
  // hip pivot → leg pivot
  thigh: 0.42,
  calf: 0.39,
  ankleToSole: 0.08,
  torsoRise: 0.1,

  shoulderY: 0.54,

function taperedLimb(rTop, rBot, len, radialSegs = 12) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, len, radialSegs, 1);
  geo.translate(0, -len / 2, 0);
  return geo;
}
function mesh(geo, mat, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = shadow;
  return m;
}
function buildHand(skinMat, scale, side) {
  const g = new THREE.Group();
  const s = scale;
  const palm = mesh(new THREE.BoxGeometry(0.11 * s, 0.13 * s, 0.065 * s), skinMat);
  palm.position.set(0, -0.06 * s, 0);
  g.add(palm);
  const fingers = mesh(new THREE.BoxGeometry(0.105 * s, 0.085 * s, 0.06 * s), skinMat);
  fingers.position.set(0, -0.145 * s, 0.015 * s);
  fingers.rotation.x = 0.25;
  g.add(fingers);
  const thumb = mesh(new THREE.BoxGeometry(0.04 * s, 0.075 * s, 0.045 * s), skinMat);
  thumb.position.set(side * -0.065 * s, -0.065 * s, 0.03 * s);
  thumb.rotation.z = side * 0.45;
  g.add(thumb);
  return g;
}
function buildBareFoot(skinMat) {

  heelBlock.position.set(0, 0.031, -0.035);
  g.add(heelBlock);

  forefoot.position.set(0, 0.023, 0.082);
  forefoot.rotation.x = -0.1;
  g.add(forefoot);
  const toes = mesh(new THREE.SphereGeometry(0.052, 10, 8), skinMat, false);
  toes.scale.set(0.98, 0.48, 1);
  toes.position.set(0, 0.024, 0.148);
  g.add(toes);
  const heel = new THREE.Object3D();
  heel.position.set(0, 0.012, -0.085);
  g.add(heel);
  const toe = new THREE.Object3D();
  toe.position.set(0, 0.012, 0.185);
  g.add(toe);
  return { group: g, heel, toe };
}

  grad.addColorStop(0, "rgba(0,0,0,0.85)");
  grad.addColorStop(0.6, "rgba(0,0,0,0.4)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
