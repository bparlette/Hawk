  html, body { height: 100%; }

    margin: 0;
    overflow: hidden;
    background: #17100d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    display: block;

  #room { z-index: 0; }
  #gl { z-index: 1; }
  #fx { z-index: 2; pointer-events: none; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 10px; right: 10px;

  .chip {
    background: rgba(20, 12, 8, 0.55);

  #hint {
    position: fixed;
    left: 50%; transform: translateX(-50%);

    z-index: 3;

    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 5;
    display: flex; flex-direction: column; align-items: stretch;
    gap: 10px;
    max-width: 430px;
    margin: 0 auto;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    box-sizing: border-box;

  #startBtn {
    font: inherit;
    font-size: 20px; font-weight: 900;

    background: linear-gradient(180deg, #cdeeb8, #8fd07a);

  #startBtn:active { transform: scale(0.96); }
  #motionPill {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 58px);
    z-index: 6;
    font: inherit; font-size: 15px; font-weight: 800;
    color: #fff;
    background: rgba(24, 16, 8, 0.85);
    border: 2px solid rgba(255, 215, 106, 0.9);
    border-radius: 999px;
    padding: 12px 18px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.5);
    cursor: pointer;
    white-space: nowrap;
  }
  #motionPill:active { transform: translateX(-50%) scale(0.96); }
  .hidden { display: none !important; }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

'use strict';
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

/* EXPLORE launches Quick Look (Apple-only): reveal the button just for iOS. */
if (/iP(hone|ad|od)/.test(navigator.userAgent)) document.getElementById('exploreBtn').style.display = 'inline-flex';

/* ============================== audio (soft chime on tap) ============================== */
let AC = null;
function initAudio() {
  try {
    if ('audioSession' in navigator) { try { navigator.audioSession.type = 'playback'; } catch (e) {} }
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) AC = new Ctor();
    }
    if (AC) {
      if (AC.state === 'suspended') AC.resume();
      const buf = AC.createBuffer(1, 1, 22050);
      const src = AC.createBufferSource();
      src.buffer = buf; src.connect(AC.destination); src.start(0);
    }
  } catch (e) {}
}
function resumeAudio() { try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {} }
document.addEventListener('pointerdown', resumeAudio, true);
document.addEventListener('touchend', resumeAudio, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeAudio(); });
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function sndGiggle() {
  tone(1175, 1568, 0.09, 'triangle', 0.12, 0);
  tone(1319, 1760, 0.11, 'triangle', 0.12, 0.10);
  tone(1568, 2093, 0.14, 'sine', 0.08, 0.21);
}

/* ============================== dom / state ============================== */
const video = document.getElementById('cam');
const roomCanvas = document.getElementById('room');
const rctx = roomCanvas.getContext('2d');
const glCanvas = document.getElementById('gl');
const fxCanvas = document.getElementById('fx');
const fctx = fxCanvas.getContext('2d');
const hudEl = document.getElementById('hud');
const heartCountEl = document.getElementById('heartCount');
const hintEl = document.getElementById('hint');
const startEl = document.getElementById('start');

let W = 0, H = 0, floorTop = 0;
let started = false;
let camOK = false;
let hearts = [];
let heartTotal = 0;

/* ================= AR motion: permission-in-gesture + 3DOF look-around ================= */
let baseCamQ = null;
let hemiLight = null, dirLight = null;
const MOTION = {
  needPerm: (typeof DeviceOrientationEvent !== 'undefined' &&
             typeof DeviceOrientationEvent.requestPermission === 'function'),
  perm: 'unknown', ok: false, ever: false, lastAt: -1e9, recal: true, refQ: null, devQ: null
};
function askMotionPermission() {
  if (!MOTION.needPerm) { MOTION.perm = 'n/a'; return; }
  try {
    const p = DeviceOrientationEvent.requestPermission();
    if (p && typeof p.then === 'function') {
      p.then(r => {
        MOTION.perm = (r === 'granted') ? 'granted' : 'denied';
        if (MOTION.perm === 'granted') MOTION.recal = true;
      }).catch(() => { MOTION.perm = 'error'; });
    }
  } catch (e) { MOTION.perm = 'error'; }
}
const motionPillEl = document.getElementById('motionPill');
function showMotionPill() { if (motionPillEl) motionPillEl.classList.remove('hidden'); }
function hideMotionPill() { if (motionPillEl) motionPillEl.classList.add('hidden'); }
if (motionPillEl) motionPillEl.addEventListener('click', () => { askMotionPermission(); });
function motionWatchdog() {
  setTimeout(() => { if (MOTION.needPerm && !MOTION.ever) showMotionPill(); }, 1500);
}
window.addEventListener('orientationchange', () => { MOTION.recal = true; });

const _zee = new THREE.Vector3(0, 0, 1);
const _eul = new THREE.Euler();
const _q0 = new THREE.Quaternion();
const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
function deviceQuat(out, alphaDeg, betaDeg, gammaDeg) {
  const orient = (typeof window.orientation === 'number' ? window.orientation : 0) * Math.PI / 180;
  _eul.set(THREE.MathUtils.degToRad(betaDeg), THREE.MathUtils.degToRad(alphaDeg),
           THREE.MathUtils.degToRad(-gammaDeg), 'YXZ');
  out.setFromEuler(_eul);
  out.multiply(_q1);
  out.multiply(_q0.setFromAxisAngle(_zee, -orient));
  return out;
}
const _invRefQ = new THREE.Quaternion();
const _targetQ = new THREE.Quaternion();
function applyMotionCamera() {
  if (!camera || !baseCamQ || !MOTION.refQ) return false;
  if (performance.now() - MOTION.lastAt > 3000) { MOTION.ok = false; return false; }
  if (!MOTION.ok) return false;
  _invRefQ.copy(MOTION.refQ).invert();
  _targetQ.copy(MOTION.devQ).multiply(_invRefQ).multiply(baseCamQ);
  camera.quaternion.slerp(_targetQ, 0.16);
  return true;
}

/* ================= light matching ================= */
const lightBase = { hemi: 1.15, dir: 1.5 };
const _lsCanvas = document.createElement('canvas');
_lsCanvas.width = 16; _lsCanvas.height = 16;
const _lsCtx = _lsCanvas.getContext('2d', { willReadFrequently: true });
const _lightTgt = { m: 1, c: new THREE.Color(1, 1, 1) };
let _lsNextAt = 0;
function updateLightMatch(t, dt) {
  if (!hemiLight || !dirLight) return;
  if (camOK && video && video.readyState >= 2 && t >= _lsNextAt) {
    _lsNextAt = t + 500;
    try {
      _lsCtx.drawImage(video, 0, 0, 16, 16);
      const d = _lsCtx.getImageData(0, 0, 16, 16).data;
      let r = 0, g = 0, b = 0;
      const n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
      r /= n * 255; g /= n * 255; b /= n * 255;
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      _lightTgt.m = clamp(0.45 + lum * 1.1, 0.45, 1.35);
      _lightTgt.c.setRGB(lerp(1, Math.min(1, r * 1.7), 0.5),
                         lerp(1, Math.min(1, g * 1.7), 0.5),
                         lerp(1, Math.min(1, b * 1.7), 0.5));
    } catch (e) {}
  }
  if (!camOK) return;
  const k = 1 - Math.exp(-dt * 2.5);
  hemiLight.intensity += (lightBase.hemi * _lightTgt.m - hemiLight.intensity) * k;
  dirLight.intensity += (lightBase.dir * _lightTgt.m - dirLight.intensity) * k;
  hemiLight.color.lerp(_lightTgt.c, k);
}

/* ============================== parallax ============================== */
let parX = 0, parY = 0, parTX = 0, parTY = 0;
let lastOrientAt = -1e9;
let mouseAt = -1e9, mouseTX = 0, mouseTY = 0;
window.addEventListener('deviceorientation', (e) => {
  if (e.gamma == null && e.beta == null && e.alpha == null) return;
  lastOrientAt = performance.now();
  parTX = clamp((e.gamma || 0) / 26, -1, 1);
  parTY = clamp(((e.beta || 0) - 48) / 24, -1, 1);
  MOTION.ever = true; MOTION.ok = true; MOTION.lastAt = lastOrientAt;
  if (!MOTION.devQ) MOTION.devQ = new THREE.Quaternion();
  deviceQuat(MOTION.devQ, e.alpha || 0, e.beta || 0, e.gamma || 0);
  if (MOTION.recal || !MOTION.refQ) { MOTION.refQ = MOTION.devQ.clone(); MOTION.recal = false; }
  hideMotionPill();
}, true);
window.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  mouseAt = performance.now();
  mouseTX = clamp((e.clientX / Math.max(1, W) - 0.5) * 2, -1, 1);
  mouseTY = clamp((e.clientY / Math.max(1, H) - 0.5) * 2, -1, 1);
}, true);
function updateParallax(t) {
  let tx, ty;
  if (performance.now() - mouseAt < 2500) { tx = mouseTX; ty = mouseTY; }
  else if (performance.now() - lastOrientAt < 3000) { tx = parTX; ty = parTY; }
  else { tx = Math.sin(t * 0.00035) * 0.55; ty = Math.sin(t * 0.00027 + 1.7) * 0.30; }
  parX += (tx - parX) * 0.055;
  parY += (ty - parY) * 0.055;
}

/* ============================== cozy room (fallback bg) ============================== */
function rr2(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
}
function ellipse2(c, x, y, rx, ry, rot) {
  c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
}
function drawRoom() {
  const ctx = rctx;
  const wall = ctx.createLinearGradient(0, 0, 0, floorTop + 30);
  wall.addColorStop(0, '#f2f8e6'); wall.addColorStop(1, '#dceccb');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, floorTop + 2);
  const wx = W * 0.14 + parX * -8, wy = H * 0.06, ww = W * 0.30, wh = floorTop * 0.60;
  ctx.fillStyle = '#bfe3f2'; rr2(ctx, wx, wy, ww, wh, 8); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(wx + ww * 0.72, wy + wh * 0.3, ww * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8f7fd'; ellipse2(ctx, wx + ww * 0.3, wy + wh * 0.62, ww * 0.2, wh * 0.1); ctx.fill();
  ctx.strokeStyle = '#fff8ee'; ctx.lineWidth = 7; rr2(ctx, wx, wy, ww, wh, 8); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath();
  ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh);
  ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  const fx = W * 0.68 + parX * -8, fy = H * 0.07, fw = W * 0.20, fh = floorTop * 0.44;
  ctx.fillStyle = '#a9743f'; rr2(ctx, fx, fy, fw, fh, 5); ctx.fill();
  ctx.fillStyle = '#fff6ec'; rr2(ctx, fx + 6, fy + 6, fw - 12, fh - 12, 3); ctx.fill();
  ctx.fillStyle = '#ff8fb8';
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    ellipse2(ctx, fx + fw / 2 + Math.cos(a) * fw * 0.13, fy + fh / 2 + Math.sin(a) * fh * 0.13, fw * 0.10, fh * 0.10);
    ctx.fill();
  }
  ctx.fillStyle = '#ffb84d'; ctx.beginPath(); ctx.arc(fx + fw / 2, fy + fh / 2, fw * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3e0'; ctx.fillRect(0, floorTop - 7, W, 9);
  ctx.fillStyle = 'rgba(120,70,30,0.35)'; ctx.fillRect(0, floorTop + 2, W, 2);
  const fl = ctx.createLinearGradient(0, floorTop, 0, H);
  fl.addColorStop(0, '#bb8048'); fl.addColorStop(1, '#8a5527');
  ctx.fillStyle = fl; ctx.fillRect(0, floorTop, W, H - floorTop);
  ctx.strokeStyle = 'rgba(60,30,5,0.20)'; ctx.lineWidth = 2;
  for (let y = floorTop + 26; y < H; y += 30) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(60,30,5,0.10)';
  for (let y = floorTop + 26, row = 0; y < H; y += 30, row++) {
    for (let x = ((row % 2) * 90) + 40; x < W; x += 190) {
      ctx.beginPath(); ctx.moveTo(x, y - 28); ctx.lineTo(x, y); ctx.stroke();
    }
  }
  const rugX = W * 0.5 + parX * -12, rugY = H * 0.86;
  ctx.fillStyle = '#7fb069'; ellipse2(ctx, rugX, rugY, W * 0.42, H * 0.10); ctx.fill();
  ctx.fillStyle = '#95c685'; ellipse2(ctx, rugX, rugY, W * 0.35, H * 0.080); ctx.fill();
  ctx.fillStyle = '#b9dcab'; ellipse2(ctx, rugX, rugY, W * 0.25, H * 0.055); ctx.fill();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(30,15,5,0)'); vg.addColorStop(1, 'rgba(30,15,5,0.20)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ============================== three.js scene ==============================
   LINK — HAND-BUILT (Blender): standing still at (0, 0, MODEL_Z), framed so the whole
   figure fits the fallback view; in camera mode he stands in the room. */
let renderer = null, scene = null, camera = null;
const MODEL_Z = -1.5;
const CAM_BASE = new THREE.Vector3(0, 0.85, 0.75);
const CAM_LOOK = new THREE.Vector3(0, 0.55, MODEL_Z);

function makeBlobTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
let blobGeo = null, blobMat = null;

function initGL() {
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(58, W / Math.max(1, H), 0.1, 120);
  camera.position.copy(CAM_BASE);
  camera.lookAt(CAM_LOOK);
  baseCamQ = camera.quaternion.clone();
  hemiLight = new THREE.HemisphereLight(0xffffff, 0x554433, 1.15);
  scene.add(hemiLight);
  dirLight = new THREE.DirectionalLight(0xfff1da, 1.5);
  dirLight.position.set(2.5, 6.5, 3.0);
  scene.add(dirLight);
  blobGeo = new THREE.PlaneGeometry(1, 1);
  blobMat = new THREE.MeshBasicMaterial({
    map: makeBlobTexture(), transparent: true, depthWrite: false, opacity: 0.85
  });
}

/* ===================== LINK — HAND-BUILT ===================== */
const LINK_HEIGHT = 1.2;               // metres — asserted from the loaded bbox
let linkFig = null;                    // { group, inner, shadow, height }
let modelLoaded = false;
let modelError = false;
let modelHeight = 0;

function loadLink() {
  const loader = new GLTFLoader();
  loader.load('models/link-blender.glb', (gltf) => {
    const group = new THREE.Group();
    const inner = gltf.scene;
    const bb = new THREE.Box3().setFromObject(inner);
    const size = new THREE.Vector3(); bb.getSize(size);
    modelHeight = size.y;
    // model is authored at exactly 1.2 m; nudge by the measured ratio anyway
    const s = LINK_HEIGHT / size.y;
    inner.scale.setScalar(s);
    inner.position.y = -bb.min.y * s;
    group.add(inner);
    group.position.set(0, 0, MODEL_Z);
    scene.add(group);
    const shadow = new THREE.Mesh(blobGeo, blobMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(0, 0.012, MODEL_Z);
    shadow.scale.set(1.0, 0.8, 1);
    scene.add(shadow);
    linkFig = { group, inner, shadow };
    modelLoaded = true;
  }, undefined, () => { modelError = true; });
}

/* breathing sway: barely-there, feet stay planted (scale about the floor) */
function updateLink(t) {
  if (!linkFig) return;
  const b = Math.sin(t * 0.0016);              // ~4 s breath
  linkFig.group.scale.set(1 + 0.0022 * b, 1 + 0.0055 * b, 1 + 0.0022 * b);
  linkFig.group.rotation.z = 0.0035 * Math.sin(t * 0.0009);
}

/* ============================== hearts (fx overlay) ============================== */
function spawnHeartsAt(sx, sy, n, s) {
  for (let i = 0; i < n; i++) {
    hearts.push({
      x: sx + rand(-16, 16) * (s || 1), y: sy,
      vx: rand(-9, 9), vy: rand(-50, -32),
      life: 0, max: rand(0.7, 1.15), size: rand(7, 11) * (s || 1)
    });
  }
}
function updateHearts(dt) {
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.life += dt; h.x += h.vx * dt; h.y += h.vy * dt; h.vy -= 6 * dt;
    if (h.life >= h.max) hearts.splice(i, 1);
  }
}
function drawHeart(h) {
  const a = clamp(1 - h.life / h.max, 0, 1);
  const s = h.size * (0.7 + 0.3 * (h.life / h.max));
  fctx.save();
  fctx.translate(h.x + Math.sin(h.life * 6 + h.size) * 2.5, h.y);
  fctx.scale(s / 10, s / 10);
  fctx.fillStyle = 'rgba(255,92,132,' + (a * 0.95) + ')';
  fctx.beginPath();
  fctx.moveTo(0, 8);
  fctx.bezierCurveTo(-11, -2, -6, -11, 0, -5);
  fctx.bezierCurveTo(6, -11, 11, -2, 0, 8);
  fctx.fill();
  fctx.restore();
}

/* ============================== taps ============================== */
const raycaster = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const _pv = new THREE.Vector3();

function petLink(hitY) {
  heartTotal++;
  heartCountEl.textContent = heartTotal;
  _pv.set(0, hitY || 0.95, MODEL_Z).project(camera);
  const sx = (_pv.x * 0.5 + 0.5) * W;
  const sy = (_pv.y * -0.5 + 0.5) * H;
  spawnHeartsAt(sx, sy, 7, 1.6);
  sndGiggle();
  hintEl.classList.remove('show');
}
glCanvas.addEventListener('pointerdown', (e) => {
  if (!started || !linkFig) return;
  if (window.__linkModeState && window.__linkModeState.mode === 'rotate') return; // ROTATE: link-mode-block taps on pointerup
  initAudio(); resumeAudio();
  _ndc.set((e.clientX / Math.max(1, W)) * 2 - 1, -((e.clientY / Math.max(1, H)) * 2 - 1));
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObject(linkFig.inner, true);
  if (hits.length) petLink(hits[0].point.y);
});

/* ================= BEGIN link-mode-block: WALK / ROTATE viewing modes =================
   Self-contained viewing-mode logic: mode toggle, drag-to-turn with inertia,
   two-finger pinch zoom (via camera distance), nudge / auto-spin / reset.
   PORT NOTE: to move this to another page, copy this block plus the
   link-mode-css <style> and the link-mode-block HTML (ids: modeBar, rotPanel,
   hmWalk, hmRotate, hmLeft, hmRight, hmAuto, hmReset), and keep the one-line
   rotate guard at the top of the page's own canvas pointerdown handler.
   It expects these page globals: linkFig, camera, CAM_BASE, MODEL_Z, started,
   hintEl, raycaster, _ndc, petLink, initAudio, resumeAudio, clamp, W, H. */
const HM = {
  mode: 'walk', yaw: 0, vel: 0, scale: 1, auto: false,
  dragging: false, moved: 0, downAt: 0, lastX: 0,
  pointers: new Map(), pinchD: 0
};
window.__linkModeState = HM;
const HM_BASE_Z = CAM_BASE.z;                 // default camera z (RESET target)
const HM_DIST = CAM_BASE.z - MODEL_Z;         // framing distance at scale 1
const hmBar = document.getElementById('modeBar');
const hmPanel = document.getElementById('rotPanel');
const hmWalkBtn = document.getElementById('hmWalk');
const hmRotateBtn = document.getElementById('hmRotate');
const hmAutoBtn = document.getElementById('hmAuto');
const HM_HINTS = {
  walk: 'Walk around him · Tap Link to say hi',
  rotate: 'Drag sideways to turn him · Tap him to say hi'
};
function hmSetMode(m) {
  HM.mode = m; HM.vel = 0; HM.dragging = false; HM.pointers.clear(); HM.pinchD = 0;
  hmWalkBtn.classList.toggle('on', m === 'walk');
  hmRotateBtn.classList.toggle('on', m === 'rotate');
  hmPanel.classList.toggle('hidden', m !== 'rotate');
  hintEl.textContent = HM_HINTS[m];
  if (started) {
    hintEl.classList.add('show');
    clearTimeout(hmSetMode._t);
    hmSetMode._t = setTimeout(() => hintEl.classList.remove('show'), 2600);
  }
}
hmWalkBtn.addEventListener('click', () => hmSetMode('walk'));
hmRotateBtn.addEventListener('click', () => hmSetMode('rotate'));
document.getElementById('hmLeft').addEventListener('click', () => { HM.yaw -= Math.PI / 12; HM.vel = 0; });
document.getElementById('hmRight').addEventListener('click', () => { HM.yaw += Math.PI / 12; HM.vel = 0; });
hmAutoBtn.addEventListener('click', () => { HM.auto = !HM.auto; hmAutoBtn.classList.toggle('on', HM.auto); });
document.getElementById('hmReset').addEventListener('click', () => {
  HM.yaw = 0; HM.vel = 0; HM.scale = 1; HM.auto = false;
  hmAutoBtn.classList.remove('on');
  CAM_BASE.z = HM_BASE_Z;
});
function hmPetTap(cx, cy) {
  _ndc.set((cx / Math.max(1, W)) * 2 - 1, -((cy / Math.max(1, H)) * 2 - 1));
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObject(linkFig.inner, true);
  if (hits.length) petLink(hits[0].point.y);
}
glCanvas.addEventListener('pointerdown', (e) => {
  if (!started || !linkFig || HM.mode !== 'rotate') return;
  initAudio(); resumeAudio();
  HM.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { glCanvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (HM.pointers.size === 1) {
    HM.dragging = true; HM.moved = 0; HM.downAt = performance.now();
    HM.lastX = e.clientX; HM.vel = 0;
  } else if (HM.pointers.size === 2) {
    const p = [...HM.pointers.values()];
    HM.pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    HM.dragging = false;
  }
});
glCanvas.addEventListener('pointermove', (e) => {
  if (HM.mode !== 'rotate' || !HM.pointers.has(e.pointerId)) return;
  HM.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (HM.pointers.size === 2) {
    const p = [...HM.pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (HM.pinchD > 0 && d > 0) {
      HM.scale = clamp(HM.scale * (d / HM.pinchD), 0.5, 1.5);
      CAM_BASE.z = MODEL_Z + HM_DIST / HM.scale;
    }
    HM.pinchD = d;
    return;
  }
  if (!HM.dragging) return;
  const dx = e.clientX - HM.lastX;
  HM.lastX = e.clientX;
  HM.moved += Math.abs(dx);
  HM.yaw += dx * 0.009;
  HM.vel = HM.vel * 0.6 + dx * 0.009 * 0.4;
});
function hmPointerEnd(e) {
  if (!HM.pointers.has(e.pointerId)) return;
  const wasTap = HM.pointers.size === 1 && HM.dragging && HM.moved < 10 &&
                 (performance.now() - HM.downAt) < 350;
  HM.pointers.delete(e.pointerId);
  if (HM.pointers.size < 2) HM.pinchD = 0;
  if (HM.pointers.size === 0) {
    HM.dragging = false;
    if (wasTap && HM.mode === 'rotate' && linkFig) hmPetTap(e.clientX, e.clientY);
  }
}
glCanvas.addEventListener('pointerup', hmPointerEnd);
glCanvas.addEventListener('pointercancel', hmPointerEnd);
(function hmTick() {
  requestAnimationFrame(hmTick);
  hmBar.classList.toggle('hidden', !started);
  if (!linkFig) return;
  if (HM.mode === 'rotate' && !HM.dragging && HM.pointers.size === 0) {
    HM.yaw += HM.vel;                 // inertia glide
    HM.vel *= 0.95;
    if (HM.auto) HM.yaw += 0.0036;    // auto-spin ~12 deg/s at 60 fps
  }
  linkFig.group.rotation.y = HM.yaw;
})();
window.__linkMode = {
  get mode() { return HM.mode; },
  get yaw() { return HM.yaw; },
  get scale() { return HM.scale; },
  setMode: hmSetMode
};
/* ================= END link-mode-block ================= */

/* ============================== resize ============================== */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [roomCanvas, fxCanvas]) {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
  }
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  floorTop = Math.round(H * 0.34);
  if (renderer && camera) {
    renderer.setSize(W, H);
    camera.aspect = W / Math.max(1, H);
    camera.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);

/* ============================== main loop ============================== */
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 0.016);
  lastT = t;
  updateParallax(t);
  if (!camOK) { rctx.clearRect(0, 0, W, H); drawRoom(); }
  if (camera) {
    camera.position.set(CAM_BASE.x + parX * 0.9, CAM_BASE.y - parY * 0.45, CAM_BASE.z);
    if (!applyMotionCamera()) {
      camera.lookAt(CAM_LOOK.x - parX * 0.5, CAM_LOOK.y - parY * 0.3, CAM_LOOK.z);
    }
  }
  updateLightMatch(t, dt);
  if (started) { updateLink(t); updateHearts(dt); }
  if (renderer) renderer.render(scene, camera);
  fctx.clearRect(0, 0, W, H);
  for (const h of hearts) drawHeart(h);
}

/* ============================== start flow ============================== */
let startInFlight = false;
document.getElementById('startBtn').addEventListener('click', async () => {
  if (startInFlight) return;
  startInFlight = true;
  askMotionPermission();   // FIRST, synchronously — iOS only honors it inside the tap
  initAudio();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no getUserMedia');
    const stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('camera timeout')), 4500))
    ]);
    video.srcObject = stream;
    await video.play().catch(() => {});
    camOK = true;
  } catch (e) { camOK = false; }
  video.classList.toggle('hidden', !camOK);
  roomCanvas.classList.toggle('hidden', camOK);
  startEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  started = true;
  MOTION.recal = true;
  motionWatchdog();
  hintEl.classList.add('show');
  setTimeout(() => hintEl.classList.remove('show'), 7000);
});

/* ============================== boot + test hook ============================== */
resize();
initGL();
resize();
loadLink();
requestAnimationFrame(frame);

window.__linkHy3d = {
  get started() { return started; },
  get camOK() { return camOK; },
  get loaded() { return modelLoaded; },
  get modelError() { return modelError; },
  get hearts() { return heartTotal; },
  height: () => modelHeight,
  start: () => document.getElementById('startBtn').click()
};
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
</body>
