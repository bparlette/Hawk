<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Starry Night — a living painting</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1026;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }
  #chip {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateX(-50%);
    background: rgba(10, 14, 34, 0.62); color: #f5eeda;
    font: 500 14px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: 0.02em; padding: 9px 16px; border-radius: 999px;
    border: 1px solid rgba(245, 238, 218, 0.35);
    pointer-events: none; white-space: nowrap;
    opacity: 1; transition: opacity 1.4s ease;
    z-index: 10;
  }
  #chip.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="chip">The Starry Night — drag the sky, tap a star</div>
<script>
'use strict';
/* ------------------------------------------------------------------
   The Starry Night — living painting sample.
   The artwork IS the painting (painting.jpg, 1920x1520). Nothing is
   redrawn: every frame starts from the pristine image, then
   - two circular patches copied from the painting rotate in place
     about their own centres (so a patch always covers its origin),
   - stars and the moon breathe via additive halos drawn over them,
   - village windows flicker with soft warm glows,
   - taps on a star launch a shooting star; drags stir a gust that
     briefly spins the swirls faster.
   ------------------------------------------------------------------ */

const IW = 1920, IH = 1520; // painting pixels

// Star centres/radii in painting fractions (x of width, y of height,
// r of width). Positions measured against the actual painting.
const STARS = [
  { x: 0.106, y: 0.062, r: 0.075 },  // top-left
  { x: 0.231, y: 0.055, r: 0.034 },  // small orange, top
  { x: 0.336, y: 0.072, r: 0.058 },  // top centre-left
  { x: 0.413, y: 0.100, r: 0.040 },  // small, top centre
  { x: 0.235, y: 0.171, r: 0.085 },  // mid left
  { x: 0.610, y: 0.098, r: 0.070 },  // top centre-right
  { x: 0.697, y: 0.226, r: 0.055 },  // mid right
  { x: 0.326, y: 0.334, r: 0.050 },  // small, centre-left
  { x: 0.045, y: 0.459, r: 0.034 },  // tiny, left edge
  { x: 0.130, y: 0.486, r: 0.070 },  // left, below cypress tip line
  { x: 0.356, y: 0.520, r: 0.105 }   // the big one (Venus)
];
const MOON = { x: 0.903, y: 0.190, r: 0.125, moon: true };

// Village window lights (painting fractions), measured from the image.
const WINDOWS = [
  { x: 0.487, y: 0.859 }, { x: 0.612, y: 0.927 }, { x: 0.689, y: 0.858 },
  { x: 0.733, y: 0.826 }, { x: 0.768, y: 0.878 }, { x: 0.790, y: 0.871 },
  { x: 0.819, y: 0.912 }, { x: 0.889, y: 0.918 }
];

// The two great swirls. r in painting px (of width).
const SWIRLS = [
  { cx: 0.505, cy: 0.325, r: 0.165, dir:  1, ang: 0 },  // the big vortex
  { cx: 0.698, cy: 0.445, r: 0.100, dir: -1, ang: 0 }   // the smaller curl
];
const BASE_SPIN = 0.028; // rad/s — one revolution in ~3.7 minutes

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const img = new Image();
img.src = 'painting.jpg';

let vw = 0, vh = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}
window.addEventListener('resize', resize);
resize();

/* Cover-fit view. Focal point favours the sky. On narrow (portrait)
   screens the cover crop is wide, so the view slowly drifts across
   the painting and back — every part of it gets its moment. */
const view = { scale: 1, ox: 0, oy: 0 };
function computeView(t) {
  const s = Math.max(vw / IW, vh / IH);
  view.scale = s;
  const dispW = IW * s, dispH = IH * s;
  const overX = dispW - vw, overY = dispH - vh;
  // vertical: anchor a little above centre so the sky keeps its stars
  view.oy = -overY * 0.40;
  if (overX > 40) {
    const p = 0.5 + 0.5 * Math.sin(t * (Math.PI * 2 / 52) - Math.PI / 2); // 52 s sweep
    view.ox = -overX * p;
  } else {
    view.ox = -overX / 2;
  }
}
function toImage(px, py) { // screen css px -> painting px
  return { x: (px - view.ox) / view.scale, y: (py - view.oy) / view.scale };
}
function toScreen(ix, iy) { // painting px -> screen css px
  return { x: ix * view.scale + view.ox, y: iy * view.scale + view.oy };
}

/* Feathered circular patch copied from the pristine painting. */
function makePatch(sw) {
  const R = sw.r * IW;
  const d = Math.ceil(R * 2);
  const c = document.createElement('canvas');
  c.width = d; c.height = d;
  const g = c.getContext('2d');
  g.drawImage(img, sw.cx * IW - R, sw.cy * IH - R, d, d, 0, 0, d, d);
  g.globalCompositeOperation = 'destination-in';
  const grad = g.createRadialGradient(R, R, R * 0.70, R, R, R);
  grad.addColorStop(0, 'rgba(0,0,0,1)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, d, d);
  sw.patch = c; sw.R = R;
}

/* Soft round glow sprite, tinted per-draw via hue canvas variants. */
function makeGlow(r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.85)');
  grad.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.32)');
  grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = grad;
  x.fillRect(0, 0, 128, 128);
  return c;
}
const glowStar = makeGlow(255, 240, 190);
const glowMoon = makeGlow(255, 226, 140);
const glowWindow = makeGlow(255, 186, 84);

/* ---------------- state ---------------- */
const stars = STARS.concat([MOON]).map((s, i) => ({
  x: s.x * IW, y: s.y * IH, r: s.r * IW, moon: !!s.moon,
  phase: (i * 1.618) % (Math.PI * 2),
  speed: 0.55 + ((i * 37) % 10) / 14 // 0.55 .. 1.19 rad/s, all different
}));
const windows_ = WINDOWS.map((w, i) => ({
  x: w.x * IW, y: w.y * IH, phase: (i * 2.399) % (Math.PI * 2)
}));
const shooters = [];   // {x,y,vx,vy,t,life}
const motes = [];      // wind streak particles while dragging
let gust = 0;          // signed extra spin, decays after a drag
let gustHold = 0;      // while dragging: target gust from drag velocity
let frames = 0;
let ready = false;

img.onload = () => {
  SWIRLS.forEach(makePatch);
  ready = true;
};

/* ---------------- interaction ---------------- */
let downAt = null, downPos = null, lastMove = null, dragDist = 0;

function nearestStar(ix, iy) {
  let best = null, bd = 0.11 * IW; // generous tap radius, painting px
  for (const s of stars) {
    const d = Math.hypot(s.x - ix, s.y - iy);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function launchShooter(s) {
  // streak away from the star, mostly downward, away from the moon side bias
  const dirx = (s.x < IW * 0.5 ? 1 : -1) * (0.55 + Math.random() * 0.3);
  const diry = 0.55 + Math.random() * 0.35;
  const sp = IW * (0.55 + Math.random() * 0.25);
  const m = Math.hypot(dirx, diry);
  shooters.push({
    x: s.x, y: s.y,
    vx: dirx / m * sp, vy: diry / m * sp,
    t: 0, life: 0.85 + Math.random() * 0.3
  });
}
canvas.addEventListener('pointerdown', (e) => {
  downAt = performance.now();
  downPos = { x: e.clientX, y: e.clientY };
  lastMove = { x: e.clientX, y: e.clientY, t: downAt };
  dragDist = 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!downPos || !lastMove) return;
  const now = performance.now();
  const dx = e.clientX - lastMove.x;
  const dy = e.clientY - lastMove.y;
  const dt = Math.max((now - lastMove.t) / 1000, 0.008);
  dragDist += Math.abs(dx) + Math.abs(dy);
  const ip = toImage(e.clientX, e.clientY);
  if (ip.y < IH * 0.68) { // a gust only makes sense in the sky
    const vx = dx / dt; // screen px/s
    const target = Math.max(-1, Math.min(1, vx / 900));
    gustHold = target * 1.5;
    if (Math.abs(dx) + Math.abs(dy) > 3 && motes.length < 90) {
      motes.push({
        x: ip.x, y: ip.y,
        vx: dx / dt * 0.55 / view.scale, vy: dy / dt * 0.55 / view.scale,
        t: 0, life: 0.55 + Math.random() * 0.3
      });
    }
  }
  lastMove = { x: e.clientX, y: e.clientY, t: now };
});
function endPointer(e) {
  if (downPos && downAt) {
    const dt = performance.now() - downAt;
    if (dt < 320 && dragDist < 14) { // a tap
      const ip = toImage(e.clientX, e.clientY);
      const s = nearestStar(ip.x, ip.y);
      if (s) launchShooter(s);
    }
  }
  downAt = null; downPos = null; lastMove = null;
  gustHold = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* Gesture / zoom guards (on top of touch-action:none + viewport). */
['gesturestart', 'gesturechange', 'gestureend'].forEach((n) =>
  document.addEventListener(n, (e) => e.preventDefault()));
document.addEventListener('dblclick', (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = performance.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------- frame ---------------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1; // generous clamp: cosmetic motion should track wall-clock even on slow renderers
  frames++;

  computeView(t);

  // gust physics: chase the drag target, otherwise decay
  if (downPos) gust += (gustHold - gust) * Math.min(1, dt * 7);
  else gust *= Math.pow(0.35, dt); // ~1.5 s tail

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (!ready) {
    ctx.fillStyle = '#0b1026';
    ctx.fillRect(0, 0, vw, vh);
    return;
  }

  // 1) the pristine painting, cover-fit
  ctx.drawImage(img, view.ox, view.oy, IW * view.scale, IH * view.scale);

  // 2) the swirls, turning about their own centres. At rest they counter-
  //    rotate at BASE_SPIN; a gust adds one shared signed spin on top, so
  //    both whirl briefly the way the drag went.
  for (const sw of SWIRLS) {
    sw.ang += (sw.dir * BASE_SPIN + gust * 0.9) * dt;
    const c = toScreen(sw.cx * IW, sw.cy * IH);
    const R = sw.R * view.scale;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(sw.ang);
    ctx.drawImage(sw.patch, -R, -R, R * 2, R * 2);
    ctx.restore();
  }

  // 3) stars + moon breathing (additive halos over the pristine paint)
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const p = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
    const c = toScreen(s.x, s.y);
    const R = s.r * view.scale * (1.55 + 0.5 * p);
    ctx.globalAlpha = 0.10 + 0.17 * p;
    ctx.drawImage(s.moon ? glowMoon : glowStar, c.x - R, c.y - R, R * 2, R * 2);
  }

  // 4) village windows flickering
  for (const w of windows_) {
    const f = 0.5 + 0.32 * Math.sin(t * 2.1 + w.phase) + 0.18 * Math.sin(t * 7.3 + w.phase * 2);
    const c = toScreen(w.x, w.y);
    const R = 15 * view.scale * 2.2;
    ctx.globalAlpha = Math.max(0.03, 0.16 * f + 0.05);
    ctx.drawImage(glowWindow, c.x - R, c.y - R, R * 2, R * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 5) wind motes while dragging
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.t += dt;
    if (m.t >= m.life) { motes.splice(i, 1); continue; }
    m.x += m.vx * dt; m.y += m.vy * dt;
    const a = 0.30 * (1 - m.t / m.life);
    const p0 = toScreen(m.x, m.y);
    const p1 = toScreen(m.x - m.vx * 0.05, m.y - m.vy * 0.05);
    ctx.strokeStyle = 'rgba(205,225,255,' + a.toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, 1.6 * view.scale);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p0.x, p0.y); ctx.stroke();
  }

  // 6) shooting stars
  for (let i = shooters.length - 1; i >= 0; i--) {
    const sh = shooters[i];
    sh.t += dt;
    if (sh.t >= sh.life) { shooters.splice(i, 1); continue; }
    const hx = sh.x + sh.vx * sh.t;
    const hy = sh.y + sh.vy * sh.t + 0.5 * 260 * sh.t * sh.t;
    const fade = Math.sin(Math.PI * Math.min(sh.t / sh.life, 1));
    const head = toScreen(hx, hy);
    const tail = toScreen(hx - sh.vx * 0.16, hy - sh.vy * 0.16);
    const grad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
    grad.addColorStop(0, 'rgba(255,246,214,0)');
    grad.addColorStop(1, 'rgba(255,246,214,' + (0.85 * fade).toFixed(3) + ')');
    ctx.strokeStyle = grad;
    ctx.lineWidth = Math.max(1.2, 2.2 * view.scale);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(head.x, head.y); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    const R = 26 * view.scale;
    ctx.globalAlpha = 0.55 * fade;
    ctx.drawImage(glowStar, head.x - R, head.y - R, R * 2, R * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}
requestAnimationFrame(frame);

/* Title chip fades away once the painting has had its moment. */
setTimeout(() => document.getElementById('chip').classList.add('gone'), 4200);

/* Debug/test hook. */
window.__dbg = {
  get frames() { return frames; },
  get ready() { return ready; },
  get shooters() { return shooters.length; },
  get gust() { return gust; },
  get view() { return { scale: view.scale, ox: view.ox, oy: view.oy }; },
  toScreen: (fx, fy) => toScreen(fx * IW, fy * IH),
  stars: STARS.concat([MOON]),
  swirlAngles: () => SWIRLS.map((s) => s.ang)
};
</script>
</body>
</html>
