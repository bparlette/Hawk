<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=3c5f59b5-f6d4-420e-845f-e2721f1ee59b
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Mr. Baseball 2</title>
    <link rel="stylesheet" href="style.css">
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div id="score">SCORE: 0</div>
            <div id="lives">LIVES: 3</div>
            <div id="start-screen">
                <h1>MR. BASEBALL 2</h1>
                <p>CLICK TO START</p>
                <p class="controls">CLICK to Toss &amp; Swing | Defend the Left!</p>
            </div>
            <div id="gameover-screen" style="display:none">
                <h1>GAME OVER</h1>
                <p id="final-score">SCORE: 0</p>
                <button id="restart-btn" type="button">↻ PLAY AGAIN</button>
                <p class="controls">CLICK to Toss &amp; Swing | Defend the Left!</p>
            </div>
        </div>
        <div class="scanlines"></div>
    </div>
    <script type="module" src="src/main.js"></script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
</body>

</html>
