<title>Hyrule DOORS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* One arcade cabinet column: 256x224 pixel screen on top, NES-style pad below, built for a phone held upright. */
:root{
  --bg:#07070c;
  --deck:#17171d;
  --face:#26262c;
  --ink:#0c0c10;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{
  display:flex;justify-content:center;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  overflow:hidden;
}
/* Fullscreen stage (Cherie 2026-10-30): the GAME fills the screen; only the
   controls are visible besides it. No cabinet furniture. The stage flexes to
   every leftover pixel and the canvas scales with object-fit:contain —
   as large as the phone allows, never cropped, never distorted. */
.cab{
  position:relative;
  width:100%;height:100dvh;
  min-width:0;
}
.screen-wrap{position:absolute;inset:0;background:#000;line-height:0}
canvas{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 38%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(to bottom, rgba(5,5,8,0), rgba(5,5,8,.78) 32%);
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"dpad ab" "mid mid";
  gap:10px;align-items:center;
  padding:26px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:clamp(132px, 36vw, 168px);height:clamp(132px, 36vw, 168px);touch-action:none;justify-self:start}
.bar{position:absolute;background:var(--face);border-radius:6px;box-shadow:inset 0 0 0 2px #33333c}
.bar.h{left:0;right:0;top:calc(50% - 22px);height:44px}
.bar.v{top:0;bottom:0;left:calc(50% - 22px);width:44px}
.hub{position:absolute;left:calc(50% - 13px);top:calc(50% - 13px);width:26px;height:26px;border-radius:50%;background:#101014}
.ar{position:absolute;background:#6a6a75}
.ar.u{top:8px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:8px;left:calc(50% - 8px);width:16px;height:14px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:8px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:8px;top:calc(50% - 8px);width:14px;height:16px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:center;gap:16px;padding:6px 4px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:7px}
.round{
  width:clamp(60px, 16.5vw, 78px);height:clamp(60px, 16.5vw, 78px);border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 16px var(--pixel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 9px var(--pixel);color:#a5a5b0;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;justify-content:center;gap:22px}
.mid button{
  border:0;background:var(--face);color:#c9c9d2;font:400 10px var(--pixel);
  padding:9px 14px;border-radius:999px;cursor:pointer;touch-action:none;min-width:96px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{position:absolute;top:8px;left:0;right:0;margin:0;padding:0 14px;color:var(--muted);font-size:11px;line-height:1.55;text-align:center;text-wrap:balance;pointer-events:none}
.keys b{color:var(--text);font-weight:500}
@media (pointer:coarse){ .keys{display:none} }
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Hyrule DOORS game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, HIDE">B</button><span>HIDE</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, OPEN">A</button><span>OPEN</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> ARROWS walk, A open door / grab key, B hide in pot (press again to leave). When torches flicker: hide! Enter starts, M mutes.</p>
</main>

<script>
(() => {

  boom:  () => { noise(0.35, 0.6); tone(120, 0.4, 'sawtooth', 0.3, -80); },
  coin:  () => { tone(988, 0.06, 'square', 0.22); tone(1319, 0.14, 'square', 0.22, 0, 0.06); },

  power: () => tone(300, 0.4, 'square', 0.25, 900),
  beep:  () => tone(520, 0.12, 'square', 0.3),
  go:    () => tone(1040, 0.35, 'square', 0.3),
  win:   () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.28, 0, i * 0.13)),
  land:  () => { tone(120, 0.1, 'triangle', 0.5, -60); noise(0.06, 0.2); },

function popup(S, s, x, y, col) { S.pops.push({ s, x, y, col: col || Y, t:0 }); if (S.pops.length > 4) S.pops.shift(); }

const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rint = (S, n) => Math.floor(S.rng() * n);
const pick = (S, arr) => arr[rint(S, arr.length)];
/* grid BFS: pass(x,y)->bool, goal(x,y)->bool. returns {dx,dy,d} first step toward nearest goal, or null */
function bfs(w, h, pass, sx, sy, goal) {

    if (d > 0 && goal(x, y)) return { dx:fx, dy:fy, d };
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + a, ny = y + b;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h || seen[ny * w + nx] || !pass(nx, ny)) continue;

}
/* bot input from a direction vector (dx,dy) */
function dirInp(i, dx, dy) { if (dx > 0) i.r = 1; if (dx < 0) i.l = 1; if (dy > 0) i.d = 1; if (dy < 0) i.u = 1; return i; }
/* edge-detect helper: S.edge(inp,'a') true only on the frame a button goes down */
function mkEdge() { const p = {}; return (inp, k) => { const v = !!inp[k], r = v && !p[k]; p[k] = v; return r; }; }
function kit(c) {
  let S = null;
  const fresh = att => { S = { att:!!att, T:0, score:0, pops:[], rng:mkRng(runSeed(att ? c.seed : null, c.off || 7)), edge:mkEdge() }; c.setup(S, !!att); };
  return {
    id:c.id, t1:c.t1, t2:c.t2, sub:c.sub, music:c.music,
    init(att) { fresh(att); },
    update(dt, inp, mode) {
      S.att = mode === 'title'; S.T += dt;

    },
    render() { c.draw(S); drawParts(S); },
    hud(mode) { c.hud && c.hud(S, mode); drawPops(S); },
    info() { return Object.assign({ score:Math.round(S.score), t:+S.T.toFixed(1) }, c.info ? c.info(S) : {}); },
    bot() { return c.bot(S, NI()) || NI(); },
  };
}
/* finish helper: attract loops, real play ends. */
function finish(S, msg, bonus) { if (S.att) return 'reset'; endGame(S.score + (bonus || 0), msg); }
/* ---- added after the 20-game batch: the things most games re-wrote ---- */
const lerp = (a, b, t) => a + (b - a) * t;
function bar(x, y, w, h, v, max, col, bg) { rect(x, y, w, h, bg || DG); rect(x, y, Math.round(w * clamp(v / max, 0, 1)), h, col); }
/* timed on-screen hint: hint(S,'JUMP OVER GAPS',8) in hud(); shows only while S.T < secs in real play */
function hintS(S, s, secs, y) { if (!S.att && S.T < (secs || 8)) txt(s, 128, y || 214, W, 8, 'center'); }
/* particles: burst(S,x,y,col,n) in step; drawParts(S) at end of draw(); updated automatically by kit() */
function burst(S, x, y, col, n) { S.parts = S.parts || []; for (let k = 0; k < (n || 8); k++) { const a = S.rng() * 6.283, v = 20 + S.rng() * 50; S.parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 20, t:0.5 + S.rng() * 0.4, col }); } }
function drawParts(S) { for (const p of S.parts || []) rect(Math.round(p.x), Math.round(p.y), 2, 2, p.col); }
/* damage with invulnerability: hurtS(S,1) -> true if it landed. Needs S.hp; uses S.inv (seconds). */
function hurtS(S, n, fx) { if (S.inv > 0) return false; S.hp -= n || 1; S.inv = 1.2; sfx('hurt'); if (fx) burst(S, fx[0], fx[1], R, 8); return true; }

// KEYS: ARROWS walk, A open door / grab key, B hide in pot (press again to leave). When torches flicker: hide!
/* ===== HYRULE DOORS: sprint through numbered rooms; when the torches flicker a screaming wall demon rushes past. Hide in a pot! ===== */
const NR21 = 8, DX21 = 232;
const GAME = kit({
  id:'g21', t1:'HYRULE', t2:'DOORS', sub:'OPEN THE DOORS. HIDE FROM THE RUSH.', seed:52, off:21, secs:60,
  music:MUS(132, -29, true),
  setup(S) { S.room = 0; S.hearts = 3; S.p = { x:16, y:120, hid:0 }; newRoom(S); },
  step(S, dt, inp) {
    const p = S.p, r = S.r; r.t += dt; S.flash = Math.max(0, S.flash - dt);
    const pb = S.edge(inp, 'b'), pa = S.edge(inp, 'a');
    if (pb) { const pot = r.pots.find(q => Math.abs(q.x - p.x) < 14 && Math.abs(q.y - p.y) < 16); if (p.hid) { p.hid = 0; sfx('tick'); } else if (pot) { p.hid = 1; p.x = pot.x; p.y = pot.y; sfx('catch'); } }
    if (!p.hid) { p.x = clamp(p.x + (inp.r - inp.l) * 56 * dt, 8, 244); p.y = clamp(p.y + (inp.d - inp.u) * 56 * dt, 78, 160); }
    if (r.key && Math.abs(r.key.x - p.x) < 10 && Math.abs(r.key.y - p.y) < 12 && !p.hid) { r.key = null; r.has = 1; popup(S, 'GOT KEY', p.x, p.y - 12, Y); sfx('coin'); }
    if (pa && !p.hid && p.x > DX21 - 18 && Math.abs(p.y - 118) < 22) {
      if (r.locked && !r.has) popup(S, 'LOCKED!', p.x - 20, p.y - 12, R);
      else { S.score += 100; S.room++; sfx('clear'); if (S.room >= NR21) { sfx('win'); return finish(S, 'ESCAPED!', 1000 + S.hearts * 300); } newRoom(S); return; }
    }
    if (r.rush) {
      const q = r.rt = (r.rt || 0) + dt;
      if (q < 1.5) { r.warn = 1; if ((q * 6 | 0) !== (q * 6 - dt * 6 | 0)) sfx('hurt'); }
      else if (q < 2.3) { r.warn = 0; r.dx = (q - 1.5) / 0.8 * 330 - 40; if (!p.hid && r.dx > p.x - 6 && !r.hit) { r.hit = 1; S.hearts--; S.flash = 0.5; sfx('die'); popup(S, 'CAUGHT!', p.x, p.y - 12, R); if (S.hearts <= 0) { if (S.att) S.hearts = 3; else { endGame(S.score, 'CAUGHT BY RUSH'); return; } } } }
      else r.dx = -99;
    } else if (r.t > r.rd) { r.rush = 1; r.rt = 0; }
  },
  draw(S) {
    const r = S.r, p = S.p, dark = r.warn && (Math.floor(S.T * 14) & 1);
    clear(dark ? K : DG);
    for (let y = 72; y < 176; y += 16) for (let x = 0; x < VW; x += 16) if (((x + y) >> 4) & 1) rect(x, y, 16, 16, dark ? N : M);
    rect(0, 40, VW, 32, dark ? N : BRK); rect(0, 70, VW, 2, K); rect(0, 176, VW, 8, K);
    for (const x of [50, 130]) { rect(x, 52, 6, 10, O); rect(x + 1, 46, 4, 6, Math.floor(S.T * 12) & 1 ? Y : R); }
    rect(DX21, 84, 20, 64, r.locked && !r.has ? R : T); rect(DX21 + 4, 92, 12, 48, K); txt(String(S.room + 1).padStart(3, '0'), DX21 + 10, 74, W, 8, 'center');
    if (r.locked && !r.has) rect(DX21 + 6, 114, 6, 6, Y);
    for (const q of r.pots) { rect(q.x - 6, q.y - 8, 12, 14, O); rect(q.x - 4, q.y - 11, 8, 4, SKY); rect(q.x - 6, q.y - 2, 12, 2, T); }
    if (r.key) { rect(r.key.x - 3, r.key.y, 6, 4, Y); rect(r.key.x - 6, r.key.y + 1, 4, 2, Y); }
    if (!p.hid || (Math.floor(S.T * 4) & 1)) { const x = Math.round(p.x), y = Math.round(p.y); rect(x - 4, y - 14, 8, 5, T); rect(x - 4, y - 10, 8, 5, SKY); rect(x - 5, y - 5, 10, 8, R); rect(x - 4, y + 3, 3, 3, M); rect(x + 1, y + 3, 3, 3, M); if (p.hid) rect(x - 7, y - 16, 14, 24, O); }
    if (r.dx > -90 && r.rt >= 1.5 && r.rt < 2.4) { const x = Math.round(r.dx); rect(x - 30, 74, 34, 100, PU); rect(x - 6, 90, 8, 8, R); rect(x - 6, 120, 8, 8, R); rect(x - 10, 140, 14, 14, W); rect(x - 30, 74, 4, 100, K); }
    if (S.flash > 0) rect(0, 0, VW, VH, R);
  },
  hud(S, mode) {
    txt('DOOR ' + String(S.room + 1).padStart(3, '0') + '/' + String(NR21).padStart(3, '0'), 4, 4, W, 8); txt('HP ' + '*'.repeat(Math.max(0, S.hearts)), 252, 4, R, 8, 'right');
    txt('SCORE ' + pad5(S.score), 4, 16, Y, 8);
    if (S.r.warn) txt('!! RUSH !! HIDE !!', 128, 190, R, 8, 'center');
    if (S.p.hid) txt('HIDING', 128, 206, CY, 8, 'center');
    if (mode === 'play' && S.T < 9) txt('B: HIDE IN POT  A: OPEN DOOR', 128, 28, W, 8, 'center');
  },
  info: S => ({ room:S.room + 1, hearts:S.hearts, x:Math.round(S.p.x), hid:S.p.hid }),
  bot(S, i) {
    const p = S.p, r = S.r, mv = (tx, ty) => { if (Math.abs(tx - p.x) > 3) i[tx > p.x ? 'r' : 'l'] = 1; if (Math.abs(ty - p.y) > 3) i[ty > p.y ? 'd' : 'u'] = 1; };
    const danger = r.rush && r.rt < 2.4 && r.dx < 400, ahead = r.pots.filter(q => q.x >= p.x - 4).sort((a, b) => a.x - b.x)[0];

function newRoom(S) {
  const n = S.room, pots = [0, 1, 2].map(k => ({ x:60 + k * 60 + rint(S, 20), y:98 + rint(S, 50) }));
  S.p.x = 16; S.p.y = 120; S.p.hid = 0; S.flash = 0;
  S.r = { t:0, pots, locked:n % 3 === 2, has:0, key:n % 3 === 2 ? { x:100 + rint(S, 60), y:90 + rint(S, 60) } : null, rush:0, rd:1.2 + S.rng() * 1.5, rt:0, dx:-99, warn:0, hit:0 };
  if (n % 2 === 0) S.r.rd = 999;

/* ---------- shell: title / play / over flow, loop, test hooks ---------- */
let mode = 'title', overT = 0, result = null, hi = 0, blink = 0, botOn = false, tms = 0;
const HIK = 'nes6-hi-' + GAME.id;
try { hi = parseInt(localStorage.getItem(HIK) || '0', 10) || 0; } catch (_) {}
function endGame(score, msg) {
  if (mode !== 'play') return;
  mode = 'over'; overT = 0;
  const isBest = score > hi;
  if (isBest) { hi = score; try { localStorage.setItem(HIK, String(hi)); } catch (_) {} }
  result = { score, msg, isBest };
  sfx(msg && /CLEAR|WIN|KO!|FINISH/.test(msg) ? 'win' : 'over');
}
GAME.init(true);
function begin() { tms = 0; blink = 0; GAME.init(false); mode = 'play'; result = null; }
function step(dt) {
  blink += dt; tms += dt;
  const raw = readInput();
  if (mode === 'title') {
    if (raw.start) { begin(); sfx('beep'); }
    else GAME.update(dt, GAME.bot ? GAME.bot() : BLANK, 'title');
  } else if (mode === 'play') {
    GAME.update(dt, botOn && GAME.bot ? GAME.bot() : raw, 'play');
  } else {
    overT += dt;
    if (raw.start && overT > 1.5) { begin(); sfx('beep'); }
  }
}
function render() {
  GAME.render(mode);
  for (let i = 0; i < buf.length; i++) px32[i] = PAL32[buf[i]];
  ctx.putImageData(img, 0, 0);
  GAME.hud(mode);
  const WH = HEX[W], YE = HEX[Y];
  if (mode === 'title') {
    panel(16, 12, 224, 96);
    const s1 = GAME.t1.length <= 6 ? 32 : 24;
    txt(GAME.t1, 128, s1 === 32 ? 22 : 28, YE, s1, 'center');
    txt(GAME.t2, 128, 62, WH, GAME.t2.length > 8 ? 16 : 24, 'center');
    txt(GAME.sub, 128, 90, HEX[CY], 8, 'center');
    if (Math.floor(blink * 2) & 1) txt('PRESS START', 128, 120, WH, 8, 'center');
    txt('HI ' + pad5(hi), 128, 134, YE, 8, 'center');
  } else if (mode === 'over' && result) {
    panel(32, 52, 192, 100);
    txt(result.msg || 'GAME OVER', 128, 64, YE, 16, 'center');
    txt('SCORE ' + pad5(result.score), 128, 94, WH, 8, 'center');
    if (result.isBest) { if (Math.floor(blink * 3) & 1) txt('NEW BEST!', 128, 110, HEX[E], 8, 'center'); }
    else txt('BEST ' + pad5(hi), 128, 110, WH, 8, 'center');
    if (overT > 1.5 && (Math.floor(blink * 2) & 1)) txt('PRESS START', 128, 130, WH, 8, 'center');
  }
}
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  render();
  requestAnimationFrame(frame);
}
if (!window.__norun) requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
window.__shell = {
  start: () => begin(),
  bot: on => { botOn = !!on; },
  ff: n => { for (let i = 0; i < n; i++) step(1 / 60); },
  render,
  step: () => { window.__now = (window.__now || 0) + 1 / 60; step(1 / 60); },
  info: () => Object.assign({ mode, result, hi }, GAME.info ? GAME.info() : {}),
  go: () => { startEdge = true; },
  mode: () => mode, music: () => GAME.music,
  get seed() { return activeSeed; }, get seedFromUrl() { return SEED_Q; },
};

})();
