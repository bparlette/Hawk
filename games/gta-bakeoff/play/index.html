<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vice Beach — one level, every era</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:600 12px system-ui,sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #stage{position:fixed;inset:0;margin:auto;height:100%;aspect-ratio:420/860;max-width:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #eras{position:absolute;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;gap:4px}
  #eras button{flex:1;height:28px;border:0;border-radius:6px;background:#0009;color:#fff;font:inherit}
  #eras button[disabled]{opacity:.35}
  #eras button.on{background:#f07820}
  #label{position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 34px);left:8px;text-shadow:0 1px 2px #000}
  #msg{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:20px;text-shadow:0 2px 4px #000;pointer-events:none}
  #act{position:absolute;right:18px;bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;
    border:2px solid #fffc;background:#0006;color:#fff;font:inherit;font-size:13px}
  #act.hot{background:#f07820cc}
  #stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid #fff8;display:none;pointer-events:none}
  #nub{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fffa}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="eras"></div><div id="label"></div><div id="msg"></div>
  <div id="stick"><div id="nub"></div></div>
  <button id="act">IN / OUT</button>
</div>
<script type="module">
import { createSim, createAutopilot, DT, TUNE } from "./engine/sim.js?v=2026-11-15-4";
import { adaptLevel } from "./engine/level_vice.js?v=2026-11-15-4";
import { createEraAudio } from "./engine/audio.js?v=2026-11-15-4";
import { ERAS } from "./eras/index.js?v=2026-11-15-4";
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
// The canonical level: real Vice Beach, extracted from miami.cmp (level/extract_level.py),
// adapted to the sim's shape by play/engine/level_vice.js. Coral Strand is NOT used.
// The ?v= stamps (build 2026-11-15-4, kept in sync across this file, eras/index.js and
// eras/e1.js) exist because an in-app browser served Cherie a stale cached module graph
// on Nov 15, 2026 — a fresh HTML load must pull fresh modules, every time the tag moves.
const level = adaptLevel(await (await fetch("../level/canonical/vice_beach.json?v=2026-11-15-4")).json());
const audio = createEraAudio();
const stage = $("stage");
let sim, auto, demo = q.has("demo"), view = null, era = null;
const reset = () => { sim = createSim(level); auto = createAutopilot(sim); $("msg").textContent = ""; };
reset();

// ---- era switching: the sim keeps running, only the renderer is swapped ----
async function setEra(id) {
  const e = ERAS.find(x => x.id === id && x.load) || ERAS.find(x => x.load);
  const mod = await e.load();
  if (view) view.dispose();
  const old = $("view"), cv = document.createElement("canvas"); cv.id = "view"; old.replaceWith(cv);   // fresh canvas: 2D and WebGL eras can't share one
  view = mod.create(cv, level); era = e;
  audio.setEra(e.id);
  [...$("eras").children].forEach(b => b.classList.toggle("on", b.dataset.id === e.id));
  $("label").textContent = `${e.n}. ${e.name}` + (demo ? " — The Run (demo)" : "");
}
for (const e of ERAS) { const b = document.createElement("button"); b.textContent = e.n; b.dataset.id = e.id; b.disabled = !e.load; b.title = e.name; b.onclick = () => setEra(e.id); $("eras").append(b); }
await setEra(q.get("era") || "e1");
if (q.has("clean")) for (const id of ["eras", "label", "act"]) $(id).style.visibility = "hidden";   // recording mode: no HUD chrome

// ---- input: floating thumb stick anywhere on the screen, one action button, keyboard as a second path ----
const inp = { mx: 0, my: 0, act: false }, keys = new Set(), R = 56;
let stickId = null, ox = 0, oy = 0;
stage.addEventListener("pointerdown", e => {
  audio.unlock();
  if (e.target.closest("#eras,#act") || stickId !== null) return;
  stickId = e.pointerId; ox = e.clientX; oy = e.clientY;
  const r = stage.getBoundingClientRect(); Object.assign($("stick").style, { display: "block", left: ox - r.left + "px", top: oy - r.top + "px" });
  if (sim.finished) reset();
  demo = false; $("label").textContent = `${era.n}. ${era.name}`;
});
addEventListener("pointermove", e => {
  if (e.pointerId !== stickId) return;
  let dx = (e.clientX - ox) / R, dy = (e.clientY - oy) / R; const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  inp.mx = dx; inp.my = dy; $("nub").style.transform = `translate(${dx * R}px,${dy * R}px)`;
});
const up = e => { if (e.pointerId !== stickId) return; stickId = null; inp.mx = inp.my = 0; $("stick").style.display = "none"; $("nub").style.transform = ""; };
addEventListener("pointerup", up); addEventListener("pointercancel", up);
const act = $("act");
act.addEventListener("pointerdown", e => { audio.unlock(); inp.act = true; demo = false; e.preventDefault(); });
for (const t of ["pointerup", "pointercancel", "pointerleave"]) act.addEventListener(t, () => inp.act = false);
addEventListener("keydown", e => { keys.add(e.code); if (!e.repeat) demo = false; });
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("contextmenu", e => e.preventDefault());
function readInput() {
  if (demo) return auto();
  const k = c => keys.has(c), kx = (k("ArrowRight") || k("KeyD")) - (k("ArrowLeft") || k("KeyA")), ky = (k("ArrowDown") || k("KeyS")) - (k("ArrowUp") || k("KeyW"));
  if (kx || ky) { const m = Math.hypot(kx, ky); return { mx: kx / m, my: ky / m, act: inp.act || k("KeyE") || k("Space") }; }
  return { mx: inp.mx, my: inp.my, act: inp.act || k("KeyE") || k("Space") };
}

// ---- fixed-step loop ----
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  while (acc >= DT) { if (!sim.finished) sim.step(readInput()); acc -= DT; }
  view.draw(sim);
  audio.update(sim);
  const near = sim.mode === "foot" && Math.hypot(sim.hero.x - sim.car.x, sim.hero.y - sim.car.y) <= TUNE.car.enterDist;
  act.classList.toggle("hot", near || (sim.mode === "drive" && Math.abs(sim.car.v) <= TUNE.car.exitSpeed));
  if (sim.finished && !$("msg").textContent) $("msg").textContent = `The Run — ${sim.t.toFixed(1)} s`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get sim() { return sim; }, get era() { return era.id; }, get demo() { return demo; }, setEra, reset };
</script>
</body>
</html>
