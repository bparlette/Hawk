<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HEXAGON HEAT — falling-tile survival</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a0505;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
  #cv{position:fixed;inset:0;display:block}
  .hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:1200;pointer-events:none}
  .chip{background:rgba(20,4,2,.72);color:#ffd9a0;border:1.5px solid rgba(255,150,50,.55);border-radius:999px;padding:5px 13px;font-size:17px;font-weight:700;line-height:1.15;backdrop-filter:blur(2px)}
  #mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 48px);right:10px;z-index:1201;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,150,50,.55);background:rgba(20,4,2,.72);font-size:20px;color:#fff;pointer-events:auto}
  #banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:1200;pointer-events:none;color:#fff;font-weight:900;font-size:44px;letter-spacing:1px;text-shadow:0 3px 0 #7a1400,0 6px 22px rgba(0,0,0,.6);opacity:0;transition:opacity .18s}
  #sub{position:fixed;left:0;right:0;top:calc(34% + 58px);text-align:center;z-index:1200;pointer-events:none;color:#ffe9c4;font-weight:700;font-size:19px;text-shadow:0 2px 8px rgba(0,0,0,.7);opacity:0;transition:opacity .18s}
  #start{position:fixed;inset:0;z-index:1300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 65%,rgba(255,90,0,.28),rgba(10,0,0,.78) 70%);color:#fff;text-align:center;padding:24px}
  #start h1{font-size:46px;margin:0 0 6px;font-weight:900;letter-spacing:1px;color:#ffb347;text-shadow:0 3px 0 #7a1400,0 8px 30px rgba(255,80,0,.45)}
  #start p{font-size:17px;line-height:1.45;color:#ffe9c4;max-width:330px;margin:6px 0}
  #start .go{margin-top:18px;background:#ff7a1a;color:#fff;border:none;border-radius:999px;font-size:22px;font-weight:900;padding:14px 42px;box-shadow:0 6px 0 #a33c00,0 12px 26px rgba(0,0,0,.5)}
  #start .go:active{transform:translateY(3px);box-shadow:0 3px 0 #a33c00}
  .stickBase,.stickKnob{position:fixed;border-radius:50%;z-index:1250;pointer-events:none;display:none}
  .stickBase{width:110px;height:110px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
  .stickKnob{width:52px;height:52px;background:rgba(255,180,90,.75);border:2px solid rgba(255,255,255,.65)}
</style>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="chip" id="hudRound">🔥 1</div>
  <div class="chip" id="hudAlive">👟 6</div>
  <div class="chip" id="hudTime">⏱ 0</div>
</div>
<button id="mute">🔊</button>
<div id="banner"></div><div id="sub"></div>
<div id="start">
  <h1>HEXAGON HEAT</h1>
  <p>🏃 Run! Tiles crack &amp; fall ~1s after you step on them.</p>
  <p>⬇️ 3 floors of hexes over lava. Drop a floor, keep running.</p>
  <p>🏆 Last runner standing wins the round!</p>
  <button class="go" id="goBtn">▶ RUN</button>
  <p style="font-size:13px;opacity:.75">Left thumb = joystick · WASD / arrows work too</p>
</div>
<div class="stickBase" id="sBase"></div><div class="stickKnob" id="sKnob"></div>

<script>
'use strict';
/* ================= HEXAGON HEAT — from-scratch falling-tile survival =================
   3 stacked hex-tile floors over lava. A tile starts dying the first time anyone
   stands on it: flash -> crack -> falls away (~1s). Fall through holes to the
   floor below; miss every floor and it's the lava. Last runner standing wins. */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
var lavaCache=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';lavaCache=null;}
window.addEventListener('resize',resize);resize();

/* ---------- audio (all synthesized) ---------- */
let AC=null,muted=false,master=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    if(navigator.audioSession)navigator.audioSession.type='playback';
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    const len=AC.sampleRate*0.05,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=0;
    const src=AC.createBufferSource();src.buffer=buf;src.connect(master);src.start();
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
document.addEventListener('pointerdown',()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();});
document.addEventListener('touchend',()=>{if(AC&&AC.state==='suspended')AC.resume();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state==='suspended')AC.resume();});
function tone(f0,f1,dur,type,vol,when){
  if(!AC||muted)return;const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.16,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,fFrom,fTo,vol,when,type){
  if(!AC||muted)return;const t=AC.currentTime+(when||0);
  const len=Math.max(1,(AC.sampleRate*dur)|0),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(fFrom,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,fTo),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
const sfx={
  crack(){noise(0.09,3000,700,0.10);noise(0.05,5000,2000,0.06,0.03);},
  tileFall(){noise(0.28,900,160,0.13);},
  step(){noise(0.03,1400,900,0.03);},
  land(){noise(0.07,500,180,0.14);tone(120,60,0.07,'sine',0.12);},
  splash(){noise(0.5,1200,120,0.30);tone(300,55,0.42,'sine',0.20);noise(0.25,3000,800,0.10,0.06,'bandpass');},
  poof(){noise(0.14,800,2400,0.10,0,'bandpass');},
  elim(){tone(520,90,0.3,'sawtooth',0.10);},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,f,0.16,'square',0.13,i*0.11));},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,f,0.18,'square',0.12,i*0.13));},
  count(){tone(660,660,0.08,'square',0.10);}
};
document.getElementById('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊';audioInit();});

/* ---------- hex grid ---------- */
const S=27;                       // hex radius (px, world units)
const SQ3=Math.sqrt(3);
const SQUASH=1.09;                // 3/4 top-down squash (= 0.86*VPITCH, keep in lockstep with VPITCH)
const VPITCH=1.27;                // vertical pitch factor — stretches the field taller (screen-fill)
const LIFT=105;                   // screen px between floors
const LAYERS=3;                   // 0 = bottom ... 2 = top
function hexToXY(q,r){return [S*SQ3*(q+r/2), S*1.5*VPITCH*r];}
function xyToHex(x,y){
  const rf=y/(S*1.5*VPITCH), qf=x/(S*SQ3)-rf/2;
  // cube round
  let cx=qf, cz=rf, cy=-cx-cz;
  let rx=Math.round(cx), ry=Math.round(cy), rz=Math.round(cz);
  const dx=Math.abs(rx-cx), dy=Math.abs(ry-cy), dz=Math.abs(rz-cz);
  if(dx>dy&&dx>dz)rx=-ry-rz; else if(dy>dz)ry=-rx-rz; else rz=-rx-ry;
  return [rx,rz];
}
function hexPath(c,x,y,s){
  c.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    const px=x+s*Math.cos(a), py=y+s*Math.sin(a)*SQUASH;
    if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
  }
  c.closePath();
}
/* deterministic per-tile crack pattern */
function crackSeed(q,r,l){let h=(q*374761393+r*668265263+l*974634211)>>>0;h=(h^(h>>13))*1274126177>>>0;return (h^(h>>16))>>>0;}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

/* ---------- game state ---------- */
const BOT_DEFS=[
  {name:'YOU', shirt:'#12b5a5',skin:'#f2c185',hair:'#3a2410',bot:false},
  {name:'RUBY',shirt:'#e33f5e',skin:'#8a5a2b',hair:'#111111',bot:true},
  {name:'LEO', shirt:'#3f7fe3',skin:'#f2c185',hair:'#e8c832',bot:true},
  {name:'MIA', shirt:'#ffb020',skin:'#6e4320',hair:'#5a2d0c',bot:true},
  {name:'ZED', shirt:'#8a4fe3',skin:'#ffd9b0',hair:'#20242c',bot:true},
  {name:'IVY', shirt:'#46c93c',skin:'#a06a35',hair:'#b03030',bot:true},
];
const LAYER_FILL=['#c93a12','#e8641c','#ffb03a'];   // bottom -> top base colors
const LAYER_EDGE=['#7e2008','#a83f0e','#cc7a1e'];
let G=null;
function buildTiles(radius){
  const tiles=new Map();
  for(let l=0;l<LAYERS;l++){
    const rad=radius+(LAYERS-1-l); // bottom floor is widest
    for(let q=-rad;q<=rad;q++)for(let r=-rad;r<=rad;r++){
      if(Math.abs(q+r)>rad)continue;
      tiles.set(l+','+q+','+r,{l,q,r,state:0,timer:0,fallY:0,fallV:0,seed:crackSeed(q,r,l)});
    }
  }
  return tiles;
}
function newGame(round){
  const crackDelay=Math.max(0.52, 1.05-0.13*(round-1));
  const radius=round<=2?3:2;
  G={round,phase:'count',countT:1.6,time:0,crackDelay,
     tiles:buildTiles(radius),chars:[],parts:[],shake:0,over:false,place:0,
     scale:1,cx:0,cy:0,msg:''};
  const spawns=[[0,-2],[2,1],[-2,1],[1,-2],[-1,2],[0,2]];
  BOT_DEFS.forEach((d,i)=>{
    const [sx,sy]=hexToXY(spawns[i][0],spawns[i][1]);
    G.chars.push({def:d,x:sx+(i%2?6:-6),y:sy, vx:0,vy:0,layer:LAYERS-1,falling:false,fallFrom:0,fallTo:0,fallT:0,
      alive:true,face:1,runPh:Math.random()*6,aiT:Math.random()*0.2,aiX:0,aiY:1,speed:d.bot?148+round*4+Math.random()*10:172,dead:0});
  });
  updateHUD();
}
function tileAt(l,x,y){const [q,r]=xyToHex(x,y);return G.tiles.get(l+','+q+','+r)||null;}
function aliveCount(){return G.chars.filter(c=>c.alive).length;}
function updateHUD(){
  document.getElementById('hudRound').textContent='🔥 '+G.round;
  document.getElementById('hudAlive').textContent='👟 '+aliveCount();
  document.getElementById('hudTime').textContent='⏱ '+Math.floor(G.time);
}
let bannerTO=null;
function showBanner(t,sub,ms){
  const b=document.getElementById('banner'),s=document.getElementById('sub');
  b.textContent=t;s.textContent=sub||'';b.style.opacity=1;s.style.opacity=1;
  clearTimeout(bannerTO);bannerTO=setTimeout(()=>{b.style.opacity=0;s.style.opacity=0;},ms||1400);
}

/* ---------- input: floating joystick (gptouch pattern) + keyboard ---------- */
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const stick={active:false,id:null,ax:0,ay:0,x:0,y:0};
const sBase=document.getElementById('sBase'),sKnob=document.getElementById('sKnob');
function stickShow(on){sBase.style.display=on?'block':'none';sKnob.style.display=on?'block':'none';}
cv.addEventListener('pointerdown',e=>{
  audioInit();
  if(stick.active)return;
  stick.active=true;stick.id=e.pointerId;stick.ax=e.clientX;stick.ay=e.clientY;stick.x=0;stick.y=0;
  sBase.style.left=(e.clientX-55)+'px';sBase.style.top=(e.clientY-55)+'px';
  sKnob.style.left=(e.clientX-26)+'px';sKnob.style.top=(e.clientY-26)+'px';stickShow(true);
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>{
  if(!stick.active||e.pointerId!==stick.id)return;
  let dx=e.clientX-stick.ax,dy=e.clientY-stick.ay;
  const m=Math.hypot(dx,dy),max=52;
  if(m>max){dx=dx/m*max;dy=dy/m*max;}
  stick.x=dx/max;stick.y=dy/max;
  sKnob.style.left=(stick.ax+dx-26)+'px';sKnob.style.top=(stick.ay+dy-26)+'px';
});
function stickEnd(e){if(stick.active&&e.pointerId===stick.id){stick.active=false;stick.x=0;stick.y=0;stickShow(false);}}
cv.addEventListener('pointerup',stickEnd);cv.addEventListener('pointercancel',stickEnd);
let hookStick=null; // headless test injection
function getInput(){
  let x=0,y=0;
  if(keys['arrowleft']||keys['a'])x-=1; if(keys['arrowright']||keys['d'])x+=1;
  if(keys['arrowup']||keys['w'])y-=1; if(keys['arrowdown']||keys['s'])y+=1;
  if(stick.active&&(Math.abs(stick.x)>0.16||Math.abs(stick.y)>0.16)){x=stick.x;y=stick.y;}
  if(hookStick){x=hookStick[0];y=hookStick[1];}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}
  return [x,y];
}

/* ---------- particles ---------- */
function spawnParts(x,y,layer,n,colors,spread,up){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(0.3+Math.random()*0.7)*(spread||60);
    G.parts.push({x,y,layer,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.6-(up||0),
      life:0.5+Math.random()*0.5,t:0,size:2+Math.random()*4,col:colors[(Math.random()*colors.length)|0],grav:120});
  }
}
function splashParts(x,y,layer){
  for(let i=0;i<26;i++){
    const a=-Math.PI/2+(Math.random()-0.5)*1.6,sp=60+Math.random()*130;
    G.parts.push({x:x+(Math.random()-0.5)*16,y,layer,vx:Math.cos(a)*sp,vy:-Math.abs(Math.sin(a)*sp)*0.4-40,
      life:0.6+Math.random()*0.5,t:0,size:2.5+Math.random()*4.5,col:['#ff7a1a','#ffb03a','#ff4d00','#ffe9c4'][(Math.random()*4)|0],grav:300,screen:true});
  }
}

/* ---------- characters ---------- */
function floorTile(c){return tileAt(c.layer,c.x,c.y);}
function standTile(l,x,y){
  const t=tileAt(l,x,y);
  return (t&&(t.state===0||t.state===1))?t:null;
}
function touchTile(t){
  if(t&&t.state===0){t.state=1;t.timer=G.crackDelay;sfx.crack();}
}
function eliminate(c,silent){
  c.alive=false;c.dead=G.time;
  splashParts(c.x,c.y,0);
  if(!silent){sfx.splash();sfx.elim();}
  G.shake=Math.max(G.shake,5);
  updateHUD();
  const p=G.chars[0];
  if(c===p){G.place=aliveCount()+1;endRound(false);}
  else if(aliveCount()===1&&p.alive){endRound(true);}
}
function startFall(c){
  c.falling=true;c.fallFrom=c.layer;c.fallT=0;
  c.fallTo=c.layer-1;
}
function updateChar(c,dt){
  if(!c.alive)return;
  if(c.falling){
    c.fallT+=dt*3.4;
    if(c.fallT>=1){
      c.falling=false;c.layer=c.fallTo;
      if(c.layer<0){eliminate(c);return;}
      if(standTile(c.layer,c.x,c.y)){sfx.land();spawnParts(c.x,c.y,c.layer,6,['#ffffff','#ffd9a0'],40,10);touchTile(floorTile(c));}
      else startFall(c);
    }
    return;
  }
  // standing on something?
  const t=floorTile(c);
  if(!t||t.state>=2){startFall(c);return;}
  touchTile(t);
  // movement
  let mx=0,my=0;
  if(!c.def.bot){[mx,my]=getInput();}
  else{[mx,my]=botThink(c,dt);}
  const mag=Math.hypot(mx,my);
  if(mag>0.05){
    c.vx=mx*c.speed;c.vy=my*c.speed;
    c.face=mx<-0.1?-1:(mx>0.1?1:c.face);
    c.runPh+=dt*11;
    if(Math.random()<dt*3)sfx.step();
  }else{c.vx*=0.6;c.vy*=0.6;}
  c.x+=c.vx*dt;c.y+=c.vy*dt;
}
function tileScore(l,x,y){
  const t=tileAt(l,x,y);
  if(!t)return -100;
  if(t.state===0)return 3;
  if(t.state===1)return t.timer>0.45?1.2:-4;
  return -100;
}
function botThink(c,dt){
  c.aiT-=dt;
  if(c.aiT<=0){
    c.aiT=0.14;
    let best=-1e9,bx=c.aiX,by=c.aiY;
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2+ (Math.random()*0.2);
      const dx=Math.cos(a),dy=Math.sin(a);
      const px=c.x+dx*46,py=c.y+dy*46;
      let sc=tileScore(c.layer,px,py)*2+tileScore(c.layer,c.x+dx*20,c.y+dy*20);
      // stay near middle of the surviving floor, mild pull
      const dc=Math.hypot(px,py);sc-=dc*0.006;
      // don't hug another runner
      for(const o of G.chars){if(o!==c&&o.alive&&o.layer===c.layer){const d=Math.hypot(o.x-px,o.y-py);if(d<26)sc-=(26-d)*0.08;}}
      sc+=Math.random()*0.7;
      if(sc>best){best=sc;bx=dx;by=dy;}
    }
    // if current tile is dying fast, commit harder to the best exit
    c.aiX=bx;c.aiY=by;
  }
  return [c.aiX,c.aiY];
}

/* ---------- tiles ---------- */
function updateTiles(dt){
  for(const t of G.tiles.values()){
    if(t.state===1){
      t.timer-=dt;
      if(t.timer<=0){t.state=2;t.fallY=0;t.fallV=0;sfx.tileFall();
        spawnParts(...hexCenter(t),t.l,8,['#ffd9a0','#ffffff'],36,6);}
    }else if(t.state===2){
      t.fallV+=900*dt;t.fallY+=t.fallV*dt;
      if(t.fallY>90){t.state=3;}
    }
  }
}
function hexCenter(t){const [x,y]=hexToXY(t.q,t.r);return [x,y];}

/* ---------- round flow ---------- */
function endRound(won){
  if(G.over)return;G.over=true;G.phase='over';
  if(won){sfx.win();showBanner('🏆 YOU WIN!','Round '+G.round+' cleared — tap for round '+(G.round+1),2600);}
  else{sfx.lose();showBanner('💀 #'+G.place+' OF 6','You took a lava bath — tap to retry round '+G.round,2600);}
}
function nextRound(){
  if(G.over){const won=G.chars[0].alive&&aliveCount()===1;newGame(won?G.round+1:G.round);}
}
cv.addEventListener('pointerdown',()=>{if(G&&G.over)setTimeout(nextRound,60);});
document.getElementById('goBtn').addEventListener('click',()=>{
  audioInit();document.getElementById('start').style.display='none';newGame(1);
});

/* ---------- drawing ---------- */
function buildLavaCache(){
  lavaCache=document.createElement('canvas');lavaCache.width=W*DPR;lavaCache.height=H*DPR;
  const c=lavaCache.getContext('2d');c.scale(DPR,DPR);
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b0603');g.addColorStop(0.55,'#57100a');g.addColorStop(1,'#8f1d05');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<14;i++){
    const bx=((i*197.3)%W),by=H*0.35+((i*131.7)%(H*0.65));
    const r=26+((i*37)%40);
    const rg=c.createRadialGradient(bx,by,2,bx,by,r);
    rg.addColorStop(0,'rgba(255,150,30,0.5)');rg.addColorStop(1,'rgba(255,80,0,0)');
    c.fillStyle=rg;c.beginPath();c.arc(bx,by,r,0,7);c.fill();
  }
}
function drawLava(t){
  if(!lavaCache)buildLavaCache();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(lavaCache,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // rising embers (cheap, animated)
  ctx.fillStyle='rgba(255,190,90,0.8)';
  for(let i=0;i<22;i++){
    const ex=((i*89.7)%W),ey=H-((t*24*(1+(i%3)*0.3)+i*97)%H);
    ctx.fillRect(ex,ey,2.4,2.4);
  }
}
function tileColor(t){
  if(t.state===1){
    const f=1-t.timer/G.crackDelay; // 0 fresh -> 1 dead
    const base=[[201,58,18],[232,100,28],[255,176,58]][t.l];
    const hot=[255,240,210];
    const c=base.map((v,i)=>Math.round(v+(hot[i]-v)*Math.min(1,f*1.15)));
    return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
  }
  return LAYER_FILL[t.l];
}
function drawTile(t,cx,cy){
  const [hx,hy]=hexCenter(t);
  const lift=(LAYERS-1-t.l)*LIFT;
  let x=cx+hx,y=cy+hy*SQUASH-lift;
  let alpha=1;
  if(t.state===2){y+=t.fallY;alpha=Math.max(0,1-t.fallY/95);}
  if(t.state===3)return;
  ctx.save();ctx.globalAlpha=alpha;
  // side thickness (fake 3D edge) for the two lower front edges
  if(t.state!==2){
    ctx.fillStyle=LAYER_EDGE[t.l];
    hexPath(ctx,x,y+S*0.30,S);ctx.fill();
  }
  ctx.fillStyle=tileColor(t);
  hexPath(ctx,x,y,S-1.5);ctx.fill();
  ctx.strokeStyle='rgba(90,25,0,0.55)';ctx.lineWidth=1.4;ctx.stroke();
  // inner detail hex
  ctx.strokeStyle='rgba(255,255,255,0.20)';ctx.lineWidth=1;
  hexPath(ctx,x,y,S*0.72);ctx.stroke();
  if(t.state===1){
    // cracks grow with damage
    const f=1-t.timer/G.crackDelay;
    const r=rng(t.seed);
    ctx.strokeStyle='rgba(60,10,0,0.8)';ctx.lineWidth=1.3;
    const nC=2+Math.floor(f*4);
    for(let i=0;i<nC;i++){
      const a0=r()*Math.PI*2;let px=x,py=y;
      ctx.beginPath();ctx.moveTo(px,py);
      const segs=2+((r()*2)|0);
      for(let sIdx=0;sIdx<segs;sIdx++){
        const a=a0+(r()-0.5)*1.1,ln=(S*0.3*f)*(0.5+r()*0.7);
        px+=Math.cos(a)*ln;py+=Math.sin(a)*ln*SQUASH;ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    if(f>0.62){ // final warning blink
      ctx.fillStyle='rgba(255,255,255,'+(0.16+0.13*Math.sin(performance.now()*0.03))+')';
      hexPath(ctx,x,y,S-1.5);ctx.fill();
    }
  }
  ctx.restore();
}
function drawRunner(c,cx,cy,t){
  const lift=(LAYERS-1-c.layer)*LIFT;
  let drop=0;
  if(c.falling){const f=c.fallT;drop=f*f*LIFT*(c.fallFrom-c.fallTo);}
  const x=cx+c.x,y=cy+c.y*SQUASH-lift+drop;
  const run=Math.sin(c.runPh),run2=Math.sin(c.runPh+Math.PI);
  const moving=Math.hypot(c.vx,c.vy)>25;
  const bob=moving?Math.abs(Math.sin(c.runPh))*2.2:Math.sin(t*2.4+c.runPh)*0.7;
  ctx.save();ctx.translate(x,y);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(0,3,11,4.2,0,0,7);ctx.fill();
  ctx.translate(0,-bob);
  const d=c.def;
  // legs (thick, with shoes) — swing when running
  ctx.lineCap='round';
  const legSwing=moving?run*7:0,legSwing2=moving?run2*7:0;
  ctx.strokeStyle='#26303e';ctx.lineWidth=4.6;
  ctx.beginPath();ctx.moveTo(-2.5,-13);ctx.lineTo(-2.5+legSwing,-1.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(2.5,-13);ctx.lineTo(2.5+legSwing2,-1.5);ctx.stroke();
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-4.6+legSwing,-3.4,5.4,3);ctx.fillRect(0.6+legSwing2,-3.4,5.4,3);
  // arms
  ctx.strokeStyle=d.skin;ctx.lineWidth=3.6;
  const armSwing=moving?run2*5.5:Math.sin(t*2.4+c.runPh)*1.6;
  ctx.beginPath();ctx.moveTo(-6,-24);ctx.lineTo(-8.5,armSwing*0.6-14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-24);ctx.lineTo(8.5,-armSwing*0.6-14);ctx.stroke();
  // torso (capsule)
  ctx.fillStyle=d.shirt;
  ctx.beginPath();
  ctx.moveTo(-6.5,-27);ctx.lineTo(6.5,-27);ctx.lineTo(5.4,-12.5);ctx.lineTo(-5.4,-12.5);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(-6.5,-27,13,2.6); // collar stripe
  // head + hair + face
  ctx.fillStyle=d.skin;ctx.beginPath();ctx.arc(0,-33.5,6.4,0,7);ctx.fill();
  ctx.fillStyle=d.hair;ctx.beginPath();ctx.arc(0,-35.6,6.4,Math.PI*1.02,Math.PI*1.98);ctx.lineTo(6.4,-33.5);ctx.lineTo(-6.4,-33.5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1c1c1c';
  const look=c.face*1.4;
  ctx.fillRect(-2.6+look,-34,1.7,2.1);ctx.fillRect(1+look,-34,1.7,2.1);
  ctx.restore();
  if(!c.def.bot){ // YOU marker
    ctx.save();ctx.translate(x,y-52-bob+Math.sin(t*3.4)*2.4);
    ctx.fillStyle='#19f0d8';ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(-6,-3);ctx.lineTo(6,-3);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
function draw(){
  const t=performance.now()/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawLava(t);
  if(!G){return;}
  const sc=Math.min(W/452,H/760);G.scale=sc;
  const cx=W/2+(G.shake?(Math.random()-0.5)*G.shake:0);
  const cy=H*0.5+161*sc+(G.shake?(Math.random()-0.5)*G.shake:0);
  G.cx=cx;G.cy=cy;
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
  // floors bottom -> top; runners drawn right after their floor
  for(let l=0;l<LAYERS;l++){
    for(const tile of G.tiles.values())if(tile.l===l&&tile.state!==3)drawTile(tile,cx,cy);
    const rs=G.chars.filter(c=>c.alive&&(c.falling?c.fallFrom===l||c.layer===l:c.layer===l)).sort((a,b)=>a.y-b.y);
    for(const c of rs)if(!c.falling||c.fallFrom===l)drawRunner(c,cx,cy,t);
  }
  // particles (screen-space, per layer lift)
  for(const p of G.parts){
    const lift=(LAYERS-1-p.layer)*LIFT;
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.col;
    ctx.fillRect(cx+p.x-p.size/2,cy+p.y*SQUASH-lift-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if(G.shake>0)G.shake*=0.86;
}

/* ---------- main loop ---------- */
function updateGame(dt){
  if(!G||G.over)return;
  if(G.phase==='count'){
    G.countT-=dt;
    if(G.countT<=0){G.phase='play';showBanner('🏃 RUN!','Last one standing wins',800);sfx.count();}
  }else{
    G.time+=dt;
    updateTiles(dt);
    const order=[...G.chars].sort((a,b)=>(b.def.bot?1:0)-(a.def.bot?1:0));
    for(const c of order)updateChar(c,dt);
    if(((G.time*10)|0)!==(((G.time-dt)*10)|0))updateHUD();
  }
  for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||0)*dt*(p.screen?1:0.4);}
  G.parts=G.parts.filter(p=>p.t<p.life);
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  updateGame(dt);
  draw();
}
requestAnimationFrame(frame);

/* ---------- headless-test hooks ---------- */
window.__game={
  state(){if(!G)return null;const p=G.chars[0];
    return {phase:G.phase,round:G.round,alive:aliveCount(),time:G.time,
      player:{x:p.x,y:p.y,layer:p.layer,alive:p.alive,falling:p.falling},
      bots:G.chars.slice(1).map(b=>({x:b.x,y:b.y,layer:b.layer,alive:b.alive,falling:b.falling})),
      tilesTotal:G.tiles.size,
      tilesGone:[...G.tiles.values()].filter(t=>t.state===3).length,
      tilesDying:[...G.tiles.values()].filter(t=>t.state===1||t.state===2).length,
      place:G.place,over:G.over,crackDelay:G.crackDelay};},
  start(){document.getElementById('start').style.display='none';if(!G)newGame(1);G.phase='play';},
  step(n,dt){dt=dt||1/30;for(let i=0;i<n;i++)updateGame(dt);},
  newRound(n){newGame(n||1);G.phase='play';},
  setStick(x,y){hookStick=(x===null||x===undefined)?null:[x,y];},
  place(i,x,y,layer){const c=G.chars[i];c.x=x;c.y=y;if(layer!==undefined){c.layer=layer;c.falling=false;}},
  crackNow(l,q,r){const t=G.tiles.get(l+','+q+','+r);if(t&&t.state===0){t.state=1;t.timer=0.01;}},
  tileState(l,q,r){const t=G.tiles.get(l+','+q+','+r);return t?t.state:-1;}
};
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
