          gscroll = Math.max(0, Math.min(gscroll, tall - GH));
          return { c: c, g: g, s: s, n: n, x0: x0, tall: tall };
        }
        function tileAt(G, i) { return { x: G.x0 + (i % G.c) * (G.s + G.g), y: GY - gscroll + Math.floor(i / G.c) * (G.s + G.g) }; }
        function pickLevel(i) { if (i > progress) beep(140, 0.15, "sawtooth", 0.06); else startAt(i); }
        function updateTitle() {
          if (tap || pressed.a || pressed.b || pressed.start || pressed.any) startAt(0);
        }

        function frame() {
          t++;
          if (pressed.mute) { muted = !muted; }
          playMusic();
          if (state === "title") {
            updateTitle();
            if (state === "title") drawTitle();
          } else if (state === "intro") {
            drawIntro();
            if (t > 40 && (pressed.start || pressed.a)) { state = "play"; t = 0; }
            if (t > 420) { state = "play"; t = 0; }
          } else if (state === "play") {
            if (pressed.start) { paused = !paused; }
            if (!paused) GAMES[gi].update(input);
            if (state === "play") GAMES[gi].draw(ctx);
            if (paused) { overlay(); text("PAUSED", W / 2, 110, 2, "#fff", true); }
          } else if (state === "clear") {
            GAMES[gi].draw(ctx); overlay();
            logo("YOU WIN!", 34, 3, "#ffe14d", "#ff8a1e");
            var TL = GAMES[gi].tally || [], ty = 80;
            for (var tq = 0; tq < TL.length; tq++) {
              var ts0 = 20 + tq * 18; if (t < ts0) break;
              if (t === ts0) beep(660 + tq * 110, 0.06);
              var tv = TL[tq][1], shown = typeof tv === "number" ? Math.min(tv, Math.round(tv * Math.min(1, (t - ts0) / 14))) : tv;
              text(TL[tq][0], 70, ty + tq * 13, 1, "#9fb4ff"); text(String(shown), 250 - String(shown).length * 6, ty + tq * 13, 1, "#fff");
              ctx.fillStyle = "#2a2f5a"; ctx.fillRect(70, ty + tq * 13 + 9, 180, 1);
            }
            var tsY = ty + TL.length * 13 + 8;
            if (t >= 20 + TL.length * 18) { text("SCORE", 70, tsY, 1, "#ffe14d"); text(String(lastScore), 250 - String(lastScore).length * 6, tsY, 1, "#ffe14d"); }
            if (t > 40 + TL.length * 18 && t % 60 < 40) text("PLAY AGAIN", W / 2, 196, 2, "#4ad6ff", true);
            if (t > 40 && (pressed.start || pressed.a || tap)) { total = 0; startLevel(); }
          } else if (state === "fail") {
            GAMES[gi].draw(ctx); overlay();
            text("TRY AGAIN", W / 2, 80, 2, "#e33", true);
            text("TOTAL " + total, W / 2, 118, 1, "#fff", true);
            if (t > 40 && (pressed.start || pressed.a)) startLevel();
          } else if (state === "end") {
            drawEnd();
            if (t > 60 && (pressed.start || pressed.a)) { state = "title"; t = 0; }
          }
          if (muted) text("MUTE", 286, 230, 1, "#666");
          for (var k in pressed) delete pressed[k];
          tap = null;
          requestAnimationFrame(frame);
        }
        function overlay() { ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, W, H); }
        function logo(s, y, sc, c1, c2) {
          for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 2; oy++) if (ox || oy) text(s, W / 2 + ox * sc, y + oy * sc, sc, oy > 1 ? "#000" : "#2a0d00", true);
          text(s, W / 2, y, sc, c1, true);
          ctx.save(); ctx.beginPath(); ctx.rect(0, y + 4 * sc, W, 3 * sc); ctx.clip(); text(s, W / 2, y, sc, c2, true); ctx.restore();
          ctx.fillStyle = "rgba(255,255,255,0.8)"; var lw = s.length * 6 * sc, lx = Math.round(W / 2 - lw / 2), sh = (t * 3) % (lw + 60) - 30;
          ctx.fillRect(lx + sh, y, 2, sc * 2);
        }
        function drawTitle() {
          var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0a0a24"); g.addColorStop(1, "#1b0f33");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          for (var i = 0; i < 50; i++) {
            var sx = (i * 61 + 13) % W, sy = (i * 37 + (t >> 2)) % H;
            ctx.fillStyle = i % 3 ? "#1d2a4a" : "#4a5f9b"; ctx.fillRect(sx, sy, 2, 2);
          }
          var G0 = GAMES[0];
          if (G0.titleArt) { try { G0.titleArt(ctx, t); } catch (e) {} }
          var ti = G0.title, sc = ti.length * 18 > 300 ? 2 : 3;
          logo(ti, 18, sc, "#ffe14d", "#ff8a1e");
          var gl = (G0.goal || "").replace(/\. /g, ".|").split("|");
          ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 170, W, 6 + Math.min(3, gl.length) * 11);
          for (var gq = 0; gq < gl.length && gq < 3; gq++) text(gl[gq], W / 2, 173 + gq * 11, 1, "#4ad6ff", true);
          if (t % 60 < 40) text("TAP OR PRESS A TO PLAY", W / 2, 205, 1, "#fff", true);
          text("INFINITE LIVES", W / 2, 218, 1, "#5f5", true);
          text("STICK MOVE - A/B ACTION - M MUTE", W / 2, H - 9, 1, "#4a5578", true);
        }
        function icon(i, x, y, r) { /* a few canvas shapes per game, keyed by index */
          var c = ctx;
          function circ(cx, cy, rr, col) { c.fillStyle = col; c.beginPath(); c.arc(cx, cy, rr, 0, 7); c.fill(); }
          if (i === 0) { c.fillStyle = "#b5651d"; c.fillRect(x - r * 0.8, y - r, r * 1.6, r * 2); c.fillStyle = "#5a2e0c"; c.fillRect(x - r * 0.8, y - r * 0.5, r * 1.6, 2); c.fillRect(x - r * 0.8, y + r * 0.4, r * 1.6, 2); }
          else if (i === 1) { c.fillStyle = "#2fbf3a"; c.fillRect(x - r * 0.6, y - r * 0.5, r * 1.2, r * 1.5); c.fillRect(x - r, y - r, r * 2, r * 0.6); }
          else if (i === 2) { c.strokeStyle = "#ffd23a"; c.lineWidth = 3; c.beginPath(); c.arc(x, y, r * 0.8, 0, 7); c.stroke(); }
          else if (i === 3) { ["#e33", "#4ad6ff", "#5f5"].forEach(function (col, k) { var gx = x + (k - 1) * r * 0.9, gy = y + (k === 1 ? -r * 0.4 : r * 0.3); c.fillStyle = col; c.beginPath(); c.moveTo(gx, gy - r * 0.55); c.lineTo(gx + r * 0.4, gy); c.lineTo(gx, gy + r * 0.55); c.lineTo(gx - r * 0.4, gy); c.fill(); }); }
          else if (i === 4) { c.strokeStyle = "#ccc"; c.lineWidth = 1; c.beginPath(); c.moveTo(x - r * 0.45, y); c.lineTo(x, y + r); c.lineTo(x + r * 0.45, y); c.stroke(); circ(x - r * 0.45, y - r * 0.3, r * 0.5, "#e33"); circ(x + r * 0.45, y - r * 0.3, r * 0.5, "#4a8bff"); }
          else if (i === 5) { c.fillStyle = "#e33"; c.fillRect(x - r, y - r * 0.1, r * 2, r * 0.6); c.fillRect(x - r * 0.5, y - r * 0.5, r, r * 0.45); circ(x - r * 0.55, y + r * 0.55, r * 0.28, "#ddd"); circ(x + r * 0.55, y + r * 0.55, r * 0.28, "#ddd"); }
          else { c.fillStyle = "#ffe14d"; c.beginPath(); for (var k = 0; k < 10; k++) { var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.fill(); }
        }
        function padlock(x, y, col) {
          ctx.fillStyle = col;
          ctx.fillRect(x + 1, y, 4, 1); ctx.fillRect(x + 1, y, 1, 3); ctx.fillRect(x + 4, y, 1, 3);
          ctx.fillRect(x, y + 3, 6, 4);
          ctx.fillStyle = "#000"; ctx.fillRect(x + 2, y + 4, 2, 2);
        }
        function drawIntro() {
          ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "#4ad6ff"; ctx.lineWidth = 2; ctx.strokeRect(20, 60, 280, 110);
          text(GAMES[gi].title, W / 2, 84, 1, "#ffe14d", true);
          text(GAMES[gi].goal, W / 2, 110, 1, "#fff", true);
          text("INFINITE LIVES - GOOD LUCK", W / 2, 130, 1, "#888", true);
          if (t % 60 < 36) text("PRESS START", W / 2, 150, 1, "#4ad6ff", true);
          text("TOTAL " + total, W / 2, 200, 1, "#666", true);
        }
        function drawEnd() {
          ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
          text("MORE GAMES", W / 2, 70, 2, "#ffe14d", true);
          text("COMING SOON", W / 2, 94, 2, "#ffe14d", true);
          text("FINAL SCORE " + total, W / 2, 140, 1, "#fff", true);
          if (t % 60 < 36) text("PRESS START", W / 2, 176, 1, "#4ad6ff", true);
        }
        /* fixed 60 Hz step: frame() runs logic+draw, loop() paces it */
        var rawFrame = frame, acc = 0, last = 0, STEP = 1000 / 60;
        var raf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function () {}; // frame()'s own re-schedule becomes a no-op
        function loop(ts) {
          if (!last) last = ts;
          acc += Math.min(250, ts - last); last = ts;
          var n = 0;
          while (acc >= STEP && n < 5) { rawFrame(); acc -= STEP; n++; }
          raf(loop);
        }
        resize();
        raf(loop);
      })();
    </script>
