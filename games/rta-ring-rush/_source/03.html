<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Ring Rush</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
        font-family: ui-monospace, "Courier New", monospace; color: #eee; touch-action: none; }
      #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; width: 100%; gap: 8px; }
      #stage { position: relative; line-height: 0; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
      #crt { position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px); }
      #pad { display: none; width: 100%; max-width: 680px; padding: 0 12px 12px;
        justify-content: space-between; align-items: flex-end; }
      #stick { flex: none; position: relative; width: min(46vw, 240px); height: min(46vw, 240px); border-radius: 50%; border: 3px solid #555; background: radial-gradient(circle, #2b2b2b 0 58%, #151515 59%); touch-action: none; user-select: none; -webkit-user-select: none; }
      #stick.on { border-color: #e74c3c; }
      #knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; border: 2px solid #999; background: radial-gradient(circle at 35% 35%, #8a8a8a, #2e2e2e); pointer-events: none; }
      .key { background: #1b1b1b; border: 2px solid #444; border-radius: 10px; color: #ddd;
        font: bold 20px ui-monospace, monospace; display: flex; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none; touch-action: none; }
      .key.on { background: #c0392b; border-color: #e74c3c; }
      .btns { display: flex; gap: 14px; align-items: center; }
      .btns .key { width: min(24vw, 116px); height: min(24vw, 116px); border-radius: 50%; font-size: 32px; }
      #misc { display: flex; gap: 10px; }
      #misc .key { width: 64px; height: 36px; font-size: 13px; }
      @media (max-width: 760px), (orientation: portrait) {
        #wrap { justify-content: flex-start; padding-top: 6px; }
        #pad { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="c" width="320" height="240"></canvas>
        <div id="crt"></div>
      </div>
      <div id="misc">
        <div class="key" data-k="Enter">||</div>
        <div class="key" data-k="KeyM">MUTE</div>
      </div>
      <div id="pad">
        <div id="stick"><div id="knob"></div></div>
        <div class="btns">
          <div class="key" data-k="KeyX">B</div>
          <div class="key" data-k="KeyZ">A</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var W = 320, H = 240;
        var cv = document.getElementById("c"), ctx = cv.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        /* ---------- scaling ---------- */
        function resize() {
          var pad = document.getElementById("pad");
          var padH = getComputedStyle(pad).display === "none" ? 0 : pad.offsetHeight + 8;
          var aw = window.innerWidth - 4, ah = window.innerHeight - padH - 56;
          var s = Math.max(1, Math.min(aw / W, ah / H));
          cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
        }
        window.addEventListener("resize", resize);

        /* ---------- input ---------- */
        var keys = {}, pressed = {};
        var MAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left",
          KeyA: "left", ArrowRight: "right", KeyD: "right", KeyZ: "a", Space: "a", KeyX: "b",
          Enter: "start", KeyM: "mute" };

          var n = MAP[code]; if (!n) return;
          if (down && !keys[n]) pressed[n] = true;
          keys[n] = down;
        }
        window.addEventListener("keydown", function (e) {
          if (MAP[e.code]) e.preventDefault();
          setKey(e.code, true);
        });
        window.addEventListener("keyup", function (e) { setKey(e.code, false); });
        Array.prototype.forEach.call(document.querySelectorAll(".key"), function (el) {
          var code = el.dataset.k;
          function on(e) { e.preventDefault(); el.classList.add("on"); setKey(code, true); }
          function off(e) { e.preventDefault(); el.classList.remove("on"); setKey(code, false); }
          el.addEventListener("touchstart", on, { passive: false });
          el.addEventListener("touchend", off, { passive: false });
          el.addEventListener("touchcancel", off, { passive: false });
          el.addEventListener("mousedown", on);
          window.addEventListener("mouseup", off);
        });
        /* ---------- 8-way circular touch stick (#stick/#knob), snapped to 45 degrees ---------- */
        (function () {
          var st = document.getElementById("stick"), kn = document.getElementById("knob");
          if (!st || !kn) return;
          var sid = null;
          function clr() { setKey("ArrowRight", false); setKey("ArrowLeft", false); setKey("ArrowDown", false); setKey("ArrowUp", false); }
          function move(e) {
            var r = st.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
            var d = Math.sqrt(dx * dx + dy * dy), mx = Math.max(1, r.width / 2 - kn.offsetWidth / 2), k = d > mx ? mx / d : 1;
            kn.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
            if (d < r.width * 0.08) { clr(); return; }
            var o = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * Math.PI / 4, ux = Math.round(Math.cos(o)), uy = Math.round(Math.sin(o));
            setKey("ArrowRight", ux > 0); setKey("ArrowLeft", ux < 0); setKey("ArrowDown", uy > 0); setKey("ArrowUp", uy < 0);
          }
          function end(e) { if (e.pointerId !== sid) return; sid = null; clr(); kn.style.transform = ""; st.classList.remove("on"); }
          st.addEventListener("pointerdown", function (e) { e.preventDefault(); sid = e.pointerId; try { st.setPointerCapture(sid); } catch (x) {} st.classList.add("on"); move(e); });
          st.addEventListener("pointermove", function (e) { if (e.pointerId === sid) { e.preventDefault(); move(e); } });
          st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
          st.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        })();
        cv.addEventListener("touchstart", function (e) { e.preventDefault(); pressed.start = true; }, { passive: false });
        cv.addEventListener("mousedown", function () { pressed.start = true; });
        var input = { k: keys, p: pressed };
        /* menu taps: canvas position in game pixels, read by the shell menus */
        var tap = null;
        function tapAt(cx, cy) {
          var r = cv.getBoundingClientRect(); if (!r.width) return;
          tap = { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
        }
        cv.addEventListener("touchstart", function (e) { var q = e.changedTouches[0]; if (q) tapAt(q.clientX, q.clientY); }, { passive: false });
        cv.addEventListener("mousedown", function (e) { tapAt(e.clientX, e.clientY); });

        /* ---------- audio ---------- */
        var actx = null, muted = false;

            if (actx.state === "suspended") actx.resume();

            g.gain.value = vol || 0.06;

        var SFX = {
          jump: function () { beep(560, 0.1); beep(760, 0.08); },
          hit: function () { beep(150, 0.3, "sawtooth", 0.08); },
          win: function () { beep(523, 0.12); setTimeout(function(){beep(659,0.12);},110); setTimeout(function(){beep(880,0.2);},220); },
          pick: function () { beep(880, 0.07); beep(1180, 0.07); },
          smash: function () { beep(320, 0.08, "square", 0.07); beep(180, 0.12, "sawtooth", 0.06); }
        };

        /* ---------- pixel text ---------- */
        var FONT = {
          A:"01110100011000111111100011000110001",B:"11110100011111010001100011000111110",
          C:"01110100011000010000100001000101110",D:"11110100011000110001100011000111110",
          E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",
          G:"01110100011000010111100011000101110",H:"10001100011000111111100011000110001",
          I:"11111001000010000100001000010011111",J:"00111000100001000010100101001001100",
          K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",
          M:"10001110111010110001100011000110001",N:"10001110011010110011100011000110001",
          O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",
          Q:"01110100011000110001101011001001101",R:"11110100011000111110101001001010001",
          S:"01111100001000001110000011000011110",T:"11111001000010000100001000010000100",
          U:"10001100011000110001100011000101110",V:"10001100011000110001100010101000100",
          W:"10001100011000110001101011101110001",X:"10001100010101000100010101000110001",
          Y:"10001100011000101010001000010000100",Z:"11111000010001000100010001000011111",
          "0":"01110100111010110101110011000101110","1":"00100011000010000100001000010001110",
          "2":"01110100010000100110010001000011111","3":"11110000100011000010000011000101110",
          "4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
          "6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000",
          "8":"01110100011000101110100011000101110","9":"01110100011000101111000010001001100",
          " ":"00000000000000000000000000000000000","-":"00000000000000011111000000000000000",
          ".":"00000000000000000000000000000000100",":":"00000001000010000000001000010000000",
          "!":"00100001000010000100000000000000100","+":"00000001000010011111001000010000000",
          "/":"00001000100010001000100010001000000","'":"00100001000010000000000000000000000"
        };
        function text(s, x, y, px, col, center) {
          s = String(s).toUpperCase(); px = px || 1; ctx.fillStyle = col || "#fff";
          var w = s.length * 6 * px;
          if (center) x = Math.round(x - w / 2);
          for (var i = 0; i < s.length; i++) {
            var g = FONT[s[i]]; if (!g) continue;
            for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++)
              if (g[r * 5 + c] === "1") ctx.fillRect(x + i * 6 * px + c * px, y + r * px, px, px);
          }
        }

        var ringRush = {
          title: "RING RUSH",
          goal: "RUN, GRAB RINGS, JUMP TO SPIN-ATTACK. REACH THE SIGN.",
          api: null,
          LEN: 2000,
          init: function (api) {
            this.api = api;
            this.lives = 3; this.score = 0; this.rings = 0; this.parts = []; this.won = 0; this.timer = 0; this.check = 60; this.cam = 0;
            this.pops = []; this.lost = []; this.fx = []; this.birds = []; this.spring = { x: 880, t: 0 }; this.post = { x: 1060, hit: false };
            var R = [], i, self = this;
            function line(x0, n, dy) { for (var k = 0; k < n; k++) { var rx = x0 + k * 16; R.push({ x: rx, y: self.gy(rx) - dy }); } }
            function arc(cx, n) { for (var k = 0; k < n; k++) { var a = Math.PI * k / (n - 1), rx = cx - 40 + k * 80 / (n - 1); R.push({ x: rx, y: self.gy(cx - 40) - 30 - Math.sin(a) * 40 }); } }
            line(140, 5, 14); arc(400, 6); arc(730, 6); line(940, 5, 14); line(1110, 5, 30);
            arc(1660, 6); line(1350, 4, 14); line(1760, 4, 14);
            for (i = 0; i < R.length; i++) R[i].got = false;
            this.R = R;
            this.E = [240, 450, 960, 1260, 1380, 1820].map(function (x) { return { x: x, x0: x - 50, x1: x + 50, dir: 1, alive: true, r: 0 }; });
            this.reset();
          },
          reset: function () { this.p = { x: this.check, y: this.gy(this.check), vx: 0, vy: 0, on: true, spin: false, face: 1, inv: 60, dead: 0, run: 0 }; },
          // heightmap: ground y at x, or 999 in a pit
          gy: function (x) {
            if ((x > 700 && x < 760) || (x > 1624 && x < 1696)) return 999;
            var y = 200;
            if (x > 300 && x < 500) y -= Math.sin((x - 300) / 200 * Math.PI) * 26;
            if (x > 1280 && x < 1520) y -= Math.sin((x - 1280) / 240 * Math.PI) * 30;
            if (x >= 1100 && x < 1200) y -= (x - 1100) * 0.35;
            if (x >= 1200 && x < 1230) y -= 35;
            return y;
          },
          pop: function (s, x, y) { this.pops.push({ s: s, x: x, y: y, t: 40 }); },
          // ring chime: two bright notes, the classic "ching"
          chime: function () { beep(1568, 0.05, "square", 0.04); setTimeout(function () { beep(2093, 0.14, "triangle", 0.05); }, 45); },
          spark: function (x, y) { for (var k = 0; k < 4; k++) { var a = Math.PI / 4 + k * Math.PI / 2; this.fx.push({ k: "spark", x: x, y: y, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2, t: 14 }); } },
          die: function () { var P = this.p; if (P.dead) return; P.dead = 70; P.vy = -5; P.vx = 0; SFX.hit(); },
          update: function (inp) {
            var P = this.p, i, e, g;
            this.timer++;
            for (i = this.pops.length - 1; i >= 0; i--) { this.pops[i].y -= 0.4; if (--this.pops[i].t <= 0) this.pops.splice(i, 1); }
            // scattered rings: bounce on the ground, losing height each hop; blink out at the end
            for (i = this.lost.length - 1; i >= 0; i--) { var l = this.lost[i]; l.x += l.vx; l.vy += 0.18; l.y += l.vy;
              var lg = this.gy(l.x); if (lg < 999 && l.vy > 0 && l.y > lg - 4) { l.y = lg - 4; l.vy *= -0.7; l.vx *= 0.92; }
              if (l.d > 0) l.d--;
              if (--l.t <= 0) this.lost.splice(i, 1); }
            for (i = this.fx.length - 1; i >= 0; i--) { var q = this.fx[i]; q.x += q.vx; q.y += q.vy; if (--q.t <= 0) this.fx.splice(i, 1); }
            for (i = this.birds.length - 1; i >= 0; i--) { var bd = this.birds[i]; bd.t++; bd.x += bd.vx; bd.y += bd.t < 12 ? -0.4 : -1.1 + Math.sin(bd.t / 5) * 0.6; if (bd.y < -20 || bd.t > 200) this.birds.splice(i, 1); }
            if (this.spring.t > 0) this.spring.t--;
            if (this.won > 0) { if (++this.won > 120) this.api.win(this.score); return; }
            if (P.dead > 0) {
              P.vy += 0.25; P.y += P.vy;
              if (--P.dead === 0) {  this.rings = 0;  this.reset(); }
              return;
            }
            if (P.inv > 0) P.inv--;
            var dx = (inp.k.right ? 1 : 0) - (inp.k.left ? 1 : 0);
            // skid: pushing against fast ground speed kicks up dust
            P.skid = P.on && dx !== 0 && dx * P.vx < -1.2;
            if (P.skid) {
              if (this.timer % 3 === 0) this.fx.push({ k: "dust", x: P.x + (Math.random() * 4 - 2), y: P.y - 2, vx: P.vx * 0.3, vy: -0.3 - Math.random() * 0.4, t: 18 });
              if (this.timer % 6 === 0) beep(130 + Math.random() * 40, 0.04, "sawtooth", 0.03);
            }
            if (dx) { P.face = dx; P.vx += dx * (P.on ? (dx * P.vx < 0 ? 0.3 : 0.12) : (dx * P.vx < 0 ? 0.16 : 0.08)); }
            else if (P.on) { P.vx *= 0.94; if (Math.abs(P.vx) < 0.05) P.vx = 0; }
            P.vx = Math.max(-4, Math.min(4, P.vx));
            // walls: a pit side or cliff face higher than a 12px step blocks; a near-miss ledge is grabbed
            var nx = Math.max(8, Math.min(this.LEN - 8, P.x + P.vx)), ng = this.gy(nx);
            if (ng < 999 && ng < P.y - 12) { if (!P.on && P.vy >= 0 && ng >= P.y - 16) { P.y = ng; } else { nx = P.x; P.vx = 0; } }
            P.x = nx; P.run += Math.abs(P.vx); P.rot = (P.rot || 0) + 0.3 + Math.abs(P.vx) * 0.1;
            g = this.gy(P.x);
            if (inp.p.a) P.jb = 7; else if (P.jb > 0) P.jb--;   // jump buffer
            if (P.on) P.co = 0; else P.co = (P.co || 0) + 1;    // coyote time
            if (P.jb > 0 && (P.on || (P.co < 7 && !P.spin && P.vy >= 0))) { P.jb = 0; P.vy = -5.8; P.on = false; P.spin = true; P.co = 99; SFX.jump(); }
            else if (P.on) {

            }
            if (!P.on) {

              if (P.vy >= 0 && g < 999 && P.y >= g && P.y - P.vy <= g + 12) { P.y = g; P.on = true; P.spin = false; }
              if (P.y > H + 20) { this.die(); return; }
            }
            var s = this.spring;
            if (P.on && Math.abs(P.x - s.x) < 10) { P.vy = -8; P.on = false; P.spin = true; s.t = 12; beep(880, 0.12, "square", 0.06); }
            if (!this.post.hit && P.x >= this.post.x) { this.post.hit = true; this.check = this.post.x; beep(990, 0.15); this.pop("CHECK", this.post.x - 14, P.y - 40); }
            for (i = 0; i < this.R.length; i++) { var r = this.R[i];
              if (!r.got && Math.abs(r.x - P.x) < 10 && Math.abs(r.y - (P.y - 10)) < 14) { r.got = true; this.rings++; this.score += 10; this.chime(); this.spark(r.x, r.y); } }
            for (i = this.lost.length - 1; i >= 0; i--) { var lr = this.lost[i];   // scattered rings can be won back
              if (lr.d === 0 && Math.abs(lr.x - P.x) < 10 && Math.abs(lr.y - (P.y - 10)) < 14) { this.lost.splice(i, 1); this.rings++; this.chime(); this.spark(lr.x, lr.y); } }
            for (i = 0; i < this.E.length; i++) { e = this.E[i]; if (!e.alive) continue;
              e.x += e.dir * 0.6; e.r += 0.6; if (e.x > e.x1 || e.x < e.x0) e.dir = -e.dir;
              var ey = this.gy(e.x);
              if (Math.abs(e.x - P.x) < 12 && Math.abs(ey - 6 - (P.y - 8)) < 14) {
                if (P.spin || (!P.on && P.vy > 0)) { e.alive = false; P.vy = -3.5; for (var fk = 0; fk < 12; fk++) { var fa = fk / 12 * 6.283, fv = 1 + fk % 3 * 0.6; this.parts.push({ x: e.x, y: ey - 8, vx: Math.cos(fa) * fv, vy: Math.sin(fa) * fv - 1, t: 24, c: fk % 3 ? "#ffe14d" : "#ffffff" }); } this.score += 100; this.pop("+100", e.x - 12, ey - 24); SFX.smash();
                  // pop: a puff of smoke, and the critter inside flies free
                  for (var pf = 0; pf < 6; pf++) { var pa = pf * Math.PI / 3; this.fx.push({ k: "puff", x: e.x, y: ey - 7, vx: Math.cos(pa) * 0.9, vy: Math.sin(pa) * 0.9 - 0.3, t: 20 }); }
                  this.birds.push({ x: e.x, y: ey - 8, vx: P.x < e.x ? 0.9 : -0.9, t: 0 });
                  setTimeout(function () { beep(1400, 0.05, "triangle", 0.04); setTimeout(function () { beep(1700, 0.05, "triangle", 0.04); }, 70); }, 160); }
                else if (P.inv === 0) {
                  if (this.rings > 0) {
                    for (var k = 0; k < Math.min(this.rings, 8); k++) { var a = Math.PI * (0.15 + 0.7 * k / 7); this.lost.push({ x: P.x, y: P.y - 10, vx: Math.cos(a) * 2.5, vy: -Math.sin(a) * 3.5, t: 180, d: 40 }); }
                    [988, 784, 622].forEach(function (fq, n) { setTimeout(function () { beep(fq, 0.06, "square", 0.04); }, n * 50); });
                    this.rings = 0; P.inv = 100; P.vx = -P.face * 2.5; P.vy = -3; P.on = false; P.spin = false; SFX.hit();
                  } else { this.die(); return; }
                } } }
            if (P.x >= this.LEN - 60) {
              this.won = 1; var bonus = this.rings * 50; this.score += bonus; this.pop("BONUS " + bonus, P.x - 30, P.y - 50);
              [523, 659, 784, 1047].forEach(function (fq, n) { setTimeout(function () { beep(fq, n === 3 ? 0.35 : 0.1); }, n * 120); });
            }
            this.cam = Math.max(0, Math.min(this.LEN - W, P.x - 130));
          },
          draw: function (x) {
            var c = Math.round(this.cam), t = this.timer, i, sx, g;
            var skg = x.createLinearGradient(0, 0, 0, 130); skg.addColorStop(0, "#1d4fe0"); skg.addColorStop(0.65, "#5d9bff"); skg.addColorStop(1, "#bfe0ff"); x.fillStyle = skg; x.fillRect(0, 0, W, 130);

            for (sx = 0; sx < W; sx += 2) { var mw = sx + c * 0.22, mh = 26 + Math.round(12 * Math.sin(mw / 34) + 7 * Math.sin(mw / 13)); x.fillStyle = "#2a6fb0"; x.fillRect(sx, 130 - mh, 2, mh); if (mh > 38) { x.fillStyle = "#e8f4ff"; x.fillRect(sx, 130 - mh, 2, 3); } }

          ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "#4ad6ff"; ctx.lineWidth = 2; ctx.strokeRect(20, 60, 280, 110);
          text("LEVEL " + (gi + 1) + " - " + GAMES[gi].title, W / 2, 84, 1, "#ffe14d", true);
          text(GAMES[gi].goal, W / 2, 110, 1, "#fff", true);
          text("3 LIVES - GOOD LUCK", W / 2, 130, 1, "#888", true);
          if (t % 60 < 36) text("PRESS START", W / 2, 150, 1, "#4ad6ff", true);
          text("TOTAL " + total, W / 2, 200, 1, "#666", true);
        }
        function drawEnd() {
          ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
          text("MORE GAMES", W / 2, 70, 2, "#ffe14d", true);
          text("COMING SOON", W / 2, 94, 2, "#ffe14d", true);
          text("FINAL SCORE " + total, W / 2, 140, 1, "#fff", true);
          if (t % 60 < 36) text("PRESS START", W / 2, 176, 1, "#4ad6ff", true);
        }
        /* fixed 60 Hz step: frame() runs logic+draw, loop() paces it */
        var rawFrame = frame, acc = 0, last = 0, STEP = 1000 / 60;
        var raf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function () {}; // frame()'s own re-schedule becomes a no-op
        function loop(ts) {
          if (!last) last = ts;
          acc += Math.min(250, ts - last); last = ts;
          var n = 0;
          while (acc >= STEP && n < 5) { rawFrame(); acc -= STEP; n++; }
          raf(loop);
        }
        resize();
        raf(loop);
      })();
    </script>
  </body>
</html>
