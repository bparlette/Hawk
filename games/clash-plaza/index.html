      if (d > 1.15) {
        inp.x = Math.sin(toward);
        inp.y = Math.cos(toward);
      } else if (rnd() < 0.3) f.pressed.light = true;
      break;
    case "retreat": {
      inp.x = -Math.sin(toward) * 0.8;
      inp.y = -Math.cos(toward) * 0.8;
      break;
    }
    case "block":
      inp.block = match.frame < f.ai.blockUntil;
      break;
    case "light":
      if (d < 1.7) f.pressed.light = true;
      else {
        inp.x = Math.sin(toward);
        inp.y = Math.cos(toward);
      }
      break;
    case "heavy":
      if (d < 1.8) f.pressed.heavy = true;
      else {
        inp.x = Math.sin(toward);
        inp.y = Math.cos(toward);
      }
      break;
    case "special":
      if (f.def.special.kind === "flurry" && d > 1.7) {
        inp.x = Math.sin(toward);
        inp.y = Math.cos(toward);
      } else f.pressed.special = true;
      break;
    default:
      break;
  }
}
function endRound(winner) {
  winner.roundsWon++;
  match.phase = "roundEnd";
  match.phaseFrame = 0;
  const loser = match.fighters[1 - winner.side];
  if (loser.hp <= 0) loser.state = "ko";
  winner.state = "win";
  updatePips();
  updateHud();
}
function stepFighter(f, o) {
  f.stateFrame++;
  switch (f.state) {
    case "free": {
      faceOpponent(f, o);
      f.blocking = !!f.input.block;
      if (!f.blocking) {
        if (f.pressed.light) {
          startMove(f, "light");
          break;
        }
        if (f.pressed.heavy) {
          startMove(f, "heavy");
          break;
        }
        if (f.pressed.special) {
          startMove(f, "special");
          break;
        }
        const mx = f.input.x, mz = f.input.y;
        const mag = Math.hypot(mx, mz);
        if (mag > 0.12) {
          const sp = 3.1 / 60;
          f.x += mx / Math.max(1, mag) * sp * Math.min(1, mag + 0.25);
          f.z += mz / Math.max(1, mag) * sp * Math.min(1, mag + 0.25);
          const dc = Math.hypot(f.x, f.z);
          if (dc > RING_R) {
            f.x *= RING_R / dc;
            f.z *= RING_R / dc;
          }
          f.moving = true;
        } else f.moving = false;
      } else f.moving = false;
      break;
    }
    case "attack": {
      f.moving = false;
      f.moveFrame++;
      const m = f.move;
      if (m === MOVES.specialProj) {
        if (!f.fired && f.moveFrame >= m.startup) {
          spawnFighterProjectile(f);
          f.fired = true;
        }
      } else if (m.hits) {
        if (m.hits.includes(f.moveFrame) && dist2d(f, o) <= m.range && o.state !== "ko") {
          resolveHit(f, o, m);
          if (match.phase !== "fight") return;
        }
      } else {
        const activeStart = m.startup, activeEnd = m.startup + m.active;
        if (!f.hitDone && f.moveFrame >= activeStart && f.moveFrame <= activeEnd) {
          if (dist2d(f, o) <= m.range && o.state !== "ko") {
            f.hitDone = true;
            resolveHit(f, o, m);
            if (match.phase !== "fight") return;
          }
        }
        if (f.moveFrame === activeEnd && !f.hitDone) f.hitDone = true;
      }
      if (f.moveFrame >= totalFrames(m)) {
        f.state = "free";
        f.move = null;
        f.stateFrame = 0;
      }
      break;
    }
    case "hitstun":
    case "blockstun": {
      f.moving = false;
      if (f.stateFrame >= (f.stunFrames || 10)) {
        f.state = "free";
        f.stateFrame = 0;
      }
      break;
    }
    default:
      f.moving = false;
      break;
  }
  f.pressed.light = f.pressed.heavy = f.pressed.special = false;
}
function logicStep() {
  match.frame++;
  if (match.hitstop > 0) {
    match.hitstop--;
    if (match.hitstop === 0 && match.pendingHitstop) {
      const p = match.pendingHitstop;
      match.hitstopLog.push({ ...p, endFrame: match.frame, measured: match.frame - p.startFrame });
      match.pendingHitstop = null;
    }
    return;
  }
  match.phaseFrame++;
  const [a, b] = match.fighters;
  switch (match.phase) {
    case "intro": {
      if (match.phaseFrame === 55) setBanner("FIGHT!", "");
      if (match.phaseFrame >= 95) {
        match.phase = "fight";
        match.phaseFrame = 0;
        setBanner("", "");
        sfx("bell");
      }
      break;
    }
    case "fight": {
      match.timer--;
      if (a.isBot) aiInput(a, b);
      aiInput(b, a);
      stepFighter(a, b);
      if (match.phase === "fight") stepFighter(b, a);
      if (match.phase === "fight") {
        stepProjectiles();
        const d = dist2d(a, b);
        if (d < 0.72 && d > 1e-4) {
          const push = (0.72 - d) / 2;
          const nx = (b.x - a.x) / d, nz = (b.z - a.z) / d;
          if (a.state === "free") {
            a.x -= nx * push;
            a.z -= nz * push;
          }
          if (b.state === "free") {
            b.x += nx * push;
            b.z += nz * push;
          }
        }
        if (match.timer <= 0) {
          match.timer = 0;
          endRound(a.hp === b.hp ? rnd() < 0.5 ? a : b : a.hp > b.hp ? a : b);
          setBanner("TIME!", "");
        }
        updateHud();
      }
      break;
    }
    case "roundEnd": {
      if (match.phaseFrame === 2) {
        const winner = match.fighters.find((f) => f.roundsWon > 0 && f.state === "win") || match.fighters[0];
        setBanner("K.O.!", `${winner.def.name} TAKES THE ROUND`);
        if (match.timer <= 0 && match.fighters.every((f) => f.state !== "ko")) setBanner("TIME!", `${winner.def.name} TAKES THE ROUND`);
      }
      if (match.phaseFrame >= 170) {
        const champ = match.fighters.find((f) => f.roundsWon >= WINS_NEEDED);
        if (champ) {
          match.phase = "matchEnd";
          match.phaseFrame = 0;
          setBanner(`${champ.def.name} WINS!`, "CHAMPION OF THE PLAZA");
          ui.endBtns.style.display = "flex";
          destroyTouch();
        } else {
          match.round++;
          startRound();
        }
      }
      break;
    }
    default:
      break;
  }
}
var keys = {};
var pressQueue = { light: false, heavy: false, special: false };
window.addEventListener("keydown", (e) => {
  ensureAudio();
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (!e.repeat) {
    if (e.code === "KeyJ") pressQueue.light = true;
    if (e.code === "KeyK") pressQueue.heavy = true;
    if (e.code === "KeyU" || e.code === "Space") pressQueue.special = true;
  }
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});
window.addEventListener("pointerdown", ensureAudio, { passive: true });
var TC = null;
function createTouch() {
  if (TC || !isTouchDevice()) return;
  TC = new TouchController({
    buttons: [
      { id: "a", label: "LIGHT", size: 84 },
      { id: "b", label: "HEAVY", size: 68 },
      { id: "c", label: "BLOCK", size: 68 },
      { id: "d", label: "SPEC", size: 68 }
    ],
    maxRadius: 56,
    deadzone: 0.18,
    zIndex: 1150
  });
}
function destroyTouch() {
  if (TC) {
    TC.destroy();
    TC = null;
  }
}
function pollPlayerInput() {
  const f = match.fighters[0];
  if (!f || f.isBot) return;
  const ti = TC ? TC.getInput() : null;
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  if (ti) {
    x += ti.x;
    y += ti.y;
  }
  f.input.x = clamp(x, -1, 1);
  f.input.y = clamp(y, -1, 1);
  f.input.block = !!(keys.KeyL || ti && ti.c);
  if (keys.KeyJ || ti && ti.aPressed) pressQueue.light = true;
  if (keys.KeyK || ti && ti.bPressed) pressQueue.heavy = true;
  if (keys.KeyU || keys.Space || ti && ti.dPressed) pressQueue.special = true;
  if (pressQueue.light) {
    f.pressed.light = true;
    pressQueue.light = false;
  }
  if (pressQueue.heavy) {
    f.pressed.heavy = true;
    pressQueue.heavy = false;
  }
  if (pressQueue.special) {
    f.pressed.special = true;
    pressQueue.special = false;
  }
}
var camTarget = new THREE3.Vector3(0, 3.4, 10);
var camLook = new THREE3.Vector3(0, 1, 0);
camera.position.copy(camTarget);
function fighterSample(f, dt, time) {
  let action = "guard", actionT = 0;
  if (f.state === "attack" && f.move) {
    action = f.move.key === "light" ? f.def.lightProg : f.move.key === "heavy" ? f.def.heavyProg : f.def.special.prog;
    actionT = clamp(f.moveFrame / totalFrames(f.move), 0, 1);
  } else if (f.state === "hitstun") {
    action = "hit";
    actionT = clamp(f.stateFrame / Math.max(1, f.stunFrames || 10), 0, 1);
  } else if (f.state === "blockstun" || f.state === "free" && f.blocking) {
    action = "block";
    actionT = 0.5;
  } else if (f.state === "ko") {
    action = "ko";
    actionT = clamp(f.stateFrame / 40, 0, 1);
  } else if (f.state === "win") {
    action = "win";
    actionT = clamp(f.stateFrame / 70, 0, 1);
  } else if (f.moving) {
    action = null;
  }
  if (f.moving) f.runPhase += 3.1 * dt * 2.6;
  return {
    x: f.x,
    z: f.z,
    facingYaw: f.facing,
    moving: !!f.moving,
    momentum: f.moving ? 0.55 : 0,
    runPhase: f.runPhase,
    lean: 0,
    airY: 0,
    vy: 0,
    squash: 0,
    guarding: false,
    hasBall: false,
    dribblePhase: 0,
    spinDir: 1,
    time,
    slot: f.side,
    action,
    actionT
  };
}
var lastTs = performance.now();
var accumulator = 0;
var elapsed = 0;
function stepVisuals(dt, time) {
  if (match.phase === "pick") {
    for (const p of match.pickRigs) {
      updateHumanoid(p.rig, {
        x: p.x,
        z: p.z,
        facingYaw: time * 0.07 + Math.sin(time * 0.4 + p.slot) * 0.14,
        moving: false,
        momentum: 0,
        runPhase: 0,
        lean: 0,
        airY: 0,
        vy: 0,
        squash: 0,
        guarding: false,
        hasBall: false,
        dribblePhase: 0,
        spinDir: 1,
        time,
        slot: p.slot,
        action: "guard",
        actionT: 0
      }, dt, PROGRAMS);
    }
  } else {
    for (const f of match.fighters) updateHumanoid(f.rig, fighterSample(f, dt, time), dt, PROGRAMS);
  }
  drawProjectiles(time);
  stepBursts(dt);
  const excite = match.phase === "roundEnd" || match.phase === "matchEnd" ? 2.2 : 1;
  for (const c of crowd) {
    c.g.position.y = c.baseY + Math.abs(Math.sin(time * c.speed * excite + c.phase)) * 0.05 * excite;
  }
  const pulse = 0.75 + 0.25 * Math.sin(time * 2.4);
  world.userData.ringGlowMat.color.setHSL(0.52, 1, 0.45 + pulse * 0.18);
  if (match.phase === "pick") {
    const a = time * 0.07;
    camTarget.set(Math.sin(a) * 10.5, 4.4, Math.cos(a) * 10.5);
    camLook.set(0, 1.1, 0);
  } else if (match.fighters.length === 2) {
    const [a, b] = match.fighters;
    const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;
    const sep = Math.max(1.2, dist2d(a, b));
    const ax = (b.x - a.x) / sep, az = (b.z - a.z) / sep;
    let px = -az, pz = ax;
    if (pz < 0) {
      px = -px;
      pz = -pz;
    }
    let dx = px * 0.6 + 0.42, dz = pz * 0.6 + 0.91;
    const dl = Math.hypot(dx, dz);
    dx /= dl;
    dz /= dl;
    const aspect = window.innerWidth / window.innerHeight;
    const tanV = Math.tan(THREE3.MathUtils.degToRad(camera.fov / 2));
    const distForWidth = (sep / 2 + 0.6) / (tanV * aspect);
    const dist = clamp(Math.max(4.3 + sep * 0.5, distForWidth), 4.8, 11);
    camTarget.set(mx + dx * dist, dist * 0.46, mz + dz * dist);
    camLook.set(mx, 1.02, mz);
  }
  const k = 1 - Math.exp(-dt * 4.6);
  camera.position.lerp(camTarget, k);
  match.shake = Math.max(0, match.shake - dt * 0.5);
  const shX = (rnd() - 0.5) * match.shake, shY = (rnd() - 0.5) * match.shake;
  camera.lookAt(camLook.x + shX, camLook.y + shY, camLook.z);
  camera.rotation.z += Math.sin(time * 0.5) * 2e-3;
  renderer.render(scene, camera);
}
function animate(now) {
  requestAnimationFrame(animate);
  const dtReal = Math.min(0.25, (now - lastTs) / 1e3);
  lastTs = now;
  elapsed += dtReal;
  if (match.taking) return;
  if (match.phase !== "pick") {
    pollPlayerInput();
    accumulator += dtReal * (parseFloat(params.get("ts") || "") || 1);
    const step = 1 / 60;
    let n = 0;
    while (accumulator >= step && n < 90) {
      logicStep();
      accumulator -= step;
      n++;
    }
    if (n === 90) accumulator = 0;
  } else {
    accumulator = 0;
  }
  stepVisuals(dtReal, elapsed);
}
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
showPick();
if (params.get("bot") === "1" || params.has("pick")) {
  const i = clamp(parseInt(params.get("pick") || "0", 10) || 0, 0, FIGHTERS.length - 1);
  pickFighter(i);
}
requestAnimationFrame(animate);
