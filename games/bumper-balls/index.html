<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bumper Balls</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#150329;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #cv { position:fixed; inset:0; display:block; }
  #hud { position:fixed; top:0; left:0; right:0; z-index:1100; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0 16px;
    font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.65); }
  #hud .cell { min-width:86px; }
  #hud .mid { text-align:center; }
  #hud .right { text-align:right; }
  #hTime.low { color:#ff5d5d; }
  .ov { position:fixed; inset:0; z-index:1200; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    background: radial-gradient(ellipse at 50% 42%, rgba(20,4,44,.18) 0%, rgba(20,4,44,.55) 78%); }
  .ov.hidden { display:none; }
  .ov .title { font-size:52px; font-weight:900; color:#fff; letter-spacing:1px;
    text-shadow:0 0 22px rgba(34,211,238,.85), 0 4px 0 rgba(179,34,110,.9), 0 8px 26px rgba(0,0,0,.6); }
  .ov .sub { font-size:25px; color:#ffe9f6; text-shadow:0 2px 8px rgba(0,0,0,.7); }
  .ov .btn { pointer-events:auto; cursor:pointer; border:3px solid rgba(255,255,255,.75);
    background: linear-gradient(180deg,#ff5e8a,#d61c69); color:#fff; font-size:30px; font-weight:900;
    padding:16px 44px; border-radius:999px; box-shadow:0 8px 30px rgba(214,28,105,.55), inset 0 2px 0 rgba(255,255,255,.5);
    text-shadow:0 2px 4px rgba(0,0,0,.35); }
  .ov .btn:active { transform: scale(.94); }
  #endTitle { font-size:44px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>if (!window.Matter) { document.write('<script src="./matter.min.js"><\/script>'); }</script>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="cell">🏐 <span id="hAlive">6</span></div>
  <div class="cell mid"><span id="hTime">⏱ 90</span></div>
  <div class="cell right">💥 <span id="hKo">0</span></div>
</div>

<div class="ov" id="startOv">
  <div class="title">🏐 BUMPER<br>BALLS</div>
  <div class="sub">🕹️ steer &nbsp;·&nbsp; 💥 ram &nbsp;·&nbsp; 🌊 knock 'em off</div>
  <div class="btn" id="btnStart">▶ START</div>
  <div class="sub">🏆 last ball standing wins</div>
</div>

<div class="ov hidden" id="endOv">
  <div class="title" id="endTitle">🏆 YOU WIN!</div>
  <div class="sub" id="endSub">💥 0</div>
  <div class="btn" id="btnAgain">↻ PLAY AGAIN</div>
</div>

<script type="module">
import { TouchController } from './gptouch.js';

const { Engine, Bodies, Body, Composite, Events } = Matter;

/* ============================== AUDIO ============================== */
let AC = null, master = null, noiseBuf = null;
function audioInit() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (AC) { if (AC.resume) AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    // 1-sample silent buffer inside the first gesture (iOS unlock)
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
    s.buffer = b; s.connect(master); s.start();
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
document.addEventListener('pointerdown', audioInit, { passive: true });
document.addEventListener('touchend', () => { if (AC && AC.resume) AC.resume(); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.resume) AC.resume(); });

function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, f0, f1, vol, type = 'lowpass', delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = type;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  thud(v) { v = Math.min(1, v); tone(120, 42, 0.13, 'sine', 0.55 * v); noise(0.07, 700, 180, 0.30 * v); },
  scrape() { noise(0.06, 2100, 1500, 0.05, 'bandpass'); },
  whistle() { tone(920, 230, 0.55, 'sine', 0.11); },
  splash() { noise(0.45, 2600, 240, 0.30, 'lowpass', 0.16); },
  beep() { tone(660, 660, 0.09, 'square', 0.10); tone(660, 660, 0.09, 'square', 0.10, 0.16); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'square', 0.13, i * 0.09)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, f * 0.97, 0.2, 'triangle', 0.14, i * 0.13)); },
};

/* ============================== INPUT ============================== */
const tc = new TouchController({ force: true });
// No buttons in this game: strip the default A/B cluster the kit builds.
for (const id in tc._buttons) { const b = tc._buttons[id]; if (b.el && b.el.remove) b.el.remove(); }
tc._buttons = {};
const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; });
addEventListener('keyup', (e) => { keys[e.code] = false; });
let stickVec = { x: 0, y: 0 };
function readInput() {
  const ti = tc.getInput();
  stickVec = { x: ti.x, y: ti.y };
}
function mergedInput() {
  if (Math.hypot(stickVec.x, stickVec.y) > 0.06) return stickVec;
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  const m = Math.hypot(x, y);
  return m > 0 ? { x: x / m, y: y / m } : { x: 0, y: 0 };
}

/* ============================== WORLD ============================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, CX = 0, CY = 0, R0 = 0, HY = 0, bgCanvas = null;
const BALL_R = 23;

function mulberry(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

let shimmers = [], speckles = [], discCanvas = null, ballSprites = {};
function buildBackground() {
  bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
  const g = bgCanvas.getContext('2d'), rnd = mulberry(1337);
  // dusk sky
  const sky = g.createLinearGradient(0, 0, 0, HY);
  sky.addColorStop(0, '#160a2e'); sky.addColorStop(0.45, '#3b0f4f');
  sky.addColorStop(0.78, '#8e2064'); sky.addColorStop(1, '#ff7e47');
  g.fillStyle = sky; g.fillRect(0, 0, W, HY + 1);
  // stars in the upper sky
  g.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 34; i++) { const x = rnd() * W, y = rnd() * HY * 0.4; g.globalAlpha = 0.25 + rnd() * 0.6; g.fillRect(x, y, 2, 2); }
  g.globalAlpha = 1;
  // synthwave sun
  const sx = W * 0.76, sy = HY - 34, sr = 52;
  const sun = g.createRadialGradient(sx, sy, 4, sx, sy, sr);
  sun.addColorStop(0, '#ffe9a3'); sun.addColorStop(0.55, '#ffb35c'); sun.addColorStop(1, '#ff5e62');
  g.fillStyle = sun; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
  g.fillStyle = '#8e2064';
  for (let i = 0; i < 5; i++) { const yy = sy + 6 + i * 10; g.globalAlpha = 0.35 + i * 0.13; g.fillRect(sx - sr, yy, sr * 2, 2 + i); }
  g.globalAlpha = 1;
  // Vice skyline silhouette
  g.fillStyle = '#22103f';
  let x = -6;
  while (x < W + 10) { const bw = 18 + rnd() * 30, bh = 16 + rnd() * 46; g.fillRect(x, HY - bh, bw, bh); x += bw + 2 + rnd() * 6; }
  g.fillStyle = 'rgba(255,214,120,.85)';
  x = 0;
  for (let i = 0; i < 90; i++) { g.globalAlpha = 0.3 + rnd() * 0.7; g.fillRect(rnd() * W, HY - 8 - rnd() * 44, 2, 3); }
  g.globalAlpha = 1;
  // neon sea
  const sea = g.createLinearGradient(0, HY, 0, H);
  sea.addColorStop(0, '#4a1460'); sea.addColorStop(0.25, '#2a0a4a'); sea.addColorStop(1, '#12042b');
  g.fillStyle = sea; g.fillRect(0, HY, W, H - HY);
  shimmers = [];
  const hues = ['34,211,238', '255,94,168', '255,179,92'];
  for (let i = 0; i < 44; i++) shimmers.push({ x: rnd() * W, y: HY + 8 + rnd() * (H - HY - 16), len: 12 + rnd() * 42, c: hues[i % 3], ph: rnd() * 7 });
  speckles = [];
  for (let i = 0; i < 150; i++) { const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * 0.96; speckles.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr, r: 0.8 + rnd() * 1.9, a: 0.05 + rnd() * 0.13 }); }
}
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = W / 2; CY = H * 0.54; HY = H * 0.335;
  R0 = Math.min(W * 0.465, H * 0.30);
  if (phase !== 'play') R = R0;
  buildBackground();
  buildDiscSprite();
  buildBallSprites();
}
function buildDiscSprite() {
  const S = Math.ceil(R0 * 2) + 4;
  discCanvas = document.createElement('canvas'); discCanvas.width = S; discCanvas.height = S;
  const g = discCanvas.getContext('2d'), c = S / 2;
  const dg = g.createRadialGradient(c, c, R0 * 0.1, c, c, R0);
  dg.addColorStop(0, '#a7b0c2'); dg.addColorStop(0.72, '#79839a'); dg.addColorStop(1, '#4c5468');
  g.fillStyle = dg;
  g.beginPath(); g.arc(c, c, R0, 0, 7); g.fill();
  g.save();
  g.beginPath(); g.arc(c, c, R0, 0, 7); g.clip();
  for (const sp of speckles) { g.fillStyle = `rgba(20,24,40,${sp.a})`; g.beginPath(); g.arc(c + sp.x * R0, c + sp.y * R0, sp.r, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.06)';
  g.beginPath(); g.arc(c, c, R0 * 0.55, 0, 7); g.fill();
  g.restore();
}
function buildBallSprites() {
  ballSprites = {};
  const S = (BALL_R * 2 + 8) * 2;
  for (const f of FACTIONS) {
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const g = c.getContext('2d'); g.scale(2, 2);
    const cc = BALL_R + 4;
    const gr = g.createRadialGradient(cc - BALL_R * 0.35, cc - BALL_R * 0.4, BALL_R * 0.15, cc, cc, BALL_R * 1.05);
    gr.addColorStop(0, shade(f.color, 70)); gr.addColorStop(0.45, f.color); gr.addColorStop(1, shade(f.color, -60));
    g.fillStyle = gr;
    g.beginPath(); g.arc(cc, cc, BALL_R, 0, 7); g.fill();
    ballSprites[f.name] = c;
  }
}
addEventListener('resize', resize);

/* ============================== GAME STATE ============================== */
const FACTIONS = [
  { name: 'YOU',     color: '#17b169', glyph: '▲', gcol: '#ffd94d', player: true },
  { name: 'KAREN',   color: '#c96fb0', glyph: '★', gcol: '#ffffff' },
  { name: 'HOA DAD', color: '#9fc8e8', glyph: '♦', gcol: '#2f3557' },
  { name: 'TRUMPER', color: '#d91424', glyph: '★', gcol: '#ffffff' },
  { name: 'TRADWIFE',color: '#f2e3c6', glyph: '♥', gcol: '#8a3a3a' },
  { name: 'FURRY',   color: '#ff9d3c', glyph: '♣', gcol: '#ffffff' },
];
const PERSONALITIES = [null,
  { maxSpd: 5.5, accel: 0.42, aggro: 0.9, caution: 0.55 },  // bully: charges the rim-most rival
  { maxSpd: 5.2, accel: 0.38, aggro: 0.6, caution: 0.8 },   // dad: balanced, careful
  { maxSpd: 5.7, accel: 0.46, aggro: 1.0, caution: 0.35 },  // wild: full sends, falls more
  { maxSpd: 5.1, accel: 0.36, aggro: 0.5, caution: 0.9 },   // chill: camps the middle
  { maxSpd: 5.4, accel: 0.40, aggro: 0.8, caution: 0.7 },   // hunter: picks off the weak
];
let driveRamp = 1;
let engine = null, balls = [], falling = [], particles = [], ripples = [];
let phase = 'boot';           // attract | play | over
let R = 0, timeLeft = 90, roundT = 0, shrinkWarned = false, overtime = false;
let speedMul = 1, spectate = false, shake = 0, winner = null, endTimer = -1, lastScrape = 0, lastHitT = -9, suddenT = 0;
const hAlive = document.getElementById('hAlive'), hTime = document.getElementById('hTime'), hKo = document.getElementById('hKo');
const startOv = document.getElementById('startOv'), endOv = document.getElementById('endOv');
const endTitle = document.getElementById('endTitle'), endSub = document.getElementById('endSub');
const distC = (p) => Math.hypot(p.x - CX, p.y - CY);

function makeBall(i, x, y, isPlayer) {
  const f = FACTIONS[i];
  const body = Bodies.circle(x, y, BALL_R, {
    restitution: 0.6, friction: 0.02, frictionStatic: 0, frictionAir: 0.02,
    density: 0.0018, label: 'ball',
  });
  const b = { i, body, f, isPlayer, alive: true, ko: 0, lastHit: null, ai: PERSONALITIES[i] || { maxSpd: 6.0, accel: 0.52, aggro: 0.75, caution: 0.65 }, phase: Math.random() * 7, target: null, retarget: 0 };
  body.plugin = { ball: b };
  return b;
}
function startRound(mode) {
  if (engine) { Composite.clear(engine.world, false); Engine.clear(engine); }
  engine = Engine.create({ enableSleeping: false });
  engine.gravity.x = 0; engine.gravity.y = 0;
  balls = []; falling = []; particles = []; ripples = [];
  R = R0; timeLeft = 90; roundT = 0; shrinkWarned = false; overtime = false; suddenT = 0; lastFellBall = null;
  speedMul = 1; spectate = false; winner = null; endTimer = -1;
  const n = 6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const b = makeBall(i, CX + Math.cos(a) * R0 * 0.38, CY + Math.sin(a) * R0 * 0.38, mode === 'play' && i === 0);
    if (mode === 'attract') b.isPlayer = false;
    balls.push(b); Composite.add(engine.world, b.body);
  }
  Events.on(engine, 'collisionStart', onCollide);
  phase = mode;
  hKo.textContent = '0';
  syncHud();
}
function onCollide(ev) {
  const now = performance.now() / 1000;
  for (const pair of ev.pairs) {
    const A = pair.bodyA.plugin && pair.bodyA.plugin.ball, B = pair.bodyB.plugin && pair.bodyB.plugin.ball;
    if (!A || !B) continue;
    const va = pair.bodyA.velocity, vb = pair.bodyB.velocity;
    const rel = Math.hypot(va.x - vb.x, va.y - vb.y);
    A.lastHit = { by: B, t: now }; B.lastHit = { by: A, t: now };
    A.recoilUntil = now + 0.35; B.recoilUntil = now + 0.35;
    if (rel > 3) {
      lastHitT = now;
      sfx.thud((rel - 3) / 9);
      shake = Math.min(7, shake + rel * 0.35);
      const mx = (pair.bodyA.position.x + pair.bodyB.position.x) / 2, my = (pair.bodyA.position.y + pair.bodyB.position.y) / 2;
      for (let k = 0; k < Math.min(8, rel); k++) {
        const a = Math.random() * 7, s = 0.6 + Math.random() * 1.8;
        particles.push({ x: mx, y: my, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.06, col: '#ffe9a3', r: 1.6, type: 'spark' });
      }
    }
  }
}
function driveBall(b, dx, dy, maxSpd, accel) {
  accel *= driveRamp;
  if (b.recoilUntil && performance.now() / 1000 < b.recoilUntil) accel *= 0.25; // recoil: no jackhammer plowing
  const v = b.body.velocity;
  let dvx = dx * maxSpd - v.x, dvy = dy * maxSpd - v.y;
  const m = Math.hypot(dvx, dvy);
  if (m > accel) { dvx = dvx / m * accel; dvy = dvy / m * accel; }
  Body.setVelocity(b.body, { x: v.x + dvx, y: v.y + dvy });
}
function botThink(b, now) {
  const p = b.body.position, v = b.body.velocity, ai = b.ai, dC = distC(p);
  const rimLimit = R * (0.55 + ai.caution * 0.2);
  let ax, ay, spd = ai.maxSpd, accel = ai.accel;
  if (dC > rimLimit) {
    // recover: drive hard at the center
    ax = CX - p.x; ay = CY - p.y; accel = ai.accel * 1.6;
  } else {
    if (!b.target || !b.target.alive || now > b.retarget) {
      b.retarget = now + 0.7 + Math.random() * 0.9;
      const others = balls.filter((o) => o !== b && o.alive);
      if (!others.length) return;
      if (ai.aggro >= 0.95) b.target = others.reduce((m, o) => (distC(o.body.position) > distC(m.body.position) ? o : m), others[0]); // rim-most
      else if (ai.aggro <= 0.55) b.target = others.reduce((m, o) => (distC(o.body.position) < distC(m.body.position) ? o : m), others[0]); // innermost
      else b.target = others.reduce((m, o) => (Math.hypot(o.body.position.x - p.x, o.body.position.y - p.y) < Math.hypot(m.body.position.x - p.x, m.body.position.y - p.y) ? o : m), others[0]); // nearest
    }
    const t = b.target, tp = t.body.position, tv = t.body.velocity;
    // aim at the point just behind the target, away from center — pushes them OUT
    const ox = tp.x - CX, oy = tp.y - CY, om = Math.hypot(ox, oy) || 1;
    const aimX = tp.x + tv.x * 6 - (ox / om) * BALL_R * 0.7, aimY = tp.y + tv.y * 6 - (oy / om) * BALL_R * 0.7;
    ax = aimX - p.x; ay = aimY - p.y;
    const dT = Math.hypot(tp.x - p.x, tp.y - p.y);
    const align = dT > 1 ? ((tp.x - p.x) / dT) * (ox / om) + ((tp.y - p.y) / dT) * (oy / om) : 0;
    if (dT < 95 && align > 0.45) { spd = ai.maxSpd * 1.15; accel = ai.accel * 1.3; } // CHARGE
  }
  // unstick: barely moving away from the middle -> dash inward with a random slant
  if (Math.hypot(v.x, v.y) < 0.35 && dC > R * 0.25) {
    b.stillT = (b.stillT || 0) + 1;
    if (b.stillT > 80) {
      b.stillT = 0;
      const ia = Math.atan2(CY - p.y, CX - p.x) + (Math.random() - 0.5) * 1.2;
      Body.setVelocity(b.body, { x: Math.cos(ia) * 3.2, y: Math.sin(ia) * 3.2 });
      return;
    }
  } else b.stillT = 0;
  const m = Math.hypot(ax, ay) || 1;
  const wob = Math.sin(now * 1.7 + b.phase) * 0.22;
  const ca = Math.cos(wob), sa = Math.sin(wob);
  const dx = (ax / m) * ca - (ay / m) * sa, dy = (ax / m) * sa + (ay / m) * ca;
  driveBall(b, dx, dy, spd, accel);
}
let lastFellBall = null;
function eliminate(b, now) {
  if (!b.alive) return;
  b.alive = false; lastFellBall = b;
  const p = b.body.position;
  Composite.remove(engine.world, b.body);
  falling.push({ x: p.x, y: p.y, vx: b.body.velocity.x, vy: b.body.velocity.y, t: 0, f: b.f, splashed: false });
  sfx.whistle();
  if (b.lastHit && now - b.lastHit.t < 3.5 && b.lastHit.by.alive !== undefined) {
    const killer = b.lastHit.by;
    if (killer !== b) { killer.ko++; if (killer.isPlayer) hKo.textContent = String(killer.ko); }
  }
  if (b.isPlayer && phase === 'play') { spectate = true; speedMul = 2.5; }
  syncHud();
}
function tick(dt) {
  const now = performance.now() / 1000;
  roundT += dt;
  driveRamp = Math.min(1, 0.15 + roundT / 2.5);
  // --- shrink / timer ---
  if (phase === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 30.5 && !shrinkWarned) { shrinkWarned = true; sfx.beep(); }
    if (timeLeft <= 30 && timeLeft > 0) R = R0 * (0.58 + 0.42 * (timeLeft / 30));
    if (timeLeft <= 0) {
      overtime = true;
      R = Math.max(R0 * 0.14, R - R0 * 0.16 * dt);
      // sudden death: past 20s of overtime, the rim-most ball drops every 4s — rounds always end
      if (timeLeft < -20) {
        suddenT += dt;
        if (suddenT >= 4) {
          suddenT = 0;
          const aliveNow = balls.filter((b) => b.alive);
          if (aliveNow.length > 1) {
            const out = aliveNow.reduce((m, o) => (distC(o.body.position) > distC(m.body.position) ? o : m), aliveNow[0]);
            eliminate(out, now);
          }
        }
      }
    }
  } else if (phase === 'attract' && roundT > 55) {
    R = Math.max(R0 * 0.34, R - R0 * 0.06 * dt);
  }
  // --- drives ---
  for (const b of balls) {
    if (!b.alive) continue;
    const p = b.body.position;
    // shallow bowl + an ABSOLUTE-width lip in the outer ~22px: slow rollers get
    // saved, real rams still eject — and the lip stays fair when the arena shrinks
    const dC = distC(p), fr = dC / R;
    if (fr > 0.3) {
      let pull = 0.02 * fr * fr;
      const lip = dC - (R - 22);
      if (lip > 0) pull += 0.006 * lip;
      const v = b.body.velocity;
      Body.setVelocity(b.body, { x: v.x + ((CX - p.x) / (dC || 1)) * pull, y: v.y + ((CY - p.y) / (dC || 1)) * pull });
    }
    if (b.isPlayer && phase === 'play' && !spectate) {
      const inp = mergedInput(), im = Math.hypot(inp.x, inp.y);
      if (im > 0.05) driveBall(b, inp.x / Math.max(1, im), inp.y / Math.max(1, im), 5.6 * Math.min(1, im + 0.25), 0.42);
      // no input: no brake — frictionAir + the bowl lip do the work, knockbacks stay honest
    } else {
      botThink(b, now);
    }
    // rim scrape
    if (dC > R * 0.88 && Math.hypot(b.body.velocity.x, b.body.velocity.y) > 1.6 && now - lastScrape > 0.11) {
      lastScrape = now; sfx.scrape();
    }
  }
  Engine.update(engine, 1000 / 60);
  // --- falls ---
  let fell = false;
  for (const b of balls) {
    if (!b.alive) continue;
    if (distC(b.body.position) > R + BALL_R * 0.9) { eliminate(b, now); fell = true; }
  }
  if (fell) syncHud();
  const alive = balls.filter((b) => b.alive);
  if (alive.length <= 1 && phase !== 'over') {
    winner = alive[0] || lastFellBall;
    if (endTimer < 0) endTimer = 0.9;
  }
  if (endTimer > 0) {
    endTimer -= dt;
    if (endTimer <= 0) endRound();
  }
  ambientFx(dt);
}
function ambientFx(dt) {
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= pt.decay;
    if (pt.type === 'drop') { pt.vy += 0.35; }
    if (pt.type === 'confetti') { pt.vy += 0.05; pt.vx *= 0.98; pt.rot += pt.vr; }
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt * 1.6; if (ripples[i].t >= 1) ripples.splice(i, 1); }
  for (let i = falling.length - 1; i >= 0; i--) {
    const f = falling[i]; f.t += dt * 1.25;
    f.x += f.vx * (1 - f.t * 0.4); f.y += f.vy * (1 - f.t * 0.4) + f.t * f.t * 3.2;
    if (f.t > 0.5 && !f.splashed) {
      f.splashed = true; sfx.splash();
      ripples.push({ x: f.x, y: Math.max(f.y, HY + 14), t: 0 });
      for (let k = 0; k < 12; k++) particles.push({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 3.4, vy: -1 - Math.random() * 2.6, life: 1, decay: 0.045, col: '#bfe9ff', r: 2, type: 'drop' });
    }
    if (f.t >= 1) falling.splice(i, 1);
  }
}
function endRound() {
  if (phase === 'attract') { startRound('attract'); return; }
  phase = 'over'; speedMul = 1;
  const player = balls[0];
  if (winner && winner.isPlayer) {
    endTitle.textContent = '🏆 YOU WIN!';
    sfx.win();
    for (let k = 0; k < 70; k++) particles.push({ x: CX + (Math.random() - 0.5) * R0 * 1.6, y: CY - R0 * 0.7 + Math.random() * 40, vx: (Math.random() - 0.5) * 1.6, vy: 0.4 + Math.random(), life: 1.4, decay: 0.008, col: ['#ffd94d', '#ff5e8a', '#22d3ee', '#7CFC98'][k % 4], r: 3.4, type: 'confetti', rot: Math.random() * 7, vr: (Math.random() - 0.5) * 0.3 });
  } else {
    endTitle.textContent = '🏆 ' + (winner ? winner.f.name : '???') + ' WINS';
    sfx.lose();
  }
  endSub.textContent = '💥 ' + player.ko;
  endOv.classList.remove('hidden');
}
function syncHud() {
  hAlive.textContent = String(balls.filter((b) => b.alive).length);
}
document.getElementById('btnStart').addEventListener('click', () => { audioInit(); startOv.classList.add('hidden'); startRound('play'); });
document.getElementById('btnAgain').addEventListener('click', () => { audioInit(); endOv.classList.add('hidden'); startRound('play'); });

/* ============================== RENDER ============================== */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt)); g = Math.max(0, Math.min(255, g + amt)); b = Math.max(0, Math.min(255, b + amt));
  return `rgb(${r},${g},${b})`;
}
function drawBall(x, y, r, f, angle, isPlayer, danger, t, scale = 1, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.scale(scale, scale);
  // body (prerendered sprite: gradient baked in)
  const spr = ballSprites[f.name];
  if (spr) ctx.drawImage(spr, -r - 4, -r - 4, (r + 4) * 2, (r + 4) * 2);
  else { ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }
  // rim danger ring
  if (danger) {
    ctx.strokeStyle = `rgba(255,70,70,${0.55 + 0.4 * Math.sin(t * 12)})`;
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 7); ctx.stroke();
  }
  // emblem decal (rolls with the ball)
  ctx.save(); ctx.rotate(angle);
  ctx.fillStyle = f.gcol;
  ctx.font = `900 ${Math.round(r * 0.92)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(f.glyph, 0, r * 0.06);
  ctx.restore();
  // gloss
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.44, r * 0.30, r * 0.17, -0.6, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  ctx.beginPath(); ctx.ellipse(r * 0.3, r * 0.42, r * 0.42, r * 0.16, -0.5, 0, 7); ctx.fill();
  ctx.restore();
  if (isPlayer) {
    // little green cap, kept upright, tilts with motion
    ctx.save(); ctx.translate(x, y - r * 0.62); ctx.rotate(Math.max(-0.3, Math.min(0.3, (balls[0] && balls[0].alive ? balls[0].body.velocity.x : 0) * 0.03)));
    const cg = ctx.createLinearGradient(0, -r * 0.5, 0, 0);
    cg.addColorStop(0, '#1fd06a'); cg.addColorStop(1, '#0d7a3f');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.52, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#0a5c2e';
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.78, r * 0.16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd94d';
    ctx.font = `900 ${Math.round(r * 0.4)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('▲', 0, -r * 0.26);
    ctx.restore();
    // gold ▼ marker
    ctx.fillStyle = '#ffd94d';
    const bob = Math.sin(t * 6) * 3;
    ctx.beginPath();
    ctx.moveTo(x - 8, y - r - 20 + bob); ctx.lineTo(x + 8, y - r - 20 + bob); ctx.lineTo(x, y - r - 10 + bob);
    ctx.closePath(); ctx.fill();
  }
}
function render(now) {
  const t = now / 1000;
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  shake *= 0.88;
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  // sea shimmer
  for (const s of shimmers) {
    ctx.fillStyle = `rgba(${s.c},${0.10 + 0.09 * Math.sin(t * 1.4 + s.ph)})`;
    ctx.fillRect(s.x + Math.sin(t * 0.7 + s.ph) * 3, s.y, s.len, 2);
  }
  // ripples under the disc shadow layer
  for (const rp of ripples) {
    ctx.strokeStyle = `rgba(160,235,255,${(1 - rp.t) * 0.55})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(rp.x, rp.y, 8 + rp.t * 44, (8 + rp.t * 44) * 0.32, 0, 0, 7); ctx.stroke();
  }
  // floating shadow
  ctx.fillStyle = 'rgba(5,0,20,.4)';
  ctx.beginPath(); ctx.ellipse(CX, CY + R * 0.96 + 26, R * 0.94, R * 0.20, 0, 0, 7); ctx.fill();
  // stone disc (prerendered sprite, scaled to the current radius)
  if (discCanvas) ctx.drawImage(discCanvas, CX - R - 2, CY - R - 2, (R + 2) * 2, (R + 2) * 2);
  // neon rim (layered strokes, no shadowBlur — software rasterizers choke on it)
  const shrinking = (phase === 'play' && timeLeft <= 30) || (phase === 'attract' && roundT > 55);
  const rimCol = shrinking ? '255,46,136' : '34,211,238';
  ctx.strokeStyle = `rgba(${rimCol},.16)`; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(${rimCol},.30)`; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(${rimCol},${shrinking ? 0.75 + 0.25 * Math.sin(t * 10) : 0.9})`;
  ctx.lineWidth = shrinking ? 5 : 3.5;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(CX, CY, R - 7, 0, 7); ctx.stroke();
  // falling balls (behind live ones)
  for (const f of falling) drawBall(f.x, f.y, BALL_R, f.f, 0, false, false, t, 1 - f.t * 0.45, 1 - f.t * 0.25);
  // live balls
  for (const b of balls) {
    if (!b.alive) continue;
    const p = b.body.position, dC = distC(p);
    drawBall(p.x, p.y, BALL_R, b.f, b.body.angle, b.isPlayer, dC > R * 0.86, t);
  }
  // particles
  for (const pt of particles) {
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
    ctx.fillStyle = pt.col;
    if (pt.type === 'confetti') { ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot); ctx.fillRect(-pt.r, -pt.r * 0.6, pt.r * 2, pt.r * 1.2); }
    else { ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
}

/* ============================== LOOP / BOOT ============================== */
let lastMs = performance.now(), acc = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  readInput();
  let ft = Math.min(0.1, (nowMs - lastMs) / 1000); lastMs = nowMs;
  if (phase === 'play' || phase === 'attract') {
    acc += ft * speedMul;
    const STEP = 1 / 60;
    let n = 0;
    while (acc >= STEP && n < 30) { tick(STEP); acc -= STEP; n++; }
    if (acc > 0.6) acc = 0.6;
  } else if (phase === 'over') {
    ambientFx(ft);
  }
  if (phase === 'play') {
    const tl = Math.max(0, Math.ceil(timeLeft));
    hTime.textContent = overtime ? '⚠ ' + tl : '⏱ ' + tl;
    hTime.classList.toggle('low', timeLeft <= 30);
  } else if (phase === 'attract') {
    hTime.textContent = '⏱ —';
    hTime.classList.remove('low');
  }
  render(nowMs);
}
resize();
R = R0;
startRound('attract');
requestAnimationFrame(frame);

window.__dbg = {
  get phase() { return phase; },
  get over() { return phase === 'over'; },
  get winner() { return winner ? winner.f.name : null; },
  get spectate() { return spectate; },
  get R() { return R; },
  get lastHitAgo() { return performance.now() / 1000 - lastHitT; },
  balls() { return balls.map((b) => ({ name: b.f.name, x: Math.round(b.body.position.x), y: Math.round(b.body.position.y), alive: b.alive, ko: b.ko, isPlayer: b.isPlayer, vx: +b.body.velocity.x.toFixed(2), vy: +b.body.velocity.y.toFixed(2), dC: Math.round(distC(b.body.position)) })); },
  playerVel() { const b = balls[0]; return b ? { vx: +b.body.velocity.x.toFixed(2), vy: +b.body.velocity.y.toFixed(2) } : null; },
  stick() { return { x: +stickVec.x.toFixed(2), y: +stickVec.y.toFixed(2) }; },
  playerState() { const b = balls[0]; return b ? { alive: b.alive, x: Math.round(b.body.position.x), y: Math.round(b.body.position.y) } : null; },
  start() { startOv.classList.add('hidden'); startRound('play'); },
  speed(m) { speedMul = m; },
};
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
