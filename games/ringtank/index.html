<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RingTank — Water Ring Toss</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#062a4a; }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #wrap { position:relative; width:min(100vw, 420px); height:min(100dvh, 860px); aspect-ratio:420/860; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
</style>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
'use strict';
/* ============================================================
   RINGTANK — an original water ring-toss toy.
   Tap the pump buttons to blast bubble jets and float the
   rings onto the pegs. Land all 6 to win.
   ============================================================ */

// ---------- Canvas / layout (design space 420 x 860) ----------
const W = 420, H = 860;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);

// Layout constants
const HUD_H = 54;                    // top HUD strip (54/860 = 6.3%)
const TANK = { x: 8, y: 62, w: 404, h: 664 };   // 664/860 = 77.2% tall, 404/420 = 96.2% wide
const FLOOR_Y = TANK.y + TANK.h - 6;            // water bottom (sand surface base)
const BTN_Y = 786, BTN_RAD = 46;
const BTN_L = { x: 86,  y: BTN_Y, r: BTN_RAD };
const BTN_R = { x: 334, y: BTN_Y, r: BTN_RAD };

// Sandy floor: gentle wave
function sandY(x) { return FLOOR_Y - 10 + Math.sin(x * 0.021) * 7 + Math.sin(x * 0.052 + 1.7) * 3; }

// Pegs: tall purple left-of-center, shorter red right
const pegs = [
  { x: 158, h: 268, color: '#8b5cf6', dark: '#6d28d9', light: '#c4b5fd', count: 0 },
  { x: 278, h: 196, color: '#ef4444', dark: '#b91c1c', light: '#fca5a5', count: 0 }
];
pegs.forEach(p => { p.baseY = sandY(p.x) + 4; p.tipY = p.baseY - p.h; });

// Nozzles sit on the sand under each button side
const nozzles = [ { x: 92 }, { x: 328 } ];

// ---------- Audio (WebAudio synth, iOS-safe) ----------
let AC = null;
function ensureAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {}
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    // 1-sample silent buffer unlock inside the gesture
    const buf = AC.createBuffer(1, 1, AC.sampleRate);
    const src = AC.createBufferSource(); src.buffer = buf; src.connect(AC.destination); src.start(0);
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(freq, t0, dur, type, vol, slideTo) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  const now = AC.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(freq, now);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(vol, now + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(now); o.stop(now + dur + 0.05);
}
function sndPump() { // bubbly pops
  for (let i = 0; i < 5; i++)
    tone(300 + Math.random() * 500 + i * 60, i * 0.045, 0.09, 'sine', 0.10, 900 + Math.random() * 400);
}
function sndLand() { tone(660, 0, 0.12, 'triangle', 0.16); tone(990, 0.05, 0.14, 'triangle', 0.12); }
function sndCombo(n) { const base = [523, 659, 784, 1047]; for (let i = 0; i < Math.min(n + 1, 4); i++) tone(base[i], i * 0.07, 0.16, 'triangle', 0.15); }
function sndWin() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.28, 'triangle', 0.16)); }
['pointerdown', 'touchend'].forEach(ev => window.addEventListener(ev, ensureAudio, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state === 'suspended') AC.resume(); });

// ---------- Game state ----------
const RING_R = 23, RING_HOLE = 10.5, RING_T = 15; // outer radius, hole radius, stack thickness
const ringColors = [
  { main: '#f43f5e', light: '#fda4af', dark: '#be123c' },  // rose
  { main: '#f59e0b', light: '#fcd34d', dark: '#b45309' },  // amber
  { main: '#22c55e', light: '#86efac', dark: '#15803d' },  // green
  { main: '#3b82f6', light: '#93c5fd', dark: '#1d4ed8' },  // blue
  { main: '#a855f7', light: '#d8b4fe', dark: '#7e22ce' },  // violet
  { main: '#ec4899', light: '#f9a8d4', dark: '#be185d' }   // pink
];
let rings = [], bubbles = [], sparkles = [], stars = [];
let pumps = 0, pumpsL = 0, pumpsR = 0, landed = 0, won = false, winPumps = 0;
let jets = [ { t: 0 }, { t: 0 } ];          // jet timers per side
let btnPress = [0, 0];                       // button squash animation
let combo = { count: 0, lastAt: -9999 };
let popup = null;                            // {text, t, color}
let elapsed = 0;

function resetGame() {
  rings = [];
  const startX = [52, 108, 196, 238, 322, 372];
  for (let i = 0; i < 6; i++) {
    rings.push({
      x: startX[i], y: sandY(startX[i]) - RING_R - 2 - (i % 2) * 6,
      vx: 0, vy: 0, rot: (Math.random() - 0.5) * 0.6, vr: 0,
      state: 'free', peg: -1, slot: 0, color: ringColors[i], seed: Math.random() * 100
    });
  }
  pegs.forEach(p => p.count = 0);
  pumps = 0; pumpsL = 0; pumpsR = 0; landed = 0; won = false; winPumps = 0;
  jets = [{ t: 0 }, { t: 0 }]; combo = { count: 0, lastAt: -9999 }; popup = null;
  bubbles = [];
}
resetGame();

// Decorative floating gold stars (juice only, like the source's collectibles)
for (let i = 0; i < 7; i++) stars.push({ x: 30 + Math.random() * 360, y: 110 + Math.random() * 480, s: 6 + Math.random() * 6, ph: Math.random() * 6.28, sp: 0.3 + Math.random() * 0.5 });

// ---------- Pumping ----------
function pump(side) {
  ensureAudio();
  pumps++; if (side === 0) pumpsL++; else pumpsR++;
  jets[side].t = 1.0;
  btnPress[side] = 1;
  sndPump();
  const nx = nozzles[side].x;
  for (let i = 0; i < 16; i++)
    bubbles.push({ x: nx + (Math.random() - 0.5) * 44, y: FLOOR_Y - 14, r: 2 + Math.random() * 5, vy: -(190 + Math.random() * 190), vx: (Math.random() - 0.5) * 30, life: 1 });
}

// ---------- Landing / combo / win ----------
function onRingLanded(ring) {
  landed++;
  sndLand();
  // sparkle burst at peg tip
  const p = pegs[ring.peg];
  for (let i = 0; i < 10; i++)
    sparkles.push({ x: p.x, y: p.tipY, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 140 - 20, life: 0.7, max: 0.7 });
  if (elapsed - combo.lastAt < 2.5) combo.count++; else combo.count = 1;
  combo.lastAt = elapsed;
  if (combo.count === 2) { popup = { text: 'Double!', t: 1.4, color: '#fde047' }; sndCombo(2); }
  else if (combo.count === 3) { popup = { text: 'Triple!', t: 1.4, color: '#fb923c' }; sndCombo(3); }
  else if (combo.count >= 4) { popup = { text: combo.count + 'x Combo!', t: 1.4, color: '#f472b6' }; sndCombo(4); }
  if (landed >= 6 && !won) { won = true; winPumps = pumps; setTimeout(sndWin, 120); }
}

// ---------- Physics ----------
function step(dt) {
  elapsed += dt;
  jets.forEach(j => { if (j.t > 0) j.t -= dt; });
  btnPress = btnPress.map(v => Math.max(0, v - dt * 5));
  if (popup) { popup.t -= dt; if (popup.t <= 0) popup = null; }

  // ambient bubbles
  if (Math.random() < dt * 6)
    bubbles.push({ x: 20 + Math.random() * 380, y: FLOOR_Y - 8, r: 1.5 + Math.random() * 3, vy: -(40 + Math.random() * 60), vx: 0, life: 1 });
  for (const b of bubbles) {
    b.y += b.vy * dt; b.x += (b.vx + Math.sin(elapsed * 3 + b.y * 0.05) * 8) * dt;
    if (b.y < TANK.y + 14) b.life = 0;
  }
  bubbles = bubbles.filter(b => b.life > 0);
  for (const s of sparkles) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; s.life -= dt; }
  sparkles = sparkles.filter(s => s.life > 0);

  for (const r of rings) {
    if (r.state === 'onpeg') {
      // slide down the peg to its stack slot
      const p = pegs[r.peg];
      const targetY = p.baseY - 14 - r.slot * RING_T;
      r.x += (p.x - r.x) * Math.min(1, dt * 18);
      r.y += Math.min(targetY - r.y, 300 * dt);
      r.rot *= 0.8;
      if (Math.abs(r.y - targetY) < 1.5) { r.y = targetY; r.state = 'stacked'; }
      continue;
    }
    if (r.state === 'stacked') continue;

    // free ring: gentle sink + water drag + bob
    r.vy += 95 * dt;                                    // rings are slightly heavier than water
    r.vx += Math.sin(elapsed * 0.9 + r.seed) * 6 * dt;  // lazy drift
    // jet fields
    for (let s = 0; s < 2; s++) {
      if (jets[s].t <= 0) continue;
      const jx = nozzles[s].x;
      const dx = r.x - jx;
      const hgt = FLOOR_Y - r.y;                        // height above floor
      const reach = 520;
      if (Math.abs(dx) < 108 && hgt < reach) {
        const prox = 1 - Math.abs(dx) / 108;
        const fall = 1 - hgt / reach;
        const strength = (jets[s].t / 1.0) * prox * (0.35 + 0.65 * fall);
        r.vy -= 2500 * strength * dt;
        r.vx += (s === 0 ? 1 : -1) * 340 * strength * dt;   // jets push toward center
        r.vr += (Math.random() - 0.5) * 4 * strength * dt;
      }
    }
    // drag
    const drag = Math.exp(-1.15 * dt);
    r.vx *= drag; r.vy *= drag;
    r.x += r.vx * dt; r.y += r.vy * dt;
    r.rot += r.vr * dt; r.vr *= Math.exp(-2.2 * dt);
    r.rot *= 0.999;

    // walls
    const minX = TANK.x + RING_R + 4, maxX = TANK.x + TANK.w - RING_R - 4;
    if (r.x < minX) { r.x = minX; r.vx = Math.abs(r.vx) * 0.35; }
    if (r.x > maxX) { r.x = maxX; r.vx = -Math.abs(r.vx) * 0.35; }
    if (r.y < TANK.y + RING_R + 6) { r.y = TANK.y + RING_R + 6; r.vy = Math.abs(r.vy) * 0.3; }

    // floor (sand)
    const fy = sandY(r.x) - RING_R + 6;
    if (r.y > fy) { r.y = fy; r.vy = -Math.abs(r.vy) * 0.18; r.vx *= 0.86; r.vr *= 0.7; }

    // peg interaction
    for (let pi = 0; pi < 2; pi++) {
      const p = pegs[pi];
      const dx = r.x - p.x;
      // Threading: hole over the tip while descending gently
      if (Math.abs(dx) < RING_HOLE - 1.5 && r.y > p.tipY - RING_R - 4 && r.y < p.tipY + 16 && r.vy > -70) {
        r.state = 'onpeg'; r.peg = pi; r.slot = p.count++; r.vx = 0; r.vy = 0;
        onRingLanded(r);
        break;
      }
      // Solid collision with peg body/tip (circle vs vertical capsule, half-width 8)
      const hw = 8;
      if (r.y + RING_R > p.tipY && r.y - RING_R < p.baseY) {
        if (Math.abs(dx) < hw + RING_R && r.y > p.tipY + 4) {
          // side push-out
          const dir = dx >= 0 ? 1 : -1;
          r.x = p.x + dir * (hw + RING_R);
          r.vx = dir * Math.max(Math.abs(r.vx) * 0.3, 12);
        } else if (Math.abs(dx) < hw + RING_R && r.y + RING_R > p.tipY && r.y < p.tipY + 6) {
          // resting on the tip — unstable, nudges off-center
          r.y = p.tipY - RING_R;
          r.vy = Math.min(r.vy, 0);
          r.vx += dx * 2.2 * dt * 10;
        }
      }
    }
  }

  // soft ring-ring separation (free rings only)
  for (let i = 0; i < rings.length; i++) for (let j = i + 1; j < rings.length; j++) {
    const a = rings[i], b = rings[j];
    if (a.state !== 'free' || b.state !== 'free') continue;
    const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, min = RING_R * 2 - 4;
    if (d2 > 0.01 && d2 < min * min) {
      const d = Math.sqrt(d2), push = (min - d) / 2, ux = dx / d, uy = dy / d;
      a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push;
    }
  }
}

// ---------- Drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawRing(r) {
  ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot * 0.35);
  // shadow/depth ring
  ctx.beginPath(); ctx.arc(1.5, 2.5, RING_R, 0, 6.283); ctx.fillStyle = 'rgba(0,40,60,0.25)'; ctx.fill();
  // torus body
  ctx.beginPath(); ctx.arc(0, 0, RING_R, 0, 6.283); ctx.fillStyle = r.color.main; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, RING_HOLE, 0, 6.283); ctx.fillStyle = '#0e5f7d'; ctx.fill();
  // inner shading: fake the hole with water color gradient
  const hg = ctx.createRadialGradient(0, 0, 1, 0, 0, RING_HOLE + 1);
  hg.addColorStop(0, '#12809e'); hg.addColorStop(1, '#0b5a78');
  ctx.beginPath(); ctx.arc(0, 0, RING_HOLE, 0, 6.283); ctx.fillStyle = hg; ctx.fill();
  // glossy band highlight
  ctx.beginPath(); ctx.arc(0, 0, (RING_R + RING_HOLE) / 2, Math.PI * 1.05, Math.PI * 1.75);
  ctx.strokeStyle = r.color.light; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, (RING_R + RING_HOLE) / 2, Math.PI * 0.15, Math.PI * 0.55);
  ctx.strokeStyle = r.color.dark; ctx.lineWidth = 5; ctx.stroke();
  // specular dot
  ctx.beginPath(); ctx.arc(-8, -11, 3.4, 0, 6.283); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  ctx.restore();
}

function drawStar(x, y, s, color, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? s * 0.45 : s;
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function draw() {
  // backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b3d66'); bg.addColorStop(1, '#062a4a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // ---------- HUD ----------
  ctx.fillStyle = '#ffd23e';
  drawStar(26, HUD_H / 2, 11, '#ffd23e', 1);
  ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(landed + ' / 6', 44, HUD_H / 2 + 1);
  ctx.textAlign = 'center';
  ctx.font = '700 15px system-ui, sans-serif'; ctx.fillStyle = '#bfe9ff';
  ctx.fillText('RINGTANK', W / 2, HUD_H / 2 + 1);
  // pump counter (droplet + number)
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui, sans-serif';
  ctx.fillText(String(pumps), W - 66, HUD_H / 2 + 1);
  ctx.fillStyle = '#7dd3fc'; ctx.font = '15px system-ui, sans-serif';
  ctx.fillText('💧', W - 76, HUD_H / 2 + 1);
  // restart button (circle, top-right)
  ctx.beginPath(); ctx.arc(W - 28, HUD_H / 2, 17, 0, 6.283);
  ctx.fillStyle = '#155e86'; ctx.fill(); ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '19px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('↻', W - 28, HUD_H / 2 + 2);

  // ---------- Tank ----------
  ctx.save();
  rr(TANK.x, TANK.y, TANK.w, TANK.h, 26); ctx.clip();
  const wg = ctx.createLinearGradient(0, TANK.y, 0, TANK.y + TANK.h);
  wg.addColorStop(0, '#17a2c6'); wg.addColorStop(0.55, '#0d7ba3'); wg.addColorStop(1, '#0a5d84');
  ctx.fillStyle = wg; ctx.fillRect(TANK.x, TANK.y, TANK.w, TANK.h);
  // caustic light blobs
  for (let i = 0; i < 4; i++) {
    const cx = TANK.x + 60 + i * 105 + Math.sin(elapsed * 0.4 + i * 2.1) * 16;
    const cg = ctx.createRadialGradient(cx, TANK.y + 90 + i * 130, 4, cx, TANK.y + 90 + i * 130, 95);
    cg.addColorStop(0, 'rgba(190,245,255,0.20)'); cg.addColorStop(1, 'rgba(190,245,255,0)');
    ctx.fillStyle = cg; ctx.fillRect(TANK.x, TANK.y, TANK.w, TANK.h);
  }
  // light rays
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 3; i++) {
    const rx = TANK.x + 50 + i * 130 + Math.sin(elapsed * 0.25 + i) * 10;
    ctx.beginPath(); ctx.moveTo(rx, TANK.y); ctx.lineTo(rx + 34, TANK.y); ctx.lineTo(rx + 78, TANK.y + 300); ctx.lineTo(rx + 30, TANK.y + 300); ctx.closePath(); ctx.fill();
  }
  // jet columns
  for (let s = 0; s < 2; s++) {
    if (jets[s].t <= 0) continue;
    const jx = nozzles[s].x, a = jets[s].t / 1.0;
    const jg = ctx.createLinearGradient(0, FLOOR_Y, 0, FLOOR_Y - 470);
    jg.addColorStop(0, 'rgba(220,250,255,' + (0.34 * a) + ')'); jg.addColorStop(1, 'rgba(220,250,255,0)');
    ctx.fillStyle = jg;
    ctx.beginPath();
    ctx.moveTo(jx - 30, FLOOR_Y); ctx.lineTo(jx + 30, FLOOR_Y);
    ctx.lineTo(jx + 15, FLOOR_Y - 470); ctx.lineTo(jx - 15, FLOOR_Y - 470);
    ctx.closePath(); ctx.fill();
  }
  // sand
  ctx.beginPath(); ctx.moveTo(TANK.x, TANK.y + TANK.h);
  for (let x = TANK.x; x <= TANK.x + TANK.w; x += 8) ctx.lineTo(x, sandY(x));
  ctx.lineTo(TANK.x + TANK.w, TANK.y + TANK.h); ctx.closePath();
  const sg = ctx.createLinearGradient(0, FLOOR_Y - 22, 0, TANK.y + TANK.h);
  sg.addColorStop(0, '#e8cf8f'); sg.addColorStop(1, '#c2a05e');
  ctx.fillStyle = sg; ctx.fill();
  ctx.fillStyle = 'rgba(120,90,40,0.35)';
  for (let i = 0; i < 26; i++) { const x = TANK.x + 14 + ((i * 67) % 380); ctx.beginPath(); ctx.arc(x, sandY(x) + 12 + (i % 4) * 4, 2.2, 0, 6.283); ctx.fill(); }
  // nozzles
  for (const n of nozzles) {
    ctx.fillStyle = '#475569'; rr(n.x - 15, FLOOR_Y - 12, 30, 13, 5); ctx.fill();
    ctx.fillStyle = '#94a3b8'; rr(n.x - 9, FLOOR_Y - 17, 18, 7, 3); ctx.fill();
  }
  // pegs (behind rings)
  for (const p of pegs) {
    ctx.beginPath(); ctx.ellipse(p.x, p.baseY + 3, 27, 8, 0, 0, 6.283); ctx.fillStyle = p.dark; ctx.fill();
    const pg = ctx.createLinearGradient(p.x - 8, 0, p.x + 8, 0);
    pg.addColorStop(0, p.dark); pg.addColorStop(0.45, p.color); pg.addColorStop(0.62, p.light); pg.addColorStop(1, p.dark);
    ctx.fillStyle = pg; rr(p.x - 8, p.tipY, 16, p.h, 8); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.tipY, 8, 0, 6.283); ctx.fillStyle = p.color; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x - 2.5, p.tipY - 2.5, 2.6, 0, 6.283); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  }
  // decorative stars
  for (const st of stars) {
    const bobY = st.y + Math.sin(elapsed * st.sp + st.ph) * 9;
    drawStar(st.x, bobY, st.s, '#ffd23e', 0.5 + 0.3 * Math.sin(elapsed * 1.4 + st.ph));
  }
  // bubbles
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283);
    ctx.strokeStyle = 'rgba(230,250,255,0.75)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, 6.283); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
  }
  // rings: free first, stacked last (on top)
  for (const r of rings) if (r.state === 'free') drawRing(r);
  for (const r of rings) if (r.state !== 'free') drawRing(r);
  // sparkles
  for (const s of sparkles) drawStar(s.x, s.y, 6 * (s.life / s.max), '#fff7ae', s.life / s.max);
  // glass shine
  const gl = ctx.createLinearGradient(TANK.x, 0, TANK.x + 130, 0);
  gl.addColorStop(0, 'rgba(255,255,255,0.13)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(TANK.x, TANK.y, 130, TANK.h);
  ctx.restore();
  // tank frame
  rr(TANK.x, TANK.y, TANK.w, TANK.h, 26); ctx.strokeStyle = '#e11d63'; ctx.lineWidth = 7; ctx.stroke();
  rr(TANK.x - 4, TANK.y - 4, TANK.w + 8, 16, 8); ctx.fillStyle = '#f43f5e'; ctx.fill();

  // ---------- Combo popup ----------
  if (popup) {
    const s = 1 + 0.25 * Math.max(0, popup.t - 1.15);
    ctx.save(); ctx.translate(W / 2, 300); ctx.scale(s, s);
    ctx.font = '800 44px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(90,40,0,0.85)'; ctx.strokeText(popup.text, 0, 0);
    ctx.fillStyle = popup.color; ctx.fillText(popup.text, 0, 0); ctx.restore();
  }

  // ---------- Pump buttons ----------
  drawButton(BTN_L, '#2563eb', '#60a5fa', '#1e3a8a', 0);
  drawButton(BTN_R, '#eab308', '#fde047', '#a16207', 1);
  // center pump counter
  ctx.beginPath(); rr(W / 2 - 33, BTN_Y - 30, 66, 60, 14); ctx.fillStyle = '#0f2f4a'; ctx.fill();
  ctx.strokeStyle = '#3d7ea6'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '800 26px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(pumps), W / 2, BTN_Y - 6);
  ctx.fillStyle = '#9fd8f2'; ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillText('PUMPS', W / 2, BTN_Y + 15);

  // ---------- Win overlay ----------
  if (won) {
    ctx.fillStyle = 'rgba(4,30,50,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd23e'; drawStar(W / 2, 300, 54, '#ffd23e', 1);
    ctx.fillStyle = '#fff'; ctx.font = '800 40px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('All 6 Rings On!', W / 2, 400);
    ctx.font = '600 22px system-ui, sans-serif'; ctx.fillStyle = '#bfe9ff';
    ctx.fillText('You used ' + winPumps + ' pumps', W / 2, 442);
    rr(W / 2 - 92, 486, 184, 58, 29); ctx.fillStyle = '#22c55e'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 24px system-ui, sans-serif';
    ctx.fillText('↻  Play Again', W / 2, 516);
  }
}

function drawButton(b, main, light, dark, side) {
  const sq = 1 - btnPress[side] * 0.13;
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(sq, sq);
  ctx.beginPath(); ctx.arc(0, 5, b.r, 0, 6.283); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  const g = ctx.createRadialGradient(-14, -16, 6, 0, 0, b.r + 4);
  g.addColorStop(0, light); g.addColorStop(0.55, main); g.addColorStop(1, dark);
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.283); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
  // wind/pump swirl icon (three arcs)
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const a = i * 2.094 + elapsed * (jets[side].t > 0 ? 7 : 0.6);
    ctx.beginPath(); ctx.arc(Math.cos(a) * 13, Math.sin(a) * 13, 8, a, a + 2.2); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Main loop ----------
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  dt = Math.min(dt, 0.12);              // game time tracks real time even at low fps
  const sub = Math.max(1, Math.ceil(dt / 0.016)), sdt = dt / sub;
  for (let i = 0; i < sub; i++) step(sdt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Input ----------
function canvasPos(e) {
  const rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  const p = canvasPos(e);
  if (Math.hypot(p.x - (W - 28), p.y - HUD_H / 2) < 24) { resetGame(); return; }
  if (won && p.x > W / 2 - 92 && p.x < W / 2 + 92 && p.y > 486 && p.y < 544) { resetGame(); return; }
  if (Math.hypot(p.x - BTN_L.x, p.y - BTN_L.y) < BTN_RAD + 14) { pump(0); return; }
  if (Math.hypot(p.x - BTN_R.x, p.y - BTN_R.y) < BTN_RAD + 14) { pump(1); return; }
});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') pump(0);
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') pump(1);
  else if (e.key === 'r' || e.key === 'R') resetGame();
});

// ---------- QA hooks ----------
window.__game = {
  get pumps() { return pumps; },
  get pumpsLeft() { return pumpsL; },
  get pumpsRight() { return pumpsR; },
  get landed() { return landed; },
  get won() { return won; },
  get winPumps() { return winPumps; },
  get rings() { return rings.map(r => ({ x: r.x, y: r.y, vx: r.vx, vy: r.vy, state: r.state, peg: r.peg })); },
  get pegs() { return pegs.map(p => ({ x: p.x, tipY: p.tipY, baseY: p.baseY, count: p.count })); },
  pumpLeft() { pump(0); },
  pumpRight() { pump(1); },
  pump(side) { pump(side); },
  placeAbovePeg(ringIdx, pegIdx, dy) {
    const r = rings[ringIdx], p = pegs[pegIdx];
    if (!r || !p) return false;
    if (r.state !== 'free') { // free it first so tests can re-place
      if (r.peg >= 0) pegs[r.peg].count = Math.max(0, pegs[r.peg].count - 1);
      landed = Math.max(0, landed - 1);
    }
    r.state = 'free'; r.peg = -1; r.x = p.x; r.y = p.tipY - (dy || 46);
    r.vx = 0; r.vy = 0; r.vr = 0;
    return true;
  },
  restart() { resetGame(); },
  tankRect: TANK, hudH: HUD_H, W, H
};
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
