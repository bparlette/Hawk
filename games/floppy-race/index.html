<title>Floppy Race</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Fullscreen stage: the 256x224 game fills the whole viewport (largest contain fit — full width in portrait, full height in landscape, never cropped), pad floats over the stage's lower edge on a soft gradient. */
:root{
  --bg:#0d0e13;
  --frame:#c9c5b7;
  --face:#26262a;
  --ink:#17171a;
  --red:#d1261b;
  --text:#e9e6da;
  --muted:#8d8a80;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --util:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  height:100dvh;min-height:100%;margin:0;padding:0;
  overflow:hidden;background:#000;
  font-family:var(--util);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cab{position:fixed;inset:0;width:100%;height:100%;min-width:0}
.screen-wrap{position:absolute;inset:0;background:#000;overflow:hidden;line-height:0}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.pad{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad mid ab";
  gap:8px;align-items:center;
  background:linear-gradient(to bottom, rgba(13,14,19,0), rgba(13,14,19,.68) 36%);
  padding:30px max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  touch-action:none;
}
.dpad{grid-area:dpad;position:relative;width:118px;height:118px;touch-action:none;justify-self:start;background:rgba(23,23,28,.5);border-radius:14px}
.nub{position:absolute;left:calc(50% - 17px);top:calc(50% - 17px);width:34px;height:34px;border-radius:50%;background:#3a3a42;box-shadow:inset 0 0 0 2px #55555c;pointer-events:none;transition:transform .04s}
.bar{position:absolute;background:var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px #2d2d33}
.bar.h{left:0;right:0;top:calc(50% - 20px);height:40px}
.bar.v{top:0;bottom:0;left:calc(50% - 20px);width:40px}
.hub{position:absolute;left:calc(50% - 12px);top:calc(50% - 12px);width:24px;height:24px;border-radius:50%;background:#101013}
.ar{position:absolute;background:#55555c}
.ar.u{top:6px;left:calc(50% - 7px);width:14px;height:12px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ar.d{bottom:6px;left:calc(50% - 7px);width:14px;height:12px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ar.l{left:6px;top:calc(50% - 7px);width:12px;height:14px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{right:6px;top:calc(50% - 7px);width:12px;height:14px;clip-path:polygon(0 0,100% 50%,0 100%)}
.dpad.on-l .ar.l,.dpad.on-r .ar.r,.dpad.on-d .ar.d,.dpad.on-u .ar.u{background:var(--text)}
.ab{grid-area:ab;display:flex;justify-content:center;align-items:center;gap:10px;background:var(--face);border-radius:12px;padding:8px 10px 6px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:4px}
.round{
  width:54px;height:54px;border-radius:50%;border:0;background:var(--red);color:#fff;
  font:400 14px var(--pixel);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28);touch-action:none;cursor:pointer;
}
.round.on{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);filter:brightness(.88)}
.ab span{font:400 8px var(--pixel);color:#c9c5b7;letter-spacing:.02em;white-space:nowrap}
.mid{grid-area:mid;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.mid button{
  border:0;background:var(--ink);color:#c9c5b7;font:400 8px var(--pixel);
  padding:8px 10px;border-radius:999px;cursor:pointer;touch-action:none;min-width:78px;
}
.mid button.on{filter:brightness(1.6)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.keys{display:none}
.keys b{color:var(--text);font-weight:500}
</style>

<main class="cab">
  <div class="screen-wrap"><canvas id="screen" width="256" height="224" role="img" aria-label="Floppy Race game screen"></canvas></div>
  <section class="pad" aria-label="Controller">
    <div class="dpad" id="dpad"><i class="bar h"></i><i class="bar v"></i><i class="hub"></i><i class="nub" id="nub"></i><b class="ar u"></b><b class="ar d"></b><b class="ar l"></b><b class="ar r"></b></div>
    <div class="ab">
      <div><button type="button" class="round" data-k="b" aria-label="B, TAP B">B</button><span>TAP B</span></div>
      <div><button type="button" class="round" data-k="a" aria-label="A, TAP A">A</button><span>TAP A</span></div>
    </div>
    <div class="mid">
      <button type="button" data-k="select" id="snd">SOUND ON</button>
      <button type="button" data-k="start">START</button>
    </div>
  </section>
  <p class="keys"><b>Keys:</b> Tap Z then X (or the A and B buttons) ALTERNATELY to run; Up jumps hurdles and mud. Faceplant = flop on the floor and lose your speed. Enter starts, M mutes.</p>
</main>

<script>
(() => {

const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');

const img = ctx.createImageData(VW, VH);
const px32 = new Uint32Array(img.data.buffer);

const CH = { K,W,L,D,G:GR,F,R,Y,B,N,S,T,M,P:PU,O,C:CY,E,V,Q:PK,U:SKY,Z:DG,H:BRK };
const PAL32 = HEX.map(h => {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rad = Math.PI / 180;
function hash(x, y) {

/* ?seed=N (or any string) makes every run reproducible. Without it: attract mode uses its fixed seed, real play a per-run seed.

  if ((v == null || v === '') && q.get('daily')) { const d = new Date(); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); }   /* ?daily=1: everyone gets the same seed today */

const pad5 = n => String(Math.max(0, Math.round(n))).padStart(5, '0');

const SFX = {
  jump:  () => tone(260, 0.14, 'square', 0.25, 420),
  shoot: () => tone(900, 0.06, 'square', 0.18, -500),
  hit:   () => { noise(0.08, 0.3); tone(220, 0.08, 'square', 0.2, -100); },
  boom:  () => { noise(0.35, 0.6); tone(120, 0.4, 'sawtooth', 0.3, -80); },
  coin:  () => { tone(988, 0.06, 'square', 0.22); tone(1319, 0.14, 'square', 0.22, 0, 0.06); },
  hurt:  () => tone(330, 0.3, 'sawtooth', 0.28, -260),
  die:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.14, 'square', 0.28, 0, i * 0.12)),
  power: () => tone(300, 0.4, 'square', 0.25, 900),
  beep:  () => tone(520, 0.12, 'square', 0.3),
  go:    () => tone(1040, 0.35, 'square', 0.3),
  win:   () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.28, 0, i * 0.13)),
  land:  () => { tone(120, 0.1, 'triangle', 0.5, -60); noise(0.06, 0.2); },
  throw: () => tone(500, 0.12, 'square', 0.2, 400),
  catch: () => { tone(700, 0.05, 'square', 0.25); tone(500, 0.08, 'square', 0.2, 0, 0.05); },
  super: () => { tone(200, 0.5, 'sawtooth', 0.3, 1200); noise(0.4, 0.4); },
  flap:  () => tone(420, 0.07, 'triangle', 0.4, 240),

  tick:  () => tone(1400, 0.03, 'square', 0.15),
  swing: () => tone(300, 0.18, 'sawtooth', 0.12, 300),
  punch: () => { noise(0.07, 0.4); tone(160, 0.1, 'square', 0.3, -80); },
  clear: () => [523, 659, 784].forEach((f, i) => tone(f, 0.08, 'square', 0.25, 0, i * 0.06)),
