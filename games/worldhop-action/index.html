<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WORLDHOP! ACTION — Link fights through 10 worlds, forever (fan prototype, local only)</title>
<style>
  html,body{margin:0;padding:0;background:#10101c;height:100%;overflow:hidden;font-family:monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;touch-action:none;}
  #cv{position:absolute;inset:0;display:block;background:#5c94fc;image-rendering:pixelated;touch-action:none;}
  /* GamePress mobile default (gptouch): NO fixed D-pad.
     Left half = floating joystick that appears under your thumb wherever you touch.
     Right side = circular action cluster anchored bottom-right. */
  #joyBase{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
    background:rgba(10,14,32,.28);display:none;z-index:6;pointer-events:none;transform:translate(-50%,-50%);}
  #joyBase.on{display:block;}
  #joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.82);
    border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.35);left:50%;top:50%;transform:translate(-50%,-50%);}
  #joyHint{position:absolute;left:14px;bottom:14px;z-index:4;display:none;align-items:center;gap:8px;pointer-events:none;
    color:rgba(255,255,255,.92);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    background:rgba(10,14,32,.32);border:1.5px dashed rgba(255,255,255,.55);border-radius:999px;padding:9px 12px;}
  #joyHint.on{display:flex;}
  #joyHint i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);position:relative;flex:none;}
  #joyHint i::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);}
  .tbtn{position:absolute;display:none;align-items:center;justify-content:center;
    border:2px solid rgba(255,255,255,.72);border-radius:50%;color:#fff;font-weight:800;
    background:rgba(10,14,32,.42);box-shadow:0 3px 10px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
    user-select:none;-webkit-user-select:none;touch-action:none;
    font-family:monospace;text-align:center;z-index:7;line-height:1.05;letter-spacing:.02em;}
  .tbtn.on{display:flex;}
  .tbtn:active,.tbtn.pressed{background:rgba(255,255,255,.42);transform:scale(.94);}
  /* A = primary (JUMP) largest, bottom-right corner. ATK/SPEC cluster around it. */
  #bJump{right:12px;bottom:12px;width:78px;height:78px;font-size:13px;background:rgba(231,64,46,.72);border-color:rgba(255,255,255,.85);}
  #bAtk{right:102px;bottom:12px;width:64px;height:64px;font-size:10px;background:rgba(46,160,60,.55);}
  #bSpec{right:102px;bottom:88px;width:64px;height:64px;font-size:10px;background:rgba(64,110,231,.55);}
</style>
<style id="moth-game-guard">

<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="joyHint"><i></i>Drag — floating stick</div>
  <div class="tbtn" id="bJump">JUMP</div>
  <div class="tbtn" id="bAtk">SWORD</div>
  <div class="tbtn" id="bSpec">BEAM·BOW</div>
</div>
<script>
'use strict';
// ============================================================
// WORLDHOP! ACTION — the LINK UNLEASHED engine (full Zelda II
// moveset: stab, low stab, upward thrust, downward thrust,
// sword beam, fireball, bow & arrow, FAIRY glide) dropped into
// WORLDHOP's endless 10-world runner. Joystick to move — NO
// stride/button-mash mechanic anywhere. The course cycles 10
// famous side-scrolling worlds forever, escalating each loop.
// Fan prototype, local only. IP rips are local-prototyping
// assets from the workspace sprite library.
// ============================================================

// ============================== setup ==============================
const TILE = 48, ROWS = 12;
const GY = 9; // ground top row
const SEG_TILES = 350;               // one world segment (~700 m at 24 px/m)
const METER = 24;                    // px per meter for distance/score
const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let VW = 960, VH = 576, SCALE = 1;
function resize(){
  cv.width = innerWidth; cv.height = innerHeight;
  SCALE = cv.height / 576;
  if (cv.width / SCALE < 520) SCALE = cv.width / 520;
  VW = cv.width / SCALE; VH = cv.height / SCALE;
}
addEventListener('resize', resize); resize();
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const NOCARD = Q.has('nocard');
const START_WORLD = Math.min(10, Math.max(1, parseInt(Q.get('world')||'1', 10) || 1));
const XOFF = Math.max(0, parseInt(Q.get('xoff')||'0', 10) || 0);

// ============================== audio (all synthesized) ==============================
const AU = {
  ctx:null, master:null,
  ensure(){
    try{
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.45;
        this.master.connect(this.ctx.destination);
        if (navigator.audioSession) { try{ navigator.audioSession.type = 'playback'; }catch(e){} }
        const b = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
        const s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination); s.start();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){}
  },
  tone(freq, dur, type, vol, slideTo, delay){
    if (!this.ctx) return;
    try{
      const t0 = this.ctx.currentTime + (delay||0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type||'square'; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(vol||0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
    }catch(e){}
  },
  noise(dur, fFrom, fTo, vol, delay){
    if (!this.ctx) return;
    try{
      const t0 = this.ctx.currentTime + (delay||0);
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(fFrom, t0);
      f.frequency.exponentialRampToValueAtTime(Math.max(40,fTo), t0+dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol||0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      src.connect(f); f.connect(g); g.connect(this.master); src.start(t0);
    }catch(e){}
  },
  step(){ this.noise(0.03, 900, 300, 0.05); },
  jump(){ this.tone(300, 0.16, 'sine', 0.20, 700); },
  coin(){ this.tone(988, 0.07, 'square', 0.12); this.tone(1319, 0.28, 'square', 0.12, null, 0.07); },
  stomp(){ this.noise(0.13, 900, 160, 0.30); this.tone(320, 0.14, 'sine', 0.22, 70); },
  bonk(){ this.tone(120, 0.09, 'square', 0.20, 70); },
  kick(){ this.tone(480, 0.10, 'square', 0.16, 940); },
  hurt(){ this.tone(300, 0.28, 'sawtooth', 0.18, 82); },
  swing(){ this.noise(0.08, 3200, 500, 0.16); },
  beam(){ this.tone(1240, 0.22, 'square', 0.14, 240); },
  fire(){ this.noise(0.22, 1400, 240, 0.20); this.tone(180, 0.18, 'sawtooth', 0.08, 60); },
  bowDraw(){ this.tone(240, 0.25, 'sine', 0.06, 420); },
  bow(){ this.tone(760, 0.10, 'triangle', 0.20, 190); this.noise(0.05, 2600, 900, 0.10); },
  glide(){ this.tone(1320, 0.10, 'sine', 0.05, 1760); },
  fanfare(){ [392,523,659,784,1047,784,1047,1319].forEach((f,i)=> this.tone(f, 0.16, 'square', 0.13, null, i*0.075)); },
  over(){ [392,330,262,196].forEach((f,i)=> this.tone(f, 0.3, 'triangle', 0.16, null, i*0.16)); }
};
addEventListener('pointerdown', ()=>AU.ensure());
addEventListener('keydown', ()=>AU.ensure());
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) AU.ensure(); });

// ============================== worlds ==============================
// Order is locked: the hop arc. sky = [top,bottom] gradient; tint =
// [color, alpha] enemy recolor (null = natural); door = doorway style
// drawn at the END of the segment (outgoing world's style).
const WORLDS = [
  { slug:'dinosaur-land',  name:'DINOSAUR LAND',    game:'Super Mario World',            sky:['#5c94fc','#9ecbff'], tint:null,               door:'pipe'   },
  { slug:'green-hill',     name:'GREEN HILL ZONE',  game:'Sonic the Hedgehog',           sky:['#2a6cff','#8fd8ff'], tint:null,               door:'sign'   },
  { slug:'kongo-jungle',   name:'KONGO JUNGLE',     game:'Donkey Kong Country',          sky:['#f78c2a','#ffd76a'], tint:null,               door:'barrel' },
  { slug:'vegetable-valley',name:'VEGETABLE VALLEY',game:"Kirby's Adventure",            sky:['#6a5cff','#ffc7ec'], tint:['#ff9ecf',0.25],   door:'star'   },
  { slug:'the-palace',     name:'THE PALACE',       game:'Zelda II: The Adventure of Link', sky:['#3a2a6a','#8a5aa8'], tint:['#ffd75a',0.22], door:'arch'   },
  { slug:'metal-man',      name:'METAL MAN STAGE',  game:'Mega Man 2',                   sky:['#101828','#3a5a78'], tint:['#9adcff',0.30],   door:'shutter'},
  { slug:'brinstar',       name:'BRINSTAR',         game:'Super Metroid',                sky:['#0a1410','#1e4632'], tint:['#7ee787',0.28],   door:'bubble' },
  { slug:'draculas-castle',name:"DRACULA'S CASTLE", game:'Castlevania',                  sky:['#141433','#4a2a5a'], tint:['#b8b8d0',0.35],   door:'gate'   },
  { slug:'the-moon',       name:'THE MOON',         game:'DuckTales',                    sky:['#05050f','#23233d'], tint:['#e8e8f0',0.30],   door:'rocket' },
  { slug:'graveyard',      name:'THE GRAVEYARD',    game:"Ghosts 'n Goblins",            sky:['#1a1030','#4a2a4a'], tint:['#c09aff',0.30],   door:'iron'   },
];
function segWorld(segIdx){ return ((segIdx % 10) + 10) % 10; }
function segCycle(segIdx){ return Math.floor(segIdx / 10) + 1; }
function worldOfX(x){ return segWorld(Math.floor(x / (SEG_TILES*TILE))); }

// ============================== assets ==============================
const IMG = {};
function load(name, path){ const im = new Image(); im.src = path; IMG[name] = im; }
['idle_0','walk_0','walk_1','walk_2','crouch_0',
 'jump_rise_0','jump_fall_0','hurt_0','win_0','thrust_0',
 'stab_0','stab_low_0','thrust_up_0','fairy_0','fairy_1']
 .forEach(n => load('link_'+n, 'assets/link/'+n+'.png'));
['beam_0','beam_1','fire_0','fire_1'].forEach(n => load('proj_'+n, 'assets/projectiles/'+n+'.png'));
['qblock_0','qblock_1','qblock_2','used','brick','pipe_top','pipe_body',
 'rupee_0','rupee_1','rupee_2','mountains'].forEach(n => load(n, 'assets/tiles/'+n+'.png'));
['goomba_0','goomba_1','goomba_flat','koopa_0','koopa_1','shell'].forEach(n => load(n, 'assets/enemies/'+n+'.png'));
WORLDS.forEach((w,i)=>{
  load('w'+i+'_top',  'assets/worlds/'+w.slug+'/ground_top.png');
  load('w'+i+'_fill', 'assets/worlds/'+w.slug+'/ground_fill.png');
  load('w'+i+'_bg',   'assets/worlds/'+w.slug+'/bg.png');
  load('w'+i+'_obst', 'assets/worlds/'+w.slug+'/obst.png');
});
// per-world tinted enemy variants, built once source frames load
const TINTED = WORLDS.map(()=>({}));
function buildTints(){
  const names = ['goomba_0','goomba_1','goomba_flat','koopa_0','koopa_1','shell'];
  WORLDS.forEach((w,wi)=>{
    if (!w.tint) return;
    for (const n of names){
      const src = IMG[n];
      if (!src.complete || !src.width || TINTED[wi][n]) continue;
      const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
      const g = c.getContext('2d');
      g.drawImage(src, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      g.globalAlpha = w.tint[1]; g.fillStyle = w.tint[0]; g.fillRect(0,0,c.width,c.height);
      TINTED[wi][n] = c;
    }
  });
}
function enemyImg(wi, name){
  const t = TINTED[wi] && TINTED[wi][name];
  return t || IMG[name];
}

// ============================== endless course ==============================
// Columns live in per-segment caches, generated deterministically
// from the absolute segment index. tileAt() uses ABSOLUTE tiles.
// ACTION EDITION: foe placement is denser than the stride version —
// enemies stand IN the run path of nearly every feature so Link
// fights his way through each world (sword / beam / bow / thrust).
const segCache = new Map();
function rngFor(seed){
  let a = (seed * 2654435761) >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function genSegment(segIdx){
  if (segCache.has(segIdx)) return segCache.get(segIdx);
  const rnd = rngFor(segIdx + 7);
  const cycle = segCycle(segIdx);
  const diff = Math.min(1, 0.25 + 0.25*(cycle-1)); // base difficulty from cycle
  const cols = [];
  for (let i=0;i<SEG_TILES;i++) cols.push(new Array(ROWS).fill(' '));
  const coinList = [], foeList = [];
  const set = (lx,y,c)=>{ if(lx>=0&&lx<SEG_TILES&&y>=0&&y<ROWS) cols[lx][y]=c; };
  const ground = (lx)=>{ for(let y=GY;y<ROWS;y++) set(lx,y,'#'); };
  const rupeesRow = (lx0, n, y)=>{ for(let i=0;i<n;i++) coinList.push({tx: segIdx*SEG_TILES + lx0 + i, ty: y}); };
  const foe = (kind, lx)=>{ foeList.push({kind, tx: segIdx*SEG_TILES + lx}); };
  // entry apron: 10 safe flat columns (landing from the previous hop)
  let x = 0;
  for (; x<10; x++) ground(x);
  rupeesRow(3, 4, GY-2);
  foe('goomba', 14); // first contact comes early — the run is a fight
  let guard = 0;
  while (x < SEG_TILES - 14 && guard++ < 300){
    const local = x / SEG_TILES;                       // 0..1 within the world
    const d = Math.min(1, diff + local*0.45);          // thickens as the world goes on
    const r = rnd();
    if (r < 0.16){ // ---- pit ----
      const wdt = Math.min(5, 2 + Math.floor(rnd()*2 + d*2.2));
      x += wdt;
      const run = 6 + Math.floor(rnd()*8);
      for (let i=0;i<run && x<SEG_TILES-12;i++,x++) ground(x);
      if (rnd()<0.5) foe(rnd()<0.7?'goomba':'koopa', x-3); // guard on the far lip
    } else if (r < 0.34){ // ---- obstacle stack (pipe skin per world) ----
      const h = 2 + (rnd()<0.45?1:0);
      set(x, GY-h, '['); set(x+1, GY-h, ']');
      for (let y=GY-h+1;y<GY;y++){ set(x,y,'{'); set(x+1,y,'}'); }
      ground(x); ground(x+1); x += 2;
      if (rnd()<0.6) rupeesRow(x+1, 3, GY-h-2);
      const run = 5 + Math.floor(rnd()*7);
      for (let i=0;i<run && x<SEG_TILES-12;i++,x++) ground(x);
      foe(rnd()<0.7?'goomba':'koopa', x-3);              // ACTION: always a foe past the stack
      if (rnd()<0.4) foe('goomba', x-6);
    } else if (r < 0.50){ // ---- block row (? and brick) over flat ----
      const n = 3 + Math.floor(rnd()*3);
      for (let i=0;i<n;i++){ ground(x+i); set(x+i, GY-4, (i%2===0)?'?':'B'); }
      x += n;
      const run = 4 + Math.floor(rnd()*6);
      for (let i=0;i<run && x<SEG_TILES-12;i++,x++) ground(x);
      if (rnd()<0.85) foe('goomba', x-2);
    } else if (r < 0.64){ // ---- floating platform hop with rupees ----
      const n = 4 + Math.floor(rnd()*3);
      for (let i=0;i<n;i++){ ground(x+i); }
      for (let i=0;i<n;i++) set(x+i, GY-3, '#');
      rupeesRow(x, n, GY-5);
      x += n;
      const run = 4 + Math.floor(rnd()*5);
      for (let i=0;i<run && x<SEG_TILES-12;i++,x++) ground(x);
      if (rnd()<0.6) foe('goomba', x-3);
    } else if (r < 0.76){ // ---- staircase up, drop off ----
      const h = 3 + Math.floor(rnd()*2);
      for (let s=0;s<h;s++){ ground(x+s); for(let k=0;k<=s;k++) set(x+s, GY-1-k, 'X'); }
      x += h;
      for (let i=0;i<3;i++,x++) ground(x);
      rupeesRow(x-2, 3, GY-h-2);
      if (rnd()<0.75) foe('goomba', x+2);
    } else { // ---- plain run: an enemy cluster + rupee arc ----
      const run = 7 + Math.floor(rnd()*9);
      for (let i=0;i<run && x<SEG_TILES-12;i++,x++) ground(x);
      const nF = 1 + Math.floor(rnd()*(d>0.6?3:2)) + (rnd()<0.5?1:0);
      for (let i=0;i<nF;i++) foe(rnd()<0.72?'goomba':'koopa', x - 2 - i*2);
      if (rnd()<0.6) rupeesRow(x - Math.floor(run/2), 4, GY-2);
    }
  }
  // exit apron: flat, quiet — the doorway stands here
  for (; x<SEG_TILES; x++) ground(x);
  // ACTION top-up: guarantee a fight density of >=8 foes per segment,
  // sprinkled on open ground columns away from existing foes.
  let tries = 0;
  while (foeList.length < 8 && tries++ < 60){
    const lx = 18 + Math.floor(rnd()*(SEG_TILES-40));
    if (cols[lx][GY] !== '#' || cols[lx][GY-1] !== ' ') continue;
    if (foeList.some(f => Math.abs(f.tx - (segIdx*SEG_TILES + lx)) < 5)) continue;
    foe(rnd()<0.72?'goomba':'koopa', lx);
  }
  const seg = { cols, coinList, foeList, activated:false };
  segCache.set(segIdx, seg);
  // keep the cache small: drop segments well behind
  for (const k of segCache.keys()) if (k < segIdx-2) segCache.delete(k);
  return seg;
}
const SOLID = new Set(['#','B','?','U','X','[',']','{','}']);
function tileAt(tx,ty){
  if (tx<0) return 'X';
  if (ty>=ROWS || ty<0) return ' ';
  const segIdx = Math.floor(tx / SEG_TILES);
  const seg = genSegment(segIdx);
  return seg.cols[tx - segIdx*SEG_TILES][ty];
}
function solidAt(tx,ty){ return SOLID.has(tileAt(tx,ty)); }

// live pickups / enemies (activated per segment as Link approaches)
let coins = [], enemies = [], projectiles = [];
function activateSegment(segIdx){
  const seg = genSegment(segIdx);
  if (seg.activated) return;
  seg.activated = true;
  for (const c of seg.coinList)
    coins.push({ x: c.tx*TILE+8, y: c.ty*TILE+6, w:32, h:36, taken:false, ph: (c.tx*1.7)%6 });
  for (const f of seg.foeList){
    const isK = f.kind==='koopa';
    const e = { kind: f.kind, mode:'walk', x: f.tx*TILE+6, y: 0, w: isK?34:36, h: isK?66:38,
      vx: -(isK?34:40), vy:0, t: (f.tx%7), dead:false, dying:0, shellVx:0 };
    e.y = findGroundY(e) - e.h;
    if (e.y < ROWS*TILE) enemies.push(e);
  }
}
function findGroundY(e){
  for (let ty=0; ty<ROWS; ty++){ if (solidAt(Math.floor((e.x+e.w/2)/TILE), ty)) return ty*TILE; }
  return ROWS*TILE + 200;
}

// ============================== entities ==============================
const GRAV = 2100, BASE_RUN = 335, JUMP_V = 905;
const START_SEG = START_WORLD - 1;
const START_X = START_SEG*SEG_TILES*TILE + 2*TILE + XOFF;
const P = { // player — LINK UNLEASHED's full kit state
  x: START_X, y: GY*TILE-86, w: 34, h: 86, vx:0, vy:0, grounded:false,
  face: 1, state:'idle', t:0, hearts:3, coins:0, score:0, invuln:0, coyote:0, jbuf:0,
  safeX: START_X, safeY: GY*TILE-86, dead:false, over:false,
  crouching:false, gliding:false, thrusting:false,
  atkKind:null, atkT:0, atkCd:0, atkHit:new Set(),
  specCd:0, bowCharge:false, specHeld:false, specT:0,
  dist:0, lastKill:null
};
function maxRun(){ return BASE_RUN + (segCycle(Math.floor(P.x/(SEG_TILES*TILE))) - 1) * 28; }
let particles = [], popups = [], coinPops = [], bumpAnims = [];
let camX = Math.max(0, START_X - 300), shake = 0, time = 0, runTime = 0, started = false;
let curSeg = START_SEG, curWorld = segWorld(START_SEG), curCycle = segCycle(START_SEG);
let cardT = 0, cardWorld = curWorld, cardCycle = curCycle;
let worldsVisited = [WORLDS[curWorld].name];
let transitions = []; // {seg, world, name, cycle, tAbs} — tAbs = performance.now() at crossing (video sync)
let bestM = parseInt(localStorage.getItem('worldhop_best_m')||'0', 10) || 0;
function distM(){ return Math.max(0, Math.floor((P.x - (START_SEG*SEG_TILES*TILE + 2*TILE)) / METER)); }
function scoreNow(){ return distM() + P.score; }
for (let s = START_SEG; s <= START_SEG+2; s++) activateSegment(s);

// ============================== helpers ==============================
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function burst(x,y,n,cols,spd,life,grav){
  spd = spd||160; life = life||0.5; grav = grav===undefined?500:grav;
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=spd*(0.3+Math.random()*0.7);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:life*(0.5+Math.random()*0.5),t:0,
      col:cols[i%cols.length], size:2+Math.random()*3, grav}); }
}
function popup(x,y,txt,col){ popups.push({x,y,txt,col:col||'#fff',t:0}); }
function addScore(n,x,y){ P.score+=n; popup(x,y,'+'+n,'#ffe95a'); }
function sparkle(x,y){
  particles.push({x:x+(Math.random()*30-15), y:y+(Math.random()*26-8), vx:-20-Math.random()*30, vy:8+Math.random()*22,
    life:0.5, t:0, col: Math.random()<0.5?'#fff7ae':'#ffd1f2', size:2+Math.random()*2, grav:-30});
}
function dust(x,y,n){
  for(let i=0;i<(n||2);i++)
    particles.push({x:x+(Math.random()*14-7), y:y-2, vx:-40-Math.random()*70, vy:-20-Math.random()*45,
      life:0.32, t:0, col:'#e8dcbc', size:2.5+Math.random()*2.5, grav:60});
}

// ============================== input — keyboard / touch / bot, ONE path ==============================
const keys = {};
const touch = { left:0, right:0, down:0, up:0, jump:0, atk:0, spec:0 };
const botIn = { left:0, right:0, down:0, up:0, jump:0, atk:0, spec:0 };
const IN = {
  get left(){ return !!(keys.ArrowLeft || keys.KeyA || touch.left || botIn.left); },
  get right(){ return !!(keys.ArrowRight || keys.KeyD || touch.right || botIn.right); },
  get down(){ return !!(keys.ArrowDown || keys.KeyS || touch.down || botIn.down); },
  get up(){ return !!(keys.ArrowUp || keys.KeyW || touch.up || botIn.up); },
  get jump(){ return !!(keys.Space || touch.jump || botIn.jump); },
  get atk(){ return !!(keys.KeyJ || keys.KeyZ || touch.atk || botIn.atk); },
  get spec(){ return !!(keys.KeyK || keys.KeyL || keys.KeyX || touch.spec || botIn.spec); }
};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function bindBtn(id, prop){
  const el = document.getElementById(id);
  const pointers = new Set();
  const on = e => { e.preventDefault(); e.stopPropagation(); AU.ensure(); pointers.add(e.pointerId);
    el.classList.add('pressed'); try{ el.setPointerCapture(e.pointerId); }catch(_){} touch[prop] = 1; };
  const off = e => { pointers.delete(e.pointerId); if (!pointers.size){ el.classList.remove('pressed'); touch[prop] = 0; } };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
}
bindBtn('bJump', 'jump'); bindBtn('bAtk', 'atk'); bindBtn('bSpec', 'spec');
const isTouchUI = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouchUI) document.querySelectorAll('.tbtn').forEach(b => b.classList.add('on'));
/* --- GamePress floating joystick: left half, spawns under thumb, pointerId-isolated --- */
(function(){
  const base = document.getElementById('joyBase'), knob = document.getElementById('joyKnob'), hint = document.getElementById('joyHint');
  let pid = null, cx = 0, cy = 0;
  const R = 42, DEAD = 10;
  function pos(e){ const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, rx: (e.clientX - r.left) / r.width }; }
  function clear(){ pid = null; touch.left = 0; touch.right = 0; touch.down = 0; touch.up = 0;
    base.classList.remove('on'); knob.style.left = '50%'; knob.style.top = '50%';
    if (isTouchUI && hint) hint.classList.add('on'); }
  if (isTouchUI && hint) hint.classList.add('on');
  stage.addEventListener('pointerdown', e => {
    AU.ensure();
    if (pid !== null) return;
    if (e.target.closest && e.target.closest('.tbtn')) return;
    const p = pos(e);
    if (p.rx > 0.5) return; // left half only — right half is for action buttons
    pid = e.pointerId; cx = p.x; cy = p.y;
    try{ stage.setPointerCapture(pid); }catch(_){}
    base.style.left = cx + 'px'; base.style.top = cy + 'px'; base.classList.add('on');
    if (hint) hint.classList.remove('on');
    e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const p = pos(e);
    let dx = p.x - cx, dy = p.y - cy;
    const d = Math.hypot(dx, dy) || 1, cl = Math.min(d, R);
    const nx = dx / d * cl, ny = dy / d * cl;
    knob.style.left = (50 + nx / 118 * 100) + '%'; knob.style.top = (50 + ny / 118 * 100) + '%';
    touch.left = dx < -DEAD ? 1 : 0;
    touch.right = dx > DEAD ? 1 : 0;
    touch.down = dy > 22 ? 1 : 0;
    touch.up = dy < -22 ? 1 : 0;
  });
  const end = e => { if (e.pointerId === pid) clear(); };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
})();
stage.addEventListener('contextmenu', e => e.preventDefault());

// ============================== physics ==============================
function moveBody(b, dt, isPlayer){
  b.x += b.vx*dt;
  let ty0 = Math.floor(b.y/TILE), ty1 = Math.floor((b.y+b.h-1)/TILE);
  if (b.vx > 0){ const tx = Math.floor((b.x+b.w)/TILE);
    for(let ty=ty0;ty<=ty1;ty++) if(solidAt(tx,ty)){ b.x = tx*TILE - b.w - 0.01; if(isPlayer) hitWall(tx,ty); b.vx = Math.min(b.vx,0); break; } }
  else if (b.vx < 0){ const tx = Math.floor(b.x/TILE);
    for(let ty=ty0;ty<=ty1;ty++) if(solidAt(tx,ty)){ b.x = (tx+1)*TILE + 0.01; if(isPlayer) hitWall(tx,ty); b.vx = Math.max(b.vx,0); break; } }
  b.y += b.vy*dt;
  let tx0 = Math.floor(b.x/TILE), tx1 = Math.floor((b.x+b.w-1)/TILE);
  b.grounded = false;
  if (b.vy > 0){ const ty = Math.floor((b.y+b.h)/TILE);
    for(let tx=tx0;tx<=tx1;tx++) if(solidAt(tx,ty)){ b.y = ty*TILE - b.h - 0.01; b.vy = 0; b.grounded = true; break; } }
  else if (b.vy < 0){ const ty = Math.floor(b.y/TILE);
    for(let tx=tx0;tx<=tx1;tx++) if(solidAt(tx,ty)){ b.y = (ty+1)*TILE + 0.01; b.vy = 0; if(isPlayer) headBump(tx,ty); break; } }
}
function hitWall(){}
// bump blocks in an absolute-tile world: mark the segment cell 'U' and
// remember its absolute position for the bump animation.
const bumpedCells = new Set();
function headBump(tx,ty){
  const c = tileAt(tx,ty);
  if (c==='?'){
    const segIdx = Math.floor(tx / SEG_TILES);
    genSegment(segIdx).cols[tx - segIdx*SEG_TILES][ty] = 'U';
    bumpedCells.add(tx+','+ty);
    coinPops.push({x:tx*TILE+8, y:(ty-1)*TILE, t:0});
    bumpAnims.push({tx,ty,t:0});
    P.coins++; addScore(200, tx*TILE+8, (ty-1)*TILE);
    AU.coin();
  } else if (c==='B' || c==='#'){
    bumpAnims.push({tx,ty,t:0});
    AU.bonk();
  }
}

// ============================== combat (LINK UNLEASHED, full kit) ==============================
function toShell(e){
  const cx = e.x + e.w/2;
  e.mode='shell'; e.kind='shell'; e.h=30; e.w=38; e.x = cx-19; e.y += (66-30); e.vx=0; e.shellVx=0; e.t=0;
}
function kickShell(e, dir){
  e.shellVx = dir*390; addScore(50, e.x, e.y-8);
  burst(e.x+e.w/2, e.y+e.h/2, 6, ['#fff','#7ee787'], 140, 0.35);
  AU.kick();
}
function killEnemy(e, pts){
  e.mode='dying'; e.dying=0; e.vy=-300; P.kills = (P.kills||0)+1; addScore(pts, e.x, e.y-12);
  burst(e.x+e.w/2, e.y+e.h/2, 10, ['#ffffff','#ffd75a','#c8732a'], 200, 0.5);
}
function swordHit(e){
  // one sword resolution for stab / low stab / up thrust / projectile-less melee
  AU.stomp();
  if (e.mode==='walk'){
    if (e.kind==='koopa'){ toShell(e); addScore(100, e.x, e.y-10); }
    else killEnemy(e, 100);
  } else if (e.mode==='shell'){
    if (e.shellVx===0) kickShell(e, P.face);
    else { e.shellVx = P.face*390; addScore(50, e.x, e.y-8); AU.kick(); } // smack a moving shell away
  }
}
function projHit(pr, e){
  if (e.mode==='walk'){
    if (e.kind==='koopa'){ toShell(e); addScore(100, e.x, e.y-10); AU.stomp(); }
    else { killEnemy(e, 100); }
  } else if (e.mode==='shell' && e.shellVx===0){
    kickShell(e, pr.vx > 0 ? 1 : -1);
  }
}
function attackBox(){
  const cx = P.x + P.w/2;
  if (P.atkKind==='stab') return { x: P.face>0 ? P.x+P.w-6 : P.x-50, y: P.y+22, w:56, h:34 };
  if (P.atkKind==='low') return { x: P.face>0 ? P.x+P.w-6 : P.x-50, y: P.y+P.h-38, w:56, h:32 };
  if (P.atkKind==='up') return { x: cx-16, y: P.y-56, w:32, h:62 };
  return null;
}
function startAttack(kind){
  P.atkKind = kind; P.atkT = 0; P.atkCd = 0.30; P.atkHit = new Set();
  AU.swing();
}
function fireProjectile(kind){
  P.lastShot = kind;
  const cx = P.x + P.w/2;
  const dir = P.face;
  // heights tuned so shots connect with ground enemies (goomba top = feet-38):
  // beam box P.y+34..+58, fire P.y+28..+64, arrow at P.y+38.
  if (kind==='beam'){
    projectiles.push({ kind, x: cx + dir*20 - 24, y: P.y + 34, w:48, h:24, vx: dir*640, vy:0, grav:0, t:0, life:1.15 });
    AU.beam();
  } else if (kind==='fire'){
    projectiles.push({ kind, x: cx + dir*20 - 18, y: P.y + 28, w:36, h:36, vx: dir*395, vy:-70, grav:540, t:0, life:1.6 });
    AU.fire();
  } else if (kind==='arrow'){
    projectiles.push({ kind, x: cx + dir*26 - 26, y: P.y + 38, w:52, h:9, vx: dir*840, vy:0, grav:110, t:0, life:1.05 });
    AU.bow();
  }
  const cy = P.y + 40;
  burst(cx + dir*26, cy, 4, ['#ffffff','#ffe95a'], 90, 0.22, 0);
}
function hurtPlayer(fromX){
  if (DEMO) return; // demo runs are capture takes: the bot is invulnerable (declared, same as the stride edition)
  if (P.invuln>0 || P.over || P.dead) return;
  P.hearts--;
  AU.hurt();
  burst(P.x+P.w/2, P.y+30, 10, ['#ff5a4a','#fff'], 200, 0.5);
  shake = Math.max(shake, 6);
  if (P.hearts<=0){ gameOver(); return; }
  P.state='hurt'; P.t=0; P.invuln=1.4;
  P.vx = (fromX > P.x+P.w/2) ? -190 : 70;
  P.vy = -270;
  P.thrusting = false; P.gliding = false; P.bowCharge = false;
}
function gameOver(){
  P.over = true; P.dead = true; P.state='down'; P.t=0;
  P.thrusting=false; P.bowCharge=false; P.gliding=false; P.atkKind=null;
  const d = distM();
  if (d > bestM){ bestM = d; try{ localStorage.setItem('worldhop_best_m', String(d)); }catch(e){} }
  AU.over();
}
function resetPlayerKit(){
  P.face = 1; P.score = 0; P.lastKill = null; P.kills = 0;
  P.crouching=false; P.gliding=false; P.thrusting=false;
  P.atkKind=null; P.atkT=0; P.atkCd=0; P.atkHit=new Set();

}
function resetRun(){
  // full restart from world 1 segment 0 (fresh caches: ? blocks restore)
  segCache.clear(); coins = []; enemies = []; particles = []; popups = []; coinPops = []; bumpAnims = [];
  bumpedCells.clear();
  P.x = 2*TILE; P.y = GY*TILE-86; P.vx=0; P.vy=0;
  P.hearts=3; P.coins=0; P.dead=false; P.over=false; P.state='idle'; P.invuln=1.2;
  P.safeX = P.x; P.safeY = P.y;
  resetPlayerKit();
  curSeg = 0; curWorld = 0; curCycle = 1;
  worldsVisited = [WORLDS[0].name]; transitions = [];
  if (typeof Bot !== 'undefined' && Bot.resetShow) Bot.resetShow();
  runTime = 0; camX = 0;
  for (let s=0; s<=2; s++) activateSegment(s);
  if (!NOCARD){ cardT = 2.4; cardWorld = 0; cardCycle = 1; }
}
function nextGroundX(fromX){
  // first column at/after fromX whose ground row is solid (pit respawn)
  let tx = Math.floor(fromX/TILE);
  for (let i=0;i<40;i++){ if (solidAt(tx+i, GY)) return (tx+i)*TILE + 6; }
  return fromX + 200;
}

// ============================== spectate bot (?demo=1) ==============================
// Drives the SAME IN path as human input via botIn. Per world segment it
// shows off the kit: BOW at the first ranged foe, SWORD BEAM at full
// hearts, sword stabs up close, a DOWNWARD THRUST stomp, and a FAIRY
// glide over the widest pit. Combat first, running second.
const Bot = {
  on: DEMO,
  holdJump:0, specTapT:0, atkPulseT:0, phase:null, phaseT:0, thrustTries:0,
  stuckT:0, lastX:0, glideHold:false, glideT:0, showSeg:-1, show:{},
  resetShow(){ this.show = {}; this.showSeg = -1; },
  segShow(){
    const seg = Math.floor(P.x / (SEG_TILES*TILE));
    if (seg !== this.showSeg){
      this.showSeg = seg;
      if (!this.show[seg]) this.show[seg] = { sword:0, beam:0, bow:0, thrust:0, glide:0, kills:0 };
      this.killsBase = P.kills || 0;
      this.thrustTries = 0;
    }
    const S = this.show[seg];
    S.kills = Math.max(0, (P.kills || 0) - (this.killsBase || 0));
    return S;
  },
  topAt(tx){ for (let ty=0; ty<ROWS; ty++) if (solidAt(tx,ty)) return ty; return -1; },
  nearestAhead(maxD, kinds){
    let best = null, bd = 1e9;
    for (const e of enemies){
      if (e.dead || e.mode==='dying') continue;
      if (kinds && !kinds.includes(e.mode)) continue;
      const d = e.x - (P.x + P.w);
      const dy = Math.abs((e.y + e.h) - (P.y + P.h));
      if (d > -20 && d < maxD && dy < 70 && d < bd){ bd = d; best = { e, d }; }
    }
    return best;
  },
  losRow(row, toX){
    // any solid tile on `row` between Link's front and toX?
    const fromTx = Math.floor((P.x+P.w)/TILE)+1, toTx = Math.floor(toX/TILE);
    for (let tx = fromTx; tx < toTx; tx++) if (solidAt(tx, row)) return false;
    return true;
  },
  update(dt){
    const B = botIn;
    if (!this.on) return; // bot off: never stomp botIn (tests/API drive it directly)
    B.left=0; B.right=0; B.down=0; B.up=0; B.atk=0; B.spec=0;
    if (this.holdJump > 0) this.holdJump -= dt;
    if (this.specTapT > 0) this.specTapT -= dt;
    if (this.atkPulseT > 0) this.atkPulseT -= dt;
    const S = this.segShow();
    if (P.lastKill === 'sword') S.sword = 1;
    if (P.lastKill === 'beam') S.beam = 1;
    if (P.lastKill === 'thrust') S.thrust = 1;
    if (P.lastShot === 'arrow') S.bow = 1;
    // glide continuation: keep jump held while airborne over a pit
    // (compute B.jump from explicit sources only — never self-latch)
    if (this.glideHold && !P.grounded){ this.glideT += dt; if (this.glideT > 0.30) S.glide = 1; }
    // holdJump>0 = the takeoff jump this glide was armed with is still in
    // its first frames (B.jump is computed above, one update before the
    // hazard section's trigger takes effect) — clearing here killed every
    // armed glide before Link ever left the ground.
    if (this.glideHold && P.grounded && this.holdJump <= 0){ this.glideHold = false; this.glideT = 0; }
    B.jump = (this.holdJump > 0 || (this.glideHold && !P.grounded)) ? 1 : 0;
    B.spec = this.specTapT > 0 ? 1 : 0;
    B.atk = this.atkPulseT > 0 ? 1 : 0;
    if (P.dead || P.over) { B.jump=0; B.spec=0; B.atk=0; B.right=0; return; }
    B.right = 1;
    // stuck detection + rescue FIRST: no showcase block below may starve it
    if (Math.abs(P.x - this.lastX) < 2 && P.grounded) this.stuckT += dt; else this.stuckT = 0;
    this.lastX = P.x;
    if (this.stuckT > 0.6 && P.grounded && this.holdJump <= 0){
      this.holdJump = 0.34; this.phase = null; this.glideHold = false; this.specTapT = 0; this.stuckT = 0;
    }

    // ---------- bow draw phase: hold SPECIAL ~0.32s, then release to loose ----------
    if (this.phase === 'bowDraw'){
      B.right = 0;
      this.phaseT += dt;
      B.spec = this.phaseT < 0.34 ? 1 : 0;
      if (this.phaseT >= 0.36){ this.phase = null; }
      return;
    }
    // ---------- downward-thrust showcase (once per segment) ----------
    if (!S.thrust && this.thrustTries < 3){
      if (this.phase === 'thrustJump'){
        this.phaseT += dt;
        if (P.thrusting) this.phaseSawThrust = true;
        if (!P.grounded && this.phaseT > 0.16){ B.down = 1; this.atkPulseT = 0.09; this.phase = 'thrustFall'; }
        if (P.grounded && this.phaseT > 0.1){ this.phase = null; }
        return;
      }
      if (this.phase === 'thrustFall'){
        B.down = 1;
        if (P.thrusting) this.phaseSawThrust = true;
        if (P.grounded){ this.phase = null; if (this.phaseSawThrust) this.thrustTries++; }
        return;
      }
      const foe = this.nearestAhead(215, ['walk']);
      // a wide pit just ahead belongs to the glide showcase, not the thrust
      let pitNear = false;
      const pfTx = Math.floor((P.x + P.w + 4)/TILE);
      for (let dx=0; dx<7; dx++) if (this.topAt(pfTx+dx) === -1){ pitNear = true; break; }
      if (foe && !pitNear && foe.e.vx <= 0 && foe.d > 105 && foe.d < 205 && P.grounded){
        const shellAhead = enemies.some(e => e.mode==='shell' && e.shellVx !== 0 &&
          e.x > P.x && e.x < foe.e.x + 60);
        if (!shellAhead){
          this.phase = 'thrustJump'; this.phaseT = 0; this.phaseSawThrust = false; this.holdJump = 0.25;
          return;
        }
      }
    }
    // ---------- hazards: pits (glide the wide ones) and steps ----------
    const frontTx = Math.floor((P.x + P.w + 4)/TILE);
    const myTop = this.topAt(Math.floor((P.x + P.w/2)/TILE));
    let hazard = null;
    for (let dx=0; dx<=12; dx++){
      const tx = frontTx + dx, top = this.topAt(tx);
      const distPx = tx*TILE - (P.x + P.w);
      if (top === -1){
        let w = 1; while (this.topAt(tx+w) === -1 && w < 8) w++;
        hazard = { type:'pit', dist:distPx, width:w, tx };
        break;
      }
      if (myTop !== -1 && top < myTop && solidAt(tx, myTop-1)){
        hazard = { type:'step', dist:distPx, height: myTop - top };
        break;
      }
    }
    let hazardSoon = false;
    if (hazard && P.grounded && this.holdJump <= 0 && !this.glideHold){
      const sp = Math.max(Math.abs(P.vx), 200);
      if (hazard.type === 'pit'){
        hazardSoon = hazard.dist < sp*0.5 + 60;
        if (hazard.width >= 3 && hazard.dist < sp*0.52 + 44){
          this.holdJump = 0.30; this.glideHold = true; this.glideT = 0;
        } else if (hazard.width < 3 && hazard.dist < sp*0.30 + 20){
          this.holdJump = 0.19;
        }
      } else {
        hazardSoon = hazard.dist < sp*0.5 + 60;
        if (hazard.height >= 3 && hazard.dist < sp*0.52 + 30) this.holdJump = 0.34;
        else if (hazard.height === 2 && hazard.dist < sp*0.30 + 22) this.holdJump = 0.26;
        else if (hazard.height === 1 && hazard.dist < sp*0.26 + 18) this.holdJump = 0.16;
      }
    }
    // returning shell: hop it
    for (const e of enemies){
      if (e.mode === 'shell' && e.shellVx < 0){
        const d = e.x - (P.x + P.w);
        if (d > 0 && d < 140 && P.grounded && this.holdJump <= 0) this.holdJump = 0.26;
      }
    }
    // ---------- bow showcase: first ranged foe of the segment ----------
    if (!S.bow && P.grounded && P.specCd <= 0 && !hazardSoon && !this.glideHold){
      const foe = this.nearestAhead(580, ['walk']);
      if (foe && foe.d > 270 && this.losRow(8, foe.e.x)){
        this.phase = 'bowDraw'; this.phaseT = 0; B.spec = 1; B.right = 0;
        return;
      }
    }
    // ---------- sword beam showcase: full hearts, mid-range foe, clear line ----------
    // specTapT<=0 guard is load-bearing: re-arming the tap every frame holds
    // spec forever (no release edge -> bow-charge lock, rooted bot, and the
    // return starves hazard/stuck handling below).
    if (P.hearts >= 3 && P.specCd <= 0 && P.grounded && this.specTapT <= 0){
      const foe = this.nearestAhead(470, ['walk']);
      if (foe && foe.d > 175 && this.losRow(8, foe.e.x)){
        this.specTapT = 0.055;
        return;
      }
    }
    // ---------- sword work: stab anything close on the ground ----------
    const foe = this.nearestAhead(115, ['walk']);
    if (foe && foe.d > 18 && P.grounded && P.atkCd <= 0) this.atkPulseT = 0.07;
    // point blank while the sword is still cooling down: hop to stomp instead of eating contact
    if (foe && foe.d <= 44 && P.grounded && P.atkCd > 0.02 && this.holdJump <= 0) this.holdJump = 0.18;
  }
};

// House standard: canvas.captureStream() fused with a WebAudio
// MediaStreamDestination tap on the master gain = ONE MediaRecorder
// stream, real game audio, perfectly synced. Harness pulls the blob.
window.__rec = {
  rec:null, chunks:[], dest:null, startT:0, blob:null, mime:'',
  start(){
    if (this.rec) return false;
    AU.ensure();
    if (!AU.ctx || !window.MediaRecorder) return false;
    try{
      this.dest = AU.ctx.createMediaStreamDestination();
      AU.master.connect(this.dest);
      const vs = cv.captureStream(60);
      const tracks = [...vs.getVideoTracks(), ...this.dest.stream.getAudioTracks()];
      const stream = new MediaStream(tracks);
      const opts = { videoBitsPerSecond: 6000000, audioBitsPerSecond: 128000 };
      for (const m of ['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm']){
        if (MediaRecorder.isTypeSupported(m)){ opts.mimeType = m; break; }
      }
      this.mime = opts.mimeType || 'video/webm';
      this.chunks = []; this.blob = null;
      this.rec = new MediaRecorder(stream, opts);
      this.rec.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
      this.rec.onstop = () => { this.blob = new Blob(this.chunks, { type: this.mime }); };
      this.startT = performance.now();
      this.rec.start(250);
      return true;
    }catch(e){ return false; }
  },
  stop(){
    return new Promise(res => {
      if (!this.rec){ res(null); return; }
      const rec = this.rec; this.rec = null;
      const iv = setInterval(()=>{
        if (this.blob){ clearInterval(iv);
          try{ AU.master.disconnect(this.dest); }catch(e){}
          res({ size: this.blob.size, type: this.blob.type, durMs: performance.now() - this.startT });
        }
      }, 100);
      try{ rec.stop(); }catch(e){ clearInterval(iv); res(null); }
      setTimeout(()=>{ clearInterval(iv); res(null); }, 5000);
    });
  },
  async chunkBase64(i, size){
    if (!this.blob) return null;
    const buf = await this.blob.slice(i*size, Math.min(this.blob.size, (i+1)*size)).arrayBuffer();
    const u8 = new Uint8Array(buf);
    let s = '';
    for (let k=0;k<u8.length;k+=8192) s += String.fromCharCode.apply(null, u8.subarray(k, k+8192));
    return btoa(s);
  }
};

// ============================== update ==============================
let prevIn = { jump:false, atk:false, spec:false };
let fallV = 0; // vertical speed captured before this frame's move (for stomp tests)
function update(dt){
  time += dt;
  Bot.update(dt);
  P.t += dt;
  if (P.invuln>0) P.invuln-=dt;
  if (P.coyote>0) P.coyote-=dt;
  if (P.jbuf>0) P.jbuf-=dt;
  if (P.atkCd>0) P.atkCd-=dt;
  if (P.specCd>0) P.specCd-=dt;
  if (cardT>0) cardT-=dt;
  if (!P.dead && !P.over && started) runTime += dt;

  const jEdge = IN.jump && !prevIn.jump, jRel = !IN.jump && prevIn.jump;
  const aEdge = IN.atk && !prevIn.atk;
  const sEdge = IN.spec && !prevIn.spec, sRel = !IN.spec && prevIn.spec;
  prevIn = { jump: IN.jump, atk: IN.atk, spec: IN.spec };
  if (IN.left || IN.right || IN.jump || IN.atk || IN.spec || IN.down || IN.up) started = true;
  if (P.over && (jEdge || aEdge || sEdge)){ resetRun(); }

  // keep segments ahead activated; cull what's far behind
  const aheadSeg = Math.floor((P.x + VW + 500) / (SEG_TILES*TILE));
  activateSegment(aheadSeg);
  activateSegment(aheadSeg + 1);
  coins = coins.filter(c => !c.taken && c.x > camX - 400);
  enemies = enemies.filter(e => !e.dead && e.x > camX - 700);

  // ---- world transitions ----
  const segNow = Math.floor(P.x / (SEG_TILES*TILE));
  if (segNow !== curSeg){
    curSeg = segNow;
    const w = segWorld(segNow), c = segCycle(segNow);
    if (w !== curWorld || c !== curCycle){
      curWorld = w; curCycle = c; cardWorld = w; cardCycle = c;
      if (!NOCARD) cardT = 2.4;
      transitions.push({ seg: segNow, world: w, name: WORLDS[w].name, cycle: c, tAbs: performance.now() });
      if (!worldsVisited.includes(WORLDS[w].name)) worldsVisited.push(WORLDS[w].name);
      AU.fanfare();
      burst(P.x + P.w/2, P.y + 20, 22, ['#ffe95a','#7ee787','#9adcff','#ffffff'], 300, 0.8, 260);
    }
  }

  // ---------- facing & crouch ----------
  const dir = (IN.right?1:0) - (IN.left?1:0);
  if (dir !== 0 && !P.bowCharge) P.face = dir;
  P.crouching = IN.down && P.grounded && !P.bowCharge && !P.dead && !P.over;

  // ---------- jump ----------
  if (jEdge && !P.dead && !P.over) P.jbuf = 0.12;
  if (P.jbuf > 0 && (P.grounded || P.coyote > 0) && !P.crouching && !P.dead && !P.over){
    P.vy = -JUMP_V; P.grounded = false; P.coyote = 0; P.jbuf = 0; P.gliding = false;
    AU.jump();
    burst(P.x+P.w/2, P.y+P.h, 6, ['#ffffff','#d8cfb0'], 90, 0.28, 200);
  }
  if (jRel && P.vy < -330 && !P.gliding) P.vy = -330; // variable jump height
  // ---------- glide (FAIRY form): hold jump while falling ----------
  if (P.grounded) { P.gliding = false; P.thrusting = false; }
  const wantGlide = IN.jump && !P.grounded && P.vy > 30 && !P.thrusting && !P.bowCharge && !P.dead && !P.over;
  if (wantGlide && !P.gliding){ P.gliding = true; AU.glide(); }
  if (!IN.jump) P.gliding = false;
  if (P.gliding){
    const drift = dir !== 0 ? dir*175 : P.face*140;
    P.vx += Math.max(-620*dt, Math.min(620*dt, drift - P.vx));
    if (Math.random() < 0.55) sparkle(P.x + P.w/2, P.y + P.h - 30);
  }
  // ---------- sword ----------
  if (aEdge && P.atkCd <= 0 && !P.bowCharge && !P.dead && !P.over){
    if (IN.up) startAttack('up');
    else if (!P.grounded && IN.down){ P.thrusting = true; P.gliding = false; P.atkCd = 0.30; AU.swing(); }
    else if (IN.down) startAttack('low');
    else startAttack('stab');
  }
  if (P.atkKind){ P.atkT += dt; if (P.atkT > 0.22){ P.atkKind = null; P.atkT = 0; } }
  // ---------- special: tap = beam/fireball, hold = bow ----------
  if (sEdge && !P.dead && !P.over){ P.specHeld = true; P.specT = 0; }
  if (P.specHeld && IN.spec){
    P.specT += dt;
    if (P.specT >= 0.25 && !P.bowCharge && P.specCd <= 0){ P.bowCharge = true; AU.bowDraw(); }
  }
  if (sRel){
    if (P.bowCharge){ fireProjectile('arrow'); P.specCd = 0.25; }
    else if (P.specHeld && P.specT < 0.25 && P.specCd <= 0 && !P.dead && !P.over){
      if (P.hearts >= 3){ fireProjectile('beam'); P.specCd = 0.30; }
      else { fireProjectile('fire'); P.specCd = 0.45; }
    }
    P.bowCharge = false; P.specHeld = false; P.specT = 0;
  }
  // ---------- horizontal movement (joystick = run speed) ----------
  const rooted = (P.bowCharge && P.grounded) || P.crouching || P.dead || P.over;
  let target = 0;
  if (!rooted && !P.gliding) target = dir * maxRun();
  if (P.gliding) target = P.vx; // glide steers vx directly above
  const rate = P.grounded ? (target !== 0 ? 2500 : 3100) : 1600;
  if (!P.gliding) P.vx += Math.max(-rate*dt, Math.min(rate*dt, target - P.vx));
  if (P.grounded) P.dist += Math.abs(P.vx)*dt;
  // ---------- gravity + move ----------
  const wasGrounded = P.grounded;
  fallV = P.vy;
  P.vy += GRAV*dt; if (P.vy > 1150) P.vy = 1150;
  if (P.gliding && P.vy > 58) P.vy = 58;
  moveBody(P, dt, true);
  if (P.grounded){
    P.coyote = 0.09;
    if (!wasGrounded && fallV > 430) burst(P.x+P.w/2, P.y+P.h, 7, ['#fff','#d8cfb0'], 100, 0.3, 200);
    const txC = Math.floor((P.x+P.w/2)/TILE);
    if (solidAt(txC, GY) && solidAt(txC-1, GY) && solidAt(txC+1, GY)){ P.safeX = P.x; P.safeY = P.y; }
  }
  // state label
  if (!P.dead && !P.over && P.state !== 'hurt'){
    if (P.gliding) P.state = 'glide';
    else if (P.bowCharge) P.state = 'bow';
    else if (P.atkKind) P.state = 'atk';
    else if (P.crouching) P.state = 'crouch';
    else if (!P.grounded) P.state = 'air';
    else if (Math.abs(P.vx) > 15) P.state = 'walk';
    else P.state = 'idle';
  }
  if (P.state==='hurt' && P.t>0.45) P.state='idle';
  // ---------- pit fall: -1 heart, respawn on the NEXT ground ----------
  if (P.y > ROWS*TILE + 60 && !P.dead && !P.over){
    if (DEMO){
      P.x = nextGroundX(P.x + P.w); P.y = GY*TILE - P.h - 2; P.vx = 320; P.vy = 0;
      P.thrusting=false; P.gliding=false; P.bowCharge=false;
    } else {
      P.hearts--;
      AU.hurt(); shake = Math.max(shake,5);
      if (P.hearts<=0){ P.y = ROWS*TILE + 400; gameOver(); }
      else {
        P.x = nextGroundX(P.x + P.w); P.y = GY*TILE - P.h - 2;
        P.vx = 300; P.vy = 0; P.invuln = 1.5;
        P.thrusting=false; P.gliding=false; P.bowCharge=false;
        P.safeX = P.x; P.safeY = P.y;
      }
    }
  }
  // ---------- rupees ----------
  for (const c of coins){ if(!c.taken && aabb(P, c)){ c.taken=true; P.coins++; addScore(100, c.x, c.y-6);
    AU.coin(); burst(c.x+16, c.y+16, 6, ['#ffd75a','#fff3a0'], 110, 0.35, 0); } }
  for (const cp of coinPops){ cp.t += dt; cp.y -= 150*dt; }
  coinPops = coinPops.filter(cp=>cp.t<0.38);
  for (const b of bumpAnims) b.t += dt;
  bumpAnims = bumpAnims.filter(b=>b.t<0.22);

  // ---------- sword hitbox ----------
  if (P.atkKind && P.atkT <= 0.22){
    const box = attackBox();
    if (box) for (const e of enemies){
      if (e.dead || e.mode==='dying' || P.atkHit.has(e)) continue;
      if (aabb(box, e)){ P.atkHit.add(e); P.lastKill = 'sword'; swordHit(e); }
    }
  }
  // ---------- projectiles ----------
  for (const pr of projectiles){
    pr.t += dt; pr.vy += pr.grav*dt; pr.x += pr.vx*dt; pr.y += pr.vy*dt;
    const pcx = Math.floor((pr.x + pr.w/2)/TILE), pcy = Math.floor((pr.y + pr.h/2)/TILE);
    if (solidAt(pcx, pcy)){ pr.dead = true; burst(pr.x+pr.w/2, pr.y+pr.h/2, 6, ['#fff','#ffd75a'], 120, 0.3, 0); continue; }
    for (const e of enemies){
      if (e.dead || e.mode==='dying') continue;
      if (aabb(pr, e)){ P.lastKill = pr.kind; projHit(pr, e); pr.dead = true; break; }
    }
    if (pr.t > pr.life || pr.x < camX - 500 || pr.x > camX + VW + 500 || pr.y > ROWS*TILE + 80) pr.dead = true;
  }
  projectiles = projectiles.filter(p=>!p.dead);

  // ---------- enemies ----------
  for (const e of enemies){
    if (e.dead) continue;
    if (Math.abs(e.x - P.x) > 1500 && e.mode !== 'shell') continue;
    e.t += dt;
    if (e.mode==='dying'){ e.dying+=dt; if (e.kind!=='goomba'){ e.vy += GRAV*dt; e.y += e.vy*dt; } if (e.dying>0.45) e.dead=true; continue; }
    if (e.mode==='shell'){
      if (e.shellVx!==0){
        e.vx = e.shellVx;
        const oldVx = e.vx;
        e.vy += GRAV*dt;
        moveBody(e, dt, false);
        if (e.vx===0 && oldVx!==0) e.shellVx = -oldVx;
        for (const o of enemies){ if (o!==e && !o.dead && o.mode==='walk' && aabb(e,o)){ killEnemy(o, 200); P.lastKill='shell'; AU.stomp(); } }
        if (aabb(P,e) && P.invuln<=0 && !P.dead && !P.over){
          const stomp = (fallV>60 || P.vy>60) && (P.y+P.h) - e.y < (P.thrusting ? 36 : 20);
          if (stomp){ e.shellVx=0; P.vy=-520; AU.stomp(); }
          else hurtPlayer(e.x+e.w/2);
        }
      } else {
        e.vy += GRAV*dt; moveBody(e, dt, false);
        if (aabb(P,e) && P.invuln<=0 && !P.dead && !P.over){
          const stomp = (fallV>60 || P.vy>60) && (P.y+P.h) - e.y < (P.thrusting ? 36 : 20);
          if (stomp){ P.vy=-520; kickShell(e, (e.x+e.w/2 >= P.x+P.w/2) ? 1 : -1); }
          else if (P.grounded){ kickShell(e, (e.x+e.w/2 >= P.x+P.w/2) ? 1 : -1); }
        }
      }
      continue;
    }
    // walk mode
    e.vy += GRAV*dt;
    const oldVx = e.vx;
    moveBody(e, dt, false);
    if (e.vx===0 && oldVx!==0) e.vx = -oldVx;
    if (e.y > ROWS*TILE+60){ e.dead=true; continue; }
    if (aabb(P,e) && !P.dead && !P.over){
      const falling = fallV>60 || P.vy>60;
      // a sword-first dive connects from higher up than a boot stomp (frame-step safe)
      const stomp = falling && (P.y+P.h) - e.y < (P.thrusting ? 42 : 22);
      if (stomp){
        if (P.thrusting){
          P.lastKill = 'thrust';
          if (e.kind==='koopa'){ toShell(e); addScore(150, e.x, e.y-10); }
          else killEnemy(e, 150);
          AU.stomp(); P.vy = -565; P.thrusting = false;
        } else {
          P.lastKill = 'stomp';
          if (e.kind==='koopa'){ toShell(e); addScore(100, e.x, e.y-10); AU.stomp(); }
          else killEnemy(e, 100);
          P.vy = -505;
        }
      }
      else if (P.invuln<=0) hurtPlayer(e.x+e.w/2);
    }
  }

  // ---------- particles / popups / camera ----------
  for (const pt of particles){ pt.t+=dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=pt.grav*dt; }
  particles = particles.filter(p=>p.t<p.life);
  for (const pp of popups){ pp.t+=dt; pp.y -= 34*dt; }
  popups = popups.filter(p=>p.t<0.9);
  if (shake>0) shake = Math.max(0, shake - dt*14);
  const camTarget = Math.max(0, P.x + P.w/2 - VW*0.40);
  camX += (camTarget - camX) * Math.min(1, dt*7);

  window.__dbg = { x: Math.round(P.x), y: Math.round(P.y), speed: Math.round(Math.abs(P.vx)),
    coins: P.coins, hearts: P.hearts, over: P.over, time: Math.round(runTime*10)/10,
    state: P.state, face: P.face, gliding: P.gliding, thrusting: P.thrusting,
    bow: P.bowCharge, atk: P.atkKind, lastKill: P.lastKill || null, projs: projectiles.length,
    world: curWorld+1, worldName: WORLDS[curWorld].name, cycle: curCycle,
    dist: distM(), score: scoreNow(), card: cardT>0,
    segShow: (typeof Bot !== 'undefined' && Bot.show) ? Bot.show[Math.floor(P.x/(SEG_TILES*TILE))] || null : null };
}

function hexLerp(a, b, f){
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  return 'rgb(' + pa.map((v,i)=>Math.round(v + (pb[i]-v)*f)).join(',') + ')';
}
function fadeFactor(){
  // 0..1 blend toward the NEXT world across ~1 screen width of travel
  // centered on the segment boundary.
  const BX = (curSeg+1)*SEG_TILES*TILE;
  const half = VW*0.55;
  return Math.max(0, Math.min(1, (P.x - (BX - half)) / (2*half)));

    ctx.fillStyle = '#ffd75a'; ctx.beginPath(); ctx.arc(9, -148, 6, 0, 6.29); ctx.arc(87, -148, 6, 0, 6.29); ctx.fill();
  } else if (style==='rocket'){
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath(); ctx.moveTo(30, -30); ctx.lineTo(30, -96); ctx.quadraticCurveTo(48, -132, 66, -96); ctx.lineTo(66, -30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5a4a'; ctx.beginPath(); ctx.moveTo(30, -96); ctx.quadraticCurveTo(48, -132, 66, -96); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#57b6ff'; ctx.beginPath(); ctx.arc(48, -78, 9, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ff5a4a'; ctx.fillRect(22, -44, 10, 26); ctx.fillRect(64, -44, 10, 26);
    ctx.fillStyle = '#8a8a9a'; ctx.fillRect(14, -6, 68, 6);
    ctx.fillStyle = '#ffd75a'; ctx.beginPath(); ctx.moveTo(40, -18); ctx.lineTo(48, 2); ctx.lineTo(56, -18); ctx.closePath(); ctx.fill();
  } else if (style==='iron'){
    ctx.fillStyle = '#23232e'; ctx.fillRect(0, -128, 10, 128); ctx.fillRect(86, -128, 10, 128);
    for (let i=0;i<6;i++){ const bx = 16 + i*13; ctx.fillRect(bx, -104, 4, 104);
      ctx.beginPath(); ctx.moveTo(bx-2, -104); ctx.lineTo(bx+2, -116); ctx.lineTo(bx+6, -104); ctx.closePath(); ctx.fill(); }
    ctx.fillRect(12, -92, 72, 5); ctx.fillRect(12, -30, 72, 5);
    ctx.fillStyle = '#3d3d4d'; ctx.beginPath(); ctx.arc(5, -134, 6, 0, 6.29); ctx.arc(91, -134, 6, 0, 6.29); ctx.fill();
  }
  ctx.restore();
}
// ---- player sprites (LINK UNLEASHED): native frames, facing flip ----
function drawFrame(img, cx, feetY, frac){
  if (!img || !img.complete || !img.width) return;
  const w = img.width, h = img.height;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(feetY));
  if (P.face < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, -w*(frac===undefined?0.5:frac), -h, w, h);
  ctx.restore();
}
function drawBow(cx, feetY){
  // Composite weapon: the Zelda II sheet has no bow frames, so the bow is
  // drawn in code over the extended stab pose (arm out = holding the bow).
  const hx = cx + P.face*36, hy = feetY - 56;
  ctx.save();
  ctx.strokeStyle = '#7a4a21'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy - 27);
  ctx.quadraticCurveTo(hx + P.face*17, hy, hx, hy + 27);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(hx, hy - 27); ctx.lineTo(hx, hy + 27); ctx.stroke();
  if (P.specT > 0.34){ // arrow nocked once the draw settles
    ctx.strokeStyle = '#d8b25a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx - P.face*20, hy); ctx.lineTo(hx + P.face*22, hy); ctx.stroke();
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath();
    ctx.moveTo(hx + P.face*30, hy); ctx.lineTo(hx + P.face*19, hy - 4.5); ctx.lineTo(hx + P.face*19, hy + 4.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5a4a';
    ctx.beginPath();
    ctx.moveTo(hx - P.face*20, hy); ctx.lineTo(hx - P.face*26, hy - 5); ctx.lineTo(hx - P.face*24, hy); ctx.lineTo(hx - P.face*26, hy + 5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function linkFrame(){
  if (P.dead || P.state==='down') return { img: IMG.link_hurt_0, frac: 0.5 };
  if (P.state==='hurt') return { img: IMG.link_hurt_0, frac: 0.5 };
  if (P.state==='glide') return { img: IMG['link_fairy_'+(Math.floor(time*9)%2)], frac: 0.5, fairy: true };
  if (P.state==='bow') return { img: IMG.link_stab_0, frac: 0.28 };
  if (P.atkKind==='stab') return { img: IMG.link_stab_0, frac: 0.28 };
  if (P.atkKind==='low') return { img: IMG.link_stab_low_0, frac: 0.28 };
  if (P.atkKind==='up') return { img: IMG.link_thrust_up_0, frac: 0.5 };
  if (P.thrusting) return { img: IMG.link_thrust_0, frac: 0.5 };
  if (P.state==='crouch') return { img: IMG.link_crouch_0, frac: 0.5 };
  if (P.state==='air') return { img: P.vy < 0 ? IMG.link_jump_rise_0 : IMG.link_jump_fall_0, frac: 0.5 };
  if (P.state==='walk') return { img: IMG['link_walk_'+(Math.floor(P.dist/30)%3)], frac: 0.5 };
  return { img: IMG.link_idle_0, frac: 0.5 };
}
function bumpOffset(tx,ty){ for (const b of bumpAnims) if (b.tx===tx&&b.ty===ty) return -Math.sin((b.t/0.22)*Math.PI)*9; return 0; }

function render(){
  const DY = VH - 576;
  const f = fadeFactor();
  const nextW = segWorld(curSeg+1);
  const wDef = WORLDS[curWorld], nDef = WORLDS[nextW];
  const grad = ctx.createLinearGradient(0,0,0,cv.height);
  grad.addColorStop(0, f>0 ? hexLerp(wDef.sky[0], nDef.sky[0], f) : wDef.sky[0]);
  grad.addColorStop(1, f>0 ? hexLerp(wDef.sky[1], nDef.sky[1], f) : wDef.sky[1]);
  ctx.fillStyle = grad; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.scale(SCALE, SCALE);
  const shX = shake ? (Math.random()-0.5)*shake : 0, shY = shake ? (Math.random()-0.5)*shake : 0;
  ctx.translate(shX, shY + DY);
  // background strips with crossfade into the next world
  drawBG(curWorld, 1);
  if (f > 0) drawBG(nextW, f);

  ctx.save(); ctx.translate(-Math.round(camX), 0);
  // doorway at the end of the CURRENT segment (outgoing world's style)
  drawDoor(wDef.door, (curSeg+1)*SEG_TILES*TILE - 3*TILE - 8);
  // tiles
  const tx0 = Math.max(0, Math.floor(camX/TILE)-1), tx1 = Math.floor((camX+VW)/TILE)+1;
  for (let ty=0; ty<ROWS; ty++) for (let tx=tx0; tx<=tx1; tx++){
    const c = tileAt(tx,ty); if (c===' ') continue;
    const dx = tx*TILE, dy = ty*TILE + (c==='?'||c==='B'||c==='U' ? bumpOffset(tx,ty) : 0);
    let img = null, wide = false;
    if (c==='#'){
      const wi = segWorld(Math.floor(tx/SEG_TILES));
      img = solidAt(tx,ty-1) ? IMG['w'+wi+'_fill'] : IMG['w'+wi+'_top'];
    }
    else if (c==='?') img = IMG['qblock_'+(Math.floor(time*3)%3)];
    else if (c==='U') img = IMG.used;
    else if (c==='B') img = IMG.brick;
    else if (c==='X'){ const wi = segWorld(Math.floor(tx/SEG_TILES)); img = IMG['w'+wi+'_fill']; }
    else if (c==='['){ const wi = segWorld(Math.floor(tx/SEG_TILES)); img = IMG['w'+wi+'_obst']; wide = true; }
    else if (c==='{'){ const wi = segWorld(Math.floor(tx/SEG_TILES)); img = IMG['w'+wi+'_obstb']; wide = true; }
    if (img && img.complete && img.width) ctx.drawImage(img, dx, dy, wide ? TILE*2 : TILE, TILE);
    else if (img){ ctx.fillStyle = '#888'; ctx.fillRect(dx, dy, wide?TILE*2:TILE, TILE); }
  }
  // coins (rupees)
  for (const c of coins){ if (c.taken) continue;
    if (c.x < camX-60 || c.x > camX+VW+60) continue;
    const fr = ((Math.floor(time*7 + c.ph)%3)+3)%3;
    const bob = Math.sin(time*3 + c.ph)*2;
    const rim = IMG['rupee_'+fr];
    if (rim && rim.complete) ctx.drawImage(rim, c.x+6, c.y+bob, 36, 36);
  }
  for (const cp of coinPops) if (IMG.rupee_0.complete) ctx.drawImage(IMG.rupee_0, cp.x, cp.y, 32, 32);
  // enemies (tinted per current world of the enemy)
  for (const e of enemies){
    if (e.dead) continue;
    if (e.x < camX-90 || e.x > camX+VW+90) continue;
    const wi = worldOfX(e.x);
    const cx = e.x + e.w/2, feet = e.y + e.h;
    let name;
    if (e.mode==='dying' && e.kind==='goomba') name = 'goomba_flat';
    else if (e.mode==='shell') name = 'shell';
    else if (e.kind==='goomba') name = 'goomba_'+(Math.floor(e.t*6)%2);
    else name = 'koopa_'+(Math.floor(e.t*5)%2);
    const img = enemyImg(wi, name);
    const dw = e.mode==='shell' ? 42 : (e.kind==='koopa' ? 40 : 42);
    const dh = e.mode==='shell' ? 34 : (e.kind==='koopa' ? 72 : 42);
    ctx.save();
    if (e.mode==='dying' && e.kind!=='goomba'){ ctx.translate(cx, feet-10); ctx.rotate(Math.PI); ctx.translate(-cx, -(feet-10));
      ctx.globalAlpha = Math.max(0, 1 - e.dying*1.4); }
    const flip = e.mode==='walk' && e.vx>0;
    ctx.translate(cx, feet); if (flip) ctx.scale(-1,1);
    if (img) ctx.drawImage(img, -dw/2, -dh, dw, dh);
    ctx.restore();
  }
  // projectiles (LINK UNLEASHED)
  for (const pr of projectiles){
    const pcx = pr.x + pr.w/2, pcy = pr.y + pr.h/2;
    if (pr.kind==='beam'){
      const img = IMG['proj_beam_'+(Math.floor(time*14)%2)];
      if (img && img.complete){ ctx.save(); ctx.translate(pcx, pcy); if (pr.vx<0) ctx.scale(-1,1);
        ctx.drawImage(img, -24, -12, 48, 24); ctx.restore(); }
    } else if (pr.kind==='fire'){
      const img = IMG['proj_fire_'+(Math.floor(time*12)%2)];
      if (img && img.complete){ ctx.save(); ctx.translate(pcx, pcy); ctx.rotate(time*9*(pr.vx>0?1:-1));
        ctx.drawImage(img, -18, -18, 36, 36); ctx.restore(); }
    } else if (pr.kind==='arrow'){
      ctx.save(); ctx.translate(pcx, pcy); ctx.rotate(Math.atan2(pr.vy, pr.vx));
      ctx.strokeStyle = '#d8b25a'; ctx.lineWidth = 3.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(18, 0); ctx.stroke();
      ctx.fillStyle = '#e8e8f0';
      ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(16, -5); ctx.lineTo(16, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff5a4a';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-33, -6); ctx.lineTo(-30, 0); ctx.lineTo(-33, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // player
  if (!(P.invuln>0 && Math.floor(time*14)%2===0) || P.over){
    const fr = linkFrame();
    const pcx = P.x + P.w/2;
    if (fr.fairy){
      const bob = Math.sin(time*7)*3;
      drawFrame(fr.img, pcx, P.y + P.h - 18 + bob, fr.frac);
    } else {
      drawFrame(fr.img, pcx, P.y + P.h, fr.frac);
    }
    if (P.state==='bow') drawBow(pcx, P.y + P.h);
  }
  // bow-charge meter
  if (P.bowCharge){
    const bw = 54, bx = P.x + P.w/2 - bw/2, by = P.y - 20;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(bx-2, by-2, bw+4, 10);
    ctx.fillStyle = P.specT > 0.34 ? '#ffe95a' : '#9adcff';
    ctx.fillRect(bx, by, bw * Math.min(1, P.specT/0.5), 6);
  }
  for (const pt of particles){ ctx.globalAlpha = Math.max(0, 1 - pt.t/pt.life); ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size); }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 17px monospace'; ctx.textAlign = 'center';
  for (const pp of popups){ ctx.globalAlpha = Math.max(0, 1 - pp.t/0.9); ctx.fillStyle = '#3a2400';
    ctx.fillText(pp.txt, pp.x+1, pp.y+1); ctx.fillStyle = pp.col; ctx.fillText(pp.txt, pp.x, pp.y); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore(); // world
  ctx.restore(); // view

  // ================= HUD (screen space, slim) =================
  const W = cv.width, H = cv.height;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0,0,W,44);
  ctx.font = 'bold 20px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + String(scoreNow()).padStart(6,'0'), 16, 29);
  const coinX = Math.min(300, W*0.32);
  if (IMG.rupee_0.complete) ctx.drawImage(IMG.rupee_0, coinX, 8, 26, 26);
  ctx.fillText('× ' + String(P.coins).padStart(2,'0'), coinX+32, 29);
  ctx.fillText(distM() + 'm', Math.min(480, W*0.52), 29);
  const mm = Math.floor(runTime/60), ss = (runTime%60);
  ctx.fillText(mm + ':' + (ss<10?'0':'') + ss.toFixed(1), Math.min(620, W*0.66), 29);
  for (let i=0;i<3;i++){
    const hx = W-120 + i*38, hy = 12;
    ctx.fillStyle = i < P.hearts ? '#ff4757' : 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(hx+11, hy+20);
    ctx.bezierCurveTo(hx-6, hy+6, hx+2, hy-6, hx+11, hy+4);
    ctx.bezierCurveTo(hx+20, hy-6, hx+28, hy+6, hx+11, hy+20);
    ctx.fill();
  }
  if (P.hearts>=3 && !P.over && !P.dead){
    ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#9adcff'; ctx.textAlign = 'right';
    ctx.fillText('⚡ SWORD BEAM READY', W-14, 58);
    ctx.textAlign = 'left';
  }
  // current world label, bottom-left pill
  ctx.font = 'bold 15px monospace';
  const wlabel = 'W' + (curWorld+1) + ' · ' + WORLDS[curWorld].name + (curCycle>1 ? ' · CYCLE ' + curCycle : '');
  const wlw = ctx.measureText(wlabel).width + 22;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(10, H-34, wlw, 24);
  ctx.fillStyle = '#ffe95a'; ctx.fillText(wlabel, 21, H-17);
  if (!started && !DEMO){
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, H/2-118, W, 226);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe95a'; ctx.font = 'bold 44px monospace';
    ctx.fillText('WORLDHOP! ACTION', W/2, H/2-64);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 17px monospace';
    ctx.fillText('Link UNLEASHED in an endless 10-world run — sword, beam, bow, and fairy glide', W/2, H/2-32);
    ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#cfe3ff';
    ctx.fillText('MOVE: floating stick / arrows · JUMP: Space or button — hold JUMP in air to glide as the FAIRY', W/2, H/2+6);
    ctx.fillText('SWORD (J): stab · ↓+J low stab · ↑+J upward thrust · ↓+J in air = DOWNWARD THRUST', W/2, H/2+32);
    ctx.fillText('SPECIAL (K): tap = sword beam at full hearts, fireball below · hold = BOW & ARROW', W/2, H/2+58);
    ctx.fillStyle = '#ffe95a'; ctx.font = 'bold 15px monospace';
    ctx.fillText('Fight through all 10 worlds — then they loop, faster. How far can Link get?', W/2, H/2+88);
    ctx.textAlign = 'left';
  }
  // ================= world name card =================
  if (cardT > 0){
    const total = 2.4, el = total - cardT;
    const aIn = Math.min(1, el/0.16), aOut = Math.min(1, cardT/0.45);
    const alpha = Math.min(aIn, aOut);
    const pop = el < 0.28 ? (0.7 + 0.3*(el/0.28)) + Math.sin((el/0.28)*Math.PI)*0.06 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W/2, H*0.30); ctx.scale(pop, pop);
    const cw = 620, chh = 148;
    ctx.fillStyle = 'rgba(10,10,28,0.85)'; ctx.fillRect(-cw/2, -chh/2, cw, chh);
    ctx.strokeStyle = '#ffd75a'; ctx.lineWidth = 4; ctx.strokeRect(-cw/2, -chh/2, cw, chh);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#9adcff'; ctx.font = 'bold 21px monospace';
    ctx.fillText('— WORLD ' + (cardWorld+1) + (cardCycle>1 ? ' · CYCLE ' + cardCycle : '') + ' —', 0, -42);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 46px monospace';
    ctx.fillText(WORLDS[cardWorld].name, 0, 10);
    ctx.fillStyle = '#ffd75a'; ctx.font = 'bold 19px monospace';
    ctx.fillText(WORLDS[cardWorld].game, 0, 46);
    ctx.restore();
    ctx.textAlign = 'left';
  }
  // ================= game over =================
  if (P.over){
    ctx.fillStyle = 'rgba(6,6,18,0.62)'; ctx.fillRect(0,0,W,H);
    const cw = Math.min(680, W-30), chh = 330;
    const cx0 = W/2 - cw/2, cy0 = H/2 - chh/2;
    ctx.fillStyle = 'rgba(12,12,30,0.92)'; ctx.fillRect(cx0, cy0, cw, chh);
    ctx.strokeStyle = '#ff5a4a'; ctx.lineWidth = 4; ctx.strokeRect(cx0, cy0, cw, chh);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5a4a'; ctx.font = 'bold 46px monospace';
    ctx.fillText('GAME OVER', W/2, cy0 + 62);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
    ctx.fillText('DISTANCE  ' + distM() + ' m', W/2, cy0 + 108);
    ctx.font = 'bold 19px monospace'; ctx.fillStyle = '#ffe95a';
    ctx.fillText('Rupees ' + P.coins + ' · Score ' + scoreNow() + ' · Best ' + bestM + ' m' + (distM()>=bestM && distM()>0 ? '  ★ NEW BEST!' : ''), W/2, cy0 + 142);
    ctx.fillStyle = '#9adcff'; ctx.font = 'bold 16px monospace';
    ctx.fillText('WORLDS VISITED', W/2, cy0 + 180);
    ctx.fillStyle = '#fff'; ctx.font = '15px monospace';
    const list = worldsVisited.join('  ·  ');
    const maxW = cw - 40; let line = '', ly = cy0 + 206;
    for (const word of list.split(' ')){
      if (ctx.measureText(line + ' ' + word).width > maxW){ ctx.fillText(line, W/2, ly); ly += 22; line = word; }
      else line = line ? line + ' ' + word : word;
    }
    if (line) ctx.fillText(line, W/2, ly);
    ctx.fillStyle = '#7ee787'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Press JUMP, SWORD or SPECIAL to run it again', W/2, cy0 + chh - 22);
    ctx.textAlign = 'left';
  }
}

// ============================== loop ==============================
let last = performance.now(), tintsTried = false;
function frame(now){
  let dt = Math.min(0.033, (now-last)/1000); last = now;
  fpsCount++;
  if (!tintsTried && IMG.goomba_0.complete && IMG.koopa_0.complete){ buildTints(); tintsTried = true; }
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { P, enemies: ()=>enemies, projectiles: ()=>projectiles, IN, botIn, Bot, resetRun };
window.__hop = {
  transitions: ()=>transitions.slice(),
  visited: ()=>worldsVisited.slice(),
  card: ()=>({ active: cardT>0, world: cardWorld+1, name: WORLDS[cardWorld].name }),
  showcases: ()=>JSON.parse(JSON.stringify(Bot.show)),
  state: ()=>({ world: curWorld+1, name: WORLDS[curWorld].name, cycle: curCycle, dist: distM(), over: P.over })
};
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
