<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>TOPPLE: VICE × HYRULE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140826;
      touch-action: none;
      font-family: 'Impact', 'Arial Black', system-ui, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script>if (!window.Matter) { document.write('<script src="./matter.min.js"><\/script>'); }</script>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game-canvas" width="540" height="960"></canvas>
  </div>

  <script type="module">
    const W = 540;
    const H = 960;
    const GROUND_Y = 826;
    const FIXED_DT = 1000 / 60;
    const DEFAULT_SEED = 19860221;

    // -------------------------------------------------------------------------
    // Small deterministic RNG (mulberry32) — same seed + same inputs, same run.
    // -------------------------------------------------------------------------
    class SeededRNG {
      constructor(seed = 1) { this.reset(seed); }
      reset(seed) { this.state = (seed >>> 0) || 1; }
      next() {
        this.state = (this.state + 0x6D2B79F5) >>> 0;
        let t = this.state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      range(min, max) { return min + this.next() * (max - min); }
      int(min, max) { return Math.floor(this.range(min, max + 1)); }
      pick(arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; }
    }

    // -------------------------------------------------------------------------
    // Procedural WebAudio Synthesizer (real live game audio + MediaStream output)
    // Uses its own local LCG for noise buffer so it never touches simulation RNG.
    // -------------------------------------------------------------------------
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.dest = null;
        this.noiseBuffer = null;
        this.bedStarted = false;
        this.muted = false;
        this._alarmCount = 0;
        this._lastSfxTick = {};
      }

      _initNoise(ctx) {
        const len = ctx.sampleRate * 1.5;
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        let s = 1337420;
        for (let i = 0; i < len; i++) {
          s = (Math.imul(1664525, s) + 1013904223) >>> 0;
          data[i] = (s / 2147483648) - 1;
        }
        return buf;
      }

      async ensureStarted() {
        if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return null;
        if (!this.ctx) {
          try {
            if (typeof navigator !== 'undefined' && navigator.audioSession) {
              navigator.audioSession.type = 'playback'; // iOS 17+: stay audible with the silent switch on
            }
          } catch {}
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.72;
          this.dest = this.ctx.createMediaStreamDestination();
          this.master.connect(this.ctx.destination);
          this.master.connect(this.dest);
          this.noiseBuffer = this._initNoise(this.ctx);
          // 1-sample silent buffer inside the first gesture primes iOS WebAudio.
          try {
            const silent = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
            const src = this.ctx.createBufferSource();
            src.buffer = silent;
            src.connect(this.master);
            src.start();
          } catch {}
        }
        if (this.ctx.state === 'suspended') {
          try { await this.ctx.resume(); } catch {}
        }
        return this.ctx;
      }

      async getMediaStream() {
        await this.ensureStarted();
        return this.dest ? this.dest.stream : null;
      }

      startBed() {
        if (this.bedStarted || !this.ctx) return;
        this.bedStarted = true;
        const ctx = this.ctx;

        // Golden-hour ocean surf hiss (filtered continuous noise so MediaRecorder stream stays hot)
        const surf = ctx.createBufferSource();
        surf.buffer = this.noiseBuffer;
        surf.loop = true;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 340;
        const surfGain = ctx.createGain();
        surfGain.gain.value = 0.055;
        surf.connect(lp);
        lp.connect(surfGain);
        surfGain.connect(this.master);
        surf.start();

        // Subtle Vice synthwave bass drone (D2 + A2 warm pulse)
        const bass = ctx.createOscillator();
        bass.type = 'sawtooth';
        bass.frequency.value = 73.42;
        const bassLp = ctx.createBiquadFilter();
        bassLp.type = 'lowpass';
        bassLp.frequency.value = 210;
        const bassGain = ctx.createGain();
        bassGain.gain.value = 0.045;
        bass.connect(bassLp);
        bassLp.connect(bassGain);
        bassGain.connect(this.master);
        bass.start();
      }

      _canPlay(key, tick, minGap = 3) {
        if (!this.ctx || this.ctx.state !== 'running') return false;
        const prev = this._lastSfxTick[key] ?? -999;
        if (tick - prev < minGap) return false;
        this._lastSfxTick[key] = tick;
        return true;
      }

      playLaunch(tick) {
        if (!this._canPlay('launch', tick, 8)) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(380, t + 0.18);
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.24);
      }

      playImpact(tick, strength = 1) {
        if (!this._canPlay('impact', tick, 3)) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        const amp = Math.min(0.38, 0.12 + strength * 0.15);
        osc.frequency.setValueAtTime(145, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.12);
        g.gain.setValueAtTime(amp, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.15);
      }

      playPotShatter(tick) {
        if (!this._canPlay('pot', tick, 2)) return;
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2600;
        bp.Q.value = 1.4;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.28, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        src.connect(bp);
        bp.connect(g);
        g.connect(this.master);
        src.start(t);
        src.stop(t + 0.17);
      }

      playWoodCrack(tick) {
        if (!this._canPlay('wood', tick, 2)) return;
        const t = this.ctx.currentTime;
        // Splinter burst: short noise crack through a falling lowpass
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(2400, t);
        lp.frequency.exponentialRampToValueAtTime(300, t + 0.13);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.34, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        src.connect(lp);
        lp.connect(g);
        g.connect(this.master);
        src.start(t);
        src.stop(t + 0.16);
        // Woody knock underneath
        const osc = this.ctx.createOscillator();
        const og = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, t);
        osc.frequency.exponentialRampToValueAtTime(65, t + 0.09);
        og.gain.setValueAtTime(0.22, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(og);
        og.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.11);
      }

      playRupee(tick, combo = 1) {
        if (!this._canPlay('rupee', tick, 2)) return;
        const t = this.ctx.currentTime;
        const base = 660 * Math.pow(1.06, Math.min(combo, 12));
        [base, base * 1.25].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + idx * 0.045);
          g.gain.setValueAtTime(0.14, t + idx * 0.045);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.045 + 0.12);
          osc.connect(g);
          g.connect(this.master);
          osc.start(t + idx * 0.045);
          osc.stop(t + idx * 0.045 + 0.13);
        });
      }

      playClearJingle(tick) {
        if (!this._canPlay('jingle', tick, 30)) return;
        const t = this.ctx.currentTime;
        // Little victory arpeggio: C5 E5 G5 C6
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + idx * 0.075);
          g.gain.setValueAtTime(0.2, t + idx * 0.075);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.075 + 0.22);
          osc.connect(g);
          g.connect(this.master);
          osc.start(t + idx * 0.075);
          osc.stop(t + idx * 0.075 + 0.24);
        });
      }

      playExplosion(tick) {
        if (!this._canPlay('boom', tick, 2)) return;
        const t = this.ctx.currentTime;

        // Sub-bass punch
        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(125, t);
        sub.frequency.exponentialRampToValueAtTime(24, t + 0.55);
        subGain.gain.setValueAtTime(0.75, t);
        subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.62);
        sub.connect(subGain);
        subGain.connect(this.master);
        sub.start(t);
        sub.stop(t + 0.65);

        // Filtered explosion roar
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(1400, t);
        lp.frequency.exponentialRampToValueAtTime(160, t + 0.55);
        const ng = this.ctx.createGain();
        ng.gain.setValueAtTime(0.55, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        noise.connect(lp);
        lp.connect(ng);
        ng.connect(this.master);
        noise.start(t);
        noise.stop(t + 0.62);
      }

      playGlassAndAlarm(tick) {
        if (!this._canPlay('alarm', tick, 12)) return;
        const t = this.ctx.currentTime;

        // Glass crash
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 3400;
        const gg = this.ctx.createGain();
        gg.gain.setValueAtTime(0.28, t);
        gg.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        src.connect(hp);
        hp.connect(gg);
        gg.connect(this.master);
        src.start(t);
        src.stop(t + 0.26);

        // Dual-tone Vice car alarm chirp-wail
        for (let i = 0; i < 4; i++) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(i % 2 === 0 ? 920 : 1240, t + i * 0.14);
          g.gain.setValueAtTime(0.08, t + i * 0.14);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.14 + 0.11);
          osc.connect(g);
          g.connect(this.master);
          osc.start(t + i * 0.14);
          osc.stop(t + i * 0.14 + 0.12);
        }
      }

      playCuccoSquawk(tick, frantic = false) {
        if (!this._canPlay(frantic ? 'swarmCluck' : 'cucco', tick, frantic ? 5 : 4)) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        const f0 = frantic ? 760 : 580;
        osc.frequency.setValueAtTime(f0, t);
        osc.frequency.exponentialRampToValueAtTime(f0 * 1.45, t + 0.05);
        osc.frequency.exponentialRampToValueAtTime(f0 * 0.72, t + 0.14);
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1400;
        bp.Q.value = 2.2;
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(bp);
        bp.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.16);
      }

      playSwarmSiren(tick) {
        if (!this._canPlay('swarmSiren', tick, 40)) return;
        const t = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(520 + (i % 2) * 320, t + i * 0.09);
          g.gain.setValueAtTime(0.22, t + i * 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.085);
          osc.connect(g);
          g.connect(this.master);
          osc.start(t + i * 0.09);
          osc.stop(t + i * 0.09 + 0.09);
        }
      }

      playSlowMoDrop(tick) {
        if (!this._canPlay('slowmo', tick, 30)) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(34, t + 0.7);
        g.gain.setValueAtTime(0.55, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.78);
      }

      playFirework(tick) {
        if (!this._canPlay('firework', tick, 5)) return;
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(2200, t);
        bp.frequency.exponentialRampToValueAtTime(600, t + 0.28);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        src.connect(bp);
        bp.connect(g);
        g.connect(this.master);
        src.start(t);
        src.stop(t + 0.32);
      }
    }

    // -------------------------------------------------------------------------
    // TOPPLE: VICE × HYRULE — a run of 3 handcrafted structures.
    // Drag back, release, wreck it. Clear = destroy the stated % OR knock
    // down every ⭐ target. Stars: clear + high destruction + few shots.
    // -------------------------------------------------------------------------
    class ToppleGame {
      constructor(canvas, audio) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.audio = audio;
        this.rng = new SeededRNG(DEFAULT_SEED);
        this.view = { scale: 1, ox: 0, oy: 0, cw: W, ch: H };
        this.engine = null;
        this.world = null;
        this.entities = [];
        this.rupees = [];
        this.particles = [];
        this.shockwaves = [];
        this.swarmCuccos = [];
        this.callouts = [];
        this.fireworks = [];
        this.bgStars = [];
        this.structures = [
          { name: 'POT TOWER', icon: '🏺', par: 3, shots: 5, clearPct: 0.70, build: (g) => g._buildPotTower() },
          { name: 'CAR STACK', icon: '🚗', par: 4, shots: 6, clearPct: 0.70, build: (g) => g._buildCarStack() },
          { name: 'BOMB WAREHOUSE', icon: '💣', par: 4, shots: 6, clearPct: 0.75, build: (g) => g._buildBombWarehouse() },
        ];
        this.resetRun(DEFAULT_SEED);
      }

      reset(seed = DEFAULT_SEED) { this.resetRun(seed); }

      resetRun(seed = DEFAULT_SEED) {
        this.seed = (seed >>> 0) || 1;
        this.rng.reset(this.seed);

        if (this.engine) {
          Matter.Composite.clear(this.engine.world, false);
          Matter.Engine.clear(this.engine);
        }
        this.engine = Matter.Engine.create({
          positionIterations: 8,
          velocityIterations: 6,
        });
        this.engine.gravity.x = 0;
        this.engine.gravity.y = 1.05;
        this.world = this.engine.world;

        this.tick = 0;
        this.score = 0;
        this.structureIndex = 0;
        this.records = [];
        this.phase = 'play'; // 'play' | 'clearbeat' | 'gameover'
        this.clearbeatTicks = 0;
        this.gameoverTick = -9999;
        this.shake = 0;
        this.flashAlpha = 0;
        this.flashColor = '#ffffff';

        this.stats = {
          shotsFired: 0,
          potsSmashed: 0,
          rupeesSpawned: 0,
          rupeesCollected: 0,
          bombsDetonated: 0,
          carsFlipped: 0,
          cratesSmashed: 0,
          cuccosHit: 0,
          cuccoSwarmTriggered: false,
          swarmChickensSpawned: 0,
          maxCombo: 1,
          structuresCleared: 0,
        };

        this.bgStars = [];
        for (let i = 0; i < 36; i++) {
          this.bgStars.push({
            x: this.rng.range(12, W - 12),
            y: this.rng.range(18, 320),
            r: this.rng.range(0.8, 2.2),
            phase: this.rng.range(0, Math.PI * 2),
          });
        }

        // Crane + wrecking ball state
        this.crane = {
          baseX: 82,
          baseY: GROUND_Y,
          pivotX: 162,
          pivotY: 168,
          restX: 162,
          restY: 360,
          dragging: false,
          dragStart: { x: 162, y: 360 },
          dragCur: { x: 162, y: 360 },
          launchCooldown: 0,
          ballFreeTicks: 0,
          tethered: true,
        };

        this._bindCollisions();
        this._loadStructure(0);
      }

      _loadStructure(idx) {
        const s = this.structures[idx];
        Matter.Composite.clear(this.world, false, true);

        this.entities = [];
        this.rupees = [];
        this.particles = [];
        this.shockwaves = [];
        this.swarmCuccos = [];
        this.callouts = [];
        this.fireworks = [];

        this.armed = false; // world stays inert until this structure's first launch
        this.combo = 1;
        this.comboTimer = 0;
        this.cuccoMeter = 0;
        this.swarmActive = false;
        this.swarmTimer = 0;
        this.swarmSpawnRemaining = 0;
        this.microSlowTicks = 0;
        this.lastMicroSlowTick = -9999;
        this.destructionEvents = [];
        this.bombEvents = [];
        this.lastDestructionTick = -9999;
        this.lastLaunchTick = -9999;
        this.shotsUsed = 0;
        this.shotsLeft = s.shots;
        this.structureTick = this.tick;
        this.titleCardTicks = 85;

        this.crane.dragging = false;
        this.crane.launchCooldown = 0;
        this.crane.ballFreeTicks = 0;
        this.crane.tethered = true;

        this._addBoundsAndBall();
        s.build(this);

        // Freeze the whole structure solid until the player's first real
        // launch of THIS structure. Spawned bodies interpenetrate slightly
        // and tiers rest with hairline gaps, so a live solver would settle /
        // eject them at speed on tick 1 — that velocity used to trip cuccos
        // and, via the swarm, demolish the tower with zero input. Static
        // bodies cannot move, settle or gain velocity; dragEnd unfreezes.
        this.towerFrozen = true;
        for (const ent of this.entities) Matter.Body.setStatic(ent.body, true);

        this.structTotal = this.entities.filter((e) => e.destructible).length;
        this.structTargets = this.entities.filter((e) => e.target).length;
      }

      _addBoundsAndBall() {
        const { Bodies, Composite, Constraint } = Matter;

        const floor = Bodies.rectangle(W / 2, GROUND_Y + 40, W + 240, 80, {
          isStatic: true,
          friction: 0.85,
          restitution: 0.25,
          label: 'floor',
        });
        const rightWall = Bodies.rectangle(W + 34, H / 2, 48, H * 2, {
          isStatic: true,
          restitution: 0.5,
          label: 'wall',
        });
        const leftWall = Bodies.rectangle(-40, H / 2, 48, H * 2, {
          isStatic: true,
          restitution: 0.5,
          label: 'wall',
        });
        Composite.add(this.world, [floor, rightWall, leftWall]);

        this.ball = Bodies.circle(this.crane.restX, this.crane.restY, 27, {
          density: 0.018,
          restitution: 0.55,
          friction: 0.2,
          frictionAir: 0.004,
          label: 'wrecking_ball',
        });
        this.cable = Constraint.create({
          pointA: { x: this.crane.pivotX, y: this.crane.pivotY },
          bodyB: this.ball,
          stiffness: 0.09,
          damping: 0.05,
          length: 192,
        });
        Composite.add(this.world, [this.ball, this.cable]);
      }

      _spawn(kind, x, y, opts = {}) {
        const { Bodies, Composite } = Matter;
        let body;
        const base = {
          friction: 0.65,
          restitution: 0.16,
          frictionAir: 0.008,
        };
        if (kind === 'crate') {
          const w = opts.w || 46;
          const h = opts.h || 42;
          body = Bodies.rectangle(x, y, w, h, { ...base, density: 0.0018, label: 'crate' });
          this.entities.push({ id: body.id, kind, body, w, h, hp: 35, maxHp: 35, alive: true, destructible: true, target: !!opts.target, color: opts.color || '#d49a4e' });
        } else if (kind === 'beam') {
          const w = opts.w || 168;
          const h = opts.h || 16;
          body = Bodies.rectangle(x, y, w, h, { ...base, density: 0.0016, label: 'beam' });
          this.entities.push({ id: body.id, kind, body, w, h, hp: 45, maxHp: 45, alive: true, destructible: true, target: !!opts.target, color: opts.color || '#ff77cc' });
        } else if (kind === 'pot') {
          const r = opts.r || 16;
          body = Bodies.polygon(x, y, 7, r, { ...base, density: 0.0012, restitution: 0.22, label: 'pot' });
          this.entities.push({
            id: body.id, kind, body, r, hp: 10, alive: true, destructible: true, target: !!opts.target,
            tier: opts.tier || 'hyrule',
            rupeeCount: opts.rupeeCount || 6,
          });
        } else if (kind === 'bomb') {
          const w = 36;
          const h = 44;
          body = Bodies.rectangle(x, y, w, h, { ...base, density: 0.0022, label: 'bomb' });
          this.entities.push({ id: body.id, kind, body, w, h, hp: 14, alive: true, destructible: true, target: !!opts.target, fuse: -1 });
        } else if (kind === 'car') {
          const w = 86;
          const h = 34;
          body = Bodies.rectangle(x, y, w, h, { ...base, density: 0.0028, restitution: 0.32, label: 'car' });
          this.entities.push({
            id: body.id, kind, body, w, h, hp: 65, alive: true, destructible: true, target: !!opts.target,
            flipped: false,
            alarmTicks: 0,
            glassBroken: false,
            carColor: opts.carColor || '#ff4fa3',
          });
        } else if (kind === 'cucco') {
          const r = 14;
          body = Bodies.circle(x, y, r, { ...base, density: 0.0009, restitution: 0.48, label: 'cucco' });
          this.entities.push({
            id: body.id, kind, body, r, alive: true, destructible: false, target: false,
            triggered: false,
            flapPhase: this.rng.range(0, 6.28),
          });
        }
        body._entity = this.entities[this.entities.length - 1];
        Composite.add(this.world, body);
        return body._entity;
      }

      // Place a body so it RESTS on the surface whose top edge is topY.
      _placeOn(kind, x, topY, opts = {}) {
        let cy;
        if (kind === 'pot') cy = topY - (opts.r || 16) * 0.88;
        else if (kind === 'cucco') cy = topY - 14;
        else if (kind === 'bomb') cy = topY - 22;
        else if (kind === 'car') cy = topY - 17;
        else cy = topY - (opts.h || (kind === 'beam' ? 16 : 42)) / 2;
        return this._spawn(kind, x, cy, opts);
      }

      // --- STRUCTURE 1: POT TOWER (teach the verb; gold pots are targets) ---
