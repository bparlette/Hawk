      _bindCollisions() {
        Matter.Events.on(this.engine, 'collisionStart', (event) => {
          for (const pair of event.pairs) {
            const { bodyA, bodyB } = pair;
            const relVx = bodyA.velocity.x - bodyB.velocity.x;
            const relVy = bodyA.velocity.y - bodyB.velocity.y;
            const speed = Math.hypot(relVx, relVy);
            if (speed < 1.8) continue;

            const isBall = bodyA.label === 'wrecking_ball' || bodyB.label === 'wrecking_ball';
            const impact = isBall ? speed * 2.1 : speed;

            if (isBall && speed > 4.2) {
              this.audio.playImpact(this.tick, Math.min(2, speed / 10));
              this.shake = Math.max(this.shake, Math.min(12, speed * 0.7));
            }

            this._handleBodyHit(bodyA, impact, bodyB);
            this._handleBodyHit(bodyB, impact, bodyA);
          }
        });
      }

      _handleBodyHit(body, impact, other) {
        const ent = body._entity;
        if (!ent || !ent.alive) return;
        if (!this.armed) return; // pre-launch, spawn-settle collisions must not smash pots, light bombs or flip cars

        if (ent.kind === 'pot' && impact > 2.6) {
          this._smashPot(ent);
        } else if (ent.kind === 'bomb' && impact > 3.2) {
          if (ent.fuse < 0) ent.fuse = 2;
        } else if (ent.kind === 'cucco' && impact > 2.0) {
          this._hitCucco(ent);
        } else if (ent.kind === 'car' && impact > 4.8) {
          if (!ent.glassBroken) {
            ent.glassBroken = true;
            ent.alarmTicks = 210;
            this.audio.playGlassAndAlarm(this.tick);
            this._spawnParticles(body.position.x, body.position.y - 10, 14, '#a5f3fc', 'glass');
            this._addCallout(body.position.x, body.position.y - 28, '🚨 CAR ALARM!', '#38bdf8');
            this._bumpCombo();
          }
          ent.hp -= impact * 1.4;
          if (ent.hp <= 0 && !ent.flipped) {
            this._flipCar(ent);
          }
        } else if ((ent.kind === 'crate' || ent.kind === 'beam') && impact > 6.5) {
          ent.hp -= impact * 1.3;
          if (ent.hp <= 0) {
            this._smashWood(ent);
          }
        }
      }

      _bumpCombo() {
        this.combo = Math.min(12, this.combo + 1);
        this.comboTimer = 95;
        if (this.combo > this.stats.maxCombo) {
          this.stats.maxCombo = this.combo;
        }
      }

      _recordDestruction(isBomb = false) {
        this.lastDestructionTick = this.tick;
        this.destructionEvents.push(this.tick);
        if (isBomb) this.bombEvents.push(this.tick);
        if (this.destructionEvents.length > 240) this.destructionEvents.splice(0, 120);
        if (this.bombEvents.length > 120) this.bombEvents.splice(0, 60);
      }

      _addCallout(x, y, text, color = '#ffe66d') {
        if (this.callouts.length >= 7) this.callouts.shift();
        let cy = Math.max(155, Math.min(GROUND_Y - 40, y));
        for (const existing of this.callouts) {
          if (Math.abs(existing.y - cy) < 24) {
            cy -= 26;
          }
        }
        this.callouts.push({
          x: Math.max(95, Math.min(W - 95, x)),
          y: Math.max(150, cy),
          vy: -0.95,
          text,
          color,
          life: 44,
          maxLife: 44,
          scale: 1.25,
        });
      }

      _spawnParticles(x, y, count, color, style = 'spark') {
        for (let i = 0; i < count; i++) {
          if (this.particles.length > 360) this.particles.shift();
          const ang = this.rng.range(0, Math.PI * 2);
          const spd = this.rng.range(1.8, style === 'fire' ? 11.5 : 8.5);
          this.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - (style === 'feather' ? 2.5 : 1.5),
            size: this.rng.range(style === 'fire' ? 6 : 3, style === 'fire' ? 15 : 8),
            color,
            style,
            rot: this.rng.range(0, 6.28),
            vrot: this.rng.range(-0.25, 0.25),
            life: this.rng.int(22, 46),
            maxLife: 46,
          });
        }
      }

      _spawnRupees(x, y, count, tier = 'hyrule') {
        const table = [
          { color: '#22c55e', value: 5 },
          { color: '#38bdf8', value: 10 },
          { color: '#ef4444', value: 25 },
          { color: '#c084fc', value: 50 },
          { color: '#facc15', value: 100 },
        ];
        for (let i = 0; i < count; i++) {
          let pickIdx = this.rng.int(0, 2);
          if (tier === 'royal') pickIdx = this.rng.int(1, 3);
          if (tier === 'gold') pickIdx = this.rng.int(2, 4);
          const spec = table[pickIdx];
          const ang = this.rng.range(-Math.PI * 0.9, -Math.PI * 0.1);
          const spd = this.rng.range(4.2, 10.5);
          this.rupees.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 2,
            color: spec.color,
            value: spec.value * this.combo,
            spin: this.rng.range(0, 6.28),
            age: 0,
            collecting: false,
          });
          this.stats.rupeesSpawned++;
        }
      }

      _smashPot(ent) {
        if (!ent.alive) return;
        ent.alive = false;
        const { x, y } = ent.body.position;
        Matter.Composite.remove(this.world, ent.body);
        this.stats.potsSmashed++;
        this._bumpCombo();
        this._recordDestruction();
        this.audio.playPotShatter(this.tick);
        this.shake = Math.max(this.shake, Math.min(9, 2 + this.combo * 0.5));
        this._spawnParticles(x, y, 14, ent.tier === 'gold' ? '#facc15' : '#d97706', 'shard');
        this._spawnRupees(x, y, ent.rupeeCount, ent.tier);
        if (this.stats.potsSmashed % 3 === 0) {
          this._addCallout(x, y - 16, `💎 POT CASCADE ×${this.combo}!`, '#5ef2d6');
        }
      }

      _smashWood(ent) {
        if (!ent.alive) return;
        ent.alive = false;
        const { x, y } = ent.body.position;
        Matter.Composite.remove(this.world, ent.body);
        this.stats.cratesSmashed++;
        this._bumpCombo();
        this._recordDestruction();
        this.audio.playWoodCrack(this.tick);
        this.shake = Math.max(this.shake, Math.min(9, 2 + this.combo * 0.5));
        this._spawnParticles(x, y, 12, ent.color || '#d49a4e', 'shard');
        this._spawnRupees(x, y, 2, 'hyrule');
      }

      _flipCar(ent) {
        if (ent.flipped) return;
        ent.flipped = true;
        ent.glassBroken = true;
        ent.alarmTicks = 240;
        this.stats.carsFlipped++;
        this._bumpCombo();
        this._recordDestruction();
        const { x, y } = ent.body.position;
        this.audio.playGlassAndAlarm(this.tick);
        this.shake = Math.max(this.shake, 8);
        this._spawnParticles(x, y, 18, '#a5f3fc', 'glass');
        this._spawnRupees(x, y, 6, 'royal');
        this._addCallout(x, y - 24, `🚗 CAR WRECKED! +${250 * this.combo}`, '#ff66c4');
        this.score += 250 * this.combo;
      }

      _hitCucco(ent) {
        if (ent.triggered) return;
        ent.triggered = true;
        this.stats.cuccosHit++;
        const { x, y } = ent.body.position;
        this.audio.playCuccoSquawk(this.tick, false);
        this._spawnParticles(x, y, 22, '#ffffff', 'feather');
        Matter.Body.setVelocity(ent.body, {
          x: this.rng.range(-9, 9),
          y: -11,
        });
        this.cuccoMeter = Math.min(100, this.cuccoMeter + 26);
        this._addCallout(x, y - 18, '🐔 BAWK!! +CUCCO', '#ffffff');
        if (this.cuccoMeter >= 100 && !this.swarmActive) {
          this._triggerCuccoSwarm();
        }
      }

      _triggerCuccoSwarm() {
        this.swarmActive = true;
        this.swarmTimer = 240;
        this.swarmSpawnRemaining = 42;
        this.stats.cuccoSwarmTriggered = true;
        this.audio.playSwarmSiren(this.tick);
        this.shake = Math.max(this.shake, 16);
        this.flashAlpha = 0.45;
        this.flashColor = '#ff2a85';
        this._addCallout(W / 2, 230, '🐔🔥 CUCCO SWARM UNLEASHED!! 🔥🐔', '#ffe66d');
      }

      _spawnSwarmCucco() {
        const side = this.rng.int(0, 2); // 0=left, 1=right, 2=top
        let x, y;
        if (side === 0) {
          x = -24;
          y = this.rng.range(180, GROUND_Y - 60);
        } else if (side === 1) {
          x = W + 24;
          y = this.rng.range(180, GROUND_Y - 60);
        } else {
          x = this.rng.range(40, W - 40);
          y = -24;
        }
        this.swarmCuccos.push({
          x,
          y,
          vx: 0,
          vy: 0,
          speed: this.rng.range(10.5, 15.5),
          flap: this.rng.range(0, 6.28),
          life: 215,
          diveTargetId: null,
        });
        this.stats.swarmChickensSpawned++;
      }

      _detonateBomb(ent) {
        if (!ent.alive) return;
        ent.alive = false;
        const { x, y } = ent.body.position;
        Matter.Composite.remove(this.world, ent.body);
        this.stats.bombsDetonated++;
        this._bumpCombo();
        this._recordDestruction(true);

        this.audio.playExplosion(this.tick);
        this.shake = Math.max(this.shake, 22);
        this.flashAlpha = Math.max(this.flashAlpha, 0.55);
        this.flashColor = '#ff9f1c';

        this.shockwaves.push({ x, y, r: 16, maxR: 205, life: 20, maxLife: 20, color: '#ffe66d' });
        this._spawnParticles(x, y, 28, '#ff5400', 'fire');
        this._spawnParticles(x, y, 16, '#ffe66d', 'spark');
        this._spawnRupees(x, y, 5, 'royal');
        this._addCallout(x, y - 22, `💣 BOMB CHAIN ×${this.combo}!`, '#ff9f1c');

        const blastRadius = 112;
        for (const other of this.entities) {
          if (!other.alive || other === ent) continue;
          const ox = other.body.position.x;
          const oy = other.body.position.y;
          const dx = ox - x;
          const dy = oy - y;
          const dist = Math.hypot(dx, dy);
          if (dist > blastRadius) continue;

          const falloff = 1 - dist / blastRadius;
          const nx = dist > 1 ? dx / dist : 0;
          const ny = dist > 1 ? dy / dist : -1;

          if (other.kind === 'bomb') {
            if (other.fuse < 0) {
              other.fuse = this.rng.int(5, 11);
            }
            Matter.Body.setVelocity(other.body, {
              x: other.body.velocity.x + nx * 10 * falloff,
              y: other.body.velocity.y + (ny - 0.4) * 10 * falloff,
            });
          } else if (other.kind === 'pot') {
            this._smashPot(other);
          } else if (other.kind === 'cucco') {
            this._hitCucco(other);
          } else if (other.kind === 'crate' || other.kind === 'beam') {
            Matter.Body.setVelocity(other.body, {
              x: other.body.velocity.x + nx * 15 * falloff,
              y: other.body.velocity.y + (ny - 0.5) * 15 * falloff,
            });
            Matter.Body.setAngularVelocity(other.body, this.rng.range(-0.3, 0.3));
            other.hp -= 44 * falloff;
            if (other.hp <= 0) this._smashWood(other);
          } else if (other.kind === 'car') {
            Matter.Body.setVelocity(other.body, {
              x: other.body.velocity.x + nx * 14 * falloff,
              y: other.body.velocity.y + (ny - 0.55) * 16 * falloff,
            });
            Matter.Body.setAngularVelocity(other.body, this.rng.range(-0.25, 0.25));
            if (!other.glassBroken) {
              other.glassBroken = true;
              other.alarmTicks = 240;
              this.audio.playGlassAndAlarm(this.tick);
            }
            other.hp -= 38 * falloff;
            if (other.hp <= 0 && !other.flipped) this._flipCar(other);
          }
        }

        // Also launch nearby perched cuccos
        for (const other of this.entities) {
          if (other.kind === 'cucco' && other.alive) {
            const dist = Math.hypot(other.body.position.x - x, other.body.position.y - y);
            if (dist < blastRadius * 1.1) this._hitCucco(other);
          }
        }
      }

      // -----------------------------------------------------------------------
      // Structure bookkeeping: destruction %, targets, stars, resolution
      // -----------------------------------------------------------------------
      _destroyedCount() {
        let n = 0;
        for (const ent of this.entities) {
          if (!ent.destructible) continue;
          if (ent.kind === 'car') { if (ent.flipped) n++; }
          else if (!ent.alive) n++;
        }
        return n;
      }

      _destructionPct() {
        if (!this.structTotal) return 0;
        return this._destroyedCount() / this.structTotal;
      }

      _targetsDown() {
        let n = 0;
        for (const ent of this.entities) {
          if (!ent.target) continue;
          if (ent.kind === 'car') { if (ent.flipped) n++; }
          else if (!ent.alive) n++;
        }
        return n;
      }

      _isCleared() {
        const s = this.structures[this.structureIndex];
        return this._destructionPct() >= s.clearPct ||
          (this.structTargets > 0 && this._targetsDown() >= this.structTargets);
      }

      _resolveStructure() {
        const s = this.structures[this.structureIndex];
        const pct = this._destructionPct();
        const cleared = this._isCleared();
        let stars = 0;
        if (cleared) {
          stars = 1 + (pct >= 0.85 ? 1 : 0) + (this.shotsUsed <= s.par ? 1 : 0);
          this.stats.structuresCleared++;
        }
        const bonus = cleared ? 500 + 250 * stars + 100 * this.shotsLeft : 0;
        this.score += bonus;
        this.records.push({
          name: s.name,
          icon: s.icon,
          pct,
          shotsUsed: this.shotsUsed,
          stars,
          cleared,
          bonus,
        });
        this.phase = 'clearbeat';
        this.clearbeatTicks = 50;
        if (cleared) {
          this.audio.playClearJingle(this.tick);
          this._addCallout(W / 2, 300, `${'⭐'.repeat(stars)} ${s.name} CLEAR! +${bonus}`, '#ffe66d');
          for (let i = 0; i < 3; i++) {
            this._spawnFirework(
              this.rng.range(80, W - 80),
              this.rng.range(140, 380),
              this.rng.pick(['#ff4fa3', '#5ef2d6', '#ffe66d', '#c084fc'])
            );
          }
        } else {
          this.audio.playSlowMoDrop(this.tick);
          this._addCallout(W / 2, 300, '💨 OUT OF SHOTS!', '#94a3b8');
        }
      }

      _advanceStructure() {
        if (this.structureIndex >= this.structures.length - 1) {
          this.phase = 'gameover';
          this.gameoverTick = this.tick;
        } else {
          this.structureIndex++;
          this._loadStructure(this.structureIndex);
          this.phase = 'play';
        }
      }

      getRunState() {
        return {
          phase: this.phase,
          structureIndex: this.structureIndex,
          structureName: this.structures[this.structureIndex].name,
          score: this.score,
          shotsLeft: this.shotsLeft,
          shotsUsed: this.shotsUsed,
          pct: Math.round(this._destructionPct() * 1000) / 1000,
          destroyed: this._destroyedCount(),
          total: this.structTotal,
          targetsLeft: this.structTargets - this._targetsDown(),
          targetsTotal: this.structTargets,
          cleared: this.phase !== 'play' ? this._isCleared() : this._isCleared(),
          combo: this.combo,
          swarmActive: this.swarmActive,
          records: this.records.map((r) => ({ ...r, pct: Math.round(r.pct * 1000) / 1000 })),
          totalStars: this.records.reduce((a, r) => a + r.stars, 0),
        };
      }

      // -----------------------------------------------------------------------
      // Unified Input Handling (Pointer + scripted test launches)
      // -----------------------------------------------------------------------
      _computeLaunch(pullX, pullY) {
        let px = pullX;
        let py = pullY;
        // If player dragged forward toward the tower instead of pulling back, invert
        if (px < -12) { px = -px; py = -py; }
        const dist = Math.hypot(px, py);
        if (dist < 14) return null;
        const clamped = Math.min(dist, 185);
        const nx = px / dist;
        const ny = py / dist;
        const power = clamped * 0.175;
        return {
          x: this.crane.restX - nx * 42,
          y: this.crane.restY - ny * 26,
          vx: Math.max(9, nx * power),
          vy: ny * power - 3.6,
          powerPct: clamped / 185,
        };
      }

      applyInput(type, data = {}) {
        if (this.phase !== 'play' || this.titleCardTicks > 0) return;

        if (type === 'dragStart') {
          if (this.crane.launchCooldown > 0) return;
          if (this.shotsLeft <= 0) return;
          this.crane.dragging = true;
          this.crane.dragStart = { x: data.x ?? this.crane.restX, y: data.y ?? this.crane.restY };
          this.crane.dragCur = { ...this.crane.dragStart };
        } else if (type === 'dragMove') {
          if (!this.crane.dragging) return;
          this.crane.dragCur = { x: data.x ?? this.crane.dragCur.x, y: data.y ?? this.crane.dragCur.y };
        } else if (type === 'dragEnd') {
          if (!this.crane.dragging) return;
          this.crane.dragging = false;
          const curX = data.x ?? this.crane.dragCur.x;
          const curY = data.y ?? this.crane.dragCur.y;
          const pullX = this.crane.dragStart.x - curX;
          const pullY = this.crane.dragStart.y - curY;

          const launch = this._computeLaunch(pullX, pullY);
          if (!launch) return;

          // Release tether for ballistic wrecking-ball smash, then reel back after 64 ticks
          if (this.cable) {
            Matter.Composite.remove(this.world, this.cable);
            this.cable = null;
          }
          Matter.Body.setPosition(this.ball, { x: launch.x, y: launch.y });
          Matter.Body.setVelocity(this.ball, { x: launch.vx, y: launch.vy });

          // First real launch of this structure: unfreeze it so the strike can wreck it
          if (this.towerFrozen) {
            this.towerFrozen = false;
            for (const ent of this.entities) {
              if (ent.alive) Matter.Body.setStatic(ent.body, false);
            }
          }
          this.armed = true; // first real launch arms the world: hits can now smash, flip and detonate
          this.crane.tethered = false;
          this.crane.ballFreeTicks = 64;
          this.crane.launchCooldown = 28;
          this.shotsUsed++;
          this.shotsLeft--;
          this.stats.shotsFired++;
          this.lastLaunchTick = this.tick;
          this.audio.playLaunch(this.tick);
        }
      }

      _reelBallToCrane() {
        if (this.cable) return;
        Matter.Body.setPosition(this.ball, { x: this.crane.restX, y: this.crane.restY });
        Matter.Body.setVelocity(this.ball, { x: 0, y: 0 });
        Matter.Body.setAngularVelocity(this.ball, 0);
        this.cable = Matter.Constraint.create({
          pointA: { x: this.crane.pivotX, y: this.crane.pivotY },
          bodyB: this.ball,
          stiffness: 0.09,
          damping: 0.05,
          length: 192,
        });
        Matter.Composite.add(this.world, this.cable);
        this.crane.tethered = true;
      }

      // -----------------------------------------------------------------------
      // Fixed 60Hz Deterministic Simulation Step
      // -----------------------------------------------------------------------
      stepTick() {
        this.tick++;

        // Time scale: structure-clear beat and big-chain micro-pauses run slow
        let timeScale = 1;
        if (this.phase === 'clearbeat') timeScale = 0.25;
        else if (this.microSlowTicks > 0) { timeScale = 0.3; this.microSlowTicks--; }
        Matter.Engine.update(this.engine, FIXED_DT * timeScale);

        if (this.titleCardTicks > 0) this.titleCardTicks--;

        if (this.crane.launchCooldown > 0) this.crane.launchCooldown--;
        if (!this.crane.tethered) {
          this.crane.ballFreeTicks--;
          if (this.crane.ballFreeTicks <= 0 || this.ball.position.x > W + 40 || this.ball.position.y > H + 40) {
            this._reelBallToCrane();
          }
        }

        if (this.comboTimer > 0) {
          this.comboTimer--;
          if (this.comboTimer === 0) this.combo = 1;
        }

        if (this.shake > 0) this.shake = Math.max(0, this.shake * 0.86 - 0.15);
        if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - 0.038);

        // Update entities (bomb fuses, car flip detection, alarms, offscreen cleanup)
        for (const ent of this.entities) {
          if (!ent.alive) continue;
          const b = ent.body;

          if (ent.kind === 'bomb' && ent.fuse >= 0) {
            ent.fuse--;
            if (ent.fuse <= 0) {
              this._detonateBomb(ent);
              continue;
            }
          }

          if (ent.kind === 'car') {
            if (ent.alarmTicks > 0) ent.alarmTicks--;
            if (this.armed && !ent.flipped && (Math.abs(b.angle) > 0.55 || b.position.y > GROUND_Y + 20 || b.position.x > W - 15)) {
              this._flipCar(ent);
            }
          }

          if (this.armed && ent.kind === 'pot' && (b.position.y > GROUND_Y + 30 || b.position.x > W - 12)) {
            this._smashPot(ent);
          }

          if (ent.kind === 'cucco') {
            ent.flapPhase += 0.35;
            if (this.armed && !ent.triggered && Math.hypot(b.velocity.x, b.velocity.y) > 3.2) {
              this._hitCucco(ent);
            }
          }
        }

        // Update Cucco Swarm
        if (this.swarmActive) {
          this.swarmTimer--;
          if (this.swarmSpawnRemaining > 0 && this.tick % 2 === 0) {
            this._spawnSwarmCucco();
            this.swarmSpawnRemaining--;
            if (this.swarmSpawnRemaining > 0) {
              this._spawnSwarmCucco();
              this.swarmSpawnRemaining--;
            }
          }
          if (this.tick % 10 === 0 && this.swarmCuccos.length > 0) {
            this.audio.playCuccoSquawk(this.tick, true);
          }
          if (this.swarmTimer <= 0 && this.swarmCuccos.length === 0) {
            this.swarmActive = false;
          }
        }

        // Move & collide Swarm Cuccos against surviving targets
        const activeTargets = this.entities.filter(
          (e) => e.alive && (e.kind === 'pot' || e.kind === 'bomb' || e.kind === 'crate' || (e.kind === 'car' && !e.flipped))
        );
        for (let i = this.swarmCuccos.length - 1; i >= 0; i--) {
          const c = this.swarmCuccos[i];
          c.flap += 0.65;
          c.life--;

          let target = activeTargets.find((t) => t.id === c.diveTargetId && t.alive);
          if (!target && activeTargets.length > 0) {
            target = this.rng.pick(activeTargets);
            c.diveTargetId = target ? target.id : null;
          }

          if (target) {
            const tx = target.body.position.x;
            const ty = target.body.position.y;
            const dx = tx - c.x;
            const dy = ty - c.y;
            const dist = Math.hypot(dx, dy) || 1;
            c.vx = (dx / dist) * c.speed;
            c.vy = (dy / dist) * c.speed + Math.sin(c.flap) * 2.2;
            c.x += c.vx;
            c.y += c.vy;

            if (dist < 28) {
              this._spawnParticles(c.x, c.y, 10, '#ffffff', 'feather');
              this.audio.playCuccoSquawk(this.tick, true);
              if (target.kind === 'pot') {
                this._smashPot(target);
              } else if (target.kind === 'bomb') {
                this._detonateBomb(target);
              } else if (target.kind === 'crate') {
                this._smashWood(target);
              } else if (target.kind === 'car') {
                Matter.Body.setVelocity(target.body, { x: this.rng.range(-10, 10), y: -12 });
                Matter.Body.setAngularVelocity(target.body, this.rng.range(-0.35, 0.35));
                this._flipCar(target);
              }
              c.diveTargetId = null;
            }
          } else {
            // Victory chaos circling inside visible viewport
            c.vx += this.rng.range(-2.2, 2.2);
            c.vy += this.rng.range(-2.2, 2.2);
            const spd = Math.hypot(c.vx, c.vy) || 1;
            c.vx = (c.vx / spd) * c.speed;
            c.vy = (c.vy / spd) * c.speed;
            c.x += c.vx;
            c.y += c.vy;
            if (c.x < 28) { c.x = 28; c.vx = Math.abs(c.vx); }
            if (c.x > W - 28) { c.x = W - 28; c.vx = -Math.abs(c.vx); }
            if (c.y < 165) { c.y = 165; c.vy = Math.abs(c.vy); }
            if (c.y > GROUND_Y - 16) { c.y = GROUND_Y - 16; c.vy = -Math.abs(c.vy); }
            if (this.tick % 10 === 0) {
              this._spawnParticles(c.x, c.y, 3, '#ffffff', 'feather');
            }
          }

          if (c.life <= 0) {
            this.swarmCuccos.splice(i, 1);
          }
        }

        // Update Rupees (ballistic bounce -> magnet into collector at top-left HUD)
        const collectorX = 95;
        const collectorY = 54;
        for (let i = this.rupees.length - 1; i >= 0; i--) {
          const r = this.rupees[i];
          r.age++;
          r.spin += 0.22;
          if (r.age < 26 && !r.collecting) {
            r.vy += 0.42;
            r.x += r.vx;
            r.y += r.vy;
            if (r.y > GROUND_Y - 10) {
              r.y = GROUND_Y - 10;
              r.vy *= -0.55;
              r.vx *= 0.78;
            }
          } else {
            r.collecting = true;
            const dx = collectorX - r.x;
            const dy = collectorY - r.y;
            const d = Math.hypot(dx, dy) || 1;
            r.x += (dx / d) * 19;
            r.y += (dy / d) * 19;
            if (d < 22) {
              this.score += r.value;
              this.stats.rupeesCollected++;
              this.audio.playRupee(this.tick, this.combo);
              this.rupees.splice(i, 1);
            }
          }
        }

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life--;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          p.vy += p.style === 'feather' ? 0.06 : 0.25;
          if (p.style === 'feather') p.vx *= 0.96;
          if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Update Shockwaves
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const s = this.shockwaves[i];
          s.life--;
          s.r = s.maxR * (1 - s.life / s.maxLife);
          if (s.life <= 0) this.shockwaves.splice(i, 1);
        }

        // Update Callouts
        for (let i = this.callouts.length - 1; i >= 0; i--) {
          const c = this.callouts[i];
          c.y += c.vy;
          c.life--;
          if (c.life <= 0) this.callouts.splice(i, 1);
        }

        // Update Fireworks
        for (let i = this.fireworks.length - 1; i >= 0; i--) {
          const fw = this.fireworks[i];
          fw.life--;
          for (const sp of fw.sparks) {
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.vy += 0.08;
            sp.vx *= 0.97;
          }
          if (fw.life <= 0) this.fireworks.splice(i, 1);
        }

        // Big chain reaction? Micro slow-mo pause so the player FEELS it.
        if (this.phase === 'play' && this.armed && this.tick - this.lastMicroSlowTick > 240) {
          const recent = this.destructionEvents.filter((t) => this.tick - t <= 15).length;
          const recentBombs = this.bombEvents.filter((t) => this.tick - t <= 12).length;
          if (recent >= 4 || recentBombs >= 2) {
            this.microSlowTicks = 16;
            this.lastMicroSlowTick = this.tick;
            this.audio.playSlowMoDrop(this.tick);
            this.shake = Math.max(this.shake, 7);
          }
        }

        // Structure flow
        if (this.phase === 'play') {
          const calm = this.armed &&
            this.titleCardTicks <= 0 &&
            (this.tick - this.lastDestructionTick > 45) &&
            this.rupees.length === 0 &&
            !this.swarmActive &&
            this.crane.tethered &&
            (this.tick - this.structureTick > 90);
          const stuck = this.shotsLeft <= 0 && (this.tick - this.lastLaunchTick > 1800);
          if ((calm && (this._isCleared() || this.shotsLeft <= 0)) || stuck) {
            this._resolveStructure();
          }
        } else if (this.phase === 'clearbeat') {
          this.clearbeatTicks--;
          if (this.clearbeatTicks <= 0) {
            this._advanceStructure();
          }
        } else if (this.phase === 'gameover') {
          if ((this.tick - this.gameoverTick) % 26 === 0) {
            this._spawnFirework(
              this.rng.range(60, W - 60),
              this.rng.range(120, 420),
              this.rng.pick(['#ff4fa3', '#5ef2d6', '#ffe66d', '#c084fc', '#ff9f1c'])
            );
          }
        }
      }

      _spawnFirework(x, y, color) {
        this.audio.playFirework(this.tick);
        const sparks = [];
        for (let i = 0; i < 24; i++) {
          const ang = (i / 24) * Math.PI * 2 + this.rng.range(-0.1, 0.1);
          const spd = this.rng.range(2.2, 6.2);
          sparks.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd });
        }
        this.fireworks.push({ color, sparks, life: 42, maxLife: 42 });
      }

      getScore() {
        return this.score;
      }

      getStats() {
        return { ...this.stats, ...this.getRunState() };
      }

      getDigest() {
        const r = (n) => Math.round(n * 100) / 100;
        const aliveCount = this.entities.filter((e) => e.alive).length;
        return [
          this.tick,
          this.score,
          this.combo,
          Math.round(this.cuccoMeter),
          aliveCount,
          this.stats.potsSmashed,
          this.stats.bombsDetonated,
          this.stats.carsFlipped,
          r(this.ball.position.x),
          r(this.ball.position.y),
        ].join('|');
      }

      // -----------------------------------------------------------------------
      // Pure Read-Only Renderer (Golden-Hour Vice City × Hyrule Beach Strip)
      // -----------------------------------------------------------------------
      render() {
        const ctx = this.ctx;
        const v = this.view;
        ctx.setTransform(v.scale, 0, 0, v.scale, v.ox, v.oy);
        ctx.save();

        // Screen shake
        if (this.shake > 0.2) {
          const sx = Math.sin(this.tick * 1.9) * this.shake;
          const sy = Math.cos(this.tick * 2.3) * this.shake;
          ctx.translate(sx, sy);
        }

        // Visible world rect (the page is full-fill on any phone aspect:
        // the world is bottom-anchored and the sky/ocean extend to the edges)
        const vx0 = -v.ox / v.scale - 24;
        const vy0 = -v.oy / v.scale - 24;
        const vx1 = vx0 + v.cw / v.scale + 48;
        const vy1 = vy0 + v.ch / v.scale + 48;

        // 1. Golden-hour sky gradient
        const sky = ctx.createLinearGradient(0, vy0, 0, GROUND_Y);
        sky.addColorStop(0, '#22093a');
        sky.addColorStop(0.28, '#7b1457');
        sky.addColorStop(0.58, '#e84855');
        sky.addColorStop(0.84, '#ff9f1c');
        sky.addColorStop(1, '#ffe66d');
        ctx.fillStyle = sky;
        ctx.fillRect(vx0, vy0, vx1 - vx0, GROUND_Y - vy0);

        // Twinkling dusk stars (repeated upward when extra sky is visible)
        for (const s of this.bgStars) {
          for (let k = 0; k < 3; k++) {
            const sy = s.y - k * 480;
            if (sy < vy0 - 4) continue;
            const a = 0.35 + 0.45 * Math.sin(this.tick * 0.08 + s.phase);
            ctx.fillStyle = `rgba(255, 245, 210, ${a.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Giant outrun golden-hour sun with scanline slices
        const sunX = 250;
        const sunY = 530;
        const sunR = 112;
        const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
        sunGrad.addColorStop(0, '#fff380');
        sunGrad.addColorStop(0.55, '#ff7b00');
        sunGrad.addColorStop(1, '#ff1e7a');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff8b2e';
        for (let sy = sunY + 12; sy < sunY + sunR; sy += 16) {
          ctx.fillRect(sunX - sunR, sy, sunR * 2, 4);
        }

        // 2. Hyrule rolling green hills + Hyrule Castle Tower (left/background)
        ctx.fillStyle = '#195e3a';
        ctx.beginPath();
        ctx.moveTo(0, 680);
        ctx.quadraticCurveTo(130, 560, 290, 660);
        ctx.quadraticCurveTo(420, 610, W, 675);
        ctx.lineTo(W, 740);
        ctx.lineTo(0, 740);
        ctx.closePath();
        ctx.fill();

        // Hyrule Castle Keep & Spires
        ctx.fillStyle = '#3b2b59';
        ctx.fillRect(46, 445, 96, 195);
        ctx.fillRect(26, 495, 34, 145);
        ctx.fillRect(128, 495, 34, 145);
        ctx.fillStyle = '#2563eb'; // Royal blue roofs
        this._drawCone(ctx, 94, 445, 58, 72);
        this._drawCone(ctx, 43, 495, 24, 44);
        this._drawCone(ctx, 145, 495, 24, 44);
        // Gold Triforce on castle
        this._drawTriforce(ctx, 94, 520, 18, '#facc15');
        ctx.fillStyle = '#fde047';
        ctx.fillRect(82, 558, 8, 16);
        ctx.fillRect(102, 558, 8, 16);

        // Rolling emerald foreground hill + Pine trees (Hyrule side)
        ctx.fillStyle = '#238c4e';
        ctx.beginPath();
        ctx.moveTo(0, 690);
        ctx.quadraticCurveTo(155, 622, 315, 705);
        ctx.lineTo(315, 745);
        ctx.lineTo(0, 745);
        ctx.closePath();
        ctx.fill();
        this._drawPineTree(ctx, 32, 675, 1.0);
        this._drawPineTree(ctx, 168, 668, 0.85);
        this._drawPineTree(ctx, 212, 680, 0.72);

        // 3. Vice City Pastel Art Deco Hotels + Neon Signs + Palm Trees (right side)
        this._drawArtDecoHotel(ctx, 330, 448, 82, 245, '#7ef9da', '#ff4fa3', 'VICE × HYRULE');
        this._drawArtDecoHotel(ctx, 420, 488, 68, 205, '#ff85b3', '#ffe66d', 'LON LON');
        this._drawArtDecoHotel(ctx, 482, 520, 58, 172, '#c084fc', '#5ef2d6', 'RUPEE');

        // Palm trees next to pine trees
        this._drawPalmTree(ctx, 248, 690, 0.95);
        this._drawPalmTree(ctx, 310, 695, 0.88);
        this._drawPalmTree(ctx, 512, 698, 0.92);

        // 4. Golden-hour Ocean Strip
        const oceanGrad = ctx.createLinearGradient(0, 695, 0, GROUND_Y);
        oceanGrad.addColorStop(0, '#ff6b4a');
        oceanGrad.addColorStop(0.45, '#9d174d');
        oceanGrad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = oceanGrad;
        ctx.fillRect(vx0, 695, vx1 - vx0, GROUND_Y - 695);

        // Shimmering ocean wave sparkles
        for (let wy = 708; wy < GROUND_Y - 8; wy += 16) {
          const offset = Math.sin(this.tick * 0.06 + wy) * 14;
          ctx.fillStyle = 'rgba(255, 230, 120, 0.38)';
          ctx.fillRect(180 + offset, wy, 130, 3);
          ctx.fillStyle = 'rgba(94, 242, 214, 0.25)';
          ctx.fillRect(360 - offset, wy + 5, 95, 2);
        }

        // 5. Boardwalk Pier
        ctx.fillStyle = '#4a2511';
        ctx.fillRect(vx0, GROUND_Y, vx1 - vx0, vy1 - GROUND_Y);
        ctx.fillStyle = '#7c3f1d';
        ctx.fillRect(vx0, GROUND_Y, vx1 - vx0, 16);
        // Neon boardwalk trim
        ctx.fillStyle = '#ff4fa3';
        ctx.fillRect(vx0, GROUND_Y, vx1 - vx0, 4);
        ctx.fillStyle = '#5ef2d6';
        ctx.fillRect(vx0, GROUND_Y + 14, vx1 - vx0, 3);

        // 6. Crane Rig on the Boardwalk
        this._drawCrane(ctx);

        // 7. Shockwaves
        for (const s of this.shockwaves) {
          ctx.strokeStyle = s.color;
          ctx.globalAlpha = Math.max(0, s.life / s.maxLife);
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // 9. Physics Entities
        for (const ent of this.entities) {
          if (!ent.alive) continue;
          this._drawEntity(ctx, ent);
        }

        // 9b. ⭐ markers over surviving targets
        for (const ent of this.entities) {
          if (!ent.target || !ent.alive) continue;
          if (ent.kind === 'car' && ent.flipped) continue;
          const bx = ent.body.position.x;
          const by = ent.body.position.y;
          const rad = (ent.kind === 'car' ? 52 : ent.kind === 'bomb' ? 30 : 24) + Math.sin(this.tick * 0.12) * 3;
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 214, 64, 0.9)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(bx, by, rad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.font = '17px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⭐', bx, by - rad - 6);
          ctx.restore();
        }

        // 10. Wrecking Ball & Cable
        if (this.cable) {
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(this.crane.pivotX, this.crane.pivotY);
          ctx.lineTo(this.ball.position.x, this.ball.position.y);
          ctx.stroke();
        }
        this._drawWreckingBall(ctx);

        // 10b. Drag Aim on top of everything: elastic band + trajectory + power
        if (this.crane.dragging) {
          this._drawAimGuide(ctx);
        }

        // 11. Furious Cucco Swarm
        for (const c of this.swarmCuccos) {
          this._drawCuccoSprite(ctx, c.x, c.y, c.vx >= 0 ? 1 : -1, c.flap, true);
        }

        // 12. Raining Rupees
        for (const r of this.rupees) {
          this._drawRupee(ctx, r);
        }

        // 13. Particles
        for (const p of this.particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if (p.style === 'fire') {
            ctx.beginPath();
            ctx.arc(0, 0, p.size, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.style === 'feather') {
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 1.1, p.size * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          }
          ctx.restore();
        }
        ctx.globalAlpha = 1;

        // 14. Fireworks
        for (const fw of this.fireworks) {
          const a = Math.max(0, fw.life / fw.maxLife);
          ctx.fillStyle = fw.color;
          ctx.globalAlpha = a;
          for (const sp of fw.sparks) {
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;

        // 15. Chaotic Callout Banners
        for (const c of this.callouts) {
          const alpha = Math.min(1, c.life / 14);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = '900 20px Impact, Arial Black, sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#140826';
          ctx.strokeText(c.text, c.x, c.y);
          ctx.fillStyle = c.color;
          ctx.fillText(c.text, c.x, c.y);
          ctx.restore();
        }

        // 16. Explosion Screen Flash
        if (this.flashAlpha > 0.01) {
          ctx.fillStyle = this.flashColor;
          ctx.globalAlpha = this.flashAlpha;
          ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
          ctx.globalAlpha = 1;
        }

        // 17. HUD (icons + numbers), title card, end screen
        this._drawHUD(ctx);
        if (this.titleCardTicks > 0 && this.phase === 'play') this._drawTitleCard(ctx);
        if (this.phase === 'gameover') this._drawEndScreen(ctx);

        ctx.restore();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      _drawCone(ctx, cx, baseY, w, h) {
        ctx.beginPath();
        ctx.moveTo(cx - w / 2, baseY);
        ctx.lineTo(cx, baseY - h);
        ctx.lineTo(cx + w / 2, baseY);
        ctx.closePath();
        ctx.fill();
      }

      _drawTriforce(ctx, cx, cy, size, color) {
        ctx.fillStyle = color;
        const tri = (tx, ty, s) => {
          ctx.beginPath();
          ctx.moveTo(tx, ty - s);
          ctx.lineTo(tx - s * 0.86, ty + s * 0.5);
          ctx.lineTo(tx + s * 0.86, ty + s * 0.5);
          ctx.closePath();
          ctx.fill();
        };
        tri(cx, cy - size * 0.55, size * 0.55);
        tri(cx - size * 0.5, cy + size * 0.35, size * 0.55);
        tri(cx + size * 0.5, cy + size * 0.35, size * 0.55);
      }

      _drawPineTree(ctx, x, baseY, scale) {
        ctx.fillStyle = '#0f3f26';
        for (let i = 0; i < 3; i++) {
          this._drawCone(ctx, x, baseY - i * 24 * scale, (44 - i * 8) * scale, 42 * scale);
        }
      }

      _drawPalmTree(ctx, x, baseY, scale) {
        ctx.strokeStyle = '#3e1f14';
        ctx.lineWidth = 7 * scale;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.quadraticCurveTo(x - 10 * scale, baseY - 62 * scale, x + 6 * scale, baseY - 115 * scale);
        ctx.stroke();

        const topX = x + 6 * scale;
        const topY = baseY - 115 * scale;
        ctx.fillStyle = '#064e3b';
        for (let i = 0; i < 5; i++) {
          const ang = -Math.PI * 0.85 + i * 0.62 + Math.sin(this.tick * 0.04 + i) * 0.06;
          ctx.beginPath();
          ctx.ellipse(
            topX + Math.cos(ang) * 26 * scale,
            topY + Math.sin(ang) * 18 * scale,
            28 * scale,
            7 * scale,
            ang,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      _drawArtDecoHotel(ctx, x, y, w, h, bodyColor, neonColor, label) {
        ctx.fillStyle = bodyColor;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = 'rgba(20, 8, 38, 0.25)';
        ctx.fillRect(x + w - 14, y, 14, h);
        // Stepped Art Deco crown
        ctx.fillStyle = bodyColor;
        ctx.fillRect(x + 10, y - 16, w - 20, 16);
        ctx.fillRect(x + 24, y - 30, w - 48, 14);
        // Glowing neon trim & sign
        ctx.strokeStyle = neonColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 6, y + 10, w - 12, 22);
        ctx.fillStyle = '#140826';
        ctx.fillRect(x + 7, y + 11, w - 14, 20);
        ctx.fillStyle = neonColor;
        ctx.font = 'bold 9px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, x + w / 2, y + 24);
        // Lit windows
        ctx.fillStyle = 'rgba(255, 240, 150, 0.55)';
        for (let wy = y + 44; wy < y + h - 18; wy += 24) {
          for (let wx = x + 12; wx < x + w - 16; wx += 18) {
            ctx.fillRect(wx, wy, 9, 13);
          }
        }
      }

      _drawCrane(ctx) {
        ctx.save();
        // Steel crane mast
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(this.crane.baseX, this.crane.baseY);
        ctx.lineTo(this.crane.baseX + 26, 178);
        ctx.lineTo(this.crane.pivotX, this.crane.pivotY);
        ctx.stroke();

        // Cross bracing
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        for (let y = 210; y < GROUND_Y - 30; y += 56) {
          ctx.beginPath();
          ctx.moveTo(this.crane.baseX + 10, y);
          ctx.lineTo(this.crane.baseX + 28, y + 32);
          ctx.stroke();
        }

        // Neon cab
        ctx.fillStyle = '#ff4fa3';
        ctx.fillRect(this.crane.baseX - 24, GROUND_Y - 56, 56, 56);
        ctx.fillStyle = '#5ef2d6';
        ctx.fillRect(this.crane.baseX - 10, GROUND_Y - 46, 30, 22);

        // Pivot hub
        ctx.fillStyle = '#ffe66d';
        ctx.beginPath();
        ctx.arc(this.crane.pivotX, this.crane.pivotY, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      _drawAimGuide(ctx) {
        const s = this.crane.dragStart;
        const c = this.crane.dragCur;
        const pullX = s.x - c.x;
        const pullY = s.y - c.y;
        const launch = this._computeLaunch(pullX, pullY);

        ctx.save();
        // Elastic band from the ball's rest perch to the player's finger point
        ctx.strokeStyle = 'rgba(255, 79, 163, 0.85)';
        ctx.lineWidth = 3;
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        ctx.moveTo(this.crane.restX, this.crane.restY);
        ctx.lineTo(c.x, c.y);
        ctx.stroke();
        ctx.setLineDash([]);

        if (launch) {
          // Preview dots integrated with the sim's real per-tick gravity/drag,
          // so the arc the player sees is the arc the ball actually flies.
          const G_TICK = 0.2917;
          const DRAG = 0.996;
          let px = launch.x;
          let py = launch.y;
          let vx = launch.vx;
          let vy = launch.vy;
          const dotColor = launch.powerPct > 0.75 ? '#ff5470' : launch.powerPct > 0.45 ? '#ffe66d' : '#5ef2d6';
          for (let step = 1; step <= 30; step++) {
            vy += G_TICK;
            vx *= DRAG;
            vy *= DRAG;
            px += vx;
            py += vy;
            if (step % 2 === 0) {
              const k = step / 2; // 1..15
              ctx.globalAlpha = 1 - k / 17;
              ctx.beginPath();
              ctx.arc(px, py, 6.6 - k * 0.26, 0, Math.PI * 2);
              ctx.fillStyle = dotColor;
              ctx.fill();
              ctx.strokeStyle = 'rgba(20, 8, 38, 0.6)';
              ctx.lineWidth = 1.6;
              ctx.stroke();
            }
            if (py > GROUND_Y) break;
          }
          ctx.globalAlpha = 1;

          // Pull-power meter above the ball
          const pct = launch.powerPct;
          const barW = 110;
          const barX = this.crane.restX - barW / 2;
          const barY = this.crane.restY - 92;
          ctx.fillStyle = 'rgba(18, 6, 38, 0.82)';
          ctx.fillRect(barX - 4, barY - 4, barW + 8, 24);
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(barX, barY, barW, 9);
          ctx.fillStyle = pct > 0.75 ? '#ff5470' : pct > 0.45 ? '#ffe66d' : '#5ef2d6';
          ctx.fillRect(barX, barY, barW * pct, 9);
          ctx.strokeStyle = 'rgba(255,255,255,0.7)';
          ctx.lineWidth = 1;
          ctx.strokeRect(barX, barY, barW, 9);
          ctx.font = '900 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`💪 ${Math.round(pct * 100)}%`, this.crane.restX, barY + 26);
        }
        ctx.restore();
      }

      _drawWreckingBall(ctx) {
        const { x, y } = this.ball.position;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(this.ball.angle);

        const grad = ctx.createRadialGradient(-8, -8, 4, 0, 0, 28);
        grad.addColorStop(0, '#f8fafc');
        grad.addColorStop(0.5, '#64748b');
        grad.addColorStop(1, '#1e293b');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, 27, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffe66d';
        ctx.lineWidth = 3;
        ctx.stroke();

        this._drawTriforce(ctx, 0, 2, 13, '#ffe66d');
        ctx.restore();
      }

      _drawEntity(ctx, ent) {
        const b = ent.body;
        ctx.save();
        ctx.translate(b.position.x, b.position.y);
        ctx.rotate(b.angle);

        if (ent.kind === 'crate') {
          ctx.fillStyle = ent.color;
          ctx.fillRect(-ent.w / 2, -ent.h / 2, ent.w, ent.h);
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 3;
          ctx.strokeRect(-ent.w / 2, -ent.h / 2, ent.w, ent.h);
          ctx.beginPath();
          ctx.moveTo(-ent.w / 2, -ent.h / 2);
          ctx.lineTo(ent.w / 2, ent.h / 2);
          ctx.moveTo(ent.w / 2, -ent.h / 2);
          ctx.lineTo(-ent.w / 2, ent.h / 2);
          ctx.stroke();
        } else if (ent.kind === 'beam') {
          ctx.fillStyle = ent.color;
          ctx.fillRect(-ent.w / 2, -ent.h / 2, ent.w, ent.h);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(-ent.w / 2, -ent.h / 2, ent.w, ent.h);
        } else if (ent.kind === 'pot') {
          const r = ent.r;
          ctx.fillStyle = ent.tier === 'gold' ? '#f59e0b' : ent.tier === 'royal' ? '#4f46e5' : '#c2592b';
          ctx.beginPath();
          ctx.ellipse(0, 2, r * 0.92, r, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fde68a';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          // Pot rim
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-r * 0.65, -r - 2, r * 1.3, 5);
        } else if (ent.kind === 'bomb') {
          const pulse = ent.fuse >= 0 && this.tick % 4 < 2;
          ctx.fillStyle = pulse ? '#ffffff' : '#1e3a8a';
          ctx.fillRect(-ent.w / 2, -ent.h / 2, ent.w, ent.h);
          ctx.strokeStyle = ent.target ? '#ffd640' : '#ef4444';
          ctx.lineWidth = ent.target ? 4 : 3;
          ctx.strokeRect(-ent.w / 2, -ent.h / 2, ent.w, ent.h);
          // Bomb Flower emblem
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(0, 2, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-3, -14, 6, 8);
        } else if (ent.kind === 'car') {
          const w = ent.w;
          const h = ent.h;
          ctx.fillStyle = ent.carColor;
          ctx.beginPath();
          ctx.moveTo(-w / 2, h / 2);
          ctx.lineTo(-w / 2 + 6, -h / 4);
          ctx.lineTo(-w / 4, -h / 2);
          ctx.lineTo(w / 4, -h / 2);
          ctx.lineTo(w / 2 - 4, -h / 5);
          ctx.lineTo(w / 2, h / 2);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Windshield (shattered or intact)
          ctx.fillStyle = ent.glassBroken ? '#334155' : '#67e8f9';
          ctx.fillRect(-w * 0.2, -h * 0.42, w * 0.4, h * 0.28);

          // Wheels
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(-w * 0.28, h * 0.44, 9, 0, Math.PI * 2);
          ctx.arc(w * 0.28, h * 0.44, 9, 0, Math.PI * 2);
          ctx.fill();

          // Flashing car alarm lights
          if (ent.alarmTicks > 0 && this.tick % 8 < 4) {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(w * 0.46, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(-w * 0.46, 0, 8, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (ent.kind === 'cucco') {
          this._drawCuccoSprite(ctx, 0, 0, 1, ent.flapPhase, ent.triggered);
        }

        ctx.restore();
      }

      _drawCuccoSprite(ctx, x, y, dir, flapPhase, angry) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(dir, 1);

        // Body
        ctx.fillStyle = angry ? '#fef2f2' : '#ffffff';
        ctx.beginPath();
        ctx.ellipse(0, 2, 13, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = angry ? '#ef4444' : '#94a3b8';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Flapping wing
        const wingY = Math.sin(flapPhase) * 6;
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.ellipse(-2, -1 + wingY, 7, 4, -0.3, 0, Math.PI * 2);
        ctx.fill();

        // Red comb & beak
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(7, -9, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(11, -3);
        ctx.lineTo(18, 0);
        ctx.lineTo(11, 3);
        ctx.closePath();
        ctx.fill();

        // Eye (furious red glow when triggered / swarming!)
        ctx.fillStyle = angry ? '#ef4444' : '#0f172a';
        ctx.beginPath();
        ctx.arc(8, -3, angry ? 2.8 : 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      _drawRupee(ctx, r) {
        ctx.save();
        ctx.translate(r.x, r.y);
        const sx = Math.max(0.25, Math.abs(Math.cos(r.spin)));
        ctx.scale(sx, 1);
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.moveTo(0, -11);
        ctx.lineTo(7, -4);
        ctx.lineTo(7, 4);
        ctx.lineTo(0, 11);
        ctx.lineTo(-7, 4);
        ctx.lineTo(-7, -4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();
      }

      _drawHUD(ctx) {
        ctx.save();
        const s = this.structures[this.structureIndex];

        // Top translucent bar
        ctx.fillStyle = 'rgba(18, 6, 38, 0.72)';
        ctx.fillRect(10, 30, W - 20, 66);
        ctx.strokeStyle = 'rgba(94, 242, 214, 0.65)';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 30, W - 20, 66);

        // Rupee Score (left)
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.moveTo(30, 44);
        ctx.lineTo(38, 53);
        ctx.lineTo(38, 65);
        ctx.lineTo(30, 74);
        ctx.lineTo(22, 65);
        ctx.lineTo(22, 53);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#ffe66d';
        ctx.font = '900 27px Impact, Arial Black, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(String(this.score).toLocaleString(), 46, 72);

        // Structure indicator (center)
        ctx.font = '20px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(s.icon, W / 2 - 34, 58);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 20px Impact, Arial Black, sans-serif';
        ctx.fillText(`${this.structureIndex + 1}/3`, W / 2 + 2, 58);

        // Destruction progress (center, under structure indicator)
        const pct = this._destructionPct();
        const barW = 120;
        const barX = W / 2 - barW / 2;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(barX, 68, barW, 10);
        const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, '#ff9f1c');
        grad.addColorStop(1, '#ff1e7a');
        ctx.fillStyle = pct >= s.clearPct ? '#22c55e' : grad;
        ctx.fillRect(barX, 68, barW * Math.min(1, pct), 10);
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, 68, barW, 10);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 12px system-ui, sans-serif';
        ctx.fillText(`${Math.round(pct * 100)}%`, W / 2, 92);

        // Shots remaining (right)
        ctx.font = '19px system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('🎯', W - 52, 58);
        ctx.fillStyle = this.shotsLeft <= 1 ? '#ff5470' : '#ffffff';
        ctx.font = '900 22px Impact, Arial Black, sans-serif';
        ctx.fillText(`×${this.shotsLeft}`, W - 18, 58);

        // Chain multiplier (right, under shots) — pops while a chain is live
        if (this.combo > 1) {
          const pop = 1 + 0.18 * Math.max(0, (this.comboTimer - 80) / 15);
          ctx.save();
          ctx.translate(W - 34, 84);
          ctx.scale(pop, pop);
          ctx.fillStyle = '#5ef2d6';
          ctx.font = '900 19px Impact, Arial Black, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`⚡×${this.combo}`, 0, 0);
          ctx.restore();
        }

        // ⭐ targets remaining (left, under score)
        const targetsLeft = this.structTargets - this._targetsDown();
        if (this.structTargets > 0) {
          ctx.font = '15px system-ui, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('⭐', 24, 90);
          ctx.fillStyle = targetsLeft === 0 ? '#22c55e' : '#ffd640';
          ctx.font = '900 16px Impact, Arial Black, sans-serif';
          ctx.fillText(`${targetsLeft}`, 44, 90);
        }

        // Cucco Meter bar (only when this structure has a coop worth fearing)
        if (this.entities.some((e) => e.kind === 'cucco')) {
          const barX2 = 16;
          const barY2 = 104;
          const barW2 = W - 32;
          const barH2 = 16;
          ctx.fillStyle = 'rgba(18, 6, 38, 0.8)';
          ctx.fillRect(barX2, barY2, barW2, barH2);
          const fillRatio = Math.min(1, this.cuccoMeter / 100);
          const meterGrad = ctx.createLinearGradient(barX2, 0, barX2 + barW2, 0);
          meterGrad.addColorStop(0, '#facc15');
          meterGrad.addColorStop(0.5, '#ff6b00');
          meterGrad.addColorStop(1, '#ff1e7a');
          ctx.fillStyle = this.swarmActive && this.tick % 8 < 4 ? '#ff1e7a' : meterGrad;
          ctx.fillRect(barX2 + 2, barY2 + 2, (barW2 - 4) * fillRatio, barH2 - 4);
          ctx.strokeStyle = '#ffe66d';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(barX2, barY2, barW2, barH2);
          ctx.font = '900 11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          const meterLabel = this.swarmActive
            ? '🐔 CUCCO SWARM ACTIVE — TOTAL MAYHEM!! 🐔'
            : `🐔 ${Math.round(this.cuccoMeter)}%`;
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#140826';
          ctx.strokeText(meterLabel, W / 2, barY2 + 12);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(meterLabel, W / 2, barY2 + 12);
        }

        // First-structure aim hint: a bouncing arrow at the ball until shot 1
        if (this.structureIndex === 0 && this.stats.shotsFired === 0 && !this.crane.dragging && this.titleCardTicks <= 0) {
          const bob = Math.sin(this.tick * 0.09) * 7;
          ctx.font = '30px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('👈', this.crane.restX - 58 + bob, this.crane.restY + 10);
        }

        ctx.restore();
      }

      _drawTitleCard(ctx) {
        const s = this.structures[this.structureIndex];
        const a = Math.min(1, this.titleCardTicks / 18, (85 - this.titleCardTicks) / 8 + 0.15);
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, a));
        const pw = 400;
        const ph = 128;
        const px = W / 2 - pw / 2;
        const py = 300;
        ctx.fillStyle = 'rgba(16, 5, 34, 0.88)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#ffe66d';
        ctx.lineWidth = 3;
        ctx.strokeRect(px, py, pw, ph);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#5ef2d6';
        ctx.font = '900 15px Impact, Arial Black, sans-serif';
        ctx.fillText(`— STRUCTURE ${this.structureIndex + 1} / 3 —`, W / 2, py + 28);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 34px Impact, Arial Black, sans-serif';
        ctx.fillText(`${s.icon} ${s.name}`, W / 2, py + 68);
        ctx.fillStyle = '#ffd640';
        ctx.font = '900 16px system-ui, sans-serif';
        ctx.fillText(`🎯 ${s.shots} SHOTS · ⭐ ${this.structTargets} TARGETS · 💥 ${Math.round(s.clearPct * 100)}%`, W / 2, py + 100);
        ctx.restore();
      }

      _drawEndScreen(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(10, 4, 24, 0.82)';
        ctx.fillRect(0, 0, W, H);

        const pw = 470;
        const ph = 480;
        const px = W / 2 - pw / 2;
        const py = 190;
        ctx.fillStyle = 'rgba(22, 8, 46, 0.97)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#ffe66d';
        ctx.lineWidth = 3;
        ctx.strokeRect(px, py, pw, ph);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffe66d';
        ctx.font = '900 34px Impact, Arial Black, sans-serif';
        ctx.fillText('🏆 RUN COMPLETE!', W / 2, py + 52);

        ctx.fillStyle = '#22c55e';
        ctx.font = '17px system-ui, sans-serif';
        ctx.fillText('💎', W / 2 - 88, py + 104);
        ctx.fillStyle = '#ffe66d';
        ctx.font = '900 44px Impact, Arial Black, sans-serif';
        ctx.fillText(String(this.score).toLocaleString(), W / 2 + 8, py + 108);

        // Per-structure rows
        let ry = py + 158;
        for (let i = 0; i < this.records.length; i++) {
          const r = this.records[i];
          ctx.textAlign = 'left';
          ctx.font = '24px system-ui, sans-serif';
          ctx.fillText(r.icon, px + 22, ry);
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 19px Impact, Arial Black, sans-serif';
          ctx.fillText(r.name, px + 58, ry);
          ctx.fillStyle = r.cleared ? '#5ef2d6' : '#ff5470';
          ctx.font = '900 16px system-ui, sans-serif';
          ctx.fillText(`${Math.round(r.pct * 100)}% · 🎯×${r.shotsUsed}`, px + 58, ry + 24);
          // Stars
          ctx.textAlign = 'right';
          ctx.font = '26px system-ui, sans-serif';
          for (let st = 0; st < 3; st++) {
            ctx.fillStyle = st < r.stars ? '#ffd640' : 'rgba(255,255,255,0.22)';
            ctx.fillText('★', px + pw - 24 - (2 - st) * 30, ry + 8);
          }
          ry += 62;
        }

        const totalStars = this.records.reduce((a, r) => a + r.stars, 0);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd640';
        ctx.font = '900 24px Impact, Arial Black, sans-serif';
        ctx.fillText(`⭐ ${totalStars} / 9`, W / 2 - 70, ry + 26);
        ctx.fillStyle = '#5ef2d6';
        ctx.fillText(`⚡×${this.stats.maxCombo}`, W / 2 + 80, ry + 26);

        const pulse = 0.75 + 0.25 * Math.sin(this.tick * 0.08);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 20px system-ui, sans-serif';
        ctx.fillText('👆 TAP TO PLAY AGAIN', W / 2, py + ph - 26);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    // -------------------------------------------------------------------------
    // Bootstrap: full-fill view fit, pointer input, iOS audio unlock, main loop
    // -------------------------------------------------------------------------
    const canvas = document.getElementById('game-canvas');
    const audio = new AudioEngine();
    const game = new ToppleGame(canvas, audio);

    // View fit: the 540×960 world is never stretched. Narrow/tall phones get
    // width-fit with the world bottom-anchored (extra sky above); wider
    // screens get height-fit centered (scenery gradient extends sideways).
    function fitCanvas() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const cw = Math.max(1, Math.round(canvas.clientWidth * dpr));
      const ch = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== cw) canvas.width = cw;
      if (canvas.height !== ch) canvas.height = ch;
      let scale, ox, oy;
      if (cw / ch > W / H) {
        scale = ch / H;
        ox = (cw - W * scale) / 2;
        oy = 0;
      } else {
        scale = cw / W;
        ox = 0;
        oy = ch - H * scale;
      }
      game.view = { scale, ox, oy, cw, ch };
    }
    fitCanvas();
    window.addEventListener('resize', fitCanvas);

    function toWorldCoords(ev) {
      const rect = canvas.getBoundingClientRect();
      const px = ((ev.clientX - rect.left) / rect.width) * canvas.width;
      const py = ((ev.clientY - rect.top) / rect.height) * canvas.height;
      return {
        x: (px - game.view.ox) / game.view.scale,
        y: (py - game.view.oy) / game.view.scale,
      };
    }

    const unlockAudio = async () => {
      await audio.ensureStarted();
      audio.startBed();
    };

    canvas.addEventListener('pointerdown', async (ev) => {
      ev.preventDefault();
      await unlockAudio();
      if (game.phase === 'gameover') {
        if (game.tick - game.gameoverTick > 30) game.resetRun(DEFAULT_SEED);
        return;
      }
      canvas.setPointerCapture(ev.pointerId);
      game.applyInput('dragStart', toWorldCoords(ev));
    });

    canvas.addEventListener('pointermove', (ev) => {
      if (!game.crane.dragging) return;
      ev.preventDefault();
      game.applyInput('dragMove', toWorldCoords(ev));
    });

    function endDrag(ev) {
      if (!game.crane.dragging) return;
      ev.preventDefault();
      game.applyInput('dragEnd', toWorldCoords(ev));
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // iOS WebAudio unlock: resume on every gesture + when the tab returns.
    document.addEventListener('pointerdown', () => { audio.ensureStarted(); }, { passive: true });
    document.addEventListener('touchend', () => { audio.ensureStarted(); }, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audio.ctx && audio.ctx.state === 'suspended') {
        audio.ctx.resume().catch(() => {});
      }
    });

    // Prevent double-tap zoom on iOS/mobile browsers
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (ev) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) ev.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    // Main 60Hz Fixed-Timestep Loop
    let lastRaf = performance.now();
    let acc = 0;
    function loop(now) {
      const dt = Math.min(now - lastRaf, 50);
      lastRaf = now;
      acc += dt;
      let steps = 0;
      while (acc >= FIXED_DT && steps < 4) {
        game.stepTick();
        acc -= FIXED_DT;
        steps++;
      }
      game.render();
      requestAnimationFrame(loop);
    }
    game.render();
    requestAnimationFrame(loop);

    // Expose deterministic hooks for automated headless verification
    window.__TOPPLE__ = {
      game,
      audio,
      step: (n = 1) => { for (let i = 0; i < n; i++) game.stepTick(); },
      launch: (pullX, pullY) => {
        const s = { x: game.crane.restX, y: game.crane.restY };
        game.applyInput('dragStart', s);
        game.applyInput('dragMove', { x: s.x - pullX, y: s.y - pullY });
        game.applyInput('dragEnd', { x: s.x - pullX, y: s.y - pullY });
      },
      state: () => game.getRunState(),
      digest: () => game.getDigest(),
    };
  </script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
