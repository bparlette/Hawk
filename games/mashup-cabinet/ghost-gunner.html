<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHOST GUNNER — Maze Run &amp; Gun</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background:#05060f; height:100%; height:100dvh; overflow:hidden;
    position:fixed; inset:0; width:100%;
  }
  body {
    font-family:'Courier New', ui-monospace, monospace;
    color:#cfe8ff; -webkit-user-select:none; user-select:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap { position:fixed; inset:0; width:100dvw; height:100dvh; }
  canvas { display:block; position:absolute; inset:0; }
  #touch { position:absolute; inset:0; z-index:6; pointer-events:none; }
  .tbtn {
    position:absolute; width:64px; height:64px; border-radius:50%;
    border:2px solid rgba(140,220,255,.75);
    background:radial-gradient(circle at 32% 30%, rgba(120,200,255,.35), rgba(20,40,80,.5));
    box-shadow:0 0 14px rgba(80,180,255,.35), inset 0 0 10px rgba(120,200,255,.25);
    color:#bfeaff; font-family:inherit; font-weight:bold; font-size:12px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    pointer-events:auto; touch-action:none; backdrop-filter:blur(2px);
  }
  .tbtn:active { background:radial-gradient(circle at 32% 30%, rgba(160,220,255,.6), rgba(70,140,255,.55)); }
  #btnFire { right:16px;  bottom:calc(20px + env(safe-area-inset-bottom)); border-color:rgba(255,120,120,.9); color:#ffd2d2; width:72px; height:72px; }
  #btnRoll { right:100px; bottom:calc(58px + env(safe-area-inset-bottom)); border-color:rgba(140,255,170,.85); color:#d6ffe0; }
  #btnEmp  { right:22px;  bottom:calc(108px + env(safe-area-inset-bottom)); border-color:rgba(255,220,120,.9); color:#fff0c0; }
  #stick {
    position:fixed; width:104px; height:104px; border-radius:50%;
    border:2px solid rgba(140,220,255,.45);
    background:radial-gradient(circle, rgba(30,60,110,.18) 55%, rgba(60,130,220,.3));
    box-shadow:0 0 18px rgba(80,180,255,.3), inset 0 0 16px rgba(120,200,255,.2);
    display:none; pointer-events:none; z-index:7;
  }
  #stickKnob {
    position:absolute; width:46px; height:46px; border-radius:50%; left:29px; top:29px;
    background:radial-gradient(circle at 35% 30%, rgba(220,250,255,.75), rgba(120,200,255,.45));
    border:2px solid rgba(200,240,255,.7);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="touch">
    <div class="tbtn" id="btnFire">FIRE</div>
    <div class="tbtn" id="btnRoll">ROLL</div>
    <div class="tbtn" id="btnEmp">EMP</div>
  </div>
  <div id="stick"><div id="stickKnob"></div></div>
</div>
<script>
'use strict';
/* ============================================================
   GHOST GUNNER — top-down maze run & gun.
   Eat energy nodes to charge your blaster. Stun the rogue bots,
   grab a Hyper Cell to turn the hunt around.
   Original maze, original bots, zero dependencies.
   ============================================================ */

// ---------- constants ----------
const T = 26;                       // tile size (maze-space px)
const COLS = 19, ROWS = 21;
const W = COLS * T, MH = ROWS * T;  // maze-space dimensions (494 × 546)
// viewport / view transform (filled by resize()): the maze is scaled to fill
// the screen width and as much height as square tiles allow, centered, with
// the game's ambient backdrop art filling the rest of the phone screen.
let VW = 0, VH = 0, DPRF = 1, viewS = 1, viewOX = 0, viewOY = 0;
const DIRS = {
  up:    { x: 0, y:-1, name:'up'    },
  down:  { x: 0, y: 1, name:'down'  },
  left:  { x:-1, y: 0, name:'left'  },
  right: { x: 1, y: 0, name:'right' }
};
const DIR_LIST = [DIRS.up, DIRS.left, DIRS.down, DIRS.right]; // classic preference order

// ---------- original maze ----------
// # wall · . energy node · o Hyper Cell · B bot base · - base gate (bots only) · (space) open floor
const MAZE = [
  "###################",
  "#o.......#.......o#",
  "#.##.###.#.###.##.#",
  "#.................#",
  "#.##.#.#####.#.##.#",
  "#....#...#...#....#",
  "####.###.#.###.####",
  "####.#.......#.####",
  "####.#.##-##.#.####",
  "    .#.#BBB#.#.    ",
  "####.#.#####.#.####",
  "####.#.......#.####",
  "####.#.#####.#.####",
  "#........#........#",
  "#.##.###.#.###.##.#",
  "#....#.......#....#",
  "####.#.#####.#.####",
  "#.######.#.######.#",
  "#....#.......#....#",
  "#o...#...#...#...o#",
  "###################"
];
const TUNNEL_ROW = 9;
const GATE = { x: 9, y: 8 };        // '-' tile
const BASE_TILES = [ {x:8,y:9}, {x:9,y:9}, {x:10,y:9} ];
const P1_SPAWN = { x: 9, y: 15 };
const P2_SPAWN = { x: 9, y: 13 };

// ---------- audio (fully synthesized) ----------
let AC = null, humOsc = null, humGain = null;
function initAudio() {
  try {
    if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) {} }
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      // 1-sample silent buffer inside the gesture — unlocks iOS audio
      const buf = AC.createBuffer(1, 1, AC.sampleRate);
      const src = AC.createBufferSource(); src.buffer = buf; src.connect(AC.destination); src.start(0);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* audio is decoration; never break the game */ }
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (!AC || AC.state !== 'running') return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
let pelletRun = 0, pelletRunT = 0;
function sfxPellet() {
  pelletRun = Math.min(pelletRun + 1, 24);
  tone(520 * Math.pow(1.045, pelletRun), 0.07, 'sine', 0.055);
}
function sfxLaser()      { tone(920, 0.13, 'sawtooth', 0.045, 180); }
function sfxStun()       { tone(140, 0.22, 'square', 0.07, 60); tone(90, 0.22, 'square', 0.05, 45, 0.03); }
function sfxHyper()      { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.12, 'triangle', 0.09, null, i * 0.06)); }
function sfxDestroy(n)   { const base = [523, 659, 784, 1046][Math.min(n, 3)]; tone(base, 0.16, 'square', 0.08); tone(base * 1.5, 0.22, 'square', 0.07, null, 0.07); }
function sfxEmp()        { tone(1200, 0.4, 'sawtooth', 0.07, 60); tone(70, 0.4, 'sine', 0.12, 34); }
function sfxDeath()      { tone(660, 0.7, 'sawtooth', 0.09, 55); tone(330, 0.7, 'triangle', 0.08, 40, 0.05); }
function sfxWave()       { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.14, 'triangle', 0.09, null, i * 0.08)); }
function sfxRoll()       { tone(300, 0.12, 'sine', 0.05, 620); }
function setHum(on) {
  if (!AC || AC.state !== 'running') return;
  try {
    if (on && !humOsc) {
      humOsc = AC.createOscillator(); humGain = AC.createGain();
      humOsc.type = 'triangle'; humOsc.frequency.value = 55;
      humGain.gain.value = 0.035;
      humOsc.connect(humGain); humGain.connect(AC.destination); humOsc.start();
    } else if (!on && humOsc) {
      humOsc.stop(); humOsc.disconnect(); humGain.disconnect(); humOsc = null; humGain = null;
    }
  } catch (e) {}
}
['pointerdown', 'touchend'].forEach(ev => window.addEventListener(ev, initAudio, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) initAudio(); });

// ---------- game state ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let state = 'title';               // title | playing | dying | waveclear | gameover
let stateT = 0;                    // seconds spent in current state
let timeScale = 1;
let score = 0, lives = 3, wave = 1, bank = 0;
let pellets = new Set();           // "x,y" of remaining nodes
let pelletsTotal = 0;
let frightT = 0;                   // Hyper Cell vulnerability seconds left
let chain = 0;                     // destructions within current fright window
let shake = 0, flashA = 0, flashColor = '255,255,255';
let particles = [];
let projectiles = [];
let shockwaves = [];
let toast = '', toastT = 0;
let elapsed = 0;

function key(x, y) { return x + ',' + y; }
function tileChar(tx, ty) {
  if (ty === TUNNEL_ROW && (tx < 0 || tx >= COLS)) return ' '; // tunnel mouths
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return '#';
  return MAZE[ty][tx];
}
function walkable(tx, ty, isBot) {
  const c = tileChar(tx, ty);
  if (c === '#') return false;
  if (c === '-' || c === 'B') return !!isBot;
  return true;
}
function loadPellets() {
  pellets = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = MAZE[y][x];
    if (c === '.') pellets.add(key(x, y));
    else if (c === 'o') pellets.add('H' + key(x, y));
  }
  pelletsTotal = pellets.size;
}

// ---------- entities ----------
function makePlayer(spawn, color, name) {
  return {
    isBot: false, name, color,
    spawnX: spawn.x, spawnY: spawn.y,
    x: spawn.x * T + T / 2, y: spawn.y * T + T / 2,
    dir: { x: 0, y: 0 }, want: { x: 0, y: 0 },
    speed: 97, ammo: 25, fireCd: 0, rollCd: 0, rollT: 0, active: true, muzzle: 0,
    onCenter(e, tx, ty) {
      if (e.want.x !== 0 || e.want.y !== 0) {
        if (walkable(tx + e.want.x, ty + e.want.y, false)) e.dir = { x: e.want.x, y: e.want.y };
      }
      if ((e.dir.x !== 0 || e.dir.y !== 0) && !walkable(tx + e.dir.x, ty + e.dir.y, false)) e.dir = { x: 0, y: 0 };
    }
  };
}
const p1 = makePlayer(P1_SPAWN, '#ffd83d', 'P1');
const p2 = makePlayer(P2_SPAWN, '#52ff7a', 'P2');
p2.active = false; // joins on first P2 input

// Four original rogue bots, four temperaments.
const BOT_DEFS = [
  { name: 'RUSTY', color: '#ff3860', kind: 'chase',  baseIdx: 0 },
  { name: 'VEX',   color: '#ff7ad9', kind: 'ambush', baseIdx: 1 },
  { name: 'JOLT',  color: '#37e0ff', kind: 'flank',  baseIdx: 2 },
  { name: 'ORBIT', color: '#ffa53d', kind: 'random', baseIdx: 0 }
];
let bots = [];
function makeBot(def, i) {
  const home = BASE_TILES[def.baseIdx];
  return {
    isBot: true, name: def.name, color: def.color, kind: def.kind,
    x: home.x * T + T / 2, y: home.y * T + T / 2,
    dir: { x: 0, y: -1 }, want: { x: 0, y: 0 },
    state: 'base', waitT: 0.6 + i * 1.1, stunT: 0, seed: Math.random() * 1000,
    onCenter(e, tx, ty) { botDecide(e, tx, ty); }
  };
}
function botSpeed(b) {
  if (b.stunT > 0) return 0;
  let s = 71 + (wave - 1) * 6;
  if (frightT > 0) s *= 0.6;
  if (b.state === 'exit') s *= 0.92;
  return Math.min(s, 96);
}
function botTile(b) { return { x: Math.floor(b.x / T), y: Math.floor(b.y / T) }; }
function activePlayers() { return p2.active ? [p1, p2] : [p1]; }
function nearestPlayerTile(b) {
  let best = null, bd = 1e9;
  for (const p of activePlayers()) {
    const pt = { x: Math.floor(p.x / T), y: Math.floor(p.y / T) };
    const d = (pt.x - b.x / T) ** 2 + (pt.y - b.y / T) ** 2;
    if (d < bd) { bd = d; best = { tile: pt, p }; }
  }
  return best;
}
function botTarget(b) {
  const np = nearestPlayerTile(b);
  if (!np) return { x: 9, y: 15 };
  const pt = np.tile, pd = np.p.dir;
  if (b.kind === 'ambush') return { x: pt.x + pd.x * 4, y: pt.y + pd.y * 4 };
  if (b.kind === 'flank') {
    const pivot = { x: pt.x + pd.x * 2, y: pt.y + pd.y * 2 };
    const chaser = bots[0] && bots[0] !== b ? botTile(bots[0]) : pt;
    return { x: pivot.x * 2 - chaser.x, y: pivot.y * 2 - chaser.y };
  }
  return pt; // chase + random fallback
}
function botDecide(b, tx, ty) {
  if (b.state === 'exit') {
    // head for the gate, then out into the maze
    const target = (tx === GATE.x && ty === GATE.y) ? { x: GATE.x, y: GATE.y - 1 } : GATE;
    if (tx === GATE.x && ty === GATE.y - 1) { b.state = 'chase'; }
    chooseDir(b, tx, ty, target, true);
    return;
  }
  if (b.state !== 'chase') return;
  const target = botTarget(b);
  chooseDir(b, tx, ty, target, false);
}
function chooseDir(b, tx, ty, target, allowSpecial) {
  const opts = [];
  for (const d of DIR_LIST) {
    if (d.x === -b.dir.x && d.y === -b.dir.y && (b.dir.x !== 0 || b.dir.y !== 0)) continue; // no reversing
    const nx = tx + d.x, ny = ty + d.y;
    const c = tileChar(nx, ny);
    if (c === '#') continue;
    if ((c === '-' || c === 'B') && !allowSpecial) continue;
    opts.push(d);
  }
  if (!opts.length) { b.dir = { x: -b.dir.x, y: -b.dir.y }; return; } // dead end: turn around
  let pick = opts[0];
  if (b.kind === 'random' && b.state === 'chase' && frightT <= 0) {
    pick = opts[Math.floor(Math.abs(Math.sin(b.seed + elapsed * 0.7 + tx * 3.1 + ty * 1.7)) * opts.length) % opts.length];
  } else {
    let bestScore = frightT > 0 ? -1e9 : 1e9; // frightened bots flee
    for (const d of opts) {
      const nx = tx + d.x, ny = ty + d.y;
      const dist = (nx - target.x) ** 2 + (ny - target.y) ** 2;
      if (frightT > 0 ? dist > bestScore : dist < bestScore) { bestScore = dist; pick = d; }
    }
  }
  b.dir = { x: pick.x, y: pick.y };
}

// ---------- movement core (exact tile-center decisions) ----------
function advance(e, dt) {
  let dist = (e.isBot ? botSpeed(e) : e.speed * (e.rollT > 0 ? 2.15 : 1)) * dt;
  let guard = 0;
  while (dist > 0 && guard++ < 10) {
    const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T);
    const cx = tx * T + T / 2, cy = ty * T + T / 2;
    if (Math.abs(e.x - cx) < 0.001 && Math.abs(e.y - cy) < 0.001) {
      e.x = cx; e.y = cy;
      e.onCenter(e, tx, ty);
      if (e.dir.x === 0 && e.dir.y === 0) return;
      if (!walkable(tx + e.dir.x, ty + e.dir.y, e.isBot)) { e.dir = { x: 0, y: 0 }; return; }
    }
    let dNext;
    if (e.dir.x > 0)      dNext = (e.x < cx ? cx : cx + T) - e.x;
    else if (e.dir.x < 0) dNext = e.x - (e.x > cx ? cx : cx - T);
    else if (e.dir.y > 0) dNext = (e.y < cy ? cy : cy + T) - e.y;
    else if (e.dir.y < 0) dNext = e.y - (e.y > cy ? cy : cy - T);
    else return;
    if (dNext <= 0.0001) dNext = 0.0001;
    const step = Math.min(dist, dNext);
    e.x += e.dir.x * step; e.y += e.dir.y * step;
    dist -= step;
    // tunnel wrap
    if (Math.floor(e.y / T) === TUNNEL_ROW) {
      if (e.x < -T / 2) e.x += (COLS + 1) * T;
      else if (e.x > W + T / 2) e.x -= (COLS + 1) * T;
    }
  }
}
// ---------- game flow ----------
function resetPositions() {
  for (const p of [p1, p2]) {
    p.x = p.spawnX * T + T / 2; p.y = p.spawnY * T + T / 2;
    p.dir = { x: 0, y: 0 }; p.want = { x: 0, y: 0 };
    p.rollT = 0; p.fireCd = 0;
    p.ammo = Math.max(p.ammo, 25);
  }
  bots = BOT_DEFS.map((d, i) => makeBot(d, i));
  projectiles = []; frightT = 0; chain = 0; setHum(false);
}
function newGame() {
  score = 0; lives = 3; wave = 1; bank = 0;
  p1.ammo = 25; p2.ammo = 25;
  loadPellets(); resetPositions();
  state = 'playing'; stateT = 0; timeScale = 1;
}
function nextWave() {
  wave++; loadPellets(); resetPositions();
  state = 'playing'; stateT = 0;
  showToast('WAVE ' + wave);
}
function showToast(s) { toast = s; toastT = 1.6; }
function startFright() {
  const wasActive = frightT > 0;
  frightT = Math.max(3.5, 8 - (wave - 1) * 0.5);
  if (!wasActive) chain = 0;
  setHum(true); sfxHyper();
}
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random() * 0.7) * (spd || 130);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.45 + Math.random() * 0.3, t: 0, color, r: 1.5 + Math.random() * 2.2 });
  }
}
function destroyBot(b) {
  const pts = [200, 400, 800, 1600][Math.min(chain, 3)];
  score += pts; chain++;
  burst(b.x, b.y, b.color, 26, 170);
  shockwaves.push({ x: b.x, y: b.y, r: 4, t: 0 });
  sfxDestroy(chain - 1);
  floating.push({ x: b.x, y: b.y - 10, text: '' + pts, t: 0, color: '#bfeaff' });
  sendBotHome(b, 3.2);
}
function sendBotHome(b, delay) {
  const others = bots.filter(o => o !== b && o.state === 'base').length;
  const home = BASE_TILES[(BOT_DEFS.findIndex(d => d.name === b.name) + others) % BASE_TILES.length] || BASE_TILES[1];
  b.x = home.x * T + T / 2; b.y = home.y * T + T / 2;
  b.dir = { x: 0, y: -1 }; b.state = 'base'; b.waitT = delay; b.stunT = 0;
}
let floating = [];
function playerDie(p) {
  sfxDeath(); burst(p.x, p.y, p.color, 30, 160);
  flashA = 0.5; flashColor = '255,60,60'; shake = 7;
  lives--;
  if (lives <= 0) { state = 'gameover'; stateT = 0; setHum(false); }
  else { state = 'dying'; stateT = 0; timeScale = 0.22; }
}

// ---------- combat ----------
function tryFire(p) {
  if (state !== 'playing' || p.fireCd > 0) return;
  if (p.ammo <= 0) { tone(160, 0.06, 'square', 0.04); p.fireCd = 0.18; return; }
  const d = (p.dir.x !== 0 || p.dir.y !== 0) ? p.dir : (p.want.x !== 0 || p.want.y !== 0 ? p.want : DIRS.right);
  p.ammo--; p.fireCd = 0.17; p.muzzle = 0.06;
  projectiles.push({ x: p.x + d.x * 12, y: p.y + d.y * 12, dx: d.x, dy: d.y, owner: p });
  sfxLaser();
}
function tryRoll(p) {
  if (state !== 'playing' || p.rollCd > 0 || p.rollT > 0) return;
  if (p.dir.x === 0 && p.dir.y === 0) {
    if (p.want.x === 0 && p.want.y === 0) return;
    p.dir = { x: p.want.x, y: p.want.y };
  }
  p.rollT = 0.3; p.rollCd = 0.85; sfxRoll();
  burst(p.x, p.y, 'rgba(160,220,255,0.8)', 6, 60);
}
function tryEmp(p) {
  if (state !== 'playing') return;
  if (bank < 50) { tone(140, 0.08, 'square', 0.045); showToast('EMP NEEDS 50 PELLETS — BANK: ' + bank); return; }
  bank -= 50; sfxEmp();
  shockwaves.push({ x: p.x, y: p.y, r: 4, t: 0, big: true });
  flashA = Math.max(flashA, 0.3); flashColor = '255,230,140';
  const R = 5.5 * T;
  for (const b of bots) {
    if (b.state !== 'chase' && b.state !== 'exit') continue;
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d <= R) {
      if (frightT > 0) destroyBot(b);
      else { b.stunT = Math.max(b.stunT, 3); burst(b.x, b.y, '#ffe066', 10, 110); }
    }
  }
}
function updateProjectiles(dt) {
  const step = 330 * dt;
  for (const pr of projectiles) {
    let alive = true, remaining = step, guard = 0;
    while (alive && remaining > 0 && guard++ < 6) {
      const s = Math.min(remaining, 4);
      pr.x += pr.dx * s; pr.y += pr.dy * s; remaining -= s;
      const tx = Math.floor(pr.x / T), ty = Math.floor(pr.y / T);
      if (!walkable(tx, ty, false)) { burst(pr.x, pr.y, '#9adcff', 4, 60); alive = false; break; }
      for (const b of bots) {
        if (b.state !== 'chase' && b.state !== 'exit') continue;
        if (Math.hypot(b.x - pr.x, b.y - pr.y) < T * 0.52) {
          if (b.stunT <= 0) {
            if (frightT > 0) destroyBot(b);
            else { b.stunT = 2; sfxStun(); burst(b.x, b.y, '#ffe066', 10, 100); }
          }
          alive = false; break;
        }
      }
    }
    pr.dead = !alive;
    if (pr.x < -8 || pr.x > W + 8 || pr.y < -8 || pr.y > ROWS * T + 8) pr.dead = true;
  }
  projectiles = projectiles.filter(pr => !pr.dead);
}

// ---------- per-frame update ----------
function updatePlayer(p, dt) {
  p.fireCd = Math.max(0, p.fireCd - dt);

  KeyA: DIRS.left, ArrowLeft: DIRS.left, KeyD: DIRS.right, ArrowRight: DIRS.right
};
const P2_KEYS = { Numpad8: DIRS.up, Numpad2: DIRS.down, Numpad4: DIRS.left, Numpad6: DIRS.right };
function joinP2() {
  if (!p2.active) {
    p2.active = true;
    p2.x = p2.spawnX * T + T / 2; p2.y = p2.spawnY * T + T / 2;
    showToast('P2 JOINED!');
  }
}
function startFromMenu() {
  initAudio();
  if (state === 'title' || state === 'gameover') newGame();
}
window.addEventListener('keydown', e => {
  initAudio();
  const c = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(c)) e.preventDefault();
  if (c === 'Enter' || c === 'Space') { startFromMenu(); return; }
  if (c === 'KeyR' && (state === 'gameover' || state === 'playing')) { newGame(); return; }
  if (P1_KEYS[c]) { if (!e.repeat) pushDir(heldDirs.p1, P1_KEYS[c]); return; }
  if (P2_KEYS[c]) { joinP2(); if (!e.repeat) pushDir(heldDirs.p2, P2_KEYS[c]); return; }
  if (c === 'KeyJ' || c === 'KeyZ') { p1.fireHeld = true; tryFire(p1); }
  else if (c === 'KeyK' || c === 'KeyX') { if (!e.repeat) tryRoll(p1); }
  else if (c === 'KeyL' || c === 'KeyC') { if (!e.repeat) tryEmp(p1); }
  else if (c === 'Numpad1') { joinP2(); p2.fireHeld = true; tryFire(p2); }
  else if (c === 'Numpad3') { joinP2(); if (!e.repeat) tryRoll(p2); }
  else if (c === 'Numpad0') { joinP2(); if (!e.repeat) tryEmp(p2); }
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (P1_KEYS[c]) popDir(heldDirs.p1, P1_KEYS[c]);
  if (P2_KEYS[c]) popDir(heldDirs.p2, P2_KEYS[c]);
  if (c === 'KeyJ' || c === 'KeyZ') p1.fireHeld = false;
  if (c === 'Numpad1') p2.fireHeld = false;
});

// ---------- input: gamepad (P1) ----------
let padPrev = [];
function pollGamepad() {
  let gp = null;
  try { const pads = navigator.getGamepads ? navigator.getGamepads() : []; for (const p of pads) if (p && p.connected) { gp = p; break; } } catch (e) {}
  if (!gp) return;
  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  let d = null;
  if (btn(14) || ax < -0.45) d = DIRS.left;
  else if (btn(15) || ax > 0.45) d = DIRS.right;
  else if (btn(12) || ay < -0.45) d = DIRS.up;
  else if (btn(13) || ay > 0.45) d = DIRS.down;
  if (d) { if (!padPrev.d || padPrev.d !== d) pushDir(heldDirs.p1, d); }
  else if (padPrev.d) { popDir(heldDirs.p1, padPrev.d); }
  padPrev.d = d;
  if (btn(0)) { p1.fireHeld = true; tryFire(p1); } else p1.fireHeld = false;
  if (btn(1) && !padPrev[1]) tryRoll(p1);
  if (btn(2) && !padPrev[2]) tryEmp(p1);
  if ((btn(9) || btn(3)) && !padPrev[9]) startFromMenu();
  padPrev[1] = btn(1); padPrev[2] = btn(2); padPrev[9] = btn(9) || btn(3);
}

// ---------- input: touch (floating stick + buttons) ----------
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('stickKnob');
const wrapEl = document.getElementById('wrap');
let joyId = null, joyCx = 0, joyCy = 0;
function wrapPos(e) {
  const r = wrapEl.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height };
}
wrapEl.addEventListener('pointerdown', e => {
  initAudio();
  const p = wrapPos(e);
  if (state === 'title' || state === 'gameover') { startFromMenu(); return; }
  if (p.x < p.w * 0.55 && joyId === null) {
    joyId = e.pointerId; joyCx = p.x; joyCy = p.y;
    stickEl.style.display = 'block';
    stickEl.style.left = (p.x - 52) + 'px'; stickEl.style.top = (p.y - 52) + 'px';
    knobEl.style.left = '29px'; knobEl.style.top = '29px';
  }
});
wrapEl.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  const p = wrapPos(e);
  let dx = p.x - joyCx, dy = p.y - joyCy;
  const len = Math.hypot(dx, dy);
  if (len > 34) { dx = dx / len * 34; dy = dy / len * 34; }
  knobEl.style.left = (29 + dx) + 'px'; knobEl.style.top = (29 + dy) + 'px';
  if (len > 13) {
    const d = Math.abs(p.x - joyCx) > Math.abs(p.y - joyCy)
      ? (p.x > joyCx ? DIRS.right : DIRS.left)
      : (p.y > joyCy ? DIRS.down : DIRS.up);
    if (!heldDirs.p1.length || heldDirs.p1[heldDirs.p1.length - 1] !== d) {
      heldDirs.p1 = [d]; applyWants();
    }
  }
});
function joyEnd(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; stickEl.style.display = 'none';
  heldDirs.p1 = []; applyWants();
}
wrapEl.addEventListener('pointerup', joyEnd);
wrapEl.addEventListener('pointercancel', joyEnd);
function bindBtn(id, down, up) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); initAudio(); down(); });
  if (up) {
    el.addEventListener('pointerup', e => { e.stopPropagation(); up(); });
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }
}
bindBtn('btnFire', () => { if (state === 'title' || state === 'gameover') { startFromMenu(); return; } p1.fireHeld = true; tryFire(p1); }, () => { p1.fireHeld = false; });
bindBtn('btnRoll', () => { if (state === 'playing') tryRoll(p1); });
bindBtn('btnEmp', () => { if (state === 'playing') tryEmp(p1); });

// ---------- viewport sizing: canvas fills the whole phone screen ----------
function resize() {
  DPRF = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPRF);
  cv.height = Math.round(VH * DPRF);
  cv.style.width = VW + 'px';
  cv.style.height = VH + 'px';
  // square tiles: fill the width, take as much height as the grid allows
  viewS = Math.min(VW / W, VH / MH);
  viewOX = (VW - W * viewS) / 2;
  viewOY = (VH - MH * viewS) / 2;
  setScreenTransform();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// ---------- boot + main loop ----------
loadPellets();
bots = BOT_DEFS.map((d, i) => makeBot(d, i));
resize();
requestAnimationFrame(() => resize());
window.__dbg = {
  get state() { return state; },
  get score() { return score; },
  get lives() { return lives; },
  get wave() { return wave; },
  get bank() { return bank; },
  get pelletsLeft() { return pellets.size; },
  get fright() { return frightT; },
  get p1() { return { x: p1.x, y: p1.y, tx: Math.floor(p1.x / T), ty: Math.floor(p1.y / T), ammo: p1.ammo, active: p1.active }; },
  get p2() { return { active: p2.active, x: p2.x, y: p2.y }; },
  get bots() { return bots.map(b => ({ name: b.name, x: b.x, y: b.y, state: b.state, stun: b.stunT })); },
  get projectiles() { return projectiles.length; },
  get view() { return { vw: VW, vh: VH, scale: viewS, ox: viewOX, oy: viewOY, mazePxW: W * viewS, mazePxH: MH * viewS, canvasW: cv.width, canvasH: cv.height }; },
  start: () => newGame(),
  fire: () => tryFire(p1),
  emp: () => tryEmp(p1)
};
let lastTs = 0;
function frame(ts) {
  const rawDt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  pollGamepad();
  update(rawDt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
