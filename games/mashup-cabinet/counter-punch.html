<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>COUNTERPUNCH! — Punch-Out × Breakout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100dvh;
    background:#0a0618;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:'Courier New', ui-monospace, monospace;
  }
  #game {
    position:fixed; inset:0;
    width:100vw; height:100dvh;
    display:block;
  }
  /* --- touch controls: overlaid on the game, bottom corners --- */
  .tbtn {
    position:fixed; z-index:10;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    color:#fff; font-weight:bold; font-family:'Courier New', monospace;
    background:rgba(30,16,70,.48);
    box-shadow:0 4px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
    backdrop-filter:blur(2px);
    touch-action:none; cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .tbtn.on { background:rgba(255,210,63,.8); color:#241448; }
  #btnL  { left:12px;   bottom:calc(16px + env(safe-area-inset-bottom)); width:66px; height:66px; font-size:26px; }
  #btnR  { left:90px;   bottom:calc(16px + env(safe-area-inset-bottom)); width:66px; height:66px; font-size:26px; }
  #btnPL { right:164px; bottom:calc(22px + env(safe-area-inset-bottom)); width:62px; height:62px; font-size:20px; background:rgba(58,134,255,.5); }
  #btnPR { right:90px;  bottom:calc(22px + env(safe-area-inset-bottom)); width:62px; height:62px; font-size:20px; background:rgba(255,71,87,.5); }
  #btnPS { right:12px;  bottom:calc(18px + env(safe-area-inset-bottom)); width:72px; height:72px; font-size:15px; background:rgba(255,170,0,.5); }
  .tbtn small { font-size:9px; display:block; text-align:center; line-height:1; }
  #touchUI { display:none; }
  body.touch #touchUI { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touchUI">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnPL">L</div>
  <div class="tbtn" id="btnPR">R</div>
  <div class="tbtn" id="btnPS">★<small>STAR</small></div>
</div>
<script>
'use strict';
/* ============================================================
   COUNTERPUNCH! — Punch-Out × Breakout mashup (original chars)
   Boss: "BRUNO 'THE ANVIL' KOVAC" — heavyweight champ.
   Player: the challenger, seen from behind.
   FULL-SCREEN mobile layout: the logical play space IS the
   viewport (CSS pixels); the arena stretches to fill it.
   Your gloves are the paddle. Punch the orb, break his guard,
   clear every armor brick before the 99-second bell.
   ============================================================ */
(function(){
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

/* ---------- dynamic layout: logical size = viewport size ---------- */
let LW = 390, LH = 844;            // logical (CSS px) play space
let S = 1;                          // sprite/font scale vs the 420-wide design
let BASE_Y = 700;                   // player baseline (set by layout)
const ROWS = 3, COLS = 7;
let BW = 52, BH = 20; const BGAP = 5;
let BRICKS_X0 = 10, BRICK_TOP = 176;
const ROW_HP = [3, 2, 1];
const ROW_COLORS = ['#ff4757', '#ffa502', '#2ed573'];
const GUARD_Y = 112;                // orb bounces off the boss's guard line

function layout(){
  LW = window.innerWidth; LH = window.innerHeight;
  S = Math.max(0.78, Math.min(1.35, LW / 420));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(LW * dpr);
  cv.height = Math.round(LH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  BASE_Y = LH - Math.round(104 * S) - 8;
  const rowW = Math.min(LW - 20, 470 * S);
  BW = (rowW - (COLS - 1) * BGAP) / COLS;
  BH = Math.round(21 * S);
  BRICKS_X0 = (LW - rowW) / 2;
  BRICK_TOP = Math.round(178 * S);
  for (const b of bricks){
    b.x = BRICKS_X0 + b.col * (BW + BGAP);
    b.y = BRICK_TOP + b.row * (BH + BGAP);
    b.w = BW; b.h = BH;
  }
  boxer.x = Math.max(40, Math.min(LW - 40, boxer.x));
  orb.x = Math.max(orb.r + 6, Math.min(LW - orb.r - 6, orb.x));
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 60));

/* ---------- audio: fully synthesized, iOS-safe ---------- */
let AC = null, master = null;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    if (window.navigator && navigator.audioSession) {
      try { navigator.audioSession.type = 'playback'; } catch(e){}
    }
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    const buf = AC.createBuffer(1, 1, AC.sampleRate);
    const src = AC.createBufferSource(); src.buffer = buf; src.connect(master); src.start(0);
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ AC = null; }
}
function beep(freq, dur, type, vol, slideTo, delay){
  if (!AC || !master) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, freq, delay){
  if (!AC || !master) return;
  const t0 = AC.currentTime + (delay || 0);
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
  const g = AC.createGain(); g.gain.value = vol || 0.25;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0);
}
const SFX = {
  whoosh(){ noise(0.09, 0.20, 900); },
  bounce(combo){ beep(300 + Math.min(combo, 12) * 40, 0.07, 'square', 0.12); },
  parry(combo){ beep(420 + Math.min(combo, 12) * 45, 0.09, 'square', 0.18); noise(0.05, 0.12, 2400); },
  crack(){ noise(0.12, 0.30, 700); beep(160, 0.10, 'sawtooth', 0.15, 60); },
  brickHit(){ beep(220, 0.05, 'square', 0.12); },
  zap(){ beep(1400, 0.25, 'sawtooth', 0.16, 120); noise(0.2, 0.10, 3000); },
  tele(){ beep(880, 0.08, 'square', 0.10); beep(880, 0.08, 'square', 0.10, null, 0.14); },
  hurt(){ beep(200, 0.3, 'sawtooth', 0.22, 50); noise(0.2, 0.2, 400); },
  starReady(){ [660, 880, 1320].forEach((f, i) => beep(f, 0.09, 'square', 0.14, null, i * 0.07)); },
  starFire(){ noise(0.3, 0.25, 500); beep(300, 0.3, 'sawtooth', 0.15, 1200); },
  fanfare(){ [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, 0.16, 'square', 0.16, null, i * 0.13)); },
  lose(){ [392, 330, 262, 196].forEach((f, i) => beep(f, 0.22, 'triangle', 0.18, null, i * 0.18)); },
  bell(){ beep(1568, 0.4, 'sine', 0.2); beep(1568, 0.4, 'sine', 0.15, null, 0.15); }
};
['pointerdown', 'touchend'].forEach(ev =>
  window.addEventListener(ev, audioInit, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && AC && AC.state === 'suspended') AC.resume();
});

/* ---------- game state ---------- */
let state = 'title';              // title | playing | win | lose
let paused = false;
let score = 0, combo = 0, bestCombo = 0, hearts = 3;
let superHits = 0;
let timeLeft = 99, shake = 0, flashT = 0, hitStop = 0;
let bricks = [], particles = [], texts = [];
let laser = null;
let laserTimer = 6.0, invulnT = 0, serveT = 0, elapsed = 0;

const boxer = { x: 210, w: 64, speed: 360, punchT: 0, punchSide: 0, punchCD: 0, punchLive: false, face: 0 };
const orb   = { x: 210, y: 300, vx: 120, vy: 230, r: 9, speed: 320, active: false };
let fireball = null;

function buildBricks(){
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ col: c, row: r, x: 0, y: 0, w: BW, h: BH,
                    hp: ROW_HP[r], max: ROW_HP[r], alive: true });
  layout();
}
function resetGame(){
  score = 0; combo = 0; bestCombo = 0; hearts = 3; superHits = 0;
  timeLeft = 99; shake = 0; flashT = 0; hitStop = 0;
  particles = []; texts = []; laser = null; laserTimer = 6.0;
  invulnT = 0; fireball = null; elapsed = 0;
  boxer.x = LW / 2; boxer.punchT = 0; boxer.punchCD = 0; boxer.punchLive = false;
  buildBricks();
  serveOrb(1.0);
}
function serveOrb(delay){
  orb.active = false; serveT = delay || 0;
  orb.x = LW / 2; orb.y = BRICK_TOP + (BH + BGAP) * ROWS + 26; orb.speed = 320;
  const a = (Math.random() * 0.6 + 0.35) * (Math.random() < 0.5 ? -1 : 1);
  orb.vx = orb.speed * a * 0.6;
  orb.vy = orb.speed * 0.8;
}
function startGame(){
  audioInit();
  resetGame();
  state = 'playing'; paused = false;
  SFX.bell();
}

/* ---------- particles / floating text ---------- */
function burst(x, y, color, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 160);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
                     life: 0.5 + Math.random() * 0.3, t: 0, color, sz: 2 + Math.random() * 3 });
  }
}
function floatText(x, y, str, color){ texts.push({ x, y, str, color: color || '#fff', t: 0, life: 0.9 }); }

/* ---------- input: keyboard ---------- */
const keys = {};
const GAME_KEYS = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyZ','KeyX','KeyC','KeyP','KeyR'];
window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  audioInit();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyP' && state === 'playing') paused = !paused;
  if (e.code === 'KeyR' && (state === 'win' || state === 'lose')) startGame();
  if (state === 'title' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX')) startGame();
  else if ((state === 'win' || state === 'lose') && (e.code === 'Enter' || e.code === 'Space')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- input: touch (PointerEvent buttons) ---------- */
const touch = { left: false, right: false };
let touchSeen = false;
function bindBtn(id, down, up){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); audioInit(); touchSeen = true; document.body.classList.add('touch'); el.classList.add('on'); down(); };
  const off = e => { e.preventDefault(); el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('btnL', () => { touch.left = true; }, () => { touch.left = false; });
bindBtn('btnR', () => { touch.right = true; }, () => { touch.right = false; });
bindBtn('btnPL', () => { tapAny(); tryPunch(-1); });
bindBtn('btnPR', () => { tapAny(); tryPunch(1); });
bindBtn('btnPS', () => { tapAny(); tryStar(); });
cv.addEventListener('pointerdown', () => { audioInit(); tapAny(); });
function tapAny(){
  if (state === 'title') startGame();
  else if (state === 'win' || state === 'lose') startGame();
}
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
  document.body.classList.add('touch');
}

/* ---------- input: gamepad (W3C standard mapping, bonus) ---------- */
const padPrev = [false, false, false, false, false, false, false, false, false, false];
function pollPad(dt){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let p = null;
  for (const g of pads) if (g && g.connected) { p = g; break; }
  if (!p) return;
  const ax = p.axes && p.axes.length ? p.axes[0] : 0;
  const left  = (p.buttons[14] && p.buttons[14].pressed) || ax < -0.35;
  const right = (p.buttons[15] && p.buttons[15].pressed) || ax > 0.35;
  if (left)  boxer.x -= boxer.speed * dt;
  if (right) boxer.x += boxer.speed * dt;
  const b = [0, 1, 2].map(i => !!(p.buttons[i] && p.buttons[i].pressed));
  if (b[0] && !padPrev[0]) { tapAny(); tryPunch(-1); }
  if (b[1] && !padPrev[1]) { tapAny(); tryPunch(1); }
  if (b[2] && !padPrev[2]) { tapAny(); tryStar(); }
  const start = !!(p.buttons[9] && p.buttons[9].pressed);
  if (start && !padPrev[9] && state === 'playing') paused = !paused;
  padPrev[0] = b[0]; padPrev[1] = b[1]; padPrev[2] = b[2]; padPrev[9] = start;
}

/* ---------- combat ---------- */
function punchConnect(side){
  const gx = boxer.x + side * 30 * S, gy = BASE_Y - 58 * S;
  const dx = orb.x - gx, dy = orb.y - gy;
  if (!(orb.active && Math.abs(dx) < 54 * S + 8 && Math.abs(dy) < 50 * S + 6 && orb.vy > -40)) return false;
  orb.speed = Math.min(orb.speed + 14, 580);
  if (side < 0){ // Left Hook: diagonal up-left
    orb.vy = -orb.speed * 0.82;
    orb.vx = -orb.speed * (0.45 + Math.random() * 0.25);
  } else {      // Right Straight: straight up, fast
    orb.vy = -orb.speed * 1.08;
    orb.vx = orb.vx * 0.15;
  }
  orb.y = gy - 34 * S;
  combo++; bestCombo = Math.max(bestCombo, combo);
  if (superHits < 5){
    superHits++;
    if (superHits === 5) SFX.starReady(); else SFX.parry(combo);
  } else SFX.parry(combo);
  burst(orb.x, orb.y, '#ffd23f', 10, 200);
  floatText(orb.x, orb.y - 24, combo > 1 ? 'x' + combo : 'PARRY!', '#ffd23f');
  shake = Math.max(shake, 3);
  return true;
}
function tryPunch(side){
  if (state !== 'playing' || paused) return;
  if (boxer.punchCD > 0) return;
  boxer.punchT = 0.12; boxer.punchSide = side; boxer.punchCD = 0.22; boxer.face = side;
  SFX.whoosh();
  // instant connect if the orb is already in the glove zone; otherwise the
  // swing stays "live" for its 120ms and connects as the orb enters the zone
  boxer.punchLive = !punchConnect(side);
}
function tryStar(){
  if (state !== 'playing' || paused) return;
  if (superHits < 5 || fireball) return;
  superHits = 0;
  fireball = { x: boxer.x, y: BASE_Y - 70 * S, vy: -660, hits: 0 };
  SFX.starFire();
  floatText(boxer.x, BASE_Y - 120 * S, 'STAR UPPER!', '#ffb300');
  shake = Math.max(shake, 5);
}
function loseHeart(reason){
  hearts--;
  combo = 0; superHits = 0;
  flashT = 0.25; shake = Math.max(shake, 9);
  SFX.hurt();
  floatText(boxer.x, BASE_Y - 140 * S, reason || 'HIT!', '#ff4757');
  if (hearts <= 0){ state = 'lose'; SFX.lose(); }
}
function damageBrick(b, dmg){
  b.hp -= dmg;
  if (b.hp <= 0 && b.alive){
    b.alive = false;
    const pts = (4 - b.row) * 50 * Math.max(1, combo);
    score += pts;
    SFX.crack();
    burst(b.x + b.w / 2, b.y + b.h / 2, ROW_COLORS[b.row], 14, 220);
    floatText(b.x + b.w / 2, b.y, '+' + pts, '#fff');
    shake = Math.max(shake, 4);
    if (bricks.every(k => !k.alive)){ state = 'win'; SFX.fanfare(); SFX.bell(); }
  } else {
    SFX.brickHit();
    burst(b.x + b.w / 2, b.y + b.h / 2, '#ffffff', 4, 120);
  }
}

/* ---------- update ---------- */
function update(dt){
  elapsed += dt;
  if (flashT > 0) flashT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i]; p.t += dt;
    if (p.t >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
  }
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i]; t.t += dt; t.y -= 34 * dt;
    if (t.t >= t.life) texts.splice(i, 1);
  }
  if (state !== 'playing' || paused) return;
  if (hitStop > 0){ hitStop -= dt; return; }

  timeLeft -= dt;
  if (timeLeft <= 0){
    timeLeft = 0;
    if (bricks.some(b => b.alive)){ state = 'lose'; SFX.lose(); }
    return;
  }
  if (invulnT > 0) invulnT -= dt;
  if (boxer.punchT > 0){
    boxer.punchT -= dt;
    if (boxer.punchLive && boxer.punchT > 0 && punchConnect(boxer.punchSide)) boxer.punchLive = false;
    if (boxer.punchT <= 0) boxer.punchLive = false;
  }
  if (boxer.punchCD > 0) boxer.punchCD -= dt;

  let mv = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || touch.left) mv -= 1;
  if (keys['ArrowRight'] || keys['KeyD'] || touch.right) mv += 1;
  if (mv) { boxer.x += mv * boxer.speed * dt; boxer.face = mv; }
  pollPad(dt);
  boxer.x = Math.max(40, Math.min(LW - 40, boxer.x));
  if (keys['KeyZ']) tryPunch(-1);
  if (keys['KeyX']) tryPunch(1);
  if (keys['KeyC']) tryStar();

  if (!orb.active){
    serveT -= dt;
    if (serveT <= 0) orb.active = true;
  }

  if (orb.active){
    orb.x += orb.vx * dt; orb.y += orb.vy * dt;
    if (orb.x < orb.r + 6){ orb.x = orb.r + 6; orb.vx = Math.abs(orb.vx); SFX.bounce(combo); }
    if (orb.x > LW - orb.r - 6){ orb.x = LW - orb.r - 6; orb.vx = -Math.abs(orb.vx); SFX.bounce(combo); }
    if (orb.y < GUARD_Y){ orb.y = GUARD_Y; orb.vy = Math.abs(orb.vy); SFX.bounce(combo); }
    for (const b of bricks){
      if (!b.alive) continue;
      if (orb.x + orb.r > b.x && orb.x - orb.r < b.x + b.w &&
          orb.y + orb.r > b.y && orb.y - orb.r < b.y + b.h){
        const overlapX = Math.min(orb.x + orb.r - b.x, b.x + b.w - (orb.x - orb.r));
        const overlapY = Math.min(orb.y + orb.r - b.y, b.y + b.h - (orb.y - orb.r));
        if (overlapX < overlapY) orb.vx = (orb.x < b.x + b.w / 2) ? -Math.abs(orb.vx) : Math.abs(orb.vx);
        else orb.vy = (orb.y < b.y + b.h / 2) ? -Math.abs(orb.vy) : Math.abs(orb.vy);
        damageBrick(b, 1);
        hitStop = 0.03;
        break;
      }
    }
    if (orb.y - orb.r > BASE_Y + 26){
      loseHeart('ORB LOST!');
      if (state === 'playing') serveOrb(0.9);
    }
  }

  if (fireball){
    fireball.y += fireball.vy * dt;
    burst(fireball.x, fireball.y + 8, '#ff9f43', 2, 60);
    for (const b of bricks){
      if (!b.alive) continue;
      if (Math.abs(fireball.x - (b.x + b.w / 2)) < b.w / 2 + 8 &&
          Math.abs(fireball.y - (b.y + b.h / 2)) < b.h / 2 + 10){
        damageBrick(b, 99);
        fireball.hits++;
        if (fireball.hits >= 3){ fireball = null; break; }
      }
    }
    if (fireball && fireball.y < GUARD_Y) fireball = null;
  }

  laserTimer -= dt;
  if (!laser && laserTimer <= 0){
    laser = { phase: 'tele', t: 0.75, x: Math.max(30, Math.min(LW - 30, boxer.x + (Math.random() * 160 - 80))) };
    SFX.tele();
  }
  if (laser){
    laser.t -= dt;
    if (laser.phase === 'tele' && laser.t <= 0){
      laser.phase = 'fire'; laser.t = 0.38; SFX.zap(); shake = Math.max(shake, 4);
    } else if (laser.phase === 'fire'){
      if (invulnT <= 0 && Math.abs(boxer.x - laser.x) < 26){
        invulnT = 1.2;
        loseHeart('ZAPPED!');
      }
      if (laser.t <= 0){ laser = null; laserTimer = 4.2 + Math.random() * 2.4; }
    }
  }
}

/* ---------- drawing: rich gradients, glow, depth (no scanlines) ---------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0){ r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
}

function drawBG(){
  // arena backdrop: deep violet gradient with a warm spotlight on the boss
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#241047'); g.addColorStop(0.45, '#2e1460'); g.addColorStop(1, '#150a30');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  const spot = ctx.createRadialGradient(LW/2, 120 * S, 10, LW/2, 130 * S, LW * 0.75);
  spot.addColorStop(0, 'rgba(255,190,90,0.28)');
  spot.addColorStop(0.5, 'rgba(160,90,255,0.10)');
  spot.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = spot; ctx.fillRect(0, 0, LW, LH);
  // light beams from the top corners
  ctx.fillStyle = 'rgba(255,225,160,0.05)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(LW * 0.34, 0); ctx.lineTo(LW * 0.62, LH * 0.55); ctx.lineTo(LW * 0.18, LH * 0.55); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(LW, 0); ctx.lineTo(LW * 0.66, 0); ctx.lineTo(LW * 0.82, LH * 0.55); ctx.lineTo(LW * 0.38, LH * 0.55); ctx.closePath(); ctx.fill();
  // crowd bokeh
  for (let i = 0; i < 46; i++){
    const cx = (i * 97) % LW, cy = 6 + ((i * 53) % Math.max(50, LH * 0.09));
    const a = 0.04 + ((i * 29) % 10) / 130;
    ctx.fillStyle = 'rgba(255,220,180,' + a + ')';
    ctx.beginPath(); ctx.arc(cx, cy, 5 + (i % 4), 0, Math.PI * 2); ctx.fill();
  }
  // ring floor with reflective sheen
  const floorY = BASE_Y - 96 * S;
  const fg = ctx.createLinearGradient(0, floorY, 0, LH);
  fg.addColorStop(0, '#4a2396'); fg.addColorStop(0.12, '#3c1a78'); fg.addColorStop(1, '#1d0c40');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, LW, LH - floorY);
  ctx.fillStyle = 'rgba(140,200,255,0.35)'; ctx.fillRect(0, floorY, LW, 2);
  ctx.strokeStyle = 'rgba(160,210,255,0.20)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(LW/2, BASE_Y - 12 * S, LW * 0.38, 30 * S, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(160,210,255,0.10)';
  ctx.beginPath(); ctx.ellipse(LW/2, BASE_Y - 12 * S, LW * 0.26, 19 * S, 0, 0, Math.PI * 2); ctx.stroke();
  // baseline
  const bg2 = ctx.createLinearGradient(0, 0, LW, 0);
  bg2.addColorStop(0, 'rgba(255,210,63,0)');
  bg2.addColorStop(0.5, 'rgba(255,210,63,0.75)');
  bg2.addColorStop(1, 'rgba(255,210,63,0)');
  ctx.fillStyle = bg2; ctx.fillRect(6, BASE_Y + 26, LW - 12, 3);
}

function drawBoss(){
  const cx = LW / 2, bob = Math.sin(elapsed * 2) * 3;
  ctx.save(); ctx.translate(cx, 118 * S + bob); ctx.scale(S, S);
  // floor shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, 48, 78, 11, 0, 0, Math.PI * 2); ctx.fill();
  // torso with vertical shading
  const tg = ctx.createLinearGradient(-64, 0, 64, 0);
  tg.addColorStop(0, '#5f2a20'); tg.addColorStop(0.5, '#8a4636'); tg.addColorStop(1, '#5f2a20');
  ctx.fillStyle = tg; rr(-64, -18, 128, 62, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; rr(-64, -18, 128, 24, 22); ctx.fill();
  // championship belt
  const belt = ctx.createLinearGradient(-64, 0, 64, 0);
  belt.addColorStop(0, '#c9930a'); belt.addColorStop(0.5, '#ffe66d'); belt.addColorStop(1, '#c9930a');
  ctx.fillStyle = belt; ctx.fillRect(-64, 30, 128, 11);
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(0, 35, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9930a'; ctx.beginPath(); ctx.arc(0, 35, 6, 0, Math.PI * 2); ctx.fill();
  // head
  const hg = ctx.createRadialGradient(-8, -46, 4, 0, -38, 30);
  hg.addColorStop(0, '#f4c491'); hg.addColorStop(1, '#d18a58');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, -38, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2e1a10'; ctx.fillRect(-26, -63, 52, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.13)'; ctx.fillRect(-26, -63, 52, 4);
  // scowl
  ctx.strokeStyle = '#2e1a10'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -44); ctx.lineTo(-5, -40); ctx.moveTo(16, -44); ctx.lineTo(5, -40); ctx.stroke();
  ctx.fillStyle = '#2e1a10'; ctx.fillRect(-4, -38, 3, 3); ctx.fillRect(3, -38, 3, 3);
  ctx.beginPath(); ctx.arc(0, -22, 7, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  // guard gloves
  const glove = (gx, gy, base, hi) => {
    const gg = ctx.createRadialGradient(gx - 5, gy - 6, 3, gx, gy, 19);
    gg.addColorStop(0, hi); gg.addColorStop(1, base);
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(gx, gy, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f5f0e6'; ctx.fillRect(gx - 8, gy + 11, 16, 5);
  };
  glove(-76, 16, '#a93226', '#ec7063');
  glove(76, 16, '#a93226', '#ec7063');
  ctx.restore();
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold ' + Math.round(14 * S) + 'px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(255,180,0,0.65)'; ctx.shadowBlur = 12;
  ctx.fillText('BRUNO "THE ANVIL" KOVAC', LW / 2, Math.round(40 * S) + 6);
  ctx.shadowBlur = 0;
}

function drawBricks(){
  for (const b of bricks){
    if (!b.alive) continue;
    const base = ROW_COLORS[b.row];
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, shade(base, 0.28));
    g.addColorStop(0.45, base);
    g.addColorStop(1, shade(base, -0.30));
    ctx.fillStyle = g; rr(b.x, b.y, b.w, b.h, 5); ctx.fill();
    // glossy top strip, brighter at full HP
    ctx.fillStyle = 'rgba(255,255,255,' + (0.14 + 0.16 * (b.hp / b.max)) + ')';
    rr(b.x + 3, b.y + 2, b.w - 6, Math.max(3, b.h * 0.3), 3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; rr(b.x, b.y, b.w, b.h, 5); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(b.x + 5, b.y + b.h - 6, 3, 3); ctx.fillRect(b.x + b.w - 8, b.y + b.h - 6, 3, 3);
    if (b.hp < b.max){
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w * 0.3, b.y + 2); ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
      if (b.hp === 1){ ctx.lineTo(b.x + b.w * 0.35, b.y + b.h - 2); ctx.moveTo(b.x + b.w * 0.6, b.y + 3); ctx.lineTo(b.x + b.w * 0.52, b.y + b.h - 3); }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = 'bold ' + Math.round(11 * S) + 'px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText(String(b.hp), b.x + b.w / 2, b.y + b.h / 2 + 4);
  }
}

function drawBoxer(){
  const x = boxer.x, y = BASE_Y;
  const blink = invulnT > 0 && Math.floor(elapsed * 14) % 2 === 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(S, S);
  if (blink) ctx.globalAlpha = 0.35;
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.ellipse(0, 30, 46, 9, 0, 0, Math.PI * 2); ctx.fill();
  // back / shoulders with side shading
  const bgd = ctx.createLinearGradient(-36, 0, 36, 0);
  bgd.addColorStop(0, '#175a8c'); bgd.addColorStop(0.5, '#2b86cc'); bgd.addColorStop(1, '#175a8c');
  ctx.fillStyle = bgd; rr(-36, -34, 72, 62, 20); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(-36, -34, 72, 22, 20); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-36, -2, 72, 6);
  // back of head
  const hg = ctx.createRadialGradient(-5, -56, 3, 0, -50, 19);
  hg.addColorStop(0, '#dda06b'); hg.addColorStop(1, '#b57a48');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, -50, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#20120b'; ctx.beginPath(); ctx.arc(0, -55, 17, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(-17, -56, 34, 5);
  // gloves: rest low, punch extends up
  const punch = boxer.punchT > 0;
  const ext = punch ? (0.12 - boxer.punchT) / 0.12 : 0;
  const reach = Math.sin(Math.min(ext, 1) * Math.PI) * 34;
  const drawGlove = side => {
    const gx = side * 34, gy = -26 - (punch && boxer.punchSide === side ? reach + 12 : 0);
    const base = side < 0 ? '#2470c2' : '#d63a49';
    const hi = side < 0 ? '#6db3ff' : '#ff8291';
    const gg = ctx.createRadialGradient(gx - 5, gy - 5, 3, gx, gy, 17);
    gg.addColorStop(0, hi); gg.addColorStop(1, base);
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(gx, gy, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f5f0e6'; ctx.fillRect(gx - 9, gy + 9, 18, 5);
  };
  drawGlove(-1); drawGlove(1);
  ctx.restore();
}

function drawOrb(){
  if (!orb.active){
    if (state === 'playing'){
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = 'bold ' + Math.round(12 * S) + 'px "Courier New", monospace'; ctx.textAlign = 'center';
      ctx.fillText('INCOMING…', LW / 2, BRICK_TOP + (BH + BGAP) * ROWS + 52);
    }
    return;
  }
  const halo = ctx.createRadialGradient(orb.x, orb.y, 1, orb.x, orb.y, orb.r + 16);
  halo.addColorStop(0, 'rgba(255,215,80,0.5)');
  halo.addColorStop(1, 'rgba(255,180,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.r + 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,210,63,0.20)';
  ctx.beginPath(); ctx.arc(orb.x - orb.vx * 0.035, orb.y - orb.vy * 0.035, orb.r + 3, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(orb.x - 3, orb.y - 3, 1, orb.x, orb.y, orb.r + 2);
  g.addColorStop(0, '#fffbe8'); g.addColorStop(0.55, '#ffd23f'); g.addColorStop(1, '#e8890c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,60,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function drawFireball(){
  if (!fireball) return;
  const g = ctx.createRadialGradient(fireball.x, fireball.y, 1, fireball.x, fireball.y, 22);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.4, 'rgba(255,179,0,0.8)');
  g.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(fireball.x, fireball.y, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.font = 'bold 16px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillText('★', fireball.x, fireball.y + 6);
}
function drawLaser(){
  if (!laser) return;
  if (laser.phase === 'tele'){
    const a = 0.16 + 0.16 * Math.sin(elapsed * 30);
    ctx.fillStyle = 'rgba(255,60,60,' + a + ')';
    ctx.fillRect(laser.x - 15, GUARD_Y + 8, 30, BASE_Y - GUARD_Y + 18);
    ctx.fillStyle = '#ff5b5b';
    ctx.font = 'bold 14px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('⚠', laser.x, BRICK_TOP - 8);
  } else {
    const g = ctx.createLinearGradient(laser.x - 15, 0, laser.x + 15, 0);
    g.addColorStop(0, 'rgba(255,0,60,0)');
    g.addColorStop(0.5, 'rgba(255,245,245,0.95)');
    g.addColorStop(1, 'rgba(255,0,60,0)');
    ctx.fillStyle = g; ctx.fillRect(laser.x - 15, GUARD_Y + 6, 30, BASE_Y - GUARD_Y + 20);
    ctx.fillStyle = '#ff2e63'; ctx.fillRect(laser.x - 3, GUARD_Y + 6, 6, BASE_Y - GUARD_Y + 20);
  }
}

function drawHUD(){
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(15 * S) + 'px "Courier New", monospace';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
  ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 12, 24);
  ctx.font = 'bold ' + Math.round(13 * S) + 'px "Courier New", monospace';
  if (combo > 1){ ctx.fillStyle = '#ffd23f'; ctx.fillText('COMBO x' + combo, 12, 45); }
  // super meter under the score
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = Math.round(10 * S) + 'px "Courier New", monospace';
  ctx.fillText('STAR', 12, 66);
  for (let i = 0; i < 5; i++){
    ctx.font = Math.round(15 * S) + 'px "Courier New", monospace';
    const lit = i < superHits;
    ctx.fillStyle = lit ? (superHits === 5 ? (Math.floor(elapsed * 6) % 2 ? '#ffe66d' : '#ffb300') : '#ffb300') : 'rgba(255,255,255,0.18)';
    ctx.fillText('★', 50 + i * 18, 67);
  }
  if (superHits === 5){
    ctx.fillStyle = '#ffe66d'; ctx.font = 'bold ' + Math.round(10 * S) + 'px "Courier New", monospace';
    ctx.fillText(touchSeen ? 'TAP ★!' : 'PRESS C!', 146, 66);
  }
  ctx.shadowBlur = 0;
  // hearts top-right
  for (let i = 0; i < 3; i++){
    ctx.font = Math.round(17 * S) + 'px "Courier New", monospace';
    ctx.fillStyle = i < hearts ? '#ff4757' : 'rgba(255,255,255,0.18)';
    ctx.fillText('♥', LW - 86 + i * 26, 25);
  }
  // timer, top-right under the hearts
  const t = Math.ceil(timeLeft);
  ctx.textAlign = 'right';
  ctx.fillStyle = t <= 10 && state === 'playing' ? '#ff4757' : '#fff';
  ctx.font = 'bold ' + Math.round(20 * S) + 'px "Courier New", monospace';
  ctx.fillText(String(t), LW - 12, 52);
  ctx.font = Math.round(9 * S) + 'px "Courier New", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('TIME', LW - 12, 65);
  ctx.textAlign = 'left';
}

function centerText(str, yFrac, size, color, bold){
  ctx.fillStyle = color; ctx.textAlign = 'center';
  ctx.font = (bold ? 'bold ' : '') + Math.round(size * S) + 'px "Courier New", monospace';
  ctx.fillText(str, LW / 2, LH * yFrac);
}
function drawOverlay(){
  if (state === 'playing' && !paused) return;
  ctx.fillStyle = 'rgba(10,5,28,0.68)'; ctx.fillRect(0, 0, LW, LH);
  if (state === 'title'){
    ctx.shadowColor = 'rgba(255,180,0,0.7)'; ctx.shadowBlur = 18;
    centerText('COUNTERPUNCH!', 0.24, 40, '#ffd23f', true);
    ctx.shadowBlur = 0;
    centerText('PUNCH-OUT × BREAKOUT', 0.285, 15, '#fff', true);
    centerText('Bruno "The Anvil" Kovac hides behind', 0.40, 13, '#dcd6ff');
    centerText('3 rows of armor bricks. Your gloves', 0.428, 13, '#dcd6ff');
    centerText('are the paddle — punch his orb back', 0.456, 13, '#dcd6ff');
    centerText('and smash every brick in 99 seconds.', 0.484, 13, '#dcd6ff');
    centerText('◀ ▶ — slip & dodge his laser', 0.565, 13, '#a8e6ff');
    centerText('L — LEFT HOOK (deflects up-left)', 0.593, 13, '#a8e6ff');
    centerText('R — RIGHT STRAIGHT (straight up, fast)', 0.621, 13, '#ffb3ba');
    centerText('5 parries fill the STAR — ★ = STAR UPPER', 0.649, 13, '#ffe66d');
    centerText('3 hearts. Don\'t drop the orb.', 0.677, 13, '#a8e6ff');
    if (Math.floor(elapsed * 2) % 2 === 0)
      centerText('TAP TO START', 0.76, 17, '#2ed573', true);
    centerText('Keys: arrows + Z / X / C · Gamepad supported', 0.90, 11, 'rgba(255,255,255,0.5)');
  } else if (state === 'win'){
    centerText('KNOCKOUT!', 0.32, 42, '#2ed573', true);
    centerText('THE ANVIL FALLS! YOU ARE THE CHAMP!', 0.375, 15, '#fff', true);
    centerText('SCORE  ' + score, 0.46, 20, '#ffd23f', true);
    centerText('BEST COMBO  x' + bestCombo, 0.495, 15, '#dcd6ff');
    centerText('TIME LEFT  ' + Math.ceil(timeLeft) + 's', 0.53, 15, '#dcd6ff');
    if (Math.floor(elapsed * 2) % 2 === 0)
      centerText('TAP FOR REMATCH', 0.63, 15, '#2ed573', true);
  } else if (state === 'lose'){
    centerText(hearts <= 0 ? 'DOWN FOR THE COUNT!' : 'THE BELL RINGS…', 0.32, 32, '#ff4757', true);
    centerText(hearts <= 0 ? 'Bruno keeps the belt. This time.' : 'Bricks remain. Bruno keeps the belt.', 0.375, 14, '#fff');
    centerText('SCORE  ' + score, 0.46, 20, '#ffd23f', true);
    centerText('BEST COMBO  x' + bestCombo, 0.495, 15, '#dcd6ff');
    centerText('BRICKS LEFT  ' + bricks.filter(b => b.alive).length, 0.53, 15, '#dcd6ff');
    if (Math.floor(elapsed * 2) % 2 === 0)
      centerText('TAP FOR REMATCH', 0.63, 15, '#2ed573', true);
  } else if (paused){
    centerText('PAUSED', 0.42, 34, '#fff', true);
    centerText('PRESS P TO RESUME', 0.48, 14, '#dcd6ff');
  }
}

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBG();
  drawBoss();
  drawBricks();
  drawLaser();
  drawFireball();
  drawOrb();
  drawBoxer();
  for (const p of particles){
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  for (const t of texts){
    ctx.globalAlpha = 1 - t.t / t.life;
    ctx.fillStyle = t.color; ctx.font = 'bold ' + Math.round(14 * S) + 'px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  if (flashT > 0){ ctx.fillStyle = 'rgba(255,40,40,' + (flashT * 0.65) + ')'; ctx.fillRect(0, 0, LW, LH); }
  ctx.restore();
  drawHUD();
  drawOverlay();
  // soft vignette for depth (gradient only — no scanlines)
  const v = ctx.createRadialGradient(LW/2, LH * 0.42, LH * 0.42, LW/2, LH * 0.5, LH * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(4,2,12,0.30)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, LW, LH);
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  draw();
  const d = window.__dbg;
  d.state = state; d.score = score; d.hearts = hearts;
  d.combo = combo; d.super = superHits;
  d.bricksLeft = bricks.filter(b => b.alive).length;
  d.orbActive = orb.active;
  d.orbX = Math.round(orb.x); d.orbY = Math.round(orb.y); d.orbVY = Math.round(orb.vy);
  d.boxerX = Math.round(boxer.x);
  d.timeLeft = Math.round(timeLeft * 10) / 10;
  d.paused = paused;
  d.viewW = LW; d.viewH = LH;
  d.canvasW = cv.width; d.canvasH = cv.height;
}
window.__dbg = { state: 'title', score: 0, hearts: 3, combo: 0, super: 0,
                 bricksLeft: 0, orbActive: false, paused: false,
                 orbX: 0, orbY: 0, orbVY: 0, boxerX: 0, timeLeft: 99,
                 viewW: 0, viewH: 0, canvasW: 0, canvasH: 0 };
buildBricks();
layout();
boxer.x = LW / 2; orb.x = LW / 2;
requestAnimationFrame(frame);
})();
</script>
