let AC = null, master = null, noiseBuf = null, lastClack = 0;
function ensureAudio(create) {

  if (!AC && create) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.42; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.25, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = AC.createBuffer(1, 1, AC.sampleRate);
      src.connect(master); src.start(); // 1-sample silent unlock
    } catch (e) { AC = null; }
  }

}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseHit(dur, freq, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.05);
}

/* ---------- word logic ---------- */
function drawLetter() { return BAG[(Math.random() * BAG.length) | 0]; }

function scanWords(L) {
  // L: 8x8 letters. Returns {cells:Set<'r,c'>, words:[{word,cells,dir}]}
  const cells = new Set(), words = [];
  function line(get, isRow, idx) {
    let s = '';
    for (let i = 0; i < N; i++) s += get(i);
    const found5 = [];
    for (let i = 0; i + 5 <= N; i++) {
      const w = s.substr(i, 5);
      if (WORDS5.has(w)) {
        found5.push([i, i + 5]);
        const cs = [];
        for (let k = i; k < i + 5; k++) { const r = isRow ? idx : k, c = isRow ? k : idx; cs.push([r, c]); cells.add(r + ',' + c); }
        words.push({ word: w, cells: cs, dir: isRow ? 'h' : 'v' });
      }
    }
    for (let i = 0; i + 4 <= N; i++) {
      const w = s.substr(i, 4);
      if (!WORDS4.has(w)) continue;
      if (found5.some(([a, b]) => i >= a && i + 4 <= b)) continue; // inside a 5-word already counted
      const cs = [];
      for (let k = i; k < i + 4; k++) { const r = isRow ? idx : k, c = isRow ? k : idx; cs.push([r, c]); cells.add(r + ',' + c); }
      words.push({ word: w, cells: cs, dir: isRow ? 'h' : 'v' });
    }
  }
  for (let r = 0; r < N; r++) line(i => L[r][i], true, r);
  for (let c = 0; c < N; c++) line(i => L[i][c], false, c);
  return { cells, words };
}

function lettersOf() { return tiles.map(row => row.map(t => t ? t.ch : ' ')); }

function findMoves() {
  const L = lettersOf(), out = [];
  const dirs = [[0, 1], [1, 0]];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of dirs) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= N || c2 >= N) continue;
      const tmp = L[r][c]; L[r][c] = L[r2][c2]; L[r2][c2] = tmp;
      const res = scanWords(L);
      if (res.words.length) out.push({ a: [r, c], b: [r2, c2], words: res.words.map(w => w.word) });
      L[r2][c2] = L[r][c]; L[r][c] = tmp;
    }
  }
  return out;
}

function formsWordAt(L, r, c) {
  // would any complete window through (r,c) be a word? (all cells filled)
  for (const len of [5, 4]) {
    const set = len === 5 ? WORDS5 : WORDS4;
    for (let s = Math.max(0, c - len + 1); s + len - 1 < N && s <= c; s++) {
      let ok = true, w = '';
      for (let k = s; k < s + len; k++) { const ch = L[r][k]; if (!ch || ch === ' ') { ok = false; break; } w += ch; }
      if (ok && set.has(w)) return true;
    }
    for (let s = Math.max(0, r - len + 1); s + len - 1 < N && s <= r; s++) {
      let ok = true, w = '';
      for (let k = s; k < s + len; k++) { const ch = L[k][c]; if (!ch || ch === ' ') { ok = false; break; } w += ch; }
      if (ok && set.has(w)) return true;
    }
  }
  return false;
}

function generateLetters() {
  for (let attempt = 0; attempt < 80; attempt++) {
    const L = Array.from({ length: N }, () => Array(N).fill(' '));
    let bad = false;
    for (let r = 0; r < N && !bad; r++) for (let c = 0; c < N; c++) {
      let placed = null;
      for (let t = 0; t < 40; t++) {
        const ch = drawLetter(); L[r][c] = ch;
        if (!formsWordAt(L, r, c)) { placed = ch; break; }
      }
      if (!placed) { L[r][c] = drawLetter(); if (formsWordAt(L, r, c)) { bad = true; break; } }
    }
    if (bad) continue;
    if (scanWords(L).words.length) continue;
    // need at least one possible move — test with the tile-independent scanner
    if (movesIn(L) < 1) continue;
    return L;
  }
  return plantBoard();
}
function movesIn(L) {
  const dirs = [[0, 1], [1, 0]];
  let n = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of dirs) {
    const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
    const t = L[r][c]; L[r][c] = L[r2][c2]; L[r2][c2] = t;
    if (scanWords(L).words.length) n++;
    L[r2][c2] = L[r][c]; L[r][c] = t;
  }
  return n;
}
function plantBoard() {
  const w4 = [...WORDS4];
  for (let attempt = 0; attempt < 300; attempt++) {
    const L = Array.from({ length: N }, () => Array(N).fill(' '));
    let bad = false;
    for (let r = 0; r < N && !bad; r++) for (let c = 0; c < N; c++) {
      let ok = false;
      for (let t = 0; t < 40 && !ok; t++) { const ch = drawLetter(); L[r][c] = ch; if (!formsWordAt(L, r, c)) ok = true; }
      if (!ok) bad = true;
    }
    if (bad || scanWords(L).words.length) continue;
    const word = w4[(Math.random() * w4.length) | 0];
    const r = 1 + ((Math.random() * (N - 2)) | 0), c = (Math.random() * (N - 3)) | 0;
    L[r][c] = word[0]; L[r][c + 1] = word[1]; L[r][c + 2] = word[2];
    const above = Math.random() < 0.5;
    L[above ? r - 1 : r + 1][c + 3] = word[3];
    if (scanWords(L).words.length) continue;
    if (movesIn(L) >= 1) return L;
  }
  // last resort: any word-free fill (moves checked by caller flow anyway)
  const L = Array.from({ length: N }, () => Array(N).fill(' '));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) L[r][c] = drawLetter();
  return L;
}

let score = 0, wordsMade = [], bestChain = 0, level = 1;

function mkTile(ch, r, c, fromAbove) {
  const t = { id: uid++, ch, r, c, x: cellX(c), y: cellY(r), tx: cellX(c), ty: cellY(r), vy: 0, falling: false, scale: 1, alpha: 1, popping: false, delay: 0 };
  if (fromAbove) { t.y = cellY(r) - (fromAbove) * TILE; t.falling = true; }
  return t;
}
function newGame() {
  score = 0; wordsMade = []; bestChain = 0; level = 1; chain = 0;
  selected = null; hintTiles = null; idleTime = 0; particles = []; floaters = []; banner = null;
  const L = generateLetters();
  tiles = [];
  for (let r = 0; r < N; r++) { tiles.push([]); for (let c = 0; c < N; c++) tiles[r].push(mkTile(L[r][c], r, c, (N - r))); }

}
function doSwap(a, b) {
  const ta = tiles[a[0]][a[1]], tb = tiles[b[0]][b[1]];
  tiles[a[0]][a[1]] = tb; tiles[b[0]][b[1]] = ta;
  ta.r = b[0]; ta.c = b[1]; ta.tx = cellX(b[1]); ta.ty = cellY(b[0]);
  tb.r = a[0]; tb.c = a[1]; tb.tx = cellX(a[1]); tb.ty = cellY(a[0]);
  lastSwap = { a, b };
  phase = 'swap'; selected = null; hintTiles = null; idleTime = 0;
  sfx.pop();
}
function swapBack() {
  const { a, b } = lastSwap;
  const ta = tiles[a[0]][a[1]], tb = tiles[b[0]][b[1]];
  tiles[a[0]][a[1]] = tb; tiles[b[0]][b[1]] = ta;
  ta.r = b[0]; ta.c = b[1]; ta.tx = cellX(b[1]); ta.ty = cellY(b[0]);
  tb.r = a[0]; tb.c = a[1]; tb.tx = cellX(a[1]); tb.ty = cellY(a[0]);
  phase = 'swapback';
  sfx.thock();
}
function startPop(res, ch) {
  chain = ch; bestChain = Math.max(bestChain, chain);
  popCells = [...res.cells].map(s => s.split(',').map(Number));
  let gained = 0;
  for (const w of res.words) {
    const pts = 10 * w.word.length * chain;
    gained += pts;
    wordsMade.push({ word: w.word, pts, chain });
    const cx = w.cells.reduce((s, cell) => s + cellX(cell[1]) + TILE / 2, 0) / w.cells.length;
    const cy = w.cells.reduce((s, cell) => s + cellY(cell[0]) + TILE / 2, 0) / w.cells.length;
    floaters.push({ x: cx, y: cy, text: w.word + ' +' + pts, t: 0, life: 1.15, col: w.word.length === 5 ? '#ffd166' : '#ffffff' });
    if (w.word.length === 5) floaters.push({ x: cx, y: cy - TILE * 0.55, text: '★ 5-LETTER! ★', t: 0, life: 1.15, col: '#ffd166', small: true });
  }
  score += gained;
  const newLevel = Math.floor(wordsMade.length / 10) + 1;
  if (newLevel > level) { level = newLevel; toast = { text: '⭐ LEVEL ' + level + ' ⭐', t: 0 }; sfx.level(); }
  for (const [r, c] of popCells) { const t = tiles[r][c]; if (t) { t.popping = true; burst(t); } }
  if (chain >= 2) banner = { text: 'CHAIN ×' + chain + '!', t: 0 };

}
function burst(t) {
  const cols = { vowel: '#ffb84d', cons: '#2dd4bf', rare: '#a78bfa' };
  const col = cols[catOf(t.ch)];
  for (let i = 0; i < 11; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
    particles.push({ x: t.x + TILE / 2, y: t.y + TILE / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, t: 0, life: 0.45 + Math.random() * 0.35, col, size: 2 + Math.random() * 3.5, star: Math.random() < 0.3 });
  }
}
function catOf(ch) { return VOWELS.has(ch) ? 'vowel' : (RARE.has(ch) ? 'rare' : 'cons'); }

function applyGravityAndRefill() {
  for (let c = 0; c < N; c++) {
    let write = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const t = tiles[r][c];
      if (t) {
        if (write !== r) { tiles[write][c] = t; tiles[r][c] = null; t.r = write; t.ty = cellY(write); t.falling = true; t.vy = Math.max(t.vy, 0); }
        write--;
      } else tiles[r][c] = null;
    }
    for (let r = write; r >= 0; r--) {
      const t = mkTile(drawLetter(), r, c, 1);
      t.y = cellY(r) - (write - r + 1) * TILE; // stack spawns above the board
      t.vy = 0; t.falling = true;
      tiles[r][c] = t;
    }
  }
  phase = 'fall';
}
function startShuffle() {
  phase = 'shuffleout'; shuffleT = 0; toast = { text: 'No moves — Shuffled!', t: 0 };
  sfx.shuffle();
}
function reshuffleLetters() {
  const L = generateLetters();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) tiles[r][c].ch = L[r][c];
}
function allSettled() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = tiles[r][c];
    if (!t) continue;
    if (t.falling) return false;
    if (Math.abs(t.x - t.tx) > 0.8 || Math.abs(t.y - t.ty) > 0.8) return false;
  }
  return true;
}
function afterSettle() {
  if (phase === 'swap') {
    const res = scanWords(lettersOf());
    if (res.words.length) startPop(res, 1);
    else swapBack();
  } else if (phase === 'swapback') {
    phase = 'idle'; idleTime = 0;
  } else if (phase === 'fall') {
    const res = scanWords(lettersOf());
    if (res.words.length) startPop(res, chain + 1);
    else { phase = 'idle'; idleTime = 0; if (findMoves().length === 0) startShuffle(); }
  } else if (phase === 'shufflein') {
    phase = 'idle'; idleTime = 0;
  }
}

/* ---------- update ---------- */
let lastT = performance.now();
function update(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) { requestAnimationFrame(update); return; }

  // tiles motion
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = tiles[r] && tiles[r][c]; if (!t) continue;
    if (phase === 'shuffleout') {
      const cx = BX + BS / 2 - TILE / 2, cy = BY + BS / 2 - TILE / 2;
      t.x += (cx - t.x) * Math.min(1, dt * 7);
      t.y += (cy - t.y) * Math.min(1, dt * 7);
      t.scale += (0.25 - t.scale) * Math.min(1, dt * 7);
      continue;
    }
    if (phase === 'shufflein') {
      t.x += (t.tx - t.x) * Math.min(1, dt * 9);
      t.y += (t.ty - t.y) * Math.min(1, dt * 9);
      t.scale += (1 - t.scale) * Math.min(1, dt * 9);
      continue;
    }
    if (t.falling) {
      t.vy += 3000 * dt;
      t.y += t.vy * dt;
      t.x += (t.tx - t.x) * Math.min(1, dt * 18);
      if (t.y >= t.ty) {
        t.y = t.ty;
        if (t.vy > 300) { t.vy = -t.vy * 0.24; sfx.clack(); }
        else { t.vy = 0; t.falling = false; if (Math.abs(t.x - t.tx) < 1) t.x = t.tx; }
      }
    } else {
      const k = Math.min(1, dt * 16);
      t.x += (t.tx - t.x) * k;
      t.y += (t.ty - t.y) * k;
      if (Math.abs(t.x - t.tx) < 0.6) t.x = t.tx;
      if (Math.abs(t.y - t.ty) < 0.6) t.y = t.ty;
    }
    if (t.popping) {
      popT = Math.max(popT, 0); // popT advanced globally below
      const p = Math.min(1, popT / 0.3);
      t.scale = p < 0.45 ? 1 + 0.3 * Math.sin(p / 0.45 * Math.PI * 0.5) : Math.max(0, 1.3 * (1 - (p - 0.45) / 0.55));
      t.alpha = p < 0.55 ? 1 : Math.max(0, 1 - (p - 0.55) / 0.45);
    }
  }

  if (phase === 'pop') {
    popT += dt;
    if (popT >= 0.32) {
      for (const [r, c] of popCells) tiles[r][c] = null;
      popCells = [];
      applyGravityAndRefill();
    }
  } else if (phase === 'shuffleout') {
    shuffleT += dt;
    if (shuffleT >= 0.5) { reshuffleLetters(); phase = 'shufflein'; shuffleT = 0; }
  } else if (phase === 'shufflein') {
    shuffleT += dt;
    if (shuffleT >= 0.45 && allSettled()) afterSettle();
  } else if (phase !== 'idle') {
    if (allSettled()) afterSettle();
  }

  if (phase === 'idle') {
    idleTime += dt;
    if (idleTime > 6 && !hintTiles) {
      const mv = findMoves();
      if (mv.length) hintTiles = [mv[0].a, mv[0].b];
      else startShuffle();
    }
  } else idleTime = 0;

  // particles & floaters & toast & banner
  particles = particles.filter(p => (p.t += dt) < p.life);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 340 * dt; }
  floaters = floaters.filter(f => (f.t += dt) < f.life);
  if (toast) { toast.t += dt; if (toast.t > 1.8) toast = null; }
  if (banner) { banner.t += dt; if (banner.t > 1.0) banner = null; }

  draw(now / 1000);
  requestAnimationFrame(update);
}

/* ---------- draw ---------- */
function rr(x, y, w, h, r) {
  w = Math.max(0, w); h = Math.max(0, h);
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw(time) {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  // soft decorative blobs
  ctx.save();
  ctx.globalAlpha = 0.16; ctx.fillStyle = '#ffffff';
  for (const [bx, by, br] of [[W * 0.12, H * 0.2, 70], [W * 0.9, H * 0.12, 46], [W * 0.85, H * 0.62, 84], [W * 0.06, H * 0.78, 52]]) {
    ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
  }
  ctx.restore();

  // ---- header ----
  const pad = BX;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 ' + Math.round(TILE * 0.52) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
  ctx.fillText('LETTER CRUSH', pad, LY.title);
  // new game button
  const nbW = TILE * 1.9, nbH = TILE * 0.72, nbX = W - pad - nbW, nbY = LY.btnY;
  newBtnRect = { x: nbX, y: nbY, w: nbW, h: nbH };
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; rr(nbX, nbY, nbW, nbH, nbH / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.5; rr(nbX, nbY, nbW, nbH, nbH / 2); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = '700 ' + Math.round(TILE * 0.34) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
  ctx.fillText('↻ NEW', nbX + nbW / 2, nbY + nbH * 0.66);
  // stats
  ctx.textAlign = 'left';
  ctx.font = '700 ' + Math.round(TILE * 0.3) + 'px ui-rounded, -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('SCORE', pad, LY.lab);
  ctx.fillText('WORDS', pad + TILE * 2.6, LY.lab);
  ctx.fillText('BEST CHAIN', pad + TILE * 5.0, LY.lab);
  ctx.font = '800 ' + Math.round(TILE * 0.52) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(String(score), pad, LY.val);
  ctx.fillText(String(wordsMade.length), pad + TILE * 2.6, LY.val);
  ctx.fillText(bestChain ? '×' + bestChain : '—', pad + TILE * 5.0, LY.val);
  ctx.font = '700 ' + Math.round(TILE * 0.3) + 'px ui-rounded, -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'right';
  ctx.fillText('LEVEL ' + level, W - pad, LY.val);

  // ---- board backing ----
  ctx.fillStyle = 'rgba(20,10,50,0.35)';
  rr(BX - 7, BY - 7, BS + 14, BS + 14, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  rr(BX - 7, BY - 7, BS + 14, BS + 14, 18); ctx.stroke();

  // ---- tiles ----
  const gap = TILE * 0.07;
  const hintSet = new Set(hintTiles ? hintTiles.map(([r, c]) => r + ',' + c) : []);
  const selKey = selected ? selected[0] + ',' + selected[1] : null;
  const drawList = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = tiles[r] && tiles[r][c]; if (t) drawList.push(t); }
  drawList.sort((a, b) => a.y - b.y);
  for (const t of drawList) {
    const s = Math.max(0.5, TILE * t.scale), off = (TILE - s) / 2;
    const x = t.x + gap / 2 + off, y = t.y + gap / 2 + off, w = s - gap, h = s - gap;
    const cat = catOf(t.ch);
    ctx.save();
    ctx.globalAlpha = t.alpha;
    // soft shadow
    ctx.fillStyle = 'rgba(15,5,40,0.3)';
    rr(x + 1.5, y + 3, w, h, w * 0.22); ctx.fill();
    // body
    const g = tileGrads[cat];
    ctx.fillStyle = g; rr(x, y, w, h, w * 0.22); ctx.fill();
    // gloss
    ctx.globalAlpha = t.alpha * 0.28; ctx.fillStyle = '#fff';
    rr(x + w * 0.1, y + h * 0.06, w * 0.8, h * 0.38, w * 0.18); ctx.fill();
    ctx.globalAlpha = t.alpha;
    // letter
    ctx.fillStyle = cat === 'rare' ? '#ffffff' : 'rgba(43,16,64,0.88)';
    ctx.font = '800 ' + Math.round(w * 0.56) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.ch, x + w / 2, y + h / 2 + w * 0.03);
    // selection / hint rings
    const key = t.r + ',' + t.c;
    if (key === selKey) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      rr(x - 2, y - 2, w + 4, h + 4, w * 0.26); ctx.stroke();
    } else if (hintSet.has(key) && phase === 'idle') {
      const pulse = 0.45 + 0.4 * Math.sin(time * 5);
      ctx.strokeStyle = 'rgba(255,255,255,' + pulse.toFixed(3) + ')'; ctx.lineWidth = 3;
      rr(x - 2, y - 2, w + 4, h + 4, w * 0.26); ctx.stroke();
    }
    ctx.restore();
  }

  // ---- particles ----
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = p.col;
    if (p.star) {
      ctx.translate(p.x, p.y); ctx.rotate(p.t * 6);
      const s = p.size * 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.3, -s * 0.3); ctx.lineTo(s, 0); ctx.lineTo(s * 0.3, s * 0.3);
      ctx.lineTo(0, s); ctx.lineTo(-s * 0.3, s * 0.3); ctx.lineTo(-s, 0); ctx.lineTo(-s * 0.3, -s * 0.3);
      ctx.closePath(); ctx.fill();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + 0.5, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  // ---- floaters ----
  for (const f of floaters) {
    const p = f.t / f.life, a = p < 0.7 ? 1 : 1 - (p - 0.7) / 0.3;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = '800 ' + Math.round(TILE * (f.small ? 0.3 : 0.4)) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,10,60,0.55)';
    const yy = f.y - p * TILE * 0.9;
    ctx.strokeText(f.text, f.x, yy); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, yy);
    ctx.restore();
  }

  // ---- chain banner ----
  if (banner) {
    const p = banner.t / 1.0;
    const sc = banner.t < 0.18 ? easeOutBack(banner.t / 0.18) : 1;
    const a = p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(W / 2, BY + BS / 2); ctx.scale(sc, sc);
    ctx.font = '900 ' + Math.round(TILE * 1.05) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(30,10,60,0.6)';
    ctx.strokeText(banner.text, 0, 0);
    ctx.fillStyle = '#ffd166'; ctx.fillText(banner.text, 0, 0);
    ctx.restore();
  }

  // ---- footer: word chips + help ----
  const fy = LY.chipsLab;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.round(TILE * 0.28) + 'px ui-rounded, -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(wordsMade.length ? 'WORDS YOU MADE:' : 'Swap letters to spell 4–5 letter words!', pad, fy);
  const chips = wordsMade.slice(-6);
  let cxp = pad;
  const chipY = LY.chipsY, chipH = TILE * 0.52;
  ctx.font = '800 ' + Math.round(TILE * 0.3) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
  for (const wm of chips) {
    const label = wm.word + ' +' + wm.pts;
    const cw = ctx.measureText(label).width + TILE * 0.36;
    if (cxp + cw > W - pad) break;
    ctx.fillStyle = wm.word.length === 5 ? 'rgba(255,209,102,0.9)' : 'rgba(255,255,255,0.25)';
    rr(cxp, chipY, cw, chipH, chipH / 2); ctx.fill();
    ctx.fillStyle = wm.word.length === 5 ? '#4a2c00' : '#fff';
    ctx.fillText(label, cxp + TILE * 0.18, chipY + chipH / 2 + 1);
    cxp += cw + TILE * 0.16;
  }
  if (wordsMade.length) {
    let hfs = Math.round(TILE * 0.26);
    ctx.font = '600 ' + hfs + 'px ui-rounded, -apple-system, sans-serif';
    const htxt = 'Tap or drag to swap — words burst, chains multiply!';
    const hw = ctx.measureText(htxt).width;
    if (hw > W - pad * 2) { hfs = Math.max(10, Math.floor(hfs * (W - pad * 2) / hw)); ctx.font = '600 ' + hfs + 'px ui-rounded, -apple-system, sans-serif'; }
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(htxt, pad, LY.help);
  }

  // ---- toast ----
  if (toast) {
    const a = toast.t < 0.2 ? toast.t / 0.2 : (toast.t > 1.5 ? Math.max(0, 1 - (toast.t - 1.5) / 0.3) : 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = '800 ' + Math.round(TILE * 0.4) + 'px ui-rounded, "Arial Rounded MT Bold", -apple-system, sans-serif';
    const tw = ctx.measureText(toast.text).width + TILE * 0.7, th = TILE * 0.72;
    const tx = (W - tw) / 2, ty = LY.toastY;
    ctx.fillStyle = 'rgba(30,12,64,0.82)'; rr(tx, ty, tw, th, th / 2); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(toast.text, W / 2, ty + th / 2 + 1);
    ctx.restore();
  }
}
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

/* ---------- input ---------- */
let dragStart = null, dragSwapped = false;
function evtPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function cellAt(x, y) {
  const c = Math.floor((x - BX) / TILE), r = Math.floor((y - BY) / TILE);
  return (r >= 0 && r < N && c >= 0 && c < N) ? [r, c] : null;
}
function adjacent(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio(true);
  const { x, y } = evtPos(e);
  if (newBtnRect && x >= newBtnRect.x && x <= newBtnRect.x + newBtnRect.w && y >= newBtnRect.y && y <= newBtnRect.y + newBtnRect.h) { newGame(); return; }
  if (phase !== 'idle') return;
  const cell = cellAt(x, y);
  dragStart = cell ? { cell, x, y } : null; dragSwapped = false;
  if (!cell) { selected = null; return; }
  if (selected && adjacent(selected, cell)) { doSwap(selected, cell); dragStart = null; return; }
  if (selected && selected[0] === cell[0] && selected[1] === cell[1]) { selected = null; return; }
  selected = cell; hintTiles = null; idleTime = 0; sfx.select();
});
canvas.addEventListener('pointermove', e => {
  if (!dragStart || dragSwapped || phase !== 'idle') return;
  const { x, y } = evtPos(e);
  const dx = x - dragStart.x, dy = y - dragStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < TILE * 0.36) return;
  const [r, c] = dragStart.cell;
  let b = null;
  if (Math.abs(dx) > Math.abs(dy)) b = [r, c + (dx > 0 ? 1 : -1)];
  else b = [r + (dy > 0 ? 1 : -1), c];
  if (b[0] < 0 || b[0] >= N || b[1] < 0 || b[1] >= N) return;
  dragSwapped = true; selected = null;
  doSwap([r, c], b);
});
function endDrag() { dragStart = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- boot ---------- */
window.addEventListener('resize', layout);
layout();
newGame();
requestAnimationFrame(update);

/* ---------- debug ---------- */
window.__dbg = {
  get state() { return phase; },
  get score() { return score; },
  get words() { return wordsMade.map(w => w.word); },
  get wordCount() { return wordsMade.length; },
  gridLetters() { return lettersOf(); },
  findMoves() { return findMoves(); },
  newGame() { newGame(); }
};
</script>
</body>
</html>
