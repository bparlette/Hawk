/* ================= AUDIO (synthesized, iOS-safe) ================= */
let AC = null;
function audioInit(){
  try{
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  }catch(e){}
  if (!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
    if (AC){
      // 1-sample silent buffer unlock inside the gesture
      try{
        const b = AC.createBuffer(1, 1, AC.sampleRate);
        const s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
      }catch(e){}
    }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, when, slideTo){
  if (!AC) return;
  const t0 = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  key(){ tone(660, 0.045, 'triangle', 0.06); },
  flip(i){ tone(420 + i * 60, 0.06, 'square', 0.05); },
  invalid(){ tone(140, 0.16, 'sawtooth', 0.1, 0, 90); },
  solve(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, 'triangle', 0.11, i * 0.07)); },
  victory(){ [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.2, 'triangle', 0.11, i * 0.09)); },
  defeat(){ [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, 'sine', 0.09, i * 0.11)); },
  click(){ tone(520, 0.05, 'triangle', 0.08); }
};

/* ================= GAME DATA ================= */
// Letter chips by rarity (published table)
const CHIPS = {E:10,A:10,O:10,S:10,I:12,R:12,T:12,L:12,N:12,U:15,
  C:25,D:25,H:25,M:30,P:30,B:30,G:35,F:35,W:35,Y:35,
  K:50,V:50,J:100,X:100,Q:110,Z:110};
const MAX_GUESSES = 6;
const TOTAL_ROUNDS = 10;
const SOLVE_BONUS_PER_UNUSED = 200;
const HOWTO = 'Guess the hidden word in 6 tries — the colors are your clues.';
const LEGEND = [
  { state: 2, text: 'Right letter, right spot' },
  { state: 1, text: 'In the word, wrong spot' },
  { state: 0, text: 'Not in the word' }
];

/* ================= STATE ================= */
let screen = 'title'; // title | play | final
let run = null;       // per-run state
let R = null;         // per-round state
let anim = null;      // tile-flip animation state
let msg = '', msgUntil = 0;
let shakeUntil = 0, shakeSeed = 0;
let layoutDirty = true;
let L = {};           // layout rects
let hot = [];         // clickable zones, rebuilt every draw

function setMsg(t, dur){ msg = t; msgUntil = performance.now() + (dur || 1800); }
function doShake(){ shakeUntil = performance.now() + 380; shakeSeed = Math.random() * 100; }

function newRun(){
  run = { score: 0, dispScore: 0, solvedCount: 0, streak: 0, bestStreak: 0,
          bestGuess: { word: '', points: 0 }, usedTargets: new Set() };
  startRound(1);
  screen = 'play';
}
function startRound(n){
  let w = ANSWERS[(Math.random() * ANSWERS.length) | 0];
  let guard = 0;
  while (run.usedTargets.has(w) && guard++ < 30) w = ANSWERS[(Math.random() * ANSWERS.length) | 0];
  run.usedTargets.add(w);
  R = { round: n, target: w.toUpperCase(), guesses: [], input: '',
        keyState: {}, phase: 'input', solved: false, roundScore: 0,
        lastLine: '', phaseUntil: 0 };
  anim = null;
}
function nextRound(){
  if (R.round >= TOTAL_ROUNDS){
    screen = 'final';
    if (run.solvedCount >= 5) sfx.victory(); else sfx.defeat();
  } else {
    startRound(R.round + 1);
    screen = 'play';
  }
}
function gradeFor(solved){
  if (solved >= 10) return '🏆 Lexicon Legend';
  if (solved >= 9)  return 'Word Master';
  if (solved >= 7)  return 'Word Wizard';
  if (solved >= 5)  return 'Word Sharp';
  if (solved >= 3)  return 'Word Explorer';
  return 'Word Rookie';
}

/* ================= WORDLE FEEDBACK =================
   Exactly Wordle-correct: greens first, then yellows capped
   by the remaining (unmatched) letter counts in the target. */
function feedback(guess, target){
  const fb = [0,0,0,0,0], used = [false,false,false,false,false];
  for (let i = 0; i < 5; i++) if (guess[i] === target[i]){ fb[i] = 2; used[i] = true; }
  for (let i = 0; i < 5; i++){
    if (fb[i] === 2) continue;
    for (let j = 0; j < 5; j++){
      if (!used[j] && guess[i] === target[j]){ fb[i] = 1; used[j] = true; break; }
    }
  }
  return fb; // 0 gray, 1 yellow, 2 green
}

/* ================= SCORING (the whole scoring layer) =================
   points = chips × mult
   chips  = sum of letter chips; a gray tile's chips count half (floored),
            green/yellow tiles count full.
   mult   = 1 + (#green tiles) + (#yellow tiles)
   Solving also pays +200 per unused guess. That is the entire scoring layer. */
function scoreGuess(word, fb){
  let chips = 0;
  for (let i = 0; i < 5; i++){
    let c = CHIPS[word[i]] || 10;
    if (fb[i] === 0) c = Math.floor(c / 2);
    chips += c;
  }
  const greens = fb.filter(v => v === 2).length;
  const yellows = fb.filter(v => v === 1).length;
  const mult = 1 + greens + yellows;
  return { chips, mult, points: chips * mult, greens, yellows };
}

/* ================= GUESS FLOW ================= */
function submitGuess(){
  if (!R || R.phase !== 'input') return;
  const word = R.input;
  if (word.length < 5){ doShake(); setMsg('Too short — 5 letters!'); sfx.invalid(); return; }
  if (!VALID.has(word.toLowerCase())){ doShake(); setMsg('Not in the word list'); sfx.invalid(); return; }
  const fb = feedback(word, R.target);
  const sc = scoreGuess(word, fb);
  const solved = (word === R.target);
  const entry = { word, fb, points: sc.points, chips: sc.chips, mult: sc.mult, solved };
  R.guesses.push(entry);
  R.input = '';
  R.phase = 'anim';
  anim = { t0: performance.now(), entry, tickCount: -1, skip: false };
}
function finishFlip(){
  const e = anim.entry;
  anim = null;
  // keyboard takes each letter's best-known state
  for (let i = 0; i < 5; i++){
    const ch = e.word[i], st = e.fb[i] + 1; // 1 gray, 2 yellow, 3 green
    if (st > (R.keyState[ch] || 0)) R.keyState[ch] = st;
  }
  R.roundScore += e.points;
  run.score += e.points;
  if (e.points > run.bestGuess.points) run.bestGuess = { word: e.word, points: e.points };
  R.lastLine = e.word + ' — ' + fmt(e.points) + ' pts';
  const now = performance.now();
  if (e.solved){
    R.solved = true;
    const unused = MAX_GUESSES - R.guesses.length;
    const bonus = unused * SOLVE_BONUS_PER_UNUSED;
    if (bonus > 0){
      R.roundScore += bonus;
      run.score += bonus;
      R.lastLine += '  ·  solved! +' + fmt(bonus) + ' bonus';
    } else {
      R.lastLine += '  ·  solved!';
    }
    run.solvedCount++;
    run.streak++;
    if (run.streak > run.bestStreak) run.bestStreak = run.streak;
    sfx.solve();
    R.phase = 'celebrate';
    R.phaseUntil = now + 700;
  } else if (R.guesses.length >= MAX_GUESSES){
    run.streak = 0;
    R.phase = 'pause';
    R.phaseUntil = now + 350;
  } else {
    R.phase = 'input';
  }
}
function updatePhases(now){
  if (!R) return;
  if ((R.phase === 'celebrate' || R.phase === 'pause') && now >= R.phaseUntil){
    R.phase = 'roundEnd';
  }
}

/* ================= ANIMATION UPDATE ================= */
const FLIP_STAGGER = 110, FLIP_DUR = 260;
const FLIP_TOTAL = 4 * FLIP_STAGGER + FLIP_DUR; // 700ms
function updateAnim(now){
  if (!anim) return;
  const el = now - anim.t0;
  const idx = Math.floor(el / FLIP_STAGGER);
  if (idx !== anim.tickCount && idx < 5 && !anim.skip){ anim.tickCount = idx; sfx.flip(idx); }
  if (anim.skip || el >= FLIP_TOTAL) finishFlip();
}

/* ================= LAYOUT ================= */
function computeLayout(){
  const pad = 14;
  L.pad = pad;
  L.header = { x: pad, y: 10, w: W - 2 * pad, h: 30 };
  const kbH = Math.min(196, Math.max(150, H * 0.235));
  L.kb = { x: pad, y: H - kbH - 10, w: W - 2 * pad, h: kbH };
  L.strip = { x: pad, y: L.kb.y - 46, w: W - 2 * pad, h: 34 };
  const gridTop = 56;
  const gap = 8;
  const availH = L.strip.y - 76 - gridTop; // leave room for the legend under the grid
  const s = Math.min((W - 2 * pad - 4 * gap) / 5, (availH - 5 * gap) / 6, 64);
  L.grid = { x: (W - (5 * s + 4 * gap)) / 2, y: gridTop, s, gap, h: 6 * s + 5 * gap };
  L.legend = { x: pad, y: gridTop + L.grid.h + 14, w: W - 2 * pad };
  // keyboard rects
  L.keys = {};
  const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const kgap = 5, rowH = (kbH - 2 * kgap) / 3;
  for (let r = 0; r < 3; r++){
    const y = L.kb.y + r * (rowH + kgap);
    if (r < 2){
      const n = rows[r].length;
      const kw = (L.kb.w - (n - 1) * kgap) / n;
      const x0 = L.kb.x + (r === 1 ? kw * 0.28 : 0);
      const wRow = r === 1 ? L.kb.w - kw * 0.56 : L.kb.w;
      const kw2 = (wRow - (n - 1) * kgap) / n;
      for (let i = 0; i < n; i++) L.keys[rows[r][i]] = { x: x0 + i * (kw2 + kgap), y, w: kw2, h: rowH };
    } else {
      const wide = 52;
      const n = rows[2].length;
      const kw = (L.kb.w - 2 * wide - (n + 1) * kgap) / n;
      L.keys['ENTER'] = { x: L.kb.x, y, w: wide, h: rowH };
      for (let i = 0; i < n; i++) L.keys[rows[2][i]] = { x: L.kb.x + wide + kgap + i * (kw + kgap), y, w: kw, h: rowH };
      L.keys['BK'] = { x: L.kb.x + wide + kgap + n * (kw + kgap), y, w: wide, h: rowH };
    }
  }
}

/* ================= DRAW HELPERS ================= */
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || 700) + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function drawBG(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b0b33'); g.addColorStop(0.55, '#12081f'); g.addColorStop(1, '#0a1428');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blobs = [
    [0.22, 0.16, 240, 'rgba(124,58,237,0.34)', 0.00011, 0.0],
    [0.82, 0.30, 210, 'rgba(14,165,183,0.26)', 0.00009, 2.1],
    [0.55, 0.72, 260, 'rgba(217,70,160,0.20)', 0.00007, 4.2],
    [0.15, 0.88, 180, 'rgba(245,176,65,0.13)', 0.00013, 1.2]
  ];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs){
    const bx = (b[0] + 0.05 * Math.sin(t * b[4] * 6.28 + b[5])) * W;
    const by = (b[1] + 0.05 * Math.cos(t * b[4] * 6.28 + b[5] * 1.7)) * H;
    const rg = ctx.createRadialGradient(bx, by, 0, bx, by, b[2]);
    rg.addColorStop(0, b[3]); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(bx - b[2], by - b[2], b[2] * 2, b[2] * 2);
  }
  ctx.restore();
}
function drawButton(x, y, w, h, label, action, opts){
  opts = opts || {};
  const grad = ctx.createLinearGradient(0, y, 0, y + h);
  if (opts.gold){ grad.addColorStop(0, '#ffd76a'); grad.addColorStop(1, '#e79b1e'); }
  else { grad.addColorStop(0, '#7c3aed'); grad.addColorStop(1, '#5b21b6'); }
  rr(x, y, w, h, 14); ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + 1, opts.size || 17, opts.gold ? '#4a2c00' : '#fff', 'center', 800);
  hot.push({ x, y, w, h, action });
}
const TILE_COLORS = ['#4a4a5e', '#d9a82e', '#3fae5a']; // gray yellow green

function tileFace(x, y, s, letter, state, flipP, yOff){
  let sx = 1, showFront = true, st = state;
  if (flipP !== null && flipP !== undefined){
    const p = Math.max(0, Math.min(1, flipP));
    sx = Math.abs(Math.cos(p * Math.PI));
    showFront = p >= 0.5;
    if (!showFront) st = -1;
  }
  ctx.save();
  ctx.translate(x + s / 2, y + (yOff || 0) + s / 2); ctx.scale(Math.max(0.06, sx), 1); ctx.translate(-s / 2, -s / 2);
  if (st === -1){ rr(0, 0, s, s, 10); ctx.fillStyle = '#2c2c44'; ctx.fill(); ctx.strokeStyle = '#565670'; ctx.lineWidth = 2; ctx.stroke(); }
  else if (st === null || st === undefined){
    rr(0, 0, s, s, 10); ctx.fillStyle = letter ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.05)'; ctx.fill();
    ctx.strokeStyle = letter ? '#8f8fb5' : '#3d3d58'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    rr(0, 0, s, s, 10); ctx.fillStyle = TILE_COLORS[st]; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (letter && (flipP === null || flipP === undefined || showFront))
    txt(letter, s / 2, s / 2 + 2, s * 0.52, '#fff', 'center', 800);
  ctx.restore();
}

/* ================= LEGEND ================= */
function drawLegendFull(x, y, tileS, fontSize){
  // three rows: colored tile + words. Returns total height used.
  for (let i = 0; i < 3; i++){
    const ly = y + i * (tileS + 8);
    tileFace(x, ly, tileS, 'A', LEGEND[i].state, null, 0);
    txt(LEGEND[i].text, x + tileS + 10, ly + tileS / 2 + 1, fontSize, '#e8e4ff', 'left', 600);
  }
  return 3 * tileS + 2 * 8;
}
function drawLegendCompact(y){
  // one glanceable line: three mini tiles with short labels
  const items = [ [2, 'right spot'], [1, 'in word'], [0, 'not in word'] ];
  const ts = 15, gapT = 6, gapI = 16;
  ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  let total = 0;
  for (const it of items) total += ts + gapT + ctx.measureText(it[1]).width + gapI;
  total -= gapI;
  let x = (W - total) / 2;
  for (const it of items){
    tileFace(x, y, ts, '', it[0], null, 0);
    txt(it[1], x + ts + gapT, y + ts / 2 + 1, 12, '#b9b2dd', 'left', 600);
    x += ts + gapT + ctx.measureText(it[1]).width + gapI;
  }
}

/* ================= SCREENS ================= */
function drawTitle(t){
  txt('WORDLE', W / 2, H * 0.15, 47, '#fff', 'center', 800);
  txt('-LATRO', W / 2, H * 0.15 + 50, 47, '#ffd76a', 'center', 800);
  // how-to, word-wrapped to fit the screen width
  ctx.font = '600 14.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const words = HOWTO.split(' '); const lines = []; let cur = '';
  for (const w of words){
    const trial = cur ? cur + ' ' + w : w;
    if (ctx.measureText(trial).width > W - 28 && cur){ lines.push(cur); cur = w; }
    else cur = trial;
  }
  if (cur) lines.push(cur);
  lines.forEach((s, i) => txt(s, W / 2, H * 0.15 + 102 + i * 21, 14.5, '#e8e4ff', 'center', 600));
  // legend, left block centered as a group
  const tileS = 30, blockW = 250;
  drawLegendFull((W - blockW) / 2, H * 0.36, tileS, 15);
  drawButton(W / 2 - 110, H * 0.60, 220, 58, '▶  START', 'start', { gold: true, size: 19 });
  txt('10 words · 6 tries each · every guess scores points', W / 2, H * 0.60 + 86, 12.5, '#9a92c9', 'center', 600);
  txt('Solving pays +200 for every guess you don\'t use', W / 2, H * 0.60 + 108, 12.5, '#9a92c9', 'center', 600);
}
function drawHeader(){
  txt('WORD ' + R.round + ' / ' + TOTAL_ROUNDS, L.header.x + 2, L.header.y + 15, 15, '#e8e4ff', 'left', 800);
  if (run.streak > 0) txt('🔥 ' + run.streak, W / 2, L.header.y + 15, 15, '#ffb35c', 'center', 800);
  txt('SCORE ' + fmt(run.dispScore), L.header.x + L.header.w - 2, L.header.y + 15, 15, '#ffd76a', 'right', 800);
}
function drawGrid(now){
  const g = L.grid;
  let shX = 0;
  if (now < shakeUntil) shX = Math.sin((now - shakeSeed) * 0.09) * 6 * (1 - (shakeUntil - now) / 380);
  for (let r = 0; r < MAX_GUESSES; r++){
    for (let c = 0; c < 5; c++){
      const x = g.x + c * (g.s + g.gap) + shX, y = g.y + r * (g.s + g.gap);
      const guess = R.guesses[r];
      let yOff = 0;
      if (R.phase === 'celebrate' && r === R.guesses.length - 1){
        const p = Math.max(0, Math.min(1, (now - (R.phaseUntil - 700) - c * 70) / 350));
        yOff = -Math.sin(p * Math.PI) * 11;
      }
      if (guess){
        let flipP = null;
        if (anim && r === R.guesses.length - 1){
          flipP = (now - anim.t0 - c * FLIP_STAGGER) / FLIP_DUR;
          if (flipP >= 1) flipP = null;
          else if (flipP < 0) flipP = 0;
        }
        tileFace(x, y, g.s, guess.word[c], guess.fb[c], flipP, yOff);
      } else if (r === R.guesses.length){
        tileFace(x, y, g.s, R.input[c] || '', null, null, 0);
      } else {
        tileFace(x, y, g.s, '', null, null, 0);
      }
    }
  }
}
function drawScoreStrip(now){
  const a = L.strip;
  if (now < msgUntil && msg){
    const w = Math.min(W - 40, msg.length * 8.4 + 30);
    rr((W - w) / 2, a.y, w, 34, 17); ctx.fillStyle = 'rgba(10,6,24,0.88)'; ctx.fill();
    ctx.strokeStyle = '#7c5cd6'; ctx.lineWidth = 1.5; ctx.stroke();
    txt(msg, W / 2, a.y + 18, 14.5, '#fff', 'center', 700);
    return;
  }
  if (R.lastLine) txt(R.lastLine, W / 2, a.y + 17, 15, '#cbbffa', 'center', 700);
  else if (R.guesses.length === 0) txt('Type a word, hit ENTER — colors are your clues', W / 2, a.y + 17, 12.5, '#8a84b5', 'center', 600);
}
function drawRoundEnd(now){
  const pw = W - 56, ph = 218, x = 28, y = H * 0.30;
  ctx.fillStyle = 'rgba(6,3,16,0.55)'; ctx.fillRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, y, 0, y + ph);
  grad.addColorStop(0, '#34245f'); grad.addColorStop(1, '#1e1238');
  rr(x, y, pw, ph, 16); ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = R.solved ? '#ffd76a' : '#7c5cd6'; ctx.lineWidth = 2; ctx.stroke();
  if (R.solved){
    txt('🎉 Solved in ' + R.guesses.length + (R.guesses.length === 1 ? ' guess!' : ' guesses!'), W / 2, y + 36, 21, '#ffd76a', 'center', 800);
  } else {
    txt('Out of guesses', W / 2, y + 36, 21, '#ff9b9b', 'center', 800);
    txt('The word was ' + R.target, W / 2, y + 68, 16.5, '#fff', 'center', 700);
  }
  txt('Round points: ' + fmt(R.roundScore), W / 2, y + (R.solved ? 72 : 102), 15.5, '#e8e4ff', 'center', 700);
  txt('Total: ' + fmt(run.score) + '   ·   Solved: ' + run.solvedCount + ' / ' + R.round, W / 2, y + (R.solved ? 98 : 128), 13.5, '#9a92c9', 'center', 600);
  drawButton(W / 2 - 100, y + ph - 62, 200, 46, R.round >= TOTAL_ROUNDS ? 'SEE RESULTS ▶' : 'NEXT WORD ▶', 'next', { gold: true, size: 16 });
}
function drawPlay(now){
  drawHeader();
  drawGrid(now);
  if (R.round <= 2) drawLegendFull(L.legend.x + 26, L.legend.y, 20, 12.5);
  else drawLegendCompact(L.legend.y + 4);
  drawScoreStrip(now);
  drawKeyboard();
  if (R.phase === 'roundEnd') drawRoundEnd(now);
}
function drawFinal(){
  txt('🏁 RUN COMPLETE', W / 2, H * 0.16, 30, '#fff', 'center', 800);
  txt(gradeFor(run.solvedCount), W / 2, H * 0.16 + 52, 25, '#ffd76a', 'center', 800);
  const stats = [
    ['Words solved', run.solvedCount + ' / ' + TOTAL_ROUNDS],
    ['Total score', fmt(run.score) + ' pts'],
    ['Best guess', run.bestGuess.word ? run.bestGuess.word + ' — ' + fmt(run.bestGuess.points) + ' pts' : '—'],
    ['Best solve streak', '' + run.bestStreak]
  ];
  stats.forEach((s, i) => {
    txt(s[0], W / 2 - 14, H * 0.36 + i * 36, 15, '#9a92c9', 'right', 600);
    txt(s[1], W / 2 + 14, H * 0.36 + i * 36, 16, '#fff', 'left', 800);
  });
  drawButton(W / 2 - 110, H * 0.68, 220, 58, '↻ PLAY AGAIN', 'again', { gold: true, size: 18 });
}
function drawKeyboard(){
  for (const ch in L.keys){
    const k = L.keys[ch];
    if (ch === 'ENTER' || ch === 'BK'){
      rr(k.x, k.y, k.w, k.h, 9); ctx.fillStyle = '#4b4370'; ctx.fill();
      txt(ch === 'ENTER' ? 'ENTER' : '⌫', k.x + k.w / 2, k.y + k.h / 2 + 1, ch === 'ENTER' ? 12 : 19, '#fff', 'center', 800);
      hot.push({ x: k.x, y: k.y, w: k.w, h: k.h, action: 'key:' + ch });
      continue;
    }
    const st = R ? (R.keyState[ch] || 0) : 0;
    let fill = '#6b6390';
    if (st === 3) fill = TILE_COLORS[2]; else if (st === 2) fill = TILE_COLORS[1]; else if (st === 1) fill = '#3d3d52';
    rr(k.x, k.y, k.w, k.h, 9); ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1; ctx.stroke();
    txt(ch, k.x + k.w / 2, k.y + k.h / 2 + 1, 17, '#fff', 'center', 800);
    hot.push({ x: k.x, y: k.y, w: k.w, h: k.h, action: 'key:' + ch });
  }
}

/* ================= INPUT ================= */
function handleKey(k){
  if (screen !== 'play' || !R || R.phase !== 'input' || anim) return;
  if (k === 'ENTER'){ submitGuess(); return; }
  if (k === 'BK'){ if (R.input.length){ R.input = R.input.slice(0, -1); sfx.key(); } return; }
  if (/^[A-Z]$/.test(k) && R.input.length < 5){ R.input += k; sfx.key(); }
}
function doAction(a){
  if (a === 'start' || a === 'again'){ sfx.click(); newRun(); return; }
  if (a === 'next'){ sfx.click(); nextRound(); return; }
  if (a.indexOf('key:') === 0){ handleKey(a.slice(4)); return; }
}
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (screen === 'play' && anim){ anim.skip = true; return; }
  const x = e.clientX, y = e.clientY;
  for (let i = hot.length - 1; i >= 0; i--){
    const z = hot[i];
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h){ doAction(z.action); e.preventDefault(); return; }
  }
});
document.addEventListener('keydown', e => {
  if (screen === 'play'){
    if (anim){ anim.skip = true; return; }
    if (R && R.phase === 'roundEnd' && e.key === 'Enter'){ doAction('next'); return; }
    if (e.key === 'Enter') handleKey('ENTER');
    else if (e.key === 'Backspace'){ handleKey('BK'); e.preventDefault(); }
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
  } else if (e.key === 'Enter'){
    if (screen === 'title') doAction('start');
    else if (screen === 'final') doAction('again');
  }
});
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

/* ================= MAIN LOOP ================= */
function loop(){
  const now = performance.now();
  computeLayout();
  updateAnim(now);
  updatePhases(now);
  if (run){
    run.dispScore += (run.score - run.dispScore) * 0.22;
    if (Math.abs(run.score - run.dispScore) < 1) run.dispScore = run.score;
  }
  hot = [];
  drawBG(now);
  if (screen === 'title') drawTitle(now);
  else if (screen === 'play') drawPlay(now);
  else if (screen === 'final') drawFinal();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

/* ================= DEBUG HANDLE ================= */
window.__dbg = {
  get screen(){ return screen; },
  get round(){ return R ? R.round : 0; },
  get score(){ return run ? run.score : 0; },
  get solved(){ return run ? run.solvedCount : 0; },
  get streak(){ return run ? run.streak : 0; },
  get phase(){ return R ? R.phase : null; },
  get guesses(){ return R ? R.guesses.map(g => ({ word: g.word, fb: g.fb.slice(), points: g.points })) : []; },
  get howto(){ return HOWTO; },
  get legend(){ return LEGEND.map(l => l.text); },
  targetWord(){ return R ? R.target : null; },
  startRun(){ newRun(); },
  nextRound(){ if (R && R.phase === 'roundEnd') nextRound(); },
  submitGuess(word){
    if (!R || R.phase !== 'input') return false;
    R.input = ('' + word).toUpperCase().slice(0, 5);
    submitGuess();
    return R.phase === 'anim';
  },
  skipAnim(){ if (anim) anim.skip = true; },
  keyRect(ch){
    const k = L.keys[ch]; if (!k) return null;
    return { x: k.x + k.w / 2, y: k.y + k.h / 2, w: k.w, h: k.h };
  }
};
</script>
