function resize(){

/* ================= AUDIO (synthesized, iOS-safe) ================= */
let AC = null;
function audioInit(){
  try{
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  }catch(e){}
  if (!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
    if (AC){
      // 1-sample silent buffer unlock inside the gesture
      try{
        const b = AC.createBuffer(1, 1, AC.sampleRate);
        const s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
      }catch(e){}
    }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, when, slideTo){
  if (!AC) return;
  const t0 = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {

  proc(){ [880, 1108, 1318].forEach((f, i) => tone(f, 0.12, 'triangle', 0.1, i * 0.05)); },
  slam(){ tone(196, 0.18, 'sine', 0.22); tone(98, 0.22, 'sine', 0.18, 0.01); },
  buy(){ tone(1568, 0.09, 'square', 0.08); tone(2093, 0.16, 'square', 0.08, 0.07); },
  invalid(){ tone(140, 0.16, 'sawtooth', 0.1, 0, 90); },
  alarm(){ [0, 0.16, 0.32].forEach(d => tone(620, 0.14, 'sawtooth', 0.1, d, 440)); },

};

let screen = 'title'; // title | intro | play | shop | victory | gameover

function setMsg(t, dur){ msg = t; msgUntil = performance.now() + (dur || 1800); }

function newRun(){
  run = { blindIdx: 0, coins: 6, cards: [], baseMult: 0, blindsBeaten: 0,
          bestGuess: 0, solvedCount: 0, pendingChips: 0, totalScore: 0 };
  startBlind();
  screen = 'intro';
}
function bossFor(blindNum){ return BOSS_BY_BLIND[blindNum] || null; }
function startBlind(){
  const prevWord = B ? B.word : null;
  let w = ANSWERS[(Math.random() * ANSWERS.length) | 0];
  let guard = 0;
  while (w === prevWord && guard++ < 20) w = ANSWERS[(Math.random() * ANSWERS.length) | 0];
  const n = run.blindIdx + 1;
  B = { word: w, target: BLIND_TARGETS[run.blindIdx], boss: bossFor(n),
        guesses: [], input: '', score: 0, dispScore: 0,
        keyState: {}, phase: 'input', solvedBlind: false };
  anim = null;
}
function blindNum(){ return run ? run.blindIdx + 1 : 0; }


/* ================= WORDLE FEEDBACK ================= */
function feedback(guess, target){
  const fb = [0,0,0,0,0], used = [false,false,false,false,false];
  for (let i = 0; i < 5; i++) if (guess[i] === target[i]){ fb[i] = 2; used[i] = true; }
  for (let i = 0; i < 5; i++){
    if (fb[i] === 2) continue;
    for (let j = 0; j < 5; j++){
      if (!used[j] && guess[i] === target[j]){ fb[i] = 1; used[j] = true; break; }
    }
  }
  return fb; // 0 gray, 1 yellow, 2 green
}

/* ================= SCORING =================
   Pipeline (documented order):
   1. Tile chips: letter value; Gray tiles count half (floor). RARE AIR doubles rare-letter chips first.
   2. Chip add-ons: CONSONANT CRUSH +100, VOWEL SURGE +40/vowel, ECHO CHAMBER +25/yellow, HOT STREAK carry +chips.
   3. Mult = 1 + run base Mult + 1/green (+2 more with GREEN THUMB) + 1/yellow + HIGH ROLLER bonus.
      COLORBLIND boss: yellows score as gray (half chips, no mult).
   4. Points = chips × mult, then score multipliers: ANAGRAMIST ×3, DOUBLE DOWN ×2,
      PALINDROME PAYDAY ×4, BIG OPENER ×1.5, NO REPEATS boss ×0.5.
   5. STRICT GRAMMARIAN: greens permanently raise run base Mult by +0.5 each (applies from next guess).
*/
function scoreGuess(word, fb){
  const colorblind = (B.boss === 'COLORBLIND');
  const sFb = fb.map(v => (colorblind && v === 1) ? 0 : v);
  const procs = [];
  const tileChips = [];
  let chips = 0;
  for (let i = 0; i < 5; i++){
    let c = CHIPS[word[i]] || 10;
    if (hasCard('RARE_AIR') && RARE_SET.has(word[i])) c *= 2;
    if (sFb[i] === 0) c = Math.floor(c / 2);
    tileChips.push(c); chips += c;
  }
  if (hasCard('RARE_AIR') && word.split('').some(ch => RARE_SET.has(ch))) procs.push('RARE_AIR');
  const vowelCount = word.split('').filter(ch => VOWELS.has(ch)).length;
  if (hasCard('CONSONANT_CRUSH') && vowelCount === 0){ chips += 100; procs.push('CONSONANT_CRUSH'); }
  if (hasCard('VOWEL_SURGE') && vowelCount > 0){ chips += 40 * vowelCount; procs.push('VOWEL_SURGE'); }
  const yellows = sFb.filter(v => v === 1).length;
  const greens  = sFb.filter(v => v === 2).length;
  if (hasCard('ECHO_CHAMBER') && yellows > 0){ chips += 25 * yellows; procs.push('ECHO_CHAMBER'); }
  if (run.pendingChips > 0 && B.guesses.length === 0){ chips += run.pendingChips; procs.push('STREAK'); run.pendingChips = 0; }

  let mult = 1 + run.baseMult + greens + yellows;
  if (hasCard('GREEN_THUMB') && greens > 0){ mult += 2 * greens; procs.push('GREEN_THUMB'); }
  if (hasCard('HIGH_ROLLER')){ const rem = 4 - (B.guesses.length + 1); if (rem > 0){ mult += rem; procs.push('HIGH_ROLLER'); } }

  let multX = 1; const xNotes = [];
  if (hasCard('ANAGRAMIST') && B.guesses.length > 0){
    const prev = new Set(B.guesses[B.guesses.length - 1].word);
    const shared = new Set(word.split('').filter(ch => prev.has(ch))).size;
    if (shared >= 4){ multX *= 3; procs.push('ANAGRAMIST'); xNotes.push('Anagram ×3'); }
  }
  if (hasCard('DOUBLE_DOWN') && word[0] === word[4]){ multX *= 2; procs.push('DOUBLE_DOWN'); xNotes.push('Double ×2'); }
  if (hasCard('PALINDROME_PAYDAY') && word === word.split('').reverse().join('')){ multX *= 4; procs.push('PALINDROME_PAYDAY'); xNotes.push('Palindrome ×4'); }
  if (hasCard('BIG_OPENER') && B.guesses.length === 0){ multX *= 1.5; procs.push('BIG_OPENER'); xNotes.push('Opener ×1.5'); }
  let bossHalf = false;
  if (B.boss === 'NOREPEAT' && new Set(word).size < 5){ multX *= 0.5; bossHalf = true; xNotes.push('No-Repeats ×½'); }

  const points = Math.round(chips * mult * multX);
  return { tileChips, chips, mult, multX, xNotes, points, procs, greens, yellows, bossHalf };
}

/* ================= GUESS FLOW ================= */
function submitGuess(){
  if (!B || B.phase !== 'input') return;
  const word = B.input;
  if (word.length < 5){ doShake(); setMsg('Too short — 5 letters!'); sfx.invalid(); return; }
  if (B.boss === 'MUTE' && (word.indexOf('E') >= 0 || word.indexOf('A') >= 0)){
    doShake(); setMsg('THE MUTE forbids E and A!'); sfx.invalid(); return;
  }
  if (!VALID.has(word.toLowerCase())){ doShake(); setMsg('Not in the word list'); sfx.invalid(); return; }
  const fb = feedback(word, B.word.toUpperCase());
  const sc = scoreGuess(word, fb);
  const solved = (word === B.word.toUpperCase());
  let solveBonus = 0, coinGain = 0;
  const entry = { word, fb, sc, solved, solveBonus: 0 };
  B.guesses.push(entry);
  // update keyboard knowledge (best state wins)
  for (let i = 0; i < 5; i++){
    const ch = word[i], cur = B.keyState[ch] || 0;
    if (fb[i] + 1 > cur) B.keyState[ch] = fb[i] + 1; // store 1 gray / 2 yellow / 3 green
  }
  B.input = '';
  B.phase = 'anim';
  anim = { entry, t0: performance.now(), stage: 0, tickCount: 0, tallyChips: 0, tallyMult: 1, shownTotal: 0, solved };
  if (solved){
    solveBonus = 500 * blindNum();
    entry.solveBonus = solveBonus;
    entry.sc.points += 0; // bonus is added on top at bar stage
    coinGain = 2;
    if (hasCard('STREAK')){ coinGain += 3; run.pendingChips = 200; entry.sc.procs.push('STREAK'); }
    entry.coinGain = coinGain;
  }
  if (hasCard('STRICT_GRAMMARIAN') && sc.greens > 0){
    run.baseMult += 0.5 * sc.greens;
    if (entry.sc.procs.indexOf('STRICT_GRAMMARIAN') < 0) entry.sc.procs.push('STRICT_GRAMMARIAN');
  }
}
function finishGuessAnim(){
  const e = anim.entry, sc = e.sc;
  B.score += sc.points + (e.solveBonus || 0);
  run.totalScore += sc.points + (e.solveBonus || 0);
  if (sc.points > run.bestGuess) run.bestGuess = sc.points;
  anim = null;
  if (e.solved){
    run.solvedCount++;
    sfx.solve();
    beatBlind(e.coinGain || 0);
    return;
  }
  if (B.score >= B.target){ beatBlind(0); return; }
  if (B.guesses.length >= 4){
    screen = 'gameover'; sfx.defeat(); return;
  }
  B.phase = 'input';
}
function beatBlind(extraCoins){
  B.solvedBlind = true;
  run.blindsBeaten++;
  const unused = 4 - B.guesses.length;
  const coins = 4 + unused + (extraCoins || 0);
  run.coins += coins;
  B.lastCoinGain = coins;
  if (blindNum() >= 8){ screen = 'victory'; sfx.victory(); return; }
  genShop();
  screen = 'shop';
}
function nextBlind(){
  run.blindIdx++;
  startBlind();
  screen = 'intro';
  if (B.boss) sfx.alarm();
}
function genShop(){
  const unowned = CARD_POOL.filter(c => !hasCard(c.id));
  // deterministic-ish shuffle
  for (let i = unowned.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = unowned[i]; unowned[i] = unowned[j]; unowned[j] = t;
  }
  shopItems = unowned.slice(0, 3).map(c => ({ card: c, sold: false }));
}
function doShake(){ shakeUntil = performance.now() + 380; shakeSeed = Math.random() * 100; }


/* ================= LAYOUT ================= */
let hot = []; // clickable zones, rebuilt every draw
function computeLayout(){
  const pad = 14;
  L.pad = pad;
  L.header = { x: pad, y: 8, w: W - 2 * pad, h: 30 };
  L.bar = { x: pad, y: 44, w: W - 2 * pad, h: 46 };
  const gridTop = 102;
  const gap = 9;
  const s = Math.min((W - 2 * pad - 4 * gap) / 5, 60);
  L.grid = { x: (W - (5 * s + 4 * gap)) / 2, y: gridTop, s, gap, h: 4 * s + 3 * gap };
  L.cards = { x: pad, y: gridTop + L.grid.h + 12, w: W - 2 * pad, h: 76 };
  L.tally = { x: pad, y: L.cards.y + L.cards.h + 8, w: W - 2 * pad, h: 108 };
  const kbH = Math.min(196, Math.max(150, H * 0.235));
  L.kb = { x: pad, y: H - kbH - 8, w: W - 2 * pad, h: kbH };
  // keyboard rects
  L.keys = {};
  const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const kgap = 5, rowH = (kbH - 2 * kgap) / 3;
  for (let r = 0; r < 3; r++){
    const y = L.kb.y + r * (rowH + kgap);
    if (r < 2){
      const n = rows[r].length;
      const kw = (L.kb.w - (n - 1) * kgap) / n;
      const x0 = L.kb.x + (r === 1 ? kw * 0.28 : 0);
      const wRow = r === 1 ? L.kb.w - kw * 0.56 : L.kb.w;
      const kw2 = (wRow - (n - 1) * kgap) / n;
      for (let i = 0; i < n; i++) L.keys[rows[r][i]] = { x: x0 + i * (kw2 + kgap), y, w: kw2, h: rowH };
    } else {
      const wide = 52;
      const n = rows[2].length;
      const kw = (L.kb.w - 2 * wide - (n + 1) * kgap) / n;
      L.keys['ENTER'] = { x: L.kb.x, y, w: wide, h: rowH };
      for (let i = 0; i < n; i++) L.keys[rows[2][i]] = { x: L.kb.x + wide + kgap + i * (kw + kgap), y, w: kw, h: rowH };
      L.keys['BK'] = { x: L.kb.x + wide + kgap + n * (kw + kgap), y, w: wide, h: rowH };
    }
  }
}

/* ================= DRAW HELPERS ================= */
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || 700) + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function drawBG(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b0b33'); g.addColorStop(0.55, '#12081f'); g.addColorStop(1, '#0a1428');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blobs = [
    [0.22, 0.16, 240, 'rgba(124,58,237,0.34)', 0.00011, 0.0],
    [0.82, 0.30, 210, 'rgba(14,165,183,0.26)', 0.00009, 2.1],
    [0.55, 0.72, 260, 'rgba(217,70,160,0.20)', 0.00007, 4.2],
    [0.15, 0.88, 180, 'rgba(245,176,65,0.13)', 0.00013, 1.2]
  ];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs){
    const bx = (b[0] + 0.05 * Math.sin(t * b[4] * 6.28 + b[5])) * W;
    const by = (b[1] + 0.05 * Math.cos(t * b[4] * 6.28 + b[5] * 1.7)) * H;
    const rg = ctx.createRadialGradient(bx, by, 0, bx, by, b[2]);
    rg.addColorStop(0, b[3]); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(bx - b[2], by - b[2], b[2] * 2, b[2] * 2);
  }
  ctx.restore();
}
function drawButton(x, y, w, h, label, action, opts){
  opts = opts || {};
  const dis = !!opts.disabled;
  const grad = ctx.createLinearGradient(0, y, 0, y + h);
  if (dis){ grad.addColorStop(0, '#3c3c4c'); grad.addColorStop(1, '#2a2a38'); }
  else if (opts.gold){ grad.addColorStop(0, '#ffd76a'); grad.addColorStop(1, '#e79b1e'); }
  else if (opts.red){ grad.addColorStop(0, '#e05252'); grad.addColorStop(1, '#b02a2a'); }
  else { grad.addColorStop(0, '#7c3aed'); grad.addColorStop(1, '#5b21b6'); }
  rr(x, y, w, h, 14); ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + 1, opts.size || 17, dis ? '#8a8a9a' : (opts.gold ? '#4a2c00' : '#fff'), 'center', 800);
  if (!dis) hot.push({ x, y, w, h, action });
}

function tileFace(x, y, s, letter, state, flipP){
  // flipP: null = settled; 0..1 flipping (first half back, second half front w/ state color)
  let sx = 1, showFront = true, st = state;
  if (flipP !== null && flipP !== undefined){
    const p = Math.max(0, Math.min(1, flipP));
    sx = Math.abs(Math.cos(p * Math.PI));
    showFront = p >= 0.5;
    if (!showFront) st = -1;
  }
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2); ctx.scale(Math.max(0.06, sx), 1); ctx.translate(-s / 2, -s / 2);
  if (st === -1){ rr(0, 0, s, s, 10); ctx.fillStyle = '#2c2c44'; ctx.fill(); ctx.strokeStyle = '#565670'; ctx.lineWidth = 2; ctx.stroke(); }
  else if (st === null || st === undefined){
    rr(0, 0, s, s, 10); ctx.fillStyle = letter ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.05)'; ctx.fill();
    ctx.strokeStyle = letter ? '#8f8fb5' : '#3d3d58'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    rr(0, 0, s, s, 10); ctx.fillStyle = TILE_COLORS[st]; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (letter && (flipP === null || flipP === undefined || showFront))
    txt(letter, s / 2, s / 2 + 2, s * 0.52, '#fff', 'center', 800);
  ctx.restore();
}
function drawGrid(now){
  const g = L.grid;
  let shX = 0;
  if (now < shakeUntil) shX = Math.sin((now - shakeSeed) * 0.09) * 6 * (1 - (shakeUntil - now) / 380);
  for (let r = 0; r < 4; r++){
    for (let c = 0; c < 5; c++){
      const x = g.x + c * (g.s + g.gap) + shX, y = g.y + r * (g.s + g.gap);
      const guess = B.guesses[r];
      if (guess){
        let flipP = null;
        if (anim && r === B.guesses.length - 1){
          const start = anim.t0 + c * 130;
          flipP = (now - start) / 300;
          if (flipP >= 1) flipP = null;
          else if (flipP < 0) flipP = 0;
        }
        tileFace(x, y, g.s, guess.word[c], guess.fb[c], flipP);
      } else if (r === B.guesses.length && screen === 'play'){
        const ch = B.input[c] || '';
        tileFace(x, y, g.s, ch, null, null);
      } else {
        tileFace(x, y, g.s, '', null, null);
      }
    }
  }
}

    txt(BOSS_INFO[B.boss].desc, W / 2, H * 0.17 + 76, 14.5, '#e8e4ff', 'center', 600);
  }
  txt('TARGET', W / 2, H * 0.36, 14, '#9a92c9', 'center', 800);
  txt(fmt(B.target) + ' PTS', W / 2, H * 0.36 + 36, 40, '#ffd76a', 'center', 800);
  txt('4 guesses · every guess scores', W / 2, H * 0.36 + 74, 14.5, '#e8e4ff', 'center', 600);
  txt('🪙 ' + fmt(run.coins) + '    Cards: ' + run.cards.length + ' / 5' + (run.baseMult ? '    Base Mult +' + run.baseMult : ''), W / 2, H * 0.52, 15, '#cbbffa', 'center', 700);
  drawButton(W / 2 - 100, H * 0.62, 200, 56, 'BEGIN', 'begin', { gold: true, size: 19 });
}
function drawPlay(now){
  drawHeader(); drawTargetBar(); drawGrid(now); drawCardsRow(now);
  drawTally(now); drawMsg(now);
  if (!anim && B && B.phase === 'input' && performance.now() >= msgUntil){
    txt('Guesses left: ' + (4 - B.guesses.length), W / 2, L.tally.y + 20, 13, '#9a92c9', 'center', 700);
  }
  drawKeyboard();
}
function drawShop(){
  txt('🛠 ETYMOLOGY SHOP', W / 2, 52, 24, '#fff', 'center', 800);
  txt('Blind ' + blindNum() + ' beaten!  🪙 ' + fmt(run.coins) + '   ·   Cards ' + run.cards.length + '/5', W / 2, 82, 14.5, '#cbbffa', 'center', 700);
  const cw = W - 56, chh = 118, x0 = 28; let y = 108;
  shopItems.forEach((it, i) => {
    const grad = ctx.createLinearGradient(0, y, 0, y + chh);
    grad.addColorStop(0, '#34245f'); grad.addColorStop(1, '#1e1238');
    rr(x0, y, cw, chh, 14); ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = it.sold ? '#3d3d52' : '#7c5cd6'; ctx.lineWidth = 2; ctx.stroke();
    txt(it.card.icon, x0 + 34, y + 36, 32, '#fff');
    txt(it.card.name, x0 + 62, y + 26, 16, it.sold ? '#777' : '#ffd76a', 'left', 800);
    // desc wrapped to 2 lines
    const words = it.card.desc.split(' '); let l1 = '', l2 = '';
    for (const w of words){
      if (!l2 && (l1 ? l1 + ' ' + w : w).length <= 30) l1 = l1 ? l1 + ' ' + w : w;
      else l2 = l2 ? l2 + ' ' + w : w;
    }
    txt(l1, x0 + 62, y + 50, 12, it.sold ? '#666' : '#e8e4ff', 'left', 600);
    txt(l2, x0 + 62, y + 66, 12, it.sold ? '#666' : '#e8e4ff', 'left', 600);
    if (it.sold) txt('OWNED ✓', x0 + cw - 52, y + 92, 14, '#8be89b', 'center', 800);
    else if (run.cards.length >= 5) txt('HAND FULL', x0 + cw - 52, y + 92, 13, '#ff9b9b', 'center', 800);
    else drawButton(x0 + cw - 104, y + 76, 88, 34, 'BUY 🪙' + it.card.cost, 'buy:' + i, { gold: run.coins >= it.card.cost, size: 14, disabled: run.coins < it.card.cost });
    y += chh + 12;
  });
  drawButton(28, y + 2, 120, 46, '↻ REROLL 🪙1', 'reroll', { size: 13.5, disabled: run.coins < 1 });
  drawButton(W - 28 - 170, y + 2, 170, 46, 'NEXT BLIND ▶', 'next', { gold: true, size: 15.5 });
  if (run.cards.length){
    txt('Owned: ' + run.cards.map(id => CARD_BY_ID[id].icon + ' ' + CARD_BY_ID[id].name).join('  ·  '), W / 2, y + 70, 10.5, '#9a92c9', 'center', 600);
  }
}
function drawEnd(win){
  txt(win ? '🏆 RUN WON!' : '💀 RUN OVER', W / 2, H * 0.18, 36, win ? '#ffd76a' : '#ff7b7b', 'center', 800);
  if (!win) txt('Blind ' + blindNum() + ' — scored ' + fmt(B.score) + ' / ' + fmt(B.target), W / 2, H * 0.18 + 46, 15.5, '#e8e4ff', 'center', 700);
  const stats = [
    ['Blinds beaten', run.blindsBeaten],
    ['Words solved', run.solvedCount],
    ['Best single guess', fmt(run.bestGuess) + ' pts'],
    ['Total score', fmt(run.totalScore) + ' pts'],
    ['Cards collected', run.cards.length]
  ];
  stats.forEach((s, i) => {
    txt(s[0], W / 2 - 14, H * 0.36 + i * 34, 15, '#9a92c9', 'right', 600);
    txt('' + s[1], W / 2 + 14, H * 0.36 + i * 34, 16, '#fff', 'left', 800);
  });
  if (run.cards.length) txt(run.cards.map(id => CARD_BY_ID[id].icon).join(' '), W / 2, H * 0.36 + 5 * 34 + 8, 22, '#fff', 'center');
  drawButton(W / 2 - 110, H * 0.72, 220, 58, '↻ PLAY AGAIN', 'again', { gold: true, size: 18 });
}

/* ================= ANIMATION UPDATE ================= */
const FLIP_STAGGER = 130, FLIP_DUR = 300;
const FLIP_TOTAL = 4 * FLIP_STAGGER + FLIP_DUR; // 820ms
function updateAnim(now){
  if (!anim) return;
  const el = now - anim.t0, sc = anim.entry.sc;
  if (anim.skip){
    anim.stage = 3; anim.tallyChips = sc.chips; anim.tallyMult = sc.mult; anim.shownTotal = sc.points;
    finishGuessAnim(); return;
  }
  const prevStage = anim.stage;
  if (el < FLIP_TOTAL){
    anim.stage = 0;
    const idx = Math.floor(el / FLIP_STAGGER);
    if (idx !== anim.tickCount && idx < 5){ anim.tickCount = idx; sfx.flip(idx); }
  } else if (el < FLIP_TOTAL + 550){
    anim.stage = 1;
    const p = (el - FLIP_TOTAL) / 550;
    anim.tallyChips = Math.round(sc.chips * p);
    const tc = Math.floor(p * 12);
    if (tc !== anim.tickCount){ anim.tickCount = tc; sfx.tick(tc); }
  } else if (el < FLIP_TOTAL + 950){
    anim.stage = 2;
    const p = (el - FLIP_TOTAL - 550) / 400;
    anim.tallyMult = 1 + (sc.mult - 1) * p;
    if (prevStage < 2){ sfx.multStep(); if (sc.procs.length){ sc.procs.forEach(id => procFlash[id] = now); sfx.proc(); } }
  } else if (el < FLIP_TOTAL + 1500){
    anim.stage = 3;
    const p = (el - FLIP_TOTAL - 950) / 300;
    anim.shownTotal = Math.round(sc.points * Math.min(1, p));
    if (prevStage < 3) sfx.slam();
  } else {
    finishGuessAnim();
  }
}

/* ================= INPUT ================= */
function handleKey(k){
  if (screen !== 'play' || !B || B.phase !== 'input' || anim) return;
  if (k === 'ENTER'){ submitGuess(); return; }
  if (k === 'BK'){ if (B.input.length){ B.input = B.input.slice(0, -1); sfx.key(); } return; }
  if (/^[A-Z]$/.test(k)){
    if (B.boss === 'MUTE' && (k === 'E' || k === 'A')){ doShake(); setMsg('THE MUTE forbids E and A!'); sfx.invalid(); return; }
    if (B.input.length < 5){ B.input += k; sfx.key(); }
  }
}
function doAction(a){
  sfx.click();
  if (a === 'start' || a === 'again'){ newRun(); return; }
  if (a === 'begin'){ screen = 'play'; return; }
  if (a === 'next'){ nextBlind(); return; }
  if (a === 'reroll'){
    if (run.coins >= 1){ run.coins -= 1; genShop(); }
    return;
  }
  if (a.indexOf('buy:') === 0){
    const it = shopItems[parseInt(a.slice(4), 10)];
    if (it && !it.sold && run.cards.length < 5 && run.coins >= it.card.cost){
      run.coins -= it.card.cost; run.cards.push(it.card.id); it.sold = true; sfx.buy();
      procFlash[it.card.id] = performance.now();
    }
    return;
  }
  if (a.indexOf('key:') === 0){ handleKey(a.slice(4)); return; }
}
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (screen === 'play' && anim){ anim.skip = true; return; }
  const x = e.clientX, y = e.clientY;
  for (let i = hot.length - 1; i >= 0; i--){
    const z = hot[i];
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h){ doAction(z.action); e.preventDefault(); return; }
  }
});
document.addEventListener('keydown', e => {
  if (e.repeat && e.key !== 'Backspace') { /* allow */ }
  if (screen === 'play'){
    if (anim){ anim.skip = true; return; }
    if (e.key === 'Enter') handleKey('ENTER');
    else if (e.key === 'Backspace'){ handleKey('BK'); e.preventDefault(); }
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
  } else if (e.key === 'Enter'){
    if (screen === 'title') doAction('start');
    else if (screen === 'intro') doAction('begin');
    else if (screen === 'shop') doAction('next');
    else if (screen === 'victory' || screen === 'gameover') doAction('again');
  }
});
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

/* ================= MAIN LOOP ================= */
function loop(){
  const now = performance.now();
  computeLayout();
  updateAnim(now);
  if (B) B.dispScore += (B.score - B.dispScore) * 0.18;
  if (B && Math.abs(B.score - B.dispScore) < 1) B.dispScore = B.score;
  hot = [];
  drawBG(now);
  if (screen === 'title') drawTitle(now);
  else if (screen === 'intro') drawIntro();
  else if (screen === 'play') drawPlay(now);
  else if (screen === 'shop') drawShop();
  else if (screen === 'victory') drawEnd(true);
  else if (screen === 'gameover') drawEnd(false);
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

/* ================= DEBUG HANDLE ================= */
window.__dbg = {
  get screen(){ return screen; },
  get blind(){ return run ? run.blindIdx + 1 : 0; },
  get target(){ return B ? B.target : 0; },
  get score(){ return B ? B.score : 0; },
  get coins(){ return run ? run.coins : 0; },
  get cards(){ return run ? run.cards.slice() : []; },
  get guessesUsed(){ return B ? B.guesses.length : 0; },
  get phase(){ return B ? B.phase : null; },
  targetWord(){ return B ? B.word : null; },
  setCoins(n){ if (run) run.coins = n; },
  forceShop(){ if (run){ genShop(); screen = 'shop'; } },
  startRun(){ newRun(); },
  skipAnim(){ if (anim) anim.skip = true; },
  keyRect(ch){
    const k = L.keys[ch]; if (!k) return null;
    return { x: k.x + k.w / 2, y: k.y + k.h / 2, w: k.w, h: k.h };
  }
};
