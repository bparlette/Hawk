    <script>
/* Playable ad runtime, shared by every game.
 *
 * Sections: config, network adapter, audio, scaling, tweens, input, effects, drawing helpers,
 * end card, main loop, boot. A game calls PA.boot(cfg, game); game provides init(), update(dt, realDt),
 * draw(ctx), and optionally onDown/onMove/onUp(x, y) and qa().
 *
 * Coordinates: the game draws in logical units. The play area is at least 720x1280 logical
 * (portrait); wider screens letterbox the play area to 9:16 and draw side panels with the logo and
 * a CTA. No network access, no emoji, sound only after the first touch.
 *
 * Helpers:
 *   PA.idle()                      never-autoplay states: wait (before the first touch), hint (2.5 s idle),
 *                                  timeout (10 s with no input: go to the end card)
 *   PA.idleHold(on)                while on, the 10 s timeout clock stays at zero (the 2.5 s hint clock still runs):
 *                                  for games the player watches on purpose (units marching, a meter filling)
 *   PA.audio.play(...)             a sound never repeats faster than cfg.soundGap s (default 0.3, ~3 a second)
 *   PA.audio.duck(level, sec)      duck the music under a payoff sound, then restore cfg.musicVolume
 *   PA.draw.hintHand(c, from, to)  the hint pointer (assets/web/hand.webp when the project has one, else a
 *                                  drawn finger) looping a tap (no `to`) or a drag; it only points;
 *                                  {urgent: true} adds a "tap now" cue for moving or timed targets
 *   PA.draw.banner(c, t, sub, o)   result text on a backing plate
 *   PA.drawEndCard options         logoMaxH, heroH, tagline, art(c, layout)
 *   PA.toClient(x, y)              logical -> client px (for qa() targets)
 *   PA.hasArt / leaveOut / coreArt only what the recording shows: an optional element with no art leaves the
 *                                  level; missing core art is a console error for QA (never a stand-in; the hint
 *                                  pointer's default finger is the one thing drawn in code instead of art)
 *   PA.actor(sheet, o)             a moving sprite from prep_assets "sheets": picks the view from the velocity,
 *                                  mirrors, steps frames by distance or fps, procedural bob/tilt/squash/lean
 * The mute button is always drawn by the runtime (cfg.mute only moves it) and is never the first move.
 *
 * Network adapter: nine network targets (see its comment). It holds the game until the container says it is
 * viewable (MRAID, Mintegral gameStart), pauses when it stops being viewable, and PA.emit('endcard') /
 * PA.emit('replay') signal gameEnd / gameRetry to the container without a call in game.js.
 */
(function () {
  "use strict";
  const PA = (window.PA = {});

  // ---------- config ----------
  const QA = window.__QA || {};
  PA.cfg = null;
  PA.game = null;
  PA.time = 0; // game time, scaled by timeScale
  PA.realTime = 0;
  PA.timeScale = 1;
  PA.img = {};
  PA.events = window.__events = [];
  PA.emit = function (name, data) {
    PA.events.push({
      name: name,
      t: Math.round(PA.realTime * 100) / 100,
      data: data || null,
    });
    // the end card and Replay tell the network container by themselves, so a game needs no extra call
    if (PA.net) {
      if (name === "endcard") PA.net.gameEnd();
      else if (name === "replay") PA.net.gameRetry();
    }
  };

  // ---------- network adapter ----------
  // The game never talks to a network directly. PA.net.cta() is its only exit and the lifecycle hooks below are
  // its only signals. build.py puts window.NETWORK in the head. Per network (contracts and what is still
  // unconfirmed: the skill's references/networks.md):
  //   meta, moloco            CTA FbPlayableAd.onCTAClick()
  //   google                  CTA ExitApi.exit()                (exitapi.js is loaded by the head)
  //   applovin, unity, mraid  CTA mraid.open(store); wait for ready, hold until viewable, pause on
  //                           viewableChange(false) / exposureChange(0)
  //   mintegral               CTA install(); gameReady() once loaded, start on gameStart(), gameEnd() at the end
  //                           card, gameRetry() on Replay, pause on gameClose()
  //   liftoff                 CTA postMessage('download'); postMessage('complete') at the end card
  //   pangle                  CTA openAppStore()                (the playable SDK is loaded by the head)
  //   web                     local preview: a tap opens the store link in a new tab
  const NET = window.NETWORK || "web";
  // AppLovin and Unity publish "the first tap must not open the store"; the generic MRAID file follows them
  const FIRST_TAP_NO_STORE = { applovin: true, unity: true, mraid: true };
  let netEnded = false,
    netHold = false;
  function netPause(on) {
    if (netHold === on) return;
    netHold = on;
    PA.emit(on ? "netHold" : "netResume");
    if (PA.audio && PA.audio.ctx) {
      if (on) PA.audio.ctx.suspend();
      else PA.audio.ctx.resume();
    }
  }
  PA.net = {
    name: NET,
    store: function () {
      const ua = navigator.userAgent;
      const ios =
        /iPhone|iPad|iPod/.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      return ios ? PA.cfg.store.ios : PA.cfg.store.android;
    },
    cta: function () {
      if (FIRST_TAP_NO_STORE[NET] && PA.input.taps < 2) {
        PA.emit("ctaHeld", { network: NET });
        return;
      }
      PA.emit("cta", { network: NET });
      try {
        if ((NET === "meta" || NET === "moloco") && window.FbPlayableAd)
          return window.FbPlayableAd.onCTAClick();
        if (NET === "google" && window.ExitApi) return window.ExitApi.exit();
        if (NET === "mintegral" && typeof window.install === "function")
          return window.install();
        if (NET === "pangle" && typeof window.openAppStore === "function")
          return window.openAppStore();
        if (NET === "liftoff") {
          window.parent.postMessage("download", "*");
          if (window.parent !== window) return; // top level = local preview: also open the store link below
        }
        if (window.mraid && window.mraid.open)
          return window.mraid.open(PA.net.store());
      } catch (e) {
        /* fall through to the plain link */
      }
      // outside an ad container (local preview) a user tap opens the store in a new tab
      window.open(PA.net.store(), "_blank");
    },
    // end card shown: once per round (PA.emit('endcard') calls it, so a game does not have to)
    gameEnd: function () {
      if (netEnded) return;
      netEnded = true;
      PA.emit("gameEnd");
      try {
        if (typeof window.gameEnd === "function") window.gameEnd(); // Mintegral
        if (NET === "liftoff") window.parent.postMessage("complete", "*"); // Liftoff
      } catch (e) {
        /* optional hook */
      }
    },
    // Replay tapped (PA.emit('replay') calls it)
    gameRetry: function () {
      if (!netEnded) return;
      netEnded = false;
      PA.emit("gameRetry");
      try {
        if (typeof window.gameRetry === "function") window.gameRetry();
      } catch (e) {
        /* optional hook */
      }
    },
    // Calls go() when the container says the ad may run: nothing moves, no hook tween, no music clock before that.
    // Networks without a start signal (Meta, Google, Moloco, Pangle, Liftoff, local preview) start at once.
    whenViewable: function (go) {
      let started = false;
      const begin = function () {
        if (!started) {
          started = true;
          PA.emit("viewable");
          go();
        }
      };
      if (NET === "mintegral" && typeof window.gameReady === "function") {
        window.gameStart = function () {
          if (started) netPause(false);
          else begin();
        };
        window.gameClose = function () {
          if (started) netPause(true);
        };
        try {
          window.gameReady();
        } catch (e) {
          begin();
        }
        return;
      }
      const m = window.mraid;
      if (
        (NET === "applovin" || NET === "unity" || NET === "mraid") &&
        m &&
        typeof m.addEventListener === "function"
      ) {
        const on = function (v) {
          if (v) {
            if (started) netPause(false);
            else begin();
          } else if (started) netPause(true);
        };
        const watch = function () {
          try {
            m.addEventListener("viewableChange", on);
          } catch (e) {
            /* MRAID 2 only */
          }
          try {
            m.addEventListener("exposureChange", function (p) {
              on(Number(p) > 0);
            });
          } catch (e) {
            /* MRAID 3 only */
          }
          let v = true;
          try {
            v = m.isViewable();
          } catch (e) {
            /* assume viewable */
          }
          if (v) begin();
        };
        let st = "default";
        try {
          st = m.getState();
        } catch (e) {
          /* assume ready */
        }
        if (st === "loading") m.addEventListener("ready", watch);
        else watch();
        return;
      }
      begin();
    },
  };

  // ---------- audio ----------
  function b64ToBuffer(uri) {
    const bin = atob(uri.slice(uri.indexOf(",") + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }
  const audio = (PA.audio = {
    ctx: null,
    master: null,
    bufs: {},
    last: {},
    music: null,
    musicGain: null,
    wantMusic: false,
    muted: false,
    // the shared mute button flips this; the master gain carries it so every sound and the music follow
    setMuted: function (m) {
      audio.muted = m;
      if (audio.master)
        audio.master.gain.setTargetAtTime(
          m ? 0 : 1,
          audio.ctx.currentTime,
          0.02,
        );
      PA.emit("mute", { muted: m });
    },
    unlock: function () {
      if (audio.ctx) {
        if (audio.ctx.state === "suspended") audio.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain();
      audio.master.connect(audio.ctx.destination);
      audio.master.gain.value = audio.muted ? 0 : 1;
      const sounds = PA.cfg.sounds || {};
      Object.keys(sounds).forEach(function (k) {
        audio.ctx.decodeAudioData(
          b64ToBuffer(sounds[k]),
          function (b) {
            audio.bufs[k] = b;
            if (k === PA.cfg.music && audio.wantMusic) audio.startMusic();
          },
          function () {
            /* a bad clip only loses its sound */
          },
        );
      });
    },
    play: function (name, vol, rate, minGap) {
      const b = audio.bufs[name];
      if (!b || audio.ctx.state !== "running") return;
      const now = audio.ctx.currentTime;
      // no sound repeats faster than about 3 times a second (cfg.soundGap, default 0.3 s): rapid repeats grate
      const gap = Math.max(
        minGap || 0,
        PA.cfg.soundGap == null ? 0.3 : PA.cfg.soundGap,
      );
      if (gap && audio.last[name] && now - audio.last[name] < gap) return;
      audio.last[name] = now;

      src.buffer = b;
      src.playbackRate.value = rate || 1;

      g.gain.value = vol == null ? 1 : vol;

      g.connect(audio.master);

      audio.wantMusic = true;

      audio.music.buffer = b;
      audio.music.loop = true;
      audio.musicGain = audio.ctx.createGain();
      audio.musicGain.gain.value = PA.cfg.musicVolume || 0.4;

        sec || 1,
        function () {

  // ---------- scaling ----------
  let canvas, ctx;

    W: 0,
    H: 0,
    dpr: 1,
    s: 1,
    gx: 0,
    gy: 0,
    gw: 0,
    gh: 0,
    w: 720,
    h: 1280,
    letterbox: false,
  });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth,
      H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    let gw = W,
      gh = H;
    view.letterbox = W / H > 0.75;
    if (view.letterbox) gw = Math.round((H * 9) / 16);
    const s = gw / gh < 720 / 1280 ? gw / 720 : gh / 1280;
    Object.assign(view, {
      W: W,
      H: H,
      dpr: dpr,
      s: s,
      gx: Math.round((W - gw) / 2),
      gy: 0,
      gw: gw,
      gh: gh,
      w: gw / s,
      h: gh / s,

    return { x: view.gx + x * view.s, y: view.gy + y * view.s };

    outQuad: function (t) {
      return t * (2 - t);

    inQuad: function (t) {
      return t * t;
    },
    inOutQuad: function (t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

    outCubic: function (t) {
      return 1 - Math.pow(1 - t, 3);

      muteHit &&
      !(
        view.letterbox &&

      )
    ) {

        q.x >= muteHit.x &&
        q.x <= muteHit.x + muteHit.w &&
        q.y >= muteHit.y &&
        q.y <= muteHit.y + muteHit.h

      view.letterbox &&

  // Nothing ever plays a move for the player.

  PA.IDLE_TIMEOUT = 10;

  //   PA.hasArt(slot)               the image is there

  //                                 (a console warning and a 'leftOut' event say so; never a stand-in)

        miss.map(function (r) { return r[1] + " (slot '" + r[0] + "')"; }).join("; ") +

  // ---------- effects ----------
  PA.makeFx = function () {
    const fx = { parts: [], texts: [] };
    fx.burst = function (x, y, o) {
      o = o || {};
      const n = o.n || 12;
      for (let i = 0; i < n && fx.parts.length < 900; i++) {
        const a = Math.random() * Math.PI * 2,
          sp = (o.speed || 300) * (0.35 + Math.random() * 0.75);
        fx.parts.push({
          x: x,
          y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - (o.lift || 0),
          g: o.gravity || 0,
          life: (o.life || 0.6) * (0.7 + Math.random() * 0.6),
          t: 0,
          size: (o.size || 9) * (0.6 + Math.random() * 0.8),
          color: o.colors
            ? o.colors[(Math.random() * o.colors.length) | 0]
            : "#fff",
          rot: Math.random() * 6,
          vr: (Math.random() - 0.5) * 14,

          drag: o.drag || 2.5,
          add: !!o.additive,

    };
    fx.text = function (x, y, str, o) {
      o = o || {};
      fx.texts.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y,
        str: str,
        t: 0,
        life: o.life || 0.7,
        size: o.size || 30,
        color: o.color || "#fff",
        rise: o.rise || 70,

          fx.parts.splice(i, 1);
          continue;

          c.lineTo(p.x + s * 0.25, p.y + s * 0.25);
          c.lineTo(p.x, p.y + s);
          c.lineTo(p.x - s * 0.25, p.y + s * 0.25);
          c.lineTo(p.x - s, p.y);
          c.lineTo(p.x - s * 0.25, p.y - s * 0.25);

  };
  const shake = { mag: 0, t: 0, dur: 0 },

    o = o || {};
    const top = o.top || "#ffe066",
      bot = o.bot || "#ff8a1f",
      ink = PA.cfg.ink || "#13244d";

    c.translate(x + w / 2, y + h / 2);

  // tutorial hand, fingertip at (x, y): the project's assets/web/hand.webp when it has one, else a drawn finger
  const HAND = { src: "", tipX: 0.276, tipY: 0.007, h: 118 };
  draw.hand = function (c, x, y, scale, press) {
    const im = PA.img.__hand;

      c.globalAlpha = 0.55;
      c.strokeStyle = "#fff";

  draw.hintHand = function (c, from, to, o) {
    o = o || {};
    const per = o.period || (o.urgent ? 0.6 : 1.4),

      c.strokeStyle = o.ringColor || "#fff36a";

        sc,
        press,

    }
    // press (0-0.2), travel (0.2-0.75), hold at the target (0.75-1)
    const k = p < 0.2 ? 0 : p > 0.75 ? 1 : PA.ease.inOutQuad((p - 0.2) / 0.55);
    c.save();
    c.globalAlpha = 0.35;
    c.strokeStyle = "#fff";
    c.lineWidth = 6;
    c.setLineDash([14, 12]);
    c.beginPath();
    c.moveTo(from.x, from.y);
    c.lineTo(to.x, to.y);
    c.stroke();
    c.restore();
    draw.hand(
      c,
      from.x + (to.x - from.x) * k,
      from.y + (to.y - from.y) * k,
      sc,
      p > 0.1 && p < 0.8,
    );
  };
  // result text on a backing plate, so it reads over any busy board. o: { y, color, subColor, w, plate, size }
  draw.banner = function (c, title, sub, o) {
    o = o || {};
    const w = o.w || Math.min(view.w - 60, 640),
      h = sub ? 190 : 130,
      x = view.w / 2 - w / 2,
      y = (o.y || view.h * 0.2) - h / 2;
    c.save();
    draw.rrect(c, x, y + 8, w, h, 34);
    c.fillStyle = "rgba(10,20,50,0.35)";
    c.fill();
    draw.rrect(c, x, y, w, h, 34);
    c.fillStyle = o.plate || "rgba(19,36,77,0.86)";
    c.fill();
    c.lineWidth = 5;
    c.strokeStyle = "rgba(255,255,255,0.55)";
    c.stroke();
    draw.text(c, title, view.w / 2, y + (sub ? 70 : h / 2), {
      size: o.size || 68,
      color: o.color || "#ffd23a",
    });
    if (sub)
      draw.text(c, sub, view.w / 2, y + 140, {
        size: 38,
        color: o.subColor || "#fff",
      });
    c.restore();
  };
  // small always-visible CTA pill
  draw.ctaPill = function (c, x, y, w, h, label) {
    const pulse = 1 + Math.sin(PA.realTime * 5) * 0.04;
    PA.pillRect = {
      x: view.gx + (x + w / 2) * view.s,
      y: view.gy + (y + h / 2) * view.s,
    };
    draw.button(
      c,
      x,
      y,
      w,
      h,
      label || PA.cfg.ctaLabel || "PLAY FREE",
      function () {
        PA.net.cta();
      },
      { scale: pulse, size: h * 0.5 },
    );
  };

  // ---------- end card ----------
  // o: { logo, hero, title, titleColor, tagline, stats: [{label, value}], replay: fn,
  //      logoMaxH (logical px, default 0.2 * height: square logos no longer run into the title),
  //      heroH (logical px, default 250, 220 with a tagline),
  //      art: function (c, layout) drawn instead of the hero, layout = { x, y, w, h } of the hero slot }
  const endFx = { t: 0 };
  PA.drawEndCard = function (c, o) {
    const w = view.w,
      h = view.h,
      t = (endFx.t += 1 / 60);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(20,50,120,0.78)");
    g.addColorStop(1, "rgba(10,25,70,0.9)");
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    // rotating light rays behind the hero keep the card alive
    c.save();
    c.translate(w / 2, h * 0.47);
    c.rotate(t * 0.25);
    c.globalAlpha = 0.16;
    c.fillStyle = "#fff";
    for (let i = 0; i < 12; i++) {
      c.rotate(Math.PI / 6);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-60, -700);
      c.lineTo(60, -700);
      c.closePath();
      c.fill();
    }
    c.restore();
    const logo = PA.img[o.logo];
    if (logo) {
      let lw = Math.min(w * 0.68, 480),
        lh = (lw * logo.height) / logo.width;
      const maxH = o.logoMaxH || h * 0.2;
      if (lh > maxH) {
        lw *= maxH / lh;
        lh = maxH;
      }
      c.drawImage(logo, w / 2 - lw / 2, h * 0.05 + Math.sin(t * 2) * 6, lw, lh);
    }
    const slot = {
      x: w / 2 - 200,
      y: h * (o.tagline ? 0.44 : 0.41),
      w: 400,
      h: o.heroH || (o.tagline ? 220 : 250),
    };
    const hero = PA.img[o.hero];
    if (o.art) o.art(c, slot);
    else if (hero) {
      const hh = slot.h,
        hw = (hh * hero.width) / hero.height;
      c.drawImage(hero, w / 2 - hw / 2, slot.y + Math.sin(t * 3) * 8, hw, hh);
    }
    if (o.title)
      draw.text(c, o.title, w / 2, h * 0.375, {
        size: 56,
        color: o.titleColor || "#ffd23a",
      });
    if (o.tagline)
      draw.text(c, o.tagline, w / 2, h * 0.375 + 52, {
        size: 30,
        color: "#fff",
      });
    const stats = o.stats || [];
    const bw = Math.min(w - 80, 600),
      bx = w / 2 - bw / 2,
      by = h * 0.625;
    if (stats.length) {
      draw.rrect(c, bx, by, bw, 120, 26);
      c.fillStyle = "rgba(255,255,255,0.14)";
      c.fill();
      c.strokeStyle = "rgba(255,255,255,0.4)";
      c.lineWidth = 3;
      c.stroke();
      stats.forEach(function (s, i) {
        const cx = bx + (bw * (i + 0.5)) / stats.length;
        draw.text(c, s.value, cx, by + 50, { size: 46, color: "#fff" });
        draw.text(c, s.label, cx, by + 92, {
          size: 22,
          color: "#9fe6ff",
          stroke: false,
        });
      });
    }
    const pulse = 1 + Math.sin(t * 6) * 0.05;
    draw.button(
      c,
      w / 2 - 210,
      h * 0.76,
      420,
      116,
      PA.cfg.ctaLabel || "PLAY FREE",
      function () {
        PA.net.cta();
      },
      { scale: pulse, size: 52 },
    );
    // the logo and hero are part of the CTA too: most taps on an end card are meant as installs
    PA.hit(0, 0, w, h * 0.6, function () {
      PA.net.cta();
    });
    if (o.replay) {
      draw.text(c, "Replay", w / 2, h * 0.9, {
        size: 30,
        color: "rgba(255,255,255,0.85)",
        stroke: false,
      });
      PA.hit(w / 2 - 90, h * 0.9 - 30, 180, 60, o.replay);
      PA.replayRect = {
        x: view.gx + (w / 2) * view.s,
        y: view.gy + h * 0.9 * view.s,
      }; // for QA
    }
  };
  PA.resetEndCard = function () {
    endFx.t = 0;
  };

  // ---------- mute button (every game) ----------
  // a small round speaker button that every playable has (it cannot be turned off), bottom-left by default;
  // cfg.mute moves it: 'bl' | 'br' | 'tl' | 'tr' | {x, y} (logical center, negative = from the right/bottom edge)
  let muteHit = null;
  function drawMute(c) {
    const pos = PA.cfg.mute || "bl";
    muteHit = null;
    const r = 26,
      m = 16;
    let x, y;
    if (typeof pos === "object") {
      x = pos.x < 0 ? view.w + pos.x : pos.x;
      y = pos.y < 0 ? view.h + pos.y : pos.y;
    } else {
      x = pos[1] === "l" ? m + r : view.w - m - r;
      y = pos[0] === "t" ? m + r + 70 : view.h - m - r;
    }
    c.save();
    c.globalAlpha = 0.92;
    c.fillStyle = "rgba(15,30,70,0.55)";
    c.beginPath();
    c.arc(x, y, r, 0, 7);
    c.fill();
    c.strokeStyle = "rgba(255,255,255,0.85)";
    c.lineWidth = 3;
    c.stroke();
    c.fillStyle = "#fff";
    c.beginPath(); // speaker body
    c.moveTo(x - 13, y - 6);
    c.lineTo(x - 6, y - 6);
    c.lineTo(x + 3, y - 13);
    c.lineTo(x + 3, y + 13);
    c.lineTo(x - 6, y + 6);
    c.lineTo(x - 13, y + 6);
    c.closePath();
    c.fill();
    c.strokeStyle = "#fff";
    c.lineWidth = 3;
    c.lineCap = "round";
    if (audio.muted) {
      c.beginPath();
      c.moveTo(x + 8, y - 7);
      c.lineTo(x + 16, y + 7);
      c.moveTo(x + 16, y - 7);
      c.lineTo(x + 8, y + 7);
      c.stroke();
    } else {
      c.beginPath();
      c.arc(x + 4, y, 8, -0.8, 0.8);
      c.stroke();
      c.beginPath();
      c.arc(x + 4, y, 14, -0.8, 0.8);
      c.stroke();
    }
    c.restore();
    PA.muteRect = { x: view.gx + x * view.s, y: view.gy + y * view.s }; // for QA
    muteHit = {
      x: x - r - 6,
      y: y - r - 6,
      w: (r + 6) * 2,
      h: (r + 6) * 2,
      fn: function () {
        audio.setMuted(!audio.muted);
      },
    };
  }

  // ---------- side panels (letterbox) ----------
  let sideBtn = null;
  function sideCtaHit(x, y) {
    return (
      sideBtn &&
      x >= sideBtn.x &&
      x <= sideBtn.x + sideBtn.w &&
      y >= sideBtn.y &&
      y <= sideBtn.y + sideBtn.h
    );
  }
  function drawSides() {
    if (!view.letterbox) {
      sideBtn = null;
      return;
    }
    const W = view.W,
      H = view.H,
      d = view.dpr;
    if (!sideCache) {
      sideCache = document.createElement("canvas");
      sideCache.width = canvas.width;
      sideCache.height = canvas.height;
      const c = sideCache.getContext("2d");
      const bg = PA.img[PA.cfg.sideBg];
      if (bg) {
        // blur by drawing tiny and scaling up: works everywhere, unlike ctx.filter
        const sc = Math.max(W / bg.width, H / bg.height) * d;
        const tiny = document.createElement("canvas");
        tiny.width = Math.max(8, Math.round(canvas.width / 24));
        tiny.height = Math.max(8, Math.round(canvas.height / 24));
        tiny
          .getContext("2d")
          .drawImage(
            bg,
            (tiny.width - (bg.width * sc) / 24) / 2,
            (tiny.height - (bg.height * sc) / 24) / 2,
            (bg.width * sc) / 24,
            (bg.height * sc) / 24,
          );
        c.imageSmoothingQuality = "high";
        c.drawImage(tiny, 0, 0, canvas.width, canvas.height);
      }
      c.fillStyle = PA.cfg.sideTint || "rgba(20,50,120,0.3)";
      c.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(sideCache, 0, 0);
    const pw = view.gx; // panel width in css px
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const logo = PA.img[PA.cfg.logo];
    if (logo && pw > 120) {
      const lw = Math.min(pw * 0.8, 420),
        lh = (lw * logo.height) / logo.width;
      ctx.drawImage(
        logo,
        pw / 2 - lw / 2,
        H / 2 - lh / 2 + Math.sin(PA.realTime * 2) * 5,
        lw,
        lh,
      );
    }
    if (pw > 120) {
      const bw = Math.min(pw * 0.7, 320),
        bh = bw * 0.3,
        bx = W - pw / 2 - bw / 2,
        by = H / 2 - bh / 2;
      sideBtn = { x: bx, y: by, w: bw, h: bh };
      draw.button(ctx, bx, by, bw, bh, PA.cfg.ctaLabel || "PLAY FREE", null, {
        scale: 1 + Math.sin(PA.realTime * 5) * 0.04,
      });
    }
  }

  // ---------- main loop ----------
  let last = 0,
    paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused || netHold || QA.pause) {
      last = now;
      return;
    } // QA.pause freezes the game while a screenshot is taken
    let dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
    last = now;
    dt *= QA.speed || 1;
    // fixed small steps keep fast-forwarded QA runs identical to real play
    while (dt > 1e-6) {
      const d = Math.min(1 / 60, dt);
      dt -= d;
      PA.realTime += d;
      const gd = d * PA.timeScale;
      PA.time += gd;
      input.idle += d;
      input.idleT = input.hold ? 0 : input.idleT + d;
      shake.t += d;
      updateTweens(gd, d);
      PA.game.update(gd, d);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PA.cfg.clearColor || "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawSides();
    ctx.save();
    const d = view.dpr;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.beginPath();
    ctx.rect(view.gx, view.gy, view.gw, view.gh);
    ctx.clip();
    ctx.setTransform(d * view.s, 0, 0, d * view.s, d * view.gx, d * view.gy);
    hitsNext = [];
    PA.game.draw(ctx);
    drawMute(ctx);
    if (flash.a > 0.01) {
      ctx.globalAlpha = flash.a;
      ctx.fillStyle = flash.color;
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.globalAlpha = 1;
    }
    hits = hitsNext;
    ctx.restore();
  }
  document.addEventListener("visibilitychange", function () {
    paused = document.hidden;
    if (audio.ctx) {
      if (paused) audio.ctx.suspend();
      else audio.ctx.resume();
    }
  });

  // ---------- boot ----------
  // ---------- actors: one sprite sheet, any body, any direction ----------
  // A sheet from prep_assets "sheets" (window.PA_SHEETS: one atlas, frames aligned on a shared anchor) drawn
  // as a moving thing. Views are compass codes (r, dr, d, dl, l, ul, u, ur; screen y points down) and the
  // actor shows the nearest one to its heading, mirroring a view for the opposite side unless mirror: false.
  //   const a = PA.actor('hero', { size: 120, step: 26 });     in update: a.update(dt, vx, vy)   in draw: a.draw(c, x, y)
  // Options:
  //   anim        animation name from the sheet (default: its first)
  //   size        drawn height of one cell, logical units
  //   step        logical px travelled per frame, so feet never slide (walkers); or fps: frames per second
  //               (flyers, swimmers, idle loops), which runs even when it stands still
  //   rotate      true: one view turned to face the heading (top-down cars, boats, bugs, projectiles)
  //   mirror      default true; turnSlack: degrees of hysteresis before switching view (default 25)
  //   minSpeed    below this (logical px/s) it stands: frame 0, or idle: 'animName'
  //   bob, tilt, squash, lean, breathe: procedural motion on top of the frames, for sheets with few or one
  //   frame: bob px per footstep, tilt deg waddle, squash 0..0.3 on landing, lean deg into horizontal
  //   speed, breathe 0..0.05 scale while standing. stride: px per footstep (default 2 per cycle).
  //   phase       start offset in frames (desync a crowd), shadow: true for a soft ground ellipse
  PA.actor = function (name, o) {
    o = o || {};
    const S = (window.PA_SHEETS || {})[name];
    if (!S) throw new Error("no sheet " + name + " (prep_assets 'sheets')");
    const VIEW = { r: 0, dr: 45, d: 90, dl: 135, l: 180, ul: 225, u: 270, ur: 315 };
    const animNames = Object.keys(S.anims);
    function views(an) {
      const out = [];
      Object.keys(S.anims[an].views).forEach(function (v) {
        const deg = VIEW[v] == null ? 0 : VIEW[v];
        out.push({ row: S.anims[an].views[v], deg: deg, flip: false });
        if (o.mirror !== false && !o.rotate) {
          const m = (540 - deg) % 360; // reflect across the vertical axis
          if (!Object.keys(S.anims[an].views).some(function (k) { return VIEW[k] === m; }))
            out.push({ row: S.anims[an].views[v], deg: m, flip: true });
        }
      });
      return out;
    }
    function diff(a, b) {
      const d = Math.abs(a - b) % 360;
      return d > 180 ? 360 - d : d;
    }
    const a = {
      anim: o.anim || animNames[0],
      heading: o.heading == null ? 90 : o.heading,
      speed: 0,
      dist: 0,
      t: 0,
      vx: 0,
      view: null,
      frame: 0,
      setAnim: function (n) {
        if (n !== a.anim && S.anims[n]) { a.anim = n; a.view = null; }
      },
      update: function (dt, vx, vy) {
        const sp = Math.hypot(vx || 0, vy || 0);
        a.speed = sp;
        a.vx = vx || 0;
        a.t += dt;
        const moving = sp > (o.minSpeed == null ? 8 : o.minSpeed);
        if (moving) {
          a.heading = ((Math.atan2(vy, vx) * 180) / Math.PI + 360) % 360;
          a.dist += sp * dt;
        }
        const an = !moving && o.idle && S.anims[o.idle] ? o.idle : a.anim;
        const A = S.anims[an];
        if (!o.rotate) {
          const vs = views(an);
          let best = vs[0];
          vs.forEach(function (v) { if (diff(v.deg, a.heading) < diff(best.deg, a.heading)) best = v; });
          const cur = a.view && a.view.an === an ? vs.find(function (v) { return v.row === a.view.row && v.flip === a.view.flip; }) : null;
          const slack = o.turnSlack == null ? 25 : o.turnSlack;
          a.view = cur && diff(cur.deg, a.heading) <= diff(best.deg, a.heading) + slack ? { row: cur.row, flip: cur.flip, deg: cur.deg, an: an } : { row: best.row, flip: best.flip, deg: best.deg, an: an };
        } else {
          const v = views(an)[0];
          a.view = { row: v.row, flip: false, deg: v.deg, an: an };
        }
        const n = A.frames;
        const fps = o.fps || A.fps;
        // walkers step with distance; flyers (fps) and an idle animation step with time; a still walker shows frame 0
        const ph = (o.phase || 0) + (fps ? a.t * fps : moving ? a.dist / (o.step || 24) : an !== a.anim ? a.t * 6 : 0);
        a.frame = n > 1 ? Math.floor(ph) % n : 0;
      },
      draw: function (c, x, y, d) {
        d = d || {};
        if (!a.view) a.update(0, 0, 0);
        const im = PA.img[name];
        const size = d.size || o.size || S.h;
        const k = size / S.h;
        const A = S.anims[a.view.an];
        const stride = o.stride || (A.frames > 1 ? ((o.step || 24) * A.frames) / 2 : o.step || 24);
        const moving = a.speed > (o.minSpeed == null ? 8 : o.minSpeed);
        const w = Math.abs(Math.sin((a.dist / stride) * Math.PI));
        const ws = Math.sin((a.dist / stride) * Math.PI);
        let sx = 1, sy = 1, rot = 0, lift = 0;
        if (moving) {
          lift = (o.bob || 0) * w;
          rot += (o.tilt || 0) * ws;
          if (o.squash) { sy = 1 - o.squash * (1 - w); sx = 1 + o.squash * 0.6 * (1 - w); }
          if (o.lean) rot += o.lean * Math.max(-1, Math.min(1, a.vx / 300));
        } else if (o.breathe) {
          const b = Math.sin(PA.realTime * 2.4 + (o.phase || 0)) * o.breathe;
          sy = 1 + b; sx = 1 - b * 0.5;
        }
        c.save();
        if (o.shadow) {
          c.globalAlpha = (d.alpha == null ? 1 : d.alpha) * 0.22;
          c.fillStyle = "#000";
          c.beginPath();
          c.ellipse(x, y, S.w * k * 0.32, S.w * k * 0.1, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.globalAlpha = d.alpha == null ? 1 : d.alpha;
        c.translate(x, y - lift);
        if (o.rotate) c.rotate(((a.heading - a.view.deg) * Math.PI) / 180);
        if (rot) c.rotate((rot * Math.PI) / 180);
        c.scale((a.view.flip ? -1 : 1) * sx * k * (d.scale || 1), sy * k * (d.scale || 1));
        c.drawImage(im, a.frame * S.w, a.view.row * S.h, S.w, S.h, -S.ax, -S.ay, S.w, S.h);
        c.restore();
      },
    };
    return a;
  };

  PA.boot = function (cfg, game) {
    PA.cfg = cfg;
    PA.game = game;
    canvas = document.getElementById("c");
    ctx = canvas.getContext("2d");
    if (HAND.src.indexOf("data:") === 0) {
      const hi = new Image();
      hi.src = HAND.src;
      PA.img.__hand = hi;
    }
    // sprite sheets (prep_assets "sheets") load like images, under the sheet's name
    const srcs = Object.assign({}, cfg.images || {});
    Object.keys(window.PA_SHEETS || {}).forEach(function (k) {
      if (!srcs[k]) srcs[k] = window.PA_SHEETS[k].src;
    });
    const jobs = Object.keys(srcs).map(function (k) {
      return new Promise(function (res) {
        const im = new Image();
        im.onload = im.onerror = function () {
          PA.img[k] = im;
          res();
        };
        im.src = srcs[k];
      });
    });
    if (cfg.fontData && window.FontFace) {
      const ff = new FontFace(cfg.font, "url(" + cfg.fontData + ")", {
        weight: "700",
      });
      jobs.push(
        ff.load().then(
          function (f) {
            document.fonts.add(f);
          },
          function () {
            /* fall back to sans-serif */
          },
        ),
      );
    }
    Promise.all(jobs).then(function () {
      resize();
      window.addEventListener("resize", resize);
      canvas.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
      game.init();
      window.__qa = function () {
        return game.qa ? game.qa() : {};
      };
      PA.emit("start");
      PA.net.whenViewable(function () {
        requestAnimationFrame(frame);
      });
    });
  };
})();

</script>
    <script>
/* Tug Tangle: a crowded harbour seen from above. Tap a boat and it sails straight ahead, the way its bow points,
 * out to sea; a boat in its way makes it bump, honk and back up. Free the golden yacht in the middle (the payoff)
 * and clear all 27 boats to win. The harbour seal on the quay cheers, waves and flinches with every move.
 * Structure as the template: config -> reset -> input -> update (wait / play / result) -> draw -> qa() -> boot.
 * Never autoplay: before the first touch the clock is held, the free boats glow, the seal waves, the hand loops a
 * tap on a free boat. The ad ends by the goal, ROUND_S after the first touch, or 10 s idle.
 * Runs on runtime/runtime.js (window.PA).
 */
(function () {
  "use strict";
  const D = PA.draw;
  const INK = "#0d3550";
  const ROUND_S = 40;
  const HURRY_AT = 10;
  const WORLD = { w: 720, h: 1280 };
  const COLS = 8, ROWS = 10, CELL = 78;
  const BX = (WORLD.w - COLS * CELL) / 2, BY = 214;
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const ANG = { U: 0, R: Math.PI / 2, D: Math.PI, L: -Math.PI / 2 };
  const TUGS = ["tug_red", "tug_teal", "tug_yellow", "tug_purple"];
  const CONFETTI = ["#ffd23a", "#ff5a5a", "#2ad1c4", "#a46bff", "#ffffff", "#3fa0ff"];
  const FOAM = ["#ffffff", "#e8fbff", "#c9f2ff"];
  const SEAL = { x: 150, y: 1262, size: 250 };
  // tools/make_level.py, seed 2268: [col, row, length, bow direction, kind]; greedy solver clears it in 10 waves,
  // the golden yacht (first entry) leaves in wave 4
  const LEVEL = [[3, 4, 3, "U", "yacht"], [5, 8, 3, "L", "long"], [3, 7, 2, "L", "tug"], [0, 0, 2, "R", "tug"], [7, 3, 2, "U", "tug"], [4, 2, 2, "U", "tug"], [2, 8, 2, "U", "tug"], [3, 2, 2, "U", "tug"], [6, 3, 3, "D", "long"], [4, 9, 2, "L", "tug"], [4, 5, 2, "D", "tug"], [2, 4, 3, "U", "long"], [4, 4, 2, "R", "tug"], [0, 8, 2, "U", "tug"], [1, 3, 2, "L", "tug"], [1, 6, 2, "U", "tug"], [3, 8, 2, "L", "tug"], [1, 4, 2, "U", "tug"], [4, 1, 3, "R", "long"], [5, 7, 2, "R", "tug"], [5, 0, 3, "R", "long"], [2, 1, 2, "L", "tug"], [0, 5, 2, "U", "tug"], [5, 5, 2, "D", "tug"], [6, 9, 2, "L", "tug"], [0, 1, 2, "L", "tug"], [7, 6, 2, "D", "tug"]];

  let G, seal, endSeal;
  const fx = PA.makeFx(), ufx = PA.makeFx();
  let gen = 0;
  function later(sec, fn, real) {
    const g = gen;
    PA.after(sec, function () { if (g === gen) fn(); }, real);
  }

  function cellsOf(b) {
    const out = [], v = b.dir === "U" || b.dir === "D";
    for (let i = 0; i < b.len; i++) out.push(v ? [b.cx, b.cy + i] : [b.cx + i, b.cy]);
    return out;
  }
  function makeBoats() {
    let tug = 0, long = 0;
    return LEVEL.map(function (r, i) {
      const b = { id: i, cx: r[0], cy: r[1], len: r[2], dir: r[3], kind: r[4], state: "park", s: 0, v: 0, bt: 0, wob: 0, ph: i * 0.9, sq: 0, wake: 0, red: 0, jolt: 0 };
      b.img = b.kind === "yacht" ? "yacht" : b.kind === "long" ? (long++ % 2 ? "barge" : "ferry") : TUGS[tug++ % 4];
      const v = b.dir === "U" || b.dir === "D";
      b.hx = BX + (b.cx + (v ? 0.5 : b.len / 2)) * CELL;
      b.hy = BY + (b.cy + (v ? b.len / 2 : 0.5)) * CELL;

      b.y = b.hy;

  }
  function occupancy(except) {
    const occ = {};

      if (b === except || (b.state !== "park" && b.state !== "bump")) continue;
      for (const c of cellsOf(b)) occ[c[0] + "," + c[1]] = b;

  }
  // what a boat would hit sailing out: the first boat on its line, and how many free cells lie before it
  function sweep(b) {
    const occ = occupancy(b), d = DIRS[b.dir], cs = cellsOf(b);
    let x, y;
    if (b.dir === "U" || b.dir === "L") { x = cs[0][0]; y = cs[0][1]; } else { x = cs[cs.length - 1][0]; y = cs[cs.length - 1][1]; }

      gap++;

    return { blocker: null, gap: gap };
  }

  function reset() {
    gen++;

      started: false, t: 0, phase: "wait", boats: makeBoats(), out: 0, bumps: 0, taps: 0, hookA: 0, hookS: 0, hudA: 0,
      banner: null, result: null, hint: null, dirty: true, yachtOut: false, streak: 0, lastOut: -9, hurried: false,
      sa: { anim: "wave", t: 0, loop: true }, countS: 1, nudged: false, idleS: 0, lastCall: false,
    };
    G.goal = G.boats.length;
    if (!seal) seal = PA.actor("seal", { size: SEAL.size, breathe: 0.02 });
    if (!endSeal) endSeal = PA.actor("seal", { size: 230 });
    fx.parts.length = fx.texts.length = 0;
    ufx.parts.length = ufx.texts.length = 0;
    PA.tween(G, { hookA: 1, hookS: 1 }, 0.45, { ease: "outBack", delay: 0.1, real: true });
    PA.resetEndCard();
  }
  function start() {
    G.started = true;
    G.phase = "play";
    PA.tween(G, { hookA: 0 }, 0.3, { real: true });
    PA.tween(G, { hudA: 1 }, 0.3, { real: true });
    playSeal("idle");
    PA.emit("play");
  }
  function playSeal(anim, loop) { G.sa = { anim: anim, t: 0, loop: !!loop }; }

  // ---------- game ----------
  function left() { return G.goal - G.out; }
  function pickHint() {
    const parked = G.boats.filter(function (b) { return b.state === "park"; });
    if (!parked.length) return null;
    const blockerOf = {};
    parked.forEach(function (b) { const r = sweep(b); blockerOf[b.id] = r.blocker ? r.blocker.id : -1; });
    // free the yacht first: walk its chain of blockers to the free boat at its end
    const y = G.boats[0];
    if (y.state === "park") {
      let k = y.id, n = 0;
      while (blockerOf[k] >= 0 && n++ < 40) k = blockerOf[k];
      if (blockerOf[k] < 0 && G.boats[k].state === "park") return G.boats[k];
    }
    let best = null;
    parked.forEach(function (b) {
      if (blockerOf[b.id] >= 0) return;
      if (!best || b.hy < best.hy - 1 || (Math.abs(b.hy - best.hy) < 1 && b.hx < best.hx)) best = b;
    });
    return best;
  }
  // a blocked boat: a red outline at once, a lurch of at least a nudge toward the blocker, then at contact a jolt,
  // BUMP! on the boat itself, the blocker flashes too; a tap on a boat already bumping re-flashes it (no new bump)
  function flashRed(b) { PA.killTweens(b, "red"); b.red = 1; PA.tween(b, { red: 0 }, 0.6); }
  function tapBoat(b) {
    G.taps++;
    if (b.state === "bump") {
      flashRed(b);
      PA.killTweens(b, "jolt"); b.jolt = 1; PA.tween(b, { jolt: 0 }, 0.4);
      PA.audio.play("honk", 0.6, 1.1);
      return;
    }
    const r = sweep(b);
    b.s = 0;
    b.bt = 0;
    if (!r.blocker) {
      b.state = "leave";
      b.v = 260;
      b.sq = 1;
      PA.tween(b, { sq: 0 }, 0.35, { ease: "outQuad" });
      G.out++;
      G.countS = 1.35;
      PA.tween(G, { countS: 1 }, 0.35, { ease: "outBack" });
      const streakOn = G.t - G.lastOut < 1.4;
      G.streak = streakOn ? G.streak + 1 : 1;
      G.lastOut = G.t;
      PA.audio.play("go", 0.8, 0.95 + Math.min(0.25, G.streak * 0.04));
      const p = toView(b.x, b.y);
      fx.burst(p.x, p.y, { n: 14, colors: FOAM, speed: 260, life: 0.5, size: 10, shape: "circle" });
      ufx.text(p.x, p.y - 40, left() + " LEFT", { size: 28, color: "#ffffff" });
      if (G.streak === 3 || G.streak === 6 || G.streak === 10)
        ufx.text(PA.view.w / 2, toView(0, 170).y, G.streak >= 10 ? "UNSTOPPABLE!" : G.streak >= 6 ? "FULL STEAM x" + G.streak + "!" : "SMOOTH SAILING!", { size: 40, color: "#ffd23a", life: 1, rise: 16 });
      if (b.kind === "yacht") yachtFree(b);
      else if (G.sa.anim === "idle" || G.sa.anim === "wave") playSeal("cheer");
      PA.emit("clear", { out: G.out, left: left(), kind: b.kind });
      if (G.out === G.goal) later(0.8, function () { if (G.phase === "play") finish("goal"); });
    } else {
      b.state = "bump";
      flashRed(b);
      b.max = Math.max(16, r.gap * CELL + 10);
      b.hit = r.blocker;
      b.hitDone = false;

  function yachtFree(b) {
    G.yachtOut = true;
    playSeal("cheer");

    for (let i = 0; i < 3; i++)
      later(i * 0.18, function () {
        fx.burst(p.x, p.y - 60, { n: 34, colors: CONFETTI, speed: 680, gravity: 700, lift: 240, life: 1.2, size: 15 });
      }, true);
    PA.shake(10, 0.4);
    PA.flash("#fff", 0.45, 0.3);
    PA.audio.duck(0.15, 2);
    PA.audio.play("payoff", 1);
    G.banner = { text: "YACHT SET FREE!", sub: "Now clear the whole harbour", t: 0, mini: true };
    later(2, function () { if (G.banner && G.banner.text === "YACHT SET FREE!") G.banner = null; }, true);
    PA.emit("payoff", { out: G.out, t: G.t });
  }
  function resultText(why) {
    const n = left(), s = n === 1 ? " boat to go!" : " boats to go!";
    if (n <= 0) return { text: "ALL BOATS AWAY!", sub: "The harbour is yours, captain!", color: "#ffd23a" };
    if (why === "idle") return { text: "YOUR TURN, CAPTAIN!", sub: "Just " + n + s, color: "#ff8ac8" };

  }
  function finish(why) {

    G.why = why;
    G.banner = Object.assign(resultText(why), { t: 0 });
    PA.audio.duck(0.15, 2.5);
    PA.audio.play(G.result === "win" ? "win" : "fail", 1);
    playSeal(G.result === "win" ? "cheer" : "worry", true);
    if (G.result === "win")
      for (let i = 0; i < 4; i++)
        later(i * 0.25, function () {
          fx.burst(PA.view.w / 2, 380, { n: 40, colors: CONFETTI, speed: 800, gravity: 700, lift: 200, life: 1.4, size: 18 });

        if (d < bd) { bd = d; best = b; }
      }
    }
    return best;
  }

  // ---------- update ----------
  function updateBoats(dt) {
    for (const b of G.boats) {
      const d = DIRS[b.dir];

        b.x = b.hx + d[0] * b.s;
        b.y = b.hy + d[1] * b.s;

        if (b.wake <= 0) {
          b.wake = 0.05;

        }
        if (b.x < -260 || b.x > WORLD.w + 260 || b.y < -260 || b.y > WORLD.h + 260) b.state = "gone";
      } else if (b.state === "bump") {
        b.bt += dt;
        const out = Math.max(0.1, Math.min(0.26, b.max / 800));
        let s;
        if (b.bt < out) s = b.max * PA.ease.inQuad(b.bt / out);
        else {
          if (!b.hitDone) {
            b.hitDone = true;
            b.hit.wob = 1;
            b.wob = 0.6;
            flashRed(b.hit);
            PA.killTweens(b, "jolt"); b.jolt = 1; PA.tween(b, { jolt: 0 }, 0.45);
            PA.audio.play("honk", 0.8);
            PA.shake(4, 0.15);
            const front = (b.len * CELL) / 2, p = toView(b.hx + d[0] * (s = b.max) + d[0] * front, b.hy + d[1] * b.max + d[1] * front);
            const bc = toView(b.hx + d[0] * b.max * 0.5, b.hy + d[1] * b.max * 0.5);
            ufx.text(bc.x, bc.y - 34, "BUMP!", { size: 38, color: "#ff5a5a", life: 0.9, rise: 40 });
            fx.burst(p.x, p.y, { n: 16, colors: FOAM, speed: 300, life: 0.45, size: 11, shape: "circle" });
            if (G.sa.anim !== "worry") playSeal("worry");
          }
          s = b.max * (1 - PA.ease.inOutQuad(Math.min(1, (b.bt - out - 0.06) / 0.32)));

  const FPS = { cheer: 12, worry: 10, wave: 10 };

      if (fr >= A[G.sa.anim].frames) {
        if (G.sa.loop) G.sa.t = 0;

    if (!G.started) return;

    G.idleS += rdt || dt;

      G.nudged = true;
      playSeal("wave");

    }
    G.t += dt;
    if (!G.hurried && left() > 0 && ROUND_S - G.t < HURRY_AT) {
      G.hurried = true;
      playSeal("worry", true);
      ufx.text(PA.view.w / 2, toView(0, 170).y, "HURRY, CAPTAIN!", { size: 40, color: "#ff8ac8", life: 1.4, rise: 16 });

    if (!G.lastCall && left() > 0 && left() <= 5 && ROUND_S - G.t < 7) {
      G.lastCall = true;

  // ---------- input ----------
  function onDown(x, y) {
    if (G.phase === "end" || G.phase === "result") return;
    if (!G.started) start();
    G.idleS = 0;
    G.nudged = false;
    const b = hitBoat(x, y);
    if (b) tapBoat(b);
  }

  // ---------- draw ----------
  function worldFit() {
    const v = PA.view, s = Math.min(v.w / WORLD.w, v.h / WORLD.h);
    return { s: s, x: (v.w - WORLD.w * s) / 2, y: (v.h - WORLD.h * s) / 2 };
  }
  function toWorld(x, y) { const f = worldFit(); return { x: (x - f.x) / f.s, y: (y - f.y) / f.s }; }
  function toView(x, y) { const f = worldFit(); return { x: f.x + x * f.s, y: f.y + y * f.s }; }
  function drawBg(c) {
    const v = PA.view, bg = PA.img.bg, sh = PA.shakeOffset();
    const s = Math.max(v.w / bg.width, v.h / bg.height);
    c.drawImage(bg, (v.w - bg.width * s) / 2 + sh.x, (v.h - bg.height * s) / 2 + sh.y, bg.width * s, bg.height * s);
  }
  function drawBasin(c) {
    // mooring lines: a rope frame and buoy dots at the cell corners, so the lanes read
    c.save();
    c.fillStyle = "rgba(8,60,90,0.16)";
    D.rrect(c, BX - 8, BY - 8, COLS * CELL + 16, ROWS * CELL + 16, 22);
    c.fill();
    c.strokeStyle = "rgba(255,240,210,0.55)";
    c.lineWidth = 4;
    c.setLineDash([14, 10]);
    c.stroke();
    c.setLineDash([]);
    c.fillStyle = "rgba(255,255,255,0.28)";
    for (let i = 1; i < COLS; i++)
      for (let j = 1; j < ROWS; j++) {
        c.beginPath();
        c.arc(BX + i * CELL, BY + j * CELL, 3, 0, Math.PI * 2);
        c.fill();
      }
    c.restore();
  }
  function drawBoat(c, b) {
    const im = PA.img[b.img];
    const L = b.len * CELL - (b.kind === "tug" ? 14 : 10);
    const W = b.kind === "tug" ? CELL - 10 : CELL - 8;
    const glow = G.phase !== "result" && b.state === "park" && G.hint === b;
    c.save();
    c.translate(b.x, b.y);
    let a = ANG[b.dir];
    if (b.state === "park") a += Math.sin(b.ph * 1.7) * 0.015;
    if (b.wob) a += Math.sin(b.wob * 26) * 0.09 * b.wob;

      c.fillStyle = "#fff6b0";
      D.rrect(c, -W / 2 - 8, -L / 2 - 8, W + 16, L + 16, W / 2);
      c.fill();
      c.restore();
    }
    c.globalAlpha = 0.25;
    c.fillStyle = "#06324a";
    D.rrect(c, -W / 2 + 4, -L / 2 + 8, W, L, W / 2);
    c.fill();
    c.globalAlpha = 1;
    c.drawImage(im, (-W * sw) / 2, (-L * sl) / 2, W * sw, L * sl);
    if (b.red > 0.01) {
      c.save();
      c.globalAlpha = Math.min(1, b.red * 2);
      c.lineWidth = 6;
      c.strokeStyle = "#ff3b3b";
      D.rrect(c, -W / 2 - 5, -L / 2 - 5, W + 10, L + 10, W / 2);
      c.stroke();
      c.globalAlpha = Math.min(0.35, b.red * 0.7);
      c.fillStyle = "#ff3b3b";
      c.fill();
      c.restore();
    }
    // the bow chevron: which way it sails
    c.translate(0, -L / 2 + 22);
    c.beginPath();
    c.moveTo(-11, 7);
    c.lineTo(0, -5);
    c.lineTo(11, 7);
    c.lineWidth = 7;
    c.strokeStyle = "rgba(13,53,80,0.75)";
    c.lineCap = "round";
    c.lineJoin = "round";
    c.stroke();
    c.lineWidth = 3.5;
    c.strokeStyle = "#ffffff";
    c.stroke();
    c.restore();
  }
  function sealFrame() {
    if (G.sa.anim === "idle") return 0;
    const A = PA_SHEETS.seal.anims[G.sa.anim];
    return Math.min(A.frames - 1, Math.floor(G.sa.t * FPS[G.sa.anim]));
  }
  function drawSeal(c) {
    seal.setAnim(G.sa.anim === "idle" ? "wave" : G.sa.anim);
    seal.frame = sealFrame();
    c.save();
    c.globalAlpha = 0.25;
    c.fillStyle = "#3a2a1a";
    c.beginPath();
    c.ellipse(SEAL.x, SEAL.y - 4, 90, 18, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
    seal.draw(c, SEAL.x, SEAL.y);
  }
  function drawHud(c) {
    const v = PA.view;
    if (G.phase !== "end") D.ctaPill(c, v.w - 196, 30, 172, 62);
    if (G.hudA <= 0.01) return;
    c.save();
    c.globalAlpha = G.hudA;
    D.rrect(c, 96, 30, 190, 62, 31);
    c.fillStyle = "rgba(13,53,80,0.85)";
    c.fill();
    const tg = PA.img.tug_red, th = 50, tw = (th * tg.width) / tg.height;
    c.drawImage(tg, 110, 36, tw, th);
    c.save();
    c.translate(206, 62);
    c.scale(G.countS, G.countS);
    D.text(c, left() + " LEFT", 0, 0, { size: 28 });
    c.restore();
    const lt = Math.max(0, Math.ceil(ROUND_S - G.t));
    const hurry = lt <= HURRY_AT && G.phase === "play";
    const pulse = hurry ? 1 + 0.08 * Math.abs(Math.sin(PA.realTime * 6)) : 1;
    c.translate(v.w / 2 + 30, 61);
    c.scale(pulse, pulse);
    D.rrect(c, -62, -31, 124, 62, 31);
    c.fillStyle = hurry ? "#ff4f6d" : "rgba(13,53,80,0.85)";
    c.fill();
    D.text(c, "0:" + String(lt).padStart(2, "0"), 0, 1, { size: 32 });
    c.restore();
  }
  function drawHook(c) {
    if (G.hookA <= 0.01) return;
    const v = PA.view, f = worldFit();
    c.save();
    c.globalAlpha = G.hookA;
    c.translate(v.w / 2, f.y + 132 * f.s);
    c.scale(G.hookS * f.s * 0.86, G.hookS * f.s * 0.86);
    D.rrect(c, -280, -38, 560, 76, 38);
    c.fillStyle = "#ff8a1f";
    c.fill();
    c.lineWidth = 6;
    c.strokeStyle = "#ffffff";
    c.stroke();
    D.text(c, "SET ALL " + LEVEL.length + " BOATS FREE!", 0, 2, { size: 36 });
    c.restore();
  }
  function lanesOn() { return G.phase === "wait" || (G.phase === "play" && PA.idle().hint); }
  function drawLanes(c) {
    if (!lanesOn()) return;
    const t = PA.realTime;
    for (const b of G.boats) {
      if (b.state !== "park" || sweep(b).blocker) continue;
      const d = DIRS[b.dir], half = (b.len * CELL) / 2;
      const x = b.hx + d[0] * (half + 14), y = b.hy + d[1] * (half + 14);
      // to just past the basin edge, and always at least three chevrons (a boat on the edge still shows its way)
      const L = Math.max(96, b.dir === "U" ? y - (BY - 40) : b.dir === "D" ? BY + ROWS * CELL + 40 - y : b.dir === "L" ? x - (BX - 40) : BX + COLS * CELL + 40 - x);
      c.save();
      c.translate(x, y);
      c.rotate(ANG[b.dir]);
      const off = (t * 60) % 30;
      for (let s = off; s < L; s += 30) {
        const a = Math.min(1, s / 40) * Math.max(0, 1 - s / (L + 30));
        c.globalAlpha = 0.45 + 0.55 * a;
        c.beginPath();
        c.moveTo(-11, -s + 7);
        c.lineTo(0, -s - 5);
        c.lineTo(11, -s + 7);
        c.lineCap = "round";
        c.lineJoin = "round";
        c.lineWidth = 9;
        c.strokeStyle = "rgba(13,53,80,0.55)";
        c.stroke();
        c.lineWidth = 5;
        c.strokeStyle = "#ffffff";
        c.stroke();
      }
      c.restore();
    }
  }
  function drawHint(c) {
    if ((G.phase !== "play" && G.phase !== "wait") || !G.hint) return;
    if (!G.started || PA.idle().hint) D.hintHand(c, toView(G.hint.hx, G.hint.hy), null, { period: 1.1 });
  }
  // a compact plate in the strip between the HUD and the basin (world y 150), so no boat is covered
  function drawCallout(c, b) {
    const f = worldFit(), k = Math.min(1, b.t / 0.25), s = PA.ease.outBack(k);
    const fade = b.t > 1.7 ? Math.max(0, 1 - (b.t - 1.7) / 0.3) : 1;
    c.save();
    c.globalAlpha = fade;
    c.translate(PA.view.w / 2, toView(0, 152).y);
    c.scale(s * f.s, s * f.s);
    D.rrect(c, -290, -44, 580, 88, 44);
    c.fillStyle = "rgba(13,53,80,0.92)";
    c.fill();
    c.lineWidth = 4;
    c.strokeStyle = "#ffd23a";
    c.stroke();
    D.text(c, b.text, 0, -13, { size: 44, color: "#ffd23a" });
    D.text(c, b.sub, 0, 25, { size: 22, color: "#ffffff" });
    c.restore();
  }
  function drawBanner(c) {
    const b = G.banner;
    if (!b) return;
    if (b.mini) return drawCallout(c, b);
    const k = Math.min(1, b.t / 0.25), s = PA.ease.outBack(k), y = toView(0, 140).y + 60;
    c.save();
    c.translate(PA.view.w / 2, y);
    c.scale(s, s);
    c.translate(-PA.view.w / 2, -y);
    D.banner(c, b.text, b.sub, { y: y, color: b.color || "#ffd23a" });
    c.restore();
  }
  function draw(c) {
    drawBg(c);
    if (G.phase === "end") {
      const r = G.result ? resultText(G.why) : null;
      PA.drawEndCard(c, {
        logo: "logo",
        logoMaxH: 210,
        title: r ? r.text : "CAN YOU CLEAR THE HARBOUR?",
        titleColor: G.result === "win" ? "#ffd23a" : "#ff8ac8",
        tagline: r ? r.sub : "Tap a boat, it sails its way",
        art: function (cc, L) {
          endSeal.setAnim(G.result === "win" ? "cheer" : G.result ? "worry" : "wave");
          const A = PA_SHEETS.seal.anims[endSeal.anim];
          endSeal.frame = Math.floor(PA.realTime * 10) % A.frames;
          endSeal.draw(cc, L.x + L.w / 2, L.y + L.h + 6, { size: L.h + 24 });
        },
        stats: G.result ? [{ label: "SAILED", value: G.out + "/" + G.goal }, { label: "BUMPS", value: String(G.bumps) }] : [],
        replay: function () { PA.emit("replay"); PA.clearTweens(); reset(); },
      });
      return;
    }
    const f = worldFit(), sh = PA.shakeOffset();
    c.save();
    c.translate(f.x + sh.x, f.y + sh.y);
    c.scale(f.s, f.s);
    drawBasin(c);
    drawLanes(c);
    for (const b of G.boats) if (b.state === "park" || b.state === "bump") drawBoat(c, b);
    for (const b of G.boats) if (b.state === "leave") drawBoat(c, b);
    drawSeal(c);
    c.restore();
    fx.draw(c);
    drawHud(c);
    drawHook(c);
    drawHint(c);
    ufx.draw(c);
    drawBanner(c);
  }

  const game = {
    init: reset,
    update: update,
    draw: draw,
    onDown: onDown,
    qa: function () {
      const v = PA.view;
      const parked = G.boats.filter(function (b) { return b.state === "park"; });
      const free = [], blocked = [];
      parked.forEach(function (b) {
        const p = toView(b.hx, b.hy), q = PA.toClient(p.x, p.y);
        (sweep(b).blocker ? blocked : free).push(q);
      });
      return {
        phase: G.phase, t: G.t, out: G.out, goal: G.goal, left: left(), bumps: G.bumps, result: G.result,
        yacht: G.yachtOut, seal: G.sa.anim, scale: v.s, progress: G.taps,
        tap: G.hint ? PA.toClient(toView(G.hint.hx, G.hint.hy).x, toView(G.hint.hx, G.hint.hy).y) : null,
        free: free, blocked: blocked,
        cta: PA.toClient(v.w / 2, v.h * 0.76 + 58),
      };
    },
  };
  PA.boot(window.GAME_CFG, game);
})();

</script>
