    <script>
/* Playable ad runtime, shared by every game.
 *
 * Sections: config, network adapter, audio, scaling, tweens, input, effects, drawing helpers,
 * end card, main loop, boot. A game calls PA.boot(cfg, game); game provides init(), update(dt, realDt),
 * draw(ctx), and optionally onDown/onMove/onUp(x, y) and qa().
 *
 * Coordinates: the game draws in logical units. The play area is at least 720x1280 logical
 * (portrait); wider screens letterbox the play area to 9:16 and draw side panels with the logo and
 * a CTA. No network access, no emoji, sound only after the first touch.
 *
 * Helpers:
 *   PA.idle()                      never-autoplay states: wait (before the first touch), hint (2.5 s idle),
 *                                  timeout (10 s with no input: go to the end card)
 *   PA.idleHold(on)                while on, the 10 s timeout clock stays at zero (the 2.5 s hint clock still runs):
 *                                  for games the player watches on purpose (units marching, a meter filling)
 *   PA.audio.play(...)             a sound never repeats faster than cfg.soundGap s (default 0.3, ~3 a second)
 *   PA.audio.duck(level, sec)      duck the music under a payoff sound, then restore cfg.musicVolume
 *   PA.draw.hintHand(c, from, to)  the hint pointer (assets/web/hand.webp when the project has one, else a
 *                                  mouse-pointer arrow) looping a tap (no `to`) or a drag; it only points;
 *                                  {urgent: true} adds a "tap now" cue for moving or timed targets
 *   PA.draw.banner(c, t, sub, o)   result text on a backing plate
 *   PA.drawEndCard options         logoMaxH, heroH, tagline, art(c, layout)
 *   PA.toClient(x, y)              logical -> client px (for qa() targets)
 *   PA.hasArt / leaveOut / coreArt only what the recording shows: an optional element with no art leaves the
 *                                  level; missing core art is a console error for QA (never a stand-in; the hint
 *                                  pointer's arrow is the one thing drawn in code instead of art)
 *   PA.actor(sheet, o)             a moving sprite from prep_assets "sheets": picks the view from the velocity,
 *                                  mirrors, steps frames by distance or fps, procedural bob/tilt/squash/lean
 * The mute button is always drawn by the runtime (cfg.mute only moves it) and is never the first move.
 *
 * Network adapter: nine network targets (see its comment). It holds the game until the container says it is
 * viewable (MRAID, Mintegral gameStart), pauses when it stops being viewable, and PA.emit('endcard') /
 * PA.emit('replay') signal gameEnd / gameRetry to the container without a call in game.js.
 */
(function () {
  "use strict";
  const PA = (window.PA = {});

  // ---------- config ----------
  const QA = window.__QA || {};
  PA.cfg = null;
  PA.game = null;
  PA.time = 0; // game time, scaled by timeScale
  PA.realTime = 0;
  PA.timeScale = 1;
  PA.img = {};
  PA.events = window.__events = [];
  PA.emit = function (name, data) {
    PA.events.push({
      name: name,
      t: Math.round(PA.realTime * 100) / 100,
      data: data || null,
    });
    // the end card and Replay tell the network container by themselves, so a game needs no extra call
    if (PA.net) {
      if (name === "endcard") PA.net.gameEnd();
      else if (name === "replay") PA.net.gameRetry();
    }
  };

  // ---------- network adapter ----------
  // The game never talks to a network directly. PA.net.cta() is its only exit and the lifecycle hooks below are
  // its only signals. build.py puts window.NETWORK in the head. Per network (contracts and what is still
  // unconfirmed: the skill's references/networks.md):
  //   meta, moloco            CTA FbPlayableAd.onCTAClick()
  //   google                  CTA ExitApi.exit()                (exitapi.js is loaded by the head)

        m &&

  // ---------- audio ----------
  function b64ToBuffer(uri) {
    const bin = atob(uri.slice(uri.indexOf(",") + 1));

    ctx: null,

    bufs: {},
    last: {},

    musicGain: null,
    wantMusic: false,
    muted: false,
    // the shared mute button flips this; the master gain carries it so every sound and the music follow

      audio.muted = m;

          m ? 0 : 1,
          audio.ctx.currentTime,
          0.02,
        );
      PA.emit("mute", { muted: m });

    unlock: function () {

          b64ToBuffer(sounds[k]),

        minGap || 0,
        PA.cfg.soundGap == null ? 0.3 : PA.cfg.soundGap,
      );

  const shake = { mag: 0, t: 0, dur: 0 },
    flash = { a: 0, color: "#fff" };
  PA.shake = function (mag, dur) {
    if (mag >= shake.mag * (1 - shake.t / (shake.dur || 1))) {
      shake.mag = mag;
      shake.t = 0;
      shake.dur = dur;
    }
  };
  PA.flash = function (color, a, dur) {
    flash.color = color;
    flash.a = a;
    PA.tween(flash, { a: 0 }, dur, { real: true });
  };
  PA.shakeOffset = function () {
    if (shake.t >= shake.dur) return { x: 0, y: 0 };
    const m = shake.mag * (1 - shake.t / shake.dur);
    return {
      x: (Math.random() - 0.5) * 2 * m,
      y: (Math.random() - 0.5) * 2 * m,
    };
  };

  // ---------- drawing helpers ----------
  const draw = (PA.draw = {});
  draw.font = function (size) {
    return (
      "700 " +
      Math.round(size) +
      "px " +
      (PA.cfg.font || "sans-serif") +
      ", sans-serif"
    );
  };
  draw.rrect = function (c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  // bold text with a dark outline, the house style of mobile game HUDs
  draw.text = function (c, str, x, y, o) {
    o = o || {};
    c.font = draw.font(o.size || 32);
    c.textAlign = o.align || "center";
    c.textBaseline = o.baseline || "middle";
    c.lineJoin = "round";
    if (o.stroke !== false) {
      c.strokeStyle = o.stroke || PA.cfg.ink || "#13244d";
      c.lineWidth = o.sw || Math.max(3, (o.size || 32) * 0.18);
      c.strokeText(str, x, y);
    }
    c.fillStyle = o.color || "#fff";
    c.fillText(str, x, y);
  };
  // chunky game button; returns nothing, registers its hit area
  draw.button = function (c, x, y, w, h, label, fn, o) {
    o = o || {};
    const top = o.top || "#ffe066",
      bot = o.bot || "#ff8a1f",
      ink = PA.cfg.ink || "#13244d";
    c.save();
    c.translate(x + w / 2, y + h / 2);
    c.scale(o.scale || 1, o.scale || 1);
    c.translate(-w / 2, -h / 2);
    draw.rrect(c, 0, 6, w, h, h * 0.32);
    c.fillStyle = "rgba(10,20,50,0.35)";
    c.fill();
    draw.rrect(c, 0, 0, w, h, h * 0.32);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, top);
    g.addColorStop(1, bot);
    c.fillStyle = g;
    c.fill();
    c.lineWidth = Math.max(3, h * 0.07);
    c.strokeStyle = ink;
    c.stroke();
    draw.rrect(c, h * 0.18, h * 0.1, w - h * 0.36, h * 0.3, h * 0.15);
    c.fillStyle = "rgba(255,255,255,0.35)";
    c.fill();
    draw.text(c, label, w / 2, h * 0.53, {
      size: o.size || h * 0.46,
      color: "#fff",
      stroke: ink,
    });
    c.restore();
    if (fn) PA.hit(x, y, w, h, fn);
  };

  draw.hand = function (c, x, y, scale, press) {
    const im = PA.img.__hand;
    if (press) {
      c.save();
      c.globalAlpha = 0.55;
      c.strokeStyle = "#fff";
      c.lineWidth = 5;
      c.beginPath();
      c.arc(x, y, 24, 0, 7);
      c.stroke();
      c.restore();
    }
    c.save();
    c.translate(x, y);
    c.scale(scale || 1, scale || 1);
    c.rotate(-0.25);
    if (press) {
      c.translate(0, 4);
      c.scale(0.92, 0.92);
    }
    if (im && im.width) {
      const h = HAND.h,
        w = (h * im.width) / im.height;
      c.shadowColor = "rgba(10,20,50,0.35)";
      c.shadowBlur = 10;
      c.shadowOffsetX = 3;
      c.shadowOffsetY = 6;
      c.drawImage(im, -w * HAND.tipX, -h * HAND.tipY, w, h);
    } else {
      // no hand image: a mouse-pointer arrow, its tip on (x, y)
      c.rotate(0.25);
      c.scale(1.3, 1.3);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(0, 52);
      c.lineTo(13, 40);
      c.lineTo(22, 60);
      c.lineTo(31, 56);
      c.lineTo(22, 37);
      c.lineTo(39, 37);
      c.closePath();
      c.shadowColor = "rgba(10,20,50,0.35)";
      c.shadowBlur = 8;
      c.shadowOffsetX = 2;
      c.shadowOffsetY = 4;
      c.fillStyle = "#fff";
      c.fill();
      c.shadowColor = "transparent";
      c.lineJoin = "round";
      c.lineWidth = 3.5;
      c.strokeStyle = PA.cfg.ink || "#13244d";
      c.stroke();
    }
    c.restore();
  };
  // hint hand on a loop: a tap at `from`, or a drag from `from` to `to` ({x, y} logical). It only points.
  // o.urgent: a "tap now" cue for a moving or timed target (an air jump, a closing gap): faster loop, bigger hand,
  // and an expanding ring at the spot
  draw.hintHand = function (c, from, to, o) {
    o = o || {};
    const per = o.period || (o.urgent ? 0.6 : 1.4),
      p = (PA.realTime % per) / per,
      sc = (o.scale || 1) * (o.urgent ? 1.15 : 1);
    if (o.urgent) {
      const at = to || from,
        k = (PA.realTime * 2.2) % 1;
      c.save();
      c.globalAlpha = 0.8 * (1 - k);
      c.strokeStyle = o.ringColor || "#fff36a";
      c.lineWidth = 6;
      c.beginPath();
      c.arc(at.x, at.y, 26 + k * 46, 0, 7);
      c.stroke();
      c.restore();
    }
    if (!to) {
      const press = p > 0.55 && p < 0.85;
      draw.hand(
        c,
        from.x,
        from.y - (press ? 0 : Math.sin(p * Math.PI) * 16),
        sc,
        press,
      );
      return;
    }
    // press (0-0.2), travel (0.2-0.75), hold at the target (0.75-1)
    const k = p < 0.2 ? 0 : p > 0.75 ? 1 : PA.ease.inOutQuad((p - 0.2) / 0.55);
    c.save();
    c.globalAlpha = 0.35;
    c.strokeStyle = "#fff";
    c.lineWidth = 6;
    c.setLineDash([14, 12]);
    c.beginPath();
    c.moveTo(from.x, from.y);
    c.lineTo(to.x, to.y);
    c.stroke();
    c.restore();
    draw.hand(
      c,
      from.x + (to.x - from.x) * k,
      from.y + (to.y - from.y) * k,
      sc,
      p > 0.1 && p < 0.8,
    );
  };
  // result text on a backing plate, so it reads over any busy board. o: { y, color, subColor, w, plate, size }
  draw.banner = function (c, title, sub, o) {
    o = o || {};
    const w = o.w || Math.min(view.w - 60, 640),
      h = sub ? 190 : 130,
      x = view.w / 2 - w / 2,
      y = (o.y || view.h * 0.2) - h / 2;
    c.save();
    draw.rrect(c, x, y + 8, w, h, 34);
    c.fillStyle = "rgba(10,20,50,0.35)";
    c.fill();
    draw.rrect(c, x, y, w, h, 34);
    c.fillStyle = o.plate || "rgba(19,36,77,0.86)";
    c.fill();
    c.lineWidth = 5;
    c.strokeStyle = "rgba(255,255,255,0.55)";
    c.stroke();
    draw.text(c, title, view.w / 2, y + (sub ? 70 : h / 2), {
      size: o.size || 68,
      color: o.color || "#ffd23a",
    });
    if (sub)
      draw.text(c, sub, view.w / 2, y + 140, {
        size: 38,
        color: o.subColor || "#fff",
      });
    c.restore();
  };
  // small always-visible CTA pill
  draw.ctaPill = function (c, x, y, w, h, label) {
    const pulse = 1 + Math.sin(PA.realTime * 5) * 0.04;
    PA.pillRect = {
      x: view.gx + (x + w / 2) * view.s,
      y: view.gy + (y + h / 2) * view.s,
    };
    draw.button(
      c,
      x,
      y,
      w,
      h,
      label || PA.cfg.ctaLabel || "PLAY FREE",
      function () {
        PA.net.cta();
      },
      { scale: pulse, size: h * 0.5 },
    );
  };

  // ---------- end card ----------
  // o: { logo, hero, title, titleColor, tagline, stats: [{label, value}], replay: fn,
  //      logoMaxH (logical px, default 0.2 * height: square logos no longer run into the title),
  //      heroH (logical px, default 250, 220 with a tagline),
  //      art: function (c, layout) drawn instead of the hero, layout = { x, y, w, h } of the hero slot }
  const endFx = { t: 0 };
  PA.drawEndCard = function (c, o) {
    const w = view.w,
      h = view.h,
      t = (endFx.t += 1 / 60);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(20,50,120,0.78)");
    g.addColorStop(1, "rgba(10,25,70,0.9)");
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    // rotating light rays behind the hero keep the card alive
    c.save();
    c.translate(w / 2, h * 0.47);
    c.rotate(t * 0.25);
    c.globalAlpha = 0.16;
    c.fillStyle = "#fff";
    for (let i = 0; i < 12; i++) {
      c.rotate(Math.PI / 6);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-60, -700);
      c.lineTo(60, -700);
      c.closePath();
      c.fill();
    }
    c.restore();
    const logo = PA.img[o.logo];
    if (logo) {
      let lw = Math.min(w * 0.68, 480),
        lh = (lw * logo.height) / logo.width;
      const maxH = o.logoMaxH || h * 0.2;
      if (lh > maxH) {
        lw *= maxH / lh;
        lh = maxH;
      }
      c.drawImage(logo, w / 2 - lw / 2, h * 0.05 + Math.sin(t * 2) * 6, lw, lh);
    }
    const slot = {
      x: w / 2 - 200,
      y: h * (o.tagline ? 0.44 : 0.41),
      w: 400,
      h: o.heroH || (o.tagline ? 220 : 250),
    };
    const hero = PA.img[o.hero];
    if (o.art) o.art(c, slot);
    else if (hero) {
      const hh = slot.h,
        hw = (hh * hero.width) / hero.height;
      c.drawImage(hero, w / 2 - hw / 2, slot.y + Math.sin(t * 3) * 8, hw, hh);
    }
    if (o.title)
      draw.text(c, o.title, w / 2, h * 0.375, {
        size: 56,
        color: o.titleColor || "#ffd23a",
      });
    if (o.tagline)
      draw.text(c, o.tagline, w / 2, h * 0.375 + 52, {
        size: 30,
        color: "#fff",
      });
    const stats = o.stats || [];
    const bw = Math.min(w - 80, 600),
      bx = w / 2 - bw / 2,
      by = h * 0.625;
    if (stats.length) {
      draw.rrect(c, bx, by, bw, 120, 26);
      c.fillStyle = "rgba(255,255,255,0.14)";
      c.fill();
      c.strokeStyle = "rgba(255,255,255,0.4)";
      c.lineWidth = 3;
      c.stroke();
      stats.forEach(function (s, i) {
        const cx = bx + (bw * (i + 0.5)) / stats.length;
        draw.text(c, s.value, cx, by + 50, { size: 46, color: "#fff" });
        draw.text(c, s.label, cx, by + 92, {
          size: 22,
          color: "#9fe6ff",
          stroke: false,
        });
      });
    }
    const pulse = 1 + Math.sin(t * 6) * 0.05;
    draw.button(
      c,
      w / 2 - 210,
      h * 0.76,
      420,
      116,
      PA.cfg.ctaLabel || "PLAY FREE",
      function () {
        PA.net.cta();
      },
      { scale: pulse, size: 52 },
    );
    // the logo and hero are part of the CTA too: most taps on an end card are meant as installs
    PA.hit(0, 0, w, h * 0.6, function () {
      PA.net.cta();
    });
    if (o.replay) {
      draw.text(c, "Replay", w / 2, h * 0.9, {
        size: 30,
        color: "rgba(255,255,255,0.85)",
        stroke: false,
      });
      PA.hit(w / 2 - 90, h * 0.9 - 30, 180, 60, o.replay);
      PA.replayRect = {
        x: view.gx + (w / 2) * view.s,
        y: view.gy + h * 0.9 * view.s,
      }; // for QA
    }
  };
  PA.resetEndCard = function () {
    endFx.t = 0;
  };

  // ---------- mute button (every game) ----------
  // a small round speaker button that every playable has (it cannot be turned off), bottom-left by default;
  // cfg.mute moves it: 'bl' | 'br' | 'tl' | 'tr' | {x, y} (logical center, negative = from the right/bottom edge)
  let muteHit = null;
  function drawMute(c) {
    const pos = PA.cfg.mute || "bl";
    muteHit = null;
    const r = 26,
      m = 16;
    let x, y;
    if (typeof pos === "object") {
      x = pos.x < 0 ? view.w + pos.x : pos.x;
      y = pos.y < 0 ? view.h + pos.y : pos.y;
    } else {
      x = pos[1] === "l" ? m + r : view.w - m - r;
      y = pos[0] === "t" ? m + r + 70 : view.h - m - r;
    }
    c.save();
    c.globalAlpha = 0.92;
    c.fillStyle = "rgba(15,30,70,0.55)";
    c.beginPath();
    c.arc(x, y, r, 0, 7);
    c.fill();
    c.strokeStyle = "rgba(255,255,255,0.85)";
    c.lineWidth = 3;
    c.stroke();
    c.fillStyle = "#fff";
    c.beginPath(); // speaker body
    c.moveTo(x - 13, y - 6);
    c.lineTo(x - 6, y - 6);
    c.lineTo(x + 3, y - 13);
    c.lineTo(x + 3, y + 13);
    c.lineTo(x - 6, y + 6);
    c.lineTo(x - 13, y + 6);
    c.closePath();
    c.fill();
    c.strokeStyle = "#fff";
    c.lineWidth = 3;
    c.lineCap = "round";
    if (audio.muted) {
      c.beginPath();
      c.moveTo(x + 8, y - 7);
      c.lineTo(x + 16, y + 7);
      c.moveTo(x + 16, y - 7);
      c.lineTo(x + 8, y + 7);
      c.stroke();
    } else {
      c.beginPath();
      c.arc(x + 4, y, 8, -0.8, 0.8);
      c.stroke();
      c.beginPath();
      c.arc(x + 4, y, 14, -0.8, 0.8);
      c.stroke();
    }
    c.restore();
    PA.muteRect = { x: view.gx + x * view.s, y: view.gy + y * view.s }; // for QA
    muteHit = {
      x: x - r - 6,
      y: y - r - 6,
      w: (r + 6) * 2,
      h: (r + 6) * 2,
      fn: function () {
        audio.setMuted(!audio.muted);
      },
    };
  }

  // ---------- side panels (letterbox) ----------
  let sideBtn = null;
  function sideCtaHit(x, y) {
    return (
      sideBtn &&
      x >= sideBtn.x &&
      x <= sideBtn.x + sideBtn.w &&
      y >= sideBtn.y &&
      y <= sideBtn.y + sideBtn.h
    );
  }
  function drawSides() {
    if (!view.letterbox) {
      sideBtn = null;
      return;
    }
    const W = view.W,
      H = view.H,
      d = view.dpr;
    if (!sideCache) {
      sideCache = document.createElement("canvas");
      sideCache.width = canvas.width;
      sideCache.height = canvas.height;
      const c = sideCache.getContext("2d");
      const bg = PA.img[PA.cfg.sideBg];
      if (bg) {
        // blur by drawing tiny and scaling up: works everywhere, unlike ctx.filter
        const sc = Math.max(W / bg.width, H / bg.height) * d;
        const tiny = document.createElement("canvas");
        tiny.width = Math.max(8, Math.round(canvas.width / 24));
        tiny.height = Math.max(8, Math.round(canvas.height / 24));
        tiny
          .getContext("2d")
          .drawImage(
            bg,
            (tiny.width - (bg.width * sc) / 24) / 2,
            (tiny.height - (bg.height * sc) / 24) / 2,
            (bg.width * sc) / 24,
            (bg.height * sc) / 24,
          );
        c.imageSmoothingQuality = "high";
        c.drawImage(tiny, 0, 0, canvas.width, canvas.height);
      }
      c.fillStyle = PA.cfg.sideTint || "rgba(20,50,120,0.3)";
      c.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(sideCache, 0, 0);
    const pw = view.gx; // panel width in css px
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const logo = PA.img[PA.cfg.logo];
    if (logo && pw > 120) {
      const lw = Math.min(pw * 0.8, 420),
        lh = (lw * logo.height) / logo.width;
      ctx.drawImage(
        logo,
        pw / 2 - lw / 2,
        H / 2 - lh / 2 + Math.sin(PA.realTime * 2) * 5,
        lw,
        lh,
      );
    }
    if (pw > 120) {
      const bw = Math.min(pw * 0.7, 320),
        bh = bw * 0.3,
        bx = W - pw / 2 - bw / 2,
        by = H / 2 - bh / 2;
      sideBtn = { x: bx, y: by, w: bw, h: bh };
      draw.button(ctx, bx, by, bw, bh, PA.cfg.ctaLabel || "PLAY FREE", null, {
        scale: 1 + Math.sin(PA.realTime * 5) * 0.04,
      });
    }
  }

  // ---------- main loop ----------
  let last = 0,
    paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused || netHold || QA.pause) {
      last = now;
      return;
    } // QA.pause freezes the game while a screenshot is taken
    let dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
    last = now;
    dt *= QA.speed || 1;
    // fixed small steps keep fast-forwarded QA runs identical to real play
    while (dt > 1e-6) {
      const d = Math.min(1 / 60, dt);
      dt -= d;
      PA.realTime += d;
      const gd = d * PA.timeScale;
      PA.time += gd;
      input.idle += d;
      input.idleT = input.hold ? 0 : input.idleT + d;
      shake.t += d;
      updateTweens(gd, d);
      PA.game.update(gd, d);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PA.cfg.clearColor || "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawSides();
    ctx.save();
    const d = view.dpr;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.beginPath();
    ctx.rect(view.gx, view.gy, view.gw, view.gh);
    ctx.clip();
    ctx.setTransform(d * view.s, 0, 0, d * view.s, d * view.gx, d * view.gy);
    hitsNext = [];
    PA.game.draw(ctx);
    drawMute(ctx);
    if (flash.a > 0.01) {
      ctx.globalAlpha = flash.a;
      ctx.fillStyle = flash.color;
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.globalAlpha = 1;
    }
    hits = hitsNext;
    ctx.restore();
  }
  document.addEventListener("visibilitychange", function () {
    paused = document.hidden;
    if (audio.ctx) {
      if (paused) audio.ctx.suspend();
      else audio.ctx.resume();
    }
  });

  // ---------- boot ----------
  // ---------- actors: one sprite sheet, any body, any direction ----------
  // A sheet from prep_assets "sheets" (window.PA_SHEETS: one atlas, frames aligned on a shared anchor) drawn
  // as a moving thing. Views are compass codes (r, dr, d, dl, l, ul, u, ur; screen y points down) and the
  // actor shows the nearest one to its heading, mirroring a view for the opposite side unless mirror: false.
  //   const a = PA.actor('hero', { size: 120, step: 26 });     in update: a.update(dt, vx, vy)   in draw: a.draw(c, x, y)
  // Options:
  //   anim        animation name from the sheet (default: its first)
  //   size        drawn height of one cell, logical units
  //   step        logical px travelled per frame, so feet never slide (walkers); or fps: frames per second
  //               (flyers, swimmers, idle loops), which runs even when it stands still
  //   rotate      true: one view turned to face the heading (top-down cars, boats, bugs, projectiles)
  //   mirror      default true; turnSlack: degrees of hysteresis before switching view (default 25)
  //   minSpeed    below this (logical px/s) it stands: frame 0, or idle: 'animName'
  //   bob, tilt, squash, lean, breathe: procedural motion on top of the frames, for sheets with few or one
  //   frame: bob px per footstep, tilt deg waddle, squash 0..0.3 on landing, lean deg into horizontal
  //   speed, breathe 0..0.05 scale while standing. stride: px per footstep (default 2 per cycle).
  //   phase       start offset in frames (desync a crowd), shadow: true for a soft ground ellipse
  PA.actor = function (name, o) {
    o = o || {};
    const S = (window.PA_SHEETS || {})[name];
    if (!S) throw new Error("no sheet " + name + " (prep_assets 'sheets')");
    const VIEW = { r: 0, dr: 45, d: 90, dl: 135, l: 180, ul: 225, u: 270, ur: 315 };
    const animNames = Object.keys(S.anims);
    function views(an) {
      const out = [];
      Object.keys(S.anims[an].views).forEach(function (v) {
        const deg = VIEW[v] == null ? 0 : VIEW[v];
        out.push({ row: S.anims[an].views[v], deg: deg, flip: false });
        if (o.mirror !== false && !o.rotate) {
          const m = (540 - deg) % 360; // reflect across the vertical axis
          if (!Object.keys(S.anims[an].views).some(function (k) { return VIEW[k] === m; }))
            out.push({ row: S.anims[an].views[v], deg: m, flip: true });
        }
      });
      return out;
    }
    function diff(a, b) {
      const d = Math.abs(a - b) % 360;
      return d > 180 ? 360 - d : d;
    }
    const a = {
      anim: o.anim || animNames[0],
      heading: o.heading == null ? 90 : o.heading,
      speed: 0,
      dist: 0,
      t: 0,
      vx: 0,
      view: null,
      frame: 0,
      setAnim: function (n) {
        if (n !== a.anim && S.anims[n]) { a.anim = n; a.view = null; }
      },
      update: function (dt, vx, vy) {
        const sp = Math.hypot(vx || 0, vy || 0);
        a.speed = sp;
        a.vx = vx || 0;
        a.t += dt;
        const moving = sp > (o.minSpeed == null ? 8 : o.minSpeed);
        if (moving) {
          a.heading = ((Math.atan2(vy, vx) * 180) / Math.PI + 360) % 360;
          a.dist += sp * dt;
        }
        const an = !moving && o.idle && S.anims[o.idle] ? o.idle : a.anim;
        const A = S.anims[an];
        if (!o.rotate) {
          const vs = views(an);
          let best = vs[0];
          vs.forEach(function (v) { if (diff(v.deg, a.heading) < diff(best.deg, a.heading)) best = v; });
          const cur = a.view && a.view.an === an ? vs.find(function (v) { return v.row === a.view.row && v.flip === a.view.flip; }) : null;
          const slack = o.turnSlack == null ? 25 : o.turnSlack;
          a.view = cur && diff(cur.deg, a.heading) <= diff(best.deg, a.heading) + slack ? { row: cur.row, flip: cur.flip, deg: cur.deg, an: an } : { row: best.row, flip: best.flip, deg: best.deg, an: an };
        } else {
          const v = views(an)[0];
          a.view = { row: v.row, flip: false, deg: v.deg, an: an };
        }
        const n = A.frames;
        const fps = o.fps || A.fps;
        // walkers step with distance; flyers (fps) and an idle animation step with time; a still walker shows frame 0
        const ph = (o.phase || 0) + (fps ? a.t * fps : moving ? a.dist / (o.step || 24) : an !== a.anim ? a.t * 6 : 0);
        a.frame = n > 1 ? Math.floor(ph) % n : 0;
      },
      draw: function (c, x, y, d) {
        d = d || {};
        if (!a.view) a.update(0, 0, 0);
        const im = PA.img[name];
        const size = d.size || o.size || S.h;
        const k = size / S.h;
        const A = S.anims[a.view.an];
        const stride = o.stride || (A.frames > 1 ? ((o.step || 24) * A.frames) / 2 : o.step || 24);
        const moving = a.speed > (o.minSpeed == null ? 8 : o.minSpeed);
        const w = Math.abs(Math.sin((a.dist / stride) * Math.PI));
        const ws = Math.sin((a.dist / stride) * Math.PI);
        let sx = 1, sy = 1, rot = 0, lift = 0;
        if (moving) {
          lift = (o.bob || 0) * w;
          rot += (o.tilt || 0) * ws;
          if (o.squash) { sy = 1 - o.squash * (1 - w); sx = 1 + o.squash * 0.6 * (1 - w); }
          if (o.lean) rot += o.lean * Math.max(-1, Math.min(1, a.vx / 300));
        } else if (o.breathe) {
          const b = Math.sin(PA.realTime * 2.4 + (o.phase || 0)) * o.breathe;
          sy = 1 + b; sx = 1 - b * 0.5;
        }
        c.save();
        if (o.shadow) {
          c.globalAlpha = (d.alpha == null ? 1 : d.alpha) * 0.22;
          c.fillStyle = "#000";
          c.beginPath();
          c.ellipse(x, y, S.w * k * 0.32, S.w * k * 0.1, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.globalAlpha = d.alpha == null ? 1 : d.alpha;
        c.translate(x, y - lift);
        if (o.rotate) c.rotate(((a.heading - a.view.deg) * Math.PI) / 180);
        if (rot) c.rotate((rot * Math.PI) / 180);
        c.scale((a.view.flip ? -1 : 1) * sx * k * (d.scale || 1), sy * k * (d.scale || 1));
        c.drawImage(im, a.frame * S.w, a.view.row * S.h, S.w, S.h, -S.ax, -S.ay, S.w, S.h);
        c.restore();
      },
    };
    return a;
  };

  PA.boot = function (cfg, game) {
    PA.cfg = cfg;
    PA.game = game;
    canvas = document.getElementById("c");
    ctx = canvas.getContext("2d");
    if (HAND.src.indexOf("data:") === 0) {
      const hi = new Image();
      hi.src = HAND.src;
      PA.img.__hand = hi;
    }
    // sprite sheets (prep_assets "sheets") load like images, under the sheet's name
    const srcs = Object.assign({}, cfg.images || {});
    Object.keys(window.PA_SHEETS || {}).forEach(function (k) {
      if (!srcs[k]) srcs[k] = window.PA_SHEETS[k].src;
    });
    const jobs = Object.keys(srcs).map(function (k) {
      return new Promise(function (res) {
        const im = new Image();
        im.onload = im.onerror = function () {
          PA.img[k] = im;
          res();
        };
        im.src = srcs[k];
      });
    });
    if (cfg.fontData && window.FontFace) {
      const ff = new FontFace(cfg.font, "url(" + cfg.fontData + ")", {
        weight: "700",
      });
      jobs.push(
        ff.load().then(
          function (f) {
            document.fonts.add(f);
          },
          function () {
            /* fall back to sans-serif */
          },
        ),
      );
    }
    Promise.all(jobs).then(function () {
      resize();
      window.addEventListener("resize", resize);
      canvas.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
      game.init();
      window.__qa = function () {
        return game.qa ? game.qa() : {};
      };
      PA.emit("start");
      PA.net.whenViewable(function () {
        requestAnimationFrame(frame);
      });
    });
  };
})();

</script>
    <script>
/* Optional: this project's own parts for the sort preset engine (tier 2: preset plus one swapped part).
 * Register a part here and name it in config.json "parts"; the rest of the engine is untouched.
 * Each part gets `api` (api.G is the live state: G.st = one string per container, bottom first; api.solve,
 * api.legal, api.apply, api.count, api.move, api.select, api.finish, api.contAt, api.world, api.fx ...).
 * Endings and boosters extend the same way: window.PRESET_PARTS.endings / .boosters.
 *
 * window.PRESET_PARTS = {
 *   rule: {
 *     // the recording moves two pieces at most per move
 *     twoAtMost: {
 *       count: function (st, i) {
 *         const a = st[i];
 *         let n = 1;
 *         while (n < 2 && n < a.length && a[a.length - 1 - n] === a[a.length - 1]) n++;
 *         return n;
 *       },
 *     },
 *   },
 *   win: {
 *     // the level is won once three containers are complete (the recording's goal), not when all are sorted
 *     threeDone: function (api) {
 *       if (api.doneCount(api.G.st, api.G.ctx) >= 3) return { result: "win" };
 *       return api.ENDINGS[api.G.ending].check(api) ? { result: "close", why: api.G.ending } : null;
 *     },
 *   },
 * };
 */
window.PRESET_PARTS = window.PRESET_PARTS || {};

</script>
    <script>
/* Sort puzzle preset: tap a container, then another, and the top run of one colour moves over (ball, jelly, water,
 * nut, card or fruit sort). A level is data: config.json (window.PRESET_CONFIG, merged over DEFAULTS below: objects
 * merge, arrays replace).
 * Never autoplay: before the first touch the board waits, alive (the hinted run hops, the target pulses, pieces
 * breathe) and the hand loops tap-tap on the solver's first move. Nothing ever moves a piece for the player. Three
 * endings: the level's own ending (all sorted, a move limit or a timer), rules.roundCap seconds after the first
 * touch, and 10 s without input (straight to the end card when nothing was moved).
 *
 * State: one string per container, bottom piece first, one letter per piece (a key of `colors`). A lowercase letter
 * is a hidden piece ("?") of that colour: it shows once it is on top. Locked containers and frozen pieces open when
 * enough containers are complete, so every rule is a function of the state and one BFS solver drives the hint hand,
 * the last-move moment, the honest result text, the move limit (optimum + difficulty.spare) and the generator.
 *
 * Replaceable parts (config.parts names one of each; a project adds its own in src/parts.js as
 * window.PRESET_PARTS = {input: {myInput: {...}}}):
 *   input   tapTap | drag     {down(x, y, api), move(x, y, api), up(x, y, api), drawHint(c, hint, api)}
 *   rule    run | single      {count(st, i, j, ctx) -> pieces moved, legal?(st, i, j, ctx) -> bool}
 *   level   standard          (levelDef, api) -> {board, frozen, locked}: a fixed board, or one generated by
 *                             the solver (guaranteed solvable, optimum in a range)
 *   payoff  lidPop | sparkle  {complete(i, api), win(api)}
 *   win     level             (api) -> null | {result: "win"} (the level is sorted) | {result: "close", why}
 * Part tables in DEFAULTS.kinds (container and piece kinds) and in the code (ENDINGS, BOOSTERS) extend the same way:
 * window.PRESET_PARTS.endings / .boosters.
 * Sprites: no sheets. Pieces and containers are stills (or drawn in code: glass, bolts, shelves, liquid layers);
 * every motion is a tween. Runs on runtime/runtime.js (window.PA).
 */
(function () {
  "use strict";
  const D = PA.draw;

  // ---------- config: every tunable, overridden by config.json ----------

    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: 0, y0: 0, sc: 1, row: 0, dy: 0, raise: 0, land: 0, wig: 0, pop: 0, lidY: 0, lidA: 0, glow: 0, done: false, flip: null, ice: 1, lock: 1 });
    return out;
  }
  function startLevel(li) {
    const L = CFG.levels[li];
    if (!BUILT[li]) BUILT[li] = Pt.level(L, api);
    const built = BUILT[li];
    G.li = li;
    G.L = L;
    G.ctx = makeCtx(built);
    G.st = normalize(built.board);
    G.conts = makeConts(G.st.length);
    G.optimal = built.optimal != null ? built.optimal : solve(G.st, G.ctx).dist;
    G.ending = L.ending || "sorted";
    if (!ENDINGS[G.ending]) throw new Error("no ending " + G.ending);
    G.limit = null;
    G.movesLeft = null;
    G.levelTime = null;
    G.levelT = 0;
    ENDINGS[G.ending].init(L, api);
    // polish 2026-11-05: a timer level's candle starts burning on the player's first tap in that level
    G.lit = G.levelTime == null;
    G.quiet = 0;
    G.levelMoves = 0;
    G.levelDone = 0;
    G.progress = [];
    G.slots = new Set(G.st.join("").toUpperCase().split("")).size;
    G.hist = [];
    G.lastMove = null;
    G.sel = -1;
    G.drag = null;
    G.added = false;
    G.st.forEach(function (s, i) {
      if (isDone(s, G.ctx)) {
        G.conts[i].done = true;
        G.conts[i].lidA = 1;
      }
    });
    layout();
    PA.emit("level", { n: li, optimal: G.optimal, limit: G.limit, time: G.levelTime });
  }
  function lastLevel() {
    return G.li === CFG.levels.length - 1;
  }

  // ---------- the verb ----------
  function playing() {
    return G.phase === "play" && !G.result;
  }
  function free() {
    return playing() && !G.fly && !G.trans;
  }
  function canPick(i) {
    const s = G.st[i];
    return s && !isDone(s, G.ctx) && !isLocked(i, G.st, G.ctx) && takeable(G.st, i, G.ctx) > 0;
  }
  function select(i) {
    G.sel = i;
    G.lit = true;
    PA.killTweens(G.lift);
    G.lift.a = 0;
    PA.tween(G.lift, { a: 1 }, F.lift, { ease: "outQuad" });
    if (LIQUID) PA.tween(G.conts[i], { raise: 26 }, F.lift, { ease: "outQuad" });
    PA.audio.play("pick", 0.8, 0.95 + Math.random() * 0.1);
    PA.emit("pick", { c: i });
  }
  function putBack() {
    const i = G.sel;
    if (i < 0) return;
    PA.killTweens(G.lift);
    G.sel = -1;
    G.lift.a = 0;
    G.drag = null;
    if (LIQUID) PA.tween(G.conts[i], { raise: 0 }, 0.1);
    G.conts[i].land = 0.6;
    PA.audio.play("drop", 0.45, 1.25);
  }
  function wiggle(i, sound) {
    const c = G.conts[i];
    c.wig = 1;
    PA.killTweens(c, "wig");
    PA.tween(c, { wig: 0 }, 0.35, { ease: "linear" });
    if (sound) PA.audio.play("error", 0.55, 1, 0.15);
  }
  // polish 2026-11-05: an illegal pour is never silent. Both flasks shake hard, a low thud plays, a red cross
  // flashes over the target, the cat flinches, the hook line turns into the rule and the hand at once points at a
  // legal target for the lifted layers.
  function refuse(i, src) {
    const c = G.conts[i];
    c.wig = 1.4;
    c.bad = 1;
    PA.killTweens(c, "wig");
    PA.killTweens(c, "bad");
    PA.tween(c, { wig: 0 }, 0.5, { ease: "linear" });
    PA.tween(c, { bad: 0 }, 0.6, { ease: "linear" });
    if (src != null && src >= 0) {
      const s = G.conts[src];
      s.wig = 1.2;
      PA.killTweens(s, "wig");
      PA.tween(s, { wig: 0 }, 0.45, { ease: "linear" });
    }
    PA.audio.play("drop", 0.9, 0.5, 0.1);
    PA.audio.play("error", 0.35, 0.8, 0.1);
    G.flinch = 1;
    PA.tween(G, { flinch: 0 }, 0.5, { ease: "linear" });
    G.tip = 2.2;
    G.nudge = 1.6;
  }
  // a tap on container i: pick it up, put it back, or move the lifted run onto it
  function tapCont(i) {
    if (!free()) return;
    if (G.sel < 0) {
      if (canPick(i)) select(i);
      else {
        wiggle(i, isLocked(i, G.st, G.ctx));
        PA.audio.play("drop", 0.6, 0.55, 0.1);
      }
    } else if (G.sel === i) putBack();
    else if (legal(G.st, G.sel, i, G.ctx)) startMove(G.sel, i);
    else {
      refuse(i, G.sel);
      PA.emit("illegal", { from: G.sel, to: i });
    }
  }
  function startMove(i, j) {
    const st = G.st,
      n = count(st, i, j, G.ctx),
      ch = st[i][st[i].length - 1],
      next = apply(st, [i, j], G.ctx),
      from = G.conts[i],
      to = G.conts[j];
    G.hist.push({ st: st.slice(), done: G.conts.map(function (c) { return c.done; }), levelDone: G.levelDone, progress: G.progress.slice(), movesLeft: G.movesLeft });
    const revealed = next[i] && next[i] !== st[i].slice(0, st[i].length - n);
    G.st = st.slice();
    G.st[i] = next[i];
    if (revealed) {
      from.flip = { s: 0 };
      PA.tween(from.flip, { s: 1 }, 0.35, { delay: 0.1 });
      PA.after(0.25, function () { PA.audio.play("pick", 0.6, 1.5); });
      PA.emit("reveal", { c: i });
    }
    if (LIQUID) {
      G.fly = { pour: true, i: i, j: j, ch: ch, n: n, t: 0, go: F.pourGo, pt: F.pourPer * (1 + n), back: F.pourBack, base: st[j].length, target: next[j], landed: false };
      from.raise = 0;
    } else {
      const items = [],
        base = st[j].length;
      for (let q = 0; q < n; q++) {
        const k = st[i].length - 1 - q,
          p0 = q === 0 && G.lift.a > 0.5 ? liftedPos() : world(from, slotLocal(k));
        const p1 = world(from, liftLocal(k)),
          p2 = world(to, liftLocal(base + q)),
          p3 = world(to, slotLocal(base + q));
        items.push({ t: -q * F.train, x0: p0.x, y0: p0.y, x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, y3: p3.y, x3: p3.x, landed: false });
      }
      G.fly = { i: i, j: j, ch: ch, n: n, items: items, d1: F.hop, d2: F.drop };
    }
    G.sel = -1;
    G.lift.a = 0;
    G.drag = null;
    G.moves++;
    G.levelMoves++;
    if (G.movesLeft != null) G.movesLeft--;
    if (G.moves === 1) PA.tween(G, { hookA: 0 }, 0.4);
    if (n >= 3) PA.audio.duck(0.26, 0.2 + n * F.train + 0.6);
    PA.emit("move", { from: i, to: j, color: up(ch), n: n, movesLeft: G.movesLeft, levelMoves: G.levelMoves });
  }
  // one sound per move, pitched by how many pieces travelled together
  function landed() {
    const f = G.fly;
    G.conts[f.j].land = 1;
    PA.audio.play("drop", 0.85, 1 + 0.08 * (f.n - 1));
  }
  function liftedPos() {
    const c = G.conts[G.sel],
      k = G.st[G.sel].length - 1;
    if (G.drag && G.drag.moved) return { x: G.drag.x, y: G.drag.y };
    const a = world(c, slotLocal(k)),
      b = world(c, liftLocal(k)),
      bob = Math.sin(PA.realTime * 6) * 4;
    return { x: a.x + (b.x - a.x) * G.lift.a, y: a.y + (b.y + bob - a.y) * G.lift.a };
  }

  function afterMove(j) {
    const st = G.st;
    if (j != null && isDone(st[j], G.ctx) && !G.conts[j].done) {
      G.conts[j].done = true;
      G.st[j] = up(st[j]); // a completed container shows every colour
      G.levelDone++;
      G.completed++;
      Pt.payoff.complete(j, api);
    }
    checkOpen();
    const w = Pt.win(api);
    if (w && w.result === "win") {
      G.phase = "out";
      if (!lastLevel()) {
        G.phase = "trans";
        PA.emit("levelDone", { n: G.li });
        PA.after(1.1, nextLevel);
      } else PA.after(0.5, function () { finish("win"); });
      return;
    }
    if (lastLevel() && !G.lastMove) {
      const s = solve(G.st, G.ctx);
      if (s.dist === 1) {
        const fm = finalMove(G.st, G.ctx);
        G.lastMove = { from: fm[0], to: fm[1], t: 0 };
        G.callout = null;
        PA.tween(G, { dim: 1 }, 0.3);
        if (!w) setBanner(T.lastMove, fmt(T.lastMoveSub, {}), TH.hook, false);
        PA.audio.musicTo(0.18, 0.4);
        PA.emit("lastMove", { movesLeft: G.movesLeft });
      }
    }
    if (w) {
      G.phase = "out";
      G.sel = -1;
      if (w.why === "moves" || w.why === "stuck") {
        setBanner(w.why === "moves" ? T.outOfMoves : T.stuck, leftText().sub, TH.lose, false);
        PA.after(R.preBanner, function () { finish("close", w.why); });
      } else finish("close", w.why);
    }
  }
  // locks and frozen pieces open when enough containers are complete
  function checkOpen() {
    const dc = doneCount(G.st, G.ctx);
    G.ctx.locked.forEach(function (l) {
      const c = G.conts[l.c];
      if (dc >= l.after && c.lock === 1) {
        PA.tween(c, { lock: 0 }, 0.4);
        burstAt(c, 0.5, ["#ffd23a", "#ffffff"]);
        PA.audio.play("pick", 0.7, 1.6);
        PA.emit("unlock", { c: l.c });
      } else if (dc < l.after) c.lock = 1;
    });
    G.ctx.frozen.forEach(function (f) {
      const c = G.conts[f.at[0]];
      if (dc >= f.until && c.ice === 1) {
        PA.tween(c, { ice: 0 }, 0.4);
        burstAt(c, 0.3, ["#bfefff", "#ffffff"]);
        PA.audio.play("pick", 0.7, 1.4);
        PA.emit("thaw", { c: f.at[0] });
      } else if (dc < f.until) c.ice = 1;
    });
  }
  function burstAt(c, h, colors) {
    const p = { x: c.x, y: baseOf(c) - GEO.h * c.sc * h };
    fx.burst(p.x, p.y, { n: 14, colors: colors, speed: 300, life: 0.6, size: 12, shape: "spark", additive: true });
  }
  function setBanner(text, sub, color, big) {
    G.banner = { text: text, sub: sub, color: color, s: 0, big: big };
    PA.tween(G.banner, { s: 1 }, 0.3, { ease: "outBack" });
  }

  function nextLevel() {
    if (G.result) return;
    const nx = CFG.levels[G.li + 1];
    G.trans = true;
    G.lastMove = null;
    PA.tween(G, { hookA: 0, dim: 0 }, 0.3);
    if (nx.intro) setBanner(nx.intro.text, nx.intro.sub, TH.hook, true);
    G.conts.forEach(function (c, i) {
      PA.tween(c, { dy: -1400 }, F.levelOut, { delay: 0.5 + i * 0.05, ease: "inQuad" });
    });
    PA.after(0.55 + F.levelOut + G.conts.length * 0.05, function () {
      startLevel(G.li + 1);
      G.conts.forEach(function (c, i) {
        c.dy = -1300;
        PA.tween(c, { dy: 0 }, F.levelIn, { delay: i * 0.06, ease: "outBack" });
      });
      PA.after(0.9, function () { G.banner = null; });
      PA.after(F.levelIn + G.conts.length * 0.06, function () {
        G.trans = false;
        G.phase = "play";
      });
    });
  }

  // what is really left: pieces one move away, else containers still to finish
  function leftText() {
    const st = G.st,
      d = solve(st, G.ctx).dist;
    if (d === 1) {
      const n = count(st, finalMove(st, G.ctx)[0], finalMove(st, G.ctx)[1], G.ctx);
      return { near: true, dist: 1, sub: n === 1 ? fmt(T.oneLeft, {}) : fmt(T.left, { n: n }) };
    }
    const todo = G.slots - G.levelDone;
    return { near: false, dist: d, sub: todo === 1 ? fmt(T.oneToGo, {}) : fmt(T.toGo, { n: todo }) };
  }
  function marginOf(kind, dist) {
    if (kind === "win") {
      if (G.limit) return Math.round((G.movesLeft / G.limit) * 1000) / 1000;
      if (G.levelTime) return Math.round(((G.levelTime - G.levelT) / G.levelTime) * 1000) / 1000;
      return Math.round(Math.max(0, 1 - G.clock / R.roundCap) * 1000) / 1000;
    }
    return -Math.round(Math.min(10, isFinite(dist) ? dist : 10)) / 10; // -0.1 per move still needed
  }

  function finish(kind, why) {
    if (G.result) return;
    G.result = kind;
    G.why = why || null;
    G.phase = "result";
    G.sel = -1;
    G.drag = null;
    const L = kind === "win" ? { near: false, dist: 0, sub: "" } : leftText();
    G.near = L.near;
    PA.emit("result", { result: kind, why: G.why, margin: marginOf(kind, L.dist), dist: L.dist, moves: G.moves,
      completed: G.completed, level: G.li, movesLeft: G.movesLeft,
      grace: Math.round((G.graceT || 0) * 100) / 100, maxQuiet: Math.round((G.maxQuiet || 0) * 100) / 100 });
    PA.tween(G, { hookA: 0 }, 0.2); // the hook line never sits under a result banner
    let hold = R.loseHold;
    if (kind === "win") {
      G.lastMove = null;
      PA.tween(G, { dim: 0 }, 0.3);
      setBanner(T.win, T.winSub, TH.win, true);
      PA.audio.play("win", 0.9);
      PA.audio.duck(0.15, R.winHold);
      Pt.payoff.win(api);
      hold = R.winHold;
    } else if (why === "idle" && !G.started) {
      G.banner = null; // never touched: straight to the end card, nothing is claimed about the board
      hold = 0;
    } else {
      // polish 2026-11-05: a touched round that times out on idle says so (it used to fall through to the untouched
      // promise card, which read like a fresh intro and hid the loss)
      const title = why === "idle" ? T.idleOut || T.nice : why === "timer" || why === "cap" ? T.timeUp : L.near ? T.close : T.nice;
      setBanner(title, L.sub, TH.lose, true);
      if (why === "idle") hold = R.idleHold;
      else PA.audio.play("fail", 0.9);
      PA.audio.duck(0.12, hold + 0.5);
    }
    PA.after(hold, endCard, true);
  }
  function endCard() {
    if (G.phase === "end") return;
    G.phase = "end";
    G.banner = null;
    PA.audio.musicTo(0.32, 0.6);
    PA.emit("endcard", { result: G.result });
  }

  // ---------- payoffs ----------
  function callout(c, color) {
    if (G.lastMove || !T.callouts || !T.callouts.length) return;
    G.callout = { text: T.callouts[(G.completed - 1) % T.callouts.length], t: 0, s: 0, color: color, x: c.x, y: baseOf(c) - (GEO.h + 30) * c.sc };
    PA.tween(G.callout, { s: 1 }, 0.25, { ease: "outBack" });
  }
  function reward(c, col) {
    G.progress.push(col);
    G.cheer = 1;
    PA.tween(G, { cheer: 0 }, 0.9, { ease: "linear" });
    const top = baseOf(c) - GEO.h * c.sc * 0.6;
    for (let n = 0; n < 6; n++) G.coinFly.push({ x: c.x + (Math.random() - 0.5) * 60, y: top, t: -n * 0.05, v: R.coinsPerContainer / 6 });
    PA.audio.play("complete", 1);
    PA.audio.duck(0.12, 0.9);
    callout(c, hueOf(col));
    PA.emit("complete", { c: G.conts.indexOf(c), color: col, n: G.completed });
  }
  PARTS.payoff.lidPop = {
    complete: function (i) {
      const c = G.conts[i],
        col = up(G.st[i][0]);
      c.lidY = -120;
      c.lidA = 0;
      PA.tween(c, { lidY: 0, lidA: 1 }, F.lid, { ease: "outQuad" });
      PA.after(F.lid * 0.9, function () {
        c.pop = 1;
        PA.tween(c, { pop: 0 }, F.pop, { ease: "outQuad" });
        const p = { x: c.x, y: baseOf(c) - GEO.h * c.sc * 0.7 };
        fx.burst(p.x, p.y, { n: F.confetti, colors: [hueOf(col), "#ffffff", "#ffd23a", "#ff6fb5", "#3ee8e0"], speed: 520, lift: 260, gravity: 900, life: 1.0, size: 14 });
        fx.burst(p.x, baseOf(c) - GEO.h * c.sc - 10, { n: 10, colors: ["#ffffff", "#fff3a8"], speed: 260, life: 0.5, size: 22, shape: "spark", additive: true });
        PA.shake(F.shake, 0.25);
        reward(c, col);
      });
    },
    win: winRain,
  };
  PARTS.payoff.sparkle = {
    complete: function (i) {
      const c = G.conts[i],
        col = up(G.st[i][0]);
      c.glow = 1;
      PA.tween(c, { glow: 0 }, 0.8);
      c.pop = 1;
      PA.tween(c, { pop: 0 }, F.pop, { ease: "outQuad" });
      fx.burst(c.x, baseOf(c) - GEO.h * c.sc * 0.5, { n: 18, colors: [hueOf(col), "#ffffff"], speed: 340, life: 0.7, size: 16, shape: "spark", additive: true });
      reward(c, col);
    },
    win: winRain,
  };
  function winRain() {
    for (let k = 0; k < 4; k++)
      PA.after(k * 0.35, function () {
        fx.burst(PA.view.w * (0.15 + Math.random() * 0.7), 160, { n: 34, colors: TH.confetti, speed: 520, lift: 100, gravity: 1100, life: 1.5, size: 15 });
      });
    G.conts.forEach(function (c, i) {
      PA.after(i * 0.07, function () {
        c.pop = 1;
        PA.tween(c, { pop: 0 }, 0.5);
      });
    });
    G.cheer = 1;
    PA.tween(G, { cheer: 0 }, 2.5, { ease: "linear" });
  }

  // ---------- input ----------
  PARTS.input.tapTap = {
    down: function (x, y) {
      const i = contAt(x, y);
      if (i >= 0) tapCont(i);
      else if (G.sel >= 0 && free()) putBack(); // a tap on empty space puts the lifted run back
    },
    move: function () {},
    up: function () {},
    // the hand loops tap-tap on the move: source, then target (the lifted run: its best target)
    drawHint: function (c, h) {
      let i = G.sel >= 0 ? h.tap : (PA.realTime % 1.6) < 0.8 ? h.from : h.to;
      if (i == null || i < 0) return;
      const ct = G.conts[i],
        per = 0.8,
        ph = (PA.realTime % per) / per,
        press = ph > 0.7,
        y = baseOf(ct) - GEO.h * ct.sc * 0.42 + (press ? 6 : -Math.sin(ph * Math.PI) * 14);
      D.hand(c, ct.x + 8, y, 1.15, press);
    },
  };
  PARTS.input.drag = {
    down: function (x, y) {
      if (!free()) return;
      const i = contAt(x, y);
      if (i < 0) return;
      if (!canPick(i)) {
        wiggle(i, isLocked(i, G.st, G.ctx));
        return;
      }
      select(i);
      G.drag = { i: i, sx: x, sy: y, x: x, y: y, moved: false };
    },
    move: function (x, y) {
      const d = G.drag;
      if (!d) return;
      d.x = x;
      d.y = y;
      if (Math.abs(x - d.sx) + Math.abs(y - d.sy) > 18) d.moved = true;
    },
    up: function (x, y) {
      const d = G.drag;
      if (!d || G.sel !== d.i) return;
      const j = contAt(x, y);
      if (j >= 0 && j !== d.i && legal(G.st, d.i, j, G.ctx)) startMove(d.i, j);
      else {
        if (j >= 0 && j !== d.i) wiggle(j, true);
        putBack();
      }
    },
    drawHint: function (c, h) {
      if (h.from == null || h.to == null) return;
      const a = G.conts[h.from],
        b = G.conts[h.to];
      D.hintHand(c, { x: a.x, y: baseOf(a) - GEO.h * a.sc * 0.5 }, { x: b.x, y: baseOf(b) - GEO.h * b.sc * 0.5 }, { period: 1.6 });
    },
  };
  // the move the hand points at: the solver's next move, or the last-move highlight
  function hintMove() {
    if (G.lastMove) return { from: G.lastMove.from, to: G.lastMove.to };
    const s = solve(G.st, G.ctx);
    return s.first ? { from: s.first[0], to: s.first[1] } : null;
  }
  // the container a helper taps next: the hint's source, or the best target for the lifted run
  function nextTap() {
    if (G.sel >= 0) {
      let best = -1,
        bd = Infinity;
      for (let k = 0; k < G.st.length; k++) {
        if (!legal(G.st, G.sel, k, G.ctx)) continue;
        const d = solve(apply(G.st, [G.sel, k], G.ctx), G.ctx).dist;
        if (d < bd) {
          bd = d;
          best = k;
        }
      }
      return best >= 0 ? best : G.sel;
    }
    const h = hintMove();
    return h ? h.from : -1;
  }

  // ---------- boosters ----------
  const BOOSTERS = {
    undo: {
      label: function () { return T.undo; },
      badge: function (b) { return String(b.left); },
      enabled: function (b) { return free() && b.left > 0 && G.hist.length > 0; },
      run: function (b) {
        putBack();
        G.sel = -1;
        const h = G.hist.pop();
        G.st = h.st;
        G.conts.forEach(function (c, i) {
          if (c.done && !h.done[i]) {
            c.done = false;
            c.lidA = 0;
            c.lidY = 0;
          }
        });
        G.completed -= G.levelDone - h.levelDone;
        G.levelDone = h.levelDone;
        G.progress = h.progress;
        G.movesLeft = h.movesLeft;
        G.moves--;
        G.levelMoves--;
        b.left--;
        checkOpen();
        if (G.lastMove && solve(G.st, G.ctx).dist !== 1) clearLastMove();
        PA.audio.play("pick", 0.8, 0.85);
        PA.emit("undo", { left: b.left });
      },
    },
    restart: {
      label: function () { return T.restart; },
      enabled: function () { return free() && G.levelMoves > 0; },
      run: function () {
        G.completed -= G.levelDone;
        const moves = G.moves;
        startLevel(G.li);
        G.moves = moves;
        G.conts.forEach(function (c, i) {
          c.dy = -60;
          PA.tween(c, { dy: 0 }, 0.35, { delay: i * 0.03, ease: "outBack" });
        });
        clearLastMove();
        PA.audio.play("drop", 0.7, 0.8);
        PA.emit("restart", { level: G.li });
      },
    },
    extra: {
      label: function () { return T.extra; },
      enabled: function (b) { return b.action === "cta" ? G.phase !== "end" : free() && !G.added; },
      run: function (b) {
        if (b.action === "cta") {
          PA.emit("booster", { kind: "extra" }); // boosters live in the full game: the tap is an install intent
          PA.net.cta();
          return;
        }
        G.added = true;
        G.hist = []; // an undo never crosses the added container
        G.st = G.st.concat([""]);
        G.conts = G.conts.concat(makeConts(1));
        G.ctx.cache = new Map();
        layout();
        const c = G.conts[G.conts.length - 1];
        c.dy = -300;
        PA.tween(c, { dy: 0 }, 0.4, { ease: "outBack" });
        if (G.lastMove) clearLastMove();
        PA.audio.play("complete", 0.6, 1.2);
        PA.emit("booster", { kind: "extra", added: true });
      },
    },
  };
  function clearLastMove() {
    if (!G.lastMove) return;
    G.lastMove = null;
    G.banner = null;
    PA.tween(G, { dim: 0 }, 0.25);
    PA.audio.musicTo(PA.cfg.musicVolume || 0.4, 0.3);
  }

  // what a part may use
  const api = {
    get G() { return G; },
    CFG: CFG, GEO: GEO, KIND: K, PIECE: PK, ENDINGS: ENDINGS, BOOSTERS: BOOSTERS,
    solve: function (st) { return solve(st || G.st, G.ctx); },
    legal: function (i, j, st) { return legal(st || G.st, i, j, G.ctx); },
    apply: function (m, st) { return apply(st || G.st, m, G.ctx); },
    count: function (i, j, st) { return count(st || G.st, i, j, G.ctx); },
    takeable: takeable, isDone: isDone, doneCount: doneCount, legalMoves: legalMoves, solveLine: solveLine,
    generate: generate, contAt: contAt, tap: tapCont, select: select, putBack: putBack, move: startMove,
    wiggle: wiggle, finish: finish, hint: hintMove, nextTap: nextTap, world: world, slotLocal: slotLocal,
    baseOf: baseOf, fx: fx, ufx: ufx, rand: function () { return rand(); },
  };

  // ---------- reset ----------
  function reset() {
    rand = seeded(CFG.seed);
    G = {
      t: 0, phase: "play", conts: null, lift: { a: 0 }, fly: null, trans: false, moves: 0, completed: 0, clock: 0,
      started: false, coins: R.coins, coinShown: R.coins, earned: 0, coinFly: [], callout: null, banner: null,
      hookA: 1, hookS: 0, result: null, why: null, near: false, cheer: 0, dim: 0, press: {}, hintNow: null,
      boosters: CFG.boosters.map(function (b) { return Object.assign({ left: b.charges || 0 }, b); }),
    };
    fx.parts.length = fx.texts.length = 0;
    ufx.parts.length = ufx.texts.length = 0;
    PA.setTimeScale(1);
    startLevel(0);
    // the hook pops in: visible motion in the first second while the board waits
    PA.tween(G, { hookS: 1 }, 0.45, { ease: "outBack", delay: 0.1, real: true });
    PA.resetEndCard();
  }

  // ---------- update ----------
  function update(dt, rdt) {
    G.t += rdt;
    layout();
    if (G.phase === "end") {
      fx.update(dt);
      ufx.update(rdt);
      return;
    }
    const inp = PA.input,
      idle = PA.idle();
    if (inp.touched && !G.started) {
      G.started = true;
      PA.emit("roundStart");
    }
    // polish 2026-11-05: thinking time. Once the board is still (no pour, nothing lifted) and the player has not
    // tapped for THINK s, the candle and the round clock gutter to GUTTER speed until the next tap. The QA bots tap
    // every 0.9 s and never sit still that long after a pour, so their timings (and the careless loss) are unchanged.
    const THINK = 0.7,
      GUTTER = 0.25;
    if (free() && G.sel < 0 && !inp.down) G.quiet = Math.min(G.quiet + rdt, inp.idle);
    else G.quiet = 0;
    G.gutter = G.quiet > THINK;
    const rate = G.gutter ? GUTTER : 1;
    if (G.started && !G.result) {
      G.clock += rdt * rate;
      if (G.phase === "play" && !G.trans && G.lit) {
        G.levelT += rdt * rate;
        if (G.levelTime != null) {
          G.graceT = (G.graceT || 0) + rdt * (1 - rate);
          G.maxQuiet = Math.max(G.maxQuiet || 0, G.quiet);
        }
      }
    }
    if (G.tip > 0) G.tip -= rdt;
    if (G.nudge > 0) G.nudge -= rdt;
    const f = G.fly;
    if (f && f.pour) {
      f.t += dt;
      if (!f.landed && f.t >= f.go + f.pt) {
        f.landed = true;
        G.st[f.j] = f.target;
        landed();
      }
      if (f.t >= f.go + f.pt + f.back) {
        G.fly = null;
        afterMove(f.j);
      }
    } else if (f) {
      for (let q = 0; q < f.items.length; q++) {
        const it = f.items[q];
        if (it.landed) continue;
        it.t += dt;
        if (it.t >= f.d1 + f.d2) {
          it.landed = true;
          G.st[f.j] += f.ch;
          G.conts[f.j].land = 1;
        }
      }
      if (f.items.every(function (it) { return it.landed; })) {
        landed();
        G.fly = null;
        afterMove(f.j);
      }
    }
    for (const c of G.conts) if (c.land > 0) c.land = Math.max(0, c.land - dt / 0.4);
    if (G.lastMove) G.lastMove.t += rdt;
    if (G.callout) {
      G.callout.t += rdt;
      if (G.callout.t > F.callout) G.callout = null;
    }
    // the suggested move, for the hand and the highlights (it never moves anything)
    G.hintNow = free() && G.sel < 0 && idle.hint ? hintMove() : null;
    // the ad ends by the level's goal, the round cap, or 10 s without input
    const live = playing();
    if (live && idle.timeout && !G.fly) finish("close", "idle");
    else if (live && G.clock > R.roundCap && !G.fly && !G.trans) finish("close", "cap");
    else if (live && !G.fly && !G.trans) {
      const w = Pt.win(api); // timers run out between moves
      if (w && w.result === "close" && w.why === "timer") afterMove(null);
    }
    // coins fly to the counter
    const v = PA.view,
      cx = v.w - 150,
      cy = 48;
    for (let i = G.coinFly.length - 1; i >= 0; i--) {
      const c = G.coinFly[i];
      c.t += rdt;
      if (c.t < 0) continue;
      const p = Math.min(1, c.t / 0.5);
      c.px = c.x + (cx - c.x) * PA.ease.inQuad(p);
      c.py = c.y + (cy - c.y) * PA.ease.inOutQuad(p) - Math.sin(p * Math.PI) * 90;
      if (p >= 1) {
        G.coinFly.splice(i, 1);
        G.coins += c.v;
        G.earned += c.v;
      }
    }
    if (G.coinShown < G.coins) G.coinShown = Math.min(G.coins, G.coinShown + 260 * rdt);
    fx.update(dt);
    ufx.update(rdt);
  }

  // ---------- drawing: pieces ----------
  const TINT = {};
  function tinted(name, hue, grey) {
    const key = name + "|" + hue + "|" + (grey ? 1 : 0);
    if (TINT[key]) return TINT[key];
    const im = PA.img[name];
    if (!im || !im.width) return null;
    const cv = document.createElement("canvas");
    cv.width = im.width;
    cv.height = im.height;
    const c = cv.getContext("2d");
    c.drawImage(im, 0, 0);
    if (grey) {
      c.globalCompositeOperation = "source-atop";
      c.fillStyle = "rgba(140,146,162,0.85)";
      c.fillRect(0, 0, cv.width, cv.height);
    } else if (hue) {
      c.globalCompositeOperation = "multiply";
      c.fillStyle = hue;
      c.fillRect(0, 0, cv.width, cv.height);
      c.globalCompositeOperation = "destination-in";
      c.drawImage(im, 0, 0);
    }
    TINT[key] = cv;
    return cv;
  }
  function hueOf(ch) {
    const k = CFG.colors[up(ch)];
    return k ? k.hue : "#cccccc";
  }
  // the art the level uses: the container, and every piece colour (liquid is poured colour, measured on the recording).
  // Both are core (PA.coreArt): a sort game whose recording shows no container or piece is not this preset
  function requiredArt() {
    const need = [[CFG.container.image, "the " + CFG.container.kind + " container"]];
    // the colours the levels use: their boards, and the first n colours a generated level draws from
    const used = {};
    CFG.levels.forEach(function (L) {
      if (L.board) L.board.join("").toUpperCase().split("").forEach(function (k) { used[k] = 1; });
      if (L.generate) Object.keys(CFG.colors).slice(0, L.generate.colors || 5).forEach(function (k) { used[k] = 1; });
    });
    if (CFG.piece.kind !== "liquid")
      Object.keys(used).forEach(function (k) {
        need.push([(CFG.colors[k] || {}).image || CFG.piece.image, "the " + k + " " + (CFG.piece.kind || "piece")]);
      });
    return need;
  }
  function pieceImage(ch) {
    const k = CFG.colors[up(ch)] || {},
      hidden = ch !== up(ch);
    if (k.image && PA.img[k.image] && PA.img[k.image].width) return hidden ? tinted(k.image, null, true) : PA.img[k.image];
    if (CFG.piece.image) return tinted(CFG.piece.image, hidden ? null : k.hue, hidden);
    return null;
  }
  // one piece centred at (x, y), in the current transform
  function drawPiece(c, ch, x, y, sx, sy, rot) {
    const w = GEO.pw * (sx || 1),
      h = GEO.ph * (sy || 1),
      hidden = ch !== up(ch),
      im = pieceImage(ch);
    c.save();
    c.translate(x, y);
    if (rot) c.rotate(rot);
    if (im) c.drawImage(im, -w / 2, -h / 2, w, h);
    if (hidden) D.text(c, "?", 0, 2, { size: h * 0.62, color: "#fff", stroke: INK, sw: 5 });
    c.restore();
  }
  // liquid layers inside a container (local units), with an optional part-layer on top
  function drawLiquid(c, s, extra) {
    const iw = GEO.w - 14,
      lh = K.step;
    c.save();
    shapePath(c, 6);
    c.clip();
    const layers = s.split("");
    let y = -K.pad;
    layers.forEach(function (ch) {
      const hidden = ch !== up(ch);
      c.fillStyle = hidden ? "#8c92a2" : hueOf(ch);
      c.fillRect(-iw / 2, y - lh, iw, lh + 1);
      if (hidden) D.text(c, "?", 0, y - lh / 2, { size: lh * 0.6, color: "#fff", stroke: INK, sw: 4 });
      y -= lh;
    });
    if (extra && extra.amt > 0.001) {
      c.fillStyle = hueOf(extra.ch);
      c.fillRect(-iw / 2, y - lh * extra.amt, iw, lh * extra.amt + 1);
      y -= lh * extra.amt;
    }
    if (layers.length || (extra && extra.amt > 0.001)) {
      c.fillStyle = "rgba(255,255,255,0.28)";
      c.fillRect(-iw / 2, y, iw, 6);
    }
    c.restore();
  }
  function pieceTilt(i, k) {
    return PK.tilt ? Math.sin(i * 2.1 + k * 1.3) * PK.tilt * 0.15 : 0;
  }
  function drawPieces(c, i, ct, idx) {
    const s = G.st[i],
      n = s.length,
      h = G.hintNow,
      run = n ? takeable(G.st, i, G.ctx) : 0;
    if (LIQUID) {
      const f = G.fly;
      let extra = null;
      if (f && f.pour && !f.landed) {
        const a = Math.max(0, Math.min(1, (f.t - f.go) / f.pt));
        if (f.j === i) extra = { ch: f.ch, amt: f.n * a };
        if (f.i === i) extra = { ch: f.ch, amt: f.n * (1 - a) };
      }
      drawLiquid(c, s, extra);
      for (const fz of G.ctx.frozen) {
        if (fz.at[0] !== i || fz.at[1] >= n || ct.ice <= 0.01) continue;
        const y = -K.pad - (fz.at[1] + 1) * K.step;
        c.save();
        c.globalAlpha = 0.85 * ct.ice;
        D.rrect(c, -GEO.w / 2 + 4, y, GEO.w - 8, K.step, 10);
        c.fillStyle = "rgba(170,225,255,0.6)";
        c.fill();
        c.lineWidth = 4;
        c.strokeStyle = "rgba(255,255,255,0.9)";
        c.stroke();
        c.restore();
      }
      return;
    }
    for (let k = 0; k < n; k++) {
      if (k === n - 1 && G.sel === i && idx >= 0) continue; // the lifted piece is drawn above the board
      let sx = 1,
        sy = 1,
        yo = 0;
      if (k === n - 1 && ct.land > 0) {
        const w = Math.sin(ct.land * Math.PI * 3) * ct.land;
        sx = 1 + w * 0.2;
        sy = 1 - w * 0.2;
      }
      if (ct.done) {
        const b = Math.sin(PA.realTime * 6 + k) * 0.02;
        sx += b;
        sy -= b;
      } else if (idx >= 0 && PK.breathe) {
        // idle breathing, plus a quick squash "blink" now and then
        const ph = idx * 1.7 + k * 0.9,
          b = Math.sin(PA.realTime * 3.2 + ph) * PK.breathe,
          blink = PK.blink && (PA.realTime + ph) % 3.1 < 0.12 ? 0.08 : 0;
        sx += b + blink;
        sy -= b + blink;
      }
      if (h && h.from === i && k >= n - run && idx >= 0) {
        // the pieces the first tap would move hop and glow
        yo = -Math.abs(Math.sin(PA.realTime * 4.5)) * 26;
        const p = slotLocal(k);
        c.save();
        c.globalCompositeOperation = "lighter";
        c.globalAlpha = 0.35 + 0.2 * Math.sin(PA.realTime * 9);
        const gr = c.createRadialGradient(p.x, p.y + yo, 8, p.x, p.y + yo, GEO.pw * 0.75);
        gr.addColorStop(0, "rgba(255,255,240,0.9)");
        gr.addColorStop(1, "rgba(255,255,240,0)");
        c.fillStyle = gr;
        c.beginPath();
        c.arc(p.x, p.y + yo, GEO.pw * 0.75, 0, 7);
        c.fill();
        c.restore();
      }
      const p = slotLocal(k);
      let ch = s[k];
      // a revealed piece flips from "?" to its colour
      if (k === n - 1 && ct.flip && ct.flip.s < 1) {
        sx *= Math.max(0.05, Math.abs(1 - 2 * ct.flip.s));
        if (ct.flip.s < 0.5) ch = ch.toLowerCase();
      }
      drawPiece(c, ch, p.x, p.y + yo + (GEO.ph * (1 - sy)) / 2, sx, sy, pieceTilt(i, k));
      // a frozen piece sits under ice until enough containers are complete
      for (const fz of G.ctx.frozen) {
        if (fz.at[0] !== i || fz.at[1] !== k || ct.ice <= 0.01) continue;
        c.save();
        c.globalAlpha = 0.85 * ct.ice;
        D.rrect(c, p.x - GEO.pw * 0.56, p.y - GEO.ph * 0.56, GEO.pw * 1.12, GEO.ph * 1.12, 16);
        c.fillStyle = "rgba(170,225,255,0.55)";
        c.fill();
        c.lineWidth = 4;
        c.strokeStyle = "rgba(255,255,255,0.9)";
        c.stroke();
        c.beginPath();
        c.moveTo(p.x - GEO.pw * 0.3, p.y - GEO.ph * 0.2);
        c.lineTo(p.x - GEO.pw * 0.05, p.y - GEO.ph * 0.42);
        c.moveTo(p.x + GEO.pw * 0.1, p.y + GEO.ph * 0.3);
        c.lineTo(p.x + GEO.pw * 0.36, p.y + GEO.ph * 0.05);
        c.stroke();
        const left = fz.until - doneCount(G.st, G.ctx);
        if (left > 0) D.text(c, String(left), p.x + GEO.pw * 0.42, p.y - GEO.ph * 0.42, { size: 30, color: "#fff", stroke: "#1d5d8a", sw: 6 });
        c.restore();
      }
    }
  }

  // ---------- drawing: containers ----------
  function mouthW() {
    return K.shape === "bottle" ? GEO.w * (K.neck || 0.5) : GEO.w;
  }
  function shapePath(c, inset) {
    const w = GEO.w - 2 * inset,
      h = GEO.h - inset,
      r = Math.max(4, (K.r || 20) - inset);
    c.beginPath();
    if (K.shape === "tube") {
      const rr = w / 2;
      c.moveTo(-w / 2, -h);
      c.lineTo(-w / 2, -rr - inset);
      c.arc(0, -rr - inset, rr, Math.PI, 0, true);
      c.lineTo(w / 2, -h);
    } else if (K.shape === "bottle") {
      const nw = mouthW() - 2 * inset,
        sh = h - K.head * 0.55;
      c.moveTo(-nw / 2, -h);
      c.lineTo(-nw / 2, -sh - 10);
      c.quadraticCurveTo(-w / 2, -sh, -w / 2, -sh + 36);
      c.lineTo(-w / 2, -r - inset);
      c.quadraticCurveTo(-w / 2, -inset, -w / 2 + r, -inset);
      c.lineTo(w / 2 - r, -inset);
      c.quadraticCurveTo(w / 2, -inset, w / 2, -r - inset);
      c.lineTo(w / 2, -sh + 36);
      c.quadraticCurveTo(w / 2, -sh, nw / 2, -sh - 10);
      c.lineTo(nw / 2, -h);
    } else D.rrect(c, -w / 2, -h, w, h - inset, r);
  }
  function drawBack(c) {
    const im = PA.img[CFG.container.image]; // always the recording's container (core art, PA.coreArt)
    if (im && im.width) c.drawImage(im, -GEO.w / 2, -GEO.h, GEO.w, GEO.h);
  }
  function drawFront(c, ct, i) {
    const im = CFG.container.front && PA.img[CFG.container.front];
    if (im && im.width) c.drawImage(im, -GEO.w / 2, -GEO.h, GEO.w, GEO.h);
    const lid = CFG.container.lid && PA.img[CFG.container.lid];
    if (ct.done && ct.lidA > 0 && lid && lid.width) {
      const lw = mouthW() + 22,
        lh = (lw * lid.height) / lid.width;
      c.globalAlpha = Math.min(1, ct.lidA * 1.5);
      c.drawImage(lid, -lw / 2, -GEO.h - lh * 0.62 + ct.lidY, lw, lh);
      c.globalAlpha = 1;
    }
    if (ct.glow > 0.01) {
      c.save();
      c.globalAlpha = ct.glow;
      shapePath(c, -6);
      c.lineWidth = 10;
      c.strokeStyle = "#fff6b0";
      c.stroke();
      c.restore();
    }
    if (i < 0) return;
    const h = G.hintNow;
    if (h && h.to === i && !G.lastMove) {
      const p = 0.5 + 0.5 * Math.sin(PA.realTime * 7);
      D.rrect(c, -GEO.w / 2 - 7, -GEO.h - 7, GEO.w + 14, GEO.h + 14, (K.r || 20) + 4);
      c.lineWidth = 6 + 3 * p;
      c.strokeStyle = "rgba(255,210,58," + (0.35 + 0.5 * p) + ")";
      c.stroke();
    }
    if (G.lastMove && G.lastMove.to === i && !G.result) {
      const p = 0.5 + 0.5 * Math.sin(G.lastMove.t * 8),
        s = slotLocal(Math.min(CAP - 1, G.st[i].length));
      // the free slot pulses
      c.save();
      c.globalAlpha = 0.35 + 0.4 * p;
      c.setLineDash([10, 8]);
      c.lineWidth = 5;
      c.strokeStyle = TH.ring;
      c.beginPath();
      c.ellipse(s.x, s.y, GEO.pw * 0.5, GEO.ph * 0.5, 0, 0, 7);
      c.stroke();
      c.restore();
      D.rrect(c, -GEO.w / 2 - 6, -GEO.h - 6, GEO.w + 12, GEO.h + 12, (K.r || 20) + 4);
      c.lineWidth = 6;
      c.strokeStyle = "rgba(255,210,58," + (0.4 + 0.5 * p) + ")";
      c.stroke();
    }
    // a locked container: a padlock with the completions it still needs
    for (const l of G.ctx.locked) {
      if (l.c !== i || ct.lock <= 0.01) continue;
      c.save();
      c.globalAlpha = ct.lock;
      shapePath(c, 0);
      c.fillStyle = "rgba(30,30,50,0.45)";
      c.fill();
      const y = -GEO.h * 0.5 - (1 - ct.lock) * 40;
      c.lineWidth = 9;
      c.strokeStyle = "#e7b53a";
      c.beginPath();
      c.arc(0, y - 18, 20, Math.PI, 0);
      c.stroke();
      D.rrect(c, -32, y - 18, 64, 52, 10);
      c.fillStyle = "#ffcc3a";
      c.fill();
      c.lineWidth = 4;
      c.strokeStyle = INK;
      c.stroke();
      const need = l.after - doneCount(G.st, G.ctx);
      if (need > 0) D.text(c, String(need), 0, y + 9, { size: 32, color: "#fff", stroke: INK, sw: 5 });
      c.restore();
    }
  }
  // a whole container with its pieces at (x, base); idx < 0 = a copy for the end card (no hints)
  function drawCont(c, ct, i, x, base, sc, idx) {
    const shake = ct.wig > 0 ? Math.sin(ct.wig * 28) * 9 * ct.wig : 0;
    c.save();
    c.translate(x + shake, base);
    c.scale(sc * (1 + ct.pop * 0.07), sc * (1 - ct.pop * 0.05));
    drawBack(c);
    drawPieces(c, i, ct, idx);
    drawFront(c, ct, idx);
    c.restore();
    // polish 2026-11-05: the red cross of a refused pour, over the target's neck
    if (idx >= 0 && ct.bad > 0.01) {
      const a = Math.min(1, ct.bad * 1.6),
        cy = base - (GEO.h + 26) * sc,
        r = 26 * (1.15 - 0.15 * ct.bad);
      c.save();
      c.globalAlpha = a;
      c.translate(x + shake, cy);
      c.lineCap = "round";
      c.beginPath();
      c.arc(0, 0, r + 10, 0, 7);
      c.fillStyle = "rgba(120,10,20,0.55)";
      c.fill();
      c.lineWidth = 15;
      c.strokeStyle = INK;

  function drawBoard(c) {
    const f = G.fly,
      pourI = f && f.pour ? f.i : -1;
    G.conts.forEach(function (ct, i) {
      if (i !== pourI) drawCont(c, ct, i, ct.x, baseOf(ct), ct.sc, i);
    });
    if (G.dim > 0.01) {

  function drawLifted(c) {
    if (G.sel < 0 || LIQUID || !G.st[G.sel]) return;
    const s = G.st[G.sel],

  function drawFly(c) {
    const f = G.fly;
    if (!f || f.pour) return;
    const sc = G.conts[f.j].sc;
    // back of the train first so the leading piece is on top
    for (let q = f.items.length - 1; q >= 0; q--) {
      const it = f.items[q];
      if (it.landed) continue;
      let x,
        y,
        sx = 1,
        sy = 1,
        rot = 0;
      if (it.t <= 0) {
        x = it.x0;
        y = it.y0;
      } else if (it.t < f.d1) {
        const u = PA.ease.inOutQuad(it.t / f.d1),
          apex = Math.min(it.y1, it.y2) - 80;
        // rise from its slot, arc over, end above the target
        x = it.x0 + (it.x2 - it.x0) * u;
        y = (1 - u) * (1 - u) * it.y0 + 2 * u * (1 - u) * apex + u * u * it.y2;
        sx = 1.03;
        sy = 0.97;
        rot = (PK.spin || 0) * Math.sin(u * Math.PI) * Math.sign(it.x2 - it.x0) + (PK.tilt || 0) * Math.sin(u * Math.PI);
      } else {
        const u = PA.ease.inQuad(Math.min(1, (it.t - f.d1) / f.d2));
        x = it.x2 + (it.x3 - it.x2) * u;
        y = it.y2 + (it.y3 - it.y2) * u;
        sx = 0.94;
        sy = 1.08;
      }
      c.save();
      c.translate(x, y);
      c.scale(sc, sc);
      drawPiece(c, f.ch, 0, 0, sx, sy, rot);
      c.restore();

  // liquid: the source container tilts over the target and pours, then goes home
  function drawPour(c) {
    const f = G.fly,
      src = G.conts[f.i],
      dst = G.conts[f.j],
      side = dst.x >= src.x ? 1 : -1,
      sc = src.sc,
      h = GEO.h * sc,
      home = { x: src.x, y: baseOf(src) - h / 2 };
    const th = 1.2,
      mx = 0.5 * h * Math.sin(th),
      my = -0.5 * h * Math.cos(th);
    const at = { x: dst.x - side * mx, y: baseOf(dst) - GEO.h * dst.sc - 30 - my };
    let p = 1;
    if (f.t < f.go) p = PA.ease.inOutQuad(f.t / f.go);
    else if (f.t > f.go + f.pt) p = 1 - PA.ease.inOutQuad(Math.min(1, (f.t - f.go - f.pt) / f.back));
    const cx = home.x + (at.x - home.x) * p,
      cy = home.y + (at.y - home.y) * p,
      rot = side * th * p;
    if (f.t >= f.go && f.t <= f.go + f.pt) {
      const mouth = { x: cx + side * mx, y: cy + my },
        surf = baseOf(dst) - (K.pad + (f.base + f.n * ((f.t - f.go) / f.pt)) * K.step) * dst.sc;
      c.save();
      c.strokeStyle = hueOf(f.ch);
      c.lineWidth = 14 * sc;
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(mouth.x, mouth.y);
      c.lineTo(dst.x, surf);
      c.stroke();
      c.restore();
    }
    c.save();
    c.translate(cx, cy);
    c.rotate(rot);
    c.translate(0, h / 2);
    c.scale(sc, sc);
    drawBack(c);
    drawPieces(c, f.i, src, f.i);
    drawFront(c, src, -1);
    c.restore();
  }

  // ---------- drawing: HUD, hook, banners, hint ----------
  function img(c, name, x, y, w, h) {

  function drawBg(c) {

  // polish 2026-11-05: the painted candle's flame (plate 720 x 1280, flame at 80, 235) flickers in code: an

  // flickers faster in the last seconds of a timer level.
  function drawFlame(c, ox, oy0, s) {
    const t = PA.realTime,
      left = G.levelTime != null && G.lit ? G.levelTime - G.levelT : 99,
      fast = left < 6 ? 2.2 : 1,
      n = 0.55 + 0.25 * Math.sin(t * 9.1 * fast) + 0.12 * Math.sin(t * 23.7 * fast + 1.3) + 0.08 * Math.sin(t * 41 + 0.4),
      dim = G.gutter ? 0.7 : 1,
      fx0 = ox + 80 * s,
      fy0 = oy0 + 252 * s;
    c.save();
    c.globalCompositeOperation = "lighter";
    const r = (58 + n * 14) * s,
      g = c.createRadialGradient(fx0, fy0 - 14 * s, 0, fx0, fy0 - 14 * s, r);
    g.addColorStop(0, "rgba(255,190,90," + (0.32 * n * dim).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,140,40,0)");
    c.fillStyle = g;
    c.fillRect(fx0 - r, fy0 - 14 * s - r, 2 * r, 2 * r);
    // the tongue: a teardrop from the wick, its tip swaying
    const sway = (Math.sin(t * 3.3 * fast) * 2.2 + Math.sin(t * 7.9) * 1.2) * s,
      hgt = (34 + n * 8) * dim * s,
      wd = 6.5 * s;

    c.bezierCurveTo(fx0 - wd * 1.6, fy0 - hgt * 0.25, fx0 - wd * 0.6 + sway * 0.5, fy0 - hgt * 0.7, fx0 + sway, fy0 - hgt);
    c.bezierCurveTo(fx0 + wd * 0.6 + sway * 0.5, fy0 - hgt * 0.7, fx0 + wd * 1.6, fy0 - hgt * 0.25, fx0, fy0);
    c.fillStyle = "rgba(255,210,120," + (0.3 + 0.2 * n).toFixed(3) + ")";
    c.fill();
    c.restore();
  }
  function plank(c, x, y, w, h) {

  function drawMascot(c) {

    ["input", "rule", "level", "payoff", "win"].forEach(function (k) {
      const name = CFG.parts[k];
      if (!PARTS[k][name]) throw new Error("no " + k + " part named " + name);
      Pt[k] = PARTS[k][name];
    });
  }
  window.GAME_CFG.images = Object.assign({}, window.GAME_CFG.images, CFG.images);
  window.GAME_CFG.sounds = Object.assign({}, window.GAME_CFG.sounds, CFG.sounds);
  const game = {
    init: function () {
      pickParts();
      PA.coreArt(requiredArt());
      reset();
    },
    resize: layout,
    update: update,
    draw: draw,
    onDown: function (x, y) {
      if (G.phase !== "play") return;
      Pt.input.down(x, y, api);
    },
    onMove: function (x, y) {
      if (G.phase === "play") Pt.input.move(x, y, api);
    },
    onUp: function (x, y) {
      if (G.phase === "play") Pt.input.up(x, y, api);
    },
    // QA snapshot: read by qa_bot.py and scripts/tune.py
    qa: function () {
      const v = PA.view,
        ok = free() && G.sel < 0;
      let hint = null,
        dist = null,
        options = null;
      if (free()) {
        const s = solve(G.st, G.ctx);
        dist = isFinite(s.dist) ? s.dist : null;
        hint = hintMove();
        // every legal move with the solver's distance after it (the careless bot picks a sideways one)
        if (ok)
          options = legalMoves(G.st, G.ctx).map(function (m) {
            const d = solve(apply(G.st, m, G.ctx), G.ctx).dist;
            return { from: m[0], to: m[1], dist: isFinite(d) ? d : 99 };
          });
      }
      return {
        phase: G.phase, t: G.t, scale: v.s, input: CFG.parts.input, level: G.li, levels: CFG.levels.length,
        ending: G.ending, limited: G.ending !== "sorted", movesLeft: G.movesLeft, limit: G.limit, optimal: G.optimal,
        levelMoves: G.levelMoves, sel: G.sel, busy: !free(), result: G.result, why: G.why, progress: G.moves,
        clock: G.clock, completed: G.completed, lastMove: G.lastMove, banner: G.banner && G.banner.text,
        st: G.st.slice(), dist: dist, hint: hint, tap: free() ? nextTap() : -1, options: options,
        containers: G.conts.map(function (ct) { return PA.toClient(ct.x, baseOf(ct) - GEO.h * ct.sc * 0.5); }),
        cta: PA.toClient(v.w / 2, v.h * 0.76 + 58),
        pill: PA.toClient(v.w - 184 + 85, 111),
      };
    },
  };
  window.__game = game;
  PA.boot(window.GAME_CFG, game);
})();

</script>
