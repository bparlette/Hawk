    <script>
/* Playable ad runtime, shared by every game.
 *
 * Sections: config, network adapter, audio, scaling, tweens, input, effects, drawing helpers,
 * end card, main loop, boot. A game calls PA.boot(cfg, game); game provides init(), update(dt, realDt),
 * draw(ctx), and optionally onDown/onMove/onUp(x, y) and qa().
 *
 * Coordinates: the game draws in logical units. The play area is at least 720x1280 logical
 * (portrait); wider screens letterbox the play area to 9:16 and draw side panels with the logo and
 * a CTA. No network access, no emoji, sound only after the first touch.
 *
 * Helpers:
 *   PA.idle()                      never-autoplay states: wait (before the first touch), hint (2.5 s idle),
 *                                  timeout (10 s with no input: go to the end card)
 *   PA.idleHold(on)                while on, the 10 s timeout clock stays at zero (the 2.5 s hint clock still runs):
 *                                  for games the player watches on purpose (units marching, a meter filling)
 *   PA.audio.play(...)             a sound never repeats faster than cfg.soundGap s (default 0.3, ~3 a second)
 *   PA.audio.duck(level, sec)      duck the music under a payoff sound, then restore cfg.musicVolume
 *   PA.draw.hintHand(c, from, to)  the hint pointer (assets/web/hand.webp when the project has one, else a
 *                                  drawn finger) looping a tap (no `to`) or a drag; it only points;
 *                                  {urgent: true} adds a "tap now" cue for moving or timed targets
 *   PA.draw.banner(c, t, sub, o)   result text on a backing plate
 *   PA.drawEndCard options         logoMaxH, heroH, tagline, art(c, layout)
 *   PA.toClient(x, y)              logical -> client px (for qa() targets)
 *   PA.hasArt / leaveOut / coreArt only what the recording shows: an optional element with no art leaves the
 *                                  level; missing core art is a console error for QA (never a stand-in; the hint
 *                                  pointer's default finger is the one thing drawn in code instead of art)
 *   PA.actor(sheet, o)             a moving sprite from prep_assets "sheets": picks the view from the velocity,
 *                                  mirrors, steps frames by distance or fps, procedural bob/tilt/squash/lean

          c.lineTo(p.x + s * 0.25, p.y + s * 0.25);
          c.lineTo(p.x, p.y + s);
          c.lineTo(p.x - s * 0.25, p.y + s * 0.25);
          c.lineTo(p.x - s, p.y);
          c.lineTo(p.x - s * 0.25, p.y - s * 0.25);
          c.closePath();
          c.fill();
        } else {
          c.save();
          c.translate(p.x, p.y);
          c.rotate(p.rot);
          c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          c.restore();
        }
      }
      c.globalAlpha = 1;
      c.globalCompositeOperation = "source-over";
      for (const t of fx.texts) {
        const p = t.t / t.life,
          pop =
            p < 0.15 ? 0.6 + (p / 0.15) * 0.6 : 1.2 - Math.min(0.2, p - 0.15);
        c.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
        PA.draw.text(c, t.str, t.x, t.y - t.rise * PA.ease.outQuad(p), {
          size: t.size * pop,
          color: t.color,
        });
      }
      c.globalAlpha = 1;
    };
    return fx;
  };
  const shake = { mag: 0, t: 0, dur: 0 },
    flash = { a: 0, color: "#fff" };
  PA.shake = function (mag, dur) {
    if (mag >= shake.mag * (1 - shake.t / (shake.dur || 1))) {
      shake.mag = mag;
      shake.t = 0;
      shake.dur = dur;
    }
  };
  PA.flash = function (color, a, dur) {
    flash.color = color;
    flash.a = a;
    PA.tween(flash, { a: 0 }, dur, { real: true });
  };
  PA.shakeOffset = function () {
    if (shake.t >= shake.dur) return { x: 0, y: 0 };
    const m = shake.mag * (1 - shake.t / shake.dur);
    return {
      x: (Math.random() - 0.5) * 2 * m,
      y: (Math.random() - 0.5) * 2 * m,
    };
  };

  // ---------- drawing helpers ----------
  const draw = (PA.draw = {});
  draw.font = function (size) {
    return (
      "700 " +
      Math.round(size) +
      "px " +
      (PA.cfg.font || "sans-serif") +
      ", sans-serif"
    );
  };
  draw.rrect = function (c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  // bold text with a dark outline, the house style of mobile game HUDs
  draw.text = function (c, str, x, y, o) {
    o = o || {};
    c.font = draw.font(o.size || 32);
    c.textAlign = o.align || "center";
    c.textBaseline = o.baseline || "middle";
    c.lineJoin = "round";
    if (o.stroke !== false) {
      c.strokeStyle = o.stroke || PA.cfg.ink || "#13244d";
      c.lineWidth = o.sw || Math.max(3, (o.size || 32) * 0.18);
      c.strokeText(str, x, y);
    }
    c.fillStyle = o.color || "#fff";
    c.fillText(str, x, y);
  };
  // chunky game button; returns nothing, registers its hit area
  draw.button = function (c, x, y, w, h, label, fn, o) {
    o = o || {};
    const top = o.top || "#ffe066",
      bot = o.bot || "#ff8a1f",
      ink = PA.cfg.ink || "#13244d";
    c.save();
    c.translate(x + w / 2, y + h / 2);
    c.scale(o.scale || 1, o.scale || 1);
    c.translate(-w / 2, -h / 2);
    draw.rrect(c, 0, 6, w, h, h * 0.32);
    c.fillStyle = "rgba(10,20,50,0.35)";
    c.fill();
    draw.rrect(c, 0, 0, w, h, h * 0.32);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, top);
    g.addColorStop(1, bot);
    c.fillStyle = g;
    c.fill();
    c.lineWidth = Math.max(3, h * 0.07);
    c.strokeStyle = ink;
    c.stroke();
    draw.rrect(c, h * 0.18, h * 0.1, w - h * 0.36, h * 0.3, h * 0.15);
    c.fillStyle = "rgba(255,255,255,0.35)";
    c.fill();
    draw.text(c, label, w / 2, h * 0.53, {
      size: o.size || h * 0.46,
      color: "#fff",
      stroke: ink,
    });
    c.restore();
    if (fn) PA.hit(x, y, w, h, fn);
  };
  // tutorial hand, fingertip at (x, y): the project's assets/web/hand.webp when it has one, else a drawn finger
  const HAND = { src: "", tipX: 0.276, tipY: 0.007, h: 118 };
  draw.hand = function (c, x, y, scale, press) {
    const im = PA.img.__hand;
    if (press) {
      c.save();
      c.globalAlpha = 0.55;
      c.strokeStyle = "#fff";
      c.lineWidth = 5;
      c.beginPath();
      c.arc(x, y, 24, 0, 7);
      c.stroke();
      c.restore();
    }
    c.save();
    c.translate(x, y);
    c.scale(scale || 1, scale || 1);
    c.rotate(-0.25);
    if (press) {
      c.translate(0, 4);
      c.scale(0.92, 0.92);
    }
    if (im && im.width) {
      const h = HAND.h,
        w = (h * im.width) / im.height;
      c.shadowColor = "rgba(10,20,50,0.35)";
      c.shadowBlur = 10;
      c.shadowOffsetX = 3;
      c.shadowOffsetY = 6;
      c.drawImage(im, -w * HAND.tipX, -h * HAND.tipY, w, h);
    } else {
      // no hand image: a drawn finger (the v2 runtime's vector hand), its tip on (x, y)
      c.lineWidth = 4;
      c.strokeStyle = PA.cfg.ink || "#13244d";
      c.fillStyle = "#fff";
      draw.rrect(c, -10, 28, 50, 46, 16);
      c.fill();
      c.stroke();
      draw.rrect(c, -10, 0, 20, 48, 10);
      c.fill();
      c.stroke();
    }
    c.restore();
  };
  // hint hand on a loop: a tap at `from`, or a drag from `from` to `to` ({x, y} logical). It only points.
  // o.urgent: a "tap now" cue for a moving or timed target (an air jump, a closing gap): faster loop, bigger hand,
  // and an expanding ring at the spot
  draw.hintHand = function (c, from, to, o) {
    o = o || {};
    const per = o.period || (o.urgent ? 0.6 : 1.4),
      p = (PA.realTime % per) / per,
      sc = (o.scale || 1) * (o.urgent ? 1.15 : 1);
    if (o.urgent) {
      const at = to || from,
        k = (PA.realTime * 2.2) % 1;
      c.save();
      c.globalAlpha = 0.8 * (1 - k);
      c.strokeStyle = o.ringColor || "#fff36a";
      c.lineWidth = 6;
      c.beginPath();
      c.arc(at.x, at.y, 26 + k * 46, 0, 7);
      c.stroke();
      c.restore();
    }
    if (!to) {
      const press = p > 0.55 && p < 0.85;
      draw.hand(
        c,
        from.x,
        from.y - (press ? 0 : Math.sin(p * Math.PI) * 16),
        sc,
        press,
      );
      return;
    }
    // press (0-0.2), travel (0.2-0.75), hold at the target (0.75-1)
    const k = p < 0.2 ? 0 : p > 0.75 ? 1 : PA.ease.inOutQuad((p - 0.2) / 0.55);
    c.save();
    c.globalAlpha = 0.35;
    c.strokeStyle = "#fff";
    c.lineWidth = 6;
    c.setLineDash([14, 12]);
    c.beginPath();
    c.moveTo(from.x, from.y);
    c.lineTo(to.x, to.y);
    c.stroke();
    c.restore();
    draw.hand(
      c,
      from.x + (to.x - from.x) * k,
      from.y + (to.y - from.y) * k,
      sc,
      p > 0.1 && p < 0.8,
    );
  };
  // result text on a backing plate, so it reads over any busy board. o: { y, color, subColor, w, plate, size }
  draw.banner = function (c, title, sub, o) {
    o = o || {};
    const w = o.w || Math.min(view.w - 60, 640),
      h = sub ? 190 : 130,
      x = view.w / 2 - w / 2,
      y = (o.y || view.h * 0.2) - h / 2;
    c.save();
    draw.rrect(c, x, y + 8, w, h, 34);
    c.fillStyle = "rgba(10,20,50,0.35)";
    c.fill();
    draw.rrect(c, x, y, w, h, 34);
    c.fillStyle = o.plate || "rgba(19,36,77,0.86)";
    c.fill();
    c.lineWidth = 5;
    c.strokeStyle = "rgba(255,255,255,0.55)";
    c.stroke();
    draw.text(c, title, view.w / 2, y + (sub ? 70 : h / 2), {
      size: o.size || 68,
      color: o.color || "#ffd23a",
    });
    if (sub)
      draw.text(c, sub, view.w / 2, y + 140, {
        size: 38,
        color: o.subColor || "#fff",
      });
    c.restore();
  };
  // small always-visible CTA pill
  draw.ctaPill = function (c, x, y, w, h, label) {
    const pulse = 1 + Math.sin(PA.realTime * 5) * 0.04;
    PA.pillRect = {
      x: view.gx + (x + w / 2) * view.s,
      y: view.gy + (y + h / 2) * view.s,
    };
    draw.button(
      c,
      x,
      y,
      w,
      h,
      label || PA.cfg.ctaLabel || "PLAY FREE",
      function () {
        PA.net.cta();
      },
      { scale: pulse, size: h * 0.5 },
    );
  };

  // ---------- end card ----------
  // o: { logo, hero, title, titleColor, tagline, stats: [{label, value}], replay: fn,
  //      logoMaxH (logical px, default 0.2 * height: square logos no longer run into the title),
  //      heroH (logical px, default 250, 220 with a tagline),
  //      art: function (c, layout) drawn instead of the hero, layout = { x, y, w, h } of the hero slot }
  const endFx = { t: 0 };
  PA.drawEndCard = function (c, o) {
    const w = view.w,
      h = view.h,
      t = (endFx.t += 1 / 60);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(20,50,120,0.78)");
    g.addColorStop(1, "rgba(10,25,70,0.9)");
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    // rotating light rays behind the hero keep the card alive
    c.save();
    c.translate(w / 2, h * 0.47);
    c.rotate(t * 0.25);
    c.globalAlpha = 0.16;
    c.fillStyle = "#fff";
    for (let i = 0; i < 12; i++) {
      c.rotate(Math.PI / 6);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-60, -700);
      c.lineTo(60, -700);
      c.closePath();
      c.fill();
    }
    c.restore();
    const logo = PA.img[o.logo];
    if (logo) {
      let lw = Math.min(w * 0.68, 480),
        lh = (lw * logo.height) / logo.width;
      const maxH = o.logoMaxH || h * 0.2;
      if (lh > maxH) {
        lw *= maxH / lh;
        lh = maxH;
      }
      c.drawImage(logo, w / 2 - lw / 2, h * 0.05 + Math.sin(t * 2) * 6, lw, lh);
    }
    const slot = {
      x: w / 2 - 200,
      y: h * (o.tagline ? 0.44 : 0.41),
      w: 400,
      h: o.heroH || (o.tagline ? 220 : 250),
    };
    const hero = PA.img[o.hero];
    if (o.art) o.art(c, slot);
    else if (hero) {
      const hh = slot.h,
        hw = (hh * hero.width) / hero.height;
      c.drawImage(hero, w / 2 - hw / 2, slot.y + Math.sin(t * 3) * 8, hw, hh);
    }
    if (o.title)
      draw.text(c, o.title, w / 2, h * 0.375, {
        size: 56,
        color: o.titleColor || "#ffd23a",
      });
    if (o.tagline)
      draw.text(c, o.tagline, w / 2, h * 0.375 + 52, {
        size: 30,
        color: "#fff",
      });
    const stats = o.stats || [];
    const bw = Math.min(w - 80, 600),
      bx = w / 2 - bw / 2,
      by = h * 0.625;
    if (stats.length) {
      draw.rrect(c, bx, by, bw, 120, 26);
      c.fillStyle = "rgba(255,255,255,0.14)";
      c.fill();
      c.strokeStyle = "rgba(255,255,255,0.4)";
      c.lineWidth = 3;
      c.stroke();
      stats.forEach(function (s, i) {
        const cx = bx + (bw * (i + 0.5)) / stats.length;
        draw.text(c, s.value, cx, by + 50, { size: 46, color: "#fff" });
        draw.text(c, s.label, cx, by + 92, {
          size: 22,
          color: "#9fe6ff",
          stroke: false,
        });
      });
    }
    const pulse = 1 + Math.sin(t * 6) * 0.05;
    draw.button(
      c,
      w / 2 - 210,
      h * 0.76,
      420,
      116,
      PA.cfg.ctaLabel || "PLAY FREE",
      function () {
        PA.net.cta();
      },
      { scale: pulse, size: 52 },
    );
    // the logo and hero are part of the CTA too: most taps on an end card are meant as installs
    PA.hit(0, 0, w, h * 0.6, function () {
      PA.net.cta();
    });
    if (o.replay) {
      draw.text(c, "Replay", w / 2, h * 0.9, {
        size: 30,
        color: "rgba(255,255,255,0.85)",
        stroke: false,
      });
      PA.hit(w / 2 - 90, h * 0.9 - 30, 180, 60, o.replay);
      PA.replayRect = {
        x: view.gx + (w / 2) * view.s,
        y: view.gy + h * 0.9 * view.s,
      }; // for QA
    }
  };
  PA.resetEndCard = function () {
    endFx.t = 0;
  };

  // ---------- mute button (every game) ----------
  // a small round speaker button that every playable has (it cannot be turned off), bottom-left by default;
  // cfg.mute moves it: 'bl' | 'br' | 'tl' | 'tr' | {x, y} (logical center, negative = from the right/bottom edge)
  let muteHit = null;
  function drawMute(c) {
    const pos = PA.cfg.mute || "bl";
    muteHit = null;
    const r = 26,
      m = 16;
    let x, y;
    if (typeof pos === "object") {
      x = pos.x < 0 ? view.w + pos.x : pos.x;
      y = pos.y < 0 ? view.h + pos.y : pos.y;
    } else {
      x = pos[1] === "l" ? m + r : view.w - m - r;
      y = pos[0] === "t" ? m + r + 70 : view.h - m - r;
    }
    c.save();
    c.globalAlpha = 0.92;
    c.fillStyle = "rgba(15,30,70,0.55)";
    c.beginPath();
    c.arc(x, y, r, 0, 7);
    c.fill();
    c.strokeStyle = "rgba(255,255,255,0.85)";
    c.lineWidth = 3;
    c.stroke();
    c.fillStyle = "#fff";
    c.beginPath(); // speaker body
    c.moveTo(x - 13, y - 6);
    c.lineTo(x - 6, y - 6);
    c.lineTo(x + 3, y - 13);
    c.lineTo(x + 3, y + 13);
    c.lineTo(x - 6, y + 6);
    c.lineTo(x - 13, y + 6);
    c.closePath();
    c.fill();
    c.strokeStyle = "#fff";
    c.lineWidth = 3;
    c.lineCap = "round";
    if (audio.muted) {
      c.beginPath();
      c.moveTo(x + 8, y - 7);
      c.lineTo(x + 16, y + 7);
      c.moveTo(x + 16, y - 7);
      c.lineTo(x + 8, y + 7);
      c.stroke();
    } else {
      c.beginPath();
      c.arc(x + 4, y, 8, -0.8, 0.8);
      c.stroke();
      c.beginPath();
      c.arc(x + 4, y, 14, -0.8, 0.8);
      c.stroke();
    }
    c.restore();
    PA.muteRect = { x: view.gx + x * view.s, y: view.gy + y * view.s }; // for QA
    muteHit = {
      x: x - r - 6,
      y: y - r - 6,
      w: (r + 6) * 2,
      h: (r + 6) * 2,
      fn: function () {
        audio.setMuted(!audio.muted);
      },
    };
  }

  // ---------- side panels (letterbox) ----------
  let sideBtn = null;
  function sideCtaHit(x, y) {
    return (
      sideBtn &&
      x >= sideBtn.x &&
      x <= sideBtn.x + sideBtn.w &&
      y >= sideBtn.y &&
      y <= sideBtn.y + sideBtn.h
    );
  }
  function drawSides() {
    if (!view.letterbox) {
      sideBtn = null;
      return;
    }
    const W = view.W,
      H = view.H,
      d = view.dpr;
    if (!sideCache) {
      sideCache = document.createElement("canvas");
      sideCache.width = canvas.width;
      sideCache.height = canvas.height;
      const c = sideCache.getContext("2d");
      const bg = PA.img[PA.cfg.sideBg];
      if (bg) {
        // blur by drawing tiny and scaling up: works everywhere, unlike ctx.filter
        const sc = Math.max(W / bg.width, H / bg.height) * d;
        const tiny = document.createElement("canvas");
        tiny.width = Math.max(8, Math.round(canvas.width / 24));
        tiny.height = Math.max(8, Math.round(canvas.height / 24));
        tiny
          .getContext("2d")
          .drawImage(
            bg,
            (tiny.width - (bg.width * sc) / 24) / 2,
            (tiny.height - (bg.height * sc) / 24) / 2,
            (bg.width * sc) / 24,
            (bg.height * sc) / 24,
          );
        c.imageSmoothingQuality = "high";
        c.drawImage(tiny, 0, 0, canvas.width, canvas.height);
      }
      c.fillStyle = PA.cfg.sideTint || "rgba(20,50,120,0.3)";
      c.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(sideCache, 0, 0);
    const pw = view.gx; // panel width in css px
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const logo = PA.img[PA.cfg.logo];
    if (logo && pw > 120) {
      const lw = Math.min(pw * 0.8, 420),
        lh = (lw * logo.height) / logo.width;
      ctx.drawImage(
        logo,
        pw / 2 - lw / 2,
        H / 2 - lh / 2 + Math.sin(PA.realTime * 2) * 5,
        lw,
        lh,
      );
    }
    if (pw > 120) {
      const bw = Math.min(pw * 0.7, 320),
        bh = bw * 0.3,
        bx = W - pw / 2 - bw / 2,
        by = H / 2 - bh / 2;
      sideBtn = { x: bx, y: by, w: bw, h: bh };
      draw.button(ctx, bx, by, bw, bh, PA.cfg.ctaLabel || "PLAY FREE", null, {
        scale: 1 + Math.sin(PA.realTime * 5) * 0.04,
      });
    }
  }

  // ---------- main loop ----------
  let last = 0,
    paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused || netHold || QA.pause) {
      last = now;
      return;
    } // QA.pause freezes the game while a screenshot is taken
    let dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
    last = now;
    dt *= QA.speed || 1;
    // fixed small steps keep fast-forwarded QA runs identical to real play
    while (dt > 1e-6) {
      const d = Math.min(1 / 60, dt);
      dt -= d;
      PA.realTime += d;
      const gd = d * PA.timeScale;
      PA.time += gd;
      input.idle += d;
      input.idleT = input.hold ? 0 : input.idleT + d;
      shake.t += d;
      updateTweens(gd, d);
      PA.game.update(gd, d);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PA.cfg.clearColor || "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawSides();
    ctx.save();
    const d = view.dpr;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.beginPath();
    ctx.rect(view.gx, view.gy, view.gw, view.gh);
    ctx.clip();
    ctx.setTransform(d * view.s, 0, 0, d * view.s, d * view.gx, d * view.gy);
    hitsNext = [];
    PA.game.draw(ctx);
    drawMute(ctx);
    if (flash.a > 0.01) {
      ctx.globalAlpha = flash.a;
      ctx.fillStyle = flash.color;
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.globalAlpha = 1;
    }
    hits = hitsNext;
    ctx.restore();
  }
  document.addEventListener("visibilitychange", function () {
    paused = document.hidden;
    if (audio.ctx) {
      if (paused) audio.ctx.suspend();
      else audio.ctx.resume();
    }
  });

  // ---------- boot ----------
  // ---------- actors: one sprite sheet, any body, any direction ----------
  // A sheet from prep_assets "sheets" (window.PA_SHEETS: one atlas, frames aligned on a shared anchor) drawn
  // as a moving thing. Views are compass codes (r, dr, d, dl, l, ul, u, ur; screen y points down) and the
  // actor shows the nearest one to its heading, mirroring a view for the opposite side unless mirror: false.
  //   const a = PA.actor('hero', { size: 120, step: 26 });     in update: a.update(dt, vx, vy)   in draw: a.draw(c, x, y)
  // Options:
  //   anim        animation name from the sheet (default: its first)
  //   size        drawn height of one cell, logical units
  //   step        logical px travelled per frame, so feet never slide (walkers); or fps: frames per second
  //               (flyers, swimmers, idle loops), which runs even when it stands still
  //   rotate      true: one view turned to face the heading (top-down cars, boats, bugs, projectiles)
  //   mirror      default true; turnSlack: degrees of hysteresis before switching view (default 25)
  //   minSpeed    below this (logical px/s) it stands: frame 0, or idle: 'animName'
  //   bob, tilt, squash, lean, breathe: procedural motion on top of the frames, for sheets with few or one
  //   frame: bob px per footstep, tilt deg waddle, squash 0..0.3 on landing, lean deg into horizontal
  //   speed, breathe 0..0.05 scale while standing. stride: px per footstep (default 2 per cycle).
  //   phase       start offset in frames (desync a crowd), shadow: true for a soft ground ellipse
  PA.actor = function (name, o) {
    o = o || {};
    const S = (window.PA_SHEETS || {})[name];
    if (!S) throw new Error("no sheet " + name + " (prep_assets 'sheets')");

  }

  // ---------- enemies ----------
  function spawnEnemy(type, u, z, group, hp) {
    const E = CFG.enemies[type],
      h = hp || E.hp || 1;
    const e = { type: type, E: E, u: u, z: z, hp: h, max: h, r: E.r || 0.09, alive: true, flash: 0, group: group,
      body: makeBody(E.sprite, rand() * 3) };

  }
  function damage(e, d) {
    const a = e.E.armour || 0;

  }
  function kill(e) {
    e.alive = false;

    const p = proj(e.u, e.z),
      big = e.max >= 10,
      sc = big ? 1.8 : 1;
    fx.burst(p.x, p.y - 40 * p.s * sc, { n: big ? 18 : 8, colors: e.E.chunks || CFG.colors.chunks, speed: 300 * Math.max(0.5, p.s * 2) * sc, life: 0.55, size: 14 * Math.max(0.5, p.s * 1.6) * sc, gravity: 600, lift: 120 });
    PA.audio.play("pop", big ? 0.9 : 0.5, 0.85 + rand() * 0.35);
    if (big) PA.shake(5, 0.2);
    const sp = e.E.splits;
    if (sp && sp.into && CFG.enemies[sp.into])
      for (let k = 0; k < (sp.count || 2); k++) {
        const c = spawnEnemy(sp.into, e.u + (k - ((sp.count || 2) - 1) / 2) * 0.1, e.z + 0.05, e.group);
        if (e.group && e.group.members) e.group.members.push(c);
      }
  }
  function updateEnemies(dt) {
    const r = squadR();
    for (const e of G.enemies) {
      if (!e.alive) continue;
      const v = e.E.speed || 1.7;
      e.z -= v * dt;
      const ch = e.E.chase == null ? 0.12 : e.E.chase;
      let vx = 0;
      if (e.z < 4.5 && e.z > 1.3) {
        vx = Math.max(-1, Math.min(1, (G.u - e.u) * 3)) * ch;
        e.u += vx * dt;
      }
      e.flash = Math.max(0, e.flash - dt * 6);
      e.body.update(dt, vx * 400, 160);
      if (!e.reached && e.z <= 1.02) {
        e.reached = true;
        if (Math.abs(e.u - G.u) < r + e.r) {
          e.alive = false;
          const before = G.count;
          setCount(G.count - (e.E.cost || 1));
          const p = proj(G.u, 1);
          puff(p.x + (e.u - G.u) * p.hw, p.y - 40, 1);
          hurtText(before);
          PA.audio.play("bad", 0.6, 1.2);
          PA.shake(5, 0.2);
          PA.emit("hurt", { cost: before - G.count, count: G.count });
        }
      }
      if (e.z < 0.55) e.alive = false;
    }
    if (G.enemies.length > 400) G.enemies = G.enemies.filter(function (e) { return e.alive || e.z > 0.55; });
  }

  // ---------- shots ----------
  function shoot(dt) {
    if (!G.units.length) return;
    const w = weapon(G.weapon),
      interval = (w.rate || 0.5) / G.mod.rate;
    G.fireAcc += (dt * G.count) / interval;
    let fired = 0;
    while (G.fireAcc >= 1) {
      G.fireAcc -= 1;
      const un = G.units[(rand() * G.units.length) | 0],
        u = G.u + un.u,
        z = 1 + un.dz + 0.03;
      un.recoil = 1;
      for (let gI = 0; gI < G.mod.guns; gI++) {
        const off = (gI - (G.mod.guns - 1) / 2) * 0.035;
        addShot(w, u + off, z, 0);
        for (let s = 1; s <= G.mod.spread; s++) {
          addShot(w, u + off, z, -0.32 * s);
          addShot(w, u + off, z, 0.32 * s);
        }
      }
      fired++;
    }
    if (fired) PA.audio.play("shot", 0.16, 0.9 + rand() * 0.25);
    // launchers (extras) fire from the squad at the nearest target
    G.extras.forEach(function (id) {
      const e = weapon(id);
      G.extraT[id] = (G.extraT[id] == null ? 0.2 : G.extraT[id]) - dt;
      if (G.extraT[id] > 0) return;
      const tg = nearestTarget(e.range || 3.7);
      if (!tg) return;
      G.extraT[id] = e.rate || 0.9;
      { const q = proj(G.u, 1.05); fx.burst(q.x, q.y - 70 * q.s, { n: 10, colors: ["#ffffff", "#ffb347", "#ff6a3a"], speed: 300, life: 0.35, size: 16, shape: "circle", additive: true }); PA.audio.play("boom", 0.25, 1.6); }
      G.shots.push({ w: e, id: id, u: G.u, z: 1.05, u0: G.u, z0: 1.05, t: 0, dur: 0.55, tgt: tg, dmg: (e.dmg || 1) * G.mod.dmg, homing: true });
    });
  }
  function addShot(w, u, z, vx) {
    if (G.shots.length >= R.maxShots) return;

  }
  function nearestTarget(range) {
    const t = END.target && END.target();
    if (t && t.z < range + 0.5) return t;

    for (const e of G.enemies) if (e.alive && e.z > 1.4 && e.z < range && (!best || e.z < best.z)) best = e;
    return best;
  }
  function explode(u, z, rad, dmg, big) {
    const p = proj(u, z);
    fx.burst(p.x, p.y - 50 * p.s, { n: big ? 22 : 12, colors: ["#ffe14a", "#ff8a2e", "#ffffff", "#ff5a3a"], speed: 420 * Math.max(0.6, p.s * 2), life: 0.5, size: 16, shape: "circle", additive: true });
    fx.burst(p.x, p.y - 50 * p.s, { n: 8, colors: ["#ffffff", "#ffe9c0"], speed: 200, life: 0.6, size: 30 * Math.max(0.6, p.s * 2), shape: "circle", drag: 4 });
    PA.audio.play("boom", 0.7, 0.9 + rand() * 0.2);
    PA.shake(big ? 6 : 4, 0.15);

  function updateShots(dt) {
    const S = G.shots,

    for (let i = S.length - 1; i >= 0; i--) {
      const b = S[i];
      if (b.homing) {

        if (b.tgt && b.tgt.alive !== false) {

          b.tz = b.tgt.z;
        }
        if (b.tu == null) {
          b.tu = b.u0;
          b.tz = 3;
        }
        if (b.t >= b.dur) {
          S.splice(i, 1);
          explode(b.tu, b.tz, b.w.splash || 0.22, b.dmg + (b.w.splashDmg || 0), false);
        }
        continue;
      }
      const z0 = b.z,
        z1 = b.z + (b.w.speed || 9) * dt;
      b.u += b.vx * dt;
      b.z = z1;
      if (z1 > (b.w.range || 3.7) || Math.abs(b.u) > 1.3) {
        S.splice(i, 1);
        continue;
      }
      let hz = 99,
        hit = null,
        kind = null;
      for (const it of items) {
        const z = KINDS[it.kind].hitTest(it, b, z0, z1);
        if (z != null && z < hz) {
          hz = z;
          hit = it;
          kind = "item";
        }
      }
      for (const e of G.enemies) {
        if (!e.alive || (b.seen && b.seen.indexOf(e) >= 0)) continue;
        if (e.z >= z0 - 0.06 && e.z <= z1 + 0.06 && e.z < hz && Math.abs(e.u - b.u) < e.r * boost(e.z)) {
          hz = e.z;
          hit = e;
          kind = "enemy";
        }
      }
      const tz = END.hitTest ? END.hitTest(b, z0, z1) : null;
      if (tz != null && tz < hz) {
        hz = tz;
        hit = null;
        kind = "end";
      }
      if (!kind) continue;
      if (kind === "item") KINDS[hit.kind].hit(hit, b);
      else if (kind === "enemy") damage(hit, b.dmg);
      else END.hit(b);
      if (b.w.splash) explode(b.u, hz, b.w.splash, b.w.splashDmg || 0, false);
      if (kind === "enemy" && b.pierce > 0) {

        b.seen.push(hit);
        continue;
      }
      S.splice(i, 1);
    }
  }

  // ---------- endings (the payoff part) ----------
  // The ending is sized when it starts, from the player's own fire power: a good player beats it with time to

  function goodRun() {
    return PA.input.touched && G.touchedPlay && G.goodOwn >= DIFF.goodPicks;
  }
  function sizeF() {
    return goodRun() ? DIFF.good : DIFF.careless;

  // boss and wallBreak: one big target walking (or scrolling) toward the squad; shots take its HP
  function bigTarget(kind) {

      isWall = kind === "wall",

    const E = {
      init: function () {

        const hp = B.hp != null ? B.hp : Math.max(B.minHp || 10, Math.round(firePower() * ((range - line) / v) * sizeF())); // B.hp: a fixed size, so the fight follows the squad you bring
        const ET = (!isWall && CFG.enemies[B.enemy]) || {};

          r: B.r || ET.r || 0.36, size: B.size || ET.size || 340, armour: ET.armour || 0,
          body: isWall ? null : makeBody(B.sprite || ET.sprite || CFG.enemies[Object.keys(CFG.enemies)[0]].sprite, 0) };
        G.banner = { text: txt(isWall ? T.wallIn : T.bossIn), color: "#ff7a4a", s: 0 };
        const bt = G.banner.text;
        PA.tween(G.banner, { s: 1 }, 0.35, { ease: "outBack", real: true });
        PA.after(1.6, function () { if (G.banner && G.banner.text === bt) G.banner = null; }, true);
        PA.audio.play("boss", 1);
        PA.audio.duck(0.12, 1.4);
        PA.shake(8, 0.5);
        PA.emit("boss", { kind: kind, hp: hp, good: goodRun(), power: Math.round(firePower()), count: G.count });
      },

      },
      hit: function (b) {

        t.hp -= Math.max(b.dmg * 0.2, b.dmg - t.armour);

      },
      update: function (dt) {

        t.flash = Math.max(0, t.flash - dt * 6);
        if (!isWall) {
          t.stomp -= dt;

            PA.shake(t.z < 3 ? 5 : 3, 0.18);
          }
          t.body.update(dt, 0, 120);
        }
        if (t.z <= t.line && !E.result) E.result = "close";
      },
      steer: function () {
        const t = E.b;

        return { betterU: t ? clampU(t.u) : 0, worseU: t ? clampU(t.u) : 0 };
      },
      done: function () {
        const t = E.b;

        return { result: "close", margin: -Math.round((t.hp / t.max) * 1000) / 1000 };
      },
      pct: function () {

      },
      onResult: function (r) {

            PA.after(k * 0.12, function () {
              fx.burst(p.x + (Math.random() - 0.5) * 320 * p.s, p.y - 320 * p.s * Math.random(), { n: 26, colors: (isWall ? ["#c46a4a", "#8a4430"] : CFG.colors.chunks).concat(["#ff5fa8", "#ffe14a", "#ffffff"]), speed: 700, life: 0.9, size: 18, gravity: 500, lift: 200 });
            }, true);
          PA.flash("#ffffff", 0.6, 0.4);

              b = proj(1.02, t.z),

                c.globalCompositeOperation = "lighter";

  // distance: a final stretch of enemy rows to the finish line; the rows' total HP is sized from the fire power.
  // Units lost on the way never come back (floor 0); reaching the finish with any unit left wins.
  function distanceEnding() {

    const E = {
      floor: 0,
      init: function () {

      },
      start: function () {

        // the squad (count / 4 enemies, at most cols), so a weak squad meets short rows it can line up with.

        PA.after(1.6, function () { if (G.banner && G.banner.text === T.runIn) G.banner = null; }, true);
        PA.audio.play("boss", 0.8);
        PA.audio.duck(0.12, 1.4);

      update: function () {

  PARTS.payoff.boss = function () { return bigTarget("boss"); };

  PARTS.payoff.distance = distanceEnding;
  PARTS.win.ending = function () {
    return END.done();
  };

  // ---------- input: a relative horizontal drag ----------
  PARTS.input.drag = {

    },
    move: function (x) {
      if (G.drag) G.tu = G.drag.u0 + (x - G.drag.sx) / R.pxPerU;
    },
    up: function () {

    },
    hint: function () {

    },
  };
  // move: the squad slides to the dragged lane; the road scrolls on its own (the genre)
  PARTS.move.strafe = function (dt) {

    G.tu = Math.max(-m, Math.min(m, G.tu));
    G.u += (G.tu - G.u) * Math.min(1, dt * 12);
    G.u = Math.max(-m, Math.min(m, G.u));

  // spawn: the track's items, set up once, approaching at their own speed and resolved at the squad line
  PARTS.spawn.track = {
    init: function () {
      CFG.track.forEach(function (it0, n) {
        const it = Object.assign({ i: n, done: false, fade: 1, flash: 0, side: -1 }, JSON.parse(JSON.stringify(it0)));
        if (!KINDS[it.kind]) throw new Error("no item kind " + it.kind);
        it.at = it.at || 0;
        if (KINDS[it.kind].init) KINDS[it.kind].init(it);
        if (it.speed) it.z = 1 + it.speed * it.at;
        G.items.push(it);
      });
      G.items.sort(function (a, b) { return a.at - b.at; });
    },
    update: function (dt) {
      for (const it of G.items) {
        const K = KINDS[it.kind];
        if (it.speed) {
          it.z -= it.speed * dt;
          if (!it.near && it.z < 3.0) {
            it.near = true;
            PA.emit(it.kind + "Near", { i: it.i });
          }
          if (it.options) for (const o of it.options) o.pulse = Math.max(0, (o.pulse || 0) - dt * 4);
          if (!it.done && it.z <= 1.0) {
            K.pass(it);
            it.done = true;
          }
          if (it.done) {
            it.fade = Math.max(0, it.fade - dt * 2.5);
            it.flash = Math.max(0, it.flash - dt * 3);

      updateEnemies(dt);
      if (G.stage !== "ending" && G.t >= CFG.ending.at) {

      updateShots(dt);

  };
  // the next thing to steer for: the first unresolved item, or the ending
  function nextItem() {
    for (const it of G.items) {

      if (it.members) {

    return null;
  }
  function steerNext() {
    const it = nextItem();

    if (G.stage === "ending") return END.steer();
    return { betterU: 0, worseU: maxU() * 0.75 };
  }

  // ---------- results ----------
  function finish(kind, margin) {

      PA.audio.duck(0.15, 2.6);
      for (let i = 0; i < 6; i++) PA.after(0.3 + i * 0.35, confetti, true);
      PA.tween(G, { cheer: 1 }, 0.3, { delay: 0.6, real: true });

      PA.after(0.35, function () { PA.audio.play("fail", 1); }, true);

    }

    PA.after(R.resultHold, endCard, true);
  }
  function confetti() {
    const w = PA.view.w;
    for (let k = 0; k < 3; k++)

  function endCard() {

  // idle timeout or round cap during the run: one honest line from the real state, then the end card

      sub: t && t.boss ? t.label : G.count + " " + (G.count === 1 ? CFG.squad.name : CFG.squad.plural) + ", " + G.kills + " " + T.statKills,
      color: "#ffe14a", s: 0, big: true };
    PA.tween(G.banner, { s: 1 }, 0.35, { ease: "outBack", real: true });
    if (why === "cap") PA.audio.play("fail", 0.8);
    PA.emit("result", { result: "close", why: why, count: G.count, kills: G.kills, margin: -1 });
    PA.after(why === "idle" ? 1.5 : 2.5, endCard, true);

  // what a part may use
  const api = {

  // ---------- reset, start ----------
  function reset() {

      picks: 0, u: 0, tu: 0, drag: null, units: [], items: [], enemies: [], shots: [], fireAcc: 0, extraT: {},
      weapon: CFG.squad.weapon, mod: { guns: 1, spread: 0, rate: 1, dmg: 1 }, extras: [], badges: [], banner: null,

    ufx.parts.length = ufx.texts.length = 0;

    Pt.spawn.init(api);
    END = Pt.payoff(api);

  function startRun() {

  }

  // ---------- update ----------
  function update(dt, rdt) {
    layout();
    if (G.phase === "end") {
      fx.update(dt);
      ufx.update(rdt);
      return;
    }
    const idle = PA.idle();
    if (G.phase === "wait") {
      if (idle.timeout) endCard(); // untouched: straight to the end card, no result line
      dt = 0; // the gameplay clock is held until the first touch

  }

  // ---------- draw ----------

  function fitLevel() {
    let gates = false;
    CFG.track = CFG.track.filter(function (it) {
      if (CFG.obstacles[it.kind] !== undefined && !PA.hasArt(CFG.obstacles[it.kind])) {
        PA.leaveOut("the " + it.kind, CFG.obstacles[it.kind]);

      }
      if (it.kind === "choice" && !PA.hasArt(CFG.gates.card)) {

      }

  function drawWall(c, x, y, w, h, frac, flash) {
    if (has(CFG.obstacles.wall)) {
      const im = PA.img[CFG.obstacles.wall];

      c.drawImage(im, x, y - h, w, h);
      if (flash > 0.02) {
        c.globalCompositeOperation = "lighter";
        c.globalAlpha *= Math.min(0.45, flash * 0.6);

      }
      c.restore();
    }

      c.lineWidth = Math.max(2, h * 0.025);
      const n = Math.ceil((1 - frac) * 6);
      for (let k = 0; k < n; k++) {
        const cx = x + w * ((k * 0.37 + 0.15) % 1);
        c.beginPath();
        c.moveTo(cx, y - h);
        c.lineTo(cx + h * 0.12, y - h * 0.6);
        c.lineTo(cx - h * 0.08, y - h * 0.3);
        c.stroke();
      }
    }
    if (frac < 1) {
      D.rrect(c, x + w * 0.2, y - h - 26, w * 0.6, 16, 8);

      c.fill();
      D.rrect(c, x + w * 0.2 + 2, y - h - 24, Math.max(6, (w * 0.6 - 4) * Math.max(0, frac)), 12, 6);

      c.fill();

  }
  function drawRoad(c) {
    // the plate's static edge dashes are painted out; these scroll with the road
    const step = 0.62,
      len = 0.26,
      base = Math.floor(G.road / step) * step;
    c.fillStyle = CFG.colors.dash;
    for (let j = 0; j < 40; j++) {
      const za = 0.68 + base + j * step - G.road,
        zb = za + len;
      if (zb < 0.68 || za > 8) continue;
      for (const side of [-1, 1]) {
        const a = proj(side * 0.985, za),
          b = proj(side * 1.03, za),
          cc = proj(side * 1.03, zb),

        c.moveTo(a.x, a.y);
        c.lineTo(b.x, b.y);
        c.lineTo(cc.x, cc.y);
        c.lineTo(d.x, d.y);
        c.closePath();
        c.fill();
      }
    }
  }
  function drawGate(c, it) {
    const z = it.z;
    if (z < 0.8 || z > W.farZ) return;
    const alpha = farAlpha(z) * it.fade * Math.max(0, Math.min(1, (z - 0.92) / 0.15 + (it.done ? 0 : 1)));
    if (alpha <= 0.01) return;
    const n = it.options.length,
      L = gateLanes(it),

      half = 0.96 * p.hw,

    c.globalAlpha = alpha;
    it.options.forEach(function (o, i) {
      const isCard = it.kind === "choice",
        want = isCard ? CFG.gates.card : isGood(o) ? CFG.gates.good : CFG.gates.bad,
        im = PA.img[want];
      if (!im || !im.width) return;
      const w = ((half * 2) / n) * 0.98,
        h = ((w * im.height) / im.width) * (isCard ? 1.2 : 1),
        x = p.x + L[i].mid * half / 0.96;

        pulse = best === i ? 0.5 + 0.5 * Math.sin(PA.realTime * 6) : o.pulse || 0,

      D.text(c, lab, 0, has(icon) ? -h * 0.2 : -h * 0.52, { size: fs, color: "#fff", stroke: isGood(o) ? "#0d3a9e" : "#8a0f1c", sw: Math.max(4, fs * 0.14) });
      if (best === i) {

        c.lineTo(26, y - 30);

  }
  function drawCrate(c, it, o) {
    const z = it.z;
    if (o.got || z < 0.8 || z > W.farZ || (it.done && z < 1)) return;
    const p = proj(o.u, z),
      h = 104 * p.s * boost(z),
      bob = Math.sin(PA.realTime * 4 + o.u * 5) * 8 * p.s;
    c.save();
    c.globalAlpha = farAlpha(z) * it.fade;
    shadow(c, p.x, p.y, h * 0.45);
    c.globalCompositeOperation = "lighter";
    const g = c.createRadialGradient(p.x, p.y - h * 0.6 - bob, 0, p.x, p.y - h * 0.6 - bob, h * 0.9);
    g.addColorStop(0, "rgba(255,230,120,0.55)");
    g.addColorStop(1, "rgba(255,230,120,0)");
    c.fillStyle = g;
    c.beginPath();
    c.arc(p.x, p.y - h * 0.6 - bob, h * 0.9, 0, 7);
    c.fill();
    c.globalCompositeOperation = "source-over";
    const icon = optIcon(o);
    const crateImg = (o.give && has("crate_" + o.give)) ? "crate_" + o.give : CFG.obstacles.crate;
    still(c, crateImg, p.x, p.y - 10 * p.s - bob, h, { flash: o.flash });
    if (has(icon)) still(c, icon, p.x, p.y - h * 0.35 - bob, h * 0.5);
    o.flash = Math.max(0, (o.flash || 0) - 0.08);
    // the label reads from far: at least 28 logical px, shown from z < 4.2

    if (o.hp > 0 && it.hp && o.hp < it.hp) {

      c.fill();
    }
    c.restore();
  }
  function drawEnemy(c, e) {
    const z = e.z;
    if (z < 0.6 || z > W.farZ) return;
    const p = proj(e.u, z),
      H = (e.E.size || 96) * p.s * boost(z);
    c.save();
    c.globalAlpha = farAlpha(z) * (z < 0.9 ? Math.max(0, (z - 0.6) / 0.3) : 1);
    shadow(c, p.x, p.y, H * 0.3);
    e.body.draw(c, p.x, p.y, { size: H, alpha: c.globalAlpha });
    if (e.flash > 0.02) {
      c.save();
      c.globalCompositeOperation = "lighter";
      e.body.draw(c, p.x, p.y, { size: H, alpha: Math.min(0.45, e.flash * 0.6) * c.globalAlpha });
      c.restore();
    }
    if ((e.E.boss || e.max >= 10) && e.hp < e.max && z < 5) {

        bx = p.x - bw / 2,
        by = p.y - H - 14 * p.s - 10;

      c.fill();

      c.fill();
    }
    c.restore();
  }
  function drawUnit(c, un, i) {
    const zz = 1 + un.dz,

      hh = unitH(G.units.length) * p.s * un.s;
    if (hh < 1) return;
    shadow(c, p.x, p.y, hh * 0.34);
    if (G.cheer > 0.5 && has(CFG.squad.cheer)) {
      still(c, CFG.squad.cheer, p.x, p.y - Math.abs(Math.sin(un.ph)) * 12 * p.s, hh * 1.08);

    if (G.phase === "wait") {

    } else {

      const firing = un.recoil > 0.25;
      if (un.body.setAnim) un.body.setAnim(firing ? "fire" : "run");
      if (firing) un.body.frame = [1, 2, 3][Math.min(2, Math.floor(((1 - un.recoil) / 0.75) * 3))];
      un.body.draw(c, p.x, p.y + un.recoil * 3, { size: hh });
      if (un.recoil > 0.55) {

        c.globalCompositeOperation = "lighter";

        mg.addColorStop(1, "rgba(255,170,40,0)");

        c.arc(mx, my, mr, 0, 7);
        c.fill();
        c.restore();

  }
  // waiting: glowing dots flow up the road from the squad toward the better panel of the first item
  function drawGuide(c) {
    const it = nextItem();
    if (!it || it.z == null) return;
    const side = KINDS[it.kind].steer(it).betterU;
    for (let k = 0; k < 14; k++) {
      const f = (k / 14 + PA.realTime * 0.45) % 1,
        z = 1.3 + (it.z - 1.35) * f,
        u = G.u + (side - G.u) * Math.min(1, f * 1.6),
        q = proj(u, z),

      c.strokeStyle = "#2f7dff";
      c.lineWidth = 3;

  function drawShots(c) {

    for (const b of G.shots) {
      if (b.homing) continue;
      const w = b.w;
      if (w.image && has(w.image)) continue;
      const a = proj(b.u, b.z),
        t = proj(b.u - b.vx * 0.02, Math.max(0.7, b.z - (w.len || 0.2) * (G.mod.rate > 1.2 ? 2 : 1))),

      c.strokeStyle = hot ? "rgba(255,70,40,0.55)" : w.glow || "rgba(255,170,40,0.45)";

    c.restore();
    for (const b of G.shots) {
      const w = b.w;
      if (!b.homing && !(w.image && has(w.image))) continue;
      let u = b.u,
        z = b.z,
        arc = 0,
        rot = 0;
      if (b.homing) {
        const e = Math.min(1, b.t / b.dur);
        u = b.u0 + ((b.tu == null ? b.u0 : b.tu) - b.u0) * e;
        z = b.z0 + ((b.tz == null ? 3 : b.tz) - b.z0) * e;
        rot = ((b.tu == null ? 0 : b.tu) - b.u0) * 0.6 * (1 - e);
        arc = Math.sin(e * Math.PI) * 160;
      }
      const p = proj(u, z),
        h = Math.max(b.homing ? 44 : 26, (b.homing ? 120 : 70) * p.s),
        y = p.y - 50 * p.s - arc * Math.max(0.35, p.s);
      if (w.image && has(w.image)) still(c, w.image, p.x, y, h, { center: true, rot: rot });
      else {
        c.save();
        c.translate(p.x, y);
        c.rotate(rot);
        c.fillStyle = "#ffffff";
        c.strokeStyle = INK;
        c.lineWidth = 3;
        D.rrect(c, -h * 0.16, -h / 2, h * 0.32, h * 0.8, h * 0.16);
        c.fill();
        c.stroke();
        c.fillStyle = "#ff8a2e";
        c.beginPath();
        c.moveTo(-h * 0.14, h * 0.3);
        c.lineTo(0, h * 0.62);
        c.lineTo(h * 0.14, h * 0.3);
        c.closePath();
        c.fill();
        c.restore();
      }
      if (b.homing && Math.random() < 0.6) fx.burst(p.x, y + h * 0.4, { n: 1, colors: ["#ffffff", "#ffe9c0"], speed: 40, life: 0.35, size: 10, shape: "circle", drag: 3 });
    }
  }
  function drawWorld(c) {
    const sh = PA.shakeOffset();
    c.save();
    c.translate(sh.x, sh.y);
    c.drawImage(PA.img[W.plate], P.ox, P.oy, 720 * P.k, 1280 * P.k);
    drawRoad(c);
    if (G.phase === "wait") drawGuide(c);
    const list = [];
    for (const it of G.items) KINDS[it.kind].draw(list, it);
    for (const e of G.enemies) if (e.alive && e.z < W.farZ) list.push({ z: e.z, f: function (c2) { drawEnemy(c2, e); } });
    END.draw(list);
    G.units.forEach(function (un, i) {
      list.push({ z: 1 + un.dz, f: function (c2) { drawUnit(c2, un, i); } });
    });
    list.sort(function (a, b) { return b.z - a.z; });
    for (const e of list) e.f(c);
    drawShots(c);
    fx.draw(c);
    c.restore();
    drawBubbles(c);
  }
  function bubble(c, x, y, str, red, sc) {
    const fs = 40 * sc;
    c.font = D.font(fs);
    const tw = c.measureText(str).width,
      w = Math.max(fs * 1.7, tw + fs * 0.9),
      h = fs * 1.35;
    c.save();
    c.fillStyle = red ? "#e3313c" : "#ffffff";
    c.strokeStyle = red ? "#ffffff" : "#6d86c6";
    c.lineWidth = 4 * sc;
    D.rrect(c, x - w / 2, y - h, w, h, h * 0.45);
    c.fill();
    c.stroke();
    c.beginPath();
    c.moveTo(x - 10 * sc, y - 2);
    c.lineTo(x, y + 13 * sc);
    c.lineTo(x + 10 * sc, y - 2);
    c.closePath();
    c.fill();
    D.text(c, str, x, y - h * 0.48, { size: fs, color: red ? "#ffffff" : INK, stroke: red ? "#7a0f18" : false });
    c.restore();
  }
  function drawBubbles(c) {
    if (G.phase === "end") return;
    if (G.count > 0) {
      const top = G.units.reduce(function (m, un) { return Math.max(m, un.dz); }, 0),
        p = proj(G.u, 1 + top + 0.02);
      bubble(c, p.x, p.y - unitH(G.units.length) * p.s - 16, String(G.count), false, 1 + G.bump * 0.3);
    }
    for (const it of G.items) {
      if (!it.members || it.banner || it.done) continue;
      const g = groupU(it);
      if (!g || g.z > W.farZ - 0.3 || g.z < 1.3) continue;
      let zmax = 0,
        n = 0;
      for (const e of it.members)
        if (e.alive) {
          zmax = Math.max(zmax, e.z);
          n++;
        }
      const p = proj(g.u, Math.min(zmax, W.farZ) + 0.1);
      bubble(c, p.x, p.y - 100 * p.s * boost(g.z) - 6, String(n), true, 0.5 + 0.5 / Math.max(1, g.z * 0.6));
    }
  }
  function drawHud(c) {
    const w = PA.view.w,
      NAVY = CFG.colors.panel;
    D.rrect(c, 16, 26, 172, 58, 29);
    c.fillStyle = NAVY;
    c.fill();
    c.strokeStyle = "#4f8dff";
    c.lineWidth = 4;
    c.stroke();
    D.text(c, T.level, 102, 56, { size: 32, stroke: false });
    // progress to the ending, or the ending's own bar (a boss's HP) once it is here
    const bx = 214,
      bw = w - 214 - 230,
      by = 40,
      bh = 30,
      eh = G.stage === "ending" && END.hud ? END.hud() : null;
    D.rrect(c, bx, by, bw, bh, 15);
    c.fillStyle = NAVY;
    c.fill();
    const prog = eh ? eh.prog : Math.min(1, G.t / CFG.ending.at),
      col = eh && eh.boss ? ["#ff8a5a", "#e0302c"] : ["#8dff5a", "#36c42a"];
    if (prog > 0.01) {
      D.rrect(c, bx + 4, by + 5, Math.max(14, (bw - 8) * prog), bh - 10, 10);
      const g = c.createLinearGradient(0, by, 0, by + bh);
      g.addColorStop(0, col[0]);
      g.addColorStop(1, col[1]);
      c.fillStyle = g;
      c.fill();
    }
    if (has(CFG.hud.flag)) still(c, CFG.hud.flag, bx + bw + 4, by + bh + 8, 52);
    if (eh) D.text(c, eh.label, bx + bw / 2, by + bh + 26, { size: 26, color: "#ffe0d0" });
    const cx = w - 196;
    D.rrect(c, cx, 26, 180, 58, 29);
    c.fillStyle = NAVY;
    c.fill();
    c.strokeStyle = "#4f8dff";
    c.lineWidth = 4;
    c.stroke();
    if (has(CFG.hud.coin)) still(c, CFG.hud.coin, cx + 32, 82, 54);
    D.text(c, G.coins.toLocaleString("en-US"), cx + 168, 56, { size: 32, align: "right", stroke: false });
    // upgrades taken, under the LEVEL pill
    let wy = 100;
    G.badges.slice(-4).forEach(function (b) {
      c.font = D.font(22);
      const tw = c.measureText(b).width + 24;
      D.rrect(c, 16, wy, tw, 34, 17);
      c.fillStyle = "rgba(27,47,110,0.85)";
      c.fill();
      D.text(c, b, 16 + tw / 2, wy + 17, { size: 22, color: "#ffe14a", stroke: false });
      wy += 40;
    });
    if (G.phase !== "end") D.ctaPill(c, w - 190, 100, 174, 54);
  }
  function drawHint(c) {
    const v = PA.view,
      inp = PA.input;
    if (G.phase !== "play" && G.phase !== "wait") return;
    if (!(G.phase === "wait" ? !inp.down : PA.idle().hint || G.t < 3)) return; // shown from the first second, not only after a stall
    const bw = Math.min(484, v.w - 60),
      bar = CFG.hud.drag && PA.img[CFG.hud.drag];
    const bh = bar && bar.width ? (bw * bar.height) / bar.width : 80,
      by = Math.min(v.h - bh - 40, 1134 * P.k + P.oy);
    if (bar && bar.width) c.drawImage(bar, v.w / 2 - bw / 2, by, bw, bh);
    else {
      D.rrect(c, v.w / 2 - bw / 2, by, bw, bh, bh / 2);
      c.fillStyle = "rgba(19,36,77,0.78)";
      c.fill();
      c.strokeStyle = "rgba(255,255,255,0.7)";
      c.lineWidth = 4;
      c.stroke();
      D.text(c, T.drag, v.w / 2, by + bh / 2, { size: 36 });
    }
    // the hand loops the real move: a drag toward the better lane, hold, back. It only points.
    const h = Pt.input.hint(api);
    if (!h) return;
    const ph = (PA.realTime / 2.6) % 1,
      e = ph < 0.4 ? PA.ease.inOutQuad(ph / 0.4) : ph < 0.65 ? 1 : 1 - PA.ease.inOutQuad((ph - 0.65) / 0.35),
      hx = v.w / 2 + h.side * 200 * h.amount * e;
    D.hand(c, hx + 6, by + bh * 0.86, G.phase === "wait" ? 1.4 : 1.15, true);
  }
  function drawHook(c) {
    if (G.hookA <= 0.01) return;
    const v = PA.view;
    c.globalAlpha = G.hookA;
    const by = Math.min(v.h - 200, 1040 * P.k + P.oy) + Math.sin(PA.realTime * 4) * 3,
      bw = Math.min(620, v.w - 60),
      k = G.hookS * (G.phase === "wait" ? 1 + 0.05 * Math.sin(PA.realTime * 4.2) : 1);
    c.save();
    c.translate(v.w / 2, by);
    c.scale(k, k);
    c.translate(-v.w / 2, -by);
    D.rrect(c, v.w / 2 - bw / 2, by - 40, bw, 80, 30);
    const g = c.createLinearGradient(0, by - 40, 0, by + 40);
    g.addColorStop(0, CFG.colors.hook[0]);
    g.addColorStop(1, CFG.colors.hook[1]);
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = INK;
    c.lineWidth = 5;
    c.stroke();
    D.text(c, G.hookText, v.w / 2, by + 2, { size: G.phase === "wait" ? 42 : 46 });
    c.restore();
    c.globalAlpha = 1;
  }
  function drawBanner(c) {
    const v = PA.view,
      b = G.banner;
    if (!b) return;
    c.save();
    c.translate(v.w / 2, b.big ? 300 : 640);
    c.scale(b.s, b.s);
    c.font = D.font(b.big ? 70 : 54);
    const tw = c.measureText(b.text).width,
      pw = Math.min(v.w - 24, Math.max(b.sub ? 560 : 0, tw + 70)),
      ph = b.big ? (b.sub ? 190 : 120) : 88,
      top = b.big ? -68 : -46;
    D.rrect(c, -pw / 2, top, pw, ph, 32);
    const g = c.createLinearGradient(0, top, 0, top + ph);
    g.addColorStop(0, "rgba(27,47,110,0.94)");
    g.addColorStop(1, "rgba(12,24,70,0.94)");
    c.fillStyle = g;
    c.fill();
    c.lineWidth = 5;
    c.strokeStyle = "#6fb6ff";
    c.stroke();
    D.text(c, b.text, 0, 0, { size: Math.min(b.big ? 70 : 54, ((v.w - 60) / Math.max(1, tw)) * (b.big ? 70 : 54)), color: b.color, sw: 11 });
    if (b.sub) D.text(c, b.sub, 0, 80, { size: 38, color: "#ffffff", sw: 8 });
    c.restore();
  }
  function draw(c) {
    layout();
    drawWorld(c);
    if (G.phase === "end") {
      const win = G.result === "win",
        ln = G.result ? END.line(G.result) : null;
      PA.drawEndCard(c, {
        logo: CFG.endcard.logo,
        hero: CFG.endcard.hero,
        title: !G.result ? T.promise : (ln && ln.text) || T.close, // untouched viewers get the promise, not a result
        tagline: !G.result ? T.promise2 : win ? T.hookWin : T.hookLose,
        heroH: 250,
        art: function (c2, L) {
          const bo = PA.img[CFG.endcard.boss], he = PA.img[CFG.endcard.hero], tt = PA.realTime;
          if (bo && bo.width) { const bh = L.h * 1.55, bw = bh * bo.width / bo.height; c2.save(); c2.globalAlpha = 0.95; c2.drawImage(bo, L.x + L.w / 2 - bw / 2 + 120, L.y - L.h * 0.35 + Math.sin(tt * 2) * 6, bw, bh); c2.restore(); }
          if (he && he.width) { const hh = L.h * 1.05, hw = hh * he.width / he.height; c2.drawImage(he, L.x + L.w / 2 - hw / 2 - 130, L.y + L.h * 0.12 + Math.sin(tt * 3) * 8, hw, hh); }
        },
        titleColor: G.result && !win ? "#ff8ac8" : "#ffe14a",
        stats: !G.result ? [] : [{ label: T.statSquad, value: String(G.peak) }, { label: T.statKills, value: String(G.kills) }, END.stat(G.result)],
        replay: function () {
          PA.emit("replay");
          PA.clearTweens();
          reset();
        },
      });
      ufx.draw(c);
      return;
    }
    drawHud(c);
    drawHook(c);
    drawHint(c);
    ufx.draw(c); // under the banners: confetti must not cover the result
    drawBanner(c);
  }

  // ---------- boot: pick the parts, merge the project's own ----------
  function pickParts() {
    const extra = window.PRESET_PARTS || {};
    Object.keys(extra).forEach(function (k) {
      if (PARTS[k]) Object.assign(PARTS[k], extra[k]);
    });
    ["input", "move", "spawn", "payoff", "win"].forEach(function (k) {
      const name = CFG.parts[k];
      if (!PARTS[k][name]) throw new Error("no " + k + " part named " + name);
      Pt[k] = PARTS[k][name];
    });
  }
  window.GAME_CFG.images = Object.assign({}, window.GAME_CFG.images, CFG.images);
  window.GAME_CFG.sounds = Object.assign({}, window.GAME_CFG.sounds, CFG.sounds);
  const game = {
    init: function () {
      pickParts();
      fitLevel();
      layout();
      reset();
    },
    resize: layout,
    update: update,
    draw: draw,
    onDown: function (x, y) {
      if (G.phase !== "wait" && G.phase !== "play") return;
      startRun();
      Pt.input.down(x, y, api);
    },
    onMove: function (x, y) {
      if (G.phase === "play") Pt.input.move(x, y, api);
    },
    onUp: function () {
      Pt.input.up(api);
    },
    // QA snapshot: read by qa_bot.py and scripts/tune.py
    qa: function () {
      const v = PA.view,
        nx = nextItem(),
        st = steerNext(),
        tg = END.target && END.target();
      return {
        phase: G.phase, t: G.t, scale: v.s, count: G.count, drawn: G.units.length, bubble: G.count, rate: G.mod.rate, extras: G.extras.length, spread: G.mod.spread, peak: G.peak, kills: G.kills, good: G.good, goodOwn: G.goodOwn,
        result: G.result, progress: Math.round(G.road * 100) / 100, power: Math.round(firePower() * 10) / 10,
        u: G.u, u0: G.drag ? G.drag.u0 : null, pxPerU: R.pxPerU, maxU: maxU(),
        next: st && { kind: nx ? nx.kind : G.stage === "ending" ? "ending" : "none", i: nx ? nx.i : -1, betterU: st.betterU, worseU: st.worseU },
        stage: G.stage, ending: CFG.parts.payoff, boss: tg ? { hp: tg.hp, max: tg.max, z: tg.z } : null,
        cta: PA.toClient(v.w / 2, v.h * 0.76 + 58),
        pill: PA.toClient(v.w - 190 + 87, 127),
      };
    },
  };
  window.__game = game;
  PA.boot(window.GAME_CFG, game);
})();

</script>
