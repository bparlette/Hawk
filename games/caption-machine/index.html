<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Caption Machine — slam captions</title>
<link href="vendor/fonts/fonts-local.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  #shaker { position: absolute; inset: 0; }
  #shaker.shake { animation: shake .3s linear; }
  @keyframes shake {
    0% { transform: translate(0,0); } 20% { transform: translate(-7px,3px); }
    40% { transform: translate(6px,-4px); } 60% { transform: translate(-4px,-2px); }
    80% { transform: translate(3px,2px); } 100% { transform: translate(0,0); }
  }
  #caption {
    position: absolute; left: 4%; right: 4%; top: 30%; z-index: 50; text-align: center;
    font-family: 'Anton', 'Arial Black', sans-serif; text-transform: uppercase;
    font-size: clamp(42px, 13vw, 96px); line-height: .98; letter-spacing: .01em;
    color: #fff; -webkit-text-stroke: 2px rgba(0,0,0,.85);
    text-shadow: 0 4px 0 rgba(0,0,0,.85), 0 10px 34px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none; transform: rotate(-2deg);
  }
  #caption.small { font-size: clamp(32px, 9.5vw, 68px); }
  #caption.slam { animation: slam .32s cubic-bezier(.2,2.4,.4,1) forwards; }
  #caption.hold { opacity: 1; transform: rotate(-2deg) scale(1); }
  #caption.out { animation: capout .3s ease-in forwards; }
  @keyframes slam {
    0% { opacity: 0; transform: rotate(-2deg) scale(3.1); }
    55% { opacity: 1; transform: rotate(-2deg) scale(.92); }
    75% { transform: rotate(-2deg) scale(1.05); }
    100% { opacity: 1; transform: rotate(-2deg) scale(1); }
  }
  @keyframes capout { to { opacity: 0; transform: rotate(-2deg) scale(.8) translateY(26px); } }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(5,5,10,0), rgba(5,5,10,.88) 22%);
  }
  #customrow { display: flex; gap: 8px; margin-bottom: 10px; }
  #customtext {
    flex: 1; min-height: 50px; border-radius: 12px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.1); color: #fff; padding: 0 14px;
    font-family: 'Oswald', sans-serif; font-size: 17px; text-transform: uppercase;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  #customtext::placeholder { color: rgba(255,255,255,.45); }
  #grind {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    max-height: 34vh; overflow-y: auto; padding-bottom: 2px;
  }
  .pill {
    z-index: 1100; min-height: 52px; padding: 10px 8px; border-radius: 12px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.28); background: rgba(12,12,20,.82); color: #fff;
    font-family: 'Anton', 'Arial Black', sans-serif; font-size: 15.5px; letter-spacing: .03em;
    text-transform: uppercase; line-height: 1.15;
  }
  .pill:active { transform: scale(.95); background: #fff; color: #111; }
</style>
</head>
<body>
<div id="stage">
  <div id="shaker">
    <video id="cam" playsinline muted autoplay></video>
    <div id="fallback"><div class="room"><div class="tv"></div><div class="couch"></div></div></div>
    <div id="caption"></div>
  </div>

  <div class="topbar">
    <div class="title">Caption Machine</div>
    <div class="spacer"></div>
    <button class="chipbtn" id="alignbtn">Align TV</button>
  </div>

  <div id="sheet">
    <div id="customrow">
      <input id="customtext" type="text" maxlength="60" placeholder="Type your own caption…" autocomplete="off">
      <button class="bigbtn primary" id="customgo" style="min-height:50px;padding:10px 18px;">Slam</button>
    </div>
    <div id="grind"></div>
  </div>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>

<style id="universal-offsets">#ci-root.ci-tl{top:63px!important}#ar-mark-root{top:191px!important;bottom:auto!important}</style>
<script src="mark-button.js"></script>
<script src="mic-trigger.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
var __cbs = { onSpike: function () { var c = document.querySelectorAll('#grind button'); if (c.length) { c[Math.floor(Math.random() * c.length)].click(); } } };
var __micStarted = false;
document.addEventListener('pointerdown', function () { if (!__micStarted && window.MicTrigger) { __micStarted = true; MicTrigger.start(__cbs).catch(function () {}); } }, false);
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { window.ARShared.initCamera(v, function () {}); }, onSource: function (info) {
      if (info.mode === 'import') { if (window.MicTrigger) MicTrigger.stop(); ClipImport.startTriggers(__cbs); }
      if (info.mode === 'camera') { ClipImport.stopTriggers(); __micStarted = false; }
    }
  });
</script>
<script src="clean-view.js"></script>
<script>
/* ---- clean view + pinch zoom (owner feedback fix 2026-11-16) ---- */
CleanView.init({ mode: 'stage' });
</script>
</body>
</html>
