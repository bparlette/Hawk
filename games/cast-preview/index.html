const FXDEF = {
  impact: { src: 'fx/bullet-impact.png', fw: 152, fh: 100, cols: 6, n: 43, px: 116, py: 84, fps: 30 },
  spark:  { src: 'fx/hit-spark.png',     fw: 136, fh: 80,  cols: 4, n: 16, px: 44,  py: 64, fps: 30 }
};
for (const k in FXDEF) { const im = new Image(); im.src = IMGDATA[FXDEF[k].src]; FXDEF[k].img = im; }

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;
const FLOOR = 400, SC = 4;
const keys = {};
let lastInput = performance.now();
addEventListener('keydown', e => { keys[e.code] = true; lastInput = performance.now(); if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });

const S = { x: 110, hp: 5, state: 'idle', t: 0, cool: 0, hurtT: 0 };
let zombies = [], fxs = [], score = 0, spawnT = 0.5, over = 0, time = 0;
const ZSPEED = [36, 28, 46];

function spawnZombie() {
  const v = Math.floor(Math.random() * 3);
  zombies.push({ x: 800, v, hp: 2, state: 'walk', t: Math.random() * 0.5, atkT: 0, fade: 1 });
}
function addFx(kind, x, y) { fxs.push({ kind, x, y, t: 0 }); }

function shoot() {
  if (S.cool > 0 || S.state === 'down') return;
  S.state = 'attack'; S.t = 0; S.cool = 0.5; S.fired = false;
}
function fireNow() {
  let best = null;
  for (const z of zombies)
    if (z.state !== 'down' && z.x > S.x + 60 && z.x - S.x < 340 && (!best || z.x < best.x)) best = z;
  if (!best) return;
  addFx('impact', best.x + 52, 316); addFx('spark', best.x + 52, 316);
  best.hp--;
  if (best.hp <= 0) { best.state = 'down'; best.t = 0; score += 100; }
  else { best.state = 'hit'; best.t = 0; }
}

function botControl(dt) {
  let best = null;
  for (const z of zombies)
    if (z.state !== 'down' && z.x > S.x && (!best || z.x < best.x)) best = z;
  let move = 0;
  if (best) {
    const gap = best.x - S.x;
    if (gap > 300) move = 1; else if (gap < 210) move = -1;
    if (gap < 320 && gap > 120) shoot();
  }
  return move;
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const auto = now - lastInput > 3000;
  // --- soldier ---
  S.cool = Math.max(0, S.cool - dt); S.hurtT = Math.max(0, S.hurtT - dt);
  let move = 0;
  if (keys.ArrowRight || keys.KeyD) move = 1;
  if (keys.ArrowLeft || keys.KeyA) move = -1;
  if (auto && S.state !== 'down') move = botControl(dt);
  if (keys.Space && !auto) shoot();
  if (S.state === 'down') {
    S.t += dt; over += dt;
    if (over > 2.6) { S.hp = 5; S.state = 'idle'; S.x = 110; zombies = []; score = 0; over = 0; spawnT = 1.2; }
  } else if (S.state === 'attack') {
    S.t += dt;
    if (!S.fired && S.t > 0.16) { S.fired = true; fireNow(); }
    if (S.t > 0.42) S.state = move ? 'walk' : 'idle';
  } else if (S.state === 'hit') {
    S.t += dt; if (S.t > 0.22) S.state = 'idle';
  } else {
    S.state = move ? 'walk' : 'idle';
    S.x += move * 150 * dt;
    S.x = Math.max(8, Math.min(330, S.x));
    S.t += dt;
  }
  // --- zombies ---
  spawnT -= dt;
  if (spawnT <= 0 && zombies.filter(z => z.state !== 'down').length < 5 && S.state !== 'down') { spawnZombie(); spawnT = 1.6; }
  for (const z of zombies) {
    z.t += dt;
    if (z.state === 'walk') {
      z.x -= ZSPEED[z.v] * dt;
      if (z.x - S.x < 148 && S.state !== 'down') { z.state = 'attack'; z.atkT = 0; }
    } else if (z.state === 'attack') {
      z.atkT += dt;
      if (z.atkT > 0.85) {
        z.atkT = 0;
        if (S.state !== 'down' && S.hurtT <= 0) {
          S.hp--; S.hurtT = 0.5;
          if (S.hp <= 0) { S.state = 'down'; S.t = 0; over = 0; } else { S.state = 'hit'; S.t = 0; }
        }
      }
      if (z.x - S.x > 170) z.state = 'walk';
    } else if (z.state === 'hit') {
      if (z.t > 0.26) z.state = 'walk';
    } else if (z.state === 'down') {
      if (z.t > 0.9) z.fade = Math.max(0, 1 - (z.t - 0.9) / 0.5);
    }
  }
  zombies = zombies.filter(z => z.fade > 0 && z.x > -180);
  for (const f of fxs) f.t += dt;
  fxs = fxs.filter(f => f.t * FXDEF[f.kind].fps < FXDEF[f.kind].n);
  draw(auto);
  window.__dbg = () => ({ zombies: zombies.length, zx: zombies.map(z => Math.round(z.x)), fx: fxs.length, sstate: S.state, score });
requestAnimationFrame(tick);
}

function animFrame(frames, fps, loop) {
  const i = Math.floor(S.t * fps);
  return frames[loop ? i % frames.length : Math.min(i, frames.length - 1)];
}
function drawChar(img, x, baseline, sc) {
  cx.drawImage(img, Math.round(x), Math.round(baseline - img.height * sc), img.width * sc, img.height * sc);
}
function draw(auto) {
  cx.fillStyle = '#14161f'; cx.fillRect(0, 0, 768, 448);
  cx.fillStyle = '#1d212e';
  for (let i = 0; i < 5; i++) cx.fillRect(30 + i * 150, 60, 100, 250);
  cx.strokeStyle = '#2c3244'; for (let i = 0; i < 5; i++) cx.strokeRect(44 + i * 150, 84, 72, 52);
  cx.fillStyle = '#262a38'; cx.fillRect(0, 196, 768, 6);
  cx.fillStyle = '#1a171d'; cx.fillRect(0, FLOOR, 768, 48);
  cx.fillStyle = '#3d3a35'; cx.fillRect(0, FLOOR - 3, 768, 3);
  // zombies (behind soldier pass is fine: draw far-to-near)
  for (const z of zombies) {
    cx.globalAlpha = z.fade;
    let fr;
    const set = 'z' + z.v + '_';
    if (z.state === 'walk') fr = FR[set + 'walk'][Math.floor(z.t * 9) % 8];
    else if (z.state === 'attack') fr = FR[set + 'attack'][Math.floor(z.t * 7) % 5];
    else if (z.state === 'hit') fr = FR[set + 'hit'][z.t > 0.12 ? 1 : 0];
    else fr = FR[set + 'down'][Math.min(3, Math.floor(z.t * 5))];
    cx.fillStyle = 'rgba(0,0,0,.45)';
    cx.beginPath(); cx.ellipse(z.x + 62, FLOOR + 4, 52, 7, 0, 0, 7); cx.fill();
    drawChar(fr, z.x, FLOOR, SC);
    cx.globalAlpha = 1;
  }
  // soldier
  let sf;
  if (S.state === 'idle') sf = FR.s_idle[Math.floor(time * 5) % 4];
  else if (S.state === 'walk') sf = FR.s_walk[Math.floor(S.t * 10) % 8];
  else if (S.state === 'attack') sf = FR.s_attack[Math.min(4, Math.floor(S.t * 12))];
  else if (S.state === 'hit') sf = FR.s_hit[S.t > 0.1 ? 1 : 0];
  else sf = FR.s_down[Math.min(3, Math.floor(S.t * 4))];
  cx.fillStyle = 'rgba(0,0,0,.45)';
  cx.beginPath(); cx.ellipse(S.x + 78, FLOOR + 4, 62, 7, 0, 0, 7); cx.fill();
  drawChar(sf, S.x, FLOOR, SC);
  if (S.state === 'attack' && S.t > 0.16 && S.t < 0.3) {  // tracer
    cx.strokeStyle = 'rgba(255,220,120,.85)'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(S.x + 158, 292); cx.lineTo(S.x + 330, 292); cx.stroke();
  }
  // FX (PixelFX sheets, grid-sliced by their meta)
  for (const f of fxs) {
    const D = FXDEF[f.kind], i = Math.floor(f.t * D.fps);
    if (i >= D.n || !D.img.complete) continue;
    const sx = (i % D.cols) * D.fw, sy = Math.floor(i / D.cols) * D.fh;
    cx.drawImage(D.img, sx, sy, D.fw, D.fh, Math.round(f.x - D.px), Math.round(f.y - D.py), D.fw, D.fh);
  }
  // HUD
  cx.fillStyle = '#e8d9a0'; cx.font = 'bold 17px monospace'; cx.textAlign = 'left';
  cx.fillText('SCORE ' + score, 14, 26);
  for (let i = 0; i < 5; i++) { cx.fillStyle = i < S.hp ? '#d94f4f' : '#3a3f4a'; cx.fillRect(650 + i * 22, 12, 17, 14); }
  if (auto) { cx.fillStyle = '#8b93a0'; cx.fillText('AUTO-DEMO', 14, 48); }
  if (S.state === 'down') {
    cx.fillStyle = 'rgba(10,8,12,.55)'; cx.fillRect(0, 0, 768, 448);
    cx.fillStyle = '#e8d9a0'; cx.font = 'bold 30px monospace'; cx.textAlign = 'center';
    cx.fillText('OVERRUN — RESETTING', 384, 210);
  }
}
requestAnimationFrame(tick);
</script>
<style>
  #touch { display:none; }
  @media (pointer: coarse) {
    #touch { display:block; position:fixed; inset:auto 0 0 0; height:120px; pointer-events:none; }
    #touch button { pointer-events:auto; position:absolute; bottom:18px; width:76px; height:76px; border-radius:50%;
      background:rgba(40,44,58,.65); color:#e8d9a0; border:2px solid rgba(232,217,160,.5); font-size:26px; font-family:monospace; }
    #tL { left:16px; } #tR { left:108px; }
    #tF { right:16px; width:92px; height:92px; font-size:19px; }
  }
</style>
<div id="touch"><button id="tL">&#9664;</button><button id="tR">&#9654;</button><button id="tF">FIRE</button></div>
<script>
  function bindBtn(id, code) {
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); keys[code] = true; lastInput = performance.now(); };
    const off = e => { e.preventDefault(); keys[code] = false; lastInput = performance.now(); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  }
  bindBtn('tL', 'ArrowLeft'); bindBtn('tR', 'ArrowRight'); bindBtn('tF', 'Space');
</script>
</body></html>
