<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Grande Jatte — a living painting</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #20261c;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }
  #chip {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: rgba(24, 26, 18, 0.72); color: #f3ecd9;
    font: 15px/1.35 Georgia, 'Times New Roman', serif; letter-spacing: 0.02em;
    padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(243,236,217,0.35);
    pointer-events: none; white-space: nowrap;
    opacity: 1; transition: opacity 1.4s ease;
  }
  #chip.gone { opacity: 0; }
  #err {
    position: fixed; inset: 0; display: none; place-items: center; color: #f3ecd9;
    font: 16px Georgia, serif; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="chip">La Grande Jatte &mdash; drag to sail the white boat</div>
<div id="err"><div>The painting could not be loaded.</div></div>
<script>
(function () {
  'use strict';
  // ---- gesture / zoom guards -------------------------------------------------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var chip = document.getElementById('chip');

  var IW = 0, IH = 0;              // painting pixel size (1920x1278)
  var plate = null;                // clean plate (movers removed)
  var patches = {};                // name -> {img, imgF, w, h}
  var frames = 0;
  var view = { scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };

  // ---- mover definitions: rects as fractions of image W/H, measured off the painting
  // fillFrom: where the clean-plate clone for this mover's origin is sampled from
  var DEFS = {
    hero:     { fx: 0.068, fy: 0.163, fw: 0.056, fh: 0.100, kind: 'boat',  fillFrom: 'right' },
    tug:      { fx: 0.350, fy: 0.148, fw: 0.070, fh: 0.086, kind: 'boat',  flip: true, fillFrom: 'left' },
    yellow:   { fx: 0.006, fy: 0.230, fw: 0.084, fh: 0.062, kind: 'boat',  flip: true, fillFrom: 'below' },
    girl:     { fx: 0.693, fy: 0.273, fw: 0.071, fh: 0.114, kind: 'land',  flip: true, fillFrom: 'below' },
    blackdog: { fx: 0.383, fy: 0.653, fw: 0.134, fh: 0.204, kind: 'land',  fillFrom: 'right' },
    browndog: { fx: 0.593, fy: 0.823, fw: 0.144, fh: 0.147, kind: 'land',  flip: true, fillFrom: 'left' }
  };

  function mkCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // feathered elliptical alpha mask applied to a same-size canvas
  function featherEllipse(c, cx, cy, rx, ry, inner) {
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(inner, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();
    g.translate(cx, cy); g.scale(rx, ry);
    g.globalCompositeOperation = 'destination-in';
    g.fillStyle = grad;
    g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function cutPatch(img, r) {
    var w = Math.round(r.fw * IW), h = Math.round(r.fh * IH);
    var sx = Math.round(r.fx * IW), sy = Math.round(r.fy * IH);
    var c = mkCanvas(w, h), g = c.getContext('2d');
    g.drawImage(img, sx, sy, w, h, 0, 0, w, h);
    featherEllipse(c, w / 2, h / 2, w / 2, h / 2, 0.72);
    var out = { img: c, w: w, h: h, ox: sx, oy: sy };
    if (r.flip) {
      var f = mkCanvas(w, h), fg = f.getContext('2d');
      fg.translate(w, 0); fg.scale(-1, 1); fg.drawImage(c, 0, 0);
      out.imgF = f;
    }
    return out;
  }

  // Fill a mover's origin on the plate. Primary pass: a full-size clone of the
  // neighbouring painted texture (pointillist fields clone almost invisibly),
  // feathered in. Secondary: a faint clone from below/above for variety, and a
  // whisper of horizontal smear to knit the horizontal bands (wall, shoreline).
  function clonePass(g, img, sx, sy, x, y, w, h, alpha) {
    if (sx < 0 || sy < 0 || sx + w > IW || sy + h > IH) return;
    var tmp = mkCanvas(w, h), tg = tmp.getContext('2d');
    tg.drawImage(img, sx, sy, w, h, 0, 0, w, h);
    featherEllipse(tmp, w / 2, h / 2, w / 2 + 3, h / 2 + 3, 0.5);
    g.globalAlpha = alpha; g.drawImage(tmp, x, y); g.globalAlpha = 1;
  }
  function fillHole(g, img, r) {
    var x = Math.round(r.fx * IW), y = Math.round(r.fy * IH);
    var w = Math.round(r.fw * IW), h = Math.round(r.fh * IH);
    var gap = 8;
    g.save();
    g.beginPath(); g.rect(x - 2, y - 2, w + 4, h + 4); g.clip();

    if (r.fillFrom === 'right') clonePass(g, img, x + w + gap, y, x, y, w, h, 0.92);
    else if (r.fillFrom === 'left') clonePass(g, img, x - w - gap, y, x, y, w, h, 0.92);
    else if (r.fillFrom === 'below') clonePass(g, img, x, y + h + gap, x, y, w, h, 0.92);
    // secondary texture pass from the vertical neighbour
    if (y + h + gap + h <= IH) clonePass(g, img, x, y + h + gap, x, y, w, h, 0.28);
    else if (y - h - gap >= 0) clonePass(g, img, x, y - h - gap, x, y, w, h, 0.28);

    // faint horizontal smear to knit bands
    var strip = Math.max(6, Math.round(w * 0.06));
    var left = mkCanvas(w, h), lg = left.getContext('2d');
    lg.drawImage(img, Math.max(0, x - strip), y, strip, h, 0, 0, w, h);
    var lgrad = lg.createLinearGradient(0, 0, w, 0);
    lgrad.addColorStop(0, 'rgba(0,0,0,1)'); lgrad.addColorStop(1, 'rgba(0,0,0,0)');
    lg.globalCompositeOperation = 'destination-in'; lg.fillStyle = lgrad; lg.fillRect(0, 0, w, h);
    var right = mkCanvas(w, h), rg = right.getContext('2d');
    rg.drawImage(img, Math.min(IW - strip, x + w), y, strip, h, 0, 0, w, h);
    var rgrad = rg.createLinearGradient(0, 0, w, 0);
    rgrad.addColorStop(0, 'rgba(0,0,0,0)'); rgrad.addColorStop(1, 'rgba(0,0,0,1)');
    rg.globalCompositeOperation = 'destination-in'; rg.fillStyle = rgrad; rg.fillRect(0, 0, w, h);
    g.globalAlpha = 0.25; g.drawImage(left, x, y); g.drawImage(right, x, y); g.globalAlpha = 1;
    g.restore();
  }

  function buildAssets(img) {
    IW = img.naturalWidth; IH = img.naturalHeight;
    plate = mkCanvas(IW, IH);
    var g = plate.getContext('2d');
    g.drawImage(img, 0, 0);
    Object.keys(DEFS).forEach(function (name) {
      patches[name] = cutPatch(img, DEFS[name]);
    });
    // fill holes smallest-first so overlapping fills disturb each other least
    Object.keys(DEFS).sort(function (a, b) {
      return (DEFS[a].fw * DEFS[a].fh) - (DEFS[b].fw * DEFS[b].fh);
    }).forEach(function (name) { fillHole(g, img, DEFS[name]); });
  }

  // ---- animation state -------------------------------------------------------
  var hero = { cx: 0.096 * 1, target: null, lastTouch: -1e9 }; // cx set after load (frac)
  var state = {};
  function initState() {
    hero.cx = 0.096; hero.target = null; hero.lastTouch = -1e9;
    state = {
      tug:      { cx: 0.385, dir: 1 },
      yellow:   { cx: 0.048, dir: 1 },
      girl:     { hx: (DEFS.girl.fx + DEFS.girl.fw / 2), hy: (DEFS.girl.fy + DEFS.girl.fh / 2), dir: 1 },
      browndog: { hx: (DEFS.browndog.fx + DEFS.browndog.fw / 2), dir: 1 },
      blackdog: { hx: (DEFS.blackdog.fx + DEFS.blackdog.fw / 2), hy: (DEFS.blackdog.fy + DEFS.blackdog.fh / 2) }
    };
  }

  function computeView() {
    var cw = window.innerWidth, ch = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    var scale = Math.max(cw / IW, ch / IH);
    // cover-fit; on portrait phones anchor the window toward the river (left)
    // so the sailboat — the thing you steer — is actually in frame.
    var focusX = (cw / ch < 1) ? 0.27 : 0.5;
    var ox = focusX * IW * scale * -1 + cw / 2;
    ox = Math.min(0, Math.max(cw - IW * scale, ox));
    var oy = (ch - IH * scale) / 2;
    view = { scale: scale, ox: ox, oy: oy, dpr: dpr, cw: cw, ch: ch };
  }

  function drawPatch(p, cxPx, cyPx, flip) {
    var im = (flip && p.imgF) ? p.imgF : p.img;
    ctx.drawImage(im, cxPx - p.w / 2, cyPx - p.h / 2, p.w, p.h);
  }

  function shadow(cxPx, baseYPx, wPx, alpha, light) {
    var g = ctx.createRadialGradient(cxPx, baseYPx, 0, cxPx, baseYPx, wPx / 2);
    var col = light ? '255,255,250' : '18,26,12';
    g.addColorStop(0, 'rgba(' + col + ',' + alpha + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.save();
    ctx.translate(cxPx, baseYPx); ctx.scale(1, 0.16); ctx.translate(-cxPx, -baseYPx);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cxPx, baseYPx, wPx / 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    var t = now / 1000;
    frames++;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = '#20261c'; ctx.fillRect(0, 0, view.cw, view.ch);
    ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale,
                     view.dpr * view.ox, view.dpr * view.oy);
    ctx.drawImage(plate, 0, 0);

    // --- tug: slow crossing, small range, far bank
    var tugP = patches.tug, tugS = state.tug;
    var tugCxF = 0.385 + Math.sin(t * 0.11) * 0.034;
    tugS.dir = (Math.cos(t * 0.11) >= 0) ? 1 : -1;
    var tugCx = tugCxF * IW, tugCy = (DEFS.tug.fy + DEFS.tug.fh / 2) * IH + Math.sin(t * 0.8) * 1.5;
    drawPatch(tugP, tugCx, tugCy, tugS.dir < 0);

    // --- hero sailboat: auto-glides the river; drag to sail her yourself
    var heroP = patches.hero;
    var autoCx = 0.225 + Math.sin(t * 0.055) * 0.145;
    var idle = (now - hero.lastTouch) > 6000;
    var desired = idle ? autoCx : (hero.target != null ? hero.target : hero.cx);
    hero.cx += (desired - hero.cx) * (idle ? 0.012 : 0.07);
    var heroCx = hero.cx * IW;
    var heroCy = (DEFS.hero.fy + DEFS.hero.fh / 2) * IH + Math.sin(t * 0.9) * 2.5;
    shadow(heroCx, (DEFS.hero.fy + DEFS.hero.fh) * IH + 4, heroP.w * 1.15, 0.10, true);
    drawPatch(heroP, heroCx, heroCy, false);

    // --- little yellow-sailed boat, far left: short lazy drift
    var yelP = patches.yellow, yelS = state.yellow;
    var yelCxF = 0.048 + Math.sin(t * 0.16 + 2.0) * 0.020;
    yelS.dir = (Math.cos(t * 0.16 + 2.0) >= 0) ? 1 : -1;
    var yelCx = yelCxF * IW, yelCy = (DEFS.yellow.fy + DEFS.yellow.fh / 2) * IH + Math.sin(t * 1.1 + 1) * 1.5;
    drawPatch(yelP, yelCx, yelCy, yelS.dir < 0);

    // --- the girl in the orange dress runs her little loop on the grass
    var girlP = patches.girl, girlS = state.girl;
    var ph = t * (Math.PI * 2 / 8);
    var girlCx = (girlS.hx + Math.cos(ph) * 0.030) * IW;
    var girlCy = (girlS.hy + Math.sin(ph) * 0.012) * IH - Math.abs(Math.sin(t * 5.2)) * 3;
    girlS.dir = (-Math.sin(ph) >= 0) ? 1 : -1;
    shadow(girlCx, (girlS.hy + DEFS.girl.fh / 2) * IH + 3, girlP.w * 0.55, 0.20, false);
    drawPatch(girlP, girlCx, girlCy, girlS.dir < 0);

    // --- black dog: barely wanders, sniffs — a few painted inches at a time
    var bdP = patches.blackdog, bdS = state.blackdog;
    var bdCx = (bdS.hx + Math.sin(t * 0.10) * 0.0075) * IW;
    var bdCy = (bdS.hy + Math.sin(t * 0.073 + 1.3) * 0.006) * IH + Math.pow(Math.max(0, Math.sin(t * 0.45)), 6) * 3;
    drawPatch(bdP, bdCx, bdCy, false);

    // --- little brown dog: trots back and forth by the monkey, tail-wag bob
    var brP = patches.browndog, brS = state.browndog;
    var brOff = Math.sin(t * (Math.PI * 2 / 6.5)) * 0.036;
    brS.dir = (Math.cos(t * (Math.PI * 2 / 6.5)) >= 0) ? 1 : -1;
    var brCx = (brS.hx + brOff) * IW;
    var brCy = (DEFS.browndog.fy + DEFS.browndog.fh / 2) * IH - Math.abs(Math.sin(t * 7.0)) * 4;
    shadow(brCx, (DEFS.browndog.fy + DEFS.browndog.fh) * IH + 2, brP.w * 0.6, 0.18, false);
    drawPatch(brP, brCx, brCy, brS.dir > 0); // painted facing left; flip when trotting right

    window.__dbg.frames = frames;
    window.__dbg.heroCx = Math.round(hero.cx * 1000) / 1000;
    requestAnimationFrame(frame);
  }

  // ---- steering: horizontal drag anywhere sails the white boat --------------
  var dragging = false, lastPX = 0;
  function ptrX(e) { return e.clientX; }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastPX = ptrX(e);
    hero.lastTouch = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    chip.classList.add('gone');
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dxImg = (ptrX(e) - lastPX) / view.scale; // screen px -> image px
    lastPX = ptrX(e);
    var base = (hero.target != null ? hero.target : hero.cx);
    hero.target = Math.min(0.40, Math.max(0.055, base + dxImg / IW));
    hero.lastTouch = performance.now();
  });
  function endDrag() { dragging = false; hero.lastTouch = performance.now(); }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- boot -------------------------------------------------------------------
  window.__dbg = { frames: 0, heroCx: 0, loaded: false };
  var img = new Image();
  img.onload = function () {
    buildAssets(img);
    initState();
    computeView();
    window.addEventListener('resize', computeView);
    window.__dbg.loaded = true;
    setTimeout(function () { chip.classList.add('gone'); }, 5000);
    requestAnimationFrame(frame);
  };
  img.onerror = function () { document.getElementById('err').style.display = 'grid'; };
  img.src = 'painting.jpg';
})();
</script>
</body>
</html>
