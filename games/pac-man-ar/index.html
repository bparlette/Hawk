<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PAC-MAN AR — the arcade maze in your room</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#05060f; }
  body { font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; color:#eef;
         -webkit-user-select:none; user-select:none; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
         background:radial-gradient(120% 90% at 50% 20%, #131a3a 0%, #05060f 70%); }
  #camlabel { position:fixed; top:calc(6px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:5; background:rgba(10,10,30,.72); color:#ffd76a; border:1px solid #ffd76a55;
    font-size:11px; letter-spacing:.14em; padding:4px 10px; border-radius:999px; display:none;
    pointer-events:none; white-space:nowrap; }
  #ui { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
        padding-top:env(safe-area-inset-top); }
  #hud { display:flex; justify-content:space-between; align-items:flex-end;
         padding:8px 14px 4px; text-shadow:0 2px 8px #000, 0 0 2px #000; pointer-events:none; }
  #hud .lab { font-size:10px; letter-spacing:.22em; color:#9fd8ff; }
  #hud .val { font-size:22px; font-weight:800; line-height:1; color:#fff; }
  #hud .mid { text-align:center; } #hud .rgt { text-align:right; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative;
           min-height:0; }
  canvas#game { height:100%; max-width:100vw; aspect-ratio:672/744; display:block;
           filter:drop-shadow(0 10px 28px rgba(0,0,0,.55)); touch-action:none; }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:flex-start; padding-top:6%; pointer-events:none; text-align:center; }
  #title h1 { font-size:44px; font-weight:900; letter-spacing:.06em; color:#ffe600;
           text-shadow:0 0 18px #ffb30088, 0 3px 0 #b97e00, 0 6px 22px #000; }
  #title p { margin-top:6px; font-size:13px; letter-spacing:.18em; color:#cfe6ff;
           text-shadow:0 2px 8px #000; }
  #title .ghosts { margin-top:8px; font-size:12px; line-height:1.9; letter-spacing:.12em;
           color:#fff; text-shadow:0 2px 6px #000; }
  #bottom { padding:6px 10px calc(10px + env(safe-area-inset-bottom)); display:flex;
            align-items:center; gap:6px; }
  #lives { display:flex; gap:5px; flex:1; align-items:center; min-height:22px; }
  .life { width:18px; height:18px; border-radius:50%;
          background:conic-gradient(from -30deg, transparent 0deg 70deg, #ffe600 70deg 360deg); }
  #fruitlab { font-size:10px; letter-spacing:.1em; color:#ffb8ae; text-shadow:0 1px 6px #000;
              min-width:58px; text-align:right; }
  button { z-index:1200; position:relative; font-family:inherit; font-weight:800; letter-spacing:.1em;
           border:2px solid #ffe600; background:rgba(20,20,50,.82); color:#ffe600;
           border-radius:12px; padding:10px 11px; font-size:14px; cursor:pointer;
           box-shadow:0 4px 16px rgba(0,0,0,.5); }
  button:active { transform:scale(.96); background:rgba(60,50,0,.9); }
  #btnCam { border-color:#7fd4ff; color:#7fd4ff; padding:11px 12px; }
  .sbtn { border-color:#7fd4ff; color:#7fd4ff; padding:10px 8px; font-size:11px; white-space:nowrap; }
  #joy { position:fixed; width:110px; height:110px; border-radius:50%; z-index:1100;
         border:2px solid rgba(255,255,255,.45); background:rgba(255,255,255,.08);
         display:none; pointer-events:none; transform:translate(-50%,-50%); }
  #joyknob { position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%;
         background:rgba(255,230,0,.85); transform:translate(-50%,-50%);
         box-shadow:0 2px 10px rgba(0,0,0,.5); }
</style>
<style id="moth-game-guard">
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="camlabel">&#128247; CAMERA OFF &mdash; DARK BACKDROP (NOT YOUR ROOM)</div>

<div id="ui">
  <div id="hud">
    <div><div class="lab">SCORE</div><div class="val" id="score">0</div></div>
    <div class="mid"><div class="lab">HI-SCORE</div><div class="val" id="high">0</div></div>
    <div class="rgt"><div class="lab">LEVEL</div><div class="val" id="level">1</div></div>
  </div>
  <div id="stage">
    <canvas id="game" width="672" height="744"></canvas>
    <div id="title">
      <h1>PAC-MAN AR</h1>
      <p>THE ARCADE MAZE, IN YOUR ROOM</p>
      <div class="ghosts">
        <span style="color:#ff5b5b">&#9679; BLINKY</span>
        <span style="color:#ffb8de">&#9679; PINKY</span>
        <span style="color:#00e8ff">&#9679; INKY</span>
        <span style="color:#ffb847">&#9679; CLYDE</span>
      </div>
    </div>
  </div>
  <div id="bottom">
    <div id="lives"></div>
    <div id="fruitlab"></div>
    <button id="btnCam" title="Retry camera">&#128247;</button>
    <button id="btnView" class="sbtn" title="Toggle 3D floor / flat view">VIEW: 3D</button>
    <button id="btnTilt" class="sbtn" title="Enable gyro tilt parallax">TILT</button>
    <button id="btnMain">&#9654; START</button>
  </div>
</div>
<div id="joy"><div id="joyknob"></div></div>

<script src="pacman-core.js"></script>
<script>
(function () {
'use strict';
var C = window.PacCore;
var T = 24;                       /* tile px on the backing canvas */
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');

/* ---------------- audio (all synthesized, no files) ---------------- */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
var Snd = {
  ctx: null, wakaAlt: false, siren: null,
  init: function () {
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
  },
  resume: function () {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone: function (f0, f1, dur, type, vol, delay) {
    if (!this.ctx) return;
    var t = this.ctx.currentTime + (delay || 0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  waka: function () {
    this.wakaAlt = !this.wakaAlt;
    if (this.wakaAlt) this.tone(560, 280, 0.075, 'triangle', 0.055);
    else this.tone(280, 560, 0.075, 'triangle', 0.055);
  },
  power: function () { this.tone(140, 700, 0.28, 'sawtooth', 0.05); },
  ghostEaten: function () { this.tone(160, 980, 0.38, 'sawtooth', 0.06); },
  fruit: function () { this.tone(880, 880, 0.07, 'sine', 0.07); this.tone(1318, 1318, 0.12, 'sine', 0.07, 0.08); },
  extra: function () {
    var n = [659, 880, 988, 1318], i;
    for (i = 0; i < n.length; i++) this.tone(n[i], n[i], 0.11, 'square', 0.045, i * 0.1);
  },
  intro: function () {
    var n = [494, 988, 740, 622, 988, 740, 1318, 1046, 831, 659, 1318, 1568], i;
    for (i = 0; i < n.length; i++) this.tone(n[i], n[i], 0.09, 'square', 0.035, i * 0.085);
  },
  death: function () {
    this.tone(640, 42, 1.15, 'sawtooth', 0.055);
    this.tone(1200, 1200, 0.07, 'square', 0.05, 1.25);
    this.tone(1200, 1200, 0.07, 'square', 0.05, 1.38);
  },
  startSiren: function () {
    if (!this.ctx || this.siren) return;
    var o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator(),
        lg = this.ctx.createGain(), g = this.ctx.createGain();
    o.type = 'triangle'; o.frequency.value = 330;
    lfo.type = 'sine'; lfo.frequency.value = 0.55; lg.gain.value = 65;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.value = 0.028;
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); lfo.start();
    this.siren = { o: o, lfo: lfo, g: g };
  },
  setSirenFright: function (on) {
    if (!this.siren) return;
    var t = this.ctx.currentTime;
    this.siren.o.frequency.setTargetAtTime(on ? 205 : 330, t, 0.05);
    this.siren.lfo.frequency.setTargetAtTime(on ? 2.4 : 0.55, t, 0.05);
  },
  stopSiren: function () {
    if (!this.siren) return;
    try { this.siren.o.stop(); this.siren.lfo.stop(); } catch (e) {}
    this.siren = null;
  }
};

/* ---------------- camera passthrough ---------------- */
var video = document.getElementById('cam');
var camLabel = document.getElementById('camlabel');
var camOn = false;
function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camLabel.style.display = 'block'; return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(function (stream) {
      video.srcObject = stream; camOn = true;
      camLabel.style.display = 'none';
    })
    .catch(function () { camOn = false; camLabel.style.display = 'block'; });
}
startCamera();
document.getElementById('btnCam').addEventListener('click', function () { startCamera(); });

/* ---------------- game state ---------------- */
var HIGH_KEY = 'pacman-ar-high';
var G = {
  state: 'title', stateT: 0, prevState: '',
  score: 0, high: parseInt(localStorage.getItem(HIGH_KEY) || '0', 10) || 0,
  lives: 3, level: 1, extraGiven: false,
  pellets: null, pelletsEaten: 0, pelletsLeft: 0,
  modeTime: 0, mode: 'scatter', frightT: 0, chain: 0,
  fruitT: 0, fruitSpawned: 0, popups: [], deathT: 0, flashT: 0,
  deaths: 0
};
var FRUIT_POS = { x: 14.0, y: 17.5 };

var pac = null, ghosts = [];
var GHOST_DEFS = [
  { name: 'blinky', color: '#ff2b2b' },
  { name: 'pinky',  color: '#ffb8de' },
  { name: 'inky',   color: '#00e8ff' },
  { name: 'clyde',  color: '#ffb847' }
];

function levelParams(level) {
  /* fractions of the original 10 tiles/sec full speed */
  var i = Math.min(level - 1, 4);
  var pacF  = [0.80, 0.90, 0.90, 0.95, 1.00][i];
  var ghF   = [0.75, 0.85, 0.85, 0.90, 0.95][i];
  var frF   = [0.50, 0.55, 0.60, 0.65, 0.70][i];
  return {
    pac: pacF * 10, pacFright: Math.min(1, pacF + 0.07) * 10,
    ghost: ghF * 10, fright: frF * 10, tunnel: 4.5 + i * 0.4,
    eyes: 15, fright: C.frightDuration(level)
  };
}
function elroyLevel() {
  if (G.pelletsLeft <= 10) return 2;
  if (G.pelletsLeft <= 20) return 1;
  return 0;
}

function resetActors() {
  pac = { x: 14.0, y: 23.5, dir: 'left', wantDir: 'left', moving: false, phase: 0 };
  ghosts = GHOST_DEFS.map(function (d, i) {
    var g = { name: d.name, color: d.color, dir: 'left', moving: true, phase: i * 1.3,
              state: 'house', releaseT: 0, x: 14.0, y: 14.5, bobOff: i * 2.1, wp: 0 };
    if (d.name === 'blinky') { g.state = 'active'; g.x = 14.0; g.y = 11.5; g.dir = 'left'; }
    if (d.name === 'pinky')  { g.x = 14.0; g.y = 14.5; g.releaseT = 0.2; }
    if (d.name === 'inky')   { g.x = 12.0; g.y = 14.5; g.releaseT = G.deaths ? 1.5 : 3.0; }
    if (d.name === 'clyde')  { g.x = 16.0; g.y = 14.5; g.releaseT = G.deaths ? 4.0 : 8.0; }
    return g;
  });
  G.modeTime = 0; G.mode = 'scatter'; G.frightT = 0; G.chain = 0; G.fruitT = 0;
}
function resetLevel() {
  var p = C.parsePellets();
  G.pellets = p; G.pelletsLeft = p.total; G.pelletsEaten = 0; G.fruitSpawned = 0;
  resetActors();
}
function startGame() {
  G.score = 0; G.lives = 3; G.level = 1; G.extraGiven = false; G.deaths = 0;
  resetLevel();
  G.state = 'ready'; G.stateT = 1.7;
  document.getElementById('title').style.display = 'none';
  Snd.resume(); Snd.intro();
  updateHud();
}
function saveHigh() {
  if (G.score > G.high) { G.high = G.score; localStorage.setItem(HIGH_KEY, String(G.high)); }
}

/* ---------------- movement ---------------- */
function canGoPac(tx, ty, dir) {
  var d = C.DIRS[dir], nx = tx + d.x, ny = ty + d.y;
  if (ny === 14 && (nx < 0 || nx >= C.COLS)) return true; /* tunnel mouth */
  return !C.isWall(nx, ny) && !C.isDoor(nx, ny) && !C.isHouse(nx, ny);
}
function canGoGhost(tx, ty, dir, eyes) {
  var d = C.DIRS[dir], nx = tx + d.x, ny = ty + d.y;
  if (ny === 14 && (nx < 0 || nx >= C.COLS)) return true;
  if (C.isWall(nx, ny)) return false;
  if (C.isDoor(nx, ny) || C.isHouse(nx, ny)) return !!eyes;
  return true;
}
function reverseOf(dir) {
  return dir === 'up' ? 'down' : dir === 'down' ? 'up' : dir === 'left' ? 'right' : 'left';
}
/* Move an entity in tile units; fire decide() each time it crosses a
   tile centre (entity snaps to the centre, may turn or stop there). */
function stepEntity(e, dt, speed, decide) {
  if (!e.moving) return;
  var distLeft = speed * dt, guard = 0;
  while (distLeft > 1e-9 && guard++ < 12) {
    var d = C.DIRS[e.dir], nc, dist;
    /* next tile centre strictly ahead in the movement direction */
    if (d.x > 0)      { nc = Math.floor(e.x + 0.5) + 0.5; dist = nc - e.x; }
    else if (d.x < 0) { nc = Math.ceil(e.x - 0.5) - 0.5;  dist = e.x - nc; }
    else if (d.y > 0) { nc = Math.floor(e.y + 0.5) + 0.5; dist = nc - e.y; }
    else              { nc = Math.ceil(e.y - 0.5) - 0.5;  dist = e.y - nc; }
    if (dist <= 1e-9) { decide(e); if (!e.moving) break; continue; }
    var step = Math.min(distLeft, dist);
    e.x += d.x * step; e.y += d.y * step;
    distLeft -= step;
    if (e.x < -0.5) e.x += 29; else if (e.x > 28.5) e.x -= 29;
    if (step >= dist - 1e-9) {          /* arrived at the centre */
      if (d.x !== 0) e.x = nc; else e.y = nc;
      decide(e);
      if (!e.moving) break;
    }
  }
}
function pacDecide(e) {
  var tx = Math.floor(e.x), ty = Math.floor(e.y);
  if (e.wantDir && canGoPac(tx, ty, e.wantDir)) e.dir = e.wantDir;
  e.moving = canGoPac(tx, ty, e.dir);
}
function ghostTarget(g) {
  var pacTile = { tx: Math.floor(pac.x), ty: Math.floor(pac.y), dir: pac.dir };
  if (g.state === 'eyes') return { x: 13, y: 11 };
  if (G.mode === 'scatter') {
    if (g.name === 'blinky' && elroyLevel() > 0) return pacTile; /* Cruise Elroy hunts */
    return C.SCATTER[g.name];
  }
  var blinky = ghosts[0];
  return C.chaseTarget(g.name, pacTile,
    { tx: Math.floor(g.x), ty: Math.floor(g.y) },
    { tx: Math.floor(blinky.x), ty: Math.floor(blinky.y) });
}
function ghostDecide(g) {
  var tx = Math.floor(g.x), ty = Math.floor(g.y);
  var eyes = g.state === 'eyes';
  var fright = !eyes && G.frightT > 0;
  var rev = reverseOf(g.dir);
  var opts = C.DIR_ORDER.filter(function (d) {
    return d !== rev && canGoGhost(tx, ty, d, eyes);
  });
  if (!fright && !eyes && C.NO_UP[tx + ',' + ty]) {
    var noUp = opts.filter(function (d) { return d !== 'up'; });
    if (noUp.length) opts = noUp;
  }
  if (!opts.length) { g.dir = rev; return; }
  if (fright) { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
  var target = ghostTarget(g), best = null, bestD = Infinity;
  opts.forEach(function (d) {
    var dd = C.DIRS[d], nx = tx + dd.x - target.x, ny = ty + dd.y - target.y;
    var dist = nx * nx + ny * ny;
    if (dist < bestD) { bestD = dist; best = d; }
  });
  g.dir = best;
}
function reverseGhosts() {
  ghosts.forEach(function (g) { if (g.state === 'active') g.dir = reverseOf(g.dir); });
}
function moveToward(e, wx, wy, speed, dt) {
  var dx = wx - e.x, dy = wy - e.y;
  var dist = Math.sqrt(dx * dx + dy * dy), step = speed * dt;
  if (dist <= step) { e.x = wx; e.y = wy; return true; }
  e.x += dx / dist * step; e.y += dy / dist * step;
  if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? 'right' : 'left';
  else if (dy !== 0) e.dir = dy > 0 ? 'down' : 'up';
  return false;
}

/* ---------------- per-frame update ---------------- */
function eatAtPacTile() {
  var tx = Math.floor(pac.x), ty = Math.floor(pac.y), key = tx + ',' + ty;
  var P = levelParams(G.level);
  if (G.pellets.dots[key]) {
    delete G.pellets.dots[key];
    G.score += C.SCORES.dot; G.pelletsEaten++; G.pelletsLeft--;
    Snd.waka(); onScore();
  } else if (G.pellets.powers[key]) {
    delete G.pellets.powers[key];
    G.score += C.SCORES.power; G.pelletsEaten++; G.pelletsLeft--;
    Snd.power(); onScore();
    if (P.fright > 0) {
      G.frightT = P.fright; G.chain = 0;
      reverseGhosts(); Snd.setSirenFright(true);
    }
  } else { return; }
  if ((G.pelletsEaten === 70 || G.pelletsEaten === 170) && G.fruitT <= 0) {
    G.fruitT = 9.5; G.fruitSpawned++;
  }
  if (G.pelletsLeft <= 0) {
    G.state = 'clear'; G.stateT = 1.8; G.flashT = 0;
    Snd.stopSiren(); saveHigh();
  }
}
function onScore() {
  if (!G.extraGiven && G.score >= 10000) {
    G.extraGiven = true; G.lives++; Snd.extra(); updateHud();
  }
  if (G.score > G.high) G.high = G.score;
  updateHud();
}
function addPopup(x, y, text, color) {
  G.popups.push({ x: x, y: y, text: text, color: color || '#7ff3ff', t: 0.9 });
}

function update(dt) {
  var P = levelParams(G.level);
  /* mode clock (pauses during fright) */
  if (G.frightT > 0) {
    G.frightT -= dt;
    if (G.frightT <= 0) { G.frightT = 0; Snd.setSirenFright(false); }
  } else {
    G.modeTime += dt;
    var m = C.modeAtTime(G.modeTime).mode;
    if (m !== G.mode) { G.mode = m; reverseGhosts(); }
  }
  if (G.fruitT > 0) G.fruitT -= dt;

  /* Pac-Man */
  if (pac.wantDir === reverseOf(pac.dir) && canGoPac(Math.floor(pac.x), Math.floor(pac.y), pac.wantDir)) {
    pac.dir = pac.wantDir; pac.moving = true;      /* instant reverse, like the arcade */
  }
  if (!pac.moving && pac.wantDir && canGoPac(Math.floor(pac.x), Math.floor(pac.y), pac.wantDir)) {
    pac.dir = pac.wantDir; pac.moving = true;
  }
  var pacSpeed = G.frightT > 0 ? P.pacFright : P.pac;
  stepEntity(pac, dt, pacSpeed, pacDecide);
  if (pac.moving) pac.phase += dt * pacSpeed * 2.6;
  eatAtPacTile();
  if (G.state !== 'playing') return;

  /* fruit */
  if (G.fruitT > 0) {
    var fdx = pac.x - FRUIT_POS.x, fdy = pac.y - FRUIT_POS.y;
    if (fdx * fdx + fdy * fdy < 0.3) {
      var fr = C.fruitForLevel(G.level);
      G.score += fr.points; addPopup(FRUIT_POS.x, FRUIT_POS.y, String(fr.points), '#ffb8de');
      G.fruitT = 0; Snd.fruit(); onScore();
    }
  }

  /* ghosts */
  ghosts.forEach(function (g) {
    if (g.state === 'house') {
      g.y = 14.5 + Math.sin(perfNow() * 0.005 + g.bobOff) * 0.16;
      g.releaseT -= dt;
      if (g.releaseT <= 0) { g.state = 'leaving'; g.wp = 0; }
    } else if (g.state === 'leaving') {
      if (g.wp === 0) { if (moveToward(g, 14.0, 14.5, 4.6, dt)) g.wp = 1; }
      else if (moveToward(g, 14.0, 11.5, 4.6, dt)) {
        g.state = 'active'; g.dir = 'left'; g.moving = true;
      }
    } else if (g.state === 'entering') {
      if (moveToward(g, 14.0, 14.5, 6.5, dt)) { g.state = 'house'; g.releaseT = 0.35; }
    } else if (g.state === 'eyes') {
      stepEntity(g, dt, P.eyes, ghostDecide);
      var ty = Math.floor(g.y);
      if (ty === 11 && Math.abs(g.x - 14.0) < 0.55) g.state = 'entering';
    } else { /* active */
      var sp;
      if (G.frightT > 0) sp = P.fright;
      else if (Math.floor(g.y) === 14 && (g.x < 6.5 || g.x > 21.5)) sp = P.tunnel;
      else if (g.name === 'blinky' && elroyLevel() === 2) sp = P.pac * 1.06;
      else if (g.name === 'blinky' && elroyLevel() === 1) sp = P.pac * 1.02;
      else sp = P.ghost;

  ghosts.forEach(function (g) {

    if (!dangerous) return;
    var dx = g.x - pac.x, dy = g.y - pac.y;

/* ---------------- rendering ---------------- */
function buildMaze(flash) {
  var off = document.createElement('canvas');

  g.fillStyle = flash ? 'rgba(40,40,90,0.94)' : 'rgba(7,7,46,0.94)';
  for (y = 0; y < C.ROWS; y++) for (x = 0; x < C.COLS; x++)
    if (C.isWall(x, y)) g.fillRect(x * T, y * T, T, T);
  g.strokeStyle = flash ? '#ffffff' : '#2e3dff';
  g.lineWidth = 3; g.shadowColor = flash ? '#fff' : '#2e3dff'; g.shadowBlur = 7;

  for (y = 0; y < C.ROWS; y++) for (x = 0; x < C.COLS; x++) {
    if (!C.isWall(x, y)) continue;
    for (d = 0; d < 4; d++) {
      var s = segs[d];
      if (!C.isWall(x + s[0], y + s[1])) {

  g.stroke();
  g.shadowBlur = 0;
  g.fillStyle = '#ffb8de';
  g.fillRect(13 * T, 12 * T + T * 0.4, 2 * T, T * 0.2);   /* ghost-house door */

}
var mazeBlue = buildMaze(false), mazeWhite = buildMaze(true);

/* ---------------- 3D floor view (v2) ----------------

   raised board lying on a ground plane: a pinhole camera sits behind
   the near edge, above the plane, looking across it. World coords:
   X = tile x - 14 (board centre 0), Z = tile y (0 = far edge),
   h = height above the board in tile units. Painter's algorithm:
   slab, floor pellets, then rows far -> near (walls, orbs, fruit,
   standing characters), text last. */

var tilt = { listening: false, on: false, tx: 0, ty: 0, x: 0, y: 0 };

  var d = (C.ROWS + CAM.back) - Z;
  var s = CAM.f / d;

}

  ctx.closePath(); ctx.fill();
}
var WALL_ROWS = [];
(function () {
  var x, y;
  for (y = 0; y < C.ROWS; y++) {
    var row = [];
    for (x = 0; x < C.COLS; x++) if (C.isWall(x, y)) row.push(x);
    WALL_ROWS.push(row);
  }
})();

function drawShadow3D(X, Z, rw) {

}

function drawTextScreen(text, x, y, color, size) {

  quadP(proj(-14.7, 31.7, 0), proj(14.7, 31.7, 0), proj(14.7, 31.7, -0.55), proj(-14.7, 31.7, -0.55), southCol);
  quadP(proj(-14.7, -0.7, 0), proj(14.7, -0.7, 0), proj(14.7, 31.7, 0), proj(-14.7, 31.7, 0),
        flash ? '#2a2a66' : 'rgba(5,5,32,0.96)');

  /* floor pellets (flat discs on the board surface) — drawn before
     the walls so nearer wall faces correctly occlude dots behind them */
  var key, parts, tx, ty, p, rx;
  ctx.fillStyle = '#ffcf9e';
  ctx.beginPath();
  for (key in G.pellets.dots) {
    parts = key.split(','); tx = +parts[0]; ty = +parts[1];
    p = proj(tx - 13.5, ty + 0.5, 0);
    rx = 0.13 * p.s;
    ctx.moveTo(p.x + rx, p.y);
    ctx.ellipse(p.x, p.y, rx, Math.max(0.6, rx * squashAt(p.d)), 0, 0, 7);
  }
  ctx.fill();
  /* bucket the power orbs by row so nearer rows draw over farther ones */
  var orbRows = {};
  for (key in G.pellets.powers) {
    parts = key.split(','); ty = +parts[1];
    (orbRows[ty] = orbRows[ty] || []).push(+parts[0]);
  }

  drawWallsCached(flash);

  var dying = G.state === 'dying';
  var hideActors = G.state === 'clear';
  var hideGhosts = hideActors || (dying && G.deathT > 0.6);

  /* rows far -> near: orbs, fruit, standing characters */
  var r;
  for (r = 0; r < C.ROWS; r++) {
    if (orbRows[r]) {
      for (i = 0; i < orbRows[r].length; i++) {
        tx = orbRows[r][i];
        p = proj(tx - 13.5, r + 0.5, 0.38);
        rx = 0.36 * p.s * (0.84 + 0.16 * Math.sin(now * 6));
        ctx.save();
        ctx.shadowColor = '#ffd9c9'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffd9c9';
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.2, rx), 0, 7); ctx.fill();
        ctx.restore();
      }
    }
    if (!hideActors) {
      var actors = [];
      if (!hideGhosts) ghosts.forEach(function (g) { if (Math.floor(g.y) === r) actors.push({ g: g }); });
      if (G.state !== 'gameover' && Math.floor(pac.y) === r) actors.push({ pac: true });
      actors.sort(function (a, b) {
        var ay = a.g ? a.g.y : pac.y, by = b.g ? b.g.y : pac.y;
        return ay - by;
      });
      actors.forEach(function (a) { if (a.g) drawGhost3D(a.g, now); else drawPac3D(now); });
      if (r === 17 && G.fruitT > 0) {
        drawShadow3D(FRUIT_POS.x - 14, FRUIT_POS.y, 0.5);
        var fb = proj(FRUIT_POS.x - 14, FRUIT_POS.y, 0);
        ctx.save();
        ctx.translate(fb.x, fb.y - 0.55 * fb.s);
        ctx.scale(fb.s / T, fb.s / T);
        drawFruitShape(C.fruitForLevel(G.level).name, 0, 0);
        ctx.restore();
      }
    }
  }
  G.popups.forEach(function (pp) {
    var pt = proj(pp.x - 14, pp.y, 0.8 + (0.9 - pp.t) * 0.7);
    ctx.globalAlpha = Math.min(1, pp.t / 0.4);
    drawTextScreen(pp.text, pt.x, pt.y, pp.color, Math.max(9, Math.min(28, 15 * pt.s / T)));
    ctx.globalAlpha = 1;
  });
  var tp = proj(0, 17.62, 0.3);
  if (G.state === 'ready') drawTextScreen('READY!', tp.x, tp.y, '#ffe600', 27);
  if (G.state === 'gameover') drawTextScreen('GAME  OVER', tp.x, tp.y, '#ff3b30', 27);
  if (G.state === 'paused') drawTextScreen('PAUSED', tp.x, tp.y, '#7fd4ff', 27);
}
function draw(now) {
  if (VIEW === '3d') draw3D(now); else drawFlat(now);
}

/* ---------------- view + tilt controls ---------------- */
var btnView = document.getElementById('btnView'), btnTilt = document.getElementById('btnTilt');
function setView(v) {
  VIEW = v;
  btnView.innerHTML = v === '3d' ? 'VIEW: 3D' : 'VIEW: FLAT';
}
btnView.addEventListener('click', function () {
  Snd.resume();
  setView(VIEW === '3d' ? 'flat' : '3d');
});
function onOrient(e) {
  if (e.gamma == null || e.beta == null) return;
  tilt.on = true;
  var gx = Math.max(-1, Math.min(1, e.gamma / 28));
  var by = Math.max(-1, Math.min(1, (e.beta - 42) / 28));
  tilt.tx = gx * 2.4;
  tilt.ty = by;
}
btnTilt.addEventListener('click', function () {
  Snd.resume();
  if (tilt.listening) return;
  function enable() {
    window.addEventListener('deviceorientation', onOrient);
    tilt.listening = true;
    btnTilt.innerHTML = 'TILT ON';
  }
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function (st) {
      if (st === 'granted') enable(); else btnTilt.innerHTML = 'TILT N/A';
    }).catch(function () { btnTilt.innerHTML = 'TILT N/A'; });
  } else if (window.DeviceOrientationEvent) {
    enable();
  } else {
    btnTilt.innerHTML = 'TILT N/A';
  }
});

/* ---------------- main loop ---------------- */
var lastTs = 0;
function frame() {
  requestAnimationFrame(frame);
  var ts = performance.now();
  var dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  var now = ts / 1000;
  if (G.state === 'playing') update(dt);
  else if (G.state === 'freeze') { G.stateT -= dt; if (G.stateT <= 0) G.state = 'playing'; }
  else if (G.state === 'ready') {
    G.stateT -= dt;
    if (G.stateT <= 0) { G.state = 'playing'; Snd.startSiren(); }
  } else if (G.state === 'dying') {
    G.stateT -= dt; G.deathT += dt;
    if (G.stateT <= 0) {
      G.lives--; updateHud();
      if (G.lives > 0) { G.deaths++; resetActors(); G.state = 'ready'; G.stateT = 1.4; }
      else { saveHigh(); G.state = 'gameover'; G.stateT = 2.4; }
    }
  } else if (G.state === 'clear') {
    G.stateT -= dt; G.flashT += dt;
    if (G.stateT <= 0) { G.level++; resetLevel(); G.state = 'ready'; G.stateT = 1.4; updateHud(); }
  } else if (G.state === 'gameover') {
    G.stateT -= dt;
    if (G.stateT <= 0) {
      G.state = 'title'; G.deaths = 0;
      document.getElementById('title').style.display = 'flex';
      resetLevel(); updateHud();
    }
  }
  G.popups = G.popups.filter(function (p) { return (p.t -= dt) > 0; });
  btnMain.innerHTML = G.state === 'paused' ? '&#9654; RESUME'
    : (G.state === 'title' || G.state === 'gameover') ? '&#9654; START' : '&#10074;&#10074; PAUSE';
  draw(now);
}

/* ---------------- input: keys + swipe + floating joystick ---------------- */
function setWant(d) { if (pac) pac.wantDir = d; }
var KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
               w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
document.addEventListener('keydown', function (e) {
  if (KEYMAP[e.key]) { setWant(KEYMAP[e.key]); Snd.resume(); e.preventDefault(); }
  if (e.key === ' ' || e.key === 'Enter') { btnMain.click(); e.preventDefault(); }
});
var joyEl = document.getElementById('joy'), knobEl = document.getElementById('joyknob');
var joyId = null, joyOX = 0, joyOY = 0, downId = null, downX = 0, downY = 0;
document.addEventListener('pointerdown', function (e) {
  Snd.resume();
  if (e.target.closest && e.target.closest('button')) return;
  downId = e.pointerId; downX = e.clientX; downY = e.clientY;
  if (e.clientX < window.innerWidth * 0.5) {
    joyId = e.pointerId; joyOX = e.clientX; joyOY = e.clientY;
    joyEl.style.display = 'block';
    joyEl.style.left = joyOX + 'px'; joyEl.style.top = joyOY + 'px';
    knobEl.style.transform = 'translate(-50%,-50%)';
  }
}, { passive: true });
document.addEventListener('pointermove', function (e) {
  if (e.pointerId !== joyId) return;
  var dx = e.clientX - joyOX, dy = e.clientY - joyOY;
  var len = Math.sqrt(dx * dx + dy * dy), cl = Math.min(len, 40);
  var nx = len ? dx / len * cl : 0, ny = len ? dy / len * cl : 0;
  knobEl.style.transform = 'translate(calc(-50% + ' + nx + 'px), calc(-50% + ' + ny + 'px))';
  if (len > 16) setWant(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive: true });
function pointerEnd(e) {
  if (e.pointerId === downId) {
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24)
      setWant(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    downId = null;
  }
  if (e.pointerId === joyId) { joyId = null; joyEl.style.display = 'none'; }
}
document.addEventListener('pointerup', pointerEnd);
document.addEventListener('pointercancel', pointerEnd);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (G.state === 'playing') { G.prevState = 'playing'; G.state = 'paused'; }
  } else Snd.resume();
});
document.addEventListener('pointerdown', function () { Snd.resume(); });

btnMain.addEventListener('click', function () {
  Snd.resume();
  if (G.state === 'title' || G.state === 'gameover') startGame();
  else if (G.state === 'playing' || G.state === 'freeze') {
    G.prevState = G.state; G.state = 'paused';
    if (Snd.ctx) Snd.ctx.suspend();
  } else if (G.state === 'paused') {
    G.state = G.prevState || 'playing';
    if (Snd.ctx) Snd.ctx.resume();
  }
});

/* ---------------- boot + debug hooks ---------------- */
resetLevel();
updateHud();
requestAnimationFrame(frame);
window.__pac = {
  start: startGame,
  want: setWant,
  fright: function () {
    G.frightT = levelParams(G.level).fright || 6; G.chain = 0; Snd.setSirenFright(true);
  },
  warp: function (x, y) { pac.x = x; pac.y = y; },
  state: function () {
    return {
      state: G.state, score: G.score, high: G.high, lives: G.lives, level: G.level,
      pelletsLeft: G.pelletsLeft, pelletsEaten: G.pelletsEaten,
      frightT: Math.round(G.frightT * 10) / 10, mode: G.mode, camOn: camOn,
      pac: pac && { x: Math.round(pac.x * 10) / 10, y: Math.round(pac.y * 10) / 10, dir: pac.dir, moving: pac.moving },
      ghosts: ghosts.map(function (g) {
        return { name: g.name, state: g.state, x: Math.round(g.x * 10) / 10, y: Math.round(g.y * 10) / 10 };
      })
    };
  },
  view: function () { return VIEW; },
  setView: setView,
  tilt: function () {
    return { listening: tilt.listening, on: tilt.on, x: Math.round(tilt.x * 100) / 100, tx: tilt.tx };
  },
  setTilt: function (x, y) { tilt.tx = x; tilt.ty = y; },
  layerBuilds: function () { return mazeLayer.builds; }
};
})();
</script>
<script id="moth-game-guard-js">
(function(){
  var lastEnd=0;
  function onUi(t){return t&&t.closest&&t.closest('button,a,input,select,textarea,[data-scroll]');}
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(!onUi(e.target)&&now-lastEnd<=300&&e.cancelable)e.preventDefault();
    lastEnd=now;
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();});
  });
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){
    if(e.target&&e.target.closest&&e.target.closest('[data-scroll]'))return;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();
</script>
