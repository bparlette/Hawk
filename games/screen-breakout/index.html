<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SCREEN BREAKOUT — GTA VI AR Overlay</title>
<link rel="stylesheet" href="ar-scaffold.css">
<style>
  #stage { position: fixed; inset: 0; z-index: 0; }
  #stage #cam, #stage .fallback { position: absolute; }
  #gl { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #gl canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body class="nocam">
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div class="fallback">
    <div class="note">CAMERA OFF — FALLBACK ROOM (grant camera for the real thing)</div>
    <div class="tv"></div><div class="lamp l"></div><div class="lamp r"></div><div class="sofa"></div>
  </div>
  <div id="gl"></div>
</div>
<div id="toast"></div>

<div class="bar top">
  <div class="title">💸 SCREEN BREAKOUT</div>
  <button class="btn small" id="alignBtn">📐 ALIGN TV</button>
</div>
<div class="bar bottom">
  <button class="btn" id="cashBtn">💵<br>CASH</button>
  <button class="btn" id="tireBtn">🛞<br>TIRE</button>
  <button class="btn" id="crashBtn">💥<br>CRASH</button>
  <button class="btn" id="confettiBtn">🎉<br>CONFETTI</button>
</div>

<script src="ar-scaffold.js"></script>
<script type="module" src="app.js"></script>

<style id="universal-offsets">#ci-root.ci-tl{top:60px!important}#ar-mark-root{bottom:74px!important}</style>
<script src="mark-button.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { return window.AR.startCamera(v); }
  });
</script>
<script src="clean-view.js"></script>
<script>
/* ---- clean view + pinch zoom (owner feedback fix 2026-11-16) ---- */
CleanView.init({});
</script>
</body>
</html>
