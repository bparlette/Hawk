<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COUCH COMPANION — GTA VI AR Overlay</title>
<link rel="stylesheet" href="ar-scaffold.css">
<style>
  #gl { position: fixed; inset: 0; z-index: 30; }
  #gl canvas { display: block; }
  #dim { position: fixed; inset: 0; z-index: 25; background: #04040c; opacity: 0; pointer-events: none; transition: opacity .8s; }
  .zzz {
    position: fixed; z-index: 60; font-size: 30px; pointer-events: none; opacity: 0;
    transform: translate(-50%,-50%); transition: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  #loadmsg {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); z-index: 800;
    color: #fff; font-weight: 800; font-size: 16px; text-shadow: 0 2px 10px #000; text-align: center;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body class="nocam">
<video id="cam" autoplay playsinline muted></video>
<div class="fallback">
  <div class="note">CAMERA OFF — FALLBACK ROOM (grant camera for the real thing)</div>
  <div class="tv"></div><div class="lamp l"></div><div class="lamp r"></div><div class="sofa"></div>
</div>
<div id="dim"></div>
<div id="gl"></div>
<div class="zzz" id="z1">💤</div><div class="zzz" id="z2">💤</div>
<div id="loadmsg">🤖 Waking up your companion…</div>
<div id="toast"></div>

<div class="bar top">
  <div class="title">🤖 COUCH COMPANION</div>
  <button class="btn small" id="micBtn">🎙️ MIC</button>
  <button class="btn small" id="alignBtn">📐 ALIGN TV</button>
</div>
<div class="bar bottom">
  <button class="btn" id="placeBtn">📍<br>PLACE</button>
  <button class="btn" id="duckBtn">🦆<br>DUCK!</button>
  <button class="btn" id="cheerBtn">🎉<br>CHEER</button>
  <button class="btn" id="scaredBtn">😱<br>SCARED</button>
  <button class="btn" id="sleepBtn">😴<br>SLEEP</button>
</div>

<script src="ar-scaffold.js"></script>
<script type="module" src="app.js"></script>

<style id="universal-offsets">#ci-root.ci-tl{top:60px!important}#ar-mark-root{bottom:74px!important}</style>
<script src="mark-button.js"></script>
<script src="clip-import.js"></script>
<script>
/* ---- universal kit wiring (integration pass 2026-11-16) ---- */
window.ArMark = window.MarkButton;
ClipImport.attach({
    position: 'tl',
    videoEl: document.getElementById('cam'),
    startCamera: function (v) { return window.AR.startCamera(v); }
  });
</script>
<script src="clean-view.js"></script>
<script>
/* ---- clean view + pinch zoom (owner feedback fix 2026-11-16) ---- */
CleanView.init({ pinSelector: '#placeBtn.on' });
</script>
</body>
</html>
